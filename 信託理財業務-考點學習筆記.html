rk>信託資金及相關費用</mark>約定扣(入)款帳戶不開放變更。4.臨櫃之交易，依核對身分程序不同，分別辦理如下：(1)僅得憑原留印鑑辦理：已留存印鑑之iLEO數位帳戶得作為本人金如意(68)帳戶、理財(88)帳戶之<mark>信託資金及相關費用</mark>約定扣(入)款帳戶以「委託人基本<mark>資料內容變更登錄</mark>(<mark>T300</mark>)」辦理變更，應加徵「<mark>委託代繳信託資金及相關費用同意書</mark>」，並蓋妥該數位帳戶之原留印鑑後辦理。"},"x":"依講義〈理財業務標準作業流程－信託商品〉第5頁：「4.臨櫃之交易，依核對身分程序不同，分別辦理如下：(1)僅得憑原留印鑑辦理：已留存印鑑之iLEO數位帳戶得作為本人金如意(68)帳戶、理財(88)帳戶之信託資金及相關費用約定扣(入)款帳戶以「委託人基本資料內容變更登錄(T300)」辦理變更，應加徵「委託代繳信託資金及相關費用同意書」，並蓋妥該數位帳戶之原留印鑑後辦理。」","t":"ask"},{"id":"114-2","y":114,"n":2,"m":2,"q":"有關本行私募境外基金之銷售及作業規範，下列敘述何者錯誤？","o":["僅開放臨櫃下單","限 DBU 境內高資產客戶申購","法人高資產客戶除蓋信託帳戶原留印鑑外，須加徵「授權辦理交易之人」親簽","私募基金風險預告書應透過信託業務影像管理系統掃描存檔"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"十六、營業單位受理法人<mark>高資產客戶申購</mark>或圈存銷售對象「僅限專業投資人或<mark>高資產客戶</mark>」始得投資之信託商品(如私募基金)時，比照上述第十五點法人專業投資人之交易規範，申請書兼登錄單須加徵「授權辦理交易之人」親簽，於「核章」欄位旁加蓋「核對親簽」章戳，由受理人員確認親簽之人與本行IMVP系統「授權辦理交易之人」之建檔資料相符並辦理核簽後，再交由核章人員核章。"},"t":"neg"},{"id":"114-3","y":114,"n":3,"m":1,"q":"下列哪些情形不受理申請基金「單筆轉入定期(不)定額」作業？<br><span class=\"it\">A.</span> 有涉及短線交易單位數之單筆投資標的<br><span class=\"it\">B.</span> 有申購在途之單筆投資標的，執行部分單位數轉換<br><span class=\"it\">C.</span> 轉入之定期(不)定額標的已約定全部贖回/轉換","o":["ABC","AB","BC","AC"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"2.一般<mark>單筆投資</mark>轉換為<mark>定期(不)定額</mark>投資：欲轉入<mark>投資標的</mark>須已申請定期定額/定期不定額投資約定。（1）全部轉換：原<mark>投資標的</mark>如有在途投資尚未回報時，應俟回報確認後再全部轉換。（2）部分轉換。◎下列一般<mark>單筆投資</mark>不受理換為<mark>定期(不)定額</mark>投資：（1）欲轉出之單位數<mark>涉及短線交易</mark>。（2）已約定為「金速配投資法」之「核心基金」。（3）手續費後收型基金（4）國內指數股票型基金。（5）私募基金"},"t":"combo"},{"id":"114-4","y":114,"n":4,"m":1,"q":"本行自 2025/8/25 起新增上架銷售國內投信發行之「TISA 級別基金」，有關 TISA基金之作業規範，下列敘述何者錯誤？","o":["開立 TISA 帳戶對象限自然人，惟不受理大陸地區人民及具美國籍人士","TISA 帳戶得新開立「iLEO(57)數位帳戶」","同一 ID 限開一個 TISA 帳戶，且該帳戶僅得受理 TISA 基金申購及贖回，不受理一般基金交易","投資人需簽署「臺灣個人投資儲蓄帳戶(TISA)約定書」"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"四、申請方式:限<mark>新開立「</mark>金如意(68)綜合管理帳戶」或「無信託餘額或約定事項之已開立金如意(68)綜合管理帳戶」，同一ID限開一戶，本金如意(68)帳戶僅得受理<mark>TISA</mark>基金申購及贖回，不受理一般基金交易(其餘存款等帳戶功能不受影響)。"},"t":"neg"},{"id":"114-5","y":114,"n":5,"m":4,"q":"有關本行「珍愛傳富信託」業務所提供之信託服務，下列敘述何者錯誤？","o":["兼具投資收益及資產傳承功能","信託期間之境外基金配息屬於委託人之海外所得","屬本金自益、孳息他益金錢型信託","委託人可提前終止信託契約"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"貳拾捌、金速配投資法－<mark>基金配息</mark>移轉投資信託商品業務一、業務性質係指委託人以其單筆投資之國內/<mark>境外基金</mark>(即孳息商品，下稱核心基金)，約定每月配息金額自動移轉投資信託商品(下稱衛星基金)之業務(下稱金速配投資)。"},"lo":2,"t":"neg"},{"id":"114-6","y":114,"n":6,"m":5,"q":"有關書面辦理之「高齡客戶 KYC 關懷提問表」(下稱提問表)，下列敘述何者正確？<br><span class=\"it\">A.</span> 應由客戶親填親簽，行員不得代填<br><span class=\"it\">B.</span> 符合 2 項(含)以上弱點指標，應婉拒客戶繼續辦理 KYC 作業<br><span class=\"it\">C.</span> 婉拒辦理後，逾七日始得以書面辦理重新評估<br><span class=\"it\">D.</span> 評估若無弱點，提問表作為 KYC 客戶資料表之附件，無需辦理建檔","o":["AB","AD","CD","BC"],"a":3,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"一、<mark>書面辦理</mark>：(一)客戶親臨營業單位或本行人員外訪客戶時，<mark>由客戶親填</mark>「第一銀行<mark>客戶資料表」(下稱</mark>資料表)，若客戶年齡達64歲<mark>(含)以上</mark>，於客戶填寫資料表前由KYC評估人員向客戶本人詢問或觀察客戶後填寫<mark>「高齡客戶KYC關懷提問表</mark>-臨櫃版」，據以評估客戶弱點事項及是否接受<mark>客戶繼續辦理KYC作業</mark>，並由鍵檔人員於智慧行銷全通路平台(下稱IMVP)辦理鍵檔作業。"},"t":"combo"},{"id":"114-7","y":114,"n":7,"m":6,"q":"為落實關懷客戶理財商品投資損益及適配性，本行辦理之定期檢視作業，下列敘述何者錯誤？","o":["符合辦理定期檢視客戶將於智慧行銷全通路平台(IMVP)產出名單","檢視對象為本行財富管理客戶，且排除專業投資人","區分未滿 65 歲客戶及 65歲(含)以上客戶，設有不同檢視條件","理財業務人員應於指定之期限內聯繫客戶並完成檢視作業，逾期系統無法作業"],"a":1,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第一節 投資損益及適配性檢視與重要客戶拜訪","t":"二、定期檢視作業應注意事項(一)符合辦理定期檢視客戶將於智慧行銷全通路平台(IMVP)產出名單，理財業務人員應於指定之期限內聯繫客戶並完成檢視作業，逾期系統無法作業。"},"t":"neg"},{"id":"114-8","y":114,"n":8,"m":5,"q":"有關本行智能理財服務，下列敘述何者錯誤？","o":["ETF 投組投資期間最少 3 年","ETF 投組定期定額最低為新臺幣 3,000 元或美元 100 元","ETF 投組不適用再平衡機制","ETF 投組配發之現金股利，由本行逕行再投資於該投組原配息標的"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"二、智能理財基金投組內個別標的產品代號末2碼設定為「90」。三、智能理財投組贖回或終止時，將俟投資組合內所有基金之贖回款入帳並扣除相關費用後，再撥入客戶約定之贖回/收益分配帳號，本行於贖回款保管期間不計付利息；如為投組再平衡調整，將先贖回投組內應調降比例之標的，並於收到前揭所有贖回標的之贖回款項後再申購需調高比例之標的。"},"t":"neg"},{"id":"114-9","y":114,"n":9,"m":8,"q":"有關「行動投保應遵循事項」，下列敘述何者正確？","o":["進入保險業務系統取得有條碼之「第一商業銀行保險代理業務暨行動投保確認同意書」，條碼可重覆使用","限以授權被保險人帳戶繳交保險費","行動投保應檢附之正本文件(如確認同意書、授權書…等)須以保服案件進件程序，發送保險代理人處，交付文件清單免填","完成要保文件並上傳(T 日)，應於次二營業日前(T+2)完成主管放行"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"辦透過「信託業務影像管理系統」掃描存檔備查；正本依「掃描清單報表」之案件號順序整理，按日期排序歸檔，置於金庫室外監視錄影設備攝錄範圍內專用之上鎖重要文件櫃內永久保存，「信託業務總約定書」【信014E】及「約定條款<mark>確認同意書</mark>」（客戶留存聯）或「各類存款開戶暨往來業務項目申請書」（客戶收執聯）交由客戶攜回。"},"x":"行動投保應檢附之正本文件須以保服案件進件程序發送保險公司。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1,"t":"ask"},{"id":"114-10","y":114,"n":10,"m":8,"q":"如人身保險案件之保費來源，係為要保人/被保險人/實際繳交保費之利害關係人以下列何種方式購買保險商品，應予婉拒受理？<br><span class=\"it\">A.</span> 定存解約利息免打折<br><span class=\"it\">B.</span> 保險單解約<br><span class=\"it\">C.</span> 保險單借款<br><span class=\"it\">D.</span> 基金贖回","o":["ABC","AB","ACD","AC"],"a":3,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"202512版（1）政府公債、國庫券、金融債券、公司債券、國內基金、上市、櫃之公司股票。（2）存放金融機構之存款。（3）給付以委託人<mark>為要保人</mark>所<mark>購買保險</mark>之保險費。（4）其他經主管機關核准，委託人得投資之標的。"},"x":"應婉拒：<b>定存解約利息免打折</b>、保單借款等（AC）。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1,"t":"combo"},{"id":"114-11","y":114,"n":11,"m":9,"q":"有關本行信用卡帳單分期業務，下列敘述何者錯誤？","o":["帳單分期可分 3 期、6 期或 12 期攤還","雙幣卡之國外交易帳款不能申請帳單分期","帳單分期申請金額最低為新臺幣 3,000 元","最近一期繳款記錄為全額繳款並無逾期者始能申請"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"三、金額限制：每筆最低投資金額<mark>為新臺幣</mark>100元(含)起，約定時以新臺幣「100元」為累加單位，最高以新臺幣100萬元為限制。。"},"x":"帳單分期最低申請金額並非 3,000 元（選項敘述錯誤）。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1,"t":"neg"},{"id":"114-12","y":114,"n":12,"m":9,"q":"有關本行行動信用卡作業規範，下列敘述何者錯誤？","o":["Apple Pay 實體環境之交易僅能透過感應方式完成","行動信用卡為實體信用卡附加功能，僅接受既有卡友申辦","行動信用卡之交易方式與感應式信用卡相同，交易金額 3 千元以內，同一般感應卡方式得免簽名","Apple Pay 行動信用卡卡號透過國際組織系統轉換，與實體卡號相同"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"6.外幣約定入/扣款帳號：以委託人本人在本行開立之「多幣別」外匯存款帳戶為限。7.本行<mark>信用卡卡號</mark>：以委託人本人於本行申請之信用卡為限。"},"x 30日(含)內到期或KYC已逾期，須請客戶重新辦理KYC評估作業(以端末系統交易代號9701查詢「KYC有效日期」)。"},"x":"同 112 年題：「限核准後三個月內啟用，逾期須重新申請」敘述錯誤。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1,"t":"neg"},{"id":"114-21","y":114,"n":21,"m":2,"q":"本行目前上架銷售之私募基金，下列何者為「未具證券投資信託基金性質」之境外基金？","o":["MLoan 連結基金-NP 美元月配","百達-美元短期貨幣市場","百達總報酬-Atlas 泰坦","法巴旗艦貨幣市場基金"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"十一、贖回作業：(一)「具證券投資信託性質」之私募基金以T400/T401交易執行贖回作業；「未具證券投資信託性質」之私募基金以T404交易執行贖回作業。"},"lo":2,"t":"ask"},{"id":"114-22","y":114,"n":22,"m":5,"q":"營業單位臨櫃受理高齡客戶申購或轉換匯利率波動大、天期較長或複雜性高之信託商品時，須以錄音方式保留紀錄，下列何者非屬控管商品？","o":["南非幣計價國內/境外基金","南非幣計價國外債","美金計價國內/境外基金","境外結構型商品"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"二十、依「銀行業公平對待高齡客戶自律規範」第十四條規定，銀行於銷售外幣計價之信託商品予高齡客戶時，對於匯利率波動度大、天期較長或複雜性高等不易理解內容與架構之商品時，應建立控管機制。營業單位於受理高齡客戶申購/轉換上述商品時，須以錄音方式保留紀錄，如透過數位通路辦理時，系統將新增提示商品相關風險告知事項。"},"t":"neg"},{"id":"114-23","y":114,"n":23,"m":10,"q":"下列何者非屬疑似洗錢或資恐之信託交易態樣？","o":["客戶設立信託帳戶能提出充分的理由或動機","交易有關對象為金管會函轉外國政府所提供之恐怖分子或團體者","客戶經常代理他人或特定信託帳戶經常由第三人存入現金達特定金額以上者","客戶突有達特定金額以上資金信託者"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(一)<mark>客戶設立信託帳戶</mark>無法提出令人信服的理由、目的或動機。(二)客戶對<mark>信託帳戶</mark>的信託結構或交易使用複雜的安排致對其信託目的與用意產生疑慮。◎異常交易活動/行為─交易行為類"},"t":"neg"},{"id":"114-24","y":114,"n":24,"m":10,"q":"有關營業單位受理客戶以「免填交易申請書方式」辦理信託交易，下列敘述何者正確？<br><span class=\"it\">A.</span> 「免填申請書交易序號」有效期限為二個營業日<br><span class=\"it\">B.</span> 「核章」人員係由主管授權得查詢印鑑暨影像管理系統之人員擔任，並得兼為操作員<br><span class=\"it\">C.</span> 由「操作員」依客戶口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙<br><span class=\"it\">D.</span> 主管須於認證欄之「免填申請書交易序號」前首加蓋私章","o":["ABCD","BCD","ABD","BD"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)受理委託人<mark>免填交易申請書</mark>作業：係指<mark>營業單位</mark>「受理人員」依委託人<mark>口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙</mark>，「受理人員」覆誦委託人<mark>申請內容，</mark>再請委託人確認<mark>申請內容</mark>無誤後蓋妥信託帳戶留存印鑑，交<mark>「核章」人員</mark>核章及<mark>「操作員」</mark>辦理交易認證登錄之作業。"},"t":"combo"},{"id":"114-25","y":114,"n":25,"m":10,"q":"有關信託帳戶之轉籍作業，下列敘述何者正確？","o":["EF、EK、EH 及 EG 系列之境外 ETF 及國外股票不得辦理「全部/部分投資標的轉籍」","線上開立之信託(889)帳戶得辦理「整戶批次轉籍」及「全部/部分投資標的轉籍」","如投資標的尚有在途未回報資料者，仍可辦理「全部/部分投資標的轉籍」","帳戶有一般單筆之預約登錄或預約贖回投資標的者，可辦理整戶批次轉籍作業"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.理財存摺（88）帳戶<mark>投資標的轉</mark>入其他理財存摺（88）帳戶2.理財存摺（88）帳戶<mark>投資標的轉</mark>入金如意（68）綜合管理帳戶(註2)申請書用紙帳戶轉籍申請書兼登錄單信託轉籍申請書兼登錄單【信051】交易代號移出行：帳戶移出設定交易(953T)移入行：帳戶移入夜間批次設定交易(983T)移出行：委託人資料內容變更登錄(T300)移入行：信託基金轉籍登錄(T830)註1：金如意（68）綜合管理帳戶之整戶批次轉籍請參閱營運業務處2012/07/11營管字第00306號函辦理。註2：金如意（68）綜合管理帳戶不得單獨辦理信託商品之<mark>全部/部分投資標的轉籍</mark>。註3：線上開立之信託(889)帳戶<mark>不得辦理「</mark>整戶批次轉籍」及<mark>「全部/部分投資標的轉籍」</mark>。註4：<mark>EF、EK、EH及EG系列之境外ETF及國外股票不得辦理「全部/部分投資標的轉籍」</mark>。"},"t":"ask"},{"id":"114-26","y":114,"n":26,"m":2,"q":"關於「私募基金」之敘述，下列何者為非？","o":["向特定投資人以非公開方式募集資金","不得為一般性廣告及公開勸誘之行為","境內設有銷售人數限制","流動性或透明度較一般境外基金為佳"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(一)不得就私募基金為一般性廣告及公開勸誘之行為。(二)營業單位受理法人高資產客戶申購或圈存銷售對象「僅限專業投資人或高資產客戶」始得投資之信託商品(如私募基金)時，比照法人專業投資人之交易規範，申請書兼登錄單須加徵「授權辦理交易之人」親簽，於「核章」欄位旁加蓋「核對親簽」章戳，由受理人員確認親簽之人與本行IMVP系統「授權辦理交易之人」之建檔資料相符並辦理核簽後，再交由核章人員核章。"},"lo":2,"t":"neg"},{"id":"114-27","y":114,"n":27,"m":4,"q":"辦理有價證券信託-本金自益、孳息他益業務，依所得稅法第三條之四規定，信託存續期間所獲之股票股利及現金股利併入","o":["委託人","受託人","受益人","信託監察人 的所得課稅"],"a":2,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第三節 信託處作業程序","t":"202501版3-13第三章<mark>有價證券信託</mark>(二)交付證券集中保管事業保管之<mark>有價證券</mark>受託人自信託契約簽訂日起，至<mark>信託存續期間</mark>末日止，將各年度信託<mark>有價證券</mark>孳息分配於受益人。受託人將集保公司撥付<mark>之股票股利及現金股利</mark>分別轉<mark>入受益人</mark>之股票集保帳戶及其指定之信託利益分配帳戶。"},"t":"fill"},{"id":"114-28","y":114,"n":28,"m":3,"q":"本行以信託方式辦理「預售屋履約擔保機制」之價金信託-可動用，應就信託專戶資金作專款專用，下列何者非專款專用範圍？","o":["支付必要且確實已發生之銷售費用","辦理信託契約約定之有關工程款交付","繳納各項稅費等工程所需費用","以上皆是專款專用範圍"],"a":0,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第一節 通則","t":"三、解約手續費依雙方簽定信託契約書之約定方式計收。四、其他費用因信託資金之運用與管理，所生之必要及或有稅負（包含但不限於信託處理費、股利所得稅、贈與稅、全民健康保險補充保險費等）與處理信託事務所生之費用或負"},"lo":2,"t":"neg"},{"id":"114-29","y":114,"n":29,"m":3,"q":"本行買賣價金信託業務，可協助保障買賣雙方權益，除常見的不動產買賣外，亦可協助其他類型之案件買賣，有關本行買賣價金信託業務，下列敘述何者為非？","o":["土地法第 34 條之 1 成立之買賣案件因風險較高，本行不承作","可承作公司出資額買賣之案件","由本行擔任公正第三方保管買賣價金及管控金流，以提升財產交易安全性","掌握買賣交易金流及後續業務推廣契機"],"a":0,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"壹、通則一、業務性質:「不動產買賣價金信託業務」係保障不動產交易之買賣雙方交易安全，由買賣雙方與本行簽訂信託契約，不動產(含土地及成屋)之買方(委託人)將購買交易標的之價金，依買賣契約約定，分期存入信託專戶；賣方(信託關係人)依買賣契約約定，配合買方分階段完成移轉程序。受託人依買賣雙方之指示，為特定目的管理該交易價金。"},"t":"neg"},{"id":"114-30","y":114,"n":30,"m":2,"q":"本行 65 歲(含)以上之高資產客戶，於臨櫃申購下列何項商品時，不須進行電話錄音？","o":["保本型連結利率之境外結構型商品","南非幣計價之國外債券","風險屬性為 RR4，剩餘年期為 20 年之國外美元次順位債券","不保本型連結股權之境外結構型商品"],"a":2,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"(二)錄音作業：1.65歲(含)以上高齡客戶(含一般投資人、自然人專業投資人及高資產客戶)預約圈存申購下列商品須電話錄音。(1)南非幣計價之國外債(2)國外債到期日為<mark>剩餘年期</mark>25年(含)以上(3)「<mark>風險屬性</mark>」為RR5之國外債"},"t":"ask"},{"id":"114-31","y":114,"n":31,"m":4,"q":"員工福利信託為金管會頒布「信託業務發展策略藍圖」之評鑑項目，有關員工福利信託之敘述，下列何者錯誤？","o":["未上市櫃公司但其集團內具控制或從屬關係之母或子公司屬上市或上櫃公司可承作員工持股信託","員工儲蓄信託業務信託資金的投資標的包括國外 ETF","員工股權獎酬結合信託亦屬於員工福利信託的一種型態","限制員工權利新股得附有服務條件或績效條件等既得條件"],"a":1,"ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託業務","t":"壹、通則員工福利信託(包含<mark>員工儲蓄</mark>/持股信託、限制員工權利新股信託)係透過信託機制協助企業/學校規劃員工福利事宜，為使員工福利<mark>信託業務</mark>順利推展，本項業務以信託處為主辦單位，各營業單位為協辦單位。"},"t":"neg"},{"id":"114-32","y":114,"n":32,"m":4,"q":"有關營業單位自行辦理「預開型退休安養信託業務」，下列敘述何者錯誤？","o":["客戶不得申請本行修改信託契約內容","受理本業務開戶時，一律採有摺方式辦理","信託期間自簽約日起，為期三年","委託人須年滿 55 歲以上"],"a":1,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"（四）為加速營業單位推廣退休安養信託業務及鼓勵高齡者預先簽訂安養信託，推出「預開型退休安養信託業務」由信託處授權營業單位自行辦理信託契約簽約、信託專戶開立、信託資金收付及信託契約中途/到期解約等相關事宜。為使營業單位瞭解相關作業規範及流程，另訂立營業單位辦理「預開型退休安養信託業務」應注意事項。"},"t":"neg"},{"id":"114-33","y":114,"n":33,"m":10,"q":"本行受理國內及境外基金投資時，須向委託人事先徵取「推介同意暨聲明書」；惟對於特定族群之非專業投資人且非高資產客戶不得進行推介，下列何者屬於特定族群？<br><span class=\"it\">A.</span> 年齡 65 歲(含)以上<br><span class=\"it\">B.</span> 教育程度國中(含)畢業以下<br><span class=\"it\">C.</span> 有全民健康保險重大傷病證明者","o":["BC","AB","AC","ABC"],"a":0,"ci":{"b":"講義：理財業務標準作業流程－信託商品","c":"第26頁","s":"","t":"適用對象彙整：註:1<mark>.教育程度國中(含)畢業以下</mark>2<mark>.有全民健康保險重大傷病證明者</mark>信託商品推介之控管對已簽訂信託契約之客戶，得就特定投資標的<mark>事先徵取</mark>委託人之同意書<mark>進行推介</mark>；且委託人得隨時終止該推介行為，並於書面指示送達信託業後生效；惟對<mark>特定族群之非專業投資人且非高資產客戶不得進行推介</mark>。252025/05/23信劃字第000024號"},"lx":{"b":"講義：理財業務標準作業流程－信託商品","c":"第26頁","v":41,"t":"適用對象彙整：註:1.<mark>教育程度國中</mark>(含)<mark>畢業以下</mark>2.<mark>有全民健康保險重大傷病證明者</mark>信託商品推介之控管對已簽訂信託契約之客戶，得就特定投資標的<mark>事先徵取</mark>委託人之同意書<mark>進行推介</mark>；惟對<mark>特定族群之非專業投資人且非高資產客戶不得進行推介</mark>。"},"x":"依講義〈理財業務標準作業流程－信託商品〉第26頁：「適用對象彙整：註:1.教育程度國中(含)畢業以下2.有全民健康保險重大傷病證明者信託商品推介之控管對已簽訂信託契約之客戶，得就特定投資標的事先徵取委託人之同意書進行推介；」「惟對特定族群之非專業投資人且非高資產客戶不得進行推介。」","t":"combo"},{"id":"114-34","y":114,"n":34,"m":10,"q":"營業單位受理客戶臨櫃辦理信託交易，信託申請書兼登錄單之客戶收執聯，應由何人交付予客戶？","o":["受理人員","操作員","受理人員及操作員以外之第三人，或由副主管交付","無須交付"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"報酬揭露文件第2聯由<mark>受理人員及操作員以外之第三人，或由副主管交</mark>委託人收執，日終結帳作業比照「貳拾、營業單位日終結帳」之規定辦理。"},"lx":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第8頁","v":60,"t":"<mark>客戶臨櫃</mark>申辦<mark>信託交易</mark>時<mark>信託申請書兼登錄單之客戶收執聯應</mark>加蓋單位腰形章，再由<mark>受理人員及操作員以外之第三人或由副主管</mark>，<mark>交付予客戶</mark>。"},"x":"依講義〈理財業務標準作業流程(2026.04)〉第8頁：「客戶臨櫃申辦信託交易時信託申請書兼登錄單之客戶收執聯應加蓋單位腰形章，再由受理人員及操作員以外之第三人或由副主管，交付予客戶。」","t":"ask"},{"id":"114-35","y":114,"n":35,"m":3,"q":"預售屋履約擔保機制中之不動產開發信託，因專款專用用途過於廣泛，常發生建案工程未開工或興建初期買方所繳之預售價金即已用罊之情形，下列何者非本行「不動產開發信託」下買方所繳「預售價金信託專戶」可動用範圍？","o":["建築師設計費","信託管理費","工程款","合建保證金"],"a":3,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"202501版【附錄3】第一商業銀行不動產買賣<mark>價金信託</mark>簽約證明暨重要事項說明書（賣方專用）壹、台端業於年月日與買方共同簽訂不動產買賣<mark>價金信託</mark>契約書（下稱信託契約），俟本行用印完成及首筆價金存入<mark>信託專戶</mark>後正式生效。"},"lo":2,"t":"neg"},{"id":"114-36","y":114,"n":36,"m":5,"q":"有關未成年人辦理充分瞭解客戶(KYC)作業規範，下列敘述何者正確？<br><span class=\"it\">A.</span> 「本人確認收執資料表影本壹份」欄位由未成年人自行簽收<br><span class=\"it\">B.</span> 若為未滿 7 歲未成年人，投資經驗之答案限為「無任何投資經驗」及「無經驗」<br><span class=\"it\">C.</span> 資料表內容應依據未成年人本身之資料填答<br><span class=\"it\">D.</span> 若法定代理人之一無法親簽，應出具法人授權書","o":["AB","BC","AC","BD"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"1.客戶為<mark>未成年人</mark>(1)填寫自然人<mark>資料表內容</mark>A.限制行為能力人(滿7歲以上之<mark>未成年人</mark>)：自然人<mark>資料表內容應依</mark>其<mark>本身之資料</mark>親自填答，若限制行為能力人無法獨立填寫自然人資料表時，得由<mark>法定代理人</mark>依限制行為能力<mark>人本身之資料</mark>協助其完成填答。B.無行為能力人(<mark>未滿7歲未成年人</mark>)：自然人<mark>資料表內容</mark>由<mark>法定代理人</mark>依無行為能力<mark>人本身之資料</mark>代為填答。另<mark>投資經驗之答案限為「無任何投資經驗」及「無經驗」</mark>，並控管投資屬性不得為最高風險等級「積極型」。(2)「客戶簽名」欄位：A.限制行為能力人：<mark>由未成年人本</mark>人親簽。B.無行為能力人：由<mark>法定代理人</mark>代為簽名，且並於緊接處註明「○○○代（簽）」。(3)自然人資料表<mark>法定代理人</mark>欄位，父母雙方皆應親簽，若其中之一（例如父親或母親）<mark>無法親簽</mark>時<mark>，應出具</mark>「<mark>法定代理人授權書(KYC</mark>作業用)」(如"},"t":"combo"},{"id":"114-37","y":114,"n":37,"m":6,"q":"A公司申請成為法人專業投資人，若負責人無法親自辦理，得出具","o":["專業投資人身分變更申請書","法定代理人同意書","「授權辦理交易之人」約定書","法人授權書 由被授權人代為填寫及簽名"],"a":3,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第三節 法人(含境內及境外)充分瞭解客戶(KYC)作業程序","t":"(四)若負責人無法親填親簽法人資料表，得出具「<mark>法人授權書</mark>」(如附表2-4，KYC作業專用英文版本如附表2-5)<mark>由被授權人代為填寫及簽名</mark>。"},"lx":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第33頁","v":41,"t":"•倘<mark>負責人無法</mark>到場簽約或親填親簽文件，得出具「<mark>法人授權書</mark>(KYC/<mark>專業投資人</mark>/高資產客戶作業專用)」，<mark>由被授權人代為填寫及簽</mark>署相關申請文件。"},"x":"依講義〈理財業務標準作業流程(2026.04)〉第33頁：「倘負責人無法到場簽約或親填親簽文件，得出具「法人授權書(KYC/專業投資人/高資產客戶作業專用)」，由被授權人代為填寫及簽署相關申請文件。」","t":"fill"},{"id":"114-38","y":114,"n":38,"m":7,"q":"理財業務人員使用營業單位公用電腦之限制，下列敘述何者錯誤？","o":["限登入本人網路銀行辦理業務","不得代客戶(含親屬)操作營業單位公用電腦","理財業務人員不得協助客戶使用公用電腦辦理充分瞭解客戶(KYC)作業","若需理財業務人員協助客戶處理操作問題時，應有另一名理財業務人員在場，以落實內部控制"],"a":3,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"一、限登入本人網路銀行辦理業務，不得代客戶(含親屬)操作營業單位公用電腦。二、<mark>理財業務人員</mark>不得<mark>協助客戶</mark>使用公用電腦辦理充分瞭解客戶(KYC)作業，其他網路銀行交易<mark>若需理財業務人員</mark>或個金(理財)副理<mark>協助客戶處理操作問題時，應有另一名</mark>非<mark>理財業務人員</mark>之行<mark>員在場，以落實內部控制</mark>。"},"t":"neg"},{"id":"114-39","y":114,"n":39,"m":7,"q":"理財業務人員從事行外收送件服務時，不得對客戶收送哪些項目？<br><span 境外基金。"},"x":"附卡持卡人僅就附卡應付帳款負責，<b>不負</b>正卡帳款清償責任；正卡須就附卡帳款負責。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1,"t":"neg"},{"id":"114-59","y":114,"n":59,"m":9,"q":"有關本行信用卡消費分期業務，下列敘述何者錯誤？","o":["單筆最低分期本金為新臺幣 3,000 元","僅限正卡持卡人申請，惟正、附卡之消費均可申請","預借現金得申請本項業務","申請方式得以網路或電話申請"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)企業戶優惠：營業單位招攬優良企業戶之員工整批申請定期定額投資國內/境外基金，得專案申請本處適用「企業戶優惠代碼」之手續費折扣優惠，辦理本項作業應依「營業單位申請客戶適用『信託業務申購手續費優惠代碼』作業應注意事項」（如附錄12）之規定辦理。"},"x":"<b>預借現金不得</b>申請消費分期。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1,"t":"neg"},{"id":"114-60","y":114,"n":60,"m":9,"q":"有關本行信用卡紅利積點，下列敘述何者正確？","o":["正、附卡之紅利積點分開計算","本行紅利積點永久有效","繳納信用卡年費，每新臺幣 15 元可累積 1 點","悠遊卡自動加值金不予計算紅利積點"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"五、投資金額限制每月以信用卡扣款投資國內外基金之限額，以不超過信用卡原額度之50%為限且最高不得逾新臺幣100萬元(不含手續費，正附卡合併計算)。"},"x":"悠遊卡自動加值金<b>不予計算</b>紅利積點。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1,"t":"ask"}],"sq":[{"id":"S1-1","m":1,"q":"委託人以新臺幣投資境外基金（科目 01）一般單筆，每次最低投資金額（不含手續費）為（　）。","o":["1 萬元","3 萬元","5 萬元","10 萬元"],"a":1,"x":"境外基金（臺幣投資）每次最低 3 萬元；iLEO App 最低 1,000 元、百元奇基 100 元。","t":"fill","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(1)境外基金(臺幣投資)：委託人投資境外基金或國外有價證券，以新臺幣作為信託資金之收付幣別，再透過匯率折算為基金計價幣別，<mark>每次最低投資金額(不含手續費)為新臺幣3萬元</mark>(iLEOApp最低為新臺幣1,000元，iLEO百元奇基最低為新臺幣100元)；"}},{"id":"S1-2","m":1,"q":"下列哪些情況，系統<b>不</b>執行自動停利／停損贖回？ A.停利停損率設為 0 B.有在途未回報單位數 C.無原始投資金額 D.定期定額扣款成功合計 13 次","o":["ABC","ABCD","AB","BCD"],"a":0,"x":"扣款成功合計須超過 12 次（第 13 次以上）始執行。","t":"combo","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(五)下列情況系統將不執行自動停利/停損之贖回：1.自動停利/停損率設為02.有在途未回報單位數3.無原始投資金額4.<mark>定期(不)定額各扣款日期之扣款成功次數合計未超過12次</mark>二、通知停利(損)率(含一般單筆/定期(不)定額投資)通知停利/停損率機制係指委託人設定單一投資標的之「通知停利/停損率」，系統每日計算投資標的報酬率(含現金配息)，如達到委託人設定之通知停利/停損率時，系統將於次一銀行營業日以LINE或電子郵件或手機簡訊依序擇一通知委託人，但不予自動執行贖回：(一)通知停利(損)率的計算所適用之淨值係依受託人收到基金公司的最近公告淨值為準，「境外基金(臺幣信託)"}},{"id":"S1-3","m":1,"q":"有關基金定期（不）定額扣款，下列敘述何者錯誤？","o":["自首次扣款失敗日起連續失敗 第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"五、買方信託資金之交付(即買賣價金存入信託專戶)信託契約簽訂暨信託專戶開立完成後，買方始可將買賣價金<mark>依信託契約第四條第一項所示之信託資金繳款編號(即銷帳百分百虛擬帳號)存入信託專戶</mark>、戶名為「第一商業銀行受託信託財產專戶」。"}},{"id":"S3-3","m":3,"q":"本行以信託方式辦理預售屋履約擔保之「價金信託－可動用」，下列何者<b>非</b>專款專用範圍？","o":["工程款交付","工程所需稅費","現金及銀行存款之運用","必要且已發生之銷售費用"],"a":3,"x":"銷售費用不屬專款專用範圍（官方答案）。","lo":1,"t":"neg"},{"id":"S3-4","m":3,"q":"有關不動產買賣價金信託管理費之最低收費，下列敘述何者錯誤？","o":["500 萬元（不含）以下，最低收費 3,000 元","500 萬元（含）～1000 萬元（不含），最低收費 5,000 元","1000 萬元（含）以上依萬分之五計收，不足 6,000 元以 6,000 元計收","1000 萬元（含）以上依千分之一計收"],"a":3,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"3.1000萬元(含)以上，<mark>依費率萬分之五計收，計算後如不足6,000元時，以6,000元計收</mark>。"}},{"id":"S3-5","m":3,"q":"有關不動產買賣價金信託之經辦人員，下列敘述何者錯誤？","o":["須具備信託業務人員資格","經辦人員得兼任操作員","不限於消金業務人員","經辦人員不得擔任核章人員"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"「經辦人員」不限於消金業務人員，但須具備信託業務人員資格，「經辦人員」與「核章」及「操作員」人員不得為同一人，<mark>即「經辦人員」不得擔任「核章」或「操作員」</mark>。"}},{"id":"S3-6","m":3,"q":"買賣價金承作期間逾一年尚未結案者，下列敘述何者錯誤？","o":["應每年列印一次信託專戶交易明細","核對餘額並經主管覆核加蓋腰型章","應每季列印一次信託專戶交易明細","提供予買賣雙方"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"(一)<mark>買賣價金承作期間逾一年尚未結案者，應每年列印一次信託專戶交易明細</mark>(代號T939，代碼5：查詢信託契約交易明細)，核對餘額並經主管覆核加蓋腰型章後提供予買賣雙方。"}},{"id":"S3-7","m":3,"q":"有關不動產買賣價金信託文件之保存，下列敘述何者錯誤？","o":["自信託契約關係消滅後保存 5 年","依「歸檔文件檢核表」逐項檢核","依信託契約編號設卷保管，毋須置於金庫","自信託契約關係消滅後保存 7 年"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"「掃描文件」正本交經辦人員依「歸檔文件檢核表」(附錄10)逐項檢核歸檔文件，核對無誤送交主管覆核加蓋腰型章後，交由信託作業經辦依信託契約編號設卷保管並列入移交，毋須置於金庫，<mark>並自信託契約關係消滅後保存7年</mark>。"}},{"id":"S3-8","m":3,"q":"有關客戶身分資訊之定期審查頻率，下列敘述何者錯誤？","o":["高風險客戶應至少每年檢視一次","中風險客戶每 3 年辦理定期審查","低風險客戶每 5 年辦理定期審查","中風險客戶每 2 年辦理定期審查"],"a":3,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託","t":"(二)應定期檢視辨識客戶及其實質受益人身分所取得之資訊是否足夠，並確保該等資訊之更新，特別是高風險客戶，應至少每年檢視一次，除前述客戶外，應依風險基礎方法決定檢視頻率，<mark>中、低風險客戶分別每3年及每5年辦理定期審查</mark>，並同時再次檢視信託關係之合理性。"}},{"id":"S3-9","m":3,"q":"有關不動產買賣之土地增值稅繳納，下列敘述何者錯誤？","o":["完稅後約二日內即可完成產權移轉登記","完稅後約十日內始完成產權登記","繳納土地增值稅前應確認尾款來源","應執行「買方尾款融資狀況維護交易」（T935）並經主管覆核"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"由於不動產買賣交易，<mark>於土地增值稅完稅後二日內即可完成產權登記</mark>(即房地移轉至買方名下)，經辦人員應注意買方是否向銀行申請貸款以抵付尾款，確實掌握尾款來源。"}},{"id":"S3-10","m":3,"q":"有關不動產買賣價金信託管理費與契約，下列敘述何者正確？ A.複雜案件可自行調高收費，但不得低於最低收費 B.擬降低費率應填寫優惠申請書傳真至信託處申請 C.信託契約書為標準化版本，原則上不得自行修改 D.營業單位得自行降低費率免申請","o":["ABC","AB","AC","ABCD"],"a":0,"x":null,"src":6,"t":"combo","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"4.<mark>若個案係屬複雜案件，可自行調高收費，惟不得低於最低收費</mark>。"}},{"id":"S3-11","m":3,"q":"有關有價證券信託，下列敘述何者正確？ A.他益信託之贈與稅應於信託契約簽約日後三十日內申報 B.委託人於轉讓之次月五日應申報上月份持股異動 C.內部人轉讓持股申報輸入系統之日起三日內完成股票轉讓 D.贈與稅由受託人負擔","o":["ABC","AB","AC","ABCD"],"a":0,"x":null,"src":6,"t":"combo","ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第二節 營業單位受理本項業務作業程序","t":"貳、他益信託申報贈與稅一、信託種類涉及「他益信託」時，贈與稅法規定贈與人有義務就其贈與行為向其戶籍所在地之稅捐稽徵機關或國稅局申報，故本業務應由營業單位人員配合協助委託人代辦申報贈與稅，<mark>贈與稅申報時點為信託契約簽約日後三十日內</mark>。"}},{"id":"S3-12","m":3,"q":"不動產買賣價金信託於信託關係消滅時起（　）內，編製信託財產結算報告確認書予買賣雙方。","o":["十日","一個月","二個月","三個月"],"a":1,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"(二)<mark>於信託關係消滅時起一個月內編製信託財產結算報告確認書</mark>予買賣雙方。"}},{"id":"S3-13","m":3,"q":"不動產買賣價金信託之防制洗錢相關文件，至少保存至與客戶業務關係結束後（　）年。","o":["5","7","10","15"],"a":1,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"七、文件保存有關防制洗錢及打擊資恐相關文件應併同客戶檔案妥善保存，保存年限依本業務規定辦理，<mark>惟至少保存至與客戶業務關係結束後7年</mark>，倘在依法調查中之案件，雖其相關文件已屆保存年限，在其結案前，仍不得予以銷毁。"}},{"id":"S3-14","m":3,"q":"買方價金存入信託專戶後，本行於次一日以何種方式通知招攬人員？","o":["簡訊","電子郵件","電話","書面"],"a":1,"x":"買賣雙方及地政士則以手機簡訊通知。","src":6,"t":"ask","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"六、信託資金入帳通知及查詢(一)通知：買方依約定時間將價金存入信託專戶，本行將以手機簡訊通知買賣雙方及地政士(需於交易代號T932-16及T932-17有建檔)，<mark>並於價金 :"員工福利信託配合美國 FATCA，自（　）起實施，簽約對保時應徵取自我證明文件。","o":["2014 年 7 月 1 日","2017 年 1 月 1 日","2019 年 1 月 1 日","2025 年 1 月 1 日"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託","t":"2.<mark>配合美國自2014年7月1日起實施</mark>「外國帳戶稅收遵從法」(以下簡稱FATCA)，營業單位與客戶辦理信託契約簽約對保時，應徵取「自我證明文件」，依規辦理FATCA盡職審查，如客戶為個人戶(含獨資)，營業單位經辦應另填寫「美國人士暨美國指標檢核表(個人戶)」【存523】，依其相關規範審查並於端末主機顧客基本資料建檔完成。"}},{"id":"S4-28","m":4,"q":"員工福利信託因應 CRS 規定，自（　）起簽約對保時應徵取自我證明文件。","o":["2014 年 7 月 1 日","2017 年 1 月 1 日","2019 年 1 月 1 日","2020 年 1 月 1 日"],"a":2,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託","t":"2.<mark>自2019年1月1日起，因應財政部</mark>「金融機構執行共同申報及盡職審查作業辦法」(以下簡稱CRS)規定，營業單位與客戶辦理信託契約簽約對保時，應徵取「自我證明文件」，依規辦理CRS盡職審查(限委託人及受益人皆為法人)。"}},{"id":"S4-29","m":4,"q":"保管機構應於投信公司通知送達（　）個營業日完成相關交易之基本資料建檔並回報。","o":["三","五","七","十"],"a":3,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第七章 受託保管證券投資信託基金業務","s":"第三節 受託保管國內證券投資信託公司募集證券投資信託基金投資","t":"4.基本資料建檔之回報：<mark>保管機構應於投信公司通知送達十個營業日完成相關交易之基本資料建檔</mark>且回報投信公司後，投信公司始得進行交易。"}},{"id":"S4-30","m":4,"q":"保管機構拒絕依交易指示內容辦理交割時，應於交割指示到達之時起（　）內通知投信公司。","o":["一小時","二小時","當日","次一營業日"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第七章 受託保管證券投資信託基金業務","s":"第三節 受託保管國內證券投資信託公司募集證券投資信託基金投資","t":"交割指示如未於前述期間內送達者，保管機構得拒絕辦理交割，惟倘拒絕依交易指示內容辦理交割，<mark>保管機構應於交割指示到達之時起一小時內通知投信公司</mark>。"}},{"id":"S4-31","m":4,"q":"其他保管業務收回之保管收據、交易憑證等應定期裝訂成冊，保存期限（　）年。","o":["5","7","10","15"],"a":2,"x":null,"src":6,"t":"fill","ci":{"b":"信託篇","c":"第八章第三節 其他保管業務","s":"第三節 其他保管","t":"(六)<mark>收回之保管收據、交易憑證等應定期裝訂成冊，保存期限10年</mark>。"}},{"id":"S4-32","m":4,"q":"基金保管經辦收到現金股利徵詢通知書後，應於幾日內送交經理公司？","o":["1 日","3 日","5 日","7 日"],"a":1,"x":null,"src":6,"t":"ask","ci":{"b":"信託篇","c":"第七章 受託保管證券投資信託基金業務","s":"第二節 受託保管國內證券投資信託公司募集證券投資信託基金投資","t":"1.收到通知書後，核對增資新股劃撥集保帳戶帳號是否正確(若為新戶則填入集保帳戶帳號以寄送股務代理)，<mark>於3日內送交經理公司</mark>。"}},{"id":"S4-33","m":4,"q":"受益人買回受益憑證之價金給付請求權，自價金給付期限屆滿日起幾年間不行使而消滅？","o":["五年","十年","十五年","二十年"],"a":2,"x":null,"src":6,"t":"ask","ci":{"b":"信託篇","c":"第七章 s":"第一節 商品適合度政策","t":"4.直接債券(StraightBond)直接債券之商品風險分類原則如下，若同一商品同時符合二個或兩個以上之風險等級分類標準時，<mark>以風險較高之級別處理</mark>，例:同時符合「中低風險等級」與「中度風險等級」，則該商品分類為「中度風險等級」。"}},{"id":"S5-31","m":5,"q":"「國際板債券」之商品風險分類，下列何者錯誤？","o":["中低：發行機構信評 AA- 以上且年期 3 年以下","中低：發行機構信評 A- 以上且年期 3 年以下","中度：發行機構信評 A- 以上且年期 5 年以下","中高：發行機構信評 A- 以上且年期 5 年以上"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"(1)中低風險等級：國際板債券之發行機構信評等級須符合任一信評機構<mark>相當於標準普爾評等AA-等級(含)以上且年期為3年(含)以下</mark>。"}},{"id":"S5-32","m":5,"q":"「優先股（特別股）」之商品風險分類，下列何者錯誤？","o":["中度：信評 A- 以上且年期 40 年以下","中高度：信評 BBB- 以上且年期 50 年以下","中度：信評 BBB- 以上且年期 40 年以下","高度：信評 BBB- 以上且年期 50 年以上"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"6.其他有價證券－優先股(特別股)(1)中度風險等級：發行機構或優先股(特別股)之信評等級(取其低者)須符合任一信評機構相當於標準普爾<mark>評等A-等級(含)以上且年期為40年(含)以下之商品</mark>。"}},{"id":"S5-33","m":5,"q":"「短期票券」之商品風險分類，下列何者錯誤？","o":["中低度：短期信評 A-3 以上且年期 3 年以下","中低度：短期信評 A-2 以上且年期 3 年以下","中度：短期信評 A-3 以上且年期 3 年以下","中高度：短期信評 A-3 以上且年期 3 年以上"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"10.其他有價證券－短期票券(1)中低度風險等級：發行機構或保證機構短期債務之信評等級須符合任一信評機構<mark>相當於標準普爾評等A-2(含)以上且年期為3年(含)以下之商品</mark>。"}},{"id":"S5-34","m":5,"q":"境外結構型商品之商品風險等級認定，下列敘述何者錯誤？","o":["以(1)至(6)項個別分數加總為風險總分","部分保本（保本 50% 以上）者，與「中度」取較高者","不保本（保本低於 50%）者，與「中高度」取較高者","不保本（保本低於 50%）者，與「中度」取較高者"],"a":3,"x":null,"src":6,"t":"neg","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"3.境外結構型商品(StructuredNotes)（不含連結結構型商品之保險商品）之商品風險，以下列(1)至(6)項個別分數加總為其風險總分，若為部分保本之商品(限保本50%以上)，以其對應之商品風險等級與「中度商品風險等級」，<mark>取其商品風險等級較高者認定</mark>；"}},{"id":"S5-35","m":5,"q":"境外結構型商品之「商品結構複雜度」計分，下列何者錯誤？","o":["連結單一標的：1 分","連結 3 個（含）以上不同種類標的：3 分","連結 2 個標的：2 分","經財務槓桿、模組、模型方式操作者：5 分"],"a":1,"x":"連結 3 個以上不同種類標的為 4 分。","src":6,"t":"neg","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"(5)商品結構複雜度：A.連結單一標的：1分B.連結2個標的：2分C.連結3個(含)以上同種類標的：3分<mark>D.連結3個(含)以上不同種類標的：4分</mark>E.經財務槓桿、模組、模型方式操作者：5分(6)商品年期：A.1年(含)以下：1分B.1年(不含)以上，5 成日，<mark>經理財業務處處長核准後，於下一年度補足時數</mark>，惟該時數不得再同時納入下一年度之教育訓練時數。"}},{"id":"S7-1","m":7,"q":"理財業務人員至客戶處辦理行外收送件時，下列何者<b>不得</b>提供？","o":["收送待交換即期支票","收送現金及送交網路銀行密碼函","收送繳費單據","收送取款條"],"a":1,"x":"不得提供收送現金服務及送交網路銀行密碼函，亦不得收受領取對帳單。","ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(五)<mark>至客戶處辦理行外收送件時，提供收送現金服務及送交網路銀行密碼函</mark>。"},"t":"neg"},{"id":"S7-2","m":7,"q":"理財業務人員<b>不得</b>擔任下列何項業務之核對親簽人員？","o":["開戶","客戶基本資料變更","自動化設備申請變更","保險要保書"],"a":3,"x":"理財人員得擔任保險要保書核對親簽。","t":"neg","ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"二、<mark>理財業務人員不得擔任下列人員：(一)開戶、帳戶及客戶基本資料、自動化設備申請、變更或掛失等業務</mark>之核對印鑑及核對親簽人員。"}},{"id":"S7-3","m":7,"q":"提供高資產客戶資產配置規劃時，依充分揭露原則應揭露之內容，下列何者<b>不含</b>？","o":["可能風險及最大可能損失","收費標準及明細","銀行獲取之手續費、佣金","保證獲利之報酬率"],"a":3,"x":"不得保證獲利。","ci":{"b":"理財篇","c":"第四章 高資產客戶作業規範","s":"第六節 高資產客戶關係管理","t":"二、充分揭露原則：提供資產配置規劃或諮詢服務時，<mark>應向客戶充分揭露所涉可能風險及最大可能損失</mark>、管理服務或金融投資商品所需之收費標準及明細、銀行獲取之手續費、佣金及其他名義費用等，並提供客戶其他必要之資訊，以客戶需求及其利益優先之原則執行。"},"t":"neg"},{"id":"S7-4","m":7,"q":"初任個金（理財）副理未符合信託管理人員等資格條件者，得於擔任職務起（　）內調整至符合規定。","o":["一個月","三個月","六個月","一年"],"a":1,"x":"初任副理得於擔任職務起三個月內調整至符合規定。","src":1,"t":"fill","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第3頁","s":"","t":"一、理財人員資格•理財業務人員–信託業務員、投信投顧業務員、人身保險業務員及投資型保險業務員•個金(理財)副理–信託管理人員、人身保險業務員、投資型保險業務員、人身保險業務員銷售外幣收付非投資型保險商品、財產保險業務員、結構型商品推介及銷售相關業務督導主管–<mark>初任副理得於擔任職務起三個月內調整至符合規定</mark>3二、辦理理財業務之業務人員行為守則（節錄）•應瞭解並遵守相關法令規定守法原則•盡善良管理人之責任執行業務忠實及善良管理原則•以客戶需求及其利益優先提供理財諮詢、協助客戶規劃投資組合及推介商品謹慎管理原則•向客戶充分揭露告知並提供必要之資訊資訊揭露原則•持續充實專業知能專業原則•妥善保管客戶之基本資料、財務狀況及執行交易之文件保密原則•應避免對外相互破壞同業信譽或其他不當競爭之行為，銀行內部亦同公"}},{"id":"S7-5","m":7,"q":"依理財業務人員行為守則，下列敘述何者正確？ A.以客戶需求及其利益優先推介商品屬謹慎管理原則 B.不得勸誘原單位客戶轉籍至新單位 C.不得私自蓋印銀行章戳交付客戶收據 D.經主管同意得勸誘原單位客戶轉籍","o":["ABC","ABCD","AB","BCD"],"a":0,"x":"謹慎管理原則；盡善良管理人之責任為忠實及善良管理原則。","src":1,"t":"combo","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第4頁","s":"","t":"二、辦理理財業務之業務人員行為守則（節錄）•應瞭解並遵守相關法令規定守法原則•盡善良管理人之責任執行業務忠實及善良管理原則•<mark>以客戶需求及其利益優先提供理財諮詢、協助客戶規劃投資組合及推介商品謹慎管理原則</mark>•向客戶充分揭露告知並提供必要之資訊資訊揭露原則•持續充實專業知能專業原則•妥善保管客戶之基本資料、財務狀況及執行交易之文件保密原則•應避免對外相互破壞同業信譽或其他不當競爭之行為，銀行內部亦同公平競爭原則•不得直接或間接要求、期約或收受不當之金錢、財物或其他利益自律原則4【一般行為規範】二、辦理理財業務之業務人員行為守則（節錄）5生活紀律與從業倫理•不得私自蓋印銀行章戳交付客戶收據、使用其他人員"}},{"id":"S7-6","m":7,"q":"理財人員因所屬營業單位調動時，下列敘述何者錯誤？","o":["不得勸誘原單位客戶轉籍至新單位","不得勸誘原單位客戶於新單位開立帳戶","應辦理客戶移交","得協助原單位客戶轉籍至新單位"],"a":3,"x":"不得因調動勸誘原單位客戶轉籍或於新單位開戶。","src":1,"t":"neg","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第5頁","s":"","t":"•<mark>不得因所屬營業單位調動，勸誘原單位客戶辦理轉籍至新單位或於新單位開立帳戶</mark>。"}},{"id":"S7-7","m":7,"q":"理財人員不得擔任下列哪些人員？ A.KYC 作業之評估人員 B.開戶之核對親簽人員 C.自動化設備申請變更之核對親簽人員 D.保險要保書核對親簽人員","o":["ABC","ABCD","AB","BCD"],"a":0,"x":"理財人員（含個金副理）不得擔任開戶等核對印鑑親簽人員及 KYC 評估人員；可為專業投資人之受理人員。","src":1,"t":"combo","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第7頁","s":"","t":"•<mark>KYC作業之評估人員，即負責向客戶解說「資料表」</mark>，及確認「資料表」內容由客戶親填親簽之人員。"}},{"id":"S7-8","m":7,"q":"有關理財人員協助客戶之網銀作業，下列敘述何者錯誤？","o":["協助處理網銀操作時應有另一名非理財人員之行員在場","不得為客戶操作網路銀行","不得辦理網路銀行密碼更換設定","經客戶同意得單獨為客戶操作網銀"],"a":3,"x":"理財人員不得協助客戶辦理 KYC；其他網銀操作需協助時應有另一名非理財人員之行員在場。","src":1,"t":"neg","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第7頁","s":"","t":"•理財人員不得協助客戶辦理KYC，其他網銀操作若需理財人員或個金(理財)副理協助客戶處理時，<mark>應有另一名非理財人員之行員在場</mark>。"}},{"id":"S7-9","m":7,"q":"理財人員代來行客戶交付存提匯款文件，下列敘述何者錯誤？","o":["由存匯／外匯人員受理","完成交易後之金融卡由主管親自交付","電子銀行密碼函由主管親自交付","金融卡及密碼函得交由理財人員轉交"],"a":3,"x":"存摺、收執聯等由受理櫃員及理財人員以外人員交付；金融卡或密碼函應由主管親自交付。","src":1,"t":"neg","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第8頁","s":"","t":"<mark>金融卡或電子銀行密碼函，則應由主管親自交付</mark>。"}},{"id":"S7-10","m":7,"q":"金管會修正「銀行防範理財專員挪用客戶款項相關內控作業原則」，增列「疑似理財專員挪用客戶款項之態樣」共幾類幾項？","o":["三類 15 項","四類 21 項","五類 25 項","六類 30 項"],"a":1,"x":"資金往來類、關聯帳戶類、代客操作類及其他行為類共四類 21 項。","src":1,"ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第10頁","s":"","t":"二、增列「疑似理財專員挪用客戶款項之態樣」：<mark>包含資金往來類、關聯帳戶類、代客操作類及其他行為類共四類21項</mark>。"},"t":"ask"},{"id":"S7-11","m":7,"q":"個金（理財）副理應於每月何時至 IMVP 系統完成前月所屬理財人員之「行為守則遵循情況查核表」？","o":["每月 1～5 日","每月 10～20 日","每月 20～25 日","每月底"],"a":1,"x":"每月 10～20 日完成並經分行經理覆核放行。","src":1,"ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第12頁","s":"","t":"三、個金(理財)副理每月/季辦理事項12(一)理財業務人員行為守則遵循情況查核表•平日觀察、督導理財業務人員生活紀律 function filt(list){const y=$('#fy').value,s=$('#fs').value;return list.filter(q=>(!y||String(q.y)===y)&&(!s||status(q)===s))}

function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), sg=(c.b||'').startsWith('信保'), gw=(c.b||'').startsWith('公文'), rul=sg||gw||(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':sg?'信保手冊依據':gw?'公文依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){
  const v=qz?quiz.ans[q.id]:ST[q.id], h=HI[q.id], done=v!==undefined, sim=q.id[0]==='S';
  const QT={neg:'錯誤題',combo:'組合題',fill:'填空題',ask:'問答題'};
  const head=(sim?(q.src===6?`<span class="tag sim lecq">延伸新題</span>`:q.src===5?`<span class="tag sim lecq">題型新題</span>`:q.src===4?`<span class="tag sim rulq">公文新題</span>`:q.src===3?`<span class="tag sim rulq">信保新題</span>`:q.src===2?`<span class="tag sim rulq">要點新題</span>`:q.src?`<span class="tag sim lecq">講義新題</span>`:`<span class="tag sim">模擬題</span>`):`<span class="tag">${q.y} 年・第 ${q.n} 題</span>`)+(q.t?`<span class="tag qt">${QT[q.t]}</span>`:'');
  const md=(showMod?`<span class="tag md">${pad(q.m)} ${MOD[q.m].t}</span>`:'')+(q.lx?`<span class="tag lxq" title="${q.lx.b} ${q.lx.c}">${q.lx.v>=50?'講義高度重複':'講義相似'} ${q.lx.v}%</span>`:'');
  const opts=q.o.map((o,i)=>{let c='';if(done){if(q.a===null||q.a===undefined){if(i===v)c='ok'}else if(i===q.a)c='ok';else if(i===v)c='bad'}
    return `<button class="op ${c}" data-q="${q.id}" data-i="${i}"><span class="l">${L[i]}</span><span>${o}</span></button>`}).join('');
  let ans='';
  if(done){
    const ok=isOk(q,v), bonus=q.a===null||q.a===undefined;
    const ver=bonus?`<span class="verdict ok">官方送分題（任一選項皆給分）</span>`:
      ok?`<span class="verdict ok">✓ 答對</span>`:`<span class="verdict bad">✗ 答錯　正確答案：(${L[q.a]}) ${q.o[q.a]}</span>`;
    const warn=q.lo===1?`<div class="warn">本題出自保險代理／信用卡等業務規範，細則未直接收錄${q.ci?'；下方為細則中最相關條文':''}</div>`:q.lo===2?`<div class="warn">細則條文比對信心較低，僅供參考</div>`:q.lo===3?`<div class="warn web">本題細則未收錄，解析已依網路公開資料查證：${(q.web||[]).map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>`).join('、')}${q.ci?'；下方為細則中最相關條文':''}</div>`:'';
    ans=`<div class="ans"><button class="redo" data-r="${q.id}">重作</button>${ver}${q.x?`<div class="exp">${q.x}</div>`:''}${warn}${cite(q.ci)}${q.lx&&!(q.ci&&q.ci.b===q.lx.b&&q.ci.c===q.lx.c)?`<div class="cite lec lx"><span class="lb">${q.lx.b.startsWith('信保')?'信保手冊':'講義'}相似・重疊 ${q.lx.v}%</span><span class="path">${q.lx.b} › ${q.lx.c}</span><div class="tx">${q.lx.t}</div></div>`:''}</div>`;
  }
  return `<div class="qc ${done?'done':''}" id="c-${q.id}" data-z="${qz?1:''}"><div class="qh">${head}${md}${h?`<span class="tag hist">作答 ${h.n} 次・錯 ${h.w} 次</span>`:''}</div><div class="qt">${q.q}</div>${opts}${ans}</div>`;
}

function renderSearch(kw){

function renderQuiz(){
  if(!quiz){

       <label>題源 <select id="qsrc"><option value="mix">考古題＋模擬題</option><option value="p">只考古題</option><option value="s">只模擬題</option></select></label>

  $('#main').innerHTML=`<div class="mtitle"><h2>模擬考（60 題・100 分）</h2></div>

    const id=t.dataset.q, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz, q=BYID[id], i=+t.dataset.i;
    if((qz?quiz.ans[id]:ST[id])!==undefined)return;
    ST[id]=i;if(qz)quiz.ans[id]=i;record(q,i);save();
    const tmp=document.createElement('div');tmp.innerHTML=qcard(q,!!card.querySelector('.tag.md'),qz);card.replaceWith(tmp.firstElementChild);
    header();sidebar();
    if(view==='quiz'&&quiz&&!$('#q').value){const y=scrollY;renderQuiz();scrollTo(0,y)}
    return}
  if(t.dataset.r){const id=t.dataset.r, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz;
    if(qz)delete quiz.ans[id];else{if(view==='wrong')keep.add(id);delete ST[id];save()}
    if(qz){const y=scrollY;renderQuiz();scrollTo(0,y);header();sidebar();return}
    const tmp=document.createElement('div');tmp.innerHTML=qcard(BYID[id],!!card.querySelector('.tag.md'));card.replaceWith(tmp.firstElementChild);header();sidebar();return}
  if(t.dataset.reset){const k=t.dataset.reset;
    if(k==='all'){if(!confirm('確定清除全部作答紀錄（含作答次數統計）？'))return;ST={};HI={};saveH();keep.clear()}
    else if(k==='wrong')ALL.filter(q=>status(q)==='bad').forEach(q=>{keep.add(q.id);delete ST[q.id]});
    else ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad')).forEach(q=>delete ST[q.id]);
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=60,pr=$('#qpr').value;
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    let pick=pool.slice(0,n);
    if($('#qtp').value==='r'&&DATA.qt){  // 依 114 年題型比例分層抽題，不足者以其他題補足
      const K=['neg','combo','fill','ask'],want={};let s=0;K.forEach(k=>{want[k]=Math.round(DATA.qt[k]*n);s+=want[k]});want.neg+=n-s;
      pick=[];K.forEach(k=>pick.push(...pool.filter(q=>q.t===k).slice(0,want[k])));
      const used=new Set(pick.map(q=>q.id));pick.push(...pool.filter(q=>!used.has(q.id)).slice(0,n-pick.length));shuffle(pick)}
    quiz=pick.map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
let rvT;document.addEventListener('input',e=>{if(e.target.id==='rvq'){clearTimeout(rvT);rvT=setTimeout(rvFilter,150)}});
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
render();
</script>
