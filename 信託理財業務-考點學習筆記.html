<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信託理財考點筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --panel:#fbfaf7; --card:#ffffff; --line:#e3ddd3; --line2:#efeae2;
  --ink:#1d1b19; --ink2:#3d3833; --muted:#7a726a;
  --accent:#a4502a; --accent-soft:#f3dfd0; --accent-ink:#8a3f1d;
  --navy:#2c4a72; --green:#2f6a44; --ok:#2f6a44; --ok-bg:#e6f1e9; --bad:#b3261e; --bad-bg:#fbe7e4;
  --mark:#fbe3a6; --warn:#8a6a12; --warn-bg:#fbf3dc;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
  --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
  --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
  --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
  --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
    --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
    --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
    --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
    --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding:18px 40px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.5px}
.stat{color:var(--muted);font-size:13px;margin-top:2px}
.xlink{font-size:13px;margin-top:4px}.xlink a{color:var(--accent-ink);margin-right:12px}.xlink b{color:var(--ink);margin-right:12px}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:6px;align-items:center}
nav.tabs button{background:none;border:1px solid transparent;border-bottom:2px solid transparent;font:inherit;font-size:15px;padding:8px 14px;color:var(--ink2);cursor:pointer;border-radius:8px 8px 0 0}
nav.tabs button.on{border-color:var(--line);border-bottom:2px solid var(--accent);background:var(--panel);color:var(--ink);font-weight:700}
.theme{border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 10px!important}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}
aside .search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
aside .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
select{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.mlist{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:calc(100vh - 250px);overflow:auto;position:sticky;top:12px}
.mi{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--line2)}
.mi.on{background:var(--accent-soft)}
.mi .code{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.mi .nm{font-weight:700;font-size:15px}
.mi .ct{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px}
.mi .sb{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.5}
.mi .bar{grid-column:2/4;height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:4px}
.mi .bar i{display:block;height:100%;background:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px 34px;min-width:0}
.mtitle{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mtitle .code{font-family:var(--mono);font-size:36px;color:var(--accent);font-weight:600}
.mtitle h2{font-family:var(--serif);font-size:34px;margin:0}
.msub{color:var(--muted);margin:4px 0 18px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card)}
.kpi div{padding:12px 14px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:600}
.kpinote{font-size:12px;color:var(--muted);margin:8px 0 0}
section{max-width:880px}
section h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:34px 0 14px;padding-top:26px;border-top:1px solid var(--line)}
section h3 small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.badge{display:inline-block;color:#fff;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:3px;margin:14px 0 8px}
.b0{background:var(--navy)}.b1{background:var(--green)}
ul.nt{margin:0 0 6px;padding-left:20px}
ul.nt li{margin:5px 0}
ul.nt b{color:var(--accent-ink)}
u{text-decoration:none;border-bottom:1.5px solid var(--accent);}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.num{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px}
.num b{display:block;font-family:var(--mono);font-size:17px;color:var(--accent-ink)}
.num span{font-size:12.5px;color:var(--ink2)}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.yrs span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);background:var(--card)}
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.qc{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:16px 18px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.sim{background:var(--green);color:#fff}
.tag.hist{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--sans)}
.tag.md{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--sans)}
.qt{font-size:15.5px;margin:4px 0 10px}
.qt .it{font-family:var(--mono);color:var(--accent);font-weight:600}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer;line-height:1.6}
.op:hover{border-color:var(--accent)}
.op .l{font-family:var(--mono);font-weight:600;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--card)}
.op.ok{background:var(--ok-bg);border-color:var(--ok)}
.op.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:var(--bad-bg);border-color:var(--bad)}
.op.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.done .op{cursor:default}
.ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{margin:6px 0}
.cite{margin-top:10px;border-left:3px solid var(--navy);background:var(--panel);padding:8px 12px;border-radius:0 6px 6px 0}
.cite .lb{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;margin-right:8px}
.cite .path{font-size:12.5px;color:var(--muted)}
.cite.lec{border-left-color:var(--green)}.cite.lec .lb{background:var(--green)}.tag.lecq{background:var(--navy)}.cite.rul{border-left-color:var(--accent)}.cite.rul .lb{background:var(--accent)}.tag.rulq{background:var(--accent)}
.cite .tx{font-size:14px;color:var(--ink2);margin-top:6px;word-break:break-all}
mark{background:var(--mark);color:inherit;padding:0 1px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 8px;margin-top:8px;display:inline-block}
.redo{float:right;font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:20px 0}
table.nt{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.nt th,table.nt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.nt th{background:var(--line2);font-weight:700}
table.nt td.k{font-family:var(--mono);color:var(--accent-ink);white-space:nowrap}
.qzbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.score{font-family:var(--mono);font-size:22px;color:var(--accent-ink)}.score.big{font-size:40px}.qzres{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:8px;padding:14px 18px;margin:16px 0}.qpart{font-family:var(--serif);margin:26px 0 4px;color:var(--accent-ink)}
.mchk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:13.5px}
.mchk label{cursor:pointer}
.legend{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
  .wrap{padding:14px 16px 40px}
  .grid{grid-template-columns:1fr}
  .mlist{position:static;max-height:260px}
  main{padding:22px 16px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .kpi div{border-bottom:1px solid var(--line)}
  .mtitle .code{font-size:26px}.mtitle h2{font-size:24px}
  h1{font-size:23px}
  nav.tabs{overflow-x:auto;max-width:100%}
  nav.tabs button{padding:7px 9px;font-size:14px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>信託理財業務 考點學習筆記</h1>
    <div class="xlink"><a href="./">徵授信</a><a href="外匯業務-考點學習筆記.html">外匯</a><a href="存匯會計業務-考點學習筆記.html">存匯會計</a><b>信託理財</b></div>
    <div class="stat" id="stat"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="mod" class="on">考點</button>
    <button data-v="quiz">模擬考 60 題</button>
    <button data-v="nums">必背數字</button>
    <button data-v="wrong">錯題本</button>
    <button class="theme" id="theme" title="切換深淺色">◐</button>
  </nav>
</header>
<div class="grid">
  <aside>
    <input class="search" id="q" placeholder="搜尋題目或細則（如 停利、KYC、國外債券）">
    <div class="row2">
      <select id="fy"><option value="">全部年度</option><option>110</option><option>111</option><option>112</option><option>113</option><option>114</option></select>
      <select id="fs"><option value="">全部題目</option><option value="un">未作答</option><option value="bad">答錯</option><option value="ok">答對</option></select>
    </div>
    <div class="count" id="cnt"></div>
    <div class="mlist" id="ml"></div>
  </aside>
  <main id="main"></main>
</div>
</div>
<script>
const DATA={"mods":[{"id":1,"t":"特金基金交易作業","sub":"最低投資額・定期(不)定額・二次扣款・停利停損・再申購・神基妙算・TISA","w":"每年約 6 題","notes":[["申購門檻與扣款",["一般單筆：境外基金（臺幣投資）每次最低 <b>3 萬元</b>、國內基金 <b>1 萬元</b>；iLEO App 最低 <b>1,000 元</b>、iLEO 百元奇基最低 <b>100 元</b>；境外 ETF 等值美金 2,000 元。","定期不定額：扣款日前一營業日淨值較「基準淨值」漲跌<b>每達 5%</b>，依基準扣款金額加／減碼；同一標的只能擇一定期定額或定期不定額。","日日扣：每月 1～28 日任選，同一標的各扣款日之<b>扣款金額及方式須一致</b>；首次扣款失敗起<b>連續 3 個月</b>失敗視為終止扣款。","二次扣款：指定扣款日存款不足，於扣款當日<b>下午 1 時</b>前存足即執行二次扣款。"]],["停利停損・再申購・特色商品",["自動停利率限整數且<b>不低於 +5%</b>；不執行自動停利停損：設為 0、有在途未回報單位數、無原始投資金額、定期(不)定額扣款成功合計<b>未超過 12 次</b>。","贖回再申購：<b>無最低再申購金額</b>（仍須符合各基金申購單位）、次一營業日申購、手續費自贖回款內扣、入帳後不圈存；境外 ETF／國外股票、貨幣型基金不可為再申購標的。","延時交易：每營業日下午 4:30 起受理國內／境外基金；海外債、特別股、國內結構債、ETF、額度控管基金、神基妙算、金速配等<b>不受理</b>。","神基妙算：母基金得中途轉換但限「全部轉換」；母基金清算或合併即自動終止；繼承前須先終止本業務。","TISA 級別基金（2025/8/25 上架）：限自然人，不受理大陸地區人民及美籍；須加徵 TISA 約定書；投資門檻低、免申購手續費。"]]],"nums":[["3 萬／1 萬","境外（臺幣）／國內基金單筆最低"],["1,000／100","iLEO App／百元奇基"],["5%","定期不定額加減碼級距"],["12 次","停利停損需扣款成功超過"],["3 個月","連續扣款失敗終止"],["下午 1 時","二次扣款存足時點"]],"cnt":29,"yrs":{"110":7,"111":8,"112":7,"113":4,"114":3}},{"id":2,"t":"國外債券・境外 ETF／股票・結構型・私募","sub":"信評門檻・風險聲明書・T+1 確認・最低申購・高齡錄音・集中度","w":"每年約 4 題","notes":[["國外債券",["僅受理<b>單筆</b>投資（不受理定期定額、轉換、延時交易，不得市價單）；採圈存，T 日下單 <b>T+1</b> 才確認成交；客戶申購依本行「買價」(Ask) 下單。","發行人信評 <b>BB+ 以下</b>（非投資等級）應逐筆加簽「特定金錢信託投資國外債券投資風險聲明書」；非專業投資人發行機構與債券信評須 <b>A-</b> 以上。","高資產客戶可投資發行人信評最低至 <b>B-</b>，並可購買<b>無信評之主權債</b>；三家信評不同時依規定認定；專業投資人、非專投及高資產之停止銷售限額分開計算。","非專投或非高資產客戶臨櫃申購，系統檢核「年齡＋債券剩餘年期」不得逾 <b>85</b>；65 歲以上高齡客戶申購特定風險商品須錄音。"]],["ETF・國外股票・結構型・私募",["美國掛牌 ETF 及股票單筆最低等值美金 <b>2,000 元</b>、以一股累加；香港掛牌 12,000 港幣／人民幣、以一手累加；不受理投資標的轉換。","境外結構型商品提供專業投資人審閱契約，審閱期間不得少於 <b>3 日</b>（客戶明確表示已審閱者除外）。","私募境外基金：僅臨櫃、法人高資產須加徵授權辦理交易之人親簽；流動性與透明度<b>較一般境外基金差</b>。"]]],"nums":[["BB+","加簽國外債券風險聲明書"],["A-／B-","非專投／高資產信評下限"],["85","年齡＋債券年期上限"],["美金 2,000","美國 ETF／股票最低"],["3 日","結構型審閱期"]],"cnt":26,"yrs":{"110":5,"111":5,"112":5,"113":6,"114":5}},{"id":3,"t":"不動產買賣價金信託・預售屋履約擔保","sub":"價金信託・不動產開發信託・專款專用・信託管理費","w":"每年約 3 題","notes":[["不動產買賣價金信託",["買賣雙方須先完成「不動產買賣 ,"信託資金餘額證明：聯行可開立最近 <b>3 個月</b>內全部信託資金餘額證明（不含當日），6 個月前須回原開戶行，須收費。","推介同意暨聲明書：非專投且非高資產之一般客戶首次徵取；特定族群（如高齡、近期無投資經驗等）不得推介。","疑似洗錢態樣：無合理理由設立信託、頻繁大額進出等；能提出充分理由者非屬之。"]]],"nums":[["300 萬","主管逐筆確認門檻"],["3 個月","聯行開立餘額證明"],["10","OBU 外幣投資國內基金科目"]],"cnt":31,"yrs":{"110":6,"111":7,"112":5,"113":6,"114":7}}],"pq":[{"id":"110-1","y":110,"n":1,"m":2,"q":"有關「特定金錢信託投資國外有價證券(不含境外結構型商品)業務」，就下列客戶投資國外債券之敘述，何者錯誤？","o":["下單交易僅適用單筆投資","適用專業投資人之國外債券，不同商品之投資門檻可能不同","委託人於下單日可於「第e行動」查詢交易是否成交","客戶交易價格於申購時係依本行提供之「買價」(Ask price)下單"],"a":2,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券 第二部分 國外特別股","t":"2–10–15第二章金錢信託(不含境外結構型商品)業務交易係採取圈存方式處理，即<mark>委託人於</mark>一般受理時間內(T日)所為之下單指示，<mark>交易是否成交</mark>需待次一銀行營業日(T+1日)才可確認並回報結果。"}},{"id":"110-2","y":110,"n":2,"m":3,"q":"有關本行以信託方式辦理「預售屋履約擔保機制」作業應注意事項，下列敘述何者正確？","o":["採「不動產開發信託」時，信託財產包括興建基地、預售款、融資款及建商合建保證金","採「價金信託」時，不論是否可以動用，營業單位皆應撰寫「信用評估報告」並完成該建商徵信報告","不論採「不動產開發信託」或「價金信託」，皆應搭配本行「銷帳百分百代收業務」及「第e個網」業務","採「不動產開發信託」時，動用範圍不包括償還貸款本息、地價稅及工程預付款"],"a":1,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"1.應徵取文件：(1)不動產買賣<mark>價金信託</mark>指示書(2)信託財產結算報告確認書(3)契約標的物產權已完成登記之地政事務所核發之謄本正本或本行自行列印之電子謄本。"}},{"id":"110-3","y":110,"n":3,"m":2,"q":"有關「特定金錢信託投資國外有價證券(不含境外結構型商品)業務」就受託辦理投資國外債券之規定，下列敘述何者錯誤？","o":["不受理定期定額投資及投資標的轉換","不受理延時交易，且客戶不可申請以市價單成交","客戶主要分為一般客戶(即非專業投資人)、專業投資人、高資產客戶及高淨值法人等四種客群","就專業投資人及非專業投資人與高資產客戶之停止銷售限額係分開計算、分開適用"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(二)對象:65歲(含)以上高齡客戶(含<mark>一般客戶、專業投資人</mark>及<mark>高資產客戶</mark>)(三)適用交易:1.信託基金一般申購登錄(T770/T771)"}},{"id":"110-4","y":110,"n":4,"m":2,"q":"下列何者為「延時交易」可受理之投資標的？","o":["私募基金","境外ETF","國內貨幣市場型基金","國內結構債"],"a":null,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(四)<mark>可受理之投資標的</mark>：國內/境外基金；惟海外債、特別股、國內結構債、連動債、國內/境外ETF及額度控管基金申購、神基妙算、金速配、生生不息等業務或其他特殊基金等不受理<mark>延時交易</mark>。"},"lo":2},{"id":"110-5","y":110,"n":5,"m":10,"q":"下列敘述何者錯誤？","o":["聯行可徵取「推介聲明書」，惟委託人轉籍時，移出行毋須將委託人之「推介聲明書」一併移轉至移入行","同一委託人僅需簽署及徵取乙次「推介聲明書」，且限臨櫃辦理","受理未成年人(已婚除外)簽署「主動委託交易聲明」時，須由法定代理人共同簽名或法定代理人一方單獨持他方同意書辦理","「主動委託交易聲明」應按交易逐筆聲明"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"5.「推介同意暨<mark>聲明書」</mark>之徵取:(1)徵取對象：非專業投資人且非高資產客戶且非屬(七)、1之特定族群。(2)適用標的：國內及外國有價證券(含境外基金、境外ETF、國外股票及境外結構型商品等)投資。(3)<mark>同一委託人僅需簽署及徵取乙次「推介</mark>同意暨<mark>聲明書」，</mark>除可臨櫃簽署外，亦可透過數位通路(第e個網、第e行動及iLEOApp)線上簽署同意推介。(4)委託人於「推介同意暨聲明書/終止推介同意通知書」勾選「推介同意暨<mark>聲明書」</mark>同意本行進行推介，並親簽或蓋妥原留印鑑後，由受理營業單位辦理「顧客基本資料變更交易(9710)」建檔，於<mark>「推介聲明書</mark>(信託用)」欄位(第63欄)鍵入「Y」(同意推介國內外)，並認證於「推介同意暨聲明書/終止推介同意通知書」用紙背面。若委託人為未成年應留其法定代理人共同簽名，或法定代理人一方單獨持他方同意書【如附錄5】辦理。(5)委託人終止推介時，需填寫「推介同意暨聲明書/終止推介同意通知書」勾選「終止推介同意通知書」推介，並由受理營業單位辦理「顧客基本資料變更交"}},{"id":"110-6","y":110,"n":6,"m":10,"q":"有關營業單位受理客戶免填交易申請書，下列敘述何者正確？<br><span class=\"it\">A.</span> 由「操作員」依客戶口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙<br><span class=\"it\">B.</span> 「核章」人員係由主管授權得查詢印鑑暨影像管理系統之人員擔任，並得兼為操作員<br><span class=\"it\">C.</span> 免填申請書交易序號有效期限為三個營業日<br><span class=\"it\">D.</span> 主管須於認證欄之「免填申請書交易序號」前首加蓋私章","o":["BD","BCD","ABD","ABCD"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)受理委託人<mark>免填交易申請書</mark>作業：係指<mark>營業單位</mark>「受理人員」依委託人<mark>口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙</mark>，「受理人員」覆誦委託人<mark>申請內容，</mark>再請委託人確認<mark>申請內容</mark>無誤後蓋妥信託帳戶留存印鑑，交<mark>「核章」人員</mark>核章及<mark>「操作員」</mark>辦理交易認證登錄之作業。"}},{"id":"110-7","y":110,"n":7,"m":10,"q":"有關信託帳戶之轉籍作業，下列敘述何者正確？","o":["EF、EH系列之境外ETF不得辦理「全部/部分投資標的轉籍」","線上開立之信託(889)帳戶得辦理「整戶批次轉籍」及「全部/部分投資標的轉籍」","如投資標的上有在途未回報資料者，仍可辦理「全部/部分投資標的轉籍」","帳戶有一般單筆之預約登錄或預約贖回投資標的者，可辦理整戶批次轉籍作業"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.理財存摺（88）帳戶<mark>投資標的轉</mark>入其他理財存摺（88）帳戶2.理財存摺（88）帳戶<mark>投資標的轉</mark>入金如意（68）綜合管理帳戶(註2)申請書用紙帳戶轉籍申請書兼登錄單信託轉籍申請書兼登錄單【信051】交易代號移出行：帳戶移出設定交易(953T)移入行：帳戶移入夜間批次設定交易(983T)移出行：委託人資料內容變更登錄(T300)移入行：信託基金轉籍登錄(T830)註1：金如意（68）綜合管理帳戶之整戶批次轉籍請參閱營運業務處2012/07/11營管字第00306號函辦理。註2：金如意（68）綜合管理帳戶不得單獨辦理信託商品之<mark>全部/部分投資標的轉籍</mark>。註3：線上開立之信託(889)帳戶<mark>不得辦理「</mark>整戶批次轉籍」及<mark>「全部/部分投資標的轉籍」</mark>。註4：<mark>EF、E</mark>K、EH及EG<mark>系列之境外ETF</mark>及國外股票<mark>不得辦理「全部/部分投資標的轉籍」</mark>。"}},{"id":"110-8","y":110,"n":8,"m":7,"q":"理財業務人員因正常社交禮俗，且係偶發而無影響特定權利義務之虞收受客戶饋贈禮品或招待，於同一年度來自同一來源受贈財物超過新臺幣一萬元時應如何處理？","o":["填寫本行「理財業務人員/金融商品銷售人員收受贈品或招待申報表」向總行申報","向業務主管申報登記且經單位主管判斷是否合理而不影響單位之廉潔操守時可收受","交由配偶、直系血親以外之第三人收受","完全不得收受"],"a":1,"ci":{"b":"理財篇","c":"第一章 通則","s":"第五節 個人資料保護及管理","t":"2.不得與客戶有借貸款項、有價證券等不當資金往來或居間行為，以免違反法規或衍生財務糾紛。3.不得與客戶約定投資收益分享或損失分攤之承諾，亦不得對客戶直接或間接要求、期約或收受金錢、招待、餽贈或其他利益；屬正常社交禮俗，且係偶發而無影響特定權利義務之虞者，不在此限；惟市價超過新臺幣三千元，或同一年度來自同一來源受贈財物超過新臺幣一萬元，應<mark>向業務主管申報登記</mark>，<mark>且經單位主管判斷是否合理而不影響單位之廉</mark>節操守。業務人員亦不得以第三人名義為前述之行為，亦不得由第三人接受餽贈或其他利益再移轉，至第三人之範圍包含但不限於配偶、直系血親或其他親屬。"}},{"id":"110-9","y":110,"n":9,"m":6,"q":"自然人客戶申請成為本行專業投資人，何者不符合具備金融商品專業知識條件？","o":["取得結構型商品銷售人員資格測驗證照","國內OO大學商學系畢業證書","現職為台O銀行授信部門主管","本行專業投資人「金融商品相關專業知識」測驗問卷得分7分"],"a":2,"ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第二節 自然人專業投資人申請作業","t":"(三)自然人專業投資人1及2，金融商品專業知識及交易經驗之標準及認列範圍如下：1.金融商品專業知識(符合(1)~(4)任一項)：(1)持有以下金融商品相關證照之一：期貨商業務員、期貨交易分析人員、衍生性商品銷售人員資格測驗、結構型商品銷售人員資格測驗、證券投資分析人員、美國特許財務分析師(CFA)，國內之認證理財規劃顧問(CFP)、認證財務顧問師(RFC)等專業執照或其他足資證明具備專業知識之證明文件。(2)具備金融相關學歷：國內外大專院校主修或輔修商學相關科系或學程，並取得學位，或曾參與金融研訓院衍生性金融商品相關課程並結訓。(3)從事金融相關職務：任職於金融業、公開發行公司之財務相關部門，或任職於非公開發行公司，惟職務內容直接與公司投資決策相關。(4)通過本行金融商品相關專業知識測驗：客戶未具前述金融商品專業知識者，得以本行專業投資人「金融商品相關專業知識」測驗問卷，分數達70分(含)以上方式取得。"}},{"id":"110-10","y":110,"n":10,"m":5,"q":"下列交易行為何者符合本行商品適合度？","o":["客戶KYC已逾期，購買RR1國內貨幣型基金","KYC已逾期積極型客戶，將持有之RR5能源類基金商品轉換至RR3平衡型基金商品","KYC未逾期穩健型客戶，購買RR5中國股票基金","KYC未逾期保守型客戶，購買RR3高收益債券基金"],"a":0,"ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第22頁","s":"","t":"非專業投資人之商品適合度適合之商品風險等級客戶投資屬性RR1~RR2保守型RR1~RR4穩健型RR1~RR5積極型•由交易系統檢核控管客戶投資屬性及商品風險承受等級是否適配，超出範圍則無法受理。•若<mark>客戶KYC</mark>評估日期已逾一年，僅可推介或受託投資其風險等級為RR1之信託商品。22"}},{"id":"110-11","y":110,"n":11,"m":7,"q":"本行提供客戶投資型商品或服務，除應依各類金融商品或服務之特性向客戶說明重要內容，並應向客戶揭露可能涉及之風險資訊，應揭露之內容不含下列何項？","o":["最大可能損失","商品所涉匯率風險","應負擔之費用及違約金，包括收取 業規範及流程，另訂立營業單位辦理「預開型退休安養信託業務」應注意事項。"}},{"id":"110-30","y":110,"n":30,"m":1,"q":"本行「神『基』妙算效率投資法」業務，下列敘述何者錯誤？","o":["受理金如意(68)綜合管理帳戶之母基金或子基金繼承申請，須先終止本業務","以定期不定額方式加/減碼轉換子基金，調整後轉換金額最高以子基金「轉換信託本金金額之1.5倍」為限","母基金被清算或合併時，本業務之投資組合即自動終止","母基金得中途轉換，惟限以「全部轉換」方式辦理"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(七)加<mark>減碼轉換</mark>比照本行現行<mark>定期不定額</mark>投資加減碼模式，即相較於<mark>子基金「</mark>基準淨值」(即第1次母基金轉子基金之子基金淨值)之漲/跌幅每達5%時，依<mark>子基金「轉換信託本金金額</mark>」扣除客戶自行設定之「減碼金額」/加上客戶自行設定之「加碼金額」為<mark>轉換金額</mark>，惟調整後之<mark>轉換金額</mark>不得低於子基金最低<mark>「轉換信託本金金額</mark>」新臺幣5,000元(外幣投資另從其規定)，<mark>最高以子基金「轉換信託本金金額之</mark>2<mark>倍」為限</mark>。"}},{"id":"110-31","y":110,"n":31,"m":10,"q":"客戶臨櫃或透過空中理財服務申購或贖回信託商品時，每筆交易之本金達新臺幣300萬元(含)或等值外幣之確認機制，下列何者正確？","o":["主管毋須於系統授權放行","主管應指派該筆交易招攬人員、協銷人員以外之第三人，向客戶確認","主管應逐筆以臨櫃或電話向客戶確認","主管可授權一名經辦人員向客戶確認"],"a":2,"ci":{"b":"講義：理財業務標準作業流程－信託商品","c":"第28頁","s":"","t":"定義：申購或贖回信託商品時，每筆交易本金達新臺幣300萬元（含）或等值外幣之交易。2025/03/28信劃字第000015號一定金額以上交易確認控管規範27"}},{"id":"110-32","y":110,"n":32,"m":10,"q":"有關OBU外幣信託業務，下列敘述何者錯誤？","o":["以OBU外幣資金投資外幣計價之國內基金，科目別為「10」","委託人辦理「OBU外幣信託」，需開立金如意綜合管理「68」帳戶","約定之扣／入款OBU外匯存款帳戶限與信託帳戶帳務行歸屬同一分行","委託人以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(三)<mark>OBU外幣信託</mark>以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請。(四)受理申購私募基金之委託人為依境外基金管理辦法第五十二條第一項第二款符合主管機關所定條件之自然人、法人或基金。"}},{"id":"110-33","y":110,"n":33,"m":10,"q":"營業單位於受理繼承人申請信託資金並以辦理信託商品贖回方式繼承時，下列何種文件無需向客戶徵取","o":["理財存摺(線上開立之信託(889)帳戶毋須徵取)","委託人(即被繼承人)死亡證明文件","全體繼承人身分證明文件及印鑑","委託人基本資料變更申請書兼登錄單"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"（二）營業單位受理繼承人申請信託資金繼承方式有「繼承人以原狀態繼承」或「繼承人欲辦理信託商品贖回」，應辦事項如下：1.應徵取文件：（1）理財存摺(線上開立之信託(889)帳戶毋須徵取)。（2）委託人（即被繼承人）死亡之證明文件。（3）全體繼承人身分證明文件及印鑑。（4）委託人除戶戶籍謄本、全戶戶籍謄本（應有所有法定繼承人之記載）及繼承人現在戶籍謄本。（5）繼承系統表。由申請繼承人依民法第1138至1140條規定自行擬定並註明：「本系統表由申請繼承人依照民法第1138、1139、1140條規定訂定，如有遺漏或錯誤者，由申請人負責損害賠償及有關法律責任。」之文字。繼承人中有拋棄繼承權者， 元累積1點"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"5.以上採定期定額投資法之指定扣款日如遇假日，則順延至次一營業日扣款。(二)單筆投資：嘗試投：新臺幣1<mark>00元(含)以上</mark>之單筆投資。"},"x":"當月帳單新增一般消費達 2,000 元以上，基金款項每 40 元累積 1 點；紅利非永久有效、年費不累積。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"111-12","y":111,"n":12,"m":1,"q":"有關本行Glory+世界卡，下列敘述何者錯誤？","o":["申辦條件為個人年收入達新臺幣120萬元或個人流動性資產達等值新臺幣400萬元以上","可透過線上申辦","申請書「共同行銷運用告知事項」中，針對提供姓名、地址以外之其他基本資料及往來交易資料，倘客戶未勾選同意，則視為不同意","為力行節能減碳，「世界卡貴賓專屬權益手冊」改由客戶掃碼新卡貼卡函QR code方式取得"],"a":0,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第三節 財富管理戶優惠","t":"壹、財富管理客戶定義及條件一、個人財管戶：未申請家庭財管戶之個人客戶與本行往來6個月以上，平均總往來資產(註1)(下稱總資產)<mark>達等值新臺幣</mark>(以下同)3<mark>00萬元</mark>，由本行指派專責理財業務人員服務，並依其總資產、平均信託資產(註2)(下稱信託資產)及理財貢獻度(註3)，提供不同優惠項目。"},"x":"Glory+ 世界卡申辦條件之金額敘述錯誤（選項 A）。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"111-13","y":111,"n":13,"m":1,"q":"下列敘述何者錯誤？","o":["通知停利(損)率的預設值為通知停利率+15%、通知停損率-7%","「自動停利率」之設定限整數且不得低於+5%","如投資標的有在途未回報單位數時，系統將不進行自動停利／停損","自動停利(損)率的預設值為自動停利率+10%、自動停損率-10%"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(六)<mark>自動停利(損)率</mark>/通知<mark>停利(損)率的</mark>設定/變更1.核心基金(1)<mark>自動停利(損)率</mark>得設定<mark>自動停利(損)率</mark>，若達<mark>自動停利(損)率</mark>時，除自動辦理全部贖回外，系統將自動終止金速配投資之約定。原已設定<mark>自動停利(損)率</mark>之投資標的，亦得約定為核心基金。(2)通知<mark>停利(損)率</mark>依原一般單筆投資提供之預設值(通知<mark>停利率+1</mark>5%、通知<mark>停損率-</mark>7%)進行通知。"}},{"id":"111-14","y":111,"n":14,"m":1,"q":"有關本行定期(不)定額日日扣投資國內/境外基金功能，下列敘述何者錯誤？","o":["同一投資標的之各扣款日期，所約定之扣款金額及扣款方式均需一致","同一投資標的自首次扣款失敗日起算，連續扣款失敗達3個月時，視同客戶終止該投資標的繼續扣款投資之約定","每月1~28日可任選最多28日作為指定扣款日","以上敘述皆正確"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"九、停止扣款、累計扣款次數之計算以同一投資標的首次扣款失敗日起算，連續扣款失敗達3個月時，視為終止該投資標的繼續扣款，惟本行仍保留委託人已扣款投資累計之原有單位數至委託人辦理贖回，累計扣款次數則以各扣款日扣款成功之次數累積計算。"}},{"id":"111-15","y":111,"n":15,"m":1,"q":"有關本行「基金贖回再申購」約定功能，下列敘述何者正確？","o":["境外ETF/國外股票可作為再申購之投資標的","贖回與再申購之標的可為不同投資幣別","系統於贖回款項入帳後會自動執行圈存機制","本行無訂定最低再申購金額限制；惟再申購金額仍須符合各基金最小申購單位數或專業投資人申購門檻規範"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)再申購之標的無最低<mark>申購金額限制</mark>。(四)再申購之標的，將於贖回款項撥款入客戶指定帳戶後，同時約定次一營業日單筆申購交易，申購手續費將自贖回款項中內扣，另，贖回款項入帳後不會圈存客戶款項。"}},{"id":"111-16","y":111,"n":16,"m":2,"q":"營業單位於臨櫃受理客戶投資國外債券時，倘該國外債券信用評等屬於下列何者時，客戶須加簽「特定金錢信託投資國外債券投資風險聲明書」？","o":["A-","BBB+","BBB-","BB+"],"a":3,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"2.<mark>「特定金錢信託投資國外債券投資風險聲明書」</mark>(非投資等級債券適用):投資發行人<mark>信用評等</mark>是BB+以下等級之債券商品才須徵取。"}},{"id":"111-17","y":111,"n":17,"m":3,"q":"有關本行以信託方式辦理「預售屋履約擔保機制」作業應注意事項，下列敘述何者正確？","o":["採「不動產開發信託」時，信託財產包括興建基地、預售款、融資款及建商合建保證金","採「價金信託」時，不論是否可以動用，營業單位皆應撰寫「信用評估報告」並完成該建商徵信報告","不論採「不動產開發信託」或「價金信託」，皆應搭配本行「銷帳百分百代收業務」及「第e個網」業務","採「不動產開發信託」時，動用範圍不包括償還貸款本息、地價稅及工程預付款"],"a":1,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"1.應徵取文件：(1)不動產買賣<mark>價金信託</mark>指示書(2)信託財產結算報告確認書(3)契約標的物產權已完成登記之地政事務所核發之謄本正本或本行自行列印之電子謄本。"}},{"id":"111-18","y":111,"n":18,"m":6,"q":"有關高資產客戶作業規範，下列敘述何者錯誤？","o":["受理高資產客戶申請前，須先確認客戶已具備本行有效期限內之專業投資人身分","自本行完成高資產客戶申請建檔之日起，每年辦理一次高資產客戶財力覆審作業","自本行完成高資產客戶申請建檔之日起，每三年辦理一次客戶身分覆審作業","於客戶身分覆審時，除檢視財力外，須同時審認金融商品專業知識及交易經驗續符合資格條件"],"a":2,"ci":{"b":"理財篇","c":"第四章 高資產客戶作業規範","s":"第四節 高資產客戶覆審作業","t":"壹、覆審頻率一、為定期確認客戶是否續符合<mark>高資產客戶</mark>應具備之財力標準及資格條件，<mark>自本行完成高資產客戶申請建檔之日起，每</mark>年應<mark>辦理一次高資產客戶</mark>財力覆審，另<mark>客戶身分</mark>資格有效期限自<mark>完成高資產客戶申請建檔之日起</mark>兩年有效，屆期須重新辦理<mark>身分覆審作業</mark>："}},{"id":"111-19","y":111,"n":19,"m":8,"q":"本行辦理授信未清償之住宅火災保險續保作業，下列敘述何者正確？","o":["營業單位鑒於擔保品增值，可免取得要保人同意代客戶辦理提高保障內容之續保作業","要保人因疏忽致保險中斷三個月，營業單位發現後得主動協助辦理續保，並以「代理投保專用章」在要保書之要保人簽章欄位用印","要保人怠於投保時，營業單位為確保擔保品之保障，可免取得要保人同意主動代為更換往來較密切且費率較低的產險公司","當要保人怠於投保，在承保之保險公司未變更、保障內容不變、保險期間未中斷時，方得以「代理投保專用章」在要保書之要保人簽章欄位用印"],"a":3,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"202512版（1）政府公債、國庫券、金融債券、公司債券、國內基金、上市、櫃之公司股票。（2）存放金融機構之存款。（3）給付以委託人為要保人所購買保險之保險費。（4）其他經主管機關核准，委託人得投資之標的。"},"x":"授信未清償之住火險續保：要保人怠於投保時，在承保公司未變更、保障內容不變、保險期間未中斷時方得代為續保。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"111-20","y":111,"n":20,"m":9,"q":"有關本行公司信用卡規範，下列敘述何者錯誤？","o":["提供本行承兌匯票設定質權做為額度足額擔保者，得免執行期中管理","同一公司申請人在本行僅限申請一個公司信用卡總額度，另申請人在本行已有授信往來者，限由授信往來分行提出申請","營業單位須於額度核准月份(不含)後第5個月及第10個月各執行期中管理作業","公司信用卡可用於代扣所得稅款、水電費用"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"6.外幣約定入/扣款帳號：以委託人本人在本行開立之「多幣別」外匯存款帳戶為限。7.本行信用卡卡號：以委託人本人於本行申請之信用卡為限。"},"x":"公司信用卡不得代扣所得稅款、水電費用。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"111-21","y":111,"n":21,"m":10,"q":"有關營業單位受理客戶免填交易申請書，下列敘述何者正確？<br><span class=\"it\">A.</span> 「免填申請書交易序號」有效期限為二個營業日<br><span class=\"it\">B.</span> 「核章」人員係由主管授權得查詢印鑑暨影像管理系統之人員擔任，並得兼為操作員<br><span class=\"it\">C.</span> 由「操作員」依客戶口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙<br><span class=\"it\">D.</span> 主管須於認證欄之「免填申請書交易序號」前首加蓋私章","o":["ABCD","BCD","ABD","BD"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)受理委託人<mark>免填交易申請書</mark>作業：係指<mark>營業單位</mark>「受理人員」依委託人<mark>口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙</mark>，「受理人員」覆誦委託人<mark>申請內容，</mark>再請委託人確認<mark>申請內容</mark>無誤後蓋妥信託帳戶留存印鑑，交<mark>「核章」人員</mark>核章及<mark>「操作員」</mark>辦理交易認證登錄之作業。"}},{"id":"111-22","y":111,"n":22,"m":1,"q":"客戶與本行完成信託資金定期(不)定額二次扣款約定後，指定扣款日因存款不足致交易不成功時，於扣款當日下午（　）前存入足夠扣款金額，本行將執行二次扣款作業。","o":["1時","2時","3時","3時30分"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"貳拾參、<mark>定期(不)定額二次扣款作業</mark>一、作業性質「國內及境外基<mark>金定期(不)定額二次扣款</mark>」作業，係指委託人以<mark>定期(不)定額</mark>方式投資國內及境外基金(以下簡稱「投資標的」)，於<mark>指定扣款日</mark>零時未扣款<mark>成功時，</mark>授權本行於<mark>指定扣款日</mark>下午1時執行第<mark>二次扣款</mark>之作業。"}},{"id":"111-23","y":111,"n":23,"m":2,"q":"美國掛牌ETF及股票，每筆最低申購金額為等值美金","o":["1,000","2,000","5,000","10,000 元"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.單筆投資：<mark>美國掛牌ETF及股票為等值美金2,000</mark>元，並以「一股」為累加單位；香港<mark>掛牌ETF及股票</mark>為港幣/人民幣1<mark>2,000</mark>元，並以「一手」(最低交易單位)為累加單位。"}},{"id":"111-24","y":111,"n":24,"m":10,"q":"下列何者非屬疑似洗錢或資恐之信託交易態樣？","o":["信託帳戶密集存入多筆款項，達特定金額以上或筆數達一定數量以上，且又迅速移轉並立即解約者","客戶突有達特定金額以上資金信託者","客戶簽訂信託契約後即迅速終止契約，相距時間不久且無正當原因者","設立信託帳戶時能提出充分的理由或動機"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(四)客戶突有達特定金額以上資金信託者。(五)不活躍<mark>信託帳戶</mark>突有達特定金額以上資金出入，且又迅速移轉者。(六)<mark>信託帳戶</mark>密集存入多筆款項，達特定金額以上或筆數達一定數量以上，且又迅速移轉並立即解約者。"}},{"id":"111-25","y":111,"n":25,"m":10,"q":"本行受理境外基金投資時，須向委託人事先徵取「推介聲明書」；惟對於特定族群之非專業投資人不得進行推介，下列何者不屬於特定族群？","o":["最近1年投資之交易筆數低於5筆者","有全民健康保險重大傷病證明者","教育程度為國小畢業者","年齡為75歲者"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"2.為符合前項法令規範，本行受理國內及境外基金投資時，須向委託人事先徵取「推介同意暨聲明書」(如附錄10)；惟對於前述特定族群者不得進行推介，另須委託人逐筆聲明係「主動委託」，始可受理交易。"}},{"id":"111-26","y":111,"n":26,"m":10,"q":"有關信託文件掃描留存作業，下列敘述何者錯誤？","o":["由信託作業經辦/兼任信託作業經辦透過「信託業務影像管理系統」辦理掃描","正本依「分行掃描清單」之案件號順序整理","按帳號排序歸檔","置於金庫永久保存"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"2.風險預告書須交由信託作業經辦/兼任信託作業經辦透過「信託業務影像管理系統」掃描存檔備查，其正本依「掃描清單報表」之案件號順序整理，按日期<mark>排序歸檔</mark>，置於金庫室外監視錄影設備攝錄範圍內專用之上鎖重要文件櫃內永久保存。"}},{"id":"111-27","y":111,"n":27,"m":10,"q":"有關「信託疑似洗錢及資恐交易彙總日報表」，下列敘述何者錯誤？","o":["包含DBU及OBU之信託客戶","不論有無資料皆需列印","呈核至防制洗錢督導主管及經理後留存備查","保存7年"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"2.交易資料分別產生於「帳戶行」。(二)<mark>「信託疑似洗錢及資恐交易彙總</mark>月報表」(報表代號：DECTFM，月報表，保存期限5年，彙整當月之日報表資料)，由信託作業經辦每月列印（不管有無資料皆需列印）該報表，併同該月份之<mark>「信託疑似洗錢及資恐交易彙總日報表」</mark>相互勾稽外，應再檢視是否有同一客戶持續出現<mark>疑似洗錢</mark>態樣，並於彙總月報表附註4勾選該月份整體交易之查證結果為正常，或填寫異常應予通報之戶名及帳號後，呈核至防制洗錢督導主管及經理後留存備查。"}},{"id":"111-28","y":111,"n":28,"m":10,"q":"有關「特定金錢信託受益權自行質權設定」業務，下列敘述何者錯誤？","o":["受理單位限信託帳戶原開戶行辦理","首次辦理時須徵取「自行特定金錢信託受益權質借約定書」","係指委託人以他行特定金錢信託受益權辦理自行質押借款","境外基金(不含已下架基金、境外ETF)得為受理自行質借之標的"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"參拾貳、<mark>特定金錢信託受益權</mark>自行質借及倫巴底貸款作業一、作業性質<mark>委託人以</mark>本行(受託人)<mark>特定金錢信託受益權辦理質押借款</mark>，經委託人與本行簽訂相關書類後，據以向本行申請辦理質借業務，並依下列應注意事項辦理："}},{"id":"111-29","y":111,"n":29,"m":4,"q":"辦理「有價證券信託-本金自益、孳息他益」業務，下列敘述何者錯誤？","o":["股票已於本行設定質權，不可再交付信託","信託期間所獲之股票股利及現金股利交付受益人","信託期間，委託人仍保有財產掌控權","可達到贈與之效果"],"a":0,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第一節 通則","t":"2.孳息他益型有價證券信託之特色：(1)信託財產為股票者，其表決權之行使，得與其他信託財產及信託業自有財產分別計算，故委託人保留運用決定權，其股票表決權之行使不受影響。(2)信託股票可為上市櫃公司及未上市櫃公司，即使該<mark>股票已於本行設定質權</mark>亦<mark>可再交付信託</mark>。(3)透過信託規劃，達到贈與及財產移轉之效果。(4)信託期間，委託人仍然保有信託財產的掌控權。"}},{"id":"111-30","y":111,"n":30,"m":4,"q":"「有價證券信託-本金自益、孳息他益」於核算孳息之贈與稅時，是以何者之一年期定期儲金固定利率計算贈與稅總額？","o":["中華郵政","臺灣銀行","元大銀行","第一銀行"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(一)電子郵件：於申購/轉換單位數回報、贖回金額入帳之次營業日，由資訊處加密後寄發。(二)郵寄：委由<mark>中華郵政</mark>(股)公司列印、封裝及寄送，每月固定6次寄送。"},"x":"孳息他益之贈與稅以<b>中華民國郵政</b>一年期定期儲金固定利率計算。","lo":1},{"id":"111-31","y":111,"n":31,"m":1,"q":"家庭財富信託是一項結合了「個人理財計畫」、「家庭財產規劃」以及「信託」的工具，其信託目的具多樣性，但不包括","o":["退休安養信託","買賣價金信託","身心障礙家人照護信託","子女教育信託"],"a":1,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託業務","t":"壹、通則一、業務性質家庭財富信託是一項結合了「個人理財計畫」、「家庭財產規劃」以及「信託」的工具，即委託人將信託財產信託予本行信託處（簡稱受託人），由本行依據每位客戶不同的信託目的與信託契約之約定，為受益人之利益或特定目的妥善管理、運用或處分其信託財產，以達成一般家庭之理財與信託服務需求；申言之，本行將委託人所交付之金錢，依不同信託目的、本金、孳息受益人之不同，運用於委託人所指定之投資工具，並規劃不同現金流量之金錢信託。"}},{"id":"111-32","y":111,"n":32,"m":4,"q":"有關「不動產保全型信託」之業務特色，下列敘述何者錯誤？","o":["可以保障委託人資產安全","可避免受詐騙設定抵押權","可節省相關稅負","可避免不動產被強制執行，影響委託人生計"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"八、國外<mark>相關稅負</mark>(一)美國掛牌ETF及股票：根據美國現行稅法相關規定，非美國籍之個人、法人其於美國境內之所得來源諸如現金股利等皆須扣除30%之稅額（此課稅標準得視交易內容或市場改變而異動），因此，委託人投資美國掛牌ETF須依美國稅法之相關規定扣繳。"},"x":"不動產保全型信託在防止財產被盜賣、保全資產，並<b>無</b>節省稅負之效果。","lo":1},{"id":"111-33","y":111,"n":33,"m":2,"q":"有關本行國外債券之受理投資方式，下列敘述何者錯誤？","o":["採預約圈存申購與預約圈存贖回方式辦理","可受理臨櫃交易","可受理定期定額投資","可於第e個網辦理"],"a":2,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券 第二部分 國外特別股","t":"肆、受理投資方式本業務僅受理臨櫃交易與單筆投資，不<mark>受理定期</mark>(不)<mark>定額投資</mark>及投資標的之轉換，並採預約申購及預約贖回方式辦理。"}},{"id":"111-34","y":111,"n":34,"m":3,"q":"有關本行「預售屋履約擔保機制」業務，下列敘述何者錯誤？","o":["內政部規定之預售屋履約擔保機制中之五種類型，與本行信託業務有關者為「價金信託-可動用」及「價金信託-不可動用」兩類","「價金返還之保證」類型，屬法金履約保證業務項目","建商應至少每年提供經會計師查核簽認之報告","「價金信託-可動用」之動用範圍不包括銷售費用"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"XX,XXX,XXX」等文字;如約定扣款帳戶設定為可透支或可質借，交易畫面將顯示「可動用透支/質借，可用餘額XX,XXX,XXX」等文字，倘扣款金額大於可用餘額，系統將動用透支/質借額度產生透支/質借利息。"}},{"id":"111-35","y":111,"n":35,"m":5,"q":"有關充分瞭解客戶(KYC)作業評估人員之職責與資格，下列敘述何者正確？","o":["由具信託業務人員資格(已登錄信託公會)之理財業務人員擔任","負責向客戶解說「第一銀行客戶資料表」內容","客戶如有需要，可替客戶填寫客戶資料表","客戶因故無法臨櫃辦理KYC作業，得由具信託業務人員或信託管理人員資格(已登錄信託公會)之主管擔任評估人員並覆核放行"],"a":1,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(二)充分瞭解客戶(KYC)作業之評估人員，即<mark>負責向客戶解說「資料表」</mark>，及確認「<mark>資料表」內容</mark>由客戶親填親簽之人員。貳、理財業務人員之系統操作權限控管："}},{"id":"111-36","y":111,"n":36,"m":7,"q":"依「本行辦理理財業務之業務人員行為守則」規定，於執行業務時，應盡善良管理人之責任，不得外流或洩漏客戶資料，此原則稱之為","o":["專業原則","忠實及善良管理原則","資訊揭露原則","自律原則"],"a":1,"ci":{"b":"理財篇","c":"第一章 通則","s":"第五節 個人資料保護及管理","t":"（二）<mark>忠實及善良管理原則</mark>：於執行業務時，應盡<mark>善良管理</mark>人之責任，不得外流或洩漏客戶資料。（三）謹慎<mark>管理原則</mark>：在提供理財諮詢、協助客戶規劃投資組合及推介商品時，應平衡考量客戶委託規劃資產之成長性及其他因素，以客戶需求及其利益優先之原則執行之，不得以特定利益(如：佣金多寡)或不實廣告利誘客戶買賣特定商品，並應避免有誤導、詐欺、利益衝突或內線交易之行為。"}},{"id":"111-37","y":111,"n":37,"m":6,"q":"本行家庭財富管理客戶貴賓權益優惠服務，於客戶申請建檔後，每（　）定期重新檢視客戶資格條件，符合資格者始依客戶類別更新優惠註記及適用優惠項目。","o":["1個月","3個月","6個月","1年"],"a":2,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第三節 財富管理戶優惠","t":"參、<mark>財富管理客戶優惠項目</mark>一、本行每年1月及7月依客戶於本行總資產(最近六個月)、信託資產(最近六個月)及理財貢獻度(最近一年或兩年)，重新計算個人財管戶及家庭財管戶之資格，並更新客戶之<mark>優惠註記及</mark>項目如表一及表二。另每年定期函布「<mark>財富管理客戶</mark>專屬權益項目一覽表」，並揭露於官網(首頁/個人金融/<mark>財富管理</mark>/<mark>財富管理</mark>業務/<mark>財富管理貴賓權益</mark>)提供查詢。"}},{"id":"111-38","y":111,"n":38,"m":6,"q":"有關財富管理客戶申請作業，下列敘述何者錯誤？","o":["個人財管戶係採申請制","家庭財管戶之主戶限20歲(含)以上之客戶","家庭財管戶之主戶限1名，從戶至多10名","初次申請時，至少須申請主戶及1名從戶始得成立，且同一客戶僅能申請成為一個家庭財管戶之主戶或從戶"],"a":0,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第三節 財富管理戶優惠","t":"二、家庭財管戶：<mark>採申請制</mark>，限本行個人客戶申請，成員區分為主戶及從戶，每一個家庭財管戶主戶限1名，從戶至多10名，初次申請時，至少須申請主戶及1名從戶始得成立，且同一客戶僅能申請成為一個家庭財管戶之主戶或從戶，主戶及從戶的申請作業如下："}},{"id":"111-39","y":111,"n":39,"m":7,"q":"客戶申辦各項理財商品交易時，銷售人員應依各商品相關作業規範確認各項文件是否徵取完備，惟理財人員不得擔任下列何項工作？","o":["信託交易之招攬人員","開戶作業核對親簽人員","投資型保單之招攬人員","以上皆不得擔任"],"a":1,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(六)提供個人電子設備(包括但不限於平板電腦及手機等)予客戶登入網路銀行辦理交易。二、理財業務人員不得擔任下列人員：(一)開戶、帳戶及客戶基本資料、自動化設備申請、變更或掛失等業務之核對印鑑及<mark>核對親簽人員</mark>。"}},{"id":"111-40","y":111,"n":40,"m":7,"q":"依本行「金融消費者保護政策作業要點」規定，受理客戶提出之金融消費爭議申訴案件，本行應於收受申訴之日起（　）內為適當之處理，並將處理結果回覆客戶。","o":["15日","30日","60日","90日"],"a":1,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第四節 理財業務客訴處理","t":"二、申訴案情屬<mark>金融消費</mark>評議中心或主管機關承轉之案件，應<mark>依本行「金融消費者保護政策作業要點」</mark>之規定於申訴日起30日內<mark>將處理結果回覆客戶</mark>，以避免客戶向<mark>金融消費</mark>評議中心申請評議，影響本行形象，如客戶拒不接受本行建議之解決方案，營業單位仍應持續與客戶謀求合理解決方案，並追蹤處理進度直至結案。"},"x":"金融消費爭議申訴應於收受之日起 <b>30 日</b>內處理並回覆。","lo":1},{"id":"111-41","y":111,"n":41,"m":5,"q":"本行商品風險等級分類原則應依據個別商品或投資組合特性，如商品設計之複雜度、風險高低程度、現金流量方式、投資地區市場風險、商品期限、保本程度、價格波動程度等因素，經分析評估，將其風險等級分為","o":["三","四","五","六 級"],"a":2,"ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"參、<mark>商品風險等級</mark>之<mark>分類原則</mark>一、本行<mark>應依據個別商品或投資組合特性，如商品設計之複雜度、風險高低程度、現金流量方式、投資地區市場風險、商品期限、保本程度、價格波動程度等因素，經分析評估，將其風險等級分為五</mark>級，該<mark>風險等級</mark>由低至高依序為「低度、中低、中度、中高、高度」。"}},{"id":"111-42","y":111,"n":42,"m":5,"q":"有關未成年辦理充分瞭解客戶(KYC)作業規範，下列敘述何者正確？<br><span class=\"it\">A.</span> 「本人確認收執資料表影本壹份」欄位由未成年人自行簽收<br><span class=\"it\">B.</span> 未滿7歲未成年人之投資屬性不得為最高風險等級「積極型」<br><span class=\"it\">C.</span> 資料表內容應依據未成年人本身之資料填答<br><span class=\"it\">D.</span> 若法定代理人之一無法親簽，應出具法人授權書","o":["AB","BC","AC","BD"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"1.客戶為<mark>未成年人</mark>(1)填寫自然人<mark>資料表內容</mark>A.限制行為能力人(滿7歲以上之<mark>未成年人</mark>)：自然人<mark>資料表內容應依</mark>其<mark>本身之資料</mark>親自填答，若限制行為能力人無法獨立填寫自然人資料表時，得由<mark>法定代理人</mark>依限制行為能力<mark>人本身之資料</mark>協助其完成填答。B.無行為能力人(<mark>未滿7歲未成年人</mark>)：自然人<mark>資料表內容</mark>由<mark>法定代理人</mark>依無行為能力<mark>人本身之資料</mark>代為填答。另投資經驗之答案限為「無任何投資經驗」及「無經驗」，並控管<mark>投資屬性不得為最高風險等級「積極型」</mark>。(2)「客戶簽名」欄位：A.限制行為能力人：<mark>由未成年人本</mark>人親簽。B.無行為能力人：由<mark>法定代理人</mark>代為簽名，且並於緊接處註明「○○○代（簽）」。(3)自然人資料表<mark>法定代理人</mark>欄位，父母雙方皆應親簽，若其中之一（例如父親或母親）<mark>無法親簽</mark>時<mark>，應出具</mark>「<mark>法定代理人授權書(KYC</mark>作業用)」(如"}},{"id":"111-43","y":111,"n":43,"m":5,"q":"下列何者之投資屬性得為最高風險等級「積極型」？","o":["視覺障礙及不識字客戶","持有全民健康保險重大傷病證明之客戶","無投資經驗之客戶","以上皆不得為「積極型」"],"a":3,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"二、投資屬性限制：(一)為保護「無投資經驗」、「弱勢」客戶(視覺障礙及不識字或持有全民健康保險重大傷病證明客戶)及辦理提問表後評估有1項弱點之客戶，避免其投資風險等級過高商品，將控管其投資屬性不得為最高風險等級<mark>「積極型」</mark>。"}},{"id":"111-44","y":111,"n":44,"m":1,"q":"下列敘述何者錯誤？","o":["「自然人專業投資人1」屬境內客戶應提供等值新臺幣3,000萬元以上之財力證明","「自然人專業投資人1」屬境外(OBU)客戶應提供等值美金50萬元以上之財力證明","「自然人專業投資人1」屬境外(OBU)客戶應提供等值美金100萬元以上之財力證明","以上皆非"],"a":1,"ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第二節 自然人專業投資人申請作業","t":"(一)<mark>自然人專業投資人1財力證明</mark>標準及認列範圍如下：1.<mark>財力證明</mark>標準：(1)境內客戶：<mark>提供等值</mark>新臺幣3,00<mark>0萬元以上之財力證明</mark>。(2)<mark>境外(OBU)客戶</mark>：<mark>提供等值美金</mark>10<mark>0萬元以上之財力證明</mark>。"}},{"id":"111-45","y":111,"n":45,"m":7,"q":"理財業務人員得擔任下列何者人員？","o":["充分瞭解客戶(KYC)評估人員","客戶基本資料變更之核對親簽人員","網路銀行申辦之核對親簽人員","以上皆不得擔任"],"a":3,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(六)提供個人電子設備(包括但不限於平板電腦及手機等)予客戶登入網路銀行辦理交易。二、理財業務人員<mark>不得擔任</mark>下列人員：(一)開戶、帳戶及客戶基本資料、自動化設備申請、變更或掛失等業務之核對印鑑及核對親簽人員。"}},{"id":"111-46","y":111,"n":46,"m":5,"q":"未成年人辦理首次充分瞭解客戶(KYC)作業可透過下列何種方式？","o":["第e行動","臨櫃","遠程視訊櫃員機","以上皆可"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"1.「<mark>未成年人</mark>」<mark>辦理首次</mark>KYC作業。2.「受成年輔助宣告」(係指司法院「受成年監護、輔助宣告」資料庫查詢結果為「受輔助宣告」)及「存款警示帳戶」之客戶<mark>辦理首次</mark>或變更KYC作業。"},"lo":2},{"id":"111-47","y":111,"n":47,"m":8,"q":"依本行作業規定，保費資金來源經確認來自下列何者時，應由保險代理人處辦理電訪作業(貸款衍生人身保險-房貸戶及無解約金人身保險商品不適用)？","o":["定存中途解約","保單解約","保單借款","定存解約利息免打折"],"a":1,"ci":{"b":"理財篇","c":"第一章 通則","s":"第五節 個人資料保護及管理","t":"(二)<mark>保險代理</mark>業務：1.受理<mark>保險商品</mark>申購交易之PS1及PS2須為具備該項<mark>保險商品</mark>招攬資格且完成證照登錄者。2.PS1為必填欄位，招攬/協銷人員 請書方式辦理","延時交易係於次一營業日辦理下單作業"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(四)<mark>可受理之投資標的</mark>：國內/境外基金；惟海外債、特別股、國內結構債、連動債、國內/境外ETF<mark>及額度控管基金</mark>申購、神基妙算、金速配、生生不息等業務或其他特殊基金等不受理延時交易。"}},{"id":"112-2","y":112,"n":2,"m":1,"q":"本行「神『基』妙算效率投資法」業務，下列敘述何者錯誤？","o":["受理金如意(68)綜合管理帳戶、iLEO(57)數位帳戶之母基金或子基金繼承申請，無須先終止本業務","本業務母基金及子基金之投資標的代號後3碼為「560」","母基金被清算或合併時，本業務之投資組合即自動終止","母基金得中途轉換，惟限以「全部轉換」方式辦理"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(二十四)<mark>受理金如意(68)綜合管理帳戶、iLEO(57)數位帳戶之母基金或子基金繼承申請，須先終止本業務</mark>，系統將於次日自動變更母基金及子基金投資標的代號後3碼為「000」後，始可執行「金如意/<mark>iLEO</mark>帳戶<mark>基金繼承</mark>登錄（T168）」。"}},{"id":"112-3","y":112,"n":3,"m":10,"q":"有關信託帳戶之轉籍作業，下列敘述何者錯誤？","o":["方式可分為「整戶批次轉籍」或「全部/部份投資標的轉籍」","EF、EH系列之境外ETF不得辦理「全部/部分投資標的轉籍」","線上開立之信託(889)帳戶得辦理「整戶批次轉籍」及「全部/部分投資標的轉籍」","如投資標的尚有在途未回報資料者，無法辦理「全部/部分投資標的轉籍」"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.理財存摺（88）帳戶<mark>投資標的轉</mark>入其他理財存摺（88）帳戶2.理財存摺（88）帳戶<mark>投資標的轉</mark>入金如意（68）綜合管理帳戶(註2)申請書用紙帳戶轉籍申請書兼登錄單信託轉籍申請書兼登錄單【信051】交易代號移出行：帳戶移出設定交易(953T)移入行：帳戶移入夜間批次設定交易(983T)移出行：委託人資料內容變更登錄(T300)移入行：信託基金轉籍登錄(T830)註1：金如意（68）綜合管理帳戶之<mark>整戶批次轉籍</mark>請參閱營運業務處2012/07/11營管字第00306號函辦理。註2：金如意（68）綜合管理帳戶不得單獨辦理信託商品之<mark>全部/部分投資標的轉籍</mark>。註3：<mark>線上開立之信託(889)帳戶</mark>不<mark>得辦理「整戶批次轉籍」及「全部/部分投資標的轉籍」</mark>。註4：EF、EK、EH及EG系列之境外ETF及國外股票不<mark>得辦理「全部/部分投資標的轉籍」</mark>。"}},{"id":"112-4","y":112,"n":4,"m":3,"q":"近年來爛尾樓事件頻傳，引起民眾對於預售屋規範的重視，有關本行以信託方式辦理「預售屋履約擔保機制」之「不動產開發信託」，下列敘述何者錯誤？","o":["倘建商及其關係人於興建基地並未持有自有土地，仍可以「不動產開發信託」方式辦理","承作前營業單位應撰寫建商之「信用評估報告」","建商應至少每年提供經會計師查核簽認之報告","買方所繳之預售價金信託專戶可用來支付建案營建費用"],"a":0,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"4.信託財產管理及運用方法(信託契約第六條第三項)：勾選是否同意該不動產買賣辦理過戶程序中，賣方所涉及之土地增值稅及其他相關稅捐，本行於收到稅單後，逕由信託專戶支付。勾選處須對買賣雙方說明，確實勾選勿遺漏。"}},{"id":"112-5","y":112,"n":5,"m":6,"q":"本行考量部分國外債券天期較長以致風險較高的特性，若客戶(非屬專業投資人或高資產客戶)臨櫃申購國外債券，系統會先檢核交易當日客戶年齡，加上投資該檔債券距離到期日之剩餘年期，若兩者相加大於或等於多少時，即無法申購？","o":["85","80","70","65"],"a":0,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"(四)｢推介聲明書｣:依信託篇第二章第一節相關規定。(五)｢<mark>國外債券</mark>交易聲明書｣:<mark>考量部分債券天期較長以致風險較高的特性，若客戶臨櫃申購國外債券，系統先檢核交易當日客戶年齡，加上投資該檔債券距離到期日之剩餘年期，兩者相加</mark>小於85，則繼續執行交易。<mark>若兩者相加大於或等於</mark>85，則端末提示列印「<mark>國外債券</mark>交易聲明書」。"}},{"id":"112-6","y":112,"n":6,"m":5,"q":"評估人員依「高齡客戶KYC關懷提問表」詢問或觀察客戶，發現客戶有認知障礙、無法清楚表達、說詞不一、不願意承擔投資風險、全程由陪伴者主導之其中一項狀況，下列敘述何者正確？","o":["婉拒客戶繼續辦理KYC作業","得繼續受理客戶辦理KYC作業，惟系統控管其投資屬性為「保守型」","得繼續受理客戶辦理KYC作業，惟系統控管其投資屬性不得為「積極型」","若客戶於「高齡客戶KYC關懷提問表」簽名同意，得繼續受理客戶辦理KYC作業"],"a":0,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"（二）數位通路：由客戶自行線上填答。四、提問表結果：（一）客戶有認知障礙、無法清楚表達、說詞不一、不願意承擔投資風險、全程由陪伴者主導相關問答，或符合2項(含)以上弱點指標時：<mark>婉拒客戶繼續辦理KYC作業</mark>。"}},{"id":"112-7","y":112,"n":7,"m":5,"q":"李先生想幫兒子李大寶(現年10歲)投資定期定額基金，有關李大寶辦理充分瞭解客戶(KYC)作業規範，下列敘述何者正確？<br><span class=\"it\">A.</span> 首次限臨櫃書面方式辦理<br><span class=\"it\">B.</span> 得由李先生依自身投資經驗代為填答資料表<br><span class=\"it\">C.</span> 「客戶簽名」欄位由李大寶親簽<br><span class=\"it\">D.</span> 「本人確認收執資料表影本壹份」欄位由李大寶簽收<br><span class=\"it\">E.</span> 若法定代理人之一無法親簽，應出具法定代理人授權書","o":["BCE","ACE","ADE","ABC"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"附表1-6，英文版本如附表1-7)，授權另一<mark>法定代理人</mark>全權代理行使權責。(4)<mark>「本人確認收執資料表影本壹份」欄位</mark>須由<mark>法定代理人之</mark>任一人簽收。(5)未成年人客戶之鍵檔名單，得透過「自然人未成年/高齡KYC月報表」查詢。"}},{"id":"112-8","y":112,"n":8,"m":6,"q":"自然人客戶欲申請本行專業投資人，提供以下其最近三年內且非最近一個月內申購之商品交易文件作為具備金融商品交易經驗證明，哪些符合本行第一類金融商品？<br><span class=\"it\">A.</span> 國外債券(信評A-/A3)<br><span class=\"it\">B.</span> 風險等級RR5境外基金<br><span class=\"it\">C.</span> 國外股票<br><span class=\"it\">D.</span> 境外結構型商品<br><span class=\"it\">E.</span> 非槓桿型ETF","o":["AD","DE","BC","CD"],"a":3,"ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第二節 自然人專業投資人申請作業","t":"2.<mark>金融商品交易經驗</mark>：(1)客戶需具備三項(含)以上<mark>金融商品交易經驗</mark>，且至少包含一項<mark>第一類金融商品</mark>；各項<mark>交易經驗</mark>須為<mark>最近三年內</mark> 由，要求持卡人負擔相關費用"],"a":0,"ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第五節 專業投資人申請變更為「一般客戶」作業","t":"二、重要事項說明(五)您如欲接受本行提供之專業投資人適用之金融商品及服務，應依「境外結構型商品管理規則」、「銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法」、「信託業營運範圍受益權轉讓限制風險揭露及行銷訂約管理辦法」及「金融消費者保護法」等主管機關相關規範以及本行相關規定，<mark>以書面申請</mark>為專業投資人，並經本行審核通過後，始成為本行專業投資人。"},"x":"特約商店分期額度不足，並非「限以書面申請臨時調高額度」。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"112-13","y":112,"n":13,"m":2,"q":"有關「特定金錢信託投資外國指數股票型基金(ETF)及國外股票」業務，下列敘述何者正確？","o":["可以定期定額方式承作","營業單位下單圈存後一定可成交","不受理投資標的之轉換","香港掛牌ETF及股票最低投資金額每筆最少等值港幣/人民幣2,000元"],"a":2,"ci":{"b":"信託篇","c":"第二章第二節 特定金錢信託投資境外結構型商品境內結構型商品業務處理細則","s":"第二節 特定金錢信託投資境外結構型商品","t":"(三)受理贖回時間1.EC系列:不受理申購，僅受理贖回申請，於臨櫃透過單一入口網站之「ETF限價即時下單系統」辦理，另可於第e個網、第e行動及iLeo通路辦理。其餘各項規定依第二章第一節、玖、特定金錢信託投資外國指數股票型基金（ETF）及國外股票，比照EF、EG及EH系列。"}},{"id":"112-14","y":112,"n":14,"m":1,"q":"有關手續費後收型基金，下列敍述何者錯誤？","o":["申購基金時不須支付申購手續費，俟贖回時，再依實際持有期間長短收取遞延申購手續費","單筆及定期定額皆可受理，惟基金公司另有規定者，從其規定","一般客戶年齡加計收取產品遞延申購手續費年限以不超過70(含)為限","手續費後收型國內基金之契約註記為「BC00」"],"a":2,"ci":{"b":"講義：理財業務標準作業流程－信託商品","c":"第19頁","s":"","t":"高齡客戶申購「手續費後收型基金」為避免年齡標籤化疑慮，自2025年11月3日起取消高齡客戶申購「手續費後收型」年齡限制(「<mark>客戶年齡加計</mark>免收取遞延手續費/產品約定到期年限，<mark>以不超過</mark>『80』為限」)，惟臨櫃受理時新增「國內/境外手續費後收型基金風險預告書」，向高齡客戶揭露商品風險特性以符合規範。✽修正前後對照表2025/10/29信劃字第00055號18"}},{"id":"112-15","y":112,"n":15,"m":4,"q":"有關本行「珍愛美滿傳承信託」業務，下列敘述何者錯誤？","o":["委託人擔任定期定額給付受益人","定期定額給付一律不得由本行代為辦理新臺幣結匯","兼具安養給付及財富傳承功能","為外幣金錢信託契約"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"二、茲就下列質物明細表所載受益權，請貴行／公司於收到本通知書後次一營業日<mark>代為辦理</mark>贖回作業或處分，並將款項扣除信託報酬、手續費、相關費用及稅負後，於元範圍內(不得超過最高限額質權金額)給付予本行。"}},{"id":"112-16","y":112,"n":16,"m":5,"q":"有關充分瞭解客戶(KYC)作業評估人員之職責與資格，下列敘述何者錯誤？","o":["由具信託業務人員資格(已登錄信託公會)之非理財業務人員擔任","評估人員與信託商品申購/轉換交易之招攬、協銷人員不得為同一人","負責向客戶解說及確認資料表內容由客戶親填親簽","客戶因故無法臨櫃辦理KYC作業，外訪時得由具信託管理人員資格(已登錄信託公會)之主管擔任評估人員"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"伍、KYC<mark>評估人員</mark>(下稱<mark>評估人員</mark>)資格及職責一、資格：（一）<mark>評估人員</mark>應由具信託業務人員資格(已登錄信託公會)之非理財業務人員擔任，為利作業順暢，以信託作業經辦為主要辦理人員；且<mark>評估人員與信託商品申購/轉換交易之招攬人員不得為同一人</mark>。"}},{"id":"112-17","y":112,"n":17,"m":6,"q":"本行法人專業投資人A公司欲申請為高資產客戶，下列敘述何者正確？","o":["A公司總資產合計須達等值新臺幣一億元以上符合財力標準","A公司可指定與原約定專業投資人「授權辦理交易之人」不同之人擔任高資產法人戶「授權辦理交易之人」","分行於A公司提示之財力證明文件影本加蓋「與正本核對無誤」確認章，若為本行文件得以加蓋分行腰形章替代之","總行審查建檔完成後，請A公司於「高資產客戶申請確認收執簽回聯」簽章確認後分行歸檔備查"],"a":2,"ci":{"b":"理財篇","c":"第四章 高資產客戶作業規範","s":"第四節 高資產客戶覆審作業","t":"三、作業流程(一)營業單位應盡合理調查之責任，於覆審相關<mark>財力證明文件影本加蓋「與正本核對無誤」</mark>之確認章後<mark>，若為本行文件</mark>則<mark>以加蓋分行腰形章替代之</mark>，並至私人銀行系統辦"}},{"id":"112-18","y":112,"n":18,"m":8,"q":"有關本行遠距投保業務實務作業，何者為是？","o":["客戶在錄影過程如有Line語音電話進線，不會中斷錄影","完成要保文件並上傳(T日)，應於次一營業日前(T+1)完成主管放行","遠距投保繳費方式僅限以要保人帳戶扣繳保險費","案件因故遭退回時，營業單位應於補件截止日前完成補件，不必再由主管完成放行"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"2.主管代號：必須輸入4.營業單位當日如因故無法辦理信託日終結帳作業，以主管授權方式完成會計帳務結帳設定時<mark>，應於次一營業日</mark>至本行報表查詢系統（On-Demand）分行日報中列印「科目別交易彙計查詢單」(報表代號TF-60A)，作為結帳依據。"},"x":"遠距投保：完成要保文件上傳（T 日）後，應於次一營業日（T+1）前完成主管放行。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"112-19","y":112,"n":19,"m":9,"q":"有關信用卡發卡及推廣業務，下列敘述何者錯誤？","o":["可以在辦卡、核卡、開卡、預借現金及動用循環信用時，給予申請人、持卡人或其他第三人贈品或獎品等優惠","禁止對學生行銷","行銷人員不得在街頭(含騎樓)推銷信用卡","禁止以「快速核卡」、「以卡辦卡」、「以名片辦卡」等行銷行為為訴求"],"a":0,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第二節 理財業務人員行為之管理","t":"三、依本行財富管理業務經營政策之規定，對於現職理財業務人員應定期或不定期檢視其信用狀況，營業單位於接獲理財業務處函文通知辦理理財業務人員信用狀況檢視作業時，應儘速通知理財業務人員提供財團法人聯合徵信中心之「當事人綜合信用報告」，並由個金(理財)副理確實依IMVP系統之問卷填報查核結果。理財業務處對於授信或票信異常，信用借款、信用卡<mark>循環信用</mark>及<mark>預借現金</mark>金額偏高，或有逾期繳款等情形者，將不定期通知營業單位增加查核頻率或建請調整職務。"},"x":"不得於辦卡、核卡、開卡、預借現金及動用循環信用時給予申請人、持卡人或第三人贈品或優惠。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"112-20","y":112,"n":20,"m":9,"q":"有關信用卡消費額度之共用，下列敘述何者錯誤？","o":["客戶申請信用卡，其每卡額度可依客戶要求高於該客戶之信用消費總額度","正卡與附卡共用同一信用消費額度","客戶於不同時間申請不同種類之信用卡，與原卡共用同一額度者，得免重新辦理徵信作業","雙幣信用卡之新臺幣及約定結付外幣(等值新臺幣)共用新臺幣單一信用消費總額度"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"五、投資金額限制每月以信用卡扣款投資國內外基金之限額，以不超過信用卡原額度之50%為限且最高不得逾新臺幣100萬元(不含手續費，正附卡合併計算)。"},"x":"每卡額度不得高於該客戶之信用消費總額度。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"112-21","y":112,"n":21,"m":1,"q":"客戶王君以定期不定額方式投資境外基金，基準扣款金額為新臺幣5,000元，加/減碼金額為新臺幣1,000元，假設扣款日前一天之投資標的最新淨值相較基準淨值跌幅達11%，則調整後扣款金額為","o":["新臺幣3,000元","新臺幣6,500元","新臺幣7,000元","新臺幣7,500元"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"3.定期不定額投資：扣款日之前一營業日本行已取得該基金之最新淨值，相較於「基準淨值」之漲/跌幅每達5%，扣款金額則依「基準扣款金額」減除客戶自行設定之「減碼金額」/加上客戶自行設定之「加碼金額」予以調整，惟臺幣投資之調整後扣款金額不得低於新臺幣3<mark>,000元</mark>(外幣投資另從其最低扣款金額規定，同定期定額投資之規定)，最高則以設定之「基準扣款金額」的兩倍為限。"}},{"id":"112-22","y":112,"n":22,"m":10,"q":"有關營業單位受理委託人申請基金交易時，各項申請書兼登錄單之人員資格限制何者錯誤？","o":["「核章」人員得兼為「操作員」","「操作員」限派令簿上指派為「信託作業經辦」或「兼任信託作業經辦」者","「操作員」須具備信託業務人員資格","行員得擔任本人信託相關交易之「核章」及「操作員」"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(九)客服人員擔任本項服務之「受理人員」與<mark>「操作員」</mark>均須具備信託業務人員資格且得為同一人，<mark>「操作員」</mark>則免於派令簿上指派為「信託作業經辦」或「兼任信託作業經辦」。另，行員不<mark>得擔任本人信託相關交易之「操作員」</mark>，並宜避免擔任「受理人員」。"}},{"id":"112-23","y":112,"n":23,"m":2,"q":"有關本行境外ETF業務，下列敘述何者錯誤？","o":["交易標的包含美國掛牌ETF及香港掛牌ETF","EF及EH系列得受理單筆及定期定額投資","美國掛牌ETF每筆最低投資金額為等值美金2,000元，並以「一股」為累加單位","一般客戶每筆買進(申購)手續費率為2%，最低手續費依各交易幣別而定：美金18元／人民幣100元／港幣100元"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.單筆投資：美國掛牌ETF及股票為等值美金2,000元，並以「一股」為累加單位；香港掛牌ETF及股票為港幣/人民幣12,000元，並以「一手」(最低交易單位)為累加單位。"}},{"id":"112-24","y":112,"n":24,"m":1,"q":"現行本行辦理特定金錢信託投資國內／境外基金業務，下列敘述何者正確？","o":["贖回撥款帳號以客戶本人或配偶帳戶均可受理","投資扣款帳號限客戶本人之存款帳戶","可受理以現金方式進行投資","可受理以他行信用卡扣款投資境外基金"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"8.贖回撥款/收益分配帳號：以委託人本人於本行開立之新臺幣<mark>存款帳戶</mark>（含聯行）為限。9.定期(不)定額<mark>投資扣款帳號</mark>：以委託人本人在本行開立之新臺幣<mark>存款帳戶</mark>（含聯行）為限。"}},{"id":"112-25","y":112,"n":25,"m":10,"q":"有關OBU外幣信託業務，下列敘述何者錯誤？","o":["以OBU外幣資金投資境外基金，科目別為「04」","委託人辦理「OBU外幣信託」，需開立金如意綜合管理「68」帳戶","約定之扣／入款OBU外匯存款帳戶限與信託帳戶帳務行歸屬同一分行","委託人以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"(三)<mark>OBU外幣信託</mark>以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請。(四)受理申購私募基金之委託人為依境外基金管理辦法第五十二條第一項第二款符合主管機關所定條件之自然人、法人或基金。"}},{"id":"112-26","y":112,"n":26,"m":10,"q":"下列何者非屬疑似洗錢或資恐之信託交易態樣？","o":["設立信託帳戶時能提出充分的理由或動機","不活躍信託帳戶突有達特定金額以上資金出入，且又迅速移轉者","客戶簽訂信託契約後即迅速終止契約，相距時間不久且無正當原因者","客戶突有達特定金額以上資金信託者"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"2.交易資料分別產生於「帳戶行」及「交易行」。2DF01B(交易行)態樣第5項DF02不活躍<mark>信託帳戶</mark>突有達特定金額以上資金出入，且又迅速移轉者。"}},{"id":"112-27","y":112,"n":27,"m":10,"q":"有關營業單位受理客戶免填交易申請書，下列敘述何者正確？<br><span class=\"it\">A.</span> 由「操作員」依客戶口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙<br><span class=\"it\">B.</span> 「核章」人員係由主管授權得查詢印鑑暨影像管理系統之人員擔任，並得兼為「操作員」<br><span class=\"it\">C.</span> 免填申請書交易序號有效期限為三個營業日<br><span class=\"it\">D.</span> 主管須於認證欄之「免填申請書交易序號」前首加蓋私章","o":["BD","BCD","ABD","ABCD"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)受理委託人<mark>免填交易申請書</mark>作業：係指<mark>營業單位</mark>「受理人員」依委託人<mark>口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙</mark>，「受理人員」覆誦委託人<mark>申請內容，</mark>再請委託人確認<mark>申請內容</mark>無誤後蓋妥信託帳戶留存印鑑，交<mark>「核章」人員</mark>核章及<mark>「操作員」</mark>辦理交易認證登錄之作業。"}},{"id":"112-28","y":112,"n":28,"m":1,"q":"客戶與本行完成信託資金定期(不)定額二次扣款約定後，指定扣款日因存款不足致交易不成功時，於扣款當日下午（　）前存入足夠扣款金額，本行將執行二次扣款作業。","o":["1時","1時30分","3時","3時30分"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"貳拾參、<mark>定期(不)定額二次扣款作業</mark>一、作業性質「國內及境外基<mark>金定期(不)定額二次扣款</mark>」作業，係指委託人以<mark>定期(不)定額</mark>方式投資國內及境外基金(以下簡稱「投資標的」)，於<mark>指定扣款日</mark>零時未扣款<mark>成功時，</mark>授權本行於<mark>指定扣款日</mark>下午1時執行第<mark>二次扣款</mark>之作業。"}},{"id":"112-29","y":112,"n":29,"m":1,"q":"有關本行定期(不)定額日日扣投資國內/境外基金功能，下列敘述何者錯誤？","o":["每月1~28日可任選最多28日作為指定扣款日","同一投資標的自首次扣款失敗日起算，連續扣款失敗達3個月時，視同客戶終止該投資標的繼續扣款投資之約定","同一投資標的之各扣款日期，所約定之扣款方式均需一致","同一投資標的之各扣款日期，得約定不同之扣款金額"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"肆、定期定額投資一、每月1~28日任選，最多28日作為委託人指定扣款日，適逢非營業日則順延至次一營業日。二、委託人得就國內或境外基金之<mark>同一投資標的</mark>選擇<mark>不同之扣款</mark>日為多次扣款。"}},{"id":"112-30","y":112,"n":30,"m":1,"q":"有關本行「基金贖回再申購」約定功能，下列敘述何者正確？","o":["系統於贖回款項入帳後會自動執行圈存機制","贖回與再申購之標的不須為相同投資幣別","境外ETF可作為再申購之投資標的","貨幣型基金不可作為再申購之投資標的"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"6.境外<mark>貨幣型基金</mark>僅得為母基金之轉出或轉入<mark>投資標的</mark>，不受理新申購或加碼投資。(六)新申購之最低投資金額新臺幣500,000/美金20,000"}},{"id":"112-31","y":112,"n":31,"m":2,"q":"有關「第一商業銀行特定金錢信託投資國外債券及境外結構型商品銷售及集中度警示管理要點」，如信用評等對象同時擁有三家信用評等機構不同之信用評等者，信用評等之認定方式採下列何者？","o":["最優者","次優者","較低者","任一家皆可"],"a":0,"ci":{"b":"信託篇","c":"第二章第二節 特定金錢信託投資境外結構型商品境內結構型商品業務處理細則","s":"第二節 特定金錢信託投資境外結構型商品","t":"一、<mark>境外結構型商品</mark>依<mark>「第一商業銀行特定金錢信託投資國外債券及境外結構型商品銷售及集中度警示管理要點」</mark>辦理。二、境內<mark>結構型商品</mark>"}},{"id":"112-32","y":112,"n":32,"m":4,"q":"辦理有價證券信託-本金自益、孳息他益業務，依所得稅法第三條之四規定，信託存續期間所獲之股票股利及現金股利併入","o":["委託人","受託人","受益人","信託監察人 的所得課稅"],"a":2,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第三節 信託處作業程序","t":"202501版3-13第三章<mark>有價證券信託</mark>(二)交付證券集中保管事業保管之<mark>有價證券</mark>受託人自信託契約簽訂日起，至<mark>信託存續期間</mark>末日止，將各年度信託<mark>有價證券</mark>孳息分配於受益人。受託人將集保公司撥付<mark>之股票股利及現金股利</mark>分別轉<mark>入受益人</mark>之股票集保帳戶及其指定之信託利益分配帳戶。"}},{"id":"112-33","y":112,"n":33,"m":4,"q":"有關員工福利信託業務，下列敘述何者錯誤？","o":["限制員工權利新股得附有服務條件或績效條件等既得條件","員工持股信託業務信託資金的投資標的為上市、櫃公司股票(委託人服務公司或集團內的公司股票)","員工儲蓄信託業務信託資金可投資衍生性金融商品","員工儲蓄信託業務所交付的信託財產為員工每月薪資提存金及公司提撥的獎勵金"],"a":2,"ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託","t":"十、其他未盡事宜，悉依有關規定辦理。十一、<mark>員工儲蓄信託</mark>、員工持股信託與限制員工權利新股信託之異同項目<mark>員工儲蓄信託</mark>員工持股信託限制員工權利新股信託法律關係信託關係資金來源/信託財產企業公司獎勵金依發行辦法有(無)償發行之限制員工權利新股員工每月薪資提存金、年終獎金、紅利委託人之代理人儲蓄會／機構員工持股委員會發行公司受託人經主管機關核准辦理<mark>信託業務</mark>之銀行信託部門受益人同意加入<mark>員工儲蓄</mark>辦法之員工（自由參加）同意加入員工持股辦法之員工（自由參加）依發行辦法得獲配之員工投資方式長期投資-運用方式以滾入平均成本法之運用原則，定期定額或定期不定額長期投資-投資範圍銀行存款、國內外共同基金、國內外有價證券等上市、櫃股票(委託人服務公司或集團內的股票)限制員工權利新股股東會投票權之行使--由員工持股委員會指示受託人統一行使股東權利有表決權之股份，以發行公司指示受託人統一行使股東權利受益人終止信託契約條件離職、退休、解雇離職或已達既得條件"}},{"id":"112-34","y":112,"n":34,"m":2,"q":"下列何者為本行特定金錢信託投資國外債券可受理之交易對象？","o":["本行國際金融業務分行(OBU)具美國籍之自然人","具美國指標人士","同時具有中華民國國籍及美國國籍之自然人","以上皆不可受理"],"a":3,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券 第二部分 國外特別股","t":"一、具有中華民國國籍之自然人或在中華民國設立登記之法人。二、本行國際金融業務分行（OBU）之法人及自然人，惟具美國籍之自然人及註冊於美國境內之法人不受理申請。"}},{"id":"112-35","y":112,"n":35,"m":3,"q":"有關本行「不動產買賣價金信託」業務，下列敘述何者錯誤？","o":["信託管理費以三個月為一期","行員不得擔任自身相關信託交易之「核章」及「操作員」","信託契約簽約主體為買賣雙方","信託目的完成時點為契約標的物產權已完成登記予買方或買方指定之人名義"],"a":0,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"4.行員不得擔任自身相關信託交易之「核章」及「操作員」，並宜避免擔任「經辦人員」。5.不動產買賣價金信託業務主管須符合<mark>信託管理</mark>人員資格。"}},{"id":"112-36","y":112,"n":36,"m":4,"q":"下列對於本行家庭財富信託業務之敘述，何者錯誤？","o":["是一項結合了「個人理財計畫」、「家庭財產規劃」以及「信託」的工具","無中華民國國籍之外國人不可承作","信託契約一律定型化","委託人可以新臺幣或外幣交付信託財產"],"a":2,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託業務","t":"壹、通則一、業務性質家庭財富信託是一項結合了「個人理財計畫」、「家庭財產規劃」以及「信託」的工具，即委託人將信託財產信託予本行信託處（簡稱受託人），由本行依據每位客戶不同的信託目的與<mark>信託契約</mark>之約定，為受益人之利益或特定目的妥善管理、運用或處分其信託財產，以達成一般家庭之理財與信託服務需求；申言之，本行將委託人所交付之金錢，依不同信託目的、本金、孳息受益人之不同，運用於委託人所指定之投資工具，並規劃不同現金流量之金錢信託。"}},{"id":"112-37","y":112,"n":37,"m":6,"q":"有關高資產客戶作業規範，下列敘述何者錯誤？","o":["受理申請為高資產客戶前，須先確認客戶已具備本行有效期限內之專業投資人身分","自本行完成高資產客戶申請建檔之日起，每年辦理一次客戶財力覆審作業","自本行完成高資產客戶申請建檔之日起，每三年辦理一次客戶身分覆審作業","於客戶身分覆審時，除檢視財力外，須同時審認金融商品專業知識及交易經驗續符合資格條件"],"a":2,"ci":{"b":"理財篇","c":"第四章 高資產客戶作業規範","s":"第四節 高資產客戶覆審作業","t":"壹、覆審頻率一、為定期確認客戶是否續符合<mark>高資產客戶</mark>應具備之財力標準及資格條件，<mark>自本行完成高資產客戶申請建檔之日起，每</mark>年應<mark>辦理一次高資產客戶</mark>財力覆審，另<mark>客戶身分</mark>資格有效期限自<mark>完成高資產客戶申請建檔之日起</mark>兩年有效，屆期須重新辦理<mark>身分覆審作業</mark>："}},{"id":"112-38","y":112,"n":38,"m":6,"q":"本行「家庭財富管理戶」申請條件應符合下列何項？","o":["主戶與本行往來期間達6個月(含)以上","從戶限主戶之配偶、三親等以內之直系血親或直系姻親","主戶限18歲(含)以上自然人客戶","同一客戶得申請成為不同「家庭財富管理戶」之主戶或從戶"],"a":2,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第三節 財富管理戶優惠","t":"（一）申請條件及資格1.主戶：<mark>限18歲</mark>（含）以上之客戶。2.從戶：限主戶之配偶、二親等以內之直系血親或直系姻親，由主戶提出申請，經本行審核符合資格始生效力。"}},{"id":"112-39","y":112,"n":39,"m":7,"q":"理財業務人員因正常社交禮俗，且係偶發而無影響特定權利義務之虞收受客戶饋贈禮品或招待，於同一年度來自同一來源受贈財物超過新臺幣一萬元時應如何處理？","o":["填寫本行「理財業務人員/金融商品銷售人員收受贈品或招待申報表」向總行申報","向業務主管申報登記且經單位主管判斷是否合理而不影響單位之廉潔操守時可收受","交由配偶、直系血親以外之第三人收受","完全不得收受"],"a":1,"ci":{"b":"理財篇","c":"第一章 通則","s":"第五節 個人資料保護及管理","t":"2.不得與客戶有借貸款項、有價證券等不當資金往來或居間行為，以免違反法規或衍生財務糾紛。3.不得與客戶約定投資收益分享或損失分攤之承諾，亦不得對客戶直接或間接要求、期約或收受金錢、招待、餽贈或其他利益；屬正常社交禮俗，且係偶發而無影響特定權利義務之虞者，不在此限；惟市價超過新臺幣三千元，或同一年度來自同一來源受贈財物超過新臺幣一萬元，應<mark>向業務主管申報登記</mark>，<mark>且經單位主管判斷是否合理而不影響單位之廉</mark>節操守。業務人員亦不得以第三人名義為前述之行為，亦不得由第三人接受餽贈或其他利益再移轉，至第三人之範圍包含但不限於配偶、直系血親或其他親屬。"}},{"id":"112-40","y":112,"n":40,"m":7,"q":"理財業務人員得擔任下列何者人員？","o":["充分瞭解客戶(KYC)評估人員","客戶申請存摺掛失之核對親簽人員","信託商品一般單筆投資申請書之核章人員","客戶保險要保書之核對親簽人員"],"a":3,"ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(六)提供個人電子設備(包括但不限於平板電腦及手機等)予客戶登入網路銀行辦理交易。二、理財業務人員不得擔任下列人員：(一)開戶、帳戶及客戶基本資料、自動化設備申請、變更或掛失等業務之核對印鑑及<mark>核對親簽人員</mark>。"}},{"id":"112-41","y":112,"n":41,"m":5,"q":"本行系統控管30日內重新辦理KYC且投資屬性提升之客戶(若T日辦理KYC)，","o":["65歲(含)以上T+2日/65歲以下T+1日","65歲(含)以上T+1日/65歲以下T+1日","65歲(含)以上T+2日/65歲以下T日","65歲(含)以上T+1日/65歲以下T日 可申購/轉換較高風險等級信託商品"],"a":0,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"投資風險。3.前項客戶如為30日內重複辦理KYC作業，已確認客戶勾選變更理由合理性，並及時關懷客戶。（四）主管放行後，即更新「客戶投資風險屬性」、「KYC最新異動日期」、「KYC有效日期(信託商品適用)」及「KYC評估人員」欄位，客戶得依其投資風險屬性申購商品風險等級適配之商品。惟客戶屬30日內重新辦理KYC且投資屬性提升，系統將延後更新「客戶投資風險屬性」(<mark>65歲以下</mark>為「次日(T+1)」更新；<mark>65歲(含)以上</mark>為「後日(T+2)」更新)，避免客戶短期提升風險屬性即申購/轉換較高風險等級信託商品。"}},{"id":"112-42","y":112,"n":42,"m":5,"q":"身心障礙客戶辦理充分瞭解(KYC)作業時如有見證人需求，須請幾名見證人協助？","o":["1名","2名","3名","由客戶決定"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"2.若客戶為<mark>身心障礙</mark>者(如:肢體障礙、視覺障礙、聽覺障礙、心智障礙或其他不便者)，請依「<mark>身心障礙客戶辦理充分瞭解</mark>客戶<mark>(KYC)作業</mark>流程及應注意事項」(附錄-2)辦理，客戶<mark>如有見證人需求，須請</mark>二<mark>名見證人協助</mark>，可由其親友、社福機構人員、KYC評估人員/建檔人員/覆核主管以外之行員擔任。"}},{"id":"112-43","y":112,"n":43,"m":6,"q":"自然人客戶申請本行專業投資人提供之財力證明文件認列範圍，下列何者錯誤？","o":["客戶最近一期對帳單","本人不動產鑑價總額扣除該不動產為擔保之貸款餘額","本人、配偶及未成年子女最近一個月內銀行存摺","客戶最近一個月內證券存摺之上市櫃股票且以最近一日收盤價計算價值"],"a":2,"ci":{"b":"理財篇"," ":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託","t":"受理對象主要為全額交割股以外之上市、上櫃公司(以下統稱機構），投資範圍主要係<mark>委託人服務公司或集團內已上市</mark>、櫃<mark>關係企業之股票</mark>，<mark>信託資金</mark>設立信託專戶管理運用，並設立員工分戶明細帳，紀錄個別員工每月之公、自提存金、所持股數。"}},{"id":"113-3","y":113,"n":3,"m":4,"q":"下列有關孳息他益型有價證券信託特色之敘述，何者正確？","o":["信託期間，孳息受益人仍然保有信託財產的掌控權","透過信託規劃，達到遺產分配及財產移轉之效果","交付信託之股票可為未上市(櫃)公司之股票，且已設定質權予本行亦可再交付信託","信託財產為股票者，由委託人與受託人共同約定行使股票表決權之方式"],"a":2,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第一節 通則","t":"2.孳息他益型有價證券信託之特色：(1)信託財產為股票者，其表決權之行使，得與其他信託財產及信託業自有財產分別計算，故委託人保留運用決定權，其股票表決權之行使不受影響。(2)信託<mark>股票可為</mark>上市櫃公司及未上市櫃公司，即使該股票已於本行<mark>設定質權亦可再交付信託</mark>。(3)透過信託規劃，達到贈與及財產移轉之效果。(4)信託期間，委託人仍然保有信託財產的掌控權。"}},{"id":"113-4","y":113,"n":4,"m":2,"q":"下列有關特定金錢信託投資國外有價證券(不含境外結構型商品)之敘述，下列何者正確？","o":["信用評等機構之採用僅限 S&amp;P、Moody’s、Fitch 及中華信用評等公司等四家","客戶為非專業投資人時，發行機構(或保證機構)及債券信用評等須符合 A- 等級以上","客戶為高資產客戶時，發行機構(或保證機構)及債券信用評等須符合 B- 等級以上","不論銷售對象之客戶屬性，一律不得投資於次順位債券"],"a":1,"ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第五節 專業投資人申請變更為「一般客戶」作業","t":"一、<mark>發行機構或保證機構</mark>之長期債務<mark>信用評等</mark>及境外結構型商品之發行評等，應符合經本會核准或認可之<mark>信用評等</mark>機構評等達一定<mark>等級以上</mark>者。"}},{"id":"113-5","y":113,"n":5,"m":10,"q":"現行信託資金繼承人以原狀態繼承之作業，下列何者為非？","o":["應由繼承人共同出具委託書委任其中 1 人作為信託帳戶持有人","印鑑卡簽名處得由受任人簽名","印鑑卡仍需留存全體繼承人之印鑑","信託帳戶經辦理繼承程序後，仍可受理申購或贖回交易"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"3.交易處理程序：(1)繼承人欲辦理信託商品贖回執行完交易代號T250事故代號06繼承後，辦理信託資金贖回登錄(交易代號：T400/T404)，待贖回款撥入被繼承人原約定之贖回撥款帳號後，即可辦理理財存摺帳戶結清交易，惟「信託商品贖回登錄單」需由全體繼承人蓋章。(2)繼承人以原狀態繼承：A.<mark>繼承程序</mark>完成後，繼承人如有數人時，繼承人應於「信託資金繼承申請書」共同委任其中1繼承人作為<mark>信託帳戶</mark>持有人，印鑑卡需由全體繼承人簽名並留存全體繼承人之印鑑，倘繼承人如不克來行辦理，則應由繼承人共同出具「<mark>信託帳戶</mark>繼承委任書」委由繼承人或第3人辦理，印鑑卡簽名處得由受任人簽名即可，惟仍須留存全體繼承人之印鑑(無法到行者須蓋與戶政事務所核發之印鑑證明相符之印鑑)。嗣後辦理信託資金贖回時，信託基金贖回登錄單應蓋信託印鑑卡上留存之全體繼承人之印鑑，惟贖回款將直接撥入全體繼承人所委任之「<mark>信託帳戶</mark>持有人」之帳戶，款項再由全體繼承人自行處理。B.<mark>辦理繼承</mark>時，應先變更<mark>信託帳戶</mark>之基本資料，將「委託人基本資料變更申請"}},{"id":"113-6","y":113,"n":6,"m":10,"q":"委託人於臨櫃或透過空中理財服務申購或贖回信託商品，每筆交易本金達新臺幣 300萬(或等值外幣)以上，副主管應於交易後向委託人進行照會確認作業，並於申請書上<br><span class=\"it\">A.</span> 填妥向委託人確認之時間<br><span class=\"it\">B.</span> 勾選向委託人確認之方式<br><span class=\"it\">C.</span> 如以電話確認時應留存委託人電話號碼<br><span class=\"it\">D.</span> 加蓋主管私章","o":["ABCD","僅 ACD","僅 ABD","僅 BCD"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"2.委託人透過本項<mark>服務申購或贖回信託商品</mark>時<mark>，每筆交易</mark>之<mark>本金達新臺幣300萬</mark>元(含)以上<mark>或等值外幣</mark>者，主管除須於系統放行外，於交易完成後應另於交易申請書兼登錄單(第一聯)認證列印之「本交易已於________(月/日/時/分)以□臨櫃□電話：_____<mark>向委託人確認</mark>訖___(<mark>主管私章</mark>)」，<mark>填妥向委託人確認之時間</mark>，勾選電話之確認方式，並<mark>留存委託人電話號碼</mark>，最後<mark>加蓋主管私章</mark>，以示確認。上述交易完成後之照會作業以當日完成確認並註記為原則，如未能於當日完成聯繫者，請<mark>於申請書</mark>兼登錄單(第一聯)認證列印之文字後備註未完成原因，並儘速完成確認。"}},{"id":"113-7","y":113,"n":7,"m":10,"q":"有關OBU外幣信託業務，下列敘述何者正確？","o":["以OBU外幣資金投資外幣計價之國內基金，科目別為「04」","委託人辦理「OBU外幣信託」，需開立金如意綜合管理「68」帳戶","費用扣款帳號得為委託人配偶於本行開立之OBU外匯活存帳戶","委託人以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"（三）OBU外幣信託(境外基金)<mark>以中華民國境外之法人及自然人為限，惟具美國籍之自然人及法人不受理申請</mark>。四、受理投資方式(一)受理單筆及定期定額投資，不受理投資標的之轉換。"}},{"id":"113-8","y":113,"n":8,"m":1,"q":"有關 iLEO APP「百元奇基」業務，下列敘述何者錯誤？","o":["受理方式包含「每月投」、「每旬投」、「每日投」、「利息投」、「嘗試投」","每筆最低投資金額為新臺幣 100 元","受理投資標的限以新臺幣申購之國內外基金(科目別 01 及 03)，並包含國內 ETF 基金及貨幣型基金","申購手續費最低收取新臺幣 1 元"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"四、<mark>受理投資標的</mark>：iLEO百元奇基精選系列基金標的，<mark>限以新臺幣申購之</mark>境<mark>外基金(科目別01</mark>)及國內<mark>基金(科目別03)，並</mark>排除<mark>國內ETF基金</mark>、<mark>貨幣型基金</mark>、後收型基金及配息型基金。"}},{"id":"113-9","y":113,"n":9,"m":1,"q":"有關信託資金之贖回並約定再申購作業，下列何者為非？","o":["贖回時得一併辦理再申購單筆基金","約定再申購之標的限與贖回標的相同投資幣別","再申購之標的有最低申購金額限制","適用再申購之標的不包含額度控管標的"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)<mark>再申購之標的</mark>無<mark>最低申購金額限制</mark>。(四)<mark>再申購之標的</mark>，將於贖回款項撥款入客戶指定帳戶後，同時約定次一營業日單筆申購交易，申購手續費將自贖回款項 :["高齡客戶係指 65歲(含)以上客戶","客戶執行交易前由系統導入問卷進行簡易提問","IMVP 系統新增高齡客戶交易名單，由存匯副理聯繫客戶進行關懷","OnDemand 系統產生高齡客戶數位通路交易月報表，需呈核至經理並設專卷歸檔"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)交易後之管控機制：1.<mark>高齡客戶</mark>於辦理信託交易後，於智慧行銷全通路平台系統(<mark>IMVP系統</mark>)新增事後照會機制，並由個金<mark>副理聯繫高齡客戶進行</mark>確認及關懷措施，以落實<mark>高齡客戶</mark>消費權益保護。"}},{"id":"113-34","y":113,"n":34,"m":5,"q":"有關「高齡客戶申購信託商品風險告知事項檢核表」用紙暨作業程序，下列何者為非？","o":["須由受理人員依客戶所選商品類型勾選並填寫對應項次","須由客戶簽章","須由受理人員及主管蓋章","信託作業經辦須每日至 OnDemand 系統列印前一營業日 TF17B 日報表，併同該檢核表送交主管覆核"],"a":1,"ci":{"b":"講義：理財業務標準作業流程－信託商品","c":"第20頁","s":"","t":"高齡客戶申購「手續費後收型基金」簽署「國內/境外手續費後收型基金風險預告書」：營業單位受理高齡客戶申購「手續費後收型基金」時，應將商品收費時點方式及相關投資風險確實告知客戶，端末系統進行上述交易將自動檢核並提示列印及套印「風險預告書」之相關欄位後，交由委託人親簽或蓋章，再由受理人員核對親簽或核章人員核對印鑑。主管覆核：完成交易後，將申請書兼登錄單併同風險預告書及其他相關文件送交主管覆核，主管確認無誤後加蓋私章及腰形章。報表列印及文件歸檔：信託作業經辦每日至OnDemand系統列印「主動委託交易聲明書境外基金手續費後收級別費用結構聲明書日報表(TF17B)」(有無資料皆須列印，月報表TF17BM視營業單位需要列印)，倘客戶應簽署「風險預告書」，報表之「高齡者(年齡)」欄位以勾號標示，報表『註5：打「V」者，表示本筆交易須徵取「國內/境外手續費後收型基金風險預告書」』。日報表與已徵妥客戶親簽或蓋章之「風險預告書」送交主管核對報表註記事項後，交由信託作業經辦歸檔保管並列入移交，其中風險預告書併同申請書兼登錄單及其他相關文件與信託日終結帳之「信託科目交易彙計查詢單」一併歸檔保存，日報表則按日期排序保存15年。19"},"lo":2},{"id":"113-35","y":113,"n":35,"m":10,"q":"下列「理財存摺 88 帳戶」客戶透過「第 e 個網」辦理線上結清銷戶作業，何者為非？","o":["受理時間為每一營業日 9:10AM~3:30PM","具「SSL 交易服務」權限者得辦理","具「電子憑證」權限者得辦理","有單位數在途者仍得受理"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(四)有下列情形，將不受理「線上結清銷戶」作業：1.<mark>有單位數</mark>或在途金額。2.有基金贖回在途者。3.有延時或預約交易。4.有「定存利息移轉投資信託商品」（生生不息）業務約定者。"}},{"id":"113-36","y":113,"n":36,"m":5,"q":"下列何者可利用數位通路辦理 KYC 作業？","o":["受輔助宣告者","未成年客戶首次辦理 KYC 作業","65 歲經婉拒之高齡客戶","未成年客戶辦理 KYC 變更作業"],"a":3,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"（一）首次KYC作業：已申請本行第e個網並具安控權限者可透過各數位通路辦理，惟不含未成年人、疑似受成年監護、輔助宣告及存款警示帳戶之客戶，各數位通路之安控設備分別如下："}},{"id":"113-37","y":113,"n":37,"m":7,"q":"理財業務人員辦公處所不得有哪些物品？<br><span class=\"it\">A.</span> 配偶或已成年子女存摺<br><span class=\"it\">B.</span> 重要理財客戶存摺<br><span class=\"it\">C.</span> 客戶已簽 誤？","o":["開立 TISA 帳戶對象限自然人，惟不受理大陸地區人民及具美國籍人士","TISA 帳戶得新開立「iLEO(57)數位帳戶」","同一 ID 限開一個 TISA 帳戶，且該帳戶僅得受理 TISA 基金申購及贖回，不受理一般基金交易","投資人需簽署「臺灣個人投資儲蓄帳戶(TISA)約定書」"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"四、申請方式:限<mark>新開立「</mark>金如意(68)綜合管理帳戶」或「無信託餘額或約定事項之已開立金如意(68)綜合管理帳戶」，同一ID限開一戶，本金如意(68)帳戶僅得受理<mark>TISA</mark>基金申購及贖回，不受理一般基金交易(其餘存款等帳戶功能不受影響)。"}},{"id":"114-5","y":114,"n":5,"m":4,"q":"有關本行「珍愛傳富信託」業務所提供之信託服務，下列敘述何者錯誤？","o":["兼具投資收益及資產傳承功能","信託期間之境外基金配息屬於委託人之海外所得","屬本金自益、孳息他益金錢型信託","委託人可提前終止信託契約"],"a":1,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"貳拾捌、金速配投資法－<mark>基金配息</mark>移轉投資信託商品業務一、業務性質係指委託人以其單筆投資之國內/<mark>境外基金</mark>(即孳息商品，下稱核心基金)，約定每月配息金額自動移轉投資信託商品(下稱衛星基金)之業務(下稱金速配投資)。"},"lo":2},{"id":"114-6","y":114,"n":6,"m":5,"q":"有關書面辦理之「高齡客戶 KYC 關懷提問表」(下稱提問表)，下列敘述何者正確？<br><span class=\"it\">A.</span> 應由客戶親填親簽，行員不得代填<br><span class=\"it\">B.</span> 符合 2 項(含)以上弱點指標，應婉拒客戶繼續辦理 KYC 作業<br><span class=\"it\">C.</span> 婉拒辦理後，逾七日始得以書面辦理重新評估<br><span class=\"it\">D.</span> 評估若無弱點，提問表作為 KYC 客戶資料表之附件，無需辦理建檔","o":["AB","AD","CD","BC"],"a":3,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"一、<mark>書面辦理</mark>：(一)客戶親臨營業單位或本行人員外訪客戶時，<mark>由客戶親填</mark>「第一銀行<mark>客戶資料表」(下稱</mark>資料表)，若客戶年齡達64歲<mark>(含)以上</mark>，於客戶填寫資料表前由KYC評估人員向客戶本人詢問或觀察客戶後填寫<mark>「高齡客戶KYC關懷提問表</mark>-臨櫃版」，據以評估客戶弱點事項及是否接受<mark>客戶繼續辦理KYC作業</mark>，並由鍵檔人員於智慧行銷全通路平台(下稱IMVP)辦理鍵檔作業。"}},{"id":"114-7","y":114,"n":7,"m":6,"q":"為落實關懷客戶理財商品投資損益及適配性，本行辦理之定期檢視作業，下列敘述何者錯誤？","o":["符合辦理定期檢視客戶將於智慧行銷全通路平台(IMVP)產出名單","檢視對象為本行財富管理客戶，且排除專業投資人","區分未滿 65 歲客戶及 65歲(含)以上客戶，設有不同檢視條件","理財業務人員應於指定之期限內聯繫客戶並完成檢視作業，逾期系統無法作業"],"a":1,"ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第一節 投資損益及適配性檢視與重要客戶拜訪","t":"二、定期檢視作業應注意事項(一)符合辦理定期檢視客戶將於智慧行銷全通路平台(IMVP)產出名單，理財業務人員應於指定之期限內聯繫客戶並完成檢視作業，逾期系統無法作業。"}},{"id":"114-8","y":114,"n":8,"m":5,"q":"有關本行智能理財服務，下列敘述何者錯誤？","o":["ETF 投組投資期間最少 3 年","ETF 投組定期定額最低為新臺幣 3,000 元或美元 100 元","ETF 投組不適用再平衡機制","ETF 投組配發之現金股利，由本行逕行再投資於該投組原配息標的"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"二、智能理財基金投組內個別標的產品代號末2碼設定為「90」。三、智能理財投組贖回或終止時，將俟投資組合內所有基金之贖回款入帳並扣除相關費用後，再撥入客戶約定之贖回/收益分配帳號，本行於贖回款保管期間不計付利息；如為投組再平衡調整，將先贖回投組內應調降比例之標的，並於收到前揭所有贖回標的之贖回款項後再申購需調高比例之標的。"}},{"id":"114-9","y":114,"n":9,"m":8,"q":"有關「行動投保應遵循事項」，下列敘述何者正確？","o":["進入保險業務系統取得有條碼之「第一商業銀行保險代理業務暨行動投保確認同意書」，條碼可重覆使用","限以授權被保險人帳戶繳交保險費","行動投保應檢附之正本文件(如確認同意書、授權書…等)須以保服案件進件程序，發送保險代理人處，交付文件清單免填","完成要保文件並上傳(T 日)，應於次二營業日前(T+2)完成主管放行"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"辦透過「信託業務影像管理系統」掃描存檔備查；正本依「掃描清單報表」之案件號順序整理，按日期排序歸檔，置於金庫室外監視錄影設備攝錄範圍內專用之上鎖重要文件櫃內永久保存，「信託業務總約定書」【信014E】及「約定條款<mark>確認同意書</mark>」（客戶留存聯）或「各類存款開戶暨往來業務項目申請書」（客戶收執聯）交由客戶攜回。"},"x":"行動投保應檢附之正本文件須以保服案件進件程序發送保險公司。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"114-10","y":114,"n":10,"m":8,"q":"如人身保險案件之保費來源，係為要保人/被保險人/實際繳交保費之利害關係人以下列何種方式購買保險商品，應予婉拒受理？<br><span class=\"it\">A.</span> 定存解約利息免打折<br><span class=\"it\">B.</span> 保險單解約<br><span class=\"it\">C.</span> 保險單借款<br><span class=\"it\">D.</span> 基金贖回","o":["ABC","AB","ACD","AC"],"a":3,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"202512版（1）政府公債、國庫券、金融債券、公司債券、國內基金、上市、櫃之公司股票。（2）存放金融機構之存款。（3）給付以委託人<mark>為要保人</mark>所<mark>購買保險</mark>之保險費。（4）其他經主管機關核准，委託人得投資之標的。"},"x":"應婉拒：<b>定存解約利息免打折</b>、保單借款等（AC）。（保險代理業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"114-11","y":114,"n":11,"m":9,"q":"有關本行信用卡帳單分期業務，下列敘述何者錯誤？","o":["帳單分期可分 3 期、6 期或 12 期攤還","雙幣卡之國外交易帳款不能申請帳單分期","帳單分期申請金額最低為新臺幣 3,000 元","最近一期繳款記錄為全額繳款並無逾期者始能申請"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"三、金額限制：每筆最低投資金額<mark>為新臺幣</mark>100元(含)起，約定時以新臺幣「100元」為累加單位，最高以新臺幣100萬元為限制。。"},"x":"帳單分期最低申請金額並非 3,000 元（選項敘述錯誤）。（信用卡業務規範，理財篇／信託篇未收錄）","lo":1},{"id":"114-12","y":114,"n":12,"m":9,"q":"有關本行行動信用卡作業規範，下列敘述何者錯誤？","o":["Apple Pay 實體環境之交易僅能透過感應方式完成","行動信用卡為實體信用卡附加功能，僅接受既有卡友申辦","行動信用卡之交易方式與感應式信用卡相同，交易金額 3 千元以內，同一般感應卡方式得免簽名","Appl pan class=\"it\">D.</span> 主管須於認證欄之「免填申請書交易序號」前首加蓋私章","o":["ABCD","BCD","ABD","BD"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)受理委託人<mark>免填交易申請書</mark>作業：係指<mark>營業單位</mark>「受理人員」依委託人<mark>口頭指示輸入申請內容，並列印於空白申請書兼登錄單用紙</mark>，「受理人員」覆誦委託人<mark>申請內容，</mark>再請委託人確認<mark>申請內容</mark>無誤後蓋妥信託帳戶留存印鑑，交<mark>「核章」人員</mark>核章及<mark>「操作員」</mark>辦理交易認證登錄之作業。"}},{"id":"114-25","y":114,"n":25,"m":10,"q":"有關信託帳戶之轉籍作業，下列敘述何者正確？","o":["EF、EK、EH 及 EG 系列之境外 ETF 及國外股票不得辦理「全部/部分投資標的轉籍」","線上開立之信託(889)帳戶得辦理「整戶批次轉籍」及「全部/部分投資標的轉籍」","如投資標的尚有在途未回報資料者，仍可辦理「全部/部分投資標的轉籍」","帳戶有一般單筆之預約登錄或預約贖回投資標的者，可辦理整戶批次轉籍作業"],"a":0,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.理財存摺（88）帳戶<mark>投資標的轉</mark>入其他理財存摺（88）帳戶2.理財存摺（88）帳戶<mark>投資標的轉</mark>入金如意（68）綜合管理帳戶(註2)申請書用紙帳戶轉籍申請書兼登錄單信託轉籍申請書兼登錄單【信051】交易代號移出行：帳戶移出設定交易(953T)移入行：帳戶移入夜間批次設定交易(983T)移出行：委託人資料內容變更登錄(T300)移入行：信託基金轉籍登錄(T830)註1：金如意（68）綜合管理帳戶之整戶批次轉籍請參閱營運業務處2012/07/11營管字第00306號函辦理。註2：金如意（68）綜合管理帳戶不得單獨辦理信託商品之<mark>全部/部分投資標的轉籍</mark>。註3：線上開立之信託(889)帳戶<mark>不得辦理「</mark>整戶批次轉籍」及<mark>「全部/部分投資標的轉籍」</mark>。註4：<mark>EF、EK、EH及EG系列之境外ETF及國外股票不得辦理「全部/部分投資標的轉籍」</mark>。"}},{"id":"114-26","y":114,"n":26,"m":2,"q":"關於「私募基金」之敘述，下列何者為非？","o":["向特定投資人以非公開方式募集資金","不得為一般性廣告及公開勸誘之行為","境內設有銷售人數限制","流動性或透明度較一般境外基金為佳"],"a":3,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(一)不得就私募基金為一般性廣告及公開勸誘之行為。(二)營業單位受理法人高資產客戶申購或圈存銷售對象「僅限專業投資人或高資產客戶」始得投資之信託商品(如私募基金)時，比照法人專業投資人之交易規範，申請書兼登錄單須加徵「授權辦理交易之人」親簽，於「核章」欄位旁加蓋「核對親簽」章戳，由受理人員確認親簽之人與本行IMVP系統「授權辦理交易之人」之建檔資料相符並辦理核簽後，再交由核章人員核章。"},"lo":2},{"id":"114-27","y":114,"n":27,"m":4,"q":"辦理有價證券信託-本金自益、孳息他益業務，依所得稅法第三條之四規定，信託存續期間所獲之股票股利及現金股利併入","o":["委託人","受託人","受益人","信託監察人 的所得課稅"],"a":2,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第三節 信託處作業程序","t":"202501版3-13第三章<mark>有價證券信託</mark>(二)交付證券集中保管事業保管之<mark>有價證券</mark>受託人自信託契約簽訂日起，至<mark>信託存續期間</mark>末日止，將各年度信託<mark>有價證券</mark>孳息分配於受益人。受託人將集保公司撥付<mark>之股票股利及現金股利</mark>分別轉<mark>入受益人</mark>之股票集保帳戶及其指定之信託利益分配帳戶。"}},{"id":"114-28","y":114,"n":28,"m":3,"q":"本行以信託方式辦理「預售屋履約擔保機制」之價金信託-可動用，應就信託專戶資金作專款專用，下列何者非專款專用範圍？","o":["支付必要且確實已發生之銷售費用","辦理信託契約約定之有關工程款交付","繳納各項稅費等工程所需費用","以上皆是專款專用範圍"],"a":0,"ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第一節 通則","t":"三、解約手續費依雙方簽定信託契約書之約定方式計收。四、其他費用因信託資金之運用與管理，所生之必要及或有稅負（包含但不限於信託處理費、股利所得稅、贈與稅、全民健康保險補充保險費等）與處理信託事務所生之費用或負"},"lo":2},{"id":"114-29","y":114,"n":29,"m":3,"q":"本行買賣價金信託業務，可協助保障買賣雙方權益，除常見的不動產買賣外，亦可協助其他類型之案件買賣，有關本行買賣價金信託業務，下列敘述何者為非？","o":["土地法第 34 條之 1 成立之買賣案件因風險較高，本行不承作","可承作公司出資額買賣之案件","由本行擔任公正第三方保管買賣價金及管控金流，以提升財產交易安全性","掌握買賣交易金流及後續業務推廣契機"],"a":0,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"壹、通則一、業務性質:「不動產買賣價金信託業務」係保障不動產交易之買賣雙方交易安全，由買賣雙方與本行簽訂信託契約，不動產(含土地及成屋)之買方(委託人)將購買交易標的之價金，依買賣契約約定，分期存入信託專戶；賣方(信託關係人)依買賣契約約定，配合買方分階段完成移轉程序。受託人依買賣雙方之指示，為特定目的管理該交易價金。"}},{"id":"114-30","y":114,"n":30,"m":2,"q":"本行 65 歲(含)以上之高資產客戶，於臨櫃申購下列何項商品時，不須進行電話錄音？","o":["保本型連結利率之境外結構型商品","南非幣計價之國外債券","風險屬性為 RR4，剩餘年期為 20 年之國外美元次順位債券","不保本型連結股權之境外結構型商品"],"a":2,"ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"(二)錄音作業：1.65歲(含)以上高齡客戶(含一般投資人、自然人專業投資人及高資產客戶)預約圈存申購下列商品須電話錄音。(1)南非幣計價之國外債(2)國外債到期日為<mark>剩餘年期</mark>25年(含)以上(3)「<mark>風險屬性</mark>」為RR5之國外債"}},{"id":"114-31","y":114,"n":31,"m":4,"q":"員工福利信託為金管會頒布「信託業務發展策略藍圖」之評鑑項目，有關員工福利信託之敘述，下列何者錯誤？","o":["未上市櫃公司但其集團內具控制或從屬關係之母或子公司屬上市或上櫃公司可承作員工持股信託","員工儲蓄信託業務信託資金的投資標的包括國外 ETF","員工股權獎酬結合信託亦屬於員工福利信託的一種型態","限制員工權利新股得附有服務條件或績效條件等既得條件"],"a":1,"ci":{"b":"信託篇","c":"第二章第四節員工福利信託業務處理細則","s":"第四節 員工福利信託業務","t":"壹、通則員工福利信託(包含<mark>員工儲蓄</mark>/持股信託、限制員工權利新股信託)係透過信託機制協助企業/學校規劃員工福利事宜，為使員工福利<mark>信託業務</mark>順利推展，本項業務以信託處為主辦單位，各營業單位為協辦單位。"}},{"id":"114-32","y":114,"n":32,"m":4,"q":"有關營業單位自行辦理「預開型退休安養信託業務」，下列敘述何者錯誤？","o":["客戶不得申請本行修改信託契約內容","受理本業務開戶時，一律採有摺方式辦理","信託期間自簽約日起，為期三年","委託人須年滿 55 歲以上"],"a":1,"ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"（四）為加速營業單位推廣退休安養信託業務及鼓勵高齡者預先簽訂安養信託，推出「預開型退休安養信託業務」由信託處授權營業單位自行辦理信託契約簽約、信託專戶開立、信託資金收付及信託契約中途/到期解約等相關事宜。為使營業單位瞭解相關作業規範及流程，另訂立營業單位辦理「預開型退休安養信託業務」應注意事項。"}},{"id":"114-33","y":114,"n":33,"m":10,"q":"本行受理國內及境外基金投資時，須向委託人事先徵取「推介同意暨聲明書」；惟對於特定族群之非專業投資人且非高資產客戶不得進行推介，下列何者屬於特定族群？<br><span class=\"it\">A.</span> 年齡 65 歲(含)以上<br><span class=\"it\">B.</span> 教育程度國中(含)畢業以下<br><span class=\"it\">C.</span> 有全民健康保險重大傷病證明者","o":["BC","AB","AC","ABC"],"a":0,"ci":{"b":"講義：理財業務標準作業流程－信託商品","c":"第26頁","s":"","t":"適用對象彙整：註:1<mark>.教育程度國中(含)畢業以下</mark>2<mark>.有全民健康保險重大傷病證明者</mark>信託商品推介之控管對已簽訂信託契約之客戶，得就特定投資標的<mark>事先徵取</mark>委託人之同意書<mark>進行推介</mark>；且委託人得隨時終止該推介行為，並於書面指示送達信託業後生效；惟對<mark>特定族群之非專業投資人且非高資產客戶不得進行推介</mark>。252025/05/23信劃字第000024號"}},{"id":"114-34","y":114,"n":34,"m":10,"q":"營業單位受理客戶臨櫃辦理信託交易，信託申請書兼登錄單之客戶收執聯，應由何人交付予客戶？","o":["受理人員","操作員","受理人員及操作員以外之第三人，或由副主管交付","無須交付"],"a":2,"ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"報酬揭露文件第2聯由<mark>受理人員及操作員以外之第三人，或由副主管交</mark>委託人收執，日終結帳作業比照「貳拾、營業單位日終結帳」之規定辦理。"}},{"id":"114-35","y":114,"n":35,"m":3,"q":"預售屋履約擔保機制中之不動產開發信託，因專款專用用途過於廣泛，常發生建案工程未開工或興建初期買方所繳之預售價金即已用罊之情形，下列何者非本行「不動產開發信託」下買方所繳「預售價金信託專戶」可動用範圍？","o":["建築師設計費","信託管理費","工程款","合建保證金"],"a":3,"ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"202501版【附錄3】第一商業銀行不動產買賣<mark>價金信託</mark>簽約證明暨重要事項說明書（賣方專用）壹、台端業於年月日與買方共同簽訂不動產買賣<mark>價金信託</mark>契約書（下稱信託契約），俟本行用印完成及首筆價金存入<mark>信託專戶</mark>後正式生效。"},"lo":2},{"id":"114-36","y":114,"n":36,"m":5,"q":"有關未成年人辦理充分瞭解客戶(KYC)作業規範，下列敘述何者正確？<br><span class=\"it\">A.</span> 「本人確認收執資料表影本壹份」欄位由未成年人自行簽收<br><span class=\"it\">B.</span> 若為未滿 7 歲未成年人，投資經驗之答案限為「無任何投資經驗」及「無經驗」<br><span class=\"it\">C.</span> 資料表內容應依據未成年人本身之資料填答<br><span class=\"it\">D.</span> 若法定代理人之一無法親簽，應出具法人授權書","o":["AB","BC","AC","BD"],"a":1,"ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第二節 自然人(含境內及境外(OBU))充分瞭解客戶(KYC)作業程序","t":"1.客戶為<mark>未成年人</mark>(1)填寫自然人<mark>資料表內容</mark>A.限制行為能力人(滿7歲以上之<mark>未成年人</mark>)：自然人<mark>資料表內容應依</mark>其<mark>本身之資料</mark>親自填答，若限制行為能力人無法獨立填寫自然人資料表時，得由<mark>法定代理人</mark>依限制行為能力<mark>人本身之資料</mark>協助其完成填答。 停損之贖回：1.自動停利/停損率設為02.有在途未回報單位數3.無原始投資金額4.<mark>定期(不)定額各扣款日期之扣款成功次數合計未超過12次</mark>二、通知停利(損)率(含一般單筆/定期(不)定額投資)通知停利/停損率機制係指委託人設定單一投資標的之「通知停利/停損率」，系統每日計算投資標的報酬率(含現金配息)，如達到委託人設定之通知停利/停損率時，系統將於次一銀行營業日以LINE或電子郵件或手機簡訊依序擇一通知委託人，但不予自動執行贖回：(一)通知停利(損)率的計算所適用之淨值係依受託人收到基金公司的最近公告淨值為準，「境外基金(臺幣信託)"}},{"id":"S1-3","m":1,"q":"定期(不)定額投資同一標的，自首次扣款失敗日起連續扣款失敗達多久，視為終止繼續扣款？","o":["1 個月","2 個月","3 個月","6 個月"],"a":2,"x":"連續失敗達 3 個月視為終止，惟保留已累積之單位數至委託人贖回。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"九、停止扣款、累計扣款次數之計算<mark>以同一投資標的首次扣款失敗日起算，連續扣款失敗達3個月時</mark>，視為終止該投資標的繼續扣款，惟本行仍保留委託人已扣款投資累計之原有單位數至委託人辦理贖回，累計扣款次數則以各扣款日扣款成功之次數累積計算。"}},{"id":"S1-4","m":1,"q":"有關「基金贖回再申購」約定，下列何者正確？","o":["再申購金額至少新臺幣 1 萬元","再申購之標的無最低申購金額限制","贖回款入帳後自動圈存","可再申購境外 ETF"],"a":1,"x":"無最低再申購金額，但須符合各基金最小申購單位數；入帳後不圈存。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(三)<mark>再申購之標的無最低申購金額限制</mark>。"}},{"id":"S1-5","m":1,"q":"「自動停利率」之設定規定為何？","o":["不低於 +3%，可含小數","限整數且不低於 +5%","固定為 +10%","不得高於 +20%"],"a":1,"x":"限整數且不低於 +5%。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"(二)<mark>「自動停利率」之設定：限整數且不低於+5%</mark>，而且所設定之停利率須大於該投資標的當時之報酬率(例如：投資標的當時之報酬率為+10%，則委託人設定之自動停利率須為+11%(含)以上)；"}},{"id":"S1-6","m":1,"q":"下列何者<b>不受理</b>延時交易？","o":["國內股票型基金","境外債券型基金","國內/境外 ETF","國內平衡型基金"],"a":2,"x":"海外債、特別股、國內結構債、連動債、ETF、額度控管基金、神基妙算、金速配、生生不息等不受理延時交易。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"惟海外債、特別股、國內結構債、連動債、<mark>國內/境外ETF及額度控管基金申購</mark>、神基妙算、金速配、生生不息等業務或其他特殊基金等不受理延時交易。"}},{"id":"S1-7","m":1,"q":"定期不定額投資之扣款金額，係於扣款日前一營業日淨值較基準淨值之漲跌每達多少時調整？","o":["3%","5%","10%","15%"],"a":1,"x":"漲跌每達 5% 依基準扣款金額加／減碼。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第一部分 通則","t":"3.定期不定額投資：扣款日之前一營業日本行已取得該基金之最新淨值，<mark>相較於「基準淨值」之漲/跌幅每達5%</mark>，扣款金額則依「基準扣款金額」減除客戶自行設定之「減碼金額」/加上客戶自行設定之「加碼金額」予以調整，惟臺幣投資之調整後扣款金額不得低於新臺幣3,000元(外幣投資另從其最低扣款金額規定，同定期定額投資之規定)，最高則以設定之「基準扣款金額」的兩倍為限。"}},{"id":"S2-1","m":2,"q":"國外債券發行人信用評等為何等級以下時，客戶應逐筆加簽「特定金錢信託投資國外債券投資風險聲明書」？","o":["A-","BBB-","BB+","B-"],"a":2,"x":"BB+ 以下（非投資等級）才須徵取。","ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"2.「特定金錢信託投資國外債券投資風險聲明書」(非投資等級債券適用):<mark>投資發行人信用評等是BB+以下等級之債券商品才須徵取</mark>。"}},{"id":"S2-2","m":2,"q":"客戶下單投資國外債券後，交易是否成交何時可確認？","o":["下單當時","T 日下午","次一銀行營業日（T+1）","T+3"],"a":2,"x":"採圈存方式，T 日下單須待 T+1 才可確認並回報。","ci":{"b":"信託篇","c":"第二章第十節 特定金錢投資國外有價證券","s":"第十節 特定金錢信託投資國外有價證券","t":"三、下單交易係採取採單筆投資預約圈存及預約贖回方式辦理，即委託人於一般受理時間內(T日)所為之下單指示，<mark>交易是否成交需待次一銀行營業日(T+1日)才可確認</mark>並回報結果。"}},{"id":"S2-3","m":2,"q":"美國掛牌 ETF 及股票之單筆投資，每筆最低申購金額為何？","o":["等值美金 1,000 元","等值美金 2,000 元","等值美金 3,000 元","等值美金 5,000 元"],"a":1,"x":"美國掛牌為等值美金 2,000 元（以一股累加）；香港掛牌為 12,000 港幣／人民幣。","ci":{"b":"信託篇","c":"第二章第一節特定金錢信託投資國內外基金","s":"第一節 特定金錢信託投資國內基金/境外基金 第二部分 營業單位受理本項業務作業程序","t":"1.單筆投資：<mark>美國掛牌ETF及股票為等值美金2,000元</mark>，並以「一股」為累加單位；"}},{"id":"S2-4","m":2,"q":"依「國外債券銷售及集中度警示管理要點」，信用評等對象同時擁有三家信評機構不同評等者，應如何認定？","o":["以最差者","以最優者","以中間者","以標普為準"],"a":1,"x":"依官方答案以最優者認定。","lo":1},{"id":"S3-1","m":3,"q":"辦理本行「不動產買賣價金信託」之前提為何？","o":["買方先將價金存入信託專戶","買賣雙方須先完成「不動產買賣契約」之簽訂","賣方須先完成過戶","須先申請銷帳百分百"],"a":1,"x":"須先完成不動產買賣契約簽訂，始得簽訂價金信託契約書。","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"貳、營業單位受理本項業務作業程序一、簽約前置作業<mark>買賣雙方須完成「不動產買賣契約」之簽訂，始得簽訂本行「不動產買賣價金信託契約書」</mark>。"}},{"id":"S3-2","m":3,"q":"不動產買賣價金信託之買方應如何交付價金？","o":["現金交付賣方","依信託資金繳款編號（銷帳百分百虛擬帳號）存入信託專戶","開立本行支票交地政士","匯入賣方帳戶"],"a":1,"x":"依信託契約所示之信託資金繳款編號存入信託專戶。","ci":{"b":"信託篇","c":"第二章第九節不動產買賣價金信託業務處理細則","s":"第九節 不動產買賣價金信託業務","t":"五、買方信託資金之交付(即買賣價金存入信託專戶)信託契約簽訂暨信託專戶開立完成後，買方始可將買賣價金<mark>依信託契約第四條第一項所示之信託資金繳款編號(即銷帳百分百虛擬帳號)存入信託專戶</mark>、戶名為「第一商業銀行受託信託財產專戶」。"}},{"id":"S3-3","m":3,"q":"本行以信託方式辦理預售屋履約擔保之「價金信託－可動用」，下列何者<b>非</b>專款專用範圍？","o":["工程款交付","工程所需稅費","現金及銀行存款之運用","必要且已發生之銷售費用"],"a":3,"x":"銷售費用不屬專款專用範圍（官方答案）。","lo":1},{"id":"S4-1","m":4,"q":"「有價證券信託－本金自益、孳息他益」之信託存續期間所獲股利，併入何人所得課稅？","o":["委託人","受託人","孳息受益人","信託監察人"],"a":2,"x":"依所得稅法第 3 條之 4，併入受益人之所得課稅。","ci":{"b":"信託篇","c":"第三章有價證券信託業務處理細則","s":"第一節 通則","t":"二、信託財產返還之方式(一)期間孳息他益，到期本金自益1.信託存續期間受益人：由受託人自契約簽訂日起，至信託存續期間屆期止，<mark>將各年度所獲分配之股票股利(不含資本公積配股)、現金股利</mark>(不含資本公積配息)等孳息交付受益人；"}},{"id":"S4-2","m":4,"q":"營業單位自行辦理之「預開型退休安養信託」，委託人年齡條件為何？","o":["年滿 50 歲","年滿 55 歲","年滿 60 歲","年滿 65 歲"],"a":1,"x":"委託人須年滿 55 歲、完全自益、期間 3 年（官方考題）。","ci":{"b":"信託篇","c":"第二章第五節家庭財富信託業務","s":"第五節 家庭財富信託","t":"（四）為加速營業單位推廣退休安養信託業務及鼓勵高齡者預先簽訂安養信託，推出「<mark>預開型退休安養信託業務</mark>」由信託處授權營業單位自行辦理信託契約簽約、信託專戶開立、信託資金收付及信託契約中途/到期解約等相關事宜。"}},{"id":"S4-3","m":4,"q":"下列何者<b>非</b>屬信託 2.0 信託業務專員之主要推廣項目？","o":["高齡者安養信託","身心障礙者信託","股權傳承信託","員工持股信託"],"a":3,"x":"員工持股信託屬員工福利信託，由專責單位辦理。","lo":1},{"id":"S5-1","m":5,"q":"非專業投資人中「穩健型」客戶可購買之商品風險等級為何？","o":["RR1～RR2","RR1～RR3","RR1～RR4","RR1～RR5"],"a":2,"x":"保守 RR1～RR2、穩健 RR1～RR4、積極 RR1～RR5，由交易系統檢核控管。","ci":{"b":"講義：理財業務標準作業流程(2026.04)","c":"第22頁","s":"","t":"非專業投資人之商品適合度適合之商品風險等級客戶投資屬性RR1~RR2保守型<mark>RR1~RR4穩健型</mark>RR1~RR5積極型•由交易系統檢核控管客戶投資屬性及商品風險承受等級是否適配，超出範圍則無法受理。"}},{"id":"S5-2","m":5,"q":"客戶首次利用 iLEO 辦理 KYC，應使用何種安控機制？","o":["SSL 密碼","晶片金融卡","e指通","實體 OTP"],"a":2,"x":"第e個網：OTP、e指通、憑證、晶片卡；第e行動：OTP、e指通；iLEO：e指通。","ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第一節 充分瞭解客戶(KYC)作業通則","t":"1.第e個網：實體OTP、e指通、電子憑證或晶片金融卡2.第e行動：實體OTP或e指通<mark>3.iLEO：e指通</mark>4.友善金融服務網:e指通（二）變更KYC作業：已申請本行第e個網基本服務功能者可透過各數位通路辦理，惟不含疑似受成年監護、輔助宣告、存款警示帳戶及前次辦理「高齡客戶KYC關懷提問表」被婉拒之客戶。"}},{"id":"S5-3","m":5,"q":"商品權責部門至少多久應定期檢視商品風險等級分類之妥適性？","o":["每季","每半年","每年","每三年"],"a":2,"x":"每年至少一次定期檢視。","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"（二）為維護商品風險等級分類之妥適，本行將視市場變化及業務需要，由商品權責部門，<mark>每年至少一次定期檢視商品風險等級分類之判定原則</mark>、及各商品風險等級分類之妥適性，並依其實際狀況調整之。"}},{"id":"S5-4","m":5,"q":"人身保險商品除「投資型保險」外，原則上定義為何種風險等級？","o":["低度","中低度","中度","高度"],"a":0,"x":"其他人身保險商品原則上定義為「低度」風險商品。","ci":{"b":"理財篇","c":"第五章 商品銷售相關作業規範","s":"第一節 商品適合度政策","t":"2.保險商品(1)「人身保險」商品除「投資型保險」商品外，<mark>其他人身保險商品原則上定義為「低度」風險商品</mark>。"}},{"id":"S5-5","m":5,"q":"客戶距前次 KYC 評估日期在 30 日（含）內再次辦理 KYC，評估人員應如何處理？","o":["不得受理","向客戶了解短期內再次變更之原因並登錄系統","直接依新屬性生效","須經理核准"],"a":1,"x":"應了解原因並登錄於系統提示畫面；屬性提升者依年齡 T+1／T+2 生效。","ci":{"b":"理財篇","c":"第二章 充分瞭解客戶(KYC)作業規範","s":"第三節 法人(含境內及境外)充分瞭解客戶(KYC)作業程序","t":"(二)若距離前次KYC評估日期在30日(含)內，<mark>評估人員應向客戶了解短期內再次辦理變更KYC作業之原因</mark>，登錄於系統提示畫面。"}},{"id":"S6-1","m":6,"q":"依法令規定，專業投資人接受本行提供金融商品或服務，是否屬金融消費者保護法所稱之金融消費者？","o":["屬之","非屬之","僅自然人屬之","僅法人屬之"],"a":1,"x":"專業投資人非屬金融消費者，不適用金融消費者保護法。","ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第一節 專業投資人通則","t":"二、依法令規定，<mark>專業投資人接受本行提供金融商品或服務，非屬金融消費者保護法所稱之金融消費者</mark>，亦不適用金融消費者保護法規範。"}},{"id":"S6-2","m":6,"q":"自然人專業投資人之複審作業，下列何者正確？","o":["免辦複審","每三年重徵申請書","每年應重徵「專業投資人／專業客戶申請書」","僅需電話確認"],"a":2,"x":"自然人每年重徵申請書並重新提供證明文件；法人專投毋須每年重徵申請書。","ci":{"b":"理財篇","c":"第三章 專業投資人(含境內及境外)作業規範","s":"第四節 專業投資人複審作業","t":"貳、<mark>自然人專業投資人複審作業每年應向客戶重徵</mark>「專業投資人/專業客戶申請書（境內自然人專用）」或「專業投資人/專業客戶申請書（境外(OBU)自然人專用）」(如附表1-1、1-2)，並請客戶更新財力證明、金融商品專業知識及交易經驗證明文件，營業單位確認文件備齊後，至IMVP系統「專業投資人建檔」完成鍵檔作業，將相關文件送交主管覆核及放行。"}},{"id":"S6-3","m":6,"q":"本行應多久辦理一次高資產客戶財力審查？","o":["每半年","每年","每二年","每三年"],"a":1,"x":"每年辦理財力覆審；身分覆審則每二年一次。","ci":{"b":"理財篇","c":"第四章 高資產客戶作業規範","s":"第四節 高資產客戶覆審作業","t":"(一)財力覆審：<mark>本行應每年辦理一次高資產客戶財力審查</mark>，確認客戶續符合高資產客戶之財力標準。"}},{"id":"S6-4","m":6,"q":"個人財管戶之條件，下列何者正確？","o":["往來 3 個月、總資產 100 萬元","往來 6 個月以上、平均總往來資產達 300 萬元","往來 1 年、總資產 500 萬元","僅需申請即可"],"a":1,"x":"未申請家庭財管戶之個人客戶往來 6 個月以上、平均總往來資產達 300 萬元。","ci":{"b":"理財篇","c":"第六章 售後服務作業規範","s":"第三節 財富管理戶優惠","t":"壹、財富管理客戶定義及條件一、個人財管戶：未申請家庭財管戶之個人客戶<mark>與本行往來6個月以上，平均總往來資產(註1)(下稱總資產)達等值新臺幣(以下同)300萬元</mark>，由本行指派專責理財業務人員服務，並依其總資產、平均信託資產(註2)(下稱信託資產)及理財貢獻度(註3)，提供不同優惠項目。"}},{"id":"S7-1","m":7,"q":"理財業務人員至客戶處辦理行外收送件時，下列何者<b>不得</b>提供？","o":["收送待交換即期支票","收送現金及送交網路銀行密碼函","收送繳費單據","收送取款條"],"a":1,"x":"不得提供收送現金服務及送交網路銀行密碼函，亦不得收受領取對帳單。","ci":{"b":"理財篇","c":"第七章 風險控管","s":"第一節 業務及系統權限之控管","t":"(五)<mark>至客戶處辦理行外收送件時，提供收送現金服務及送交網路銀行密碼函</mark>。"}},{"id":"S7-2","m":7,"q":"理財業務人員不得擔任下列何項業務之核對親簽人員？","o":["保險要保書","開戶、帳戶及客戶基本資料、自動化設備申請變更","基金申購申請書","以上皆可擔任"],"a":1,"x":"不得擔任開戶、帳戶及客戶基本資料、自動化設備申請、變更或掛失等核對親簽人員
