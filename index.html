"}},{"id":"S12-60","m":12,"q":"【2025/03/31 債劃字第000040號】已移交催收案件，債權憑證時效將於（　）內屆期者，應主動借調正本辦理換發。","o":["9 個月","6 個月","1 年","3 個月"],"a":1,"x":"換發完成後歸還並影印乙份入卷。","src":4,"t":"fill","ci":{"b":"公文：2025/03/31 債劃字第000040號","c":"債權管理處","s":"重申各單位催收主管應定期檢視逾放(含呆帳)案件之債權憑證時效","t":"對於已移交債權管理處及區域中心催收案件，對<mark>債權憑證時效將於6個月內屆期案件</mark>，應主動以業務聯繫單向保管之營業單位借調債權憑證正本辦理換發，並將換發完成後之債權憑證正本歸還營業單位，另影印乙份歸入逾放個案催收卷宗存查。"}},{"id":"S12-61","m":12,"q":"【2025/11/20 一總法中字第009293號】連鎖企業加盟業者貸款手續費最高依額度金額之 0.5% 計收，最低新臺幣（　）元。","o":["1,000","2,000","3,000","5,000"],"a":2,"x":"利率一年期定儲機動＋1.085% 以上。","src":4,"t":"fill","ci":{"b":"公文：2025/11/20 一總法中字第009293號","c":"總行","s":"自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」","t":"手續費最高依額度金額之0.5%計收，<mark>最低新臺幣3,000元</mark>。"}},{"id":"S12-62","m":12,"q":"【2025/12/05 法中字第000138號】建築業者週轉金實際用於「興建」者，資金用途應勾選「（　）其他營建資金」。","o":["33","32","31","34"],"a":0,"x":"貸款種類勾選「31 建築貸款」。","src":4,"t":"fill","ci":{"b":"公文：2025/12/05 法中字第000138號","c":"法人金融業務處","s":"重申營業單位辦理建築業者申貸週轉金案件應注意事項","t":"倘實際資金用途係用於「興建」住宅及企業用建築之放款，貸款種類及資金用途應分別勾選「31.建築貸款」及<mark>「33.其他營建資金」</mark>以納入銀行法第72之2控管。"}},{"id":"S12-63","m":12,"q":"【2025/10/17 審劃字第000032號】工程週轉金額度建檔有誤，應以「客戶核准資料變更(6260)」更改代號（　）更正。","o":["93","70","47","60"],"a":1,"x":"已貸放未計入者以 6300 代號 47 更正。","src":4,"t":"fill","ci":{"b":"公文：2025/10/17 審劃字第000032號","c":"授信審核處","s":"落實工程週轉金累計動用借款金額上限維護交易(6409)，自2025年10月20日起新增欄位及LN6409日報表","t":"倘額度建檔有誤，應以「客戶核准資料變更(6260)」<mark>更改代號『70』更正</mark>。"}},{"id":"S12-64","m":12,"q":"【2025/11/20 審鑑字第000015號】受託鑑價單位之鑑價資料保存年限由 20 年調整為（　）年。","o":["5","30","10","15"],"a":3,"x":"配合徵授信檔案卷宗保存年限 15 年。","src":4,"t":"fill","ci":{"b":"公文：2025/11/20 審鑑字第000015號","c":"授信審核處","s":"函布修正本行「擔保品鑑價應注意事項」，並自即日起實施","t":"配合本行徵、授信檔案卷宗保存年限已調整為15年，爰修正有關受託鑑價單位之<mark>鑑價資料保存年限由20年調整為15年</mark>。"}},{"id":"S12-65","m":12,"q":"【2026/01/21 一總審劃字第000348號】經理權限授信商品停權標準 B 組為逾放比率逾 2% 且逾放金額（　）萬元。","o":["1,800","2,400","2,500","2,000"],"a":3,"x":"A 組 2,400、C 組 1,800 萬元。","src":4,"t":"fill","ci":{"b":"公文：2026/01/21 一總審劃字第000348號","c":"總行","s":"修正「國內營業單位經理權限授信要點」，自2026年2月2日起實施","t":"修正消費金融商品及法人金融商品停權標準為現任經理權限授信逾放比率逾2%且逾放金額A組2,400萬元、<mark>B組2,000萬元</mark>、C組1,800萬元；全部停權標準為現任經理權限授信逾放比率逾2%且逾放金額A組3,000萬元、B組2,500萬元、C組2,300萬元。"}},{"id":"S12-66","m":12,"q":"【2026/03/17 消商字第000014號】依公文試算例，金融資產組合鑑價 2,500 萬元、第 1 次質借 2,000 萬元，倫巴底核准最高額度為何？","o":["3,750 萬元","2,000 萬元","2,500 萬元","3,000 萬元"],"a":0,"x":"以設質金額 150% 為上限；逾經理權限 2,400 萬元，屬區域中心。","src":4,"t":"ask","ci":{"b":"公文：2026/03/17 消商字第000014號","c":"消費金融業務處","s":"倫巴底貸款（個人消費性）授信權限額度計算方式","t":"例：專區分行(新興分行)個人擔保授信經理權限2,400萬元，金融資產組合鑑價2,500萬元、第1次質借申請2,000萬元，<mark>倫巴底核准最高額度以設質金額150%為上限即3,750萬元</mark>，審查權限層級為區域中心。"}},{"id":"S12-67","m":12,"q":"【2026/03/18 消商字第000015號】承作珍愛傳承 3,000 萬元，擬以 5 年為一期申請樂活貸，申請額度應為多少？","o":["3,000 萬元","1,500 萬元","不限","5,000 萬元"],"a":0,"x":"申請 5,000 萬元者契約期限應以 3 年為一期。","src":4,"t":"ask","ci":{"b":"公文：2026/03/18 消商字第000015號","c":"消費金融業務處","s":"增修樂活貸作業應注意事項及新增「樂活貸」借款契約(「珍愛傳承」信託專用)","t":"例：承作珍愛傳承3,000萬元，<mark>申請額度應為3,000萬元</mark>；若申請5,000萬元，契約期限應以3年為一期。"}},{"id":"S12-68","m":12,"q":"【2026/01/26 消商字第000003號】保費／保單融資之貸款種類代號為何？","o":["5D、2D","3D、4D","6D、7D","NR、V7"],"a":2,"x":"6D 保費融資、7D 保單融資。","src":4,"t":"ask","ci":{"b":"公文：2026/01/26 消商字第000003號","c":"消費金融業務處","s":"訂定「保費及保單融資作業應注意事項(『地方資產管理專區』專用)」","t":"<mark>貸款種類6D保費融資貸款、7D保單融資貸款</mark>。"}},{"id":"S12-69","m":12,"q":"【2026/01/26 消商字第000003號】保費／保單融資寄發還款通知書後，借款人償還部分借款之期限為何？","o":["掛號寄發次日起 10 個營業日","1 個月","掛號寄發次日起 5 個營業日","掛號寄發次日起 15 個營業日"],"a":3,"x":"逾期未履行得主張期限利益喪失。","src":4,"t":"ask","ci":{"b":"公文：2026/01/26 消商字第000003號","c":"消費金融業務處","s":"訂定「保費及保單融資作業應注意事項(『地方資產管理專區』專用)」","t":"還款通知：擔保維持率低於95%者，應儘速以電話及書面通知借款人償還部分借款；<mark>自以掛號信寄發還款通知書之次日起算不得超過十五個營業日</mark>，如逾期未履行，營業單位得主張期限利益喪失。"}},{"id":"S12-70","m":12,"q":"【2026/01/26 消商字第000005號】倫巴底貸款之擔保維持率計算公式為何？","o":["設質金額÷核准額度","保單解約金÷借款餘額","金融資產組合市價現值÷現貸餘額","現貸餘額÷金融資產組合市價現值"],"a":2,"x":"再乘以 100%。","src":4,"t":"ask","ci":{"b":"公文：2026/01/26 消商字第000005號","c":"消費金融業務處","s":"配合倫巴底貸款開辦，訂定作業應注意事項（地方資產管理專區專用—個人消費性貸款適用）","t":"<mark>擔保維持率=(金融資產組合市價現值÷現貸餘額)×100%</mark>。"}},{"id":"S12-71","m":12,"q":"【2026/01/26 消商字第000005號】倫巴底貸款之新興分行於辦理授信申請作業前，應先完成何事項？","o":["徵提不動產擔保","電洽消費金融業務處登記額度","完成聯貸說明書","取得區域中心核准"],"a":1,"x":"確認取得額度後方得辦理。","src":4,"t":"ask","ci":{"b":"公文：2026/01/26 消商字第000005號","c":"消費金融業務處","s":"配合倫巴底貸款開辦，訂定作業應注意事項（地方資產管理專區專用—個人消費性貸款適用）","t":"<mark>新興分行應事先電洽消費金融業務處登記額度</mark>，確認取得額度後方得辦理相關授信申請作業。"}},{"id":"S12-72","m":12,"q":"【2026/03/26 消商字第000017號】保費融資客戶於寬限期屆滿後仍有寬限期需求，應如何辦理？","o":["不得展延","改辦保單融資","由新興分行經理逕行核准","依個案情況申請區域中心變更條件展延寬限期"],"a":3,"x":"首次提供 2 年寬限期。","src":4,"t":"ask","ci":{"b":"公文：2026/03/26 消商字第000017號","c":"消費金融業務處","s":"新增「地方資產管理專區辦理保費融資業務問答集」","t":"保費融資首次提供2年寬限期，倘客戶於寬限期屆滿後仍有寬限期需求，<mark>得依個案情況申請區域中心變更條件展延寬限期</mark>。"}},{"id":"S12-73","m":12,"q":"【2026/03/26 消商字第000017號】依問答集，高資產客戶保費融資自備款不足，實務上建議優先評估以何種方式補足？","o":["樂活貸","倫巴底貸款","保單融資","信用貸款"],"a":2,"x":"倫巴底可再質借 2 次且每人限 1 筆，宜保留資金調度彈性。","src":4,"t":"ask","ci":{"b":"公文：2026/03/26 消商字第000017號","c":"消費金融業務處","s":"新增「地方資產管理專區辦理保費融資業務問答集」","t":"考量倫巴底貸款具可再質借2次之特性，且每位客戶僅可申辦1筆倫巴底貸款，<mark>實務上建議可優先評估運用「保單融資」方式補足自備款需求</mark>。"}},{"id":"S12-74","m":12,"q":"【2026/04/07 消商字第000020號】央行管控案件承作情形按月報送，營業單位當日漏填時最遲應於何時完成填報？","o":["當月月底日前","當週週五","次月 10 日前","次一營業日"],"a":0,"x":"應於貸放後立即至行員專用系統填報。","src":4,"t":"ask","ci":{"b":"公文：2026/04/07 消商字第000020號","c":"消費金融業務處","s":"轉知「中央銀行對金融機構辦理不動產抵押貸款業務規定修正規定」，溯自115年3月20日起生效","t":"消金e-loan系統已擴增央行管控規定之案件類型共20項；前述案件承作情形將按月報送中央銀行，營業單位應於貸放後立即至「行員專用系統」填報，倘當日漏填，<mark>最遲應於當月月底日前完成相關填報作業</mark>。"}},{"id":"S12-75","m":12,"q":"【2026/04/23 消商字第000024號】採電話錄音方式之專區申請案件，客戶應如何於申請文件用印？","o":["由轉介分行代蓋","不需用印","須經公證","簽蓋任一原留印鑑"],"a":3,"x":"由新興分行依規定辦理核章。","src":4,"t":"ask","ci":{"b":"公文：2026/04/23 消商字第000024號","c":"消費金融業務處","s":"專區授信試辦業務於「案件申請」階段，得以電話錄音方式進行商品說明與風險揭露","t":"採電話錄音方式之申請案件，<mark>客戶應於相關申請文件簽蓋任一原留印鑑</mark>，並由新興分行依規定辦理核章作業。"}},{"id":"S12-76","m":12,"q":"【2026/04/29 一總消商字第001818號】修訂後保費融資業務之寬限期規定改列於何項目下？","o":["其他風險控管措施","額度申請","貸款期限","償還方式及寬限期"],"a":3,"x":"使條文結構更為明確。","src":4,"t":"ask","ci":{"b":"公文：2026/04/29 一總消商字第001818號","c":"總行","s":"修訂高資產客戶「保費及保單融資」業務作業要點","t":"<mark>將寬限期規定改列於「償還方式及寬限期」項下</mark>。"}},{"id":"S12-77","m":12,"q":"【2026/02/24 債劃字第000025號】債權管理處訂定「逾期放款案件查找財產暨執行作業應注意事項」之目的為何？","o":["減少訴訟費用","加速轉銷呆帳","提高催收獎金","避免因過度或不當措施影響客戶基本權益及本行形象"],"a":3,"x":"提供催收單位遵循。","src":4,"t":"ask","ci":{"b":"公文：2026/02/24 債劃字第000025號","c":"債權管理處","s":"函布「第一商業銀行辦理逾期放款案件查找財產暨執行作業應注意事項」","t":"<mark>避免因過度或不當措施影響客戶基本權益及本行形象</mark>，訂定應注意事項提供催收單位遵循。"}},{"id":"S12-78","m":12,"q":"【2026/03/27 債劃字第000043號】圈存存款後辦理抵銷，其效力何時發生？","o":["法院裁定時","抵銷通知到達或視為到達被抵銷人後，溯及最初得為抵銷時","入帳時","圈存時"],"a":1,"x":"仍應發抵銷函予被抵銷之債務人。","src":4,"t":"ask","ci":{"b":"公文：2026/03/27 債劃字第000043號","c":"債權管理處","s":"逾放(含呆帳)債務人存款辦理圈存，所徵取之約定書版本應為新版約定書(第18版)","t":"圈存存款後辦理抵銷作業時，仍應發抵銷函予被抵銷之債務人，抵銷自本行發出之抵銷通知到達或視為到達被抵銷人後，<mark>溯及最初得為抵銷時發生效力</mark>。"}},{"id":"S12-79","m":12,"q":"【2026/06/26 債劃字第000073號】營業單位催收主管應多久檢視一次債權憑證時效？","o":["每半年","每季","每年","每月"],"a":0,"x":"並同時列印「債證到期提醒」表。","src":4,"t":"ask","ci":{"b":"公文：2026/06/26 債劃字第000073號","c":"債權管理處","s":"催收主管定期檢視債權憑證時效時，應同時列印逾催系統「債證到期提醒」表","t":"逾期放款(含呆帳)案件債權憑證，應逐筆登載於實體及逾催系統之「債權憑證登記簿」，營業單位催收主管應負責債權憑證正本之保管，<mark>並每半年檢視債權憑證時效</mark>，除自辦催收案件應自行辦理換發外，另應責成催收人員以業務聯繫單主動通知負責該案催理單位(債權管理處、區域中心或第一金融資產管理股份有限公司)之催收人員，於債權憑證時效消滅前辦理換發。"}},{"id":"S12-80","m":12,"q":"【2025/10/08 法劃字第000077號】外幣貸款建檔時，機動利率案件需於何時建妥「下次利率」？","o":["到期日","撥貸當日","每月底","利率重評日"],"a":3,"x":"建檔時應交互比對批覆條件、借據及端末建檔。","src":4,"t":"ask","ci":{"b":"公文：2025/10/08 法劃字第000077號","c":"法人金融業務處","s":"修訂「業務處理細則-授信篇」外幣貸款業務相關規範（第40章、第45章）","t":"外幣貸款建檔時，務必交互比對「批覆條件」、「借據」及「端末建檔」等內容；若為機動利率案件，<mark>需於利率重評日確實依照利率條件建妥「下次利率」</mark>。"}},{"id":"S12-81","m":12,"q":"【2025/11/20 一總法中字第009293號】連鎖企業加盟業者貸款，加盟總部取得優良或卓越加盟總部認證者，利率得酌予減碼多少？","o":["0.25%","0.05%","0.1%","0.15%"],"a":3,"x":"總部為本行授信戶者亦同。","src":4,"t":"ask","ci":{"b":"公文：2025/11/20 一總法中字第009293號","c":"總行","s":"自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」","t":"利率按本行一年期定儲機動利率加年息1.085%以上機動計息；加盟總部為本行之授信戶，或取得台灣連鎖加盟促進協會頒發之「優良加盟總部認證」或「卓越加盟總部認證」資格者，<mark>貸款利率得酌予減碼0.15%</mark>。"}},{"id":"S12-82","m":12,"q":"【2025/11/20 一總法中字第009293號】連鎖企業加盟業者貸款之貸款種類代號為何？","o":["WD","WW","D9","ZS"],"a":1,"x":"「WW：加盟主貸款」。","src":4,"t":"ask","ci":{"b":"公文：2025/11/20 一總法中字第009293號","c":"總行","s":"自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」","t":"<mark>本貸款種類為「WW：加盟主貸款」</mark>。"}},{"id":"S12-83","m":12,"q":"【2025/11/11 一總法劃字第009161號】綠色企業優惠貸款專案之專案代碼為何？","o":["P2","P1","P5","P3"],"a":0,"x":"P3 為永續績效連結授信專案。","src":4,"t":"ask","ci":{"b":"公文：2025/11/11 一總法劃字第009161號","c":"總行","s":"賡續辦理「綠色永續金融優惠授信專案」","t":"<mark>專案代碼P2綠色企業優惠貸款專案</mark>、P3永續績效連結授信專案。"}},{"id":"S12-84","m":12,"q":"【2025/12/23 法中字第000145號】自 2025/11/20 起，個人非消費性貸款停止適用下列何種貸款種類？","o":["NR 消費性擔保貸款","6D 保費融資","WD、WW、ZS 加盟主貸款","5D 倫巴底貸款"],"a":2,"x":"配合開辦連鎖企業加盟業者貸款。","src":4,"t":"ask","ci":{"b":"公文：2025/12/23 法中字第000145號","c":"法人金融業務處","s":"因應實務需要修正「個人非消費性貸款」業務相關規範","t":"配合本行開辦「連鎖企業加盟業者貸款」，並同時廢止現行個別加盟主貸款專案，爰自2025年11月20日起，<mark>個人非消費性貸款停止適用貸款種類「WD：加盟主貸款—統一」</mark>、「WW：加盟主貸款—其他」及「ZS：加盟主貸款—美芝城」。"}},{"id":"S12-85","m":12,"q":"【2026/01/06 法劃字第000001號】銷售鏈融資買方將款項匯入備償專戶時，營業單位應如何處理？","o":["應即沖償借款","留存至到期","由借戶決定","退還借戶活期帳戶"],"a":0,"x":"以確實掌握償還來源並降低授信風險。","src":4,"t":"ask","ci":{"b":"公文：2026/01/06 法劃字第000001號","c":"法人金融業務處","s":"重申「銷售鏈融資」及「線上融資e-Financing」：買方將款項匯入備償借款專戶時，營業單位應即執行帳款核銷作業","t":"倘買方將款項匯入備償專戶時，<mark>應即沖償借款，以確實掌握償還來源並降低授信風險</mark>。"}},{"id":"S12-86","m":12,"q":"【2025/10/17 審劃字第000032號】「LN6409 日報表」應由營業單位如何列印？","o":["每月列印","每週列印","僅於查核時列印","每日指派專人至 OnDemand 列印（無資料免列印）"],"a":3,"x":"備註顯示「**已逾上限」應查明原因。","src":4,"t":"ask","ci":{"b":"公文：2025/10/17 審劃字第000032號","c":"授信審核處","s":"落實工程週轉金累計動用借款金額上限維護交易(6409)，自2025年10月20日起新增欄位及LN6409日報表","t":"<mark>營業單位每日應指派專人至OnDemand系統分行日報表列印「LN6409日報表」</mark>(無資料免列印)。"}},{"id":"S12-87","m":12,"q":"【2026/06/22 審劃字第000028號】融資租賃公司放款對象涵蓋不動產業者，但本次資金用途非屬不動產融通，應如何匡計資金缺口？","o":["以營收 1/4 計算","加計不動產業融資","不需調整","扣除對不動產業融資（或應收款項）占比後匡計"],"a":3,"x":"並於「借款戶分析」揭露占比。","src":4,"t":"ask","ci":{"b":"公文：2026/06/22 審劃字第000028號","c":"授信審核處","s":"修訂「國內營業單位辦理融資租賃公司授信應行注意事項」","t":"辦理融資租賃公司授信申請，應於信用綜合評估表「借款戶分析」揭露借戶放款對象是否涵蓋不動產業者，並敘明是類業務融資(或應收款項)占比；倘有涵蓋不動產業者，惟本次申請資金用途非屬對不動產業資金融通，應於「資金用途分析」試算借戶營運週轉金需求時，<mark>予以扣除對不動產業融資(或應收款項)占比後匡計資金缺口</mark>。"}},{"id":"S12-88","m":12,"q":"【2026/01/23 一總法劃字第000415號、一總消商字第000415號】倫巴底貸款擔保品中，國內上櫃公司股票之最高貸放成數為何？","o":["70%","40%","50%","60%"],"a":2,"x":"上市 60%、ETF/REITs 60%、定存單 90%。","src":4,"t":"ask","ci":{"b":"公文：2026/01/23 一總法劃字第000415號、一總消商字第000415號","c":"總行","s":"申請試辦倫巴底貸款及保費融資與保單融資業務，訂定相關作業要點","t":"本行新臺幣定期存單、定期儲蓄存款、外匯定期存款最高貸放成數90%；國內上市公司股票60%、<mark>國內上櫃公司50%</mark>、REITs及ETF 60%；自行特定金錢信託受益權風險等級低度(RR1)~中高(RR4)70%、高度(RR5)60%；保本型結構型商品及次順位債券RR1~RR4 80%、RR5 70%。"}},{"id":"S12-89","m":12,"q":"【2026/01/23 一總法劃字第000415號、一總消商字第000415號】轉介高資產客戶至專區申辦，「提存後營業毛利」之分配方式為何？","o":["專區 70%、轉介 30%","專區 30%、轉介 70%","全歸專區","專區 50%、轉介 50%"],"a":1,"x":"承作量及平均餘額採雙邊認列 100%。","src":4,"t":"ask","ci":{"b":"公文：2026/01/23 一總法劃字第000415號、一總消商字第000415號","c":"總行","s":"申請試辦倫巴底貸款及保費融資與保單融資業務，訂定相關作業要點","t":"「提存後營業毛利」則透過內部損益調整，<mark>採專區營業據點及轉介分行各獲配30%及70%方式辦理</mark>。"}},{"id":"S12-90","m":12,"q":"【2026/01/21 一總審劃字第000348號】公司信用卡業務得單獨運用經理權限辦理，須符合何條件？","o":["資本額 1 億元以上","授信往來滿半年","上市櫃公司","授信往來滿一年以上，且企業戶評等屬 1~7 等"],"a":3,"x":"不列入授信權限額度計算、不受關係戶歸戶限制。","src":4,"t":"ask","ci":{"b":"公文：2026/01/21 一總審劃字第000348號","c":"總行","s":"修正「國內營業單位經理權限授信要點」，自2026年2月2日起實施","t":"公司信用卡業務，依額度擔保情形於新臺幣授信之擔保授信/純信放額度內辦理，<mark>惟授信往來滿一年以上，適用法金業務信用評等之企業戶且未經專家調升評等前屬1~7等(低風險等級)者</mark>，得單獨運用經理權限辦理，並不列入第二條授信權限額度計算及不受第四條關係戶歸戶之限制。"}},{"id":"S12-91","m":12,"q":"【2026/06/30 審鑑字第000013號】不動產新買賣案件回查實價登錄，自 2026 年 7 月起改由何報表確認查核結果？","o":["RT00004","LN1020","LP-L29","LN21"],"a":0,"x":"LN1020 免再列印，改由消金 e-loan 整批自動比對並揭露於 RT00004，按月列印、設專卷保存 2 年。","src":4,"t":"ask","ci":{"b":"公文：2026/06/30 審鑑字第000013號","c":"授信審核處","s":"自2026年7月起修正不動產新買賣案件回查實價登錄作業規範","t":"現行On-Demand月報表LN1020免再列印，改由消金e-loan系統整批自動比對，並將結果揭露於「<mark>不動產新買賣案件(實價登錄自動比對)貸放月報(RT00004)</mark>」。營業單位應按月列印該報表(RT00004)確認查核結果，並設專卷保存2年。"}},{"id":"S12-92","m":12,"q":"【2026/06/30 審鑑字第000013號】RT00004 查核結果為「查無」或「不符合」者，最遲應於何時完成實價登錄網站查證？","o":["貸放後 3 個月內","貸放後 1 個月內","貸放後 2 個月之月底日前","當月月底"],"a":2,"x":"例：5/8 貸放，最遲應於 7/31 前完成。","src":4,"t":"ask","ci":{"b":"公文：2026/06/30 審鑑字第000013號","c": ["110-36",25]]},{"c":"第37頁","qs":[["113-1",33],["111-42",23],["112-59",22]]},{"c":"第38頁","qs":[["110-44",26]]}]},{"b":"信保手冊：2025年版作業手冊待修訂彙總表(115.10)","pages":[{"c":"第1頁","qs":[["112-31",48],["113-35",48]]},{"c":"第4頁","qs":[["112-33",34]]}]}],"qt":{"neg":0.4,"combo":0.1,"fill":0.2167,"ask":0.2833},"rv":{"sub":"依《徵信篇》114.07 版（10 章）＋《授信篇》115.6.30 版（63 章）逐章抽取，共約 1328 條複習點；<b>紅字</b>為關鍵數字；另附<b>信保基金</b>作業手冊（含待修訂彙總）與<b>公文函令</b>複習點","secs":[{"t":"徵信篇（114.07 版，共 10 章）","chs":[{"id":"credit-s0p0-c1","t":"第一章 徵信業務概述","fc":"B","fq":"5年約10題（每年約2題）· B級","h":"<h4>第一節 徵信的意義與內涵</h4>\n<ul>\n<li>「徵信」（Credit Investigation）即證實信用、證實未來付款之能力；徵信與授信為一體兩面。</li>\n<li>信用要素演進：最早三C＝<b>品格Character、經營能力Capacity、資本Capital</b>；1910年Post加<b>擔保品Collateral</b>成四C；1943年Gee加<b>經營環境Condition of Business</b>成五C。</li>\n<li>五C再整理成<b>三F</b>：個人因素(Personal)、財務因素(Financial)、經濟因素(Economy)；加組織因素成四F、加資訊因素成<b>五F</b>；Drake將個人因素修正為管理因素(Management)。</li>\n<li>實質內涵：企業受外部不可控制的自變因素（經濟、產業、其他）與內部可控制的應變因素（管理，含五大機能：行銷、生產、財務、人事、研究發展）影響，成果展現於財務因素。</li>\n<li>徵信內涵尚應評估「將來性」（前瞻性）。</li>\n</ul>\n<h4>第二節 徵信功能與工作特質</h4>\n<ul>\n<li>徵信基本功能：滿足授信需要、降低授信風險、減少呆帳損失。</li>\n<li>徵信工作五特質：<b>求真性、綜合性、互助性、前瞻性、超然性</b>。</li>\n</ul>\n<h4>第三節 徵信工作之步驟與方法</h4>\n<ul>\n<li>五步驟：<b>擬訂計劃 → 蒐集資料 → 調查分析 → 綜合研判 → 編製報告</b>。</li>\n<li>蒐集資料應注意：宜至少蒐集<b>三年以上</b>資料以資比較；保持完整性與連續性；遵守個人資料保護法。</li>\n<li>查證方法二種：直接調查（訪問面詢、實地調查）、間接調查（外部環境、往來廠商/銀行/徵信機構）。</li>\n<li>綜合研判：對大企業以財務報表分析為中心，對中小企業以考查經營者為要點。</li>\n</ul>\n<h4>第四節 徵信人員應有之素養</h4>\n<ul>\n<li>六項素養：豐富的專業知識、敏銳的觸覺與觀察能力、熟練的分析能力、誠懇的待人態度、積極進取之工作態度、嚴守機密。</li>\n</ul>\n<h4>第五節 實地徵信之要領</h4>\n<ul>\n<li>事前準備八事項：含閱讀<b>最近三年度財務報表</b>、了解主要股東/董監事持股與關係企業、主要往來銀行與額度、所屬產業動態、確定訪談重點。</li>\n<li>訪談順序：由業務狀況、生產與銷售、往來廠商、廠房設備、財務報表，由淺入深切入重點。</li>\n</ul>\n<h4>第六節 編製徵信報告應注意事項</h4>\n<ul>\n<li>三原則：充分表達的原則、客觀的立場、把握重點簡單明瞭（措辭平實，避免極端刺眼用語）。</li>\n</ul>"},{"id":"credit-s0p0-c2","t":"第二章 徵信調查之範圍","fc":"C","fq":"5年約9題（每年約2題）· C級","h":"<h4>第一節 徵信工作的對象</h4>\n<ul>\n<li>徵信工作＝與授信業務有關之信用調查與財務分析（徵信準則第4條）。</li>\n<li>聯貸參貸行仍須進行盡職調查與信用風險分析，不得僅以主辦行聯貸說明書作為徵信報告。</li>\n<li><b>免辦徵信</b>情形：會員銀行、政府機關、公營事業、政府計劃性授信案件、已提供本行存款十足擔保之授信案件；提供本行定存單/存摺存款設質十足擔保者得酌情免辦（「稅捐記帳保證」及「商品(服務)禮券保證」除外）。</li>\n<li>憑本行承兌之匯票貼現、以政府公債質借之擔保放款，得酌情免辦徵信。</li>\n<li>即使免辦徵信仍應徵取基本資料、確認借戶身分與法人資格。</li>\n</ul>\n<h4>第二節 基本資料的徵提</h4>\n<ul>\n<li>資料不齊而未依限補齊者，不予辦理徵信。</li>\n<li>企業短期授信應徵10項基本資料，含<b>最近3年之資產負債表、綜合損益表或會計師財報查核報告</b>、<b>最近2年稅捐機關納稅證明</b>、關係企業三書表等。</li>\n<li>中長期授信：週轉資金授信（含短期展期續約超過1年以上者）總授信金額達<b>新台幣2億元</b>者，另加送營運計畫、現金流量預估表、預估資產負債表及預估綜合損益表。</li>\n<li>總授信金額＝聯徵中心歸戶餘額＋本次申貸金額，<b>得扣除存單質借、出口押匯、進口押匯之金額</b>。</li>\n<li>關係企業三書表＝關係報告書、關係企業合併營業報告書、關係企業合併財務報表。</li>\n<li>首次往來且無擔保授信總額逾<b>新台幣500萬元</b>、且前一年度未經會計師查核簽證者，應徵提最近年度會計師財報查核報告。</li>\n</ul>\n<h4>第三節 資料表之種類與運用</h4>\n<ul>\n<li><b>小規模營利事業簡易資料表</b>：總授信金額<b>600萬元（含）以下</b>，或<b>1,500萬元（含）以下且十足擔保</b>者。</li>\n<li><b>簡易資料表</b>：總授信金額逾<b>600萬元、未達3,000萬元</b>者。</li>\n<li><b>資料表</b>：總授信金額達<b>3,000萬元（含）以上</b>，或未達3,000萬元惟提供會計師財報查核報告者。</li>\n<li><b>預估報表</b>：總授信金額達<b>2億元</b>者；授信期限逾<b>7年</b>者至少編製7年。</li>\n<li><b>公司信用卡專用徵信資料表</b>：與本行無授信往來、僅申辦公司信用卡額度在<b>300萬（含）以下</b>之企業戶。</li>\n<li>個人授信：非消費性用「個人資料表」；消費性用「貸款申請書（含徵信資料提送表）」。</li>\n</ul>\n<h4>第四節 個人授信之徵信範圍</h4>\n<ul>\n<li>個人年度收入應酌予匡計，在金融機構總授信金額達<b>新台幣2,000萬元</b>者，應徵提報稅資料。</li>\n<li>同一關係人資料表：個人授信本行授信總餘額在<b>200萬元（含）以下</b>免徵。</li>\n<li>個人收入與綜所稅申報書有出入時，以申報書內容為準。</li>\n<li>收入總額與借款金額顯不相當時，應另徵取其他收入說明書。</li>\n<li>受輔助宣告者須取得輔助人書面同意。</li>\n</ul>\n<h4>第五節 企業授信之徵信範圍</h4>\n<ul>\n<li>短期授信八項調查範圍：組織沿革、企業及負責人一般信譽、設備規模、業務概況（附產銷量值表）、存款及授信往來、保證人信譽、財務狀況、產業概況。</li>\n<li>中長期授信：週轉資金授信總授信金額達<b>2億元</b>者增加償還能力分析；其他中長期授信增加建廠或擴充計畫與分期償還能力分析。</li>\n<li>中小企業簡化徵信：授信金額<b>600萬元（含）以下</b>，或<b>1,500萬元（含）以下且十足擔保</b>者，簡化為五項。</li>\n<li>中國境內企業授信戶應查「國家企業信用信息公示系統」。</li>\n<li>紙上公司（PAPER COMPANY）須檢附在台母公司/關係企業徵信報告影本。</li>\n</ul>"},{"id":"credit-s0p0-c3","t":"第三章 財務分析","fc":"A","fq":"5年約25題（每年約5題）· A級","h":"<h4>第一節 財務資料之徵取</h4>\n<ul>\n<li><b>會計師財務報表查核報告徵取門檻</b>：公司組織之民營營利事業，在金融機構總授信金額（扣除出口押匯、存單質借、進口押匯）達<b>新台幣3,000萬元以上</b>者應徵提。</li>\n<li>辦理<b>本票保證</b>之企業授信戶，無論金額是否達3,000萬元均須徵提會計師財報查核報告。</li>\n<li>徵取時間：上市櫃公開發行公司於會計年度終了後<b>3個月內</b>；實收資本額達<b>100億元以上</b>上市櫃不得逾<b>75日</b>；興櫃及未上市櫃公開發行公司<b>4個月內</b>；非公開發行企業<b>5個月內</b>；私立學校<b>4個月內</b>（12/1起）。</li>\n<li>稅務簽證<b>不得替代</b>會計師財報查核報告。</li>\n<li>會計師受警告或申誡處分者，得接受自處分日起<b>一年內</b>簽發之查核報告（須註明）；停止執行業務處分期間不予採用；除名或撤銷核准者不予採用。</li>\n<li>總授信金額未達3,000萬元者，徵取加蓋稅捐機關收件章之營所稅結算申報書影本。</li>\n<li>自編財務報表須出具「聲明書」；小規模營利事業每月營業額未滿<b>20萬元</b>免用統一發票者，得徵取自編報表。</li>\n</ul>\n<h4>第二節 我國企業適用會計準則之發展</h4>\n<ul>\n<li>公開發行公司及主要金融特許事業自<b>102年</b>起分階段採用<b>T-IFRSs</b>。</li>\n<li>非公開發行企業自<b>105年</b>起適用<b>企業會計準則公報（EAS）共22號</b>。</li>\n<li>小規模（每月營業額20萬元以下免用統一發票）之合夥或獨資商業可不適用商業會計法。</li>\n</ul>\n<h4>第三節 會計師財務報表查核報告</h4>\n<ul>\n<li>形式二種：<b>短式報告</b>（含四表及附註）、<b>長式報告</b>（另含重要會計項目明細表）；銀行一般只須徵取短式報告。</li>\n<li>新式查核報告依審計準則公報<b>第57～62號</b>，自<b>107年7月1日</b>起全面取代第33號。</li>\n<li>新舊差異：查核意見段移至<b>首段</b>；上市櫃新增「<b>關鍵查核事項</b>」段；<b>查核意見類型改為四種</b>，刪除修正式無保留意見。</li>\n<li><b>會計師查核意見四種類型</b>：</li>\n<ul>\n<li><b>無保留意見</b>：財報足以允當表達 → 可受理。</li>\n<li><b>保留意見</b>：不實表達重大但<b>不廣泛</b>；或無法取得足夠證據但影響重大而不廣泛 → 須審慎評估。</li>\n<li><b>否定意見</b>：不實表達重大<b>且廣泛</b> → 不宜受理。</li>\n<li><b>無法表示意見</b>：無法取得足夠證據，可能影響重大<b>且廣泛</b> → 不宜受理。</li>\n</ul>\n<li>核閱報告結論四類型：無保留結論、保留結論、否定結論、無法作成結論。</li>\n<li>查核報告日原則上為<b>董事會通過日</b>。</li>\n<li>僅簽署「本表所列各會計項目餘額經核與帳簿列載相符」者，<b>不能視同查核報告接受</b>。</li>\n</ul>\n<h4>第四節 IFRSs財報閱讀與會計準則之差異</h4>\n<ul>\n<li>IFRSs特性：<b>原則基礎</b>強調經濟實質；採<b>公允價值</b>強調攸關性；重要資訊揭露在附註；分析主體轉為<b>合併財報</b>。</li>\n<li><b>EAS與T-IFRSs主要差異</b>：</li>\n<ul>\n<li>編製基礎：EAS以個體財報為主；T-IFRSs以合併財報為主。</li>\n<li>資產重估價：EAS<b>得</b>依法令辦理；T-IFRSs<b>不得</b>。</li>\n<li>投資性不動產後續衡量：EAS原則成本模式；T-IFRSs得成本或公允價值模式。</li>\n<li>發展階段支出：符合條件時EAS「<b>得</b>」認列無形資產，T-IFRSs「<b>應</b>」認列。</li>\n<li>商譽：EAS得分期攤銷或減損測試；T-IFRSs不得攤銷、應每年減損測試。</li>\n</ul>\n</ul>\n<h4>第五節 財務報表之攤列與應注意事項</h4>\n<ul>\n<li>保守原則：無法確定時，資產項目列非流動資產，負債項目列流動負債。</li>\n<li>銀行透支屬現金及約當現金之減項，攤列時應調整為流動負債。</li>\n<li>應收票據貼現/融通借款應還原總額並計入「短期借款」。</li>\n<li>逾期/退票/爭訟中之帳款票據應轉列其他非流動資產。</li>\n<li>關係人及股東往來（未訂償還期限）基於保守原則列流動負債；獨資合夥「資本主往來」列權益。</li>\n<li>攤列應保持<b>最近3期</b>攤列原則之一致性。</li>\n</ul>\n<h4>第六節 財務分析方法與主要財務比率</h4>\n<ul>\n<li>分析方法三類：實數分析、比率分析、比較分析。</li>\n<li>比較標準：本公司以前年度資料、業界同年度資料（本行採聯徵中心「主要行業財務比率」）、自行編製預估資料。</li>\n<li>財務比率分五大類：成長性、財務結構、償債能力、經營效率、獲利能力。</li>\n</ul>\n<p><b>財務結構分析：</b></p>\n<ul>\n<li>權益比率（淨值比率）＝<b>權益÷總資產×100%</b>；愈高財務結構較佳。</li>\n<li>固定比率＝<b>不動產廠房及設備÷權益×100%</b>；大於100%表示自有資本不足以支應。</li>\n<li><b>固定長期適合率＝(不動產廠房及設備＋長期性投資)÷(權益＋長期性負債)×100%；宜在100%以下</b>。</li>\n<li>負債比率＝<b>負債總額÷權益×100%</b>；愈低財務愈穩定。</li>\n</ul>\n<p><b>償債能力分析：</b></p>\n<ul>\n<li><b>流動比率（銀行家比率）＝流動資產÷流動負債×100%</b>；高於100%表示流動資產足以償還流動負債。</li>\n<li><b>速動比率（酸性測驗比率）＝速動資產÷流動負債×100%</b>；速動資產＝現金及約當現金＋短期性投資＋應收款項淨額；低於50%表示緊急償債能力甚低。</li>\n<li><b>利息保障倍數＝(稅前純益＋利息費用)÷利息費用</b>；愈高償債能力愈強。</li>\n<li>現金流量比率＝營業活動淨現金流量÷流動負債×100%（動態指標）。</li>\n</ul>\n<p><b>經營效率分析（週轉天數＝365天÷週轉次數）：</b></p>\n<ul>\n<li>應收款項週轉率＝<b>營業收入淨額÷平均應收款項</b>（不扣備抵呆帳）。</li>\n<li>存貨週轉率＝<b>銷貨(營業)成本÷平均存貨</b>。</li>\n<li><b>營業週期＝應收款項週轉天數＋存貨週轉天數</b>。</li>\n<li><b>現金週期＝應收款項週轉天數＋存貨週轉天數－應付款項週轉天數</b>。</li>\n<li>總資產週轉率＝營業收入淨額÷平均總資產。</li>\n</ul>\n<p><b>獲利能力分析：</b></p>\n<ul>\n<li>毛利率＝營業毛利÷營業收入淨額×100%。</li>\n<li>營業利益率＝營業利益÷營業收入淨額×100%（衡量本業獲利能力）。</li>\n<li>純益率＝純益÷營業收入淨額×100%。</li>\n<li><b>ROE＝純益÷平均權益×100%＝純益率×權益週轉率</b>。</li>\n<li><b>ROA＝純益÷平均總資產×100%＝純益率×總資產週轉率</b>。</li>\n<li>財務槓桿度＝營業利益÷(營業利益－利息費用)。</li>\n<li><b>財務槓桿指數＝權益獲利率÷總資產獲利率；大於1表示舉債經營有利</b>。</li>\n<li>期中報表計算週轉率/獲利率時，應將營收、銷貨成本、純益換算為全年度。</li>\n</ul>\n<h4>第七節 主要財務比率之運用</h4>\n<ul>\n<li>流動性衡量須配合速動比率、應收款項與存貨週轉期間。</li>\n<li>負債比率與利息保障倍數為評鑑債券品質重要因素。</li>\n<li>ROE、ROA須自純益率與週轉率兩方面兼籌並顧。</li>\n</ul>"},{"id":"credit-s0p0-c4","t":"第四章 國際財務報導準則(IFRSs)","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<ul>\n<li>金管會分兩階段採用IFRSs：第一階段自<b>102年</b>（上市上櫃、興櫃及金管會主管金融業）；第二階段自<b>104年</b>（非上市櫃之公開發行公司等）。</li>\n<li>IFRSs由<b>IASB</b>發展；採原則基礎、強調經濟實質、以公允價值法評價。</li>\n<li>財務報告以<b>合併財務報告為主、個體財務報告為輔</b>。</li>\n<li>上市上櫃：年度終了<b>3個月內</b>公告經查核簽證年度財報，各季終了<b>45日內</b>公告核閱財報；實收資本額<b>100億元以上</b>不得逾<b>75日</b>。</li>\n<li>IFRSs刪除非常損益及會計原則變動累積影響數，新增其他綜合損益項目。</li>\n<li>流動資產：預期於資產負債表日後<b>十二個月或正常營業週期內</b>實現。</li>\n<li>約當現金：短期（自取得日起<b>三個月內</b>）並具高度流動性、價值變動風險甚小之投資。</li>\n<li><b>IFRS 9金融工具</b>（自107/1/1取代IAS 39）：依經營模式及合約現金流量特性分類為透過損益按公允價值衡量（FVPL）、透過其他綜合損益按公允價值衡量（FVOCI）、按攤銷後成本衡量（AC）。</li>\n<li>存貨以<b>成本與淨變現價值孰低</b>衡量。</li>\n<li><b>IFRS 15客戶合約之收入</b>（自107/1/1取代IAS 11、18）：收入認列五步驟——辨認合約→辨認履約義務→決定交易價格→分攤交易價格→滿足履約義務時認列收入。</li>\n<li>採用權益法之投資：直接或間接持有<b>20%以上</b>股權或有重大影響力。</li>\n<li>商譽不得攤銷，須每年減損測試，減損損失不得迴轉。</li>\n<li><b>IFRS 16租賃</b>（2019/1/1取代IAS 17）：承租人不再區分融資/營業租賃，認列使用權資產與租賃負債；豁免：租期不超過<b>12個月</b>短期租賃、價值約當<b>5,000美元</b>小額資產租賃。</li>\n<li>IFRS 16影響：資產負債表認列更多資產負債、負債比率上揚；EBITDA可能較高。</li>\n<li>員工福利（IAS 19）：確定提撥計畫 vs 確定福利計畫（承擔精算及投資風險，再衡量數認列其他綜合損益）。</li>\n<li>US GAAP以損益表觀點（歷史成本）；IFRSs以資產負債表觀點（公允價值）。</li>\n</ul>"},{"id":"credit-s0p0-c5","t":"第五章 企業會計準則公報","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<ul>\n<li>經濟部修正商業會計法及處理準則，自<b>105年1月1日</b>施行；<b>EAS共22號</b>。</li>\n<li>制定特色：引用IFRSs原則基礎精神；簡化認列與衡量原則；附註揭露從簡（以2013年版IFRSs及IFRSs for SME為藍圖）。</li>\n<li>損益表改稱<b>綜合損益表</b>；刪除「非常損益」及「會計原則變動累計影響數」。</li>\n<li>業主權益變動表改稱<b>權益變動表</b>。</li>\n<li>現金流量表：「融資活動」改稱「<b>籌資活動</b>」，間接法編製起點由稅後損益改為<b>稅前損益</b>。</li>\n<li>EAS金融資產分類含「以成本衡量之金融資產」（無活絡市場公開報價權益工具）——與IFRS 9差異。</li>\n<li>不動產廠房及設備、投資性不動產後續衡量採<b>成本模式</b>。</li>\n<li>商譽及非確定耐用年限無形資產得分期攤銷或每年減損測試。</li>\n<li>營建合約：結果能可靠估計採<b>完工百分比法</b>；無法可靠估計採<b>成本回收法</b>。</li>\n<li>租賃（EAS第20號）：依交易實質分融資租賃/營業租賃。</li>\n<li>首次適用：可選擇追溯調整，或豁免不追溯調整僅作重分類。</li>\n</ul>"},{"id":"credit-s0p1-c1","t":"第六章 現金流量表分析","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>沿革與意義</h4>\n<ul>\n<li>帳上有盈餘未必有現金（<b>黑字倒閉</b>），關鍵在是否擁有充足現金。</li>\n<li>我國民國<b>78年</b>發布財會準則第<b>17號</b>「現金流量表」取代「財務狀況變動表」；100年起「融資活動」改稱「<b>籌資活動</b>」；105年起非公開發行企業適用企業會計準則公報第<b>3號</b>。</li>\n<li>意義：以現金及約當現金之流入與流出，彙總說明特定期間之<b>營業、投資及籌資</b>三大活動現金流量。</li>\n</ul>\n<h4>主要內容及格式</h4>\n<ul>\n<li>營業活動現金流量得就<b>直接法或間接法</b>擇一報導；間接法以<b>稅前損益</b>為編製起點。</li>\n<li>約當現金：短期高流動性投資，通常自取得日起<b>三個月內</b>到期方視為約當現金。</li>\n<li>所得稅：通常分類為<b>營業活動</b>。</li>\n<li>利息收付：各期一致分類為營業、投資或籌資；支付股利：營業或籌資，<b>金控、銀行及票券業限分類為籌資活動</b>。</li>\n<li>非現金交易（融資租賃取得資產、發行權益收購、債務轉權益）應自現金流量表排除，於附註揭露。</li>\n<li>營業活動：主要營收活動；投資活動：長期資產及投資之取得與處分；籌資活動：投入權益及借款規模變動。</li>\n</ul>\n<h4>編製方法</h4>\n<ul>\n<li>直接法：按現金收取總額與支付總額主要類別揭露。</li>\n<li>間接法：自稅前損益調整非現金交易（折舊、處分資產損益）、營運資產負債變動（存貨、應收應付款）、屬投資籌資之損益。</li>\n<li>不論直接法或間接法，營業活動現金流量結果<b>應相同</b>。</li>\n</ul>\n<h4>現金流量表的運用</h4>\n<ul>\n<li>CFO對本期純益之比：衡量<b>純益品質</b>，愈高品質愈高。</li>\n<li>現金流量比率＝營業活動淨現金流量/流動負債×100%；多期負值者經營有隱憂。</li>\n<li>影響營業活動現金流量最重要三會計項目：<b>應收款項、存貨、應付款項</b>；應收增加、存貨增加、應付減少為現金流出因素。</li>\n<li><b>現金循環天數＝應收款項週轉天數＋存貨週轉天數－應付款項週轉天數</b>；愈長表示愈缺現金。</li>\n<li>折舊為非現金費用，須加回。</li>\n<li>現金品質：來自<b>營業活動較佳</b>，來自投資或籌資活動較差。</li>\n<li><b>EBITDA＝稅後損益＋利息費用＋所得稅費用＋折舊＋攤銷</b>，概略表達營業活動現金流量但不足取代CFO。</li>\n<li>營業活動現金流量連續多年流出、持續投資、籌資受阻，表示授信風險可能持續增加。</li>\n</ul>"},{"id":"credit-s0p1-c2","t":"第七章 產業分析","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<h4>產業範圍及基本常識</h4>\n<ul>\n<li>上下游三類：主要產業、產品產業（多為上游零組件如DRAM、PCB、LED）、中間產業。</li>\n<li>市場佔有率＝某公司產品總銷售量/市場總銷售量；愈高愈有機會達規模經濟。</li>\n<li>市場集中度：產出集中前3大或前5大廠商程度，集中度愈高對小廠愈不利。</li>\n<li>產業進入障礙：愈需規模經濟者進入障礙愈難突破。</li>\n<li>產業經營彈性：生產設備、技術、人力可否轉換使用，彈性愈高遭遇循環風險愈低。</li>\n</ul>\n<h4>產業生命週期（必考）</h4>\n<ul>\n<li>六大階段：<b>導入期、成長期、成熟期、衰退期、再成長期、撤出期</b>。</li>\n<li><b>導入期</b>：訂價高、競爭不激烈、市場規模小成長慢、先行者高毛利；風險為前景不確定、市場接受度低。</li>\n<li><b>成長期初期</b>：規模經濟使價格下降、需求快速成長；風險為新投入者過快形成過度競爭。</li>\n<li><b>成長期中後期</b>：競爭激烈、<b>潛在者威脅程度最高</b>、採低價策略防新進入。</li>\n<li><b>成熟期</b>：市場飽和（僅更換需求）、進入障礙提高、集中度高形成<b>寡佔市場</b>、易價格戰。</li>\n<li><b>衰退期</b>：需求減少、產能過剩削價競爭、廠商虧損倒閉引起併購。</li>\n<li>判別準則：導入期競爭者少/利潤幾無或負；成長期競爭者快速增加/成長最快/利潤中等；成熟期競爭者穩定/成長緩慢/利潤高/市場規模最大；衰退期競爭者減少/負成長/利潤低/投資停止。</li>\n</ul>\n<h4>產業景氣循環</h4>\n<ul>\n<li>六狀態：<b>谷底期、復甦期、成長期、高原期、衰退期、蕭條期</b>。</li>\n<li>谷底期風險為營運資金衰竭；復甦期技術領導廠先受惠；成長期吸引新進者（種下衰退因子）；高原期價格鬆動獲利趨降；蕭條期價格低於變動成本仍有流血輸出。</li>\n</ul>\n<h4>產業特性及風險分析</h4>\n<ul>\n<li>三大類：科技產業、傳統產業、服務業。</li>\n<li>競爭環境指標：產品標準化程度（愈高則競爭者多毛利低）、市場集中度、進入障礙、上游供給集中度（愈高議價能力愈低）、替代產品強度。</li>\n<li>產業潛藏風險：產品價格波動、資本支出大景氣低迷造成折舊負擔、產品世代交替快防庫存過時。</li>\n</ul>\n<h4>產業SWOT分析</h4>\n<ul>\n<li>四構面：<b>優勢(S)、劣勢(W)、機會(O)、威脅(T)</b>；優勢劣勢為與同業「相較」之內部因素，機會威脅為外部環境影響。</li>\n<li>不同階段競爭優勢來源：市場初期來自技術能力(創新)；成長期來自企業資源及國家體系支援；成熟期來自財務能力與行銷策略。</li>\n</ul>\n<h4>產經徵信查詢系統(CNR)</h4>\n<ul>\n<li>產業動態資訊：產業新聞台(每日)、產業動向週報(每週)、主要產業景氣動向月報(每月)、產業展望(每季，約<b>50個</b>主要產業)。</li>\n<li>產業SWOT分析已提供<b>200多種</b>產業；行業分類依主計處「中華民國行業標準分類」。</li>\n</ul>"},{"id":"credit-s0p1-c3","t":"第八章 企業經營活動及產銷分析","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>企業外部經營環境分析</h4>\n<ul>\n<li>主要外部環境因子：總體經濟環境、貿易環境、政治環境、法律規範、社會環境、科技環境、產業環境。</li>\n<li>產業環境重要觀念：進入障礙（經濟規模、資金、專利、政府政策、通路、品牌忠誠度）、退出障礙、景氣循環、<b>五力分析</b>（原料供應來源、下游應用市場、現存競爭廠商、潛在進入廠商、替代品）。</li>\n</ul>\n<h4>企業內部經營活動分析</h4>\n<ul>\n<li>五部分：基本資料調查、定位與基本競爭策略、企業功能分析、管理功能分析、發展策略分析。</li>\n<li>企業定位四類：<b>領導者</b>（最高市佔率）、<b>追隨者</b>（維持現有市佔率）、<b>挑戰者</b>（提高市佔率）、<b>利基者</b>（固守特定區隔市場）。</li>\n<li>三種基本競爭策略：<b>成本領導策略</b>（低成本高效率）、<b>差異化策略</b>（需研發或行銷能力）、<b>集中化策略</b>（服務特定區隔）。</li>\n<li>產銷模式：OEM(委託加工製造)、ODM(委託設計製造)、OBM(自有品牌生產)。</li>\n<li>行銷組合5P：產品(Product)、訂價(Pricing)、通路(Place)、促銷(Promotion)、公共關係(Public Relationship)。</li>\n<li>通路策略：通路長度愈長利潤愈薄；須留意與通路商是否互為關係人、避免塞貨美化營收。</li>\n<li>生產管理重點：產能規劃（產能利用率、損益兩平利用率）、存貨管理（JIT零庫存、Build To Order）。</li>\n<li>財務管理：長期資金用於長期用途，<b>短期資金充作長期投資易黑字倒閉</b>。</li>\n<li>資金募集：股東權益（增資、GDR/ADR、保留盈餘）；外部舉債（金融機構借款、公司債CB/ECB、商業本票）。</li>\n<li>組織結構：階層式（掌控佳但反應慢）vs 扁平化（授權大、反應快）。</li>\n<li>發展策略：策略聯盟、購併、垂直整合（確保原料、一貫化生產）、水平整合（合併同階層競爭者，追求規模經濟）。</li>\n</ul>\n<h4>企業競爭力SWOT分析之運用</h4>\n<ul>\n<li>優勢/劣勢為相對競爭者之內部條件；機會/威脅為外部環境。</li>\n<li>SWOT須以公開且經實地徵信確認之資料為主，詳述原因條件數據，不應僅以「較佳、有利、不利」敘述。</li>\n</ul>"},{"id":"credit-s0p1-c4","t":"第九章 徵信報告之編製要領","fc":"B","fq":"5年約10題（每年約2題）· B級","h":"<h4>徵信報告之種類與運用</h4>\n<ul>\n<li>個人戶徵信報告：適用非消費性貸款個人戶，或企業主要負責人、連帶保證人。</li>\n<li>企業戶徵信報告(小額貸款專用)：總授信金額<b>600萬元(含)以下</b>，或<b>1,500萬元(含)以下且十足擔保</b>。</li>\n<li>公司信用卡專用徵信報告：無授信往來、僅申辦公司信用卡額度<b>300萬元(含)以下</b>。</li>\n<li>企業戶徵信報告(依簡易資料表)：總授信金額<b>逾600萬元而未達3,000萬元</b>。</li>\n<li>企業戶徵信報告(依資料表)：總授信金額<b>達3,000萬元(含)以上</b>，或提供會計師財報查核報告者。</li>\n<li>總授信金額<b>達2億元以上</b>且貸有中長期授信：須加徵現金流量預估表、營運計畫、預估資產負債表、預估綜合損益表等。</li>\n<li>徵信報告四特性：<b>一致性、資料性、報告性、前瞻性</b>。</li>\n</ul>\n<h4>個人戶徵信報告編製要領</h4>\n<ul>\n<li>徵信報告編號按受理先後編號不重複，改編仍援用舊號碼。</li>\n<li>上市(櫃)股票時價以撰作日前一營業日收盤價為準。</li>\n<li>總授信金額<b>達2,000萬元</b>者另填報稅資料種類。</li>\n<li>信用狀況：票據使用情形、過去償債情形、查調證券商授信負面信用(T70，僅擔任負責人不得查詢)、不良紀錄（最近<b>六個月內</b>）。</li>\n<li>AML：查A245是否註記「Z1-拒絕開戶」，相關資料保存<b>5年</b>；國籍北韓、伊朗者不得受理。</li>\n</ul>\n<h4>企業戶徵信報告編製要領</h4>\n<ul>\n<li>行業分類：多種行業按產值(營業額)多者認定，相同則按員工人數或資產設備多者。</li>\n<li>重大事項揭露：票信、過去償債、不良紀錄、ESG、關係人交易、防制洗錢等。</li>\n<li>財務情形：新貸戶須揭露最新<b>二年度</b>財報核驗結果；每年<b>10月1日</b>後方可查詢前一年度財務比率。</li>\n<li>企業沿革：自創立年月起按主要變動年月逐項編製。</li>\n<li>產銷分析：內外銷比率、市佔率、產能利用率；高科技加強揭露良率、技術來源。</li>\n<li>財務補充資訊：揭露背書保證、或有負債、向非金融機構借款。</li>\n<li>依資料表編製：主要原料供應商、主要銷售對象（集中度風險）、生產及銷售狀況、收付款方式（與應收應付週轉天期配合）、轉投資事業。</li>\n<li>業界平均比率採聯徵中心「主要行業財務比率」之「<b>A+（綜合平均數）</b>」。</li>\n<li>會計師若<b>一年內</b>曾受警告或申誡處分，得接受查核報告但須說明。</li>\n</ul>\n<h4>境外公司徵信報告</h4>\n<ul>\n<li>須繪製投資架構、資金或交易流程圖。</li>\n<li>共用額度須揭露與國內企業併計之金融性負債、營收、外匯往來實績。</li>\n</ul>\n<h4>依預估報表編製</h4>\n<ul>\n<li>總授信金額<b>達2億元以上</b>且有中長期授信須加編預估報表。</li>\n<li>營運計畫表：預估未來各項產品生產量、內外銷量值。</li>\n</ul>"},{"id":"credit-s0p1-c5","t":"第十章 徵信報告之改編與管理","fc":"B","fq":"5年約11題（每年約2題）· B級","h":"<h4>動態徵信</h4>\n<ul>\n<li>動態徵信：將徵信調查時間從點拓展到面，隨時掌握營運狀況。</li>\n<li>徵信、授信、覆審為連續性工作（事前徵信、放款撥貸、貸放後覆審）。</li>\n<li>企業授信戶徵信報告<b>每屆滿1年</b>須重新徵取資料表改編。</li>\n<li><b>得免逐年改編</b>條件：不動產擔保放款本行授信總餘額<b>1,000萬元(含)以下</b>；移送信保基金保證<b>10成</b>者不限金額；本行授信總餘額<b>200萬元(含)以下</b>且信保<b>9成以上未達10成</b>者。</li>\n<li>清償後再申請授信期間超過<b>6個月</b>應重徵資料表改編。</li>\n<li>發生重大變化（停業、變更負責人、拒絕往來、假扣押、重整）應即重新徵信改編。</li>\n<li>財務資料決算日距改編日<b>不得逾8個月</b>，超過須加徵期中報表。</li>\n<li>徵信人員輪調後引用原報告須於<b>4個月</b>內改編。</li>\n</ul>\n<h4>重要授信戶之徵信</h4>\n<ul>\n<li>重要授信戶：總授信額度<b>逾新臺幣2.5億元</b>者（不含出口押匯、十足擔保等）。</li>\n<li>達標準應送區域中心或徵信處徵信部辦理；續貸中者每年定期送件。</li>\n</ul>\n<h4>徵信檔案管理</h4>\n<ul>\n<li>徵信授信檔案卷宗：徵207（綠色）供公司行號、徵207A（橘紅色）供個人授信戶。</li>\n<li>授信戶清償貸款、解除保證責任後徵信檔案卷宗保存<b>15年</b>。</li>\n</ul>\n<h4>關係企業戶徵信</h4>\n<ul>\n<li>於顧客管理資訊系統辦理顧客關係戶查詢（<b>9704</b>），編製「關係企業及關係人財務狀況彙總表」。</li>\n<li>加強勾稽關係企業間徵信資料異常徵兆（交易條件與財報不符、關係企業間交易條件不對應）。</li>\n</ul>\n<h4>聯徵中心信用資訊</h4>\n<ul>\n<li>聯徵中心民國<b>81年</b>經財政部核定改設為財團法人。</li>\n<li>三種查詢方式：晶片卡查詢、STS查詢、檔案傳輸查詢。</li>\n<li>查詢單位登記簿保存<b>五年</b>；查詢紀錄專卷保留<b>五年</b>。</li>\n<li>查詢資格：符合授信目的或法遵目的，並取得當事人同意或有契約關係。</li>\n<li>信用資訊不得辦理行銷；警示帳戶通報資料完成作業後應立即刪除。</li>\n<li>退件或拒貸案件併同信用資訊表自查詢日起保留<b>五年</b>；「信用資訊表銷毀登記簿」<b>永久保存</b>。</li>\n<li>每年至少查核<b>一次</b>；非正常簽出遭系統鎖定帳號<b>20分鐘</b>。</li>\n<li>客戶查詢個人信用報告五種方式：郵寄、委託代辦、郵局代收代驗、聯徵櫃台、自然人憑證線上取得。</li>\n</ul>\n<h4>個人資料保護</h4>\n<ul>\n<li>個資蒐集應符合法定情形（法律規定、契約關係、當事人同意、公共利益等）。</li>\n<li>初次申辦授信須告知「授信業務蒐集個人資料應告知事項」；對同一個人僅須告知一次。</li>\n<li>徵提登記證件間接取得董監事股東個資，屬「履行法定義務所必要」，免告知。</li>\n<li>查閱收費：頁數未逾<b>10頁</b>每份<b>50元</b>；超過每增1頁加收<b>2元</b>；已入倉庫資料每次調閱加收<b>500元</b>。</li>\n<li>徵信檔案卷宗保存<b>15年</b>；銷毀登記簿<b>永久保存</b>。</li>\n</ul>\n<h4>防制洗錢及打擊資恐（AML/CFT）</h4>\n<ul>\n<li>客戶為法人須徵取「高階管理人員暨實質受益人聲明書」，辦理<b>9796</b>建檔交易。</li>\n<li>得免確認實質受益人（仍須填聲明書）：政府機關、公營事業、公開發行公司及其子公司、受監理之金融機構、政府管理基金、員工持股信託等。</li>\n<li>客戶風險評分（A194）；高風險客戶或觸發情境（重大負面新聞、PEPs）須辦理加強盡職調查（A198）。</li>\n<li>進銷貨廠商名單查證「存在真實性」及「行業關聯性」：台灣查經濟部商工登記及財政部稅務入口網；政府機關或公營事業得免查證。</li>\n<li>命中黑名單且屬受經濟制裁/恐怖份子/資恐凍結者：列為高風險、暫停授信額度且不得申請新額度。</li>\n<li>A245註記「Z1-拒絕開戶」者相關資料保存<b>5年</b>；國籍/註冊地北韓、伊朗不得受理。</li>\n</ul>"}]},{"t":"授信篇（115.6.30 版，共 63 章）","chs":[{"id":"credit-s1p0-c1","t":"第一章 貸放事務通則","fc":"A","fq":"5年約25題（每年約5題）· A級","h":"<h4>第一節 授信人員應有之認識</h4>\n<ul>\n<li>授信基本原則：以<b>信用良好、資產殷實、有將來性</b>者為對象，俾能如期收回。</li>\n<li>避免對個人重複授信，應<b>儘量以公司行號名義</b>貸放；對象不宜偏於某一業種或企業以分散風險。</li>\n<li>放款應注意<b>流動性</b>，以<b>短期性週轉資金為主</b>；中長期設備等資本支出資金須在銀行法規定範圍內辦理。</li>\n<li>授信審查依據：「銀行公會會員授信準則」及「銀行評估信用五項原則」。</li>\n<li>保密義務：客戶借款往來情形應保密，除<b>客戶本人及法定代位清償人</b>外應拒絕查詢。</li>\n<li>例外得查詢機關：主管機關；司法、軍法、稅務、監察、審計等有調查權機關；稅務機關依稅捐稽徵法<b>第30條</b>須報財政部核准；海巡署須首長判行；調查局須局長審核；警察機關須警察局長判行；憲兵須以憲兵司令部名義備文。</li>\n<li>提供資料應以<b>密件</b>處理並提示查詢者保密。</li>\n<li>授信人員應研讀民法、銀行法、公司法、強制執行法、票據法等法令。</li>\n</ul>\n<h4>第二節 授信種類</h4>\n<ul>\n<li>依期間：<b>短期</b>=核准期限<b>一年以內</b>；<b>中期</b>=超過一年而在<b>七年以內</b>；<b>長期</b>=超過<b>七年</b>（均自初貸日起算）。</li>\n<li>依有無擔保：無擔保放款、擔保放款、透支（無擔保、支存帳戶隨時支用償還）、擔保透支。</li>\n<li>其他授信業務：票據承兌、保證、貼現（遠期匯票/本票折扣預收利息購入）、出口押匯（貼現）、開發信用狀、買入外幣匯款暨票據。</li>\n</ul>\n<h4>第三節 利息及違約金</h4>\n<ul>\n<li>利息計算單位為<b>本金一元</b>，未滿一元不計；利息算至<b>元位、四捨五入</b>。</li>\n<li>期間計算：自貸放日（或前次計息日）起至償還日（或本次計息日）<b>之前一日</b>止。</li>\n<li>短期放款（含透支、貼現）：總積數×年利率÷<b>365</b>。</li>\n<li>中長期放款足月部分按月計息：本金×年利率÷<b>12</b>；不足月部分再×畸零日數÷當月日數。</li>\n<li>按月計息以貸放日後各月<b>相當日</b>為應計息日，無相當日以<b>月末日</b>為相當日。</li>\n<li>到期日/應計息日適逢休假日，以<b>次營業日</b>為到期日/計息日。</li>\n<li>違約金：到期不履行自到期日起至清償日之前一日，除遲延利息外加收違約金，展期時亦同。</li>\n<li>違約金級距：<b>逾期六個月以內</b>部分按約定利率加<b>百分之十</b>；<b>逾期超過六個月以上</b>部分按約定利率加<b>百分之二十</b>計收。</li>\n</ul>\n<h4>第四節 授信往來之約定</h4>\n<ul>\n<li>承做授信（個人消金或另有規定除外）應向新借款人、保證人及其他債務人分別徵取<b>約定書</b>。</li>\n<li>約定書簽章須與<b>印鑑卡</b>正面右下方印鑑簽章相符。</li>\n<li>對保須查核<b>雙重身分證明</b>，並於「內政部戶政司」或聯徵中心「<b>Z21</b>」查詢身分證遺失補領情形。</li>\n<li>身分證影本應加註「限辦理第一銀行徵授信使用」字樣。</li>\n<li>展期或分期清償：應徵取<b>全體連帶保證人</b>於展期契據上簽章。</li>\n<li>借款人為自然人以<b>具行為能力者</b>為原則；未成年人須符合民法<b>第1088條</b>「為子女之利益」，僅限申貸<b>購置不動產貸款</b>。</li>\n<li><b>滿七歲以上限制行為能力人</b>借款，須法定代理人親自簽章允許；<b>未滿七歲無行為能力人</b>由法定代理人代簽。</li>\n<li>父母法定代理權依民法<b>第1086、1089條</b>原則由父母<b>共同行使</b>。</li>\n<li>借款人為合夥/隱名合夥須徵全體合夥人同意書並使個人資格連帶保證。</li>\n<li>登記中之公司視同合夥，以發起人一人為代表人，全體發起人個人資格連帶保證。</li>\n<li>保證書徵取身分：無限公司/有限公司=全體股東；兩合公司=全體無限責任股東；股份有限公司=全體董監事；合作社=全體理監事。</li>\n<li>法人組織應徵「董（理）事會借款決議錄」，得免徵情形：全體董監或全體股東已連帶保證、<b>一人股東有限公司</b>、以本行定存質借撥入該公司存款戶、在臺無住所外國法人、依章程僅置董事一人者。</li>\n<li>借款決議錄形式要件：開會日期、場所、主席及出席董事姓名、決議方法（<b>應有過半數董事出席、出席董事過半數通過</b>）、借款金額（<b>應等於或大於借款總金額</b>）、加蓋法人印信。</li>\n<li>徵取時點：新戶於<b>動用或簽約前</b>；股份有限公司於董事任期屆滿改選時重徵；公開發行公司未屆會期得徵承諾書並於會後<b>10日內</b>交付。</li>\n<li>反面承諾書授信依銀行法<b>第30條</b>須經董事會決議。</li>\n<li>法人由經理人簽章者須徵負責人<b>授權書</b>（含授權人/被授權人職稱姓名、授權事項、授權年月日）。</li>\n<li>AML黑名單不得受理；PEPs或負面新聞由營業單位自行評估。</li>\n<li>地方自治機關借款須徵洽借公函、議會/代表會決議案、上級監督機關核准文件。</li>\n<li>成年監護：「受監護宣告之人」為無行為能力人<b>不得徵取</b>；「受輔助宣告之人」須取得<b>輔助人書面同意</b>始得受理，新戶不宜徵取。</li>\n<li>查詢管道：司法院「家事事件公告專區」或聯徵「<b>Z13</b>」，時點為<b>授信額度申請（含條件變更）前</b>。</li>\n<li>見證人方式：視障者搭配<b>一名</b>見證人；蓋章代簽名一名；<b>指印/十字/符號</b>代簽名須<b>二名</b>；不識字須<b>二名</b>；因病麻痺比照不識字（見證人之一儘量具醫療人員資格）。</li>\n<li>見證人應為完全行為能力之明眼人，以配偶或血親為原則；<b>應避免由本行行員擔任</b>（民訴法第314條第2項不得具結）。</li>\n</ul>\n<h4>第五節 債權憑證</h4>\n<ul>\n<li>本票/匯票須備全票據法應記載事項，並記載「<b>免除作成拒絕證書</b>」字樣。</li>\n<li>借據/票據/契約書金額應<b>大寫且不得變更</b>；金額以外記載變更須各債務人於變更處蓋章。</li>\n<li>多人簽章不敷記載得黏單延長，騎縫上須各債務人蓋章。</li>\n<li>債權憑證應由<b>主管人員</b>負責保管。</li>\n</ul>\n<h4>第六節 保證</h4>\n<ul>\n<li>保證人須信譽優良有代償能力；除另有規定（銀行法<b>第12條之1</b>）外均為<b>連帶保證</b>。</li>\n<li>擔保放款以<b>一人</b>保證、無擔保放款以<b>二人</b>保證為原則。</li>\n<li>應避免借保戶相互聯保或一人承保多戶；原則不接受父母、子女、夫妻、兄弟、姊妹間互保。</li>\n<li><b>不得徵取未成年人為保證人</b>；擔保物提供人為未成年須符合民法第1088條「為子女之利益」。</li>\n<li>民法<b>第753條之1</b>：法人董監等有代表權之人為法人保證者，僅就<b>任職期間</b>法人所生債務負責，卸職後對新發生借款不負責。</li>\n<li>作業：辦理法人授信應至經濟部商工登記查詢董監事資料；查詢時點為<b>授信申請時及撥貸當日</b>（徵十足本行活存質權或本行存單等擔保者撥貸時得免查）。</li>\n<li>卸任董監願續任保證人須簽「續任保證人同意書」；不願者須辦保證人條件變更並徵妥約據始得撥貸。</li>\n<li>更換保證人：總行核准案件原則以「條件變更申請書」報總行核准；若原保證書上全部連帶保證人不變或不減少而續保，僅代之借據具名者，授權<b>營業單位經理</b>逕核。</li>\n<li>免除保證人責任須向法定代位清償人徵同意書；「免除」=溯及最初解除；「終止」=向後解除。</li>\n<li>A210交易：免除保證責任「異動代號9刪除」；終止保證責任「異動代號2修改」並修改保證/借款期限欄。</li>\n</ul>\n<h4>第七節 授信總餘額之限制</h4>\n<ul>\n<li>對持有實收資本<b>5%以上</b>企業或負責人/職員/主要股東/利害關係者為擔保授信（不得無擔保），總餘額不得超過銀行淨值<b>一．五倍</b>。</li>\n<li>其中對同一法人擔保授信總餘額不得超過淨值<b>百分之十</b>；對同一自然人不得超過淨值<b>百分之二</b>。</li>\n<li>每筆或累計達<b>新台幣一億元或淨值百分之一孰低</b>者，應經<b>三分之二以上董事出席及出席董事四分之三以上同意</b>。</li>\n<li>得不計入之授信：政府政策專案授信、對政府機關/公營事業授信、以公債/國庫券/央行儲蓄券/央行可轉讓定存單/本行存款為擔保之授信。</li>\n<li>金控子公司（金控法第44條對象）擔保授信須十足擔保、條件不優於同類；限額比率同上（淨值1%須特別決議、自然人2%、法人10%、總餘額1.5倍）。</li>\n<li><b>銀行法第33條之3</b>同一人/關係人/關係企業限額：</li>\n<ul>\n<li>同一自然人授信總餘額不得超過淨值<b>百分之三</b>，其中無擔保不得超過<b>百分之一</b>。</li>\n<li>同一法人授信總餘額不得超過淨值<b>百分之十五</b>，其中無擔保不得超過<b>百分之五</b>。</li>\n<li>同一公營事業不受比率限制但不得超過淨值。</li>\n<li>同一關係人總餘額不得超過淨值<b>百分之四十</b>，其中對自然人不得超過<b>百分之六</b>；無擔保總餘額不得超過<b>百分之十</b>，其中對自然人無擔保不得超過<b>百分之二</b>。</li>\n<li>同一關係企業總餘額不得超過淨值<b>百分之四十</b>，其中無擔保不得超過<b>百分之十五</b>。</li>\n<li>小額放款要點辦理之<b>二百萬元以下</b>授信不計入。</li>\n</ul>\n<li>合併/收購/分割超逾限額者，自基準日起<b>五年內</b>得以原授信額度總額為限額。</li>\n<li>「淨值」=上一會計年度決算後（股東會承認盈餘分配後）淨值；年度中現金增資以取得<b>驗資證明書</b>為計算基準日。</li>\n</ul>\n<h4>第八節 行員及關係人授信之限制</h4>\n<ul>\n<li>銀行法<b>第32條</b>：對持有實收資本<b>3%以上</b>企業或負責人/職員/主要股東/利害關係者<b>不得為無擔保授信</b>（消費者貸款、對政府貸款除外）。</li>\n<li>主要股東=持有已發行股份總數<b>百分之一以上</b>；自然人主要股東配偶及未成年子女持股應計入。</li>\n<li>銀行法<b>第33條</b>：對持有<b>5%以上</b>企業等為擔保授信應<b>十足擔保</b>、條件不得優於同類，達規定金額（<b>一億元或淨值1%孰低</b>）以上須經<b>三分之二以上董事出席及出席董事四分之三以上同意</b>。</li>\n<li>銀行法<b>第33條之1</b>利害關係者：配偶、<b>三親等以內血親</b>或<b>二親等以內姻親</b>；獨資合夥事業；持股超過<b>百分之十</b>企業；擔任董監經理人之企業（投資關係經核准兼任除外）；擔任代表人/管理人之法人團體。</li>\n<li>金控法<b>第44條</b>：對金控負責人及大股東等不得無擔保授信，擔保授信準用銀行法第33條。</li>\n<li>消費者貸款定義：房屋修繕、耐久性消費品（含汽車）、學費、個人小額貸款及信用卡循環信用，合計每一消費者不超過<b>新台幣二百萬元</b>（授信無擔保<b>180萬</b>+信用卡循環<b>20萬</b>控管）。</li>\n<li>「本行負責人」範圍含董事長、董事、總經理、副總、總稽核、處長、分行經理等；「職員」為其餘全體員工；「辦理授信之職員」=對該筆授信有<b>最後決定權</b>之人員。</li>\n<li>「授信條件」含利率、擔保品及估價、保證人有無、期限、本息償還方式。</li>\n<li>「同類授信對象」=<b>最近一年內</b>同一銀行、同一授信用途及同一會計科目項下之授信客戶。</li>\n<li>新任負責人原有無擔保授信在屆清償期前不受第32條限制；屆期展期則受限（合意緩期清償視為舊契約延續）。</li>\n<li>進出口押匯（除遠期進口押匯、三角貿易信用狀、未徵貨物單據為質之進口押匯外）得不受第32條、第33條之2無擔保限制。</li>\n<li>「應有十足擔保」=授信餘額不高於擔保品估價值之一定成數；擔保品貶落應要求補提。</li>\n<li>第33條特別決議<b>不得由董事會授權常務董事會代為行使</b>。</li>\n<li>利害關係者授信經信用保證機構保證且未保證部分另徵足夠擔保，視為擔保授信。</li>\n<li>資料建檔：新任負責人/辦理授信職員應自任免令發布日起<b>七日內</b>填報「有利害關係者資料表」，建檔單位於取得資料當日完成建檔。</li>\n<li>借戶為利害關係人：不得無擔保授信（政府貸款、每戶合計不超過<b>180萬</b>消費者貸款除外）；擔保授信須十足擔保、條件不優於同類，並填「利害關係人與非利害關係人授信條件比較表」。</li>\n<li>高風險客戶授信額度申請<b>不得以經理權限核定</b>，一律送區域中心或授信審核處。</li>\n</ul>\n<h4>第九節 授信統一歸戶</h4>\n<ul>\n<li>授信統一號碼編定（單位代號3位+業務別代號2位+放款帳號5位+檢查號碼1位）。</li>\n<li>關係戶建檔範圍：個人授信戶=配偶；企業授信戶=負責人、董監事、經理人、持股超過<b>百分之十</b>主要股東、關係企業。</li>\n<li>有限合夥事業建檔=代表人、普通合夥人、經理人、持股超過<b>10%</b>有限合夥人。</li>\n<li>公司法關係企業認定：<b>第369-1</b>（控制從屬、相互投資）、<b>369-2</b>（持有他公司有表決權股份超過半數為控制公司）、<b>369-3</b>（執行業務股東/董事半數以上相同、股份半數以上為相同股東持有推定控制從屬）、<b>369-9</b>（相互投資各達對方有表決權股份<b>三分之一以上</b>為相互投資公司）。</li>\n<li>統一歸戶對象：同一借款人在二個以上營業單位、夫妻授信、關係企業授信。</li>\n</ul>\n<h4>第十節 聯行間授信移轉</h4>\n<ul>\n<li>承接單位須就移交文件明細詳加勾稽、逐一檢查是否齊全。</li>\n<li>移轉後<b>一年內</b>填報授信文件應於新編授信帳號下以括弧加列原授信帳號。</li>\n<li>原以經理權限或總行核准之案件移轉後仍有效，承接單位得依原核准號碼與條件繼續貸放。</li>\n<li><b>逾期放款案件</b>（含逾放、催收、呆帳）原則仍由<b>原貸放單位</b>清理，不予移轉。</li>\n<li>轉籍後逾期之「逾期責任」歸屬須就各作業階段是否違失判定。</li>\n</ul>\n<h4>第十一節 其他注意事項</h4>\n<ul>\n<li>徵取備付票據應以留存本行之印鑑發票/背書/承兌；無往來則徵放款印鑑卡存驗。</li>\n<li>無擔保授信借款人資產負債表列有鉅額「<b>股東往來</b>」時，應徵「股東債權居次同意書」確保本行債權優先。</li>\n<li>勞動基準法<b>第28條第1項</b>勞工優先受償債權：<b>積欠工資未滿六個月</b>部分、僱主未給付退休金、資遣費，與<b>第一順位抵押權</b>同順位並按比例受償。</li>\n<li>退休準備金法定提撥率為<b>2~15%</b>；授信時查詢聯徵「<b>R08</b>」。</li>\n<li>洗錢資恐高風險授信戶名單每月列印確認（LN1022）。</li>\n<li>繳納未上市櫃公司增資款融資：須徵<b>自有（或配偶）資產且十足擔保</b>，或信用評等屬<b>1~5等</b>始得承作。</li>\n<li>授信申請（含展期）時借戶<b>最近六個月內</b>有現金增資者，應就增資款進行查證。</li>\n<li>查調證券商授信負面信用（<b>T70</b>）須取得借戶同意。</li>\n</ul>"},{"id":"credit-s1p0-c2","t":"第二章 徵信調查與報告","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>徵信旨在測定借款關係人信用，作為授信審核及債權管理主要參考。</li>\n<li>徵信報告應<b>每年</b>重新調查編製乙次；信用狀況有重大變化時應隨時重新調查。</li>\n<li>徵信單位：營業單位、區域中心、徵信處徵信部依所屬權限辦理；非自身權限者填「授信洽談紀錄兼徵信業務委辦通知單」移送辦理。</li>\n</ul>"},{"id":"credit-s1p0-c3","t":"第三章 授信申請","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>第一節 授信洽談與受理</h4>\n<ul>\n<li>洽談授信須經辦會同主管接洽，於系統登打外訪日誌並由主管放行作成紀錄。</li>\n<li>受理授信應請借款人提出「借款（貼現）申請書」並簽名蓋章。</li>\n<li>循環額度到期有繼續使用必要者，得事前主動蒐集資料辦理徵信並預先申請循環額度備用。</li>\n<li>間接授信案件已核准循環額度者，第一次動用徵全額借款申請書，嗣後免逐次徵取。</li>\n</ul>\n<h4>第二節 申請手續</h4>\n<ul>\n<li>受理應<b>一次告知</b>所需文件，依受理順序登記於「授信案件登記表」。</li>\n<li>AML初審：黑名單不得受理；徵有正副擔保品須填「運用擔保品洗錢及資恐交易態樣檢核表」門檻——<b>個人戶鑑價值達500萬元(含)以上</b>、<b>法人戶達1,000萬元(含)以上</b>。</li>\n<li><b>北韓、伊朗</b>（FATF嚴重缺失國家）之保證人/擔保物提供人/相關擔保品不得徵取。</li>\n<li>高風險客戶授信額度申請<b>不得以經理權限核定</b>，一律送區域中心或授信審核處核定。</li>\n<li>拒絕開戶（Z1）態樣：匿名假名人頭虛設行號、拒提文件、代理查證困難、偽變造證件、僅提供影本、受制裁對象等。</li>\n<li>授信審議小組：經理權限「新戶」及舊戶「會計項目新貸」「增貸」案件<b>無論金額多寡</b>均須提送審議；召集人為單位主管。</li>\n<li>授信聯行查詢：初次申請辦理「顧客帳務資料查詢（9703）」「保證資料查詢（A220）」。</li>\n<li><b>同一借款人限在同一家營業單位授信往來</b>，如擬於不同營業單位往來須經原往來分行同意並報核。</li>\n<li>拒貸案件登記於「拒貸案件存查簿」並敘明理由連續編號訂冊保管。</li>\n<li>放款定價減項評估門檻（符合其一）：實際收益率（提存前含間接授信）達<b>0.65%以上</b>；本行信用評等<b>1-7等</b>；關係戶合計利益貢獻（提存前）達<b>新台幣100萬元以上</b>；個人戶利率扣除資金成本後達<b>0.55%以上</b>；徵取資本抵減工具。</li>\n</ul>\n<h4>第三節 授信申請書之填製</h4>\n<ul>\n<li>各項授信原則以企金/消金e-loan系統申請書辦理。</li>\n<li>行業分類：同一事業從事多種行業按產值（營業額）取多者認定，相同則按員工人數或資產設備較多者。</li>\n<li>借款人欄：公司填公司名稱及負責人職稱姓名；行號填負責人姓名；個人填姓名。</li>\n<li>期限欄不得超過規定期限；「前例最高額」申請展期應填<b>最初</b>核准號碼，一般填<b>最近</b>核准號碼；經批示「不得為前例」者不得填列。</li>\n</ul>\n<h4>第四節 授信展期申請之特殊規定</h4>\n<ul>\n<li><b>以票據作為償還來源之授信原則上不得展期</b>。</li>\n<li>衍生性金融商品違約且授信屆期未清償者，原區域中心展期案件應併送授信審核處。</li>\n<li>展期次數：每筆展期逾<b>五次</b>時，總經理審查權限以上、或徵足額本行活存質權/本行存單等十足擔保者，得由原審查層級核定；主管風控副總權限以下每筆展期逾五次應整戶呈送上一審查層級核定。</li>\n<li>核准期間內自行展期仍應複查借保戶信用營運，有惡化之虞應縮短展期或積極收回。</li>\n</ul>\n<h4>第五節 授信申請書之編號及發送</h4>\n<ul>\n<li>編號原則：申請總行/區域中心案件、經理權限案件、循環額度事後報告案件<b>分開編號</b>，每年度自一號開始。</li>\n<li>展期及條件變更申請書沿用原核准號碼，以「之一、之二」方式表示。</li>\n</ul>\n<h4>第六節 授信批覆書</h4>\n<ul>\n<li>批覆書應確認准駁、限制條件、改正或注意事項，並通知借款申請人。</li>\n<li>額度核准後（存單質借除外）應寄發「額度核定通知書」，借戶確認無誤蓋印回執聯交回。</li>\n<li><b>自貸案件批覆書有效期限</b>：新設定動產不動產擔保授信為<b>六個月</b>，其他一律為<b>四個月</b>；逾規定者應於核准後<b>六個月內</b>辦理第一次撥貸，逾期額度作廢。</li>\n<li>授信額度動用期限自批覆書核准日起算；每次可貸放期限自貸放日或展期日起算。</li>\n<li>須徵循環額度借款契約者應於核准後<b>二個月內</b>徵妥契約，逾期額度作廢。</li>\n<li>出口押匯/買入外幣票據額度以月為單位，最長不得超過<b>次年相當月之月底日</b>。</li>\n<li><b>聯貸案件</b>應於批覆書核准日起算<b>六個月內</b>完成簽約，逾期額度作廢。</li>\n</ul>\n<h4>第七節 授信資料電腦建檔</h4>\n<ul>\n<li>保證人建檔（A210）：法人授信戶有徵保證書「1概括保證」、僅逐筆於借據作保「2個別保證」；個人授信戶一律「2個別保證」。</li>\n<li>每年應以書面通知連帶保證人最高限額保證金額及所負保證債務金額（授信準則第20條第2項）。</li>\n<li>保證人為未成年人名單月報（LP08B）=簽立保證書時<b>未滿18歲</b>之名單。</li>\n<li>反面承諾（A617）：股份有限公司徵有董事會決議反面承諾書須建檔維護。</li>\n</ul>"},{"id":"credit-s1p0-c4","t":"第四章 貸放、收息及收回","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<h4>第一節 貸放手續</h4>\n<ul>\n<li>徵取約定書、印鑑卡及必要文件（<b>消費性貸款免徵約定書</b>）。</li>\n<li>非循環額度企業戶/個人非消費性貸款填「非循環額度放款核貸單」；循環額度或綜合額度填「循環額度放款核貸單」或「綜合授信額度動用核貸單」，逐級陳至經理同意、副理覆核蓋轉帳章後貸放。</li>\n<li>AML撥貸控管：黑名單受經濟制裁/恐怖份子/資恐凍結者<b>不得貸放</b>；北韓/伊朗國籍註冊地<b>不得貸放</b>；PEPs/負面新聞由營業單位審慎評估。</li>\n<li>借據審查：幣別下端緊接<b>大寫金額</b>，金額錯寫不得更改<b>應重新填寫借據</b>。</li>\n<li>對保日<b>不得早於立據日</b>；立據日原則填貸放日（消費性貸款借據得於貸放日前立據）。</li>\n<li>利率重評機制建檔代碼：91=評定週期3個月以下(含)、92=6個月以下、93=1年以下、94=2年以下、95=3年以下、96=超過3年。</li>\n<li><b>新臺幣放款逾期利息及違約金計算規則</b>：</li>\n<ul>\n<li>轉催前「<b>未屆到期日</b>」逾期案件：定額本金/定額年金以「<b>當期應攤還本金（小本金）</b>」為計算基礎計收逾期利息及違約金；一般（還息不還本）期間以「當期應繳利息」計收逾期違約金、<b>不計收逾期利息</b>。</li>\n<li>違約金：按原借款利率之<b>10%（逾期六個月以內）</b>或<b>20%（逾期超過六個月部分）</b>×逾期期間計收。</li>\n</ul>\n</ul>\n<h4>第二節 收息手續</h4>\n<ul>\n<li>未委託代繳者，經辦每月<b>7、20日</b>查詢到期通知單，繳息日前通知借款人繳付。</li>\n<li>繳付本息交易日未逾「預定收息日+5日（含假日）」核對報表執行6780記帳。</li>\n<li>受託繳息還本：借款人得<b>單獨終止</b>委託，存款人<b>不得單獨終止</b>；接到終止通知應於<b>當日</b>辦理停止扣帳。</li>\n<li>約定他人帳戶代扣以借款人之配偶或直系親屬（含未成年子女）為原則。</li>\n<li>自動扣償最後一期本息仍以<b>人工</b>辦理扣償。</li>\n<li>還款來源檢核門檻：個人戶高風險每日償還≥<b>150萬</b>且達本金50%、一般風險≥<b>300萬</b>且達本金50%；非個人戶現金收回<b>50萬(含)以上</b>、轉帳依企業型態級距（獨資合夥/籌備處300萬、中小企業/非公司法人500萬、大企業/政府/公營3億）；提前清償不限金額。</li>\n</ul>\n<h4>第三節 收回手續</h4>\n<ul>\n<li>轉催前「<b>已屆到期日</b>」逾期案件：<b>不限攤還方式</b>，以「<b>未償還本金餘額（大本金）</b>」為計算基礎計收逾期利息及違約金。</li>\n<li>違約金按原借款利率之<b>10%（逾期六個月以內）</b>或<b>20%（逾期超過六個月部分）</b>計收。</li>\n<li>退還債權憑證：全部收回後於正面加蓋作廢章；<b>展期方式繼續借款者原債權憑證不得作廢</b>。</li>\n<li>第三者代償要求代償證明書/收據應視同銀錢收據<b>貼足印花稅票</b>（票據償付者免貼）。</li>\n<li>本票讓與應註明「禁止背書轉讓」並填代償人於被背書人欄。</li>\n<li>除另有規定外借款人得<b>提前清償</b>全部或數期；全部清償以未清償本金依約定利率計息併同本金收取。</li>\n</ul>\n<h4>第四節 展期手續</h4>\n<ul>\n<li>展期債權憑證由借保戶簽蓋原留印鑑粘附原債權憑證，<b>原債權憑證及展期憑證俟授信完全收回方可退還</b>。</li>\n<li>展期利率自展期憑證立約日起計息；<b>保證展期應於展期日一次收取手續費</b>。</li>\n<li>立約日當天辦妥展期並收妥利息及違約金；逾貸款期限者應收妥原到期日至展期日之遲延利息及違約金。</li>\n<li>展期會計項目變更者（如短期擔保放款展期為中期擔保放款）辦理「放款改貸/更正/轉籍(6790)」連動收回產生新授信案件。</li>\n</ul>"},{"id":"credit-s1p0-c5","t":"第五章 綜合授信額度","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>第一節 綜合授信額度分類</h4>\n<ul>\n<li>目的：提供工商企業經常業務過程中所需<b>營運週轉金</b>為主。</li>\n<li>分五類：擔保授信、甲類、乙類、丙類、丁類無擔保授信。</li>\n<li><b>擔保授信</b>額度：辦理授信期間<b>一年以內</b>之擔保授信（分期付款墊付國內票款及商業本票保證以外之其他保證業務不受一年限制）。</li>\n<li><b>甲類無擔保</b>：墊付國內票款、貼現、憑出口信用狀/D/A/D/P出口貸款、憑國內信用狀貸款、國內應收帳款貸款、線上融資單項/動態/應收帳款融資。</li>\n<li><b>乙類無擔保</b>：開發進口即期信用狀、開發進口遠期信用狀、進口託收週轉金貸款。</li>\n<li><b>丙類無擔保</b>：一般週轉金貸款、憑國外訂單契約之出口貸款、簡易票貼、線上融資訂單/驗收單融資、其他授信。</li>\n<li><b>丁類無擔保</b>：開發國內即遠期信用狀、商業本票保證、其他各項保證、透支、活期存款自動貸款。</li>\n<li><b>不納入</b>綜合額度：出口押匯（含出口貼現）、買入外幣匯款暨票據、境外公司綜合融資、線上融資外幣貸款、應收帳款承購（factoring）；徵本行存單/本行承兌匯票/政府債券等有價證券為擔保或償還來源者。</li>\n</ul>\n<h4>第二節 綜合授信額度訂定原則</h4>\n<ul>\n<li>擔保授信最高額度：依擔保品鑑估後<b>貸放限額</b>範圍訂定。</li>\n<li>甲類：依應收帳款、應收票據、進出口實績計算一年內所需資金。</li>\n<li>乙類：依進銷貨量、進出口實績計算一年內所需資金。</li>\n<li>丙類：衡酌經常週轉所需資金。</li>\n<li>丁類：衡酌恆常交易習慣及需要程度覈實訂定。</li>\n<li>綜合額度：在各類最高額度合計範圍內訂定，且<b>不應超過借款企業「最近一年營業額」或「預計未來一年營業額之八成」孰高</b>。</li>\n</ul>\n<h4>第三節 綜合授信額度運用原則</h4>\n<ul>\n<li>綜合額度為<b>循環額度</b>，於各類核准額度範圍內循環動用。</li>\n<li>「擔保授信」額度應<b>優先運用</b>；未用額度得移作甲乙丙類及已申請額度之丁類無擔保。</li>\n<li>丁類運用限制：未敘明額度之授信項目不得運用；最高額度應等於所屬各項授信額度合計；<b>各單項授信額度間不得相互移用</b>；丁類未用額度不得移給甲乙丙類；未申請丁類額度者不得移用擔保授信未用額度辦理。</li>\n<li>乙丙類未用額度得移供<b>條件較優</b>之他類無擔保使用，並依條件較優之他類核准條件辦理（丙類可移乙類或甲類；乙類可移甲類）。</li>\n<li>買入外幣匯款暨票據授信得移用「丙類無擔保」未用額度。</li>\n</ul>\n<h4>第四節 申請手續</h4>\n<ul>\n<li>應向<b>區域中心或授信審核處</b>申請核准。</li>\n<li>額度有效期限自訂約日起<b>最長不得超過一年</b>；循環額度應於核准後<b>二個月內</b>徵妥契約。</li>\n<li>「本件（副）擔保」欄應收票據、應收帳款、出口信用狀、輸出契約、訂單、買賣契約、收款承諾等免計列。</li>\n</ul>\n<h4>第五節 貸放手續</h4>\n<ul>\n<li>建檔先執行「綜合授信額度維護(A640-10)」，核准方式一律為「<b>50</b>」，動用時依貸放/簽約順序改為<b>51至69</b>（60請勿使用）。</li>\n<li>透支及活期存款自動貸款：綜合額度核准金額欄及丁類額度欄均應<b>扣減透支及活存自動貸款額度</b>後鍵入，避免聯徵貸款額度重複計算。</li>\n<li>綜合授信契約應於核准日起<b>二個月內</b>簽妥（放063），逾期額度作廢。</li>\n<li>透支限額一經簽定<b>視同已全部動用</b>。</li>\n<li>每次動用填「綜合授信額度動用核貸單」逐級陳報主管核准。</li>\n</ul>\n<h4>第六節 其他注意事項</h4>\n<ul>\n<li>用途不明確之外幣借款保證<b>不得逕行運用</b>丁類其他保證額度，應另專案申請區域中心或授信審核處核准。</li>\n<li>綜合額度項下各項授信展期超逾規定貸放期限者，應另以「一般授信申請書」及「展期用授信申請書附表」申請核准。</li>\n<li>綜合額度動用期間借戶營運信用不良變化或擔保價值貶落，應重新評估，必要時降低或停止額度使用。</li>\n</ul>"},{"id":"credit-s1p0-c6","t":"附錄補充（銀行公會授信準則重要考點）","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<ul>\n<li>授信定義（準則第2條）：放款、透支、貼現、保證、承兌及其他經核准業務。</li>\n<li>各級授信人員每年應至少進修<b>三小時</b>永續金融訓練課程。</li>\n<li>授信類別分<b>直接授信</b>（企業貸款〔週轉資金/資本支出〕、消費者貸款、其他）、<b>間接授信</b>（保證、承兌、開發信用狀、其他）、<b>無追索權應收帳款承購</b>。</li>\n<li>授信五項基本原則：安全性、流動性、公益性、收益性、成長性；五項審核原則：借款戶、資金用途、償還來源、債權保障、授信展望。</li>\n<li><b>五P原則</b>：People借款戶、Purpose資金用途、Payment還款來源、Protection債權保障、Perspective授信展望。</li>\n<li>資金用途優劣：<b>取得資產最佳、償還既存債務次之、替代股權最差</b>。</li>\n<li>授信回存禁止：不得要求授信款項須一定比率回存不得動用。</li>\n<li>提前清償違約金：個人購屋及消費性貸款如收取違約金應以<b>個別磋商條款</b>約定，按「提供消費者選擇權」及「違約金遞減」原則計收；因不動產遭徵收/天災、借款人死亡重殘、銀行主動要求還款、未以個別磋商條款約定者，<b>不得收取</b>提前清償違約金。</li>\n<li>股票質押：不得受理公司以其<b>本公司發行股票</b>質押授信；董監及持股超過<b>10%</b>大股東與利害關係人設質比率超過<b>50%</b>宜審慎；金融機構/金控董監大股東以該公司股票質押欲超過鑑估值<b>6成</b>須提董事會討論。</li>\n<li>聯合授信達<b>50億元以上</b>政府採購得簽「三方協議書」。</li>\n</ul>"},{"id":"credit-s1p1-c1","t":"第六章 擔保事務通則","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>徵取擔保品之目的：確保授信債權之收回，屆清償期未受清償時得就標的物賣得價金優先受償。</li>\n<li>擔保物權種類（法源）：<b>普通抵押權</b>（民法860）、<b>最高限額抵押權</b>（民法881-1）、<b>動產質權</b>（民法884）、<b>權利質權</b>（民法900）、<b>動產抵押權</b>（動保法15）、<b>信託占有</b>（動保法32）、<b>船舶抵押權</b>（海商法24、25、33-36）。</li>\n<li>普通抵押權 vs 最高限額抵押權：前者擔保「特定」債權；後者就一定範圍內之「不特定」債權，在最高限額內設定。</li>\n<li>擔保品由第三人提供：原則應請提供人參加作保，須查明擔保品確為提供人所有及借款人關係。</li>\n<li>提供人為未成年時，應符合民法<b>1088條</b>「為子女之利益」意旨始得受理。</li>\n<li>提供人為公司：須符合公司法<b>16條</b>（除法律或章程規定得為保證者外，不得為任何保證人），並徵取董事會決議錄。</li>\n<li>公司證券供董事私人借款擔保：股份有限公司須依公司法<b>223條</b>徵取以「監察人」為代表人之公司承認書；無限、兩合、有限公司供代表公司股東私人借款，須徵全體股東同意書。</li>\n<li>擔保品須非法令禁止者，產權糾葛、市價變動激烈、易變質破損者不宜接受。</li>\n<li>擔保債權金額應<b>不低於</b>授信債權本息總額為原則。</li>\n<li>擔保品除土地、有價證券外，應按重置成本並參酌授信金額，以本行為受益人投保適當保險。</li>\n<li>辦理設定時抵押權日期須<b>早於</b>信託登記日期（信託法12：對信託財產不得強制執行，但信託前存在之權利除外）。</li>\n<li>已核發「抵押權塗銷同意書」者，因抵押權效力已不存在，須重新設定後方得貸放。</li>\n</ul>"},{"id":"credit-s1p1-c2","t":"第七章 有價證券擔保","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<h4>第一節 可徵為擔保之有價證券種類</h4>\n<ul>\n<li>種類：銀行存款單（含可轉讓定存單、合作社/農漁會信用部存款單、代確定用途信託資金憑證）、股票、受益憑證、公債、國庫券、中央銀行儲蓄券、金融債券、公司債、其他。</li>\n</ul>\n<h4>第二節 銀行存款單擔保</h4>\n<ul>\n<li>本行新台幣定、儲存單質借：申請人限<b>原存款人</b>，得在存款單<b>面額內</b>貸放，借款期限<b>不得超過存款到期日</b>。</li>\n<li>外匯定存充當新台幣授信擔保：以貸放當日本行公告即期買入匯率折算新台幣，在<b>九成</b>範圍內辦理。</li>\n<li>外匯定存充為外匯授信擔保：面額範圍內辦理；承做幣別與存款幣別不同時，僅得在面額<b>九成</b>範圍內。</li>\n<li>存款單設質作為授信擔保時，按一般授信規定辦理並徵「擔保物提供證」（放16A）。</li>\n</ul>\n<h4>第三節 股票、受益憑證擔保</h4>\n<ul>\n<li>資金用途：不得先以無擔保放款融通購買股票再質押；企業組織申貸限與本身業務有關用途。</li>\n<li>未上市上櫃股票條件：發行公司實收資本額新台幣<b>二億元</b>以上、營業額<b>五億元</b>以上，且最近一年度稅後純益佔實收資本額比率達<b>10%</b>以上，或最近兩年平均達<b>8%</b>以上且最近一年較前一年佳。</li>\n<li>受益憑證：限國內依法募集發行並以新台幣計價者。</li>\n<li>集中度：TCRI 8、9、D等或中華信評twBB(含)以下或台灣惠譽BB(twn)(含)以下之較差標的，實際質押集中度已逾<b>2%</b>（A614）時，應酌減額度或改徵其他擔保品。</li>\n<li>上市公司股票鑑價：按時價（申請前一日收盤價）與最近<b>三個曆月</b>平均價孰低者為鑑價；放款最高不超過鑑價<b>六成</b>。</li>\n<li>上櫃公司股票：鑑價比照上市；放款最高不超過鑑價<b>五成</b>。</li>\n<li>興櫃及未上市上櫃股票：按股票面額與淨值孰低者為鑑價；放款最高<b>五成</b>。</li>\n<li>封閉式證券受益憑證：鑑價比照上市公司股票。</li>\n<li>其他受益憑證：按時價（前一日淨值）與最近三個曆月平均淨值孰低者鑑價；放款最高<b>六成</b>。</li>\n<li>上市（櫃）股票設質應採集保帳簿劃撥辦理；徵「擔保證券變賣同意書」（放176）及「擔保物提供證」（放16A）。</li>\n<li>調高個股限額：應以體質健全發行公司為主，須符合TCRI 1~7或中華信評twBB+(含)以上或台灣惠譽BB+(twn)(含)以上。</li>\n<li>貸放後管理（維持率）：每股時價乘擔保股數低於當日貸放餘額<b>140%</b>者，應通知借保戶攤還或補足擔保品，自寄發通知書次日起不得超過<b>5個營業日</b>；低於<b>120%</b>者，應即實行質權出賣。</li>\n<li>減資款約定由出質人領取者，須以減資後股數及恢復買賣參考價試算，維持率將不足<b>140%</b>應通知客戶處理。</li>\n</ul>\n<h4>第四節 債券擔保</h4>\n<ul>\n<li>債券種類：政府債券（公債、國庫券、中央銀行儲蓄券）、其他債券（金融債券，但不得徵本行發行之次順位金融債券、公司債）。</li>\n<li>鑑價：以面額與市價孰低者為鑑價，放款最高<b>九成</b>。</li>\n<li>徵取債券為擔保之放款<b>不得超過債券到期日</b>。</li>\n</ul>\n<h4>第五節 代為確定用途信託資金憑證擔保</h4>\n<ul>\n<li>發給信託憑證之信託投資公司應依銀行法設立，並參加中央存款保險。</li>\n<li>信託憑證應予記名，並具面額及約定利率條款（保本保息）。</li>\n<li>鑑價、放款、設定悉比照以他行定、儲存單為擔保之規定（放款最高<b>九成</b>範圍內）。</li>\n</ul>\n<h4>第六節 其他應注意事項</h4>\n<ul>\n<li>徵取未於集中交易市場買賣之有價證券（如未上市櫃股票）為擔保時，視為開立保管業務帳戶時點，須簽署CRS自我證明及FATCA聲明書，簽署日期不晚於設質日或撥貸日。</li>\n<li>徵取本票或匯票為擔保（銀行法12、15、施行細則2）：應足額徵取基於國內外商品交易或勞務提供之本票匯票，並徵交易單據佐證。</li>\n</ul>"},{"id":"credit-s1p1-c3","t":"第八章 商品擔保","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>不可為抵押品：化妝品類、衣著類（尼龍/人造絲襪）、洋酒及飲料、洋菸及菸具、裝飾類（外產鑽石珍珠寶石首飾）、糖食類（進口巧克力咖啡糖果）、賭具類。</li>\n<li>限制押品（具備條件始准）：水泥（生產者或備出口有證件者，抵押期限<b>三個月</b>）；西藥（本廠自製含進口原料<b>六個月</b>、國外輸入<b>一個月</b>）。</li>\n<li>依「非常時期取締日用重要物品囤積居奇辦法」不得囤積之重要物資（糧食、服用、燃料、日用品類等），有囤積居奇嫌疑不得徵取。</li>\n<li>商品須：具市場性易處分、價格變動少、品質鑑別簡單不易變質、無自然發火爆炸危險、與借款人營業項目有關。</li>\n<li>銀類、銀元、黃金因真偽計價保管困難，暫不宜徵為擔保。</li>\n<li>鑑價：原料、半製品、製成品以成本與躉售市價孰低者為準，放款在鑑價<b>七成</b>範圍內為原則。</li>\n<li>躉售市價應向該業殷實行號<b>二家以上</b>查詢；進口西藥以進口成本與批發價格之平均值為鑑價。</li>\n<li>應由借款人向保險公司投保必要保險，以本行為受益人，保期屆滿前續保不得中斷；擔保期間應經常前往倉庫查驗。</li>\n</ul>"},{"id":"credit-s1p1-c4","t":"第九章 不動產擔保","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<h4>第一節 擔保標的物之範圍</h4>\n<ul>\n<li>標的物以得設定抵押權之土地、建築物、地上權、礦業權及漁業權為限。</li>\n<li>不宜徵取者（除追加擔保或確保債權外）：申報地價/移轉申報現值未達公告地價/土地現值<b>八成</b>者；已經第三者設定抵押權、不動產役權、農育權、典權、地上權者（政府重大交通建設之地上權除外）；易受風水旱災或地質不良；山間偏僻交通不便；特殊工廠處分困難；地上建物不同時提供之土地；祭祀公業/祠廟；訴訟中或有糾葛；公用事業或公共設施預定地；共有之不動產。</li>\n<li>共有不動產例外可徵取：全部共有人均為擔保物提供人兼連帶保證人並設定全部抵押權；完整一單位建築物所有權全部與基地持分均提供；分別共有農業用地共有人提供其應有部分全部作農業用地貸款擔保。</li>\n<li>特殊法人不動產設定須注意法源：私立學校（私校法32、49，須董事會三分之二出席、董事總額過半數同意並報主管機關核准）；保險業（保險法143不得提供他人債務擔保）；醫療法人（醫療法36、37不得為保證人或提供他人擔保）；社會團體（財務處理辦法13須會員大會通過）；財團法人（財團法人法45須全體董事三分之二出席、出席董事過半數同意並陳報主管機關許可）；期貨商/證券商/證券投資信託公司不得提供財產供他人設定擔保。</li>\n<li>農業用地（農發條例3條10項）：未依法使用之農地不宜徵取；徵取農地應徵「聲明書」不擅自轉讓出租變更地目；有應計土地增值稅者鑑價應扣除，並預徵「農業用地移轉不課徵土地增值稅申請書」及「授權書」。</li>\n<li>農牧用地空地新貸增貸：鑑價前應向借款人徵「土地無套繪證明」；有「套繪管制」原則上不宜徵取為擔保。</li>\n<li>不得受理為主擔保品：有本節二情形者、收益顯不可靠者、新墾或改良土地將來有荒廢之虞者、管理及處分有困難者。</li>\n</ul>\n<h4>第二節 調查及鑑價</h4>\n<ul>\n<li>書面調查：請權利人提出土地/建築物所有權狀；與地政謄本逐項核對，注意有無他項權利設定、查封、預告登記及<b>三七五租約</b>註記。</li>\n<li>實地調查：鑑價人員應與地籍圖及建築物平面圖查對並照相存記；查有無訴訟糾葛、法院查封、未辦保存登記建物。</li>\n<li>鑑價方式一（土地建築物分別鑑價）：土地＝(單位時價×面積)－應計土地增值稅；建築物＝(單位時價×面積)－折舊金額；鑑價金額×貸放成數＝放款金額。</li>\n<li>應計土地增值稅以最近一次公告現值減去原規定地價（或前次移轉申報現值）按法定稅率計算。</li>\n<li>建築物鑑價以重置時值扣除折舊；謄本建材為鋼骨造或鋼骨鋼筋混凝土造(SC,SRC)每坪單價最高加計<b>16%</b>。</li>\n<li>透天住宅加裝電梯者每坪加計<b>10,000~15,000元</b>。</li>\n<li>建築物耐用年數標準：鋼骨/鋼筋混凝土造辦公住宅用<b>50年</b>、加強磚造<b>35年</b>、磚石造<b>25年</b>、鋼架造（有披覆）<b>20年</b>、（無披覆）<b>15年</b>、木造<b>10年</b>。</li>\n<li>地下樓層超建調整：增減第一層不超過<b>30%</b>、第二層<b>40%</b>、第三層<b>50%</b>、第四層以上<b>60%</b>。</li>\n<li>鑑價方式二（房地時價總額鑑價）：適用區分所有權建築物、地上權建築物、以建坪報價或整棟議價之不動產；(單位時價×建坪面積)－建物持分土地應計土地增值稅＝鑑價金額。</li>\n<li>地上權擔保授信：須專案申請總行或區域中心核准；授信到期日以不超過地上權存續期間屆滿前<b>十年</b>為原則；至少每年一次追蹤地租繳付情形（民法836：積欠地租達二年總額得終止地上權）。</li>\n<li>個人戶地上權建築物貸款：一律由總行或區域中心鑑價；貸放成數最高<b>7成</b>；授信到期日不超過地上權存續期間屆滿前<b>10年</b>。</li>\n<li>擔保品出租者，所收押金應自放款金額中扣除。</li>\n</ul>\n<h4>第三節 抵押權之設定、塗銷、變更及擔保品之更換</h4>\n<ul>\n<li>設定限（金）額：原則以放款值加<b>二成</b>或提高至鑑價金額範圍內辦理。</li>\n<li>單純不動產設定案件（未同時申請授信）：設定限額在所屬擔保授信額度權限<b>1.2倍</b>範圍內，授權營業單位經理逕行核定。</li>\n<li>同一擔保品提供二人以上各自借款：應以「一借戶一設定」方式辦理，各設先後順位最高限額抵押權，權利範圍皆為全部。</li>\n<li>抵押權種類：企業戶貸款及個人非消費性貸款一律採「最高限額抵押權」；個人消費性貸款由擔保物提供人自選「最高限額」或「普通」抵押權，原則採最高限額。</li>\n<li>符合個人購屋貸款定型化契約之不動產第一順位抵押權不含購屋以外債務，供其他債務加強保障者應設<b>第二順位</b>抵押權。</li>\n<li>「普通抵押權」設定申貸者，一律以非循環額度申請總行或區域中心核准。</li>\n<li>「最高限額抵押權」擔保債權範圍以「借款、保證、透支、票據、信用卡契約、衍生性金融商品交易契約」6項為原則；不足6項應申請核准。</li>\n<li>建物應由借款人依重置成本投保適當險種與保額，以本行為抵押權人（受益人）。</li>\n<li>空地貸放後管理：至少每年一次實地勘查並拍照留存。</li>\n<li>消金個人戶不動產中長期擔保放款逐年閱覽門檻：A級餘額逾<b>1,500萬</b>、B級逾<b>1,200萬</b>、C級逾<b>1,000萬</b>、D級逾<b>800萬</b>。</li>\n<li>抵押權塗銷：應先查明所擔保授信是否已清償，查詢借款人及擔保物提供人在聯行往來、共同債務、保證、背書、信用卡、衍生性商品情形。</li>\n<li>塗銷一部分抵押權：原則應先償還相當於提回擔保物貸放額之款項（維持原貸放折扣率）。</li>\n<li>移送信保基金保證案件塗銷抵押權或撤銷假扣押，除申請總行/區域中心核准外，尚須申請信保基金核准。</li>\n<li>塗銷全部抵押權而借款人尚有其他授信時，應徵取法定代位清償人同意書。</li>\n<li>存續期間/擔保債權確定期日屆期表（LP115A/B）：屆期前6個月內名單；循環額度已屆期應立即停用不得繼續貸放。</li>\n</ul>\n<h4>第四節 不動產保險</h4>\n<ul>\n<li>住宅火險保額：以重置成本為計算基礎，每坪造價×建物面積（含公共設施）＝住宅火險保額。</li>\n<li>住宅火險造價註記：鋼骨造每坪另加<b>16%</b>；磚木石及金屬構造每坪<b>34,000元</b>；外島比照新北市。</li>\n<li>住宅地震基本保險：以重置成本為基礎，每一住宅建築物以投保<b>一張保單</b>為限，每一門牌推定為一住宅建築物。</li>\n<li>商業火險最低應投保保額＝住宅火險保額×【1-(已使用年限/建物耐用年限)】；理賠為重置成本扣除折舊之實際價值。</li>\n<li>次順位抵押貸款再增保險：向原承保產險公司申請批加第1張保單火險保額，並批加本行為「第二順位抵押權人」，無需另投保。</li>\n<li>不足額保險依保險法<b>77條</b>，保險人負擔以保險金額對標的物價值比例定之，差額損失無法獲理賠；但住宅地震基本保險仍應依應投保金額投保。</li>\n<li>代墊保費須持續催繳，塗銷前須確認墊付保費及利息已收回；利息按日計息（代墊保費×年利率÷<b>365</b>）。</li>\n<li>火險投保問題集：權狀住家用但實際非住宅使用需投保商業火險者，建議以應投保住宅火險金額投保並加註【重置成本條款】。</li>\n</ul>\n<h4>第五節 其他</h4>\n<ul>\n<li>空地（含農地）及土地建築物以外標的物為擔保應專案申請授信審核處或區域中心核准。</li>\n<li>第二、三等後順位借款之債務人非原第一順位者，應申請授信審核處或區域中心核准後貸放。</li>\n<li>買賣移轉後以「抵押權內容變更」變更債務人：雖不違反民法881-3，但宜儘量避免；須徵債務承擔書（放348）並重新鑑價。</li>\n<li>他行轉移本行第二順位抵押後即貸放清償他行者，須隨即取得塗銷他行第一順位抵押權文件。</li>\n<li>續貸/增貸/展期時鑑估已逾<b>一年</b>者應辦理重估；重估後擔保力不足應補徵擔保品或改自償性/信用放款或收回部分貸款。</li>\n<li>逾期後追加設定抵押權，收回延滯放款後再貸放者，須依鑑價作業要點重估。</li>\n<li>不動產新買賣案件應辦理實價登錄查證，貸放後<b>2個月</b>月底前完成查證。</li>\n<li>鑑價人員不得辦理自身鑑價之授信案件申請（甲鑑價之案件需乙辦理申請）。</li>\n<li>法人併購（企業併購法39條1項5款）：土地增值稅准予記存，放款金額應扣除記存之土地增值稅後重新核定淨放款金額。</li>\n</ul>"},{"id":"credit-s1p1-c5","t":"第十章 動產擔保交易","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>第一節 動產抵押</h4>\n<ul>\n<li>除本節規定外均參照第九章不動產擔保及動產擔保交易法辦理。</li>\n<li>可徵取者：得單獨開工之全套機械設備（須合法登記領工廠登記證並與廠房土地一併提供）；車輛；符合動保法<b>4條</b>之特殊標的物（須專案核准）。放置於承租工廠者需徵「拋棄留置權同意書」。</li>\n<li>不得徵取者：已設定質權/抵押權/附條件買賣/信託占有者；第三人留置占有租賃或使用借貸者；存放租用建築物或易受風水災害者；數人共有者（全部共有人願兼連帶保證人並設定全部者除外）；未具完整所有權者；訴訟中或有糾葛者；違章工廠所使用者。</li>\n<li>鑑價：以購置成本（製造成本）扣除折舊為準；購置成本－累積折舊＝鑑價金額；鑑價金額×貸放成數（最高<b>70%</b>）＝放款金額。非一律以最高七成貸放。</li>\n<li>進口動產：已結匯依實際結匯匯率折算，未結匯以鑑價當日本行公告即期賣出匯率折算。</li>\n<li>大客車耐用年數放寬為<b>七年</b>。</li>\n<li>設定期限：一律以貸放期限加<b>五年</b>為準；貸放期限應較標的物剩餘耐用期限或被淘汰期限縮短<b>一年以上</b>。</li>\n<li>不得申請登記情形（動保法施行細則7）：債務人受破產宣告尚未復權或破產程序進行中；未具完整所有權；標的物屬假扣押或假處分。</li>\n<li>擔保品應投保火險或汽車險或鍋爐/機械險，以本行為抵押權人或受益人。</li>\n<li>貸放後重估勘查頻率：授信餘額未達<b>5,000萬</b>每年重估一次；<b>5,000萬(含)以上</b>除每年重估外每<b>6個月</b>再辦理勘查閱覽建檔。</li>\n<li>有效期限屆滿未辦延長仍續貸增貸者，因債權已非抵押權效力所及，拍賣時無優先受償權。</li>\n<li>延長有效期間：原期滿前<b>三十日內</b>得由債權人單獨申請，每次有效期間不得超過<b>一年</b>，不限次數（動保法9）。</li>\n<li>塗銷：授信全部還清且無其他保證（或保證以經理權限核准）者授權經理核定；債務人書面請求後未於<b>十日內</b>交付證明文件者應負損害賠償責任（動保法10）。</li>\n<li>借戶不履行債務：抵押權人得占有抵押物（動保法17）；實行占有應於<b>三日前</b>通知（動保法18）；出賣應於占有後<b>三十日內</b>經<b>五日以上</b>揭示公告就地公開拍賣，並於拍賣<b>十日前</b>書面通知（動保法19）。</li>\n<li>善意留置權人就標的物修繕加工增加之價值，優先於在先之動產擔保權利受償（動保法5）。</li>\n<li>流質契約（清償期未清償時所有權移屬抵押權人之約定）無效（動保法23）。</li>\n</ul>\n<h4>第二節 信託占有</h4>\n<ul>\n<li>除本節外均參照第一節動產抵押及第八章商品擔保辦理；承做時應事先申請授信審核處核准。</li>\n<li>標的物種類與動產抵押相同；經設定動產抵押之動產不得為信託占有標的物，否則信託收據無效。</li>\n<li>本行得取回占有情形：不照約定清償；未經同意遷移；出質或設定抵押權；不依約定方法處分。</li>\n<li>審查依無擔保授信尺度審理；最高融資額度以不超過預估<b>一個營業週期</b>所需原料量值為限；每筆融資期限以不超過<b>六個月</b>為原則。</li>\n<li>應標示「第一商業銀行信託占有物」；不定期查核至少<b>六個月</b>一次。</li>\n<li>融資到期前出售標的物者應提前還款或交客票；短少價值在應收客票及應收帳款範圍內、未收客票應收帳款在二個月營業額內者，得在平均一個月營業額範圍內酌准免提前還款。</li>\n</ul>"},{"id":"credit-s1p1-c6","t":"第十一章 船舶擔保","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>除本章各項外均參照第九章不動產擔保及第十章動產擔保交易辦理；應著重借款人信用及還款來源，申請授信審核處或區域中心核准。</li>\n<li>船舶抵押權種類：一般動力船舶噸位逾<b>二十噸</b>或非動力船舶逾<b>五十噸</b>者得設抵押權（動力未滿二十噸或非動力未滿五十噸具完整所有權者得辦動產抵押權，動保法4）；建造中船舶之抵押權（海商法34）。</li>\n<li>船舶抵押權擔保範圍：除另有約定外包括原債權、利息、遲延利息及實行抵押權費用。</li>\n<li>優於船舶抵押權受償之債權（海商法24）：船長海員僱傭債權；船舶操作直接致人身傷亡賠償；救助報酬、清除沉船費用及共同海損分擔額；船舶操作直接致陸上水上財物毀損之侵權賠償；港埠費運河費水道費引水費。</li>\n<li>建造或修繕船舶所生債權之留置權位次：在海事優先權之後、船舶抵押權之前（海商法25）。</li>\n<li>鑑價：以購置成本（建造成本）扣除折舊或委外鑑價，放款最高不超過鑑價<b>七成</b>為原則；對可能發生之法定抵押權應自鑑價金額酌予扣減。</li>\n<li>貸放期限應較剩餘耐用期限或被淘汰期限縮短<b>一年以上</b>。</li>\n<li>主管機關：船舶登記以船籍港航政機關為主管；建造中船舶以建造地航政機關為主管（船舶登記法2）。</li>\n<li>擔保品應以本行為受益人投保足額船體險，必要時加保兵險、抵押權人利益險或船東責任險。</li>\n<li>船舶所有權移轉未辦被保險人變更者，原被保險人無保險利益，保險單自動失效，須特別注意。</li>\n<li>不得徵取為擔保物（債權確保必要除外）：第三人設先順位抵押權/租賃/留置/占有/使用借貸；數人共有（全部共有人願兼連帶保證人並設定全部者除外）；未具完整所有權；訴訟中或糾葛。</li>\n<li>不適用海商法之船隻（海商法3）：動力未滿二十噸或非動力未滿五十噸；軍事建制艦艇；專用於公務之船舶；海商法1條以外其他船舶。</li>\n<li>附錄一（固定資產耐用年數表，106.2.3修正）：房屋鋼筋混凝土50年；房屋附屬設備昇降機15年、空調中央系統8年；水運鋼鐵造船一萬噸以上18年、未滿一萬噸12年；飛機10年；運輸業用汽車4年、其他業用汽車5年；機車3年；半導體及積體電路製造設備3年；工業用機器人2年、模具2年；雲端資料運算/儲存設備3年。</li>\n<li>附錄二（動保法施行細則2登記機關）：加工出口區以經濟部加工出口區管理處；科學園區以科技部各管理局；農業科技園區以其管理機關；未滿二十噸動力船舶或未滿五十噸非動力船舶以交通部航港局；汽車機車拖車以交通部公路總局；其餘直轄市以直轄市政府、其他以經濟部。</li>\n<li>附錄三（規費）：動產抵押/附條件買賣/信託占有設定登記每件<b>900元</b>，變更登記各<b>450元</b>，註銷登記<b>無</b>費用。</li>\n<li>附錄五（船舶登記費）：抵押權設定登記每件<b>300元</b>、建造中船舶設定<b>300元</b>、抵押權註銷登記每件<b>60元</b>。</li>\n<li>附錄六（貸放成數表）：本行新台幣定存單/存款、黃金存摺<b>100%</b>；他行定儲存單、債券、特定金錢信託受益權<b>90%</b>；上市股票<b>60%</b>、上櫃<b>50%</b>、興櫃及未上市上櫃<b>50%</b>、受益憑證<b>60%</b>；動產（機器設備航空器車輛船舶）<b>70%</b>；商品<b>70%</b>；A級不動產得於5%範圍內辦融資躉繳保費不受85%限制。</li>\n</ul>"},{"id":"credit-s1p1-c7","t":"第十二章 其他擔保","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>第一節 保證</h4>\n<ul>\n<li>得為放款或保證擔保之保證（銀行法12條4款）：各級政府公庫主管機關、銀行或經政府核准設立之信用保證機構之保證。</li>\n<li>公庫主管機關保證：中央限主管院部會署局，地方限省（市）縣（市）政府。</li>\n<li>銀行之保證（施行細則2條2款）：授信銀行以外之本國銀行、信託投資公司、外國銀行在華分行或財政部認可之其他國內外金融機構。</li>\n<li>信用保證機構（施行細則2條3款）：中小企業信用保證基金、農業信用保證基金、海外信用保證基金或其他經財政部核准設立/認可者。</li>\n<li>財團法人中小企業互助保證基金會非屬信用保證機構；其成員貸款已投保保證保險部分，符合條件（承保保險公司經政府核准、受益人為承貸金融機構、無關係企業關係）得視為擔保授信。</li>\n<li>經主管機關認可之外國金融機構保證：已設分行之外國銀行總分行；未設分行者最近一年總資產或資本世界排名<b>一千名</b>以內信用卓著者；大陸地區金融機構比照；本國銀行持股<b>100%</b>之海外子銀行符合前項規定者。</li>\n<li>擔保信用狀/保證函AML管控：黑名單（受經濟制裁或恐怖份子或依資恐法凍結資產者）不得徵提；全面性制裁國家（北韓、伊朗）一律不得受理。</li>\n<li>各筆貸放到期日不得逾擔保信用狀有效期限，並應預留<b>七個營業日</b>求償期間。</li>\n<li>借款人未按期償還者，應於求償期間屆滿前<b>七個營業日</b>前具函向開狀銀行辦理求償。</li>\n<li>擔保信用狀/保證函應載明依國際商會規範開發：UCP 600、ISP 98或URDG 758。</li>\n<li>徵取本行簽發之保證書（含擔保信用狀）為擔保：除已以銀行法12條擔保品為擔保者於擔保範圍內得為擔保授信外，一律不得以擔保放款辦理。</li>\n<li>中小企業信保基金：保證成數部分得視為擔保授信；授信額度等值新台幣<b>300萬元</b>以下且保證成數達<b>8成</b>以上案件盡量不宜以存款備償加強擔保。</li>\n<li>信保基金保證手續費：中小企業以一次計收為原則、中長期得逐年計收；農業信保基金以一次總繳為原則、超過1年以上得按年分期。</li>\n<li>海外信用保證基金目前僅開辦「畢業僑生留臺創業貸款」。</li>\n<li>期中管理報表保存期限<b>2年</b>；送保控管表保存期限<b>1年</b>。</li>\n</ul>\n<h4>第二節 備償借款專戶存款設質</h4>\n<ul>\n<li>新台幣備償借款專戶得設質作為授信擔保；適用範圍限金額確定且當日可動用之新台幣活期存款。</li>\n<li>帳戶開立：徵「備償借款專戶開戶申請書兼約定書」，存摺封面註明「備償借款專戶」；開戶交易存戶性質別代號鍵入「01：備償專戶」。</li>\n<li>質權設定/解除簡化：活期性存款一旦存入質權設定備償戶即視為質權已設定，憑印鑑取款即視同解除設定。</li>\n<li>取款作業：核章記帳應由留存印鑑以外「經辦」辦理，傳票覆核認證應由轉帳以外「主管」辦理。</li>\n<li>餘額控管：授信主管及經辦於存摺內金額前首蓋章確認（主管於結存餘額前、經辦於支出/存入金額前）。</li>\n<li>備償專戶存摺應由撥貸主管保管；質權設定帳戶限本行質權設定備償戶，不得與其他貼現、墊付票款等專戶共用。</li>\n<li>備償專戶清理：對無授信往來者應於借戶無授信往來起算<b>1年6個月</b>內完成；無餘額且無授信往來應辦結清。</li>\n<li>以第三人名義開立備償專戶：徵「備償借款專戶開戶申請書兼約定書（立書人非借款人專用）」，戶名以擔保物提供人名稱建檔，並註明「備償借款專戶，供借款人○○○擔保債權用」。</li>\n<li>擔保物提供人為公司：須符合公司法<b>16條</b>並徵董事會決議錄。</li>\n<li>備償專戶依約定不得抵銷、扣押、供擔保或強制執行；執行存款扣押時應具文向來文機關聲明異議。</li>\n</ul>"},{"id":"credit-s1p2-c1","t":"第十三章 經常性融資通則","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>經常性融資：銀行協助借款人在<b>經常業務過程</b>中所需<b>短期週轉資金</b>的融資業務。</li>\n<li>還款財源：以借款人之<b>營業收入或流動資產變現</b>為還款來源。</li>\n<li>分四種：<b>票據融資</b>（貼現、墊付國內票款、墊付出口票款、出口押匯、進口押匯）、<b>短期放款</b>、<b>透支</b>、<b>活期存款自動貸款</b>。</li>\n<li>承作「營造業」（授信行業別中類編號 <b>41、42、43</b>）之授信案件，授信申請書應勾選「有追蹤事項」，撥貸前於企金e-loan填報入帳追蹤表，貸放後<b>每三個月</b>定期更新追蹤進度（排除僅間接授信或十足擔保者，但間接授信批覆條件有「工程款應匯存本行借戶帳戶」者仍須包含）。</li>\n<li>每月列印「公司授信戶貸放後管理表」（LNEXS），凡有「＊＊＊」記號者代表最近一次追蹤距報表日已逾<b>兩個月（含）</b>，應於當月填寫追蹤表並逐級陳核至經理。</li>\n</ul>"},{"id":"credit-s1p2-c2","t":"第十四章 貼現","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>定義</h4>\n<ul>\n<li>貼現：銀行以<b>折扣方式預收利息</b>而購入<b>未屆到期日</b>之承兌匯票或本票，並取得對借款人<b>追索權</b>之票據融通方式（有追索權）。</li>\n</ul>\n<h4>第一節 申請</h4>\n<ul>\n<li>貸款對象：依法登記之工商企業、其他經濟事業者，或依營業稅法免辦營業登記之農林漁牧事業者為限。</li>\n<li>貼現票據以<b>合法商業行為</b>產生之匯票及本票為限，票據法定要項應齊全。</li>\n<li>票據上金額<b>不得更改</b>（小寫金額經更改與大寫相符且由發票人以原留印鑑證明者可）；金額以外記載變更處應由原記載人簽章。</li>\n<li>票據須經貼現申請人背書，匯票並應經付款人承兌；背書人二人以上時背書應連續。</li>\n<li>貼現票據期限：自貼現之日起算至票據到期日止，<b>最長不得超過180日</b>（情形特殊必須延長者，得申請區域中心或授信審核處核准）。</li>\n<li>票據主債務人（匯票為承兌人、本票為發票人）須未受票交所拒絕往來處分，或<b>最近六個月內無退票註記</b>。</li>\n<li><b>不得受理</b>之票據：已掛失止付/撤銷付款委託、融通票據或有嫌疑、發票人或背書人禁止轉讓記載或承兌附條件之匯票、法人未經代表人依資格簽章或未蓋正式圖章、無法託收之外埠票據、以金融業為擔當付款人之本票但本票用紙非該金融業印發、非以金融業者為擔當付款人之票據。</li>\n<li>憑本行承兌之匯票辦理貼現，得酌情免辦徵信手續並免徵連帶保證人。</li>\n<li>本項業務得在已核准無擔保授信額度及原貸放條件內辦理。</li>\n</ul>\n<h4>第二節 貸放</h4>\n<ul>\n<li>轉讓背書：貼現申請人於票背做記名背書，以「第一商業銀行」為被背書人（分行名稱無需填寫）；背書日填本筆貼現之貸放日。</li>\n<li>所附統一發票查驗後於背面加蓋「驗訖」戳記；如已經其他行庫加蓋「驗訖」者應<b>拒絕接受</b>。</li>\n<li><b>貼現息計算（預扣）</b>：預收貼現利息＝<b>貼現金額 × 年率 × 貼現日數 ÷ 365</b>。</li>\n<li>貼現息應於貼現同時計收由貼現金額扣除（申請人另備款繳納亦可），以「預收利息」科目整理，月算日或償還日將屬該月份者轉入「貼現息」收入。</li>\n<li>計息以<b>實際天數/365</b>、跨月按各月天數分攤（範例：面額10萬、年息6%、61天，預收利息1,003元，撥入支存98,997元）。</li>\n</ul>\n<h4>第三節 收回</h4>\n<ul>\n<li>到期日前償還：票據不得作廢，將貼現申請人姓名填於被背書人欄後由主管簽章交還。</li>\n<li>退票或未獲付款：應<b>即日</b>請求貼現申請人償還。</li>\n<li>拒絕付款而申請人未償還時，應於<b>拒絕付款後四日內</b>書面通知背書人、發票人及其他債務人，並行使追索權。</li>\n</ul>"},{"id":"credit-s1p2-c3","t":"第十五章 墊付國內票款","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>定義與區別</h4>\n<ul>\n<li>墊付國內票款（應收客票週轉金貸款）：銀行對<b>未到期</b>之國內支票、匯票及本票，<b>墊付局部票款</b>之票據融通方式（與貼現「購入票據、預收利息、有追索權」不同；此為墊付局部）。</li>\n<li>貸款對象：依法登記之公司行號，財務健全、經營正常、與本行往來良好者。</li>\n<li>票據來源：應基於商品銷售、機器設備出租或提供服務等<b>實際交易行為</b>產生；融通票據及預簽票據<b>不得受理</b>。</li>\n</ul>\n<h4>期限與額度</h4>\n<ul>\n<li>每筆融資期限<b>最長不得超過180天</b>（分期付款融資得申請放寬）。</li>\n<li>最高融資額度＝<b>(全年內銷金額 ÷ 應收款項週轉次數) × 貸放成數 － 其他行庫申貸客票融資金額</b>。</li>\n<li>週轉次數＝全年內銷金額 ÷（應收帳款＋應收票據）；低於業界平均或異變時應敘明原因並得以業界平均為標準。</li>\n<li>貸放成數在應收客票金額<b>扣除借款期間應計利息後之餘額</b>範圍內訂定。</li>\n<li>無法核對背書簽章之票據金額得計入應收客票總額，但合計超過應收客票總額<b>五成</b>時，超過部分應自融資金額扣除。</li>\n<li>循環額度動用有效期間<b>最長一年</b>。</li>\n</ul>\n<h4>科目、集中度與禁背</h4>\n<ul>\n<li>短期放款-票借短放（17426）：應逐筆依兌現票據金額沖償借款。</li>\n<li>短期放款-其他短放（17442）：徵取100%以上或未達100%成數應收客票之授信，得免逐筆沖償。</li>\n<li>票據集中度限額：同一發票人（含利害關係企業及個人）累計未銷帳金額<b>不得逾授信額度20%</b>（個案從寬須敘明並依層級核准）。</li>\n<li>遠期支票非銀行法擔保品，於E-loan擔保品金額欄以<b>括弧</b>表示。</li>\n<li>禁止背書轉讓票據：以「票借短放」辦理者一律<b>不得徵取</b>禁背票據；簡易票貼另依第四節；優質戶特殊考量得個案申請核准後徵取禁背票據加強保障。</li>\n<li>關係人/關係企業為發票人之票據辦理融通，應於授信條件敘明戶名及金額上限並依層級核准，加強查證交易真實性。</li>\n</ul>\n<h4>貸放、查證與洗防</h4>\n<ul>\n<li>主管人員應對<b>前五大金額票據且達新臺幣50萬元（含）以上</b>者逐張複查票信。</li>\n<li>同一發票人（含利害關係）票據累計<b>未銷帳金額達新臺幣300萬元（含）以上</b>時，應依規定實地查證（一年內已查證者免再查）；上市櫃/興櫃/公發/公營或實收資本額達<b>1億元以上</b>知名廠商得免實地查證，僅查公開資訊。</li>\n<li>同一發票人累計金額達<b>50萬元（含）以上</b>者，應徵取賣方開立之國內統一發票或交易資料；統一發票存根聯加蓋「已在第一商業銀行辦理融資」戳記。</li>\n<li>洗防（AML）：每次貸放同一發票人累計達<b>50萬元（含）以上</b>者，應至AML系統對買方（發票人）做黑名單/PEPs/負面新聞名單檢核。</li>\n<li>客票融資審核工作單：票借短放或100%保持票方式應<b>逐筆</b>於核貸前填製；簡易票貼、線上融資（應收票據）可排除填製。</li>\n</ul>\n<h4>貸放後管理</h4>\n<ul>\n<li>票據應嚴格要求到期提示兌現，不得因借款人或發票人請求擱延。</li>\n<li>退票且無法存入等額款項時，此退票<b>不得加蓋「改委」印文</b>，以利法律訴追。</li>\n<li>得向聯徵中心查詢「T02金融機構間報送國內統一發票號碼重複清單」，比對其他機構過去<b>24個月</b>所開立發票。</li>\n</ul>\n<h4>第四節 簡易票貼</h4>\n<ul>\n<li>目的與對象：提供本行認可<b>中心廠之供應商</b>簡易快速票據融通，取得中心廠之應收票據（本票、匯票或支票）債權者。</li>\n<li>期限：每筆<b>最長不超過180天</b>，以票載到期日加計合理代收交換期間為到期日。</li>\n<li>融資方式：依不同到期日票據<b>逐筆動撥、預收利息</b>，最高於票據<b>面額十成</b>範圍內貸放。</li>\n<li>成數/利率依發票人TCRI或本行企金信評訂定：A級（1~3等）央行重貼現率+1.0%、B級（4~5等）+1.5%、C級（6~7等）+2.0%、D級（非上述）+3.5%。</li>\n<li>以短期放款（17442）辦理；徵取負責人一人為連帶保證人，有實際經營者應加徵；免徵股東債權居次同意書。</li>\n<li>撥款預扣利息及手續費；提前清償者已付利息<b>視同違約金不予退回</b>；清償遲於原估到期日須補收差額利息。</li>\n<li>手續費：每張票據融資金額<b>0.25%以上</b>逐筆計收，每筆<b>最低新臺幣300元</b>。</li>\n<li>免憑交易憑證辦理，但應排除關係人交易取得之應收票據；禁止背書轉讓者亦得辦理。</li>\n</ul>"},{"id":"credit-s1p2-c4","t":"第十六章 應收帳款承購業務（Factoring）","fc":"C","fq":"5年約7題（每年約1題）· C級","h":"<h4>第一節 定義、承購方式及承購型態</h4>\n<ul>\n<li>定義：就授信戶基於商品銷售、勞務提供等實際交易之應收帳款債權，透過債權移轉，提供下列<b>二項以上</b>服務：承擔買方信用風險、營運資金融通、帳務管理、催討/信用調查/代理事務。</li>\n<li><b>承購方式（依是否承擔買方信用風險）</b>：</li>\n<ul>\n<li><b>無追索權（買斷）</b>：本行買斷並擔保買方付款能力，對買方<b>財務事由</b>無力付款負賠償責任；但<b>貿易糾紛</b>（不履行、價量質不符、交貨遲延拒付）本行<b>不予擔保</b>。</li>\n<li><b>有追索權（非買斷）</b>：買方未依約付款時，<b>不論貿易糾紛或財務因素</b>，本行均得向授信戶（賣方）行使求償權及追索權，要求償還預支價金並賠償損失。</li>\n</ul>\n<li>承購型態：與信用保險機構合作、與應收帳款承購商（IF）合作、本行自行收買、應收帳款風險參與（風險參入=風險參與銀行／風險參出=風險讓與銀行）。</li>\n</ul>\n<h4>第二節 承購買方資格及帳款承購額度</h4>\n<ul>\n<li><b>無追索權買方帳款承購額度上限（新臺幣百萬元，TEJ 1~6級）</b>：300 / 240 / 150 / 90 / 60 / 30。</li>\n<li>買方為中央政府、台北市/高雄市政府所屬機構或衛生署所屬醫學中心，比照<b>TEJ第一級</b>辦理。</li>\n<li>國際大廠須Moody's/S&amp;P/Fitch/KBRA達<b>Baa3/BBB-以上</b>（投資等級）方核無追索權額度（美金百萬元：30/15/5）。</li>\n<li>未委託國際評等之國外買方：同時符合D&amp;B規模評等5A（或該國最佳/實收資本或淨值折新臺幣3億以上/市值折8億以上三擇一）且D&amp;B信用評等1（Strong）者，核<b>美金500萬元</b>上限；其持股50%以上關係企業核<b>美金300萬元</b>。</li>\n<li><b>有追索權占買方總虛擬額度</b>；總虛擬額度上限（新臺幣百萬元，TEJ 1~6級）：1,000 / 800 / 500 / 300 / 200 / 100。無追索權額度包含於總虛擬額度內。</li>\n<li>買方額度更新：國內上市櫃每年<b>1、7、11月</b>、國內興櫃及公發每年<b>7、11月</b>依TEJ調整；國際大廠每年<b>5月</b>檢討；原則每週至少一次依TEJ快報更新。</li>\n<li>信用保險機構/承購商承購上限每年<b>5、11月</b>檢討。</li>\n</ul>\n<h4>第三節 交易流程查核及額度佔用</h4>\n<ul>\n<li>查核買賣雙方交易契約、P/O、P/I、商業發票、出貨(驗收)紀錄、收款及商業糾紛，製作「應收帳款承購業務查核報告書」。</li>\n<li>寄售（Consignment）、代銷因貨物權未移轉，<b>應收帳款債權尚未成立，不得辦理</b>。</li>\n<li>買方/IF/信用保險機構額度占用有效期限<b>二個月</b>。</li>\n</ul>\n<h4>第四節 額度申請</h4>\n<ul>\n<li><b>每筆帳款預支價金以不超過實際帳款交易淨額之八成為原則</b>；與IF或信用保險機構合作案件不得超過核給之買方帳款承購額度。</li>\n<li>依金管會令：有追索權授信對象為<b>賣方</b>，無追索權授信對象為<b>買方</b>；眾多賣方對單一買方之無追索權案件須徵買方付款承諾書及備付本票，統包申請。</li>\n<li>承購帳款期限：自裝運日或發票日起算<b>最長不超過180天為原則</b>。</li>\n<li>預支價金到期日即交易付款日；非因財務因素之帳款延遲入帳得於<b>寬限期45天內</b>續辦帳款承購（含預支價金）。</li>\n<li>承購管理費＝每筆發票或交易憑證淨額 × 管理費率（帳款轉讓時計收，不論是否超額或有無預支價金皆逐筆計收）；IF/保險承保案件不得以預支價金金額為計費基礎。</li>\n<li>會計項目：無追索權「應收承購帳款-無追索權(14419)」、有追索權「未收代收款-帳款託收(23825)」、有追索權預支價金「應收帳款融資(16705)」。</li>\n<li>本票：賣方一次開具預支價金額度<b>110%</b>（不論有無追索權）之本票及授權書。</li>\n</ul>\n<h4>第五節 合約製發、徵提文件及債權讓與通知</h4>\n<ul>\n<li>帳款轉讓時發票須加蓋「轉讓及匯款指示（Assignment Clause）」不得遺漏。</li>\n<li>應收帳款承購合約書簽訂後原則永久有效，內容更改時重新簽約。</li>\n<li>債權讓與通知：無訂單/合約者，僅得採「經買方蓋章確認之應收帳款債權轉讓通知書正本」；OneFactor且買方屬大賣場（家樂福、大潤發、愛買等）採雙掛號郵寄「存證信函」。</li>\n<li>每年額度續約時，除有追索權無預支價金且未充副擔保者外，均須查證買方地址後寄發債權讓與通知。</li>\n</ul>\n<h4>第六節 帳款受讓及預支價金</h4>\n<ul>\n<li>賣方對本行同意承購買方之<b>所有應收帳款債權需全數轉讓</b>予本行。</li>\n<li>賣方於本行信評<b>8等（含）以上</b>，每次承購均須照會買方當次承購明細。</li>\n<li>運送單據查證門檻：賣方信評8等以上且當日累計承購金額達<b>等值美金20萬元（含）以上</b>，海運/空運提單或快遞收據應於承購前查證。</li>\n<li>承購管理費每批低於等值新臺幣<b>500元</b>時以500元計收（供應鏈融資同一供應商合計低於500元亦以500元計；經理減免最低不得少於等值新臺幣300元，亦不得低於IF/保險機構管理費）。</li>\n<li><b>帳款逾期時預支價金處理</b>：同一買方逾期<b>30天（不含）以上</b>帳款合計逾該賣方對應買方承購額度<b>二分之一</b>，應停止受理該買方預支價金申請（仍得辦理帳款轉讓）；多買方時逾期30天以上總額逾所有買方總承購額度二分之一，停止所有預支價金申請。</li>\n<li>無論有無追索權，<b>商業糾紛未解決前</b>該買賣方關聯額度原則不得再預支價金。</li>\n</ul>\n<h4>第七節 到期還款及銷帳處理</h4>\n<ul>\n<li>買方入帳不足償還預支價金：屬退貨/折讓確定不再入帳者原則暫停該關聯額度預支價金；屬分批入帳/作業疏失延遲者照會確認付款日後得續辦；屬商業糾紛依商業糾紛處理。</li>\n</ul>\n<h4>第八節 間接還款及商業糾紛</h4>\n<ul>\n<li>間接還款：買方未匯入本行備償帳戶而直接付款給賣方；賣方應於收款後<b>三個營業日內</b>填「間接還款通知書」，有預支價金應償付本息及費用；未取得通知書前原則不得再預支價金。</li>\n<li><b>商業糾紛</b>：賣方接獲通知書後<b>15日內</b>與買方協調，逾<b>30日</b>仍未解決賣方應依約<b>自行買回</b>帳款（已付費用不退）；有預支價金者應於接獲通知後<b>三個營業日內</b>以自有資金償還本息。</li>\n<li>違約金：逾期<b>六個月以內</b>按約定利率加<b>10%</b>、逾<b>六個月以上</b>按約定利率加<b>20%</b>計收違約金。</li>\n</ul>\n<h4>第九節 帳款逾期及理賠</h4>\n<ul>\n<li>已逾到期日<b>三個營業日</b>帳款，OP小組電話/E-mail照會（營業單位/賣方/買方/IF四擇一）。</li>\n<li>有追索權：逾到期日<b>45日</b>買方仍未付款，賣方依約自行買回，有預支價金者接獲買回通知後<b>15日內</b>償還本息（逾期違約金同上10%/20%）。</li>\n<li>無追索權（與IF合作或本行自行收買）：帳款到期日後<b>90日</b>買方仍未付款且無商業糾紛，向IF申請理賠或本行逕行理賠。</li>\n<li>無追索權（與信用保險機構合作）：到期日後<b>30日</b>未獲清償向保險機構申請理賠，最遲於<b>發票日起算200天內</b>提出；理賠時程一般約申請後<b>六個月</b>。</li>\n<li><b>逾期放款列報（聯徵）差異</b>：</li>\n<ul>\n<li>有追索權：比照一般放款，帳款<b>逾期三個月</b>列報為<b>賣方</b>逾期放款。</li>\n<li>無追索權（有IF/保險保證）：於承購商/保險機構<b>確定不理賠之日起3個月內</b>，視係<b>買方或賣方原因</b>造成逾期，列報為該方逾期放款。</li>\n<li>無追索權（無保證）：因<b>買方原因</b>逾期，於轉銷呆帳時將<b>買方資料</b>填報聯徵揭露；因<b>賣方原因</b>逾期，於轉銷呆帳時列報為<b>賣方</b>逾期放款。</li>\n</ul>\n</ul>\n<h4>第十至十一節 貸放後管理及其他</h4>\n<ul>\n<li>轉讓為國內統一發票時，營業單位每月至少抽查二筆核對存根聯是否蓋妥轉讓指示；至財政部稅務入口網抽查二筆確認行號名稱地址。</li>\n<li>國內或大陸帳款應<b>每月照會買方一次</b>確認交易關係存續。</li>\n<li>超過承購額度之應收帳款（未納入保障部分）本行/IF/保險機構均不負理賠。</li>\n<li>賣方應於應收帳款發生後<b>十日內</b>或至少每月一次（最遲清償期屆至前<b>七天</b>）交付出貨交易憑證影本。</li>\n<li>終止合約：自本行通知日起不再融資，賣方於<b>七個營業日內</b>償還預支價金本息；賣方書面申請終止，原則合約終止日為申請日加計<b>三個月</b>。</li>\n<li>債權憑證與交易文件保管年限：自所有承購及預支價金案件銷帳後保存<b>5年</b>。</li>\n</ul>"},{"id":"credit-s1p2-c5","t":"第十七章 國內應收帳款貸款","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>目的與對象：便利工商企業以國內交易所得應收帳款融通短期週轉金；對象為依法登記且信用財務營運正常之工商企業、機關團體。</li>\n<li>用途：以國內商品銷售、機器設備出租或提供服務等實際交易產生之應收帳款為限，並以該應收帳款為償還來源。</li>\n<li><b>貸款額度：最高不得超過該應收帳款金額合計之八成</b>。</li>\n<li><b>貸放期間：每筆最長不得超過180天</b>，原則以最末一筆應收帳款到期日之次營業日為到期日。</li>\n<li>開辦費：核准額度之<b>千分之一，最低收2,000元</b>，首次動撥時計收。</li>\n<li>償還：買方直接將款項匯入借款人於本行之<b>備償借款專戶</b>；未按期或不足應由借款人補足。</li>\n<li>付款通知書寄發：以雙掛號郵寄「付款通知書」（D、E版，優先E版）或「存證信函」（A、E版）；大賣場買方原則採雙掛號郵寄存證信函。</li>\n<li>借款人於本行信評<b>8等（含）以上</b>，每次承作須照會買方當次融資發票明細確認交易真實性（三擇一）。</li>\n<li>交易憑證正本應加註「本件應收帳款已提向第一商業銀行辦理融資，買方應將款項給付第一商業銀行」。</li>\n<li>累計發票金額逾該月401表報稅金額者屬不合理，應核對防止虛開發票。</li>\n<li>得於經理權限額度內辦理，逾權限專案申請區域中心或授信審核處。</li>\n</ul>"},{"id":"credit-s1p2-c6","t":"第十八章 分期應收帳款融資","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>目的：結合本行「媒體交換自動轉帳（ACH）」及「銷帳百分百代收服務系統」代收分期帳款，融通週轉金。</li>\n<li>對象：依法登記工商企業、機關團體，交易採分期付款方式並運用ACH及銷帳百分百代收帳款者。</li>\n<li><b>貸款額度：原則以契約（或憑證）中尚未繳款金額之八成為限</b>。</li>\n<li><b>貸放期間：短期週轉金（融資期限一年）為原則</b>（得申請放寬）。</li>\n<li>以短期放款會計項目申請；貸款種類AH-分期應收帳款融資；擔保內容72-國內應收帳款。</li>\n<li>契約於核准日起<b>二個月內</b>會同保證人簽立；建檔編號為5位數字。</li>\n<li>可融資額度＝可融資應收帳款總額 × 融資成數；尚可動用融資額度＝可融資額度－已撥貸金額（負值即超額貸放）。</li>\n<li>繳款人累計未繳款金額達<b>每期應繳分期額三倍（含）以上</b>（每月一期）時，違約註記出現「＊＊＊」，系統自動改為「不允許」並扣除該繳款人尚未繳納金額；累計未繳款期數<b>小於三期（不含）</b>時自動改回「允許」。</li>\n<li>借款人與繳款人互為同一經濟利害關係人或企業時應審慎辦理。</li>\n</ul>"},{"id":"credit-s1p2-c7","t":"第十九章 線上融資（e-financing）業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>對象：信用財務營運正常之國內或境外（OBU企業，不含大陸法人），與中心廠因產銷交易取得訂單/驗收/發票/付款資訊或實體憑證者。</li>\n<li>融資商品：電子交易融資（單項交易融資台外幣皆可、動態交易融資限台幣）、應收帳款線上融資（台外幣皆可）。</li>\n<li>台幣授信對單一中心廠僅能就單項/動態/應收帳款線上融資<b>擇一</b>，單項僅能就訂單/驗貨/發票/立帳四階段<b>擇一</b>申貸。</li>\n<li>OBU企業僅得申請外幣授信。</li>\n<li><b>融資成數（單項交易融資）</b>：訂單<b>6成</b>、驗貨<b>7成</b>、發票<b>8成</b>、立帳（他行預約付款或應收票據）<b>9成</b>。</li>\n<li><b>融資成數（動態交易融資）</b>：訂單6成、驗貨7成、發票<b>8.5成</b>、立帳<b>9.5成</b>（信用無虞最高帳款金額範圍內）。</li>\n<li><b>融資成數（應收帳款線上融資）</b>：可融資預約付款/應付票據金額之<b>9.5成</b>（信用無虞最高預約付款金額範圍內）。</li>\n<li><b>貸款期限</b>：單項各階段最長不超過<b>180天</b>為原則；動態每筆最長不超過180天；應收帳款線上融資以中心廠預約轉帳付款日或票據到期日為到期日，最長不得逾<b>185日</b>。</li>\n<li>利率高低排序：<b>訂單融資 ＞ 驗貨融資 ＞ 發票融資 ≧ 立帳/應收帳款融資</b>。</li>\n<li>保證人：至少徵取負責人一人為連帶保證人，有實際經營者加徵。</li>\n<li>開辦手續費：首次依核准額度<b>千分之一</b>，最低新台幣<b>5,000元</b>；動撥手續費：每次貸放金額<b>萬分之五</b>（無最低）或每筆約定最低新台幣<b>500元或等值美金15元</b>。</li>\n<li>外幣貸款不得兌換為新臺幣（出口後之出口外幣貸款除外）；外幣單項訂單融資視為出口前融資，須確認撥貸款項匯出。</li>\n<li>超額融資：借款餘額逾單據可融資額度即產生超額，必要時通知借款戶<b>五日內</b>補足單據或就差額償還。</li>\n</ul>"},{"id":"credit-s1p2-c8","t":"第二十章 台塑網線上融資業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>目的與對象：與「台塑網科技」合作，透過「台塑網電子交易市集」平台之供應商，以與台塑集團關係企業交易之<b>訂單</b>資訊申請訂單融資。</li>\n<li>額度控管同線上融資（中心廠總虛擬額度、供應商合約額度）；同一供應商對台塑集團僅能申請一個循環或非循環額度。</li>\n<li>初次往來新增訂單訊息傳輸<b>不含</b>：已交料未結案訂單、料號「UNFAB」開頭者、內容為「配合交貨」者。</li>\n<li><b>融資成數：最高以訂單淨額之8成為原則</b>。</li>\n<li>利率：一律機動利率，以貸放前一營業日<b>TAIBOR三個月期定盤利率</b>加碼機動計息；<b>最高不得逾TAIBOR三個月期加碼2.91%</b>；經理最低於加碼<b>2.25%（含）以上</b>承做；一律不得申請MML。</li>\n<li>保證人：至少負責人一人為連帶保證人，有實際經營者加徵。</li>\n<li>手續費：<b>開辦手續費及動撥手續費一律免收</b>。</li>\n<li>系統使用費：每季支付，費率＝融資餘額 × <b>0.66000%</b> × 融資天期 / 365。</li>\n<li>超額融資：訂單取消/止付/異動/沖銷產生超額，必要時要求借戶<b>五個營業日內</b>補足單據或就差額償還。</li>\n</ul>"},{"id":"credit-s1p2-c9","t":"第二十一章 外銷貸款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>範圍：<b>出口信用狀貸款、出口託收貸款、出口週轉金貸款、簡易出口融資</b>。</li>\n</ul>\n<h4>第一節 防制洗錢及打擊資恐作業</h4>\n<ul>\n<li>AML管制名單：黑名單（確認後婉拒並申報）、PEPs（加強查核陳核經理）、負面新聞（綜合評估陳核經理）。</li>\n<li>全面性制裁國家（北韓、伊朗等）出現於單據（國家/船名/港口/卸貨地）一律<b>不得受理</b>；憑L/C且受益人或通知銀行位於俄羅斯者一律以<b>即期信用狀</b>為限。</li>\n<li>洗錢高風險客戶：出口後交易應<b>逐筆</b>徵取發票及運送文件且不得申請免徵；出口前交易憑訂單契約（不含L/C）應補徵運送文件並登錄TDT。</li>\n<li>補徵運送文件經查涉應婉拒事項者，通知客戶合理期間內清償，且自發現日起<b>六個月內</b>停止受理該客戶出口前外銷貸款。</li>\n</ul>\n<h4>第二節 出口信用狀貸款</h4>\n<ul>\n<li>對象：依法登記之出口廠商，信用良好具出口能力。</li>\n<li><b>每筆貸款不得超過信用狀金額之八‧五成</b>。</li>\n<li>貸款期間<b>最長不得超過六個月</b>，到期日不得超過信用狀有效期限及單據提示期限。</li>\n<li>分批裝船訂明每批裝船日期者，應依裝船日期分別訂立貸款期限並分開徵取債權憑證。</li>\n<li>信用狀正本以<b>紅色字體</b>加蓋「本證項下貨品已向第一商業銀行辦理貸款…應即清償本筆貸款」戳記，並註明金額及日期；信用狀正本原則留存本行。</li>\n<li>押匯後押匯款應<b>優先沖還</b>本項貸款。</li>\n</ul>\n<h4>第三節 出口託收貸款</h4>\n<ul>\n<li><b>每筆貸款應在託收（D/A、D/P）匯票金額百分之八十五範圍內</b>辦理，不得超過輸出保險金額。</li>\n<li>貸款期限依融資日起至預計貨款收妥之日訂定，<b>最長不得超過六個月</b>為原則，不得超過保險證明書有效期限。</li>\n<li>原則上應以本行為<b>優先受益人</b>向中國輸出入銀行辦妥輸出保險並徵取保險單正本及保費收據副本；除空運外應徵提全套提單（非全套應以本行/代收行為抬頭人）。</li>\n</ul>\n<h4>第四節 生產企業出口週轉金貸款</h4>\n<ul>\n<li>對象：依法登記從事出口、有出口實績之生產企業，裝船前採購原料/生產/加工/運銷需資金者。</li>\n<li>貸款方式二擇一：</li>\n<ul>\n<li>依國外訂單或輸出契約申貸：額度在訂單/契約金額之<b>六成</b>範圍內。</li>\n<li>依出口實績申貸：以上一年度出口實績依營運週轉期計算金額，扣除本行及他行已核各種外銷週轉金額度後<b>五成</b>範圍內折台幣為限；借款人一年度出口實績應達<b>美金250萬元以上</b>，或最近六個月在本行出口實績達<b>美金100萬元以上</b>。</li>\n</ul>\n<li>貸款期限：訂單/契約者不超過六個月；出口實績者額度有效期限最長不超過六個月，每次貸放不超過營運週轉期間、最長六個月。</li>\n<li>以出口實績申貸者應於貸款期間內無條件提供貸款金額<b>二倍以上</b>之出口信用狀供控管。</li>\n<li>本項貸款一律向區域中心及授信審核處申請。</li>\n<li>記帳（O/A）方式之出口貸款應開立備償借款專戶。</li>\n<li><b>貿易商</b>得憑國外訂單或輸出契約在其金額<b>五成</b>範圍內比照申請。</li>\n</ul>\n<h4>第五節 簡易出口融資</h4>\n<ul>\n<li>對象：依法登記從事出口、生產外銷、合作外銷、接受委託加工外銷之廠商。</li>\n<li><b>貸款額度</b>：生產企業不得超過最近一年出口實績之<b>三分之一</b>；一般事業不得超過<b>四分之一</b>；無出口實績之非直接外銷廠商不得超過最近一年營業額之<b>四分之一</b>。</li>\n<li>一律以<b>循環額度</b>辦理，有效期限<b>最長一年</b>，每次貸放原則不超過<b>六個月</b>。</li>\n<li>額度核准後借款人於<b>二個月內</b>簽立出口融資借款契約。</li>\n<li>憑貸書件成數（附表）：出口信用狀<b>八‧五成</b>；D/A、D/P出口託收文件<b>八‧五成</b>（不得超過輸出保險金額）；國外訂單或輸出契約<b>六成</b>；免憑貸書件（最近一年出口實績核算）<b>三‧五成</b>（限直接出口廠商）；國內貿易商採購外銷產品訂單/契約<b>六成</b>；合作外銷或委託加工合約<b>六成</b>。</li>\n<li>憑國內訂單/契約/合約核貸，付款方最近一年出口實績未達<b>美金五十萬元</b>時，貸放時應徵取借款人及國內付款方共同簽署之「承諾書」。</li>\n</ul>"},{"id":"credit-s1p2-c10","t":"第二十二章 透支","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>定義：銀行准許借款人於其<b>支票存款帳戶</b>無存款餘額或餘額不足時，在約定期限及額度內支用款項之融資（擔保透支）。</li>\n<li>對象：以業務財務優良且具自律精神者為原則。</li>\n<li>貸款期限：額度核准有效期限<b>最長一年</b>，應於核准後<b>二個月內</b>徵妥契約（逾期額度作廢）。</li>\n<li>契約期間內，自透支動用日起算，<b>有餘額之日數不得連續365天以上</b>，應於連續屆滿365天前將透支款項轉為正數。</li>\n<li>會計項目：透支（17302）或擔保透支（17701）；綜合授信填「丁類無擔保授信」之「透支」欄，一經核准即視為全部動用。</li>\n<li>同時申請支存及活存2種透支型業務，額度分開申請並約定不可互為流用。</li>\n<li><b>透支利息應依每日「最高透支餘額」計算基數</b>（績優客戶以「最後餘額」計息需區域中心或授信審核處核准）。</li>\n<li>透支利息每月<b>20日結息一次</b>，每月<b>21日</b>由資訊中心自約定帳戶扣繳。</li>\n<li>貸放後降低或停止額度使用時，應以<b>書面</b>通知借款人。</li>\n</ul>"},{"id":"credit-s1p2-c11","t":"第二十三章 活期存款自動貸款","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>業務：提供借款戶<b>活期存款</b>透支型借款，於約定活存帳戶、期限及額度內自行支用款項之融資（金靈貸）。</li>\n<li>對象：依法登記之公民營企業、機關團體且業務財務信用正常者。</li>\n<li>貸款期限：核准有效期限<b>最長一年</b>，核准後<b>二個月內</b>徵妥契約；有餘額之日數<b>不得連續365天以上</b>（同透支）。</li>\n<li>會計項目：短期放款（17442）或短期擔保放款（17949）；貸款種類DT活期存款自動貸款；綜合授信填「丁類無擔保授信」之「活期存款自動貸款」欄，一經核准即視為全部動用。</li>\n<li>同時申請支存及活存2種透支型業務，額度分開申請並約定不可互為流用。</li>\n<li>計息基數同透支（每日最高透支餘額；最後餘額需核准）；每月<b>20日</b>結息、<b>21日</b>扣繳。</li>\n<li>貸放後降低或停止額度使用時應以<b>書面</b>通知借款人。</li>\n</ul>"},{"id":"credit-s1p3-c1","t":"第二十四章 中長期融資通則","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<ul>\n<li>辦理對象：以營運良好、財務結構健全、徵信資料完整者為對象，並以借款人提供擔保品或其他可靠擔保為原則。</li>\n<li>還款來源觀念：中長期融資係寄望借款人「以今後經營所獲利潤」作為還款財源。</li>\n<li>評估與監督：應依借款計畫評估可行性、經濟效益、償還能力及業種景氣市場，貸放後須追蹤監督計畫進度、成效及承諾事項。</li>\n<li>融資成數：除另有規定或總行核准外，以不超過借款人所需資金之<b>七成</b>為原則；供中長期週轉資金者參酌所需營運資金核定。</li>\n<li>融資期限：公司法人購置不動產最長<b>20年</b>；購置設備資金應較該設備耐用期限<b>縮短1年以上</b>；期限以第一次撥款日起算並包括寬限期。</li>\n<li>撥款：應查核工程進度或資金需用情形後貸放或分批貸放。</li>\n<li>攤還：以分期攤還為原則，並得徵取攤還期票。</li>\n<li>寬限期：原則依貸款期限<b>六分之一</b>範圍內訂定，最長<b>不得超過5年</b>；寬限期間僅付息暫不還本；逾六分之一者須申請總行或區域中心核准。</li>\n<li>央行不動產抵押貸款（公司法人購買含「住」字建物）：<b>不得有寬限期</b>；貸款額度最高不得超過住宅（含基地）鑑價或買賣金額較低者之<b>三成</b>；不得另以修繕、周轉金等名目額外增貸。</li>\n<li>高價住宅送審門檻：臺北市<b>7,000萬</b>以上、新北市<b>6,000萬</b>以上、其餘地區<b>4,000萬</b>以上，一律送區域中心或總行審核。</li>\n<li>私法人買受住宅用房屋，應依內政部「私法人買受供住宅使用之房屋許可辦法」辦理。</li>\n<li>代償案件資金用途：原貸行結欠餘額內代償，用途應與原貸行一致。</li>\n<li>不動產代償原則應於撥貸「當日」取得清償證明；未及者得於<b>3個營業日內</b>完成並取得第1順位抵押權，以「擔保放款」貸放。</li>\n<li>代償若無法3日內取得清償證明但能一個月內取得者，得先以「短期放款」（Bridge Loan）貸放，塗銷前順位後改「擔保放款」；短期放款到期日為撥貸日起一個月相對日。</li>\n<li>公司法人購置住宅貸款應徵「切結書」，切結不超過3成且無額外增貸，並提供自籌款來源佐證。</li>\n<li>撥款後兩段式查核：查核資金流向並影印傳票；撥款後第12個月追蹤聯徵B33交易。</li>\n<li>聯徵查核對象：借款人、負責人、保證人及擔保物提供人；查詢B05、B06、B28（必要時B33）；時點為授信申請時、撥貸前、撥貸滿三個月後一個月內。</li>\n<li>查有新增金融機構借款且流向購屋：撥貸前應扣除該借款餘額貸放；撥貸後應收回並溯自借款日起加碼<b>0.25%</b>。</li>\n<li>公司法人購置住宅主張供本人營業用，經實地查核屬實並落實切結（含設立登記，應於購置建物半年內辦妥）者，得排除央行規定適用。</li>\n<li>增貸/轉貸限制：自然人第1戶購屋貸款後可增貸；撥款日起3年內僅得就超還本金部分及未達成數上限差額增貸；滿3年後可增貸但不得超過成數上限；增貸均不得有寬限期。</li>\n<li>屆期續貸/轉貸：原貸餘額高於成數上限者，差額部分得給予最長<b>1年</b>調整期。</li>\n<li>央行規定（113.9.20生效）：不動產抵押貸款含購置住宅貸款、購地貸款、餘屋貸款及工業區閒置土地抵押貸款。</li>\n<li>自然人購屋貸款成數：無房貸但有房屋者比照公司法人（三成、無寬限期）；已有一戶房貸者最高<b>五成</b>；已有二戶以上房貸者三成、無寬限期。</li>\n<li>購地貸款：需檢附具體興建計畫並切結一定期間內動工；額度最高不超過取得成本與鑑價較低者之<b>五成</b>，其中<b>一成</b>須俟動工興建後始得撥貸。</li>\n<li>餘屋貸款：額度最高不超過鑑價金額之<b>三成</b>。</li>\n<li>工業區閒置土地抵押貸款：額度最高不超過鑑價金額之<b>四成</b>；已動工興建或切結一年內動工開發者不適用限制。</li>\n<li>都更、危老或配合政府政策之重建案件不適用央行管制規定。</li>\n<li>辦理轉貸或展期不得藉重新鑑價提高貸款金額。</li>\n<li>建物用途含「住」「住商」「住辦」「住工」均適用央行管制；財政部「青年安心成家購屋優惠貸款」不受自然人第1、2戶購屋限制。</li>\n<li>「不得有寬限期」認定：分期後就已償還額度增貸、前少後多繳款、短期性房貸僅繳息，均屬違反；應本息平均分攤按期攤還。</li>\n<li>自然人名下有無房屋以「全國財產稅總歸戶財產查詢清單」認定，房貸戶數以聯徵歸戶查詢認定，1筆擔保品認定1戶。</li>\n<li>換屋協處：已有1戶房貸申辦第2戶，切結第2戶撥款後<b>1年內</b>出售第1戶並塗銷抵押權者，得不受成數上限限制。</li>\n<li>購地貸款動工「一定期間」最長以<b>18個月</b>為原則；購地取得成本不含容積移轉費、拆遷補償費。</li>\n</ul>"},{"id":"credit-s1p3-c2","t":"第二十五章 建築貸款","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>第一節 申請</h4>\n<ul>\n<li>定義：購地或合建保證金貸款（土地融資）、興建房屋貸款（營建融資）及營建週轉金，統稱「建築貸款」。</li>\n<li>貸款對象：依法登記之建築業、一般企業及房屋興建投資之個人。</li>\n<li>額度：土地融資以擔保品鑑價準則為限；營建融資原則不得超過預估興建造價之<b>五成</b>，融資價值比（LTV）低於五成者最高<b>六成</b>。</li>\n<li>貸款期限：基地200坪以內或建物10層以下最長<b>3年</b>；基地超過200坪且11層以上最長<b>6年</b>。</li>\n<li>擔保：建築基地應設定第一順位抵押權予本行；徵取承諾書，建竣取得使照並辦保存登記後<b>三個月內</b>設定第一順位抵押權；股份有限公司須經董事會決議（銀行法第30條）。</li>\n<li>土地融資動工切結機制：購入都市計畫住宅區/商業區土地合理期間原則不高於<b>18個月</b>；逾期未動工應收回至少<b>0.5成</b>借款，其後每12個月收回至少<b>1成</b>，並自切結動工日起每6個月採階梯式利率加碼，每次加碼不低於<b>0.1%</b>。</li>\n<li>建築貸款以全案申請為原則（含土地融資、營建融資及周轉金）。</li>\n</ul>\n<h4>第二節 貸放、收回</h4>\n<ul>\n<li>貸款種類一律勾選建築貸款(31)；資金用途分營建自用不動產(31)、營建銷售不動產(32)、其他營建資金(33)、自建廠房資金(34)。</li>\n<li>營建融資動用前應設立專戶控管，營建自籌款（含預售款）及融資撥款皆存入專戶專款專用。</li>\n<li>營建融資應按建築工程進度或工程款支付明細分批撥款。</li>\n<li>工程進度勘驗：自貸放日起至少每<b>三個月</b>確實追蹤，並填報「計畫執行進度追蹤表」；以工地現場有機具進場持續施工作為實質動工認定依據。</li>\n<li>償還財源：出售房地價款、續貸分戶購置住宅貸款、建物完成後另辦擔保貸款、借款人自籌資金。</li>\n</ul>\n<h4>第三節 其他注意事項</h4>\n<ul>\n<li>應整體評估建案合理性、市場接受性、財務規劃、自籌款及償還來源；同一基地所有個別借款應全案併同評估。</li>\n<li>供出售者若採預售，預售款及自籌工程款應設專戶控管，得依工程進度自行動用。</li>\n<li>承攬廠商應具結放棄民法第513條法定抵押權。</li>\n<li>必要時通知借款人投保「營造工程綜合險」，以本行為受益人。</li>\n<li>興建建物以借款人為起造人，非經本行同意不得變更起造人名義。</li>\n<li>非A級地區重劃區營建融資（非自建或無預售），個案銷售率應不低於融資價值比（LTV）方可貸放。</li>\n</ul>"},{"id":"credit-s1p3-c3","t":"第二十六章 政策性貸款及本行自辦專案貸款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>第一節 企業小頭家貸款</h4>\n<ul>\n<li>對象：僱用員工<b>10人以下</b>之營利事業，不含金融保險業、特殊娛樂業。</li>\n<li>額度：週轉性支出每一事業最高<b>500萬元</b>；資本性支出最高不超過計畫經費<b>8成</b>。</li>\n<li>期限：週轉性支出最長6年、寬限期最長2年；資本性支出廠房營業場所最長<b>20年</b>（含寬限期5年）、機器設備最長<b>7年</b>（含寬限期3年）。</li>\n<li>擔保：徵十足擔保或移送中小企業信保基金；累計100萬以內信保成數<b>9.5成</b>，超過100萬最高<b>9成</b>。</li>\n<li>利率：最高中華郵政2年期定儲機動利率加<b>2%</b>。</li>\n<li>連帶保證人：十足擔保或信保9成以上免徵；其他案件徵1位。</li>\n</ul>\n<h4>第二節 中小企業災害復舊專案貸款</h4>\n<ul>\n<li>對象：合於「中小企業認定標準」之中小企業或僅辦稅籍登記之營利事業。</li>\n<li>利率：最高中華郵政2年期定儲機動利率加<b>0.5%</b>。</li>\n<li>申貸期限：遭受災害次日起<b>半年內</b>提出。</li>\n<li>期限：資本性支出廠房營業場所最長20年（含寬限5年）、機器設備最長7年（含寬限3年）；週轉性支出最長6年（含寬限2年）。</li>\n<li>信保：提供<b>9.5成</b>信用保證，送保期間免收保證手續費；每次受災累計融資100萬以內信保成數一律<b>十成</b>。</li>\n</ul>\n<h4>第四節 文化創意產業相關貸款</h4>\n<ul>\n<li>適用對象：從事視覺藝術、音樂表演、文化資產、工藝、電影、廣播電視、出版、流行音樂及文化內容產業之登記業者。</li>\n<li>貸款額度：第一類（中小企業）最高<b>8,000萬</b>；第二類（非中小企業）最高<b>2億</b>；第三類（財團/社團法人、演藝團體）最高<b>8,000萬</b>；第四類（取得文創補助/委製/著作權預售合約）最高<b>1億</b>。</li>\n<li>每一計畫額度最高不超過需求經費或有效合約未履行金額之<b>八成</b>。</li>\n<li>利率：中華郵政2年期定儲機動利率加<b>1.155%</b>以上，加碼最高不逾2%。</li>\n<li>利息補貼：同一申請人核定貸款以<b>3,000萬</b>為上限。</li>\n<li>經核准案件應自核准日起<b>三個月內</b>動用第一期款，逾期未動支得解除契約。</li>\n</ul>\n<h4>第六節 都市更新事業優惠貸款</h4>\n<ul>\n<li>對象：都市更新事業實施者及參與更新分配之都市更新會會員。</li>\n<li>利率：最高不超過經建會中長期資金運用利率加<b>2.0%</b>。</li>\n<li>額度：最高以計畫實際需要資金之<b>80%</b>為限。</li>\n<li>期限：最長不得超過<b>六年</b>，寬限期至少一年。</li>\n</ul>\n<h4>第七節 自有品牌推廣海外市場貸款</h4>\n<ul>\n<li>對象：財務健全、辦妥出進口廠商登記之公司；資金由本行自有資金支應。</li>\n<li>額度：最高不超過推廣計畫所需經費之<b>70%</b>；獲品牌獎項或出進口績優廠商得提高至<b>80%</b>。</li>\n<li>期限：最長不超過<b>七年</b>，含三年以內寬限期。</li>\n</ul>\n<h4>第八節 海外投資融資貸款</h4>\n<ul>\n<li>資金搭配：非中小企業投資美國由國發基金出資2/3、本行1/3；中小企業由國發基金全額出資。</li>\n<li>對象：經核准或核備前往海外投資之我國廠商。</li>\n<li>利率：新臺幣依郵匯局2年期定儲機動利率加碼<b>1.8%</b>為上限；外幣依基礎利率加碼<b>3%</b>為上限。</li>\n<li>額度：以對外投資金額之<b>八成</b>為限，每家廠商累計最高不超過新臺幣<b>十億元</b>。</li>\n<li>期限：最長不超過<b>七年</b>。</li>\n</ul>\n<h4>第九節 中小企業創新發展專案貸款</h4>\n<ul>\n<li>額度：週轉性支出每家最高<b>2,000萬</b>；資本性支出8成範圍內、每家最高<b>8,000萬</b>。</li>\n<li>期限：週轉性支出最長5年（含寬限1年）；設備機器最長7年（含寬限2年）；土地廠房營業場所最長15年（含寬限3年）。</li>\n<li>擔保：徵十足擔保或移送中小企業信保（最低8成）；利率最高中華郵政2年期定儲機動利率加<b>2%</b>。</li>\n</ul>\n<h4>第十節 機器設備升級貸款</h4>\n<ul>\n<li>資金搭配：淨零碳排設備由國發基金2/3、承貸銀行1/3；中小企業機器升級國發基金1/3、承貸銀行2/3；其他國發基金1/4、承貸銀行3/4。</li>\n<li>利率最高郵政2年期定儲機動利率加<b>2.175%</b>。</li>\n<li>額度：每一計畫最高不超過成本<b>80%</b>；每戶最高<b>4億</b>，淨零碳排設備最高<b>10億</b>。</li>\n<li>期限：最長<b>10年</b>（含寬限期），寬限期最長3年。</li>\n</ul>\n<h4>第十一節 機器設備輸出貸款</h4>\n<ul>\n<li>對象：國內出口商、國外進口商、整廠整案/系統整合輸出業者或國外業主。</li>\n<li>利率：新臺幣按郵政2年期定儲機動利率加1%以上，加碼2.5%為上限。</li>\n<li>額度：每案最高<b>10億</b>；每一申請人累計最高<b>20億</b>；同一關係企業累計最高<b>30億</b>。</li>\n<li>期限：綠能設備最長15年，其餘最長10年。</li>\n</ul>\n<h4>第十二節 青年創業貸款（2025/7/1起）</h4>\n<ul>\n<li>對象：中小企業，設立登記未滿<b>8年</b>，負責人年滿<b>18至45歲</b>，自然人出資額占實收資本額<b>20%</b>以上，並受創業輔導課程至少20小時或2學分。</li>\n<li>額度：週轉性支出最高<b>600萬</b>；資本性支出8成、最高<b>1,200萬</b>。</li>\n<li>期限：週轉性支出最長6年（含寬限2年）；廠房營業場所最長20年（含寬限5年）；機器設備最長7年（含寬限3年）。</li>\n<li>利率：中華郵政2年期定儲機動利率加<b>0.575%</b>。</li>\n<li>保證：移送中小企業信保間接保證，最高9成、最低8成；歸戶金額150萬以下部分<b>9.5成</b>。</li>\n<li>保證人：歸戶金額150萬以下不得徵負責人以外保證人；逾150萬以一人為原則。</li>\n</ul>\n<h4>第十三節 小微企業優惠貸款</h4>\n<ul>\n<li>對象：符合下列之一：設立未滿5年、僱用員工20人以下、資本額500萬以下、年營收1,000萬以下之中小企業。</li>\n<li>額度：最高總額度<b>300萬</b>。</li>\n<li>利率：前3個月本行一年期定儲加<b>0.785%</b>以上，第4個月起加<b>1.485%</b>以上。</li>\n<li>期限：最短<b>3年</b>、最長<b>5年</b>；擔保除十足擔保外一律移送中小企業或農業信保基金。</li>\n<li>連帶保證人：得僅徵負責人1人（有實際經營者亦應徵）；額度設立費0.2%以上、最低3,000元。</li>\n</ul>\n<h4>第十四節 深化中小企業專案貸款</h4>\n<ul>\n<li>對象：營運正常之中小企業，不含建築業及營造業。</li>\n<li>期限：短期週轉最長1年；中期週轉最長5年；購置機器設備/技術權利最長7年（含寬限1年）；購置廠房辦公場所最長15年（含寬限3年）。</li>\n<li>利率（信評1-7等）：擔保及信保案件本行一年期定儲加<b>0.56%</b>以上；無擔保加<b>0.86%</b>以上；（信評8-9等）擔保加0.86%以上、無擔保加1.21%以上；（信評10等以上）擔保加1.21%以上、無擔保不得辦理。</li>\n<li>連帶保證人：信評7等以下得僅徵負責人1人以上；無信評資訊借款戶不得適用。</li>\n</ul>\n<h4>第十五節 連鎖企業加盟業者貸款</h4>\n<ul>\n<li>對象：加盟總部應設立登記滿<b>3年</b>以上、實收資本額達<b>1億元</b>以上；加盟業者為獨資合夥商號或中小企業。</li>\n<li>額度：創業用途及中期營運資金依合約/估價8成範圍內核貸，兩者合計每戶最高<b>250萬</b>。</li>\n<li>期限：最長<b>5年</b>（含寬限1年），不得逾加盟合約到期期限。</li>\n<li>除十足擔保外一律移送中小企業信保間接保證；加盟總部為授信戶或取得優良/卓越加盟總部認證者，利率得減碼<b>0.15%</b>。</li>\n</ul>"},{"id":"credit-s1p3-c4","t":"第二十七章 在臺無住所外國人新臺幣授信","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>適用對象：未取得我國外僑居留證之外國自然人（含華僑）及未在我國設立登記取得證照之外國法人；自然人應親自辦理、法人由在臺代表人親自辦理。</li>\n<li>徵信：外國文件須經駐外館處及外交部領事事務局驗證；免向票交所查詢但須向聯徵中心查詢。</li>\n<li>具國際信評（Moody's、S&amp;P、Fitch）<b>BBB－以上</b>者，得酌情索取資料。</li>\n<li>授信以<b>擔保授信為限</b>，得提供定存單、擔保信用狀、上市櫃股票或不動產等經認可擔保品。</li>\n<li>保證手續費：年率<b>1%</b>以上，每三個月一期，不足三個月以一期計，最低新臺幣1,000元。</li>\n<li>開辦手續費：核准額度之<b>千分之一</b>，最低2,000元，於首次動撥計收。</li>\n<li>授信用途限：證券投資、國際合作商品款項收付、長期股權投資、不動產投資、公司債保證、訴訟供擔保保證等。</li>\n<li>股票擔保鑑價：申請前一營業日收盤價與最近三個曆月平均價孰低者；上市公司股票融資成數最高<b>六成</b>、上櫃公司最高<b>五成</b>。</li>\n<li>期限：長期股權投資最長<b>10年</b>；不動產投資個人戶最長<b>20年</b>、法人戶最長<b>15年</b>。</li>\n<li>每案放款達新臺幣<b>三仟萬元</b>者，應於簽約後次一營業日填報資料表報送法金業務處。</li>\n<li>利息屬境外所得，授信戶支付利息時依當地稅率扣繳並出具納稅扣繳證明。</li>\n</ul>"},{"id":"credit-s1p3-c5","t":"第二十八章 間接授信通則","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>間接授信包括保證、承兌及開發國內信用狀；雖無直接撥付資金，但承擔風險與直接貸放無異。</li>\n<li>備付（本息）本票：借戶信用正常時不提示，僅財務惡化時行使票據權利，屬備付性質；徵取金額臺幣授信依總額度或逐筆貸放金額之<b>110%</b>。</li>\n<li>備償期票：票據兌現償還借款本金使用，應嚴格要求到期提示兌現；徵取金額依逐筆貸放金額<b>100%</b>（利息另繳）；外匯授信不得徵取備償期票。</li>\n<li>到期日填載：中長期放款攤還期票填「攤還日當天」；保證票據、承兌票據填「到期前一營業日」。</li>\n<li>票據種類：小本票（以本行為擔當付款人）、大本票；優先徵提小本票；備償期票不得徵取大本票。</li>\n<li>見票即付本票：執票人須於到期日或其後2日內提示；未填到期日且未徵授權書者，須於發票日起6個月內提示，否則喪失對背書人追索權，但仍得對發票人聲請法院裁定強制執行。</li>\n<li>保證：第三者於本票保證須記載保證文義、被保證人姓名及年月日並簽章；公司保證須符公司法第16條，違反者對公司無效。</li>\n<li>本票重徵時點：無到期日者額度生效日至發票日逾三年或授信額度增加致本票金額無法涵蓋110%時應重徵。</li>\n<li>代墊付款：自墊款日起按新臺幣放款基準利率加年率<b>4.5%</b>計收遲延利息並加徵違約金。</li>\n</ul>"},{"id":"credit-s1p3-c6","t":"第二十九章 一般保證業務","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>保證業務定義：銀行與委託人之債權人約定
