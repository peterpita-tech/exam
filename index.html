3)","c":"第37頁","s":"","t":"未成年人擔任借款人應注意事項倘客戶基於贈與稅等稅務規劃需由未成年人擔任借款人時，應確認已符合民法第1088條「為子女之利益」意旨始得受理，並僅限申貸「購置不動產貸款」，<mark>且不得適用經理權限，一律申請區域中心或總行辦理</mark>，並遵循下列事項：一、貸款成數以所購置不動產鑑估價值之五成為上限。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉：未成年人借款<b>不得適用經理權限</b>，一律申請區域中心或總行辦理。","lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第37頁","v":22,"t":"未成年人擔任借款人應注意事項倘客戶基於贈與稅等稅務規劃需由未成年人擔任借款人時，應確認已符合民法第1088條「為子女之利益」意旨始得受理，並僅限申貸「購置不動產貸款」，<mark>且不得適用經理權限，一律申請區域中心或總行辦理</mark>，並遵循下列事項：一、貸款成數以所購置不動產鑑估價值之五成為上限。"},"t":"neg"},{"id":"112-60","y":112,"n":60,"m":4,"q":"依銀行法第 12 條之 2 作業規範，辦理「自用住宅放款」及「消費性放款」案件有一般保證人且借款期限逾（　）年 者，保證人需親自填寫「宣告保證人責任範圍暨保證期間同意書」之「保證期間」。","o":["5 年","7 年","10 年","15"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)自100年11月11日起新承作(含撥貸)之<mark>「自用住宅放款」及「消費性放款」案件有一般保證人</mark>者：1.應以<mark>「宣告保證人責任範圍暨保證期間同意書」</mark>向保證人宣讀<mark>保證人責任</mark>，使保證人明瞭其保證之法律責任及風險，並請保證人於本文件親簽及蓋章，以利釐清借保戶雙方權利義務關係。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第26頁","v":46,"t":"◆銀行辦理「<mark>自用住宅放款</mark>」及「<mark>消費性放款</mark>」，已取得足額擔保時，不得要求借款人提供保證人；◆<mark>自用住宅放款及消費性放款案件</mark>，倘有徵取<mark>一般保證人</mark>者，應徵取「<mark>宣告保證人責任範圍暨保證期間同意書</mark>」，並向保證人宣讀<mark>保證人責任</mark>，及請保證人親簽。借款期間逾15年之案件，「<mark>宣告保證人責任範圍暨保證期間同意書</mark>」之保證借款年限應由保證人自行填寫。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第26頁：「自用住宅放款及消費性放款案件，倘有徵取一般保證人者，應徵取「宣告保證人責任範圍暨保證期間同意書」，並向保證人宣讀保證人責任，及請保證人親簽。」「借款期間逾15年之案件，「宣告保證人責任範圍暨保證期間同意書」之保證借款年限應由保證人自行填寫。」","t":"fill"},{"id":"113-1","y":113,"n":1,"m":4,"q":"有關保證人徵提，下列敘述何者有誤？","o":["徵提保證人應衡酌其資歷及保證能力","不得徵取未成年人為保證人，惟如符合民法第1088 條「為子女之利益」意旨者，才得受理","保證契約屬未定期間最高限額保證者，銀行應每年一次以書面通知函告知其連帶保證人最高限額保證金額及通知當月基準日所負保證債務金額","除另有規定外，本行擔保放款以一人保證，無擔保放款以二人保證為原則"],"a":1,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"八、借款人為自然人時，以具有行為能力者為原則。由<mark>未成年人</mark>擔任借款人時，應確認已<mark>符合民法第1088條「為子女之利益」意旨</mark>始得受理，僅限申貸「購置不動產貸款」，並遵循下列事項："},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第37頁","v":33,"t":"<mark>未成年人</mark>擔任借款人應注意事項倘客戶基於贈與稅等稅務規劃需由<mark>未成年人</mark>擔任借款人時，應確認已<mark>符合民法第1088條</mark>「<mark>為子女之利益</mark>」意旨始得受理，並僅限申貸「購置不動產貸款」，且不得適用經理權限，一律申請區域中心或總行辦理，並遵循下列事項：一、貸款成數以所購置不動產鑑估價值之五成為上限。"},"t":"neg"},{"id":"113-2","y":113,"n":2,"m":8,"q":"A公司有一筆短期放款額度新臺幣(以下同)100萬元，移送信保八成，現欲申請開發國內信用狀額度200萬元及履約保證額度300萬元，均移送信保六成，依目前「國內營業單位經理權限授信要點」之權限判斷，應以多少金額來認定「無擔保授信」？","o":["600萬元","520萬元","500萬元","220萬元"],"a":3,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業信用保證基金之保證(一)財團法人中小企業信用保證基金（以下簡稱信保基金），為政府核准設立之信用保證機構，<mark>經其保證之授信，該保證成數部分，得視為擔保授信</mark>。"},"x":"信保保證成數部分視同擔保：短放 100×(1−0.8)＝20；LC 200×(1−0.6)＝80；履保 300×(1−0.6)＝120；合計 <b>220 萬</b>。","lo":1,"t":"ask"},{"id":"113-3","y":113,"n":3,"m":4,"q":"有關不動產抵押權設定，下列敘述何者有誤？","o":["設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理","如屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","企業戶貸款抵押權設定之權利種類，應由客戶自行勾選採「最高限額」或「普通」抵押權設定","如受理「普通抵押權」設定申貸者，應申請總行或區域中心核准後辦理"],"a":2,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"2.個人消費性貸款：<mark>權利種類</mark>：應由擔保物提供人<mark>自行勾選採「最高限額」或「普通」抵押權設定</mark>，勾選前宜先向客戶說明抵押權所擔保債權範圍，原則上應<mark>採「最高限額</mark>抵押權」；擔保範圍：倘其他約定事<mark>採「最高限額</mark>抵押權」；擔保範圍：倘其他約定事項(消費者貸款專用)(用紙編號：消放033)，擔保物提供人選擇<mark>「最高限額</mark>抵押權」者，擔保債權範圍應親自填寫，不得以繕打或蓋章為之，並據以勾選「土地、建築改良物<mark>抵押權設定</mark>契約書〔個人消費性貸款適用〕(放033E)」第(18)欄「擔保債權種類及範圍」，並以「借款、保證、透支（依銀行公會授信準則附表，係指支票存款戶無存款餘額或餘額不足支付時，銀行先予墊付之融通方式）、票據、信用卡契約、衍生性金融商品交易契約」等6項為原則；不足項者，應申請區域中心/總行核准後辦理。"},"t":"neg"},{"id":"113-4","y":113,"n":4,"m":4,"q":"授信額度核准後，應核發「額度核定通知書」予借戶，下列敘述何者不正確？","o":["借戶確認額度通知書內容無誤即可，無須取得借戶蓋妥授信往來印鑑之回執聯存卷","應由主管蓋妥腰形章後寄(交)借戶","內容載明承作條件、擔保條件、收取費用及其他授信條件等重要內容","永續績效連結授信專案案件核准後，應將授信條件中擬改善之指標及連結利率條款，敘明於「額度核定通知書」之其他授信條件"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第五節 授信申請書之編號及發送","t":"(二)借戶應於確認「額度核定通知書」<mark>內容無誤</mark>後，於回執聯<mark>蓋妥授信往來印鑑</mark>後交回本行，營業單位應將收妥<mark>之回執聯存卷</mark>備查。(三)倘無法<mark>取得借戶蓋妥授信往來印鑑之回執聯</mark>，則應以雙掛號郵寄「額度核定通知書」予借戶，並將郵政回執聯與「額度核定通知書」影本併同留存備查。"},"t":"neg"},{"id":"113-5","y":113,"n":5,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，營業單位於企金e-Loan編製核貸單時，下列敘述何者不正確？","o":["借戶倘為「疑似洗錢資恐高風險戶」，應敘明借戶為高風險之原因及承作理由","倘借戶是屬「Z8-告誡清單」，營業單位得免再評估個案風險逕予貸放","倘是「09：特殊風險客戶」，應由防制洗錢督導主管覆核","倘是「09：特殊風險客戶」，應登入「國內AML 系統」查詢借戶被申報SAR(加強關注客戶)之時間，並列印查詢結果存卷備查"],"a":1,"ci":{"b":"授信篇","c":"第四章 貸放、收息及收回","s":"第一節 貸放手續","t":"(3)核貸單應由防制洗錢督導主管覆核，陳核至經理同意，始可辦理撥貸作業。3.倘查詢借戶結果為「●是疑似洗錢資恐高風險戶」，且「●<mark>是屬「Z8-告誡清單」Z8-告誡清單」</mark>：(1)請<mark>營業單位</mark>查詢並列印A247-Z8。(2)說明原因欄位：請依A247-Z8查詢結果敘明告誡日期、告誡期限及告誡處分資料來源。(3)承作理由欄位：<mark>營業單位</mark>應審慎<mark>評估個案風險</mark>，倘評估後仍欲貸放，應於承作理由欄位敘明評估內容。"},"t":"neg"},{"id":"113-6","y":113,"n":6,"m":11,"q":"有關「墊付國內票款」業務，下列敘述何者不正確？","o":["以「短期放款-票借短放」申請之授信案件，應逐筆依兌現之票據金額沖償借款","以會計項目「短期放款-票借短放」或以 100%以上保持票方式(會計項目「短期放款-其他短放」)辦理之授信案件，其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額不得逾其授信額度金額 20%","以「短期放款-票借短放」申請之授信案件，得徵取禁止背書轉讓票據","本次徵取之票據，其同一發票人累計金額達新臺幣 50 萬元(含)以上者，應另徵取由借戶(賣方)開立之國內統一發票或相關交易資料備查"],"a":2,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第一節 申請","t":"七、票據集中度限額：以會計項目「17426<mark>短期放款-票借短放」</mark>或、票據集中度限額：以會計項目「17426<mark>短期放款-票借短放」</mark>或以100%以上保持票方式(會計項目「17442<mark>短期放款-</mark>其他短放」)辦理<mark>之授信案件，</mark>其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額(含前徵取票據)不得逾其授信額度金額20%。惟得因個案考量，於授信申請書之「授信條件」欄敘明從寬條件外，另應於「信用綜合評估表」之分析中載明原因，並依授信審核層級核准後始得辦理。"},"t":"neg"},{"id":"113-7","y":113,"n":7,"m":11,"q":"辦理「透支」業務，下列敘述何者不正確？","o":["執行「支票存款透支契約資料設定登錄(3190)」時，倘帳號欄位顯示為疑似洗錢資恐高風險戶，惟授信申請時非為高風險戶，法金經辦無需於批覆書註明為高風險戶原因及承做理由後再陳經理同意，即得逕行辦理建檔作業","執行「放款核准資料登錄單（6400）」建檔，核准金額一律輸入0，以免造成借款人於金融聯合徵信中心之貸款額度重複計算","對於績優客戶，以「每日最後透支餘額為借款本金」之方式計算透支積數，應另向借款人徵提「約定條款變更同意書」","以「每日最後透支餘額為借款本金」之計息方式，需申請區域中心或授信審核處核准後始得辦理"],"a":0,"ci":{"b":"授信篇","c":"第二十二章 透支","s":"","t":"1、擔保內容必須與「放款核准資料登錄單（6400）」之擔保內容相同。2、執行支存透支額度建檔<mark>「支票存款透支契約資料設定登錄(3190</mark>交易代碼1或代碼2<mark>)」時，</mark>系統將自動檢視其帳號所屬「統一編號」之「客戶風險評分交易(A194)」風險等級，倘風險等級<mark>為高風險</mark>者，<mark>帳號欄位</mark>旁以紅色粗體字樣顯示提醒字句「※<mark>疑似洗錢資恐高風險戶</mark>」，若<mark>授信申請</mark>書未註明<mark>，法金經辦需於批覆書註明為高風險戶及承做理由</mark>，陳核至分行<mark>經理同意</mark>辦理後，始<mark>辦理建檔</mark>/變更作業。"},"t":"neg"},{"id":"113-8","y":113,"n":8,"m":11,"q":"有關本行辦理「專案融資」，下列何者為非？","o":["「專案融資案件」係指專案計畫性質具備依政府採購法辦理之政府採購案(包括但不限於公共工程)或發起人、投資人以成立「特殊目的公司」(SPC 或 SPV)作為營運主體之方式執行，且融資額度達等值新臺幣 50 億元(含)以上者","本行參貸或共同主辦聯貸案，倘該聯貸案非統籌主辦銀行認定之專案融資案件，得排除適用本業務要點","「專案融資會議」由法人金融業務處處長擔任召集人","倘屬公共工程案件，至少每三個月填製「專案融資/工程款入帳追蹤表」"],"a":2,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第二節 專案融資","t":"3.<mark>「專案融資會議」</mark>會前會：<mark>由法人金融業務處處長擔任召集人</mark>，出席人員為<mark>法人金融業務處</mark>聯貸及<mark>專案融資</mark>部、授信審核處審核一/二部、徵信處徵信部及營業單位之經理，並視個案需要得邀請信託處、法務室、金融市場業務處及海外業務處等單位派員參加，以研擬適當額度架構及授信條件，協助營業單位依授信程序提出申請。並視個案需要得邀請信託處、法務室、金融市場業務處及海外業務處等單位派員參加，以研擬適當額度架構及授信條件，協助營業單位依授信程序提出申請。"},"t":"neg"},{"id":"113-9","y":113,"n":9,"m":7,"q":"有關「海外投資融資(第十二期)貸款」，下列何者正確？","o":["貸款對象為取得政府主管機關核准或核備前往海外投資之國內、外廠商","貸款額度以對外投資金額之七成為限，每家廠商累計核准適用本貸款額度最高不得超過新臺幣 10 億元","貸款期限最長不得超過 7 年，並不得給予寬限期","新臺幣案件電腦建檔之貸款種類：「FI：海外投資融資貸款」"],"a":3,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第八節 海外投資融資貸款","t":"三、<mark>電腦建檔</mark>：(一)<mark>新臺幣案件</mark>：<mark>貸款種類：「FI：海外投資融資貸款」</mark>。(二)外幣案件：1.外幣貸款額度核准資料建檔(I621)額度<mark>種類：「</mark>21<mark>：海外投資融資</mark>」。"},"t":"ask"},{"id":"113-10","y":113,"n":10,"m":7,"q":"有關辦理 113~116 年度之批次信用保證融資業務，<br><span class=\"it\">A.</span> 保證成數 10 成，故額度申請及建檔以「擔保放款」科目辦理<br><span class=\"it\">B.</span> 授信案件屬前准尚未動撥者，僅得以 11200701批號辦理移送信用保證<br><span class=\"it\">C.</span> 授信案件屬前准尚未動撥者，若於授信條件敘明移送案號為 11200701 者，需辦理條件變更<br><span class=\"it\">D.</span> 授信案件屬已動撥者，仍得異動批號。 上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":2,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","s":"參-21","t":"保證期間依授信期間<mark>保證成數最高十成</mark>送保程序批次保證其他注意事項1.授信案件徵有五成以上之擔保品者，不得送保。"},"x":"本題出自本行 113–116 年度批次保證作業規定，官方答案錯誤者 <b>3</b> 項。手冊參、二(十二)：批次保證<b>保證成數最高十成</b>、徵 5 成以上擔保品不得送保；查覆書有效 3 個月（得再延 3 個月）、額度動用期間以首筆動用日起算 1 年為原則、同一授信額度限以同一批號辦理。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","v":2,"t":"保證期間依授信期間<mark>保證成數最高十成</mark>送保程序批次保證其他注意事項1.授信案件徵有五成以上之擔保品者，不得送保。"},"t":"combo"},{"id":"113-11","y":113,"n":11,"m":7,"q":"下列敘述何者為非？","o":["企業小頭家貸款週轉金支出之貸款期限最長 6 年，寬限期最長 2 年","微型創業鳳凰貸款之貸款期限最長 7 年，按月平均攤還本息","青年創業及啟動金貸款週轉性支出貸款期限最長 6 年，寬限期最長 2 年","民宿貸款之經常性週轉金貸款期限最長 5 年"],"a":2,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","s":"參-18","t":"保證授信週轉性支出、資本性支出保證期間1.<mark>週轉性支出貸款貸款期限最長六年，含寬限期最長二年</mark>。"},"x":"手冊參、二(十)：企業小頭家週轉性支出期限最長 6 年、含寬限期最長 2 年；青年創業週轉性支出為 6 年<b>含寬限 1 年</b>，故 (3)「寬限期最長 2 年」錯。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","v":31,"t":"保證授信<mark>週轉性支出</mark>、資本性支出保證期間1.<mark>週轉性支出貸款貸款期限最長</mark>六年，含<mark>寬限期最長</mark>二年。2.資本<mark>性支出貸款</mark>(1)廠房、營業場所（倘與其坐落之基地共同購買，則得包含土地）及相關設施：<mark>貸款期限最長</mark>二十年，含<mark>寬限期最長</mark>五年。(2)機器、設備：<mark>貸款期限最長</mark>七年，含<mark>寬限期最長</mark>三年。"},"t":"neg"},{"id":"113-12","y":113,"n":12,"m":1,"q":"辦理購置「央行管控規定」不動產之「自然人第 3 戶(含)以上購屋貸款」(非以其他房地辦理新貸或以既有房貸案辦理增貸)案件，下列何者為非？","o":["向聯徵中心辦理歸戶查詢，自然人名下已有 2 戶以上房屋為抵押之擔保放款，且資金用途代號為「1」，為購買建物權狀含有「住」字樣之非高價住宅(含基地)之抵押貸款","應分別於授信申請、撥貸當日及貸放後三個月共三個時間點，查核有無於本行或其他金融機構額外增加貸款","查核對象僅限借款人","不得申請寬限期"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)辦理購置「央行管控規定」不動產之案件(含借款人另提供其他房地辦理新貸或以既有「房貸」案辦理「增貸」，且資金用途為購置「央行管控規定」不動產)，應於撥貸前徵取借、保戶、擔保物提供人親簽之「申貸不動產抵押貸款切結書」，切結無另以修繕、周轉金或其他貸款名目，向本行或其他金融機構額外增加貸款，屬「自然人第2戶」、「第3戶(含)以上」購屋貸款、「高價住宅貸款」及「購地貸款」(消金案件)案件另需於撥款前提供自籌款來源證明(如存摺餘額、解約存單或出售有價證券等)，並分別於授信申請、撥貸當日及貸放後三個月共三個時間點辦理查核作業，查詢借款人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)下列事項，並填製「第一商業銀行辦理『央行管控案件』查核控管表(消金專用)」："},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第29頁","v":44,"t":"「<mark>央行管控</mark>案件」查核作業(1/2)一、購置「<mark>央行管控規定</mark>」<mark>不動產之</mark>消金案件，應徵取<mark>央行管控</mark>案件「切結書」，有管控成數及適用先買後賣協處措施之案件，並應填製「查核控管表」。案件類型1：以新購買之「<mark>央行管控規定</mark>」之不動產向本行申辦<mark>購屋貸款</mark>(含借款人另提供<mark>其他房地辦理新貸或以既有</mark>「房貸」案辦理「增貸」，且資金用途為購置「<mark>央行管控規定</mark>」不動產)：<mark>查核對象</mark>：借款人、保證人、擔保物提供人落實三段式查核(授信申請時、撥貸日、撥貸後三個月)查核期間倘有增加貸款金額，需檢附資金流向證明資料。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第29頁：「案件類型1：以新購買之「央行管控規定」之不動產向本行申辦購屋貸款(含借款人另提供其他房地辦理新貸或以既有「房貸」案辦理「增貸」，且資金用途為購置「央行管控規定」不動產)：查核對象：借款人、保證人、擔保物提供人落實三段式查核(授信申請時、撥貸日、撥貸後三個月)查核期間倘有增加貸款金額，需檢附資金流向證明資料。」","t":"neg"},{"id":"113-13","y":113,"n":13,"m":2,"q":"有關辦理「申請展延寬限期逾貸款期限六分之一消金房貸案件」且實際還款金額未達寬限期滿後應攤還金額者，下列敘述何者錯誤？","o":["對「持有多筆房產」、「有還款能力之優質客戶」或「還本後多次增貸者」，不得再申請寬限期","展延期限每次 1 年","還款條件依貸款餘額計算每月應繳利息之 10 倍作為「本次最低應攤還本金」","應申請總行或區域中心核准後辦理"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.<mark>還款條件</mark>：<mark>依貸款餘額計算每月應繳利息之1</mark>2<mark>倍作為「本次最低應攤還本金」</mark>，並應於展延前「一次償還」或「約定於寬限期間按月平均<mark>攤還本金」</mark>。"},"t":"neg"},{"id":"113-14","y":113,"n":14,"m":2,"q":"有關「貸款衍生人身保險保費融資貸款」之規定，下列敘述何者錯誤？","o":["對象須為本行不動產擔保貸款借款人","融資躉繳保費-擔保貸款，貸款期限最長 30 年","融資躉繳保費-信用貸款，授權營業單位經理最高核定額度新臺幣 100 萬元，惟與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，仍應申請總行或區域中心核准後辦理","融資躉繳保費-信用貸款，設定第二順位抵押權作副擔保者，貸款期限最長 20 年"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"五、期限：(一)<mark>融資躉繳保費</mark>─擔保貸款：最長30年，且不得適用寬限期。(二)<mark>融資躉繳保費</mark>─<mark>信用貸款</mark>：<mark>設定第二順位抵押權作副擔保者</mark>最長30年，未設定抵押權者最長10年，且不得適用寬限期。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第20頁","v":53,"t":"<mark>貸款衍生人身保險保費融資貸款</mark>◎對象1.須為本行不動產擔保貸款借款人2.投保本行躉繳型<mark>貸款衍生人身保險</mark>商品3.借款人、要保人及被保險人須為同一人◎貸款種類1.「<mark>融資躉繳保費</mark>-擔保貸款(SP)」額度：依本行「各項擔保品貸放成數一覽表」規定辦理，與不動產擔保貸款合計逾經權貸放成數者，應申請總行/區域中心核准後辦理。2.「<mark>融資躉繳保費</mark>-<mark>信用貸款</mark>(SQ)」額度：授權營業單位經理於「個別分行授信權限額度核給範圍」之個人無擔保放款權限內，以免保人之「<mark>信用貸款</mark>」方式辦理，與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，應申請總行/區域中心核准後辦理；期限：<mark>設定第二順位抵押權作副擔保者</mark>最長30年，未設定抵押權者最長10年，且不得適用寬限期。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第20頁：「2.「融資躉繳保費-信用貸款(SQ)」額度：授權營業單位經理於「個別分行授信權限額度核給範圍」之個人無擔保放款權限內，以免保人之「信用貸款」方式辦理，與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，應申請總行/區域中心核准後辦理；」「期限：設定第二順位抵押權作副擔保者最長30年，未設定抵押權者最長10年，且不得適用寬限期。」","t":"neg"},{"id":"113-15","y":113,"n":15,"m":9,"q":"下列有關預警戶之敘述何者正確？","o":["只要符合「授信預警徵兆」所列事項之一，即應列為預警戶","不含消費性貸款","授信戶歸類為預警戶起五個營業日內，營業單位應以「預警報告表」，辦理預警通報","授信戶預警徵兆未解除前，營業單位應每 2 個月以「預警報告表」更新預警戶之信用變化及行動計畫執行情形，向原受理通報單位辦理通報"],"a":1,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"2、額度停止動用。3、減少授信額度。4、收回全部或部分授信金額。5、增加保證人。6、增提擔保品。7、其他。（三）授信戶預警徵兆未解除或回復正常前，營業單位仍應按月以「預警報告表」更新預警戶之信用變化及行動計畫執行情形，向原受理通報單位辦理通報。"},"t":"ask"},{"id":"113-16","y":113,"n":16,"m":10,"q":"有關債權憑證之敘述何者正確？","o":["催收主管每半年應定期檢視債權憑證時效","具有執行名義之債權人聲明參與分配，不得就其分配不足金額聲請發給債權憑證","對將屆期尚未辦理換發者，除了自辦催收案件由分行自行辦理換發外，分行不用主動通知總行催收人員或委外催收公司辦理換發","以上皆是"],"a":0,"ci":{"b":"授信篇","c":"第五十六章 不良授信建檔管理","s":"第三節 逾期放款檔案之整理","t":"二、法院發給之<mark>債權憑證</mark>【包括本票裁定、民事勝訴判決及確定證明書、支付命令及確定證明書、法院和解或調解筆錄、拍賣抵押（質）物裁定及確定證明書、經法院裁定認可之前置協商方案、更生方案認可裁定及確定證明書、清算確定不免責或撤銷免責之債權表及確定證明書、公證書及其他得為強制執行名義之證明文件】，應逐筆記載於實體及逾催系統之「<mark>債權憑證</mark>登記簿」，<mark>催收主管每半年應定期檢視債權憑證時效</mark>，對於將屆期尚未辦理換發者，除自辦催收案件由分行自行辦理換發外，應責成催收人員以業務聯繫單主動通知負責催理該案之債權管理處管理部（區域中心）催收人員或第一金融資產管理股份有限公司於<mark>債權憑證時效</mark>消滅前辦理換發。"},"t":"ask"},{"id":"113-17","y":113,"n":17,"m":10,"q":"下列敘述何者有誤？","o":["因訴訟案件聲請假扣押執行所提存之擔保物，應於提供擔保之原因消滅之翌日起十年內儘速向該管法院提存所聲請返還，逾期其提存物屬於國庫","以本行總行名義為聲請人或原告、上訴人之訴訟案件，相關聲請狀、訴狀或委任書之本行法定代理人住所地，應一律以總行行址為住所地","自 113 年 7 月1 日起，債權人聲請調查債務人之保險人名稱、保險種類或名稱之保險執行事件，請逕向債務人住居所地法院遞狀聲請，以節省時效","債權人收受假扣押或假處分裁定後已 20 日者，不得聲請執行"],"a":3,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第二節 執行程序","t":"(九)<mark>債權人收受假扣押或假處分裁定後已</mark>逾三十<mark>日者，不得聲請執行</mark>（參照強制執行法第一百三十二條）。三、假處分(一)聲請裁定拍賣抵押物之前必要時聲請法院假處分，藉以禁止擔保品出租、出典或與第三人合建房屋等足使其價值減少之行為。"},"t":"neg"},{"id":"113-18","y":113,"n":18,"m":5,"q":"下列授信案件何者得酌情免辦徵信？","o":["金控公司授信案件比照會員銀行得酌情免辦理徵信","本行係聯貸案件之參貸銀行，得以主辦行之聯貸說明書作為本行之徵信報告","辦理稅捐記帳保證之授信案件得酌情免辦徵信","借戶無其他授信時，提供他人同幣別之外匯定期存單所申請之外匯授信案件得酌情免辦徵信"],"a":0,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"二、徵信準則第十七條規定：<mark>會員銀行</mark>、政府機關、公營事業、政府計劃性<mark>授信案件</mark>及已提供本行存款十足擔保之<mark>授信案件得酌情免辦</mark>徵信及酌情免予索取相關徵信資料。"},"t":"neg"},{"id":"113-19","y":113,"n":19,"m":5,"q":"某企業擬向本行申請資本性支出之中期授信新臺幣1.5億元，經查其聯徵中心歸戶餘額新臺幣0.5億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應向客戶徵取之中長期資料有哪些？<br><span class=\"it\">A.</span> 現金流量預估表<br><span class=\"it\">B.</span> 預估綜合損益表<br><span class=\"it\">C.</span> 預估資產負債表<br><span class=\"it\">D.</span> 個案預計資金來源去路表及建廠進度表<br><span class=\"it\">E.</span> 營運計畫","o":["ABC","ABCE","ABCDE","無須加徵中長期資料"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他中長期授信：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、<mark>建廠進度表</mark>、<mark>營運計畫</mark>、<mark>現金流量預估表</mark>、<mark>預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信<mark>中心歸戶餘額</mark>及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯之金額</mark>。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"},"t":"combo"},{"id":"113-20","y":113,"n":20,"m":6,"q":"有關財務比率分析，下列何者錯誤？","o":["本金利息保障倍數一般用於長期償債能力分析","流動比率如果高於100%，表示企業流動資產足以償還現有之流動債務","現金週期=應收款項週轉天數+存貨週轉天數","速動資產=現金及約當現金+短期性之投資+應收款項淨額"],"a":2,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"買存貨，將存貨銷售，俟<mark>應收款項</mark>到期收回為止所需之期間。(6)<mark>現金週期=應收款項週轉</mark>轉天期<mark>+存貨週轉天</mark>期-應付<mark>款項週轉天</mark>期。即營業週期扣除應付款項延期支付期間，用以測驗企業從購買存貨應付款項付現到<mark>應收款項</mark>收現的期間。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第43頁","v":53,"t":"<mark>應收款項週轉</mark>率：營收/平均<mark>應收款項</mark>總額(次)；365天/週轉次數=<mark>週轉天數</mark>測知產品銷售速率，存貨安全存量及是否有滯銷之現象營業<mark>週期=應收款項週轉天數+存貨週轉天數</mark>•指企業自投入現金購買存貨、銷售到帳款收回所需期間<mark>現金週期=應收款項週轉天數+存貨週轉天數</mark>-應付<mark>款項週轉天</mark>期"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第43頁：「365天/週轉次數=週轉天數測知產品銷售速率，存貨安全存量及是否有滯銷之現象營業週期=應收款項週轉天數+存貨週轉天數」「指企業自投入現金購買存貨、銷售到帳款收回所需期間現金週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期」","t":"neg"},{"id":"113-21","y":113,"n":21,"m":4,"q":"如動產抵押案件授信餘額達 5,000 萬元(含)以上者，除每年辦理一次重估外，每隔多久應再辦理「擔保物(動產)勘查閱覽」建檔？","o":["3 個月","6 個月","8 個月","無須辦理"],"a":1,"ci":{"b":"授信篇","c":"第十章 動產擔保交易","s":"第一節 動產抵押","t":"(三)<mark>動產抵押案件</mark>貸放後重估及勘查頻率：1.<mark>授信餘額</mark>未<mark>達5,000萬元每年辦理一次重估</mark>，且應重新實地勘查保養及使用情形，並拍照留存上傳於附加檔案，免<mark>再辦理「擔保</mark>品<mark>(動產)勘查閱覽」建檔</mark>。"},"t":"ask"},{"id":"113-22","y":113,"n":22,"m":4,"q":"下列何者非屬本行授信利害關係人控管對象？","o":["一般行員","總行單位副處長","本行持有實收資本總額 3%以上之企業","辦理授信之職員(含有參與該筆授信案件之所有審核人員)"],"a":null,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第七節 授信總餘額之限制","t":"一、<mark>銀行對其持有實收資本總額百分之五以上之企業</mark>，或本行負責人、職員或主要股東，或對與本行負責人或辦理授信之職員有利害關係者為擔保授信，其總餘額不得超過銀行淨值一˙五倍（不得為無擔保授信），並應受下列授信限額等規定之限制：(一)其中對同一法人之擔保授信總餘額不得超過該銀行淨值百分之十。"},"t":"neg"},{"id":"113-23","y":113,"n":23,"m":4,"q":"借款人初次授信申請時，應辦理「顧客帳務資料查詢交易（9703）」及「保證資料查詢（A220）」交易，進行授信聯行查詢，下列敘述何者有誤？","o":["企業授信戶查詢對象為借款人、負責人、保證人","個人授信戶查詢對象為借款人、保證人","如查詢對象在聯行無授信往來(含66帳號結清銷戶者)及共同債務者，得逕行辦理授信申請","同一借款人如擬於不同營業單位往來，應先經原往來分行同意後，始得以經理權限進行申請"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"(三)為加強授信歸戶管理，除總行另有規定外，<mark>同一借款人</mark>限在同一家<mark>營業單位</mark>授信往來，<mark>如擬於不同營業單位往來，應先經原往來分行同意後，始</mark>以授信申請書申請區域中心或總行授信審核處核准，惟借款人於聯行授信往來僅有「勞工紓困貸款」或「信用卡處線上行銷部撥貸案件」，<mark>經原往來分行同意</mark>且屬適用<mark>經理權限</mark>者，得逕<mark>以經理權限</mark>核准。"},"t":"neg"},{"id":"113-24","y":113,"n":24,"m":4,"q":"本行113年4月核准甲公司短放新臺幣(以下同)10,000仟元，徵取借戶董事長A及董事B為保證人，113年5月貸放一筆2,000仟元，6月保證人B卸任該公司董事且未簽立續任保證人同意書，113年7月再貸放一筆3,000仟元，下列何者正確？","o":["僅保證人A對113年7月之貸放負保證責任","保證人B對2筆貸放皆不負保證責任","保證人A僅對113年5月之貸放負保證責任","需向保證人A徵取「代位清償人同意書」"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"1.有徵取保證書者：(1)於卸任時已簽立「續任保證人同意書」，其展期約據得採蓋章(與放款印鑑一致，以下同)或親簽加蓋章方式辦理，採後者較為嚴謹，原則儘量採用。(2)於卸任時未簽立「續任保證人同意書」，惟願為該筆舊貸案件續負展期<mark>保證責任</mark>，其展期約據採親簽加蓋章方式辦理；倘不願為舊貸案件<mark>負保證責任</mark>，則須申請免除對舊貸案件<mark>保證責任</mark>之核准。"},"t":"ask"},{"id":"113-25","y":113,"n":25,"m":11,"q":"有關徵取股票為擔保品之授信，下列何者錯誤？","o":["上市股票之鑑價以股票前一日收盤價與最近三個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於130%，應即實行質權賣出股票，以確保本行債權"],"a":3,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"(二)倘每股時價乘現存擔保股票股數或受益憑證單位數之值低於當日貸放餘額之一二○％者<mark>，應即實行質權</mark>出賣設質股票、受益憑證<mark>，以確保本行債權</mark>。"},"t":"neg"},{"id":"113-26","y":113,"n":26,"m":4,"q":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？<br><span class=\"it\">A.</span> 借款人<br><span class=\"it\">B.</span> 企業授信戶之負責人<br><span class=\"it\">C.</span> 擔保物提供人<br><span class=\"it\">D.</span> 保證人","o":["AC","AD","ACD","ABCD"],"a":0,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"三、抵押權之塗銷(一)<mark>借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權</mark>有無不利<mark>影響，並辦理抵押權塗銷查詢作業</mark>。<mark>查詢對象</mark>為借款人及<mark>擔保物提供人</mark>，營業單位應執行「顧客帳戶資料查詢交易(9703)(查詢代號：11)」、「保證/共同債務資料查詢(A220)(查詢代號：1~2)」，並依下列方式辦理："},"t":"combo"},{"id":"113-27","y":113,"n":27,"m":9,"q":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","o":["500萬/1,000萬","400萬/800萬","300萬/600萬","500萬/800萬"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"6.辦理授信申請，包含新貸、增貸及全額增貸，以及條件變更有增加、減少或更換擔保品，該案件徵提有正、副擔保品時須填寫「運用擔保品洗錢及資恐交易態樣檢核表」，並經防制洗錢及打擊資恐督導主管及經理覆核，作為授信申請之必要附件：(1)個人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>500萬</mark>元(含)以上；(2)法人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>1,000萬</mark>元(含)以上。"},"t":"ask"},{"id":"113-28","y":113,"n":28,"m":4,"q":"營業單位辦理中長期融資，下列敘述何者不正確？","o":["自其他金融機構轉貸之非聯貸代償案件，授信申請時，資金用途得勾選「05：償還同業貸款」或「63：其他」","不動產代償案件，若能於3個營業日內完成代償作業，並取得第1順位抵押權之案件，且借戶在原貸銀行之結欠餘額內代償者，授權營業單位經理得於『擔保授信』之權限額度範圍內逕以「擔保放款」項目貸放","中長期融資，得視實際情況酌定寬限期，原則依貸款期限六分之一範圍內訂定，最長不得超過5年","不動產代償案件，應於匯款傳票備註欄註明「代償不動產貸款，無法核發清償證明者請退匯」字樣"],"a":0,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"十一、營業單位辦理<mark>自其他金融機構轉貸之代償案件</mark>時，作業規範如下：(一)<mark>資金用途</mark>：1.如為借戶原貸銀行之結欠餘額內代償者<mark>，資金用途</mark>應與原貸行之<mark>資金用途</mark>一致，一律不<mark>得勾選「05：償還同業貸款」或「63：其他」</mark>，如有多種<mark>資金用途</mark>，應分別申請。惟聯貸案件倘單項額度含有一種以上<mark>資金用途</mark>時，得暫以<mark>「05：償還同業貸款」或「63：其他」</mark>申請授信，貸放時則仍應依實際<mark>資金用途</mark>分別以子額度建檔及貸放。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第9頁","v":47,"t":"<mark>營業單位辦理</mark>購置符合下列任一條件且建物權狀含有「住」字樣之「高價住宅」，應一律送區域中心或總行授信審核處審核:(1)臺北市:住宅鑑價或買賣金額新臺幣七千萬元以上(2)新北市:住宅鑑價或買賣金額新臺幣六千萬元以上(3)雙北以外住宅:鑑價或買賣金額新臺幣四千萬元以上。<mark>營業單位辦理自其他金融機構轉貸之代償案件</mark>時，<mark>資金用途</mark>如為借戶原貸銀行之結欠餘額內代償者，<mark>資金用途</mark>應與原貸行之<mark>資金用途</mark>一致，一律不得勾選「05：<mark>償還同業貸款</mark>」或「63：其他」，惟聯貸案件倘單項額度含有一種以上<mark>資金用途</mark>時，得暫以「05：<mark>償還同業貸款</mark>」或「63：其他」申請授信，貸放時則仍應依實際<mark>資金用途</mark>分別建檔額度及貸放。"},"x":"依講義〈授信商品及應注意事項〉第9頁：「營業單位辦理自其他金融機構轉貸之代償案件時，資金用途如為借戶原貸銀行之結欠餘額內代償者，資金用途應與原貸行之資金用途一致，一律不得勾選「05：償還同業貸款」或「63：其他」，惟聯貸案件倘單項額度含有一種以上資金用途時，得暫以「05：償還同業貸款」或「63：其他」申請授信，貸放時則仍應依實際資金用途分別建檔額度及貸放。」","t":"neg"},{"id":"113-29","y":113,"n":29,"m":11,"q":"有關保證業務，下列敘述何者不正確？","o":["客戶有預開保證書需求時，申請之保證期間應包含預開天數及銀行保證天數","申請外幣保證業務，應事先申請授信審核處或區域中心核准","對於以一定成數移送信保基金之新臺幣保證案件，整筆保證金額得以擔保科目列帳","收回本行簽發之保證書，得解除保證責任"],"a":2,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第二節 簽發保證書","t":"2.對未徵有十足擔保品<mark>之新臺幣保證案件</mark>：（借）應收保證款項-無擔保（24627）（貸）保證款項-無擔保（40932）(二)<mark>對於以一定成數移送</mark>中小企業信用保證基金或徵取部分擔保品（定存單）為擔保<mark>之新臺幣保證案件，整筆保證金額</mark>仍以無擔保列帳。"},"t":"neg"},{"id":"113-30","y":113,"n":30,"m":8,"q":"有關「授信最高額度控管作業」，下列敍述何者不正確？","o":["控管方式主要分為「核准號碼」及「客戶ID」(含集團控管)等兩類控管","可跨不同分行、不同授信戶、臺外幣系統進行額度控管","最高限額幣別僅限新臺幣及美金、歐元","新臺幣授信控管範圍包含直接授信、間接授信(含保證、國內信用狀)、憑卡貸款及支存透支"],"a":2,"ci":{"b":"授信篇","c":"第五十章 外匯定期存款質借外幣","s":"","t":"三、質借幣別及成數：(一)質借幣別與存單幣別相同者：質借金額最高不得逾存單面額。(二)質借幣別與存單幣別不同者：存單幣別及質借幣別限承作<mark>美金、歐元</mark>、日幣、人民幣、英鎊、港幣、澳幣及紐幣，貸款成數最高九成。"},"x":"最高限額幣別僅限<b>新臺幣及美金</b>（不含歐元）。","lo":1,"t":"neg"},{"id":"113-31","y":113,"n":31,"m":11,"q":"有關國內即期信用狀業務，下列敘述何者不正確？","o":["信用狀有效期限原則上不得超過四個月","本行墊付票款後，申請人應於二十天內來行清償。惟如另續貸新臺幣放款者，續貸期限自本行墊付日起最長一百八十天","開狀手續費：有續貸新臺幣者，按開狀金額，以年率0.1％以上計收，低於500元以500元計","續貸新臺幣放款，於開發國內即期信用狀時所填寫之核貸單空白處加註續貸日、到期日及續貸金額等，呈轉營業單位經理同意後辦理貸放"],"a":1,"ci":{"b":"授信篇","c":"第三十五章 國內即期信用狀業務","s":"第一節 申請手續","t":"(四)<mark>本行墊付票款後，申請人應於十天內來行清償。惟如另續貸新臺幣放款者，續貸期限自本行墊付日起最長一百八十天</mark>。二、會計項目欄填寫「應收信用狀款－應收即期國內信用狀款」，期限欄填寫額度有效期限（非循環額度免填），並於營業申請單位條件欄敘明每筆信用狀有效期限，每次墊款期限（一律為十天），擬<mark>續貸新臺幣放款者，</mark>則填寫每次<mark>續貸期限</mark>（含墊款期限），利率欄填寫其墊、<mark>貸新臺幣放款</mark>之擬貸放利率。"},"t":"neg"},{"id":"113-32","y":113,"n":32,"m":1,"q":"公司法人(借戶)購置住宅供該公司營業使用者，得排除中央銀行「公司法人購置住宅貸款」管控之規定，下列敘述何者不正確？","o":["營業單位實地查核該建物確實供借戶公司營業用(出租除外)","確認借戶公司已於該建物辦理設立登記","徵取建物所在地之地方政府法令規定該建物可供營業使用之證明","建物所有權狀之用途登記「住商」，無須適用中央銀行「公司法人購置住宅貸款」管控之規範"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"一、<mark>購置住宅貸款</mark>包括下列受本規定限制之貸款項目：1.<mark>公司法人購置住宅貸款</mark>。2.自然人購置高價<mark>住宅貸款</mark>。3.自然人第1戶、第2戶、第3戶以上購屋貸款Q1：借款人申辦<mark>購置住宅貸款</mark>，其<mark>建物所有權狀之用途登記</mark>含「住」、<mark>「住商」</mark>、「住辦」、「住工」等，是否應適用本規定之規範？答：是。"},"t":"neg"},{"id":"113-33","y":113,"n":33,"m":11,"q":"有關辦理應收帳款承購業務，下列何者為是？","o":["提供企業間因記帳賒銷所衍生應收帳款債權之管理服務","有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險","每筆帳款預支價金以不超過實際帳款交易淨額之七成為原則","一律徵取應收帳款承購額度 110%之備付本票"],"a":0,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第一節 定義、承購方式及承購型態","t":"一、目的<mark>提供企業間因記帳賒銷所衍生應收帳款債權之管理</mark>、收回、催討、融通資金、買方信用風險轉嫁等服務。二、定義本行就授信戶基於商品銷售、勞務提供等實際交易行為所產生之<mark>應收帳款債權</mark>，透過<mark>應收帳款債權</mark>移轉方式，依客戶需求提供下列二項以上之服務："},"t":"ask"},{"id":"113-34","y":113,"n":34,"m":3,"q":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？","o":["重建融資額度原則上應一次全數動撥至信託專戶","採借款人互為連保方式承作","須經全體土地及合法建物所有權人同意","營建融資及其他營建費用融資成數最高十成"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"(一)抵押土地已動工興建開發。(二)借款人檢附抵押土地具體興建開發計畫，並切結於一年內動工興建開發。八、金融機構承作不動產抵押貸款，其屬依都市更新條例、都市危險及老舊建築物加速重建條例或其他配合政府相關政策之重建案件，不適用本規定。"},"x":"危老自力更新重建貸款<b>非</b>採借款人互為連保方式承作。","lo":1,"t":"neg"},{"id":"113-35","y":113,"n":35,"m":7,"q":"有關中小企業信用保證基金送保對象基本資格之敘述，下列何者為非？","o":["中小企業：符合行政院核定「中小企業認定標準」之中小企業，惟不含金融及保險業、特殊娛樂業","取有主管機關依法核發營業證照之申貸戶(含公立機關(構)及財團法人)，得視同依法辦理公司登記或商業登記","曾以直接保證方式取得貸款之企業得為直接保證之保證對象","其他經信保基金董事會議通過並經經濟部核定之信用保證對象"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"貳、信用保證對象基本資格及不得送保相關規定","s":"貳-1","t":"另取有主管機關依法核發營業證照之下列申貸戶［<mark>不含公立機關（構）及財團法人</mark>］，得視同依法辦理公司、有限合夥登記或商業登記：1.醫療保健服務業或建築師事務所。"},"x":"同 112-31。","lx":{"b":"信保手冊：2025年版作業手冊待修訂彙總表(115.10)","c":"第1頁","v":48,"t":"所稱<mark>中小企業</mark>，係指<mark>依法辦理公司</mark>、有限合夥<mark>登記或商業登記</mark>，實收資本額或出資額在新臺幣一億元以下，或經常僱用員工數未滿二百人之事業。另<mark>取有主管機關依法核發營業證照之</mark>下列申貸戶［不<mark>含公立機關</mark>（構）<mark>及財團法人</mark>］，<mark>得視同依法辦理公司</mark>、有限合夥<mark>登記或商業登記</mark>：1.醫療保健服務業或建築師事務所。(二)創業個人：中華民國國民在國內設有戶籍，且為所創或所營<mark>中小企業</mark>為符合<mark>財團法人</mark>法及捐助章程相關規範，就保證對象中：1.屬<mark>視同依法辦理公司登記</mark>、有限合夥<mark>登記或商業登記</mark>之事業，訂定<mark>信用保證</mark>退場機制，116年6月30日以前仍得申請<mark>信用保證</mark>，屆期後，該類對象即停止受理申請。"},"t":"neg"},{"id":"113-36","y":113,"n":36,"m":11,"q":"有關本行辦理「聯合授信貸款」業務，下列何者為非？","o":["徵有國內擔保品時，應依規辦理 e-Loan 系統建檔，設定金額及貸放限額應依參貸比率輸入","簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，統籌主辦案件由營業單位逕行會辦法務室","本行擔任額度管理行時，應先執行「參貸機構比例資料維護(A615)」建檔","簽約後，每月 5 日前上法人金融網填報「聯合授信個案資料表」，每月 25 日前填報「聯貸案件到期追蹤表」"],"a":1,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第一節 聯合授信貸款通則","t":"(一)<mark>簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，</mark>並應<mark>會辦法務室</mark>。<mark>統籌主辦案件由</mark>聯貸及專案融資部會辦，共同主辦及參貸<mark>案件由營業單位逕行會辦</mark>。簽約後若有進行修約，相關增補合約應於簽署前<mark>由營業單位</mark>會辦。(二)<mark>營業單位</mark>應以本行授權印鑑/簽字式樣辦理簽約。"},"t":"neg"},{"id":"113-37","y":113,"n":37,"m":3,"q":"有關本行「工業用土地貸款應注意事項」中資金用途為「購置」之規定，下列何者為非？","o":["授信期限應配合借款人所提興建計畫期程時間，逕核予中長期借款","借款人久未動工，其逾動工切結日所加碼利率，不得於未動工前先行調降利率再行提高利率","對於借款人久未依興建計畫動工者，應確實了解未動工原因，並敦促依約動工","倘無法動工且無法全數收回者，應盡可能與借款人協商分期收回貸款機制，以減少囤地之情形"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費 combo"},{"id":"113-48","y":113,"n":48,"m":10,"q":"催收人員收回款項時，應於當日先暫入「其他預收款-預收放款延滯案款項」項子目，除有特殊原因不得動支者外，依如下方式或本行相關規定整理帳務，下列何者有誤？","o":["營業單位自辦催理案件(含信保基金已先行交付備償款項之勞工紓困貸款逾放案件)，得自行辦理帳務沖償","債權管理處債權管理部接辦案件，應通知營業單位辦理帳務沖償事宜","營業單位自辦催理案件，屬信保基金已先行交付備償款項者(不含勞工紓困貸款逾放案件)，應申請債權管理處核准","區域中心接辦案件，免通知營業單位辦理帳務沖償事宜"],"a":3,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"1.債權管理處債權管理部或<mark>區域中心接辦案件，</mark>應<mark>通知營業單位辦理帳務沖償事宜</mark>。2.<mark>營業單位</mark>自辦催理案件(含信保基金已先行交付備償款項之勞工紓困貸款逾放案件)，得自行<mark>辦理帳務沖償</mark>。"},"t":"neg"},{"id":"113-49","y":113,"n":49,"m":10,"q":"擬轉列催收款項案件，全案授信餘額達新臺幣","o":["1,500 萬","2,000 萬","3,000 萬","3,500 萬 元(含)以上者，應申請債權管理處同意後辦理"],"a":3,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（二）上述擬轉列催收款項案件，全案授信餘額達<mark>3,500萬元</mark>（含）以上者<mark>應申請債權管理處同意後辦理</mark>。肆、催收作業：ㄧ、對未依約履行之授信戶，承辦案件單位於逾期放款新發生初期應辦理下列催討措施，每日由營業單位經理指派之業務（資深）副理於逾催系統/【主管作業】/【案件分派】功能選項下，辦理分案予專人（一人或多人），以辦理簡易催繳工作，一般催收工作則由承辦案件單位之催收人員辦理。"},"t":"fill"},{"id":"113-50","y":113,"n":50,"m":10,"q":"借據之本金請求權，時效期限為 A 年，其利息之請求權時效期間為 B 年。上述A、B 分別為","o":["20、10","15、10","15、5","10、3"],"a":2,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第一節 各項請求權之消滅時效","t":"二、<mark>借據之本金請求權，時效期限為</mark>十五<mark>年，其利息之請求權時效期間為</mark>五年（民法第一百二十五、一百二十六條）。"},"t":"fill"},{"id":"113-51","y":113,"n":51,"m":10,"q":"對於轉銷呆帳後案件墊支逾（　）或經積極催討並以「其他預收款-預收放款延滯案款項」沖抵後仍未能收回之「其他應收款-放款訴訟費用」，催收人員應申請債權管理處核准後以「其他什項支出-催收各項費用」開支，並記入呆帳登記簿與辦理「呆帳-放款訴訟費用明細資料」交易建檔，及繼續催討。","o":["1年","2年","6個月","3個月"],"a":1,"ci":{"b":"授信篇","c":"第六十三章 呆帳轉銷","s":"第四節 呆帳費用","t":"五、<mark>對於轉銷呆帳後案件墊支逾</mark>2年<mark>或經積極催討並以「其他預收款-預收放款延滯案款項」沖抵後仍未能收回之「其他應收款-放款訴訟費用」，催收人員應</mark>依據原轉銷核准文號，<mark>申請債權管理處核准後以「其他什項支出-催收各項費用」開支，並記入呆帳登記簿與辦理「呆帳-放款訴訟費用明細資料</mark>建檔（6290）<mark>」交易建檔，及繼續催討。</mark>"},"t":"fill"},{"id":"113-52","y":113,"n":52,"m":5,"q":"有關徵信報告屆期改編作業，下列敘述何者正確？","o":["企金e-Loan系統每月1日提供「徵信報告未來二個月屆期明細表」","企金e-Loan系統每月15日提供「徵信報告逾改編屆期日二個月內明細表」","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」，保管期限5年","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」應呈核至單位經理"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第一節 動態徵信的意義與重要性","t":"而為提升<mark>徵信報告</mark>屆期改編作業管理效能，企金e-Loan系統每月5日提供<mark>「徵信報告</mark>（摘要/補充說明）<mark>未來二個月屆期明細表」</mark>、每月10日提供<mark>「徵信報告逾改編屆期日二個月內明細表」</mark>，營業單位應指派專人每月定日列印，並於『備註』欄位扼要敘明處理情形（如:已洽客戶提供資料、已不往來、編製中等），自報表產製日起5個營業日內，逐級<mark>呈核至單位經理</mark>後專卷保管，保管期限1年；報表查詢列印系統(OnDemand)每月5日提供「得免逐年改編<mark>徵信報告</mark>之授信戶名單」(代號DWLN08)，營業單位應指派專人每月定日列印，逐級<mark>呈核至單位經理</mark>後專卷保管，保管期限1年。至於在<mark>徵信報告</mark>有效期間內，企業授信戶申請增貸時，應重新檢視其在金融機構總授信金額是否仍在原徵授信戶資料表範圍內，若已逾越，應重徵授信戶資料表及相關財務報表辦理<mark>徵信報告</mark>改編工作。若雖未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，則對於原辦理單位已核定之徵信相關報告得繼續沿用至報告有"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第30頁","v":38,"t":"<mark>徵信報告</mark>的管理<mark>徵信報告屆期改編作業</mark>管理：企金eloan系統•<mark>徵信報告</mark>(摘要/補充說明)未來2<mark>個月屆期明細表</mark>：每月5日提供•<mark>徵信報告逾改編屆期日</mark>2<mark>個月內明細表</mark>：每月10日提供"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第30頁：「徵信報告逾改編屆期日2個月內明細表：每月10日提供」","t":"ask"},{"id":"113-53","y":113,"n":53,"m":5,"q":"有關查詢聯徵中心信用資訊之作業，下列敘述何者錯誤？","o":["各單位應每日列印查詢紀錄資訊，經查詢人員蓋章及主管覆核","退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","查詢聯徵中心所得之信用資訊可供行銷業務使用","須符合授信業務目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得查詢"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第五節 財團法人金融聯合徵信中心信用資訊產品種類與運用","t":"九、符合授信目的或金融管理法令遵循目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得進行查詢當事人<mark>之信用資訊</mark>。但法令另有規定者，從其規定。前述所稱同意之意思表示，依電子簽章法之規定，得以電子文件為之。辦理電子銀行業務應依銀行公會「金融機構辦理電子銀行業務安全控管作業基準」有關交易訊息之安全限制規定，應用於信用卡申辦或貸款申請時，系統應留存足以證明客戶意思表示同意金融機構<mark>查詢聯徵中心</mark>信用資料之紀錄(如日期、來源IP或電話號碼、同意內容或版本、身分驗證結果等)，且相關紀錄內容可完整呈現供日後查驗。<mark>信用資訊</mark>之利用，應遵守各項業務自律章則及金融相關法令，確保資訊利用之適法性及合目的性，並應與授信目的或金融管理法令遵循目的具有正當合理之關聯，不得利用自<mark>聯徵中心所</mark>查得客戶<mark>之信用資訊</mark>辦理行銷、或為其他逾越特定目的必要範圍之利用。查詢<mark>所得之信用資訊</mark>應保守秘密，並嚴限內部參考。除當事人依法查詢其本人資料外，不得對外公開或移轉他人。自金融聯合徵信中心擷取之警示帳戶通報資料，除與帳戶所有人另有契約約定得"},"t":"neg"},{"id":"113-54","y":113,"n":54,"m":6,"q":"會計師因違反會計師法或證券交易法，其簽發之財務報表查核報告自處分日起於受處分期間內不予採用，係因該會計師受何種處分？","o":["警告","停止執行業務","申誡","除名"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"1.受處分警告或申誡者，其簽發之財務報表查核報告自處分日起一年內如准予採用，應註明採用之原因並審慎評估。2.受處分<mark>停止執行業務</mark>或停止辦理公開發行公司之查核簽證者，其簽發之財務報表查核報告自處分日起於受處分期間內不予採用。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第22頁","v":34,"t":"•建請客戶下一年度聘任未有懲戒紀錄之會計師<mark>停止執行業務</mark>或停止辦理公開發行公司查核簽證•<mark>自處分日起於受處分停止執行業務期間內不予採用</mark>除名或撤銷公開發行公司查核簽證之核准•<mark>自處分日起不予採用財務報表</mark>"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第22頁：「自處分日起於受處分停止執行業務期間內不予採用除名或撤銷公開發行公司查核簽證之核准」","t":"ask"},{"id":"113-55","y":113,"n":55,"m":9,"q":"為落實責任金融，辦理徵信作業之查詢項目中，何者「不」屬客戶之 ESG 善盡企業社會責任揭露項目？","o":["應向聯徵中心查詢最新之勞工退休準備金相關資訊記載","應向聯徵中心查詢企業授信餘額及還款紀錄資訊","因應歐盟實施「碳邊境調整機制」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度","應向「行政院環境部列管污染源資料查詢系統」查詢企業戶是否為污染源列管中及曾發生之違規紀錄"],"a":1,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第三節 企業戶徵信報告(小額貸款專用)暨公司信用卡專用徵信報告","t":"6.ESG相關查詢及揭露事項:為落實責任金融，將客戶是否依環境面(E)、社會面(S)及公司治理面(G)善盡企業社會責任納入風險評估重點。(1)環境面(E)：應向「行政院環境部列管污染源資料查詢系統」（網址:http://prtr.epa.gov.tw/）<mark>查詢企業</mark>戶是否為污染源列管中及曾發生之違規紀錄；如客戶有提供或徵信人員查詢可得客戶近三年碳排量資訊(行政院環境部規範應盤查登錄溫室氣體排放量之排放源對象可至「事業溫室氣體排放量資訊平台」查詢，公開發行以上公司得查詢年報、永續報告書或TEJ資料庫)應揭露於徵信報告中；因應歐盟實施「碳邊境調整機制(CBAM)」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度。(2)社會面(S)：<mark>應向聯徵中心查詢</mark>最新之勞工退休準備金相關資訊記載之；倘為「食品/醫藥業」須至「衛生福利部食品藥物管理署」（網址:https://consumer.fda.gov.tw/）查詢有無違規紀錄。"},"t":"neg"},{"id":"113-56","y":113,"n":56,"m":5,"q":"辦理徵信作業時，企業授信戶之財務報表倘未達徵提會計師財務報表查核報告之標準，應徵取加蓋稅捐機關收件章之營利事業所得稅結算申報書影本，有關前述之相關規定，下列何者錯誤？","o":["該企業在金融機構總授信金額未達新臺幣 3,000 萬元","綜合損益表應依據申報書上之「自行調整金額欄」辦理報表攤列","「財報核驗結果分析表」逐級陳核至單位主管後，置於徵信、授信卷宗保管","辦理新貸戶徵信作業時，應於企金 e-Loan 系統【財務報表核驗】功能，至少完成最新二年度財務比率核驗"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第一節 財務資料之徵取","t":"二、營利事業所得稅結算申報書影本：企業授信戶若為公司組織在金融機構之總授信金額未達新台幣三千萬元或為非法人組織未達重要授信戶標準者，應徵取加蓋稅捐機關收件章之營利事業所得稅結算申報書影本，或印有稅捐機關收件章戳記之網路申報所得稅報表。<mark>辦理報表攤列</mark>時，資產負債表依據該申報書之附表-「資產負債表」，<mark>綜合損益表</mark>依據該<mark>申報書上之「</mark>帳載決算<mark>金額欄」</mark>。若企業授信戶利用網際網路辦理營利事業所得稅結算申報並提供自行列印之資產負債表、損益及稅額計算表(<mark>綜合損益表</mark>)等財務報表時，由於不能核對正本及不易辨別真偽，應參酌借戶之行業特性、產業動態及與本行往來實績等據以綜合研判其真實性。對於未達財務簽證標準且使用營利事業所得稅結算申報書辦理結算申報之新貸戶，進行徵信作業時，應於企金e-Loan系統【財務報表核驗】功能，至少完成最新二年度財務比率核驗(倘借戶新成立僅有最新一年度報稅資料亦應完成核驗)，並列印『財報核驗結果分析表』逐級陳核至單位主管後，置於徵信、授信卷宗保管。另因財"},"t":"neg"},{"id":"113-57","y":113,"n":57,"m":5,"q":"辦理個人授信戶之徵信 融監督管理委員會規定之會計師財務報表查核報告</mark>（即長式報告），上述報告亦得自財團法人中華民國證券暨期貨市場發展基金會網站或台灣證券交易所股份有限公司<mark>公開資訊觀測站下載</mark>。"},"t":"ask"},{"id":"113-60","y":113,"n":60,"m":5,"q":"企業授信戶在金融機構總授信金額未達新臺幣3,000萬元，惟提供會計師財務報表查核報告，請問應向客戶徵取何種類資料表？","o":["小規模營利事業簡易資料表","簡易資料表","資料表","公司信用卡專用徵信資料表"],"a":2,"ci":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第17頁","s":"","t":"資料表與徵信報告格式資料表：金融機構總授信金額(含本次申請金額)達3,000萬元(含)以或<mark>雖未達3,000萬元惟提供會計師查核報告</mark>徵信報告格式：企業戶徵信報告(依資料表編製)小規模營利事業簡易資料表：金融機構總授信金額(含本次申請金額)600萬元（含）以下或1500萬元以下且具十足擔保者徵信報告格式：企業戶徵信報告(小額貸款專用)簡易資料表：在金融機構總授信金額(含本次申請金額)逾600萬元未達3,000萬元徵信報告格式：企業戶徵信報告(依簡易資料表)若本行僅往來出口押匯：徵信報告格式：企業戶徵信報告（小額貸款專"},"x":"依講義〈徵信規範暨作業要領〉：金融機構總授信金額達 3,000 萬元，<b>或雖未達 3,000 萬元惟提供會計師查核報告</b>者，應徵「資料表」；600 萬元以下（或 1,500 萬元以下十足擔保）用小規模營利事業簡易資料表。","lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第19頁","v":38,"t":"<mark>會計師財務報表查核報告</mark>民營營利事業之公司組織<mark>在金融機構總授信金額</mark>達<mark>3,000萬元</mark>辦理本票保證之<mark>企業授信戶</mark>：申請發行商業本票保證私立學校(含中小學及大專院校)：依私立學校法設立者可自行斟酌"},"t":"ask"},{"id":"114-1","y":114,"n":1,"m":3,"q":"個人非消費性貸款倘申貸資金用途屬投資經營事業者，且借款人所營事業屬建築業，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，資金用途應勾選","o":["營建自用不動產","營建銷售用不動產","其他營建資金","投資企業"],"a":2,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"十一、為利詳實統計銀行法第72條之2授信限額，辦理建築業(行政院主計處行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」；資金用途應勾選「<mark>其他營建資金</mark>(33)」。若貸款資金非用於「興建」或「購置」住宅及企業用建築之放款，分行端應於授信申請書內詳實說明資金用途，依適當之貸款種類及資金用途分類建檔，並落實貸後資金流向之追蹤管理。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第15頁","v":42,"t":"銀行法72條之2授信限額:辦理建築業申貸週轉金(行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)，<mark>貸款資金用</mark>於「興建」或「購置」<mark>住宅及企業用建築之放款</mark>，貸款種類應勾選「建築貸款(31)」，<mark>資金用途應勾選</mark>「<mark>其他營建資金</mark>(33)」。建築業週轉金貸款非用於「興建」或「購置」<mark>住宅及企業用建築之放款</mark>，分行端應於授信申請書內詳實說明<mark>資金用途</mark>，依適當之貸款種類及<mark>資金用途</mark>分類建檔，並落實貸後資金流向之追蹤管理。"},"x":"依講義〈授信商品及應注意事項〉第15頁：「銀行法72條之2授信限額:辦理建築業申貸週轉金(行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)，貸款資金用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」，資金用途應勾選「其他營建資金(33)」。」","t":"fill"},{"id":"114-2","y":114,"n":2,"m":3,"q":"下列關於建築貸款之敘述何者有誤？","o":["建築貸款包含興建房屋貸款及營建週轉金","基地面積超過 200 坪且 11 層樓以上者，貸款期限依實際需要及興建計畫個別核定，惟最長以不超過 6 年為原則","應於企金 e-Loan 系統授信申請書勾選應追蹤事項之「計畫執行進度追蹤表」","自貸放日起至少每 2 個月確實追蹤工程進度"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第二節 貸放、收回","t":"四、勘驗前項<mark>工程進度</mark>應由借款人提供監造建築師（或監造人）之勘驗紀錄或承造人之<mark>工程進度</mark>證明或會同監造建築師（或監造人）實地查驗辦理或委由建築經理公司辦理查核，<mark>自貸放日起至少每</mark>三<mark>個月確實追蹤工程進度</mark>，並至企金e-loan系統填報「計畫執行進度追蹤表」，<mark>工程進度</mark>相關證明文件與進度追蹤表應存卷備查。另興建動工之認定，應實際勘查並拍照做成勘查紀錄，且以工地現場是否有機具進場持續施工作為實質動工認定依據。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第15頁","v":42,"t":"<mark>建築貸款</mark>營建融資:應按<mark>工程進度</mark>或憑工程款支付明細等分批撥款，<mark>工程進度</mark>應由借款人提供監造建築師之勘驗紀錄/或承造人之<mark>工程進度</mark>證明/或會同監造建築師（或監造人）實地查驗辦理/或委由建經公司辦理查核，<mark>自貸放日起至少每</mark>三<mark>個月確實追蹤工程進度</mark>，並至企金e-loan系統填報「計畫執行進度追蹤表」，相關文件應存卷備查。營業單位承作「營造業」(行業別中類為41、42及43)之經常性融資案件(排除僅承作間接授信或提供十足擔保品者)，授信申請書應勾選「有追蹤事項」，並於撥貸前至企金e-loan貸後追蹤系統「入帳追蹤表」進行填報「專案融資/工程入帳追蹤表」，另於貸放後每三個月定期更新追蹤進度，確認入帳情形與合約規定是否相符，以掌控<mark>工程進度</mark>及<mark>追蹤工程</mark>款匯付情形，若發現異常，應即以電話、實地查訪或函詢業主等方式了解實情。"},"x":"依講義〈授信商品及應注意事項〉第15頁：「建築貸款營建融資:應按工程進度或憑工程款支付明細等分批撥款，工程進度應由借款人提供監造建築師之勘驗紀錄/或承造人之工程進度證明/或會同監造建築師（或監造人）實地查驗辦理/或委由建經公司辦理查核，自貸放日起至少每三個月確實追蹤工程進度，並至企金e-loan系統填報「計畫執行進度追蹤表」，相關文件應存卷備查。」","t":"neg"},{"id":"114-3","y":114,"n":3,"m":3,"q":"有關工業用土地貸款資金用途為週轉金之相關規範，下列何者正確？<br><span class=\"it\">A.</span> 應徵取工業用土地自用切結書(週轉金用)<br><span class=\"it\">B.</span> 資金用途不得用於購置、投資或興建不動產<br><span class=\"it\">C.</span> 借款人為法人戶須出具「營運週轉計畫書」<br><span class=\"it\">D.</span> 工業區閒置土地亦得辦理週轉金貸款","o":["ABC","BCD","BC","AD"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第九節 中小企業創新發展專案貸款","t":"(三)貸款用途為「購置土地」者，該土地係未來將興建廠房、營業場所始得辦理本貸款，且該土地屬「<mark>工業用土地</mark>」時，並應依本行<mark>有關工業用土地貸</mark>之規範辦理。"},"x":"官方答案 BC：資金不得用於購置/投資/興建不動產、法人戶須出具「營運週轉計畫書」；A、D 為錯誤敘述（工業區閒置土地不得辦理週轉金貸款）。","lo":1,"t":"combo"},{"id":"114-4","y":114,"n":4,"m":11,"q":"辦理應收帳款承購業務額度申請時，以統包方式承做供應鏈融資業務時，下列選項何者錯誤？","o":["應徵取買方付款承諾書及備付本票","可個案評估後，酌情依授信審核層級申請核准免徵取備付本票","利息採按月收息方式辦理","融資期限最長不得超過 180 天為原則"],"a":2,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第四節 額度申請","t":"四、額度申請方式(一)本業務額度一律依本行業務相關規定提出申請。1.得以單一賣方對應多個買方合併申請一個額度；2.另以統包方式，由多個賣方對應單一或多個買方合併申請一個額度或共用額度，承作供應鏈融資(無追索權承購)業務時：(1)應徵取買方付款承諾書及備付本票，查核報告書影本及本行承購買方之虛擬及承購額度動用情形應作為授信申請書之附件，惟可個案評估後，酌情依授信審核層級申請核准免徵取備付本票。(2)利息採預收<mark>方式辦理</mark>，並收取承購手續費(收取時點：有預支價金時，則預支價金時收取，無預支時則買方入帳時收取)；若因不可抗力之因素(如颱風、地震)，致銀行停止營業，無法於帳款到期日還款時，免收帳款到期日至恢復營業日間之延遲利息及違約金。(3)供應商已於本行營業單位往來，免依本行授信統一歸戶之相關規定辦理。(4)「供應商應收帳款承購合約書」之徵取，得免比照授信篇第三章第六節第四項之規定「須徵取循環額度借款契約之授信，應於核准後二個月內徵妥契約，逾期額度作廢」辦理。"},"t":"neg"},{"id":"114-5","y":114,"n":5,"m":1,"q":"營業單位辦理「中央銀行對金融機構辦理不動產抵押貸款業務」，承作公司法人購買建物權狀含有「住」字樣之住宅貸款，其貸款條件限制：<br><span class=\"it\">A.</span> 寬限期最長一年<br><span class=\"it\">B.</span> 貸款額度最高不得超過住宅(含基地)鑑價或買賣金額較低者之三成<br><span class=\"it\">C.</span> 除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額<br><span class=\"it\">D.</span> 所有住宅貸款案件應一律送區域中心或總行授信審核處審核。上述正確者共幾項？","o":["1","2","3","4"],"a":1,"ci":{"b":"講義：授信商品及應注意事項","c":"第9頁","s":"","t":"營業單位承作公司法人購買建物權狀含有「住」字樣之住宅貸款(指購置高價住宅貸款及購屋貸款)，其貸款條件限制如下：<mark>(1)無寬限期(2)貸款額度最高不得超過住宅（含基地）鑑價或買賣金額較低者之三成</mark>(3)除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額。"},"x":"依講義〈授信商品及應注意事項〉：公司法人購置住宅貸款<b>無寬限期</b>（A 錯）、最高 <b>3 成</b>（B 對）、不得另以修繕週轉金等名目增貸（C 對）；送區域中心或授審處審核者僅限<b>高價住宅</b>（D 錯）→ 正確 2 項。","lx":{"b":"講義：授信商品及應注意事項","c":"第9頁","v":62,"t":"<mark>營業單位承作公司法人購買建物權狀含有</mark>「住」<mark>字樣之住宅貸款</mark>(指購置高價<mark>住宅貸款</mark>及購屋貸款)，<mark>其貸款條件限制</mark>如下：(1)無寬限期(2)<mark>貸款額度最高不得超過住宅</mark>（含基地）<mark>鑑價或買賣金額較低者之三成</mark>(3)<mark>除前款貸款額度外</mark>，<mark>不得另以修繕</mark>、<mark>周轉金或其他貸款名目</mark>，<mark>額外增加貸款金額</mark>。<mark>營業單位辦理</mark>購置符合下列任一條件且<mark>建物權狀含有</mark>「住」字樣之「高價住宅」，<mark>應一律送區域中心或總行授信審核處審核</mark>:(1)臺北市:住宅<mark>鑑價或買賣金額</mark>新臺幣七千萬元以上(2)新北市:住宅<mark>鑑價或買賣金額</mark>新臺幣六千萬元以上(3)雙北以外住宅:<mark>鑑價或買賣金額</mark>新臺幣四千萬元以上。<mark>營業單位辦理</mark>自其他<mark>金融機構</mark>轉貸之代償案件時，資金用途如為借戶原貸銀行之結欠餘額內代償者，資金用途應與原貸行之資金用途一致，一律不得勾選「05：償還同業貸款」或「63：其他」，惟聯貸案件倘單項額度含有一種以上資金用途時，得暫以「05：償還同業貸款」或「63：其他」申請授信，貸放時則仍應依實際資金用途分別建檔額度及貸放。"},"t":"combo"},{"id":"114-6","y":114,"n":6,"m":8,"q":"考量優質企業授信戶議價能力強，承做短期借款時，依「第一商業銀行依貨幣市場利率承做短期放款準則」之相關規定：<br><span class=\"it\">A.</span> 適用對象原則上以本行企金評等 1-7 等之授信戶為對象<br><span class=\"it\">B.</span> 貸放期限最長 180 天<br><span class=\"it\">C.</span> 本行企金信評 4-5 等借戶，最低風險貼水 50bps<br><span class=\"it\">D.</span> 營業單位取得逐筆議價授權號碼後，辦理撥貸人員應於當日辦理貸放，逾期不得貸放。上述正確者為下列何組？","o":["AB","AC","AD","CD"],"a":1,"ci":{"b":"授信篇","c":"第二十章 台塑網線上融資業務","s":"","t":"2.25%(含)以上承做，嗣後修正請依「國內<mark>營業單位</mark>經理辦理企業戶新台幣放款最低貸放利率授權簡表」之授權利率辦理。(四)本項融資一律不得申請以<mark>貨幣市場利率承做短期放款</mark>(即MML)。"},"x":"MML 對象原則企金評等 1–7 等（A 對）；最長 90 天（B 錯）；4–5 等最低風險貼水 50bps（C 對）；授權號碼「當日或次一營業日」貸放（D 只寫當日，錯）→ AC。","lo":1,"t":"combo"},{"id":"114-7","y":114,"n":7,"m":11,"q":"有關徵取股票為擔保品之授信，下列敘述何者有誤？","o":["上市股票之鑑價以股票前一日收盤價與最近二個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於120%，應即實行質權賣出股票，以確保本行債權"],"a":0,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"四、鑑價及放款金額：(一)上市公司<mark>股票之鑑價</mark>及放款金額，除另有規定外，按下列方式辦理：1.按股票時價（申請<mark>前一日收盤價</mark>）與最近三<mark>個曆月之平均價孰低者</mark>為鑑價。"},"t":"neg"},{"id":"114-8","y":114,"n":8,"m":8,"q":"A 為甲公司之負責人且持股 35%，A 之配偶 B 持股甲公司 15%，A 之成年子女 C 持股甲公司 10%，A 另為乙公司之負責人且持股 55%，依「總行及區域中心各級人員授信審查權限準則」，甲公司之審查權限應併計對象為何？","o":["無應併計對象","ABC","AB 乙公司","AB"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(一)應於授信申請書「營業單位補充說明」中敘明案件關聯性。(二)應合併計算渠等借款人之授信權限額度，依歸戶後之額度判斷是否屬「國內營業單位經理權限授信要點」審核權限；倘逾經理權限者，逕依「總行及區域中心各級人員授信審查權限準則」申請區域中心或總行核准後辦理。參、信貸通則"},"x":"同 111-6 題型：法人授信戶審查權限<b>無應併計對象</b>。","lo":1,"t":"ask"},{"id":"114-9","y":114,"n":9,"m":8,"q":"甲公司目前有一筆短期放款額度新臺幣(以下同)100 萬元，現欲以移送信保八成方式申請開發國內信用狀額度 200 萬元及履約保證額度 300 萬元，依「國內營業單位經理權限授信要點」之權限判斷，應以多少金額來認定「無擔保授信」？","o":["600 萬元","500 萬元","200 萬元","120 萬元"],"a":2,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業信用保證基金之保證(一)財團法人中小企業信用保證基金（以下簡稱信保基金），為政府核准設立之信用保證機構，<mark>經其保證之授信，該保證成數部分，得視為擔保授信</mark>。"},"x":"短放 100 萬未送保全額為無擔保；LC 200＋履保 300＝500 萬送保 8 成 → 無擔保 100；合計 <b>200 萬</b>。","lo":1,"t":"ask"},{"id":"114-10","y":114,"n":10,"m":6,"q":"A 股份有限公司之負債比率達 420%，請問下列何者可改善該公司之負債比率？","o":["實收股本減資彌補虧損","提撥法定盈餘公積","現金增資","向關係人增加貸款"],"a":2,"ci":{"b":"徵信篇","c": 規範暨作業要領(2026.04)〉第27頁：「企業授信戶在本行總授信額度6億元(含)以上者之徵信業務」","t":"neg"},{"id":"114-14","y":114,"n":14,"m":2,"q":"有關本行「融資躉繳保費-信用貸款」規範，何者正確？","o":["營業單位經理得於「個別分行授信權限額度核給範圍」個人無擔保放款權限，以免保人「信用貸款」辦理","借戶為本行利害關係人，應與其他消費者無擔保貸款額度合計，不得逾新臺幣180 萬元","同一擔保品承作副擔保貸款，合計貸放額度不得逾鑑價金額一成","以上皆是"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"(二)<mark>融資躉繳保費</mark>─<mark>信用貸款</mark>：1.授權營業單位經理於「個別分行授信權限額度核給範圍」之個人無擔保放款權限內，以免保人之「<mark>信用貸款」</mark>方式辦理。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第20頁","v":33,"t":"貸款衍生人身保險保費融資貸款◎對象1.須為本行不動產擔保貸款借款人2.投保本行躉繳型貸款衍生人身保險商品3.借款人、要保人及被保險人須為同一人◎貸款種類1.「<mark>融資躉繳保費</mark>-擔保貸款(SP)」額度：依本行「各項擔保品貸放成數一覽表」規定辦理，與不動產擔保貸款合計逾經權貸放成數者，應申請總行/區域中心核准後辦理。2.「<mark>融資躉繳保費</mark>-<mark>信用貸款</mark>(SQ)」額度：授權營業單位經理於「個別分行授信權限額度核給範圍」之個人無擔保放款權限內，以免保人之「<mark>信用貸款</mark>」方式辦理，與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，應申請總行/區域中心核准後辦理；"},"t":"ask"},{"id":"114-15","y":114,"n":15,"m":11,"q":"本行試辦資產管理專區「以自益特定金錢信託受益權為擔保之質借業務，最高成數不以五成為限」，下列何者為非？","o":["借戶限高資產客戶且須徵妥【地方資產管理專區商品及服務申請書】","商品風險等級低度(RR1)~中高(RR4)最高五成，高度(RR5)最高四成","僅新興分行試辦本業務，其他營業單位得轉介高資產客戶至新興分行承作","計算績效時，新興分行與高資產客戶之信託往來分行皆認列 100%"],"a":1,"ci":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第21頁","s":"","t":"◎依受益權風險等級核給貸款成數<mark>風險等級為低度(RR1)-中高(RR4)最高5成</mark>風險等級為高度(RR5)最高4成◎質借額度及幣別新臺幣：最低新臺幣100萬元外幣：最低等值美金3萬元◎貸款期限最長1年，以非循環額度辦理。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉：一般受益權質借成數 RR1–RR4 最高 5 成、RR5 最高 4 成；但<b>資產管理專區</b>（新興分行試辦）之成數<b>不以 5 成為限</b>，故此成數規定不適用專區，為「非」。","lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第21頁","v":25,"t":"◎依受益權風險等級核給貸款成數<mark>風險等級為低度(RR1)-中高(RR4)最高5成</mark>風險等級為高度(RR5)最高4成◎質借額度及幣別新臺幣：最低新臺幣100萬元外幣：最低等值美金3萬元◎貸款期限最長1年，以非循環額度辦理。"},"t":"neg"},{"id":"114-16","y":114,"n":16,"m":1,"q":"辦理購置「央行管控規定」不動產，下列何者為非？","o":["財政部「青年安心成家購屋優惠貸款」不受自然人第 1 戶、第 2 戶購屋貸款限制","借款人辦理購置住宅貸款，金融機構可以周轉金名義承作","自然人名下無房貸，但有持分房屋者，申辦購屋貸款應受自然人第 1 戶購屋貸款限制，惟該持分房屋係繼承取得者得不受限","本規範「房貸戶數」依擔保品數量認定"],"a":1,"ci":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第27頁","s":"","t":"2.<mark>有成數管控之案件，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額</mark>。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉（央行 2026.3.20 規範）：有成數管控之案件，<b>不得</b>另以修繕、周轉金或其他貸款名目額外增加貸款；高價住宅一律送授審處或區域中心；央行管控案件一律不得辦理樂活貸。","lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第27頁","v":10,"t":"2.<mark>有成數管控之案件，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額</mark>。"},"t":"neg"},{"id":"114-17","y":114,"n":17,"m":10,"q":"營業單位轉列催收款項金額達新臺幣","o":["3,000萬元","3,500萬元","4,000萬元","4,500萬元 以上者應檢附最近一次「M0~M2 監控案件追償報告表」影本，事先申請債權管理處核准"],"a":1,"ci":{"b":"授信篇","c":"第五十八章 逾期放款之帳務處理","s":"第二節 催收款項","t":"一、逾期放款應於清償期屆滿六個月內轉入催收款項，應收保證款項，應於款項墊支日起算6個月內辦理轉入催收款項。二、營業單位轉列催收款項金額達新臺幣<mark>3,500萬元</mark>以上者應檢附最近一次「M0~M2監控案件追償報告表」影本，事先申請債權管理處核准。"},"t":"fill"},{"id":"114-18","y":114,"n":18,"m":10,"q":"經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經（　）個月 仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。","o":["20 日","30 日","3 個月","6"],"a":2,"ci":{"b":"授信篇","c":"第六十一章 訴訟程序","s":"第一節 督促程序","t":"三、<mark>經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經</mark>三<mark>個月仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。</mark>(參照民事訴訟法第五百十五條)"},"t":"fill"},{"id":"114-19","y":114,"n":19,"m":10,"q":"下列何種要保人為債務人之人身保險契約金錢債權，可以做為扣押或強制執行之標的？","o":["健康保險契約之解約金債權","傷害保險契約之解約金債權","年金保險契約，其受益人非要保人者，於年金給付期間之年金給付債權","以上皆非"],"a":3,"ci":{"b":"授信篇","c":"第六十二章 終局執行程序","s":"第二節 執行","t":"十三、對於其他財產權之執行即為實現債權人之<mark>金錢債權，</mark>而對於<mark>債務人之</mark>動產或不動產以外之財產所為之<mark>強制執行</mark>，可分為：(一)債務人對於第三人之<mark>金錢債權</mark>。不必執行時業已存在，將來可發生之債權，亦得為<mark>執行之標的</mark>，其執行方法為："},"x":"保險法 114.6.18 修正：<b>健康保險及傷害保險</b>之解約金債權不得扣押或強制執行，人壽保險解約金未逾一定標準者亦不得執行；年金保險受益人非要保人者，年金給付期間之給付債權屬受益人而非要保人（債務人）之財產 → 選項皆不得作為要保人債務之執行標的，答「以上皆非」。（背景：最高法院 108 台抗大 897 號裁定曾認執行法院得終止壽險契約取解約金，修法後設排除範圍。）","lo":3,"web":[{"t":"臺灣高等法院 114 年度抗更一字第 15 號裁定（保險法 114.6.18 修正）","u":"https://judgment.judicial.gov.tw/FILES/TPHV/114%2c%e6%8a%97%e6%9b%b4%e4%b8%80%2c15%2c20251124%2c1.pdf"},{"t":"中央社：壽險保單解約金過低免遭強制執行","u":"https://www.cna.com.tw/news/aipl/202503130205.aspx"}],"t":"ask"},{"id":"114-20","y":114,"n":20,"m":10,"q":"有關聯行抵銷作業規定，被抵銷行於收到聯行或催收人員擬抵銷存款之業務聯繫單或書函傳真時，應","o":["將存款轉出，暫存於「其他預收款」","將存款轉出，暫存於「其他預付款」","將存款轉出，暫存於「其他應收款」","僅能作圈存處理"],"a":0,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第一節 緊急處理措施","t":"(三)被抵銷行於收到聯行或催收人員擬抵銷 接還款及商業糾紛","t":"(二)賣方接獲<mark>商業糾紛</mark>通知書後15日內應<mark>與買方協調解決，</mark>逾30日賣方仍未解決時(或解決條件不為本行接受)，賣方應依約自行買回該筆帳款，賣方已支付費用不另行退回。"},"t":"fill"},{"id":"114-28","y":114,"n":28,"m":9,"q":"下列何者不符合綠色授信的適用原則四項核心構成要素？","o":["驗證","資金用途","資金管理","執行情形回報"],"a":0,"ci":{"b":"講義：授信商品及應注意事項","c":"第18頁","s":"","t":"綠色授信(P2)︰<mark>四項核心構成要素:(1)資金用途</mark>：須用於綠色專案並載明於授信文件中，且應提供相關環境效益之文件。"},"x":"依講義〈授信商品及應注意事項〉：綠色授信四項核心構成要素為<b>資金用途、評估與適用類別選擇程序、資金管理、報告</b>；「驗證」非四要素之一。","lx":{"b":"講義：授信商品及應注意事項","c":"第18頁","v":35,"t":"<mark>綠色授信</mark>(P2)︰<mark>四項核心構成要素</mark>:(1)資金用途：須用於綠色專案並載明於授信文件中，且應提供相關環境效益之文件。(3)資金管理：應提供<mark>符合綠色授信</mark>原則佐證文件(含交易文件如合約、發票)，同時應追蹤資金運用於綠色專案情形。"},"t":"neg"},{"id":"114-29","y":114,"n":29,"m":9,"q":"申請 KY 公司新增貸授信案件時，倘客戶 TCRI 信評或本行企金信評達 6 等以上，且當次新增貸授信金額達美金（　）萬元(含)以上之自貸案件，營業單位應自行或委託實際營運所在地之國內外聯行辦理實地查訪。","o":["100 萬元","200 萬元","300 萬元","500"],"a":2,"ci":{"b":"授信篇","c":"第四十八章 境外公司及大陸地區法人融資業務","s":"第三節 申請及控管作業","t":"1.本行統籌主辦之聯貸案件。2.當次新(增)<mark>貸授信金額達</mark>等值美金<mark>300萬元(含)以上</mark>且<mark>TCRI信評或本行企金信評達6等(含)以上之自貸案件</mark>。"},"t":"fill"},{"id":"114-30","y":114,"n":30,"m":11,"q":"辦理工商企業出口週轉金外幣貸款，憑出口信用狀辦理每筆貸放金額應在信用狀金額多少範圍內？","o":["百分之六十","百分之七十","百分之八十","百分之八十五"],"a":3,"ci":{"b":"授信篇","c":"第二十一章 外銷貸款","s":"第三節 出口託收貸款","t":"出口託收貸款除下列規定外，悉參照第一節規定辦理。一、貸款額度每筆貸款應在託收(D/A、D/P)匯票金額<mark>百分之八十五</mark>範圍內辦理，惟不得超過輸出保險金額。"},"t":"ask"},{"id":"114-31","y":114,"n":31,"m":11,"q":"辦理國內即遠期信用狀電子化撥貸作業時，下列何者操作模式及受益人類別，可以僅列印放行後之信用狀留底聯(第四聯)加蓋主管腰型章後歸檔？","o":["CDS 線上泛中鋼集團客戶","網銀線上一般客戶","網銀臨櫃一般客戶","網銀臨櫃台塑網平台客戶"],"a":0,"ci":{"b":"授信篇","c":"第三十六章 國內即、遠期信用狀電子化作業","s":"第二節 開發/修改信用狀","t":"2.附上空白之「匯票」、「匯票付款/承兌申請書」及「信用狀正本」(第1聯)，以雙掛號函件寄送受益人。<mark>CDS線上泛中鋼集團</mark>、華新麗華公司"},"lx":{"b":"講義：授信商品及應注意事項","c":"第22頁","v":35,"t":"國內即、<mark>遠期信用狀電子化</mark>作業應徵提之約據：「委任開發國內即、<mark>遠期信用狀</mark>契約書ˇ含電子化作業」（使用「綜合授信契約」者得免徵本契約書）、「第e金網業務申請書及約定書」、「企業網路銀行企業融資服務業務申請書兼登錄單」。以「<mark>CDS線上</mark>作業」或「網銀線上作業(受益人：e化台塑集團)」申請完成之開狀/修狀作業，系統將自動傳送信用狀予受益人、申請人與通知行(皆免再寄送實體文件)，撥貸經辦應<mark>列印放行後之信用狀加蓋主管腰型章後歸檔</mark>。其他以「網銀線上作業」完成開狀/修狀作業，撥貸經辦<mark>列印放行後之信用狀</mark>(僅列印第1、4聯)，主管於信用狀正本(第1聯)簽章訖後，附上空白之「匯票」及「匯票付款/承兌申請書」，以雙掛號函件寄送受益人，開狀單位留底聯(第4聯)則<mark>加蓋主管腰型章後歸檔</mark>。"},"t":"ask"},{"id":"114-32","y":114,"n":32,"m":10,"q":"對於本行履行保證責任墊付款項，營業單位評估發現有無法收回或甚難收回之虞時，應即辦理轉列「非放款轉列催收款項」會計項目，以不超過逾墊款日起算多久內辦理為限？","o":["2 個月","3 個月","4 個月","6 個月"],"a":3,"ci":{"b":"授信篇","c":"第三十二章 商品(服務)禮券保證","s":"","t":"(五)已墊付之禮券應與相關債權契據妥善保管。(六)<mark>對於本行履行保證責任墊付款項，營業單位評估發現有無法收回或甚難收回之虞時，應即辦理轉列「非放款轉列催收款項」會計項目</mark>（以不超<mark>逾墊款日起算</mark>6個月<mark>內辦理為限</mark>），並應於第一次辦理上述<mark>轉列催收款項</mark>時，以「處理逾期放款申請書/報告書」（放154）向債權管理處報請備查，並依本行債權保全必要程序向借保戶追償，後續催討仍應依本行催收相關作業規定辦理。"},"t":"ask"},{"id":"114-33","y":114,"n":33,"m":11,"q":"辦理間接授信時，所徵之本票已記載禁止背書轉讓，則下列何者票據不得接受？","o":["有第三者背書時，抬頭人為背書人","有第三者背書時，無抬頭人","無第三者背書時，抬頭人為第一銀行","無第三者背書時，無抬頭人"],"a":0,"ci":{"b":"授信篇","c":"第二十八章 間接授信通則","s":"第一節 備付(本息)本票/備償期票徵取方式","t":"2.備償期票：「備付(本息)本票/備償期票控管明細表」交主管保管，備償期票送交代收，並按期提示。五、票據背書：所徵之本(期)票依有無<mark>第三者背書</mark>，應注意票據內容之填載是否符合下列規範，原則上，宜徵提無填註抬頭人且未記載禁止背書轉讓之票據：無<mark>第三者背書時有第三者背書時</mark>抬頭人無或為第一銀行無或<mark>為背書人</mark>禁止背書轉讓得接受得接受不得接受舉例說明--境外公司綜合融資業務就母公司使用間接授信額度，由母公司擔任發票人且不得有第三人背書，並徵取授權書就子公司使用額度，由母公司發票且經子公司背書，並徵取授權書依票據法第69條規定「執票人應於『到期日』或其後『2日內』為付款之提示」，另對於未填載到期日且未徵妥授權書之見票即付本票，除有以特約縮短或延長外，執票人必須在發票日起「6個月內」為付款提示。倘執票人未於提示期限內為提示者，即喪失對前手(即背書人)之追索權利，惟仍得對本票「發票人」聲請法院裁定後強制執行。"},"t":"ask"},{"id":"114-34","y":114,"n":34,"m":11,"q":"辦理墊付國內票款，撥貸前應檢核借款人提供之客票，請問下列作業何者錯誤？","o":["相關內容是否符合票據法規範","票據背面註明備償借款專戶帳號及背書(放款印鑑)","應於負責人小章旁註明職稱，以免被視為背書不連續而退票","放款經辦應於票據明細表票面金額欄前首逐筆蓋章"],"a":3,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第二節 貸放","t":"(二)應檢核借款人提供之客票，相關內容是否符合票據法規範，另於票據背面註明「備償借款專戶」帳號及背書(放款印鑑)，並注意應於負責人小章旁註明職稱，以免被視為背書不連續而退票，將票據連同「<mark>票據明細表</mark>」送交代收，代收<mark>經辦應於</mark>「<mark>票據明細表</mark>」<mark>票面金額欄前首逐筆蓋章</mark>。"},"t":"neg"},{"id":"114-35","y":114,"n":35,"m":4,"q":"借款人初次授信申請時，應辦理「顧客帳務資料查詢交易（9703）」及「保證資料查詢（A220）」交易，進行授信聯行查詢，下列敘述何者有誤？","o":["同一借款人如擬於不同營業單位往來，應先經原往來分行同意後，始得以經理權限進行申請","企業授信戶查詢對象為借款人、負責人、保證人","個人授信戶查詢對象為借款人、保證人","如查詢對象在聯行無授信往來(含 66 帳號結清銷戶者)及共同債務者，得逕行辦理授信申請"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"(三)為加強授信歸戶管理，除總行另有規定外，<mark>同一借款人</mark>限在同一家<mark>營業單位</mark>授信往來，<mark>如擬於不同營業單位往來，應先經原往來分行同意後，始</mark>以授信申請書申請區域中心或總行授信審核處核准，惟借款人於聯行授信往來僅有「勞工紓困貸款」或「信用卡處線上行銷部撥貸案件」，<mark>經原往來分行同意</mark>且屬適用<mark>經理權限</mark>者，得逕<mark>以經理權限</mark>核准。"},"t":"neg"},{"id":"114-36","y":114,"n":36,"m":9,"q":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","o":["600 萬/1,200 萬","400 萬/800 萬","300 萬/600 萬","500 萬/1,000 萬"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"6.辦理授信申請，包含新貸、增貸及全額增貸，以及條件變更有增加、減少或更換擔保品，該案件徵提有正、副擔保品時須填寫「運用擔保品洗錢及資恐交易態樣檢核表」，並經防制洗錢及打擊資恐督導主管及經理覆核，作為授信申請之必要附件：(1)個人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>500萬</mark>元(含)以上；(2)法人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>1,000萬</mark>元(含)以上。"},"t":"ask"},{"id":"114-37","y":114,"n":37,"m":4,"q":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？<br><span class=\"it\">A.</span> 借款人<br><span class=\"it\">B.</span> 企業授信戶之負責人<br><span class=\"it\">C.</span> 擔保物提供人<br><span class=\"it\">D.</span> 保證人","o":["AC","AD","ACD","ABCD"],"a":0,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"三、抵押權之塗銷(一)<mark>借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權</mark>有無不利<mark>影響，並辦理抵押權塗銷查詢作業</mark>。<mark>查詢對象</mark>為借款人及<mark>擔保物提供人</mark>，營業單位應執行「顧客帳戶資料查詢交易(9703)(查詢代號：11)」、「保證/共同債務資料查詢(A220)(查詢代號：1~2)」，並依下列方式辦理："},"t":"combo"},{"id":"114-38","y":114,"n":38,"m":9,"q":"營業單位知悉企業授信戶有下列授信預警徵兆時，應立即填製「授信案件危機處理報告」向授信審核單位通報，倘經審核人員批示應列為預警戶者，再於次月辦理預警戶通報，下列敘述何者有誤？","o":["企業負責人涉及虛偽交易或掏空公司資產，遭檢調機關偵辦","媒體負面報導可能影響其營運者","企業所簽發支票發生拒絕往來原因退票","週轉金貸款因資金短絀申請展期二次（含）以上者"],"a":3,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"5、有證據顯示企業戶帳款、出貨遭展延，或致提列備抵損失增加，使營運發生鉅額虧損。1、<mark>週轉金貸款因資金短絀申請展期二次（含）以上者</mark>。"},"t":"neg"},{"id":"114-39","y":114,"n":39,"m":4,"q":"有關不動產抵押權設定，下列敘述何者有誤？","o":["個人消費性貸款抵押權設定之權利種類，應由擔保物提供人自行勾選採「最高限額」或「普通」抵押權設定","受理「普通抵押權」設定申貸者，一律申請總行核准後辦理","屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"4.<mark>受理「普通抵押權」設定申貸者，</mark>營業單位一律以非循環額度<mark>申請總行</mark>或區域中心<mark>核准後辦理</mark>。(五)抵押權之設定程序、擔保物（不動產）登記簿、權利文件之保管，依本行相關規定辦理。"},"t":"neg"},{"id":"114-40","y":114,"n":40,"m":8,"q":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","o":["原徵取之擔保品由本行活期性備償存款變更為等值本行定期存款","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","原徵取之擔保品由本行活期性備償存款變更為等值應收客票"],"a":3,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"(二)對符合信保基金信用保證規定之中小企業授信，應儘量洽請借款人同意移送該基金保證，以加強授信債權之安全。(三)對授信額度為等值新臺幣300萬元以下且信保基金保證成數達8成以上之案件，經個案審慎評估風險後，盡量不宜以存款備償方式加強擔保。"},"x":"活存備償改為<b>定存</b>（擔保力相當）可由經理核定；改為<b>應收客票</b>（擔保力下降）不得逕由經理核定。","lo":1,"t":"neg"},{"id":"114-41","y":114,"n":41,"m":8,"q":"有關本行集團關係戶之管理，下列敘述何者有誤？","o":["集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","[新]行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬","兩家企業之授信額度合計達新臺幣 25 億元者，已符合集團控管認定標準","授信新戶需同步申請集團限額時，集團限額核備日不得晚於授信案件核准日"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）區域中心辦理事項：1.轄管A、B、C組營業單位之企業授信戶在本行總<mark>授信額度</mark>分別逾<mark>新臺幣2</mark>.5億元、1.2億元、6,000萬元且未達6億元者之徵信業務（含負責人及保證人）。"},"x":"114 年版本中「兩家企業授信額度合計達 25 億即符合集團控管認定」為錯誤敘述（認定標準已修正，請以最新規定為準）；其餘：知會主責分行並副知法金處、可用 TEJ 集團名單輔助、核備日不得晚於核准日。","lo":1,"t":"neg"},{"id":"114-42","y":114,"n":42,"m":5,"q":"企業授信戶在金融機構總授信金額未達新臺幣 3,000 萬元，惟提供會計師財務報表查核報告，請問應向客戶徵取何種類資料表？","o":["小規模營利事業簡易資料表","簡易資料表","資料表","公司信用卡專用徵信資料表"],"a":2,"ci":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第17頁","s":"","t":"資料表與徵信報告格式資料表：金融機構總授信金額(含本次申請金額)達3,000萬元(含)以或<mark>雖未達3,000萬元惟提供會計師查核報告</mark>徵信報告格式：企業戶徵信報告(依資料表編製)小規模營利事業簡易資料表：金融機構總授信金額(含本次申請金額)600萬元（含）以下或1500萬元以下且具十足擔保者徵信報告格式：企業戶徵信報告(小額貸款專用)簡易資料表：在金融機構總授信金額(含本次申請金額)逾600萬元未達3,000萬元徵信報告格式：企業戶徵信報告(依簡易資料表)若本行僅往來出口押匯：徵信報告格式：企業戶徵信報告（小額貸款專"},"x":"同 113-60：未達 3,000 萬元但提供會計師查核報告者，徵「<b>資料表</b>」。","lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第19頁","v":38,"t":"<mark>會計師財務報表查核報告</mark>民營營利事業之公司組織<mark>在金融機構總授信金額</mark>達<mark>3,000萬元</mark>辦理本票保證之<mark>企業授信戶</mark>：申請發行商業本票保證私立學校(含中小學及大專院校)：依私立學校法設立者可自行斟酌"},"t":"ask"},{"id":"114-43","y":114,"n":43,"m":5,"q":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？","o":["個人戶僅擔任負責人(非保證人)須查詢","於辦理授信業務特定目的始得查詢","僅辦理公司信用卡，不得查詢","應取得當事人書面同意始得查詢"],"a":0,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第二節 個人戶徵信報告之編製要領","t":"3.查調證券商授信業務負面信用情形(T70)：(1)<mark>僅擔任負責人(非保證人)</mark>：不得查詢。(2)非屬前述(1)之情形時：以向聯徵中心查詢結果記載之，應填列有/無授信負面信用資料註記、證券授信業務原始未清償總餘額、說明(點選代號:N0、N1、Y0、Y1)。"},"t":"neg"},{"id":"114-44","y":114,"n":44,"m":9,"q":"關於徵信業務防制洗錢及打擊資恐作業，下列敘述何者正確？","o":["新貸戶免徵取「客戶業務往來聲明書」","續貸戶一律無須徵取「高階管理人員暨實質受益人聲明書」","查詢企業續貸戶「客戶風險評分交易」(A194)前，應確認風險因子異動紀錄第 19 項是否須辦理修改","境外進銷貨廠商免查證「存在真實性」及「所屬行業具關聯性」"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"2.續貸戶：應檢視前所徵取之「高階管理人員暨實質受益人聲明書」資料正確性，若有異動則須重新徵取。(二)辦理企業戶(含OBU)<mark>「客戶風險評分交易」(</mark>交易代號<mark>A194)</mark>，執行<mark>風險因子</mark>建檔、修改及查詢風險等級，並揭露風險評等結果，說明如下："},"t":"ask"},{"id":"114-45","y":114,"n":45,"m":6,"q":"下列有關財務比率之敘述，何者正確？","o":["速動資產=現金及約當現金+短期性之投資+應收款項淨額+存貨淨額","速動比率係測知企業緊急之償債能力，比率愈高表示緊急償債能力愈強","流動比率又稱酸性測驗比率，係測知企業償債能力之基本比率","營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"2.<mark>速動比率</mark>計算公式：說明：(1)速動資產=現金及約當現金+短期性之投資+應收款項淨額（即：應收帳款＋應收票據－備抵呆帳）。而短期性之投資通常包括列報於流動資產之透過損益按公允價值衡量金融資產、以成本衡量之金融資產、透過其他綜合損益按公允價值衡量之金融資產、按攤銷後成本衡量之金融資產、避險之金融資產等會計項目。(2)此項比率又稱「酸性測驗比率」，用以測知<mark>緊急之償債能力，比率愈高</mark>，<mark>緊急償債能力愈強</mark>。當比率低於50%以下則<mark>表示緊急償債能力</mark>甚低。(3)以此比率評估企業<mark>之償債能力，</mark>與流動比率一般，須作相對性的研討。例如應收款項須進一步檢討其內容，檢視其中是否有過期之帳款，甚至收回困難者，另外收帳之速度是否有傾向緩慢之趨勢。"},"t":"ask"},{"id":"114-46","y":114,"n":46,"m":9,"q":"辦理徵信作業之查詢項目中，何者「不」屬客戶善盡企業社會責任揭露項目？","o":["應向「行政院環境部列管污染源資料查詢系統」查詢企業戶是否為污染源列管中及曾發生違規紀錄","非公開發行公司免揭露近三年碳排量資訊","應向聯徵中心查詢最新之勞工退休準備金相關資訊","應向聯徵中心查詢企業是否有 ESG 獲獎資訊、評鑑資訊"],"a":1,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第三節 企業戶徵信報告(小額貸款專用)暨公司信用卡專用徵信報告","t":"6.ESG相關查詢及揭露事項:為落實責任金融，將客戶是否依環境面(E)、社會面(S)及公司治理面(G)善盡企業社會責任納入風險評估重點。(1)環境面(E)：應向「行政院環境部列管污染源資料查詢系統」（網址:http://prtr.epa.gov.tw/）查詢企業戶是否為污染源列管中及曾發生之違規紀錄；如客戶有提供或徵信人員查詢可得客戶<mark>近三年碳排量資訊</mark>(行政院環境部規範應盤查登錄溫室氣體排放量之排放源對象可至「事業溫室氣體排放量資訊平台」查詢，<mark>公開發行</mark>以上公司得查詢年報、永續報告書或TEJ資料庫)應揭露於徵信報告中；因應歐盟實施「碳邊境調整機制(CBAM)」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度。(2)社會面(S)：應向聯徵中心查詢最新之勞工退休準備金相關資訊記載之；倘為「食品/醫藥業」須至「衛生福利部食品藥物管理署」（網址:https://consumer.fda.gov.tw/）查詢有無違規紀錄。"},"t":"neg"},{"id":"114-47","y":114,"n":47,"m":5,"q":"辦理個人授信戶之徵信作業，下列敘述何者錯誤？","o":["應查詢監護輔助宣告資料","個人授信戶於本行授信總餘額在新臺幣 200 萬元(含)以下得免徵同一關係人資料表","對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人資料表填寫","徵取「其他收入說明書」者應檢視、查證其內容之真實性"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）<mark>對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人</mark>綜合所得稅結算申報書填寫。（三）若<mark>收入總額</mark>與借款金額顯不相當時(特別是不敷利息支出)，應另徵取「其他收入說明書」補充說明其他收入來源。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第12頁","v":31,"t":"編製報告及應注意事項個人戶徵信報告：非借據保證人使用簡化版辦理借戶信用評等<mark>個人資料表</mark>之「年度個人收支情形」欄不得放任空白未填<mark>個人授信戶</mark>填送個人收入情形與<mark>報稅資料</mark>有出入時，以申報書內容為準•<mark>達應徵提報稅資料</mark>者，<mark>其最近一年收入</mark>應依<mark>報稅資料</mark>填寫<mark>收入總額</mark>與借款金額不相當時(特別是不敷利息支出)應另徵取「其他收入說明書」對「其他收入說明書」之內容應檢視查證並於綜合意見欄內評述(如:有租金收入可徵取租賃契約判斷)不宜徵取個人戶徵信報告淨值為負數之保證人•2018/02/06審劃字6號函步驟3<mark>徵信作業</mark>-<mark>個人授信戶</mark>"},"t":"neg"},{"id":"114-48","y":114,"n":48,"m":5,"q":"A 企業擬向本行申請「週轉金」性質之中長期授信新臺幣 1.5 億元，經查其聯徵中心歸戶餘額新臺幣 0.5 億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應徵取之中長期資料有哪些？<br><span class=\"it\">A.</span> 現金流量預估表<br><span class=\"it\">B.</span> 預估綜合損益表<br><span class=\"it\">C.</span> 預估資產負債表<br><span class=\"it\">D.</span> 個案預計資金來源去路表<br><span class=\"it\">E.</span> 營運計畫","o":["ABC","ABCE","ABCDE","無須加徵中長期資料"],"a":1,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他<mark>中長期授信</mark>：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、建廠進度表、<mark>營運計畫</mark>、<mark>現金流量預估表</mark>、<mark>預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信<mark>中心歸戶餘額</mark>及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯之金額</mark>。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"},"t":"combo"},{"id":"114-49","y":114,"n":49,"m":5,"q":"有關企業授信戶徵信作業注意事項，下列敘述何者為非？","o":["資料表加蓋企業戶之公司設立/變更登記表或留存本行存、放款往來之印鑑","倘財報決算日距改編日超過 6 個月，應一律加徵期中報表","以交易代號 9704 查詢是否為銀行法或金控法規範之利害關係人","辦理「同一關係企業及集團企業」電腦建檔"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"核報告，亦即需徵取三年度財務報表。惟 ark>中央銀行管控之案件</mark>。2.政策性貸款。3.搭配樂活貸綜合循環型房貸申請。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第12頁","v":59,"t":"<mark>樂活貸循環型房貸</mark>(2/3)◎還本繳息方式1.單一循環型：(1)還本方式：借款人存入立約帳戶之款項，將自動優先抵償貸款本金。2.<mark>中央銀行管控之案件不得適用本項貸款</mark>。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第12頁：「2.中央銀行管控之案件不得適用本項貸款。」","t":"ask"},{"id":"114-53","y":114,"n":53,"m":4,"q":"依銀行法第 12 條之 1、第 12 條之 2，銀行辦理「自用住宅放款」及「消費性放款」已取得足額擔保(擔保放款)時，除借戶有下列情形之一，為強化自身授信條件主動向銀行提供一般保證人外，不得以任何理由誘使其提供保證人。以下何者正確？","o":["「借戶總放款支出所得比」逾 70%","「借戶無擔保支出所得比」逾 35%","借戶年齡較大致可工作年限短於借款期限","以上皆是"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"1.不得要求借款人提供連帶<mark>保證人。</mark>2.<mark>已取得足額擔保</mark>者<mark>(擔保放款)</mark>：除借款人<mark>有下列情形之一，為強化</mark>其<mark>自身授信條件</mark>，<mark>主動向銀行提供一般保證人外，不得以任何理由誘使</mark>借款人<mark>提供保證人</mark>：(1)有還款能力不足情形：A.借款人薪資收入條件不足，判別標準係指符合<mark>下列情形之一</mark>者：(A)「借戶總放款支出所得比」逾70%者。(B)「借戶無擔保支出所得比」逾35%者。B.借款人年齡較大致使可工作年限短於借款期限。(2)有信用不良紀錄(含信評結果屬高風險案件者)。(3)所提供之擔保品非屬自己所有。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第26頁","v":38,"t":"◆<mark>銀行辦理</mark>「<mark>自用住宅放款</mark>」及「<mark>消費性放款</mark>」，<mark>已取得足額擔保</mark>時，不得要求借款人<mark>提供保證人</mark>；惟借款人<mark>有下列情形之一</mark>時，可另填具申請書<mark>主動向銀行提供保證人</mark>，以強化其<mark>自身授信條件</mark>：(一)借款人有還款能力不足情形：1.借款人薪資收入條件不足，判別標準如下：(1)「借戶總放款支出所得比」逾70%者。◆<mark>自用住宅放款及消費性放款</mark>案件，倘有徵取<mark>一般保證人</mark>者，應徵取「宣告保證人責任範圍暨保證期間同意書」，並向保證人宣讀保證人責任，及請保證人親簽。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第26頁：「銀行辦理「自用住宅放款」及「消費性放款」，已取得足額擔保時，不得要求借款人提供保證人；」「惟借款人有下列情形之一時，可另填具申請書主動向銀行提供保證人，以強化其自身授信條件：(一)借款人有還款能力不足情形：1.借款人薪資收入條件不足，判別標準如下：(1)「借戶總放款支出所得比」逾70%者。」","t":"ask"},{"id":"114-54","y":114,"n":54,"m":1,"q":"有關符合「央行管控規定」之消金案件，下列敘述何者為非？","o":["不得承作「樂活貸循環型房貸」","不得承作「加值型信貸專案，惟排除「自然人第 1 戶購屋貸款(名下已有房屋)」","授信申請時須向借款人徵取「財產查詢清單」及查詢聯徵B28 及 B33","撥貸當日毋須查詢聯徵 B28 及 B33"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"4.授信申請時須向借款人徵取「財產查詢清單」及執行聯徵查詢B28及B33，若聯徵有資金用途為「1」(購置不動產)之房屋擔保貸款，須加查B42以確認該筆房貸之擔保品數量，<mark>且撥貸當日仍須執行聯徵查詢B28及B33</mark>，再次確認借款人房貸戶數。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉：央行管控案件於授信申請時徵「財產查詢清單」並查聯徵 B28、B33，<b>撥貸當日 、監察人或其他有代表權之人而為該法人擔任保證人者，僅就任職期間法人所生之債務負保證責任」，即擔任法人董事、監察人或其他有代表權之人，為該法人擔任保證人者，僅須就任職期間法人之借款債務負保證責任，<mark>卸職後，對借戶新發生之借款保證人不負保證責任</mark>。"},"t":"ask"},{"id":"S4-2","m":4,"q":"有關法定代位清償人同意書，下列敘述何者錯誤？","o":["「免除」係溯及最初解除保證責任","「終止」係溯及最初解除保證責任","「終止」係向後發生解除保證責任","免除保證人中一人責任，應向其他保證人等法定代位清償人徵取同意書"],"a":1,"x":"「免除」＝溯及最初；「終止」＝向後發生。112 年以「向後發生→免除格式」為錯誤選項。","t":"neg","ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"<mark>「免除」係指溯及最初為解除保證責任之意；「終止」係指向後發生解除保證之意</mark>。"}},{"id":"S4-3","m":4,"q":"有關保證人之徵提，下列敘述何者錯誤？","o":["限於依法律或公司章程規定以保證為業務之公司，始得接受其為保證人","如符合民法第 1088 條「為子女之利益」，得徵取未成年人為保證人","除另有規定外，擔保放款以一人保證、無擔保放款以二人保證為原則","合夥行號為人作保時，應徵取全體合夥人之同意書"],"a":1,"x":"不得徵取未成年人為保證人；1088 條只適用於未成年人擔任借款人或擔保物提供人。","ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"(九)<mark>不得徵取未成年人為保證人；對擔保物提供人為未成年時</mark>，應確認符合民法第1088條「為子女之利益」意旨始得受理，於其成年時，並得免徵「擔保物提供承認書」。"},"t":"neg"},{"id":"S4-4","m":4,"q":"動產抵押之設定期限，除另有規定外，一律以（　）為準。","o":["貸放期限加一年","貸放期限加五年","貸放期限加三年","與貸放期限相同"],"a":1,"x":"一律以貸放期限加 5 年為準，且貸放期限應較標的物剩餘耐用年限縮短 1 年以上。","t":"fill","ci":{"b":"授信篇","c":"第十章 動產擔保交易","s":"第一節 動產抵押","t":"(三)為確保本行債權，除另有規定外，<mark>設定期限一律以貸放期限加五年為準</mark>，貸放期限應較標的物剩餘耐用期限或被淘汰期限縮短一年以上。"}},{"id":"S4-5","m":4,"q":"借款人申請塗銷不動產抵押權，抵押權塗銷同意書等權利文件之領回方式，下列何者正確？","o":["由借款人及擔保物提供人共同簽章領回，或確認擔保物提供人身分後由其簽章領回","僅得由借款人單獨領回","一律郵寄地政機關","擔保物提供人不得領回"],"a":0,"x":"共同簽章領回；亦得確認擔保物提供人（所有權人）身分後由其簽章領回。112 年以「不得由擔保物提供人簽章領回」為錯。","ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"(五)1.抵押權塗銷同意書連同抵押權設定契約書、他項權利證明書應登記於放款權利證件授受登記簿(放193)，<mark>並由借款人及擔保物提供人共同簽章領回，亦得於確認擔保物提供人(所有權人)身分後，由其簽章領回</mark>。"},"t":"ask"},{"id":"S4-6","m":4,"q":"依銀行法第 12 條之 2，自用住宅放款已取得足額擔保，借款人於下列哪些情形主動提供一般保證人時銀行始得接受？ A.借戶總放款支出所得比逾 70% B.借戶無擔保支出所得比逾 35% C.借款人為公務員 D.因年齡致可工作年限短於借款期限","o":["BCD","ABCD","AB","ABD"],"a":3,"x":"另含信用不良、擔保品非借款人所有等情形。","t":"combo","ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"撥貸當日倘借款人聯徵B33/B36有新增借款額度，應重新計算支出所得比，並填製「消費者貸款支出所得比自行計算暨授信評估表」，評估授信風險變化，針對「借戶總放款支出所得比」逾70%或<mark>「借戶無擔保支出所得比」逾35%者</mark>，應於評估表敍明承做理由，逐級呈核至撥貸單位主管核定，倘評估結果擬調整授信條件時，應於消金e 者，應移交債權管理處或區域中心催收。","o":["1 億元","5,000 萬元","2 億元","3,500 萬元"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"公司信用卡申請人於本行授信同時發生逾期時，全案授信餘額及使用公司信用卡應付款項合計本行授信同時發生逾期時，全案授信餘額及使用公司信用卡應付款項<mark>合計達1億元（含）以上者</mark>，應依本行「催收作業要點」由營業單位移交債權管理處或區域中心催收人員辦理催收作業。"}},{"id":"S10-24","m":10,"q":"擬移由債權管理處或區域中心催收人員辦理之案件，營業單位原則上應於新發生逾期放款多久內辦理移交？","o":["一個月","六個月","三個月","十二個月"],"a":2,"x":"移交前應辦妥保全程序並轉列催收款項。","src":6,"t":"ask","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"四、分工時點：（一）對於有無法清償轉為逾放之虞，擬移由債權管理處債權管理部或區域中心催收人員辦理之案件，<mark>營業單位原則上應於新發生逾期放款3個月內辦理移交作業</mark>，移交前營業單位應辦妥保全程序，並將全案轉列適當之催收款項會計項目，及備妥相關文件資料移交。"}},{"id":"S10-25","m":10,"q":"有關逾期案件之函催，下列敘述何者錯誤？","o":["本金（利息）逾期 30 日以上始需寄發催繳函","電子郵件或手機簡訊等逾期通知亦得一併留存","應留存催繳函影本及掛號郵件收件回執聯","本金（利息）逾期 15 日以上仍未清償者，應立即以雙掛號寄發催繳函"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（2）函催：對於授信戶有逃匿無蹤等無法清償情事或<mark>本金（利息）逾期15日以上仍未將逾期本息清償者</mark>，營業單位應立即以雙掛號郵寄方式，對借保戶（含已提示退票之票據債務人）寄發書面催繳函，並留存催繳函影本及掛號郵件收件回執聯，另對借保戶等債務人所為電子信郵或手機簡訊等相關債務逾期通知，亦得一併留存。"}},{"id":"S10-26","m":10,"q":"辦理保全程序之存出保證金金額超過（　）萬元者，應事先申請債權管理處核准。","o":["30","300","50","100"],"a":2,"x":null,"src":6,"t":"fill","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"<mark>證金金額超過50萬元者，應事先申請債權管理處核准</mark>，並依規妥善保管相關書類正本，以利日後向法院聲請取回擔保金。"}},{"id":"S10-27","m":10,"q":"營業單位辦理保全、訴追及執行程序所需之訴訟費用，應以何會計項目墊支？","o":["業務費用","催收款項","其他應收款－放款訴訟費用","預付費用"],"a":2,"x":"墊支超過 50 萬元者須事先申請債權管理處核准。","src":6,"t":"ask","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（二）費用開支1、營業單位：就辦理保全、訴追及執行程序所需之訴訟費用或相關催收開支，<mark>應以「其他應收款－放款訴訟費用」墊支</mark>，惟所需墊支費用超過50萬元者，須事先申請債權管理處核准，並依規妥善保管收據及相關書類正本，以利日後向債務人追償。"}},{"id":"S10-28","m":10,"q":"有關大額逾放戶之處理，下列敘述何者錯誤？","o":["債權管理處及區域中心至少每年共同檢討一次即可","營業單位催收人員應於接管日起七個營業日內研擬處理方案","嗣後按月將處理進度書面呈報債權管理處","債權管理處及區域中心對自辦催收 3,500 萬元以上案件至少每季共同檢討催收進度"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（三）大額逾放戶之處理：（1）債權管理處債權管理部及區域中心催收人員對於轄管分行自辦催收全案授信餘額達3,500萬元（含）以上之大額逾放案件，<mark>至少每季應與負責催收之營業單位共同檢討催收進度</mark>，並提供必要之協助。"}},{"id":"S10-29","m":10,"q":"營業單位催收人員對全案授信餘額達 3,500 萬元以上之逾放案件，應於接管日起算（　）個營業日內與催收主管研擬處理方案。","o":["七","十","三","五"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（2）營業單位催收人員對於全案授信餘額達3,500萬元（含）以上之逾放案件，<mark>於接管日起算七個營業日內</mark>，應即與催收主管共同研擬處理步驟及方案，嗣後並按月將處理進度以書面呈報債權管理處。"}},{"id":"S10-30","m":10,"q":"有關海外分行逾期放款之權限，下列敘述何者正確？ A.未達 3,500 萬元案件，經理得逕行核定轉列催收、保全、起訴等程序 B.全案餘額 1,000 萬元以下經理得逕行運用權限催收（特定事項除外） C.以逾期日本行即期賣出匯率折算新臺幣 D.3,500 萬元以上案件經理亦得逕行核定","o":["AB","ACD","ABC","ABCD"],"a":2,"x":null,"src":6,"t":"combo","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"三、<mark>海外分行經理對於逾期放款戶全案授信餘額折算未達等值新臺幣3,500萬元之案件</mark>，就有關個案之轉列催收款項、保全、督促程序、起訴及強制執行等程序得逕行核定辦理，惟所需墊支費用或存出保證金金額超過等值新臺幣萬元者，應事先申請債權管理處核准。"}},{"id":"S10-31","m":10,"q":"轉銷呆帳時，除依全案金額記載呆帳登記簿外，另應以新台幣多少元填製「追索債權」傳票列帳？","o":["1 元","全案轉銷金額","10 元","100 元"],"a":0,"x":null,"src":6,"t":"ask","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"(一)營業單位：（借）聯行往來（貸）催收款項－本金（貸）催收款項－利息（貸）其他應收款-放款訴訟費用(二)總行：（借）備抵呆帳（貸）聯行往來另每案無論轉銷呆帳金額多寡，<mark>均應以新台幣一元填製</mark>（借）追索債權（貸）待抵銷追索債權傳票列帳，惟登載「呆帳登記簿」時，則應詳列轉銷呆帳全案金額。"}},{"id":"S10-32","m":10,"q":"有關消費者債務前置調解之通報作業，下列敘述何者錯誤？","o":["第一次調解期日三個工作日前回報債權予最大債權金融機構","接獲通知翌日起四個工作日內聯繫通知其他債權金融機構回報債權","未取得聲明同意書亦得先行報送聯徵中心","應於取得債務人填具聲明同意書後始得報送聯徵中心"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"2、調解聲請通報作業(1)主辦單位應於接獲調解機構書面通知債務人聲請調解後，先請債務人於三個工作日內提供「前置調解個人資料運用聲明暨同意書」（必要文件，下稱聲明同意書），<mark>並應於取得債務人填具聲明同意書後，始得將債務人聲請調解相關資料報送聯徵中心</mark>，暨將債務人前置調解相關訊息登錄於本行「行員專用系統」之「前置調解作業平台」。"}},{"id":"S10-33","m":10,"q":"主辦單位對法院就債權表異議所為裁定不服者，應於裁定送達幾日內提起抗告？","o":["20 日","10 日","30 日","5 日"],"a":1,"x":null,"src":6,"t":"ask","ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（三）主辦單位對於法院就債權表異議所為裁定不服者，<mark>應於裁定送達10日內提起抗告</mark>，並於言詞辯論期日到場，以避免發生抗告法院逕為裁定之情事。"}},{"id":"S10-34","m":10,"q":"有關消費者債務清理之撤銷更生、免責及監督人選任，下列敘述何者錯誤？","o":["得自免責裁定確定翌日起 1 年內聲請撤銷免責","得於法院認可更生方案後三年內聲請撤銷更生","無意願擔任監督人者應於收到通知後 10 日內聲請另行選任","得於法院認可更生方案後一 業應注意事項（地方資產管理專區專用—個人消費性貸款適用）","t":"加權平均貸放成數X&lt;60%：補倉比率&lt;140%、平倉比率&lt;120%；60%≤X&lt;80%：補倉比率&lt;120%、平倉比率&lt;110%；<mark>80%≤X：補倉比率&lt;110%、平倉比率&lt;105%</mark>。"}},{"id":"S12-14","m":12,"q":"【2026/03/20 消商字第000016號】有關地方資產管理專區對保作業 SOP，下列敘述何者錯誤？","o":["未確認客戶為專區客戶前即可填寫轉介/對保申請書","新申辦專區客戶應於新興分行開立存款帳戶","原則於轉介分行開戶後再轉籍移入新興分行","倫巴底貸款客戶須具備 2 項以上合格擔保品資產"],"a":0,"x":"應先確認為專區客戶或擬簽立申請書，始得填寫。","src":4,"t":"neg","ci":{"b":"公文：2026/03/20 消商字第000016號","c":"消費金融業務處","s":"新增「地方資產管理專區辦理授信試辦業務對保作業流程」（對保作業SOP）","t":"應先確認客戶已為本行地方資產管理專區客戶，或擬簽立『地方資產管理專區商品及服務申請書』，<mark>始得填寫【轉介/對保申請書】通知新興分行受理</mark>。"}},{"id":"S12-15","m":12,"q":"【2026/03/26 消商字第000017號】依「專區辦理保費融資業務問答集」，下列敘述何者錯誤？","o":["保費融資期間最長 10 年","維持率低於 95% 須一次全額清償","得於簽立保險契約當日同步約訪新興分行","首次提供 2 年寬限期"],"a":1,"x":"僅須償還部分借款金額，無須一次全額清償。","src":4,"t":"neg","ci":{"b":"公文：2026/03/26 消商字第000017號","c":"消費金融業務處","s":"新增「地方資產管理專區辦理保費融資業務問答集」","t":"如因匯率波動致擔保維持率低於95%，客戶僅須償還部分借款金額以提高擔保維持率，<mark>無須一次全額清償</mark>。"}},{"id":"S12-16","m":12,"q":"【2026/03/26 消商字第000017號】高資產客戶保費融資自備款不足，下列敘述何者錯誤？","o":["得辦理樂活貸、倫巴底貸款或保單融資補足","借款金額僅限補足自備款缺口","該筆貸款得再作為其他融資用途","該筆貸款不得再行質借"],"a":2,"x":"屬專款專用，不得再行質借或作為其他融資用途。","src":4,"t":"neg","ci":{"b":"公文：2026/03/26 消商字第000017號","c":"消費金融業務處","s":"新增「地方資產管理專區辦理保費融資業務問答集」","t":"前述貸款均屬「專款專用」，其借款金額僅限於補足自備款不足之缺口，且<mark>該筆貸款不得再行質借或作為其他融資用途</mark>。"}},{"id":"S12-17","m":12,"q":"【2026/04/07 消商字第000020號】依 115.3.20 生效之央行不動產抵押貸款修正規定，下列何者錯誤？","o":["自然人第 3 戶以上購屋貸款 3 成，無寬限期","自然人第 2 戶購屋貸款 5 成，無寬限期","自然人高價住宅貸款 3 成，無寬限期","自然人第 2 戶購屋貸款 6 成，無寬限期"],"a":1,"x":"第 2 戶由 5 成修正為 6 成。","src":4,"t":"neg","ci":{"b":"公文：2026/04/07 消商字第000020號","c":"消費金融業務處","s":"轉知「中央銀行對金融機構辦理不動產抵押貸款業務規定修正規定」，溯自115年3月20日起生效","t":"<mark>自然人第2戶購屋貸款修正前5成，修正後6成</mark>，無寬限期。"}},{"id":"S12-18","m":12,"q":"【2026/04/23 消商字第000024號】有關專區案件電話錄音作業，下列敘述何者錯誤？","o":["「案件核准後對保」亦得以電話錄音方式辦理","由轉介分行人員親訪客戶","新興分行授信人員透過錄音系統致電說明","適用於「案件申請」階段"],"a":0,"x":"核准後對保仍維持由新興分行人員親訪對保。","src":4,"t":"neg","ci":{"b":"公文：2026/04/23 消商字第000024號","c":"消費金融業務處","s":"專區授信試辦業務於「案件申請」階段，得以電話錄音方式進行商品說明與風險揭露","t":"「案件核准後對保」階段，<mark>仍維持由新興分行人員辦理親訪對保</mark>。"}},{"id":"S12-19","m":12,"q":"【2026/04/29 一總消商字第001818號】有關 2026 年 4 月修訂之保費融資作業要點，下列敘述何者錯誤？","o":["貸款金額得逾保單首日解約金額","貸款成數最高皆為 7.5 成","刪除幣別不同再減降 0.5 成之規範","新增「按月繳息、到期一次還本」之還款方式"],"a":0,"x":"貸款金額不得逾保單首日解約金額。","src":4,"t":"neg","ci":{"b":"公文：2026/04/29 一總消商字第001818號","c":"總行","s":"修訂高資產客戶「保費及保單融資」業務作業要點","t":"刪除保費融資業務之保單幣別與借款幣別不同時，再減降0.5成之規範，亦即依保單首期躉繳保費金額為基礎，貸款成數最高皆為7.5成，<mark>惟貸款金額不得逾保單首日解約金額</mark>。"}},{"id":"S12-20","m":12,"q":"【2026/02/24 債劃字第000025號】下列何者<b>非</b>應查調逾放債務人財產之時點？","o":["授信案件逾期 1 個月內仍未能回復正常往來、辦妥展期時","取得法院核發之假扣押裁定後","授信案件申請展期當日","取得本案執行名義時"],"a":2,"x":"另含辦理債權憑證中斷時效時。","src":4,"t":"neg","ci":{"b":"公文：2026/02/24 債劃字第000025號","c":"債權管理處","s":"函布「第一商業銀行辦理逾期放款案件查找財產暨執行作業應注意事項」","t":"查調時點：<mark>授信案件逾期1個月內仍未能回復正常往來、辦妥展期時</mark>；新發生逾放案件，取得法院核發之假扣押裁定後；取得本案執行名義時或辦理債權憑證中斷時效時。"}},{"id":"S12-21","m":12,"q":"【2026/03/27 債劃字第000043號】有關逾放戶存款圈存及抵銷，下列敘述何者錯誤？","o":["約定書版本應為放002（2026.2 第 18 版）","圈存後辦理抵銷仍應發抵銷函","抵銷存款得留置於「其他預收款-預收放款延滯案款項」分戶","未徵妥新版者不得對將來存款預先圈存"],"a":2,"x":"抵銷存款應即沖抵該案借款，勿留置該分戶。","src":4,"t":"neg","ci":{"b":"公文：2026/03/27 債劃字第000043號","c":"債權管理處","s":"逾放(含呆帳)債務人存款辦理圈存，所徵取之約定書版本應為新版約定書(第18版)","t":"抵銷存款應即沖抵該案借款，<mark>勿留置「其他預收款-預收放款延滯案款項」分戶內</mark>。"}},{"id":"S12-22","m":12,"q":"【2026/06/26 債劃字第000073號】有關債權憑證之管理，下列敘述何者錯誤？","o":["「處理情形」欄位由催收經辦填寫後即可結案，免呈核","營業單位催收主管負責債權憑證正本之保管","催收主管應每半年檢視債權憑證時效","應逐筆登載於實體及逾催系統之債權憑證登記簿"],"a":0,"x":"催收主管應確實覆核並呈核至營業單位經理。","src":4,"t":"neg","ci":{"b":"公文：2026/06/26 債劃字第000073號","c":"債權管理處","s":"催收主管定期檢視債權憑證時效時，應同時列印逾催系統「債證到期提醒」表","t":"報表新增「處理情形」欄位；催收主管應確實覆核「處理情形」欄位填載內容，<mark>並呈核至營業單位經理</mark>。"}},{"id":"S12-23","m":12,"q":"【2025/10/08 法劃字第000077號】有關修訂之外幣貸款規範，下列敘述何者錯誤？","o":["憑 O/A 辦理之出口後外幣貸款每筆在發票金額 80% 內","查無交易對手資訊得以財報或年報揭露之進銷貨廠商資訊查證","進口週轉金外幣貸款到期日起算日宜以運送單據裝運日期為準","憑國外訂單辦理者隸屬「甲類」授信額度"],"a":3,"x":"隸屬「丙類無擔保授信」額度。","src":4,"t":"neg","ci":{"b":"公文：2025/10/08 法劃字第000077號","c":"法人金融業務處","s":"修訂「業務處理細則-授信篇」外幣貸款業務相關規範（第40章、第45章）","t":"以綜合授信額度申請本項貸款時，憑國外訂單、輸出契約或記帳(O/A)方式辦理者，<mark>隸屬「丙類無擔保授信」額度</mark>。"}},{"id":"S12-24","m":12,"q":"【2025/11/20 一總法中字第009293號】有關「第一銀行連鎖企業加盟業者貸款」，下列敘述何者錯誤？","o":["加盟企業總部實收資本額須達 1 億元以上","加盟企業總部須設立登記滿 3 年以上","額度合計每戶最高 250 萬元","得循環動用及借新還舊"],"a":3,"x":"可分次動撥，惟不得循環動用及借新還舊。","src":4,"t":"neg","ci":{"b":"公文：2025/11/20 一總法中字第009293號","c":"總行","s":"自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」","t":"<mark>本貸款可分次動撥，惟不得循環動用及借新還舊</mark>。"}},{"id":"S12-25","m":12,"q":"【2025/11/20 一總法中字第009293號】有關連鎖企業加盟業者貸款之保證，下列敘述何者錯誤？","o":["非十足擔保者一律移送信保基金間接保證","不得移送批次保證","得移送批次保證","提供十足擔保者得免移送信保"],"a":2,"x":"不得移送批次保證。","src":4,"t":"neg","ci":{"b":"公文：2025/11/20 一總法中字第009293號","c":"總行","s":"自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」","t":"除提供十足擔保者外，一律移送財團法人中小企業信用保證基金間接保證，<mark>不得移送批次保證</mark>。"}},{"id":"S12-26","m":12,"q":"【2025/11/11 一總法劃字第009161號】有關「綠色永續金融優惠授信專案」，下列敘述何者錯誤？","o":["專案期間自 2026/1/1 至 2028/12/31","綠色授信適用對象不限產業別","工業用土地抵押貸款亦得適用本專案","永續績效連結授信利率減降最高 0.05%"],"a":2,"x":"工業用土地抵押貸款及央行管控案件排除適用。","src":4,"t":"neg","ci":{"b":"公文：2025/11/11 一總法劃字第009161號","c":"總行","s":"賡續辦理「綠色永續金融優惠授信專案」","t":"倘為「工業用土地抵押貸款」或符合「中央銀行對金融機構辦理不動產抵押貸款業務規定」控管之案件，悉依相關規範辦理，<mark>排除適用本專案貸款</mark>。"}},{"id":"S12-27","m":12,"q":"【2025/11/11 一總法劃字第009161號】下列何者<b>非</b>綠色授信原則之核心構成要素？","o":["驗證","資金管理","資金用途","執行情形回報"],"a":0,"x":"「驗證」屬永續績效連結授信之核心因素。","src":4,"t":"neg","ci":{"b":"公文：2025/11/11 一總法劃字第009161號","c":"總行","s":"賡續辦理「綠色永續金融優惠授信專案」","t":"綠色授信專供合格綠色專案使用之授信(含直接及間接授信)，企業戶提供佐證文件應同時符合綠色授信原則四項核心構成要素：<mark>資金用途、綠色專案評估與適用類別選擇的程序、資金管理、執行情形回報</mark>。"}},{"id":"S12-28","m":12,"q":"【2025/12/16 一總法劃字第009666號】有關「再生能源永續貸款」，下列敘述何者錯誤？","o":["租地建置者租約應辦理法院公證","購電方可為企業電力承購商","太陽光電設施屬銀行法第 72 條之 2 控管範圍","發電設備應於貸放期間至少每年勘查一次"],"a":2,"x":"太陽光電設施非屬 72 條之 2 控管範圍。","src":4,"t":"neg","ci":{"b":"公文：2025/12/16 一總法劃字第009666號","c":"總行","s":"修訂「再生能源永續貸款」業務要點及應行注意事項，開放購電方新增企業電力承購商","t":"<mark>太陽光電設施非屬銀行法第72條之2控管範圍</mark>。"}},{"id":"S12-29","m":12,"q":"【2026/06/03 一風信字第002420號、一法中字第002420號】有關建築貸款金控檢查缺失之改善，下列敘述何者錯誤？","o":["都更核定後貸款種類應由 FE 改為 F9","集合住宅興建週轉金應納入銀行法 72 條之 2 控管","個人非消費性授信資金供建案使用者，額度用途得勾選一般週轉金","危老核定後貸款種類應由 FE 改為 FH"],"a":2,"x":"屬 ADC 範疇，應勾選「7」或「8 其他(ADC)」。","src":4,"t":"neg","ci":{"b":"公文：2026/06/03 一風信字第002420號、一法中字第002420號","c":"風險管理處、法人金融業務處","s":"營業單位辦理建築貸款案件列金控檢查缺失，重申應注意事項","t":"個人非消費性授信案件，資金係供所投資經營事業用於興建單一建案或多筆建案使用，資金用途為「33.其他營建資金」，<mark>屬ADC法計提之範疇</mark>，授信申請時額度用途應勾選「7.支應所屬或投資事業多個建案週轉金」或「8.其他(ADC)」選項以計提正確之風險權數。"}},{"id":"S12-30","m":12,"q":"【2026/06/29 法中字第000048號】有關 2026/7/1 生效之青年創業貸款要點修正，下列敘述何者錯誤？","o":["歸戶 150 萬元以下僅得徵代表人或負責人為保證人","申請 150 萬元以下得以申請表取代計畫書","移送信保得選擇其他方案","歸戶 150 萬元以下部分信保成數 9.5 成"],"a":2,"x":"僅得移送「青年創業貸款」方案。","src":4,"t":"neg","ci":{"b":"公文：2026/06/29 法中字第000048號","c":"法人金融業務處","s":"經濟部中小及新創企業署修正「青年創業貸款要點」，自2026年7月1日生效","t":"申辦本貸款移送中小企業信用保證基金者，<mark>僅得移送「青年創業貸款」方案</mark>，不得移送其他方案，始得符合要點之保證成數。"}},{"id":"S12-31","m":12,"q":"【2026/03/02 審劃字第000009號】有關保證人之徵提原則，下列敘述何者錯誤？","o":["例如企業負責人、負責人配偶、董監事","保證人愈多愈能確保債權，應儘量多徵","以與授信戶具共同經濟利害關係者為原則","避免浮濫或徵取無實益保證人"],"a":1,"x":"應避免浮濫徵取。","src":4,"t":"neg","ci":{"b":"公文：2026/03/02 審劃字第000009號","c":"授信審核處","s":"具高度關聯之企業授信戶應確實揭露於「信用綜合評估表」","t":"徵提保證人應與授信戶具有共同經濟利害關係者為原則，例如：企業之負責人、負責人配偶、董監事、主要股東或主要經營階層，以加強其對企業之經營責任，<mark>避免浮濫或徵取無實益保證人</mark>。"}},{"id":"S12-32","m":12,"q":"【2026/03/18 審劃字第000011號】有關授信對保作業，下列敘述何者錯誤？","o":["保證人另徵取保證書","身分證遺失補領情形之查詢結果無須存卷","應向借款人及保證人分別徵取印鑑卡、約定書","身分證影本加註「限辦理第一銀行徵授信使用」"],"a":1,"x":"查詢結果應列印存卷備查。","src":4,"t":"neg","ci":{"b":"公文：2026/03/18 審劃字第000011號","c":"授信審核處","s":"整編「授信對保應注意事項」","t":"辦理授信對保除另有規定外，應向借款人及保證人分別徵取印鑑卡、約定書並向保證人徵取保證書，渠等應於約據親簽及蓋章，確實查核雙重身分證明並留存加註「限辦理第一銀行徵授信使用」字樣之主要身分證明文件影本，於聯徵中心之「Z21國民身分證領補換資料查詢驗證」查詢身分證遺失補領情形，<mark>查詢結果應列印存卷備查</mark>。"}},{"id":"S12-33","m":12,"q":"【2026/06/17 審劃字第000026號】有關不動產擔保物權塗銷文件之領回，下列敘述何者錯誤？","o":["債權人放棄抵押權辦理塗銷登記須得債務人同意","受託人於登記簿簽名並註記「代領」","委託第三人領取應出具委託書","無法出具委託書時本行得逕向地政機關辦理抵押權拋棄塗銷登記"],"a":0,"x":"依內政部函釋無須得債務人同意。","src":4,"t":"neg","ci":{"b":"公文：2026/06/17 審劃字第000026號","c":"授信審核處","s":"修訂辦理不動產擔保物權塗銷相關權利文件領回之規範","t":"倘無法出具委託書時，依內政部60年3月27日台內地字第407571號函釋，債權人放棄抵押權辦理抵押權塗銷登記時，<mark>無須得債務人之同意</mark>，本行得逕向不動產抵押權登記之地政機關辦理抵押權拋棄之塗銷登記。"}},{"id":"S12-34
