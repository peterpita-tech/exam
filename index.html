<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徵授信考點筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --panel:#fbfaf7; --card:#ffffff; --line:#e3ddd3; --line2:#efeae2;
  --ink:#1d1b19; --ink2:#3d3833; --muted:#7a726a;
  --accent:#a4502a; --accent-soft:#f3dfd0; --accent-ink:#8a3f1d;
  --navy:#2c4a72; --green:#2f6a44; --ok:#2f6a44; --ok-bg:#e6f1e9; --bad:#b3261e; --bad-bg:#fbe7e4;
  --mark:#fbe3a6; --warn:#8a6a12; --warn-bg:#fbf3dc;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
  --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
  --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
  --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
  --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
    --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
    --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
    --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
    --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding:18px 40px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.5px}
.stat{color:var(--muted);font-size:13px;margin-top:2px}
.xlink{font-size:13px;margin-top:4px}.xlink a{color:var(--accent-ink);margin-right:12px}.xlink b{color:var(--ink);margin-right:12px}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:6px;align-items:center}
nav.tabs button{background:none;border:1px solid transparent;border-bottom:2px solid transparent;font:inherit;font-size:15px;padding:8px 14px;color:var(--ink2);cursor:pointer;border-radius:8px 8px 0 0}
nav.tabs button.on{border-color:var(--line);border-bottom:2px solid var(--accent);background:var(--panel);color:var(--ink);font-weight:700}
.theme{border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 10px!important}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}
aside .search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
aside .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
select{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.mlist{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:calc(100vh - 250px);overflow:auto;position:sticky;top:12px}
.mi{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--line2)}
.mi.on{background:var(--accent-soft)}
.mi .code{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.mi .nm{font-weight:700;font-size:15px}
.mi .ct{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px}
.mi .sb{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.5}
.mi .bar{grid-column:2/4;height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:4px}
.mi .bar i{display:block;height:100%;background:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px 34px;min-width:0}
.mtitle{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mtitle .code{font-family:var(--mono);font-size:36px;color:var(--accent);font-weight:600}
.mtitle h2{font-family:var(--serif);font-size:34px;margin:0}
.msub{color:var(--muted);margin:4px 0 18px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card)}
.kpi div{padding:12px 14px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:600}
.kpinote{font-size:12px;color:var(--muted);margin:8px 0 0}
section{max-width:880px}
section h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:34px 0 14px;padding-top:26px;border-top:1px solid var(--line)}
section h3 small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.badge{display:inline-block;color:#fff;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:3px;margin:14px 0 8px}
.b0{background:var(--navy)}.b1{background:var(--green)}
ul.nt{margin:0 0 6px;padding-left:20px}
ul.nt li{margin:5px 0}
ul.nt b{color:var(--accent-ink)}
.rvbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rvbar input{flex:1;min-width:200px;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:14px}
.rvtoc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.rvtoc a{font-size:12.5px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--panel)}.rvtoc a:hover{border-color:var(--accent)}
h3.rvs{font-family:var(--serif);font-size:20px;font-weight:500;margin:26px 0 10px;padding:8px 12px;background:var(--accent);color:#fff;border-radius:6px;scroll-margin-top:60px}
details.rvc{border:1px solid var(--line);border-radius:6px;margin:0 0 8px;background:var(--panel);scroll-margin-top:60px}
details.rvc>summary{cursor:pointer;padding:9px 12px;font-weight:700;list-style-position:inside}
details.rvc>summary:hover{color:var(--accent-ink)}
.rvb{padding:0 16px 10px}.rvb h4{font-size:14.5px;margin:12px 0 4px;color:var(--accent-ink)}.rvb ul{margin:0;padding-left:20px}.rvb li{margin:4px 0}.rvb b{color:var(--accent-ink)}.rvb p{margin:6px 0}
.fq{float:right;font-size:12px;font-weight:600;padding:1px 9px;border-radius:10px;color:#fff;margin-left:8px}.fqA{background:#c0392b}.fqB{background:#e67e22}.fqC{background:#2980b9}
.rvhit{background:var(--accent-soft);border-radius:2px}
u{text-decoration:none;border-bottom:1.5px solid var(--accent);}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.num{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px}
.num b{display:block;font-family:var(--mono);font-size:17px;color:var(--accent-ink)}
.num span{font-size:12.5px;color:var(--ink2)}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.yrs span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);background:var(--card)}
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.qc{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:16px 18px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.sim{background:var(--green);color:#fff}
.tag.hist{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--sans)}
details.qsec{max-width:880px}details.qsec>summary{list-style:none;cursor:pointer}details.qsec>summary::-webkit-details-marker{display:none}
details.qsec>summary h3::before{content:'▸';display:inline-block;width:1.1em;color:var(--accent);transition:transform .15s}
details.qsec[open]>summary h3::before{transform:rotate(90deg)}details.qsec>summary .cnt{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.rwbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag.md{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--sans)}
.qt{font-size:15.5px;margin:4px 0 10px}
.qt .it{font-family:var(--mono);color:var(--accent);font-weight:600}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer;line-height:1.6}
.op:hover{border-color:var(--accent)}
.op .l{font-family:var(--mono);font-weight:600;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--card)}
.op.ok{background:var(--ok-bg);border-color:var(--ok)}
.op.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:var(--bad-bg);border-color:var(--bad)}
.op.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.done .op{cursor:default}
.ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{margin:6px 0}
.cite{margin-top:10px;border-left:3px solid var(--navy);background:var(--panel);padding:8px 12px;border-radius:0 6px 6px 0}
.cite .lb{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;margin-right:8px}
.cite .path{font-size:12.5px;color:var(--muted)}
.cite.lec{border-left-color:var(--green)}.cite.lec .lb{background:var(--green)}.tag.lecq{background:var(--navy)}.cite.rul{border-left-color:var(--accent)}.cite.rul .lb{background:var(--accent)}.tag.rulq{background:var(--accent)}.warn.web a{color:var(--accent-ink);text-decoration:underline}.tag.lxq{background:var(--green);color:#fff}.tag.qt{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-ink)}.cite.lx{margin-top:10px}details.lxp{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--card)}details.lxp summary{cursor:pointer;line-height:1.9}
.cite .tx{font-size:14px;color:var(--ink2);margin-top:6px;word-break:break-all}
mark{background:var(--mark);color:inherit;padding:0 1px}mark.kp{font-weight:600;border-bottom:2px solid var(--accent)}.kpt{display:inline-block;font-size:11px;line-height:1.5;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 8px;margin-top:8px;display:inline-block}
.redo{float:right;font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:20px 0}
table.nt{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.nt th,table.nt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.nt th{background:var(--line2);font-weight:700}
table.nt td.k{font-family:var(--mono);color:var(--accent-ink);white-space:nowrap}
.qzbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.score{font-family:var(--mono);font-size:22px;color:var(--accent-ink)}.score.big{font-size:40px}.qzres{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:8px;padding:14px 18px;margin:16px 0}.qpart{font-family:var(--serif);margin:26px 0 4px;color:var(--accent-ink)}
.mchk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:13.5px}
.mchk label{cursor:pointer}
.legend{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
  .wrap{padding:14px 16px 40px}
  .grid{grid-template-columns:1fr}
  .mlist{position:static;max-height:260px}
  main{padding:22px 16px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .kpi div{border-bottom:1px solid var(--line)}
  .mtitle .code{font-size:26px}.mtitle h2{font-size:24px}
  h1{font-size:23px}
  nav.tabs{overflow-x:auto;max-width:100%}
  nav.tabs button{padding:7px 9px;font-size:14px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>徵授信業務 考點學習筆記</h1>
    <div class="xlink"><b>徵授信</b><a href="外匯業務-考點學習筆記.html">外匯</a><a href="存匯會計業務-考點學習筆記.html">存匯會計</a><a href="信託理財業務-考點學習筆記.html">信託理財</a></div>
    <div class="stat" id="stat"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="mod" class="on">考點</button>
    <button data-v="quiz">模擬考 60 題</button>
    <button data-v="nums">必背數字</button>
    <button data-v="rv" id="tabrv">細則複習點</button>
    <button data-v="lx" id="tablx">講義對照</button>
    <button data-v="wrong">錯題本</button>
    <button class="theme" id="theme" title="切換深淺色">◐</button>
  </nav>
</header>
<div class="grid">
  <aside>
    <input class="search" id="q" placeholder="搜尋題目或細則（如 假扣押、8個月、DBR）">
    <div class="row2">
      <select id="fy"><option value="">全部年度</option><option>110</option><option>111</option><option>112</option><option>113</option><option>114</option></select>
      <select id="fs"><option value="">全部題目</option><option value="un">未作答</option><option value="bad">答錯</option><option value="ok">答對</option></select>
    </div>
    <div class="count" id="cnt"></div>
    <div class="mlist" id="ml"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA={"mods":[{"id":1,"t":"央行不動產管制","sub":"公司法人購屋・自然人第2/3戶・購地貸款・查核作業","w":"每年約 3–4 題","notes":[["定義與適用範圍",["「不動產抵押貸款」＝購置住宅貸款＋購地貸款＋餘屋貸款＋工業區閒置土地抵押貸款。","<b>購地貸款</b>限都市計畫劃定之<b>住宅區或商業區</b>土地（<u>不含工業區</u>）；購地取得成本<u>不含</u>容積移轉、拆遷補償費。","<b>高價住宅</b>：臺北市 <b>7 千萬</b>、新北市 <b>6 千萬</b>、其他縣市 <b>4 千萬</b>以上（鑑價或買賣金額）。","權狀用途登記含「住」「住商」「住辦」「住工」<b>均適用</b>管控規範。","都更、危老或配合政府政策之重建案件<b>不適用</b>本規定；財政部「青安貸款」不受自然人第 1、2 戶限制。"]],["貸款條件",["<b>公司法人購置住宅</b>：①不得有寬限期 ②最高 <b>3 成</b>（鑑價或買賣金額較低者）③不得另以修繕、周轉金或其他名目額外增貸。","<b>自然人</b>：無房貸但已有房屋→不得寬限期；<b>第 2 戶</b>→不得寬限期＋不得額外增貸＋最高 <b>7 成</b>（115.9.18 起；115.3.20～9.17 為 6 成、113.9.20～115.3.19 為 5 成）；<b>第 3 戶以上</b>、高價住宅→比照公司法人（3 成）。","購置住宅貸款<b>不得以周轉金名義</b>（用途代號 4）承作；繼承取得之持分房屋不受第 1 戶限制。","<b>購地貸款</b>：檢附具體興建計畫（115.9.18 起<b>刪除「切結於一定期間內動工興建」</b>）；最高 <b>5 成</b>（取得成本與鑑價較低者），其中 <b>1 成俟動工後始得撥貸</b>。","住宅區/商業區購地動工合理期間原則<b>不高於 18 個月</b>；逾期未動工先收回至少 <b>0.5 成</b>，之後每 12 個月再收回至少 1 成，並每 6 個月一期階梯式加碼。","舊貸展期／轉貸：給予最長 <b>12 個月調整期</b>，屆期未動工成數調降至 <b>4 成</b>內；持有逾 5 年未動工之轉貸原則不受理；<b>不得藉重新鑑價提高貸款金額</b>。","<b>餘屋貸款</b>最高 <b>3 成</b>；<b>工業區閒置土地</b>最高 <b>4 成</b>（已動工或切結 1 年內動工者不適用）。"]],["排除適用與查核作業",["公司法人購屋供<b>本人營業使用</b>得排除：地方政府證明可供營業＋實際營業用（<u>出租除外</u>）＋已設立登記（或切結<b>半年內</b>辦妥）＋本行實地查核屬實。","企金查核對象：借款人、負責人、保證人、擔保物提供人；時點：<b>申請時</b>（買賣契約簽訂日往前 <b>3 個月</b>至申請日）、<b>撥貸前</b>、<b>撥貸滿 3 個月後之 1 個月內</b>。","查有新增借款流向購屋：撥貸前→以 3 成扣除該借款後貸放；撥貸後→收回該金額並溯自借款日起<b>加碼 0.25%</b>。","消金：撥貸前徵借、保戶、擔保物提供人親簽「申貸不動產抵押貸款切結書」；第 2 戶、第 3 戶、高價、購地案另需<b>自籌款來源證明</b>。","消金三時點查核：<b>授信申請、撥貸當日、貸放後三個月</b>；查核對象＝借款人、保證人、擔保物提供人（<u>不是只有借款人</u>）；撥貸前須查聯徵 <b>B28 及 B33</b>。","央行管控案件<b>不得</b>承作樂活貸循環型房貸、不得適用「前低後高」償還方式。"]],["購置不動產貸款期限",["住宅用最長 <b>30 年</b>；商業用、工業用及其他最長 <b>20 年</b>；在臺無住所大陸地區人民最長 <b>20 年</b>；「前低後高-定額本金」限定 <b>30 年</b>。","寬限期：貸款期限 <b>1/6</b> 範圍內、最長 <b>5 年</b>；前低後高者最長 <b>3 年</b>。"]],["2026 講義補充",["公司法人以其他擔保品新貸/增貸或<b>名下定存單質借</b>，資金實質流向新購住宅 → 屬「另以其他名目額外增加貸款」，兩者合計不得逾 3 成上限。","高價住宅（北市 7 千萬、新北 6 千萬、其他 4 千萬）<b>一律送區域中心或總行授審處</b>審核。","央行 2022 專檢缺失態樣：動撥借戶<b>自有周轉金額度</b>或<b>負責人、保證人之樂活貸</b>，資金最終流向購屋信託專戶，致合計成數超限（再犯提人評會）。","中長期融資以不超過所需資金 <b>7 成</b>為原則；公司 活貸。"]],["青年安心成家（自辦）應注意事項 2026.08 版",["辦理期限 <b>115.8.1～118.7.31</b>，撥款日不得逾 <b>118.10.31</b>；<u>不得</u>以他行轉貸或本行改貸（含借新還舊、變更貸款種類、法拍屋代墊款改貸）。","對象：成年以上、申貸時<b>未滿 50 歲</b>；本人、配偶及未成年子女均無自有住宅（共有持分合計未滿 <b>40 平方公尺</b>視為無）；112.8.1 後未辦過青安/農安 → 查聯徵 <b>B98、B95</b>；本人年所得 ≤ <b>200 萬</b>。","房價上限（鑑價或買賣總價<b>孰高</b>）：臺北市 <b>3,500 萬</b>、新北市・新竹縣市 <b>2,500 萬</b>、其他 <b>2,000 萬</b>。","額度 <b>1,000 萬</b>；申請日前 2 年內結婚 → 最高 <b>1,200 萬</b>（專案 A121A）；育有未成年子女且撥貸日仍未成年 → 最高 <b>1,500 萬</b>（A121B）；須分「1,000 萬」與「逾 1,000 萬」二案，中途還款<b>優先償還逾 1,000 萬</b>部分。","期限最長 <b>40 年</b>（含寬限期最長 5 年）、<b>申貸年齡＋核貸年限 ≤ 80</b>；成數最高 <b>8 成</b>；共有房地依持分（持分 1/2 → 優惠額度最高 500 萬）。","利率：郵政 2 年期定儲（未達 500 萬）機動利率 <b>＋0.555%</b> 一段式；112.8.1 後撥貸優惠 <b>2 碼</b>（政府 1.5 碼＋公股半碼）至 3 年期滿，之後每年減半碼；112.7.31 前撥貸自 115.8.1 起優惠 1.5 碼每年減半碼。優惠額度<b>免收</b>提前清償違約金。","擔保品：登記日須在<b>申請日前 6 個月內或核准後 6 個月內</b>、所有權人為借款人、用途含「住／住宅／套房／公寓」、登記原因為<b>買賣</b>；113.6.27 後核准案件須簽「自住切結書」；借保戶合併總放款支出所得比逾 <b>70%</b> 應敘明理由。","撥貸前：結婚案查身分證換補領確認仍已婚（逾 1,000 萬部分最高 200 萬）；子女案確認撥貸日仍未成年（最高 500 萬）。授扣帳號<b>限本人</b>；得搭配內政部自購住宅利息補貼。","貸後：貸放後 <b>3 個月起 1 個月內</b>勘查閱覽＋以 <b>1030</b> 比對租金入帳；不合規 → 改貸一般房貸或全部收回，並<b>收回補貼息</b>。"]],["「樂活貸」循環型房貸作業應注意事項",["核准後 <b>2 個月內</b>徵妥契約，逾期額度作廢；A194 高風險客戶<b>不得以經理權限</b>核定，一律送區域中心。","單一循環型契約 3 年一期；「高資產客戶」或「專業投資人」且資金用於「珍愛傳承」信託者可 <b>5 年</b>一期。綜合循環型之循環額度 3 年一期，最終期限至非循環額度（甲項）到期日止。","透支帳戶限撥貸分行開立，<u>不得</u>為綜合存款帳戶（金如意帳戶除外）；利息每月 <b>20 日</b>結息、<b>21 日</b>中心扣繳。","應注意狀態 A：N2/N3/N5 連續透支 <b>365 天</b>且動用率 > <b>80%</b> → 暫停循環額度；狀態 C：連續透支達 <b>3 年</b>未歸正 → 暫停且到期不得續約；通知後逾 <b>15 日</b>未繳/未歸正 → 雙掛號書面通知。","本金逾期未處理：逾 5 工作天函知副理、逾 10 天函知經理、逾 15 天函知經理並須 5 個工作日內回覆。","期中管理<b>每半年</b>：(1)信用不良 (2)債務協商 → 營業單位<b>得收回</b>；(3)利息逾期 ≥ 30 日 (4)繳款不良 → 由營業單位判斷。收回額度者通知日起 <b>1 個月內</b>清償。","擔保品遭查封、假扣押等 → 依加速條款通知並以 1120 鍵「6：暫停」。暫停（6）恢復時<u>無需</u>立即歸正；中止（8）恢復時<b>需立即歸正</b>透支餘額。","續約：到期前 <b>2 個月</b>名單列 PB-18 → 徵財力證明（高資產客戶總資產 ≥ <b>5,000 萬</b>得免）；不同意續用應於到期前 <b>1 個月</b>寄屆期通知書；預約續約於到期日前 <b>5 個營業日內</b>執行、到期當日不得執行。","展期轉換為非循環貸款：須<b>總行或區域中心</b>核准、重取 10 開頭核准號碼、貸款種類 <b>V7</b>、期限最長 <b>20 年</b>（含原循環期間）、利率不低於原循環利率、金額不得逾原透支餘額。"]],["保費及保單融資（地方資產管理專區・高資產客戶）",["對象限<b>高資產客戶</b>並徵「地方資產管理專區商品及服務申請書」；借款人＝要保人＝被保險人；限與本行簽約合作保險公司之指定保單；招攬人員限授信人員，由<b>新興分行</b>授信人員推介。","<b>保費融資</b>＝新購保單（附保費融資批註條款），以首期躉繳保費為基礎最高 <b>7.5 成</b>、不得逾首日解約金，期限最長 <b>10 年</b>；<b>保單融資</b>＝既有保單，以保價金或解約金<b>孰低</b>最高 <b>9 成</b>，期限最長 <b>1 年</b>且不逾保單到期日。","保單鑑價一律由<b>營業單位自行</b>鑑估；新臺幣最低 <b>100 萬</b>（萬元倍數）、外幣最低等值 <b>3 萬美元</b>；每筆單一幣別、額度不可移用、<b>一次動撥</b>。","權限：經理於個別分行<b>個人無擔保</b>權限內以<b>免保人信用貸款</b>辦理；<b>不適用 DBR22</b>。","償還：保費融資新臺幣可年金法/本金法（首次寬限期最長 <b>2 年</b>）或到期還本；外幣僅<b>本金法</b>或到期還本；保單融資按月繳息到期還本；展延須總行或區域中心。","擔保維持率＝保單解約金總價值 ÷ 借款總餘額；<b>95%～100% 連續 5 個營業日</b> → 還款預警通知；<b>低於 95%</b> → 還款通知，自掛號寄發次日起 ≤ <b>15 個營業日</b>償還，逾期得主張期限利益喪失 → 向保險公司主張終止契約（無須借款人同意）。","貸放後第 <b>5 個營業日起 1 個月內</b>確認保單已完成融資批註；未清償前變更要保人、受益人、終止、撤銷、提領、保單借款等 11 項須經本行同意（原則不同意）；理賠金於債務範圍匯入約定授信帳戶（66 帳號）。","代碼：貸款種類 <b>6D</b> 保費融資／<b>7D</b> 保單融資、擔保內容 86；外幣額度種類 28／29、擔保品內容 1H。"]],["消金講義（2026.03）補充",["購置不動產貸款：住宅最長 <b>30 年</b>、商業／工業及在臺無住所大陸人民最長 <b>20 年</b>；寬限期依期限 1/6、最長 5 年，「前低後高－定額本金」最長 <b>3 年</b>。增改建裝修、消費性擔保貸款最長 20 年、寬限最長 3 年；裝修貸款金額不得逾修繕證明金額。","消費性無擔保貸款：期限最長 <b>7 年</b>、DBR ≤ 22 倍、原則免徵保證人；機關整批申貸限任職滿 <b>3 個月</b>正式員工。樂活信貸最高循環額度為平均月收入 <b>10／8／6 倍</b>（特選優質／薪轉一級／薪轉二級），<b>不得以 ATM 動用</b>，連續透支 365 天須歸正。","安心貸：通知義務人於借款人死亡翌日起 <b>20 個營業日</b>內通知；須律師諮詢見證；貸放後<b>每半年</b>訪查並填「貸放後關懷表」。","央行管控（2026.3.20）：第 1 戶購屋不得寬限；第 2 戶 <b>6 成</b>無寬限；高價住宅及第 3 戶以上 <b>3 成</b>無寬限；先買後賣換屋族切結 <b>18 個月</b>內出售原屋者得寬限、成數比照一般，追蹤於撥貸後第 6、12、16 個月。繼承取得房屋不計入戶數。","銀行法 12-1：自用住宅及消費性放款<b>不得徵連帶保證人</b>、已足額擔保不得要求一般保證人（借戶總放款支出所得比逾 70%、無擔保支出所得比逾 35%、年齡大、信用不良、擔保品非己有時可主動提供）；12-2：保證契約有效期間不得逾 <b>15 年</b>（經保證人書面同意除外）。","消費者貸款利率低於放款成本＋合理利潤（房貸類 <b>2.31%</b>、非房貸類 <b>3.11%</b>）者應填「消費者貸款適用利率計算表」陳核經理。","對保：審閱日早於立據日 <b>5 日</b>以上；核准日 ≦ 立據日 ≦ 對保日；保證人不得早於借款人對保；金額由借戶親寫大寫不得塗改；循環額度核准後 2 個月內徵妥契約。"]]],"nums":[["60 歲 / 95","安心貸對象／年齡＋期間"],["35 年","安心貸最長期間"],["1.4 倍","安心貸設定"],["1,000 萬・8 成・40 年・5 年","新青安"],["22 倍","DBR 上限"],["12 倍","寬限展延最低攤還＝月息×12"],["115.8.1–118.7.31","新青安（自辦）辦理期限"],["未滿 50 歲・200 萬","青安申貸年齡／本人年所得"],["3,500／2,500／2,000 萬","青安房價上限 北市／新北竹／其他"],["1,200／1,500 萬","青安新婚／育未成年子女額度"],["年齡＋年限 ≤ 80","青安期限限制"],["365 天・80%","樂活貸狀態 A 暫停"],["7.5 成・10 年","保費融資成數／期限"],["9 成・1 年","保單融資成數／期限"],["95%・15 營業日","保費/保單融資還款通知"]],"cnt":28,"yrs":{"110":4,"111":8,"112":7,"113":6,"114":3}},{"id":3,"t":"建築融資・都更危老・工業用地","sub":"土建融定義・成數期限・工程追蹤・72-2 統計・危老自力更新","w":"每年約 2–3 題","notes":[["建築貸款定義與條件",["「建築貸款」＝<b>土地融資</b>（購地或合建保證金）＋<b>營建融資</b>（興建房屋）＋<b>營建週轉金</b>（得以循環額度辦理）。","營建融資原則不得超過預估建築物興建造價之 <b>5 成</b>；個案 LTV 低於 5 成者得至 <b>6 成</b>。","期限：基地 <b>200 坪內</b>或 <b>10 層以下</b>最長 <b>3 年</b>；超過 200 坪且 <b>11 層以上</b>個別核定、最長 <b>6 年</b>。","申請應徵：買賣契約、合建契約、建造執照、興建計畫；e-Loan 勾選應追蹤事項「<b>計畫執行進度追蹤表</b>」。","建築基地擔保：借款人填承諾書，於取得使用執照並辦妥保存登記後 <b>3 個月內</b>設定第一順位抵押權；股份有限公司依銀行法第 30 條經董事會決議。"]],["貸放後管理",["工程進度：自貸放日起<b>至少每 3 個月</b>追蹤（114 年以「每 2 個月」為錯誤選項），並填報追蹤表。","動工認定：實際勘查拍照，以<b>工地現場機具進場持續施工</b>為實質動工依據。","營造工程綜合險：以本行為受益人或附加債權人條款，留存<b>保單正本及收據影本</b>（110 年考「保單影本、收據正本」為錯）。","興建之建築物以借款人為起造人，非經本行同意不得變更起造人名義。","銷售率：A 級以外重劃區或供過於求→個案銷售率不低於 LTV；偏僻、山坡地避免承做；都更、危老或經建經管理＋本行不動產信託續建機制者<b>不受銷售率限制</b>；土地融資亦不受限。"]],["資金用途建檔（銀行法 72-2 統計）",["建築業（行業中類 41、67、68）申貸週轉金用於「興建」或「購置」住宅及企業用建築 → 貸款種類「<b>建築貸款(31)</b>」、資金用途「<b>其他營建資金(33)</b>」。","個人非消費性貸款投資經營建築業、資金用於興建/購置，同樣勾選「其他營建資金」。","640 建檔資金用途：營建自用(31)、營建銷售(32)、其他營建資金(33)、自建廠房(34)；土融擔保內容一律「土地-建築用地(15)」；建檔後再做 ADC 建檔(6407)。"]],["危老自力更新・工業用土地（另訂要點）",["危老重建（自力更新）：須經<b>全體</b>土地及合法建物所有權人同意；營建融資及其他營建費用成數最高 <b>10 成</b>；重建融資額度原則<b>一次全數動撥至信託專戶</b>。","考古題陷阱：「融資期限最長不逾十年」「採借款人互為連保」皆為<b>錯誤</b>敘述。","工業用土地－週轉金：資金<b>不得</b>用於購置、投資或興建不動產；法人戶須出具「營運週轉計畫書」；工業區閒置土地不得辦理。","工業用土地－購置：久未動工應了解原因並敦促；逾動工切結日之加碼利率<b>不得先調降再提高</b>；無法動工者協商分期收回；授信期限<u>不得</u>逕核中長期。","銷售型土建融徵信：調查附近預售均價、新成屋餘屋量，可參內政部餘屋統計；所屬行政區無資料時<u>不能只寫「查無銷售率供參」</u>。"]],["2026 講義補充",["建築貸款除<b>營建週轉金</b>外一律以<b>非循環額度</b>辦理；批覆書有效期限不受現行規定限制，且不受「核准後 6 個月內首撥」之規定。","未動工收回計算例：購價 1.2 億、鑑價 1 億、貸 5,000 萬 → 依孰低（1 億）之 <b>0.5 成</b>收回 <b>500 萬</b>。","承攬廠商應具結<b>放棄民法第 513 條</b>法定抵押權；撥款時須有營造廠出具上期工程款收款證明。","營造業（行業中類 41、42、43）經常性融資：撥貸前填「專案融資/工程入帳追蹤表」，貸放後<b>每 3 個月</b>更新。","工業用土地：先查聯徵 <b>B50、B49</b> 判斷是否閒置；<b>一律送總行或區域中心</b>核定；利率原則 2.5% 以上（低於須資深協理以上核准）。","工業用土地非自有自用者成數 ≤ <b>6.5 成</b>（1 成待動工撥貸）；切結 1 年內未動工 → 第 13～18 月加 1 碼、第 19～24 月再加 1 碼、<b>2 年未動工全數收回</b>；將滿 2 年延長加速還款到期日須<b>授審會</b>以上核准。","工業區閒置土地購置：1 年內未動工本金須償還至 4 成內；供自用者 1 年內未實質營業使用，成數收回至 6.5 成以下。"]]],"nums":[["5 成 / 6 成","營建融資占造價（LTV<5成可6成）"],["3 年 / 6 年","200坪・10層為界"],["每 3 個月","工程進度追蹤"],["3 個月","使照登記後設定一順位"],["10 成","危老自力更新成數"]],"cnt":12,"yrs":{"110":3,"111":2,"112":2,"113":2,"114":3}},{"id":4,"t":"授信通則・保證人・擔保品","sub":"直/間接授信・保證責任・法定代位・抵押權設定塗銷・對保","w":"每年約 5–6 題","notes":[["授信種類與 5P",["<b>間接授信</b>：保證、承兌、開發國內外信用狀、無追索權應收帳款承購等；出口押匯、透支、有追索權承購屬<b>直接授信</b>。","授信 5P：借款戶(People)、資金用途(Purpose)、還款來源(Payment)、債權保障(Protection)、授信展望(Perspective)。","中長期融資寬限期：期限 1/6 範圍內、最長 <b>5 年</b>；同業代償資金用途應與原貸行一致，非聯貸<b>不得</b>勾選「05 償還同業貸款」或「63 其他」。","不動產代償 3 個營業日內完成並取得第 1 順位、於原貸結欠餘額內者，經理得在擔保授信權限內逕以擔保放款貸放。"]],["保證人",["擔保放款原則 <b>1 人</b>保證、無擔保放款 <b>2 人</b>保證；應衡酌資歷及保證能力，不得逕以相互聯保或一人承保多戶。","<b>不得徵取未成年人為保證人</b>（民法 1088「為子女之利益」只適用於未成年人擔任<u>借款人或擔保物提供人</u>）。","公司限依法律或章程以保證為業務者始得為保證人（公司法第 16 條）；合夥行號作保應徵全體合夥人同意書。","民法 753-1：因擔任法人董事、監察人而作保，僅就<b>任職期間</b>債務負責 → 卸任後新貸放之款項，卸任董事不負責；此終止係法定權利，<b>無須</b>徵代位清償人同意書。","撥貸前至商工登記查詢董監事；卸任者願續任→簽「續任保證人同意書」；不願→辦保證人條件變更核准後始得撥貸。","未定期間最高限額保證：每年一次書面通知保證金額及基準日債務。","銀行法 12-2：足額擔保之自用住宅/消費性放款不得要求連帶保證人；僅借戶有總放款支出所得比 >70%、無擔保支出所得比 >35%、年齡致工作年限短於期限、信用不良、擔保品非自有時，<b>主動</b>提供一般保證人。","借款期限逾 <b>15 年</b>者，保證人須親填「宣告保證人責任範圍暨保證期間同意書」之保證期間。"]],["法定代位清償人同意書",["免除保證人中一人或數人責任，應向其他保證人、<b>擔保物提供人</b>等法定代位清償人徵取同意書。","「<b>免除</b>」＝溯及最初解除；「<b>終止</b>」＝向後發生解除（常考互換）。","塗銷部分抵押權或全部塗銷而借款人尚有其他授信 → 徵取格式 C（抵押權塗銷）。"]],["擔保品・抵押權",["不動產設定金額原則：<b>放款值加二成</b>或提高至鑑價金額範圍內；重估案設定限額/貸放限額/年限未變更→經理逕行核定。","個人消費性貸款：由<b>擔保物提供人</b>勾選最高限額或普通抵押權（企業戶非由客戶勾選）；普通抵押權一律以非循環額度申請<b>總行或區域中心</b>核准。","抵押權塗銷查詢對象：<b>借款人及擔保物提供人</b>（9703、A220）；塗銷同意書由借款人及擔保物提供人共同簽章領回，或確認身分後由擔保物提供人簽章領回。","動產設定期限一律以<b>貸放期限加 5 年</b>；動產抵押授信餘額達 <b>5,000 萬</b>以上，每年重估外每 <b>6 個月</b>再辦勘查閱覽建檔。","不動產新買賣案件（拍賣取得除外）貸放後 <b>2 個月內</b>至實價登錄查證。","擔保物權連結條款（104.8.12 後）：同一房屋同時申請之各筆購屋貸款得設同一順位、免同意書；同意書第二點由<b>擔保物提供人</b>親填，不得預留。"]],["授信往來約定與程序",["約定書簽章須與印鑑卡正面右下方印鑑簽章<b>相符</b>；對保查核雙重身分證明，並查 Z21 身分證領補換。","消金借據金額由借款人大寫填寫且<b>不得更改</b>；其餘記載更改由借保戶蓋章；契約審閱期 5 日以上；核准日≦立據日≦對保日。","董事會決議錄：反面承諾書（銀行法 30 條）、備償專戶供關係企業使用、新戶動用或簽約前應徵；舊戶任期內僅部分董事改選得不重徵。","「額度核定通知書」：主管蓋腰形章寄交，借戶回執聯蓋妥授信往來印鑑交回存卷；無法取得則<b>雙掛號</b>郵寄。2026.8 版改為三聯式，僅於留底聯登打並<b>裁決至經理同意</b>後核發。","授信聯行查詢 9703＋A220：企業查借款人、負責人、保證人；個人查借款人、保證人。跨行往來須原往來分行同意後送<b>區域中心或總行</b>核准（非經理權限）。","利害關係人比較表之授信條件 5 項：利率、擔保品及其估價、保證人之有無、授信期限、本息償還方式（112 年題中「授信金額」「保證人資力」皆非比較項目 → 答 AB）；擔保授信應十足擔保、條件不得優於同類對象。","備償借款專戶：無授信往來起算 <b>1 年 6 個月</b>內清理；個人戶開立仍須填「開戶/久未往來戶作業檢核表」(存511)。"]],["2026 講義補充：授信準則・銀行法",["授信 5 項<b>基本原則</b>：安全性、流動性、公益性、收益性、成長性；5 項<b>審核原則</b>（5P）：借款戶、資金用途、償還來源、債權保障、授信展望。","禁止事項：<b>授信回存</b>；以搭配壽險/金融商品為准駁條件；以負責人<b>他行房貸轉貸</b>予本行為准駁條件。撥款應以<b>撥帳</b>方式，不得現金撥付。","銀行法 32：對持有實收資本 <b>3%</b> 以上企業、負責人、職員、<b>主要股東（持股 1% 以上）</b>及利害關係者不得無擔保授信（消費者貸款每戶合計 ≦ 180 萬及政府貸款除外）。","銀行法 33：持股 <b>5%</b> 以上企業等擔保授信應十足擔保、條件不優於同類；每筆或累計達 <b>1 億或淨值 1% 孰低</b> → 2/3 董事出席、出席 3/4 同意；同一法人 ≦ 淨值 <b>10%</b>、同一自然人 ≦ <b>2%</b>、總餘額 ≦ <b>1.5 倍</b>淨值。","33-1 利害關係者：負責人/辦理授信職員（有最後決定權者）之配偶、<b>三親等內血親、二親等內姻親</b>；其獨資合夥事業、持股超過 10% 之企業、任董監經理人之企業、為代表人管理人之法人團體。","利害關係人比較表之授信條件 <b>5 項</b>：利率、擔保品及其估價、<b>保證人之有無</b>（不比人數）、授信期限、本息償還方式；同類對象＝最近一年內同一銀行、同一用途、同一會計科目。","33-3 同一關係人：本人、配偶、<b>二親等以內血親</b>、本人或配偶為負責人之企業。"]],["2026 講義補充：保證・契據・作業",["一般保證人有先訴抗辯權；連帶保證人放棄之。民 748 數人保證同一債務原則連帶；民 754 未定期間可隨時通知終止（到達後新債務不負責）；民 755 定期債務延期清償未經保證人同意 → 不負責。","原則上<b>不宜</b>徵取個人戶徵信報告淨值為負數之保證人；公司為保證人或提供擔保物 → 符合公司法 16 條並徵董事會決議錄。","受<b>監護</b>宣告之人不得徵取；受<b>輔助</b>宣告之人須取得輔助人<b>書面同意</b>；查詢時機為授信申請（含條件變更）前。","753-1 查詢時機：授信申請及<b>撥貸當日</b>（十足本行存款/存單等擔保者撥貸時免查）。","A210 保證人建檔：法人有保證書 →「1 概括保證」、僅借據作保 →「2 個別保證」；<b>個人授信戶一律「2」</b>；全部免除 → 9 刪除、終止 → 2 修改。保證人不願收通知 → 徵「連帶保證人聲明書」。","批覆書有效期限（自貸非循環）：新設定動產/不動產擔保 <b>6 個月</b>、其他 <b>4 個月</b>；聯貸 6 個月內簽約；非循環未約定分批動用 → 契約起迄日均為動用當日。","借款決議錄免徵：全體董監或全體股東已連保、<b>一人股東有限公司</b>、本行定存質借撥入公司存款戶、在臺無住所外國法人新臺幣放款（授權書）、僅置董事一人者。決議：過半數出席、出席過半數同意，金額 ≥ 借款總額。","帳列巨額股東往來之無擔保案件 → 徵「<b>股東債權居次同意書</b>」；負責人變更、董監改組、合併 → <b>免</b>徵債務承擔書。","一般活存轉充備償專戶 → 函文申請授審處核准，轉成後<b>不得再轉回</b>；第三人名義開立須徵客戶業務往來聲明書。","部分塗銷抵押權原則須先償還相當於提回擔保物貸放額（<b>維持原貸放折扣率</b>）；9703 備註「F」 查詢人員蓋章主管覆核、專卷保留 <b>5 年</b>；信用資訊<b>不得供行銷</b>。","退件或拒貸案件：同意書併同信用資訊表自查詢日起保留 <b>5 年</b>；客戶要求退件應盡量保留正本或先影印。","徵信處權限：<b>統籌主辦聯貸</b>、新戶且本次申貸 <b>5 億</b>以上、本行總授信額度 <b>6 億</b>以上；個人戶屬營業單位權限；土建融多戶申貸依各自額度計算。","境外公司：負責人及保證人身分證件應留存<b>兩種</b>；免稅地境外公司加徵政府規費繳訖證明及存續證明。","必須揭露：負責人/保證人信用不良、已逾聯徵揭露期限之過去異常紀錄、與關係人不動產交易價格異常、實際經營者負面新聞、訴訟案件最新進度。","進銷貨廠商查證：商工登記＋財政部稅務公示；<b>公營事業可免查證</b>；境外查上市櫃資訊或佐證資料。"]],["2026 講義補充",["酌情免辦徵信之「會員銀行」<b>包含金控公司及票券金融公司</b>；額度達授審會標準仍須編「企業戶徵信報告摘要」。","亦可免辦：憑本行承兌匯票辦理貼現之申請人、以政府公債質借、本行定儲存單質借；全額結匯之進口開狀（以最大寬容度金額存入同幣別保證金、不得擔保提貨/副提單背書）。<u>外匯定存單質借非原幣別</u>則應徵信。","無追索權應收帳款承購：<b>賣方及買方均須徵信</b>；眾多賣方對單一買方且買方承諾付款 → 賣方得簡化免編徵信報告。參貸聯貸不得以主辦行聯貸說明書作為徵信報告。","個人：同一關係人資料表<b>保證人免徵</b>；身分證影本加註「與正本核對無誤」「限辦理第一銀行徵授信使用」；報稅資料<u>不可</u>以申報書收件登錄單或所得資料參考清單替代。","企業：負責人資料表無論有無作保均須徵；財報最近三年、營業稅單最近二年；中長期預估報表依年度配合授信期限編製，<b>授信期限逾 7 年至少編 7 年</b>。","境外公司：註冊代理人 <b>6 個月內</b>簽發之 COI、註冊機關 6 個月內或效期內之存續證明（COI 已載存續者免）；負責人及保證人雙證件。","金融機構總授信得扣存單質借(K)、出口押匯(P)、進口押匯(Q)；依 master L/C 轉開之 <b>back-to-back L/C 不能扣除</b>。公司信用卡專用資料表：僅往來信用卡且額度 300 萬(含)以下。","新年度簽證期間（1/1～5/31）首次往來、前一年度無財簽且本行無擔保授信逾 <b>500 萬</b> → 一律徵最近年度財簽；私立學校會計年度結束 <b>4 個月</b>內提出。","徵信權限（營業單位）：A 組 2.5 億、B 組 1.2 億、C 組 6,000 萬（含）以下；區域中心至未達 6 億；徵信處另含 <b>KY 公司</b>。","免逐年改編：不動產擔保授信總餘額 1,000 萬(含)以下；信保 10 成（不含批次）不限金額；200 萬(含)以下且信保 9 成以上未達 10 成；小微企業優惠貸款等。清償後再申請逾 <b>6 個月</b>須重新徵信。","卷宗：綠色徵207 公司行號、橘紅色徵207A 個人；保存至清償/解除保證後 <b>15 年</b>。「信用資訊表銷毀登記簿」<b>永久保存</b>；逾揭露期限資料不得告知客戶或作拒貸理由。","個資：對同一人告知一次即可；間接取得董監事、股東資料屬「履行法定義務所必要」免告知；當事人僅能取得其原始提供文件影本。","A194 第 19 項：關聯企業海外投資地區（01 無／02 含中東、中南美、東南亞／03 不含）。政府機關、公營事業、公開發行公司及其子公司得免確認實質受益人，但仍須填聲明書。"]]],"nums":[["600萬 / 1,500萬","小規模簡易資料表（後者需十足擔保）"],["3,000 萬","資料表／應徵會計師報告"],["8 個月","決算日距改編日上限"],["2 億","中長期預估資料"],["2,000 萬","個人徵提報稅資料"],["200 萬","同一關係人資料表免徵"],["5 年","聯徵紀錄/退件同意書保存"],["6 億 / 5 億","徵信處權限"]],"cnt":38,"yrs":{"110":6,"111":8,"112":9,"113":8,"114":7}},{"id":6,"t":"財務比率與財報分析","sub":"償債能力比率・營業/現金週期・查核意見・IFRS 現金流量・報表屬性","w":"每年約 3–4 題","notes":[["償債能力比率",["<b>流動比率</b>＝流動資產÷流動負債，又稱「<b>銀行家比率</b>」；>100% 表示流動資產足以償還流動負債，愈低短期償債能力愈弱。","<b>速動比率</b>（<b>酸性測驗比率</b>）測知<b>緊急</b>償債能力，愈高愈強；低於 50% 表示緊急償債能力甚低。","速動資產＝現金及約當現金＋短期性投資＋應收款項淨額（<u>不含存貨、預付</u>）。","償債能力主要比率：流動比率、速動比率、利息保障倍數、本金利息保障倍數（<b>長期</b>償債）、現金流量比率；<u>應收款項週轉率屬經營效率</u>。"]],["財務結構與週轉",["<b>負債比率</b>（槓桿比率）愈高財務結構愈<b>不穩固</b>；改善方式＝<b>現金增資</b>（減資彌補虧損、發公司債、向關係人借款、提撥法定盈餘公積皆無法改善）。","<b>固定長期適合率</b>超過 100% → 有以短支長（侵用短期資金作長期運用）之疑慮，宜低於 100%。","<b>營業週期</b>＝應收款項週轉天數＋存貨週轉天數。","<b>現金週期</b>＝營業週期 <b>－ 應付款項週轉天數</b>（兩公式常被互換出題）。","異常警訊：營收鉅幅下滑（例如最近一期 -30%）、負債比率持續上升、連續虧損。"]],["財務報表與會計師意見",["<b>資產負債表</b>＝特定<b>日期</b>財務狀況＝<b>靜態</b>；綜合損益表、權益變動表、現金流量表＝特定<b>期間</b>＝<b>動態</b>。","現金流量表含營業、<b>投資</b>及籌資三大活動（114 年題目漏「投資」）。","審計準則第 57 號新式查核意見<b>四種</b>：無保留、保留、否定、無法表示；<u>刪除「修正式無保留意見」</u>；保留/否定/無法表示均屬修正式意見。","會計師受<b>警告或申誡</b>：處分日起一年內如採用應註明原因；受<b>停止執行業務</b>：處分期間內不予採用；受<b>除名</b>：自處分日起不予採用。","IFRSs：支付利息得列營業或籌資活動，為利比較，攤列時<b>一律調整為營業活動</b>。","企業會計準則公報第 20 號「租賃」：移轉幾乎所有風險報酬者為<b>融資租賃</b>；取決於<b>交易實質而非合約形式</b>；影響較大產業：民營電廠、<b>航空運輸、海洋水運</b>。"]],["2026 講義補充",["<b>淨值比率</b>＝權益 ÷ 總資產（愈高愈好）；<b>固定比率</b>＝不動產廠房設備 ÷ 權益。","<b>固定長期適合率</b>＝（不動產廠房設備＋長期性投資）÷（權益＋長期性負債），<b>100% 以下</b>為宜。","<b>負債比率</b>＝負債總額 ÷ <b>權益</b>；金融性負債比率＝付息負債 ÷ 權益。","<b>利息保障倍數</b>＝（稅前純益＋利息費用）÷ 利息費用；<b>本金利息保障倍數</b>＝（稅前純益＋利息＋折舊＋攤提）÷（利息＋前期一年內到期長期負債），用於長期償債。","<b>現金流量比率</b>＝營業活動現金流量 ÷ 流動負債（動態）；流動比率屬靜態指標。ROE＝純益 ÷ 平均權益、ROA＝純益 ÷ 平均總資產。","營運週轉金需求試算（短期週轉金新案）＝（應收週轉天數＋存貨週轉天數－應付週轉天數）× 近一年營業額 ÷ 365。","攤列：透支調整為流動負債、<b>不得與存款抵銷</b>；關係企業營業帳款列應收款項、資金融通列其他非流動資產；預付設備款/未完工程列<b>非流動資產</b>；向關係人股東墊借列流動負債；存出/存入保證票據相互沖銷。","財報銀行借款與聯徵差異：貼現、透支可還原；出口押匯、存單質借等可說明；差異為「<b>應收承兌票款</b>」須進一步查證。"]]],"nums":[["50%","速動比率甚低門檻"],["100%","流動比率／固定長期適合率分界"],["4 種","新式查核意見"],["營業活動","IFRS 支付利息攤列"],["現金增資","唯一能改善負債比率"]],"cnt":17,"yrs":{"110":5,"111":3,"112":3,"113":3,"114":3}},{"id":7,"t":"中小企業信保與政策專案貸款","sub":"送保手續費・信用惡化通知・自動解約・批次保證・小頭家/鳳凰/青創","w":"每年約 5–6 題","notes":[["信保手續費與送保程序",["保證手續費以<b>一次計收</b>為原則，中、長期授信得<b>逐年計收</b>（先徵各年手續費期票備付）。","手續費應於<b>授信翌日起 7 個營業日</b>內存入信保基金指定帳戶（翌日、營業日、7 三個要素都會被改）。","移送保證（含貸放、展期、分期償還）於基金網路系統填送「移送信用保證通知單」並匯繳手續費，始完成送保。","逕准展延/分期/寬限之案件，最遲於原清償屆至日後 <b>2 個月</b>內填送通知單並匯繳手續費。","期中管理：<b>每月</b>至 e-Loan 填報異常名單「期中管理工作單」並辦理信用惡化通知，月底前列印陳核；「前一月份管理明細」保存 <b>2 年</b>。"]],["信用惡化通知・自動解除保證",["應於知悉之日起 <b>10 日內</b>、最遲 <b>2 個月內</b>通知：①停止營業 ②未依約分期攤還<b>逾 1 個月</b> ③利息延滯<b>逾 3 個月</b> ④授信對象<b>或其負責人</b>受拒絕往來。","陷阱：「分期攤還逾 3 個月」「利息延滯逾 1 個月未逾 3 個月」「<b>負責人配偶</b>受拒往」<u>都不是</u>應通知事項。","授信到期後 <b>2 個月內</b>未辦展延或分期償還保證，且未通知逾期者，信保基金<b>自動解除保證責任</b>。","先行交付備償款項申請時期：間接保證於授信到期（含視為到期）<b>屆滿 5 個月</b>或已訴追取得執行名義；批次及直接保證須已取得執行名義。"]],["送保對象與批次保證",["對象：符合「中小企業認定標準」（實收資本 1 億元以下<b>或</b>員工未滿 200 人，不含金融保險業、特殊娛樂業）；取有營業證照之醫療保健、<b>建築師事務所</b>、托嬰幼兒園、私立長照安養機構得視同登記（116.6.30 後停止受理），<u>不含</u>公立機關及財團法人。","同一企業保證融資總額度：<b>間接保證 1.5 億</b>、<b>批次保證 2 億</b>。","批次保證（113–116 年度）：辦理期間 4 年；保證成數最高 <b>10 成</b>；徵有 <b>5 成以上</b>擔保品者不得送保（購置機器設備除外）；負責人配偶等關係人退票未清償註記達拒往標準不得移送。","資本性支出送保：購置標的應設定第一順位抵押權/動產抵押權；機器設備授信未超過 100 萬或期間未超過 2 年得免設定；無法設定或無設定實益者須<b>先行通知信保基金</b>（非僅總行核准）。"]],["政策性/專案貸款速記",["<b>微型創業鳳凰</b>：最高 <b>200 萬</b>（僅稅籍登記 <b>50 萬</b>）、期限最長 <b>7 年</b>（經同意寬限 1 年）、信保 <b>9.5 成</b>免其他擔保品、<b>免保證人</b>、前 2 年利息勞動部補貼。","<b>企業小頭家</b>：員工 <b>10 人以下</b>、週轉金每一事業最高 <b>500 萬</b>（受災不受限）、週轉期限 6 年寬限 2 年、資本性支出不超過計畫經費 8 成；累計 100 萬內信保 9.5 成。","<b>青年創業及啟動金</b>：準備金/開辦費 200 萬、週轉性 <b>400 萬</b>、資本性 1,200 萬；週轉期限 6 年<b>含</b>寬限 1 年；得分次動用但<b>不得循環、不得借新還舊</b>；100 萬以下一律移送信保間接保證、不得批次。","<b>深化中小企業專案</b>：不含建築業及營造業；中期週轉及資本性支出<b>限非循環額度</b>；實收資本 3,000 萬以上得再減碼。","<b>海外投資融資</b>：額度以對外投資金額 <b>8 成</b>為限、每家最高 10 億；新臺幣建檔貸款種類「FI」。"]],["2025 信保作業手冊（114.6）補充",["取得信保三方式：<b>間接保證</b>（先取得保證書）、<b>批次保證</b>（先取得查覆書）、<b>直接保證</b>（企業先向基金取得承諾書）；另有相對保證（合作單位出資）。直接保證資本性支出不得超過營運計畫經費 8 成、保證成數最高 9 成。","間接保證保證書應於有效期限內核准並動用首筆授信，得申請延長 <b>3 個月</b>；批次查覆書有效 <b>3 個月</b>（得再延 3 個月），額度動用期間以首筆動用起算 1 年為原則，同一額度限同一批號。","不得送保之票債信異常：企業或關係人（負責人、其配偶、其等擔任負責人之關係企業）拒往中或退票未註記達拒往標準；債務本金逾期未清償、分期攤還逾 <b>1 個月</b>、利息延滯逾 <b>3 個月</b>。票信查「第一類」票據信用資料，於<b>授信額度核准前</b>查詢。","超過中小企業規模續予輔導：擴充後 <b>2 年</b>內、合併後 <b>3 年</b>內仍視同中小企業。員工數以勞保局最近 12 個月平均投保人數認定。","間接保證應徵<b>依法登記之負責人</b>為連帶保證人（獨資合夥得免）、實際負責人亦應徵提；不得徵提與經營無關之員工為保證人。未獲保證成數部分徵提之擔保品視為<b>全案擔保</b>，處分收回款按保證比率沖償。","信用弱化（知悉起 <b>10 日</b>內通知）：申請債權債務協商、分期攤還逾 7 日未逾 1 個月、利息延滯逾 1 個月未逾 3 個月、授信對象或負責人退票未達 3 張。","手續費：間接保證年費率 <b>0.375%～1.375%</b>（差別費率）；批次 <b>0.2%～1.2%</b>；直接保證基本 0.375%＋差額 A 組 0～0.5%、B 組逾 0.5～2%、C 組逾 2～3%；災害復舊及小頭家受災復舊<b>免收</b>。提前清償退費每次酌收作業費 <b>250 元</b>，500 元以內得不退補；非以票據繳手續費者代扣 <b>0.4%</b> 印花稅。","災害復舊專案：災後次日起<b>半年內</b>申請；保證成數 <b>9.5 成</b>（每次受災累計 100 萬元內 <b>10 成</b>）；廠房 20 年寬限 5 年、機器 7 年寬限 3 年、週轉 6 年寬限 2 年。","先行交付備償範圍：本金、積欠利息、逾期利息（到期後最長 <b>6 個月</b>）、訴訟費用；收到後不得將利息部分移沖本金。"]],["信保手冊待修訂重點（114.6～115.10）",["「創業個人」自保證對象刪除（青創貸款改僅以企業名義申請）；視同登記之事業（醫療、建築師、幼托、長照等）訂退場機制，<b>116.6.30</b> 後停止受理。","直接保證對象新增「成立未滿 <b>8 年</b>之新創企業」；直接保證差額費率刪除「成立迄今或連續三年虧損」衡量項目。","政策性貸款刪除「協助中小企業紮根專案貸款」（114.11.1 廢止）及「台商回台投資專案融資貸款」（115.7.28 廢止）。","災害復舊專案（114.10.17 修正）：增列僅辦稅籍登記之營利事業、融資額度不以受損金額為限、償還方案由承貸機構與企業自行議定。","企業小頭家（115.1.20 修正）：保證成數改依貸款要點第 11 點──累計 <b>100 萬元以內 9.5 成</b>、超過者最高 9 成；刪除受災、新創、傳承事業之成數規定。","「青年創業及啟動金貸款要點」114.7.1 更名為「<b>青年創業貸款要點</b>」。"]]],"nums":[["7 個營業日","授信翌日起繳手續費"],["10 日 / 2 個月","信用惡化通知"],["2 個月","到期未展延→自動解約"],["1.5 億 / 2 億","間接／批次保證上限"],["5 成","批次保證擔保品上限"],["200萬・50萬・7年","微型鳳凰"],["0.375–1.375%／0.2–1.2%","間接／批次保證手續費年費率"],["3 個月","保證書延長／查覆書有效"],["2 年／3 年","擴充／合併後續予輔導"],["9.5 成・100 萬內 10 成","災害復舊保證成數"],["116.6.30","視同登記事業停止受理"]],"cnt":28,"yrs":{"110":6,"111":5,"112":7,"113":6,"114":4}},{"id":8,"t":"審查權限・額度控管・集團","sub":"綜合授信額度・信保視同擔保計算・經理權限・併計・MML・最高額度控管","w":"每年約 4–5 題","notes":[["綜合授信額度（第五章）",["五類：<b>擔保</b>／<b>甲類</b>（墊付國內票款、貼現、憑 LC 或 D/A、D/P 之出口貸款、國內 LC 貸款、國內應收帳款貸款）／<b>乙類</b>（進口即遠期 LC、進口託收週轉金）／<b>丙類</b>（一般週轉金、憑訂單之出口貸款、簡易票貼）／<b>丁類</b>（國內即遠期 LC、商業本票保證、其他保證、透支、活存自動貸款）。","<b>不納入</b>綜合額度：出口押匯（含出口貼現）、買入外幣匯款暨票據、境外公司綜合融資、factoring、本行存單/政府債券擔保之授信。","綜合額度不應超過「最近一年營業額」或「預計未來一年營業額之 <b>8 成</b>」孰高；向<b>區域中心或授審處</b>申請；有效期限自訂約日起最長 1 年。","運用：擔保額度優先運用，未用額度可移作甲乙丙類及<b>已申請</b>之丁類；丁類各單項<b>不得互移</b>、未用不得移給甲乙丙；未申請丁類者不得移用擔保額度；用途不明之保證<u>不得逕用丁類</u>。","乙、丙類未用額度可移給條件較優之他類（丙→乙、甲；乙→甲），依較優類別之條件辦理。","計算題：綜合 1,000 萬＝擔保 400＋甲 300＋乙 200＋丁(國內 LC)100 → 開國內 LC 最高＝丁 100＋擔保未用 400＝<b>500 萬</b>；綜合 5,000、擔保 4,000 → 無擔保合計＝<b>1,000</b>。"]],["額度期限與契約",["循環額度須於<b>核准後 2 個月內</b>徵妥契約，逾期額度作廢；契約期間自<b>訂約日</b>起算（例：6/1 核准、7/1 簽約、期限 1 年 → 到期 7/1 次年）。","出口押匯/買入外幣票據額度有效期間以「月」為單位，最長不超過<b>次年相當月之月底日</b>（6/25 核准一年 → 次年 6/30）。"]],["經理權限與併計",["信保基金保證成數部分<b>視同擔保授信</b>：無擔保＝Σ 額度 ×（1 − 送保成數）。例：短放 100 萬（送保 8 成）＋LC 200 萬、履保 300 萬（送保 6 成）→ 20＋80＋120＝<b>220 萬</b>。","個人與企業間授信歸戶：企業之負責人、董事、監察人<b>及其配偶</b>之新臺幣授信權限額度與企業合併計算（<u>不含子女</u>）。","法人授信戶審查權限：考古題（111/112/114）負責人、配偶、子女持股與其他公司 → 答案皆為「<b>無應併計對象</b>」。","不得適用經理權限：負責人 A194 高風險、保證人財產受強制執行或假扣押、<b>股票為擔保品</b>、未成年人借款、套房（臺北市以外）、丙種建地建物等；負責人配偶存款不良紀錄<u>不在其列</u>。","公司淨值為負數者，徵本行同幣別足額定存單擔保，得單獨運用經理權限；批次信保額度適用「<b>無擔保授信</b>」權限。","條件變更經理可逕核：未涉組織變更之更名、公營事業負責人變更、活存備償改為<b>定存</b>；<u>不可</u>：活存備償改為<b>應收客票</b>（擔保力下降）。"]],["集團・最高額度控管・利率",["集團關係戶新增授信應知會<b>集團主責分行</b>並副知法人金融業務處；可用「以關係戶統編查詢 TEJ 集團名單」輔助判斷；新戶同步申請集團限額時，<b>集團限額核備日不得晚於授信核准日</b>（不得先核准後核備）。","集團控管認定：111/112 年以「兩家企業授信額度合計達 20 億」為正確敘述；114 年「合計達 25 億即符合」被列為錯誤，請留意最新門檻。","授信最高額度控管：「核准號碼」及「客戶 ID（含集團）」兩類；可跨分行、跨授信戶、跨臺外幣系統；新臺幣範圍含直接、間接、憑卡貸款及<b>支存透支</b>；最高限額幣別僅<b>新臺幣及美金</b>。","單一分行內單一客戶授信限額：自 2026/8/1 起上限調降為 <b>40%</b>（原 45%），聯貸案納入；逾限部分轉介指定接受單位承作，既有超限者 2 年緩衝期調降。","依貨幣市場利率承做短期放款（MML）：貸放期限最長 <b>90 天</b>；對象原則企金評等 1–7 等；4–5 等最低風險貼水 50bps；取得逐筆議價授權號碼後<b>當日或次一營業日</b>貸放；未依指定到期日償還溯自貸放日加 1%。","整體貢獻度納入放款定價減項之條件之一：該案<b>徵取資本抵減工具</b>。外幣貸款定有利率重評機制者，貸放時利率型態以「機動」建檔。"]],["2026 講義補充",["MML：逐筆議價者授信條件皆應加註<b>利率下限</b>（央行定存單申購利率加碼）；642 貸放時免議價輸入「M1000000」、逐筆議價輸入「<b>M2xxxxxx</b>」授權號碼，逾期不得貸放。","利率重評機制（常見於聯貸）：6400 額度以「<b>99 固定利率</b>」建檔；6420 依重評週期輸入利率代碼 91（3 個月以下）、92（6 個月）、93（1 年）、94（2 年）、95（3 年）、96（超過 3 年）；630-60 輸入重新評定日。","循環額度契約：核准後 2 個月內徵妥，起日＝立約日、迄日＝次年相當日（例：108.6.6 核准 → 最遲 108.8.6～109.8.6）。非循環額度：4 個月內動用，起日立約日、迄日＝核准日＋4 個月。","放款定價（授信準則 26 條）：納入整體貢獻度減項者應<b>敘明事由並於核定前進行損益分析</b>。","綜合額度：透支/活存自動貸款以授信總額扣除其額度後再建檔 3190/1120；擔保品貸放值大於週轉金需求時注意避免過度融資。","集團限額：授信申請及撥貸時須至行專「集團限額查詢作業」查詢列印核對。經理權限案件「申請」及「撥貸」須查 A230 及聯徵 B33/B36。"]]],"nums":[["2 個月","循環額度徵妥契約"],["8 成","綜合額度≦預計營業額8成"],["45%","單一分行單一客戶"],["90 天","MML 最長期限"],["1−成數","信保部分視同擔保"]],"cnt":25,"yrs":{"110":6,"111":6,"112":6,"113":2,"114":5}},{"id":9,"t":"洗錢防制・預警・覆審・ESG","sub":"A194 高風險/09 特殊風險・PEPs・人頭戶・預警通報・覆審戶・ESG 揭露","w":"每年約 4–6 題","notes":[["AML／A194",["A194 屬<b>高風險</b>：授信申請<b>不得以經理權限</b>核定，一律送區域中心或授審處，並敘明承做理由。","「<b>09 特殊風險客戶</b>」：填「特殊風險客戶資料查詢單」向<b>法令遵循處洗錢防制部</b>查詢；核貸單由防制洗錢督導主管覆核；<u>不得向借戶揭露</u>。","黑名單（經濟制裁/恐怖份子/資恐凍結）→ 暫停額度、不得申請新額度；<b>PEPs 或負面新聞</b>→ 揭露並審慎評估，<u>非一律暫停</u>。","「Z8-告誡清單」：仍須審慎評估個案風險，評估後欲貸放應敘明評估內容（<u>不得免評估逕予貸放</u>）。","法人借款權利文件授權經理人簽章 → 被授權人辦理 AML「線上姓名檢核」。","每月列印「洗錢資恐高風險授信戶名單月報（<b>LN1022</b>）」逐筆確認並陳核。","「運用擔保品洗錢及資恐交易態樣檢核表」：新貸、增貸及條件變更增減換擔保品，擔保品鑑價個人 <b>500 萬</b>、法人 <b>1,000 萬</b>以上須填。","徵信 AML：新貸戶徵「客戶業務往來聲明書」；法人另徵「高階管理人員暨實質受益人聲明書」；續貸戶檢視聲明書正確性，<b>有異動須重徵</b>；查 A194 前確認風險因子異動紀錄第 19 項。"]],["人頭戶與房貸審查",["人頭戶表徵：同一人共擔任 <b>3 人以上</b>擔保貸款保證、多戶還本繳息由同一人或建商關係人代繳、聯絡資訊與其他借戶相同且無合理關係、由配偶以外第三人陪同並代答、所得與借款顯不相當。","「地緣關係」（上班地點鄰近分行）、「寬限期屆滿再申請寬限期」<u>不是</u>人頭戶表徵選項答案。","非買賣房貸案件（代書轉介以外）：調閱擔保品「異動索引」；近一年有資融、租賃、民間借貸設定者 → 不得寬限期、不得樂活貸（「一律無經權」為錯誤敘述）。","高齡客戶＝年滿 <b>65 歲</b>或安心貸客戶；脆弱族群＝身心障礙等；服務評估表由受理人員觀察填寫（<u>不需客戶簽章</u>），可安排專人到府簽約。"]],["預警與危機處理",["自應歸類為預警戶起 <b>2 個營業日內</b>以「預警報告表」通報（區域中心／債權管理處）；未解除前<b>按月</b>更新行動計畫；預警戶<b>不含消費性貸款</b>。","應<b>先</b>填「授信案件危機處理報告」向授審單位通報（批示列預警戶者次月再通報）之徵兆：媒體負面報導、重大訴訟、負責人涉虛偽交易或掏空遭偵辦、大量離職/停業停工/欠薪、<b>支票存款不足或拒往退票</b>。","「最近兩年連續虧損」「週轉金因資金短絀展期二次以上」屬一般預警徵兆，<u>不屬</u>須先填危機處理報告之情形。"]],["覆審",["<b>風險較高覆審戶</b>：信評第 10–13 等、已拒往或最近 3 個月有退票未清償、最近三年連續虧損或淨值為負、申請展期尚未清償、<b>目前為預警戶</b>；列入後次月底前覆審，其後<b>每 6 個月</b>一次。","「無擔保授信合計達 <b>5,000 萬</b>以上」屬<b>大額覆審戶</b>，<u>非</u>風險較高覆審戶（111、112 年同題）。","一般覆審戶：新貸、增貸於貸放後次月底前覆審一次，之後每 18 個月至少一次（信評 1–7 等免再覆審）。"]],["ESG・赤道原則・境外",["ESG 揭露：E＝環境部列管污染源查詢、近三年碳排量（可取得即揭露，<u>非公開發行未免揭露</u>）、CBAM 輸歐產品；S＝聯徵查<b>勞工退休準備金</b>；G＝ESG 獲獎/評鑑資訊。「企業授信餘額及還款紀錄」<u>不屬</u>ESG 項目。","綠色授信四核心要素：資金用途、專案評估與選擇、資金管理、執行情形回報（<u>不含「驗證」</u>）。","赤道原則適用性檢核表：企業授信戶不論申貸金額及貸款種類（公司信用卡除外）<b>一律填製</b>。","KY 公司新增貸：TCRI 或企金信評 <b>6 等以上</b>且當次新增貸達<b>美金 300 萬</b>以上之自貸案件 → 實地查訪；本行統籌主辦聯貸亦須查訪。","大陸暴險風險移轉：徵企金信評優於 5 等之母公司/關係企業保證、十足備償存款、改以短期貿易融資（以上皆是）；額度核准後先做 6405 風險移轉登錄。"]],["2026 講義補充",["<b>永續績效連結授信（P3）</b>五要素：績效指標選定、目標檢驗調校、貸款屬性、執行情形回報、<b>驗證</b>；利率連結<b>最高降 0.05%</b>，條件須載於額度核定通知書。","<b>綠色授信（P2）</b>四要素：資金用途、評估與選擇程序、資金管理、執行情形回報（無「驗證」）。兩者皆須於 6402/FMBL/I621/3190/1120 註記以報聯徵。","ESG 查詢：環境部列管污染源、近 3 年碳排、CBAM 輸歐、<b>食品業查食藥署違規</b>、聯徵 <b>R08 勞退準備金</b>、<b>R19 企業 ESG 資訊</b>、近一年重大公司治理負面議題；另查違反勞基法等。","每日專人列印「公開發行公司重大訊息通知」（LNJCIC）逐級陳核、保管 1 年；影響經營者至 e-Loan「授信戶查詢」建檔。","危機處理報告：系統線上傳送後主動聯繫審核人員；授信戶持有<b>公司信用卡</b>者應即通報信用卡處監控。","國內信用狀業務易被套用資金：開狀金額常為整數、開狀日與押匯日僅隔一天等應注意合理性。"]]],"nums":[["500萬 / 1,000萬","擔保品洗錢態樣檢核表（個人/法人）"],["2 個營業日","預警通報"],["每月","預警報告表更新"],["6 個月","風險較高覆審戶頻率"],["5,000 萬","大額覆審戶（非風險較高）"],["US$300 萬・6 等","KY 公司實地查訪"],["65 歲","高齡客戶"]],"cnt":23,"yrs":{"110":5,"111":3,"112":3,"113":6,"114":6}},{"id":10,"t":"催收・債權管理・法務時效","sub":"逾期放款定義・轉列催收・支付命令・假扣押/假處分・時效・債權憑證・呆帳","w":"每年約 8–10 題（最大宗）","notes":[["逾期放款與轉列催收",["<b>逾期放款</b>：積欠本金或利息超過清償期 <b>3 個月</b>，或雖未超過但已向主從債務人訴追或處分擔保品。","逾期放款應於清償期屆滿 <b>6 個月內</b>轉入催收款項；應收保證款項自墊支日起 6 個月內轉列。","轉列催收款項（全案授信餘額）達 <b>3,500 萬</b>以上：檢附最近一次「M0~M2 監控案件追償報告表」，事先申請<b>債權管理處</b>核准。","履行保證責任墊付款，評估難收回 → 轉列「非放款轉列催收款項」，以不超過墊款日起 <b>6 個月</b>內為限，第一次轉列時報債管處備查。","新發生逾期案件應於逾期 <b>1 個月內</b>於逾催系統填「逾放案件新增原因分析表」；擬移交催收單位原則於新發生逾期 3 個月內移交。","新接辦之逾放案件：於接管<b>當日</b>及之後每年至少一次評估不動產擔保品市價。","大額違約通報：單一公司授信達 <b>1 億</b>且本息逾期 1 個月，或集團授信曝險合計逾 <b>5 億</b> → 「信用授信違約逾期案件通報表」通報債管處。"]],["督促程序（支付命令）",["支付命令<b>不能送達</b>：歷經 <b>3 個月</b>仍不能送達即失其效力，應另行起訴。","送達後 <b>20 日內</b>債務人得不附理由異議（異議即失效，視為起訴）；逾 <b>20 日</b>未異議 → 聲請支付命令確定證明書。"]],["保全程序（假扣押・假處分）",["假扣押裁定可向本案管轄法院或標的物所在地法院聲請；執行向<b>標的物所在地</b>地方法院民事執行處聲請。","<b>債務人得提供擔保</b>聲請撤銷假扣押裁定（「不得」為常考錯誤選項）。","收受假扣押/假處分裁定後已逾 <b>30 日</b>不得聲請執行（非 20 日）；執行費＝標的金額 <b>0.8%</b>（非 0.5%）。","債務人<b>移轉財產或高額設定等惡意脫產</b> → 採<b>假處分</b>，事先以「處理逾期放款申請/報告書」申請債管處同意。","提存擔保物：原因消滅之翌日起 <b>10 年</b>內聲請返還，逾期歸屬國庫。","法院所定拍賣底價低於本行抵押權設定金額 <b>7 成以下</b> → 事先申請總行審核。"]],["消滅時效",["借據<b>本金 15 年</b>、<b>利息 5 年</b>；判決確定等請求權時效不滿 5 年者延長為 5 年。","主權利時效消滅，效力及於從權利 → 本金時效消滅，<b>利息請求權亦消滅</b>。","抵押權擔保之債權時效完成後 <b>5 年</b>間不實行抵押權 → 抵押權消滅；時效完成後債務人仍為給付，不得以不知時效請求返還。","時效中斷：請求（催告、存證信函）、承認、起訴、聲請強制執行；聲請支付命令後<b>撤回或被駁回、失效</b>→ 視為不中斷。"]],["債權憑證・執行・抵銷・呆帳",["債權憑證等契據正本由<b>催收主管</b>保管並列入移交；催收主管<b>每半年</b>檢視時效（非每年、每三年）。","強制執行前填「聲請法院強制執行前檢核表」逐項勾稽，經催收經辦確認後<b>須送催收主管覆核</b>；查詢對象含借戶、保證人、票據債務人。","執行名義：確定終局給付判決、支付命令及確定證明書、拍賣抵押物裁定、本票裁定等（112-55 送分題）。","本票裁定僅能對<b>發票人</b>聲請（背書人不可）。","人身保險：健康險、傷害險之解約金，及受益人非要保人之年金給付，<b>不得</b>扣押或強制執行。","聯行抵銷：被抵銷行收到聯繫單→存款轉出暫存「<b>其他預收款</b>」；抵銷前先確認是否為政府補助款；本行連帶保證書於業主求償前屬或有債務，須事先申請債管處審核後始得抵銷。","收回款先入「其他預收款-預收放款延滯案款項」；營業單位自辦案（含信保已交付備償之勞工紓困）得自行沖償；債管處或<b>區域中心接辦</b>案件應通知營業單位沖償。","送保逾期案件：借戶、負責人、實際負責人以外之債務人自行償還款，得出具親簽書面聲明<b>優先沖償其個人借款</b>。","AML：抵銷單筆達 <b>50 萬</b>填抵銷檢核表；和解/協議攤還單筆達 <b>300 萬</b>填和解檢核表。","轉銷呆帳後墊支逾 <b>2 年</b>未收回之訴訟費用 → 申請核准以「其他什項支出-催收各項費用」開支並繼續催討。"]]],"nums":[["3 個月","逾期定義／支付命令不能送達"],["20 日","支付命令異議期間"],["30 日","假扣押裁定後聲請執行期限"],["10 年","提存物返還"],["15 年 / 5 年","本金／利息時效"],["3,500 萬","轉列催收須債管處核准"],["每半年","檢視債權憑證時效"],["50萬 / 300萬","抵銷／和解 AML 檢核表"],["7 成","拍賣底價須總行審核"],["0.8%","執行費"]],"cnt":48,"yrs":{"110":10,"111":9,"112":9,"113":8,"114":12}},{"id":11,"t":"貿易融資・票據・質押・保證・聯貸","sub":"國內信用狀・墊付國內票款・應收帳款承購・外銷貸款・股票質押・受益權質借・倫巴底貸款・備付本票・聯貸專案融資","w":"每年約 7–9 題","notes":[["國內信用狀・墊付國內票款",["<b>國內即期 LC</b>：有效期限原則不超過 <b>4 個月</b>；本行墊付後申請人應於 <b>10 天內</b>清償；續貸新臺幣自墊付日起最長 <b>180 天</b>；即期匯票<b>免承兌</b>。","<b>國內遠期 LC</b>：有效期間原則不超過 <b>6 個月</b>；承兌匯票付款期限最長 180 天（承兌期間＋續貸期間不超過 180 天）。","開狀手續費：有續貸年率 0.1% 最低 500 元、無續貸最低 1,500 元，3 個月為一期；承兌手續費年率 1%。","進口即期 LC 有效期限原則 6 個月內，經理可延至 1 年。","墊付國內票款（票借短放）：<b>不得</b>徵禁止背書轉讓票據；同一發票人累計未銷帳 ≤ 額度 <b>20%</b>；同一發票人累計達 <b>50 萬</b>另徵統一發票等交易資料。","客票背面註明備償專戶帳號並背書，負責人小章旁註明職稱；<b>代收經辦</b>（非放款經辦）於票據明細表票面金額欄前首逐筆蓋章。","「客票融資審核工作單」：票借短放逐筆於核貸前填製，副理及防制洗錢督導主管覆核；<b>簡易票貼、線上融資應收票據</b>（中心廠票據）可<b>免填</b>。","依貨幣市場利率（MML）短放最長 90 天；台塑網線上融資不得申請 MML。"]],["應收帳款承購（Factoring）",["目的：記帳賒銷應收帳款之管理、收回、催討、融通資金、買方信用風險轉嫁；有追索權→授信對象為<b>賣方</b>，無追索權→授信對象為<b>買方</b>（本行承擔買方信用風險）。","預支價金每筆不超過帳款交易淨額 <b>8 成</b>。","帳款逾到期日 <b>45 日</b>未付：有追索權由賣方買回，接獲通知後 15 日內償還預支價金。","商業糾紛：賣方接獲通知 15 日內協調，<b>逾 30 日</b>未解決 → 無條件買回。","統包供應鏈融資（無追索權）：徵買方付款承諾書及備付本票（可申請免徵）；利息<b>預收</b>（非按月收息）。"]],["外銷貸款・出口週轉金外幣貸款",["外銷貸款＝出口信用狀貸款、出口託收貸款、出口週轉金貸款、簡易出口融資。","出口週轉金貸款以<b>出口實績</b>申貸 → 貸款期間內提供貸款金額 <b>2 倍</b>以上出口 LC 控管（非 1.5 倍）；一律向區域中心、授審處申請。","出口託收貸款每筆在匯票金額 <b>85%</b> 內，期限最長 6 個月且不超過輸出保險期限；出口 LC 貸款到期日不得超過 LC 有效期限及提示期限。","AML 高風險客戶：出口後交易逐筆徵發票及運送文件，<b>不得</b>申請免徵。","出口週轉金外幣貸款：憑 LC 或託收每筆在 <b>85%</b> 內；出口前外幣貸款<b>不得兌換新臺幣</b>（撥貸同時匯付供應商或撥入備償專戶）；訂單/O/A 方式一律申請總行或區域中心；以訂單辦理屬綜合額度<b>丙類</b>。","大陸地區法人融資：簽立銀行借款合同後 <b>15 日內</b>向外匯管理局辦妥外債登記。"]],["有價證券質押",["上市股票鑑價＝前一日收盤價與最近 <b>3 個曆月</b>平均價孰低；放款最高 <b>6 成</b>；<b>上櫃 5 成</b>；興櫃/未上市以面額與淨值孰低鑑價。","擔保維持率低於 <b>120%</b> 應即實行質權出賣（黃金存摺質借為 115%）。","洽談前以 A614 查尚可承做空間；撥貸前至集保結算所查設質資料；投資/控股公司應徵具體投資計畫。","信評較差標的（TCRI 8、9、D 等）：實際質押集中度逾 <b>2%</b> 應酌減額度或改徵其他擔保品；已核准加當次申請試算逾 2% 應敘明理由。","自行特定金錢信託受益權質借：限專業投資人（不含境外個人）、期限最長 1 年、RR1–RR4 最高 <b>5 成</b>、RR5 最高 <b>4 成</b>、不得徵保證人；資產管理專區（新興分行試辦、高資產客戶）最高成數不以 5 成為限。"]],["備付本票・保證業務・聯貸專案融資",["備付（本息）本票：臺幣及外匯授信依總額度或逐筆貸放金額徵 <b>110%</b>；備償期票依逐筆徵 <b>100%</b>（外匯不得徵）；無到期日本票逾 3 年應重徵。","本票背書規範：記載<b>禁止背書轉讓</b>且<b>有第三者背書</b> → 不得接受；原則宜徵無抬頭且未記載禁止背書轉讓之票據。","保證書：預開者保證期間含預開天數；外勞「保證金保證書」非經勞動力發展署通知解除<b>不中止</b>；外幣保證事先申請授審處或區域中心；信保一定成數之新臺幣保證<b>整筆以無擔保列帳</b>；額度屆期不續約<u>不得</u>因此解除保證責任。","稅捐記帳「保證業務電子化系統」僅適用先放後稅進口貨物應繳稅費保證書、<b>不與帳務連動</b>、僅可作廢海關尚未核准者。","<b>專案融資</b>：融資額度達 <b>50 億</b>（非 30 億）；「專案融資會議」由<b>法人金融事業群副總經理</b>召集（會前會才由法金處處長召集）；公共工程至少每 3 個月填追蹤表。","聯貸：國內擔保品設定金額及貸放限額依<b>參貸比率</b>輸入；額度建檔前先做 A611/A612，管理行另做 A615；簽約前會辦法務室——統籌主辦由<b>聯貸及專案融資部</b>會辦；每月 5 日前填個案資料表、25 日前填到期追蹤表。","透支：6400 核准金額一律輸入 0；「每日最後透支餘額為本金」計息須區域中心或授審處核准並徵約定條款變更同意書；3190 顯示高風險而申請書未註明者，須於批覆書註明並陳經理同意。"]],["2026 講義補充",["墊付國內票款：17426 票借短放<b>逐筆</b>依兌現金額沖償；17442 其他短放（保持票）<b>免逐筆沖償</b>。關係人為發票人須於授信條件敘明戶名及金額上限。","同一發票人累計 50 萬 → 徵統一發票、存根聯加蓋「已在第一商業銀行辦理融資」戳記並辦 <b>6650</b> 建檔，另做 AML 名單檢核；累計未銷帳達 <b>300 萬</b> → 實地查證（上市櫃、公開發行、公營、資本 1 億以上知名廠商查公開資訊即可；一年內已查證得免）。","應收帳款承購科目：有追索權「<b>未收代收款-帳款託收(23825)</b>」；無追索權「應收承購帳款-無追索權(14419)」；無追索權可與 Coface 等信保機構、承購商合作或本行自行收買。","倫巴底貸款：限授信人員招攬；高資產客戶本人持有之金融資產<b>兩項以上</b>組合擔保；最高額度＝設質金額 <b>150%</b>；質借最多 <b>3 次</b>；加權成數 < 60% 時補倉 140%、平倉 120%。","金融機構/金控之董監大股東以該公司股票質押，放款值<b>超過鑑價值 6 成</b> → 提具體徵信意見並提董事會；不得受理公司以<b>本公司股票</b>質押。","本票：期票到期日——攤還期票填攤還日當天，保證/承兌票據填到期前一營業日；每月列印 LP40 追蹤 3 個月內到期本票；重徵：逾 3 年、額度增加無法涵蓋 110%、支存印鑑變更（小本票）。","國內 LC 電子化：主管核准明細表保存 <b>5 年</b>；網銀線上作業（非台塑/CDS）列印第 1、4 聯，正本以雙掛號寄受益人。","保證責任解除：收回保證書、受益人解除通知、<b>已逾求償期限（加郵遞期間）</b>、保證標的消滅（如押標金未得標）；保證書具獨立性及外部無因性。","外幣貸款：進出口四角（買方/賣方/出貨地/進貨地）須<b>一角在國外</b>；對外直接投資須洽法金處向央行申請；金融帳類交易不得申請。","交易彙總清單抽樣：中低風險 100 筆以下抽 1、逾 100 抽 3；<b>高風險</b> 100 筆以下抽 3、逾 100 抽 5；廠商國別為我國至少抽 1 筆並確認一方為外國。","補徵運送文件涉應婉拒事項 → 通知客戶全數清償，且<b>自發現日起 6 個月內</b>停止受理該客戶進/出口前外幣貸款；信評 8 等以上且撥貸達 20 萬美元等情形須查證運送單據。"]],["自行特定金錢信託受益權質借（地方資產管理專區）",["招攬限授信人員，且須先完成「第 e 學苑」招攬訓練；核對親簽及對保<b>僅限新興分行</b>；商品說明以錄音保留（錄音類別第 <b>4</b> 類＋第 <b>7</b> 類）。","新臺幣受益權（信託科目 01、03、08）質借幣別限新臺幣、最低 <b>100 萬</b>；外幣受益權得借原幣、新臺幣或其他外幣，最低等值 <b>3 萬美元</b>；申請前須電洽業管單位登記額度。","期限最長 <b>1 年</b>、非循環、<b>一次動撥</b>、按月繳息到期還本；撥款上限＝「客戶可再撥貸金額」與已核准額度<b>孰低</b>。","代碼：貸款種類 <b>2D</b>（法金/個人非消費）、<b>3D</b>（消費性）、擔保內容 <b>49</b> 本行信託受益權；外幣額度種類 24／25、擔保品內容 1L。同一投資標的至多分 <b>5 次</b>設質（資金用途 41～45）。","擔保維持率＝質押受益權總市值 ÷ 貸放餘額：<b>120%～130% 連續 5 營業日</b> → 接近補倉通知；<b>低於 120%</b> → 補倉（掛號寄發次日起 ≤ <b>5 個營業日</b>）；<b>低於 110%</b> → 平倉/期限利益喪失。","抵銷前以<b>存證信函</b>寄「行使抵銷通知書」；順序：已屆清償期者先、存款<b>利率低者先</b>。因<b>繼承取得</b>之受益權不得質借；借款人死亡應先清償再辦繼承。","國外債券單一標的<b>僅受理全部設質</b>，只能全部解質/全部提前清償；部分解質後「可再撥貸金額」須 ≥ 0。現貸戶增貸：原往來分行與新興分行須於<b>同一天下午三點前</b>完成帳務。"]],["倫巴底貸款（金融資產組合融資・地方資產管理專區）",["對象限<b>高資產客戶</b>（徵專區商品及服務申請書）；擔保品須為本人持有之金融資產 <b>2 項（含）以上</b>不同類別組合：定存單（自動轉期、可設質之實體存單，<u>不含綜存存單</u>）、上市櫃股票（含 REITs、ETF）、受益權、保本型結構型商品、國內金融機構次順位債券。","加權平均貸放成數＝Σ(個別資產現值×成數)÷Σ組合市價現值；<b>倫巴底核准最高額度＝初始設質金額 150%</b>；可再質借 <b>2 次</b>（共 3 次）：第 2 次額度＝第 1 次撥貸金額 × 新徵擔保品加權平均成數；前次撥貸須全部動撥完畢始可試算。","期限最長 <b>1 年</b>（擔保品有期間限制者不得超過）；非循環<b>得分次動撥</b>，每筆到期日與第 1 筆相同；按月繳息到期還本；擔保品每次須<b>一次設足、不得分批設質</b>。","權限以「倫巴底核准最高額度」計算；擔保品含上市櫃股票者<b>不適用分行權限</b>（含鑑價調查表）；原經權案件再質借擬加徵股票須條件變更送授審處或區域中心。","補倉／平倉比率依加權平均貸放成數 X：X < 60% → <b>140%／120%</b>；60% ≤ X < 80% → <b>120%／110%</b>；X ≥ 80% → <b>110%／105%</b>；補倉期限自掛號寄發次日 ≤ <b>5 個營業日</b>；部分解質後維持率仍須<b>高於補倉比率</b>。","代碼：貸款種類 <b>5D</b>、擔保內容 <b>85</b> 金融資產組合；外幣額度種類 27、擔保種類 3（多種擔保品不含股票）、擔保品內容 1M；定存單與股票由<b>轉介分行</b>辦理設質。","AML：撥貸資金及贖回／平倉款應匯入客戶<b>於本行留存帳戶</b>，不得匯入第三人或未約定帳戶；各階段異常應申報可疑交易。"]]],"nums":[["4 個月 / 6 個月","國內即期／遠期 LC 有效期限"],["10 天・180 天","即期 LC 墊付清償／續貸"],["20% / 50 萬","同一發票人集中度／另徵發票"],["45 日 / 30 日","Factoring 逾期買回／商業糾紛"],["8 成","預支價金"],["85%","出口託收/外幣週轉金貸放成數"],["6 成 / 5 成","上市／上櫃股票放款"],["120%","股票維持率"],["110%","備付本票"],["50 億","專案融資門檻"],["120–130%・<120%・<110%","受益權質借 接近補倉／補倉／平倉"],["5 次","同一投資標的最多設質次數"],["150%","倫巴底最高額度＝設質金額倍數"],["2 項以上","倫巴底擔保品組合類別"],["140/120・120/110・110/105","倫巴底補倉/平倉（成數 <60%、60–80%、≥80%）"]],"cnt":37,"yrs":{"110":6,"111":8,"112":6,"113":8,"114":9}},{"id":12,"t":"公文函令（2025–2026）","sub":"消金・法金・授審・債管・風管各處函令：樂活貸・倫巴底・保費/保單融資・專區・央行管控・債權憑證・綠色專案・加盟貸款・實價登錄自動比對・外部鑑價・轉催時點・青安 3.0・單一客戶 40%・視訊對保","w":"依說明內容出題・題幹標發文日期文號","notes":[["2025/03/31｜債劃字第000040號（債權管理處）",["法院發給之債權憑證：債權憑證、<b>本票裁定</b>、勝訴判決、<b>支付命令</b>、和解／調解筆錄、拍賣抵押物裁定、前置協商、更生、清算不免責債權表、<b>公證書</b>等執行名義。","已移交債管處／區域中心案件，時效將於 <b>6 個月內</b>屆期→主動借調正本換發，完成後歸還並<b>影印乙份</b>入卷。"]],["2025/10/08｜法劃字第000077號（法人金融處）",["進口週轉金外幣貸款無運送單據：到期日起算以<b>裝運日期</b>（無則簽發日）；免徵／補徵運送單據者改依<b>發票等最早簽發日</b>。","交易對手查證新增：<b>財報或年報揭露之進銷貨廠商資訊</b>。","出口後外幣貸款憑 <b>O/A</b>：徵發票、運送單據或通關證明，每筆在發票金額 <b>80%</b> 內；憑訂單、輸出契約或 O/A 隸屬「<b>丙類無擔保授信</b>」額度。","建檔交互比對<b>批覆條件、借據、端末建檔</b>；機動利率於重評日建妥「下次利率」。"]],["2025/10/17｜審劃字第000032號（授信審核處）",["自 <b>2025/10/20</b> 起工程週轉金循環額度敘明累計動用上限者，6402 欄位輸入「<b>Y</b>」並執行 <b>6409</b> 維護交易，以 6140 確認。","建檔有誤以 <b>6260</b> 代號 <b>70</b> 更正；已貸放未計入者以 <b>6300</b> 代號 <b>47</b> 更正為 Y。","每日指派專人列印 <b>LN6409 日報表</b>（無資料免印）；「**已逾上限」查明原因，處理情形陳核<b>副主管</b>。"]],["2025/11/11｜一總法劃字第009161號（總行）",["綠色永續金融優惠授信專案期間：<b>2026/1/1–2028/12/31</b>。","<b>永續績效連結授信</b>：5 核心因素（KPI 選定、目標檢驗調校、貸款屬性、執行回報、驗證）；利率減降最高 <b>0.05%</b>，且不得低於 MML 利率下限；勿以各指標均進步 <b>1%</b> 設 KPI。","<b>綠色授信</b>：4 核心要素（資金用途、評估與類別選擇、資金管理、執行回報），<b>不限產業別</b>。","移送信保案件整筆放款均適用移送信保利率（含<b>批次信保及農保</b>）；<b>工業用土地抵押貸款</b>及央行管控案件排除適用。","更優惠條件須申請區域中心或授審處核准；專案代碼 <b>P2</b> 綠色、<b>P3</b> 永續連結。"]],["2025/11/20｜一總法中字第009293號（總行）",["開辦「<b>連鎖企業加盟業者貸款</b>」，廢止個別加盟主專案，僅保留<b>全家</b>加盟主貸款。","加盟總部：設立滿 <b>3 年</b>、實收資本 <b>1 億元</b>以上；借戶及負責人無債票信不良。","創業資金設立登記後 <b>1 年內</b>申貸；額度依所需資金 <b>8 成</b>，每戶最高 <b>250 萬元</b>；期限最長 <b>5 年</b>（寬限期最長 <b>1 年</b>）。","利率：一年定儲機動＋<b>1.085%</b>；總部為本行授信戶或取得優良／卓越認證減碼 <b>0.15%</b>；手續費最高 <b>0.5%</b>、最低 <b>3,000 元</b>。","非十足擔保一律<b>移送信保</b>、<b>不得批次保證</b>；可分次動撥、<b>不得循環及借新還舊</b>；種類「<b>WW</b>」。"]],["2025/11/20｜審鑑字第000015號（授信審核處）",["以「房地時價總額鑑價」：停車位 <b>6 個以上</b>或車位鑑價占總額 <b>30% 以上</b>→應附 <b>3 則</b>可拆分出售之車位成交案例；其餘至少 <b>1 則</b>。","受託鑑價單位鑑價資料保存年限 <b>20 年→15 年</b>（配合徵授信卷宗保存 15 年）。"]],["2025/12/05｜法中字第000138號（法人金融處）",["建築業者（行業別 <b>41、67、68</b>）週轉金實際用於集合住宅興建，卻以「其他週轉金」申貸→未納入<b>銀行法 72-2</b> 控管（金控檢查缺失）。","實際用於興建→貸款種類「<b>31 建築貸款</b>」、資金用途「<b>33 其他營建資金</b>」。"]],["2025/12/16｜一總法劃字第009666號（總行）",["再生能源永續貸款開放購電方新增<b>企業電力承購商</b>：承購商與台電簽「<b>轉供契約</b>」、借款人與台電簽「<b>餘電購售契約</b>」。","借款人須為電能購售契約簽約人；簽約人非借款人但<b>擔任連帶保證人</b>者不在此限。","發電設備<b>至少每年勘查一次</b>；租地租約期間應<b>大於回收年限</b>並<b>法院公證</b>；太陽光電<b>非</b>銀行法 72-2 控管範圍。","售予企業承購商之售電價格應<b>高於台電躉售價格</b>，未達原則不予承作。"]],["2025/12/23｜法中字第000145號（法人金融處）",["自 <b>2025/11/20</b> 起個人非消費性貸款停用 <b>WD、WW、ZS</b> 加盟主貸款種類；增列「投資其他金融/非金融商品」用途。"]],["2026/01/06｜法劃字第000001號（法人金融處）",["銷售鏈融資／線上融資 e-Financing：買方款項匯入備償專戶應<b>即沖償借款</b>，不得退還至借戶活期帳戶。","關注動撥及入帳頻率與金額是否符合營運週期；異常徵兆（<b>動撥過於頻繁、入帳明顯減少</b>）應了解原因並審慎評估。"]],["2026/01/21｜一總審劃字第000348號（總行）",["「國內營業單位經理權限授信要點」修正，自 <b>2026/2/2</b> 實施（經 2025/12/26 常董會備查）。","受益權質借外幣得於<b>擔保授信權限</b>內承做（以賣出匯率折算新臺幣）。","公司卡：往來滿 <b>1 年</b>且評等 <b>1–7 等</b>者得單獨運用經理權限，不列入授信權限計算、不受關係戶歸戶限制。","<b>初任經理人到任半年內</b>：DBR 逾 <b>70%</b> 房貸及記帳士、代書、民間小額融資轉介案件→送總行或區域中心核定。","停權標準（逾放比率逾 <b>2%</b>）：商品停權 A <b>2,400</b>／B <b>2,000</b>／C <b>1,800</b> 萬；全部停權 A <b>3,000</b>／B <b>2,500</b>／C <b>2,300</b> 萬。","實施前已核准額度可用至屆期；嗣後案件依「<b>分行啟案日</b>」適用新規定。"]],["2026/01/23｜一總法劃字第000415號、一總消商字第000415號（總行）",["金管會 <b>115/1/12</b> 函同意試辦倫巴底、保費融資、保單融資；均<b>限高資產客戶</b>、限<b>新興分行</b>承作。","倫巴底：上限為設質金額 <b>150%</b>、可<b>再質借 2 次</b>；與受益權質借<b>擇一</b>、每人限 <b>1 案</b>；期限最長 <b>1 年</b>、按月繳息到期還本、<b>非循環</b>；擔保品須 <b>2 項以上</b>；收受新臺幣資產者額度限新臺幣。","倫巴底成數：定存 <b>90%</b>、上市股 <b>60%</b>、上櫃 <b>50%</b>、ETF/REITs <b>60%</b>、受益權 RR1–4 <b>70%</b>／RR5 <b>60%</b>、結構型及次順位債 RR1–4 <b>80%</b>／RR5 <b>70%</b>。","保費/保單融資僅限<b>個人戶</b>，借款人須為要保人且與<b>被保險人同一人</b>，保單須為合作保險公司之保單；鑑價由新興分行自辦。","新興分行承作專區業務<b>不受第二家授信往來無經理權限</b>之限制，惟須經<b>原往來分行同意</b>。","分潤：承作量及平均餘額<b>雙邊認列 100%</b>；提存後營業毛利專區 <b>30%</b>、轉介分行 <b>70%</b>。"]],["2026/01/26｜消商字第000003號（消費金融處）",["<b>保費融資</b>＝以本人為要保人及被保險人之<b>新購</b>保單擔保支付保費；<b>保單融資</b>＝以<b>既有</b>保單擔保取得資金；均須附加<b>融資批註條款</b>。","每筆額度<b>單一幣別</b>；新臺幣最低 <b>100 萬元</b>（萬元倍數）、外幣最低等值 <b>美金 3 萬</b>；經理權限內以<b>免保人信用貸款</b>方式辦理。","期限：保費融資最長 <b>10 年</b>、首次寬限期 <b>2 年</b>；保單融資最長 <b>1 年</b>且不得逾保單到期日；種類 <b>6D</b>／<b>7D</b>。","成數：保費融資依首期躉繳保費最高 <b>7.5 成</b>、不得逾首日解約金；保單融資依保價金或解約金<b>孰低</b>最高 <b>9 成</b>。","維持率＝保單解約金÷借款餘額；<b>95%–100% 連續 5 個營業日</b>→還款預警通知；<b>低於 95%</b>→還款通知，掛號次日起 <b>15 個營業日</b>內未償得主張期限利益喪失。","主張終止保險契約<b>無須借款人同意</b>；保險金匯入 <b>66 帳號</b>應<b>當日</b>沖償，幣別不同得前一營業日以 <b>NOC1</b> 鎖匯；抵銷前以<b>存證信函</b>寄發行使抵銷通知書。"]],["2026/01/26｜消商字第000005號（消費金融處）",["倫巴底受理對象限<b>高資產客戶</b>且徵妥【專區商品及服務申請書】；說明、審核、對保<b>僅限新興分行</b>。","徵提<b>自益特定金錢信託受益權</b>作擔保→應<b>錄音</b>保留紀錄。","最低申貸：新臺幣 <b>100 萬</b>、外幣 <b>美金 3 萬</b>；再質借幣別須相同；新興分行須先電洽消金處<b>登記額度</b>。","擔保品<b>一次設足、不得分批設質</b>；定存單／股票由<b>轉介分行</b>設質保管，受益權／結構型／次順位債由<b>新興分行信託經辦</b>建檔。","補倉／平倉：X&lt;60% → <b>140%／120%</b>；60%≤X&lt;80% → <b>120%／110%</b>；X≥80% → <b>110%／105%</b>。","每月以<b>綜合業務對帳單</b>通知；低於補倉→補倉通知書，掛號次日起 <b>5 個營業日</b>；低於平倉（**）→平倉／期限利益喪失通知。"]],["2026/02/13｜一法劃字第000762號、一消商字第000762號（法人金融處、消費金融處）",["專區受益權質借：受理、說明、風險揭露、審核、簽約對保<b>均僅限新興分行</b>；轉介分行僅得概括性說明、轉介、<b>代收文件及傳遞</b>。","核對親簽及對保原可由消金處、區域中心、CA 辦理 → 調整為<b>僅限新興分行</b>；「說明人」欄僅新興分行蓋章。","協訪申請書廢止，改用<b>【轉介/對保申請書】</b>；專區僅得使用貸款申請書 <b>C 款</b>。"]],["2026/02/24｜債劃字第000025號（債權管理處）",["債管處函布「逾期放款案件查找財產暨執行作業應注意事項」，避免過度或不當措施影響客戶權益。","查調時點：逾期 <b>1 個月內</b>仍未回復正常或辦妥展期；取得<b>假扣押裁定</b>後；取得<b>執行名義</b>或債證中斷時效時；債管處指定時。","本行財產查調：端末 <b>A087</b>，填「借保戶存放於本行之財產情形調查表」（<b>12 項表</b>）；另可申請國稅局查調財產所得。"]],["2026/02/26｜一總消商字第000867號（總行）",["<b>樂活貸</b>單一循環型契約期限一般以 <b>3 年</b>為一期；<b>高資產客戶／專業投資人</b>且資金用途承作「<b>珍愛傳承</b>」信託者得以 <b>5 年</b>為一期。","對象：成年本國國民、房貸評等<b>低風險等級</b>，且為高資產、專投或年收入 <b>50 萬元</b>以上；屆期得同內容續約<b>不另換約</b>，惟<b>徵一般保證人者屆期應另訂新約</b>。","系統自 <b>2026/3/6</b> 上線。"]],["2026/03/02｜審劃字第000009號（授信審核處）",["多家企業授信戶負責人<b>互為保證人</b>、營運性質相同、進銷貨<b>高度重疊</b>或家族共同經營→於授信申請書<b>補充說明段</b>揭露關聯性。","保證人以具<b>共同經濟利害關係</b>者為原則（負責人、配偶、董監事、主要股東、經營階層），避免浮濫或無實益保證人。","應收款及存貨甚鉅→查是否放寬收款或隱藏呆帳；與本業無關之投資應瞭解交易內容。"]],["2026/03/17｜消商字第000014號（消費金融處）",["倫巴底（個人消費性）授信權限以「<b>倫巴底核准最高額度</b>」計算審查權限。","核准最高額度＝設質金額 <b>150%</b>；例：鑑價 2,500 萬→上限 <b>3,750 萬</b>，逾新興分行個人擔保經理權限 <b>2,400 萬</b>→屬<b>區域中心</b>權限。"]],["2026/03/18｜消商字第000015號（消費金融處）",["5 年一期者額度應<b>依信託商品承作金額</b>申請（承作 3,000 萬申請 5,000 萬→改 <b>3 年</b>一期）。","核准有效期限及每次可貸放期限：<b>36 個月</b>或 <b>60 個月</b>（5 年一期）；續約仍須符合客群及用途，否則重新議定 3 年一期。","LN33 日報表新增註記說明 5；借款契約<b>消放904</b>須<b>彩色列印</b>。"]],["2026/03/18｜審劃字第000011號（授信審核處）",["對保：借款人及保證人分別徵<b>印鑑卡、約定書</b>，保證人另徵<b>保證書</b>；約據<b>親簽及蓋章</b>，留存加註「限辦理第一銀行徵授信使用」之身分證影本。","查身分證遺失補領：戶政司網站或聯徵 <b>Z21</b>，結果<b>列印存卷</b>；印鑑卡逐一編列放款帳號於<b>印鑑暨影像管理系統</b>建檔。","更換印鑑申請書 <b>放155</b> 簽章須與新印鑑卡右下方相符，正本置<b>擔保袋</b>；住址變更另徵 <b>存215A</b>。","獨資戶負責人更換→對舊債向新負責人主張須另徵<b>新負責人保證書</b>；合夥人變更→重徵<b>全體合夥人同意書</b>。"]],["2026/03/20｜消商字第000016號（消費金融處）",["自 <b>2026/1/21</b> 起新申辦專區客戶應於<b>新興分行</b>開戶：原則於轉介分行開戶後<b>轉籍移入</b>。","先確認為專區客戶或擬簽申請書，始得填【<b>轉介/對保申請書</b>】：倫巴底須具 <b>2 項以上</b>合格資產；保費/保單融資依保代處保險專案；受益權質借須已持有本行受益權。"]],["2026/03/26｜消商字第000017號（消費金融處）",["問答集供<b>消金專員／理財顧問</b>參考；115/3/23 新臺幣利率 <b>2.34%–2.54%</b>，美元 3M TAIFX＋<b>1.5%</b> 起（約 5.66%），每 3 個月調整。","保費融資最長 <b>10 年</b>；首次寬限期 <b>2 年</b>，屆滿仍需→申請<b>區域中心</b>變更條件展延。","簽立保險契約<b>當日</b>可同步約訪新興分行填貸款申請書；維持率 &lt;95% 僅須<b>償還部分借款</b>。","自備款不足可辦樂活貸、倫巴底、保單融資，均屬<b>專款專用</b>、不得再質借；倫巴底可<b>再質借 2 次</b>且每人限 <b>1 筆</b>，建議優先以<b>保單融資</b>補足。"]],["2026/03/27｜債劃字第000043號（債權管理處）",["放款約定書自 <b>2026/4/1</b> 啟用；逾放戶圈存須徵有「約定書（放002）」<b>2026.2 第 18 版</b>，未徵妥<b>不得對將來存款預先圈存</b>。","圈存後抵銷仍應發<b>抵銷函</b>；抵銷自通知到達後<b>溯及最初得為抵銷時</b>生效；抵銷款應即沖抵借款，<b>勿留置</b>預收款分戶。","聯行圈存／解除以<b>業務聯繫單</b>洽原開戶行辦理。"]],["2026/04/07｜消商字第000020號（消費金融處）",["央行不動產抵押貸款規定修正，溯自 <b>115/3/20</b> 生效：自然人<b>第 2 戶</b>購屋貸款 <b>5 成→6 成</b>，無寬限期。","維持不變：高價住宅 <b>3 成</b>、第 3 戶以上 <b>3 成</b>（均無寬限期）；名下有房第 1 戶無寬限期；購地 <b>5 成</b>保留 <b>1 成動工款</b>並切結動工。","e-loan 央控案件類型 <b>20 項</b>；按月報送央行，貸放後<b>立即</b>填報，漏填最遲<b>當月月底</b>前完成。"]],["2026/04/23｜消商字第000024號（消費金融處）",["專區「<b>案件申請</b>」階段得以<b>電話錄音</b>說明商品與揭露風險：轉介分行<b>親訪</b>客戶、新興分行授信人員透過錄音系統致電說明。","客戶於申請文件簽蓋<b>任一原留印鑑</b>，由新興分行核章；「<b>核准後對保</b>」仍由新興分行<b>親訪對保</b>。"]],["2026/04/29｜一法劃字第001838號、一消商字第001838號（法人金融處、消費金融處）",["受益權質借電話錄音：以錄音類別<b>第 4 類</b>（其他業務及外匯放款）及<b>第 7 類</b>（受益權質借）留存。","新興分行依規定填列<b>錄音序號</b>並辦理核章；個人消費性洽消金處、企業及個人非消費性洽法金處。"]],["2026/04/29｜一總消商字第001818號（總行）",["保費融資<b>刪除</b>「保單幣別與借款幣別不同再減降 0.5 成」→成數最高皆 <b>7.5 成</b>，不得逾<b>保單首日解約金額</b>。","新增還款方式「<b>按月繳息、到期一次還本</b>」（原僅年金法／本金法）；寬限期改列「償還方式及寬限期」項下。"]],["2026/04/30｜法劃字第000033號（法人金融處）",["專區授信試辦「案件申請」階段，法金倫巴底貸款亦得以<b>電話錄音</b>辦理商品說明與風險揭露：轉介分行親訪客戶，新興分行授信人員透過錄音系統致電說明並留存紀錄。","客戶於申請文件簽蓋任一原留印鑑，由新興分行核章；「案件核准後對保」仍由新興分行<b>親訪對保</b>。","法金倫巴底合格擔保品限高資產客戶本人持有之金融資產組合 <b>2 項（含）以上</b>：定存單（自動轉期實體存單、不含綜存）、國內上市櫃股票（含 REITs、ETF）、本行自益受益權、保本型結構型商品、國內金融機構次順位債。"]],["2026/05/05｜消商字第000026號（消費金融處）",["貸後管控：自貸放後<b>第 5 個營業日起一個月內</b>至保險業務系統確認保單已完成<b>融資註記及註記日期</b>，更新擔保品資料。","應<b>留存保險公司已完成批註之佐證文件</b>備查。"]],["2026/05/12｜消商字第000028號（消費金融處）",["安心貸借款人死亡：端末 <b>6300-93</b> 安心貸暫停撥款註記登打「<b>Y</b>」。","繼承期間正常繳息→<b>得暫不主張債務到期</b>；辦妥繼承後由繼承人申請「<b>消費性擔保貸款（NR）</b>」償還原借款並重新設定抵押權；未正常繳息→主張到期、法催拍賣。","繼承人正常繳息但不願變更借款人→須<b>書面通知送達新所有權人</b>後始得主張到期。","行銷激勵：每件獎勵金 <b>2,000 元</b>；達 <b>2 件</b>以上且全行前 <b>18 名</b>嘉獎 1 次。"]],["2026/05/27｜審劃字第000022號（授信審核處）",["中小企業往來<b>未滿一年即逾放</b>之共同態樣：多家<b>資本額偏低、成立未滿一年</b>新設公司；營收與資本額不相當；負責人不動產有<b>民間融資</b>抵押；保證人非實際經營者；核貸後<b>同時向同業大幅舉債</b>；未落實案源建檔。","記帳士、代書或外部轉介案件：<b>慎選案源、實地訪查</b>，授信申請時務必<b>落實案源建檔</b>。"]],["2026/06/03｜一風信字第002420號、一法中字第002420號（風險管理處、法人金融處）",["缺失：集合住宅興建工程以「<b>經常性週轉金</b>」申貸未計入 72-2；危老已核定未由 FE 改 FH；個人非消費性 <b>ADC</b> 額度用途建檔不一致。","都更／危老前期週轉金核定後，貸款種類由 <b>FE</b> 改為 <b>F9</b>（都更）或 <b>FH</b>（危老）。","個人非消費性資金供投資事業興建建案（33 其他營建資金）屬 <b>ADC</b>，額度用途勾「<b>7</b>」或「<b>8 其他(ADC)</b>」；端末 <b>6407</b> 須與批覆書一致。"]],["2026/06/17｜審劃字第000026號（授信審核處）",["委託第三人領取塗銷文件：出具<b>委託書</b>、影印受託人身分證，於權利證件授受登記簿簽名註記「<b>代領</b>」，經辦及主管蓋章後交付。","無法出具委託書：依內政部 <b>60.3.27 台內地字第 407571 號</b>函釋，抵押權拋棄塗銷<b>無須債務人同意</b>，本行得逕向地政機關辦理。","塗銷全部抵押權前應查明所擔保之授信或<b>衍生性商品交易</b>是否已全數清償。"]],["2026/06/22｜審劃字第000028號（授信審核處）",["融資租賃公司授信：於「借款戶分析」揭露放款對象是否涵蓋<b>不動產業者</b>及其占比。","本次用途非屬不動產融通→試算週轉金需求時<b>扣除對不動產業融資占比</b>後匡計資金缺口。"]],["2026/06/26｜債劃字第000073號（債權管理處）",["債權憑證逐筆登載實體及逾催系統「<b>債權憑證登記簿</b>」；催收主管保管正本並<b>每半年</b>檢視時效。","檢視時同時列印「<b>債證到期提醒</b>」表，新增「<b>處理情形</b>」欄；逾時效消滅日應說明理由；主管覆核後呈核至<b>營業單位經理</b>。"]],["2026/06/29｜法中字第000048號（法人金融處）",["青年創業貸款修正自 <b>2026/7/1</b> 生效：歸戶 <b>150 萬元以下</b>部分信保成數 <b>9.5 成</b>。","150 萬以下僅得徵<b>代表人或負責人</b>為保證人，逾 150 萬以 <b>1 人</b>為原則；申請 150 萬以下得以<b>申請表取代計畫書</b>。","移送信保<b>僅得移送「青年創業貸款」方案</b>。"]],["2026/06/30｜審鑑字第000013號（授信審核處）",["自 2026/7 起不動產新買賣案件回查實價登錄：OnDemand「LN1020」免再列印，改由消金 e-loan 整批自動比對，產出「<b>RT00004</b>」月報；按月列印、設專卷保存 <b>2 年</b>。","專人於<b>每月第五個營業日</b>列印 RT00004（拍賣取得者除外）：結果「符合」→免逐筆查證，勾選結案；「查無／不符合」→經辦逐筆查驗，<b>貸放後 2 個月之月底日前</b>完成實價登錄網站查證（例：5/8 貸放→7/31 前）。","登記簿起案後核對謄本與「產權明細」文字完全一致（如「6」與「六」），且<b>務必於貸放日前結案</b>。","網站查無→請客戶提供各期價金支付證明，與買賣總價完全相符得視同相符；不符或查無且借戶拒提金流佐證→<b>分行經理召集授信審議小組</b>討論因應（取消寬限期、改信用科目、補擔保品等）並留存紀錄；金額差異大且不合理得依加速條款收回。","查證資料放授信卷宗右側「貸放後管理資料」，<b>塗銷前永久保存</b>；僅有申報留底聯或電話詢問地政機關者，仍須依支付證明／審議程序處理。原 2021/12/07 審鑑字第00027號函作廢。"]],["2026/07/07｜審劃字第000033號（授信審核處）",["修正「授信審查作業應行注意事項」：增訂<b>購置船舶或航空器貸款</b>要項——借戶為 SPC／SPV 應揭露母公司營運財務或主要股東資力，必要時加徵母公司或主要股東為<b>連帶保證人</b>。","應徵買賣契約審閱付款條件、權益轉讓、交付時點及違約條款；中古船舶／航空器應評估耐用年限及改裝工程，交付前宜取得<b>第三方使用驗證報告</b>（適航性）。關係人間交易應評估價格合理性並揭露賣方原始取得價款。","擔保物權文件至遲於<b>交付時</b>簽署生效並同時辦妥抵押權設定，設定完妥後始得憑發票撥款；未設定即須動撥前置款→確認自有資金到位，借戶出具所有權移轉之法律意見書及已用印之抵押權設定文件。","應收帳款融資（承購、國內應收帳款貸款、線上融資、台塑網、銷售鏈融資等）增貸或續貸：於「營業單位信用綜合評估表」資金用途段揭露<b>過去一年承作量、帳齡分析及入帳情形</b>。","配合設置審計委員會刪除常駐監察人參與討論規定；融資租賃業另依專屬注意事項。"]],["2026/07/09｜債劃字第000078號（債權管理處）",["逾放（含呆帳）債務人申請和解或分期攤還：催收單位先評估擔保品價值、還款能力、履約紀錄，再由債務人提出和解申請書或分期償還申請書（徵有保證人者<b>應經保證人簽章</b>）。","擬減免利息、訴律費、手續費逾授權範圍或<b>擬減免本金</b>者，以「處理逾期放款申請／報告書」事先申請總行審核。","批覆後逾催系統留存於催收日誌並以 e-mail 通知經辦及主管；催收人員將批覆結果通知債務人並登載日誌，定期追蹤履約。","收回款項當日先暫入「<b>其他預收款—預收放款延滯案款項</b>」；債務人申請免除保證（票據）責任→點選「新增和解執行評估表」並事先申請債管處審核。"]],["2026/07/23｜消商字第000044號（消費金融處）",["自 2026/7/23 起第 e 數速貸平台新增「<b>疑遭詐騙客戶名單</b>」（端末 <b>9754</b>）及「疑似涉詐帳號」檢核。","身分證字號比對相符→改<b>人工審核</b>，由線上行銷部（TM）加強關懷，仍須承作者於「營業單位補充說明」敘明理由；身分驗證留存之他行帳號與疑似名單受款帳號相符→<b>不予進件</b>。"]],["2026/07/27｜一總審鑑字第003230號（總行）",["修正「擔保品鑑價作業要點」：不動產外部鑑價報告——台北市、新北市鑑價 <b>5 億元</b>以上、其他地區 <b>3 億元</b>以上始得徵一份；達 <b>20 億元</b>以上不分地區應徵<b>二份</b>，均委託本行認可機構。","營業單位填「不動產外部鑑價報告提送單」送鑑價單位（授審處或區域中心）於「檢核表」簽註，以<b>鑑價單位核定結果</b>為最終鑑價金額；副總經理（含）以上審查權限且鑑價單位為區域中心者，另送授審處覆核。","動產：新購全新動產以購置（製造）成本認定，成數最高 <b>7 成</b>、免外部鑑價；非全新動產鑑價未達 10 億徵一份、達 <b>10 億</b>以上徵二份採孰低。","新購中古動產以成本與外部鑑價孰低、最高 <b>5 成</b>；既有動產以成本扣累計折舊最高 7 成、或依外部鑑價最高 5 成；擬提高（最高仍 7 成）須申請總行或區域中心核准。","聯貸動產：本行統籌主辦且為擔保品管理行→除全新動產外應徵一份外部鑑價報告，經核准後得逕編調查表；重估依聯貸合約。"]],["2026/07/27｜一債劃字第003239號、一審劃字第003239號（債權管理處、授信審核處）",["承作涉及高度專業或複雜採購之專案履約保證或週轉金：應審慎評估借戶資力、背景及人脈資源是否足以履約，並確保自有資金來源、付款條件與償債能力。","知悉授信戶有突發危機事件或媒體負面消息→<b>第一時間以電話通知授審處所屬審核副理</b>，再依審查權限填製危機處理報告通報。","清償前持續關注產業、經營者、財報、現金流量；符合「授信預警徵兆」→評估<b>未來十二月內</b>是否可能違約及是否通報預警戶。"]],["2026/07/29｜消商字第000048號（消費金融處）",["青安貸款 3.0：辦理期限 <b>115/8/1～118/7/31</b>（撥款不得逾 118/10/31）；申貸時<b>未滿 50 歲</b>且申貸年齡加核貸年限不得逾 <b>80</b>；本人年所得 ≤ <b>200 萬元</b>。","住宅鑑價或買賣總價（取孰高）上限：臺北市 <b>3,500 萬</b>、新北市及新竹縣市 <b>2,500 萬</b>、其他 <b>2,000 萬</b>。","額度最高 <b>1,000 萬</b>；申請日前 2 年內結婚之新婚家庭 <b>1,200 萬</b>（分 1,000 萬與 200 萬二案）；育有未成年子女 <b>1,500 萬</b>；採<b>一段式機動利率</b>（取消二段式及混合式）。","利息補貼：所有貸款戶滿 3 年補貼 <b>2 碼</b>（政府 1.5 碼＋銀行減收半碼），之後每年減少半碼；e-loan 依「未補貼」利率建檔（郵政 2 年期定儲機動＋0.555%），手續費「能收則收」。","Q&A：一人一次購買二屋不可適用；借款人須為擔保物提供人且按建物持有比率核貸；權狀主要用途須含「住」「住宅」「套房」或「公寓」。"]],["2026/07/30｜一總消商字第003316號、一總法劃字第003316號（總行）",["自 2026/8/1 起「單一分行內單一客戶授信限額」比率上限由 45% 調降為 <b>40%</b>，<b>聯貸案納入</b>適用範圍。","自貸案：轉介行承作不逾 40% 部分，逾限部分轉介指定接受單位；聯貸案：加計新案逾 40%→新案<b>全數</b>轉指定接受單位（北一區南京東路、北二區營業部、新竹、台中、台南、高雄分行）。","退場機制：現行額度逾 40% 者，<b>緩衝期 2 年</b>內逐步調降；轉介後 18 個月內分潤（營運量、利收、呆帳提存轉出行 7 成／接受單位 3 成；企貸手收、統籌主辦費、統籌管理費轉出行 10 成）。","轉介行自轉介日起 <b>18 個月</b>內仍負責客戶維繫及徵授信文件；轉介 12 個月後半年內每 <b>2 個月</b>帶指定接受單位外訪一次。"]],["2026/08/14｜消商字第000053號（消費金融處）",["專區授信「案件核准後對保」得採<b>電話錄音暨視訊</b>對保：轉介行以「轉介/對保申請書」預約，專區人員以錄音系統說明額度、條件、借據重要條款及風險。","轉介行人員以 Line、FaceTime、Teams 協助視訊連線，借款人於鏡頭前出示身分證明；轉介行人員現場見證簽署，專區人員<b>截圖留存</b>簽署畫面。","轉介行人員及主管於「銀行專用欄」核對親簽欄蓋章；專區人員於「對保人蓋章」欄蓋章並填載<b>錄音序號</b>，其他約據加蓋「視訊對保」字樣。","倫巴底及受益權質借限以信託帳號（業務別 <b>68 或 88</b>）項下標的設質，iLEO（57）不得設質；補足保費融資自備款之貸款屬專款專用、不得再質借。"]],["2026/08/20｜一法劃字第003649號、一消商字第003649號（法人金融處、消費金融處）",["受益權質借之錄音暨視訊對保<b>僅開放個人消費性貸款</b>；企業貸款及個人非消費性貸款仍維持<b>實體對保</b>。"]],["2026/08/21｜消商字第000054號（消費金融處）",["青安新婚家庭 1,200 萬：分 1,000 萬與逾 1,000 萬二案，逾 1,000 萬鍵專案代號「<b>A121A</b>」；育有未成年子女 1,500 萬（撥貸日子女仍未成年）：逾 1,000 萬鍵「<b>A121B</b>」。","中途還款應<b>優先償還逾 1,000 萬元額度</b>；撥款前新婚者查身分證換補領紀錄確認仍已婚、育兒者確認子女撥貸日仍未成年，方可撥逾 1,000 萬部分。","115/8/1 起申辦之青安 3.0 案件，借款人應簽新版切結書；同步抽換「央行管控案件」查核控管表。"]],["2026/08/26｜消商字第000055號（消費金融處）",["自 2026/8/28 起消金 e-loan 授信申請（含條件變更）屬<b>利害關係人擔保貸款</b>者，系統自動新增「利害關係人與非利害關係人授信條件比較表」並帶入本筆條件。","消金經辦逐項填入非利害關係人（同類授信對象）資料，確認<b>未優於</b>同類授信對象後併案呈核；案例置於行員專用系統/下載專區。"]],["2026/09/08｜審劃字第000053號（授信審核處）",["借款決議錄目的：避免未參與作保之董事（股東）日後否認借款事實。","股份有限公司董事改選成員異動，原決議錄<b>效力不因董事會成員變更而受影響</b>；實務徵取困難者，得於<b>原決議錄授權期限屆滿</b>或<b>嗣後辦理額度申請時</b>再行徵取。"]],["2026/09/15｜審劃字第000056號（授信審核處）",["授信申請（含展期）時，借戶<b>最近六個月內</b>有現金增資→應查證增資款並於「營業單位信用綜合評估表」其他補充說明段揭露；匯存本行者檢視變更登記後<b>一個月內</b>是否移轉、匯回負責人或關係人帳戶。","以發票、訂單、合約憑貸→查證交易對手、內容及履約情形，並比對市場價格或同業行情確認真實性。","同時承作前端購料（進口／購料週轉金）及後端銷售（墊付國內票款、應收帳款融資、押匯、出口週轉金）額度→防<b>重複融資</b>；限憑銷貨文件動撥者，<b>貸放時應優先收回購料額度</b>之貸款餘額。"]],["2026/09/15｜法劃字第000076號（法人金融處）",["「額度核定通知書（2026.8 版）」共三聯，僅於「<b>留底聯</b>」登打內容，列印即產出留底聯、借戶收執聯、回執聯；留底聯<b>裁決至經理同意</b>後，主管於收執聯蓋腰形章連同回執聯寄交借戶。","借戶於回執聯蓋妥授信往來印鑑寄回，與留底聯併授信批覆書存卷；無法取得→以<b>雙掛號</b>郵寄收執聯，郵政回執與留底聯存卷。","存單質借、公司卡、聯貸、條件變更、利（費）率變更得視需要核發；徵提一定比率存款設質者務必於通知書敘明。"]],["2026/09/24｜消商字第000060號（消費金融處）",["央行不動產抵押貸款規定修正，<b>溯自 115/9/18 生效</b>：自然人<b>第 2 戶購屋貸款 6 成→7 成</b>，無寬限期。","購地貸款：維持 5 成、保留 1 成動工款並檢附具體興建計畫，<b>刪除「切結於一定期間內動工興建」</b>。高價住宅 3 成、第 3 戶以上 3 成、名下有房第 1 戶無寬限期均維持不變。","115/9/17（含）前已錄案未撥款→適用錄案時規定，但第 2 戶及購地得適用修正後規定；已撥款之第 2 戶得比照新成數洽原貸行增貸（不得寬限期）。","e-loan 央控案件類型擴增為 <b>24 項</b>（23-全國第 2 戶 7 成；24-全國第 2 戶先買後賣）；貸放後次日列印 OnDemand「<b>LN21 日報</b>」至行員專用系統填報，漏填最遲當月月底前完成，LN21 裁決至經理留存。","LN21 未揭露央控類型→檢查 e-loan 與端末擔保品編號是否一致，不符執行「條件變更」重新引進；代書轉介案件須至內政部網站查詢合格地政士並列印留存。"]],["2026/09/29｜債劃字第000125號（債權管理處）",["主張加速條款視為全部到期，或新發生本金或利息逾期未繳→應於<b>逾期 3 個月內</b>全案轉列催收款項。","評估可於 3 個月內辦妥展期、還款或繳清欠息→得申請債管處核准暫緩轉催，評估及暫緩期間合計<b>不得超逾清償期屆滿 6 個月</b>。","全案授信餘額達 <b>3,500 萬元（含）</b>以上擬轉催→應申請債管處同意。","每月 <b>5 日</b>列印「放款逾期將(已)屆六個月客戶清單」（<b>LP-L29</b>）：非協商案無法於當月清償、展期或繳息一個月以上→當月底前轉催；協商案毀諾者，最遲於<b>毀諾期間達 2 個月之當月底前</b>轉催；違規予以行政效率扣分。"]]],"nums":[["RT00004","實價登錄自動比對月報（每月第 5 營業日、保存 2 年）"],["5 億／3 億／20 億","不動產外部鑑價門檻（20 億徵二份）"],["7 成／5 成","全新動產／中古動產成數上限"],["6 個月・1 個月","現金增資查證期間／增資後移轉檢視"],["3 個月・6 個月・3,500 萬","轉催時點／暫緩上限／須債管處同意"],["7 成","央行第 2 戶購屋貸款（115.9.18 起）"],["40%","單一分行內單一客戶授信限額（115.8.1 起）"],["3,500／2,500／2,000 萬","青安 3.0 房價上限"],["A121A／A121B","青安逾 1,000 萬（新婚／育兒）專案代號"]],"cnt":0,"yrs":{"110":0,"111":0,"112":0,"113":0,"114":0}}],"pq":[{"id":"110-1","y":110,"n":1,"m":1,"q":"中央銀行對於「公司法人購置住宅貸款」管控最新規定，下列敘述何者錯誤？","o":["購置住宅貸款：指購買建物權狀含「住」字樣之高價住宅貸款及購屋貸款","不得有寬限期","貸款額度最高不得超過鑑價或買賣金額較低者之四成","貸款額度不足時，得另以修繕、週轉金或其他貸款名目，額外增加貸款金額"],"a":3,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"1.不得有寬限期。2.<mark>貸款額度</mark>最高不得超過住宅（含基地）鑑價或買賣金額較低者之三成。3.除前款<mark>貸款額度</mark>外，不<mark>得另以修繕、</mark>周<mark>轉金或其他貸款名目，額外增加貸款金額</mark>。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第9頁","v":37,"t":"<mark>公司法人購置</mark>不動產者，期限最長二十年，但對於無自用住宅者購買自用住宅之放款不在此限。營業單位承作<mark>公司法人購</mark>買建物權狀含有「住」字樣之<mark>住宅貸款</mark>(指購置高價<mark>住宅貸款</mark>及購屋貸款)，其貸款條件限制如下：(1)無寬限期(2)<mark>貸款額度</mark>最高不得超過住宅（含基地）鑑價或買賣金額較低者之三成(3)除前款<mark>貸款額度</mark>外，不<mark>得另以修繕</mark>、周<mark>轉金或其他貸款名目</mark>，<mark>額外增加貸款金額</mark>。"},"x":"依講義〈授信商品及應注意事項〉第9頁：「營業單位承作公司法人購買建物權狀含有「住」字樣之住宅貸款(指購置高價住宅貸款及購屋貸款)，其貸款條件限制如下：(1)無寬限期(2)貸款額度最高不得超過住宅（含基地）鑑價或買賣金額較低者之三成(3)除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額。」","t":"neg"},{"id":"110-2","y":110,"n":2,"m":1,"q":"公司法人(借戶)購置住宅供該公司營業使用者，得排除中央銀行「公司法人購置住宅貸款」管控之規定，下列敘述何者錯誤？","o":["營業單位實地查核該建物確實供借戶公司營業用，如有出租或部分出租他人亦可適用","確認借戶公司已於該建物辦理設立登記","徵取建物所在地之地方政府法令規定該建物可供營業使用之證明","徵取「切結書」並切結於購置建物半年內辦妥設立登記者"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"1.惟如建物所在地之地方政府法令規定該建物可供營業使用，且借款人主張該建物主要用途實際供借款人本人營業用(出租除外)並有設立登記(或切結於購置建物半年內辦妥設立登記)，經金融機構<mark>實地查核</mark>屬實並落實借款人切結事項者，得排除本規定之適用。"},"t":"neg"},{"id":"110-3","y":110,"n":3,"m":11,"q":"辦理「應收客票週轉金貸款」應填製「客票融資審核工作單」，下列敘述何者錯誤？","o":["會計項目為「17426短期放款-票借短放」案件，應逐筆於核貸前填製","簡易票貼，係提供中心廠之票據辦理交易性融資，惟仍應填製工作單","倘審查結果與作業規範不相符者，應確認相關條件已經授信審核處或區域中心核准，且於空白處註記說明","本工作單應由副理及防制洗錢督導主管覆核，併同核貸單呈轉經理"],"a":1,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第二節 貸放","t":"3、<mark>簡易票貼</mark>、線上融資e-financing（融資項目為應收票據）係提供本行認可<mark>中心廠之票據辦理交易性融資，</mark>風險較低，可排除「客票融資審核工作單」之填製，以簡化作業。"},"t":"neg"},{"id":"110-4","y":110,"n":4,"m":11,"q":"辦理一般保證業務，下列敘述何者錯誤？","o":["預開保證書時，保證期間應包含預開天數及銀行保證天數","人力仲介業委託簽發「保證金保證書」，應申請授信審核處或區域中心核准","申請聘僱外籍勞工之「保證金保證書」，未經勞動部勞動力發展署通知解除，仍得中止本行保證責任","一案有多筆保證之工程保證案件，應逐案填寫「工程類保證書控管明細表」"],"a":2,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第四節 保證責任之解除及展延","t":"(三)填製「放款貸放資料變更登錄單」（放516），執行「放款貸放資料變更」(6300)交易，延長應收保證款項到期日。(四)<mark>申請聘僱外籍勞工</mark>委託本行出具<mark>之「保證金保證書」，</mark>本行所負<mark>保證責任</mark>，非經行政院<mark>勞動部勞動力發展署通知解除</mark>仍不中止。故營業單位應於帳載到期日前，函詢<mark>勞動力發展署</mark>是否解除<mark>本行保證責任</mark>，並視其函復內容，辦理相關手續。"},"t":"neg"},{"id":"110-5","y":110,"n":5,"m":7,"q":"有關信保基金保證手續費，下列敘述何者正確？","o":["保證手續費之計收依送保授信之保證金額，按年費率及移送保證期間，以「月」為單位計算","保證手續費以一次計收為原則，中、長期授信得逐年計收","應於授信翌日起7日內存入信保基金指定之帳戶","展延或分期償還保證案件，應於原清償期到期之日後三個月內或信保基金指定之期限內匯繳"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"肆、保證手續費","s":"肆-3","t":"(二)保證手續費以一次計收為原則，<mark>中、長期授信得逐年計收。(三)保證手續費率於移送保證時即確定</mark>，嗣後逐筆動用、展延、分期償還、變更分期償還、逾期期間保證手續費之計收等，均不再調整費率。"},"x":"依信保作業手冊肆、二：手續費以<b>一次計收</b>為原則、中長期得逐年計收；按年費率及移送期間以「<b>日</b>」計算（年費率÷365，單筆未達 500 元以 500 元計）；授信翌日起 <b>7 個營業日</b>內匯存；展延或分期償還案件於原清償期到期後 <b>2 個月</b>內匯繳。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"肆、保證手續費","v":54,"t":"二、計收方式有關<mark>保證手續費</mark>之計收，除另有規定者外，皆依下列方式辦理：(一)<mark>保證手續費</mark>依送保授信之保證金額，按年費率及移送保證期間，以「日」為單位計算（按年費率除以三六五）。單筆授信之<mark>保證手續費</mark>未達五百元者，以五百元計收。(二)<mark>保證手續費以一次計收為原則</mark>，中、<mark>長期授信得逐年計收</mark>。"},"t":"ask"},{"id":"110-6","y":110,"n":6,"m":7,"q":"有關「深化中小企業專案貸款」要點，下列敘述何者錯誤？","o":["貸款對象為依法辦理公司登記、商業登記、有限合夥登記且營運正常、無債票信不良紀錄之中小企業","資金用途包括短、中期週轉融資及資本性支出融資","中期週轉融資得以循環額度辦理","借款人實收資本額大於新臺幣3,000萬元(含)以上者，得適用更優惠利率"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十四節 深化中小企業專案貸款","t":"(四)本貸款之<mark>中期週轉融資</mark>及資本性支出融資限以非<mark>循環額度辦理</mark>。(五)其他未盡事項，悉依本行徵授信及其他相關規定辦理。十、本貸款經總經理核定後實施，修正時亦同。"},"t":"neg"},{"id":"110-7","y":110,"n":7,"m":7,"q":"有關「微型創業鳳凰貸款」，下列敘述何者錯誤？","o":["資金用途為購置或租用廠房、營業場所、機器設備或營運週轉金","貸款額度最高新臺幣200萬元，惟僅辦理稅籍登記者以50萬元為限","貸款期限最長5年，首年得給予寬限期","信保基金保證9.5成，免徵提其他擔保品，惟貸款人與承貸金融機構合意徵提擔保品者，得免向信保基金辦理信用保證"],"a":2,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第二節 微型創業鳳凰貸款","t":"三、用途：購置或租用廠房、營業場所、機器設備或營運週轉金。四、額度：最高新台幣200萬元，惟僅辦理稅籍登記者以50萬元為限。"},"t":"neg"},{"id":"110-8","y":110,"n":8,"m":4,"q":"本行110.1.1核准法人授信戶(循)短放新臺幣(以下同)10,000仟元，徵取借戶董事長A及董事B為保證人，110.2.2貸放一筆2,000仟元，110.3.3借戶通知保證人B已卸任該公司董事且未簽立續任保證人同意書，110.4.4貸放一筆4,000仟元，下列何者正確？","o":["保證人B對2筆貸放皆不負保證責任","保證人A僅對110.2.2之貸放負保證責任","僅保證人A對110.4.4之貸放負保證責任","需向保證人A徵取「代位清償人同意書」"],"a":2,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"1.有徵取保證書者：(1)於卸任時已簽立「續任保證人同意書」，其展期約據得採蓋章(與放款印鑑一致，以下同)或親簽加蓋章方式辦理，採後者較為嚴謹，原則儘量採用。(2)於卸任時未簽立「續任保證人同意書」，惟願為該筆舊貸案件續負展期<mark>保證責任</mark>，其展期約據採親簽加蓋章方式辦理；倘不願為舊貸案件<mark>負保證責任</mark>，則須申請免除對舊貸案件<mark>保證責任</mark>之核准。"},"t":"ask"},{"id":"110-9","y":110,"n":9,"m":8,"q":"下列敘述何者錯誤？","o":["若綜合額度核准日為110.7.1，則應於110.9.1前徵取綜合授信契約","若綜合額度核准日為110.6.1，且核准期限一年，於110.7.1簽妥契約，則契約到期日為111.6.1","若出口押匯核准日為110.6.25，且核准期限一年，則額度到期日為111.6.30","若於110.8.1核准非循環額度-短期放款(無新設定擔保)，則額度動用期限(即批覆書有效期限)為110.12.1"],"a":1,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第五節 授信申請書之編號及發送","t":"(四)<mark>須徵取循環額度借款契約之授信，應於核准後二個月內徵妥契約，逾期額度作廢</mark>，其契約期間自訂約日起算按核准期限訂定。"},"x":"循環額度須核准後 2 個月內徵妥契約，契約期間自<b>訂約日</b>起算：6/1 核准、7/1 簽約、期限一年 → 到期日 111.7.1，非 111.6.1。","lo":1,"t":"neg"},{"id":"110-10","y":110,"n":10,"m":11,"q":"有關股票質押業務所稱「信評較差標的」，下列敘述何者錯誤？","o":["包括TCRI 8、9、D等者","已核准額度加計當次申請額度(不含續貸)試算之集中度已逾2%者，授信申請時應具體敘明承做理由","辦理徵提時，實際質押股數以已發行股份總數之1%為限","已徵提且實際質押於本行之集中度已逾2%者，授信申請時應酌減額度或改徵提其他標的"],"a":2,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"(五)股票種類應分散，避免集中於單一股票或單一集團企業股票，以降低風險。如所徵提之擔保品屬TCRI8、9、D等或中華信評twBB(含)以下或台灣惠譽BB(twn)(含)以下之信評較差標的，其<mark>實際質押</mark>於本行之集中度已逾2%(A614集中度)，於授信申請時，應酌減額度或改徵提其他股票或擔保品，以逐步降低個股集中度。"},"t":"neg"},{"id":"110-11","y":110,"n":11,"m":8,"q":"「總行及區域中心各級人員授信審查權限準則」應併計授信額度計算審查權限之敘述，下列何者錯誤？","o":["法人授信戶應併計負責人本人及其配偶、未成年子女及負責人本人或其配偶擔任負責人之企業","不適用經理權限之擔保品塗銷案件應受併計額度之限制","針對同一基地之建築貸款案件，應併計全體借款人之他案授信額度","以經理權限核准之案件，倘利率超過經理權限而另申請區域中心條件變更時，不受併計額度之限制"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第八節 行員及關係人授信之限制","t":"1.第一金控公司負責人及大股東之配偶、二親等以內血親。2.第一金控公司負責人及大股東之<mark>配偶擔任</mark>董事、監察人或總經理之企業。"},"x":"依「總行及區域中心各級人員授信審查權限準則」，法人授信戶<b>不併計</b>負責人本人、配偶、未成年子女及其擔任負責人之企業，故 (1) 錯誤。","lo":1,"t":"neg"},{"id":"110-12","y":110,"n":12,"m":2,"q":"辦理「法拍屋、金拍屋、銀拍(售)屋」優惠貸款之無擔保代墊款，下列敘述何者錯誤？","o":["期限最長6個月","償還方式為按月繳息，到期清償本金","額度應與房屋擔保貸款以A、B件方式併同申請","至少應徵提具資力之一般保證人1人"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第四節 「法拍屋、金拍屋、銀拍(售)屋」優惠貸款","t":"六、期限：(一)<mark>無擔保代墊款：最長3個月</mark>。"},"t":"neg"},{"id":"110-13","y":110,"n":13,"m":11,"q":"辦理「自行特定金錢信託受益權質借」業務，下列敘述何者正確？<br><span class=\"it\">A.</span> 對象限為專業投資人(不含中華民國境外之個人戶)<br><span class=\"it\">B.</span> 貸款期限最長1年<br><span class=\"it\">C.</span> 受益權商品風險等級為中高(RR4)~高度(RR5)，最高貸款成數5成<br><span class=\"it\">D.</span> 不得徵提保證人","o":["ABCD","ABD","BCD","ABC"],"a":1,"ci":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第21頁","s":"","t":"◎依受益權風險等級核給貸款成數<mark>風險等級為低度(RR1)-中高(RR4)最高5成</mark>風險等級為高度(RR5)最高4成◎質借額度及幣別新臺幣：最低新臺幣100萬元外幣：最低等值美金3萬元◎貸款期限最長1年，以非循環額度辦理。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉：受益權質借限專業投資人與高資產客戶申辦、期限最長 <b>1 年</b>非循環；成數 RR1–RR4 最高 <b>5 成</b>、RR5 最高 <b>4 成</b>；鑑價取近三個月贖回淨值平均與最近一次孰低 → ABD。","lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第21頁","v":30,"t":"◎依受益權風險等級核給貸款成數<mark>風險等級為低度(RR1)-中高(RR4)最高5成</mark>風險等級為高度(RR5)最高4成◎質借額度及幣別新臺幣：最低新臺幣100萬元外幣：最低等值美金3萬元◎貸款期限最長1年，以非循環額度辦理。"},"t":"combo"},{"id":"110-14","y":110,"n":14,"m":2,"q":"本行「第e個網」已開放「中途還款」功能，惟倘遇下列狀況，目前「第e個網」仍無法受理？","o":["於本行營業時間(9:00~15:30)辦理","當日還款累積金額未逾新臺幣100萬元","貸款帳上尚有應補收(退)金額","尚在提前清償違約金綁約期間內之案件"],"a":2,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第三節 保證手續費收取","t":"六、保證期限逾期，應補收至本行保證責任解除日之保證手續費。經本行墊付款項時，除須收回該墊付之款項外，應另依規定計收墊款利息及違約金。"},"x":"第e個網中途還款限制：貸款帳上尚有應補收（退）金額者無法受理（消金數位作業規定）。","lo":1,"t":"ask"},{"id":"110-15","y":110,"n":15,"m":10,"q":"勞工紓困貸款經中小企業信用保證基金先行交付備償款項後，有關自交付日起計收利息，或辦理時效中斷作業等規定，下列敘述何者正確？<br><span class=\"it\">A.</span> 利息可通案同意減免<br><span class=\"it\">B.</span> 利息無法減免，仍應計息<br><span class=\"it\">C.</span> 利息免再辦理時效中斷作業<br><span class=\"it\">D.</span> 為確保貸款本金債權，本金部分仍維持中斷時效之規定","o":["BC","ACD","BCD","BD"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第二節 一般催討程序","t":"(三)營業單位自辦催理案件，屬信保基金已<mark>先行交付備償款項</mark>者(不含<mark>勞工紓困貸款</mark>逾放案件)，應申請債權管理處核准。七、<mark>信用保證基金</mark>保證逾期授信之處理參閱有關<mark>信用保證基金</mark>之規定辦理。"},"t":"combo"},{"id":"110-16","y":110,"n":16,"m":10,"q":"送保案件發生逾期後收回款之帳務處理，有關借戶、負責人與實際負責人以外之債務人之自行償還款規定，下列敘述何者正確？<br><span class=\"it\">A.</span> 得優先沖償其個人借款<br><span class=\"it\">B.</span> 仍受收回款應按送保授信及未送保授信之餘額比率沖償之限制<br><span class=\"it\">C.</span> 應取得該債務人親自簽名或蓋章之書面聲明資料，始得辦理","o":["ABC","AB","BC","AC"],"a":3,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","s":"陸-6","t":"但借戶、負責人與實際負責人以外之債務人的自行償還款，<mark>得優先沖償其個人借款</mark>，惟為避免嗣後爭議，仍應取得該債務人親自簽名或蓋章之書面聲明資料始得辦理。"},"x":"手冊陸、四(七)：收回款原則按送保／未送保授信餘額比率沖償；但借戶、負責人與實際負責人<b>以外</b>債務人之自行償還款，<b>得優先沖償其個人借款</b>，惟應取得其親簽或蓋章之書面聲明（A、C 正確）。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","v":57,"t":"(七)<mark>收回款之帳務處理</mark>信用保證案件逾期或視為到期後，對主從<mark>債務人之</mark>債權有收回（含分期償還款、扣抵借戶與保證人之存款、押匯款、工程款、執行薪津等）時，除係處分擔保品之收回款，得優先抵償徵提該擔保之債權外，其餘收回款均<mark>應按送保授信及未送保授信之餘額比率沖償</mark>，不得僅沖還未送保部分（參閱附錄二沖償之計算範例）。但借戶、<mark>負責人與實際負責人以外之債務人</mark>的<mark>自行償還款</mark>，<mark>得優先沖償其個人借款</mark>，惟為避免嗣後爭議，仍<mark>應取得該債務人親自簽名或蓋章之書面聲明資料始得辦理</mark>。"},"t":"combo"},{"id":"110-17","y":110,"n":17,"m":10,"q":"有關各催收單位對於逾放(含呆帳)案件之法院核發債權憑證規定，下列敘述何者錯誤？","o":["債權憑證正本應由催收主管保管","催收主管應列入移交，移交情形應記載於「債證登記簿」備註欄，由受移交人逐案蓋章","催收主管應每三年檢視債權憑證時效","第一金AMC以業務聯繫單借調債權憑證正本時，限由第一金AMC於業務聯繫單所列指定之專人簽收取件"],"a":2,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（三）時效管理：營業單位負責保管「<mark>債權憑證</mark>登記簿」<mark>催收主管</mark>，應每半年檢視該登記簿內容，對於委託第一金AMC<mark>債權憑證時效</mark>將消滅案件，第一金AMC仍未借調辦理換發者，應責成催收人員於時效消滅個月前以業務聯繫單通知第一金AMC辦理換發。另債權管理處及區域中心應隨時監控委外案件<mark>債權憑證</mark>之時效管理，倘發現個案<mark>債權憑證時效</mark>將於6個月內消滅時，應主動以業務聯繫單通知第一金AMC辦理換發。"},"t":"neg"},{"id":"110-18","y":110,"n":18,"m":5,"q":"企業授信戶在金融機構總授信金額達新臺幣2億元以上者，辦理屬「週轉金」性質之中長期授信，應徵取下列哪些徵信資料？<br><span class=\"it\">A.</span> 現金流量預估表<br><span class=\"it\">B.</span> 個案預計資金來源去路表<br><span class=\"it\">C.</span> 預估資產負債表<br><span class=\"it\">D.</span> 預估綜合損益表<br><span class=\"it\">E.</span> 營運計畫","o":["ACD","ABCD","ABCDE","ACDE"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第三節 資料表之種類與運用","t":"1<mark>.現金流量預估表</mark>：依編製方法可區分為直接法及間接法。2<mark>.營運計畫</mark>。3<mark>.預估資產負債表</mark>。4<mark>.預估綜合損益表</mark>。若<mark>企業授信戶在金融機構總授信金額達新</mark>台<mark>幣2億元</mark>者，其中本行申貸有非屬週轉資金性質（亦即資本性支出）<mark>之中長期授信，</mark>除徵提前述之1.2.3.4項預估報表外，另加徵該授信案件之<mark>個案預計資金來源去路表</mark>及建廠進度表。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第14頁","v":43,"t":"<mark>中長期授信</mark>加徵預估資料當<mark>企業授信戶在金融機構總授信金額達</mark>2億元，其中本行貸有<mark>中長期授信</mark>者若屬週轉資<mark>金性質之中長期授信</mark>或短期授信展期續約超過1年以上者•<mark>營運計畫</mark>、<mark>現金流量預估表</mark>、<mark>預估資產負債表</mark>、<mark>預估綜合損益表</mark>若非屬週轉資金性質(資本性支出)•除上述4表外，加徵<mark>個案預計資金來源去路表</mark>、建廠進度表編製期間應按年度並配合授信期限編製，若授信期限逾7年者，應至少編製7年步驟1徵信作業-<mark>企業授信戶</mark>"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第14頁：「中長期授信加徵預估資料當企業授信戶在金融機構總授信金額達2億元，其中本行貸有中長期授信者若屬週轉資金性質之中長期授信或短期授信展期續約超過1年以上者」「營運計畫、現金流量預估表、預估資產負債表、預估綜合損益表若非屬週轉資金性質(資本性支出)」","t":"combo"},{"id":"110-19","y":110,"n":19,"m":6,"q":"下列有關財務比率之敘述，何者正確？","o":["負債比率又稱槓桿比率，係測知企業外來與自有資金的比重，比率愈高表示財務狀況愈穩定","速動比率係測知企業緊急之償債能力，比率愈高表示緊急償債能力愈強","流動比率又稱酸性測驗比率，係測知企業償債能力之基本比率","固定長期適合率應逾100%為宜"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"2.<mark>速動比率</mark>計算公式：說明：(1)速動資產=現金及約當現金+短期性之投資+應收款項淨額（即：應收帳款＋應收票據－備抵呆帳）。而短期性之投資通常包括列報於流動資產之透過損益按公允價值衡量金融資產、以成本衡量之金融資產、透過其他綜合損益按公允價值衡量之金融資產、按攤銷後成本衡量之金融資產、避險之金融資產等會計項目。(2)此項比率又稱「酸性測驗比率」，用以測知<mark>緊急之償債能力，比率愈高</mark>，<mark>緊急償債能力愈強</mark>。當比率低於50%以下則<mark>表示緊急償債能力</mark>甚低。(3)以此比率評估企業<mark>之償債能力，</mark>與流動比率一般，須作相對性的研討。例如應收款項須進一步檢討其內容，檢視其中是否有過期之帳款，甚至收回困難者，另外收帳之速度是否有傾向緩慢之趨勢。"},"t":"ask"},{"id":"110-20","y":110,"n":20,"m":5,"q":"有關徵信作業注意事項，下列敘述何者錯誤？","o":["企金e-Loan系統每月1日提供「徵信報告未來二個月屆期明細表」","企金e-Loan系統每月10日提供「徵信報告逾改編屆期日二個月內明細表」","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」，保管期限至少1年","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」應呈核至單位經理"],"a":0,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第一節 動態徵信的意義與重要性","t":"而為提升<mark>徵信報告</mark>屆期改編作業管理效能，<mark>企金e-Loan系統每月</mark>5<mark>日提供「徵信報告</mark>（摘要/補充說明）<mark>未來二個月屆期明細表」</mark>、每月10<mark>日提供「徵信報告</mark>逾改編屆期日二個月內<mark>明細表」</mark>，營業單位應指派專人每月定日列印，並於『備註』欄位扼要敘明處理情形（如:已洽客戶提供資料、已不往來、編製中等），自報表產製日起5個營業日內，逐級呈核至單位經理後專卷保管，保管期限1年；報表查詢列印系統(OnDemand)每月5<mark>日提供「</mark>得免逐年改編<mark>徵信報告</mark>之授信戶名單」(代號DWLN08)，營業單位應指派專人每月定日列印，逐級呈核至單位經理後專卷保管，保管期限1年。至於在<mark>徵信報告</mark>有效期間內，企業授信戶申請增貸時，應重新檢視其在金融機構總授信金額是否仍在原徵授信戶資料表範圍內，若已逾越，應重徵授信戶資料表及相關財務報表辦理<mark>徵信報告</mark>改編工作。若雖未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，則對於原辦理單位已核定之徵信相關報告得繼續沿用至報告有"},"t":"neg"},{"id":"110-21","y":110,"n":21,"m":11,"q":"辦理外銷貸款，下列敘述何者錯誤？","o":["信用狀所載特殊條款顯無法履行時，不得辦理出口信用狀貸款","出口託收貸款，應於出口託收申請書以紅字加蓋「本證項下貨品已向第一商業銀行辦理貸款，不得重覆融資」","出口週轉金貸款以出口實績申貸者，應提供貸款金額1.5倍以上之出口信用狀予本行控管","簡易出口融資之貸款額度，原則上不得超過「生產企業」最近一年出口實績之三分之一"],"a":2,"ci":{"b":"授信篇","c":"第二十一章 外銷貸款","s":"第四節 生產企業出口週轉金貸款","t":"四、償還來源應以信用狀出口押匯或出口託收或其他出口所得之款項，作為償還財源。以國外訂單或輸出契約<mark>申貸者，應</mark>要求借款人同意接到該訂單、契約項下<mark>出口信用狀</mark>或備妥出口託收文件時，應立即提供本行收執，並同意將上開信用狀所有出口結匯或出口託收手續經由本行辦理；<mark>以出口實績申貸者，應</mark>於貸款期間內無條件<mark>提供貸款金額</mark>二<mark>倍以上之出口信用狀</mark>以供<mark>本行控管</mark>，且同意以委經本行辦理出口結匯、出口託收或其他出口所得之款項，優先償還借款本息。"},"t":"neg"},{"id":"110-22","y":110,"n":22,"m":11,"q":"有關綜合授信額度，下列敘述何者錯誤？","o":["本項額度應向授信審核處或區域中心申請核准","最高額度合計不應超過借款企業「最近一年營業額」或「預計未來一年營業額之八成」孰高","辦理用途不明確之外幣借款保證時，得逕行運用「丁類無擔保授信」項下之其他保證額度","不包括出口押匯(含出口貼現)授信"],"a":2,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第六節 其他注意事項","t":"一、<mark>辦理用途不明確之外幣借款保證時，</mark>因無法確實掌握且風險較高，不<mark>得逕行運用</mark>綜合授信額度<mark>「丁類無擔保授信」項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第2頁","v":45,"t":"額度運用原則:「<mark>擔保授信</mark>」:額度優先運用，未用額度得移作甲、乙、丙<mark>類無擔保授信</mark>及已申請額度之「<mark>丁類無擔保授信</mark>」。「<mark>丁類無擔保授信</mark>」:(1)丁類額度內各單項<mark>授信額度</mark>間不得相互移用。辦理<mark>外幣借款保證時</mark>，不<mark>得逕行運用綜合授信額度</mark>「<mark>丁類無擔保授信</mark>」<mark>項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"},"x":"依講義〈授信商品及應注意事項〉第2頁：「辦理外幣借款保證時，不得逕行運用綜合授信額度「丁類無擔保授信」項下之其他保證額度，應另行專案申請區域中心或授信審核處核准後辦理。」","t":"neg"},{"id":"110-23","y":110,"n":23,"m":8,"q":"依「第一商業銀行依貨幣市場利率承做短期放款準則」，貸放期限最長為","o":["60天","90天","120天","150天"],"a":1,"ci":{"b":"授信篇","c":"第二十章 台塑網線上融資業務","s":"","t":"2.25%(含)以上承做，嗣後修正請依「國內營業單位經理辦理企業戶新台幣放款最低貸放利率授權簡表」之授權利率辦理。(四)本項融資一律不得申請以<mark>貨幣市場利率承做短期放款</mark>(即MML)。"},"x":"「依貨幣市場利率承做短期放款準則」（MML）：貸放期限最長 <b>90 天</b>。","lo":1,"lx":{"b":"講義：授信商品及應注意事項","c":"第4頁","v":31,"t":"<mark>貨幣市場利率承做短期放款</mark>案件(MML案件)及「利率重評機制」案件MML案件:(一)授信申請時：務必於「授信條件」項下的「<mark>貨幣市場</mark>適用利率」欄位勾選輸入相關條件，凡MML授信案件採逐筆議價者，皆應加註利率下限，故應勾選『惟逐筆議價時不得低於央行「」申購利率加「」%』欄位。"},"t":"fill"},{"id":"110-24","y":110,"n":24,"m":4,"q":"下列何者為間接授信？","o":["有追索權應收帳款承購業務","開發國內、外信用狀","出口押匯","透支"],"a":1,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第十一節 其他注意事項","t":"第十五條<mark>所稱間接授信，謂會員以受託擔任客戶之債務保證人、匯票承兌人、開發國內外信用狀</mark>或其他方式，授予信用，承擔風險，而不直接撥貸資金之授信行為。"},"lx":{"b":"講義：授信法規/通則輯要","c":"第2頁","v":43,"t":"<mark>間接授信</mark>保證：商業本票及公司債保證、工程相關保證、其他保證承兌：買方委託承兌、賣方委託承兌開發國、<mark>內外信用狀</mark>其他<mark>間接授信</mark>商品<mark>間接授信</mark>無追索權應收帳款承購業務"},"x":"依講義〈授信法規/通則輯要〉第2頁：「間接授信保證：商業本票及公司債保證、工程相關保證、其他保證承兌：買方委託承兌、賣方委託承兌開發國、內外信用狀其他間接授信商品間接授信無追索權應收帳款承購業務」","t":"ask"},{"id":"110-25","y":110,"n":25,"m":8,"q":"有關「單一分行內單一客戶授信限額管控」規範，係指單一客戶授信總額逾單一分行授信總額之（　）時，應將超逾限額部分拆分予聯行記帳。","o":["45%","35%","25%","15%"],"a":0,"ci":{"b":"授信篇","c":"第三十七章 外匯授信通則","s":"第二節 利息及違約金","t":"4.5%，依此類推。(4)適用範圍：需經授信審核處或區域中心核准後始得使用，較常見於中長期及聯貸等授信案件。(六)付息方式："},"x":"單一分行內單一客戶授信總額逾該分行授信總額 <b>45%</b> 時，超逾部分應拆分予聯行記帳。","lo":1,"t":"fill"},{"id":"110-26","y":110,"n":26,"m":9,"q":"為利控管大陸暴險，應審慎辧理大陸地區授信案件，加強徵取符合「風險移轉」之保證或擔保品，下列敘述何者正確？","o":["徵取本行企金信評優於5等(含)之母公司或關係企業擔任授信戶之保證人","徵取十足備償存款","改以「短期貿易融資」方式承作以作為扣減項","以上皆是"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第三節 授信申請書之填製","t":"十七、「<mark>大陸地區授信</mark>類別」欄位內容應點選是否為<mark>大陸地區授信</mark>，若為<mark>大陸地區授信</mark>，需再區分是否為短期貿易融資及是否有足額保證、足額擔保品。第四節授信展期申請之特殊規定"},"lo":2,"t":"ask"},{"id":"110-27","y":110,"n":27,"m":1,"q":"有關「中央銀行對金融機構辦理
