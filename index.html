":["企業負責人涉及虛偽交易或掏空公司資產，遭檢調機關偵辦","企業已停業","企業所簽發支票發生存款不足退票","最近兩年連續虧損"],"a":3,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"二、營業單位倘知悉企業授信戶有下列授信預警徵兆時，應立即填製「授信案件危機處理報告」向授信審核單位辦理通報外，亦請至新企金E-LOAN系統之「授信戶查詢」子系統辦理「已呈報危機戶」通報作業，倘「授信案件危機處理報告」尚未完成批示結案前，原則上不得辦理額度動用。倘經審核人員批示應定期追蹤者，營業單位須按期以「授信案件危機處理報告」更新事件後續發展情形及相應措施，經批示列為預警戶者，營業單位次月再依本行「授信預警制度實施要點」進行預警戶通報作業。"}},{"id":"113-46","y":113,"n":46,"m":10,"q":"對新接辦之逾期放款案件，催收單位應於接管","o":["2 個營業日內","當日","5 日內","1 個月內 及嗣後至少每年一次或不定期就不動產擔保品評估其價值"],"a":1,"ci":{"b":"授信篇","c":"第五十六章 不良授信建檔管理","s":"第一節 逾期放款催收事務管理系統","t":"(四)以商品為擔保者，應查明有無變質及處分之難易，並向其同業查詢市價。(五)<mark>對新接辦之逾期放款案件，催收單位應於接管當日</mark>及嗣後至少每年一次或不定期就不動產擔保品自行參考其附近市價、法拍行情或該擔保品最近一年內法院核定拍賣底價評估其價值，登錄於逾催系統「市價」欄位，並留存相關佐證資料備查，直至該擔保品處分完畢為止。(2011/7/21債劃字第00049號函、2024/05/07債劃字第000057號函)"}},{"id":"113-47","y":113,"n":47,"m":10,"q":"營業單位如發生信用授信違約逾期案件，下列何者應以「信用授信違約逾期案件通報表」通報債權管理處？<br><span class=\"it\">A.</span> 單一公司授信金額達新臺幣(以下同)5,000 萬元（含）以上，且本金或利息逾期 1 個月之新發生授信違約案件<br><span class=\"it\">B.</span> 授信金額雖未逾 1 億元，但違約公司所屬集團授信曝險合計逾 3 億元以上案件<br><span class=\"it\">C.</span> 單一公司授信金額達 1 億元（含）以上，且本金或利息逾期 1 個月之新發生授信違約案件<br><span class=\"it\">D.</span> 授信金額雖未逾 1 億元，但違約公司所屬集團授信曝險合計逾 5 億元以上案件","o":["AB","CD","僅 A","僅 C"],"a":1,"ci":{"b":"授信篇","c":"第五十五章 不良授信債權管理通則","s":"第三節 其他注意事項","t":"(一)<mark>單一公司授信在新臺幣一億元(含)以上，且本金或利息逾期一個月之新發生授信違約案件</mark>。"},"x":"大額違約通報：C 單一公司授信達 1 億且逾期 1 個月；D 集團曝險合計逾 5 億 → CD。","lo":1},{"id":"113-48","y":113,"n":48,"m":10,"q":"催收人員收回款項時，應於當日先暫入「其他預收款-預收放款延滯案款項」項子目，除有特殊原因不得動支者外，依如下方式或本行相關規定整理帳務，下列何者有誤？","o":["營業單位自辦催理案件(含信保基金已先行交付備償款項之勞工紓困貸款逾放案件)，得自行辦理帳務沖償","債權管理處債權管理部接辦案件，應通知營業單位辦理帳務沖償事宜","營業單位自辦催理案件，屬信保基金已先行交付備償款項者(不含勞工紓困貸款逾放案件)，應申請債權管理處核准","區域中心接辦案件，免通知營業單位辦理帳務沖償事宜"],"a":3,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"1.債權管理處債權管理部或<mark>區域中心接辦案件，</mark>應<mark>通知營業單位辦理帳務沖償事宜</mark>。2.<mark>營業單位</mark>自辦催理案件(含信保基金已先行交付備償款項之勞工紓困貸款逾放案件)，得自行<mark>辦理帳務沖償</mark>。"}},{"id":"113-49","y":113,"n":49,"m":10,"q":"擬轉列催收款項案件，全案授信餘額達新臺幣","o":["1,500 萬","2,000 萬","3,000 萬","3,500 萬 元(含)以上者，應申請債權管理處同意後辦理"],"a":3,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（二）上述擬轉列催收款項案件，全案授信餘額達<mark>3,500萬元</mark>（含）以上者<mark>應申請債權管理處同意後辦理</mark>。肆、催收作業：ㄧ、對未依約履行之授信戶，承辦案件單位於逾期放款新發生初期應辦理下列催討措施，每日由營業單位經理指派之業務（資深）副理於逾催系統/【主管作業】/【案件分派】功能選項下，辦理分案予專人（一人或多人），以辦理簡易催繳工作，一般催收工作則由承辦案件單位之催收人員辦理。"}},{"id":"113-50","y":113,"n":50,"m":10,"q":"借據之本金請求權，時效期限為 A 年，其利息之請求權時效期間為 B 年。上述A、B 分別為","o":["20、10","15、10","15、5","10、3"],"a":2,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第一節 各項請求權之消滅時效","t":"二、<mark>借據之本金請求權，時效期限為</mark>十五<mark>年，其利息之請求權時效期間為</mark>五年（民法第一百二十五、一百二十六條）。"}},{"id":"113-51","y":113,"n":51,"m":10,"q":"對於轉銷呆帳後案件墊支逾（　）或經積極催討並以「其他預收款-預收放款延滯案款項」沖抵後仍未能收回之「其他應收款-放款訴訟費用」，催收人員應申請債權管理處核准後以「其他什項支出-催收各項費用」開支，並記入呆帳登記簿與辦理「呆帳-放款訴訟費用明細資料」交易建檔，及繼續催討。","o":["1年","2年","6個月","3個月"],"a":1,"ci":{"b":"授信篇","c":"第六十三章 呆帳轉銷","s":"第四節 呆帳費用","t":"五、<mark>對於轉銷呆帳後案件墊支逾</mark>2年<mark>或經積極催討並以「其他預收款-預收放款延滯案款項」沖抵後仍未能收回之「其他應收款-放款訴訟費用」，催收人員應</mark>依據原轉銷核准文號，<mark>申請債權管理處核准後以「其他什項支出-催收各項費用」開支，並記入呆帳登記簿與辦理「呆帳-放款訴訟費用明細資料</mark>建檔（6290）<mark>」交易建檔，及繼續催討。</mark>"}},{"id":"113-52","y":113,"n":52,"m":5,"q":"有關徵信報告屆期改編作業，下列敘述何者正確？","o":["企金e-Loan系統每月1日提供「徵信報告未來二個月屆期明細表」","企金e-Loan系統每月15日提供「徵信報告逾改編屆期日二個月內明細表」","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」，保管期限5年","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」應呈核至單位經理"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第一節 動態徵信的意義與重要性","t":"而為提升<mark>徵信報告</mark>屆期改編作業管理效能，企金e-Loan系統每月5日提供<mark>「徵信報告</mark>（摘要/補充說明）<mark>未來二個月屆期明細表」</mark>、每月10日提供<mark>「徵信報告逾改編屆期日二個月內明細表」</mark>，營業單位應指派專人每月定日列印，並於『備註』欄位扼要敘明處理情形（如:已洽客戶提供資料、已不往來、編製中等），自報表產製日起5個營業日內，逐級<mark>呈核至單位經理</mark>後專卷保管，保管期限1年；報表查詢列印系統(OnDemand)每月5日提供「得免逐年改編<mark>徵信報告</mark>之授信戶名單」(代號DWLN08)，營業單位應指派專人每月定日列印，逐級<mark>呈核至單位經理</mark>後專卷保管，保管期限1年。至於在<mark>徵信報告</mark>有效期間內，企業授信戶申請增貸時，應重新檢視其在金融機構總授信金額是否仍在原徵授信戶資料表範圍內，若已逾越，應重徵授信戶資料表及相關財務報表辦理<mark>徵信報告</mark>改編工作。若雖未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，則對於原辦理單位已核定之徵信相關報告得繼續沿用至報告有"}},{"id":"113-53","y":113,"n":53,"m":5,"q":"有關查詢聯徵中心信用資訊之作業，下列敘述何者錯誤？","o":["各單位應每日列印查詢紀錄資訊，經查詢人員蓋章及主管覆核","退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","查詢聯徵中心所得之信用資訊可供行銷業務使用","須符合授信業務目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得查詢"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第五節 財團法人金融聯合徵信中心信用資訊產品種類與運用","t":"九、符合授信目的或金融管理法令遵循目的，並取得當事人同意或與當事人有契約或類似契約關係者，始得進行查詢當事人<mark>之信用資訊</mark>。但法令另有規定者，從其規定。前述所稱同意之意思表示，依電子簽章法之規定，得以電子文件為之。辦理電子銀行業務應依銀行公會「金融機構辦理電子銀行業務安全控管作業基準」有關交易訊息之安全限制規定，應用於信用卡申辦或貸款申請時，系統應留存足以證明客戶意思表示同意金融機構<mark>查詢聯徵中心</mark>信用資料之紀錄(如日期、來源IP或電話號碼、同意內容或版本、身分驗證結果等)，且相關紀錄內容可完整呈現供日後查驗。<mark>信用資訊</mark>之利用，應遵守各項業務自律章則及金融相關法令，確保資訊利用之適法性及合目的性，並應與授信目的或金融管理法令遵循目的具有正當合理之關聯，不得利用自<mark>聯徵中心所</mark>查得客戶<mark>之信用資訊</mark>辦理行銷、或為其他逾越特定目的必要範圍之利用。查詢<mark>所得之信用資訊</mark>應保守秘密，並嚴限內部參考。除當事人依法查詢其本人資料外，不得對外公開或移轉他人。自金融聯合徵信中心擷取之警示帳戶通報資料，除與帳戶所有人另有契約約定得"}},{"id":"113-54","y":113,"n":54,"m":6,"q":"會計師因違反會計師法或證券交易法，其簽發之財務報表查核報告自處分日起於受處分期間內不予採用，係因該會計師受何種處分？","o":["警告","停止執行業務","申誡","除名"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"1.受處分警告或申誡者，其簽發之財務報表查核報告自處分日起一年內如准予採用，應註明採用之原因並審慎評估。2.受處分<mark>停止執行業務</mark>或停止辦理公開發行公司之查核簽證者，其簽發之財務報表查核報告自處分日起於受處分期間內不予採用。"}},{"id":"113-55","y":113,"n":55,"m":9,"q":"為落實責任金融，辦理徵信作業之查詢項目中，何者「不」屬客戶之 ESG 善盡企業社會責任揭露項目？","o":["應向聯徵中心查詢最新之勞工退休準備金相關資訊記載","應向聯徵中心查詢企業授信餘額及還款紀錄資訊","因應歐盟實施「碳邊境調整機制」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度","應向「行政院環境部列管污染源資料查詢系統」查詢企業戶是否為污染源列管中及曾發生之違規紀錄"],"a":1,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第三節 企業戶徵信報告(小額貸款專用)暨公司信用卡專用徵信報告","t":"6.ESG相關查詢及揭露事項:為落實責任金融，將客戶是否依環境面(E)、社會面(S)及公司治理面(G)善盡企業社會責任納入風險評估重點。(1)環境面(E)：應向「行政院環境部列管污染源資料查詢系統」（網址:http://prtr.epa.gov.tw/）<mark>查詢企業</mark>戶是否為污染源列管中及曾發生之違規紀錄；如客戶有提供或徵信人員查詢可得客戶近三年碳排量資訊(行政院環境部規範應盤查登錄溫室氣體排放量之排放源對象可至「事業溫室氣體排放量資訊平台」查詢，公開發行以上公司得查詢年報、永續報告書或TEJ資料庫)應揭露於徵信報告中；因應歐盟實施「碳邊境調整機制(CBAM)」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度。(2)社會面(S)：<mark>應向聯徵中心查詢</mark>最新之勞工退休準備金相關資訊記載之；倘為「食品/醫藥業」須至「衛生福利部食品藥物管理署」（網址:https://consumer.fda.gov.tw/）查詢有無違規紀錄。"}},{"id":"113-56","y":113,"n":56,"m":5,"q":"辦理徵信作業時，企業授信戶之財務報表倘未達徵提會計師財務報表查核報告之標準，應徵取加蓋稅捐機關收件章之營利事業所得稅結算申報書影本，有關前述之相關規定，下列何者錯誤？","o":["該企業在金融機構總授信金額未達新臺幣 3,000 萬元","綜合損益表應依據申報書上之「自行調整金額欄」辦理報表攤列","「財報核驗結果分析表」逐級陳核至單位主管後，置於徵信、授信卷宗保管","辦理新貸戶徵信作業時，應於企金 e-Loan 系統【財務報表核驗】功能，至少完成最新二年度財務比率核驗"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第一節 財務資料之徵取","t":"二、營利事業所得稅結算申報書影本：企業授信戶若為公司組織在金融機構之總授信金額未達新台幣三千萬元或為非法人組織未達重要授信戶標準者，應徵取加蓋稅捐機關收件章之營利事業所得稅結算申報書影本，或印有稅捐機關收件章戳記之網路申報所得稅報表。<mark>辦理報表攤列</mark>時，資產負債表依據該申報書之附表-「資產負債表」，<mark>綜合損益表</mark>依據該<mark>申報書上之「</mark>帳載決算<mark>金額欄」</mark>。若企業授信戶利用網際網路辦理營利事業所得稅結算申報並提供自行列印之資產負債表、損益及稅額計算表(<mark>綜合損益表</mark>)等財務報表時，由於不能核對正本及不易辨別真偽，應參酌借戶之行業特性、產業動態及與本行往來實績等據以綜合研判其真實性。對於未達財務簽證標準且使用營利事業所得稅結算申報書辦理結算申報之新貸戶，進行徵信作業時，應於企金e-Loan系統【財務報表核驗】功能，至少完成最新二年度財務比率核驗(倘借戶新成立僅有最新一年度報稅資料亦應完成核驗)，並列印『財報核驗結果分析表』逐級陳核至單位主管後，置於徵信、授信卷宗保管。另因財"}},{"id":"113-57","y":113,"n":57,"m":5,"q":"辦理個人授信戶之徵信作業，下列敘述何者錯誤？","o":["個人授信戶於本行授信總餘額在新臺幣 300 萬元(含)以下之借戶得免徵同一關係人資料表","對於初次申辦授信業務之個人戶，應徵取「第一商業銀行授信業務蒐集個人資料應告知事項」","對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人綜合所得稅結算申報書填寫","以交易代號 9701 查詢授信對象是否為銀行法或金控法規範之利害關係人"],"a":0,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（四）<mark>同一關係人資料表</mark>：<mark>個人授信</mark>案件，<mark>於本行授信總餘額在新</mark>台幣2<mark>00萬元</mark>（含）<mark>以下之借戶得免徵</mark>，逾2<mark>00萬元</mark>之借戶均須徵提。前述<mark>本行授信總餘額</mark>係指本行歸戶現貸餘額加計本次申貸金額，屬循環額度者以額度計，屬非循環額度者以餘額加計尚可動撥額度計算。"}},{"id":"113-58","y":113,"n":58,"m":6,"q":"某股份有限公司之負債比率為 350%，請問下列何項變動可改善該公司之負債比率？","o":["實收股本減資彌補虧損","增加發行公司債","現金增資","向關係人借款增加"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第五節 企業授信之徵信範圍","t":"二、企業變遷單位：新台幣千元資本期間77年05月(創立)81年11月85年06月87年01月102年06月金額登記200,000登記500,000登記800,000登記1,500,000登記2,500,000實收200,000實收500,000實收800,000實收1,150,500實收2,254,000變動目的創立擴充設備擴充設備改善財務結構改善財務結構變動方式現金<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>說明：變動目的：如增資係為改善財務結構、換新或擴充設備、週轉用．．．等。變動方式：如增資係以<mark>現金增資</mark>、盈餘轉增資、負債轉增資、資產重估．．．等。組織期間77年05月(創立)81年11月85年06月87年01月102年06月型態<mark>股份有限公司股份有限公司股份有限公司股份有限公司股份有限公司</mark>"},"x":"負債比率＝負債 ÷ 權益；<b>現金增資</b>增加權益、比率下降。減資彌補虧損權益不變、發公司債及向關係人借款增加負債。","lo":1},{"id":"113-59","y":113,"n":59,"m":5,"q":"有關徵提會計師財務報表查核報告之對象，下列何者正確？","o":["辦理本票保證之企業授信戶無須徵提","依私立學校法設立之私立學校申請授信時無須徵提","法人組織之非營利事業於本行總授信額度達重要授信戶標準者，可自行斟酌徵提","公開發行公司應徵提金融監督管理委員會規定之會計師財務報表查核報告，並得自公開資訊觀測站下載"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"(一)上述<mark>財務報表</mark>或資料以經會計師查核簽證，或加蓋稅捐機關收件章之申報所得稅報表（或印有稅捐機關收件章戳記之網路申報所得稅報表），或附聲明書之自編報表者為準。但辦理本票保證依法須取得會計師查核簽證之<mark>財務報表</mark>，及企業總授信金額達新台幣三千萬元以上者，仍應徵提<mark>會計師財務報表查核報告</mark>。<mark>公開發行公司</mark>並<mark>應徵提金融監督管理委員會規定之會計師財務報表查核報告</mark>（即長式報告），上述報告亦得自財團法人中華民國證券暨期貨市場發展基金會網站或台灣證券交易所股份有限公司<mark>公開資訊觀測站下載</mark>。"}},{"id":"113-60","y":113,"n":60,"m":5,"q":"企業授信戶在金融機構總授信金額未達新臺幣3,000萬元，惟提供會計師財務報表查核報告，請問應向客戶徵取何種類資料表？","o":["小規模營利事業簡易資料表","簡易資料表","資料表","公司信用卡專用徵信資料表"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第三節 資料表之種類與運用","t":"7.最近三年營業狀況。8.進銷貨概況。9.存借款明細表。五、資料表（如範例五）適用對象：凡<mark>企業授信戶在金融機構總授信金額</mark>達新台<mark>幣3,000萬元</mark>(含)以上，或雖未達新台<mark>幣3,000萬元惟提供會計師財務報表查核報告</mark>者適用之。主要內容："}},{"id":"114-1","y":114,"n":1,"m":3,"q":"個人非消費性貸款倘申貸資金用途屬投資經營事業者，且借款人所營事業屬建築業，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，資金用途應勾選","o":["營建自用不動產","營建銷售用不動產","其他營建資金","投資企業"],"a":2,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"十一、為利詳實統計銀行法第72條之2授信限額，辦理建築業(行政院主計處行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」；資金用途應勾選「<mark>其他營建資金</mark>(33)」。若貸款資金非用於「興建」或「購置」住宅及企業用建築之放款，分行端應於授信申請書內詳實說明資金用途，依適當之貸款種類及資金用途分類建檔，並落實貸後資金流向之追蹤管理。"}},{"id":"114-2","y":114,"n":2,"m":3,"q":"下列關於建築貸款之敘述何者有誤？","o":["建築貸款包含興建房屋貸款及營建週轉金","基地面積超過 200 坪且 11 層樓以上者，貸款期限依實際需要及興建計畫個別核定，惟最長以不超過 6 年為原則","應於企金 e-Loan 系統授信申請書勾選應追蹤事項之「計畫執行進度追蹤表」","自貸放日起至少每 2 個月確實追蹤工程進度"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第二節 貸放、收回","t":"四、勘驗前項<mark>工程進度</mark>應由借款人提供監造建築師（或監造人）之勘驗紀錄或承造人之<mark>工程進度</mark>證明或會同監造建築師（或監造人）實地查驗辦理或委由建築經理公司辦理查核，<mark>自貸放日起至少每</mark>三<mark>個月確實追蹤工程進度</mark>，並至企金e-loan系統填報「計畫執行進度追蹤表」，<mark>工程進度</mark>相關證明文件與進度追蹤表應存卷備查。另興建動工之認定，應實際勘查並拍照做成勘查紀錄，且以工地現場是否有機具進場持續施工作為實質動工認定依據。"}},{"id":"114-3","y":114,"n":3,"m":3,"q":"有關工業用土地貸款資金用途為週轉金之相關規範，下列何者正確？<br><span class=\"it\">A.</span> 應徵取工業用土地自用切結書(週轉金用)<br><span class=\"it\">B.</span> 資金用途不得用於購置、投資或興建不動產<br><span class=\"it\">C.</span> 借款人為法人戶須出具「營運週轉計畫書」<br><span class=\"it\">D.</span> 工業區閒置土地亦得辦理週轉金貸款","o":["ABC","BCD","BC","AD"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第九節 中小企業創新發展專案貸款","t":"(三)貸款用途為「購置土地」者，該土地係未來將興建廠房、營業場所始得辦理本貸款，且該土地屬「<mark>工業用土地</mark>」時，並應依本行<mark>有關工業用土地貸</mark>之規範辦理。"},"x":"官方答案 BC：資金不得用於購置/投資/興建不動產、法人戶須出具「營運週轉計畫書」；A、D 為錯誤敘述（工業區閒置土地不得辦理週轉金貸款）。","lo":1},{"id":"114-4","y":114,"n":4,"m":11,"q":"辦理應收帳款承購業務額度申請時，以統包方式承做供應鏈融資業務時，下列選項何者錯誤？","o":["應徵取買方付款承諾書及備付本票","可個案評估後，酌情依授信審核層級申請核准免徵取備付本票","利息採按月收息方式辦理","融資期限最長不得超過 180 天為原則"],"a":2,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第四節 額度申請","t":"四、額度申請方式(一)本業務額度一律依本行業務相關規定提出申請。1.得以單一賣方對應多個買方合併申請一個額度；2.另以統包方式，由多個賣方對應單一或多個買方合併申請一個額度或共用額度，承作供應鏈融資(無追索權承購)業務時：(1)應徵取買方付款承諾書及備付本票，查核報告書影本及本行承購買方之虛擬及承購額度動用情形應作為授信申請書之附件，惟可個案評估後，酌情依授信審核層級申請核准免徵取備付本票。(2)利息採預收<mark>方式辦理</mark>，並收取承購手續費(收取時點：有預支價金時，則預支價金時收取，無預支時則買方入帳時收取)；若因不可抗力之因素(如颱風、地震)，致銀行停止營業，無法於帳款到期日還款時，免收帳款到期日至恢復營業日間之延遲利息及違約金。(3)供應商已於本行營業單位往來，免依本行授信統一歸戶之相關規定辦理。(4)「供應商應收帳款承購合約書」之徵取，得免比照授信篇第三章第六節第四項之規定「須徵取循環額度借款契約之授信，應於核准後二個月內徵妥契約，逾期額度作廢」辦理。"}},{"id":"114-5","y":114,"n":5,"m":1,"q":"營業單位辦理「中央銀行對金融機構辦理不動產抵押貸款業務」，承作公司法人購買建物權狀含有「住」字樣之住宅貸款，其貸款條件限制：<br><span class=\"it\">A.</span> 寬限期最長一年<br><span class=\"it\">B.</span> 貸款額度最高不得超過住宅(含基地)鑑價或買賣金額較低者之三成<br><span class=\"it\">C.</span> 除前款貸款額度外，不得另以修繕、周轉金或其他貸款名目，額外增加貸款金額<br><span class=\"it\">D.</span> 所有住宅貸款案件應一律送區域中心或總行授信審核處審核。上述正確者共幾項？","o":["1","2","3","4"],"a":1,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"三、<mark>金融機構承作公司法人之購置住宅貸款，其貸款條件限制如下</mark>：(一)不得有寬限期。"},"x":"A 錯（公司法人購屋不得有寬限期）、B 對（三成）、C 對（不得額外增貸）、D 錯（非所有案件一律送審）→ 正確 2 項。","lo":1},{"id":"114-6","y":114,"n":6,"m":8,"q":"考量優質企業授信戶議價能力強，承做短期借款時，依「第一商業銀行依貨幣市場利率承做短期放款準則」之相關規定：<br><span class=\"it\">A.</span> 適用對象原則上以本行企金評等 1-7 等之授信戶為對象<br><span class=\"it\">B.</span> 貸放期限最長 180 天<br><span class=\"it\">C.</span> 本行企金信評 4-5 等借戶，最低風險貼水 50bps<br><span class=\"it\">D.</span> 營業單位取得逐筆議價授權號碼後，辦理撥貸人員應於當日辦理貸放，逾期不得貸放。上述正確者為下列何組？","o":["AB","AC","AD","CD"],"a":1,"ci":{"b":"授信篇","c":"第二十章 台塑網線上融資業務","s":"","t":"2.25%(含)以上承做，嗣後修正請依「國內<mark>營業單位</mark>經理辦理企業戶新台幣放款最低貸放利率授權簡表」之授權利率辦理。(四)本項融資一律不得申請以<mark>貨幣市場利率承做短期放款</mark>(即MML)。"},"x":"MML 對象原則企金評等 1–7 等（A 對）；最長 90 天（B 錯）；4–5 等最低風險貼水 50bps（C 對）；授權號碼「當日或次一營業日」貸放（D 只寫當日，錯）→ AC。","lo":1},{"id":"114-7","y":114,"n":7,"m":11,"q":"有關徵取股票為擔保品之授信，下列敘述何者有誤？","o":["上市股票之鑑價以股票前一日收盤價與最近二個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於120%，應即實行質權賣出股票，以確保本行債權"],"a":0,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"四、鑑價及放款金額：(一)上市公司<mark>股票之鑑價</mark>及放款金額，除另有規定外，按下列方式辦理：1.按股票時價（申請<mark>前一日收盤價</mark>）與最近三<mark>個曆月之平均價孰低者</mark>為鑑價。"}},{"id":"114-8","y":114,"n":8,"m":8,"q":"A 為甲公司之負責人且持股 35%，A 之配偶 B 持股甲公司 15%，A 之成年子女 C 持股甲公司 10%，A 另為乙公司之負責人且持股 55%，依「總行及區域中心各級人員授信審查權限準則」，甲公司之審查權限應併計對象為何？","o":["無應併計對象","ABC","AB 乙公司","AB"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(一)應於授信申請書「營業單位補充說明」中敘明案件關聯性。(二)應合併計算渠等借款人之授信權限額度，依歸戶後之額度判斷是否屬「國內營業單位經理權限授信要點」審核權限；倘逾經理權限者，逕依「總行及區域中心各級人員授信審查權限準則」申請區域中心或總行核准後辦理。參、信貸通則"},"x":"同 111-6 題型：法人授信戶審查權限<b>無應併計對象</b>。","lo":1},{"id":"114-9","y":114,"n":9,"m":8,"q":"甲公司目前有一筆短期放款額度新臺幣(以下同)100 萬元，現欲以移送信保八成方式申請開發國內信用狀額度 200 萬元及履約保證額度 300 萬元，依「國內營業單位經理權限授信要點」之權限判斷，應以多少金額來認定「無擔保授信」？","o":["600 萬元","500 萬元","200 萬元","120 萬元"],"a":2,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業信用保證基金之保證(一)財團法人中小企業信用保證基金（以下簡稱信保基金），為政府核准設立之信用保證機構，<mark>經其保證之授信，該保證成數部分，得視為擔保授信</mark>。"},"x":"短放 100 萬未送保全額為無擔保；LC 200＋履保 300＝500 萬送保 8 成 → 無擔保 100；合計 <b>200 萬</b>。","lo":1},{"id":"114-10","y":114,"n":10,"m":6,"q":"A 股份有限公司之負債比率達 420%，請問下列何者可改善該公司之負債比率？","o":["實收股本減資彌補虧損","提撥法定盈餘公積","現金增資","向關係人增加貸款"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第五節 企業授信之徵信範圍","t":"二、企業變遷單位：新台幣千元資本期間77年05月(創立)81年11月85年06月87年01月102年06月金額登記200,000登記500,000登記800,000登記1,500,000登記2,500,000實收200,000實收500,000實收800,000實收1,150,500實收2,254,000變動目的創立擴充設備擴充設備改善財務結構改善財務結構變動方式現金<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>及盈餘轉增資<mark>現金增資</mark>說明：變動目的：如增資係為改善財務結構、換新或擴充設備、週轉用．．．等。變動方式：如增資係以<mark>現金增資</mark>、盈餘轉增資、負債轉增資、資產重估．．．等。組織期間77年05月(創立)81年11月85年06月87年01月102年06月型態<mark>股份有限公司股份有限公司股份有限公司股份有限公司股份有限公司</mark>"},"x":"同 113-58：現金增資可改善；提撥法定盈餘公積僅權益內部科目移轉，不影響比率。","lo":1},{"id":"114-11","y":114,"n":11,"m":6,"q":"有關財務報表之敘述，何者錯誤？","o":["資產負債表係表達特定期間經營結果，為靜態報表","綜合損益表係表達特定期間之財務績效，為動態報表","權益變動表係表達特定期間權益之變動情形，為動態報表","現金流量表係說明特定期間之營業及籌資活動現金流量之報表，為動態報表"],"a":null,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第三節 會計師財務報表查核報告","t":"<mark>所謂資產負債表(BalanceSheet)係表達一企業在某特定日期之財務狀況的報表，為一種靜態報表</mark>；"}},{"id":"114-12","y":114,"n":12,"m":5,"q":"有關未達財務簽證標準且使用營利事業所得稅結算申報書辦理結算申報之財務報表查證，下列何者錯誤？","o":["於企金 e-Loan 系統【財務報表核驗】功能，完成最新二年度財務比率核驗","舊貸戶應辦理核驗","完成之『財報核驗結果分析表』陳核至單位主管後，置於卷宗保管","每年 10 月 1 日後可查詢前一年度企業最新財務比率"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（七）財務報表之查證：對於未達財務簽證標準且使用營利事業所得稅結算申報書辦理結算申報之新貸戶，進行徵信作業時，應於企金e-Loan系統【財務報表核驗】功能，至少完成最新二年度財務比率核驗(倘借戶新成立僅有最新一年度報稅資料亦應完成核驗)，並列印『財報核驗結果分析表』逐級陳核至單位主管後，置於徵信、授信卷宗保管。另因財務比率存在加值運算之時間落差，故於每年10月1日後，方可查詢前一年度企業最新財務比率。"}},{"id":"114-13","y":114,"n":13,"m":5,"q":"下列徵信作業權限規範何者錯誤？","o":["個人授信戶之徵信業務屬營業單位權限","土、建融授信案件以多戶分別申貸時，徵信作業權限係依各自本身額度計算歸屬","企業戶屬新戶在本行總授信額度新臺幣 6 億元（含）以上者之徵信業務屬徵信處權限","本行統籌主辦聯貸案件屬徵信處權限"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"2.<mark>企業戶屬新戶</mark>且本次申貸金額為新臺幣5<mark>億元（含）以上者之徵信業務</mark>（含負責人及保證人）。3.企業授信<mark>戶在本行總授信額度新臺幣6億元（含）以上者之徵信業務</mark>（含負責人及保證人）。"}},{"id":"114-14","y":114,"n":14,"m":2,"q":"有關本行「融資躉繳保費-信用貸款」規範，何者正確？","o":["營業單位經理得於「個別分行授信權限額度核給範圍」個人無擔保放款權限，以免保人「信用貸款」辦理","借戶為本行利害關係人，應與其他消費者無擔保貸款額度合計，不得逾新臺幣180 萬元","同一擔保品承作副擔保貸款，合計貸放額度不得逾鑑價金額一成","以上皆是"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"(二)<mark>融資躉繳保費</mark>─<mark>信用貸款</mark>：1.授權營業單位經理於「個別分行授信權限額度核給範圍」之個人無擔保放款權限內，以免保人之「<mark>信用貸款」</mark>方式辦理。"}},{"id":"114-15","y":114,"n":15,"m":11,"q":"本行試辦資產管理專區「以自益特定金錢信託受益權為擔保之質借業務，最高成數不以五成為限」，下列何者為非？","o":["借戶限高資產客戶且須徵妥【地方資產管理專區商品及服務申請書】","商品風險等級低度(RR1)~中高(RR4)最高五成，高度(RR5)最高四成","僅新興分行試辦本業務，其他營業單位得轉介高資產客戶至新興分行承作","計算績效時，新興分行與高資產客戶之信託往來分行皆認列 100%"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十四節 自行特定金錢信託受益權質借","t":"1.貸款成數：受益權<mark>商品風險</mark>(風險報酬)等級為<mark>低度(RR1)~中高(RR4)</mark>，最高貸款成數5成。受益權<mark>商品風險</mark>(風險報酬)等級為<mark>高度(RR5)</mark>，最高貸款成數4成。"},"x":"資產管理專區試辦之受益權質借「最高成數不以五成為限」，故 (2) 沿用一般規定（RR1–RR4 五成、RR5 四成）為錯誤。","lo":1},{"id":"114-16","y":114,"n":16,"m":1,"q":"辦理購置「央行管控規定」不動產，下列何者為非？","o":["財政部「青年安心成家購屋優惠貸款」不受自然人第 1 戶、第 2 戶購屋貸款限制","借款人辦理購置住宅貸款，金融機構可以周轉金名義承作","自然人名下無房貸，但有持分房屋者，申辦購屋貸款應受自然人第 1 戶購屋貸款限制，惟該持分房屋係繼承取得者得不受限","本規範「房貸戶數」依擔保品數量認定"],"a":1,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"2.該建物如經<mark>金融機構</mark>認定為非屬無價值或鮮少價值者，貸款條件應適用本規定<mark>購置住宅貸款</mark>規範。Q4：自然人申辦全國公教員工房屋貸款(築巢優利貸)、財政部「青年安心成家購屋優惠貸款」，是否應受本規定限制？(本次增修)答：財政部「青年安心成家購屋優惠貸款」不受本規定自然人第1戶、第2戶購屋貸款限制，其餘均應受本規定限制。Q5：<mark>借款人辦理購置住宅貸款，金融機構可</mark>否<mark>以周轉金名義</mark>(資金用途代號為「4」)承作？答：否。<mark>金融機構辦理購置住宅貸款，</mark>不得以修繕、周轉金或其他貸款名目承作。Q6：借款人申辦<mark>購置住宅貸款，</mark>另以其他擔保品申辦貸款且資金實質流向購置該住宅者，是否應受本規定限制？(本次增修)答：是。"}},{"id":"114-17","y":114,"n":17,"m":10,"q":"營業單位轉列催收款項金額達新臺幣","o":["3,000萬元","3,500萬元","4,000萬元","4,500萬元 以上者應檢附最近一次「M0~M2 監控案件追償報告表」影本，事先申請債權管理處核准"],"a":1,"ci":{"b":"授信篇","c":"第五十八章 逾期放款之帳務處理","s":"第二節 催收款項","t":"一、逾期放款應於清償期屆滿六個月內轉入催收款項，應收保證款項，應於款項墊支日起算6個月內辦理轉入催收款項。二、營業單位轉列催收款項金額達新臺幣<mark>3,500萬元</mark>以上者應檢附最近一次「M0~M2監控案件追償報告表」影本，事先申請債權管理處核准。"}},{"id":"114-18","y":114,"n":18,"m":10,"q":"經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經（　）個月 仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。","o":["20 日","30 日","3 個月","6"],"a":2,"ci":{"b":"授信篇","c":"第六十一章 訴訟程序","s":"第一節 督促程序","t":"三、<mark>經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經</mark>三<mark>個月仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。</mark>(參照民事訴訟法第五百十五條)"}},{"id":"114-19","y":114,"n":19,"m":10,"q":"下列何種要保人為債務人之人身保險契約金錢債權，可以做為扣押或強制執行之標的？","o":["健康保險契約之解約金債權","傷害保險契約之解約金債權","年金保險契約，其受益人非要保人者，於年金給付期間之年金給付債權","以上皆非"],"a":3,"ci":{"b":"授信篇","c":"第六十二章 終局執行程序","s":"第二節 執行","t":"十三、對於其他財產權之執行即為實現債權人之<mark>金錢債權，< 期限內為提示者，即喪失對前手(即背書人)之追索權利，惟仍得對本票「發票人」聲請法院裁定後強制執行。"}},{"id":"114-34","y":114,"n":34,"m":11,"q":"辦理墊付國內票款，撥貸前應檢核借款人提供之客票，請問下列作業何者錯誤？","o":["相關內容是否符合票據法規範","票據背面註明備償借款專戶帳號及背書(放款印鑑)","應於負責人小章旁註明職稱，以免被視為背書不連續而退票","放款經辦應於票據明細表票面金額欄前首逐筆蓋章"],"a":3,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第二節 貸放","t":"(二)應檢核借款人提供之客票，相關內容是否符合票據法規範，另於票據背面註明「備償借款專戶」帳號及背書(放款印鑑)，並注意應於負責人小章旁註明職稱，以免被視為背書不連續而退票，將票據連同「<mark>票據明細表</mark>」送交代收，代收<mark>經辦應於</mark>「<mark>票據明細表</mark>」<mark>票面金額欄前首逐筆蓋章</mark>。"}},{"id":"114-35","y":114,"n":35,"m":4,"q":"借款人初次授信申請時，應辦理「顧客帳務資料查詢交易（9703）」及「保證資料查詢（A220）」交易，進行授信聯行查詢，下列敘述何者有誤？","o":["同一借款人如擬於不同營業單位往來，應先經原往來分行同意後，始得以經理權限進行申請","企業授信戶查詢對象為借款人、負責人、保證人","個人授信戶查詢對象為借款人、保證人","如查詢對象在聯行無授信往來(含 66 帳號結清銷戶者)及共同債務者，得逕行辦理授信申請"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"(三)為加強授信歸戶管理，除總行另有規定外，<mark>同一借款人</mark>限在同一家<mark>營業單位</mark>授信往來，<mark>如擬於不同營業單位往來，應先經原往來分行同意後，始</mark>以授信申請書申請區域中心或總行授信審核處核准，惟借款人於聯行授信往來僅有「勞工紓困貸款」或「信用卡處線上行銷部撥貸案件」，<mark>經原往來分行同意</mark>且屬適用<mark>經理權限</mark>者，得逕<mark>以經理權限</mark>核准。"}},{"id":"114-36","y":114,"n":36,"m":9,"q":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","o":["600 萬/1,200 萬","400 萬/800 萬","300 萬/600 萬","500 萬/1,000 萬"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"6.辦理授信申請，包含新貸、增貸及全額增貸，以及條件變更有增加、減少或更換擔保品，該案件徵提有正、副擔保品時須填寫「運用擔保品洗錢及資恐交易態樣檢核表」，並經防制洗錢及打擊資恐督導主管及經理覆核，作為授信申請之必要附件：(1)個人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>500萬</mark>元(含)以上；(2)法人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>1,000萬</mark>元(含)以上。"}},{"id":"114-37","y":114,"n":37,"m":4,"q":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？<br><span class=\"it\">A.</span> 借款人<br><span class=\"it\">B.</span> 企業授信戶之負責人<br><span class=\"it\">C.</span> 擔保物提供人<br><span class=\"it\">D.</span> 保證人","o":["AC","AD","ACD","ABCD"],"a":0,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"三、抵押權之塗銷(一)<mark>借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權</mark>有無不利<mark>影響，並辦理抵押權塗銷查詢作業</mark>。<mark>查詢對象</mark>為借款人及<mark>擔保物提供人</mark>，營業單位應執行「顧客帳戶資料查詢交易(9703)(查詢代號：11)」、「保證/共同債務資料查詢(A220)(查詢代號：1~2)」，並依下列方式辦理："}},{"id":"114-38","y":114,"n":38,"m":9,"q":"營業單位知悉企業授信戶有下列授信預警徵兆時，應立即填製「授信案件危機處理報告」向授信審核單位通報，倘經審核人員批示應列為預警戶者，再於次月辦理預警戶通報，下列敘述何者有誤？","o":["企業負責人涉及虛偽交易或掏空公司資產，遭檢調機關偵辦","媒體負面報導可能影響其營運者","企業所簽發支票發生拒絕往來原因退票","週轉金貸款因資金短絀申請展期二次（含）以上者"],"a":3,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"5、有證據顯示企業戶帳款、出貨遭展延，或致提列備抵損失增加，使營運發生鉅額虧損。1、<mark>週轉金貸款因資金短絀申請展期二次（含）以上者</mark>。"}},{"id":"114-39","y":114,"n":39,"m":4,"q":"有關不動產抵押權設定，下列敘述何者有誤？","o":["個人消費性貸款抵押權設定之權利種類，應由擔保物提供人自行勾選採「最高限額」或「普通」抵押權設定","受理「普通抵押權」設定申貸者，一律申請總行核准後辦理","屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"4.<mark>受理「普通抵押權」設定申貸者，</mark>營業單位一律以非循環額度<mark>申請總行</mark>或區域中心<mark>核准後辦理</mark>。(五)抵押權之設定程序、擔保物（不動產）登記簿、權利文件之保管，依本行相關規定辦理。"}},{"id":"114-40","y":114,"n":40,"m":8,"q":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","o":["原徵取之擔保品由本行活期性備償存款變更為等值本行定期存款","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","原徵取之擔保品由本行活期性備償存款變更為等值應收客票"],"a":3,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"(二)對符合信保基金信用保證規定之中小企業授信，應儘量洽請借款人同意移送該基金保證，以加強授信債權之安全。(三)對授信額度為等值新臺幣300萬元以下且信保基金保證成數達8成以上之案件，經個案審慎評估風險後，盡量不宜以存款備償方式加強擔保。"},"x":"活存備償改為<b>定存</b>（擔保力相當）可由經理核定；改為<b>應收客票</b>（擔保力下降）不得逕由經理核定。","lo":1},{"id":"114-41","y":114,"n":41,"m":8,"q":"有關本行集團關係戶之管理，下列敘述何者有誤？","o":["集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","[新]行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬","兩家企業之授信額度合計達新臺幣 25 億元者，已符合集團控管認定標準","授信新戶需同步申請集團限額時，集團限額核備日不得晚於授信案件核准日"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）區域中心辦理事項：1.轄管A、B、C組營業單位之企業授信戶在本行總<mark>授信額度</mark>分別逾<mark>新臺幣2</mark>.5億元、1.2億元、6,000萬元且未達6億元者之徵信業務（含負責人及保證人）。"},"x":"114 年版本中「兩家企業授信額度合計達 25 億即符合集團控管認定」為錯誤敘述（認定標準已修正，請以最新規定為準）；其餘：知會主責分行並副知法金處、可用 TEJ 集團名單輔助、核備日不得晚於核准日。","lo":1},{"id":"114-42","y":114,"n":42,"m":5,"q":"企業授信戶在金融機構總授信金額未達新臺幣 3,000 萬元，惟提供會計師財務報表查核報告，請問應向客戶徵取何種類資料表？","o":["小規模營利事業簡易資料表","簡易資料表","資料表","公司信用卡專用徵信資料表"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第三節 資料表之種類與運用","t":"7.最近三年營業狀況。8.進銷貨概況。9.存借款明細表。五、資料表（如範例五）適用對象：凡<mark>企業授信戶在金融機構總授信金額</mark>達新台<mark>幣3,000萬元</mark>(含)以上，或雖未達新台<mark>幣3,000萬元惟提供會計師財務報表查核報告</mark>者適用之。主要內容："}},{"id":"114-43","y":114,"n":43,"m":5,"q":"關於聯徵中心「查調證券商授信業務負面信用資料」(T70)功能，下列敘述何者錯誤？","o":["個人戶僅擔任負責人(非保證人)須查詢","於辦理授信業務特定目的始得查詢","僅辦理公司信用卡，不得查詢","應取得當事人書面同意始得查詢"],"a":0,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第二節 個人戶徵信報告之編製要領","t":"3.查調證券商授信業務負面信用情形(T70)：(1)<mark>僅擔任負責人(非保證人)</mark>：不得查詢。(2)非屬前述(1)之情形時：以向聯徵中心查詢結果記載之，應填列有/無授信負面信用資料註記、證券授信業務原始未清償總餘額、說明(點選代號:N0、N1、Y0、Y1)。"}},{"id":"114-44","y":114,"n":44,"m":9,"q":"關於徵信業務防制洗錢及打擊資恐作業，下列敘述何者正確？","o":["新貸戶免徵取「客戶業務往來聲明書」","續貸戶一律無須徵取「高階管理人員暨實質受益人聲明書」","查詢企業續貸戶「客戶風險評分交易」(A194)前，應確認風險因子異動紀錄第 19 項是否須辦理修改","境外進銷貨廠商免查證「存在真實性」及「所屬行業具關聯性」"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"2.續貸戶：應檢視前所徵取之「高階管理人員暨實質受益人聲明書」資料正確性，若有異動則須重新徵取。(二)辦理企業戶(含OBU)<mark>「客戶風險評分交易」(</mark>交易代號<mark>A194)</mark>，執行<mark>風險因子</mark>建檔、修改及查詢風險等級，並揭露風險評等結果，說明如下："}},{"id":"114-45","y":114,"n":45,"m":6,"q":"下列有關財務比率之敘述，何者正確？","o":["速動資產=現金及約當現金+短期性之投資+應收款項淨額+存貨淨額","速動比率係測知企業緊急之償債能力，比率愈高表示緊急償債能力愈強","流動比率又稱酸性測驗比率，係測知企業償債能力之基本比率","營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"2.<mark>速動比率</mark>計算公式：說明：(1)速動資產=現金及約當現金+短期性之投資+應收款項淨額（即：應收帳款＋應收票據－備抵呆帳）。而短期性之投資通常包括列報於流動資產之透過損益按公允價值衡量金融資產、以成本衡量之金融資產、透過其他綜合損益按公允價值衡量之金融資產、按攤銷後成本衡量之金融資產、避險之金融資產等會計項目。(2)此項比率又稱「酸性測驗比率」，用以測知<mark>緊急之償債能力，比率愈高</mark>，<mark>緊急償債能力愈強</mark>。當比率低於50%以下則<mark>表示緊急償債能力</mark>甚低。(3)以此比率評估企業<mark>之償債能力，</mark>與流動比率一般，須作相對性的研討。例如應收款項須進一步檢討其內容，檢視其中是否有過期之帳款，甚至收回困難者，另外收帳之速度是否有傾向緩慢之趨勢。"}},{"id":"114-46","y":114,"n":46,"m":9,"q":"辦理徵信作業之查詢項目中，何者「不」屬客戶善盡企業社會責任揭露項目？","o":["應向「行政院環境部列管污染源資料查詢系統」查詢企業戶是否為污染源列管中及曾發生違規紀錄","非公開發行公司免揭露近三年碳排量資訊","應向聯徵中心查詢最新之勞工退休準備金相關資訊","應向聯徵中心查詢企業是否有 ESG 獲獎資訊、評鑑資訊"],"a":1,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第三節 企業戶徵信報告(小額貸款專用)暨公司信用卡專用徵信報告","t":"6.ESG相關查詢及揭露事項:為落實責任金融，將客戶是否依環境面(E)、社會面(S)及公司治理面(G)善盡企業社會責任納入風險評估重點。(1)環境面(E)：應向「行政院環境部列管污染源資料查詢系統」（網址:http://prtr.epa.gov.tw/）查詢企業戶是否為污染源列管中及曾發生之違規紀錄；如客戶有提供或徵信人員查詢可得客戶<mark>近三年碳排量資訊</mark>(行政院環境部規範應盤查登錄溫室氣體排放量之排放源對象可至「事業溫室氣體排放量資訊平台」查詢，<mark>公開發行</mark>以上公司得查詢年報、永續報告書或TEJ資料庫)應揭露於徵信報告中；因應歐盟實施「碳邊境調整機制(CBAM)」，應洽詢客戶是否有相關產品輸歐，並揭露其碳排量與營運及財務面受影響程度。(2)社會面(S)：應向聯徵中心查詢最新之勞工退休準備金相關資訊記載之；倘為「食品/醫藥業」須至「衛生福利部食品藥物管理署」（網址:https://consumer.fda.gov.tw/）查詢有無違規紀錄。"}},{"id":"114-47","y":114,"n":47,"m":5,"q":"辦理個人授信戶之徵信作業，下列敘述何者錯誤？","o":["應查詢監護輔助宣告資料","個人授信戶於本行授信總餘額在新臺幣 200 萬元(含)以下得免徵同一關係人資料表","對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人資料表填寫","徵取「其他收入說明書」者應檢視、查證其內容之真實性"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）<mark>對達應徵提報稅資料匡計年度收入者，其最近一年收入總額應依個人</mark>綜合所得稅結算申報書填寫。（三）若<mark>收入總額</mark>與借款金額顯不相當時(特別是不敷利息支出)，應另徵取「其他收入說明書」補充說明其他收入來源。"}},{"id":"114-48","y":114,"n":48,"m":5,"q":"A 企業擬向本行申請「週轉金」性質之中長期授信新臺幣 1.5 億元，經查其聯徵中心歸戶餘額新臺幣 0.5 億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應徵取之中長期資料有哪些？<br><span class=\"it\">A.</span> 現金流量預估表<br><span class=\"it\">B.</span> 預估綜合損益表<br><span class=\"it\">C.</span> 預估資產負債表<br><span class=\"it\">D.</span> 個案預計資金來源去路表<br><span class=\"it\">E.</span> 營運計畫","o":["ABC","ABCE","ABCDE","無須加徵中長期資料"],"a":1,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他<mark>中長期授信</mark>：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、建廠進度表、<mark>營運計畫</mark>、<mark>現金流量預估表</mark>、<mark>預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信<mark>中心歸戶餘額</mark>及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯之金額</mark>。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"}},{"id":"114-49","y":114,"n":49,"m":5,"q":"有關企業授信戶徵信作業注意事項，下列敘述何者為非？","o":["資料表加蓋企業戶之公司設立/變更登記表或留存本行存、放款往來之印鑑","倘財報決算日距改編日超過 6 個月，應一律加徵期中報表","以交易代號 9704 查詢是否為銀行法或金控法規範之利害關係人","辦理「同一關係企業及集團企業」電腦建檔"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"核報告，亦即需徵取三年度財務報表。惟無論新編或改編徵信報告所徵取之財務資料，應以最近年度財務報表為準，且其<mark>決算日距改編日</mark>期不得逾8個月，倘期間超附錄二-18過8個月以上<mark>，應一律加徵期中報表</mark>辦理攤列並輔助分析說明。"}},{"id":"114-50","y":114,"n":50,"m":1,"q":"辦理購置「央行管控規定」不動產之「自然人第 3 戶含以上購屋貸款」，何者為非？","o":["向聯徵辦理歸戶查詢，自然人名下已有 2 戶以上房屋擔保放款，且資金用途為「1」，為購買建物權狀含「住」字樣之非高價住宅抵押貸款","應分別於授信申請、撥貸日及貸放後三個月，查核有無於本行或其他金融機構增加貸款","查核對象僅限借款人","不得申請寬限期"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)辦理購置「央行管控規定」不動產之案件(含借款人另提供其他房地辦理新貸或以既有「房貸」案辦理「增貸」，且資金用途為購置「央行管控規定」不動產)，應於撥貸前徵取借、保戶、擔保物提供人親簽之「申貸不動產抵押貸款切結書」，切結無另以修繕、周轉金或其他貸款名目，向本行或其他金融機構額外增加貸款，屬「自然人第2戶」、「第3戶(含)以上」購屋貸款、「高價住宅貸款」及「購地貸款」(消金案件)案件另需於撥款前提供自籌款來源證明(如存摺餘額、解約存單或出售有價證券等)，並分別於授信申請、撥貸當日及貸放後三個月共三個時間點辦理查核作業，查詢借款人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)下列事項，並填製「第一商業銀行辦理『央行管控案件』查核控管表(消金專用)」："}},{"id":"114-51","y":114,"n":51,"m":2,"q":"依現行「青年安心成家購屋優惠貸款」規範，以下何者為非？","o":["113 年 9 月 12 日起受理、核准或申請中之本貸款，應查詢聯徵「B98 青安貸款審核資訊」及「B95農安貸款審核資訊」","成數最高 8 成，額度最高新臺幣 1,000 萬元","112 年 7 月31 日(含)前撥貸者，得增貸提高原額度至新臺幣 1,000 萬元","借款人及擔保物提供人須簽署「青安貸款專用-自住切結書」"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"1.未綁約案未綁約案件(即無限制清償期間)－以青年安心成家購屋優惠貸款為例，假設110年7月7日為對保日(中華郵政二年期定期儲金機動利率為"},"x":"同 113-40。","lo":1},{"id":"114-52","y":114,"n":52,"m":2,"q":"有關「樂活貸」循環型房貸，下列敘述何者正確？","o":["中央銀行管控之案件不得適用本項貸款","借款對象經本行房貸信用評等模型評定為「低風險等級」或「中風險等級」之客群","不動產分級非 A 級且為登記總面積 15 坪以下(不含停車位)之套房者，應申請總行或區域中心核准後辦理","每二年辦理一次期中管理"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第二節 購置不動產貸款","t":"(六)限制項目：下列<mark>案件不得適用</mark>「前低後高-定額本金」償還方式：1.<mark>中央銀行管控之案件</mark>。2.政策性貸款。3.搭配樂活貸綜合循環型房貸申請。"}},{"id":"114-53","y":114,"n":53,"m":4,"q":"依銀行法第 12 條之 1、第 12 條之 2，銀行辦理「自用住宅放款」及「消費性放款」已取得足額擔保(擔保放款)時，除借戶有下列情形之一，為強化自身授信條件主動向銀行提供一般保證人外，不得以任何理由誘使其提供保證人。以下何者正確？","o":["「借戶總放款支出所得比」逾 70%","「借戶無擔保支出所得比」逾 35%","借戶年齡較大致可工作年限短於借款期限","以上皆是"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"1.不得要求借款人提供連帶<mark>保證人。</mark>2.<mark>已取得足額擔保</mark>者<mark>(擔保放款)</mark>：除借款人<mark>有下列情形之一，為強化</mark>其<mark>自身授信條件</mark>，<mark>主動向銀行提供一般保證人外，不得以任何理由誘使</mark>借款人<mark>提供保證人</mark>：(1)有還款能力不足情形：A.借款人薪資收入條件不足，判別標準係指符合<mark>下列情形之一</mark>者：(A)「借戶總放款支出所得比」逾70%者。(B)「借戶無擔保支出所得比」逾35%者。B.借款人年齡較大致使可工作年限短於借款期限。(2)有信用不良紀錄(含信評結果屬高風險案件者)。(3)所提供之擔保品非屬自己所有。"}},{"id":"114-54","y":114,"n":54,"m":1,"q":" 客戶","最近一個月授信有逾期 30 天以上紀錄"],"a":2,"x":"(1)信用不良、(2)債務協商 → 得收回；(3)利息逾期 30 日以上、(4)繳款不良 → 由營業單位判斷。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第7頁","s":"","t":"若PB−18C報表顯示客戶之信用查詢狀態有下列(1)至(4)項情形之一者，將由系統控管自動停止客戶「樂活貸」循環額度之使用，<mark>其中若為(1)、(2)項，則營業單位得收回借款人之循環額度</mark>；"}},{"id":"S2-24","m":2,"q":"「樂活貸」執行恢復（代碼 2）時，下列何者須<b>立即歸正透支動用餘額</b>？","o":["經暫停（代碼 6）者","經中止（代碼 8）者","兩者皆須","兩者皆不須"],"a":1,"x":"暫停恢復時無需立即歸正（惟需無未繳逾期利息）；中止係因加速條款事由，恢復時需立即歸正。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第13頁","s":"","t":"<mark>執行恢復（代碼：2）時，需立即歸正透支動用餘額</mark>。"}},{"id":"S2-25","m":2,"q":"本行「高資產客戶」辦理「樂活貸」續約，續約申請日前一個月內「客戶資產報告書」總資產餘額達多少以上，得免重徵財力證明？","o":["1,000 萬元","3,000 萬元","5,000 萬元","1 億元"],"a":2,"x":"達新臺幣 5,000 萬元（含）以上者得免重徵，並得採行內既有財資力佐證文件。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第8頁","s":"","t":"七、契約到期作業：(一)契約到期應注意事項：1.契約到期前2個月之客戶名單顯示於PB-18報表，營業單位應向客戶徵取財力證明（本行「高資產客戶」辦理續約時，倘續約申請日前一個月內之「客戶資產報告書」所列<mark>「總資產餘額」達新臺幣5,000萬元（含）以上者，得免向借款人重徵財力證明</mark>，並得採行內既有財資力佐證文件，如:資產報告書等據以認定)及查詢客戶是否有更換身分證，若有更換應重徵身分證影本，並辦理續約及不動產重估作業。"}},{"id":"S2-26","m":2,"q":"「樂活貸」之預約續約作業，得於何時執行？","o":["契約到期日前 1 個月內","契約到期日前 5 個營業日內，惟到期當日不得執行","契約到期當日","契約到期後 5 個營業日內"],"a":1,"x":"須先於 e-Loan 申請續約核准；取消預約續約以 1120「代碼 C」。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第11頁","s":"","t":"2.<mark>契約到期日前5個營業日內可執行本作業，惟契約到期當日不得執行</mark>。"}},{"id":"S2-27","m":2,"q":"「樂活貸」契約屆期不予續約而辦理「展期轉換為非循環貸款」，其貸款期限最長為何？","o":["10 年（不含原循環期間）","20 年（包含原循環貸款期間 3 年或 5 年）","20 年（另加原循環期間）","30 年"],"a":1,"x":"須總行或區域中心核准、貸款種類 V7、利率以不低於原循環利率為原則、金額不得逾原透支餘額。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第12頁","s":"","t":"4.貸款期限：<mark>最長20年(包含原循環貸款期間3年或5年)</mark>。"}},{"id":"S2-28","m":2,"q":"「樂活貸」透支動用之貸款利息，結息及扣繳日期為何？","o":["每月 20 日結息，21 日中心轉帳扣繳","每月 21 日結息，22 日扣繳","每月月底結息，次月 1 日扣繳","每季結息一次"],"a":0,"x":"以立約帳戶每日結欠最高餘額為積數基礎，每月 20 日結息，21 日由資訊處中心轉帳扣繳；餘額不足改人工收息。","src":2,"ci":{"b":"要點：「樂活貸」循環型房貸業務作業應注意事項","c":"第5頁","s":"","t":"五、透支動用之利息連線作業：（一）<mark>貸款利息於每月20日結息一次</mark>，就借款人立約帳戶每日結欠最高餘額為借款積數之計算基礎，由資訊處於每月21日逕自借款人立約帳戶內以中心轉帳方式扣繳利息，倘借款人立約帳戶可動用餘額不足支付貸款利息時，電腦將不辦理自動扣償，須改以人工辦理收息手續。"}},{"id":"S2-29","m":2,"q":"依「高資產客戶保費及保單融資作業要點」，<b>保費融資</b>之貸款成數上限為何？","o":["以首期躉繳保費為基礎最高 7 成","以首期躉繳保費為基礎最高 7.5 成，惟不得逾保單首日解約金","以保單價值準備金為基礎最高 9 成","以保額為基礎最高 5 成"],"a":1,"x":"保費融資 7.5 成（不得逾首日解約金）；保單融資以保價金或解約金孰低之 9 成。","src":2,"ci":{"b":"要點：高資產客戶保費及保單融資作業要點","c":"第1頁","s":"","t":"(二)貸款成數：1.保費融資：依保單首期躉繳保費金額為基礎，<mark>貸款成數最高為7.5成，惟貸放金額不得逾保單首日解約金額</mark>。"}},{"id":"S2-30","m":2,"q":"地方資產管理專區之<b>保單融資</b>，其貸款期限為何？","o":["最長 1 年，惟不得逾該保單到期日","最長 3 年","最長 10 年","最長 30 年"],"a":0,"x":"保費融資最長 10 年；保單融資最長 1 年且不得逾保單到期日，按月繳息、到期還本。","src":2,"ci":{"b":"要點：高資產客戶保費及保單融資作業要點","c":"第2頁","s":"","t":"(二)<mark>保單融資：貸款期限最長1年，惟不得逾該保單到期日</mark>。"}},{"id":"S2-31","m":2,"q":"地方資產管理專區之保費及保單融資，有關額度權限與 DBR 之規定，下列何者正確？","o":["須徵一般保證人並適用 DBR22","經理於個別分行個人無擔保權限內，以免保人之信用貸款方式辦理，且不適用 DBR22","一律送總行核定","以擔保放款權限核定並適用 DBR22"],"a":1,"x":"歸戶後逾個別分行權限者應申請總行或區域中心核准；本業務排除 DBR22。","src":2,"ci":{"b":"要點：高資產客戶保費及保單融資作業要點","c":"第2頁","s":"","t":"(二)額度權限：1.授權營業單位經理於「個別分行授信權限額度核給範圍」之<mark>個人無擔保授信權限內，以免保人之「信用貸款」方式辦理</mark>，惟歸戶後逾「個別分行授信權限額度核給範圍」者，應申請總行或區域中心核准後辦理。"}},{"id":"S2-32","m":2,"q":"保費融資額度申請為<b>外幣</b>時，得採用之償還方式為何？","o":["年金法或本金法，首次寬限期最長 2 年","僅得依本金法按月攤付本息（首次寬限期最長 2 年）或按月繳息到期還本","僅得到期一次還本付息","年金法，無寬限期"],"a":1,"x":"新臺幣額度可用年金法或本金法；外幣額度僅本金法或按月繳息到期還本。","src":2,"ci":{"b":"要點：高資產客戶保費及保單融資作業要點","c":"第2頁","s":"","t":"2.額度申請為外幣時，得依下列方式擇一辦理：(1)<mark>依本金法，按月平均攤付本息，首次寬限期最長2年</mark>。"}},{"id":"S2-33","m":2,"q":"地方資產管理專區保費及保單融資，額度申請為新臺幣時之最低貸款金額為何？","o":["新臺幣 30 萬元","新臺幣 50 萬元","新臺幣 100 萬元，並以萬元之倍數為單位","無最低金額"],"a":2,"x":"新臺幣最低 100 萬元（萬元倍數）；外幣最低等值美金 3 萬元。","src":2,"ci":{"b":"要點：保費及保單融資作業應注意事項(資產管理專區)","c":"第2頁","s":"","t":"3.<mark>額度申請為新臺幣時，最低貸款金額新臺幣100萬元</mark>，並以新臺幣萬元之倍數為單位；"}},{"id":"S2-34","m":2,"q":"保費及保單融資之保險契約擔保維持率介於 <b>95%～100%</b> 且連續達五個營業日時，應辦理何種通知？","o":["還款預警通知","還款通知（償還差額）","期限利益喪失通知","無須通知"],"a":0,"x":"95%～100% 連續 5 營業日 → 還款預警通知書＋電話；低於 95% → 還款通知書，15 個營業日內償還差額。","src":2,"ci":{"b":"要點：保費及保單融資作業應注意事項(資產管理專區)","c":"第4頁","s":"","t":"3.還款預警及還款通知作業：（1）還款預警通知：<mark>保險契約擔保維持率介於95%至100%間且連續達五個營業日時</mark>，依客戶所約定綜合業務對帳單之寄送方式，寄送「還款預警通知書」並電話通知借款人知悉。"}},{"id":"S2-35","m":2,"q":"保費及保單融資擔保維持率低於 95%，以掛號寄發還款通知書後，借款人償還差額之期限自寄發次日起算不得超過多久？","o":["五個營業日","十個營業日","十五個營業日","一個月"],"a":2,"x":"不得超過 15 個營業日，逾期未償還得主張期限利益喪失（受益權質借、倫巴底之補倉期限則為 5 個營業日）。","src":2,"ci":{"b":"要點：保費及保單融資作業應注意事項(資產管理專區)","c":"第4頁","s":"","t":"惟該攤還之期限應斟酌匯率市價變動情形，惟<mark>自以掛號信寄發還款通知書之次日起算不得超過十五個營業日</mark>，如逾期未履行償還部分借款時，營業單位得依借款契約約定主張期限利益喪失。"}},{"id":"S2-36","m":2,"q":"保費及保單融資發生期限利益喪失事由時，本行處理方式何者正確？","o":["須先取得借款人同意始得終止保險契約","通知借款人將向保險公司主張終止保險契約，無須另行取得借款人之同意","僅得向保證人求償","應先辦理保單借款抵償"],"a":1,"x":"保險公司將應給付要保人之金額於債務範圍內直接匯入約定帳戶（66 帳號）沖償；抵銷前應以存證信函寄行使抵銷通知書。","src":2,"ci":{"b":"要點：保費及保單融資作業應注意事項(資產管理專區)","c":"第5頁","s":"","t":"「地方資產管理專區」專用面【保費及保單融資貸款_期限利益喪失通知書】(下簡稱期限利益喪失通知書)、「行使抵銷通知書」通知借款人<mark>將向保險公司主張終止保險契約，無須另行取得借款人之同意</mark>，保險公司將應給付予借款人(即要保人)之保險金額，於保費/保單融資債務範圍內，直接匯入借款人與本行約定之帳戶，再以返還款項沖償借款，以維本行債權。"}},{"id":"S2-37","m":2,"q":"保費及保單融資貸放後，轉介分行應於何時確認保單已完成保費／保單融資批註註記？","o":["貸放當日","貸放後第五個營業日起一個月內","貸放後三個月內","保單週年日"],"a":1,"x":"登入保險業務系統「客戶關係管理」查詢並傳送新興分行，核對後更新擔保品調查表。","src":2,"ci":{"b":"要點：保費及保單融資作業應注意事項(資產管理專區)","c":"第4頁","s":"","t":"「地方資產管理專區」專用2.貸放外幣(1)會計項目：54852(消費者貸款手續費)(2)大項：3T（消金外幣貸款）(6)中項：13保費融資貸款或14保單融資貸款(3)小項：001非循環(4)細項：001六、貸放後管控作業(新興分行)(一)<mark>自貸放後第五個營業日起一個月內</mark>，轉介分行招攬人員應登入保險業務系統「客戶關係管理」功能，於客戶清單查詢中輸入要保人ID，確認申辦本貸款之保單是否已完成保費/保單融資註記及其註記日期，並將查詢結果傳送新興分行，新興分行應與「擔保品調查表」核對後，據以更新「擔保品調查表」相關資料。"}},{"id":"S3-1","m":3,"q":"營建融資之貸放成數，原則上不得超過預估建築物興建造價之幾成？","o":["四成","五成","六成","七成"],"a":1,"x":"原則 5 成；個案 LTV 低於 5 成者，營建融資原則不得超過 6 成。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(二)<mark>營建融資原則上不得超過預估建築物興建造價之五成</mark>，另依專案函布之優惠融資要點辦理除外，惟個案融資價值比(LoanToValue)低於五成者，營建融資原則上不得超過預估建築物興建造價之六成。"}},{"id":"S3-2","m":3,"q":"建築貸款基地面積超過 200 坪且興建 11 層樓以上者，貸款期限最長以不超過幾年為原則？","o":["3 年","5 年","6 年","10 年"],"a":2,"x":"200 坪內或 10 層以下最長 3 年；超過 200 坪且 11 層以上個別核定，最長 6 年。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"<mark>基地面積超過200坪且11層樓以上者，按實際需要及興建計畫個別核定，惟最長以不超過六年為原則</mark>。"}},{"id":"S3-3","m":3,"q":"有關建築貸款工程進度之追蹤，下列何者正確？","o":["自貸放日起至少每月追蹤一次","自貸放日起至少每二個月追蹤一次","自貸放日起至少每三個月追蹤一次，並填報「計畫執行進度追蹤表」","僅於動撥營建融資時查驗即可"],"a":2,"x":"至少每 3 個月追蹤並至 e-Loan 填報追蹤表；動工認定以機具進場持續施工為準。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第二節 貸放、收回","t":"四、勘驗前項工程進度應由借款人提供監造建築師（或監造人）之勘驗紀錄或承造人之工程進度證明或會同監造建築師（或監造人）實地查驗辦理或委由建築經理公司辦理查核，<mark>自貸放日起至少每三個月確實追蹤工程進度</mark>，並至企金e-loan系統填報「計畫執行進度追蹤表」，工程進度相關證明文件與進度追蹤表應存卷備查。"}},{"id":"S3-4","m":3,"q":"徵取建築基地為擔保時，借款人應承諾於建物取得使用執照並辦妥保存登記後多久內，設定第一順位抵押權予本行？","o":["一個月","二個月","三個月","六個月"],"a":2,"x":"三個月內設定第一順位抵押權；股份有限公司之承諾依銀行法第 30 條經董事會決議。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(二)徵取建築基地為擔保時，應請借款人等填具承諾書，承諾將建造中之建築物提供本行為擔保品，<mark>並於建竣後取得建築主管機關核發之使用執照並辦妥保存登記後三個月內設定第一順位抵押權予本行</mark>。"}},{"id":"S3-5","m":3,"q":"下列何種營建融資案件，<b>得不受</b>個案銷售率不低於 LTV 之限制？","o":["位於 B 級地區之重劃區建案","地處偏僻山坡地之建案","屬都市更新、危老重建且搭配本行不動產信託有完善續建機制者","鄰近區域推案量供過於求之建案"],"a":2,"x":"都更、危老或經建經公司管理並搭配本行不動產信託續建機制者，及土地融資，得不受銷售率限制。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"<mark>另屬都市更新、危老重建或建案有經東亞建築經理股份有限公司辦理建經管理</mark>，且搭配本行不動產信託有完善之續建建制，得不受銷售率之限制。"}},{"id":"S3-6","m":3,"q":"營業單位辦理放款核准資料登錄(640)時，建築貸款之「土地融資」擔保內容應勾選為何？","o":["無擔保(01)","土地-建築用地(15)","建物(20)","依實際用途自行選擇"],"a":1,"x":"貸款種類一律建築貸款(31)；土融擔保內容一律「土地-建築用地(15)」；營建融資以無擔保(01)或適當選項。","ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第二節 貸放、收回","t":"<mark>土地融資擔保內容一律勾選土地-建築用地(15)</mark>、營建融資則以無擔保(01)或適當選項。"}},{"id":"S3-7","m":3,"q":"辦理建築貸款，下列何者<b>得以</b>循環額度方式辦理？","o":["土地融資","營建融資","營建週轉金","以上皆不得"],"a":2,"x":"除營建週轉金外，建築貸款一律以非循環額度辦理。","src":1,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(二)<mark>除營建週轉金外，本貸款應一律以「非循環額度」方式辦理</mark>，授信批覆書有效期限不受現行規定之限制，應於授信條件中敘明最長有效期限，且不受核准後六個月內辦理第一次撥貸之規定。"}},{"id":"S3-8","m":3,"q":"購入都市計畫住宅區土地之土融，購價 1.2 億元、鑑價 1 億元、貸款 5,000 萬元，逾預計動工日仍未動工，應先收回至少多少？","o":["250 萬元","500 萬元","600 萬元","1,000 萬元"],"a":1,"x":"依購價/鑑價孰低（1 億）之 0.5 成＝500 萬；之後每 12 個月再收回至少 1 成。","src":1,"ci":{"b":"講義：授信商品及應注意事項","c":"第14頁","s":"","t":"建築貸款土地融資：原則上應搭配動工切結機制，除都更、危老與土地重劃等個案外，土融應切結貸放後合理期間內動工，如為購入都市計畫住宅區與商業區土地，其合理期間原則上不得多於18個月，如逾預計動工日仍未動工，則應收回至少0.5成(如購價1.2億元/鑑價1億元，貸款5000萬元，<mark>應依購價/鑑價兩者孰低之0.5成收回500萬元</mark>)借款，嗣後每12個月應收回至少1成借款，並自切結動工之日起及其後每6個月為一期，每期採階梯式利率加碼，每次加碼以不得低於0.1%為原則，另屬「工業用土地貸款應注意事項」規範之土融，則依該注意事項辦理。"}},{"id":"S3-9","m":3,"q":"工業用土地貸款切結貸放後一年內未動工，其利率加碼及收回規定為何？","o":["第 13～18 個月加 1 碼、第 19～24 個月再加 1 碼，二年後仍未動工全數收回","一律立即收回","每半年加碼 0.1%","僅需展延"],"a":0,"x":"工業用土地動工切結：13～18 月加 1 碼、19～24 月再加 1 碼、二年未動工全數收回。","src":1,"ci":{"b":"講義：授信商品及應注意事項","c":"第16頁","s":"","t":"2.應徵取興建動工切結書（工業用土地），切結貸放後未於一年內動工，<mark>第13~18個月利率加1碼，第19~24個月再加1碼，二年後仍未動工者，應全數收回融資</mark>。"}},{"id":"S3-10","m":3,"q":"受理工業用土地貸款時，應先查詢聯徵何項產品判斷是否屬閒置工業用土地？","o":["B28、B33","B50、B49","B68","T70"],"a":1,"x":"應先查詢聯徵 B50 及 B49 判斷並留存；且一律送總行或區域中心核定。","src":1,"ci":{"b":"講義：授信商品及應注意事項","c":"第16頁","s":"","t":"工業用土地貸款應注意事項授信階段/分類<mark>應先查詢聯徵「B50」及「B49」</mark>，判斷是否屬於「閒置工業用土地」並留存備查。"}},{"id":"S3-11","m":3,"q":"營建融資之承攬廠商，應具結放棄民法第幾條因承攬工程取得之法定抵押權？","o":["第 513 條","第 753 條之 1","第 880 條","第 1088 條"],"a":0,"x":"承攬廠商具結放棄民法 513 條法定抵押權，以確保本行抵押權。","src":1,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"四、借款人如將興建工程發交與其他承攬廠商承攬建造，<mark>應由承攬廠商具結放棄民法第五百十三條因承攬工程而取得之法定抵押權</mark>外，另應於撥款作業審查建築業者資金流向時，須有營造廠出具之上期工程款收款證明或其他證明。"}},{"id":"S4-1","m":4,"q":"本行 115 年 1 月核准甲公司短放 8,000 仟元，徵取董事長 A、董事 B 為連帶保證人。3 月貸放 3,000 仟元；4 月 B 卸任董事且未簽續任保證人同意書；5 月再貸放 2,000 仟元。下列何者正確？","o":["B 對兩筆貸放皆不負保證責任","B 僅對 3 月之貸放負保證責任，5 月之貸放僅 A 負責","A 僅對 3 月之貸放負保證責任","B 對兩筆貸放皆須負保證責任"],"a":1,"x":"民法 753-1：董事卸任後僅就任職期間所生債務負責；卸任後之新貸放由 A 負責（同 110-8、113-24 題型）。","ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"二、(一)民法第753-1條文：「因擔任法人董事、監察人或其他有代表權之人而為該法人擔任保證人者，僅就任職期間法人所生之債務負保證責任」，即擔任法人董事、監察人或其他有代表權之人，為該法人擔任保證人者，僅須就任職期間法人之借款債務負保證責任，<mark>卸職後，對借戶新發生之借款保證人不負保證責任</mark>。"}},{"id":"S4-2","m":4,"q":"依法定代位清償人同意書之格式，所謂「終止」部分連帶保證人責任係指？","o":["溯及最初解除保證責任","向後發生解除保證責任","僅解除利息部分之保證","塗銷抵押權"],"a":1,"x":"「免除」＝溯及最初；「終止」＝向後發生。112 年以「向後發生→免除格式」為錯誤選項。","ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"<mark>「免除」係指溯及最初為解除保證責任之意；「終止」係指向後發生解除保證之意</mark>。"}},{"id":"S4-3","m":4,"q":"有關保證人之徵提，下列敘述何者錯誤？","o":["除另有規定外，擔保放款以一人保證、無擔保放款以二人保證為原則","合夥行號為人作保時，應徵取全體合夥人之同意書","如符合民法第 1088 條「為子女之利益」，得徵取未成年人為保證人","限於依法律或公司章程規定以保證為業務之公司，始得接受其為保證人"],"a":2,"x":"不得徵取未成年人為保證人；1088 條只適用於未成年人擔任借款人或擔保物提供人。","ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"(九)<mark>不得徵取未成年人為保證人；對擔保物提供人為未成年時</mark>，應確認符合民法第1088條「為子女之利益」意旨始得受理，於其成年時，並得免徵「擔保物提供承認書」。"}},{"id":"S4-4","m":4,"q":"動產抵押之設定期限，除另有規定外，應如何訂定？","o":["與貸放期限相同","貸放期限加一年","貸放期限加三年","貸放期限加五年"],"a":3,"x":"一律以貸放期限加 5 年為準，且貸放期限應較標的物剩餘耐用年限縮短 1 年以上。","ci":{"b":"授信篇","c":"第十章 動產擔保交易","s":"第一節 動產抵押","t":"(三)為確保本行債權，除另有規定外，<mark>設定期限一律以貸放期限加五年為準</mark>，貸放期限應較標的物剩餘耐用期限或被淘汰期限縮短一年以上。"}},{"id":"S4-5","m":4,"q":"借款人申請塗銷不動產抵押權，抵押權塗銷同意書等權利文件之領回方式，下列何者正確？","o":["僅得由借款人單獨領回","由借款人及擔保物提供人共同簽章領回，或確認擔保物提供人身分後由其簽章領回","一律郵寄地政機關","擔保物提供人不得領回"],"a":1,"x":"共同簽章領回；亦得確認擔保物提供人（所有權人）身分後由其簽章領回。112 年以「不得由擔保物提供人簽章領回」為錯。","ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"(五)1.抵押權塗銷同意書連同抵押權設定契約書、他項權利證明書應登記於放款權利證件授受登記簿(放193)，<mark>並由借款人及擔保物提供人共同簽章領回，亦得於確認擔保物提供人(所有權人)身分後，由其簽章領回</mark>。"}},{"id":"S4-6","m":4,"q":"依銀行法第 12 條之 2，「自用住宅放款」已取得足額擔保，借款人於下列何種情形<b>主動</b>提供一般保證人時，銀行始得接受？","o":["「借戶總放款支出所得比」逾 50%","「借戶無擔保支出所得比」逾 35%","借款人為公務員","貸款期限逾 10 年"],"a":1,"x":"判別標準：總放款支出所得比 >70%、無擔保支出所得比 >35%、年齡致工作年限短於期限、信用不良、擔保品非自有。","ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"撥貸當日倘借款人聯徵B33/B36有新增借款額度，應重新計算支出所得比，並填製「消費者貸款支出所得比自行計算暨授信評估表」，評估授信風險變化，針對「借戶總放款支出所得比」逾70%或<mark>「借戶無擔保支出所得比」逾35%者</mark>，應於評估表敍明承做理由，逐級呈核至撥貸單位主管核定，倘評估結果擬調整授信條件時，應於消金e-loan系統辦理條件變更，並檢視契約辦理更換或另簽增補約後始可貸放。"}},{"id":"S4-7","m":4,"q":"「額度核定通知書」寄交借戶後，倘無法取得借戶蓋妥授信往來印鑑之回執聯，應如何辦理？","o":["電話確認即可","以平信郵寄","以雙掛號郵寄，並留存郵政回執聯與通知書影本","免寄發"],"a":2,"x":"回執聯應蓋授信往來印鑑交回存卷；無法取得者以雙掛號郵寄並留存郵政回執聯。","ci":{"b":"授信篇","c":"第三章 授信申請","s":"第五節 授信申請書之編號及發送","t":"(三)倘無法取得借戶蓋妥授信往來印鑑之回執聯，<mark>則應以雙掛號郵寄「額度核定通知書」予借戶</mark>，並將郵政回執聯與「額度核定通知書」影本併同留存備查。"}},{"id":"S4-8","m":4,"q":"備償借款專戶之借戶已無授信往來者，應於多久內完成清理？","o":["6 個月","1 年","1 年 6 個月","2 年"],"a":2,"x":"自無授信往來起算 1 年 6 個月內完成，每月至 OnDemand 列印清理名單（PB20M）。","ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第二節 備償借款專戶存款設質","t":"四、備償借款專戶清理：(一)<mark>對無授信往來者，應於借戶無授信往來起算1年6個月內 作單」</mark>及至信保基金網路作業系統辦理信用惡化通知，並於每月月底前將當月執行結果列印陳核後存卷備查。"}},{"id":"S7-2","m":7,"q":"下列何者<b>屬於</b>信用保證案件應於知悉之日起十日內、最遲二個月內通知信保基金之信用惡化情事？","o":["負責人之配偶受票據交換所拒絕往來處分","應繳付之利息延滯逾一個月未逾三個月","未能依約分期攤還已超過一個月","負責人變更"],"a":2,"x":"停業、分期攤還逾 1 個月、利息延滯逾 3 個月、授信對象或其負責人拒往；配偶不算。","lo":1},{"id":"S7-3","m":7,"q":"「微型創業鳳凰貸款」之期限及擔保，下列何者正確？","o":["最長 5 年，應徵 2 名保證人","最長 7 年，信保基金保證 9.5 成，免徵提其他擔保品","最長 7 年，信保 8 成並徵保證人 1 人","最長 10 年，須提供不動產擔保"],"a":1,"x":"最長 7 年按月攤還（寬限期 1 年需經同意）；信保 9.5 成、免擔保品；合意徵十足擔保者得免送保。","ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第二節 微型創業鳳凰貸款","t":"七、擔保：<mark>財團法人中小企業信用保證基金保證9.5成，免徵提其他擔保品</mark>。"}},{"id":"S7-4","m":7,"q":"「企業小頭家貸款」之貸款對象，其僱用員工人數限制為何？","o":["5 人以下","10 人以下","20 人以下","50 人以下"],"a":1,"x":"員工 10 人以下之營利事業（不含金融保險、特殊娛樂業）；113 年以「20 人以下」為錯誤敘述。","ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第一節 企業小頭家貸款","t":"一、對象：依法辦理公司、有限合夥、商業或稅籍登記，<mark>僱用員工人數10人以下之營利事業，但不包含金融及保險業、特殊娛樂業</mark>。"}},{"id":"S7-5","m":7,"q":"「青年創業及啟動金貸款」之額度動用，下列何者正確？","o":["得循環動用","得借新還舊","得分次申請及分批動用，惟不得循環動用且不得借新還舊","須一次全額動用"],"a":2,"x":"三類額度（準備金 200 萬、週轉性 400 萬、資本性 1,200 萬）均得分次分批，但不得循環、不得借新還舊。","ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十二節 青年創業貸款","t":"<mark>以上均得分次申請及分批動用，惟不得循環動用且不得借新還舊</mark>。"}},{"id":"S7-6","m":7,"q":"「深化中小企業專案貸款」之中期週轉融資及資本性支出融資，應以何種額度辦理？","o":["限以循環額度辦理","限以非循環額度辦理","循環或非循環皆可","僅能以透支額度辦理"],"a":1,"x":"限非循環額度；110 年以「中期週轉融資得以循環額度辦理」為錯誤敘述。對象不含建築業及營造業。","ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十四節 深化中小企業專案貸款","t":"(四)<mark>本貸款之中期週轉融資及資本性支出融資限以非循環額度辦理</mark>。"}},{"id":"S7-7","m":7,"q":"「海外投資融資貸款」之貸款額度，以對外投資金額之幾成為限？","o":["五成","六成","七成","八成"],"a":3,"x":"以對外投資金額 8 成為限，每家廠商累計最高 10 億元；113 年以「七成」為錯誤敘述。","ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第八節 海外投資融資貸款","t":"七、貸款額度：<mark>本貸款以對外投資金額之八成為限，每家廠商累計核准適用本貸款額度最高不得超過新台幣十億元</mark>。"}},{"id":"S8-1","m":8,"q":"依綜合授信額度運用原則，下列敘述何者正確？","o":["丁類各單項授信額度間得相互移用","丁類未用額度得移給甲類無擔保授信使用","未申請丁類授信額度者，不得移用「擔保授信」未用額度辦理該類授信","丙類未用額度不得移給乙類使用"],"a":2,"x":"丁類各單項不得互移、未用不得移給甲乙丙；未申請丁類者不得移用擔保額度；丙類可移給條件較優之乙、甲類。","ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第 融資","s":"第二節 專案融資","t":"本業務要點所指「專案融資案件」係專案計畫性質具備下列條件之一<mark>且融資額度達等值新臺幣50億元(含)以上者</mark>：（一）依政府採購法辦理之政府採購案(包括但不限於公共工程)。"}},{"id":"S11-8","m":11,"q":"辦理墊付國內票款（票借短放），所徵取票據同一發票人累計未銷帳金額，原則上不得超過授信額度之多少？","o":["10%","20%","30%","50%"],"a":1,"x":"同一發票人（含利害關係企業及個人）累計未銷帳 ≤ 額度 20%；從寬需於授信條件敘明並經核准。","ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第一節 申請","t":"七、票據集中度限額：以會計項目「17426短期放款-票借短放」或、票據集中度限額：以會計項目「17426短期放款-票借短放」或以100%以上保持票方式(會計項目「17442短期放款-其他短放」)辦理之授信案件，其所徵取之票據，同一發票人(含有利害關係之企業及個人)<mark>累計未銷帳金額(含前徵取票據)不得逾其授信額度金額20%</mark>。"}},{"id":"S11-9","m":11,"q":"墊付國內票款以會計項目「17442 短期放款-其他短放」（保持票方式）辦理者，客票兌現時應如何處理？","o":["應逐筆依兌現金額沖償借款","免逐筆沖償，可由借戶存入等額票據後退還兌現款或到期還款","一律轉列催收","須經總行核准"],"a":1,"x":"17426 票借短放逐筆沖償；17442 免逐筆沖償。","src":1,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第一節 申請","t":"2、「短期放款-其他短放(17442)」：以徵取(或保持)100%(含)以上或貸放餘額若干成數(即成數未達100%者)應收客票為申請條件之授信(如新臺幣授信、外匯授信、間接授信等)」：，營業單位經理得酌情視借戶往來情況，<mark>免逐筆沖償借款，可由借戶存入等額票據後始退還該兌現款項</mark>，或俟借款到期後始辦理還款。"}},{"id":"S11-10","m":11,"q":"墊付國內票款所徵同一發票人票據，累計未銷帳金額達新臺幣多少以上時，應依規定實地查證（一年內已查證者得免）？","o":["50 萬元","100 萬元","300 萬元","500 萬元"],"a":2,"x":"300 萬以上實地查證；50 萬以上徵統一發票並做 6650 建檔與 AML 名單檢核。","src":1,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第二節 貸放","t":"三、為防止融通票據及避免風險集中，對本次所徵取(含未及入庫)同一發票人(含有利害關係之企業及個人)之票據，加計「放款所徵票據歸戶管理統計表」(CRHL01)或「放款所徵票據歸戶管理明細表」(CRHL11)代收中票據後，累計『未銷帳金額』達「新臺幣300萬元(含)以上」時，<mark>應確依下述實地查證方式辦理(一年內已查證者，得免再查證)</mark>：(一)發票人(買方)為上市(櫃)公司、興櫃公司、公開發行公司、公營企業或實收資本額達1億元以上之國內知名廠商：應查詢公開資訊並留存相關資訊備查，將查證結果填載於「公司進貨/銷貨廠商明細資料表」之「廠商查證結果」欄，免前往發票人營業所或工廠實地查證。"}},{"id":"S11-11","m":11,"q":"有追索權應收帳款承購業務之授信科目為何？","o":["應收承購帳款-無追索權(14419)","未收代收款-帳款託收(23825)","短期放款-票借短放(17426)","應收保證款項"],"a":1,"x":"有追索權：未收代收款-帳款託收(23825)；無追索權：應收承購帳款-無追索權(14419)。","src":1,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第四節 額度申請","t":"2.會計項目無追索權：應收承購帳款-無追索權-應收承購帳款（一）(14419)<mark>有追索權：未收代收款-帳款託收(23825)</mark>3.「額度」欄：填寫承購額度。"}},{"id":"S11-12","m":11,"q":"倫巴底貸款（Lombard Lending）之核准最高額度為何？","o":["設質金額之 100%","設質金額之 120%","設質金額之 150%","無上限"],"a":2,"x":"依初始徵提金融資產組合設質金額 150% 為申請上限；質借最多三次。","src":1,"ci":{"b":"講義：授信商品及應注意事項","c":"第17頁","s":"","t":"核准最高額度:<mark>依初始徵提金融資產組合之設質金額150%為申請上限</mark>。"}},{"id":"S11-13","m":11,"q":"洗錢風險等級為<b>高風險</b>之客戶以交易彙總清單申辦進出口外幣貸款，清單逾 100 筆時至少應抽樣幾筆？","o":["1 筆","3 筆","5 筆","10 筆"],"a":2,"x":"中低風險：100 筆以下 1、逾 100 為 3；高風險：100 筆以下 3、逾 100 為 5。","src":1,"ci":{"b":"授信篇","c":"第三十七章 外匯授信通則","s":"第三節 其他注意事項","t":"<mark>100筆(含)以下交易應至少抽樣3筆，逾100筆交易應至少抽樣5筆</mark>。"}},{"id":"S11-14","m":11,"q":"補徵之運送文件經查核發現涉及應婉拒事項，除通知客戶清償外，應自發現日起多久內停止受理該客戶進/出口前外幣貸款？","o":["一個月","三個月","六個月","一年"],"a":2,"x":"應依約定書通知客戶於合理期間內全數清償，並自發現日起 6 個月內停止受理。","src":1,"ci":{"b":"授信篇","c":"第三十七章 外匯授信通則","s":"第一節 防制洗錢及打擊資恐作業","t":"3.倘補徵之運送文件經查核發現涉及應婉拒事項者，應依「約定書(放002)」相關條款通知客戶於合理期間內全數清償該筆貸款本息，且<mark>自發現日起六個月內停止受理該客戶進/出口前外幣貸款</mark>。"}},{"id":"S11-15","m":11,"q":"金融機構董監事、持股超過 10% 大股東以該公司股票為擔保品辦理股票質押，擔保品放款值超過鑑價值多少時，應提具體徵信評估意見並提董事會討論？","o":["四成","五成","六成","七成"],"a":2,"x":"超過鑑價值 6 成 → 提董事會；另不得受理公司以本公司發行之股票辦理質押。","src":1,"ci":{"b":"講義：授信法規/通則輯要","c":"第8頁","s":"","t":"銀行公會會員授信準則➢第廿七條(集中度與限額之管理)(續)對金融機構及金融控股公司董事、監察人、持股超過10%之大股東與其利害關係人，以該公司股票為擔保品辦理股票質押，其擔保品之放款值，<mark>超過鑑價值六成，授審單位應提出具體徵信評估意見並提董事會討論</mark>。"}},{"id":"S11-16","m":11,"q":"辦理「自行特定金錢信託受益權質借」（地方資產管理專區專用），核對親簽及對保作業應由何單位辦理？","o":["任一營業單位","僅限新興分行","信託處","區域中心"],"a":1,"x":"核對親簽及對保僅限新興分行；商品說明由新興分行授信人員推介並錄音保留。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第1頁","s":"","t":"三、申辦作業：(一)申辦文件：1.<mark>核對親簽及對保作業僅限新興分行辦理</mark>。"}},{"id":"S11-17","m":11,"q":"專區受益權質借之商品說明及風險揭露，應以何種錄音類別留存紀錄？","o":["第 1 類及第 3 類","第 2 類及第 6 類","第 4 類及第 7 類","第 5 類"],"a":2,"x":"第 4 類「其他業務及外匯放款業務錄音」及第 7 類「自行特定金錢信託受益權質借錄音」。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第2頁","s":"","t":"商品說明及風險揭露應以<mark>錄音類別第4類「其他業務及外匯放款業務錄音」及第7類「自行特定金錢信託受益權質借錄音」</mark>留存錄音紀錄。"}},{"id":"S11-18","m":11,"q":"專區受益權質借之受益權收受幣別為<b>外幣</b>者，其質借幣別為何？","o":["限原幣","限新臺幣","得為原幣或新臺幣或其他外幣","限美元"],"a":2,"x":"新臺幣受益權限借新臺幣（最低 100 萬）；外幣受益權得借原幣、新臺幣或其他外幣（最低等值美金 3 萬）。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第2頁","s":"","t":"2.受益權收受幣別為外幣者(信託商品科目02、09、04、10者)，<mark>質借幣別得為原幣或新臺幣或其他外幣</mark>，最低貸款金額等值美金3萬元。"}},{"id":"S11-19","m":11,"q":"專區受益權質借之貸款期限與撥款方式為何？","o":["最長 3 年、循環動用","最長一年、以非循環額度辦理、一次動撥","最長一年、得分次動撥","最長 7 年、按月攤還"],"a":1,"x":"最長一年非循環、一次動撥、按月繳息本金到期一次清償（倫巴底才是「得分次動撥」）。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第2頁","s":"","t":"(二)<mark>貸款期限：最長一年，以非循環額度辦理</mark>。"}},{"id":"S11-20","m":11,"q":"辦理受益權設定質權時，同一投資標的至多可分幾次設質？","o":["3 次","5 次","10 次","不限"],"a":1,"x":"首次設質「投資資金用途」輸入 41，第二次 42…最多至 45，即 5 次。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第4頁","s":"","t":"(2)信託作業經辦依授信部門蓋章後之擔保物提供證執行「信託商品變更交易事項登錄(T470-C：質權設定-自行-專區)」辦理受益權設定質權註記，「信託商品變更交易事項申請書兼登錄單」(信061C)(下簡稱T470登錄單)免由委託人蓋章，<mark>同一投資標的至多可分5次設質</mark>；"}},{"id":"S11-21","m":11,"q":"專區受益權質借之擔保維持率介於 120%～130% 且連續達五個營業日時，應如何處理？","o":["寄送「受益權質借接近補倉水平通知書」並電話通知","寄發補倉通知書","立即平倉","無須處理"],"a":0,"x":"接近補倉：120%～130% 連續 5 營業日；補倉：低於 120%；平倉/期限利益喪失：低於 110%。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第7頁","s":"","t":"2.接近補倉水平：<mark>擔保維持率介於120%至130%間且連續達五個營業日時</mark>，依客戶所約定綜合業務對帳單之寄送方式，寄送「受益權質借接近補倉水平通知書」並電話通知借款人知悉。"}},{"id":"S11-22","m":11,"q":"專區受益權質借擔保維持率低於多少時，應立即以電話及書面通知平倉／期限利益喪失並贖回或出售受益權？","o":["130%","120%","110%","100%"],"a":2,"x":"低於 110% 或發生期限利益喪失事由 → 平倉通知書及行使抵銷通知書，依約定出售順序贖回/出售。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第7頁","s":"","t":"4.平倉/期限利益喪失：<mark>擔保維持率低於110%或發生借款契約約定之期限利益喪失事由者</mark>，應立即以電話及書面【自行特定金錢信託受益權質借_平倉/期限利益喪失通知書(放537D)】(下簡稱平倉/期限利益喪失通知書)、「行使抵銷通知書」通知借款人並按約定之出售順序依市價贖回或出售原設質信託受益權表彰之投資標的，再以返還款項沖償借款，以維本行債權。"}},{"id":"S11-23","m":11,"q":"受益權質借平倉辦理抵銷時之順序，下列何者正確？","o":["未屆清償期者先抵銷","抵銷存款時以存款利率高者先抵銷","已屆清償期者先抵銷；抵銷存款時以存款利率低者先抵銷","由借款人指定"],"a":2,"x":"抵銷前應以存證信函寄發行使抵銷通知書，載明事由、種類及數額。","src":2,"ci":{"b":"要點：自行特定金錢信託受益權質借作業應注意事項(資產管理專區)","c":"第8頁","s":"","t":"(2)<mark>抵銷存款時，以存款利率低者先抵銷</mark>。"}},{"id":"S11-24","m":11,"q":"有關專區受益權質借之其他規定，下列何者正確？","o":["因繼承取得之受益權得作為質借標的","國外債券單一投資標的可部分解質","因繼承取得之受益權不得作為質借標的；借款人死亡應先清償質借餘額後始得辦理繼承","撥款金額上限為已核准額度，不受可再撥貸金額限制"],"a":2,"x":"國外債券僅受理全部設質/解質；撥款上限為「客戶可再撥貸金額」與已核准額度孰低。","src":2,"ci":{"b":"要點：自行特定金錢信託 const LS='credit_notes_v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}};
let HI={};try{HI=JSON.parse(localStorage.getItem(LS+'_hist')||'{}')}catch(e){HI={}}
const saveH=()=>{try{localStorage.setItem(LS+'_hist',JSON.stringify(HI))}catch(e){}};
function record(q,i){const h=HI[q.id]||(HI[q.id]={n:0,w:0});h.n++;if(!isOk(q,i))h.w++;saveH()}
try{const t=localStorage.getItem(LS+'_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const ALL=[...DATA.pq,...DATA.sq], BYID={};ALL.forEach(q=>BYID[q.id]=q);
const MOD={};DATA.mods.forEach(m=>MOD[m.id]=m);
const L='1234';
let view='mod', cur=1, quiz=null, keep=new Set();
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isOk=(q,i)=>q.a===null||q.a===undefined?true:i===q.a;
function status(q){const v=ST[q.id];if(v===undefined)return 'un';return isOk(q,v)?'ok':'bad'}
function stats(list){let d=0,o=0;list.forEach(q=>{const s=status(q);if(s!=='un'){d++;if(s==='ok')o++}});return{d,o}}
function filt(list){const y=$('#fy').value,s=$('#fs').value;return list.filter(q=>(!y||String(q.y)===y)&&(!s||status(q)===s))}

function header(){
  const s=stats(ALL);
  $('#stat').innerHTML=`<b>${DATA.pq.length}</b> 題考古題（110–114）・<b>${DATA.mods.length}</b> 個考點・<b>${DATA.sq.length}</b> 題模擬題・已作答 <b>${s.d}</b>・正確率 <b>${s.d?Math.round(s.o/s.d*100):0}%</b>・細則：授信篇 115.6.30／徵信篇 114.07＋2026 講義＋6 份作業要點`;
}
function sidebar(){
  $('#ml').innerHTML=DATA.mods.map(m=>{
    const list=ALL.filter(q=>q.m===m.id), s=stats(list);
    return `<div class="mi ${view==='mod'&&cur===m.id&&!$('#q').value?'on':''}" data-m="${m.id}">
      <span class="code">${pad(m.id)}</span><span class="nm">${m.t}</span><span class="ct">${m.cnt} 題</span>
      <span class="sb">${m.w}・已答 ${s.d}/${list.length}</span>
      <span class="bar"><i style="width:${list.length?s.d/list.length*100:0}%"></i></span></div>`}).join('');
  $('#cnt').textContent=`${DATA.mods.length} 個考點・依 Word 考點分析分類`;
}
function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), rul=(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){
  const v=qz?quiz.ans[q.id]:ST[q.id], h=HI[q.id], done=v!==undefined, sim=q.id[0]==='S';
  const head=sim?(q.src===2?`<span class="tag sim rulq">要點新題</span>`:q.src?`<span class="tag sim lecq">講義新題</span>`:`<span class="tag sim">模擬題</span>`):`<span class="tag">${q.y} 年・第 ${q.n} 題</span>`;
  const md=showMod?`<span class="tag md">${pad(q.m)} ${MOD[q.m].t}</span>`:'';
  const opts=q.o.map((o,i)=>{let c='';if(done){if(q.a===null||q.a===undefined){if(i===v)c='ok'}else if(i===q.a)c='ok';else if(i===v)c='bad'}
    return `<button class="op ${c}" data-q="${q.id}" data-i="${i}"><span class="l">${L[i]}</span><span>${o}</span></button>`}).join('');
  let ans='';
  if(done){
    const ok=isOk(q,v), bonus=q.a===null||q.a===undefined;
    const ver=bonus?`<span class="verdict ok">官方送分題（任一選項皆給分）</span>`:
      ok?`<span class="verdict ok">✓ 答對</span>`:`<span class="verdict bad">✗ 答錯　正確答案：(${L[q.a]}) ${q.o[q.a]}</span>`;
    const warn=q.lo===1?`<div class="warn">本題出自行內作業要點／信保手冊等，細則未直接收錄${q.ci?'；下方為細則中最相關條文':''}</div>`:q.lo===2?`<div class="warn">細則條文比對信心較低，僅供參考</div>`:'';
    ans=`<div class="ans"><button class="redo" data-r="${q.id}">重作</button>${ver}${q.x?`<div class="exp">${q.x}</div>`:''}${warn}${cite(q.ci)}</div>`;
  }
  return `<div class="qc ${done?'done':''}" id="c-${q.id}" data-z="${qz?1:''}"><div class="qh">${head}${md}${h?`<span class="tag hist">作答 ${h.n} 次・錯 ${h.w} 次</span>`:''}</div><div class="qt">${q.q}</div>${opts}${ans}</div>`;
}
function renderMod(){
  const m=MOD[cur], pq=DATA.pq.filter(q=>q.m===cur), sq=DATA.sq.filter(q=>q.m===cur);
  const s=stats([...pq,...sq]);
  const notes=m.notes.map(([h,items],i)=>`<span class="badge b${i%2}">${h}</span><ul class="nt">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('');
  const nums=m.nums.map(([k,v])=>`<div class="num"><b>${k}</b><span>${v}</span></div>`).join('');
  const fp=filt(pq), fs=filt(sq);
  $('#main').innerHTML=`
   <div class="mtitle"><span class="code">${pad(m.id)}</span><h2>${m.t}</h2></div>
   <div class="msub">${m.sub}</div>
   <div class="kpi">
     <div><small>考古題</small><b>${m.cnt} 題</b></div>
     <div><small>占 300 題</small><b>${(m.cnt/3).toFixed(1)}%</b></div>
     <div><small>模擬題</small><b>${sq.length} 題</b></div>
     <div><small>已作答</small><b>${s.d}/${pq.length+sq.length}</b></div>
     <div><small>正確率</small><b>${s.d?Math.round(s.o/s.d*100)+'%':'—'}</b></div>
   </div>
   <div class="yrs">${Object.entries(m.yrs).map(([y,c])=>`<span>${y}年 ${c}題</span>`).join('')}<span>出題頻率：${m.w}</span></div>
   <section><h3>重點筆記</h3>${notes}</section>
   <section><h3>必背數字</h3><div class="nums">${nums}</div></section>
   <section><h3>考古題練習<small>點選選項即判對錯並附細則依據</small></h3>
     <div class="qtools"><button class="btn" data-reset="p">本考點考古題全部重作</button><button class="btn" data-reset="pb">只重作答錯的</button><span class="legend">顯示 ${fp.length}/${pq.length} 題</span></div>
     ${fp.map(q=>qcard(q)).join('')||'<div class="empty">沒有符合篩選條件的題目</div>'}</section>
   <section><h3>模擬題<small>仿考古題命題＋講義／作業要點新題，附原文出處</small></h3>
     <div class="qtools"><button class="btn" data-reset="s">本考點模擬題全部重作</button><button class="btn" data-reset="sb">只重作答錯的</button><span class="legend">顯示 ${fs.length}/${sq.length} 題</span></div>
     ${fs.map(q=>qcard(q)).join('')||'<div class="empty">沒有符合篩選條件的題目</div>'}</section>`;
}
function renderSearch(kw){
  const k=kw.toLowerCase(), strip=s=>s.replace(/<[^>]+>/g,'').toLowerCase();
  const hit=filt(ALL).filter(q=>strip(q.q+q.o.join('')+(q.x||'')+(q.ci?q.ci.t:'')).includes(k));
  const nh=[];DATA.mods.forEach(m=>m.notes.forEach(([h,it])=>it.forEach(x=>{if(strip(x).includes(k))nh.push([m,x])})));
  $('#main').innerHTML=`<div class="mtitle"><h2>搜尋「${kw.replace(/</g,'&lt;')}」</h2></div>
   <div class="msub">筆記 ${nh.length} 條・題目 ${hit.length} 題</div>
   ${nh.length?`<section><h3>相關筆記</h3><ul class="nt">${nh.slice(0,60).map(([m,x])=>`<li><span class="tag md">${pad(m.id)} ${m.t}</span> ${x}</li>`).join('')}</ul></section>`:''}
   <section><h3>相關題目</h3>${hit.slice(0,80).map(q=>qcard(q,true)).join('')||'<div class="empty">找不到相符題目</div>'}${hit.length>80?'<div class="empty">僅顯示前 80 題，請加長關鍵字</div>':''}</section>`;
}
function renderNums(){
  $('#main').innerHTML=`<div class="mtitle"><h2>必背數字總表</h2></div><div class="msub">各考點高頻數字型考點彙整，點考點名稱可跳回該考點</div>
   <section style="max-width:none"><table class="nt"><tr><th>考點</th><th>數字</th><th>內容</th></tr>
   ${DATA.mods.map(m=>m.nums.map(([k,v],i)=>`<tr>${i===0?`<td rowspan="${m.nums.length}"><a href="#" data-go="${m.id}" style="color:var(--accent-ink)">${pad(m.id)} ${m.t}</a></td>`:''}<td class="k">${k}</td><td>${v}</td></tr>`).join('')).join('')}
   </table></section>`;
}
function renderQuiz(){
  if(!quiz){
    $('#main').innerHTML=`<div class="mtitle"><h2>模擬考（60 題・100 分）</h2></div><div class="msub">模擬正式測驗：每次 60 題，第 1～20 題每題 2 分、第 21～60 題每題 1.5 分，滿分 100 分；作答立即解答並附出處，全部作答完成後計分</div>
     <div class="qzbar">
       <label>題源 <select id="qsrc"><option value="mix">考古題＋模擬題</option><option value="p">只考古題</option><option value="s">只模擬題</option></select></label>
       <label>優先 <select id="qpr"><option value="">隨機</option><option value="un">未作答優先</option><option value="bad">答錯優先</option><option value="badonly">只考答錯的</option><option value="hard">常錯題優先</option></select></label>
       <button class="btn pri" id="qgo">開始 60 題模擬考</button></div>
     <div class="mchk" id="qm">${DATA.mods.map(m=>`<label><input type="checkbox" value="${m.id}" checked> ${pad(m.id)} ${m.t}</label>`).join('')}</div>
     `;
    return;
  }
  const W=i=>i<20?2:1.5, tot=quiz.reduce((a,_,i)=>a+W(i),0);
  const fin=quiz.filter(id=>quiz.ans[id]!==undefined).length, done=fin===quiz.length;
  const okI=quiz.map((id,i)=>quiz.ans[id]!==undefined&&isOk(BYID[id],quiz.ans[id])?i:-1).filter(i=>i>=0);
  const ok1=okI.filter(i=>i<20).length, ok2=okI.length-ok1, n1=Math.min(20,quiz.length), n2=quiz.length-n1;
  const pts=okI.reduce((a,i)=>a+W(i),0), score=Math.round(pts/tot*1000)/10;
  const res=done?`<div class="qzres"><div><span class="legend">總分</span><b class="score big">${score}</b><span class="legend"> / 100</span></div>
     <div class="legend">第一部分 ${ok1}/${n1} 題 × 2 分 ＝ ${ok1*2}　｜　第二部分 ${ok2}/${n2} 題 × 1.5 分 ＝ ${ok2*1.5}</div></div>`:'';
  $('#main').innerHTML=`<div class="mtitle"><h2>模擬考（60 題・100 分）</h2></div>
   <div class="qzbar"><span>進度 <b class="score">${fin}/${quiz.length}</b></span><span>答對 <b class="score">${okI.length}</b></span>
   <span>得分 <b class="score">${done?score:'—'}</b>${done?'':'<span class="legend">（全部作答後計分）</span>'}</span><button class="btn" id="qagain">整份重考</button>${fin>okI.length?`<button class="btn" id="qwrong">只重考答錯的（${fin-okI.length} 題）</button>`:''}<button class="btn" id="qnew">重新出題</button></div>
   ${res}
   ${quiz.map((id,i)=>(i===0?`<h3 class="qpart">第一部分（第 1～${n1} 題，每題 2 分）</h3>`:i===20?`<h3 class="qpart">第二部分（第 21～${quiz.length} 題，每題 1.5 分）</h3>`:'')+`<div class="legend" style="margin-top:14px">第 ${i+1} 題・${W(i)} 分</div>`+qcard(BYID[id],true,1)).join('')}
   ${res}`;
}
function renderWrong(){
  const w=ALL.filter(q=>status(q)==='bad'||keep.has(q.id)), nb=ALL.filter(q=>status(q)==='bad').length;
  $('#main').innerHTML=`<div class="mtitle"><h2>錯題本</h2></div><div class="msub">目前答錯 ${nb} 題（按「重作」重新作答；答對的題目下次進入錯題本時移出）</div>
   <div class="qtools">${nb?`<button class="btn pri" data-reset="wrong">錯題全部重作</button>`:''}<button class="btn" data-reset="all">清除全部作答紀錄</button></div>
   ${DATA.mods.map(m=>{const l=w.filter(q=>q.m===m.id);return l.length?`<section><h3>${pad(m.id)} ${m.t}<small>${l.length} 題</small></h3>${l.map(q=>qcard(q)).join('')}</section>`:''}).join('')||'<div class="empty">目前沒有錯題 👍</div>'}`;
}
function render(){
  header();sidebar();
  document.querySelectorAll('#tabs button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const kw=$('#q').value.trim();
  if(kw)renderSearch(kw);
  else if(view==='mod')renderMod();
  else if(view==='nums')renderNums();
  else if(view==='quiz')renderQuiz();
  else renderWrong();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.mi,a[data-go]');if(!t)return;
  if(t.matches('a[data-go]')){e.preventDefault();cur=+t.dataset.go;view='mod';render();scrollTo(0,0);return}
  if(t.classList.contains('mi')){cur=+t.dataset.m;view='mod';$('#q').value='';render();scrollTo({top:0});return}
  if(t.dataset.v){view=t.dataset.v;keep.clear();$('#q').value='';render();return}
  if(t.id==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(LS+'_theme',r.dataset.theme)}catch(e){}return}
  if(t.classList.contains('op')){
    const id=t.dataset.q, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz, q=BYID[id], i=+t.dataset.i;
    if((qz?quiz.ans[id]:ST[id])!==undefined)return;
    ST[id]=i;if(qz)quiz.ans[id]=i;record(q,i);save();
    const tmp=document.createElement('div');tmp.innerHTML=qcard(q,!!card.querySelector('.tag.md'),qz);card.replaceWith(tmp.firstElementChild);
    header();sidebar();
    if(view==='quiz'&&quiz&&!$('#q').value){const y=scrollY;renderQuiz();scrollTo(0,y)}
    return}
  if(t.dataset.r){const id=t.dataset.r, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz;
    if(qz)delete quiz.ans[id];else{if(view==='wrong')keep.add(id);delete ST[id];save()}
    if(qz){const y=scrollY;renderQuiz();scrollTo(0,y);header();sidebar();return}
    const tmp=document.createElement('div');tmp.innerHTML=qcard(BYID[id],!!card.querySelector('.tag.md'));card.replaceWith(tmp.firstElementChild);header();sidebar();return}
  if(t.dataset.reset){const k=t.dataset.reset;
    if(k==='all'){if(!confirm('確定清除全部作答紀錄（含作答次數統計）？'))return;ST={};HI={};saveH();keep.clear()}
    else if(k==='wrong')ALL.filter(q=>status(q)==='bad').forEach(q=>{keep.add(q.id);delete ST[q.id]});
    else ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad')).forEach(q=>delete ST[q.id]);
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=60,pr=$('#qpr').value;
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    quiz=pool.slice(0,n).map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
render();
</script>
</body>
</html>
