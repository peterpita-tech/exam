日及貸放後三個月共三個時間點辦理<mark>查核作業，</mark>查詢借款人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)下列事項，並填製「第一商業銀行辦理『央行管控案件』查核控管表(消金專用)」："}},{"id":"111-14","y":111,"n":14,"m":1,"q":"有關本行依「中央銀行對金融機構辦理不動產抵押貸款業務規定」之「購地貸款」查核作業相關規範何者正確？","o":["個案自籌款只要能於額度核准前如期匯到指定帳戶，得免查證資金來源","個案自籌款可由負責人以其他貸款名目增貸支應","查核對象不包含擔保物提供人","授信申請時、首筆撥貸當日及首筆撥貸日3個月後起算1個月內，應查核本行自貸及金融機構貸款動用情形"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.<mark>撥貸當日</mark>：查核「查核對象」自申請日至撥貸日於本行循環額度動用(1030交易)<mark>及金融機構貸款</mark>情形(撥貸前查詢聯徵B28及B33)。"}},{"id":"111-15","y":111,"n":15,"m":7,"q":"下列何者非屬中小企業信用保證基金規範，最遲應於知悉之日起2個月內通知之信用惡化情事？","o":["應繳付之利息延滯期間已超過3個月","未依約分期攤還已超過1個月","負責人配偶受票交所拒絕往來處分","授信對象停業"],"a":2,"ci":{"b":"授信篇","c":"第十四章 貼現","s":"第一節 申請","t":"(二)調查票據關係人之信用是否符合下列條件1.貼現申請人、發票人及承兌人均應信用可靠者。2.票據上主債務人（匯票為承兌人，本票為發票人）須未受票據交換<mark>所拒絕往來處分</mark>，或最近六個月內無退票註記者。"},"x":"負責人<b>配偶</b>受拒往處分不屬應通知之信用惡化情事（授信對象或其負責人才是）。","lo":1},{"id":"111-16","y":111,"n":16,"m":8,"q":"有關本行集團關係戶之管理，何者錯誤？","o":["兩家企業之授信額度合計達新臺幣20億元者，已符合集團控管認定標準","集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","行員專用系統「以關係戶統編查詢TEJ集團名單」功能，可輔助判斷授信戶之集團歸屬","授信新戶需同步申請集團限額時，得先經核准授信案件後，再行核備限額"],"a":3,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第八節 行員及關係人授信之限制","t":"80.12.5台融局(二)字第801675646號函）2.銀行如因會計年度決算後淨值降低，致已撥貸或已簽訂授信契約尚未撥款之<mark>授信案件</mark>，超逾銀行法第三十三條之三第一項對同一人或同一關係人或同一關係企業之授信<mark>限額時，得</mark>依原契約之授信額度繼續撥貸至契約屆滿為止，惟應注意風險控管。（金管會"},"x":"集團關係戶管理：新戶同步申請集團限額者，集團限額核備日<b>不得晚於</b>授信核准日，不可先核准授信再核備限額。","lo":1},{"id":"111-17","y":111,"n":17,"m":2,"q":"有關「貸款衍生人身保險保費融資貸款」之規定，下列何者為非？","o":["借款人、要保人與被保險人須為同一人","不動產擔保貸款借款人非為本國國民者，不得辦理躉繳保費融資","融資躉繳保費-擔保貸款期限最長20年，得申請寛限期","融資躉繳保費-信用貸款(未提供副擔保)期限最長10年，且不得適用寬限期"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"五、期限：(一)<mark>融資躉繳保費</mark>─<mark>擔保貸款</mark>：最長30年，且不得適用寬限期。(二)<mark>融資躉繳保費</mark>─信用貸款：設定第二順位抵押權作副擔保者最長30年，未設定抵押權者最長10年，且不得適用寬限期。"}},{"id":"111-18","y":111,"n":18,"m":10,"q":"催收過程中倘發現債務人有移轉財產或高額設定等惡意脫產行為，致妨害本行債權者，經評估應採取（　）措施，對本行債權收回有實益者，應事先以「處理逾期放款申請/報告書」申請債權管理處同意後辦理。","o":["假扣押","假處分","假執行","支付命令"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第二節 一般催討程序","t":"(十七)<mark>催收過程中倘發現債務人有移轉財產或高額設定等惡意脫產行為，致妨害本行債權者，經評估</mark>採取假處分措施<mark>對本行債權收回有實益者，應事先以「處理逾期放款申請/報告書」申請債權管理處同意後辦理。</mark>"}},{"id":"111-19","y":111,"n":19,"m":5,"q":"關於辦理徵信查詢聯徵中心信用資訊相關應注意事項，下列敘述何者為非？","o":["須符合授信業務目的，並取得當事人同意之意思表示或與當事人有契約或類似契約關係者，始得查詢","退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留5年","各單位應指定專人每週列印查詢紀錄資訊","指定專人列印之查詢紀錄資訊應設專卷保留5年備查"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第五節 財團法人金融聯合徵信中心信用資訊產品種類與運用","t":"六、各使用<mark>單位應指定專人每</mark>日<mark>列印查詢紀錄資訊</mark>，經查詢人員蓋章及主管覆核（主管亦應覆核查詢信用資料是否符合本要點第九條之規定）確認後，設專卷保留五年備查。"}},{"id":"111-20","y":111,"n":20,"m":5,"q":"依照銀行公會規範，下列有關免辦理徵信之敘述，何者錯誤？","o":["對政府機關之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」之授信案件皆應辦理徵信","提供本人不同幣別之外匯定期存單設質十足擔保所申請之外匯授信案件，得免辦徵信","對會員銀行之授信案件得酌情免辦理徵信"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"2.外匯借款及其間接保證<mark>授信案件</mark>：倘借戶無其他授信時，對<mark>提供本人同幣別之</mark>本行<mark>外匯定期存單</mark>或存摺存款<mark>設質十足擔保所申請之外匯授信案件，得免辦徵信</mark>；若授信額度達本行重要授信戶標準者，亦比照1.項辦理。"}},{"id":"111-21","y":111,"n":21,"m":11,"q":"有關第e金網「保證業務電子化系統」，下列敍述何者錯誤？","o":["確認保證書金額及保證日期等與貸放傳票內容相符，始可於系統傳送保證案件","僅可作廢尚未由海關核准之保證案件","與帳務連動","僅適用開立「先放後稅進口貨物應繳稅費保證書」"],"a":2,"ci":{"b":"授信篇","c":"第三十一章 稅捐記帳保證業務","s":"第二節 簽發保證書","t":"(電子傳送)一、保證額度核准後，應即通知申請人簽訂「委任保證契約（稅捐記帳保證用）或「綜合授信契約」。二、帳務處理及簽發「擔保先放後稅進口貨物應繳稅費保證書」流程:營業單位收息撥貸經辦及撥貸主管確認於端末系統已完成帳務交易(帳務處理參照一般<mark>保證業務</mark>)後，再至本行企業網路銀行(<mark>第e金網</mark>)<mark>「保證業務電子化系統」</mark>(下稱本系統)傳送保證書予海關。本系統主要包含五項功能："}},{"id":"111-22","y":111,"n":22,"m":8,"q":"有關「授信最高額度控管作業」，下列敍述何者錯誤？","o":["控管範圍不包含支存透支","控管方式主要分為「核准號碼」及「客戶ID」(含集團控管)等2類控管","可跨不同分行、不同授信戶、臺外幣系統進行額度控管","最高限額幣別僅限新臺幣及美金"],"a":0,"ci":{"b":"授信篇","c":"第四十八章 境外公司及大陸地區法人融資業務","s":"第四節 其他注意事項","t":"2.為利額度控管，境外公司融資業務以共用額度方式申請之授信案件，應依本行「授信最高額度控管作業應行注意事項」辦理，另於端末主機利用「授信最高額度控管作業(交易代號"},"x":"授信最高額度控管範圍<b>包含支存透支</b>；控管分核准號碼及客戶 ID 兩類，可跨分行、授信戶、臺外幣；幣別僅新臺幣及美金。","lo":1},{"id":"111-23","y":111,"n":23,"m":11,"q":"受理申請開發國內即期信用狀時，信用狀有效期限原則上不得超過","o":["3個月","4個月","5個月","6個月"],"a":1,"ci":{"b":"授信篇","c":"第三十五章 國內即期信用狀業務","s":"第一節 申請手續","t":"(二)依據<mark>國內即期信用狀</mark>向本行申請付款之匯票，除經總行或區域中心同意外，應使用本行印製之用紙（放074C）。(三)<mark>信用狀有效期限原則上不得超過</mark>四個月。"}},{"id":"111-24","y":111,"n":24,"m":11,"q":"有關辦理大陸地區法人融資業務，為配合大陸外債登記程序與規範，受理單位應提醒借款人務必於雙方簽立銀行借款合同後（　）內向大陸地區外匯管理局辦妥外債登記。","o":["10日","15日","20日","30日"],"a":1,"ci":{"b":"授信篇","c":"第四十八章 境外公司及大陸地區法人融資業務","s":"第四節 其他注意事項","t":"6.本行及借款人應共同於<mark>銀行借款合同</mark>之騎縫處加蓋雙方簽約印章。7.<mark>為配合大陸外債登記程序與規範，受理單位應提醒借款人務必於雙方簽立銀行借款合同後</mark>十五日<mark>內向大陸地區外匯管理局辦妥外債登記。</mark>"}},{"id":"111-25","y":111,"n":25,"m":11,"q":"有關出口週轉金外幣貸款，下列何者為非？","o":["貸款幣別依借戶交易幣別辦理，且以本行掛牌者為限","國內借款人辦理出口前之外幣貸款得兌換為新臺幣","進口商應載於借款人徵信報告或「進貨/銷貨廠商明細資料表(貿易融資專用版)」","每次貸款期限應按信用狀有效期限或依融資日起至預計貨款收妥日訂定"],"a":1,"ci":{"b":"授信篇","c":"第四十五章 工商企業出口週轉金外幣貸款","s":"第一節 申請手續","t":"一、受理申請本項<mark>外幣貸款</mark>時，應注意下列事項：(一)<mark>國內借款人</mark>須為依法登記從事出口業務之國內公民營企業。(二)貸款用途係用以支應出口所需外幣週轉資金，貸款幣別應按照借款人交易幣別辦理，且以本行掛牌者為限。另，依中央銀行「銀行業辦理外匯業務管理辦法」，<mark>國內借款人辦理外幣貸款</mark>不<mark>得兌換為新</mark>台幣，但取得已出口之證明書件(如D/A、D/P託收文件或其他已出口之資料)者，不在此限。"}},{"id":"111-26","y":111,"n":26,"m":11,"q":"有關綜合授信額度，下列敘述何者錯誤？","o":["本項額度應向授信審核處或區域中心申請核准","辦理用途不明確之外幣借款保證時，得逕行運用「丁類無擔保授信」項下之其他保證額度","不包括出口押匯(含出口貼現)授信","最高額度合計不應超過借款企業「最近 1 年營業額」或「預計未來 1 年營業額之 8 成」孰高"],"a":1,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第六節 其他注意事項","t":"一、<mark>辦理用途不明確之外幣借款保證時，</mark>因無法確實掌握且風險較高，不<mark>得逕行運用</mark>綜合授信額度<mark>「丁類無擔保授信」項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"}},{"id":"111-27","y":111,"n":27,"m":11,"q":"有關備付(本息)本票之敘述，下列何者為非？","o":["得依總額度或逐筆貸放金額徵取100%備付(本息)本票","對於已徵取十足本行存單或本行活存且設定質權為擔保者，得酌情免徵","辦理一般保證業務，須向借戶徵取","無到期日之備付(本息)本票，額度生效日至本票發票日之期間逾3年時，應重徵之"],"a":0,"ci":{"b":"授信篇","c":"第二十八章 間接授信通則","s":"第一節 備付(本息)本票/備償期票徵取方式","t":"三、新臺幣本(期)票之徵提金額，依臺幣及外匯授信不同區分如下：<mark>備付(本息)本票</mark>備償期票臺幣授信<mark>依總額度或逐筆貸放金額徵取1</mark>1<mark>0%備付(本息)本票</mark>依<mark>逐筆貸放金額徵取100%備</mark>償期票(利息應另行繳納)外匯授信<mark>依總額度或逐筆貸放金額徵取1</mark>1<mark>0%備付(本息)本票</mark>＊X(不得徵取)＊註：外匯授信匯率得依「徵取日即期外匯賣出匯率」折算，惟日後因匯率波動無法涵蓋授信本金<mark>100%</mark>時應向借戶補徵。"}},{"id":"111-28","y":111,"n":28,"m":1,"q":"辦理購地貸款(不含工業用土地)之規定何者錯誤？","o":["舊貸展期或轉貸案件，得給予最長12個月之調整期，屆期仍未動工者，於調整期到期日貸款成數應調降至4成內","辦理舊貸展期時，因土地鑑價值已提高，故可減少收回之成數","對於持有土地超過5年仍尚未動工興建之轉貸案件，原則上不得受理","轉貸案件如調整期後仍未動工，另採階梯式利率加碼"],"a":1,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"建餘屋(待售)住宅、其他土地等)為擔保，資金流向購買都市計畫劃定之住宅區或商業區土地(下稱受限土地)，是否應按本規定辦理？答：是。Q7：借款人於本規定實施前已辦理之購地貸款案件，如該購買土地尚未辦理動工興建，金融機構<mark>辦理舊貸</mark>案屆期續貸或屆期轉貸是否應按本規定辦理？(本次增修)按本規定辦理？(本次增修)答：是。"}},{"id":"111-29","y":111,"n":29,"m":2,"q":"有關得排除適用DBR22倍規範之個人無擔保貸款，下列敘述何者有誤？","o":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在6年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在3年內設定擔保物權者","所有個人無擔保貸款皆不能排除DBR22倍規範"],"a":3,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第一節 通則","t":"(二)得排除適用<mark>DBR22倍規範</mark>之<mark>個人無擔保貸款</mark>：1、借款用途屬「創業」、「所營事業營運週轉金」、「建築融資」、「農業用途」等貸款項目，且係以「企業戶」授信程序辦理，並符合本行徵授信準則有關企業授信相關規範者。"}},{"id":"111-30","y":111,"n":30,"m":7,"q":"依中小企業融資信用保證作業手冊規定，批次信保授信案件徵有（　）以上擔保品者，不得送保。","o":["2成","3成","4成","5成"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第五節 企業授信之徵信範圍","t":"5.保證人一般信譽（含票信及債信紀錄）。（二）中長期授信除與前述1至5目相同外，另增加：6.行業展望。7.建廠或擴充計畫（含營運計畫）。辦理前述<mark>中小企業</mark>授信戶之徵信分析時，對財務狀況應著重於「產銷及損益概況」之探討，至其他各項仍依徵信準則第二十二條企業<mark>授信案件徵</mark>信範圍辦理。上述所稱<mark>中小企業</mark>係指「符合財團法人<mark>中小企業信用保證</mark>基金所訂標準之<mark>中小企業</mark>」（詳見<mark>中小企業融資信用保證作業手冊</mark>）。"},"x":"批次信保授信案件徵有 <b>5 成</b>以上擔保品者不得送保（購置之機器設備除外）。","lo":1},{"id":"111-31","y":111,"n":31,"m":7,"q":"中小企業融資信用保證作業手冊有關資本性支出授信送保規定，何者為非？","o":["對購置之標的應設定第一順位抵押權或動產抵押權","機器設備授信金額未超過新臺幣100萬元者，得免辦理設定","動產如評估無設定實益，不需基金同意，只需申請總行核准即可免辦理設定","機器設備授信期間未超過2年者，得免辦理設定"],"a":2,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"1.「到期表(LP115A)」-擔保品有對應授信額度(1)應確認初貸日係於不動產抵押權存續期間內或擔保債權確定期日前。(2)依擔保品對應之授信額度情形及不動產「存續期間/擔保債權確定期日」屆期情形，辦理方式如下：A.擔保品對應之授信額度僅有非循環額度(A)將屆期：應洽借戶是否辦理抵押權內容變更登記。倘嗣後有新增授信額度需求，可免重新<mark>辦理設定</mark>手續，以節省規費支出並簡化作業流程。(B)已屆期：擔保品項下仍有授信餘額，未清償前不得辦理抵押權塗銷。B.擔保品對應之授信額度為循環額度(A)將屆期：應立即洽請借戶辦理抵押權內容變更登記，延長「擔保債權確定期日」。(B)已屆期：應立即停用擔保品對應之循環額度，不得繼續辦理貸放。a.無他人設定後次序抵押權者，應洽請借戶重新辦理抵押權設定，並重新申請授信額度。b.已有他人設定後次序抵押權者，應重新評估本行有<mark>無設定實益</mark>。或另向借戶徵提其他擔保品、加徵具資歷之保證人等其他因應措施，確保本行債權無虞後，重新申請授信額度。"},"x":"資本性支出送保之動產如評估無設定實益，須經<b>信保基金同意</b>始得免設定，非僅總行核准。","lo":1},{"id":"111-32","y":111,"n":32,"m":7,"q":"信用保證案件於授信到期後（　）個月 內未辦理展延或分期償還保證，且未通知發生逾期者，信保基金將自動解除保證責任，但有具體理由經信保基金同意者，不在此限。","o":["1個月","2 個月","3個月","6"],"a":1,"ci":{"b":"授信篇","c":"第五十五章 不良授信債權管理通則","s":"第二節 不良授信之範圍","t":"(三)應收保證款項，其保證期限已屆滿而尚未<mark>解除保證責任</mark>或<mark>未辦理展延</mark>者。但進口稅捐記帳保證屆期尚未沖銷之保證稅款，已取得海關發給之繳納證，或已另提供足額之定存單擔保者<mark>不在此限。</mark>"},"x":"同 110-30：<b>2 個月</b>。","lo":1},{"id":"111-33","y":111,"n":33,"m":3,"q":"為利詳實統計銀行法第 72 條之 2 授信限額，辦理建築業(行業中類 41 建築工程業、67 不動產開發業、68 不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，資金用途應勾選","o":["其他營建資金","其他週轉金","經常性週轉金","以上皆可"],"a":0,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"十一、為利詳實統計銀行法第72條之2授信限額，辦理建築業(行政院主計處行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」；資金用途應勾選「<mark>其他營建資金</mark>(33)」。若貸款資金非用於「興建」或「購置」住宅及企業用建築之放款，分行端應於授信申請書內詳實說明資金用途，依適當之貸款種類及資金用途分類建檔，並落實貸後資金流向之追蹤管理。"}},{"id":"111-34","y":111,"n":34,"m":4,"q":"有關「法定代位清償人同意書」，何者正確？","o":["徵有多名保證人且僅免除其中一人之保證責任時，免徵取之","塗銷部分抵押權而借款人尚有其他授信時，應徵取之","擔保物提供人非屬法定代位清償人","同意解除保證責任並溯及最初時，應徵取「終止」格式之同意書"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"(二)塗銷一<mark>部分抵押權</mark>或塗銷全部<mark>抵押權而借款人尚有其他授信時，應徵取</mark>法定代位清償人之同意書(格式C-抵押權塗銷)。(三)如在本行均屬以營業單位經理權限核定之授信案件或授信已全部還清，且無其他保證，或保證係以營業單位經理權限核准者，擔保品之塗銷（含部分塗銷）授權營業單位經理核定。"}},{"id":"111-35","y":111,"n":35,"m":4,"q":"借戶為股份有限公司並設有董事會，於何種情形應徵取「董事會決議錄」？<br><span class=\"it\">A.</span> 徵取銀行法第30條之反面承諾書<br><span class=\"it\">B.</span> 開立備償借款專戶供關係企業授信使用<br><span class=\"it\">C.</span> 如為授信新戶，應於額度動用或簽約前徵取「借款決議錄」<br><span class=\"it\">D.</span> 如為授信舊戶，該公司於董事任期屆滿前改選部分董事，應一律重新徵取，不得續用原「借款決議錄」","o":["ACD","BCD","ABC","ABCD"],"a":2,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"(三)其他應注意事項：1.<mark>借款決議錄</mark>不需載明由○○○擔任保證人，免除○○○作保之文義。2.辦理須徵取<mark>反面承諾書</mark>之授信時，依<mark>銀行法第30條</mark>規定，對於抵押權登記或移轉質物占有之免辦或緩辦乙事，應經<mark>董事會決議</mark>，爰辦理是項授信時，應向借戶徵取<mark>董事會決議錄</mark>，並載明出具<mark>反面承諾書</mark>之相關事項，以符合法令規範暨確保本行債權。"}},{"id":"111-36","y":111,"n":36,"m":8,"q":"借款人符合下列何種情形，始可將借款人整體貢獻度納為放款定價減項評估之因素？","o":["實際收益率(提存前且含間接授信)為0.60%","本行信用評等8等","關係戶合計利益貢獻(提存前)為新臺幣50萬元","該案徵有資本抵減工具"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"3.原則上個案承作時，借款人需符合下列情形之一，始可將借款人整體貢獻度或其他因素納入放款定價減項評估之因素。(1)實際收益率(提存前且含間接授信)達"},"x":"整體貢獻度納入放款定價減項須符合條件之一，如實際收益率達 0.55% 以上…或<b>該案徵取資本抵減工具</b>；選項 1-3 數值未達門檻。","lo":1},{"id":"111-37","y":111,"n":37,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，以下何者錯誤？","o":["「客戶風險評分交易(A194)」屬高風險者，於授信申請書敍明承做理由，得以營業單位經理權限核定","條件變更涉及更換擔保品(鑑價值已符合)者，須填寫「運用擔保品洗錢及資恐交易態樣檢核表」","每月列印「洗錢資恐高風險授信戶名單月報(LN1022)」掌握借戶授信往來狀況，並陳核至單位主管","「客戶風險評分交易(A194)」註記「09：特殊風險客戶」者，應向法令遵循處洗錢防制部辦理查詢"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"8.另依中華民國銀行商業同業公會全國聯合會訂定之「銀行評估洗錢及資恐風險及訂定相關防制計畫指引」第七點規定，銀行應依據客戶的風險程度，決定適用的管控措施，故為配合高風險客戶之管控，凡經本行<mark>「客戶風險評分交易(A194)」</mark>評分之風險等級<mark>屬高風險者，</mark>其授信額度申請時不得以<mark>經理權限核定</mark>，一律送區域中心或授信審核處核定，並應於授信案件<mark>申請書敍明承做理由</mark>；倘「經註記09：特殊風險客戶」，應依下列方式辦理：(1)<mark>營業單位</mark>應填寫「特殊風險客戶資料查詢單」呈核單位主管後，將查詢單正本發送至法令遵循處洗錢防制部辦理查詢，以瞭解客戶曾涉及之異常交易模式。(2)依法令遵循處回覆之內容，由<mark>營業單位</mark>說明借戶最近一次經註記為特殊風險客戶之時間點、交易模式及近一年內遭註記之次數等內容，並就現行交易情形是否仍有該等異常之交易模式加以說明後，再敘<mark>明承做理由</mark>。容，並就現行交易情形是否仍有該等異常之交易模式加以說明後，再敘<mark>明承做理由</mark>。對「特殊風險客戶資料查詢單」之內容應保守秘密，不得任意洩漏；"}},{"id":"111-38","y":111,"n":38,"m":2,"q":"有關「工業住宅」、「套房」及「丙種建地建物」之定義及權限規範，何者錯誤？","o":["工業用透天建物部分供作住宅使用者，應視為工業住宅","建物面積未超過15坪之透天住宅，不視為套房","坐落於臺北市以外之套房案件，一律無營業單位經理授信權限","丙種建地建物，一律無營業單位經理授信權限"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第二節 購置不動產貸款","t":"一、目的：為協助社會大眾購置住宅用、商業用、工業用及其他不動產(土地及建物)，特開辦本項貸款。二、對象：(一)信用良好，有正當職業，具行為能力及償還能力之本國國民。"}},{"id":"111-39","y":111,"n":39,"m":4,"q":"依授信往來之約定及辦理對保相關規範，何者錯誤？","o":["約定書之簽章可與印鑑卡正面之右下方印鑑簽章不同","借據所蓋圖章應與印鑑卡印鑑式樣欄之印鑑相符","對保時，應查核借戶雙重身分證明，並影印留存主要身分證明文件","應查詢借戶之身分證遺失補領情形並列印存卷備查"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"一、承做授信除個人消金案件或另有規定外，應向新借款人、保證人及其他債務人分別徵取約定書（放002）。並按各種授信種類分別加徵其他有關契約文件。<mark>約定書之簽章</mark>必須<mark>與印鑑卡</mark>（放001A、放001B）<mark>正面之右下方印鑑簽章</mark>相符。"}},{"id":"111-40","y":111,"n":40,"m":11,"q":"有關徵取股票為擔保品之授信，何者錯誤？","o":["與客戶洽談額度前，應以「股票授信風險承擔限額維護(A614)」查詢該檔股票之尚可承做空間","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","徵取上櫃公司股票且無另行規定時，放款金額得為鑑價金額之6成","填報「營業單位辦理授信業務徵取國內上市(櫃)公司股票調查表」時，額度一經核准即應填報所有可徵取之股票名稱，即便某檔股票尚未徵提"],"a":2,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"2.<mark>放款金額</mark>最高不得超過<mark>鑑價金額之</mark>五成。(三)興櫃及未上市<mark>上櫃公司股票</mark>之鑑價及<mark>放款金額</mark>，除另有規定外，按下列方式辦理：1.按股票面額與股票淨值孰低者為鑑價。"}},{"id":"111-41","y":111,"n":41,"m":2,"q":"有關「本行員工優惠貸款」，下列敘述何者有誤？","o":["購置住宅用不動產貸款(供自住使用)，每一員工最高為新臺幣(以下同)1,200萬元，配偶亦為員工者，併計最高1,500萬元為限","一職等以上在職員工及其配偶均得申貸","房屋增改建裝修貸款，每一員工最高以400萬元為限","本行員工不得以無擔保方式辦理「循環型貸款」"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十五節 本行員工優惠貸款","t":"1.擔保品提供人限員工本人或配偶名義所有，得由員工本人或配偶其中一人擔任借款人，或由員工本人及配偶各自擔任借款人，倘擔保品土地及建物所有權為員工本人或配偶與他人共有者，僅得就員工本人或配偶持有部分計算之貸放限額適用本貸款，且該擔保品所有權（含他人部分）應全部提供為擔保，並以非循環擔保貸款(不含「安心貸」)為限，配偶非<mark>為員工者</mark>與員工本人合計<mark>最高為新臺幣(以下同)1,500萬元</mark>；<mark>配偶亦為員工者，</mark>二人合計總額度<mark>最高1,</mark>8<mark>00萬元</mark>。另，屬銀行法第12條之1之「自用住宅放款」及「消費性放款」案件，除借款人為強化其自身授信條件，主動填具申請書向銀行提供一般保證人外，不得徵提保證人；非屬銀行法第12條之1規範之案件，得酌情徵取一般保證人。"}},{"id":"111-42","y":111,"n":42,"m":2,"q":"受理未成年人擔任借款人之案件，下列何者錯誤？","o":["可申貸「購置不動產貸款」","貸款成數以所購置不動產鑑估值之5成為上限","得適用營業單位經理權限辦理","應確認已符合民法第1088條「為子女之利益」意旨"],"a":2,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"八、借款人為自然人時，以具有行為能力者為原則。由未成年人擔任借款人時，應確認已符合民法第1088條「為子女之利益」意旨始得受理，僅限申貸「購置不動產貸款」，並遵循下列事項："}},{"id":"111-43","y":111,"n":43,"m":2,"q":"有關「樂活信貸」循環型無擔保貸款，下列敘述何者不正確？","o":["本行特選客群，最高循環額度為平均月收入10倍","綜合循環型，循環額度契約期限3年為一期，屆期得重新評估以同一內容辦理續約","至少每半年辦理一次期中管理","借款人於全體金融機構之無擔保債務歸戶之總餘額(含信用卡、現金卡及信用貸款)除以平均月收入，不得超過22倍"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第九節 「樂活貸」循環型房貸","t":"2.<mark>循環額度</mark>：(1)<mark>契約期限</mark>：以<mark>3年為一期，屆期得重新評估以同一內容辦理續約</mark>，不另換約，惟最終期限為最初契約起日加計「非<mark>循環額度</mark>」<mark>契約期限</mark>，契約到期時，借款人應立即清償所有借款。(2)額度動用：同「單一循環型」額度動用方式。"}},{"id":"111-44","y":111,"n":44,"m":2,"q":"辦理消金信貸業務應注意規範下列何者為非？","o":["應逐案於借據載明「總費用年百分率」","借款人於全體金融機構之無擔保債務歸戶總餘額不得逾平均月收入22倍(DBR22倍)","撥貸前不須回查消金e-loan系統「信貸撥貸前DBR速算」或至聯徵中心查詢B68","收取之費用上限不得逾公告收費標準"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"4.無擔保放款DBR22倍回查作業：貸放當日應以<mark>消金e-loan系統「信貸撥貸前DBR速算」</mark>功能<mark>或至聯徵中心查詢B68</mark>交易，並填寫「個人無擔保債務DBR22倍計算表」計算，確認無逾DBR22倍規範後方得撥貸。"}},{"id":"111-45","y":111,"n":45,"m":9,"q":"為防杜人頭戶房貸案件，下列何者為疑似人頭戶表徵？<br><span class=\"it\">A.</span> 同一人於本行及其他金融機構共擔任三人(含)以上之擔保貸款保證(含本案)<br><span class=\"it\">B.</span> 借款人或保證人之上班地點鄰近申貸分行，有地緣關係<br><span class=\"it\">C.</span> 由配偶以外之第三人陪同洽辦，且均由第三人代為回應借款洽辦事宜<br><span class=\"it\">D.</span> 借款人之所得或還款能力與借款金額顯不相當","o":["ABC","BCD","ABD","ACD"],"a":3,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第二節 一般催討程序","t":"(二)保證人代償放款要求讓與借據，<mark>或保證人以外之第三人代</mark>償放款時，有關債權憑證、擔保品、擔保證件及其他重要文件之處理，應申請債權管理處核准後辦理。"},"x":"人頭戶表徵：A 共擔任 3 人以上擔保貸款保證、C 第三人陪同代答、D 所得與借款顯不相當；B 地緣關係近屬正常 → ACD。","lo":1},{"id":"111-46","y":111,"n":46,"m":10,"q":"因訴訟案件聲請法院為假扣押或假處分之執行所提存之擔保物，應於提供擔保之原因消滅之翌日起（　）年內儘速向該管轄法院提存所聲請返還，避免逾期致該提存物歸屬於國庫。","o":["3","5","10","15"],"a":2,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第三節 取回提存物","t":"一、<mark>因訴訟案件聲請法院為假扣押或假處分之執行所提存之擔保物，應於提供擔保之原因消滅之翌日起（</mark>如假扣押、假處分所保全之請求，其本案訴訟已獲全部勝訴判決或依督促程序之支付命令於104年7月2日以前確定者等）十<mark>年內儘速向該管法院提存所聲請返還，</mark>逾期其提存物<mark>屬於國庫</mark>（參照提存法第十八條）。"}},{"id":"111-47","y":111,"n":47,"m":9,"q":"下列何者非屬「風險較高覆審戶」之對象範圍？","o":["授信戶經本行信用評等列為第10-13等者","授信戶已經拒絕往來","目前為預警戶","無擔保授信金額合計達新臺幣5,000萬元(含)以上"],"a":3,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"(二)本行<mark>無擔保授信金額合計達新</mark>台幣伍仟萬元（含）以上。􀀁(三)本行主辦且為管理行之聯合貸款。􀀁(四)財務處及海外分行投資公司債票券、金融債票券或信用連結商品涉及公司信用者。惟如持有之金融債票券，其信用評等達投資等級以上，或前述標的經金融機構保證，而保證機構之信用評等達投資等級者，則得免辦理覆審，然日後該發行（或保證）機構之債信評等遭調降而未達前述標準者，則仍須辦理覆審作業。前述信用評等達投資等級，指符合下列情形：􀀁"}},{"id":"111-48","y":111,"n":48,"m":10,"q":"營業單位對催收及呆帳案件債務人辦理抵銷金額單筆達等值新臺幣多少(含)以上時，應填製「催收及呆帳案件(抵銷)防制洗錢及打擊資恐交易檢核表」？","o":["3萬元","5萬元","10萬元","50萬元"],"a":3,"ci":{"b":"授信篇","c":"第五十八章 逾期放款之帳務處理","s":"第四節 防制洗錢及資恐交易之管理","t":"1.<mark>營業單位對催收及呆帳案件債務人辦理抵銷金額單筆達等值新臺幣50萬元(含)以上時，</mark>抵銷款以「其他預收款-預收放款延滯案款項(34410)」項子目入帳後，須<mark>填製「催收及呆帳案件(抵銷)防制洗錢及</mark>」項子目入帳後，須<mark>填製「催收及呆帳案件(抵銷)防制洗錢及打擊資恐交易檢核表」</mark>。"}},{"id":"111-49","y":111,"n":49,"m":10,"q":"營業單位徵取A公司簽發並經B公司背書之本票乙張，到期日為110年9月1日，本行嗣後採取訴追程序時，可對下列何者申請本票裁定強制執行？","o":["僅A公司","僅B公司","A公司或B公司均可以","以上皆非"],"a":0,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（四）開發國內信用狀之受益人非授信戶資料表列明之進貨廠商。（五）客票融資之發票人非授信戶資料表列明之銷貨廠商。（六）關係企業A公司及B公司均為本行授信戶，在A公司資產負債表列有對B公司之應收款項，惟B公司資產負債表卻未列有對A公司之應付款項，反之亦同；或A公司資料表說明B公司為其主要銷貨廠商，然經實地訪查得知B公司為其原料供應商。"},"x":"本票裁定（票據法 123 條）僅得對<b>發票人</b>聲請，對背書人須另行起訴，故僅 A 公司。","lo":1},{"id":"111-50","y":111,"n":50,"m":10,"q":"有關保全之裁判及執行程序，下列何者為非？","o":["聲請假扣押裁定，可向案件管轄法院或假扣押標的物所在地之地方法院聲請","債務人不得提供擔保，向法院聲請撤銷假扣押裁定","執行程序應向執行標的物所在地地方法院民事執行處具狀聲請之","債權人收受假扣押或假處分裁定後已逾30日者，不得聲請執行"],"a":1,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第一節 裁判程序","t":"三、債務人<mark>得提供擔保，向法院聲請撤銷假扣押裁定</mark>（參照民事訴訟法第五百二十七條，第五百三十條第二項）。故聲請<mark>假扣押裁定</mark>時，應注意避免因聲請之債權金額低於執行標的物之價值，致債務人<mark>提供擔保聲請撤銷假扣押裁定</mark>，影響本行債權之受償。"}},{"id":"111-51","y":111,"n":51,"m":10,"q":"依本行資產評估損失準備提列及逾期放款催收款呆帳處理準則第七條，所稱逾期放款，指積欠本金或利息超過清償期（　），或雖未超過上述期限，但已向主、從債務人訴追或處分擔保品者。","o":["1個月","2個月","3個月","6個月"],"a":2,"ci":{"b":"授信篇","c":"第五十八章 逾期放款之帳務處理","s":"第四節 防制洗錢及資恐交易之管理","t":"0.04%第二類：2%第三類：10%第四類：50%第五類：100%第五條(依主管機關要求或金檢意見補足)依第三條及前條規定所提列之<mark>損失準備</mark>、備抵呆帳及保證責任準備，經主管機關或金融檢查機關（構）評估不足時，應立即依主管機關要求或金融檢查機關（構）檢查意見補足。第六條(稽核作業)稽核單位應依據本準則暨「第一商業銀行授信資產風險評估作業準則」及「第一商業銀行非授信資產風險評估作業準則」等業務處理相關規定之內部處理制度及程序，對資產品質之評估、<mark>損失準備</mark>之提列、<mark>逾期放款催收款</mark>之清理及呆帳轉銷，執行業務稽核，有關前述事項之考核重點另訂之。第七條(<mark>逾期放款</mark>定義)本準則<mark>稱逾期放款，指積欠本金或利息超過清償期</mark>三個月<mark>，或雖未超過</mark>三個月<mark>，但已向主、從債務人訴追或處分擔保品者。</mark>協議分期償還放款符合一定條件，並依協議條件履行達六個月以上，且協議利率不低於原承作利率或新承作同類風險放款之利率者，得免予列報<mark>逾期放款</mark>。但於免列報期間再發生未依約清償超過三個月者，"}},{"id":"111-52","y":111,"n":52,"m":10,"q":"下列何者非為消滅時效中斷之事由？","o":["債權人催告債務人履行債務(如以催告函、存證信函等)","債權人以訴訟行為行使其權利","債權人開始執行行為或聲請強制執行","債權人依督促程序聲請發支付命令後撤回聲請"],"a":3,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第三節 中斷時效之方法","t":"四、與起訴有同一效力之事項：(民法第一百二十九條第二項)(一)<mark>依督促程序聲請發支付命令</mark>：但因<mark>聲請發支付命令</mark>而中斷之時效，若<mark>撤回聲請</mark>或受駁回之裁判或<mark>支付命令</mark>失其效力時視為不中斷(民法第一百三十二條)。"}},{"id":"111-53","y":111,"n":53,"m":5,"q":"下列敘述何者為非？","o":["企業實際經營者過往有負面新聞，應於徵信報告揭露","已知借戶有訴訟案件，或於會計師財務報表查核報告中揭露，應至司法院網站查詢相關案件之最新進度，並於徵信報告中說明","凡屬民營事業且同時從事多種性質不同之行業時，應依其產值(或營業額)取多者認定其業別","對非金融公司有控制性持股之民營事業，應建檔為「016421民營-金融控股業」"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第三節 授信申請書之填製","t":"一、行業分類編號：應根據「貸款對象與編號對照表」將借款人所屬業種分類號碼填入。凡屬<mark>民營事業，</mark>同一事業單位，同時從事多種性質不同之行業，按其產值（或營業額）取多者認定其業別，若產值（或營業額）相同者，則按其員工人數或資產設備較多者認定之。"}},{"id":"111-54","y":111,"n":54,"m":6,"q":"依本行採用IFRSs之財務報告規範，為利於比較分析，辦理現金流量表攤列時，應將「支付利息」列於何項活動？","o":["營業活動","投資活動","籌資活動","營業活動或籌資活動"],"a":0,"ci":{"b":"徵信篇","c":"第四章 國際財務報導準則(IFRSs)","s":"第五節 財務報表主要會計項目","t":"(一)<mark>支付利息</mark>：得分類為<mark>營業活動</mark>或籌資活動。然因利息費用主係來自於營運所需之融資行為<mark>，為利於比較分析，</mark>倘企業提供<mark>之財務報</mark>表列為籌資活動，辦理攤列時應調整為<mark>營業活動</mark>。"}},{"id":"111-55","y":111,"n":55,"m":5,"q":"企業戶於下列何種授信金額情況下適用「簡易資料表」？","o":["金融機構總授信金額新臺幣500萬元","金融機構總授信金額新臺幣3,500萬元","金融機構總授信金額新臺幣1,200萬元且具有十足擔保","金融機構總授信金額新臺幣1,500萬元"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第三節 資料表之種類與運用","t":"3.保證人資料。三、小規模營利事業簡易資料表（如範例三）適用對象：凡企業授信戶在<mark>金融機構總授信金額新</mark>台幣6<mark>00萬元</mark>（含）以下者，或新台<mark>幣1,500萬元</mark>（含）以下且具有十足擔保者，適用「小規模營利事業簡易資料表」。主要內容："}},{"id":"111-56","y":111,"n":56,"m":6,"q":"下列何者是企業償債能力分析之主要財務比率？","o":["流動比率","存貨週轉率","營業利益率","固定長期適合率"],"a":0,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"<mark>分析之主要比率有如下數種</mark>：1.流動比率計算公式：說明：(1)此比率為銀行徵信分析最早採用的方法，且為比率分析中最重要者，故亦稱為銀行家比率。"}},{"id":"111-57","y":111,"n":57,"m":5,"q":"下列何者非屬徵信人員須加強財務狀況分析及於徵信報告揭露相關風險之態樣？","o":["自有資本不足","所屬產業進入門檻較高且營運獲利能力允當","將資金無息貸予關係企業","投資週轉多仰賴股東往來支應"],"a":1,"ci":{"b":"徵信篇","c":"第八章 企業經營活動及產銷分析","s":"第二節 企業內部經營活動分析","t":"6.垂直整合即企業藉由合併其<mark>所屬產業</mark>之上游或下游廠商，以求整體營運成本之精簡或銷售之擴展。一般企業採行垂直整合之動機包括：確保原料來源、運用一貫化生產追求低成本、價格差異化、取得上、下游資訊、阻止競爭者進入及避免遭競爭者排除等。然垂直整合雖有上述功能，其亦可能伴隨部分缺點，包括：內部官僚成本、缺乏營運效率、缺乏營運彈性等。因此，徵信人員應詳細分析企業採行垂直整合策略之目的、本身整合能力、整合利益與障礙之成本效益分析等，綜合評估該策略之可行性及影響。"},"x":"自有資本不足、資金無息貸予關係企業、仰賴股東往來支應皆須加強分析揭露；「進入門檻高且獲利允當」非風險態樣。","lo":1},{"id":"111-58","y":111,"n":58,"m":3,"q":"針對企業戶申貸銷售型土建融規劃興建集合住宅者，辦理徵信作業時應調查及敘明附近建案相關資訊，下列敘述何者有誤？","o":["應包含附近預售建案之平均價格","應包含附近新成屋之餘屋數量","得參酌內政部新建餘屋(待售)住宅統計資訊及外部網站資料","倘該建案所屬行政區無新推案或新成屋行情及銷售率，僅需敘明「查無銷售率供參」"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"八、承做營建融資時，除建案為自建或無預售之個案外，如興建地區係本行不動產分級評等表A級地區以外之重劃區或鄰近區域推案量供過於求者，其個案銷售率應不低於該案融資價值比(Loan-To-Value,LTV)方可貸放，至於若地處偏僻或山坡地，距離市區較遠、市場性欠佳之案件，則應避免承做。另屬都市更新、危老重建或建案有經東亞建築經理股份有限公司辦理建經管理，且搭配本行不動產信託有完善之續建建制，得不受銷售率之限制。土地融資(即購地擔保放款)之貸放，得不受銷售率之限制。"},"x":"銷售型土建融徵信：所屬行政區無新推案或新成屋行情時，應擴大參考鄰近區域或其他統計資料，<u>不能僅敘明「查無銷售率供參」</u>。","lo":1},{"id":"111-59","y":111,"n":59,"m":6,"q":"下列何者非屬新式會計師查核報告(審計準則公報第57號)之會計師查核意見？","o":["保留意見","修正式無保留意見","無法表示意見","否定意見"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第三節 會計師財務報表查核報告","t":"(六)查核意見類型改為四種，分別是<mark>無保留意見</mark>、<mark>保留意見</mark>、否定意見及無法表示意見，刪除原<mark>修正式無保留意見</mark>類型。此外，新式會計師核閱報告(依據審計準則公報第65號)與原核閱報告之差異主要在於意見類型改為無保留結論、保留結論、否定結論及無法作成結論，有別於原之標準<mark>式無保留</mark>核閱報告、<mark>修正式無保留</mark>核閱報告、保留式核閱報告、否定式核閱報告及拒絕式核閱報告。"}},{"id":"111-60","y":111,"n":60,"m":5,"q":"金好用公司擬向本行申請中期借款新臺幣1.5億元供營運週轉金使用，經查目前聯徵中心之金融機構授信歸戶總餘額為新臺幣0.5億元(已扣除存單質借、出口押匯及進口押匯)，下列何者屬應徵提資料？<br><span class=\"it\">A.</span> 營運計畫<br><span class=\"it\">B.</span> 預估資產負債表、預估綜合損益表<br><span class=\"it\">C.</span> 現金流量預估表<br><span class=\"it\">D.</span> 個案預計資金來源去路表<br><span class=\"it\">E.</span> 無須徵提預估資料","o":["ABC","E","BC","ABCD"],"a":0,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他中長期授信：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、建廠進度表、<mark>營運計畫</mark>、<mark>現金流量預估表、預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信中心歸戶餘額及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯</mark>之金額。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"}},{"id":"112-1","y":112,"n":1,"m":5,"q":"有關企業戶徵信報告之改編，下列何者為非？","o":["每屆滿 1 年，即須重新徵取授信戶資料表，重新辦理徵信分析","於本行僅有授信總額在新臺幣 300 萬元以下之中長期不動產擔保放款，如信用狀況無重大變化，得免逐年改編","徵信報告有效期間內申請增貸時，若金融機構總授信金額未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，應立即改編","信用狀況如發生重大變化時，應即重新辦理徵信"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第一節 動態徵信的意義與重要性","t":"而為提升<mark>徵信報告</mark>屆期改編作業管理效能，企金e-Loan系統每月5日提供「<mark>徵信報告</mark>（摘要/補充說明）未來二個月屆期明細表」、每月10日提供「<mark>徵信報告</mark>逾改編屆期日二個月內明細表」，營業單位應指派專人每月定日列印，並於『備註』欄位扼要敘明處理情形（如:已洽客戶提供資料、已不往來、編製中等），自報表產製日起5個營業日內，逐級呈核至單位經理後專卷保管，保管期限1年；報表查詢列印系統(OnDemand)每月5日提供「得免逐年改編<mark>徵信報告</mark>之授信戶名單」(代號DWLN08)，營業單位應指派專人每月定日列印，逐級呈核至單位經理後專卷保管，保管期限1年。至於在<mark>徵信報告有效期間內</mark>，企業授信戶<mark>申請增貸時，</mark>應重新檢視其在<mark>金融機構總授信金額</mark>是否仍在原徵授信戶<mark>資料表範圍</mark>內，若已逾越，應重徵授信戶資料表及相關財務報表<mark>辦理徵信報告</mark>改編工作。若雖<mark>未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，</mark>則對於原辦理單位已核定之徵信相關報告得繼續沿用至報告有"}},{"id":"112-2","y":112,"n":2,"m":5,"q":"阿壹公司金融機構總授信金額新臺幣 3 億元，下列何者情況應辦理中長期授信分析？<br><span class=\"it\">A.</span> 擬向本行申請建廠性質之中期借款時<br><span class=\"it\">B.</span> 短期授信展期續約超過一年以上時<br><span class=\"it\">C.</span> 已貸放之中期借款徵信報告屆期改編時","o":["AB","AC","BC","ABC"],"a":0,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第一節 徵信報告之種類與運用","t":"6.建廠進度表(若為週轉資金<mark>性質之中長期授信</mark>或<mark>短期授信展期續約超過一年以上</mark>之授信戶，此項得免徵)。六、境外公司<mark>徵信報告</mark>："}},{"id":"112-3","y":112,"n":3,"m":7,"q":"有關授信移送信保基金保證期中管理<br><span class=\"it\">A.</span> 營業單位應派員每 2 個月至企金 e-Loan 系統逐筆填報異常名單之「授信移送信保基金保證期中管理工作單」<br><span class=\"it\">B.</span> 營業單位應至信保基金網路作業系統辦理信用惡化通知，並於每月月底前將當月執行結果列印陳核後存卷備查<br><span class=\"it\">C.</span> 期中管理異常名單系統篩選定義為送保案件發生之信用異常態樣，營業單位免再執行資料查詢作業<br><span class=\"it\">D.</span> 企金 e-Loan 系統期中管理作業，應傳送主管覆核結案，分行副理可代為決行核定結案，實體期中管理工作單亦陳核至分行副理即可。上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":1,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"(七)貸放後<mark>管理作業</mark>：<mark>營業單位應派員每月至企金e-Loan系統逐筆填報異常名單之「授信移送信保基金保證期中管理工作單」</mark>及<mark>至信保基金網路作業系統辦理信用惡化通知，並於每月月底前將當月執行結果列印陳核後存卷備查</mark>。另系統<mark>於每月月</mark>初產出前一個月<mark>期中管理</mark>名單執行明細資料，供執行情形之管控<mark>，營業單位應派員每</mark>月列印「前一月份管理明細」表呈核後專卷存查，保存期限2年，尚未完成者(即「<mark>期中管理</mark>完成日期」空白)<mark>，營業單位</mark>主管應了解原因並追蹤後續完成作業，自行於報表上更新完成情形。"}},{"id":"112-4","y":112,"n":4,"m":7,"q":"有關「青年創業及啟動金貸款」<br><span class=\"it\">A.</span> 資金用途包含準備金及開辦費用、週轉性支出、資本性支出<br><span class=\"it\">B.</span> 貸款額度得分次申請及分批動用，且得循環動用與借新還舊<br><span class=\"it\">C.</span> 週轉性支出貸款期限最長 6 年(不含寬限期最長 1 年)<br><span class=\"it\">D.</span> 應一律移送中小企業信用保證基金保證。上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":2,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第六節 青年創業及啟動金貸款","t":"三、<mark>貸款額度</mark>：(一)<mark>準備金及開辦費用</mark>：最高新臺幣200萬元(二)<mark>週轉性支出</mark>：最高新臺幣400萬元。(三)<mark>資本性支出</mark>：最高新臺幣1,200萬元。以上均<mark>得分次申請及分批動用，</mark>惟不<mark>得循環動用</mark>且不得<mark>借新還舊</mark>。"},"x":"A 正確（準備金及開辦費用、週轉性、資本性支出）；B 錯（得分次動用但<b>不得循環、不得借新還舊</b>）；C 錯（週轉性 6 年「<b>含</b>」寬限期 1 年）；D 錯（僅 100 萬以下一律移送信保）→ 錯誤 3 項。","lo":1},{"id":"112-5","y":112,"n":5,"m":8,"q":"有關「利率重評機制」，下列敘述何者為非？","o":["係指授信貸放期間內，非真正以固定利率一價到底承做，而是定有利率重新評定期間者","外幣貸款「利率型態」為機動利率者，得以經理權限核准貸放","外幣貸款貸放期間內定有利率重評機制者，貸放時「利率型態」應以機動利率建檔","執行新臺幣貸放交易(6420)時，應依利率重新評定週期選擇適用利率代碼建檔"],"a":1,"ci":{"b":"授信篇","c":"第四章 貸放、收息及收回","s":"第一節 貸放手續","t":"(四)新台幣授信利率條件定有「利率重評機制」，係指授信貸放期間之固定利率，非真正以固定利率一價到底承作，而是定有利率重新評定期間，建檔方式如下："},"x":"外幣貸款定有利率重評機制者，貸放時「利率型態」以機動利率建檔；但不因此即可以經理權限核准，故 (2) 錯誤。","lo":1},{"id":"112-6","y":112,"n":6,"m":11,"q":"辦理「外銷貸款」業務，下列敘述何者為非？","o":["有關洗錢高風險客戶加強查核措施：倘為出口後交易者，應逐筆徵取發票及運送相關文件進行查核，惟得申請總行或區域中心免徵","辦理出口託收貸款，貸款期限應依融資日起至預計貨款收妥之日訂定，但最長不得超過六個月為原則，且不得超過保險證明書有效期限","辦理出口週轉金貸款，應一律向區域中心、授信審核處申請","辦理出口信用狀貸款，貸款到期日不得超過信用狀有效期限及單據提示期限"],"a":0,"ci":{"b":"授信篇","c":"第二十一章 外銷貸款","s":"第一節 防制洗錢及打擊資恐作業","t":"(三)<mark>洗錢高風險客戶加強查核措施：</mark>1.<mark>出口後交易</mark>：<mark>應逐筆徵取發票及運送相關文件進行查核，</mark>且不<mark>得申請總行或區域中心免徵</mark>。2.出口前交易：(1)憑訂單、契約等文件(不含L/C)辦理之出口前外銷貸款，應補徵<mark>運送相關文件</mark>，並至「待辦(應補正)事項追蹤系統(TDT)」（系統路徑：單一入口網站/行員專用系統/作業風險專區）完成登錄，待補徵完成後填寫「外銷貸款審核工作單(補徵運送文件專用版)」，且與原審核工作單併同存查。(2)如係交易取消、非屬貨物貿易等特殊原因致無法補徵<mark>運送相關文件</mark>者，應於「待辦(應補正)事項追蹤系統(TDT)」相關欄位予以說明後結案。(3)倘補徵之運送文件經查核發現涉及應婉拒事項者，應依「約定書(放002)」相關條款通知客戶於合理期間內全數清償該筆貸款本息，且自發現日起六個月內停止受理該客戶出口前外銷貸款。"}},{"id":"112-7","y":112,"n":7,"m":11,"q":"有關本行辦理「聯合授信貸款及專案融資」業務，下列敘述何者為非？","o":["「專案融資案件」係具備專案計畫性質且融資額度達等值新臺幣 30 億元(含)以上者","聯貸案徵有國內擔保品時，e-Loan 系統之設定金額及貸放限額應依參貸比率輸入","營業單位於貸放後應定期依「承諾事項檢核表」檢核是否依規定履行各項承諾","聯貸案辦理額度建檔前，應先執行「聯合貸款資料維護(A611)及授信項目資料維護(A612)」建檔"],"a":0,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第二節 專案融資","t":"一、<mark>專案融資</mark>範圍<mark>「專案融資</mark>（ProjectFinancing）」有別於傳統之企業融資（CorporateFinancing），係指以<mark>專案計畫</mark>未來產生之收入及現金流量作為還款來源，或以<mark>專案計畫</mark>項下之資產及權利(如特許權或地上權等)作為擔保，向銀行取得特定用途之融資。本業務要點所指<mark>「專案融資案件」係專案計畫性質</mark>具備下列條件之一<mark>且融資額度達等值新臺幣</mark>5<mark>0億元(含)以上者</mark>："}},{"id":"112-8","y":112,"n":8,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，下列何者為非？","o":["「客戶風險評分交易(A194)」屬高風險者，於授信申請書敍明承做理由，不得以營業單位經理權限核定","倘借戶、保證人、擔保物提供人符合「重要政治職務人士(PEPs)」者，應暫停授信額度，且不得申請新額度","「客戶風險評分交易(A194)」註記「09：特殊風險客戶」者，應向法令遵循處洗錢防制部辦理查詢","法人借款之權利文件倘授權由經理人簽章，應辦理被授權人「線上姓名檢核」作業"],"a":1,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"4.辦理授信申請時，不得受理洗錢及資恐「黑名單」之借戶/保證人/<mark>擔保物提供人</mark>。5.借戶(含個人戶、法人、團體或其高階管理人員、法人實質受益人、非個人戶之負責人)<mark>、保證人、擔保物提供人符合「</mark>防制洗錢打擊資恐(AML)系統管制名單」(AML「黑名單」、<mark>「重要政治職務人士(PEPs)」</mark>及「負面新聞」)時，應採取之管控措施如下：(1)黑名單：屬「受經濟制裁或屬恐怖份子或團體｣或「依資恐法凍結資產或通報｣<mark>者，應暫停授信額度，且不得申請新額度</mark>；倘命中之黑名單為本行自建之「(SPEC)外匯異常名單」、行自建之「(SPEC)外匯異常名單」、「(SPEC)AIT恐怖分子名單」，應洽外匯營運處外匯作業部，了解其建檔原因，藉以判斷是否受理。(2)<mark>重要政治職務人士(PEPs)</mark>或負面新聞：由營業單位自行評估是否受理，並審慎辦理。(3)倘經個案評估受理者，應於授信案件申請書(含條件變更)揭露原因並敍明承做理由。"}},{"id":"112-9","y":112,"n":9,"m":10,"q":"有關保全程序，下列敘述何者為非？","o":["向法院具狀聲請假扣押執行時，應檢送委任狀及繳付執行標的金額0.5%之執行費","執行程序應向執行標的物所在地地方法院民事執行處具狀聲請之","債務人得提供擔保，向法院聲請撤銷假扣押裁定","債權人收受假扣押或假處分裁定後已逾三十日者，不得聲請執行"],"a":0,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第二節 執行程序","t":"一、執行程序應向<mark>執行標的</mark>物所在地地方法院民事執行處<mark>具狀聲請</mark>之（債權人收受假扣押或假處分裁定後已逾三十日者，不得聲請執行），如<mark>執行標的</mark>物為不動產時，應提出土地、建築物、登記簿謄本各乙份。開始<mark>執行時，應檢送委任狀及繳付執行</mark>費（<mark>執行標的金額</mark>之"}},{"id":"112-10","y":112,"n":10,"m":10,"q":"下列消滅時效完成之效果，何者為非？","o":["主權利因時效消滅者，其效力及於從權利","時效完成後債務人得拒絕給付，惟債務人仍為履行之給付者，不得以不知時效為理由請求返還","抵押權人於抵押權所擔保債權時效消滅完成後五年間不實行其抵押權者，其抵押權消滅","本金請求權因時效而消滅者，其利息請求權仍為有效"],"a":3,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第二節 消滅時效完成之效果","t":"(二)抵押權人於抵押權所擔保債權之消滅時效完成後五年間不實行其抵押權者，其抵押權消滅（民法第八百八十條）。三、主權利因時效<mark>消滅者，其</mark>效力及於從權利（民法第一百四十六條）。因此<mark>本金請求權因時效而消滅者，其利息請求權</mark>亦同歸於消滅。"}},{"id":"112-11","y":112,"n":11,"m":2,"q":"有關本行「個人戶地上權建築物貸款」，下列敘述何者正確？","o":["寬限期最長 3 年","非本行土建融轉分戶貸款，限承作擔保品座落於 A、B 級區域","貸款期限最長30 年","不得搭配辦理「樂活貸」循環型房貸"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"(一)擔保品已有<mark>「樂活貸」循環型房貸</mark>者，不得辦理本貸款。(二)擔保品不得辦理增貸(含<mark>「樂活貸」循環型房貸</mark>)、充作其他貸款之副擔保或加強債權使用。"}},{"id":"112-12","y":112,"n":12,"m":4,"q":"徵取「擔保物權連結條款同意書」(下稱「同意書」)應注意事項，下列敘述何者為非？","o":["不得在借款人尚無新融資需求時，事先預留「同意書」","應由借款人親自填寫最高限額抵押權擔保之債權金額及債務種類","已徵取「同意書」者，於不動產登記簿結案後，由業務經辦依同意書內容於消金 e-Loan 系統進行建檔","「同意書」併同抵押權設定文件歸檔(即存放於擔保袋)"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.「同意書」第二點因攸關擔保物提供人之權益，應由擔保物提供<mark>人親自填寫最高限額抵押權擔保之債權金額及債務種類</mark>，不得預先於「同意書」印製<mark>債務種類</mark>選項，填寫時應注意：(1)擔保<mark>債務種類</mark>：以「借款、墊款、透支、貼現」為限，且不得逾原購屋貸款<mark>最高限額抵押權債務種類</mark>範圍。保證債務、信用卡債務等因性質上與一般貸款不同，不宜包含在內。(2)擔保金額：以<mark>最高限額抵押權</mark>設定之金額為上限。"}},{"id":"112-13","y":112,"n":13,"m":5,"q":"關於辦理徵信查詢聯徵中心信用資訊相關應注意事項，下列敘述何者為非？","o":["退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","如遇當事人要求撤回授信申貸案件並退回所有申請文件時，應儘可能保留當事人同意書等查詢資格要件正本，或預先將相關文件影印留存","各單位應指定專人每週列印查詢紀錄資訊","指定專人列印之查詢紀錄資訊應設專卷保留 5 年備查"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第五節 財團法人金融聯合徵信中心信用資訊產品種類與運用","t":"六、各使用<mark>單位應指定專人每</mark>日<mark>列印查詢紀錄資訊</mark>，經查詢人員蓋章及主管覆核（主管亦應覆核查詢信用資料是否符合本要點第九條之規定）確認後，設專卷保留五年備查。"}},{"id":"112-14","y":112,"n":14,"m":6,"q":"關於財務比率之敘述，下列何者為非？","o":["負債比率愈高代表財務狀況愈不穩固","固定長期適合率超過 100%時，企業有侵用短期資金，移作長期性運用之疑慮","流動比率愈低，其短期償債能力則趨弱","營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期"],"a":3,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"(6)<mark>現金週期=應收款項週轉轉天期+存貨週轉天期-應付款項週轉天期</mark>。"}},{"id":"112-15","y":112,"n":15,"m":2,"q":"有關得排除適用 DBR22 倍規範之個人無擔保貸款，下列敘述何者為非？","o":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在 6 年內將擔保物設定擔保物權者","個人自建房屋自住之建築融資貸款，在 6 年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在 3 年內設定擔保物權者"],"a":2,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第一節 通則","t":"3、「在一定合理期間」將擔保品<mark>設定擔保物權者</mark>：(1)參與都市更新或危老建物重建計畫貸款：一定合理期間不得超過六年。(2)借款人擔保品被政府徵收而改列無擔保之放款，如原土地之所有權人及抵押權人(即原金融機構)已依據土地徵收條例規定，約定於發給之抵價地設定抵押權予原土地抵押權人者：一定合理期間不得超過六年。(3)<mark>個人自建房屋自住之建築融資貸款</mark>：一定合理期間不得超過三年(如有特殊原因敘明理由後得延長為五年)。(4)企業員工認購「限制員工權利新股」之貸款：一定合理期間不得超過三年4)企業員工認購「限制員工權利新股」之貸款：一定合理期間不得超過三年。(5)企業員工認購股票(可轉換公司債)：一定合理期間不得超過六個月。(6)遺產稅融資：一定合理期間不得超過六個月(以繼承資產<mark>設定擔保物權</mark>為限)。(7)贈與稅融資：一定合理期間不得超過六個月(以受贈資產<mark>設定擔保物權</mark>為限)。(8)受贈土地之土地增值稅融資：一定合理期間不得超過六個月。(以該土地<mark>設定擔保物權</mark>為限)。"}},{"id":"112-16","y":112,"n":16,"m":1,"q":"辦理中央銀行管控之購地貸款案件時，假設聯大公司購置新北市永和區都計之住宅區土地，買賣成交價為 123,455 仟元，本行鑑價金額為 122,456 仟元，未動工前應保留金額及可動撥金額，下列何者最正確？","o":["12,245 仟元及 48,970 仟元","12,245仟元及 48,950 仟元","12,250 仟元及 48,930 仟元","12,250 仟元及 48,990 仟元"],"a":2,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"(二)貸款額度最高不得超過購買土地取得成本與金融機構鑑價金額較低者之五成，<mark>其中一成應俟借款人動工興建後始得撥貸</mark>。"},"x":"購地貸款最高為取得成本與鑑價孰低（122,456 仟元）之 5 成，其中 1 成須俟動工後始得撥貸；官方答案：保留 12,250 仟元、可動撥 48,930 仟元。","lo":1},{"id":"112-17","y":112,"n":17,"m":4,"q":"有關徵提保證人之相關規範，下列何者正確？","o":["依法律或公司章程規定以保證為業務之公司，始得接受其為保證人","為求作業方便，不論借、保戶資力，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請","得徵取未成年人為保證人","因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"(七)合夥組織之行號為人作保時，由執行事務合夥人或出名營業人為代表人，依其資格出名外，應徵取全體合夥人之同意書。(八)限於<mark>依法律或公司章程規定以保證為業務之公司，始得接受其為保證人</mark>。"}},{"id":"112-18","y":112,"n":18,"m":9,"q":"下列何者非屬「風險較高覆審戶」之對象範圍？","o":["無擔保授信金額合計達新臺幣5,000萬元(含)以上","授信戶已經拒絕往來","目前為預警戶","授信戶經本行信用評等列為第10-13等者"],"a":0,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"(二)本行<mark>無擔保授信金額合計達新</mark>台幣伍仟萬元（含）以上。􀀁(三)本行主辦且為管理行之聯合貸款。􀀁(四)財務處及海外分行投資公司債票券、金融債票券或信用連結商品涉及公司信用者。惟如持有之金融債票券，其信用評等達投資等級以上，或前述標的經金融機構保證，而保證機構之信用評等達投資等級者，則得免辦理覆審，然日後該發行（或保證）機構之債信評等遭調降而未達前述標準者，則仍須辦理覆審作業。前述信用評等達投資等級，指符合下列情形：􀀁"}},{"id":"112-19","y":112,"n":19,"m":10,"q":"就債務人之財產所得向法院聲請強制執行前，應填寫「逾放(含呆帳)案件聲請法院強制執行前檢核表」(下稱檢核表)，下列敘述何者為非？","o":["應就檢核表所列項目逐項檢視，以確認本行債權是否存在及判斷執行對象於本行債務範圍","前揭檢核表，經催收經辦確認完即可，無須交由催收主管覆核","填寫檢核表，如查知執行對象於聯行有授信往來或於本行有信用卡、現金卡等，應以「逾放(含呆帳)案件通知評估辦理參與分配及陳報債權作業聯繫單」通知聯行或信用卡處(消金催收部)評估是否參與分配及陳報債權","檢核表查詢對象包括借戶、保證人或票據債務人"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（四）聯繫事項如係須由本行支付費用者，例如申請戶籍謄本、申請地政資料…等，應經債權管理處書面通知方得辦理。（五）聯繫事項如係為確認該案件任一債務人(含保證人、票據債務人及繼承人等)有無本行同意免除債務責任或本行敗訴確定之記載，受聯繫單位應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」(下稱檢核表)所列檢核項目逐項與催收日誌、原始債權契據及電腦建檔等資料相互勾稽確認，檢核表由<mark>催收經辦</mark>人員確認並送<mark>催收主管覆核</mark>後，正本及相關文件影本併同「第一金AMC受託催收逾放個案聯繫單」回覆第一金AMC，並留存影本備查。"}},{"id":"112-20","y":112,"n":20,"m":2,"q":"有關本行以房養老「安心貸」業務，下列敘述何者為非？","o":["擔保品抵押權之設定金額應按貸放限額 1.4 倍設定","擔保品已有「樂活貸」循環型房貸者，不得辦理本貸款","貸款期間加計借款人年齡之合計數不得低於 95，且貸款期間最長以 35 年為限","屬 B、C、D 級之擔保品，案件一律申請總行或區域中心核准後辦理"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"(二)擔保品依本行不動產分級評等表，於下列擔保品貸放成數範圍內辦理。屬<mark>C、D級之擔保品，案件一律申請總行或區域中心核准後辦理</mark>。不動產分級評等貸放成數A級且為臺北市及新北市70%A級(不含臺北市及新北市)65%B級60%<mark>C、D級</mark>50%"}},{"id":"112-21","y":112,"n":21,"m":5,"q":"有關徵信作業注意事項，下列敘述何者為非？","o":["企金 e-Loan 系統每月 5 日提供「徵信報告未來二個月屆期明細表」","企金 e-Loan 系統每月 10 日提供「徵信報告逾改編屆期日二個月內明細表」","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」，保管期限至少 1 年","倘財報決算日距改編日超過 6 個月以上，應一律加徵期中報表"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"核報告，亦即需徵取三年度財務報表。惟無論新編或改編徵信報告所徵取之財務資料，應以最近年度財務報表為準，且其<mark>決算日距改編日</mark>期不得逾8個月，倘期間超附錄二-18過8<mark>個月以上，應一律加徵期中報表</mark>辦理攤列並輔助分析說明。"}},{"id":"112-22","y":112,"n":22,"m":5,"q":"有關免辦理徵信之敘述，下列何者為非？","o":["對會員銀行之授信案件得酌情免辦理徵信","對政府機關及公營事業之授信案件得酌情免辦理徵信","提供本行定期存單十足擔保之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件得免辦理徵信"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"1.新台幣借款及其間接保證<mark>授信案件</mark>：倘借戶無其他授信時，對借戶已提供本行新台幣定期存單或存摺存款設質十足擔保所申請<mark>之授信案件</mark>，除<mark>「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件</mark>外，得免辦徵信；若授信額度達本行重要授信戶標準者，亦得免辦重要授信戶之徵信分析。"}},{"id":"112-23","y":112,"n":23,"m":5,"q":"依本行徵信業務權限劃分，有關營業單位辦理權限之敘述何者為非？","o":["個人授信戶(含保證人)之徵信業務","企業授信戶在本行總授信額度為新臺幣4,000萬元之徵信業務","本行統籌主辦聯貸案件之徵信業務","無追索權應收帳款承購業務之買方信用調查表及簡明財務摘要表"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"2、企業授信戶在本行總授信額度達提送授信審議委員會者，加編企業戶徵信報告摘要。（三）徵信處徵信部辦理業務權限：1、<mark>統籌主辦聯貸案件</mark>。"}},{"id":"112-24","y":112,"n":24,"m":6,"q":"辦理財務報表分析時，遇下列何種情況可能潛藏異常資訊？","o":["最近兩期 CFO 均為淨流入","速動比率 100%","負債比率 50%","最近一期營收下滑 30%"],"a":3,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"6、最近二年連續虧損，虧損持續擴大，且最近一年權益為負數者。7、最近一年(會計年度)營收鉅幅(較去年減少20%以上)下降，負債比率持續上升者。"},"x":"營收鉅幅下滑（30%）為異常警訊；CFO 淨流入、速動比率 100%、負債比率 50% 屬正常水準。","lo":1},{"id":"112-25","y":112,"n":25,"m":6,"q":"下列何者非評估企業償債能力之主要財務比率？","o":["流動比率","速動比率","應收款項週轉率","本金利息保障倍數"],"a":2,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"<mark>分析之主要比率有如下數種</mark>：1.流動比率計算公式：說明：(1)此比率為銀行徵信分析最早採用的方法，且為比率分析中最重要者，故亦稱為銀行家比率。"}},{"id":"112-26","y":112,"n":26,"m":5,"q":"有關境外公司基本資料之徵取，下列何者為非？","o":["同一關係企業及集團企業資料表","組織章程或合夥契約影本","負責人及保證人僅須留存一種身分證件影本","如係設立於免稅地之境外公司，應加徵最近年度政府規費繳訖證明單及存續證明"],"a":2,"ci":{"b":"授信篇","c":"第四十八章 境外公司及大陸地區法人融資業務","s":"第四節 其他注意事項","t":"(二)受理單位為OBU或海外分行，由海外A/O人員或海外分行自行編製徵信報告。(三)基本資料之徵取：境外公司大陸地區法人1.借款人、<mark>負責人及保證人</mark>之資料表與<mark>負責人及保證人</mark>之<mark>身分證件影本</mark>(應留存兩種，包括有效之護照、由政府"}},{"id":"112-27","y":112,"n":27,"m":5,"q":"下列何種異常情況免於徵信報告揭露？","o":["負責人或保證人有信用不良情形者","已知借戶曾有償還異常紀錄，然查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常者","借戶與關係人間之不動產交易價格異於市場行情者","以上皆非"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）對借保戶本身於私人、非金融機構及金融機構借款已知曾有償還異常紀錄，雖查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常，<mark>於徵信報告</mark>中「過去償債情形」欄位，仍應勾選「有逾催紀錄」或「有呆帳紀錄」，並於「綜合意見」欄說明原因。"}},{"id":"112-28","y":112,"n":28,"m":5,"q":"有關進銷貨廠商之查證，下列何者為非？","o":["台灣地區查詢「經濟部商工登記資料公示查詢系統」及「財政部稅務入口網站公示資料查詢系統」","若進銷貨廠商為公營事業，仍應查證","境外地區(含大陸地區)可查詢國外上市櫃資訊、公司相關網站或企業授信戶提供佐證資料","應列印查詢結果存卷備查再於徵信報告登錄進銷貨廠商名單"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"1.查證方式如下：(1)台灣地區：「經濟部商工登記資料公示查詢系統」及「財政部稅務入口網站公示資料查詢系統」。(2)境外地區(含大陸地區)或台灣地區非屬上述第(1)點之其他申登機關登記：查詢國外上市櫃資訊、公司相關網站、企業授信戶提供佐證資料(如：財務報表、年報中揭露<mark>進銷貨廠商</mark>資訊、買賣合約、發票及運送單據等)或當地主管機關登記資料或台灣地區其他申登機關登記資料。"}},{"id":"112-29","y":112,"n":29,"m":3,"q":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者為非？","o":["重建融資額度原則上應一次全數動撥至信託專戶","營建融資及其他營建費用融資成數最高十成","須經全體土地及合法建物所有權人同意","依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(三)前項建築物造價，除委由建築經理公司核估，並經總行核准者外，應依本行現行各類建築物估價標準予以評估計算。四、貸款期限基地面積於200坪以內或興建建物10層樓以下者，最長以三年為原則；基地面積超過200坪且11層樓以上者，按<mark>實際需要及興建計畫個別核定</mark>，惟最長以不超過六年為原則。貸款期限如超過前述期限者，應說明原因。"},"x":"同 110-33。","lo":1},{"id":"112-30","y":112,"n":30,"m":7,"q":"信保基金保證手續費，應於授信翌日起（　）個曆日 內存入信保基金指定之帳戶。","o":["7 個營業日","7 個曆日","5 個營業日","5"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"(二)借款人應指定具法定繼承資格之人或第三人(無法定繼承資格之人時適用)為通知義務人，於借款人死亡之翌日起20<mark>個營業日</mark>內通知本行。"},"x":"保證手續費應於授信<b>翌日</b>起 <b>7 個營業日</b>內存入信保基金指定帳戶。","lo":1},{"id":"112-31","y":112,"n":31,"m":7,"q":"有關中小企業信用保證基金送保對象基本資格之敘述，下列何者為非？","o":["中小企業：符合行政院核定「中小企業認定標準」之中小企業，惟不含金融及保險業、特殊娛樂業","取有主管機關依法核發營業證照之申貸戶(含公立機關(構)及財團法人)，得視同依法辦理公司登記或商業登記","曾以直接保證方式取得貸款之企業得為直接保證之保證對象","其他經信保基金董事會議通過並經經濟部核定之信用保證對象"],"a":1,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十三節 小微企業優惠貸款","t":"一、對象：<mark>依法辦理公司登記</mark>、<mark>商業登記</mark>、有限合夥登記且營業正常、無債票信不良紀錄，並符合下列條件之一的中小企業(含獨資及合夥)。"},"x":"取有主管機關營業證照者得視同公司/商業登記，但<b>不含</b>公立機關（構）及財團法人，故 (2) 錯誤。","lo":1},{"id":"112-32","y":112,"n":32,"m":7,"q":"針對無須先經信保基金同意，可逕准辦理展延、分期償還或寬限期之授信案件，於行內辦理條件變更核准後，依規最遲應於原清償屆至之日後（　）內，填送「移送信用保證通知單」並將計收之保證手續費匯存基金指定帳戶，並依基金回覆結果辦理。","o":["一個月","二個月","三個月","六個月"],"a":1,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"1.中小企業<mark>信保基金</mark>：(1)<mark>保證手續費</mark>以一次計收為原則，中、長期授信得逐年計收。(2)移送保證案件(含貸放、展期<mark>、分期償還</mark>，逾期列管案件除外)，均應於基金網路作業系統<mark>填送「移送信用保證通知單」</mark>通知<mark>信保基金</mark>，並收取匯繳<mark>保證手續費</mark>(交易代號385存入營業部帳號)，始完成送保程序。(3)採逐年計收<mark>保證手續費</mark>者，為避免遺漏收取，請先徵提各年<mark>保證手續費</mark>期票備付，並應於每月第一個營業日，至基金網路作業系統/通知事項/「逐年收費期間即將屆滿案件」查詢列印(當月無資料仍需列印存卷)，並將完成匯繳手續費日期填寫於空白處，逐級陳核至單位主管，倘有未完成繳費者應即處理，報表應設專卷存查，保存期/「逐年收費期間即將屆滿案件」查詢列印(當月無資料仍需列印存卷)，並將完成匯繳手續費日期填寫於空白處，逐級陳核至單位主管，倘有未完成繳費者應即處理，報表應設專卷存查，保存期限1年。"},"x":"逕准展延/分期/寬限之案件，最遲於原清償屆至日後 <b>2 個月</b>內填送移送信用保證通知單並匯繳手續費。","lo":1},{"id":"112-33","y":112,"n":33,"m":7,"q":"下列敘述何者為非？","o":["企業小頭家貸款週轉性支出每一事業額度最高為新臺幣500 萬元，惟受災事業不受額度限制","微型創業鳳凰貸款額度最高新臺幣 200 萬元，惟僅辦理稅籍登記者以 50 萬元為限","青年創業及啟動金貸款週轉性支出額度最高新臺幣 500 萬元","民宿貸款經常性週轉金額度依授信 5P 原則核實認定"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第一節 企業小頭家貸款","t":"(四)本貸款每一事業<mark>週轉性支出最高新臺幣500萬元</mark>部分，係各承貸銀行合計，由信保基金管控其額度。(五)經信保基金核保5成以下之案件，須改以批次送保方式送保。"}},{"id":"112-34","y":112,"n":34,"m":3,"q":"有關「建築貸款」<br><span class=\"it\">A.</span> 土地融資係指因承做房屋興建投資所辦理之購地或合建保證金貸款<br><span class=\"it\">B.</span> 營建融資係指興建房屋貸款<br><span class=\"it\">C.</span> 營建融資原則上不得超過預估建築物興建造價之五成<br><span class=\"it\">D.</span> 營建週轉金得以循環額度方式辦理。上述正確者共有幾項？","o":["1","2","3","4 項"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"一、定義<mark>因承做房屋興建投資所辦理之購地或合建保證金貸款</mark>(稱「<mark>土地融資</mark>」)、<mark>興建房屋貸款</mark>(稱「<mark>營建融資</mark>」)及<mark>營建週轉金</mark>，統稱<mark>「建築貸款」</mark>。"},"x":"A、B、C、D 皆正確：土融＝購地或合建保證金、營建融資＝興建房屋、營建融資原則 5 成、營建週轉金得循環。","lo":1},{"id":"112-35","y":112,"n":35,"m":7,"q":"信用保證案件尚未到期，如有下列何種情形(信用惡化)發生時，授信單位應於知悉之日起十日內，最遲應於二個月內通知信保基金？<br><span class=\"it\">A.</span> 授信對象停止營業者<br><span class=\"it\">B.</span> 未能依約分期攤還已超過一個月者<br><span class=\"it\">C.</span> 應繳付之利息延滯期間逾一個月，未逾三個月者<br><span class=\"it\">D.</span> 授信對象或其負責人受票據交換所拒絕往來處分者","o":["ABC","ABD","BCD","ABCD"],"a":1,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第二節 微型創業鳳凰貸款","t":"2.經向金融聯合徵信中心查詢或徵授信過程中知悉其有債務本金逾期未清償、未依約定<mark>分期攤還已超過一個月</mark>、應繳利息未繳付而<mark>延滯期間</mark>達三個月以上或有信用卡消費款項逾期未繳納，遭發卡銀行強制停卡，且未繳清延滯款項。"},"x":"應通知：A 停業、B 分期攤還逾 1 個月、D 授信對象或負責人拒往；C 利息延滯「逾一個月未逾三個月」未達 3 個月門檻 → ABD。","lo":1},{"id":"112-36","y":112,"n":36,"m":11,"q":"有關保證業務，下列敘述何者為非？","o":["客戶有預開保證書需求時，申請之保證期間應包含預開天數及銀行保證天數","申請外幣保證業務，應事先申請授信審核處或區域中心核准","對於以一定成數移送信保基金之新臺幣保證案件，整筆保證金額仍以無擔保列帳","授信戶於本行之授信額度已屆期不再續約，得解除保證責任"],"a":3,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第一節 申請手續","t":"十、申請外幣保證業務，其<mark>授信額度</mark>(含設定)應事先申請授信審核處或區域中心核准。"}},{"id":"112-37","y":112,"n":37,"m":11,"q":"有關國內即期信用狀業務，下列敘述何者為非？","o":["本行墊付票款後，申請人應於十天內來行清償","信用狀有效期限原則上不得超過六個月","如另續貸新臺幣放款，續貸期限自本行墊付日起最長180天","申請人於申請開狀後，其指定受益人得依信用狀規定簽發匯票，惟免經承兌即可請求本行付款"],"a":1,"ci":{"b":"授信篇","c":"第三十五章 國內即期信用狀業務","s":"第一節 申請手續","t":"(二)依據國內即期信用狀向本行申請付款之匯票，除經總行或區域中心同意外，應使用本行印製之用紙（放074C）。(三)<mark>信用狀有效期限原則上不得超過</mark>四個月。"}},{"id":"112-38","y":112,"n":38,"m":11,"q":"有關綜合授信額度，下列敘述何者為非？","o":["本項額度應向區域中心或授信審核處申請核准","最高額度合計不應超過借款企業「最近一年營業額」或「預計未來一年營業額之八成」孰高","不包括出口押匯（含出口貼現）授信","辦理用途不明確之外幣借款保證時，得逕行運用「丁類無擔保授信」項下之其他保證額度"],"a":3,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第六節 其他注意事項","t":"一、<mark>辦理用途不明確之外幣借款保證時，</mark>因無法確實掌握且風險較高，不<mark>得逕行運用</mark>綜合授信額度<mark>「丁類無擔保授信」項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"}},{"id":"112-39","y":112,"n":39,"m":1,"q":"依「中央銀行對金融機構辦理不動產抵押貸款業務規定」，受理公司法人購置住宅貸款，下列敘述何者為非？","o":["不得有寬限期","貸款額度最高不得超過鑑價或買賣金額較低者之四成","借戶得以修繕或其他貸款名目另向金融機構借款取得自籌款","購買「高價住宅」，應一律送區域中心或總行授信審核處審核"],"a":2,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"一、依中央銀行113年9月19日台央業字第1130035582號函辦理。二、辦理公司法人購置住宅貸款，應徵取「切結書【公司法人及個人非消費性貸款專用】」(下稱「切結書」)，切結貸款金額最高未超過新購置住宅(含基地)鑑價或買賣金額較低者之3成，且無另以修繕、周轉金<mark>或其他貸款名目</mark>，向本行或其它<mark>金融機構</mark>額外增加貸款，並配合提供相關自籌款來源佐證資料予本行留存備查。"}},{"id":"112-40","y":112,"n":40,"m":8,"q":"有關「第一商業銀行依貨幣市場利率承做短期放款準則」，下列敘述何者為非？","o":["貸放期限最長為 180 天","經核准之授信案件，於實際貸放之風險貼水(即「貸放風險貼水」)未低於「核准風險貼水」時，授權營業單位得逕予貸放","逐筆議價案件取得授權號碼後，應於當日或次一營業日辦理貸放，逾期不得貸放","未依指定到期日償還(含提前或逾期償還)，利息均溯至貸放日起依該筆貸放利率再加 1%計收"],"a":0,"ci":{"b":"授信篇","c":"第三十四章 國內遠期信用狀業務","s":"第一節 申請手續","t":"(四)信用狀有效期間原則上不得超過六個月，信用狀項下之承兌匯票付款期限，最長不得超過一百八十天。(五)在承兌匯票到期時，得就借款戶個別交易實際需要續貸新臺幣放款，期限應依借款戶資金需要及營業週轉期間內核給，惟匯票承兌期間加計續貸新臺幣放款期間，不得超過原核准每次可<mark>貸放期限</mark>（最長不超過<mark>180天</mark>）。"},"x":"MML 貸放期限最長 <b>90 天</b>（非 180 天）；風險貼水未低於核准者授權逕貸；議價號碼當日或次一營業日貸放；未依指定到期日償還溯及加 1%。","lo":1},{"id":"112-41","y":112,"n":41,"m":11,"q":"有關「出口週轉金外幣貸款」業務，下列敘述何者為非？","o":["每次貸款期限應按信用狀有效期限訂定，其辦理輸出保險者，且不得超過保險證明書有效期限","以訂單契約或記帳方式（O/A）辦理者，應一律申請總行或區域中心核准","以綜合額度方式申請時，憑國外訂單或輸出契約方式辦理者，隸屬「丙類無擔保授信」額度","辦理出口前外幣貸款，借款人得逕將撥貸之外幣款項兌換為新臺幣"],"a":3,"ci":{"b":"授信篇","c":"第四十五章 工商企業出口週轉金外幣貸款","s":"第二節 貸放手續","t":"八、辦理國內借款人出口前(裝船前)之<mark>外幣貸款，</mark>為避免借款人<mark>逕將撥貸之外幣款項兌換為新</mark>台幣，應於撥貸同時直接匯付予借款人國內或國外之供應商，或撥入借款人外匯存款帳戶同時辦理匯出匯款。借款人未能配合於撥貸同時匯出時，應另開立備償借款專戶供作撥款專戶，以限制其於出口前或匯出前辦理兌換。供作撥款專戶之備償借款專戶，應具獨立功能性，不得與其他業務共用同一帳號，惟借款人為<mark>辦理出口</mark>貸款(包含外銷貸款及出口週轉金<mark>外幣貸款</mark>)，針對以記帳(O/A)方式出口之買方匯入款，已有開立備償借款專戶控管償還來源者，得在帳務釐清無虞原則下，共用該帳號作為撥款專戶，免另開立新帳號。至於國內借款人出口後及OBU之<mark>外幣貸款，</mark>均不受此限。"}},{"id":"112-42","y":112,"n":42,"m":8,"q":"A 為甲公司之負責人且持股 30%，A 之配偶 B 持股甲公司 15%，A 之未成年子女 C持股甲公司 10%，A 另為乙公司之負責人且持股 100%，依「總行及區域中心各級人員授信審查權限準則」，甲公司之審查權限應併計對象為何？","o":["AB","ABC","AB 乙公司","無應併計對象"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(一)應於授信申請書「營業單位補充說明」中敘明案件關聯性。(二)應合併計算渠等借款人之授信權限額度，依歸戶後之額度判斷是否屬「國內營業單位經理權限授信要點」審核權限；倘逾經理權限者，逕依「總行及區域中心各級人員授信審查權限準則」申請區域中心或總行核准後辦理。參、信貸通則"},"x":"同 111-6：法人授信戶審查權限<b>無應併計對象</b>。","lo":1},{"id":"112-43","y":112,"n":43,"m":8,"q":"有關本行集團關係戶之管理，何者為非？","o":["兩家企業之授信額度合計達新臺幣 20億元者，已符合集團控管認定標準","集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬","授信新戶需同步申請集團限額時，得先經核准授信案件後，再行核備限額"],"a":3,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第八節 行員及關係人授信之限制","t":"80.12.5台融局(二)字第801675646號函）2.銀行如因會計年度決算後淨值降低，致已撥貸或已簽訂授信契約尚未撥款之<mark>授信案件</mark>，超逾銀行法第三十三條之三第一項對同一人或同一關係人或同一關係企業之授信<mark>限額時，得</mark>依原契約之授信額度繼續撥貸至契約屆滿為止，惟應注意風險控管。（金管會"},"x":"同 111-16：不得「先核准授信、再核備集團限額」。","lo":1},{"id":"112-44","y":112,"n":44,"m":4,"q":"辦理利害關係人擔保授信案件申請時，應填寫「利害關係人與非利害關係人授信條件比較表」，前述所稱授信條件包括：<br><span class=\"it\">A.</span> 利率<br><span class=\"it\">B.</span> 擔保品及其估價<br><span class=\"it\">C.</span> 授信金額<br><span class=\"it\">D.</span> 保證人資力","o":["AB","ABC","BD","AD"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十三節 黃金存摺業務質借新臺幣","t":"(四)借款人為本行<mark>利害關係人時，應填寫「利害關係人與非利害關係人授信條件比較表」，</mark>確認並於授信申請條件加註「本案借戶為本行<mark>利害關係人</mark>，經查借戶○○○<mark>授信條件</mark>未優於其他同類授信對象(如附件)」。"}},{"id":"112-45","y":112,"n":45,"m":2,"q":"有關「個人戶地上權建築物貸款」業務，何者為非？","o":["本行土建融轉分戶貸款，不限擔保品座落區域","重估案件得由營業單位辦理鑑價","應為政府機關核准屬可分割移轉之地上權建築物，貸放成數最高七成","授信到期日以不超過地上權存續期間屆滿前 10 年之日為原則"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第二節 調查及鑑價","t":"(十)承作「個人戶地上權建築物貸款」業務應依下列規範辦理：1.不論新貸或<mark>重估案件</mark>，一律由總行鑑價管理部或各區域中心<mark>辦理鑑價</mark>。"}},{"id":"112-46","y":112,"n":46,"m":8,"q":"依「國內營業單位經理權限授信要點」，何者為非？","o":["無擔保授信移送經政府核准設立之信用保證機構信用保證之成數部分，倘送保項目屬間接授信科目者，則該送保成數部分視同擔保授信","公司負責人屬本行觀察名單，得適用經理權限","以股票為擔保品之授信，不得適用經理權限","個人與企業間授信歸戶時，企業之負責人、董事、監察人及其配偶之新臺幣授信權限額度應與企業合併計算"],"a":0,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業<mark>信用保證</mark>基金之保證(一)財團法人中小企業<mark>信用保證</mark>基金（以下簡稱信保基金），為<mark>政府核准設立之信用保證機構</mark>，經其保證之授信，該保證<mark>成數部分，</mark>得視為<mark>擔保授信</mark>。"},"x":"官方答案 (1) 為錯誤敘述；(2) 觀察名單得適用經理權限、(3) 股票擔保不得適用、(4) 個人與企業歸戶併計負責人董監及其配偶，依 112 年版本為正確。","lo":1},{"id":"112-47","y":112,"n":47,"m":8,"q":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","o":["原徵取之擔保品由本行活期性備償存款變更為等值應收客票","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","負責人更名"],"a":0,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第六節 其他應注意事項","t":"(二)應徵提交易單據(如：契約、發票等)佐證，並依授信篇第十五章第三節第一、二條，辦理<mark>應收客票</mark>徵取之實際交易行為查證作業，以確認所徵取之本票或匯票係符合擔保品適格性。"},"x":"擔保品由活存備償改為應收客票，擔保力下降，<b>不得</b>逕由經理核定；更名（未涉組織變更）、公營事業負責人變更、負責人更名可由經理核定。","lo":1},{"id":"112-48","y":112,"n":48,"m":4,"q":"有關「法定代位清償人同意書」之使用，何者為非？","o":["徵有多名保證人且僅免除其中一人之保證責任時，應徵取之","塗銷部分抵押權而借款人尚有其他授信時，應徵取之","擔保物提供人屬法定代位清償人","同意解除向後發生之保證責任，應徵取「免除」格式之同意書"],"a":3,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"五、免除保證人中之一人或數人之責任時，應向法定代位清償人，即保證人、擔保物提供人或其他就債之履行有利害關係之第三人徵取同意書，該同意書可自企業內部入口網站/全行文件庫/風控管理業務/工具箱/授信審核處/用紙專區下載，分為「格式A-免除部分連帶保證人責任，供連帶保證人使用」、「格式B終止部分連帶保證人責任，供連帶保證人使用」、「格式D-免除部分連帶保證人責任，供擔保物提供人使用」與「格式E-終止部分連帶保證人責任，供擔保物提供人使用」四種。<mark>「免除」</mark>係指溯及最初為解除<mark>保證責任</mark>之意；「終止」係指<mark>向後發生</mark>解除保證之意。"}},{"id":"112-49","y":112,"n":49,"m":4,"q":"有關擔保品之規範，下列敘述何者為非？","o":["辦理抵押權塗銷查詢作業，查詢對象包括借款人及擔保物提供人","借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人簽章領回","除另有規定外，動產設定期限一律以貸放期限加五年為準","除拍賣取得者外，不動產新買賣案件應於貸放後 2 個月內至實價登錄網站查證"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"3.借款人及<mark>擔保物提供人</mark>無法出具委託書時，本行得逕向不動產抵押權登記之地政機關辦理抵押權拋棄之塗銷登記。4.空白「<mark>抵押權塗銷同意書</mark>」及「抵押權部份<mark>塗銷同意書</mark>」庫存數量應與登記簿符合；前述作廢之同意書應打「PAID」或加蓋「作廢」戳記，並於適當時期會同主管人員、會計、經辦員予以銷毀。"}},{"id":"112-50","y":112,"n":50,"m":10,"q":"與催收及呆帳案件債務人和解、協議攤還單筆償還金額達等值新臺幣多少(含)以上時，且收回款項入帳後，應填製「催收及呆帳案件(和解或協議攤還)防制洗錢及打擊資恐交易檢核表」？","o":["50萬元","100萬元","200萬元","300萬元"],"a":3,"ci":{"b":"授信篇","c":"第五十八章 逾期放款之帳務處理","s":"第四節 防制洗錢及資恐交易之管理","t":"2.<mark>與催收及呆帳案件債務人和解、協議攤還單筆償還金額達等值新臺幣300萬元(含)以上時，且收回款項</mark>以「其他預收款-預收放款延滯案款項(34410)」項子目<mark>入帳後，</mark>須<mark>填製「催收及呆帳案件(和解或協議攤還)防制洗錢及打擊資恐交易檢核表」</mark 3 年","貸款利率由政院補貼一碼"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十四節 深化中小企業專案貸款","t":"2.購置廠房或辦公場所：期限最長15年(含<mark>寬限期最長3年</mark>)，寬限期滿後以年金或定額本金方式按月或按季平均攤還。五、貸款利率："},"x":"新青安（112.8.1 起）寬限期最長 <b>5 年</b>（非 3 年）；額度 1,000 萬、期限 40 年。","lo":1},{"id":"112-57","y":112,"n":57,"m":2,"q":"有關「本行員工優惠貸款」，下列敘述何者為非？","o":["符合中央銀行管控之購屋貸款案件，不得以員工優惠貸款利率辦理","用途不得為個人理財資金需求","一職等以上在職員工及其配偶均得申貸","未提供擔保品者，每一員工(不含配偶)最高額度為新臺幣 80 萬元整"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十五節 本行員工優惠貸款","t":"三、用途：以員工本人、配偶或直系親屬生活所需者為限，對本行員工購置不動產、房屋裝修、消費性及<mark>個人理財資金需求</mark>。四、額度：(一)擔保貸款："}},{"id":"112-58","y":112,"n":58,"m":9,"q":"有關本行「消費金融業務『高齡客戶暨脆弱族群金融友善服務』注意事項」，下列敘述何者為非？","o":["「高齡客戶」係指年滿 65 歲(含)以上之自然人或辦理本行「安心貸」(逆向抵押貸款)之客戶","「脆弱族群」係指身心障礙人士等","營業單位受理人員填寫「第一商業銀行消費者貸款『高齡客戶暨友善金融』服務評估表」後，需客戶簽章確認","可安排專人到府簽訂貸款相關文件"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(二)<mark>營業單位受理</mark>「<mark>高齡客戶</mark>」或「脆弱族群客戶」申辦貸款業務時，<mark>受理人員</mark>(不限消金經辦)應透過觀察客戶身體外觀、行動能力、言語表達及談話內容，瞭解客戶服務需求及有無遭他人金融剝削之情形，據以<mark>填寫「第一商業銀行消費者貸款『高齡客戶暨友善金融』服務評估表」</mark>（下稱「<mark>服務評估表」</mark>），並評估提供適當之協處措施及其他服務："}},{"id":"112-59","y":112,"n":59,"m":2,"q":"受理未成年人擔任借款人之案件，下列敘述何者為非？","o":["得適用營業單位經理權限辦理","應確認已符合民法第 1088 條「為子女之利益」意旨","可申貸「購置不動產貸款」","貸款成數以所購置不動產鑑估值之五成為上限"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"八、借款人為自然人時，以具有行為能力者為原則。由未成年人擔任借款人時，應確認已符合民法第1088條「為子女之利益」意旨始得受理，僅限申貸「購置不動產貸款」，並遵循下列事項："}},{"id":"112-60","y":112,"n":60,"m":4,"q":"依銀行法第 12 條之 2 作業規範，辦理「自用住宅放款」及「消費性放款」案件有一般保證人且借款期限逾（　）年 者，保證人需親自填寫「宣告保證人責任範圍暨保證期間同意書」之「保證期間」。","o":["5 年","7 年","10 年","15"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)自100年11月11日起新承作(含撥貸)之<mark>「自用住宅放款」及「消費性放款」案件有一般保證人</mark>者：1.應以<mark>「宣告保證人責任範圍暨保證期間同意書」</mark>向保證人宣讀<mark>保證人責任</mark>，使保證人明瞭其保證之法律責任及風險，並請保證人於本文件親簽及蓋章，以利釐清借保戶雙方權利義務關係。"}},{"id":"113-1","y":113,"n":1,"m":4,"q":"有關保證人徵提，下列敘述何者有誤？","o":["徵提保證人應衡酌其資歷及保證能力","不得徵取未成年人為保證人，惟如符合民法第1088 條「為子女之利益」意旨者，才得受理","保證契約屬未定期間最高限額保證者，銀行應每年一次以書面通知函告知其連帶保證人最高限額保證金額及通知當月基準日所負保證債務金額","除另有規定外，本行擔保放款以一人保證，無擔保放款以二人保證為原則"],"a":1,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"八、借款人為自然人時，以具有行為能力者為原則。由<mark>未成年人</mark>擔任借款人時，應確認已<mark>符合民法第1088條「為子女之利益」意旨</mark>始得受理，僅限申貸「購置不動產貸款」，並遵循下列事項："}},{"id":"113-2","y":113,"n":2,"m":8,"q":"A公司有一筆短期放款額度新臺幣(以下同)100萬元，移送信保八成，現欲申請開發國內信用狀額度200萬元及履約保證額度300萬元，均移送信保六成，依目前「國內營業單位經理權限授信要點」之權限判斷，應以多少金額來認定「無擔保授信」？","o":["600萬元","520萬元","500萬元","220萬元"],"a":3,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業信用保證基金之保證(一)財團法人中小企業信用保證基金（以下簡稱信保基金），為政府核准設立之信用保證機構，<mark>經其保證之授信，該保證成數部分，得視為擔保授信</mark>。"},"x":"信保保證成數部分視同擔保：短放 100×(1−0.8)＝20；LC 200×(1−0.6)＝80；履保 300×(1−0.6)＝120；合計 <b>220 萬</b>。","lo":1},{"id":"113-3","y":113,"n":3,"m":4,"q":"有關不動產抵押權設定，下列敘述何者有誤？","o":["設定金額原則上以放款值加二成或提高至鑑價金額範圍內辦理","如屬重估案件，其設定限額、貸放限額及設定年限(或擔保債權確定期日)均未變更，授權營業單位經理逕行核定","企業戶貸款抵押權設定之權利種類，應由客戶自行勾選採「最高限額」或「普通」抵押權設定","如受理「普通抵押權」設定申貸者，應申請總行或區域中心核准後辦理"],"a":2,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"2.個人消費性貸款：<mark>權利種類</mark>：應由擔保物提供人<mark>自行勾選採「最高限額」或「普通」抵押權設定</mark>，勾選前宜先向客戶說明抵押權所擔保債權範圍，原則上應<mark>採「最高限額</mark>抵押權」；擔保範圍：倘其他約定事<mark>採「最高限額</mark>抵押權」；擔保範圍：倘其他約定事項(消費者貸款專用)(用紙編號：消放033)，擔保物提供人選擇<mark>「最高限額</mark>抵押權」者，擔保債權範圍應親自填寫，不得以繕打或蓋章為之，並據以勾選「土地、建築改良物<mark>抵押權設定</mark>契約書〔個人消費性貸款適用〕(放033E)」第(18)欄「擔保債權種類及範圍」，並以「借款、保證、透支（依銀行公會授信準則附表，係指支票存款戶無存款餘額或餘額不足支付時，銀行先予墊付之融通方式）、票據、信用卡契約、衍生性金融商品交易契約」等6項為原則；不足項者，應申請區域中心/總行核准後辦理。"}},{"id":"113-4","y":113,"n":4,"m":4,"q":"授信額度核准後，應核發「額度核定通知書」予借戶，下列敘述何者不正確？","o":["借戶確認額度通知書內容無誤即可，無須取得借戶蓋妥授信往來印鑑之回執聯存卷","應由主管蓋妥腰形章後寄(交)借戶","內容載明承作條件、擔保條件、收取費用及其他授信條件等重要內容","永續績效連結授信專案案件核准後，應將授信條件中擬改善之指標及連結利率條款，敘明於「額度核定通知書」之其他授信條件"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第五節 授信申請書之編號及發送","t":"(二)借戶應於確認「額度核定通知書」<mark>內容無誤</mark>後，於回執聯<mark>蓋妥授信往來印鑑</mark>後交回本行，營業單位應將收妥<mark>之回執聯存卷</mark>備查。(三)倘無法<mark>取得借戶蓋妥授信往來印鑑之回執聯</mark>，則應以雙掛號郵寄「額度核定通知書」予借戶，並將郵政回執聯與「額度核定通知書」影本併同留存備查。"}},{"id":"113-5","y":113,"n":5,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，營業單位於企金e-Loan編製核貸單時，下列敘述何者不正確？","o":["借戶倘為「疑似洗錢資恐高風險戶」，應敘明借戶為高風險之原因及承作理由","倘借戶是屬「Z8-告誡清單」，營業單位得免再評估個案風險逕予貸放","倘是「09：特殊風險客戶」，應由防制洗錢督導主管覆核","倘是「09：特殊風險客戶」，應登入「國內AML 系統」查詢借戶被申報SAR(加強關注客戶)之時間，並列印查詢結果存卷備查"],"a":1,"ci":{"b":"授信篇","c":"第四章 貸放、收息及收回","s":"第一節 貸放手續","t":"(3)核貸單應由防制洗錢督導主管覆核，陳核至經理同意，始可辦理撥貸作業。3.倘查詢借戶結果為「●是疑似洗錢資恐高風險戶」，且「●<mark>是屬「Z8-告誡清單」Z8-告誡清單」</mark>：(1)請<mark>營業單位</mark>查詢並列印A247-Z8。(2)說明原因欄位：請依A247-Z8查詢結果敘明告誡日期、告誡期限及告誡處分資料來源。(3)承作理由欄位：<mark>營業單位</mark>應審慎<mark>評估個案風險</mark>，倘評估後仍欲貸放，應於承作理由欄位敘明評估內容。"}},{"id":"113-6","y":113,"n":6,"m":11,"q":"有關「墊付國內票款」業務，下列敘述何者不正確？","o":["以「短期放款-票借短放」申請之授信案件，應逐筆依兌現之票據金額沖償借款","以會計項目「短期放款-票借短放」或以 100%以上保持票方式(會計項目「短期放款-其他短放」)辦理之授信案件，其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額不得逾其授信額度金額 20%","以「短期放款-票借短放」申請之授信案件，得徵取禁止背書轉讓票據","本次徵取之票據，其同一發票人累計金額達新臺幣 50 萬元(含)以上者，應另徵取由借戶(賣方)開立之國內統一發票或相關交易資料備查"],"a":2,"ci":{"b":"授信篇","c":"第十五章 墊付國內票款","s":"第一節 申請","t":"七、票據集中度限額：以會計項目「17426<mark>短期放款-票借短放」</mark>或、票據集中度限額：以會計項目「17426<mark>短期放款-票借短放」</mark>或以100%以上保持票方式(會計項目「17442<mark>短期放款-</mark>其他短放」)辦理<mark>之授信案件，</mark>其所徵取之票據，同一發票人(含有利害關係之企業及個人)累計未銷帳金額(含前徵取票據)不得逾其授信額度金額20%。惟得因個案考量，於授信申請書之「授信條件」欄敘明從寬條件外，另應於「信用綜合評估表」之分析中載明原因，並依授信審核層級核准後始得辦理。"}},{"id":"113-7","y":113,"n":7,"m":11,"q":"辦理「透支」業務，下列敘述何者不正確？","o":["執行「支票存款透支契約資料設定登錄(3190)」時，倘帳號欄位顯示為疑似洗錢資恐高風險戶，惟授信申請時非為高風險戶，法金經辦無需於批覆書註明為高風險戶原因及承做理由後再陳經理同意，即得逕行辦理建檔作業","執行「放款核准資料登錄單（6400）」建檔，核准金額一律輸入0，以免造成借款人於金融聯合徵信中心之貸款額度重複計算","對於績優客戶，以「每日最後透支餘額為借款本金」之方式計算透支積數，應另向借款人徵提「約定條款變更同意書」","以「每日最後透支餘額為借款本金」之計息方式，需申請區域中心或授信審核處核准後始得辦理"],"a":0,"ci":{"b":"授信篇","c":"第二十二章 透支","s":"","t":"1、擔保內容必須與「放款核准資料登錄單（6400）」之擔保內容相同。2、執行支存透支額度建檔<mark>「支票存款透支契約資料設定登錄(3190</mark>交易代碼1或代碼2<mark>)」時，</mark>系統將自動檢視其帳號所屬「統一編號」之「客戶風險評分交易(A194)」風險等級，倘風險等級<mark>為高風險</mark>者，<mark>帳號欄位</mark>旁以紅色粗體字樣顯示提醒字句「※<mark>疑似洗錢資恐高風險戶</mark>」，若<mark>授信申請</mark>書未註明<mark>，法金經辦需於批覆書註明為高風險戶及承做理由</mark>，陳核至分行<mark>經理同意</mark>辦理後，始<mark>辦理建檔</mark>/變更作業。"}},{"id":"113-8","y":113,"n":8,"m":11,"q":"有關本行辦理「專案融資」，下列何者為非？","o":["「專案融資案件」係指專案計畫性質具備依政府採購法辦理之政府採購案(包括但不限於公共工程)或發起人、投資人以成立「特殊目的公司」(SPC 或 SPV)作為營運主體之方式執行，且融資額度達等值新臺幣 50 億元(含)以上者","本行參貸或共同主辦聯貸案，倘該聯貸案非統籌主辦銀行認定之專案融資案件，得排除適用本業務要點","「專案融資會議」由法人金融業務處處長擔任召集人","倘屬公共工程案件，至少每三個月填製「專案融資/工程款入帳追蹤表」"],"a":2,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第二節 專案融資","t":"3.<mark>「專案融資會議」</mark>會前會：<mark>由法人金融業務處處長擔任召集人</mark>，出席人員為<mark>法人金融業務處</mark>聯貸及<mark>專案融資</mark>部、授信審核處審核一/二部、徵信處徵信部及營業單位之經理，並視個案需要得邀請信託處、法務室、金融市場業務處及海外業務處等單位派員參加，以研擬適當額度架構及授信條件，協助營業單位依授信程序提出申請。並視個案需要得邀請信託處、法務室、金融市場業務處及海外業務處等單位派員參加，以研擬適當額度架構及授信條件，協助營業單位依授信程序提出申請。"}},{"id":"113-9","y":113,"n":9,"m":7,"q":"有關「海外投資融資(第十二期)貸款」，下列何者正確？","o":["貸款對象為取得政府主管機關核准或核備前往海外投資之國內、外廠商","貸款額度以對外投資金額之七成為限，每家廠商累計核准適用本貸款額度最高不得超過新臺幣 10 億元","貸款期限最長不得超過 7 年，並不得給予寬限期","新臺幣案件電腦建檔之貸款種類：「FI：海外投資融資貸款」"],"a":3,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第八節 海外投資融資貸款","t":"三、<mark>電腦建檔</mark>：(一)<mark>新臺幣案件</mark>：<mark>貸款種類：「FI：海外投資融資貸款」</mark>。(二)外幣案件：1.外幣貸款額度核准資料建檔(I621)額度<mark>種類：「</mark>21<mark>：海外投資融資</mark>」。"}},{"id":"113-10","y":113,"n":10,"m":7,"q":"有關辦理 113~116 年度之批次信用保證融資業務，<br><span class=\"it\">A.</span> 保證成數 10 成，故額度申請及建檔以「擔保放款」科目辦理<br><span class=\"it\">B.</span> 授信案件屬前准尚未動撥者，僅得以 11200701批號辦理移送信用保證<br><span class=\"it\">C.</span> 授信案件屬前准尚未動撥者，若於授信條件敘明移送案號為 11200701 者，需辦理條件變更<br><span class=\"it\">D.</span> 授信案件屬已動撥者，仍得異動批號。 上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":2,"ci":{"b":"授信篇","c":"第二十章 台塑網線上融資業務","s":"","t":"(二)借款戶以電子簽章線上<mark>動撥者，</mark>得無須再徵取借據，惟對於信用財務有疑慮者亦得酌情徵取授信額度􀀁110%本票以加強債權確保。若以臨櫃方式辦理動撥，則應請借戶逐筆出具借據及借款申請書。"},"x":"本題出自信保基金 113–116 年度批次保證作業規定（細則未收錄），官方答案：錯誤者共 <b>3</b> 項。重點記憶：批次保證同一企業上限 2 億、徵 5 成以上擔保品不得送保。","lo":1},{"id":"113-11","y":113,"n":11,"m":7,"q":"下列敘述何者為非？","o":["企業小頭家貸款週轉金支出之貸款期限最長 6 年，寬限期最長 2 年","微型創業鳳凰貸款之貸款期限最長 7 年，按月平均攤還本息","青年創業及啟動金貸款週轉性支出貸款期限最長 6 年，寬限期最長 2 年","民宿貸款之經常性週轉金貸款期限最長 5 年"],"a":2,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第一節 企業小頭家貸款","t":"三、期限：(一)<mark>週轉性支出</mark>：<mark>貸款期限最長6年，寬限期最長2年</mark>。(二)資本性支出：1、廠房、營業場所(倘與其坐落之基地共同購買，則得包含土地)及相關設施：<mark>貸款期限最長</mark>20年，含<mark>寬限期最長</mark>5年。"}},{"id":"113-12","y":113,"n":12,"m":1,"q":"辦理購置「央行管控規定」不動產之「自然人第 3 戶(含)以上購屋貸款」(非以其他房地辦理新貸或以既有房貸案辦理增貸)案件，下列何者為非？","o":["向聯徵中心辦理歸戶查詢，自然人名下已有 2 戶以上房屋為抵押之擔保放款，且資金用途代號為「1」，為購買建物權狀含有「住」字樣之非高價住宅(含基地)之抵押貸款","應分別於授信申請、撥貸當日及貸放後三個月共三個時間點，查核有無於本行或其他金融機構額外增加貸款","查核對象僅限借款人","不得申請寬限期"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)辦理購置「央行管控規定」不動產之案件(含借款人另提供其他房地辦理新貸或以既有「房貸」案辦理「增貸」，且資金用途為購置「央行管控規定」不動產)，應於撥貸前徵取借、保戶、擔保物提供人親簽之「申貸不動產抵押貸款切結書」，切結無另以修繕、周轉金或其他貸款名目，向本行或其他金融機構額外增加貸款，屬「自然人第2戶」、「第3戶(含)以上」購屋貸款、「高價住宅貸款」及「購地貸款」(消金案件)案件另需於撥款前提供自籌款來源證明(如存摺餘額、解約存單或出售有價證券等)，並分別於授信申請、撥貸當日及貸放後三個月共三個時間點辦理查核作業，查詢借款人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)下列事項，並填製「第一商業銀行辦理『央行管控案件』查核控管表(消金專用)」："}},{"id":"113-13","y":113,"n":13,"m":2,"q":"有關辦理「申請展延寬限期逾貸款期限六分之一消金房貸案件」且實際還款金額未達寬限期滿後應攤還金額者，下列敘述何者錯誤？","o":["對「持有多筆房產」、「有還款能力之優質客戶」或「還本後多次增貸者」，不得再申請寬限期","展延期限每次 1 年","還款條件依貸款餘額計算每月應繳利息之 10 倍作為「本次最低應攤還本金」","應申請總行或區域中心核准後辦理"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.<mark>還款條件</mark>：<mark>依貸款餘額計算每月應繳利息之1</mark>2<mark>倍作為「本次最低應攤還本金」</mark>，並應於展延前「一次償還」或「約定於寬限期間按月平均<mark>攤還本金」</mark>。"}},{"id":"113-14","y":113,"n":14,"m":2,"q":"有關「貸款衍生人身保險保費融資貸款」之規定，下列敘述何者錯誤？","o":["對象須為本行不動產擔保貸款借款人","融資躉繳保費-擔保貸款，貸款期限最長 30 年","融資躉繳保費-信用貸款，授權營業單位經理最高核定額度新臺幣 100 萬元，惟與個人無擔保貸款歸戶後逾「個別分行授信權限額度核給範圍」者，仍應申請總行或區域中心核准後辦理","融資躉繳保費-信用貸款，設定第二順位抵押權作副擔保者，貸款期限最長 20 年"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"五、期限：(一)<mark>融資躉繳保費</mark>─擔保貸款：最長30年，且不得適用寬限期。(二)<mark>融資躉繳保費</mark>─<mark>信用貸款</mark>：<mark>設定第二順位抵押權作副擔保者</mark>最長30年，未設定抵押權者最長10年，且不得適用寬限期。"}},{"id":"113-15","y":113,"n":15,"m":9,"q":"下列有關預警戶之敘述何者正確？","o":["只要符合「授信預警徵兆」所列事項之一，即應列為預警戶","不含消費性貸款","授信戶歸類為預警戶起五個營業日內，營業單位應以「預警報告表」，辦理預警通報","授信戶預警徵兆未解除前，營業單位應每 2 個月以「預警報告表」更新預警戶之信用變化及行動計畫執行情形，向原受理通報單位辦理通報"],"a":1,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"2、額度停止動用。3、減少授信額度。4、收回全部或部分授信金額。5、增加保證人。6、增提擔保品。7、其他。（三）授信戶預警徵兆未解除或回復正常前，營業單位仍應按月以「預警報告表」更新預警戶之信用變化及行動計畫執行情形，向原受理通報單位辦理通報。"}},{"id":"113-16","y":113,"n":16,"m":10,"q":"有關債權憑證之敘述何者正確？","o":["催收主管每半年應定期檢視債權憑證時效","具有執行名義之債權人聲明參與分配，不得就其分配不足金額聲請發給債權憑證","對將屆期尚未辦理換發者，除了自辦催收案件由分行自行辦理換發外，分行不用主動通知總行催收人員或委外催收公司辦理換發","以上皆是"],"a":0,"ci":{"b":"授信篇","c":"第五十六章 不良授信建檔管理","s":"第三節 逾期放款檔案之整理","t":"二、法院發給之<mark>債權憑證</mark>【包括本票裁定、民事勝訴判決及確定證明書、支付命令及確定證明書、法院和解或調解筆錄、拍賣抵押（質）物裁定及確定證明書、經法院裁定認可之前置協商方案、更生方案認可裁定及確定證明書、清算確定不免責或撤銷免責之債權表及確定證明書、公證書及其他得為強制執行名義之證明文件】，應逐筆記載於實體及逾催系統之「<mark>債權憑證</mark>登記簿」，<mark>催收主管每半年應定期檢視債權憑證時效</mark>，對於將屆期尚未辦理換發者，除自辦催收案件由分行自行辦理換發外，應責成催收人員以業務聯繫單主動通知負責催理該案之債權管理處管理部（區域中心）催收人員或第一金融資產管理股份有限公司於<mark>債權憑證時效</mark>消滅前辦理換發。"}},{"id":"113-17","y":113,"n":17,"m":10,"q":"下列敘述何者有誤？","o":["因訴訟案件聲請假扣押執行所提存之擔保物，應於提供擔保之原因消滅之翌日起十年內儘速向該管法院提存所聲請返還，逾期其提存物屬於國庫","以本行總行名義為聲請人或原告、上訴人之訴訟案件，相關聲請狀、訴狀或委任書之本行法定代理人住所地，應一律以總行行址為住所地","自 113 年 7 月1 日起，債權人聲請調查債務人之保險人名稱、保險種類或名稱之保險執行事件，請逕向債務人住居所地法院遞狀聲請，以節省時效","債權人收受假扣押或假處分裁定後已 20 日者，不得聲請執行"],"a":3,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第二節 執行程序","t":"(九)<mark>債權人收受假扣押或假處分裁定後已</mark>逾三十<mark>日者，不得聲請執行</mark>（參照強制執行法第一百三十二條）。三、假處分(一)聲請裁定拍賣抵押物之前必要時聲請法院假處分，藉以禁止擔保品出租、出典或與第三人合建房屋等足使其價值減少之行為。"}},{"id":"113-18","y":113,"n":18,"m":5,"q":"下列授信案件何者得酌情免辦徵信？","o":["金控公司授信案件比照會員銀行得酌情免辦理徵信","本行係聯貸案件之參貸銀行，得以主辦行之聯貸說明書作為本行之徵信報告","辦理稅捐記帳保證之授信案件得酌情免辦徵信","借戶無其他授信時，提供他人同幣別之外匯定期存單所申請之外匯授信案件得酌情免辦徵信"],"a":0,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"二、徵信準則第十七條規定：<mark>會員銀行</mark>、政府機關、公營事業、政府計劃性<mark>授信案件</mark>及已提供本行存款十足擔保之<mark>授信案件得酌情免辦</mark>徵信及酌情免予索取相關徵信資料。"}},{"id":"113-19","y":113,"n":19,"m":5,"q":"某企業擬向本行申請資本性支出之中期授信新臺幣1.5億元，經查其聯徵中心歸戶餘額新臺幣0.5億元(已扣除存單質借、出口押匯及進口押匯之金額)，請問應向客戶徵取之中長期資料有哪些？<br><span class=\"it\">A.</span> 現金流量預估表<br><span class=\"it\">B.</span> 預估綜合損益表<br><span class=\"it\">C.</span> 預估資產負債表<br><span class=\"it\">D.</span> 個案預計資金來源去路表及建廠進度表<br><span class=\"it\">E.</span> 營運計畫","o":["ABC","ABCE","ABCDE","無須加徵中長期資料"],"a":2,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他中長期授信：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、<mark>建廠進度表</mark>、<mark>營運計畫</mark>、<mark>現金流量預估表</mark>、<mark>預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信<mark>中心歸戶餘額</mark>及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯之金額</mark>。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"}},{"id":"113-20","y":113,"n":20,"m":6,"q":"有關財務比率分析，下列何者錯誤？","o":["本金利息保障倍數一般用於長期償債能力分析","流動比率如果高於100%，表示企業流動資產足以償還現有之流動債務","現金週期=應收款項週轉天數+存貨週轉天數","速動資產=現金及約當現金+短期性之投資+應收款項淨額"],"a":2,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"買存貨，將存貨銷售，俟<mark>應收款項</mark>到期收回為止所需之期間。(6)<mark>現金週期=應收款項週轉</mark>轉天期<mark>+存貨週轉天</mark>期-應付<mark>款項週轉天</mark>期。即營業週期扣除應付款項延期支付期間，用以測驗企業從購買存貨應付款項付現到<mark>應收款項</mark>收現的期間。"}},{"id":"113-21","y":113,"n":21,"m":4,"q":"如動產抵押案件授信餘額達 5,000 萬元(含)以上者，除每年辦理一次重估外，每隔多久應再辦理「擔保物(動產)勘查閱覽」建檔？","o":["3 個月","6 個月","8 個月","無須辦理"],"a":1,"ci":{"b":"授信篇","c":"第十章 動產擔保交易","s":"第一節 動產抵押","t":"(三)<mark>動產抵押案件</mark>貸放後重估及勘查頻率：1.<mark>授信餘額</mark>未<mark>達5,000萬元每年辦理一次重估</mark>，且應重新實地勘查保養及使用情形，並拍照留存上傳於附加檔案，免<mark>再辦理「擔保</mark>品<mark>(動產)勘查閱覽」建檔</mark>。"}},{"id":"113-22","y":113,"n":22,"m":4,"q":"下列何者非屬本行授信利害關係人控管對象？","o":["一般行員","總行單位副處長","本行持有實收資本總額 3%以上之企業","辦理授信之職員(含有參與該筆授信案件之所有審核人員)"],"a":null,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第七節 授信總餘額之限制","t":"一、<mark>銀行對其持有實收資本總額百分之五以上之企業</mark>，或本行負責人、職員或主要股東，或對與本行負責人或辦理授信之職員有利害關係者為擔保授信，其總餘額不得超過銀行淨值一˙五倍（不得為無擔保授信），並應受下列授信限額等規定之限制：(一)其中對同一法人之擔保授信總餘額不得超過該銀行淨值百分之十。"}},{"id":"113-23","y":113,"n":23,"m":4,"q":"借款人初次授信申請時，應辦理「顧客帳務資料查詢交易（9703）」及「保證資料查詢（A220）」交易，進行授信聯行查詢，下列敘述何者有誤？","o":["企業授信戶查詢對象為借款人、負責人、保證人","個人授信戶查詢對象為借款人、保證人","如查詢對象在聯行無授信往來(含66帳號結清銷戶者)及共同債務者，得逕行辦理授信申請","同一借款人如擬於不同營業單位往來，應先經原往來分行同意後，始得以經理權限進行申請"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"(三)為加強授信歸戶管理，除總行另有規定外，<mark>同一借款人</mark>限在同一家<mark>營業單位</mark>授信往來，<mark>如擬於不同營業單位往來，應先經原往來分行同意後，始</mark>以授信申請書申請區域中心或總行授信審核處核准，惟借款人於聯行授信往來僅有「勞工紓困貸款」或「信用卡處線上行銷部撥貸案件」，<mark>經原往來分行同意</mark>且屬適用<mark>經理權限</mark>者，得逕<mark>以經理權限</mark>核准。"}},{"id":"113-24","y":113,"n":24,"m":4,"q":"本行113年4月核准甲公司短放新臺幣(以下同)10,000仟元，徵取借戶董事長A及董事B為保證人，113年5月貸放一筆2,000仟元，6月保證人B卸任該公司董事且未簽立續任保證人同意書，113年7月再貸放一筆3,000仟元，下列何者正確？","o":["僅保證人A對113年7月之貸放負保證責任","保證人B對2筆貸放皆不負保證責任","保證人A僅對113年5月之貸放負保證責任","需向保證人A徵取「代位清償人同意書」"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"1.有徵取保證書者：(1)於卸任時已簽立「續任保證人同意書」，其展期約據得採蓋章(與放款印鑑一致，以下同)或親簽加蓋章方式辦理，採後者較為嚴謹，原則儘量採用。(2)於卸任時未簽立「續任保證人同意書」，惟願為該筆舊貸案件續負展期<mark>保證責任</mark>，其展期約據採親簽加蓋章方式辦理；倘不願為舊貸案件<mark>負保證責任</mark>，則須申請免除對舊貸案件<mark>保證責任</mark>之核准。"}},{"id":"113-25","y":113,"n":25,"m":11,"q":"有關徵取股票為擔保品之授信，下列何者錯誤？","o":["上市股票之鑑價以股票前一日收盤價與最近三個曆月之平均價孰低者","投資公司授信戶辦理股票質押授信，應徵提具體投資計畫","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","貸放後應注意股價變化，如擔保維持率低於130%，應即實行質權賣出股票，以確保本行債權"],"a":3,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第三節 股票、受益憑證擔保","t":"(二)倘每股時價乘現存擔保股票股數或受益憑證單位數之值低於當日貸放餘額之一二○％者<mark>，應即實行質權</mark>出賣設質股票、受益憑證<mark>，以確保本行債權</mark>。"}},{"id":"113-26","y":113,"n":26,"m":4,"q":"借款人申請塗銷不動產抵押權時，應先審查塗銷抵押權對本行債權之影響，並辦理抵押權塗銷查詢作業，下列何者為應辦理之查詢對象？<br><span class=\"it\">A.</span> 借款人<br><span class=\"it\">B.</span> 企業授信戶之負責人<br><span class=\"it\">C.</span> 擔保物提供人<br><span class=\"it\">D.</span> 保證人","o":["AC","AD","ACD","ABCD"],"a":0,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"三、抵押權之塗銷(一)<mark>借款人申請塗銷抵押權時，應先審查塗銷抵押權對本行債權</mark>有無不利<mark>影響，並辦理抵押權塗銷查詢作業</mark>。<mark>查詢對象</mark>為借款人及<mark>擔保物提供人</mark>，營業單位應執行「顧客帳戶資料查詢交易(9703)(查詢代號：11)」、「保證/共同債務資料查詢(A220)(查詢代號：1~2)」，並依下列方式辦理："}},{"id":"113-27","y":113,"n":27,"m":9,"q":"個人授信戶及法人授信戶申請增貸，所徵擔保品鑑價值分別達等值新臺幣多少元(含)以上，應填寫「運用擔保品洗錢及資恐交易態樣檢核表」？","o":["500萬/1,000萬","400萬/800萬","300萬/600萬","500萬/800萬"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"6.辦理授信申請，包含新貸、增貸及全額增貸，以及條件變更有增加、減少或更換擔保品，該案件徵提有正、副擔保品時須填寫「運用擔保品洗錢及資恐交易態樣檢核表」，並經防制洗錢及打擊資恐督導主管及經理覆核，作為授信申請之必要附件：(1)個人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>500萬</mark>元(含)以上；(2)法人戶：該次申請所徵之擔保品鑑價值個別或合計達等值新台幣<mark>1,000萬</mark>元(含)以上。"}},{"id":"113-28","y":113,"n":28,"m":4,"q":"營業單位辦理中長期融資，下列敘述何者不正確？","o":["自其他金融機構轉貸之非聯貸代償案件，授信申請時，資金用途得勾選「05：償還同業貸款」或「63：其他」","不動產代償案件，若能於3個營業日內完成代償作業，並取得第1順位抵押權之案件，且借戶在原貸銀行之結欠餘額內代償者，授權營業單位經理得於『擔保授信』之權限額度範圍內逕以「擔保放款」項目貸放","中長期融資，得視實際情況酌定寬限期，原則依貸款期限六分之一範圍內訂定，最長不得超過5年","不動產代償案件，應於匯款傳票備註欄註明「代償不動產貸款，無法核發清償證明者請退匯」字樣"],"a":0,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"十一、營業單位辦理<mark>自其他金融機構轉貸之代償案件</mark>時，作業規範如下：(一)<mark>資金用途</mark>：1.如為借戶原貸銀行之結欠餘額內代償者<mark>，資金用途</mark>應與原貸行之<mark>資金用途</mark>一致，一律不<mark>得勾選「05：償還同業貸款」或「63：其他」</mark>，如有多種<mark>資金用途</mark>，應分別申請。惟聯貸案件倘單項額度含有一種以上<mark>資金用途</mark>時，得暫以<mark>「05：償還同業貸款」或「63：其他」</mark>申請授信，貸放時則仍應依實際<mark>資金用途</mark>分別以子額度建檔及貸放。"}},{"id":"113-29","y":113,"n":29,"m":11,"q":"有關保證業務，下列敘述何者不正確？","o":["客戶有預開保證書需求時，申請之保證期間應包含預開天數及銀行保證天數","申請外幣保證業務，應事先申請授信審核處或區域中心核准","對於以一定成數移送信保基金之新臺幣保證案件，整筆保證金額得以擔保科目列帳","收回本行簽發之保證書，得解除保證責任"],"a":2,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第二節 簽發保證書","t":"2.對未徵有十足擔保品<mark>之新臺幣保證案件</mark>：（借）應收保證款項-無擔保（24627）（貸）保證款項-無擔保（40932）(二)<mark>對於以一定成數移送</mark>中小企業信用保證基金或徵取部分擔保品（定存單）為擔保<mark>之新臺幣保證案件，整筆保證金額</mark>仍以無擔保列帳。"}},{"id":"113-30","y":113,"n":30,"m":8,"q":"有關「授信最高額度控管作業」，下列敍述何者不正確？","o":["控管方式主要分為「核准號碼」及「客戶ID」(含集團控管)等兩類控管","可跨不同分行、不同授信戶、臺外幣系統進行額度控管","最高限額幣別僅限新臺幣及美金、歐元","新臺幣授信控管範圍包含直接授信、間接授信(含保證、國內信用狀)、憑卡貸款及支存透支"],"a":2,"ci":{"b":"授信篇","c":"第五十章 外匯定期存款質借外幣","s":"","t":"三、質借幣別及成數：(一)質借幣別與存單幣別相同者：質借金額最高不得逾存單面額。(二)質借幣別與存單幣別不同者：存單幣別及質借幣別限承作<mark>美金、歐元</mark>、日幣、人民幣、英鎊、港幣、澳幣及紐幣，貸款成數最高九成。"},"x":"最高限額幣別僅限<b>新臺幣及美金</b>（不含歐元）。","lo":1},{"id":"113-31","y":113,"n":31,"m":11,"q":"有關國內即期信用狀業務，下列敘述何者不正確？","o":["信用狀有效期限原則上不得超過四個月","本行墊付票款後，申請人應於二十天內來行清償。惟如另續貸新臺幣放款者，續貸期限自本行墊付日起最長一百八十天","開狀手續費：有續貸新臺幣者，按開狀金額，以年率0.1％以上計收，低於500元以500元計","續貸新臺幣放款，於開發國內即期信用狀時所填寫之核貸單空白處加註續貸日、到期日及續貸金額等，呈轉營業單位經理同意後辦理貸放"],"a":1,"ci":{"b":"授信篇","c":"第三十五章 國內即期信用狀業務","s":"第一節 申請手續","t":"(四)<mark>本行墊付票款後，申請人應於十天內來行清償。惟如另續貸新臺幣放款者，續貸期限自本行墊付日起最長一百八十天</mark>。二、會計項目欄填寫「應收信用狀款－應收即期國內信用狀款」，期限欄填寫額度有效期限（非循環額度免填），並於營業申請單位條件欄敘明每筆信用狀有效期限，每次墊款期限（一律為十天），擬<mark>續貸新臺幣放款者，</mark>則填寫每次<mark>續貸期限</mark>（含墊款期限），利率欄填寫其墊、<mark>貸新臺幣放款</mark>之擬貸放利率。"}},{"id":"113-32","y":113,"n":32,"m":1,"q":"公司法人(借戶)購置住宅供該公司營業使用者，得排除中央銀行「公司法人購置住宅貸款」管控之規定，下列敘述何者不正確？","o":["營業單位實地查核該建物確實供借戶公司營業用(出租除外)","確認借戶公司已於該建物辦理設立登記","徵取建物所在地之地方政府法令規定該建物可供營業使用之證明","建物所有權狀之用途登記「住商」，無須適用中央銀行「公司法人購置住宅貸款」管控之規範"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"一、<mark>購置住宅貸款</mark>包括下列受本規定限制之貸款項目：1.<mark>公司法人購置住宅貸款</mark>。2.自然人購置高價<mark>住宅貸款</mark>。3.自然人第1戶、第2戶、第3戶以上購屋貸款Q1：借款人申辦<mark>購置住宅貸款</mark>，其<mark>建物所有權狀之用途登記</mark>含「住」、<mark>「住商」</mark>、「住辦」、「住工」等，是否應適用本規定之規範？答：是。"}},{"id":"113-33","y":113,"n":33,"m":11,"q":"有關辦理應收帳款承購業務，下列何者為是？","o":["提供企業間因記帳賒銷所衍生應收帳款債權之管理服務","有追索權承購業務，本行需承擔買方因財務困難導致無法付款之信用風險","每筆帳款預支價金以不超過實際帳款交易淨額之七成為原則","一律徵取應收帳款承購額度 110%之備付本票"],"a":0,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第一節 定義、承購方式及承購型態","t":"一、目的<mark>提供企業間因記帳賒銷所衍生應收帳款債權之管理</mark>、收回、催討、融通資金、買方信用風險轉嫁等服務。二、定義本行就授信戶基於商品銷售、勞務提供等實際交易行為所產生之<mark>應收帳款債權</mark>，透過<mark>應收帳款債權</mark>移轉方式，依客戶需求提供下列二項以上之服務："}},{"id":"113-34","y":113,"n":34,"m":3,"q":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？","o":["重建融資額度原則上應一次全數動撥至信託專戶","採借款人互為連保方式承作","須經全體土地及合法建物所有權人同意","營建融資及其他營建費用融資成數最高十成"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十九節 「iLEO」無擔保貸款","t":"(一)抵押土地已動工興建開發。(二)借款人檢附抵押土地具體興建開發計畫，並切結於一年內動工興建開發。八、金融機構承作不動產抵押貸款，其屬依都市更新條例、都市危險及老舊建築物加速重建條例或其他配合政府相關政策之重建案件，不適用本規定。"},"x":"危老自力更新重建貸款<b>非</b>採借款人互為連保方式承作。","lo":1},{"id":"113-35","y":113,"n":35,"m":7,"q":"有關中小企業信用保證基金送保對象基本資格之敘述，下列何者為非？","o":["中小企業：符合行政院核定「中小企業認定標準」之中小企業，惟不含金融及保險業、特殊娛樂業","取有主管機關依法核發營業證照之申貸戶(含公立機關(構)及財團法人)，得視同依法辦理公司登記或商業登記","曾以直接保證方式取得貸款之企業得為直接保證之保證對象","其他經信保基金董事會議通過並經經濟部核定之信用保證對象"],"a":1,"ci":{"b":"授信篇","c":"第二十六章 政策性貸款及本行自辦專案貸款","s":"第十三節 小微企業優惠貸款","t":"一、對象：<mark>依法辦理公司登記</mark>、<mark>商業登記</mark>、有限合夥登記且營業正常、無債票信不良紀錄，並符合下列條件之一的中小企業(含獨資及合夥)。"},"x":"同 112-31：公立機關（構）及財團法人不得視同依法辦理登記。","lo":1},{"id":"113-36","y":113,"n":36,"m":11,"q":"有關本行辦理「聯合授信貸款」業務，下列何者為非？","o":["徵有國內擔保品時，應依規辦理 e-Loan 系統建檔，設定金額及貸放限額應依參貸比率輸入","簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，統籌主辦案件由營業單位逕行會辦法務室","本行擔任額度管理行時，應先執行「參貸機構比例資料維護(A615)」建檔","簽約後，每月 5 日前上法人金融網填報「聯合授信個案資料表」，每月 25 日前填報「聯貸案件到期追蹤表」"],"a":1,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第一節 聯合授信貸款通則","t":"(一)<mark>簽約前應審閱聯合授信合約各項條款是否與本行核准授信條件一致，</mark>並應<mark>會辦法務室</mark>。<mark>統籌主辦案件由</mark>聯貸及專案融資部會辦，共同主辦及
