mark>影本。"},"t":"neg"},{"id":"110-33","y":110,"n":33,"m":3,"q":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者錯誤？","o":["重建融資額度原則上應一次全數動撥至信託專戶","營建融資及其他營建費用融資成數最高十成","須經全體土地及合法建物所有權人同意","依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(三)前項建築物造價，除委由建築經理公司核估，並經總行核准者外，應依本行現行各類建築物估價標準予以評估計算。四、貸款期限基地面積於200坪以內或興建建物10層樓以下者，最長以三年為原則；基地面積超過200坪且11層樓以上者，按<mark>實際需要及興建計畫個別核定</mark>，惟最長以不超過六年為原則。貸款期限如超過前述期限者，應說明原因。"},"x":"危老自力更新重建貸款：須全體同意、融資成數最高十成、一次全數動撥至信託專戶；「融資期限最長不逾十年」為錯誤敘述。","lo":1,"t":"neg"},{"id":"110-34","y":110,"n":34,"m":4,"q":"有關「備償借款專戶」之規範，下列敘述何者正確？","o":["得免填「開戶/久未往來戶作業檢核表」(存511)","已無授信往來者，應於借戶無授信往來起算1年6個月內完成清理","倘由一般活期存款帳戶轉充時，應函文申請營運業務處核准","備償借款專戶因不得扣押，爰免向來文機關聲明異議"],"a":null,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第二節 備償借款專戶存款設質","t":"2.為防杜利用人頭開立帳戶，受理個人戶開立<mark>備償借款專戶</mark>時，除約定書及印鑑卡依本節業務規範徵取，餘作業程序及徵提文件應依存款篇第一章第四節「開戶」規定辦理，並確實填寫「開戶/久未往來戶作業檢核表」(存511)，執行「開戶作業檢核表(923C)」交易。"},"t":"ask"},{"id":"110-35","y":110,"n":35,"m":9,"q":"依本行「授信案件適用赤道原則作業要點」，企業授信戶之「赤道原則適用性檢核表」填製對象為何？","o":["僅限專案融資之資金總成本達1,000萬美元以上者","僅限借款人為專案公司(SPE)者","僅限初次往來案件，且不包含「過渡性融資」或「他行庫轉貸」者","不論申貸金額及貸款種類(除公司信用卡以外)一律填製"],"a":3,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第二節 專案融資","t":"八、倘符合本行「授信案件適用赤道原則作業要點」之案件，應進行對環境與社會影響之專業評估審查及貸後監測，包含但不限於確認客戶是否已參照「氣候相關財務揭露(TCFD)」框架、「聯合國工商企業與人權指導準則(UNGP)」框架，並依主管機關規範對該專案進行溫室氣體盤查等。"},"t":"ask"},{"id":"110-36","y":110,"n":36,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，以下何者錯誤？","o":["法人借款之權利文件倘授權由經理人簽章，應辦理被授權人「線上姓名檢核」作業","條件變更涉及擔保品(鑑價值已符合)者，須填寫「運用擔保品洗錢及資恐交易態樣檢核表」","每月列印「洗錢資恐高風險授信戶名單月報(LN1022)」掌握借戶授信往來狀況，並陳核至單位主管","「客戶風險評分交易(A194)」註記「09：特殊風險客戶」者，應向借戶揭露說明"],"a":3,"ci":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第35頁","s":"","t":"<mark>有「09-特殊風險客戶」註記者，應依法遵處回覆單內容填至批覆書</mark>，並經防制洗錢及打擊資恐督導主管與單位主管裁決後，由主管授權核准以完成撥貸作業。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉：A194 有「09-特殊風險客戶」註記者，應依法遵處回覆單內容填至批覆書，並經防制洗錢督導主管與單位主管裁決後撥貸；並非「向借戶揭露說明」。","lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第35頁","v":25,"t":"<mark>有「09-特殊風險客戶」註記者，應依法遵處回覆單內容填至批覆書</mark>，並經防制洗錢及打擊資恐督導主管與單位主管裁決後，由主管授權核准以完成撥貸作業。"},"t":"neg"},{"id":"110-37","y":110,"n":37,"m":4,"q":"有關擔保品之規範，下列敘述何者正確？","o":["動產除另有規定外，設定期限一律以貸放期限加五年為準","借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人單獨簽章領回","不動產新買賣案件(拍賣取得者除外)應於貸放後1個月內至實價登錄網站查證","本行不動產設定金額一律以放款值辦理設定"],"a":0,"ci":{"b":"授信篇","c":"第十章 動產擔保交易","s":"第一節 動產抵押","t":"(一)動產鑑價及設定應填製之文件，依本行相關規定辦理。(二)除因個案業務需要<mark>外，設定</mark>金額應以本行鑑價金額為原則。(三)為確保本行債權，<mark>除另有規定外，設定期限一律以貸放期限加五年為準</mark>，<mark>貸放期限</mark>應較標的物剩餘耐用期限或被淘汰期限縮短一年以上。"},"t":"ask"},{"id":"110-38","y":110,"n":38,"m":8,"q":"依據「國內營業單位經理權限授信要點」，倘借戶為公司戶時，下列何種情形不得適用經理權限？","o":["負責人經本行「客戶風險評分交易(A194)」評分之風險等級屬高風險者","保證人財產受強制執行或假扣押","負責人之配偶最近六個月內存款往來有不良紀錄","負責人屬本行觀察名單"],"a":2,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第二節 個人戶徵信報告之編製要領","t":"5.<mark>不良紀錄</mark>：透過系統發查借、保戶或公司負責人於本行資料庫<mark>最近六個月內</mark>授信逾期情形、存款扣押情形、預警戶、支存拒往情形及往來是否異常，倘上述資料顯示有異常時，應查明並揭露異常原因，查詢資料亦應存卷備查。"},"x":"負責人 A194 高風險、保證人財產受強制執行或假扣押、負責人屬觀察名單均不得適用經理權限；「負責人之配偶」存款往來不良<b>不在限制之列</b>。","lo":1,"t":"ask"},{"id":"110-39","y":110,"n":39,"m":8,"q":"依據「總行及區域中心各級人員授信審查權限準則」，借戶申請綜合額度，「綜合授信最高額度」新臺幣(以下同)5,000仟元，分項額度包含擔保授信4,000仟元、乙類2,500仟元、丁類2,000仟元，則應以何等金額作為綜合授信之「無擔保授信合計」？","o":["1,000仟元","2,000仟元","3,000仟元","4,500仟元"],"a":0,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第三節 綜合授信額度運用原則","t":"二、<mark>實際貸放時，「擔保授信」額度應儘量優先運用</mark>；"},"x":"無擔保授信合計＝綜合授信最高額度 − 擔保授信額度＝5,000 − 4,000＝<b>1,000 仟元</b>（分項額度合計可大於綜合額度，以綜合額度為上限）。","lo":1,"t":"ask"},{"id":"110-40","y":110,"n":40,"m":1,"q":"下列購置不動產貸款之期限，何者錯誤？","o":["購置住宅用不動產者，最長30年","購置商業用不動產者，最長20年","在臺無住所大陸地區人民購置不動產者，最長20年","適用「前低後高-定額本金」償還方式者，最長20年"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第二節 購置不動產貸款","t":"(二)購置商業用、工業用及其他不動產者<mark>者，最長20年</mark>。(三)在臺無住所大陸地區人民購置不動產<mark>者，最長20年</mark>。(四)<mark>適用「前低後高-定額本金」償還方式者，</mark>貸款期間限定為30年。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第6頁","v":64,"t":"3.在臺無住所大陸地區人民<mark>購置不動產</mark>者，<mark>最長20年</mark>。4.「<mark>前低後高</mark>-<mark>定額本金</mark>」之<mark>償還方式</mark>◎寬限期依貸款期限六分之一範圍內訂定，最長不得超過5年；惟適用「<mark>前低後高</mark>-<mark>定額本金</mark>」<mark>償還方式者</mark>，最長不得超過3年。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第6頁：「惟適用「前低後高-定額本金」償還方式者，最長不得超過3年。」","t":"neg"},{"id":"110-41","y":110,"n":41,"m":2,"q":"有關「貸款衍生人身保險保費融資貸款-信用貸款」之規定，下列敘述何者錯誤？","o":["借款人、要保人與被保險人須為同一人","不動產擔保借款人限為本國國民","營業單位經理權限最高額度新臺幣70萬元","設定第二順位抵押權作副擔保者，貸款期限最長10年"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第八節 貸款衍生人身保險保費融資貸款","t":"五、期限：(一)融資躉繳保費─擔保貸款：最長30年，且不得適用寬限期。(二)融資躉繳保費─信用貸款：<mark>設定第二順位抵押權作副擔保者</mark>最長30年，未設定抵押權者<mark>最長10年</mark>，且不得適用寬限期。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第20頁","v":51,"t":"<mark>貸款衍生人身保險保費融資貸款</mark>◎對象1.須為本行不動產擔保貸款借款人2.投保本行躉繳型<mark>貸款衍生人身保險</mark>商品3.借款人、要保人及被保險人須為同一人◎貸款種類1.「融資躉繳保費-擔保貸款(SP)」額度：依本行「各項擔保品貸放成數一覽表」規定辦理，與不動產擔保貸款合計逾經權貸放成數者，應申請總行/區域中心核准後辦理。期限：<mark>設定第二順位抵押權作副擔保者</mark>最長30年，未設定抵押權者<mark>最長10年</mark>，且不得適用寬限期。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第20頁：「期限：設定第二順位抵押權作副擔保者最長30年，未設定抵押權者最長10年，且不得適用寬限期。」","t":"neg"},{"id":"110-42","y":110,"n":42,"m":9,"q":"辦理房貸業務應「加強人頭戶檢視」之態樣，下列敘述何者正確？<br><span class=\"it\">A.</span> 借戶於本行申辦房屋貸款，於寬限期到期後再核給寬限期<br><span class=\"it\">B.</span> 多戶借戶還本繳息資金係由同一人或建築業者關係人提供繳納<br><span class=\"it\">C.</span> 短期間各類案件來源(含代書/房仲轉介/整批房貸)之案件，客戶所留存地址、電話、Email與其他借戶之聯絡資訊相同，且無合理關係","o":["BC","ABC","AB","AC"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(二)<mark>案件來源</mark>如係屬「<mark>代書/房仲轉介</mark>」、或「<mark>整批房貸</mark>」者，消金業務副理須覆核是否與消金e-Loan系統之「<mark>案件來源(</mark>通路)代號」欄位建檔一致，並於該審查項目後蓋章確認。"},"x":"人頭戶表徵：B 多戶還本繳息由同一人或建商關係人提供、C 聯絡資訊相同且無合理關係；A 寬限期屆滿再核寬限期不屬人頭戶態樣 → BC。","lo":1,"t":"combo"},{"id":"110-43","y":110,"n":43,"m":2,"q":"有關本行以房養老「安心貸」業務，下列敘述何者錯誤？","o":["貸款對象須年滿60歲","擔保品抵押權設定金額按貸放限額1.4倍設定","擔保品已有樂活貸循環型房貸者，不得辦理安心貸","貸款期間加計借款人年齡之合計數不得低於95，且貸款期間最長以30年為限"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"1.4倍設定。五、貸款總額：於上述擔保品之可貸放限額範圍內辦理。六、貸款期限：(一)<mark>貸款期間加計借款人年齡之合計數不得低於95，且貸款期間最長以3</mark>5年為限。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第14頁","v":51,"t":"<mark>貸款期間加計借款人年齡之合計數不得低於95</mark>，<mark>且貸款期間最長以3</mark>5年為限。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第14頁：「貸款期間加計借款人年齡之合計數不得低於95，且貸款期間最長以35年為限。」","t":"neg"},{"id":"110-44","y":110,"n":44,"m":4,"q":"辦理消費者貸款徵取借據或契約對保作業時，下列敘述何者錯誤？","o":["借款金額填寫錯誤，更改時應由借、保戶於更改處蓋章","借款人及保證人契約攜回審閱日需早於立據日5日以上","違約金費率需依清償時間遞減","核准日≦立據日≦對保日"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(七)除另有約定授權本行代填外，借、契據上之金額(係指<mark>借款金額</mark>)應由借款人填寫大寫(電子借契據除外)且不得更改；上述金額以外之記載，若有更改時，<mark>應由借、保戶於更改處蓋章</mark>。另電子借契據如有跨頁需於借契據騎縫處加蓋借保戶印鑑。"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第38頁","v":26,"t":"2.對保簽章欄：<mark>應由借保戶</mark>親自簽章，並辦理資料核對及對保，且對保日不得早於立據日(核准日≦立據日≦對保日)，從債務不得早於主債務(即借款人應早於保證人辦理對保手續)。金額以外之記載如有更改時，應由借、<mark>保戶於更改處蓋章</mark>。"},"t":"neg"},{"id":"110-45","y":110,"n":45,"m":10,"q":"經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經（　）仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。","o":["3個月","6個月","9個月","12個月"],"a":0,"ci":{"b":"授信篇","c":"第六十一章 訴訟程序","s":"第一節 督促程序","t":"三、<mark>經法院裁定發支付命令後，若支付命令不能送達於債務人時，應即向法院查報債務人之住所，如歷經</mark>三個月<mark>仍不能送達於債務人者，其支付命令即失其效力，應另行起訴。</mark>(參照民事訴訟法第五百十五條)"},"t":"fill"},{"id":"110-46","y":110,"n":46,"m":10,"q":"有關本行對逾放(含呆帳)案件債務人之財產所得強制執行相關規定，下列敘述何者錯誤？","o":["強制執行前，應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」逐項檢視，以確認本行債權是否存在","前揭檢核表，經催收經辦確認完即可，不用交由催收主管覆核","接獲第一金AMC以「第一金AMC受託催收逾放個案聯繫單」查詢時，應將檢核表及相關文件影本作為回覆聯繫單之附件","前揭查詢對象包括借戶、保證人或票據債務人"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（四）聯繫事項如係須由本行支付費用者，例如申請戶籍謄本、申請地政資料…等，應經債權管理處書面通知方得辦理。（五）聯繫事項如係為確認該案件任一債務人(含保證人、票據債務人及繼承人等)有無本行同意免除債務責任或本行敗訴確定之記載，受聯繫單位應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」(下稱檢核表)所列檢核項目逐項與催收日誌、原始債權契據及電腦建檔等資料相互勾稽確認，檢核表由<mark>催收經辦</mark>人員確認並送<mark>催收主管覆核</mark>後，正本及相關文件影本併同「第一金AMC受託催收逾放個案聯繫單」回覆第一金AMC，並留存影本備查。"},"t":"neg"},{"id":"110-47","y":110,"n":47,"m":10,"q":"對於逾放(含呆帳)案件(含委託第一金AMC催理者)債務人寄存本行之存款，於辦理抵銷前","o":["應先確認","不需確認","抵銷新臺幣5,000元以上，才需確認","以上皆非 債務人存款是否屬自政府領取之補貼、補助、津貼、獎勵及補償等補助款項"],"a":0,"ci":{"b":"授信篇","c":"第六十二章 終局執行程序","s":"第二節 執行","t":"一、對<mark>逾放(含呆帳)案件(含委託第一金AMC催理</mark>案件<mark>)債務人</mark>之財產所得向法院聲請強制執行前，應以「<mark>逾放(含呆帳)案件</mark>聲請法院強制執行前檢核表」（表格置於「企業內部網站/風控管理業務/工具箱/債權管理處/債權管理處人工填報表格」）就檢核項目逐項與原始契據及催收日誌(含實體紙本及逾催系統日誌、呆帳登記簿)等催收文件及電腦建檔資料相互勾稽確認，避免錯誤執行。另營業單位或催收單位接獲<mark>第一金AMC</mark>以「<mark>第一金AMC</mark>受託催收逾放個案聯繫單」查詢借戶、保證人或票據債務人是否對於 權金額低於執行標的物之價值，致債務人<mark>提供擔保聲請撤銷假扣押裁定</mark>，影響本行債權之受償。"},"t":"neg"},{"id":"110-52","y":110,"n":52,"m":5,"q":"有關辦理個人徵信事宜，下列敘述何者錯誤？","o":["個人在金融機構總授信金額達新臺幣1,000萬元者，應徵提報稅資料","個人資料表所填收入與所得稅申請書內容應一致","收入與借款金額顯不相當時，應徵提其他收入說明書","對其他收入說明書應查證其真實性"],"a":0,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"九、辦理徵信工作時，應查詢借、保戶之票信、債信及保證債務等有無不良紀錄。十、辦理個人授信戶徵信時，對於年度收入應根據有關資料酌予匡計，除法令另有規定外，其<mark>在金融機構總授信金額達新臺幣</mark>2<mark>,000萬元者，應徵提</mark>最近年度綜合所得稅之<mark>報稅資料</mark>予以核對。"},"t":"neg"},{"id":"110-53","y":110,"n":53,"m":6,"q":"關於徵提會計師財務報表查核報告時間點，下列敘述何者錯誤？","o":["上市公司應於會計年度終了3個月內提出","興櫃公司應於會計年度終了5個月內提出","未上市(櫃)之公開發行公司應於會計年度終了4個月內提出","非公開發行公司應於會計年度終了5個月內提出"],"a":1,"ci":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第19頁","s":"","t":"<mark>興櫃及公開發行公司：會計年度終了後4個月內提出</mark>非公開發行公司：短式報告•會計年度結束5個月內提出--6/1提出私立學校應於會計年度結束4個月內提出--12/1提出財務報表徵取對象徵取時間新年度會計師簽證期間已有授信往來者•加附聲明書之暫結報表或決算報表及會計師聲明書•追蹤財簽限期補送首次授信往來者•若最近年度之前一年度無財簽•且在本行無擔保授信總額逾500萬元•應一律徵提最近年度財簽據以編製徵信報告得以會計師驗資簽證及附聲明書之自編"},"x":"依講義〈徵信規範暨作業要領〉：上市櫃公司會計年度終了後 3 個月內（實收資本 100 億元以上 75 日內）、<b>興櫃及公開發行公司 4 個月內</b>、非公開發行公司 5 個月內提出；故「興櫃 5 個月」錯。","lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第19頁","v":39,"t":"•上市上櫃公司：<mark>會計年度終了</mark>後3<mark>個月內提出</mark>，惟實收資本額達100億元以上者須<mark>會計年度終了</mark>後75日內提出•興櫃及公開發行公司：<mark>會計年度終了</mark>後4<mark>個月內提出</mark>非公開發行公司：短式報告•<mark>會計年度</mark>結束<mark>5個月內提出</mark>--6/1提出私立學校<mark>應於會計年度</mark>結束4<mark>個月內提出</mark>--12/1提出<mark>財務報表</mark>徵取對象徵取時間"},"t":"neg"},{"id":"110-54","y":110,"n":54,"m":6,"q":"下列何者非屬新式會計師查核報告之查核意見？","o":["無保留意見","保留意見","無法表示意見","修正式無保留意見"],"a":3,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第三節 會計師財務報表查核報告","t":"(六)查核意見類型改為四種，分別是<mark>無保留意見</mark>、<mark>保留意見</mark>、否定意見及無法表示意見，刪除原<mark>修正式無保留意見</mark>類型。此外，新式會計師核閱報告(依據審計準則公報第65號)與原核閱報告之差異主要在於意見類型改為無保留結論、保留結論、否定結論及無法作成結論，有別於原之標準<mark>式無保留</mark>核閱報告、<mark>修正式無保留</mark>核閱報告、保留式核閱報告、否定式核閱報告及拒絕式核閱報告。"},"t":"neg"},{"id":"110-55","y":110,"n":55,"m":6,"q":"依企業會計準則公報第20號「租賃」，下列敘述何者正確？","o":["一項租賃如移轉附屬於租賃資產所有權之幾乎風險與報酬予承租人，分類為「營業租賃」","租賃之分類取決於合約形式而非交易實質","影響較大之產業為航空運輸、海洋水運等","承租人之融資租賃會計處理無需認列租賃資產與租賃負債"],"a":2,"ci":{"b":"徵信篇","c":"第五章 企業會計準則公報","s":"第四節 財務報表主要會計項目","t":"二、租賃(一)定義與分類：1.依企業會計準則公報第20號「租賃」，一項租賃如移轉附屬於租賃資產所有權之幾乎風險與報酬予承租人，分類為「融資租賃」：否則應分類為「營業租賃」。租賃之分類，係取決於交易實質而非合約形式。"},"t":"ask"},{"id":"110-56","y":110,"n":56,"m":5,"q":"有關授信戶應徵取會計師財務報表查核報告對象，何者正確？<br><span class=\"it\">A.</span> 屬於民營營利事業之公司組織者，在金融聯合徵信中心授信歸戶餘額達新臺幣3,000萬元以上，均應徵提<br><span class=\"it\">B.</span> 凡依私立學校法設立之各級私立學校，均應徵提<br><span class=\"it\">C.</span> 凡辦理本票保證之企業授信戶，均應徵提<br><span class=\"it\">D.</span> 個人戶授信金額達新臺幣2,000萬元以上者，均應徵提","o":["ABD","ACD","ABC","BCD"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"1.<mark>企業授信戶</mark>中<mark>屬於民營營利事業之公司組織，在金融</mark>機構之總<mark>授信金額達新</mark>台<mark>幣3,000萬元以上者</mark>（<mark>在金融聯合徵信中心授信歸戶餘額</mark>加計本行申請中金額，得扣除出口押匯、存單質借及進口押匯）應徵提<mark>會計師財務報表查核報告</mark>。惟對於<mark>辦理本票保證之企業授信戶，</mark>則無論<mark>授信金額</mark>是否達新台<mark>幣3,000萬元</mark>，均須徵提<mark>會計師財務報表查核報告</mark>。"},"t":"combo"},{"id":"110-57","y":110,"n":57,"m":5,"q":"下列有關免辦理徵信之敘述，何者錯誤？","o":["對會員銀行之授信案件得酌情免辦理徵信","對政府機關及公營事業之授信案件得酌情免辦理徵信","提供本行定期存單十足擔保之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件得免辦理徵信"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"1.新台幣借款及其間接保證<mark>授信案件</mark>：倘借戶無其他授信時，對借戶已提供本行新台幣定期存單或存摺存款設質十足擔保所申請<mark>之授信案件</mark>，除<mark>「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件</mark>外，得免辦徵信；若授信額度達本行重要授信戶標準者，亦得免辦重要授信戶之徵信分析。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第4頁","v":33,"t":"•新台幣借款及其間接保證<mark>授信案件</mark>：提供本行新台幣<mark>稅捐記帳保證及商品</mark>(服務)<mark>禮券保證</mark>除外"},"t":"neg"},{"id":"110-58","y":110,"n":58,"m":6,"q":"有關財務報表之敘述，何者錯誤？","o":["資產負債表係表達特定期間經營結果，為動態報表","綜合損益表係表達特定期間之財務績效，為動態報表","權益變動表係表達特定期間權益之變動情形，為動態報表","現金流量表係說明特定期間之營業、投資及籌資活動現金流量之報表，為動態報表"],"a":0,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第三節 會計師財務報表查核報告","t":"<mark>所謂資產負債表(BalanceSheet)係表達一企業在某特定日期之財務狀況的報表，為一種靜態報表</mark>；"},"t":"neg"},{"id":"110-59","y":110,"n":59,"m":5,"q":"辦理新編或改編徵信報告時，應一律加徵期中報表辦理攤列並輔助分析說明，係指決算日期距改編日期逾多久期間？","o":["3個月","4個月","8個月","9個月"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"核報告，亦即需徵取三年度財務報表。惟無論<mark>新編或改編徵信報告</mark>所徵取之財務資料，應以最近年度財務報表為準，且其決算日<mark>距改編日期</mark>不得逾8個月，倘期間超附錄二-18過8個月以上<mark>，應一律加徵期中報表辦理攤列並輔助分析說明</mark>。"},"t":"ask"},{"id":"110-60","y":110,"n":60,"m":9,"q":"關於徵信業務防制洗錢及打擊資恐作業，下列敘述何者錯誤？","o":["新貸戶應徵取「客戶業務往來聲明書」","新貸戶為法人、團體時，應徵取「高階管理人員暨實質受益人聲明書」","辦理企業續貸戶「客戶風險評分交易(A194)」應查詢風險因子異動記錄第19項是否需辦理修改","續貸戶一律無需徵取「高階管理人員暨實質受益人聲明書」"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"十三、徵信業務防制洗錢及打擊資恐作業(一)應徵取之文件：1.新貸戶：(1)應向借戶(含OBU)徵取「客戶業務往來<mark>聲明書」</mark>，OBU客戶則徵取「客戶業務往來聲明書(OBU適用)」，並執行「客戶業務往來聲明書建檔交易」(交易代號A197)，及填寫「客戶(非個人戶)業務往來資料表」。(2)若客戶為法人、團體(含OBU)時，應<mark>徵取「高階管理人員暨實質受益人聲明書」</mark>。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第35頁","v":52,"t":"<mark>徵信業務防制洗錢及打擊資恐</mark>客戶為法人、團體(OBU)應徵取「<mark>高階管理人員暨實質受益人聲明書</mark>」正確辨識<mark>高階管理人暨實質受益人</mark>身分得免確認<mark>實質受益人</mark>身分但仍須請客戶填寫聲明書"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第35頁：「徵信業務防制洗錢及打擊資恐客戶為法人、團體(OBU)應徵取「高階管理人員暨實質受益人聲明書」正確辨識高階管理人暨實質受益人身分得免確認實質受益人身分但仍須請客戶填寫聲明書」","t":"neg"},{"id":"111-1","y":111,"n":1,"m":8,"q":"幸福公司之綜合授信最高額度為新臺幣(以下同)1,000萬元，分項額度包含擔保授信額度為 400 萬元、甲類無擔保授信額度為 300 萬元、乙類無擔保授信額度為 200萬元、丁類無擔保授信額度-開發國內信用狀為 100 萬元，依綜合授信額度運用原則，幸福公司開立國內信用狀之額度最高可為","o":["100 萬元","400 萬元","500 萬元","700 萬元"],"a":2,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第三節 綜合授信額度運用原則","t":"二、<mark>實際貸放時，「擔保授信」額度應儘量優先運用</mark>；"},"x":"丁類（國內 LC）本身 100 萬，另依運用原則「擔保授信」未用額度得移作<b>已申請</b>之丁類：100＋400＝<b>500 萬</b>（甲、乙類不可移入丁類）。","lo":1,"t":"fill"},{"id":"111-2","y":111,"n":2,"m":11,"q":"辦理有追索權應收帳款承購業務，倘帳款逾到期日（　）買方仍未付款，賣方應依約自行買回該筆帳款。","o":["3日","10日","30日","45日"],"a":3,"ci":{"b":"授信篇","c":"第十六章 應收帳款承購業務","s":"第九節 帳款逾期及理賠","t":"(二)無論有無追索權<mark>帳款逾到期日</mark>45日未清償，OP小組應通知營業單位處理及回覆，作為後續帳款動撥之依據。(三)<mark>有追索權</mark>1.<mark>有追索權帳款逾到期日</mark>45日<mark>買方仍未付款，</mark>請營業單位協助賣方填製「<mark>應收帳款</mark>買回通知書」<mark>依約自行買回該筆帳款</mark>，若有預支價金，賣方並應於接獲帳款買回通知後15日內償還預支價金本息，逾期不履行，自到期日起至清償日止，除依照原約定利率計收遲延利息外，逾期六個月以內部份，按約定利率加10%計收違約金；<mark>逾到期日</mark>超過六個月以上部份，依約定利率加􀀁20%計收違約金。􀀁20%計收違約金。􀀁"},"t":"fill"},{"id":"1 0","y":111,"n":10,"m":10,"q":"催收單位委託臺灣金融資產服務股份有限公司拍賣執行逾放(含呆帳)案件之不動產或動產擔保品，下列敘述何者有誤？<br><span class=\"it\">A.</span> 應事先以「處理逾期放款申請/報告書」逐案申請債權管理處核准<br><span class=\"it\">B.</span> 催收單位無須向法院聲請委託<br><span class=\"it\">C.</span> 委託拍賣所繳納之代辦費非屬於執行費用，不得向債務人求償","o":["A","B","C","BC"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"六、各區域中心及營業單位依本行「催收作業要點」辦理逾放案件之聯行存款抵銷、保全程序、訴訟或強制執行等作業，得<mark>以「處理逾期放款申請/報告書」</mark>載明擬申請用印事由，檢附擬用印書類（如存證信函、<mark>法院聲請</mark>（陳報）書狀、申請書等）<mark>申請債權管理處</mark>用印。"},"t":"combo"},{"id":"111-11","y":111,"n":11,"m":5,"q":"下列徵信作業規範何者錯誤？","o":["土、建融授信案件以多戶分別申貸時，徵信作業權限係依各自本身額度計算歸屬","110會計年度起，第一上市(櫃)公司之第二季財報應經會計師查核簽證","法人負責人未擔任保證人時，不受財務報表決算日距改編日期不得逾8個月之規定限制","111會計年度起，實收資本額達新臺幣10億元以上之上市(櫃)公司，其公告申報年度財報不得逾會計年度終了後75日"],"a":3,"ci":{"b":"徵信篇","c":"第四章 國際財務報導準則(IFRSs)","s":"第五節 財務報表主要會計項目","t":"三、財務報告申報期限與種類：主管機關(即金管會)基於監理需求，對於金融特許事業之財務報告申報公告頻率有較高之要求。(一)須於<mark>年度終了</mark>3個月內申報公告經會計師查核簽證之年度財務報告，惟<mark>實收資本額達新</mark>台幣一百<mark>億元以上之上市</mark>（櫃）<mark>公司，其公告申報年度財</mark>務報告<mark>不得逾會計年度終了後75日</mark>。有子公司者為合併財務報告及個體財務報告，無子公司者則為個別財務報告。金控公司僅提出合併財務報告即可。"},"t":"neg"},{"id":"111-12","y":111,"n":12,"m":5,"q":"關於營業單位自辦都更案件(即以籌組更新會或委託公司戶代理實施者)之個人戶徵信報告相關作業，下列敘述何者有誤？","o":["得免逐年改編","須查詢其債票信情形存卷備查","須以一戶一卷宗方式歸檔","若同時為非消費性貸款之借戶，仍應逐年改編"],"a":2,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（四）委外催收單位應依「第一銀行與第一金AMC間第一類案件移交清單」（附件1）或「第一銀行與第一金AMC間第二類案件移交清單」（附件2）所列明細準備移交文件影本，並詳閱擬點交資料影本有無揭露「對債務履行無法律上義務者之資料」（例如未擔任保證人之父母、配偶、子女、股東或其他第三人之電話、地址、職業…等資料），如有，應於點交前以黑色筆或修正液將其塗抹消除，<mark>以一戶一卷</mark>方式整理，以備移交。"},"x":"自辦都更案件之個人戶徵信報告得免逐年改編、須查債票信存卷；「須以一戶一卷宗方式歸檔」為錯誤敘述。","lo":1,"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第29頁","v":36,"t":"•<mark>徵信報告</mark>1年內、<mark>徵信報告</mark>財摘之最近財報日期在6個月內<mark>自辦都更案件之個人戶徵信報告</mark>：•住戶<mark>籌組更新會或委託公司戶代理實施者</mark>"},"t":"neg"},{"id":"111-13","y":111,"n":13,"m":1,"q":"對於公司法人提供本次購置住宅申請貸款，或以其他房地辦理新貸或以既有房貸案辦理增貸申請購置住宅貸款之相關「無另以修繕、周轉金或其他貸款名目，向本行或其它金融機構額外增加貸款」查核作業，應於授信申請時檢視查核對象自買賣契約簽訂日期往前計算（　）至授信申請日聯徵中心借款情形。","o":["1個月","2個月","3個月","6個月"],"a":2,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(四)辦理購置「央行管控規定」不動產之案件(含借款人另提供<mark>其他房地辦理新貸或以既有</mark>「房貸」案辦理「增貸」，且資金用途為購置「央行管控規定」不動產)，應於撥貸前徵取借、保戶、擔保物提供人親簽之「申貸不動產抵押貸款切結書」，切結<mark>無另以修繕、周轉金或其他貸款名目，向本行或其</mark>他<mark>金融機構額外增加貸款</mark>，屬「自然人第2戶」、「第3戶(含)以上」購屋貸款、「高價<mark>住宅貸款</mark>」及「購地貸款」(消金案件)案件另需於撥款前提供自籌款來源證明(如存摺餘額、解約存單或出售有價證券等)，並分別<mark>於授信申請</mark>、撥貸當日及貸放後三個月共三個時間點辦理<mark>查核作業，</mark>查詢借款人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)下列事項，並填製「第一商業銀行辦理『央行管控案件』查核控管表(消金專用)」："},"lx":{"b":"講義：授信商品及應注意事項","c":"第11頁","v":30,"t":"「中央銀行對<mark>金融機構</mark>辦理不動產抵押貸款業務規定」其他注意事項辦理<mark>公司法人購置住宅貸款授信申請</mark>案件，應填製「查核控管表」，受理案件時應明確告知借戶不得透過任何人(不限下列<mark>查核對象</mark>)以任何<mark>貸款名目</mark>，另向<mark>金融機構</mark>借款取得自籌款，並需提供自籌款來源證明，及貸放前、後於<mark>聯徵中心</mark>倘有新增貸借款者，需再提供資金用途證明文件等事項，以免產生客訴，查核重點摘錄如下：(一)<mark>查核對象</mark>：借款人、負責人、保證人及擔保物提供人(下稱「<mark>查核對象</mark>」)。(二)查核時點及內容：1、<mark>授信申請時</mark>：檢視「<mark>查核對象</mark>」<mark>自買賣契約簽訂日期往前計算</mark>三個月<mark>至授信申請日</mark>，<mark>聯徵中心借款情形</mark>。2、撥貸前：(1)檢視「<mark>查核對象</mark>」自<mark>授信申請日</mark>至編製核貸單期間，<mark>聯徵中心借款情形</mark>。"},"t":"fill"},{"id":"111-14","y":111,"n":14,"m":1,"q":"有關本行依「中央銀行對金融機構辦理不動產抵押貸款業務規定」之「購地貸款」查核作業相關規範何者正確？","o":["個案自籌款只要能於額度核准前如期匯到指定帳戶，得免查證資金來源","個案自籌款可由負責人以其他貸款名目增貸支應","查核對象不包含擔保物提供人","授信申請時、首筆撥貸當日及首筆撥貸日3個月後起算1個月內，應查核本行自貸及金融機構貸款動用情形"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.<mark>撥貸當日</mark>：查核「查核對象」自申請日至撥貸日於本行循環額度動用(1030交易)<mark>及金融機構貸款</mark>情形(撥貸前查詢聯徵B28及B33)。"},"t":"ask"},{"id":"111-15","y":111,"n":15,"m":7,"q":"下列何者非屬中小企業信用保證基金規範，最遲應於知悉之日起2個月內通知之信用惡化情事？","o":["應繳付之利息延滯期間已超過3個月","未依約分期攤還已超過1個月","負責人配偶受票交所拒絕往來處分","授信對象停業"],"a":2,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"伍、信用保證案件之期中管理","s":"伍-1","t":"3.<mark>授信對象或其負責人受票據交換所拒絕往來處分者</mark>。"},"x":"信用惡化之拒往情事限「<b>授信對象或其負責人</b>」，負責人配偶不在其列。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"伍、信用保證案件之期中管理","v":2,"t":"3.<mark>授信對象或其負責人受票據交換所拒絕往來處分者</mark>。"},"t":"neg"},{"id":"111-16","y":111,"n":16,"m":8,"q":"有關本行集團關係戶之管理，何者錯誤？","o":["兩家企業之授信額度合計達新臺幣20億元者，已符合集團控管認定標準","集團關係戶新增授信時 單或本行活存且設定質權為擔保者，得酌情免徵","辦理一般保證業務，須向借戶徵取","無到期日之備付(本息)本票，額度生效日至本票發票日之期間逾3年時，應重徵之"],"a":0,"ci":{"b":"授信篇","c":"第二十八章 間接授信通則","s":"第一節 備付(本息)本票/備償期票徵取方式","t":"三、新臺幣本(期)票之徵提金額，依臺幣及外匯授信不同區分如下：<mark>備付(本息)本票</mark>備償期票臺幣授信<mark>依總額度或逐筆貸放金額徵取1</mark>1<mark>0%備付(本息)本票</mark>依<mark>逐筆貸放金額徵取100%備</mark>償期票(利息應另行繳納)外匯授信<mark>依總額度或逐筆貸放金額徵取1</mark>1<mark>0%備付(本息)本票</mark>＊X(不得徵取)＊註：外匯授信匯率得依「徵取日即期外匯賣出匯率」折算，惟日後因匯率波動無法涵蓋授信本金<mark>100%</mark>時應向借戶補徵。"},"t":"neg"},{"id":"111-28","y":111,"n":28,"m":1,"q":"辦理購地貸款(不含工業用土地)之規定何者錯誤？","o":["舊貸展期或轉貸案件，得給予最長12個月之調整期，屆期仍未動工者，於調整期到期日貸款成數應調降至4成內","辦理舊貸展期時，因土地鑑價值已提高，故可減少收回之成數","對於持有土地超過5年仍尚未動工興建之轉貸案件，原則上不得受理","轉貸案件如調整期後仍未動工，另採階梯式利率加碼"],"a":1,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"建餘屋(待售)住宅、其他土地等)為擔保，資金流向購買都市計畫劃定之住宅區或商業區土地(下稱受限土地)，是否應按本規定辦理？答：是。Q7：借款人於本規定實施前已辦理之購地貸款案件，如該購買土地尚未辦理動工興建，金融機構<mark>辦理舊貸</mark>案屆期續貸或屆期轉貸是否應按本規定辦理？(本次增修)按本規定辦理？(本次增修)答：是。"},"t":"neg"},{"id":"111-29","y":111,"n":29,"m":2,"q":"有關得排除適用DBR22倍規範之個人無擔保貸款，下列敘述何者有誤？","o":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在6年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在3年內設定擔保物權者","所有個人無擔保貸款皆不能排除DBR22倍規範"],"a":3,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第一節 通則","t":"(二)得排除適用<mark>DBR22倍規範</mark>之<mark>個人無擔保貸款</mark>：1、借款用途屬「創業」、「所營事業營運週轉金」、「建築融資」、「農業用途」等貸款項目，且係以「企業戶」授信程序辦理，並符合本行徵授信準則有關企業授信相關規範者。"},"t":"neg"},{"id":"111-30","y":111,"n":30,"m":7,"q":"依中小企業融資信用保證作業手冊規定，批次信保授信案件徵有（　）以上擔保品者，不得送保。","o":["2成","3成","4成","5成"],"a":3,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","s":"參-7","t":"3.<mark>授信案件徵有五成以上之擔保品者，不得送保</mark>。"},"x":"手冊參、一(三)3：批次保證授信徵有 <b>5 成以上</b>擔保品者不得送保，但徵提該授信所購置之機器或設備（含運輸工具）為擔保品者不在此限。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","v":3,"t":"3.<mark>授信案件徵有五成以上之擔保品者，不得送保</mark>。"},"t":"fill"},{"id":"111-31","y":111,"n":31,"m":7,"q":"中小企業融資信用保證作業手冊有關資本性支出授信送保規定，何者為非？","o":["對購置之標的應設定第一順位抵押權或動產抵押權","機器設備授信金額未超過新臺幣100萬元者，得免辦理設定","動產如評估無設定實益，不需基金同意，只需申請總行核准即可免辦理設定","機器設備授信期間未超過2年者，得免辦理設定"],"a":2,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","s":"參-4","t":"(2)對購置之標的物應依一般程序設定第一順位抵押權或動產抵押權，如有無法設定或無設定實益之情形，<mark>經先行通知本基金者，得不設定</mark>。"},"x":"手冊參、一(二)3：購置標的應設第一順位抵押權或動產抵押權；無法設定或無設定實益者，須<b>先行通知信保基金</b>始得不設定（非僅總行核准）；機器設備授信期間未超過 2 年或金額未超過 100 萬元得免設定。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","v":2,"t":"(2)對購置之標的物應依一般程序設定第一順位抵押權或動產抵押權，如有無法設定或無設定實益之情形，<mark>經先行通知本基金者，得不設定</mark>。"},"t":"neg"},{"id":"111-32","y":111,"n":32,"m":7,"q":"信用保證案件於授信到期後（　）個月 內未辦理展延或分期償還保證，且未通知發生逾期者，信保基金將自動解除保證責任，但有具體理由經信保基金同意者，不在此限。","o":["1個月","2 個月","3個月","6"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","s":"陸-3","t":"分期償還保證，且未通知發生逾期者，<mark>本基金自動解除保證責任</mark>，但有具體理由經本基金同意者，不在此限。"},"x":"同 110-30：<b>2 個月</b>。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","v":48,"t":"(二)<mark>展延或分期償還保證</mark>之期間及償還方式<mark>辦理展延或分期償還保證</mark>之期間及償還方式，由授信單位逕依總管理機構有關規定辦理。2.依前述（一）之2.辦理之<mark>信用保證案件</mark>，授信單位應於原清償期到期後二個月內（<mark>但有具體理由經</mark>本<mark>基金同意者</mark>，<mark>不在此限</mark>），透過本基金作業系統填具「<mark>信用保證案件辦理展延</mark>、變更<mark>分期償還保證</mark>申請書」向本基金申請，經本<mark>基金同意</mark>後，於指定之期限內辦妥，並透過本基金作業系統填送「移送<mark>信用保證</mark>通知單」且將計收之保證手續費匯存本基金指定帳戶。三、<mark>自動解除保證責任</mark>(一)<mark>信用保證案件於授信到期</mark>日後二<mark>個月內未</mark>依前述<mark>辦理展延或</mark>"},"t":"fill"},{"id":"111-33","y":111,"n":33,"m":3,"q":"為利詳實統計銀行法第 72 條之 2 授信限額，辦理建築業(行業中類 41 建築工程業、67 不動產開發業、68 不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，資金用途應勾選","o":["其他營建資金","其他週轉金","經常性週轉金","以上皆可"],"a":0,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"十一、為利詳實統計銀行法第72條之2授信限額，辦理建築業(行政院主計處行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)申貸週轉金，貸款資金係用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」；資金用途應勾選「<mark>其他營建資金</mark>(33)」。若貸款資金非用於「興建」或「購置」住宅及企業用建築之放款，分行端應於授信申請書內詳實說明資金用途，依適當之貸款種類及資金用途分類建檔，並落實貸後資金流向之追蹤管理。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第15頁","v":77,"t":"銀行法<mark>72條之2授信限額</mark>:<mark>辦理建築業申貸週轉金</mark>(<mark>行業中類41</mark>.<mark>建築工程業</mark>、67.<mark>不動產開發業</mark>、68.<mark>不動產經營及相關服務業</mark>)，<mark>貸款資金用</mark>於「興建」或「購置」<mark>住宅及企業用建築之放款</mark>，貸款種類應勾選「建築貸款(31)」，<mark>資金用途應勾選</mark>「<mark>其他營建資金</mark>(33)」。建築業<mark>週轉金貸款</mark>非用於「興建」或「購置」<mark>住宅及企業用建築之放款</mark>，分行端應於授信申請書內詳實說明<mark>資金用途</mark>，依適當之貸款種類及<mark>資金用途</mark>分類建檔，並落實貸後資金流向之追蹤管理。"},"x":"依講義〈授信商品及應注意事項〉第15頁：「銀行法72條之2授信限額:辦理建築業申貸週轉金(行業中類41.建築工程業、67.不動產開發業、68.不動產經營及相關服務業)，貸款資金用於「興建」或「購置」住宅及企業用建築之放款，貸款種類應勾選「建築貸款(31)」，資金用途應勾選「其他營建資金(33)」。」","t":"fill"},{"id":"111-34","y":111,"n":34,"m":4,"q":"有關「法定代位清償人同意書」，何者正確？","o":["徵有多名保證人且僅免除其中一人之保證責任時，免徵取之","塗銷部分抵押權而借款人尚有其他授信時，應徵取之","擔保物提供人非屬法定代位清償人","同意解除保證責任並溯及最初時，應徵取「終止」格式之同意書"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"(二)塗銷一<mark>部分抵押權</mark>或塗銷全部<mark>抵押權而借款人尚有其他授信時，應徵取</mark>法定代位清償人之同意書(格式C-抵押權塗銷)。(三)如在本行均屬以營業單位經理權限核定之授信案件或授信已全部還清，且無其他保證，或保證係以營業單位經理權限核准者，擔保品之塗銷（含部分塗銷）授權營業單位經理核定。"},"t":"ask"},{"id":"111-35","y":111,"n":35,"m":4,"q":"借戶為股份有限公司並設有董事會，於何種情形應徵取「董事會決議錄」？<br><span class=\"it\">A.</span> 徵取銀行法第30條之反面承諾書<br><span class=\"it\">B.</span> 開立備償借款專戶供關係企業授信使用<br><span class=\"it\">C.</span> 如為授信新戶，應於額度動用或簽約前徵取「借款決議錄」<br><span class=\"it\">D.</span> 如為授信舊戶，該公司於董事任期屆滿前改選部分董事，應一律重新徵取，不得續用原「借款決議錄」","o":["ACD","BCD","ABC","ABCD"],"a":2,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"(三)其他應注意事項：1.<mark>借款決議錄</mark>不需載明由○○○擔任保證人，免除○○○作保之文義。2.辦理須徵取<mark>反面承諾書</mark>之授信時，依<mark>銀行法第30條</mark>規定，對於抵押權登記或移轉質物占有之免辦或緩辦乙事，應經<mark>董事會決議</mark>，爰辦理是項授信時，應向借戶徵取<mark>董事會決議錄</mark>，並載明出具<mark>反面承諾書</mark>之相關事項，以符合法令規範暨確保本行債權。"},"t":"combo"},{"id":"111-36","y":111,"n":36,"m":8,"q":"借款人符合下列何種情形，始可將借款人整體貢獻度納為放款定價減項評估之因素？","o":["實際收益率(提存前且含間接授信)為0.60%","本行信用評等8等","關係戶合計利益貢獻(提存前)為新臺幣50萬元","該案徵有資本抵減工具"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"3.原則上個案承作時，借款人需符合下列情形之一，<mark>始可將借款人整體貢獻度或其他因素納入放款定價減項評估之因素</mark>。"},"x":"授信篇第三章：須符合(1)實際收益率（提存前含間接授信）達 <b>0.65%</b> 以上(2)信評 <b>1–7 等</b>(3)關係戶利益貢獻達 <b>100 萬元</b>以上(4)個人戶利率扣資金成本達 0.55% 以上(5)<b>徵取資本抵減工具</b>之一。選項 0.60%、8 等、50 萬元均未達標 → 答「該案徵有資本抵減工具」。","t":"ask"},{"id":"111-37","y":111,"n":37,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，以下何者錯誤？","o":["「客戶風險評分交易(A194)」屬高風險者，於授信申請書敍明承做理由，得以營業單位經理權限核定","條件變更涉及更換擔保品(鑑價值已符合)者，須填寫「運用擔保品洗錢及資恐交易態樣檢核表」","每月列印「洗錢資恐高風險授信戶名單月報(LN1022)」掌握借戶授信往來狀況，並陳核至單位主管","「客戶風險評分交易(A194)」註記「09：特殊風險客戶」者，應向法令遵循處洗錢防制部辦理查詢"],"a":0,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"8.另依中華民國銀行商業同業公會全國聯合會訂定之「銀行評估洗錢及資恐風險及訂定相關防制計畫指引」第七點規定，銀行應依據客戶的風險程度，決定適用的管控措施，故為配合高風險客戶之管控，凡經本行<mark>「客戶風險評分交易(A194)」</mark>評分之風險等級<mark>屬高風險者，</mark>其授信額度申請時不得以<mark>經理權限核定</mark>，一律送區域中心或授信審核處核定，並應於授信案件<mark>申請書敍明承做理由</mark>；倘「經註記09：特殊風險客戶」，應依下列方式辦理：(1)<mark>營業單位</mark>應填寫「特殊風險客戶資料查詢單」呈核單位主管後，將查詢單正本發送至法令遵循處洗錢防制部辦理查詢，以瞭解客戶曾涉及之異常交易模式。(2)依法令遵循處回覆之內容，由<mark>營業單位</mark>說明借戶最近一次經註記為特殊風險客戶之時間點、交易模式及近一年內遭註記之次數等內容，並就現行交易情形是否仍有該等異常之交易模式加以說明後，再敘<mark>明承做理由</mark>。容，並就現行交易情形是否仍有該等異常之交易模式加以說明後，再敘<mark>明承做理由</mark>。對「特殊風險客戶資料查詢單」之內容應保守秘密，不得任意洩漏；"},"t":"neg"},{"id":"111-38","y":111,"n":38,"m":2,"q":"有關「工業住宅」、「套房」及「丙種建地建物」之定義及權限規範，何者錯誤？","o":["工業用透天建物部分供作住宅使用者，應視為工業住宅","建物面積未超過15坪之透天住宅，不視為套房","坐落於臺北市以外之套房案件，一律無營業單位經理授信權限","丙種建地建物，一律無營業單位經理授信權限"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第二節 購置不動產貸款","t":"一、目的：為協助社會大眾購置住宅用、商業用、工業用及其他不動產(土地及建物)，特開辦本項貸款。二、對象：(一)信用良好，有正當職業，具行為能力及償還能力之本國國民。"},"t":"neg"},{"id":"111-39","y":111,"n":39,"m":4,"q":"依授信往來之約定及辦理對保相關規範，何者錯誤？","o":["約定書之簽章可與印鑑卡正面之右下方印鑑簽章不同","借據所蓋圖章應與印鑑卡印鑑式樣欄之印鑑相符","對保時，應查核借戶雙重身分證明，並影印留存主要身分證明文件","應查詢借戶之身分證遺失補領情形並列印存卷備查"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第四節 授信往來之約定","t":"一、承做授信除個人消金案件或另有規定外，應向新借款人、保證人及其他債務人分別徵取約定書（放002）。並按各種授信種類分別加徵其他有關契約文件。<mark>約定書之簽章</mark>必須<mark>與印鑑卡</mark>（放001A、放001B）<mark>正面之右下方印鑑簽章</mark>相符。"},"lx":{"b":"講義：授信法規/通則輯要","c":"第44頁","v":37,"t":"放款<mark>印鑑卡正面</mark>右下方(客戶親自簽名並蓋章處)及約定書立約定人簽章處（或另設對保簽章欄內），應請借款人（包括其他債務人）親自簽名蓋章。<mark>約定書之簽章</mark>必須<mark>與印鑑卡正面之右下方印鑑簽章</mark>相符。"},"x":"依講義〈授信法規/通則輯要〉第44頁：「約定書之簽章必須與印鑑卡正面之右下方印鑑簽章相符。」","t":"neg"},{"id":"111-40","y":111,"n":40,"m":11,"q":"有關徵取股票為擔保品之授信，何者錯誤？","o":["與客戶洽談額度前，應以「股票授信風險承擔限額維護(A614)」查詢該檔股票之尚可承做空間","撥貸前，應至台灣集中保管結算所網站查詢設質資料是否正確及完成，並列印存查","徵取上櫃公司股票且無另行規定時，放款金額得為鑑價金額之6成","填報「營業單位辦理授信業務徵取國內上市(櫃)公司股票 ":10,"q":"下列何者非為消滅時效中斷之事由？","o":["債權人催告債務人履行債務(如以催告函、存證信函等)","債權人以訴訟行為行使其權利","債權人開始執行行為或聲請強制執行","債權人依督促程序聲請發支付命令後撤回聲請"],"a":3,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第三節 中斷時效之方法","t":"四、與起訴有同一效力之事項：(民法第一百二十九條第二項)(一)<mark>依督促程序聲請發支付命令</mark>：但因<mark>聲請發支付命令</mark>而中斷之時效，若<mark>撤回聲請</mark>或受駁回之裁判或<mark>支付命令</mark>失其效力時視為不中斷(民法第一百三十二條)。"},"t":"neg"},{"id":"111-53","y":111,"n":53,"m":5,"q":"下列敘述何者為非？","o":["企業實際經營者過往有負面新聞，應於徵信報告揭露","已知借戶有訴訟案件，或於會計師財務報表查核報告中揭露，應至司法院網站查詢相關案件之最新進度，並於徵信報告中說明","凡屬民營事業且同時從事多種性質不同之行業時，應依其產值(或營業額)取多者認定其業別","對非金融公司有控制性持股之民營事業，應建檔為「016421民營-金融控股業」"],"a":3,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第三節 授信申請書之填製","t":"一、行業分類編號：應根據「貸款對象與編號對照表」將借款人所屬業種分類號碼填入。凡屬<mark>民營事業，</mark>同一事業單位，同時從事多種性質不同之行業，按其產值（或營業額）取多者認定其業別，若產值（或營業額）相同者，則按其員工人數或資產設備較多者認定之。"},"t":"neg"},{"id":"111-54","y":111,"n":54,"m":6,"q":"依本行採用IFRSs之財務報告規範，為利於比較分析，辦理現金流量表攤列時，應將「支付利息」列於何項活動？","o":["營業活動","投資活動","籌資活動","營業活動或籌資活動"],"a":0,"ci":{"b":"徵信篇","c":"第四章 國際財務報導準則(IFRSs)","s":"第五節 財務報表主要會計項目","t":"(一)<mark>支付利息</mark>：得分類為<mark>營業活動</mark>或籌資活動。然因利息費用主係來自於營運所需之融資行為<mark>，為利於比較分析，</mark>倘企業提供<mark>之財務報</mark>表列為籌資活動，辦理攤列時應調整為<mark>營業活動</mark>。"},"t":"ask"},{"id":"111-55","y":111,"n":55,"m":5,"q":"企業戶於下列何種授信金額情況下適用「簡易資料表」？","o":["金融機構總授信金額新臺幣500萬元","金融機構總授信金額新臺幣3,500萬元","金融機構總授信金額新臺幣1,200萬元且具有十足擔保","金融機構總授信金額新臺幣1,500萬元"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第三節 資料表之種類與運用","t":"3.保證人資料。三、小規模營利事業簡易資料表（如範例三）適用對象：凡企業授信戶在<mark>金融機構總授信金額新</mark>台幣6<mark>00萬元</mark>（含）以下者，或新台<mark>幣1,500萬元</mark>（含）以下且具有十足擔保者，適用「小規模營利事業簡易資料表」。主要內容："},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第17頁","v":35,"t":"資料表與徵信報告格式資料表：<mark>金融機構總授信金額</mark>(含本次申請金額)達3,0<mark>00萬元</mark>(含)以或雖未達3,0<mark>00萬元</mark>惟提供會計師查核報告徵信報告格式：企業戶徵信報告(依資料表編製)小規模營利事業<mark>簡易資料表</mark>：<mark>金融機構總授信金額</mark>(含本次申請金額)6<mark>00萬元</mark>（含）以下或1<mark>500萬元</mark>以下且具十足擔保者徵信報告格式：企業戶徵信報告(小額貸款專用)<mark>簡易資料表</mark>：在<mark>金融機構總授信金額</mark>(含本次申請金額)逾6<mark>00萬元</mark>未達3,0<mark>00萬元</mark>徵信報告格式：企業戶徵信報告(依<mark>簡易資料表</mark>)若本行僅往來出口押匯：徵信報告格式：企業戶徵信報告（小額貸款專用)步驟3公司信用卡專用徵信資料表：在本行僅往來信用卡且額度在3<mark>00萬元</mark>(含)以下公司信用卡專用徵信報告境外公司徵信報告(共用額度專用)及境外公司徵信報告：申請境外公司融資業務境外公司徵信報告（大陸地區法人專用）：申請大陸地區法人融資業務"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第17頁：「資料表與徵信報告格式資料表：金融機構總授信金額(含本次申請金額)達3,000萬元(含)以或雖未達3,000萬元惟提供會計師查核報告徵信報告格式：企業戶徵信報告(依資料表編製)小規模營利事業簡易資料表：金融機構總授信金額(含本次申請金額)600萬元（含）以下或1500萬元以下且具十足擔保者徵信報告格式：企業戶徵信報告(小額貸款專用)簡易資料表：在金融機構總授信金額(含本次申請金額)逾600萬元未達3,000萬元徵信報告格式：企業戶徵信報告(依簡易資料表)若本行僅往來出口押匯：徵信報告格式：企業戶徵信報告（小額貸款專用)步驟3公司信用卡專用徵信資料表：在本行僅往來信用卡且額度在300萬元(含)以下公司信用卡專用徵信報告境外公司徵信報告(共用額度專用)及境外公司徵信報告：申請境外公司融資業務境外公司徵信報告（大陸地區法人專用）：申請大陸地區法人融資業務」","t":"ask"},{"id":"111-56","y":111,"n":56,"m":6,"q":"下列何者是企業償債能力分析之主要財務比率？","o":["流動比率","存貨週轉率","營業利益率","固定長期適合率"],"a":0,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"<mark>分析之主要比率有如下數種</mark>：1.流動比率計算公式：說明：(1)此比率為銀行徵信分析最早採用的方法，且為比率分析中最重要者，故亦稱為銀行家比率。"},"t":"ask"},{"id":"111-57","y":111,"n":57,"m":5,"q":"下列何者非屬徵信人員須加強財務狀況分析及於徵信報告揭露相關風險之態樣？","o":["自有資本不足","所屬產業進入門檻較高且營運獲利能力允當","將資金無息貸予關係企業","投資週轉多仰賴股東往來支應"],"a":1,"ci":{"b":"徵信篇","c":"第八章 企業經營活動及產銷分析","s":"第二節 企業內部經營活動分析","t":"6.垂直整合即企業藉由合併其<mark>所屬產業</mark>之上游或下游廠商，以求整體營運成本之精簡或銷售之擴展。一般企業採行垂直整合之動機包括：確保原料來源、運用一貫化生產追求低成本、價格差異化、取得上、下游資訊、阻止競爭者進入及避免遭競爭者排除等。然垂直整合雖有上述功能，其亦可能伴隨部分缺點，包括：內部官僚成本、缺乏營運效率、缺乏營運彈性等。因此，徵信人員應詳細分析企業採行垂直整合策略之目的、本身整合能力、整合利益與障礙之成本效益分析等，綜合評估該策略之可行性及影響。"},"x":"自有資本不足、資金無息貸予關係企業、仰賴股東往來支應皆須加強分析揭露；「進入門檻高且獲利允當」非風險態樣。","lo":1,"t":"neg"},{"id":"111-58","y":111,"n":58,"m":3,"q":"針對企業戶申貸銷售型土建融規劃興建集合住宅者，辦理徵信作業時應調查及敘明附近建案相關資訊，下列敘述何者有誤？","o":["應包含附近預售建案之平均價格","應包含附近新成屋之餘屋數量","得參酌內政部新建餘屋(待售)住宅統計資訊及外部網站資料","倘該建案所屬行政區無新推案或新成屋行情及銷售率，僅需敘明「查無銷售率供參」"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第三節 其他注意事項","t":"八、承做營建融資時，除建案為自建或無預售之個案外，如興建地區係本行不動產分級評等表A級地區以外之重劃區或鄰近區域推案量供過於求者，其個案銷售率應不低於該案融資價值比(Loan-To-Value,LTV)方可貸放，至於若地處偏僻或山坡地，距離市區較遠、市場性欠佳之案件，則應避免承做。另屬都市更新、危老重建或建案有經東亞建築經理股份有限公司辦理建經管理，且搭配本行不動產信託有完善之續建建制，得不受銷售率之限制。土地融資(即購地擔保放款)之貸放，得不受銷售率之限制。"},"x":"銷售型土建融徵信：所屬行政區無新推案或新成屋行情時，應擴大參考鄰近區域或其他統計資料，<u>不能僅敘明「查無銷售率供參」</u>。","lo":1,"t":"neg"},{"id":"111-59","y":111,"n":59,"m":6,"q":"下列何者非屬新式會計師查核報告(審計準則公報第57號)之會計師查核意見？","o":["保留意見","修正式無保留意見","無法表示意見","否定意見"],"a":1,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第三節 會計師財務報表查核報告","t":"(六)查核意見類型改為四種，分別是<mark>無保留意見</mark>、<mark>保留意見</mark>、否定意見及無法表示意見，刪除原<mark>修正式無保留意見</mark>類型。此外，新式會計師核閱報告(依據審計準則公報第65號)與原核閱報告之差異主要在於意見類型改為無保留結論、保留結論、否定結論及無法作成結論，有別於原之標準<mark>式無保留</mark>核閱報告、<mark>修正式無保留</mark>核閱報告、保留式核閱報告、否定式核閱報告及拒絕式核閱報告。"},"t":"neg"},{"id":"111-60","y":111,"n":60,"m":5,"q":"金好用公司擬向本行申請中期借款新臺幣1.5億元供營運週轉金使用，經查目前聯徵中心之金融機構授信歸戶總餘額為新臺幣0.5億元(已扣除存單質借、出口押匯及進口押匯)，下列何者屬應徵提資料？<br><span class=\"it\">A.</span> 營運計畫<br><span class=\"it\">B.</span> 預估資產負債表、預估綜合損益表<br><span class=\"it\">C.</span> 現金流量預估表<br><span class=\"it\">D.</span> 個案預計資金來源去路表<br><span class=\"it\">E.</span> 無須徵提預估資料","o":["ABC","E","BC","ABCD"],"a":0,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第二節 基本資料的徵提","t":"2.其他中長期授信：除與上述（一）1至10目相同外，總授信金額達新台幣2億元者，另加送<mark>個案預計資金來源去路表</mark>、建廠進度表、<mark>營運計畫</mark>、<mark>現金流量預估表、預估資產負債表</mark>及<mark>預估綜合損益表</mark>。註：總授信金額：係指在金融聯合徵信中心歸戶餘額及本次申貸金額，得<mark>扣除存單質借、出口押匯及進口押匯</mark>之金額。註：<mark>個案預計資金來源去路表</mark>：係指該授信個案之<mark>資金來源</mark>及去路。"},"t":"combo"},{"id":"112-1","y":112,"n":1,"m":5,"q":"有關企業戶徵信報告之改編，下列何者為非？","o":["每屆滿 1 年，即須重新徵取授信戶資料表，重新辦理徵信分析","於本行僅有授信總額在新臺幣 300 萬元以下之中長期不動產擔保放款，如信用狀況無重大變化，得免逐年改編","徵信報告有效期間內申請增貸時，若金融機構總授信金額未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，應立即改編","信用狀況如發生重大變化時，應即重新辦理徵信"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第一節 動態徵信的意義與重要性","t":"而為提升<mark>徵信報告</mark>屆期改編作業管理效能，企金e-Loan系統每月5日提供「<mark>徵信報告</mark>（摘要/補充說明）未來二個月屆期明細表」、每月10日提供「<mark>徵信報告</mark>逾改編屆期日二個月內明細表」，營業單位應指派專人每月定日列印，並於『備註』欄位扼要敘明處理情形（如:已洽客戶提供資料、已不往來、編製中等），自報表產製日起5個營業日內，逐級呈核至單位經理後專卷保管，保管期限1年；報表查詢列印系統(OnDemand)每月5日提供「得免逐年改編<mark>徵信報告</mark>之授信戶名單」(代號DWLN08)，營業單位應指派專人每月定日列印，逐級呈核至單位經理後專卷保管，保管期限1年。至於在<mark>徵信報告有效期間內</mark>，企業授信戶<mark>申請增貸時，</mark>應重新檢視其在<mark>金融機構總授信金額</mark>是否仍在原徵授信戶<mark>資料表範圍</mark>內，若已逾越，應重徵授信戶資料表及相關財務報表<mark>辦理徵信報告</mark>改編工作。若雖<mark>未逾越原資料表範圍，然加計增貸金額後逾越原分行辦理徵信作業權限時，</mark>則對於原辦理單位已核定之徵信相關報告得繼續沿用至報告有"},"t":"neg"},{"id":"112-2","y":112,"n":2,"m":5,"q":"阿壹公司金融機構總授信金額新臺幣 3 億元，下列何者情況應辦理中長期授信分析？<br><span class=\"it\">A.</span> 擬向本行申請建廠性質之中期借款時<br><span class=\"it\">B.</span> 短期授信展期續約超過一年以上時<br><span class=\"it\">C.</span> 已貸放之中期借款徵信報告屆期改編時","o":["AB","AC","BC","ABC"],"a":0,"ci":{"b":"徵信篇","c":"第九章 徵信報告之編製要領","s":"第一節 徵信報告之種類與運用","t":"6.建廠進度表(若為週轉資金<mark>性質之中長期授信</mark>或<mark>短期授信展期續約超過一年以上</mark>之授信戶，此項得免徵)。六、境外公司<mark>徵信報告</mark>："},"t":"combo"},{"id":"112-3","y":112,"n":3,"m":7,"q":"有關授信移送信保基金保證期中管理<br><span class=\"it\">A.</span> 營業單位應派員每 2 個月至企金 e-Loan 系統逐筆填報異常名單之「授信移送信保基金保證期中管理工作單」<br><span class=\"it\">B.</span> 營業單位應至信保基金網路作業系統辦理信用惡化通知，並於每月月底前將當月執行結果列印陳核後存卷備查<br><span class=\"it\">C.</span> 期中管理異常名單系統篩選定義為送保案件發生之信用異常態樣，營業單位免再執行資料查詢作業<br><span class=\"it\">D.</span> 企金 e-Loan 系統期中管理作業，應傳送主管覆核結案，分行副理可代為決行核定結案，實體期中管理工作單亦陳核至分行副理即可。上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":1,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"(七)貸放後<mark>管理作業</mark>：<mark>營業單位應派員每月至企金e-Loan系統逐筆填報異常名單之「授信移送信保基金保證期中管理工作單」</mark>及<mark>至信保基金網路作業系統辦理信用惡化通知，並於每月月底前將當月執行結果列印陳核後存卷備查</mark>。另系統<mark>於每月月</mark>初產出前一個月<mark>期中管理</mark>名單執行明細資料，供執行情形之管控<mark>，營業單位應派員每</mark>月列印「前一月份管理明細」表呈核後專卷存查，保存期限2年，尚未完成者(即「<mark>期中管理</mark>完成日期」空白)<mark>，營業單位</mark>主管應了解原因並追蹤後續完成作業，自行於報表上更新完成情形。"},"t":"combo"},{"id":"112-4","y":112,"n":4,"m":7,"q":"有關「青年創業及啟動金貸款」<br><span class=\"it\">A.</span> 資金用途包含準備金及開辦費用、週轉性支出、資本性支出<br><span class=\"it\">B.</span> 貸款額度得分次申請及分批動用，且得循環動用與借新還舊<br><span class=\"it\">C.</span> 週轉性支出貸款期限最長 6 年(不含寬限期最長 1 年)<br><span class=\"it\">D.</span> 應一律移送中小企業信用保證基金保證。上述錯誤者共有幾項？","o":["1","2","3","4 項"],"a":2,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第六節 青年創業及啟動金貸款","t":"三、<mark>貸款額度</mark>：(一)<mark>準備金及開辦費用</mark>：最高新臺幣200萬元(二)<mark>週轉性支出</mark>：最高新臺幣400萬元。(三)<mark>資本性支出</mark>：最高新臺幣1,200萬元。以上均<mark>得分次申請及分批動用，</mark>惟不<mark>得循環動用</mark>且不得<mark>借新還舊</mark>。"},"x":"A 正確（準備金及開辦費用、週轉性、資本性支出）；B 錯（得分次動用但<b>不得循環、不得借新還舊</b>）；C 錯（週轉性 6 年「<b>含</b>」寬限期 1 年）；D 錯（僅 100 萬以下一律移送信保）→ 錯誤 3 項。","lo":1,"t":"combo"},{"id":"112-5","y":112,"n":5,"m":8,"q":"有關「利率重評機制」，下列敘述何者為非？","o":["係指授信貸放期間內，非真正以固定利率一價到底承做，而是定有利率重新評定期間者","外幣貸款「利率型態」為機動利率者，得以經理權限核准貸放","外幣貸款貸放期間內定有利率重評機制者，貸放時「利率型態」應以機動利率建檔","執行新臺幣貸放交易(6420)時，應依利率重新評定週期選擇適用利率代碼建檔"],"a":1,"ci":{"b":"授信篇","c":"第四章 貸放、收息及收回","s":"第一節 貸放手續","t":"(四)新台幣授信利率條件定有「利率重評機制」，係指授信貸放期間之固定利率，非真正以固定利率一價到底承作，而是定有利率重新評定期間，建檔方式如下："},"x":"外幣貸款定有利率重評機制者，貸放時「利率型態」以機動利率建檔；但不因此即可以經理權限核准，故 (2) 錯誤。","lo":1,"t":"neg"},{"id":"112-6","y":112,"n":6,"m":11,"q":"辦理「外銷貸款」業務，下列敘述何者為非？","o":["有關洗錢高風險客戶加強查核措施：倘為出口後交易者，應逐筆徵取發票及運送相關文件進行查核，惟得申請總行或區域中心免徵","辦理出口託收貸款，貸款期限應依融資日起至預計貨款收妥之日訂定，但最長不得超過六個月為原則，且不得超過保險證明書有效期限","辦理出口週轉金貸款，應一律向區域中心、授信審核處申請","辦理出口信用狀貸款，貸款到期日不得超過信用狀有效期限及單據提示期限"],"a":0,"ci":{"b":"授信篇","c":"第二十一章 外銷貸款","s":"第一節 防制洗錢及打擊資恐作業","t":"(三)<mark>洗錢高風險客戶加強查核措施：</mark>1.<mark>出口後交易</mark>：<mark>應逐筆徵取發票及運送相關文件進行查核，</mark>且不<mark>得申請總行或區域中心免徵</mark>。2.出口前交易：(1)憑訂單、契約等文件(不含L/C)辦理之出口前外銷貸款，應補徵<mark>運送相關文件</mark>，並至「待辦(應補正)事項追蹤系統(TDT)」（系統路徑：單一入口網站/行員專用系統/作業風險專區）完成登錄，待補徵完成後填寫「外銷貸款審核工作單(補徵運送文件專用版)」，且與原審核工作單併同存查。(2)如係交易取消、非屬貨物貿易等特殊原因致無法補徵<mark>運送相關文件</mark>者，應於「待辦(應補正)事項追蹤系統(TDT)」相關欄位予以說明後結案。(3)倘補徵之運送文件經查核發現涉及應婉拒事項者，應依「約定書(放002)」相關條款通知客戶於合理期間內全數清償該筆貸款本息，且自發現日起六個月內停止受理該客戶出口前外銷貸款。"},"t":"neg"},{"id":"112-7","y":112,"n":7,"m":11,"q":"有關本行辦理「聯合授信貸款及專案融資」業務，下列敘述何者為非？","o":["「專案融資案件」係具備專案計畫性質且融資額度達等值新臺幣 30 億元(含)以上者","聯貸案徵有國內擔保品時，e-Loan 系統之設定金額及貸放限額應依參貸比率輸入","營業單位於貸放後應定期依「承諾事項檢核表」檢核是否依規定履行各項承諾","聯貸案辦理額度建檔前，應先執行「聯合貸款資料維護(A611)及授信項目資料維護(A612)」建檔"],"a":0,"ci":{"b":"授信篇","c":"第四十六章 聯合授信貸款通則及專案融資","s":"第二節 專案融資","t":"一、<mark>專案融資</mark>範圍<mark>「專案融資</mark>（ProjectFinancing）」有別於傳統之企業融資（CorporateFinancing），係指以<mark>專案計畫</mark>未來產生之收入及現金流量作為還款來源，或以<mark>專案計畫</mark>項下之資產及權利(如特許權或地上權等)作為擔保，向銀行取得特定用途之融資。本業務要點所指<mark>「專案融資案件」係專案計畫性質</mark>具備下列條件之一<mark>且融資額度達等值新臺幣</mark>5<mark>0億元(含)以上者</mark>："},"t":"neg"},{"id":"112-8","y":112,"n":8,"m":9,"q":"依授信業務之「防制洗錢及打擊資恐」相關規範，下列何者為非？","o":["「客戶風險評分交易(A194)」屬高風險者，於授信申請書敍明承做理由，不得以營業單位經理權限核定","倘借戶、保證人、擔保物提供人符合「重要政治職務人士(PEPs)」者，應暫停授信額度，且不得申請新額度","「客戶風險評分交易(A194)」註記「09：特殊風險客戶」者，應向法令遵循處洗錢防制部辦理查詢","法人借款之權利文件倘授權由經理人簽章，應辦理被授權人「線上姓名檢核」作業"],"a":1,"ci":{"b":"授信篇","c":"第三章 授信申請","s":"第二節 申請手續","t":"4.辦理授信申請時，不得受理洗錢及資恐「黑名單」之借戶/保證人/<mark>擔保物提供人</mark>。5.借戶(含個人戶、法人、團體或其高階管理人員、法人實質受益人、非個人戶之負責人)<mark>、保證人、擔保物提供人符合「</mark>防制洗錢打擊資恐(AML)系統管制名單」(AML「黑名單」、<mark>「重要政治職務人士(PEPs)」</mark>及「負面新聞」)時，應採取之管控措施如下：(1)黑名單：屬「受經濟制裁或屬恐怖份子或團體｣或「依資恐法凍結資產或通報｣<mark>者，應暫停授信額度，且不得申請新額度</mark>；倘命中之黑名單為本行自建之「(SPEC)外匯異常名單」、行自建之「(SPEC)外匯異常名單」、「(SPEC)AIT恐怖分子名單」，應洽外匯營運處外匯作業部，了解其建檔原因，藉以判斷是否受理。(2)<mark>重要政治職務人士(PEPs)</mark>或負面新聞：由營業單位自行評估是否受理，並審慎辦理。(3)倘經個案評估受理者，應於授信案件申請書(含條件變更)揭露原因並敍明承做理由。"},"t":"neg"},{"id":"112-9","y":112,"n":9,"m":10,"q":"有關保全程序，下列敘述何者為非？","o":["向法院具狀聲請假扣押執行時，應檢送委任狀及繳付執行標的金額0.5%之執行費","執行程序應向執行標的物所在地地方法院民事執行處具狀聲請之","債務人得提供擔保，向法院聲請撤銷假扣押裁定","債權人收受假扣押或假處分裁定後已逾三十日者，不得聲請執行"],"a":0,"ci":{"b":"授信篇","c":"第六十章 保全程序","s":"第二節 執行程序","t":"一、執行程序應向<mark>執行標的</mark>物所在地地方法院民事執行處<mark>具狀聲請</mark>之（債權人收受假扣押或假處分裁定後已逾三十日者，不得聲請執行），如<mark>執行標的</mark>物為不動產時，應提出土地、建築物、登記簿謄本各乙份。開始<mark>執行時，應檢送委任狀及繳付執行</mark>費（<mark>執行標的金額</mark>之"},"t":"neg"},{"id":"112-10","y":112,"n":10,"m":10,"q":"下列消滅時效完成之效果，何者為非？","o":["主權利因時效消滅者，其效力及於從權利","時效完成後債務人得拒絕給付，惟債務人仍為履行之給付者，不得以不知時效為理由請求返還","抵押權人於抵押權所擔保債權時效消滅完成後五年間不實行其抵押權者，其抵押權消滅","本金請求權因時效而消滅者，其利息請求權仍為有效"],"a":3,"ci":{"b":"授信篇","c":"第五十九章 消滅時效","s":"第二節 消滅時效完成之效果","t":"(二)抵押權人於抵押權所擔保債權之消滅時效完成後五年間不實行其抵押權者，其抵押權消滅（民法第八百八十條）。三、主權利因時效<mark>消滅者，其</mark>效力及於從權利（民法第一百四十六條）。因此<mark>本金請求權因時效而消滅者，其利息請求權</mark>亦同歸於消滅。"},"t":"neg"},{"id":"112-11","y":112,"n":11,"m":2,"q":"有關本行「個人戶地上權建築物貸款」，下列敘述何者正確？","o":["寬限期最長 3 年","非本行土建融轉分戶貸款，限承作擔保品座落於 A、B 級區域","貸款期限最長30 年","不得搭配辦理「樂活貸」循環型房貸"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"(一)擔保品已有<mark>「樂活貸」循環型房貸</mark>者，不得辦理本貸款。(二)擔保品不得辦理增貸(含<mark>「樂活貸」循環型房貸</mark>)、充作其他貸款之副擔保或加強債權使用。"},"t":"ask"},{"id":"112-12","y":112,"n":12,"m":4,"q":"徵取「擔保物權連結條款同意書」(下稱「同意書」)應注意事項，下列敘述何者為非？","o":["不得在借款人尚無新融資需求時，事先預留「同意書」","應由借款人親自填寫最高限額抵押權擔保之債權金額及債務種類","已徵取「同意書」者，於不動產登記簿結案後，由業務經辦依同意書內容於消金 e-Loan 系統進行建檔","「同意書」併同抵押權設定文件歸檔(即存放於擔保袋)"],"a":1,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"2.「同意書」第二點因攸關擔保物提供人之權益，應由擔保物提供<mark>人親自填寫最高限額抵押權擔保之債權金額及債務種類</mark>，不得預先於「同意書」印製<mark>債務種類</mark>選項，填寫時應注意：(1)擔保<mark>債務種類</mark>：以「借款、墊款、透支、貼現」為限，且不得逾原購屋貸款<mark>最高限額抵押權債務種類</mark>範圍。保證債務、信用卡債務等因性質上與一般貸款不同，不宜包含在內。(2)擔保金額：以<mark>最高限額抵押權</mark>設定之金額為上限。"},"t":"neg"},{"id":"112-13","y":112,"n":13,"m":5,"q":"關於辦理徵信查詢聯徵中心信用資訊相關應注意事項，下列敘述何者為非？","o":["退件或拒貸之案件，當事人同意書應併同信用資訊表自查詢日起保留 5 年","如遇當事人要求撤回授信申貸案件並退回所有申請文件時，應儘可能保留當事人同意書等查詢資格要件正本，或預先將相關文件影印留存","各單位應指定專人每週列印查詢紀錄資訊","指定專人列印之查詢紀錄資訊應設專卷保留 5 年備查"],"a":2,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第五節 財團法人金融聯合徵信中心信用資訊產品種類與運用","t":"六、各使用<mark>單位應指定專人每</mark>日<mark>列印查詢紀錄資訊</mark>，經查詢人員蓋章及主管覆核（主管亦應覆核查詢信用資料是否符合本要點第九條之規定）確認後，設專卷保留五年備查。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第32頁","v":33,"t":"<mark>查詢聯徵中心信用資訊</mark>作業控管要點使用單位應設置「授權查詢金融聯合徵信中心及票據交換所<mark>信用資訊</mark>人員登記簿」保存5年備查<mark>應指定專人每</mark>日<mark>列印查詢紀錄資訊</mark>，經查詢人員蓋章及主管覆核，設專卷保留5年備查符合授信目的或金融管理法令遵循目的，並取得當事人同意或與當事人有契約或類似契約關係者<mark>信用資訊</mark>之利用：適法性及合目的性、與查詢目的具有正當合理之關聯不得利用所查得客戶之<mark>信用資訊</mark>辦理行銷或為其他逾越特定目的必要範圍之利用查詢所得資訊應保守秘密並嚴限內部參考，除當事人依法查詢其本人資料外，不得對外公開或移轉他人"},"t":"neg"},{"id":"112-14","y":112,"n":14,"m":6,"q":"關於財務比率之敘述，下列何者為非？","o":["負債比率愈高代表財務狀況愈不穩固","固定長期適合率超過 100%時，企業有侵用短期資金，移作長期性運用之疑慮","流動比率愈低，其短期償債能力則趨弱","營業週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期"],"a":3,"ci":{"b":"徵信篇","c":"第三章 財務分析","s":"第六節 財務分析方法與主要財務比率","t":"(6)<mark>現金週期=應收款項週轉轉天期+存貨週轉天期-應付款項週轉天期</mark>。"},"lx":{"b":"講義：徵信規範暨作業要領(2026.04)","c":"第43頁","v":59,"t":"<mark>應收款項週轉</mark>率：營收/平均<mark>應收款項</mark>總額(次)；365天/週轉次數=<mark>週轉天數</mark>測知產品銷售速率，存貨安全存量及是否有滯銷之現象<mark>營業週期=應收款項週轉天數+存貨週轉天數</mark>•指企業自投入現金購買存貨、銷售到帳款收回所需期間現金<mark>週期=應收款項週轉天數+存貨週轉天數</mark>-<mark>應付款項週轉天期</mark>"},"x":"依講義〈徵信規範暨作業要領(2026.04)〉第43頁：「365天/週轉次數=週轉天數測知產品銷售速率，存貨安全存量及是否有滯銷之現象營業週期=應收款項週轉天數+存貨週轉天數」「指企業自投入現金購買存貨、銷售到帳款收回所需期間現金週期=應收款項週轉天數+存貨週轉天數-應付款項週轉天期」","t":"neg"},{"id":"112-15","y":112,"n":15,"m":2,"q":"有關得排除適用 DBR22 倍規範之個人無擔保貸款，下列敘述何者為非？","o":["借款用途屬「創業」且以「企業戶」授信程序辦理者","參與都市更新或危老建物重建計畫貸款，在 6 年內將擔保物設定擔保物權者","個人自建房屋自住之建築融資貸款，在 6 年內將擔保物設定擔保物權者","企業員工認購「限制員工權利新股」之貸款，在 3 年內設定擔保物權者"],"a":2,"ci":{"b":"授信篇","c":"第五十二章 個人非消費性貸款","s":"第一節 通則","t":"3、「在一定合理期間」將擔保品<mark>設定擔保物權者</mark>：(1)參與都市更新或危老建物重建計畫貸款：一定合理期間不得超過六年。(2)借款人擔保品被政府徵收而改列無擔保之放款，如原土地之所有權人及抵押權人(即原金融機構)已依據土地徵收條例規定，約定於發給之抵價地設定抵押權予原土地抵押權人者：一定合理期間不得超過六年。(3)<mark>個人自建房屋自住之建築融資貸款</mark>：一定合理期間不得超過三年(如有特殊原因敘明理由後得延長為五年)。(4)企業員工認購「限制員工權利新股」之貸款：一定合理期間不得超過三年4)企業員工認購「限制員工權利新股」之貸款：一定合理期間不得超過三年。(5)企業員工認購股票(可轉換公司債)：一定合理期間不得超過六個月。(6)遺產稅融資：一定合理期間不得超過六個月(以繼承資產<mark>設定擔保物權</mark>為限)。(7)贈與稅融資：一定合理期間不得超過六個月(以受贈資產<mark>設定擔保物權</mark>為限)。(8)受贈土地之土地增值稅融資：一定合理期間不得超過六個月。(以該土地<mark>設定擔保物權</mark>為限)。"},"t":"neg"},{"id":"112-16","y":112,"n":16,"m":1,"q":"辦理中央銀行管控之購地貸款案件時，假設聯大公司購置新北市永和區都計之住宅區土地，買賣成交價為 123,455 仟元，本行鑑價金額為 122,456 仟元，未動工前應保留金額及可動撥金額，下列何者最正確？","o":["12,245 仟元及 48,970 仟元","12,245仟元及 48,950 仟元","12,250 仟元及 48,930 仟元","12,250 仟元及 48,990 仟元"],"a":2,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"(二)貸款額度最高不得超過購買土地取得成本與金融機構鑑價金額較低者之五成，<mark>其中一成應俟借款人動工興建後始得撥貸</mark>。"},"x":"購地貸款最高為取得成本與鑑價孰低（122,456 仟元）之 5 成，其中 1 成須俟動工後始得撥貸；官方答案：保留 12,250 仟元、可動撥 48,930 仟元。","lo":1,"t":"ask"},{"id":"112-17","y":112,"n":17,"m":4,"q":"有關徵提保證人之相關規範，下列何者正確？","o":["依法律或公司章程規定以保證為業務之公司，始得接受其為保證人","為求作業方便，不論借、保戶資力，得逕以借、保戶相互聯保或一人承保多戶方式辦理申請","得徵取未成年人為保證人","因擔任法人董事為該法人擔任保證人者，卸職後仍須對借戶新發生之借款負保證責任"],"a":0,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"(七)合夥組織之行號為人作保時，由執行事務合夥人或出名營業人為代表人，依其資格出名外，應徵取全體合夥人之同意書。(八)限於<mark>依法律或公司章程規定以保證為業務之公司，始得接受其為保證人</mark>。"},"t":"ask"},{"id":"112-18","y":112,"n":18,"m":9,"q":"下列何者非屬「風險較高覆審戶」之對象範圍？","o":["無擔保授信金額合計達新臺幣5,000萬元(含)以上","授信戶已經拒絕往來","目前為預警戶","授信戶經本行信用評等列為第10-13等者"],"a":0,"ci":{"b":"授信篇","c":"第五十四章 授信貸放後管理業務通則","s":"第六節 其他注意事項","t":"(二)本行<mark>無擔保授信金額合計達新</mark>台幣伍仟萬元（含）以上。􀀁(三)本行主辦且為管理行之聯合貸款。􀀁(四)財務處及海外分行投資公司債票券、金融債票券或信用連結商品涉及公司信用者。惟如持有之金融債票券，其信用評等達投資等級以上，或前述標的經金融機構保證，而保證機構之信用評等達投資等級者，則得免辦理覆審，然日後該發行（或保證）機構之債信評等遭調降而未達前述標準者，則仍須辦理覆審作業。前述信用評等達投資等級，指符合下列情形：􀀁"},"t":"neg"},{"id":"112-19","y":112,"n":19,"m":10,"q":"就債務人之財產所得向法院聲請強制執行前，應填寫「逾放(含呆帳)案件聲請法院強制執行前檢核表」(下稱檢核表)，下列敘述何者為非？","o":["應就檢核表所列項目逐項檢視，以確認本行債權是否存在及判斷執行對象於本行債務範圍","前揭檢核表，經催收經辦確認完即可，無須交由催收主管覆核","填寫檢核表，如查知執行對象於聯行有授信往來或於本行有信用卡、現金卡等，應以「逾放(含呆帳)案件通知評估辦理參與分配及陳報債權作業聯繫單」通知聯行或信用卡處(消金催收部)評估是否參與分配及陳報債權","檢核表查詢對象包括借戶、保證人或票據債務人"],"a":1,"ci":{"b":"授信篇","c":"第五十七章 不良授信之催討","s":"第三節 委外催收","t":"（四）聯繫事項如係須由本行支付費用者，例如申請戶籍謄本、申請地政資料…等，應經債權管理處書面通知方得辦理。（五）聯繫事項如係為確認該案件任一債務人(含保證人、票據債務人及繼承人等)有無本行同意免除債務責任或本行敗訴確定之記載，受聯繫單位應以「逾放(含呆帳)案件聲請法院強制執行前檢核表」(下稱檢核表)所列檢核項目逐項與催收日誌、原始債權契據及電腦建檔等資料相互勾稽確認，檢核表由<mark>催收經辦</mark>人員確認並送<mark>催收主管覆核</mark>後，正本及相關文件影本併同「第一金AMC受託催收逾放個案聯繫單」回覆第一金AMC，並留存影本備查。"},"t":"neg"},{"id":"112-20","y":112,"n":20,"m":2,"q":"有關本行以房養老「安心貸」業務，下列敘述何者為非？","o":["擔保品抵押權之設定金額應按貸放限額 1.4 倍設定","擔保品已有「樂活貸」循環型房貸者，不得辦理本貸款","貸款期間加計借款人年齡之合計數不得低於 95，且貸款期間最長以 35 年為限","屬 B、C、D 級之擔保品，案件一律申請總行或區域中心核准後辦理"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十一節 逆向抵押貸款「安心貸」","t":"(二)擔保品依本行不動產分級評等表，於下列擔保品貸放成數範圍內辦理。屬<mark>C、D級之擔保品，案件一律申請總行或區域中心核准後辦理</mark>。不動產分級評等貸放成數A級且為臺北市及新北市70%A級(不含臺北市及新北市)65%B級60%<mark>C、D級</mark>50%"},"lx":{"b":"講義：消金商品暨作業注意事項(2026.03)","c":"第14頁","v":49,"t":"屬C、<mark>D級之擔保品</mark>，<mark>案件一律申請總行或區域中心核准後辦理</mark>。"},"x":"依講義〈消金商品暨作業注意事項(2026.03)〉第14頁：「屬C、D級之擔保品，案件一律申請總行或區域中心核准後辦理。」","t":"neg"},{"id":"112-21","y":112,"n":21,"m":5,"q":"有關徵信作業注意事項，下列敘述何者為非？","o":["企金 e-Loan 系統每月 5 日提供「徵信報告未來二個月屆期明細表」","企金 e-Loan 系統每月 10 日提供「徵信報告逾改編屆期日二個月內明細表」","「徵信報告未來二個月屆期明細表」及「徵信報告逾改編屆期日二個月內明細表」，保管期限至少 1 年","倘財報決算日距改編日超過 6 個月以上，應一律加徵期中報表"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"核報告，亦即需徵取三年度財務報表。惟無論新編或改編徵信報告所徵取之財務資料，應以最近年度財務報表為準，且其<mark>決算日距改編日</mark>期不得逾8個月，倘期間超附錄二-18過8<mark>個月以上，應一律加徵期中報表</mark>辦理攤列並輔助分析說明。"},"t":"neg"},{"id":"112-22","y":112,"n":22,"m":5,"q":"有關免辦理徵信之敘述，下列何者為非？","o":["對會員銀行之授信案件得酌情免辦理徵信","對政府機關及公營事業之授信案件得酌情免辦理徵信","提供本行定期存單十足擔保之授信案件得酌情免辦理徵信","辦理「稅捐記帳保證」及「商品(服務)禮券保證」之授信案件得免辦理徵信"],"a":3,"ci":{"b":"徵信篇","c":"第二章 徵信調查之範圍","s":"第一節 徵信工作的對象","t":"1.新台幣借款及其間接保證 /mark>之<mark>身分證件影本</mark>(應留存兩種，包括有效之護照、由政府"},"t":"neg"},{"id":"112-27","y":112,"n":27,"m":5,"q":"下列何種異常情況免於徵信報告揭露？","o":["負責人或保證人有信用不良情形者","已知借戶曾有償還異常紀錄，然查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常者","借戶與關係人間之不動產交易價格異於市場行情者","以上皆非"],"a":3,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"（二）對借保戶本身於私人、非金融機構及金融機構借款已知曾有償還異常紀錄，雖查詢聯徵中心信用資訊時，因已逾聯徵資訊揭露期限而顯示為正常，<mark>於徵信報告</mark>中「過去償債情形」欄位，仍應勾選「有逾催紀錄」或「有呆帳紀錄」，並於「綜合意見」欄說明原因。"},"t":"ask"},{"id":"112-28","y":112,"n":28,"m":5,"q":"有關進銷貨廠商之查證，下列何者為非？","o":["台灣地區查詢「經濟部商工登記資料公示查詢系統」及「財政部稅務入口網站公示資料查詢系統」","若進銷貨廠商為公營事業，仍應查證","境外地區(含大陸地區)可查詢國外上市櫃資訊、公司相關網站或企業授信戶提供佐證資料","應列印查詢結果存卷備查再於徵信報告登錄進銷貨廠商名單"],"a":1,"ci":{"b":"徵信篇","c":"第十章 徵信報告之改編與管理","s":"第七節 徵信業務防制洗錢及打擊資恐作業","t":"1.查證方式如下：(1)台灣地區：「經濟部商工登記資料公示查詢系統」及「財政部稅務入口網站公示資料查詢系統」。(2)境外地區(含大陸地區)或台灣地區非屬上述第(1)點之其他申登機關登記：查詢國外上市櫃資訊、公司相關網站、企業授信戶提供佐證資料(如：財務報表、年報中揭露<mark>進銷貨廠商</mark>資訊、買賣合約、發票及運送單據等)或當地主管機關登記資料或台灣地區其他申登機關登記資料。"},"t":"neg"},{"id":"112-29","y":112,"n":29,"m":3,"q":"有關「都市危險及老舊建築物加速重建貸款」(自力更新型態)，下列敘述何者為非？","o":["重建融資額度原則上應一次全數動撥至信託專戶","營建融資及其他營建費用融資成數最高十成","須經全體土地及合法建物所有權人同意","依實際需要及興建計畫個別核定融資期限，原則上最長不逾十年"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(三)前項建築物造價，除委由建築經理公司核估，並經總行核准者外，應依本行現行各類建築物估價標準予以評估計算。四、貸款期限基地面積於200坪以內或興建建物10層樓以下者，最長以三年為原則；基地面積超過200坪且11層樓以上者，按<mark>實際需要及興建計畫個別核定</mark>，惟最長以不超過六年為原則。貸款期限如超過前述期限者，應說明原因。"},"x":"同 110-33。","lo":1,"t":"neg"},{"id":"112-30","y":112,"n":30,"m":7,"q":"信保基金保證手續費，應於授信翌日起（　）個曆日 內存入信保基金指定之帳戶。","o":["7 個營業日","7 個曆日","5 個營業日","5"],"a":0,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"壹、信用保證之申請方式暨送保程序","s":"壹-5","t":"3.信用保證案件之移送<mark>送保之授信應於授信之翌日起七個營業日內</mark>，逐筆填送「移送信用保證通知單」，並將計收之保證手續費匯存本基金指定帳戶；"},"x":"手冊壹、二(一)3 及肆、三：授信之<b>翌日</b>起 <b>7 個營業日</b>內填送「移送信用保證通知單」並匯存保證手續費。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"壹、信用保證之申請方式暨送保程序","v":9,"t":"3.信用保證案件之移送<mark>送保之授信應於授信之翌日起七個營業日內</mark>，逐筆填送「移送信用保證通知單」，並將計收之保證手續費匯存本基金指定帳戶；"},"t":"fill"},{"id":"112-31","y":112,"n":31,"m":7,"q":"有關中小企業信用保證基金送保對象基本資格之敘述，下列何者為非？","o":["中小企業：符合行政院核定「中小企業認定標準」之中小企業，惟不含金融及保險業、特殊娛樂業","取有主管機關依法核發營業證照之申貸戶(含公立機關(構)及財團法人)，得視同依法辦理公司登記或商業登記","曾以直接保證方式取得貸款之企業得為直接保證之保證對象","其他經信保基金董事會議通過並經經濟部核定之信用保證對象"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"貳、信用保證對象基本資格及不得送保相關規定","s":"貳-1","t":"另取有主管機關依法核發營業證照之下列申貸戶［<mark>不含公立機關（構）及財團法人</mark>］，得視同依法辦理公司、有限合夥登記或商業登記：1.醫療保健服務業或建築師事務所。"},"x":"手冊貳、一：取有主管機關營業證照之醫療保健、建築師事務所、托嬰幼兒園、私立長照安養機構等得視同依法辦理登記，但<b>不含公立機關（構）及財團法人</b>。","lx":{"b":"信保手冊：2025年版作業手冊待修訂彙總表(115.10)","c":"第1頁","v":48,"t":"所稱<mark>中小企業</mark>，係指<mark>依法辦理公司</mark>、有限合夥<mark>登記或商業登記</mark>，實收資本額或出資額在新臺幣一億元以下，或經常僱用員工數未滿二百人之事業。另<mark>取有主管機關依法核發營業證照之</mark>下列申貸戶［不<mark>含公立機關</mark>（構）<mark>及財團法人</mark>］，<mark>得視同依法辦理公司</mark>、有限合夥<mark>登記或商業登記</mark>：1.醫療保健服務業或建築師事務所。(二)創業個人：中華民國國民在國內設有戶籍，且為所創或所營<mark>中小企業</mark>為符合<mark>財團法人</mark>法及捐助章程相關規範，就保證對象中：1.屬<mark>視同依法辦理公司登記</mark>、有限合夥<mark>登記或商業登記</mark>之事業，訂定<mark>信用保證</mark>退場機制，116年6月30日以前仍得申請<mark>信用保證</mark>，屆期後，該類對象即停止受理申請。"},"t":"neg"},{"id":"112-32","y":112,"n":32,"m":7,"q":"針對無須先經信保基金同意，可逕准辦理展延、分期償還或寬限期之授信案件，於行內辦理條件變更核准後，依規最遲應於原清償屆至之日後（　）內，填送「移送信用保證通知單」並將計收之保證手續費匯存基金指定帳戶，並依基金回覆結果辦理。","o":["一個月","二個月","三個月","六個月"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","s":"陸-2","t":"(三)辦理期限及保證手續費之匯繳1.依前述（一）之1.，由授信單位逕准辦理之信用保證案件，<mark>應於原清償期到期後二個月內辦妥</mark>，並透過本基金作業系統填送「移送信用保證通知單」且將計收之保證手續費匯存本基金指定帳戶。"},"x":"手冊陸、二(三)：符合基本條件逕准展延或分期償還之案件，應於原清償期到期後 <b>2 個月</b>內辦妥並填送移送信用保證通知單、匯繳手續費。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"陸、信用保證案件到期之處理","v":4,"t":"(三)辦理期限及保證手續費之匯繳1.依前述（一）之1.，由授信單位逕准辦理之信用保證案件，<mark>應於原清償期到期後二個月內辦妥</mark>，並透過本基金作業系統填送「移送信用保證通知單」且將計收之保證手續費匯存本基金指定帳戶。"},"t":"fill"},{"id":"112-33","y":112,"n":33,"m":7,"q":"下列敘述何者為非？","o":["企業小頭家貸款週轉性支出每一事業額度最高為新臺幣500 萬元，惟受災事業不受額度限制","微型創業鳳凰貸款額度最高新臺幣 200 萬元，惟僅辦理稅籍登記者以 50 萬元為限","青年創業及啟動金貸款週轉性支出額度最高新臺幣 500 萬元","民宿貸款經常性週轉金額度依授信 5P 原則核實認定"],"a":2,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"參、信用保證案件共同規定及信用保證要點摘要","s":"參-18","t":"保證融資額度1.<mark>每一事業申請本貸款週轉性支出最高額度為五百萬元</mark>，惟受災事業不受前述限制。"},"x":"手冊參、二(十)：企業小頭家週轉性支出每一事業最高 <b>500 萬元</b>；青年創業貸款週轉性支出最高 <b>400 萬元</b>（非 500 萬），故 (3) 錯。（115.1.20 小頭家要點修正已刪除受災事業不受額度限制之規定）","lx":{"b":"信保手冊：2025年版作業手冊待修訂彙總表(115.10)","c":"第4頁","v":34,"t":"1.每一事業申請本<mark>貸款週轉性支出</mark>最高額度為五百萬元，惟受災事業不受前述限制。6參-22(十三)有關<mark>青年創業及啟動金貸款</mark>，悉依「<mark>青年創業及啟動金貸款</mark>要點」與本基金「<mark>青年創業及啟動金貸款</mark>信用保證要點」及「批次信用保證要點」等規定辦理，並請參閱經濟部中小及新創企業署及本基金網站。中企署114.7.1將「<mark>青年創業及啟動金貸款</mark>要點」更名為「<mark>青年創業</mark>貸款要點」，信保基金保證要點亦配合更名。"},"t":"neg"},{"id":"112-34","y":112,"n":34,"m":3,"q":"有關「建築貸款」<br><span class=\"it\">A.</span> 土地融資係指因承做房屋興建投資所辦理之購地或合建保證金貸款<br><span class=\"it\">B.</span> 營建融資係指興建房屋貸款<br><span class=\"it\">C.</span> 營建融資原則上不得超過預估建築物興建造價之五成<br><span class=\"it\">D.</span> 營建週轉金得以循環額度方式辦理。上述正確者共有幾項？","o":["1","2","3","4 項"],"a":3,"ci":{"b":"授信篇","c":"第二十五章 建築貸款","s":"第一節 申請","t":"(二)<mark>營建融資原則上不得超過預估建築物興建造價之五成</mark>，另依專案函布之優惠融資要點辦理除外，惟個案融資價值比(LoanToValue)低於五成者，營建融資原則上不得超過預估建築物興建造價之六成。"},"x":"依講義〈授信商品及應注意事項〉：土地融資＝購地或合建保證金貸款、營建融資＝興建房屋貸款、營建融資原則不超過預估興建造價 <b>5 成</b>（LTV 低於 5 成者 6 成）；營建週轉金得以循環額度辦理（建築貸款中唯一可循環者）→ 4 項皆正確。","lx":{"b":"講義：授信商品及應注意事項","c":"第13頁","v":31,"t":"<mark>建築貸款</mark>貸款額度：<mark>土地融資</mark>以本行「擔保品鑑價準則」規定為限，<mark>營建融資原則上不得超過預估建築物興建造價之五成</mark>。個案融資價值比(LoanToValue)低於五成者，<mark>營建融資原則上不得超過預估建築物興建造價之</mark>六成。除<mark>營建週轉金</mark>外，本貸款應一律以「非<mark>循環額度</mark>」<mark>方式辦理</mark>，授信批覆書有效期限不受現行規定之限制，應於授信條件中敘明最長有效期限，且不受核准後六個月內辦理第一次撥貸之規定。"},"t":"combo"},{"id":"112-35","y":112,"n":35,"m":7,"q":"信用保證案件尚未到期，如有下列何種情形(信用惡化)發生時，授信單位應於知悉之日起十日內，最遲應於二個月內通知信保基金？<br><span class=\"it\">A.</span> 授信對象停止營業者<br><span class=\"it\">B.</span> 未能依約分期攤還已超過一個月者<br><span class=\"it\">C.</span> 應繳付之利息延滯期間逾一個月，未逾三個月者<br><span class=\"it\">D.</span> 授信對象或其負責人受票據交換所拒絕往來處分者","o":["ABC","ABD","BCD","ABCD"],"a":1,"ci":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"伍、信用保證案件之期中管理","s":"伍-1","t":"(二)信用惡化之通知信用保證案件尚未到期，有下列情形之一時，授信單位<mark>請於知悉之日起十日內，最遲應於二個月內通知本基金</mark>：1.授信對象停止營業者。"},"x":"A 停業、B 分期攤還逾 1 個月、D 授信對象或負責人拒往屬<b>信用惡化</b>（10 日內、最遲 2 個月內通知）；C「利息延滯逾一個月未逾三個月」屬<b>信用弱化</b>（知悉起 10 日內以「營運弱化通知單」通知）→ ABD。","lx":{"b":"信保手冊：中小企業融資信用保證作業手冊(114.6)","c":"伍、信用保證案件之期中管理","v":65,"t":"3.<mark>應繳付之利息延滯期間逾一個月</mark>，<mark>未逾三個月者</mark>。(二)<mark>信用惡化</mark>之通知<mark>信用保證案件尚未到期</mark>，有下列情形之一時，<mark>授信單位</mark>請<mark>於知悉之日起十日內</mark>，<mark>最遲應於二個月內通知</mark>本基金：1.<mark>授信對象停止營業者</mark>。3.<mark>授信對象或其負責人受票據交換所拒絕往來處分者</mark>。"},"t":"combo"},{"id":"112-36","y":112,"n":36,"m":11,"q":"有關保證業務，下列敘述何者為非？","o":["客戶有預開保證書需求時，申請之保證期間應包含預開天數及銀行保證天數","申請外幣保證業務，應事先申請授信審核處或區域中心核准","對於以一定成數移送信保基金之新臺幣保證案件，整筆保證金額仍以無擔保列帳","授信戶於本行之授信額度已屆期不再續約，得解除保證責任"],"a":3,"ci":{"b":"授信篇","c":"第二十九章 一般保證業務","s":"第一節 申請手續","t":"十、申請外幣保證業務，其<mark>授信額度</mark>(含設定)應事先申請授信審核處或區域中心核准。"},"t":"neg"},{"id":"112-37","y":112,"n":37,"m":11,"q":"有關國內即期信用狀業務，下列敘述何者為非？","o":["本行墊付票款後，申請人應於十天內來行清償","信用狀有效期限原則上不得超過六個月","如另續貸新臺幣放款，續貸期限自本行墊付日起最長180天","申請人於申請開狀後，其指定受益人得依信用狀規定簽發匯票，惟免經承兌即可請求本行付款"],"a":1,"ci":{"b":"授信篇","c":"第三十五章 國內即期信用狀業務","s":"第一節 申請手續","t":"(二)依據國內即期信用狀向本行申請付款之匯票，除經總行或區域中心同意外，應使用本行印製之用紙（放074C）。(三)<mark>信用狀有效期限原則上不得超過</mark>四個月。"},"t":"neg"},{"id":"112-38","y":112,"n":38,"m":11,"q":"有關綜合授信額度，下列敘述何者為非？","o":["本項額度應向區域中心或授信審核處申請核准","最高額度合計不應超過借款企業「最近一年營業額」或「預計未來一年營業額之八成」孰高","不包括出口押匯（含出口貼現）授信","辦理用途不明確之外幣借款保證時，得逕行運用「丁類無擔保授信」項下之其他保證額度"],"a":3,"ci":{"b":"授信篇","c":"第五章 綜合授信額度","s":"第六節 其他注意事項","t":"一、<mark>辦理用途不明確之外幣借款保證時，</mark>因無法確實掌握且風險較高，不<mark>得逕行運用</mark>綜合授信額度<mark>「丁類無擔保授信」項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第2頁","v":45,"t":"額度運用原則:「<mark>擔保授信</mark>」:額度優先運用，未用額度得移作甲、乙、丙<mark>類無擔保授信</mark>及已申請額度之「<mark>丁類無擔保授信</mark>」。「<mark>丁類無擔保授信</mark>」:(1)丁類額度內各單項<mark>授信額度</mark>間不得相互移用。辦理<mark>外幣借款保證時</mark>，不<mark>得逕行運用綜合授信額度</mark>「<mark>丁類無擔保授信</mark>」<mark>項下之其他保證額度</mark>，應另行專案申請區域中心或授信審核處核准後辦理。"},"x":"依講義〈授信商品及應注意事項〉第2頁：「辦理外幣借款保證時，不得逕行運用綜合授信額度「丁類無擔保授信」項下之其他保證額度，應另行專案申請區域中心或授信審核處核准後辦理。」","t":"neg"},{"id":"112-39","y":112,"n":39,"m":1,"q":"依「中央銀行對金融機構辦理不動產抵押貸款業務規定」，受理公司法人購置住宅貸款，下列敘述何者為非？","o":["不得有寬限期","貸款額度最高不得超過鑑價或買賣金額較低者之四成","借戶得以修繕或其他貸款名目另向金融機構借款取得自籌款","購買「高價住宅」，應一律送區域中心或總行授信審核處審核"],"a":2,"ci":{"b":"授信篇","c":"第二十四章 中長期融資通則","s":"","t":"一、依中央銀行113年9月19日台央業字第1130035582號函辦理。二、辦理公司法人購置住宅貸款，應徵取「切結書【公司法人及個人非消費性貸款專用】」(下稱「切結書」)，切結貸款金額最高未超過新購置住宅(含基地)鑑價或買賣金額較低者之3成，且無另以修繕、周轉金<mark>或其他貸款名目</mark>，向本行或其它<mark>金融機構</mark>額外增加貸款，並配合提供相關自籌款來源佐證資料予本行留存備查。"},"lx":{"b":"講義：授信商品及應注意事項","c":"第11頁","v":62,"t":"「<mark>中央銀行對金融機構辦理不動產抵押貸款業務規定</mark>」其他注意事項辦<mark>理公司法人購置住宅貸款</mark>授信申請案件，應填製「查核控管表」，受理案件時應明確告知借戶不得透過任何人(不限下列查核對象)以任何<mark>貸款名目</mark>，<mark>另向金融機構借款取得自籌款</mark>，並需提供自籌款來源證明，及貸放前、後於聯徵中心倘有新增貸借款者，需再提供資金用途證明文件等事項，以免產生客訴，查核重點摘錄如下：(一)查核對象：借款人、負責人、保證人及擔保物提供人(下稱「查核對象」)。"},"x":"依講義〈授信商品及應注意事項〉第11頁：「「中央銀行對金融機構辦理不動產抵押貸款業務規定」其他注意事項辦理公司法人購置住宅貸款授信申請案件，應填製「查核控管表」，受理案件時應明確告知借戶不得透過任何人(不限下列查核對象)以任何貸款名目，另向金融機構借款取得自籌款，並需提供自籌款來源證明，及貸放前、後於聯徵中心倘有新增貸借款者，需再提供資金用途證明文件等事項，以免產生客訴，查核重點摘錄如下：(一)查核對象：借款人、負責人、保證人及擔保物提供人(下稱「查核對象」)。」","t":"neg"},{"id":"112-40","y":112,"n":40,"m":8,"q":"有關「第一商業銀行依貨幣市場利率承做短期放款準則」，下列敘述何者為非？","o":["貸放期限最長為 180 天","經核准之授信案件，於實際貸放之風險貼水(即「貸放風險貼水」)未低於「核准風險貼水」時，授權營業單位得逕予貸放","逐筆議價案件取得授權號碼後，應於當日或次一營業日辦理貸放，逾期不得貸放","未依指定到期日償還(含提前或逾期償還)，利息均溯至貸放日起依該筆貸放利率再加 1%計收"],"a":0,"ci":{"b":"授信篇","c":"第三十四章 國內遠期信用狀業務","s":"第一節 申請手續","t":"(四)信用狀有效期間原則上不得超過六個月，信用狀項下之承兌匯票付款期限，最長不得超過一百八十天。(五)在承兌匯票到期時，得就借款戶個別交易實際需要續貸新臺幣放款，期限應依借款戶資金需要及營業週轉期間內核給，惟匯票承兌期間加計續貸新臺幣放款期間，不得超過原核准每次可<mark>貸放期限</mark>（最長不超過<mark>180天</mark>）。"},"x":"MML 貸放期限最長 <b>90 天</b>（非 180 天）；風險貼水未低於核准者授權逕貸；議價號碼當日或次一營業日貸放；未依指定到期日償還溯及加 1%。","lo":1,"t":"neg"},{"id":"112-41","y":112,"n":41,"m":11,"q":"有關「出口週轉金外幣貸款」業務，下列敘述何者為非？","o":["每次貸款期限應按信用狀有效期限訂定，其辦理輸出保險者，且不得超過保險證明書有效期限","以訂單契約或記帳方式（O/A）辦理者，應一律申請總行或區域中心核准","以綜合額度方式申請時，憑國外訂單或輸出契約方式辦理者，隸屬「丙類無擔保授信」額度","辦理出口前外幣貸款，借款人得逕將撥貸之外幣款項兌換為新臺幣"],"a":3,"ci":{"b":"授信篇","c":"第四十五章 工商企業出口週轉金外幣貸款","s":"第二節 貸放手續","t":"八、辦理國內借款人出口前(裝船前)之<mark>外幣貸款，</mark>為避免借款人<mark>逕將撥貸之外幣款項兌換為新</mark>台幣，應於撥貸同時直接匯付予借款人國內或國外之供應商，或撥入借款人外匯存款帳戶同時辦理匯出匯款。借款人未能配合於撥貸同時匯出時，應另開立備償借款專戶供作撥款專戶，以限制其於出口前或匯出前辦理兌換。供作撥款專戶之備償借款專戶，應具獨立功能性，不得與其他業務共用同一帳號，惟借款人為<mark>辦理出口</mark>貸款(包含外銷貸款及出口週轉金<mark>外幣貸款</mark>)，針對以記帳(O/A)方式出口之買方匯入款，已有開立備償借款專戶控管償還來源者，得在帳務釐清無虞原則下，共用該帳號作為撥款專戶，免另開立新帳號。至於國內借款人出口後及OBU之<mark>外幣貸款，</mark>均不受此限。"},"t":"neg"},{"id":"112-42","y":112,"n":42,"m":8,"q":"A 為甲公司之負責人且持股 30%，A 之配偶 B 持股甲公司 15%，A 之未成年子女 C持股甲公司 10%，A 另為乙公司之負責人且持股 100%，依「總行及區域中心各級人員授信審查權限準則」，甲公司之審查權限應併計對象為何？","o":["AB","ABC","AB 乙公司","無應併計對象"],"a":3,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第一節 作業通則及應注意事項","t":"(一)應於授信申請書「營業單位補充說明」中敘明案件關聯性。(二)應合併計算渠等借款人之授信權限額度，依歸戶後之額度判斷是否屬「國內營業單位經理權限授信要點」審核權限；倘逾經理權限者，逕依「總行及區域中心各級人員授信審查權限準則」申請區域中心或總行核准後辦理。參、信貸通則"},"x":"同 111-6：法人授信戶審查權限<b>無應併計對象</b>。","lo":1,"t":"ask"},{"id":"112-43","y":112,"n":43,"m":8,"q":"有關本行集團關係戶之管理，何者為非？","o":["兩家企業之授信額度合計達新臺幣 20億元者，已符合集團控管認定標準","集團關係戶新增授信時，應知會集團主責分行，並副知法人金融業務處","行員專用系統「以關係戶統編查詢 TEJ 集團名單」功能，可輔助判斷授信戶之集團歸屬","授信新戶需同步申請集團限額時，得先經核准授信案件後，再行核備限額"],"a":3,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第八節 行員及關係人授信之限制","t":"80.12.5台融局(二)字第801675646號函）2.銀行如因會計年度決算後淨值降低，致已撥貸或已簽訂授信契約尚未撥款之<mark>授信案件</mark>，超逾銀行法第三十三條之三第一項對同一人或同一關係人或同一關係企業之授信<mark>限額時，得</mark>依原契約之授信額度繼續撥貸至契約屆滿為止，惟應注意風險控管。（金管會"},"x":"同 111-16：不得「先核准授信、再核備集團限額」。","lo":1,"t":"neg"},{"id":"112-44","y":112,"n":44,"m":4,"q":"辦理利害關係人擔保授信案件申請時，應填寫「利害關係人與非利害關係人授信條件比較表」，前述所稱授信條件包括：<br><span class=\"it\">A.</span> 利率<br><span class=\"it\">B.</span> 擔保品及其估價<br><span class=\"it\">C.</span> 授信金額<br><span class=\"it\">D.</span> 保證人資力","o":["AB","ABC","BD","AD"],"a":0,"ci":{"b":"授信篇","c":"第五十三章 消費者貸款","s":"第十三節 黃金存摺業務質借新臺幣","t":"(四)借款人為本行<mark>利害關係人時，應填寫「利害關係人與非利害關係人授信條件比較表」，</mark>確認並於授信申請條件加註「本案借戶為本行<mark>利害關係人</mark>，經查借戶○○○<mark>授信條件</mark>未優於其他同類授信對象(如附件)」。"},"t":"combo"},{"id":"112-45","y":112,"n":45,"m":2,"q":"有關「個人戶地上權建築物貸款」業務，何者為非？","o":["本行土建融轉分戶貸款，不限擔保品座落區域","重估案件得由營業單位辦理鑑價","應為政府機關核准屬可分割移轉之地上權建築物，貸放成數最高七成","授信到期日以不超過地上權存續期間屆滿前 10 年之日為原則"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第二節 調查及鑑價","t":"(十)承作「個人戶地上權建築物貸款」業務應依下列規範辦理：1.不論新貸或<mark>重估案件</mark>，一律由總行鑑價管理部或各區域中心<mark>辦理鑑價</mark>。"},"t":"neg"},{"id":"112-46","y":112,"n":46,"m":8,"q":"依「國內營業單位經理權限授信要點」，何者為非？","o":["無擔保授信移送經政府核准設立之信用保證機構信用保證之成數部分，倘送保項目屬間接授信科目者，則該送保成數部分視同擔保授信","公司負責人屬本行觀察名單，得適用經理權限","以股票為擔保品之授信，不得適用經理權限","個人與企業間授信歸戶時，企業之負責人、董事、監察人及其配偶之新臺幣授信權限額度應與企業合併計算"],"a":0,"ci":{"b":"授信篇","c":"第十二章 其他擔保","s":"第一節 保證","t":"八、中小企業<mark>信用保證</mark>基金之保證(一)財團法人中小企業<mark>信用保證</mark>基金（以下簡稱信保基金），為<mark>政府核准設立之信用保證機構</mark>，經其保證之授信，該保證<mark>成數部分，</mark>得視為<mark>擔保授信</mark>。"},"x":"官方答案 (1) 為錯誤敘述；(2) 觀察名單得適用經理權限、(3) 股票擔保不得適用、(4) 個人與企業歸戶併計負責人董監及其配偶，依 112 年版本為正確。","lo":1,"t":"neg"},{"id":"112-47","y":112,"n":47,"m":8,"q":"下列條件變更授信案件，何者不得逕由營業單位經理核定？","o":["原徵取之擔保品由本行活期性備償存款變更為等值應收客票","未涉及組織變更之企業授信戶更名","公營事業負責人之變更","負責人更名"],"a":0,"ci":{"b":"授信篇","c":"第七章 有價證券擔保","s":"第六節 其他應注意事項","t":"(二)應徵提交易單據(如：契約、發票等)佐證，並依授信篇第十五章第三節第一、二條，辦理<mark>應收客票</mark>徵取之實際交易行為查證作業，以確認所徵取之本票或匯票係符合擔保品適格性。"},"x":"擔保品由活存備償改為應收客票，擔保力下降，<b>不得</b>逕由經理核定；更名（未涉組織變更）、公營事業負責人變更、負責人更名可由經理核定。","lo":1,"t":"neg"},{"id":"112-48","y":112,"n":48,"m":4,"q":"有關「法定代位清償人同意書」之使用，何者為非？","o":["徵有多名保證人且僅免除其中一人之保證責任時，應徵取之","塗銷部分抵押權而借款人尚有其他授信時，應徵取之","擔保物提供人屬法定代位清償人","同意解除向後發生之保證責任，應徵取「免除」格式之同意書"],"a":3,"ci":{"b":"授信篇","c":"第一章 貸放事務通則","s":"第六節 保證","t":"五、免除保證人中之一人或數人之責任時，應向法定代位清償人，即保證人、擔保物提供人或其他就債之履行有利害關係之第三人徵取同意書，該同意書可自企業內部入口網站/全行文件庫/風控管理業務/工具箱/授信審核處/用紙專區下載，分為「格式A-免除部分連帶保證人責任，供連帶保證人使用」、「格式B終止部分連帶保證人責任，供連帶保證人使用」、「格式D-免除部分連帶保證人責任，供擔保物提供人使用」與「格式E-終止部分連帶保證人責任，供擔保物提供人使用」四種。<mark>「免除」</mark>係指溯及最初為解除<mark>保證責任</mark>之意；「終止」係指<mark>向後發生</mark>解除保證之意。"},"t":"neg"},{"id":"112-49","y":112,"n":49,"m":4,"q":"有關擔保品之規範，下列敘述何者為非？","o":["辦理抵押權塗銷查詢作業，查詢對象包括借款人及擔保物提供人","借款人與擔保物提供人不同時，抵押權塗銷同意書不得由擔保物提供人簽章領回","除另有規定外，動產設定期限一律以貸放期限加五年為準","除拍賣取得者外，不動產新買賣案件應於貸放後 2 個月內至實價登錄網站查證"],"a":1,"ci":{"b":"授信篇","c":"第九章 不動產擔保","s":"第三節 抵押權之設定、塗銷、變更及擔保品之更換","t":"3.借款人及<mark>擔保物提供人</mark>無法出具委託書時，本行得逕向不動產抵押權登記之地政機關辦理抵押權拋棄之塗銷登記。4.空白「<mark>抵押權塗銷同意書</mark>」及「抵押權部份<mark>塗銷同意書</mark>」庫存數量應與登記簿符合；前述作廢之同意書應打「PAID」或加蓋「作廢」戳記，並於適當時期會同主管人員、會計、經辦員予以銷毀。"},"t":"neg"},{"id":"112-50","y":112,"n":50,"m":10,"q":"與催收及呆帳案件債務人和解、協議攤還單筆償還金額達等值新臺幣多少(含)以上時，且收回款項入帳後，應填製「催收及呆帳案件(和解或協議攤還)防制洗錢及打擊資恐交易檢核表」？","o":["50萬元","100萬元","200萬元","300萬元"],"
