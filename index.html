，於委託人不能履行債務時由銀行代負履行責任之授信業務。</li>\n<li>承作原則：申請人以經營良好、財務健全者為原則；國內營業單位承作外幣保證以國內顧客為限。</li>\n<li>保證期限視契約內容訂定並酌加合理驗收期間；私立就業服務機構（人力仲介）簽發保證金保證書應以十足擔保為條件並申請區域中心/授信審核處核准。</li>\n<li>保證手續費率：商業本票保證本行簽證年率<b>0.5%</b>以上、非本行簽證<b>0.75%~1%</b>以上（最低2,000元）；禮券保證年率<b>1.5%</b>以上（最低10,000元）；其他保證年率<b>1%</b>以上（最低1,000元）。</li>\n<li>手續費期間計算：本行簽證商業本票按實際天數（一年365天）；非本行簽證及其他保證以每三個月一期，不足三個月以一期計。</li>\n<li>展期手續費按展延期間（每三個月一期）計收，每筆最低100元。</li>\n<li>保證責任解除情形：收回保證書、受益人解除通知、已逾求償期限（加郵遞期間）、保證標的消滅並取得證明。</li>\n<li>保證責任履行：通知申請人及連帶保證人繳付或以擔保存單解約、備付期票提示沖抵；墊付款無法收回時轉列「非放款轉列催收款項」（墊款日起6個月內）。</li>\n</ul>"},{"id":"credit-s1p3-c7","t":"第三十章 票據保證業務","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>定義：銀行受本票發票人委託，保證其到期償兌；得保證之本票分交易性本票（第一類商業本票）及融資性本票（第二類商業本票）。</li>\n<li>保證期限：自保證日起算至本票到期日止，最長不得超過<b>180天</b>；融資性商業本票最長不得超過<b>365天</b>。</li>\n<li>交易性本票原則使用本行印製本票；融資性商業本票限用簽證票券金融公司統籌印製之本票。</li>\n<li>保證手續費：本行簽證年率<b>0.5%</b>以上按實際天數（365天）；非本行簽證<b>0.75%~1%</b>以上每三個月一期；最低2,000元；簽發時一次收取。</li>\n<li>融資性商業本票採電子遞送模式者，應於發票日前<b>2個營業日內</b>完成保證確認及放行。</li>\n<li>備付期票到期未獲付款時：以「應收帳款-應收墊付保證款」墊款支付，保證本票暫不打PAID洞，由主管保管作債權憑證。</li>\n</ul>"},{"id":"credit-s1p3-c8","t":"第三十一章 稅捐記帳保證業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>政府為獎勵出口，廠商提供授信機構保證後可申請海關先予記帳放行（關稅記帳），稅金留待貨物出口時辦理沖退。</li>\n<li>包括：先放後稅進口貨物稅捐記帳保證、外銷品原料進口稅捐記帳保證、進口機器設備稅捐記帳保證、保稅工廠產品內銷補稅保證及其他稅捐保證。</li>\n<li>保證額度在稅捐機關所訂應繳保證金範圍內核定；保證期限依稅捐主管機關所訂期限辦理。</li>\n<li>關稅保證差額：保證稅額與海關核計不符時，差額在新臺幣<b>壹萬元以內</b>者海關得逕行更正。</li>\n<li>進口稅捐記帳保證沖銷後每筆餘額在新臺幣<b>一百元以內</b>者得自行辦理沖銷結案。</li>\n<li>保稅案件應於接到海關解除證明或收回保證書正本始得辦理解除。</li>\n</ul>"},{"id":"credit-s1p3-c9","t":"第三十二章 商品（服務）禮券保證","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>保證範圍：授信戶（禮券發行人）破產、撤銷登記或歇業致無法履約時，本行對禮券持有人履行保證責任；不含無償發行之抵用券、折扣券。</li>\n<li>保證手續費率：年率<b>1.5%</b>以上，每三個月一期，最低新臺幣<b>10,000元</b>；禮券處理費每張新臺幣<b>5元</b>。</li>\n<li>保證期限：金融機構保證期限為禮券出售日起至少<b>一年</b>，最長不得超過<b>二年</b>。</li>\n<li>核銷/未售禮券加蓋「已核銷」字樣後保存<b>5年</b>；保證餘額表（LG02）等保存<b>10年</b>。</li>\n<li>因實體禮券多屬無記名證券偽變造風險高，應以績優授信戶或十足擔保為原則。</li>\n</ul>"},{"id":"credit-s1p3-c10","t":"第三十三章 票據承兌業務","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>定義：銀行接受商品或勞務交易當事人委託，為匯票付款人而予承兌之授信業務。</li>\n<li><b>買方委託承兌</b>：銀行替代委託人，為其賣方所發匯票之付款人而予承兌。</li>\n<li><b>賣方委託承兌</b>：賣方將交易取得之遠期支票轉讓予銀行，依該支票金額簽發見票後定期付款匯票，由銀行為付款人而予承兌。</li>\n<li>匯票須為合法商業行為簽發；賣方委託須查明賣方尚未收現、買方委託須查明買方尚未付現始得承兌。</li>\n<li>同一交易業經承兌者不得再以該交易基礎重覆辦理承兌（避免重覆授信）。</li>\n<li>承兌期限：自承兌日起算至票據到期日止，最長不得超過<b>180天</b>；賣方委託不得超過所徵應收客票最後一筆預定收妥日且不得超過賒銷期間。</li>\n<li>賣方委託承兌應徵取基於交易取得之應收客票為還款財源，並在客票金額十足範圍內辦理。</li>\n<li>未徵提賒銷交易憑證且未能舉證未違反銀行法第15條者，財政部得處<b>50萬以上250萬以下</b>罰鍰。</li>\n<li>不得辦理情事：就已收付現款/即期票據/信用卡付款交易承兌；就賣方已收未到期票據並融資之交易辦賣方委託；就賣方已為應收帳款出售或融資之交易辦賣方委託。</li>\n</ul>"},{"id":"credit-s1p3-c11","t":"第三十四章 國內遠期信用狀業務","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>國內信用狀為本行為客戶採購國內原料物資所開發；依付款期限分國內即期及國內遠期信用狀。</li>\n<li>信用狀有效期間原則不得超過<b>六個月</b>；承兌匯票付款期限最長不得超過<b>180天</b>。</li>\n<li>承兌匯票到期得續貸新臺幣放款，惟承兌期間加計續貸期間不得超過原核准可貸放期限（最長180天）。</li>\n<li>開狀手續費：有續貸新臺幣按開狀金額年率<b>0.1%</b>以上（低於500元以500元計）；無續貸低於1,500元以1,500元計；以三個月為一期。</li>\n<li>承兌手續費：按承兌金額年率<b>1%</b>計收，以三個月一期，逾三個月未滿六個月以六個月計。</li>\n<li>匯票承兌手續費：每張匯票<b>300元</b>（授權經理酌情減免，受益人非本行客戶不得減免）。</li>\n<li>受益人查證：上市櫃/公開發行/資本額1億以上知名廠商查公開資訊即可；非知名且非授信戶須實地查訪。</li>\n<li>信用狀修改：金額增加或匯票期限延長應加徵承兌費並追徵擔保品及備付期票；修改手續費每筆500元。</li>\n</ul>"},{"id":"credit-s1p3-c12","t":"第三十五章 國內即期信用狀業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>受益人簽發匯票<b>免經承兌</b>即可請求本行付款（與遠期須承兌不同）。</li>\n<li>信用狀有效期限原則不得超過<b>四個月</b>。</li>\n<li>本行墊付票款後申請人應於<b>十天內</b>清償；另續貸新臺幣者續貸期限自墊付日起最長<b>180天</b>。</li>\n<li>開狀手續費：有續貸年率0.1%以上（低於500元以500元計）、無續貸低於1,500元以1,500元計。</li>\n<li>匯票付款時收取押匯手續費每張<b>300元</b>。</li>\n<li>墊款期間（最長十天）利息自付款日起依本行基準利率加年率<b>4.5%</b>計收。</li>\n</ul>"},{"id":"credit-s1p3-c13","t":"第三十六章 國內即、遠期信用狀電子化作業","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>適用對象：與本行簽訂「委任開發國內即、遠期信用狀契約書─含電子化作業」之申請人。</li>\n<li>貸款種類：開發國內即期信用狀L1、遠期L2、賣方委託票據承兌L3、續貸新臺幣貸款L4（均線上）。</li>\n<li>操作模式：網銀線上、網銀臨櫃、CDS線上作業。</li>\n<li>押匯/承兌手續費每張匯票<b>300元</b>（授權減免，受益人非本行客戶不得減免）。</li>\n<li>到期還款：約定到期批次還款系統於到期日當日早上8:30自動執行。</li>\n<li>主管核准明細表保存<b>5年</b>。</li>\n<li>全額續貸註記指授信批覆核准續貸新臺幣且申請人同意依匯票面額全額續貸者，免徵借據。</li>\n</ul>"},{"id":"credit-s1p4-c1","t":"第三十七章 外匯授信通則","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>受理對象：國內(DBU)或境外(OBU)依法登記經營進口業務之工商企業法人，或經准許辦理進口之機關、團體及個人。</li>\n<li>外幣貸款用途限制：屬<b>對外直接投資</b>須具函洽法金處向央行申請核准後辦理；屬<b>金融帳類交易</b>（投資基金、債券等）除主管機關另有規定外，<b>不得</b>申請外幣貸款。</li>\n<li>「個人」申請外匯授信，除買入光票（限銀行同業簽發之外幣票據）外，<b>一律</b>須申請區域中心或授信審核處核准。</li>\n<li>AML黑名單：查證確為黑名單者<b>應予婉拒</b>並申報。</li>\n<li>全面性制裁國家（如北韓、伊朗）出現於單據（含國家、船名、港口、收/卸貨地）者<b>一律不得受理</b>。</li>\n<li>俄羅斯、白俄羅斯、烏克蘭：買賣雙方交易對手或銀行位於該三國者<b>一律不得承作</b>。</li>\n<li>限制押匯國家/地區之進口開狀案件<b>應一律以自付條款方式</b>辦理。</li>\n<li>貨品內容審查：以查詢產品大項為原則，貨品逾<b>5項</b>以上者得僅查詢金額或數量前<b>5大</b>項目。</li>\n<li>進一步查證運送單據之門檻：借款人於本行信評達<b>8等（含）以上</b>且撥貸金額達<b>美金20萬（含）以上</b>，或僅提供未簽署副本者，須查證海運/空運提單或快遞收據真實性。</li>\n<li>補徵運送文件經查涉應婉拒事項者，應通知客戶合理期間內全數清償，且<b>自發現日起6個月內停止受理</b>該客戶進/出口前外幣貸款。</li>\n<li>計息一年天數：美金、澳幣、瑞郎、加幣、日幣、瑞典克郎、紐幣、歐元、人民幣為<b>360天</b>；英鎊、港幣、新幣、南非幣、泰銖、土耳其里拉為<b>365天</b>。</li>\n<li>利息計算單位：日幣以本金一元為單位、算至元位四捨五入；其他幣別以本金一分為單位、算至小數點後第二位四捨五入。</li>\n<li>利率型態：固定利率（一價到底，適用短期外幣放款為主）；機動利率（訂有重評機制，需經授審處或區域中心核准，常見於中長期及聯貸）。</li>\n<li>違約金：逾期按本行外匯授信利率加年率<b>2.5%</b>遲延利息；逾期6個月內另按上述利率<b>10%</b>，逾期超過6個月按<b>20%</b>計收違約金。</li>\n<li>代償他行未到期外幣貸款：貸款期限<b>不得逾原貸款期限</b>或國外交易文件有效期間；貸款金額<b>不得逾原外幣貸款餘額</b>。</li>\n<li>公司資金貸與他人（公司法第15條）：公司間有短期融通資金必要者，<b>融資金額不得超過貸與企業淨值的40%</b>。</li>\n<li>境內法人於OBU授信目的帳戶餘額上限：以「OBU授信餘額及未用額度加總後之<b>2倍</b>」為原則，最高以<b>5倍</b>為限。</li>\n<li>LIBOR退場替代利率：SOFR（美元）、€STR（歐元）、TONA（日幣）、SONIA（英鎊）、SARON（瑞郎）5種，皆為隔夜O/N回顧式利率。</li>\n</ul>"},{"id":"credit-s1p4-c2","t":"第三十八章 進口即期信用狀業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>申請人須為依法登記經營進口業務之工商企業或經准許之機關、團體及個人。</li>\n<li>信用狀有效期限：不論地區一律以<b>6個月內</b>為原則，經理得延長至<b>1年</b>；超過1年原則不宜承作，特殊考量須個案申請核准。</li>\n<li>墊款期限：申請人應於單據寄達本行並發出到達通知書之<b>15日內</b>來行贖單清償墊款。</li>\n<li>保險：除信用狀規定由出口商投保外，應由申請人以本行為受益人投保並交保單正本。</li>\n<li>開狀保證金：得視客戶信用及債權確保情形，由<b>營業單位自行決定</b>是否徵取。</li>\n<li>受益人應為徵信報告主要進貨廠商或載於進貨/銷貨廠商明細表中。</li>\n<li>信用狀申請人係接受他人委託進口者，除委託人確有工廠登記證且申請人信用良好外，<b>應徵取適當擔保品或以全額結匯</b>辦理。</li>\n</ul>"},{"id":"credit-s1p4-c3","t":"第三十九章 進口遠期信用狀業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>信用狀有效期限：一律<b>6個月內</b>為原則，經理得延長至<b>1年</b>。</li>\n<li>融資期限（匯票期間）：超過<b>180天</b>者，<b>應一律申請</b>區域中心或授信審核處核准。</li>\n<li>備付本息本票：以逐筆於開狀或交單時徵取為原則；共同出具授權書授權本行代填到期日者，得改按核准額度<b>110%</b>一次徵足。</li>\n<li>進口遠期風險大於即期，應對申請人詳予徵信；對第三者委託申請人開發者<b>應予拒絕</b>。</li>\n<li>徵取新台幣本息本票若由第三者背書，票面抬頭<b>勿以本行為受款人</b>，以免背書不連續影響追索權。</li>\n</ul>"},{"id":"credit-s1p4-c4","t":"第四十章 工商企業進口週轉金外幣貸款","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>貸款用途：限供匯償辦理進口託收（D/A或D/P）、記帳方式進口（O/A）、預付款等應付外匯款項；屬<b>預付款者應依實際條件申請核准</b>。</li>\n<li>貸款期限：視實際週轉情形（存貨期間加銷貨應收帳款期間），扣除國外出口商給予之信用期間；逾<b>180天</b>者應經區域中心或授信審核處核准。</li>\n<li>到期日起算日：宜以運送單據裝運日期起算。</li>\n<li>記帳（O/A）承作：應徵發票、運送單據或通關證明；發票簽發人應為匯款受款人、抬頭人應為本行借款人。</li>\n<li>運送單據須為UCP600第19~25條所定義單據；受貨人應為本行借款人。</li>\n<li>出口商應為徵信報告主要進貨廠商；交易對手為關係人者，應加強查證交易真實性及合理性。</li>\n</ul>"},{"id":"credit-s1p4-c5","t":"第四十一章 工商企業進口託收週轉金貸款","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>貸款用途：以支付在本行辦理<b>進口託收（D/A、D/P）</b>之應付結匯款為限。</li>\n<li>每筆貸款應在進口託收結匯金額<b>8成</b>範圍內折合新台幣辦理。</li>\n<li>貸款利率依評定之<b>新台幣</b>放款適用利率計息。</li>\n<li>貸款期限扣除國外出口商給予之進口託收期間，逾<b>180天</b>者應經核准。</li>\n<li>應於進口託收單據到達本行後方可貸放，並請借款人於貸放同時償清該筆進口託收貨款。</li>\n</ul>"},{"id":"credit-s1p4-c6","t":"第四十二章 工商企業進口機器外幣貸款","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>貸款額度最高以進口機器<b>鑑價金額之7成</b>為限。</li>\n<li>貸款期限：自墊款利息起息日或轉貸外幣中期擔保放款日起，<b>最長不超過5年</b>，每半年一期分期平均攤還，<b>寬限期最長1年</b>。</li>\n<li>利率分兩段：墊款起息日至轉貸日按起息日一般外匯授信利率；轉貸日至到期日按本行通知利率或約定利率。</li>\n<li>本貸款（含動產抵押權設定）<b>一律向區域中心或授信審核處申請</b>。</li>\n<li>最長每6個月攤還本金一次，利息按月計付。</li>\n</ul>"},{"id":"credit-s1p4-c7","t":"第四十三章 其他進口授信業務","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>續貸/展期/改貸限「買方付息者」；總貸款期限應自墊款利息起息日起算。</li>\n<li>進口跟隨票據承兌及貼現：貸放金額應在原進口遠期信用狀<b>第二次結匯本金金額（不含利息）</b>範圍內。</li>\n<li>進口託收擔保提貨/副提單背書：超過權限部分得徵取十足本行存單或十足等值本行存款為質後單獨運用經理權限。</li>\n<li>該額度以「應收保證款項—無擔保（外）」會計項目申請，<b>專用</b>，不得與其他進口額度相互流用。</li>\n<li>因本行尚未收到國外託收單據，對船公司保證責任金額未定，<b>風險較大應審慎辦理</b>。</li>\n<li>應追蹤「進口託收E/D或L/G逾15日未到單」明細表。</li>\n</ul>"},{"id":"credit-s1p4-c8","t":"第四十四章 出口押匯授信業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>對象：依貿易法規登記經主管機關核准辦理出口業務之廠商。</li>\n<li>額度適用期間以月為單位，<b>最長不得超過次年相當月之月底日</b>。</li>\n<li>核准額度不敷使用時，得於<b>20%彈性額度</b>範圍內先行受理出口押匯。</li>\n<li>額度適用期間應注意信用狀況，如發生出口拒付逾期未解決或押匯款逾期未入帳，應採保全措施並酌降或停止額度。</li>\n<li>出口押匯法律性質為<b>墊款</b>，須注意瑕疵押匯與拒付風險。</li>\n</ul>"},{"id":"credit-s1p4-c9","t":"第四十五章 工商企業出口週轉金外幣貸款","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>外幣貸款<b>不得兌換為新台幣</b>，但取得已出口證明書件（D/A、D/P託收文件等）者不在此限。</li>\n<li>貸放成數：憑出口信用狀或D/A、D/P託收文件者，每筆在<b>信用狀或託收金額85%</b>範圍內；憑訂單/輸出契約者在<b>60%</b>範圍內；憑記帳O/A者在<b>發票金額80%</b>範圍內。</li>\n<li>憑訂單/契約辦理者，貸款餘額以不超過前一年度出口實績<b>1/4</b>為原則；資格門檻為上年度出口實績達<b>美金250萬元以上</b>或最近6個月本行出口實績達<b>美金100萬元以上</b>。</li>\n<li>憑出口託收文件辦理者，除信譽良好或有適當擔保外，應向中國輸出入銀行辦妥出口託收輸出保險並指定本行為受益人。</li>\n<li>訂單、契約或記帳O/A方式辦理者<b>應一律申請總行或區域中心核准</b>（能明確掌握還款來源者除外）。</li>\n<li>綜合授信歸類：憑L/C或D/A、D/P者屬<b>甲類無擔保</b>；憑訂單、輸出契約或O/A者屬<b>丙類無擔保</b>。</li>\n<li>應於出口文件上以紅色字體加蓋「已辦理貸款不得重複融資」戳記。</li>\n<li>出口前（裝船前）外幣貸款應於撥貸同時直接匯付供應商；記帳O/A方式出口一律開立備償借款專戶。</li>\n<li>未能以出口外匯所得款項償還且無正當理由者，<b>自到期日起1年內停止受理</b>本項貸款。</li>\n<li>TradeCard(GT Nexus)外幣貸款貸放成數：出口前融資訂單金額<b>6成</b>、出口後融資商業發票淨額<b>8成</b>、文件核實後融資<b>8.5成</b>、立帳後融資<b>9成</b>；期限以交易付款日加<b>4個月</b>為到期日、<b>最長10個月</b>。</li>\n</ul>"},{"id":"credit-s1p4-c10","t":"第四十六章 聯合授信貸款通則及專案融資","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>定義：結合<b>2家以上</b>銀行或金融機構組成銀行團，依相同授信條件與借款人訂立聯合授信合約，按約定比例提供授信。</li>\n<li>角色：<b>統籌主辦銀行/共同主辦</b>、<b>（額度）管理銀行</b>、<b>參貸銀行</b>；本行統籌主辦案原則由承貸營業單位擔任管理銀行。</li>\n<li>不動產擔保品：本行統籌主辦案應委外由大型鑑價機構鑑價；採兩份以上外部鑑價報告時<b>採孰低者</b>認定。</li>\n<li>擔保品建檔：設定金額及貸放限額依<b>參貸比率</b>輸入。</li>\n<li>授信條件變更授權：變更利率幅度在<b>0.5%（含）</b>、費率幅度在<b>0.25%（含）</b>範圍內，得逕依授信程序申請（免提報聯貸行銷小組會議）。</li>\n<li>前聯貸案佔本次聯貸總額度<b>7成（含）以上</b>者，免召開聯貸行銷小組會前會。</li>\n<li>通報時程：簽約後每月<b>5日前</b>填報「聯合授信個案資料表」，每月<b>25日前</b>填報「聯貸案件到期追蹤表」。</li>\n<li>貸放後管理不可全然仰賴統籌主辦或管理銀行之通知，必要時應定期派員實地查勘。</li>\n<li>費用種類：財務承諾補償費、承諾費、變更或豁免授信條件之申請作業手續費、提前清償補償費。</li>\n<li>政府採購且聯貸金額達新臺幣<b>50億元以上</b>者，得簽訂「三方協議書」（採購契約款撥入專戶控管、專款專用）。</li>\n</ul>\n<h4>專案融資</h4>\n<ul>\n<li>定義：以專案計畫未來收入及現金流量為還款來源，或以專案項下資產及權利為擔保之特定用途融資。</li>\n<li>門檻：融資額度達等值新臺幣<b>50億元（含）以上</b>且屬政府採購案，或以SPC/SPV執行BOT、BTO、ROT、BOO、OT、再生能源、民營電廠等開發專案。</li>\n<li>融資額度：原則依專案總成本<b>8成</b>範圍內（含預付款保證額度）。</li>\n<li>融資期限：原則不超過<b>20年</b>，得視需求調整並提供寬限期。</li>\n<li>盡職調查（Due Diligence）：就財務、法律、保險、技術四大構面評估，原則委外由合格第三方評估機構出具報告；2家以上結論歧異時<b>依保守原則採用</b>。</li>\n<li>應設立專戶，專案所有資金均入此專戶專款專用。</li>\n<li>貸放後管理：公共工程案件至少每3個月填製工程款入帳追蹤表等。</li>\n</ul>"},{"id":"credit-s1p4-c11","t":"第四十七章 買入外幣匯款及票據授信業務","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>對象：依法登記之公司、行號或往來良好之個人；境外法人或個人得於OBU申辦。</li>\n<li>條件：買入外幣匯款及票據應以銀行同業所匯出或開發之匯入匯款為限；累計餘額達<b>美金1萬元（不含）以上</b>者，應以基於實際出口交易行為所產生者為限。</li>\n<li>「銀行同業」定義：自由世界排名<b>500名以內</b>（按第一類資本總額排列）之銀行，或本行通匯行。</li>\n<li>額度期限以月為單位，<b>最長不得超過次年相當月之月底日</b>。</li>\n<li>核准額度不敷使用時得於<b>20%彈性額度</b>範圍內核准受理買入。</li>\n</ul>"},{"id":"credit-s1p4-c12","t":"第四十八～四十九章 境外公司及大陸地區法人融資業務","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>受理大陸地區法人融資對象：國內營業單位以國內有母公司或關係企業之<b>大陸臺商</b>為原則；OBU及海外分行以<b>大陸外商、中資企業</b>及國內無母公司關係企業之大陸臺商為原則。</li>\n<li>大陸臺商定義：臺灣人民/法人於大陸投資設立之子公司，若中外合資股權比例逾<b>50%（含）以上</b>、可申辦外債登記者。</li>\n<li>大陸地區法人可承作商品僅限：短期週轉金外幣貸款、中期外幣貸款、長期外幣貸款。</li>\n<li>連帶保證人：以徵國內母公司/關係企業開立之備付本票及負責人或主要股東擔任連保為原則；備付本票依使用最高額度徵取等值<b>110%</b>本票及授權書。</li>\n<li>備付本票以無記名為原則；記載抬頭人時僅得以「借款人」為抬頭人，且不得記載「禁止背書轉讓」。</li>\n<li>擬免徵備付本票或改徵其他書類者<b>一律申請授信審核單位核准</b>。</li>\n<li>KY公司授信案件應至公開資訊觀測站查詢財務及交易資訊警示指標；新（增）貸案當次金額達等值<b>美金300萬元（含）以上</b>且信評達<b>6等（含）以上</b>之自貸案件應辦理實地查訪。</li>\n<li>境外實地參訪門檻：母公司/關係企業已往來且信評屬中高風險以上（<b>信評10等以上</b>）且額度達等值<b>美金100萬元以上</b>，或母公司未往來且額度達美金100萬元以上者。</li>\n<li>存續證明：可採註冊代理人<b>6個月內</b>簽發之董事職權證明書，或註冊機關6個月內簽發之存續證明。</li>\n<li>財務報表：最近年度決算日距徵信報告新編/改編日超出<b>8個月以上</b>應一律徵提期中報表。</li>\n<li>大陸借款合同：須辦妥外債登記後始生效；一式三份；借款人須於簽立後<b>15日內</b>向大陸外匯管理局辦妥外債登記。</li>\n<li>昆山試驗區跨境人民幣融資限額：臺資企業透過境外集團企業借入人民幣總額不得高於該集團於大陸境內全體成員所有者權益（淨值）總和。</li>\n</ul>"},{"id":"credit-s1p4-c13","t":"第五十章 外匯定期存款質借外幣","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>對象：本行存戶，借款人與存款人<b>應為同一戶名</b>。</li>\n<li>質借幣別與存單幣別相同者：質借金額<b>最高不得逾存單面額</b>。</li>\n<li>質借幣別與存單幣別不同者：限承作美金、歐元、日幣、人民幣、英鎊、港幣、澳幣及紐幣，貸款成數<b>最高9成</b>。</li>\n<li>借款期限：<b>不得逾原存單到期日</b>；數張不同到期日存單質借者不得逾最長到期日。</li>\n<li>徵信：質借幣別與存單幣別相同者得<b>免辦徵信</b>；不同者應依規辦理徵信。</li>\n<li>額度申請比照新台幣定儲存單質借，免徵連帶保證人並授權逕行核貸。</li>\n<li>外匯定期存款應由存款人背面加蓋原留印鑑，驗對無誤後辦理質權設定。</li>\n</ul>"},{"id":"credit-s1p4-c14","t":"第五十一章 小巨人貸款","fc":"C","fq":"5年約0題（每年約<1題）· C級","h":"<ul>\n<li>本章於細則正文未收錄詳細條文（目錄列示），考點以中小企業專案貸款相關規範為主。</li>\n</ul>"},{"id":"credit-s1p5-c1","t":"第五十二章 個人非消費性貸款","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>第一節 通則</h4>\n<ul>\n<li><b>DBR 22倍</b>規範：借款人於全體金融機構無擔保債務歸戶後之總餘額（含信用卡、現金卡、信用貸款）除以平均月收入，<b>不宜超過22倍</b>。</li>\n<li>得<b>排除</b>適用DBR22倍者：借款用途屬「創業、所營事業營運週轉金、建築融資、農業用途」且以企業戶程序辦理；政策性專案貸款（微型企業創業貸款、農業信保基金保證、中小企業信保千億保專案）。</li>\n<li>「在一定合理期間」將擔保品設定擔保物權者得排除，各期限：都更/危老重建<b>不超過6年</b>、擔保品遭政府徵收改列無擔保<b>不超過6年</b>、個人自建自住建築融資<b>不超過3年（特殊原因得延長為5年）</b>、認購限制員工權利新股<b>不超過3年</b>、認購股票（可轉換公司債）<b>6個月</b>、遺產稅/贈與稅/土增稅/代償有價證券擔保貸款/認購公司股票<b>各6個月</b>；排除者應加徵切結書。</li>\n<li>撥款前回查：首次撥款應查聯徵「B68」，重新計算DBR倍數，<b>未超過22倍</b>始得撥款。</li>\n<li>央行管制購置住宅貸款存續期間增貸/轉貸：自然人<b>第1戶</b>購屋貸款後存續期間可辦增貸；其餘借款人自撥款起算<b>3年內</b>僅得就超過本金平均攤還部分及原貸未達成數上限差額增貸，<b>滿3年後</b>增貸合計原貸餘額不得超過成數上限；增貸<b>均不得有寬限期</b>。</li>\n<li>資金用途切結：借款須按申貸用途使用，違反者視同提前到期、無條件清償。</li>\n<li>無擔保放款應於借據揭露「總費用年百分率」。</li>\n</ul>\n<h4>第二節 微型創業鳳凰貸款</h4>\n<ul>\n<li>對象：未滿<b>45歲</b>成年女性、年滿<b>45至65歲</b>者、<b>65歲以下</b>設籍離島之成年人（本國國民）。</li>\n<li>申請：向勞動部提出，審查通過後轉介承貸金融機構核貸。</li>\n<li>額度：最高<b>200萬元</b>，僅辦稅籍登記者以<b>50萬元</b>為限。</li>\n<li>期限：最長<b>7年</b>，按月平均攤還本息；經濟困難得給予繳息不還本寬限期<b>1年</b>。</li>\n<li>利率：中華郵政2年期定儲機動利率加<b>0.575%</b>；前<b>2年</b>免息由勞動部全額補貼，特殊身分者前<b>3年</b>免息、第4年起固定負擔<b>1.5%</b>。</li>\n<li>擔保：中小企業信保基金保證<b>9.5成</b>，免徵其他擔保品；免徵保證人。</li>\n<li>限制：票據拒絕往來、聯徵有債務逾期/延滯達3個月以上/信用卡遭強制停卡未清償者不得辦理。</li>\n<li>積欠本息達<b>6個月</b>停止補貼息；審查期間應於<b>14日內</b>完成撥貸；再次申貸以<b>2次</b>為限。</li>\n</ul>\n<h4>第四節 民宿貸款</h4>\n<ul>\n<li>對象：民宿管理辦法之民宿經營者（含個人及企業），不以取得民宿登記證為限。</li>\n<li>額度：未提供不動產第一順位者，額度不超過興建/投資計畫成本<b>70%</b>；購置不動產供民宿使用之買賣案件可依成交價最高<b>85成</b>；抵押權以總額度<b>1.2倍</b>設定。</li>\n<li>期限：資本支出最長<b>15年</b>、經常性週轉金最長<b>5年</b>、代償過渡性融資（Bridge Loan）最長<b>15天</b>。</li>\n<li>償還：中長期寬限期最長<b>3年</b>；依企業戶徵授信程序辦理，須注意DBR22倍。</li>\n</ul>\n<h4>第五節 個人非消費性投資貸款</h4>\n<ul>\n<li>對象：信用正常具償還能力之本國國民及奉准在國內投資之華僑/外僑。</li>\n<li>期限：最長<b>7年</b>。</li>\n<li>擔保：以所購財產或適當擔保品設定第一順位抵押權或質權；保證人為殷實連帶保證人<b>1人以上</b>。</li>\n</ul>\n<h4>第六節 青年創業及啟動金貸款（僅適用2025/6/30前核貸案件）</h4>\n<ul>\n<li>對象：依法登記/立案未滿<b>5年</b>之事業，負責人年滿<b>18至45歲</b>；設戶籍國民須受創業輔導課程至少<b>20小時或2學分</b>；以負責人名義申貸者出資額須占實收資本額<b>20%以上</b>。</li>\n<li>額度：準備金及開辦費<b>200萬元</b>、週轉性支出<b>400萬元</b>、資本性支出<b>1,200萬元</b>；不得循環動用、不得借新還舊。</li>\n<li>期限：準備金/週轉性最長<b>6年（寬限期最長1年）</b>；機器設備軟體最長<b>7年（寬限期最長2年）</b>；廠房營業場所最長<b>15年（寬限期最長3年）</b>。</li>\n<li>利率：中華郵政2年期定儲機動利率加<b>0.575%</b>。</li>\n<li>保證：個人名義申貸歸戶<b>100萬元（含）以下不得徵提保證人</b>，逾100萬元得徵1位。</li>\n</ul>"},{"id":"credit-s1p5-c2","t":"第五十三章 消費者貸款","fc":"C","fq":"5年約7題（每年約1題）· C級","h":"<h4>第一節 作業通則</h4>\n<ul>\n<li>房貸轉貸/買賣代償無法3營業日內取得清償證明但能1個月內取得者，先以「N8：房屋代償（墊）款」（短期放款）貸放，塗銷前順位後改擔保放款。</li>\n<li>資金用途屬「投資理財」者，須填投資說明暨聲明書，且非購買投資型保險或具解約金保險商品。</li>\n<li>經理權限案件：「借戶總放款支出所得比」逾<b>70%</b>或「借戶無擔保支出所得比」逾<b>35%</b>者，應敘明承做理由。</li>\n<li><b>銀行法第12條之1</b>：辦理自用住宅放款及消費性放款不得要求提供連帶保證人；已取得足額擔保不得要求提供保證人；徵取保證人應以一定金額為限，求償應先就借款人求償。</li>\n<li><b>銀行法第12條之2</b>：自用住宅/消費性放款之保證契約有效期間<b>不得逾15年</b>（保證人書面同意者除外）。</li>\n<li>「自用住宅放款」定義：完全行為能力之中華民國國民，目前確無自用住宅、為購置自住使用之住宅所為貸款；「消費性放款」：房屋修繕、耐久性消費財（含汽車）、學費、小額貸款及信用卡循環信用。</li>\n<li>足額擔保案件除借款人主動提供一般保證人外不得誘使提供；主動提供須自書名為「申請書」之書件。</li>\n<li>借款期限逾<b>15年</b>且有一般保證人者，須由保證人親填保證期間。</li>\n<li>個人購屋貸款「擔保物權連結條款」：購屋貸款設定之最高限額抵押權僅擔保該購屋貸款契約債務；第一順位設定金額為原購屋貸款額度<b>1.2倍</b>；其他貸款超逾原購屋額度須設定第二順位；同意書擔保債務種類限「借款、墊款、透支、貼現」。</li>\n<li>「高齡客戶」指年滿<b>65歲（含）以上</b>；受理時應填「高齡客戶暨友善金融服務評估表」評估有無金融剝削。</li>\n</ul>\n<h4>房貸業務通則（央行管控）</h4>\n<ul>\n<li>受理房貸應提供「房屋貸款特別提醒事項」及徵「房屋擔保貸款切結書」。</li>\n<li><b>購置高價住宅貸款</b>：臺北市鑑價/買賣金額<b>7千萬元以上</b>、新北市<b>6千萬元以上</b>、其餘縣市<b>4千萬元以上</b>；成數<b>不得逾較低者3成</b>、<b>不得申請寬限期</b>、不得以經理權限核定。</li>\n<li><b>自然人第2戶</b>（名下已有1戶房屋抵押）：成數<b>不得逾6成</b>、不得申請寬限期。</li>\n<li><b>自然人第3戶（含）以上</b>：成數<b>不得逾3成</b>、不得申請寬限期。</li>\n<li>先買後賣換屋族協處：第1戶撥款後<b>18個月內</b>出售原有房屋並完成移轉；違反則取消寬限期、收回超成數差額、溯自撥款日改按原利率<b>加1%</b>計息；撥貸後<b>6/12/16個月</b>分三次追蹤。</li>\n<li>購地貸款（住宅區/商業區土地）：額度不得超過土地取得成本與鑑價較低者<b>5成</b>。</li>\n<li>央行管控案件三時點查核：申請、撥貸當日、貸放後3個月，並提供自籌款來源證明。</li>\n<li>展延寬限期：「持有多筆房產」（名下設定住宅用不動產<b>超過2間</b>）、還本後多次增貸（<b>超過兩次</b>）者不得再申請；其餘展延每次<b>1年</b>。</li>\n</ul>\n<h4>信貸通則</h4>\n<ul>\n<li>DBR22倍：撥貸前查聯徵B68並填計算表。</li>\n<li>防杜代辦貸款：不得受理代辦公司轉介案件；新往來借款人近<b>3個月</b>聯徵被查詢達<b>5次（含）以上</b>須說明原因。</li>\n<li>年輕族群（<b>18歲以上未滿20歲</b>）須徵「消費性貸款相關權利義務告知書」；審核權限最高<b>10萬元</b>。</li>\n</ul>\n<h4>其他應注意事項</h4>\n<ul>\n<li>電話行銷禁止：不得於<b>晚上9點後或早上9點前</b>行銷、不得主動對<b>65歲以上高齡客戶</b>電話行銷無擔保貸款。</li>\n<li>對保日期順序：核准日≦立據日≦對保日；契約攜回審閱日須早於立據日<b>5日以上</b>。</li>\n<li>循環額度案件應於核准後<b>2個月內</b>徵妥契約，逾期作廢。</li>\n<li>指標利率調整未約定告知方式者，利率調整後<b>15日內</b>書面通知。</li>\n</ul>\n<h4>第二節 購置不動產貸款</h4>\n<ul>\n<li>額度：在臺無住所大陸地區人民成數以鑑估價值<b>5成</b>為上限；未成年人擔任借款人成數以<b>5成</b>為上限。</li>\n<li>期限：住宅用最長<b>30年</b>；商業/工業/其他不動產最長<b>20年</b>；「前低後高-定額本金」限定<b>30年</b>。</li>\n<li>還本寬限期：貸款期限<b>六分之一</b>內、最長<b>5年</b>；「前低後高-定額本金」寬限期最長<b>3年</b>（借款人年齡須<b>40歲以下</b>且限自用住宅）。</li>\n<li>30年「前低後高-定額本金」本金分段攤還比例：1-10年<b>10%</b>、11-18年<b>25%</b>、19-24年<b>30%</b>、25-30年<b>35%</b>。</li>\n<li>整批房貸同一建築案承貸總金額達<b>1億元（含）以上</b>須填報告書送區域中心查核，承作戶數以不高於總戶數<b>5成</b>為原則。</li>\n</ul>\n<h4>第三節 公教人員第二順位抵押權購建住宅貸款</h4>\n<ul>\n<li>對象：已在其他金融機構辦理第一順位抵押權之公教人員。</li>\n<li>期限：最長<b>20年</b>；還本寬限期最長<b>3年</b>；追加設定<b>第二順位</b>抵押權予本行。</li>\n</ul>\n<h4>第四節 法拍屋、金拍屋、銀拍屋優惠貸款</h4>\n<ul>\n<li>標的須為點交案件、建物用途登記「住」或「商」；額度不得超過當次拍賣底價。</li>\n<li>無擔保代墊款原則<b>3個月內</b>設定第一順位，得排除DBR22倍限制；最長<b>3個月</b>；至少徵一般保證人<b>1人</b>及備付本票。</li>\n</ul>\n<h4>第五節 在臺無住所外國人新臺幣放款</h4>\n<ul>\n<li>對象：未取得我國外僑居留證之外國自然人（含華僑），應親自辦理。</li>\n<li>擔保：以擔保放款為限，提供不動產第一順位抵押權；外國文件須經驗證。</li>\n<li>期限：最長<b>20年</b>；還本寬限期最長<b>3年</b>；每案達<b>3千萬元</b>須填報資料表。</li>\n</ul>\n<h4>第六節 房屋增改建、裝修貸款</h4>\n<ul>\n<li>須徵取增改建/裝修證明文件，貸款額度不得逾證明文件所載金額。</li>\n<li>期限：最長<b>20年</b>；還本寬限期最長<b>3年</b>。</li>\n</ul>\n<h4>第七節 消費性擔保貸款</h4>\n<ul>\n<li>期限：最長<b>20年</b>；還本寬限期最長<b>3年</b>；屬銀行法12條之1案件不得徵提保證人（主動提供除外）。</li>\n</ul>\n<h4>第八節 貸款衍生人身保險保費融資貸款</h4>\n<ul>\n<li>借款人、要保人與被保險人須為同一人；借款人為利害關係人者本貸款與其他消費者無擔保貸款合計不得逾<b>180萬元</b>。</li>\n<li>期限：擔保貸款最長<b>30年</b>（不得適用寬限期）；信用貸款未設抵押權者最長<b>10年</b>。</li>\n<li>非本國國民不得辦理躉繳保費融資。</li>\n</ul>\n<h4>第九節 「樂活貸」循環型房貸</h4>\n<ul>\n<li>對象：經房貸信評評定「低風險等級」，且為高資產客戶、專業投資人或<b>年收入50萬元（含）以上</b>客群。</li>\n<li>契約期限：以<b>3年</b>為一期（高資產/專業投資人承作信託商品得<b>5年</b>一期），屆期得續約。</li>\n<li>繳息：利息每月<b>20日</b>結息、<b>21日</b>扣繳。</li>\n<li>限制：登記總面積<b>15坪以下</b>套房、空地/農地等不得申請；央行管控案件不得適用。</li>\n</ul>\n<h4>第十節 停車位貸款</h4>\n<ul>\n<li>額度：每個停車位最高<b>120萬元</b>；兼具土地及建物者不超過鑑價<b>7成</b>、僅具建物所有權者<b>6成</b>、購買停車權利者不超過實際成交價<b>5成</b>。</li>\n<li>期限：最長<b>15年</b>。</li>\n</ul>\n<h4>第十一節 逆向抵押貸款「安心貸」</h4>\n<ul>\n<li>對象：年滿<b>60歲</b>、信用良好、國內設住所之本國國民。</li>\n<li>擔保與成數：借款人單獨持有土地及建物第一順位抵押權，排除<b>15坪以下</b>套房；A級且雙北<b>70%</b>、A級（非雙北）<b>65%</b>、B級<b>60%</b>、C/D級<b>50%</b>；抵押權設定金額按貸放限額<b>1.4倍</b>。</li>\n<li>貸款期限：貸款期間加計借款人年齡合計<b>不得低於95</b>，且最長<b>35年</b>。</li>\n<li>撥款：依貸款總額平均按月定額撥付；借款人死亡契約終止停止撥款。</li>\n<li>償還：本金到期一次清償；利息按月繳，當月收取上限為月撥付金額<b>1/3</b>（餘掛帳於到期一次收取）。</li>\n<li>諮詢：原則會同配偶、子女、通知義務人辦理律師諮詢；通知義務人於借款人死亡翌日起<b>20個營業日內</b>通知本行。</li>\n<li>貸放後管理：每半年訪查借款人一次；屆期展延最長<b>5年</b>。</li>\n</ul>\n<h4>第十三節 黃金存摺業務質借新臺幣</h4>\n<ul>\n<li>鑑價取「承作前一營業日買入收盤價」與「最近三個曆月買入收盤平均價」孰低。</li>\n<li>質借金額：最低<b>10萬元</b>、最高不得逾鑑價金額<b>7成</b>。</li>\n<li>擔保維持率不低於<b>130%</b>；期限最長<b>1年</b>、非循環。</li>\n<li>市值低於貸放餘額<b>130%</b>通知補足（不超過<b>5個營業日</b>）；低於<b>115%</b>應實行質權出賣。</li>\n</ul>\n<h4>第十四節 自行特定金錢信託受益權質借</h4>\n<ul>\n<li>對象：專業投資人、高資產客戶。</li>\n<li>貸款成數：風險等級RR1~RR4最高<b>5成</b>、RR5最高<b>4成</b>。</li>\n<li>質借金額：新臺幣最低<b>100萬元</b>、外幣最低等值美金<b>3萬元</b>；期限最長<b>1年</b>。</li>\n<li>擔保維持率低於<b>140%</b>通知補足、低於<b>120%</b>處分擔保品；不得徵取保證人。</li>\n</ul>\n<h4>第十五節 本行員工優惠貸款</h4>\n<ul>\n<li>對象：一職等以上在職正式員工及其配偶。</li>\n<li>額度：擔保貸款配偶非員工者合計最高<b>1,500萬元</b>，配偶亦為員工者二人合計<b>1,800萬元</b>；無擔保貸款每一員工最高<b>180萬元</b>，須符DBR22倍。</li>\n<li>員工不得以無擔保方式辦理循環型貸款；央行管控購屋案件不得以優惠利率辦理。</li>\n</ul>\n<h4>第十六節 消費性無擔保貸款</h4>\n<ul>\n<li>利害關係人與其他消費者無擔保貸款合計不得逾<b>180萬元</b>；DBR依信評分級最高倍數：1~6等<b>22</b>、7等<b>20</b>、8等<b>19</b>、9等<b>18</b>、10等<b>16</b>、11~13等<b>15</b>。</li>\n<li>期限：最長<b>7年</b>；原則免徵保證人。</li>\n</ul>\n<h4>第十七節 第e學苑貸</h4>\n<ul>\n<li>額度：學生本人名義最高<b>20萬元</b>、學生親屬名義最高<b>30萬元</b>、海外工作生活體驗最高<b>15萬元</b>。</li>\n<li>期限：最長<b>2年</b>，可隨時提前償還免違約金；免擔保品、免保人。</li>\n</ul>\n<h4>第十八節 「樂活信貸」循環型無擔保貸款</h4>\n<ul>\n<li>額度：最高循環額度——特選/優質/薪轉第一級客戶為平均月收入<b>10倍</b>、薪轉第二級<b>8倍</b>、其餘<b>6倍</b>。</li>\n<li>契約期限：以<b>1年</b>為一期；動用有餘額之日數不得連續<b>365天以上</b>。</li>\n<li><b>銀行法第32條利害關係人（含本行員工）不得辦理本項貸款</b>。</li>\n</ul>\n<h4>第十九節 「iLEO」無擔保貸款</h4>\n<ul>\n<li>額度：「大桶金」<b>16-300萬元</b>、「小桶金」<b>3-15萬元</b>；大桶金依信評分級DBR最高倍數1~6等22、7等20、8等19、9等18、10等<b>14</b>、11~12等<b>10</b>（13等婉拒）。</li>\n<li>期限：大桶金最長<b>7年</b>；小桶金最短<b>6個月</b>、最長<b>5年</b>。</li>\n<li>免徵保證人；免辦關係戶授信額度歸戶。</li>\n</ul>"},{"id":"credit-s1p6-c1","t":"第五十四章 授信貸放後管理業務通則","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>授信覆審的定義與目的</h4>\n<ul>\n<li>授信覆審是授信業務的<b>事後追蹤考核</b>，目的在瞭解授信戶能否按原訂授信計畫妥善運用、切實履行契約及約定事項。</li>\n<li>積極目的：維護確保授信資產品質、避免或減少逾期放款，並提供修正授信政策之參考。</li>\n</ul>\n<h4>授信覆審工作要點</h4>\n<ul>\n<li>會計師簽發保留、否定或無法表示意見之案件，准貸時應加強後續覆審追蹤。</li>\n<li>覆審人員<b>不得覆審本身經辦之授信案件</b>，每案覆審後應編製覆審報告。</li>\n<li>追蹤查核項目：直接授信查核資金實際用途是否與申貸用途相符；配合交易行為之週轉資金貸款追蹤查核交易行為是否實在；分期償還企業授信隨時查核產銷及獲利能力；無追索權應收帳款承購注意買方付款是否嚴重逾期。</li>\n</ul>\n<h4>授信覆審作業（覆審頻率為考點）</h4>\n<ul>\n<li>營業單位應於覆審結束後<b>3個營業日內</b>完成「授信覆審表」及「授信覆審工作報告」。</li>\n<li>「額度增貸戶」係指授信戶總授信歸戶金額較<b>前12個月</b>增加者。</li>\n<li>免辦覆審：擔保授信金額新台幣<b>壹仟萬元(含)以下</b>、海外無擔保美金壹萬元以下、十成送保、拆放同業、政府機構授信等。</li>\n<li><b>大額覆審戶</b>：總授信歸戶達新台幣<b>貳億元(含)以上</b>，或無擔保授信達<b>伍仟萬元(含)以上</b>；新貸/增貸戶於次月底前覆審一次，嗣後<b>每6個月</b>一次；信評第1至7等企業戶<b>每12個月</b>一次；重要個案每半年實地覆審一次。</li>\n<li><b>風險較高覆審戶</b>：信評第10-13等、已拒往或最近三個月退票未清償、最近三年連續虧損或淨值為負、申請展期未清償、預警戶等；次月底前覆審一次，其後<b>每6個月</b>一次。</li>\n<li><b>一般覆審戶</b>：新貸/增貸戶次月底前覆審一次，續貸或額度存續期間內每<b>18個月</b>至少一次；信評1至7等免再辦。</li>\n<li>國內信用卡、現金卡或信用貸款至少<b>每半年</b>由業管單位辦理期中管理。</li>\n</ul>\n<h4>預警作業</h4>\n<ul>\n<li>預警業務目的在<b>防止逾放新案發生</b>；在借戶尚未有不良紀錄時發現轉壞現象，及早採取行動計畫。</li>\n<li>預警戶定義：有EW1-EW5事項之一，且評估在<b>未來12個月內</b>可能發生還款違約者。</li>\n<li>排除：消費性貸款、或總授信歸戶金額國內分行新台幣<b>30萬元(含)以下</b>。</li>\n<li>通報時限：自應歸類為預警戶起<b>二個營業日內</b>通報；預警小組應於每月<b>15日以前</b>召開會議一次。</li>\n<li>預警戶解除：經追償後繳清或和解履約者，須列入觀察<b>三個月</b>且履償正常。</li>\n<li>預警徵兆五大分類：EW1產業及競爭地位、EW2經營者或管理階層、EW3財務報表、EW4現金流量或還款來源、EW5往來績效或風險（如本息逾期5天以上、退票、外部信評遭調降至Moody's Ba3/S&amp;P BB-以下、上市櫃股價最近一個月跌30%或一年跌50%、CDS達300bps以上）。</li>\n</ul>\n<h4>追償業務通則（早期問題貸款）</h4>\n<ul>\n<li>營業單位經理應指派專人辦理本金或利息<b>逾期1日以上</b>授信逾期案件之電、函催及訪催。</li>\n<li>M0~M2監控分級：全案授信餘額未達1,000萬元線上陳核至經理；1,000萬元(含)以上放行至區域中心；2,000萬元(含)以上放行至債權管理處。</li>\n</ul>"},{"id":"credit-s1p6-c2","t":"第五十五章 不良授信債權管理通則","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>辦理保全程序自聲請起至執行止應<b>嚴守秘密</b>，避免為借保戶察覺。</li>\n<li>不良授信：逾期授信及雖未屆清償期但債權已失安全性、如期收回顯有困難之授信。</li>\n<li>進口即期信用狀貨運單據到達經通知後<b>15日</b>（貨物未到達為<b>30日</b>）未清償列為不良授信；出口拒付案件未於<b>一個月內</b>解決者。</li>\n<li>未屆清償期但債務人有受拒往、破產宣告、強制執行、假扣押、聲請重整、死亡、未依約繳息等情形亦屬不良授信。</li>\n<li>公司法第282條重整聲請人：繼續<b>6個月以上持有已發行股份10%以上</b>股東、相當於已發行股份金額<b>10%以上</b>之公司債權人、工會、<b>三分之二以上</b>受雇員工。</li>\n<li>大額授信違約通報：單一公司授信新臺幣<b>一億元(含)以上</b>且本息逾期一個月新發生違約；或集團授信曝險合計逾<b>五億元</b>以上。</li>\n</ul>"},{"id":"credit-s1p6-c3","t":"第五十六章 不良授信建檔管理","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>催收人員接辦逾放後應搜集資料建檔：戶籍謄本查生存/住址；不動產擔保品接管當日及嗣後<b>至少每年一次</b>評估市價登錄逾催系統。</li>\n<li>檔案編號依轉催年度冠年度別按序編號，一戶一檔；催收主管<b>每半年</b>應定期檢視債權憑證時效。</li>\n<li>逾期放款(含呆帳)檔案卷宗在全案債權未收回或結案前不得任意棄置或銷毀。</li>\n</ul>"},{"id":"credit-s1p6-c4","t":"第五十七章 不良授信之催討","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>緊急處理措施</h4>\n<ul>\n<li>存款抵銷：應以<b>存證信函雙掛號</b>表示抵銷意思並通知債務人（民法第334-342條）。</li>\n<li>支票存款抵銷應同時或先行終止支票存款往來契約。</li>\n<li>存款被扣押後，本行債權若在扣押前取得者仍得抵銷。</li>\n<li>對非連帶保證人，應於對借戶財產強制執行無結果後方得抵銷該保證人存款。</li>\n</ul>\n<h4>一般催討程序</h4>\n<ul>\n<li>暫緩訴追仍應依消滅時效規定辦理時效中斷手續。</li>\n<li>全案授信逾<b>新臺幣3,500萬元</b>以上案件催討有進展時應隨時報告債權管理處。</li>\n<li>中小企業信保基金保證授信，於到期屆滿<b>五個月</b>、依法訴追取得執行名義後通知該基金履行保證責任。</li>\n<li>銀行法第12條之1：求償應先向借款人追償，保證人有數人先平均求償（取得執行名義或保全程序不在此限）。</li>\n<li>借款人死亡：繼承人均拋棄繼承成無人承認之繼承，遺產管理人選定後報明債權，公示催告公告期間（<b>依法一年以上</b>）屆滿辦理請領分配。</li>\n</ul>\n<h4>催收作業要點（分工與轉列時點）</h4>\n<ul>\n<li>營業單位辦理逾放戶全案授信餘額<b>未達1億元</b>案件催收；達<b>1億元(含)以上</b>移交債權管理處/區域中心。</li>\n<li>擬移交案件營業單位原則上應於新發生逾期放款<b>3個月內</b>移交，移交前辦妥保全程序並轉列催收款項。</li>\n<li>轉列催收款項：應於<b>逾期3個月內</b>轉列催收款項；暫緩合計不得超逾清償期屆滿<b>6個月</b>。</li>\n<li>擬轉列催收款項全案授信餘額達<b>3,500萬元(含)以上</b>須申請債權管理處同意。</li>\n<li>函催：借保戶逃匿或本息<b>逾期15日以上</b>未清償，應立即以雙掛號寄發書面催繳函。</li>\n<li>保全程序提存擔保金以無實體公債為原則；以現金辦理存出保證金超過<b>50萬元</b>須事先申請債權管理處核准。</li>\n<li>大額逾放：全案授信餘額達<b>3,500萬元(含)以上</b>，至少每季共同檢討；營業單位於接管日起<b>七個營業日內</b>研擬處理步驟並按月書面呈報。</li>\n</ul>\n<h4>免擔保消費性貸款/信用卡逾期作業</h4>\n<ul>\n<li>逾期金額未達<b>50萬元</b>且無不動產者，得免辦保全程序。</li>\n<li>逾期金額達<b>10萬元以上(含)</b>者，得於利息請求權時效期間內（<b>自逾期日起5年內</b>）發支付命令或起訴。</li>\n<li>逾期3個月以上經催繳無結果或債務人死亡、破產等得轉銷呆帳。</li>\n<li>信用卡逾3個月未繳付：正附卡強制停卡；信用卡每戶轉銷超過<b>30萬元</b>須送董事會稽核處查明。</li>\n</ul>\n<h4>消債條例</h4>\n<ul>\n<li>消債條例適用：5年內未從事營業活動，或從事小規模營業活動且營業額平均每月新臺幣<b>20萬元以下</b>之自然人。</li>\n<li>債權表異議：應自債權表送達翌日起<b>10日內</b>提出；對裁定不服應於送達<b>10日內</b>抗告。</li>\n<li>更生撤銷：法院認可更生方案後發現虛報債務、隱匿財產，得於認可後<b>一年內</b>聲請撤銷。</li>\n<li>前置協商/調解：各審查層級應自收件日起<b>二個日曆天內</b>完成審批；總債權金額<b>3,000元以下(含)</b>者得不回報債權。</li>\n</ul>"},{"id":"credit-s1p6-c5","t":"第五十八章 逾期放款之帳務處理","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<ul>\n<li>逾期放款應於<b>清償期屆滿六個月內</b>轉入催收款項；應收保證款於墊支日起算<b>6個月內</b>轉入。</li>\n<li>轉列催收款項金額達新臺幣<b>3,500萬元以上</b>須事先申請債權管理處核准。</li>\n<li>轉入催收款項後<b>對內停止計息，對外債權照常計息</b>。</li>\n<li>債權轉銷應經<b>董事會決議通過</b>並函報審計委員會。</li>\n<li>疑似洗錢/資恐交易經專責主管核定後<b>二個營業日內</b>向法務部調查局申報。</li>\n<li>償還問題放款單筆達新臺幣<b>300萬元(含)以上</b>須鍵入還款來源。</li>\n</ul>\n<h4>資產評估損失準備提列（核心考點）</h4>\n<ul>\n<li>不良授信資產五分類：</li>\n<ul>\n<li><b>第一類 正常</b>：提存<b>1%</b>（扣除對政府債權後）。</li>\n<li><b>第二類 應予注意</b>：有足額擔保且逾期<b>1個月至12個月</b>；或無擔保且逾期<b>1個月至3個月</b>→提存<b>2%</b>。</li>\n<li><b>第三類 可望收回</b>：有足額擔保且逾期<b>超過12個月</b>；或無擔保且逾期<b>3個月至6個月</b>→提存<b>10%</b>。</li>\n<li><b>第四類 收回困難</b>：無擔保且逾期<b>6個月至12個月</b>→提存<b>50%</b>。</li>\n<li><b>第五類 收回無望</b>：無擔保且逾期<b>超過12個月</b>；或評估無法收回→提存<b>100%</b>。</li>\n</ul>\n<li><b>逾期放款定義：積欠本金或利息超過清償期三個月</b>，或雖未超過三個月但已向主從債務人訴追或處分擔保品。</li>\n<li>協議分期償還放款：依協議條件履行達<b>六個月以上</b>且協議利率不低於原利率得免列報逾期放款。</li>\n<li>協議一定條件：短期放款每年償還本息<b>10%以上</b>、最長<b>5年</b>；中長期放款分期期限以原殘餘年限<b>二倍</b>為限、最長不超過<b>30年</b>。</li>\n<li><b>轉銷呆帳條件（四款）</b>：(1)債務人解散、逃匿、和解、破產宣告致債權不能收回；(2)擔保品及財產鑑價甚低或執行無實益；(3)多次減價拍賣無人應買且本行無承受實益；(4)逾期放款及催收款<b>逾清償期二年</b>經催收仍未收回。</li>\n<li>銀行法第33條金額以上案件轉銷，應經<b>三分之二以上董事出席及出席董事四分之三以上同意</b>。</li>\n</ul>"},{"id":"credit-s1p6-c6","t":"第五十九章 消滅時效（必考重點）","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<h4>各項請求權之消滅時效</h4>\n<ul>\n<li>票據追索時效（票據法第22條）：</li>\n<ul>\n<li>對<b>匯票承兌人及本票發票人</b>自到期日起算<b>三年</b>；對<b>支票發票人</b>自發票日起算<b>一年</b>。</li>\n<li>對匯票及本票<b>背書人</b>自作成拒絕證書日起算<b>一年</b>；對支票背書人<b>四個月</b>（免除作成拒絕證書者，匯票本票自到期日起算、支票自提示日起算）。</li>\n<li>票據債權因時效或手續欠缺而消滅者，得向發票人或承兌人於其所受利益限度提起<b>利得償還之訴</b>。</li>\n</ul>\n<li>借據<b>本金請求權時效15年</b>，<b>利息請求權時效5年</b>（民法第125、126條）。</li>\n</ul>\n<h4>消滅時效完成之效果</h4>\n<ul>\n<li>時效完成後債務人得拒絕給付；債務人仍履行給付者不得以不知時效請求返還（民法第144條）。</li>\n<li>以抵押權、質權或留置權擔保之請求權雖經時效消滅，債權人仍得就抵押物取償，但利息請求權不適用（民法第145條）。</li>\n<li><b>抵押權人於所擔保債權消滅時效完成後五年間不實行抵押權者，其抵押權消滅（民法第880條）</b>。</li>\n<li>主權利因時效消滅者效力及於從權利（民法第146條）。</li>\n</ul>\n<h4>中斷時效之方法（民法第129條）</h4>\n<ul>\n<li><b>請求</b>：不以訴訟行使權利之意思表示（催告函、存證信函）；請求後<b>六個月內不起訴</b>視為不中斷（民法第130條）。</li>\n<li><b>承認</b>：債務人表示承認權利存在；有承認效力情形：一部清償、支付利息、提供擔保、請求緩期清償或分期攤還（應徵求保證人同意）。</li>\n<li><b>起訴</b>：以訴狀提出於法院時生中斷效力；撤回訴或因不合法駁回確定視為不中斷（民法第131條）。</li>\n<li><b>與起訴有同一效力之事項</b>：聲請發支付命令（撤回、駁回或失效視為不中斷）；聲請調解或提付仲裁；申報和解債權或破產債權；告知訴訟（訴訟終結後六個月內不起訴視為不中斷）；開始執行行為或聲請強制執行。</li>\n<li>時效中斷後重行起算依原權利性質定其長短；但<b>經判決確定之請求權，消滅時效不滿五年者延長為五年</b>（民法第137條）。</li>\n<li>票據完成時效者應徵取票據債務承認書；無法徵取時提起利得償還之訴；授信所徵本票可依消費借貸一般債權（時效15年）提起返還借款之訴。</li>\n</ul>"},{"id":"credit-s1p6-c7","t":"第六十章 保全程序","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li><b>假扣押</b>：對金錢請求，為保全將來強制執行，聲請禁止債務人處分財產。</li>\n<li><b>假處分</b>：對金錢請求以外之請求，聲請禁止變更訟爭物現狀。</li>\n<li>假扣押裁定得向本案管轄法院或假扣押標的物所在地地方法院聲請（民訴第524條）。</li>\n<li>債務人得提供擔保聲請撤銷假扣押裁定。</li>\n<li>債權人收受假扣押/假處分裁定後<b>已逾三十日者不得聲請執行</b>（強執法第132條）。</li>\n<li>執行費為執行標的金額之<b>0.8%</b>。</li>\n<li>假扣押標的物已有他債權人聲請強制執行時，應於拍賣或變賣終結之日<b>一日前</b>聲明參與分配。</li>\n<li>提存擔保物應於提供擔保原因消滅之翌日起<b>十年內</b>聲請返還，逾期歸屬國庫（提存法第18條）。</li>\n<li>本案敗訴確定取回提存物：應先以存證信函催告受擔保利益人於<b>二十日以上</b>期間行使權利後，聲請法院裁定返還。</li>\n</ul>"},{"id":"credit-s1p6-c8","t":"第六十一章 訴訟程序","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<h4>督促程序</h4>\n<ul>\n<li>支付命令：debtor不於送達後<b>二十日不變期間</b>內提出異議，支付命令得為執行名義（民訴第508、518、521條）。</li>\n<li>支付命令不能送達債務人，歷經<b>三個月</b>仍不能送達者失其效力（民訴第515條）。</li>\n<li>債務人提出異議，支付命令失效，以聲請視為起訴或聲請調解。</li>\n</ul>\n<h4>小額與簡易訴訟</h4>\n<ul>\n<li>小額訴訟：標的金額<b>新台幣十萬元以下</b>；<b>五十萬元以下</b>得經當事人合意適用（民訴第436條之8）。</li>\n<li>簡易訴訟：財產權訴訟標的金額<b>新台幣五十萬元以下</b>；票據請求不論金額一律適用（民訴第427條）。</li>\n</ul>\n<h4>一般訴訟程序</h4>\n<ul>\n<li>起訴應將借保戶全體（含連帶保證人）或繼承人一併列被告。</li>\n<li>擔保授信原則得以非訟事件聲請拍賣抵（質）押物裁定；不足清償部分提起民事訴訟。</li>\n<li>訴訟原則以總行名義為當事人。</li>\n<li>敗訴擬上訴應於判決送達後<b>二十日不變期間</b>內提出上訴狀；第三審上訴理由書應於提起上訴後<b>二十日內</b>提出。</li>\n</ul>"},{"id":"credit-s1p6-c9","t":"第六十二章 終局執行程序","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<h4>執行名義</h4>\n<ul>\n<li>執行名義種類（強執法第4條）：確定終局判決、假執行裁判、支付命令及確定證明書、和解/調解筆錄、公證書、拍賣抵押物/質物裁定、本票裁定、債權憑證等。</li>\n<li>本票得聲請本票裁定、發支付命令或起訴（票據法第123條）。</li>\n<li>對票據債務人（含背書人）應以起訴取得執行名義；對本票發票人得聲請本票裁定。</li>\n</ul>\n<h4>執行</h4>\n<ul>\n<li>拍賣底價低於本行抵押權設定金額<b>七成以下</b>者應事先申請總行審核。</li>\n<li><b>動產執行</b>：查封日至拍賣日至少留<b>七日</b>；再拍賣最高價不足底價<b>50%</b>，作價交債權人承受。</li>\n<li><b>不動產執行</b>：第一次拍賣日距公告不得少於<b>十四日</b>；再拍賣酌減不得逾<b>20%</b>；二次減價拍賣未拍定得公告<b>三個月內</b>應買（特別變賣，強執法第95條）。</li>\n</ul>\n<h4>參與分配</h4>\n<ul>\n<li>有擔保物權或優先受償權債權人不問債權已否屆清償期應聲明參與分配。</li>\n<li>聲明參與分配時期：拍賣/變賣/承受之日<b>一日前</b>；逾期僅得就分配餘額受清償（強執法第32條）。</li>\n<li>分配表異議：應於分配期日<b>一日前</b>提出書狀聲明異議；異議人須自分配期日起<b>十日內</b>起訴並向執行處證明。</li>\n</ul>\n<h4>債權憑證</h4>\n<ul>\n<li>債務人無財產可執行時聲請債權憑證；發給債權憑證時執行行為即為終結，<b>中斷之時效重行起算</b>，應在時效消滅前聲請再核發，次數無限制。</li>\n<li>拍賣抵押物裁定執行不足清償時不得聲請發給債權憑證，須另取得執行名義。</li>\n<li>動產擔保交易登記有效期間非時效期間，不因起訴或強制執行中斷；應於屆至<b>三十日前</b>申請延長登記。</li>\n</ul>\n<h4>投標承受</h4>\n<ul>\n<li>標得/承受不動產或動產應自所有權完成登記之日起<b>四年內</b>處分；交易對象為利害關係人或金額在<b>新台幣一億元以上</b>應報經董事會核准。</li>\n<li>投標/承受價格以時價<b>八成以下</b>為原則。</li>\n</ul>"},{"id":"credit-s1p6-c10","t":"第六十三章 呆帳轉銷","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>轉銷呆帳條件同四款（解散逃匿和解破產、執行無實益、多次減價無人應買、逾清償期二年）。</li>\n<li>轉銷應經<b>董事會決議通過</b>並函報審計委員會。</li>\n<li>催收人員於轉銷當日及<b>至少每年檢視一次</b>分類妥當性。</li>\n<li>收回呆帳：辦理呆帳攤還交易並登載呆帳登記簿。</li>\n<li>墊支<b>逾2年</b>或經積極催討仍無法收回之催收費用，申請核准後以「其他什項支出」開支並繼續催討。</li>\n</ul>\n<h4>轉銷呆帳後管理（A/B分類為考點）</h4>\n<ul>\n<li><b>A類</b>：有收回來源（尚有擔保物、假扣押物、其他財產、保證機構尚未代償、協議攤還款）；或尚未完成法催程序。</li>\n<li><b>B類</b>：已無收回來源（含無執行實益）且法催程序均已完成。</li>\n<li>A類應辦事項：每<b>3個月</b>檢討處理進度，至遲<b>1年內</b>進行訴追、強制執行及取得債權憑證；每年查詢財產辦抵銷；轉銷逾<b>3年</b>且擔保品未處分完畢提報處理現況。</li>\n<li><b>換發債權憑證：每5年內換發一次（本票裁定之債權憑證為每3年內一次）</b>。</li>\n<li>B類應辦事項：每年查詢財產辦抵銷；每5年內（本票裁定每3年內）換發債權憑證。</li>\n</ul>"}]},{"t":"信保基金（作業手冊 114.6 版＋待修訂彙總表 115.10）","chs":[{"id":"sg-1","t":"壹、信用保證之申請方式暨送保程序","fc":"","fq":"","h":"<h4>取得信用保證之方式</h4><ul><li>三大類：<b>間接保證</b>（含先取得查覆書之<b>批次保證</b>）、<b>直接保證</b>、<b>相對保證</b>；不論何種方式，皆需透過授信單位完成送保程序。</li><li>間接保證：企業向授信單位申貸，由授信單位向基金申請；先取得<b>保證書</b>始能送保。</li><li>直接保證：企業直接向基金申請，核發<b>承諾書</b>後再向授信單位融資；資本性支出不得超過營運計畫所需經費之<b>八成</b>。</li><li>相對保證：合作單位與基金<b>共同出資</b>，企業原則上先向合作單位申請。</li><li>授信單位辦理信保案件以<b>先行辦理徵信</b>為必要條件；送保與未送保之授信應為<b>同一之注意</b>。</li></ul><h4>間接保證送保流程</h4><ul><li>授信前先填「間接保證額度申請書」，基金以附保證案號之「<b>保證書</b>」回覆；續約時應重新申請新保證書。</li><li>應於保證書所載<b>有效期限</b>內核准並動用首筆授信（截止日遇假日順延次一營業日）。</li><li>保證書有效期限得於屆至前申請延長<b>三個月</b>（填「授信保證條件變更申請書」）。</li><li>授信核准日<b>得早於</b>保證書核發日，惟須於保證（動用）期限內辦理授信。</li><li>部分額度未經授信單位依授權層級核准者，基金於送保首筆時<b>主動註銷</b>該額度。</li><li>送保之授信應於授信之<b>翌日起七個營業日內</b>逐筆填送「移送信用保證通知單」並匯存保證手續費，否則<b>不予保證</b>。</li></ul><h4>批次保證與直接保證流程</h4><ul><li>批次保證：總管理機構先取得<b>批號</b>（原則於公告期間申請<b>次年度</b>批號，得年度中補申請），授信單位受理時先查詢取得<b>查覆書</b>。</li><li>基金核發批號時一併核定<b>先行交付備償款項上限金額</b>。</li><li>直接保證：授信單位填「直接保證確認申請表」申請核發保證書；保證項目除基金指定者外，依承諾書所載資金用途自行認定。</li></ul>"},{"id":"sg-2","t":"貳、信用保證對象基本資格及不得送保","fc":"","fq":"","h":"<h4>基本資格</h4><ul><li>中小企業：依法辦理公司、<b>有限合夥</b>或商業登記，實收資本額或出資額<b>一億元以下</b>，或經常僱用員工數<b>未滿二百人</b>；不含分支／附屬機構、<b>金融及保險業、特殊娛樂業</b>。</li><li>視同登記之事業［<b>不含公立機關（構）及財團法人</b>］：醫療保健服務業或<b>建築師事務所</b>；托嬰中心、幼兒園、兒童課後照顧中心；私立老人長照、安養、養護或身障福利機構（不含 <b>106.6.3</b> 長照法施行後新設之長照機構）。</li><li>送保程序適用：中小企業得用間接／批次／直接保證；創業個人僅間接／批次。</li><li>直接保證對象另須符合推薦、獲獎、專利／著作權／商標權、曾以直接保證取得貸款等資格之一。</li></ul><h4>資格認定方法</h4><ul><li>行業類別依財政部「<b>稅務行業標準分類</b>」，以營所稅結算申報書之<b>六碼</b>代號為原則。</li><li>實收資本額以公司／商業登記所載為準；出資額以有限合夥登記為準。</li><li>員工數依勞保局最近<b>十二個月平均月投保人數</b>（含分支機構）；投保未滿十二個月以實際月份平均；未滿 <b>5 人</b>免投保者得以徵信結果認定並請企業具結。</li></ul><h4>超過中小企業規模續予輔導</h4><ul><li>經輔導<b>擴充</b>超過基準者，自擴充之日起<b>二年內</b>；經輔導<b>合併</b>者，自合併之日起<b>三年內</b>，視同中小企業仍得送保。</li><li>視為經輔導：曾由金融機構給予授信（取有合約、繳息收據、押匯文件等），或曾由中企署等機關輔導。</li><li>資本額超過者自增資逾一億元之<b>變更登記日</b>起算；員工數超過者自連續十二個月平均達二百人之<b>最後一個月底</b>起算。</li><li>最後期限認定：間接保證以<b>向基金提出申請之日</b>、批次保證以<b>提出查詢之日</b>、直接保證以<b>基金受理企業申請之日</b>。</li></ul><h4>異常企業不得送保</h4><ul><li>企業或其關係人（負責人、配偶、負責人或配偶擔任負責人之關係企業）<b>受拒絕往來處分中</b>，或退票未清償註記張數已達拒往標準。</li><li>債務（主債務）：本金逾期未清償；未依約分期攤還已超過<b>一個月</b>；應繳利息延滯已超過<b>三個月</b>。</li><li>查詢時機：<b>授信額度核准前</b>；票信查「<b>第一類</b>」票據信用資料；債信向聯徵中心查詢，無法取得同意書者應經基金同意。</li><li>即期信用狀墊款一般約定於贖單通知後<b>十五日內</b>償還；出口押匯遭拒付未書面定期者，以收到拒付通知翌日起屆滿<b>三十日</b>前償付認定。</li><li>應收帳款承購還款期限書面通知最長不得逾<b>四十五日</b>；未通知者以應入帳日翌日起<b>四十五日</b>。</li><li>不受逾期限制：以出口押匯償還因裝船延誤等逾期未超過<b>一個月</b>；履約保證已徵足額定存單；到期已申請展延續約經核准尚未辦妥者。</li></ul>"},{"id":"sg-3","t":"參、共同規定及各信用保證要點","fc":"","fq":"","h":"<h4>各送保程序共同規定</h4><ul><li>授信單位代基金履行個資法第九條<b>告知義務</b>並取得聯徵查詢同意。</li><li>授信用途<b>非供國內營業使用</b>者不得送保。</li><li>外幣授信按授信之日<b>即期賣出匯率</b>（或實際成交匯率）折算新臺幣。</li><li>開狀授信得以信用狀有效期限加合理郵遞等期間為<b>暫定保證期間</b>送保，於暫定期限到期後<b>二個月內</b>依實際期間辦理展延；信用狀金額增加應於修改翌日起<b>七個營業日內</b>送保。</li><li>金融機構合併需移轉送保單位者，應於<b>合併日一個月前</b>以公函通知。</li><li>未獲保證成數部分徵提之擔保品，視為<b>全案之擔保</b>，處分收回款按保證比率沖償。</li></ul><h4>間接保證相關規定</h4><ul><li>應徵提依法登記之<b>負責人</b>為連帶保證人（獨資、合夥得免徵借款人本人）；另有<b>實際負責人</b>者亦應徵提；勿徵提與經營無關之員工。</li><li>「同一企業」保證融資總額度最高 <b>1.5 億元</b>（相同負責人或配偶為負責人、控制從屬或相互投資、實質利害關係）。</li><li>資本性支出應設定<b>第一順位</b>抵押權或動產抵押權；無法設定或無實益者<b>經先行通知基金</b>得不設定；機器設備授信期間未超過<b>二年</b>或金額未超過<b>一百萬元</b>得免動產抵押。</li><li>貸款不得用於償還<b>批次保證</b>或原有未送保案件（低利機器設備貸款償還他行設備貸款或融資性租賃除外）；得償還他行原送保之間接／直接保證債務，應於擬償還貸款到期後<b>二個月內</b>申請。</li><li>保證條件變更填「授信保證條件變更申請書」；更換保證人、變更擔保品、還款方式等經徵信認定<b>較原條件為佳</b>者得逕依總管理機構規定辦理。</li><li>票債信異常但原額度擬繼續動用（最近<b>三年</b>內退票未達拒往標準、暫予恢復往來等）應填「企業票、債信異常額度繼續動用申請書」。</li></ul><h4>批次保證與直接保證</h4><ul><li>批次保證「同一企業」保證融資總額度最高 <b>二億元</b>；授信徵有<b>五成以上</b>擔保品者<b>不得送保</b>（徵提所購機器設備為擔保者除外）。</li><li>批次保證保證成數最高<b>十成</b>；查覆書有效期間<b>三個月</b>（經同意得再延長三個月），額度動用期間以首筆動用日起算<b>一年</b>為原則；同一額度限同一批號。</li><li>批次保證不得送保：非供國內營業使用；償還原有逾期債務（償還原信保案件且於其到期後<b>二個月內</b>辦妥者除外）。</li><li>直接保證保證成數最高<b>九成</b>；保證人徵提及同一企業上限依間接保證規定。</li></ul><h4>各信用保證要點摘要</h4><ul><li>一般貸款、商業本票保證、外銷貸款、購料週轉、履約保證、政策性貸款、知識經濟、供應商融資：保證成數最高<b>九成</b>。</li><li>一般貸款之中期週轉融資應約定<b>按月或按季分期平均償還</b>（憑承包工程合約等除外）。</li><li>外銷貸款：出口前已辦外銷貸款且未送保者，其扣償之出口後貸款不得送保；出口後貸款分次移送應於扣償翌日起<b>七個營業日內</b>。</li><li>購料週轉：償付 D/A 匯票之貸款，原付款保證須於付款保證後<b>七個營業日內</b>已送保，並以展延續保辦理。</li><li>災害復舊：保證成數<b>九點五成</b>，每次受災累計融資 <b>100 萬元以內十成</b>；受災次日起<b>半年內</b>申請；廠房最長 <b>20 年</b>（寬限 5 年）、機器 <b>7 年</b>（寬限 3 年）、週轉 <b>6 年</b>（寬限 2 年）。</li><li>知識經濟企業融資：保證融資額度以貸款計畫所需經費之 <b>80%</b> 為限；研發人員達<b>三人以上</b>等條件之一。</li><li>企業小頭家貸款：僱用員工<b>十人以下</b>；週轉性支出最高 <b>500 萬元</b>；資本性支出原則不超過計畫經費<b>八成</b>。</li><li>赴有邦交國家投資融資：本國人資本超過 <b>50%</b>、出資額超過投資事業資本額 <b>50%</b>；保證成數最高<b>八成</b>、額度以投資計畫 <b>七成</b>為限且每一企業最高 <b>5,000 萬元</b>；<b>僅保證本金</b>。</li></ul>"},{"id":"sg-4","t":"肆、保證手續費","fc":"","fq":"","h":"<h4>計收標準</h4><ul><li>間接保證年費率 <b>0.375%～1.375%</b>（一般貸款依風險差別費率）；商業本票、外銷、購料、履約、政策性等 <b>1.0%～1.75%</b>；供應商融資最低 0.375%；創新發展專案固定 <b>0.375%</b>；小頭家受災復舊及災害復舊貸款<b>免計收</b>。</li><li>批次保證年費率 <b>0.2%～1.2%</b>，依基金公告費率計收。</li><li>直接保證：基本費率 <b>0.375%</b>＋差額費率（A 組 0～0.5%、B 組逾 0.5%～2%、C 組逾 2%～3%）。</li><li>B 組群例：最近一年本金延滯逾一個月、最近六個月有票據清償註記、累積虧損達實收資本額<b>二分之一</b>以上、短中期營授比率 <b>100%</b> 以上、負債比率 <b>800%</b> 以上。</li></ul><h4>計收、匯繳與退補</h4><ul><li>依保證金額、年費率及保證期間以「<b>日</b>」計算（年費率÷365）；單筆未達 <b>500 元</b>以 500 元計收。</li><li>以<b>一次計收</b>為原則，中、長期授信得<b>逐年計收</b>；費率於移送保證時即確定，嗣後不再調整。</li><li>匯繳期限：授信翌日起<b>七個營業日內</b>；逐年計收者於已繳有效期間屆滿後<b>二個月內</b>；展延或分期償還於原清償期到期後<b>二個月內</b>；未依限辦理者不予保證或<b>自動解除保證責任</b>。</li><li>提前解除保證責任者，得於原保證到期日後<b>二個月內</b>申請退還剩餘手續費，自解除之日起核退；溢收、短收在 <b>500 元</b>以內得不予退補。</li><li>提前清償申請退費，基金每次酌收作業費 <b>250 元</b>（同一借戶彙總一次申請者計收一次）。</li><li>授信單位為貼用印花稅票及銷花人；非以票據繳費者自手續費內代扣 <b>0.4%</b> 印花稅。</li></ul>"},{"id":"sg-5","t":"伍、信用保證案件之期中管理","fc":"","fq":"","h":"<h4>信用弱化之通知（知悉之日起十日內）</h4><ul><li>已依「協助企業辦理銀行債權債務協商作業要點」申請協商。</li><li>未依約分期攤還逾<b>七日</b>、未逾<b>一個月</b>；利息延滯逾<b>一個月</b>、未逾<b>三個月</b>；授信對象或負責人退票<b>未達三張</b>。</li><li>以作業系統填報「<b>營運弱化通知單</b>」。</li></ul><h4>信用惡化之通知（十日內，最遲二個月內）</h4><ul><li>停止營業；分期攤還已超過<b>一個月</b>；授信對象或負責人受<b>拒絕往來</b>處分；利息延滯已超過<b>三個月</b>。</li><li>受破產宣告、清理債務中、財產受強制執行／假扣押／假處分／拍賣之聲請；被提起足以影響償債能力之訴訟。</li><li>例：2/21 應繳息至 5/21 未繳，以 <b>5/22</b> 為知悉日，至遲 <b>7/22</b> 前通知。</li><li>主張不視為到期者填「<b>期中管理通知單</b>」；主張視為立即到期者填「<b>逾期列管通知單</b>」。</li><li>十日自知悉之<b>次日</b>起算；二個月至二個月後相當日之前一日止；末日遇假日順延；以填報後<b>複核放行之日</b>為通知日。</li><li>信用惡化時塗銷抵押權、撤銷假扣押假處分、更換或減少保證人，應先經總管理機構核准再<b>函洽基金同意</b>後辦理。</li><li>批次保證之信用惡化，依總管理機構規定辦理。</li></ul>"},{"id":"sg-6","t":"陸、信用保證案件到期之處理","fc":"","fq":"","h":"<h4>到期清償與展延</h4><ul><li>批次保證全數清償、部分清償或到期未清償，應於<b>二個月內</b>通知基金（影響備償累計金額計算）。</li><li>授信單位得逕准展延或分期償還保證之條件：<b>繼續經營中</b>、無其他授信逾期、無積欠利息、無拒往處分、<b>原保證人繼續保證</b>（原保證成數範圍內）。</li><li>逕准案件應於原清償期到期後<b>二個月內</b>辦妥並匯繳手續費；不符條件者應於二個月內申請基金同意。</li><li>展延或分期償還之授信未清償前，基金得限制企業及關係企業<b>新案送保</b>。</li></ul><h4>自動解除保證責任</h4><ul><li>授信到期日後<b>二個月內</b>未辦展延或分期償還，且未通知逾期者。</li><li>逐年計收者未於有效期間屆滿後<b>二個月內</b>續繳次年手續費者。</li></ul><h4>發生逾期之處理</h4><ul><li>逾期範圍：<b>到期未償</b>、<b>視為到期</b>；應於到期或視為到期後<b>二個月內</b>填報「逾期列管通知單」，原則上各筆授信同時通報。</li><li>以暫定授信期間送保者，以實際或暫定到期日<b>二者先到期</b>之次日起二個月內通知。</li><li>情節嚴重者應迅速採法律途徑並先行保全；不動產移轉或增設非金融機構抵押權者評估假處分、假扣押及回復原狀訴訟。</li><li>基金洽請填報「首次授信送保<b>六個月內</b>即發生逾期之原因調查表」、「大額信用保證案件逾期原因調查表」。</li><li>逾期後經同意分期或延期償還者，保證手續費一次或逐年計收，或於還清時補收；計收至全數收回或基金<b>先行交付備償款項之日</b>止。</li></ul><h4>收回款沖償與債權讓售</h4><ul><li>處分擔保品收回款得<b>優先抵償</b>徵提該擔保之債權；其餘收回款按送保與未送保授信<b>餘額比率</b>沖償，不得僅沖未送保部分。</li><li>借戶、負責人、實際負責人以外債務人之自行償還款，得<b>優先沖償其個人借款</b>（須取得其親簽書面聲明）。</li><li>「主從債務人」含額度保證書上之保證人、備償票據發票人、背書人。</li><li>授信到期後，信用保證案件之債權<b>不得讓售</b>；未送保債權讓售涉及送保債權或擔保物權者，須函洽基金同意。</li></ul>"},{"id":"sg-7","t":"柒、先行交付備償款項","fc":"","fq":"","h":"<h4>申請條件與範圍</h4><ul><li>間接保證：授信到期（含視為到期）屆滿<b>五個月</b>，<b>或</b>已對主從債務人依法訴追並取得執行名義；批次、直接保證：須<b>已取得執行名義</b>。</li><li>範圍：本金（未收回之保證部分）、積欠利息、逾期利息（最高至到期後<b>六個月</b>）、訴訟費用（俟分配完畢不足再按比率分攤）。</li><li>批次保證須該批號已交付金額<b>未達</b>先行交付備償款項累計金額；累計金額＝Σ（保證金額×時間權數×計提率），時間權數最高為 1。</li><li>批次違反基本資格、非供國內營業、償還逾期債務或擔保品五成以上者，累計金額<b>×2 倍扣除</b>；違反總管理機構規定者 <b>×1.5 倍扣除</b>；各批號不得相互流用。</li><li>交付後<b>五年內</b>有收回款並匯還基金者，得抵減該批號已交付金額。</li></ul><h4>交付後處理與沖轉</h4><ul><li>仍應繼續催討訴追，收回款按保證比率匯還並填報「收回款匯款通知單」；無論轉銷呆帳與否均應注意<b>債權時效</b>。</li><li>未參與分配或分配表誤列未聲明異議、未依規定催收、未經同意塗銷抵押權者，基金得<b>悉數收回</b>已交付款項。</li><li>沖償逾期放款時應分別沖還本金、利息及訴訟費用，<b>不得將利息部分移用於沖抵本金</b>，並填報「沖轉先行交付備償款項備查表」。</li></ul><h4>信用保證責任之解除（間接保證）</h4><ul><li>申請資料填載不實或疏漏影響資格核認或風險估計；未依保證書條件或違反總管理機構規定辦理。</li><li>購置資產未設定第一順位抵押亦未通知基金（機器設備未超過 <b>2 年</b>或 <b>100 萬元</b>除外）；未徵提負責人及實際負責人為連帶保證人。</li><li>授信款項用於收回原有債權或償還已知悉之他行債務，依比率解除（收回未超過應繳日<b>一個月</b>之利息除外）。</li><li>授信款項流入辦理該案<b>徵、授信有關人員</b>帳戶者<b>全案解除</b>；其他人員經查無弊端者依比率解除。</li><li>信用惡化未於知悉之日起<b>二個月內</b>通知，或到期未收回未於<b>二個月內</b>通知者，就其後新增保證金額範圍內解除；屆滿後<b>二個月內</b>補通知者亦同。</li></ul><h4>信用保證責任之解除（批次、直接保證）</h4><ul><li>批次：違反基本資格、非供國內營業、償還逾期債務、擔保品五成以上者<b>解除全部</b>保證責任。</li><li>批次：未依查覆書辦理或未於翌日起<b>七個營業日內</b>送保匯費、未依限匯繳手續費、到期未收回未於二個月內通知、未配合查核等，<b>解除全部</b>保證責任。</li><li>批次：催收未依規定影響收回、款項流入行員帳戶者，就不符部分解除。</li><li>直接：款項流入徵授信有關人員帳戶得<b>全案解除</b>；未依保證書條件辦理或到期未於二個月內通知，得解除一部或全部。</li></ul>"},{"id":"sg-8","t":"捌、附錄：修正重點與計算範例","fc":"","fq":"","h":"<h4>114 年版修正重點</h4><ul><li>保證對象納入<b>有限合夥</b>；106.6.3 長照法施行後新設之長照機構非視同登記。</li><li>同一企業保證融資總額度上限提高為 <b>1.5 億元</b>；批次保證同一企業上限 <b>二億元</b>，並將積欠利息與逾期利息納入先行交付備償款項範圍。</li><li>常態化「協助企業辦理銀行債權債務協商作業要點」，列入信用弱化通知事由；逾期後保證手續費增列計收彈性。</li></ul><h4>收回款沖償計算範例</h4><ul><li>例一：授信 100 萬送保八成（80 萬），收回 50 萬 → 沖保證部分 <b>40 萬</b>，保證餘額 40 萬。</li><li>例二：另有未送保無擔保授信 100 萬，收回 50 萬先按<b>債權比率</b>各沖 25 萬，送保案沖保證部分 20 萬，保證餘額 <b>60 萬</b>。</li><li>例三：再有擔保授信 150 萬，拍賣受償 190 萬優先沖擔保授信，餘 40 萬按比率沖兩筆各 20 萬，保證部分沖 16 萬，保證餘額 <b>64 萬</b>。</li><li>先行交付備償款項之利息天數與轉催收利息天數不同時，催收款內天數部分沖催收款，其餘列<b>利息收入</b>。</li></ul>"},{"id":"sg-9","t":"待修訂彙總表（114.6～115.10）","fc":"","fq":"","h":"<h4>保證對象</h4><ul><li>視同登記之事業（醫療保健、建築師事務所、托嬰幼兒園、私立老人／身障機構等）訂退場機制：<b>116.6.30 以前</b>仍得申請，屆期停止受理。</li><li>配合青年創業貸款要點，<b>刪除「創業個人」</b>保證對象，改僅得以企業名義申請（114.08.15 通函）。</li><li>直接保證對象新增：成立<b>未滿八年之新創企業</b>（列第 9 項，115.08.20 通函）。</li></ul><h4>保證項目調整</h4><ul><li>經濟部自 <b>114.11.1</b> 廢止「協助中小企業紮根專案貸款要點」；自 <b>115.7.28</b> 廢止「台商回台投資專案融資貸款要點」，政策性貸款信保配合刪除。</li><li>災害復舊專案貸款：保證對象增列<b>僅辦稅籍登記</b>之營利事業；融資額度不以受損金額為限；償還方案由承貸機構與事業自行議定。</li><li>企業小頭家貸款（115.1.20 修正）：對象依要點第五點且不含金融保險、特殊娛樂業；累計貸款 <b>100 萬元以內保證 9.5 成</b>、超過者最高 <b>9 成</b>；刪除受災、新創、傳承創新事業成數規定。</li><li>「青年創業及啟動金貸款要點」自 <b>114.7.1</b> 更名為「<b>青年創業貸款要點</b>」。</li><li>直接保證差額保證手續費刪除「成立迄今或最近連續三年均為虧損」衡量項目。</li></ul>"}]},{"t":"公文函令（2025–2026，共 36 份）","chs":[{"id":"gw-1","t":"2025/03/31｜債劃字第000040號（債權管理處）","fc":"","fq":"","h":"<h4>重申各單位催收主管應定期檢視逾放(含呆帳)案件之債權憑證時效</h4><ul><li>法院發給之債權憑證：債權憑證、<b>本票裁定</b>、勝訴判決、<b>支付命令</b>、和解／調解筆錄、拍賣抵押物裁定、前置協商、更生、清算不免責債權表、<b>公證書</b>等執行名義。</li><li>已移交債管處／區域中心案件，時效將於 <b>6 個月內</b>屆期→主動借調正本換發，完成後歸還並<b>影印乙份</b>入卷。</li></ul>"},{"id":"gw-2","t":"2025/10/08｜法劃字第000077號（法人金融處）","fc":"","fq":"","h":"<h4>修訂「業務處理細則-授信篇」外幣貸款業務相關規範（第40章、第45章）</h4><ul><li>進口週轉金外幣貸款無運送單據：到期日起算以<b>裝運日期</b>（無則簽發日）；免徵／補徵運送單據者改依<b>發票等最早簽發日</b>。</li><li>交易對手查證新增：<b>財報或年報揭露之進銷貨廠商資訊</b>。</li><li>出口後外幣貸款憑 <b>O/A</b>：徵發票、運送單據或通關證明，每筆在發票金額 <b>80%</b> 內；憑訂單、輸出契約或 O/A 隸屬「<b>丙類無擔保授信</b>」額度。</li><li>建檔交互比對<b>批覆條件、借據、端末建檔</b>；機動利率於重評日建妥「下次利率」。</li></ul>"},{"id":"gw-3","t":"2025/10/17｜審劃字第000032號（授信審核處）","fc":"","fq":"","h":"<h4>落實工程週轉金累計動用借款金額上限維護交易(6409)，自2025年10月20日起新增欄位及LN6409日報表</h4><ul><li>自 <b>2025/10/20</b> 起工程週轉金循環額度敘明累計動用上限者，6402 欄位輸入「<b>Y</b>」並執行 <b>6409</b> 維護交易，以 6140 確認。</li><li>建檔有誤以 <b>6260</b> 代號 <b>70</b> 更正；已貸放未計入者以 <b>6300</b> 代號 <b>47</b> 更正為 Y。</li><li>每日指派專人列印 <b>LN6409 日報表</b>（無資料免印）；「**已逾上限」查明原因，處理情形陳核<b>副主管</b>。</li></ul>"},{"id":"gw-4","t":"2025/11/11｜一總法劃字第009161號（總行）","fc":"","fq":"","h":"<h4>賡續辦理「綠色永續金融優惠授信專案」</h4><ul><li>綠色永續金融優惠授信專案期間：<b>2026/1/1–2028/12/31</b>。</li><li><b>永續績效連結授信</b>：5 核心因素（KPI 選定、目標檢驗調校、貸款屬性、執行回報、驗證）；利率減降最高 <b>0.05%</b>，且不得低於 MML 利率下限；勿以各指標均進步 <b>1%</b> 設 KPI。</li><li><b>綠色授信</b>：4 核心要素（資金用途、評估與類別選擇、資金管理、執行回報），<b>不限產業別</b>。</li><li>移送信保案件整筆放款均適用移送信保利率（含<b>批次信保及農保</b>）；<b>工業用土地抵押貸款</b>及央行管控案件排除適用。</li><li>更優惠條件須申請區域中心或授審處核准；專案代碼 <b>P2</b> 綠色、<b>P3</b> 永續連結。</li></ul>"},{"id":"gw-5","t":"2025/11/20｜一總法中字第009293號（總行）","fc":"","fq":"","h":"<h4>自即日起辦理「第一銀行連鎖企業加盟業者貸款」，並廢止現行個別加盟主貸款專案，僅保留「全家便利商店加盟主貸款」</h4><ul><li>開辦「<b>連鎖企業加盟業者貸款</b>」，廢止個別加盟主專案，僅保留<b>全家</b>加盟主貸款。</li><li>加盟總部：設立滿 <b>3 年</b>、實收資本 <b>1 億元</b>以上；借戶及負責人無債票信不良。</li><li>創業資金設立登記後 <b>1 年內</b>申貸；額度依所需資金 <b>8 成</b>，每戶最高 <b>250 萬元</b>；期限最長 <b>5 年</b>（寬限期最長 <b>1 年</b>）。</li><li>利率：一年定儲機動＋<b>1.085%</b>；總部為本行授信戶或取得優良／卓越認證減碼 <b>0.15%</b>；手續費最高 <b>0.5%</b>、最低 <b>3,000 元</b>。</li><li>非十足擔保一律<b>移送信保</b>、<b>不得批次保證</b>；可分次動撥、<b>不得循環及借新還舊</b>；種類「<b>WW</b>」。</li></ul>"},{"id":"gw-6","t":"2025/11/20｜審鑑字第000015號（授信審核處）","fc":"","fq":"","h":"<h4>函布修正本行「擔保品鑑價應注意事項」，並自即日起實施</h4><ul><li>以「房地時價總額鑑價」：停車位 <b>6 個以上</b>或車位鑑價占總額 <b>30% 以上</b>→應附 <b>3 則</b>可拆分出售之車位成交案例；其餘至少 <b>1 則</b>。</li><li>受託鑑價單位鑑價資料保存年限 <b>20 年→15 年</b>（配合徵授信卷宗保存 15 年）。</li></ul>"},{"id":"gw-7","t":"2025/12/05｜法中字第000138號（法人金融處）","fc":"","fq":"","h":"<h4>重申營業單位辦理建築業者申貸週轉金案件應注意事項</h4><ul><li>建築業者（行業別 <b>41、67、68</b>）週轉金實際用於集合住宅興建，卻以「其他週轉金」申貸→未納入<b>銀行法 72-2</b> 控管（金控檢查缺失）。</li><li>實際用於興建→貸款種類「<b>31 建築貸款</b>」、資金用途「<b>33 其他營建資金</b>」。</li></ul>"},{"id":"gw-8","t":"2025/12/16｜一總法劃字第009666號（總行）","fc":"","fq":"","h":"<h4>修訂「再生能源永續貸款」業務要點及應行注意事項，開放購電方新增企業電力承購商</h4><ul><li>再生能源永續貸款開放購電方新增<b>企業電力承購商</b>：承購商與台電簽「<b>轉供契約</b>」、借款人與台電簽「<b>餘電購售契約</b>」。</li><li>借款人須為電能購售契約簽約人；簽約人非借款人但<b>擔任連帶保證人</b>者不在此限。</li><li>發電設備<b>至少每年勘查一次</b>；租地租約期間應<b>大於回收年限</b>並<b>法院公證</b>；太陽光電<b>非</b>銀行法 72-2 控管範圍。</li><li>售予企業承購商之售電價格應<b>高於台電躉售價格</b>，未達原則不予承作。</li></ul>"},{"id":"gw-9","t":"2025/12/23｜法中字第000145號（法人金融處）","fc":"","fq":"","h":"<h4>因應實務需要修正「個人非消費性貸款」業務相關規範</h4><ul><li>自 <b>2025/11/20</b> 起個人非消費性貸款停用 <b>WD、WW、ZS</b> 加盟主貸款種類；增列「投資其他金融/非金融商品」用途。</li></ul>"},{"id":"gw-10","t":"2026/01/06｜法劃字第000001號（法人金融處）","fc":"","fq":"","h":"<h4>重申「銷售鏈融資」及「線上融資e-Financing」：買方將款項匯入備償借款專戶時，營業單位應即執行帳款核銷作業</h4><ul><li>銷售鏈融資／線上融資 e-Financing：買方款項匯入備償專戶應<b>即沖償借款</b>，不得退還至借戶活期帳戶。</li><li>關注動撥及入帳頻率與金額是否符合營運週期；異常徵兆（<b>動撥過於頻繁、入帳明顯減少</b>）應了解原因並審慎評估。</li></ul>"},{"id":"gw-11","t":"2026/01/21｜一總審劃字第000348號（總行）","fc":"","fq":"","h":"<h4>修正「國內營業單位經理權限授信要點」，自2026年2月2日起實施</h4><ul><li>「國內營業單位經理權限授信要點」修正，自 <b>2026/2/2</b> 實施（經 2025/12/26 常董會備查）。</li><li>受益權質借外幣得於<b>擔保授信權限</b>內承做（以賣出匯率折算新臺幣）。</li><li>公司卡：往來滿 <b>1 年</b>且評等 <b>1–7 等</b>者得單獨運用經理權限，不列入授信權限計算、不受關係戶歸戶限制。</li><li><b>初任經理人到任半年內</b>：DBR 逾 <b>70%</b> 房貸及記帳士、代書、民間小額融資轉介案件→送總行或區域中心核定。</li><li>停權標準（逾放比率逾 <b>2%</b>）：商品停權 A <b>2,400</b>／B <b>2,000</b>／C <b>1,800</b> 萬；全部停權 A <b>3,000</b>／B <b>2,500</b>／C <b>2,300</b> 萬。</li><li>實施前已核准額度可用至屆期；嗣後案件依「<b>分行啟案日</b>」適用新規定。</li></ul>"},{"id":"gw-12","t":"2026/01/23｜一總法劃字第000415號、一總消商字第000415號（總行）","fc":"","fq":"","h":"<h4>申請試辦倫巴底貸款及保費融資與保單融資業務，訂定相關作業要點</h4><ul><li>金管會 <b>115/1/12</b> 函同意試辦倫巴底、保費融資、保單融資；均<b>限高資產客戶</b>、限<b>新興分行</b>承作。</li><li>倫巴底：上限為設質金額 <b>150%</b>、可<b>再質借 2 次</b>；與受益權質借<b>擇一</b>、每人限 <b>1 案</b>；期限最長 <b>1 年</b>、按月繳息到期還本、<b>非循環</b>；擔保品須 <b>2 項以上</b>；收受新臺幣資產者額度限新臺幣。</li><li>倫巴底成數：定存 <b>90%</b>、上市股 <b>60%</b>、上櫃 <b>50%</b>、ETF/REITs <b>60%</b>、受益權 RR1–4 <b>70%</b>／RR5 <b>60%</b>、結構型及次順位債 RR1–4 <b>80%</b>／RR5 <b>70%</b>。</li><li>保費/保單融資僅限<b>個人戶</b>，借款人須為要保人且與<b>被保險人同一人</b>，保單須為合作保險公司之保單；鑑價由新興分行自辦。</li><li>新興分行承作專區業務<b>不受第二家授信往來無經理權限</b>之限制，惟須經<b>原往來分行同意</b>。</li><li>分潤：承作量及平均餘額<b>雙邊認列 100%</b>；提存後營業毛利專區 <b>30%</b>、轉介分行 <b>70%</b>。</li></ul>"},{"id":"gw-13","t":"2026/01/26｜消商字第000003號（消費金融處）","fc":"","fq":"","h":"<h4>訂定「保費及保單融資作業應注意事項(『地方資產管理專區』專用)」</h4><ul><li><b>保費融資</b>＝以本人為要保人及被保險人之<b>新購</b>保單擔保支付保費；<b>保單融資</b>＝以<b>既有</b>保單擔保取得資金；均須附加<b>融資批註條款</b>。</li><li>每筆額度<b>單一幣別</b>；新臺幣最低 <b>100 萬元</b>（萬元倍數）、外幣最低等值 <b>美金 3 萬</b>；經理權限內以<b>免保人信用貸款</b>方式辦理。</li><li>期限：保費融資最長 <b>10 年</b>、首次寬限期 <b>2 年</b>；保單融資最長 <b>1 年</b>且不得逾保單到期日；種類 <b>6D</b>／<b>7D</b>。</li><li>成數：保費融資依首期躉繳保費最高 <b>7.5 成</b>、不得逾首日解約金；保單融資依保價金或解約金<b>孰低</b>最高 <b>9 成</b>。</li><li>維持率＝保單解約金÷借款餘額；<b>95%–100% 連續 5 個營業日</b>→還款預警通知；<b>低於 95%</b>→還款通知，掛號次日起 <b>15 個營業日</b>內未償得主張期限利益喪失。</li><li>主張終止保險契約<b>無須借款人同意</b>；保險金匯入 <b>66 帳號</b>應<b>當日</b>沖償，幣別不同得前一營業日以 <b>NOC1</b> 鎖匯；抵銷前以<b>存證信函</b>寄發行使抵銷通知書。</li></ul>"},{"id":"gw-14","t":"2026/01/26｜消商字第000005號（消費金融處）","fc":"","fq":"","h":"<h4>配合倫巴底貸款開辦，訂定作業應注意事項（地方資產管理專區專用—個人消費性貸款適用）</h4><ul><li>倫巴底受理對象限<b>高資產客戶</b>且徵妥【專區商品及服務申請書】；說明、審核、對保<b>僅限新興分行</b>。</li><li>徵提<b>自益特定金錢信託受益權</b>作擔保→應<b>錄音</b>保留紀錄。</li><li>最低申貸：新臺幣 <b>100 萬</b>、外幣 <b>美金 3 萬</b>；再質借幣別須相同；新興分行須先電洽消金處<b>登記額度</b>。</li><li>擔保品<b>一次設足、不得分批設質</b>；定存單／股票由<b>轉介分行</b>設質保管，受益權／結構型／次順位債由<b>新興分行信託經辦</b>建檔。</li><li>補倉／平倉：X&lt;60% → <b>140%／120%</b>；60%≤X&lt;80% → <b>120%／110%</b>；X≥80% → <b>110%／105%</b>。</li><li>每月以<b>綜合業務對帳單</b>通知；低於補倉→補倉通知書，掛號次日起 <b>5 個營業日</b>；低於平倉（**）→平倉／期限利益喪失通知。</li></ul>"},{"id":"gw-15","t":"2026/02/13｜一法劃字第000762號、一消商字第000762號（法人金融處、消費金融處）","fc":"","fq":"","h":"<h4>配合主管機關修正專區問答集，調整自行特定金錢信託受益權質借（地方資產管理專區）營業據點受理範圍</h4><ul><li>專區受益權質借：受理、說明、風險揭露、審核、簽約對保<b>均僅限新興分行</b>；轉介分行僅得概括性說明、轉介、<b>代收文件及傳遞</b>。</li><li>核對親簽及對保原可由消金處、區域中心、CA 辦理 → 調整為<b>僅限新興分行</b>；「說明人」欄僅新興分行蓋章。</li><li>協訪申請書廢止，改用<b>【轉介/對保申請書】</b>；專區僅得使用貸款申請書 <b>C 款</b>。</li></ul>"},{"id":"gw-16","t":"2026/02/24｜債劃字第000025號（債權管理處）","fc":"","fq":"","h":"<h4>函布「第一商業銀行辦理逾期放款案件查找財產暨執行作業應注意事項」</h4><ul><li>債管處函布「逾期放款案件查找財產暨執行作業應注意事項」，避免過度或不當措施影響客戶權益。</li><li>查調時點：逾期 <b>1 個月內</b>仍未回復正常或辦妥展期；取得<b>假扣押裁定</b>後；取得<b>執行名義</b>或債證中斷時效時；債管處指定時。</li><li>本行財產查調：端末 <b>A087</b>，填「借保戶存放於本行之財產情形調查表」（<b>12 項表</b>）；另可申請國稅局查調財產所得。</li></ul>"},{"id":"gw-17","t":"2026/02/26｜一總消商字第000867號（總行）","fc":"","fq":"","h":"<h4>增強「樂活貸」循環型房貸競爭力，高資產客戶或專業投資人承作「珍愛傳承」信託者單一循環型契約期限得以5年為一期</h4><ul><li><b>樂活貸</b>單一循環型契約期限一般以 <b>3 年</b>為一期；<b>高資產客戶／專業投資人</b>且資金用途承作「<b>珍愛傳承</b>」信託者得以 <b>5 年</b>為一期。</li><li>對象：成年本國國民、房貸評等<b>低風險等級</b>，且為高資產、專投或年收入 <b>50 萬元</b>以上；屆期得同內容續約<b>不另換約</b>，惟<b>徵一般保證人者屆期應另訂新約</b>。</li><li>系統自 <b>2026/3/6</b> 上線。</li></ul>"},{"id":"gw-18","t":"2026/03/02｜審劃字第000009號（授信審核處）","fc":"","fq":"","h":"<h4>具高度關聯之企業授信戶應確實揭露於「信用綜合評估表」</h4><ul><li>多家企業授信戶負責人<b>互為保證人</b>、營運性質相同、進銷貨<b>高度重疊</b>或家族共同經營→於授信申請書<b>補充說明段</b>揭露關聯性。</li><li>保證人以具<b>共同經濟利害關係</b>者為原則（負責人、配偶、董監事、主要股東、經營階層），避免浮濫或無實益保證人。</li><li>應收款及存貨甚鉅→查是否放寬收款或隱藏呆帳；與本業無關之投資應瞭解交易內容。</li></ul>"},{"id":"gw-19","t":"2026/03/17｜消商字第000014號（消費金融處）","fc":"","fq":"","h":"<h4>倫巴底貸款（個人消費性）授信權限額度計算方式</h4><ul><li>倫巴底（個人消費性）授信權限以「<b>倫巴底核准最高額度</b>」計算審查權限。</li><li>核准最高額度＝設質金額 <b>150%</b>；例：鑑價 2,500 萬→上限 <b>3,750 萬</b>，逾新興分行個人擔保經理權限 <b>2,400 萬</b>→屬<b>區域中心</b>權限。</li></ul>"},{"id":"gw-20","t":"2026/03/18｜消商字第000015號（消費金融處）","fc":"","fq":"","h":"<h4>增修樂活貸作業應注意事項及新增「樂活貸」借款契約(「珍愛傳承」信託專用)</h4><ul><li>5 年一期者額度應<b>依信託商品承作金額</b>申請（承作 3,000 萬申請 5,000 萬→改 <b>3 年</b>一期）。</li><li>核准有效期限及每次可貸放期限：<b>36 個月</b>或 <b>60 個月</b>（5 年一期）；續約仍須符合客群及用途，否則重新議定 3 年一期。</li><li>LN33 日報表新增註記說明 5；借款契約<b>消放904</b>須<b>彩色列印</b>。</li></ul>"},{"id":"gw-21","t":"2026/03/18｜審劃字第000011號（授信審核處）","fc":"","fq":"","h":"<h4>整編「授信對保應注意事項」</h4><ul><li>對保：借款人及保證人分別徵<b>印鑑卡、約定書</b>，保證人另徵<b>保證書</b>；約據<b>親簽及蓋章</b>，留存加註「限辦理第一銀行徵授信使用」之身分證影本。</li><li>查身分證遺失補領：戶政司網站或聯徵 <b>Z21</b>，結果<b>列印存卷</b>；印鑑卡逐一編列放款帳號於<b>印鑑暨影像管理系統</b>建檔。</li><li>更換印鑑申請書 <b>放155</b> 簽章須與新印鑑卡右下方相符，正本置<b>擔保袋</b>；住址變更另徵 <b>存215A</b>。</li><li>獨資戶負責人更換→對舊債向新負責人主張須另徵<b>新負責人保證書</b>；合夥人變更→重徵<b>全體合夥人同意書</b>。</li></ul>"},{"id":"gw-22","t":"2026/03/20｜消商字第000016號（消費金融處）","fc":"","fq":"","h":"<h4>新增「地方資產管理專區辦理授信試辦業務對保作業流程」（對保作業SOP）</h4><ul><li>自 <b>2026/1/21</b> 起新申辦專區客戶應於<b>新興分行</b>開戶：原則於轉介分行開戶後<b>轉籍移入</b>。</li><li>先確認為專區客戶或擬簽申請書，始得填【<b>轉介/對保申請書</b>】：倫巴底須具 <b>2 項以上</b>合格資產；保費/保單融資依保代處保險專案；受益權質借須已持有本行受益權。</li></ul>"},{"id":"gw-23","t":"2026/03/26｜消商字第000017號（消費金融處）","fc":"","fq":"","h":"<h4>新增「地方資產管理專區辦理保費融資業務問答集」</h4><ul><li>問答集供<b>消金專員／理財顧問</b>參考；115/3/23 新臺幣利率 <b>2.34%–2.54%</b>，美元 3M TAIFX＋<b>1.5%</b> 起（約 5.66%），每 3 個月調整。</li><li>保費融資最長 <b>10 年</b>；首次寬限期 <b>2 年</b>，屆滿仍需→申請<b>區域中心</b>變更條件展延。</li><li>簽立保險契約<b>當日</b>可同步約訪新興分行填貸款申請書；維持率 &lt;95% 僅須<b>償還部分借款</b>。</li><li>自備款不足可辦樂活貸、倫巴底、保單融資，均屬<b>專款專用</b>、不得再質借；倫巴底可<b>再質借 2 次</b>且每人限 <b>1 筆</b>，建議優先以<b>保單融資</b>補足。</li></ul>"},{"id":"gw-24","t":"2026/03/27｜債劃字第000043號（債權管理處）","fc":"","fq":"","h":"<h4>逾放(含呆帳)債務人存款辦理圈存，所徵取之約定書版本應為新版約定書(第18版)</h4><ul><li>放款約定書自 <b>2026/4/1</b> 啟用；逾放戶圈存須徵有「約定書（放002）」<b>2026.2 第 18 版</b>，未徵妥<b>不得對將來存款預先圈存</b>。</li><li>圈存後抵銷仍應發<b>抵銷函</b>；抵銷自通知到達後<b>溯及最初得為抵銷時</b>生效；抵銷款應即沖抵借款，<b>勿留置</b>預收款分戶。</li><li>聯行圈存／解除以<b>業務聯繫單</b>洽原開戶行辦理。</li></ul>"},{"id":"gw-25","t":"2026/04/07｜消商字第000020號（消費金融處）","fc":"","fq":"","h":"<h4>轉知「中央銀行對金融機構辦理不動產抵押貸款業務規定修正規定」，溯自115年3月20日起生效</h4><ul><li>央行不動產抵押貸款規定修正，溯自 <b>115/3/20</b> 生效：自然人<b>第 2 戶</b>購屋貸款 <b>5 成→6 成</b>，無寬限期。</li><li>維持不變：高價住宅 <b>3 成</b>、第 3 戶以上 <b>3 成</b>（均無寬限期）；名下有房第 1 戶無寬限期；購地 <b>5 成</b>保留 <b>1 成動工款</b>並切結動工。</li><li>e-loan 央控案件類型 <b>20 項</b>；按月報送央行，貸放後<b>立即</b>填報，漏填最遲<b>當月月底</b>前完成。</li></ul>"},{"id":"gw-26","t":"2026/04/23｜消商字第000024號（消費金融處）","fc":"","fq":"","h":"<h4>專區授信試辦業務於「案件申請」階段，得以電話錄音方式進行商品說明與風險揭露</h4><ul><li>專區「<b>案件申請</b>」階段得以<b>電話錄音</b>說明商品與揭露風險：轉介分行<b>親訪</b>客戶、新興分行授信人員透過錄音系統致電說明。</li><li>客戶於申請文件簽蓋<b>任一原留印鑑</b>，由新興分行核章；「<b>核准後對保</b>」仍由新興分行<b>親訪對保</b>。</li></ul>"},{"id":"gw-27","t":"2026/04/29｜一法劃字第001838號、一消商字第001838號（法人金融處、消費金融處）","fc":"","fq":"","h":"<h4>修訂「自行特定金錢信託受益權質借」業務之作業應注意事項及用紙（電話錄音）</h4><ul><li>受益權質借電話錄音：以錄音類別<b>第 4 類</b>（其他業務及外匯放款）及<b>第 7 類</b>（受益權質借）留存。</li><li>新興分行依規定填列<b>錄音序號</b>並辦理核章；個人消費性洽消金處、企業及個人非消費性洽法金處。</li></ul>"},{"id":"gw-28","t":"2026/04/29｜一總消商字第001818號（總行）","fc":"","fq":"","h":"<h4>修訂高資產客戶「保費及保單融資」業務作業要點</h4><ul><li>保費融資<b>刪除</b>「保單幣別與借款幣別不同再減降 0.5 成」→成數最高皆 <b>7.5 成</b>，不得逾<b>保單首日解約金額</b>。</li><li>新增還款方式「<b>按月繳息、到期一次還本</b>」（原僅年金法／本金法）；寬限期改列「償還方式及寬限期」項下。</li></ul>"},{"id":"gw-29","t":"2026/05/05｜消商字第000026號（消費金融處）","fc":"","fq":"","h":"<h4>配合保費融資新增償還方式及調整貸款成數，修訂作業應注意事項</h4><ul><li>貸後管控：自貸放後<b>第 5 個營業日起一個月內</b>至保險業務系統確認保單已完成<b>融資註記及註記日期</b>，更新擔保品資料。</li><li>應<b>留存保險公司已完成批註之佐證文件</b>備查。</li></ul>"},{"id":"gw-30","t":"2026/05/12｜消商字第000028號（消費金融處）","fc":"","fq":"","h":"<h4>修訂「安心貸」問與答，增訂借款人死亡後繼承人申請債務繼承之處理程序</h4><ul><li>安心貸借款人死亡：端末 <b>6300-93</b> 安心貸暫停撥款註記登打「<b>Y</b>」。</li><li>繼承期間正常繳息→<b>得暫不主張債務到期</b>；辦妥繼承後由繼承人申請「<b>消費性擔保貸款（NR）</b>」償還原借款並重新設定抵押權；未正常繳息→主張到期、法催拍賣。</li><li>繼承人正常繳息但不願變更借款人→須<b>書面通知送達新所有權人</b>後始得主張到期。</li><li>行銷激勵：每件獎勵金 <b>2,000 元</b>；達 <b>2 件</b>以上且全行前 <b>18 名</b>嘉獎 1 次。</li></ul>"},{"id":"gw-31","t":"2026/05/27｜審劃字第000022號（授信審核處）","fc":"","fq":"","h":"<h4>彙整中小企業授信往來異常態樣暨重申應行注意事項</h4><ul><li>中小企業往來<b>未滿一年即逾放</b>之共同態樣：多家<b>資本額偏低、成立未滿一年</b>新設公司；營收與資本額不相當；負責人不動產有<b>民間融資</b>抵押；保證人非實際經營者；核貸後<b>同時向同業大幅舉債</b>；未落實案源建檔。</li><li>記帳士、代書或外部轉介案件：<b>慎選案源、實地訪查</b>，授信申請時務必<b>落實案源建檔</b>。</li></ul>"},{"id":"gw-32","t":"2026/06/03｜一風信字第002420號、一法中字第002420號（風險管理處、法人金融處）","fc":"","fq":"","h":"<h4>營業單位辦理建築貸款案件列金控檢查缺失，重申應注意事項</h4><ul><li>缺失：集合住宅興建工程以「<b>經常性週轉金</b>」申貸未計入 72-2；危老已核定未由 FE 改 FH；個人非消費性 <b>ADC</b> 額度用途建檔不一致。</li><li>都更／危老前期週轉金核定後，貸款種類由 <b>FE</b> 改為 <b>F9</b>（都更）或 <b>FH</b>（危老）。</li><li>個人非消費性資金供投資事業興建建案（33 其他營建資金）屬 <b>ADC</b>，額度用途勾「<b>7</b>」或「<b>8 其他(ADC)</b>」；端末 <b>6407</b> 須與批覆書一致。</li></ul>"},{"id":"gw-33","t":"2026/06/17｜審劃字第000026號（授信審核處）","fc":"","fq":"","h":"<h4>修訂辦理不動產擔保物權塗銷相關權利文件領回之規範</h4><ul><li>委託第三人領取塗銷文件：出具<b>委託書</b>、影印受託人身分證，於權利證件授受登記簿簽名註記「<b>代領</b>」，經辦及主管蓋章後交付。</li><li>無法出具委託書：依內政部 <b>60.3.27 台內地字第 407571 號</b>函釋，抵押權拋棄塗銷<b>無須債務人同意</b>，本行得逕向地政機關辦理。</li><li>塗銷全部抵押權前應查明所擔保之授信或<b>衍生性商品交易</b>是否已全數清償。</li></ul>"},{"id":"gw-34","t":"2026/06/22｜審劃字第000028號（授信審核處）","fc":"","fq":"","h":"<h4>修訂「國內營業單位辦理融資租賃公司授信應行注意事項」</h4><ul><li>融資租賃公司授信：於「借款戶分析」揭露放款對象是否涵蓋<b>不動產業者</b>及其占比。</li><li>本次用途非屬不動產融通→試算週轉金需求時<b>扣除對不動產業融資占比</b>後匡計資金缺口。</li></ul>"},{"id":"gw-35","t":"2026/06/26｜債劃字第000073號（債權管理處）","fc":"","fq":"","h":"<h4>催收主管定期檢視債權憑證時效時，應同時列印逾催系統「債證到期提醒」表</h4><ul><li>債權憑證逐筆登載實體及逾催系統「<b>債權憑證登記簿</b>」；催收主管保管正本並<b>每半年</b>檢視時效。</li><li>檢視時同時列印「<b>債證到期提醒</b>」表，新增「<b>處理情形</b>」欄；逾時效消滅日應說明理由；主管覆核後呈核至<b>營業單位經理</b>。</li></ul>"},{"id":"gw-36","t":"2026/06/29｜法中字第000048號（法人金融處）","fc":"","fq":"","h":"<h4>經濟部中小及新創企業署修正「青年創業貸款要點」，自2026年7月1日生效</h4><ul><li>青年創業貸款修正自 <b>2026/7/1</b> 生效：歸戶 <b>150 萬元以下</b>部分信保成數 <b>9.5 成</b>。</li><li>150 萬以下僅得徵<b>代表人或負責人</b>為保證人，逾 150 萬以 <b>1 人</b>為原則；申請 150 萬以下得以<b>申請表取代計畫書</b>。</li><li>移送信保<b>僅得移送「青年創業貸款」方案</b>。</li></ul>"}]}]}};

function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), sg=(c.b||'').startsWith('信保'), gw=(c.b||'').startsWith('公文'), rul=sg||gw||(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':sg?'信保手冊依據':gw?'公文依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){
  const v=qz?quiz.ans[q.id]:ST[q.id], h=HI[q.id], done=v!==undefined, sim=q.id[0]==='S';
  const QT={neg:'錯誤題',combo:'組合題',fill:'填空題',ask:'問答題'};
  const head=(sim?(q.src===6?`<span class="tag sim lecq">延伸新題</span>`:q.src===5?`<span class="tag sim lecq">題型新題</span>`:q.src===4?`<span class="tag sim rulq">公文新題</span>`:q.src===3?`<span class="tag sim rulq">信保新題</span>`:q.src===2?`<span class="tag sim rulq">要點新題</span>`:q.src?`<span class="tag sim lecq">講義新題</span>`:`<span class="tag sim">模擬題</span>`):`<span class="tag">${q.y} 年・第 ${q.n} 題</span>`)+(q.t?`<span class="tag qt">${QT[q.t]}</span>`:'');
  const md=(showMod?`<span class="tag md">${pad(q.m)} ${MOD[q.m].t}</span>`:'')+(q.lx?`<span class="tag lxq" title="${q.lx.b} ${q.lx.c}">${q.lx.v>=50?'講義高度重複':'講義相似'} ${q.lx.v}%</span>`:'');
  const opts=q.o.map((o,i)=>{let c='';if(done){if(q.a===null||q.a===undefined){if(i===v)c='ok'}else if(i===q.a)c='ok';else if(i===v)c='bad'}
    return `<button class="op ${c}" data-q="${q.id}" data-i="${i}"><span class="l">${L[i]}</span><span>${o}</span></button>`}).join('');
  let ans='';
  if(done){
    const ok=isOk(q,v), bonus=q.a===null||q.a===undefined;
    const ver=bonus?`<span class="verdict ok">官方送分題（任一選項皆給分）</span>`:
      ok?`<span class="verdict ok">✓ 答對</span>`:`<span class="verdict bad">✗ 答錯　正確答案：(${L[q.a]}) ${q.o[q.a]}</span>`;
    const warn=q.lo===1?`<div class="warn">本題出自行內作業要點／信保手冊等，細則未直接收錄${q.ci?'；下方為細則中最相關條文':''}</div>`:q.lo===2?`<div class="warn">細則條文比對信心較低，僅供參考</div>`:q.lo===3?`<div class="warn web">本題細則未收錄，解析已依網路公開資料查證：${(q.web||[]).map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>`).join('、')}${q.ci?'；下方為細則中最相關條文':''}</div>`:'';
    ans=`<div class="ans"><button class="redo" data-r="${q.id}">重作</button>${ver}${q.x?`<div class="exp">${q.x}</div>`:''}${warn}${cite(q.ci)}${q.lx&&!(q.ci&&q.ci.b===q.lx.b&&q.ci.c===q.lx.c)?`<div class="cite lec lx"><span class="lb">${q.lx.b.startsWith('信保')?'信保手冊':'講義'}相似・重疊 ${q.lx.v}%</span><span class="path">${q.lx.b} › ${q.lx.c}</span><div class="tx">${q.lx.t}</div></div>`:''}</div>`;
  }
  return `<div class="qc ${done?'done':''}" id="c-${q.id}" data-z="${qz?1:''}"><div class="qh">${head}${md}${h?`<span class="tag hist">作答 ${h.n} 次・錯 ${h.w} 次</span>`:''}</div><div class="qt">${q.q}</div>${opts}${ans}</div>`;
}

   <div class="msub">以 4 字詞組重疊度比對考古題（題幹＋正解）與講義各頁：共 ${all.length} 題與講義內容相似，其中 ${hi.length} 題高度重複（≥50%）；${yrs}</div>
   <section style="max-width:none"><table class="nt"><tr><th>講義／手冊</th><th>有相似題之頁數</th><th>相似題數</th><th>高度重複</th></tr>${rows}</table></section>
   ${LB.map(b=>`<section><h3>${b.b}</h3>${b.pages.map(p=>`<details class="lxp"><summary><b>${p.c}</b>　${p.qs.length} 題・${p.qs.map(([id,v])=>`<span class="tag ${v>=50?'lxq':''}">${id} ${v}%</span>`).join(' ')}</summary>${p.qs.map(([id])=>qcard(BYID[id],true)).join('')}</details>`).join('')}</section>`).join('')||'<div class="empty">本科目尚無講義資料</div>'}`;
}
function render(){
  header();sidebar();
  document.querySelectorAll('#tabs button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const kw=$('#q').value.trim();
  if(kw)renderSearch(kw);
  else if(view==='mod')renderMod();
  else if(view==='nums')renderNums();
  else if(view==='quiz')renderQuiz();
  else if(view==='lx')renderLx();
  else if(view==='rv')renderRv();
  else renderWrong();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.mi,a[data-go],a[data-rv],a[data-rvs]');if(!t)return;
  if(t.dataset.rvs!==undefined){e.preventDefault();document.getElementById('rvs-'+t.dataset.rvs).scrollIntoView({behavior:'smooth'});return}
  if(t.dataset.rv){e.preventDefault();view='rv';$('#q').value='';render();const d=document.getElementById('rv-'+t.dataset.rv);if(d){d.open=true;d.scrollIntoView()}return}
  if(t.dataset.rvall!==undefined){document.querySelectorAll('#rvbody details').forEach(d=>d.open=t.dataset.rvall==='1');return}
  if(t.matches('a[data-go]')){e.preventDefault();cur=+t.dataset.go;view='mod';render();scrollTo(0,0);return}
  if(t.classList.contains('mi')){cur=+t.dataset.m;view='mod';$('#q').value='';render();scrollTo({top:0});return}
  if(t.dataset.v){view=t.dataset.v;keep.clear();$('#q').value='';render();return}
  if(t.id==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(LS+'_theme',r.dataset.theme)}catch(e){}return}
  if(t.classList.contains('op')){
    const id=t.dataset.q, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz, q=BYID[id], i=+t.dataset.i;
    if((qz?quiz.ans[id]:ST[id])!==undefined)return;
    ST[id]=i;if(qz)quiz.ans[id]=i;record(q,i);save();
    const tmp=document.createElement('div');tmp.innerHTML=qcard(q,!!card.querySelector('.tag.md'),qz);card.replaceWith(tmp.firstElementChild);
    header();sidebar();
    if(view==='quiz'&&quiz&&!$('#q').value){const y=scrollY;renderQuiz();scrollTo(0,y)}
    return}
  if(t.dataset.r){const id=t.dataset.r, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz;
    if(qz)delete quiz.ans[id];else{if(view==='wrong')keep.add(id);delete ST[id];save()}
    if(qz){const y=scrollY;renderQuiz();scrollTo(0,y);header();sidebar();return}
    const tmp=document.createElement('div');tmp.innerHTML=qcard(BYID[id],!!card.querySelector('.tag.md'));card.replaceWith(tmp.firstElementChild);header();sidebar();return}
  if(t.dataset.rwx){delete RW[cur+t.dataset.rwx];render();return}
  if(t.dataset.reset){const k=t.dataset.reset;
    if(k==='all'){if(!confirm('確定清除全部作答紀錄（含作答次數統計）？'))return;ST={};HI={};saveH();keep.clear()}
    else if(k==='wrong')ALL.filter(q=>status(q)==='bad').forEach(q=>{keep.add(q.id);delete ST[q.id]});
    else{const l=ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad'));
      if(k.length>1){if(!l.length){alert('本考點目前沒有答錯的題目');return}RW[cur+k[0]]=new Set(l.map(q=>q.id));OPEN[k[0]]=true}else delete RW[cur+k[0]];
      l.forEach(q=>delete ST[q.id])}
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=60,pr=$('#qpr').value;
    if(src[0]==='y'){const y=+src.slice(1);const pk=DATA.pq.filter(q=>q.y===y).sort((a,b)=>a.n-b.n);
      if(!pk.length){alert('沒有該年度考題');return}
      quiz=pk.map(q=>q.id);quiz.ans={};quiz.yr=y;render();scrollTo(0,0);return}
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    let pick=pool.slice(0,n);
    if($('#qtp').value==='r'&&DATA.qt){  // 依 114 年題型比例分層抽題，不足者以其他題補足
      const K=['neg','combo','fill','ask'],want={};let s=0;K.forEach(k=>{want[k]=Math.round(DATA.qt[k]*n);s+=want[k]});want.neg+=n-s;
      pick=[];K.forEach(k=>pick.push(...pool.filter(q=>q.t===k).slice(0,want[k])));
      const used=new Set(pick.map(q=>q.id));pick.push(...pool.filter(q=>!used.has(q.id)).slice(0,n-pick.length));shuffle(pick)}
    quiz=pick.map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};if(!quiz.yr)shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
let rvT;document.addEventListener('input',e=>{if(e.target.id==='rvq'){clearTimeout(rvT);rvT=setTimeout(rvFilter,150)}});
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)OPEN[d.dataset.sec]=d.open},true);
render();
</script>
</body>
