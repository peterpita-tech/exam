,"s":"第四節 開戶","t":"１、重新<mark>辦理客戶身分審查作業</mark>之時點：(１)個人戶：A.非特定美國人士變成特定美國人士，或反之時。B.客戶提供(不限為書面，口頭表達亦是)或填寫之文件具有美國地址、美國電話或持續指示將資金轉入美國(例如：<mark>於第ｅ個網約定</mark>受款人之<mark>受款地區國別為美國</mark>)，以致於觸發美國指標時。(２)非個人戶：A.非美<mark>國法人或團體</mark>變成美<mark>國法人或團體</mark>(例如：非美商公司變成美商公司)，或反之時。B<mark>.FATCA身分狀態</mark>已<mark>為「31：消極的非金融外國法人或團體」者</mark>(因涉及須辨別其有無持股逾25％之美國籍自然人股東)，並辦理<mark>變更負責人</mark>時。"},"x":"須重新辦理 FATCA 審查：個人戶變更國籍、觸發美國指標（如第 e 個網約定美國受款人）、31 類法人變更負責人；開立新帳戶（含黃金存摺）亦須審查 → ABCD。"},{"id":"112-37","y":112,"n":37,"m":1,"q":"關於提供高齡客戶金融友善服務，下列敘述何者為非？","o":["高齡客戶定義為年滿 55歲(含)以上之自然人","受理存入非本人帳戶、提款、匯款、鉅額資金移轉等交易達新臺幣 50 萬元(含)以上時，系統連動「高齡客戶臨櫃存提(匯)款檢核表」畫面","無法親簽而有見證需求，可由第三人擔任見證人","開立金如意綜合管理帳戶並申請質借功能，應充分告知相關風險"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第一節 存款經辦應有之基本認識","t":"二、<mark>高齡客戶定義</mark>：年滿6<mark>5歲(含)以上之自然人</mark>。三、環境、溝通與服務：(一)各營業單位應設有服務鈴、無障礙坡道、無障礙服務櫃檯及老花眼鏡，並設置符合輪椅使用者之無障礙ATM等友善設施，另配置迎賓專員及專用平板電腦，協助<mark>高齡客戶</mark>預填表單及優先叫號。"},"x":"高齡客戶定義為年滿 <b>65 歲</b>（含）以上之自然人，非 55 歲 → (A)錯。"},{"id":"112-38","y":112,"n":38,"m":2,"q":"關於小額存款繼承，下列敘述何者正確？","o":["繼承存款金額於等值新臺幣 3 萬元(含)以下可適用小額存款繼承規定","未來行之繼承人應提出蓋具印鑑證明章之委託書","需填寫繼承系統表","需由全體繼承人填寫小額存款繼承切結書"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"1-258存款篇(十)繼承人擬領取存款時，若有繼承人拋棄繼承權，應檢具法院准予拋棄繼承權之備查函。(十一)為提升民眾辦理<mark>小額存款繼承</mark>之便利性，銀行公會已研訂「金融機構辦理<mark>繼承存款</mark>簡便措施之建議徵提文件」（銀行公會111.8.22全一字第1110001437號函），爰訂定本行<mark>小額存款繼承</mark>簡便作業措施，就繼承<mark>金額於等值新臺幣</mark>三萬元以下（以單一分行之總存款餘額判斷），免由全體繼承人會同辦理，由來行之繼承人提示下列文件，至本行任一營業單位辦理繼承手續。"},"x":"小額存款繼承簡便措施：繼承金額於等值新臺幣 <b>3 萬元以下</b>（單一分行判斷）免全體繼承人會同 → (A)正確。"},{"id":"112-39","y":112,"n":39,"m":2,"q":"關於客戶申請開立存款餘額證明，下列敘述何者為非？","o":["申請之證明日期在三個月內得以連線方式(交易代號：984S)開立","申請之證明日期逾三個月應以手工方式(交易代號：9S0S)開立","申請之證明日期在三個月內可至國內任一營業單位辦理","申請之證明日期逾三個月僅限原開戶行辦理"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第九節 存款餘額（部分餘額）證明書之填發","t":"(二)申請存款餘額<mark>證明日期逾三個月</mark>以上，或連線交易查無資料者，其作業為："}},{"id":"112-40","y":112,"n":40,"m":3,"q":"外出收付單筆現金達新臺幣 50 萬元(含)以上之大額通貨交易，應以下列何者為交易人，並依其身分證明文件執行「大額通貨交易資料(申報)建檔」(交易代號：A190)？","o":["客戶端負責人","客戶端現金收付人員","外出收付款之行員","執行收、付交易之行員"],"a":1,"ci":{"b":"存款篇","c":"第三章 銀行同業及公庫存款","s":"第二節 公庫存款","t":"(六)單筆提現之金額達新臺幣50萬元以上時，仍應依洗錢防制法有關規定確認實際支領現金客戶身分及留存交易紀錄憑證，並執行「大額通貨維護交易」（交易代號：A190）。"},"x":"外出收付單筆 50 萬元以上現金，以<b>客戶端現金收付人員</b>為交易人並依其身分證明文件建檔 A190。","lo":1},{"id":"112-41","y":112,"n":41,"m":5,"q":"客戶遺留未及領回存摺之管理，下列敘述何者為非？","o":["應儘速通知客戶領回","保管逾二個月未領回應指派外出服務人員送交客戶收執","保管逾二個月未領回得於取得客戶同意後以雙掛號方式郵寄交付","客戶通知不到、無法通知及通知後未領回，得於保管三個月後註銷該保管存摺"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"匯業務紀錄表併同保存。３、另為避免已聯繫到之客戶，經通知後遲未來行領回存摺，保管逾二個月未領回時，應指派外出服務人員送交客戶收執或於取得客戶同意後以雙掛號方式郵寄交付，回執聯與登記簿併同保存。如<mark>客戶通知不到、無法通知及通知後未領回，</mark>經於登記簿之「通知方式」欄註記通知日期或失聯原因<mark>，得於保管</mark>六個月（自登記日期起算）後，由保管主管會同會計人員逕予<mark>註銷該保管存摺</mark>，並於登記簿註記註銷日期及蓋章，陳核至分行經理，以供事後查考。"},"x":"客戶通知不到、無法通知或通知後未領回，得於保管 <b>六個月</b>（自登記日起算）後由保管主管會同會計人員註銷 → (D)「三個月」錯。"},{"id":"112-42","y":112,"n":42,"m":3,"q":"為強化存款開戶審查作業，下列何種情形應婉拒開戶？","o":["客戶留存之通訊/營業地址與其他 4 位以上客戶相同，經查為關係企業","登記項目有資訊軟體服務業，查詢客戶官網有虛擬貨幣漲跌幅之資訊","客戶有多次警示設定/解除等情形，申請開立薪資轉帳戶","以上皆非"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制","t":"第一章通則1-3691-369C.客戶註冊登記資料與網路查詢公開資訊是否相符：a.非個人戶均須勾選。b.客戶登記資料與網路查詢不一致者，應查明原因後再予受理，並紀錄備查。D.是否為處理使領館、外交辦事處或官方帳戶：確認為是，923D交易連動執行A194交易-2.風險因子修改，異動項目「36：使領館、外交辦事處或官方帳戶」(系統設定為高風險客戶，應由資深副理或經理同意開戶)。E.是否為提供虛擬資產服務之事業：如以下問項任一項為「是」，應婉拒開戶。a.客戶是否透露所營事業包含提供虛擬資產服務之事業。b.如<mark>登記項目有</mark>I301010<mark>資訊軟體服務業</mark>、I301020資料處理服務業、I301030電子資訊供應服務業或I301040第三方支付服務業者<mark>，查詢客戶官網</mark>是否<mark>有虛擬貨幣</mark>報價、漲跌幅、貨幣兌換之資訊、購買貨幣、銷售貨幣或支付服務(請以GOOGLE等搜尋引擎<mark>查詢客戶</mark>是否有官網，如有，應列印官網查詢結果備查；如無官網，則應檢視GOOGLE等搜尋引擎查詢結果"},"x":"所營事業包含<b>提供虛擬資產服務</b>（如登記項目有資訊軟體服務且官網有虛擬貨幣資訊）者，應婉拒開戶 → (B)。"},{"id":"112-43","y":112,"n":43,"m":1,"q":"關於社工人員代理接受安置之兒童及少年申請開設存款帳戶，下列敘述何者為非？","o":["應徵提政府機關公文，敘明開戶之兒少姓名及代理開戶人員姓名","應徵提開戶兒少之國民身分證正本及第二身分證明文件正本","核對代理開戶人員之國民身分證正本並留存影本備查","開戶完成後，相關函文應併同開戶申請書掃描留存"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"九、受理接受安置之兒童及少年、受監護宣告者申請開設存款帳戶之作業應注意事項如下：(一)徵提文件：１、由地方主管機關（或內政部所屬機構）出具公文，並敘明開戶之兒少、受監護宣告者姓名、陪同或<mark>代理開戶人員</mark>姓名。"}},{"id":"112-44","y":112,"n":44,"m":5,"q":"櫃員承做有摺戶之無摺支出交易後，下列何種情形應追蹤存戶於七日內補登存摺？","o":["本人臨櫃提領現金","支出用途為其他","支出用途為抵銷","入銷百帳戶"],"a":1,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"４、為加強管控無摺支出交易情形，資訊處產生「櫃員承做有摺戶之無摺支出交易」報表，營業單位應指定專人至「報表查詢列印系統」列印，其處理作業如下：(１)「櫃員承做有摺戶之無摺支出交易」日報表（報表代號：PBD1）：對於<mark>支出用途</mark>「其他」及非本人臨櫃提領現金者，報表將產生「★」號註記，應據以追蹤存戶於七日內補登存摺及辦理註記，如逾期尚未補登，應主動關懷客戶；報表應送主管覆核，倘該報表有無摺提領現金逾新臺幣50萬元以上之交易時，應再呈核至經理。(２)「櫃員承做有摺戶之無摺支出交易」月報表（報表代號：PBD2）：本表係依帳號排序當月有摺戶之無摺支出交易情形，並依支出原因有無「★」號註記分頁產製報表（「★」號註記集中於前面頁次），營業單位僅須列印有「★」號註記之頁次進行確認及呈核，俾利瞭解該帳戶之無摺支出情形，主管人員應審視本報表「最後補摺日」內容，對尚未辦理補摺之交易是否已逾合理期限，並依其支出原因（尤其是「7﹕其他」自行輸入之原因）據以研"},"x":"PBD1 報表對支出用途「<b>其他</b>」及非本人臨櫃提領現金者註記★，應追蹤存戶於七日內補登存摺。"},{"id":"112-45","y":112,"n":45,"m":5,"q":"存戶存摺取款碼鎖碼、遺忘或變更時，下列敘述何者為非？","o":["可由本人攜帶身分證件、存摺及原留印鑑，臨櫃辦理取款碼變更或重設","可至國內任一營業單位辦理取款碼變更或重設","可透過 eATM 辦理取款碼變更或重設，免臨櫃辦理","可透過第 e 個網辦理取款碼變更或重設，免臨櫃辦理"],"a":2,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第五節 取款碼鎖碼、遺忘或變更之處理","t":"一、存戶存摺取款碼鎖碼、遺忘或變更時，應由本人（法人為負責人）攜帶身分證件、存摺及原留印鑑向本行任一營業單位辦理密碼重設手續；另客戶亦得透過本行「第e個網」（路徑：個人化服務→安全設定→存摺通提〈取款〉密碼變更）辦理密<mark>碼變更或重設，</mark>並以SSL、實體OTP、電子憑證或晶片金融卡等安控驗證無誤後辦理<mark>，免臨櫃辦理</mark>，惟以「晶片金融卡」申請變更限僅該晶片金融卡存摺存款帳戶。"},"x":"取款碼變更或重設可臨櫃至任一營業單位，或透過<b>第 e 個網</b>辦理；未開放 eATM 辦理 → (C)錯。"},{"id":"112-46","y":112,"n":46,"m":4,"q":"客戶持支票於 112 年 10 月 25 日來行辦理存入交換票據，下列發票日，何者不得受理？","o":["111 年 10 月 26 日","111 年 10 月 27 日","112 年 10 月 25 日","112 年 10 月26 日"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(六)支票<mark>發票滿一年</mark>之期間，係自發票日起算，至於發票滿一年之期間計算，應算入始日。"},"x":"發票日 111/10/26 之支票，算入始日至 112/10/25 屆滿一年，當日已罹於時效，<b>不得受理</b>。"},{"id":"112-47","y":112,"n":47,"m":2,"q":"存戶未持印鑑或未由本人親自辦理金融卡掛失，不論開戶行或聯行均應先予受理，惟應請存戶於（　）個營業日內補蓋原留印鑑或親簽。","o":["5","7","10","14"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"4.存戶來行領用時，<mark>應請存戶本人親自</mark>提示身分證明文件及存摺、<mark>原留印鑑</mark>，<mark>請存戶於</mark>「變更書」金融卡/密碼函領用欄簽收人親自簽名並加<mark>蓋原留印鑑</mark>，由本行核對親簽與核符<mark>原留印鑑</mark>後始得受理。"},"x":"金融卡掛失未持印鑑或非本人親辦，開戶行或聯行均先受理，惟應請存戶於 <b>5 個營業日</b>內補蓋原留印鑑或親簽。","lo":1},{"id":"112-48","y":112,"n":48,"m":11,"q":"有關「留置金融卡之管理」，倘金融卡為本單位發行者，應交金融卡主管保管，保管期限自留置日(留置單位送出日)之次日起幾日內客戶未取回，應辦理註銷，並於「留置金融卡處理登記簿」登記註銷日期？","o":["5 個營業日","7 個營業日","10 個營業日","14 個營業日"],"a":3,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(二)傳票最遲應於記帳日後七<mark>個營業日</mark>內完成裝訂，國內分行至「傳票帳簿表報保管暨銷燬管理系統」辦理傳票冊數入庫登記，其餘單位則登記於「傳票目錄簿」（會305），並裝入有鎖鑰之箱或庫內，由會計人員負責保管，保管期限至少十五年，如因事實需要，得酌予延長。"},"x":"留置金融卡為本單位發行者交金融卡主管保管，自留置日次日起 <b>14 個營業日</b>內未取回應註銷並登記。","lo":1},{"id":"112-49","y":112,"n":49,"m":11,"q":"「iLEO APP」提供之公用事業費用約定代扣繳服務，下列敘述何者為非？","o":["可線上約定代繳台電電費","客戶於線上完成約定/終止作業後，得於線上查詢設定狀態及繳費紀錄","客戶於線上完成約定/終止作業後，無法臨櫃查詢約定代繳狀態","本功能可透過 SSL、裝置綁定或實體 OTP 等安控驗證辦理"],"a":2,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"２、公用事業費、稅款、信用卡款等各種費用<mark>約定代繳</mark>之扣款帳戶。３、代理證券商證券劃撥帳戶之約定帳戶。４、薪資轉帳之約定帳戶。"},"x":"iLEO APP 公用事業費代扣繳：可線上約定台電電費等、線上查詢設定與繳費紀錄，亦<b>可臨櫃查詢</b>約定狀態；安控可用 SSL、裝置綁定或實體 OTP。","lo":1},{"id":"112-50","y":112,"n":50,"m":1,"q":"執行「整合開戶交易」時，若客戶約定網路銀行之轉入他人(非同 ID)或他行帳號已有被約定轉入達特定筆數，以下敘述何者為非？","o":["應確認客戶與約定轉入帳號之所有人是否有合理關聯、地緣或業務往來關係","於「判定合理原因」欄詳實敘明正常之理由","如有可疑情形，應依規辦理疑似洗錢及資恐交易申報作業","直接婉拒客戶約定此轉入帳號"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"(四)客戶申請轉入他人（行）帳號或線上約定<mark>轉入帳號</mark>服務，經辦應辦理臨櫃關懷作業及提供「防範詐騙提醒事項」文宣予存戶，並於「申請書」相關欄位勾選註記。"},"x":"約定轉入他人或他行帳號已被多人約定時，應確認關聯性並於「判定合理原因」欄敘明，可疑者申報；並非「直接婉拒」。","lo":1},{"id":"112-51","y":112,"n":51,"m":1,"q":"有關 iLEO 數位帳戶線上開戶，下列敘述何者為非？","o":["個人戶限年滿 7 歲並領有國民身分證之本國自然人申請","僅限個人戶申請","每一申請人限開立一戶","係指以本行網路方式開立之綜合管理帳戶"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１２、開戶建檔交易完成後，依客戶需求選擇「電子簽名」或「紙本簽名」：(１)電子簽名A.適用對象：<mark>限個人戶</mark>(含籌備處)且同意以「電子簽名」辦理者，但受監護/輔助宣告人或有見證人/代理人(不含未成年人之法定代理人)者除外。B.應告知客戶本行將以「電子簽名」方式辦理開戶，需請其另簽署「電子簽名同意書」。C.於「交易執行前置處理」頁面，勾選「電子簽名」並點選「電子傳送」，系統將傳送開戶申請書等文件至無紙化系統供客戶檢視確認，如客戶反映"},"x":"iLEO 數位帳戶線上開戶：個人戶限年滿 7 歲本國自然人、每人限一戶、帳戶性質為綜合管理帳戶；<b>非個人戶亦得申請</b>，故「僅限個人戶」錯誤。","lo":1},{"id":"112-52","y":112,"n":52,"m":9,"q":"有關傳票覆核之作業，下列敘述何者為是？<br><span class=\"it\">A.</span> 覆核人員覆核同一櫃員期間最長不得逾 3 個月<br><span class=\"it\">B.</span> 覆核人員指派登記簿由會計人員保管，保存 5 年<br><span class=\"it\">C.</span> 覆核人員應由自行查核主管負責指派<br><span class=\"it\">D.</span> 覆核人員休假，由覆核人員之職務代理人辦理覆核","o":["ABC","ACD","BCD","ABCD"],"a":1,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"(一)各櫃員結帳後應<mark>由覆核人員辦理覆核</mark>，<mark>覆核人員應由自行查核主管</mark>指派，並登記於「<mark>覆核人員指派登記簿</mark>」。<mark>自行查核主管</mark>指派<mark>覆核人員</mark>時應於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派<mark>辦理覆核</mark>。指派<mark>覆核人員覆核同一櫃員期間最長不得逾</mark>三個月，<mark>登記簿由自行查核主管</mark>自行保管並列入移交，保存五年。"},"x":"覆核同一櫃員最長 3 個月（A）、由自行查核主管指派（C）、休假由覆核人員之職務代理人辦理（D）；登記簿由<b>自行查核主管</b>保管，非會計人員（B 錯）→ ACD。"},{"id":"112-53","y":112,"n":53,"m":9,"q":"傳票若有缺漏事項，應於記帳日起____內補正；傳票裝訂最遲應於記帳日起____內完成裝訂。","o":["5 個營業日；5 個營業日","5 個營業日；7 個營業日","7 個營業日；5 個營業日","7 個營業日；7 個營業日"],"a":3,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(二)傳票最遲應於記帳日後七<mark>個營業日</mark>內完成裝訂，國內分行至「傳票帳簿表報保管暨銷燬管理系統」辦理傳票冊數入庫登記，其餘單位則登記於「傳票目錄簿」（會305），並裝入有鎖鑰之箱或庫內，由會計人員負責保管，保管期限至少十五年，如因事實需要，得酌予延長。"},"x":"傳票缺漏應於記帳日起 <b>7 個營業日</b>內補正；最遲於記帳日後 <b>7 個營業日</b>內完成裝訂，保管至少 15 年。"},{"id":"112-54","y":112,"n":54,"m":9,"q":"每月月算係為正確反映每月之損益，下列何者不屬月算之調整作業項目？","o":["應收、應付利息之提存","向國庫繳納營業稅稅款","營業稅稅額之提存","固定資產提列折舊"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"4.給付所得所扣取之稅款應帳列「應付代收款─應付代扣稅款專戶」。(二)於規定期限內繳納：1.納稅義務人如為中華民國境內居住之個人，或在中華民國境內有固定營業場所之營利事業：應於每月十日前將上一月內所扣稅款<mark>向國庫繳</mark>清。"},"x":"月算調整：應收應付利息提存、營業稅稅額提存、折舊攤提等；<b>向國庫繳納營業稅</b>屬繳稅作業，非月算調整項目。"},{"id":"112-55","y":112,"n":55,"m":7,"q":"目前營業單位辦理營業稅申報完成後，應於申報期限屆滿之次日起____屆滿後，由「財政部稅務入口網」網站查詢並列印「核定結果畫面」，確認「查詢結果」後送交主管人員覆核。","o":["2 個月","3 個月","6 個月","1 年"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"款書(總行上傳)」，列印「營業稅繳款書」，於繳納期限前完成繳納。(三)核定：於前述<mark>申報期限屆滿之次日起</mark>六個月<mark>屆滿後，由「財政部稅務入口網」網站查詢並列印「核定結果畫面」，確認「查詢結果」後送交主管人員覆核</mark>，會計人員及<mark>主管人員</mark>應分別於<mark>「查詢結果」</mark>處下方蓋章。如對<mark>核定結果</mark>不服，應於復查時效內申請復查。"},"x":"營業稅核定：於申報期限屆滿之次日起 <b>六個月</b>屆滿後，由財政部稅務入口網查詢列印核定結果送主管覆核。"},{"id":"112-56","y":112,"n":56,"m":9,"q":"依商業會計法規範，費用開支所取得之原始憑證，自憑證所載日期起算最遲多久內須將帳務整理完畢？","o":["2 個月","3 個月","6 個月","12 個月"],"a":0,"ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"5.<mark>費用開支</mark>請款登帳，<mark>原始憑證</mark>要件不全。<mark>費用開支所取得之原始憑證</mark>（發票或收"}},{"id":"112-57","y":112,"n":57,"m":7,"q":"納稅義務人如為中華民國境內居住之個人，扣繳義務人應於何時將利息所得扣繳稅款向該管稽徵機關申報？","o":["代扣稅款之日起 10 日內","代扣稅款日之次月 10 日前","代扣稅款日之次月月底前","每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"四、繳稅：(一)代扣之利息所得稅款，應於每月十日<mark>前將上一</mark>月內所扣稅款向國庫繳清，並於<mark>每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具</mark>「各類所得扣繳暨免<mark>扣繳憑單</mark>」<mark>，彙報該管稽徵機關</mark>查核。（所得稅法第92條）"},"x":"境內居住個人利息扣繳：每月 10 日前繳清上月稅款，<b>每年一月底前</b>開具扣繳憑單彙報稽徵機關。"},{"id":"112-58","y":112,"n":58,"m":9,"q":"下列有關傳票之敘述何者錯誤？","o":["單式傳票僅記載一個會計項目","製票同時辦理記帳之傳票，認證人員仍須於認證欄蓋章","因錯帳執行沖正交易時，應立即送主管人員認證覆核","傳票已由電腦列印記帳員姓名者，記帳欄位免再人工蓋章"],"a":1,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"五、傳票認證：(一)主要在核對傳票認證欄印錄內容是否與傳票記載事項相符，傳票經辦理電腦登錄記帳後，應由<mark>認證人員</mark>負責辦理認證並<mark>於認證欄蓋章</mark>確認，惟部分傳票係<mark>製票同時辦理記帳</mark>，或於執行記帳交易時連動帶出，因製票及記帳係同時產生，不致發生製票、記帳內容不符之情形，是類傳票得免<mark>於認證欄蓋章</mark>。"},"x":"製票同時辦理記帳或交易連動帶出之傳票，製票與記帳同時產生，<b>得免於認證欄蓋章</b> → (B)錯。"},{"id":"112-59","y":112,"n":59,"m":9,"q":"國內分行會計人員依櫃員別整理傳票，下列何者櫃員之傳票自 1 號起編，且該櫃員傳票最末號數應與「分行結帳資料表」該櫃員之「傳票張數」相符？","o":["票據櫃員","後送櫃員","櫃員主任","聯往櫃員"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"(三)新臺幣傳票及外幣傳票分別彙整後，將新臺幣傳票置於外幣傳票之前，加具封面及底頁裝訂成冊。(四)<mark>國內分行會計人員依櫃員別整理傳票，</mark>新臺幣一般櫃員、新臺幣虛擬櫃員(票據櫃員、後送櫃員、櫃員主任)及外匯櫃員(含虛擬櫃員)傳票免編號，新臺幣虛擬櫃員(<mark>聯往櫃員</mark>)<mark>傳票自1號起編，</mark>新臺幣虛擬櫃員(<mark>聯往櫃員</mark>)<mark>傳票最末號數應與「分行結帳資料表」該櫃員之「傳票張數」相符</mark>；另<mark>「分行結帳資料表」之「傳票張數</mark>合計」加計「分行外匯結帳表」<mark>之「傳票張數</mark>合計」之總數應與傳票封面「本日傳票總<mark>數」相符</mark>。"},"x":"新臺幣虛擬櫃員中只有<b>聯往櫃員</b>傳票自 1 號起編，最末號數應與分行結帳資料表之傳票張數相符；其餘櫃員免編號。"},{"id":"112-60","y":112,"n":60,"m":10,"q":"關於預算開支付款之程序，下列敘述何者為是？","o":["開支前無論申請之預算核准與否，只要取得統一發票或收據即可付款","私車公用補貼之燃料費，僅提供車號之統一發票即可付款","一律取得統一發票後才申請預算辦理付款","未訂立契約之交易，應依估價單內約定購置標的之規格、條款辦理驗收及付款"],"a":3,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第三節 開支審核","t":"二、<mark>未訂立契約之交易，應依估價單內約定購置標的之規格、條款辦理驗收及付款</mark>。三、單據(發票/收據)之審核：(一)各項開支均應取得合法之單據憑證，及其附屬有關書據。"},"x":"未訂立契約之交易，應<b>依估價單內約定之規格、條款</b>辦理驗收及付款 → (D)正確。"},{"id":"113-1","y":113,"n":1,"m":3,"q":"受理為就業薪資轉帳開立帳戶需要，經警示戶當事人提出在職證明申請開戶時，下列敘述何者為非？","o":["開立之存款帳戶種類限活期存款或活期儲蓄存款或金如意綜合管理帳戶","如客戶非本行既有客戶，須另執行「存款餘額留存登錄及解除」交易(交易代號：9330，代碼50-設定衍生管制戶)，將所開帳戶設定為衍生管制帳戶","開戶後將暫停其使用提款卡、語音轉帳、網路轉帳及其他電子支付功能","匯入款項逕以退匯方式退回匯款行"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"條及勞動基準法第58條及勞工職業災害保險及保護法第33條第2項等)。(２)前述情形辦理開戶作業應注意下列事項：A.開立薪資轉帳帳戶者，當事人應提出在職證明或任職公司之證明文件；向銀行申辦貸款並經審核同意撥款或其他法律另得開立帳戶者，應徵取相關證明文件。B.<mark>存款帳戶種類</mark>僅<mark>限活期存款</mark>及<mark>活期儲蓄存款</mark>，但不含數位<mark>存款帳戶</mark>、離職儲金帳戶及<mark>金如意綜合管理帳戶</mark>。C.執行開戶交易時，「開戶作業檢核表」之「查詢『Z22通報案件紀錄及補充註記資訊』是否無揭露相關資訊或註記」欄位應輸入(勾選)「異常」選項，並註明仍受理開戶之理由。"},"x":"警示戶因薪資轉帳開戶，帳戶種類<b>僅限活期存款及活期儲蓄存款</b>，不含數位帳戶、離職儲金及金如意帳戶 → (A)錯。"},{"id":"113-2","y":113,"n":2,"m":3,"q":"下列有關告誡帳戶之敘述，何者為非？","o":["受告誡處分者之洗錢風險等級視為高風險，應加強盡職調查","受告誡處分者帳戶之存入交易應加強關懷","法院扣押解繳、票據交換兌付作業(MICR)不受限制","每個帳戶之金融卡每日轉帳及提領金額上限各為等值新臺幣一萬元"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"２、<mark>受告誡處分者帳戶之存入交易</mark>不受限制；辦理各項臨櫃支出或匯出匯款交易，應判斷交易合理性，並得請客戶提供佐證資料，如判斷交易顯不合理時，得婉拒交易。"},"x":"受告誡處分者帳戶之<b>存入交易不受限制</b>；臨櫃支出或匯出才需判斷合理性 → (B)錯。"},{"id":"113-3","y":113,"n":3,"m":3,"q":"有關iLEO線上開戶審查作業之敘述，何者為非？","o":["有警示帳戶/衍生管制帳戶設定紀錄者，不得核准開戶","一年內有解除警示紀錄一次者，不得核准開戶","客戶如屬虛擬通貨平台及交易業務事業，應婉拒開戶","客戶如從事當鋪業、貨幣兌換商等高風險行業，應先執行「客戶風險評分交易」(交易代號：A194)"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"２、開戶應經較高層級主管（資深副理或經理）核准：(１)為加強確認客戶身分作業，由具權限之主管登入AML系統｢客戶管理｣模組中點選｢客戶資料｣，於｢客戶號碼｣欄位輸入客戶之ID，查詢風險評級資料與分數報告，判斷是否同意開戶。(２)同意開戶者，較高層級主管應於相關文件印錄之「本客戶須經資深副理或經理同意開戶」提醒字樣旁蓋章確認，且如客戶無法提供其他資料進行加強客戶審查，蓋章處應敘明同意開戶之理由；以9236交易開戶者，較高層級主管應於9236交易認證單末頁印錄之<mark>核准開戶</mark>字樣旁蓋章確認，免再逐頁逐交易之高風險客戶提醒字樣旁蓋印核准。(３)拒絕開戶者（含應婉拒開戶對象），應執行「客戶警示名單維護」交易（交易代號：A245，警示代碼：Z1-拒絕開戶）建檔。"},"x":"iLEO 線上開戶：有警示／衍生管制紀錄者不得核准；虛擬通貨業者婉拒；高風險行業先執行 A194；「一年內解除警示一次即不得核准」並非規定。","lo":1},{"id":"113-4","y":113,"n":4,"m":5,"q":"有關綜合存款之定儲存，下列何者為是？<br><span class=\"it\">A.</span> 如約定到期不續存，到期日當日(含例假日)將自動解約存入綜存之活期性存款帳戶<br><span class=\"it\">B.</span> 如臨櫃辦理中途解約，金額在新臺幣100 萬元(不含)以上，由經辦確認存戶解約意願<br><span class=\"it\">C.</span> 以電子化通路辦理轉存定儲存，每一帳戶每月累計限額為新臺幣 500 萬元","o":["僅 AB","僅 A","ABC","僅 AC"],"a":1,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第三節 存、取款及質借","t":"２、存單存根聯註明「由綜存<mark>之定儲存</mark>改簽存單，未填製存入傳票」，存戶填寫之申請書按日期別妥善保存。(五)利用<mark>電子化通路</mark>進行<mark>活期性存款</mark>轉存定<mark>期性存款，每一帳戶每月累計限額為新臺幣</mark>3<mark>00萬元</mark>。惟有下列情形者，不計入<mark>累計限額</mark>："}},{"id":"113-5","y":113,"n":5,"m":7,"q":"有關代收稅款相關作業，下列何者為非？","o":["納稅義務人於繳納期限內以即期票據繳納稅款者，視為如期繳納","依稅捐稽徵法規定，每逾3日按滯納數額加徵1%滯納金，最高至30日","各項稅款、滯納金及利息之金額一律計算至「元」為止","繳納期間之末日如適逢星期日或國定假日者，仍以該日為繳納期間之末日"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１、擬參選人於選舉投票日（含選舉投票日）起15日（末日為星期日、<mark>國定假日</mark>或其他休息日者，以該日之次日為<mark>期間之末日</mark>）內，仍得臨櫃存入現金，逾期即不許其存入。"},"x":"代收稅款：繳納期間末日遇星期日或國定假日，<b>以次日為期間末日</b>；即期票據繳納視為如期繳納；每逾 3 日加徵 1% 滯納金，最高至 30 日。","lo":1},{"id":"113-6","y":113,"n":6,"m":4,"q":"支票存款戶申請變更印鑑僅填寫「存戶更換印鑑/戶名/代表人/統一編號申請書」，未填寫「支票存款戶憑舊式印鑑付款通知書」者，下列何者為是？","o":["以舊印鑑簽發之票據一律付款","以舊印鑑簽發之票據一律退票","發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，憑舊印鑑付款","發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，憑新印鑑付款"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"1-205第一章通則<mark>發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，</mark>本行仍<mark>憑舊印鑑付款</mark>，故可於印鑑暨影像管理系統備註訊息欄註明「票據發票日於年月日前，且與刪除保留之印鑑式樣相符者始可付款。」"},"x":"發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，本行<b>仍憑舊印鑑付款</b>。"},{"id":"113-7","y":113,"n":7,"m":2,"q":"甲未婚無子女，父母及祖父母均已死亡，其有兄弟乙、丙、丁三人，乙有配偶 A 及子 B，甲死亡後，乙、丙、丁三人均拋棄繼承，請問何者可繼承甲之存款？","o":["僅 A","僅 B","A、B","以上皆非"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"1-258存款篇(十)繼承人擬領取存款時，若有繼承人<mark>拋棄繼承</mark>權，應檢具法院准予拋棄繼承權之備查函。"},"x":"第三順位兄弟姊妹全部拋棄，第四順位祖父母已歿 → 無人繼承；兄弟之配偶、子女<b>不得代位</b>，故以上皆非。"},{"id":"113-8","y":113,"n":8,"m":3,"q":"關於「大額通貨交易資料(申報)建檔」交易，下列何者交易資料不予傳送法務部調查局？","o":["單筆提取現金新臺幣 50 萬元","單筆存入現金新臺幣 50 萬元","單筆換鈔金額新臺幣 50 萬元","單筆現金繳納稅款 50 萬元"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"第一章通則1-3851-385(１)本類交易資料應鍵入「大額通貨交易資料（申報）建檔」交易（交易代號：A190）畫面相關欄位，交易資料並印錄於「大額通貨交易資料（申報）建檔認證用紙兼提問表」（存184）。(２)對於上述1.（1）、（2）類對象，其帳戶發生存/提之大額通貨交易仍須執行A190交易建檔，且建檔資料將一律傳送法務部調查局申報。(３)對於代收款項相關交易（如︰代收稅款、代收勞/健/國民年金保險費..等，交易代號：詳見A190操作手冊，操作手冊電子檔置放於企業內部入口網站/法金（存匯）/知識庫/防制洗錢），<mark>單筆現金</mark>交易達新臺幣<mark>50萬元</mark>以上時，將產生大額通貨序號，請於確認客戶身分後，逕予執行A190交易，交易種類04-代理業務，其交易資料將不予傳送法務部調查局。(４)對於大額現金存入免申報帳戶，存入<mark>單筆現金</mark>交易達新臺幣<mark>50萬元</mark>以上時，將產生大額通貨序號，請於確認客戶身分後，逕予執行A190交易，交"}},{"id":"113-9","y":113,"n":9,"m":3,"q":"下列有關第三方支付服務業者業務往來之控管措施，何者為非？","o":["未完成數位發展部能量登錄者，不得受理其開立新戶","經濟部商工登記公示資料載有 I301040 第三方支付服務業時，即應完成數位發展部能量登錄","既有客戶未於一定期限完成數位發展部能量登錄者，應請其結清銷戶","能量登錄效期屆滿，得向數位發展部申請展延一期"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(８)受理公司/行號申請開戶，查詢經濟部商工登記公示資料時，應檢視其所營事業資料(或營業項目)，倘載有「I301040<mark>第三方支付</mark>服務業」時，應另至數位發展部數位產業署網站(路徑：首頁&gt;業務服務&gt;申請服務&gt;能量登錄&gt;第三方支付服務機構服務能量登錄)，確認其已完成能量登錄，方能受理開戶；"},"x":"第三方支付服務業應完成數位發展部能量登錄始得開立新戶；既有客戶未完成登錄者應加強審查／限制，並非一律結清銷戶。"},{"id":"113-10","y":113,"n":10,"m":3,"q":"為提高臨櫃攔阻詐騙成效，執行端末交易時，如比對與「疑涉詐騙境內金融帳戶預警清單」相符時，系統將提醒營業單位加強關懷提問，下列何者不在加強關懷提問範圍？","o":["存摺存款支出交易","定期存款支出交易","匯款申請登錄交易","存摺存款收入交易"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(十六)為降低客戶遭詐騙之風險，受理客戶臨櫃辦理下列存、提、匯款等交易時，系統將於輸入支出或收入帳號後進行名單檢核作業，如經比對與內政部警政署提供之「疑涉詐騙境內金融帳戶預警清單」相符，將提示「帳號疑為異常帳戶(銀行別:XXX/帳號:0000000000000000)(如:銀行別:007/帳號:0000009368788827)，請加強臨櫃關懷或交易審核，必要時請通知警察協處。請確認是否繼續執行交易，如要繼續執行請按是(Y)，取消請按否(N)」提醒視窗：交易名稱交易代號檢核欄位存摺<mark>存款支出交易</mark>1560/1561支出帳號、轉帳收入帳號支票<mark>存款支出交易</mark>3560存摺存款收入交易1760/1761收入帳號支票存款收入交易3760匯款申請登錄交易9660收款人帳號轉帳支出帳號、收款人帳號匯款申請登錄交易-有摺專用"},"x":"預警清單檢核適用存摺存款支出、定期存款支出、匯款申請登錄等交易；<b>存摺存款收入交易</b>不在加強關懷提問範圍 → 官方答案 (B)。"},{"id":"113-11","y":113,"n":11,"m":9,"q":"有關自動櫃員機現金短缺及剩餘之「作業風險事件通報管理系統」通報時限，下列敘述何者為是？","o":["發生現金短缺時，應於發現日後(不含當日)5個營業日內上網登錄及放行","發生現金剩餘達新臺幣10萬元(含)以上，如發現當日查明緣由並已沖正，得於發現日後(含當日)5個營業日內上網登錄結案","發生現金短缺，自發生日起20日內查明緣由沖正者，免上網登錄","發生現金剩餘達新臺幣10萬元(含)以上，未於發現當日查明緣由者，免上網登錄"],"a":1,"ci":{"b":"存款篇","c":"第三章 銀行同業及公庫存款","s":"第三節 代理公庫","t":"2.當日結帳前發現已登錄之國庫支票資料有誤須予沖正時，應以「國庫支票兌付沖正」（交易代號C153）辦理沖正。3.本行與央行因故斷線並已設定為離線狀態時，如須辦理國庫支票兌付者，得先以「國庫支票掛失止付新增及查詢」（交易代號C753）查詢國庫支票至前一營業日之掛失止付狀態及含當日總行營業部接獲傳真所輸入之掛失止付資料，確認該支票未辦理掛失止付；如兌付支票金額在新臺幣一百萬元（含）以上或有疑義者，亦得將支票傳真國庫局查詢確認後再予兌付。其兌付作業得以「離線兌付國庫支票」（交易代號C663）辦理。當日已連線登錄或離線登錄之國庫支票兌付交易須予沖正者，得以「離線沖正國庫支票」（交易代號C673）辦理沖正。上述於離線狀態辦理離線交易者，俟與央行恢復連線後，應由總行營業部辦理離線交易之傳檔作業。"},"x":"ATM 現金剩餘達 10 萬元以上，如發現當日查明並沖正，得於發現日後（含當日）5 個營業日內登錄結案；現金短缺應即通報，不得逾期或免登錄。","lo":1},{"id":"113-12","y":113,"n":12,"m":5,"q":"有關金如意綜合管理帳戶之作業規定，下列敘述何者為是？","o":["已取得居留權之外籍人士，其金如意綜合管理帳戶定儲存一律設為「不質借」","未成年人不得申請開立金如意綜合管理帳戶","可註銷全行代付款服務","可執行「存摺存款客戶資料查詢」交易(交易代號：1030)查詢各項業務餘額"],"a":0,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"三、金如意帳戶之定存（新臺幣、外幣）性質別<mark>一律設為「</mark>綜存存單」，若約定為「可質借，其所有定存均作為各該幣別活期性存款質借使用；另受理未成年人申辦本項業務時，倘其申請新臺幣或外匯綜存為可質借者，應依私人借款之授信相關規範徵取所需文件後，始可辦理；倘受理<mark>已取得居留權之外</mark>國人士（含大陸人士）申辦本項業務時，其新臺幣、外幣綜存存單<mark>一律設為「不質借」</mark>。"},"x":"已取得居留權之外國人士（含大陸人士）申辦金如意帳戶，其新臺幣、外幣綜存存單<b>一律設為「不質借」</b> → (A)正確。"},{"id":"113-13","y":113,"n":13,"m":5,"q":"受理聯行客戶存提作業，下列敘述何者為是？","o":["存戶輸入取款碼連續錯誤達四次時，電腦始自動停止憑摺付款交易","客戶離行後始發現金額錯誤應辦理交易沖正，再執行無摺轉帳支出交易（交易代號：1560），於「原沖正交易序號」欄輸入該筆沖正交易序號","辦理單筆金額達新臺幣 50 萬元以上之存入交易時，應以主管核准交易方式辦理","存戶註銷全行代付款，僅限於原開戶分行辦理"],"a":1,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第四節 代付存款","t":"三、倘<mark>客戶離行後始發現</mark>交易錯誤（支出誤打為收入或轉帳、現金帳務別錯誤）或<mark>金額錯誤</mark>辦理<mark>沖正交易</mark>時，應以無摺方式處理，惟應以主管核准交易辦理，並由主管認證。再辦理<mark>轉帳支出交易（交易代號：1560），</mark>應於<mark>支出交易</mark>之<mark>「原沖正交易序號」欄輸入該筆沖正交易</mark>之序號，系統將自動檢核帳號相符且確實有<mark>沖正交易</mark>始完成該筆無摺<mark>支出交易</mark>；如係帳號輸入錯誤，則無法使用本處理方式，應儘速採取權宜措施並洽請客戶來行辦理更正，必要時可請原始存款行協助辦理。"},"x":"客戶離行後始發現金額錯誤，應以主管核准辦理沖正，再執行 1560 並於「<b>原沖正交易序號</b>」欄輸入該沖正交易序號 → (B)正確。"},{"id":"113-14","y":113,"n":14,"m":11,"q":"辦理傳真委託轉帳/匯款業務，客戶應於傳真指示交易之日起（　）內，將傳真文件正本送交本行，若以快遞發送或以掛號郵件寄送分行，其信封應至少保留一個星期以上始可銷毀。","o":["15日","7個營業日","10日","10個營業日"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(三)營業單位接獲營運業務處通知時，應於<mark>7個營業日</mark>內填報「警示帳戶（人頭帳戶）發生原因檢討表」，針對警示帳戶新增原因進行檢討並敘明改進措施，檢討表正本送營運業務處，影本留存1年備查。"},"x":"傳真文件正本應於 <b>7 個營業日</b>內送交；以快遞或掛號寄送者信封至少保留一星期。","lo":1},{"id":"113-15","y":113,"n":15,"m":11,"q":"單筆匯款金額超過新臺幣","o":["1萬元(不含)","2萬元(不含)","3萬元(不含)","5萬元(不含) 以上且有收取手續費及填寫收款人手機號碼者，櫃員於「匯款申請登錄交易」(交易代號:9560/9561/9660/9661)輸入收款人手機號碼，款項匯出後，系統將自動發送簡訊至收款人手機"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(十九)為維金融消費者之權益，採取下列措施以防止理財業務人員及金融商品銷售人員未經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項：交易名稱<mark>交易代號</mark>檢核欄位存摺存款支出交易1<mark>560/</mark>1561支出帳號、轉帳收入帳號支票存款支出交易3560存摺存款收入交易1760收入帳號、存款人統編、代理人統編存摺存款收入交易1761收入帳號支票存款收入交易3760<mark>匯款申請登錄交易9660</mark>收款人帳號、<mark>匯款申請</mark>人統編、代理人統編支出帳號、收款人帳號、<mark>匯款申請</mark>人統編、代理人統編<mark>匯款申請登錄交易</mark>-有摺專用"},"x":"單筆匯款超過新臺幣 <b>5 萬元</b>（不含）且收取手續費並填收款人手機者，匯出後系統自動發簡訊通知收款人。","lo":1},{"id":"113-16","y":113,"n":16,"m":7,"q":"有關給付中華民國境內居住者之執行業務所得扣繳及申報規定，下列敘述何者為非？","o":["扣：扣繳率 10％(惟每次扣繳稅額不超過新臺幣二千元者，免予扣繳)","繳：每月底前將上一月扣繳稅款向國庫繳納","填：加總統計給付資料，填發各類所得扣繳暨免扣繳憑單","報：扣繳義務人應於每年一月底前將上一年內扣繳之相關文件向稽徵機關申報"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"四、繳稅：(一)代扣之利息所得稅款，應於每月十日<mark>前將上一月</mark>內所扣<mark>稅款向國庫繳</mark>清，並於每年一<mark>月底前將上一</mark>年內扣繳各納稅義務人之稅款數額，開具「各類所得扣繳暨免扣繳憑單」，彙報該管稽徵機關查核。（所得稅法第92條）"},"x":"執行業務所得扣繳率 10%（每次 2,000 元以下免扣），應於<b>每月 10 日前</b>將上月扣繳稅款繳庫（非月底）；每年 1 月底前申報。"},{"id":"113-17","y":113,"n":17,"m":9,"q":"有關傳票覆核人員之指派，下列何者為是？<br><span class=\"it\">A.</span> 覆核人員覆核同一櫃員期間最長不得逾 3 個月<br><span class=\"it\">B.</span> 應登記於「工作派令簿」<br><span class=\"it\">C.</span> 覆核人員應由自行查核主管指派<br><span class=\"it\">D.</span> 覆核人員休假，由結帳人員之職務代理人辦理覆核","o":["AB","AC","BC","BD"],"a":1,"ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"原指派由D覆核，仍應由該虛擬櫃員之<mark>覆核人員</mark>B<mark>辦理覆核</mark>。人員辦理，並登記於<mark>工作派令簿</mark>。所有櫃員包括一般櫃員、虛擬櫃員和臨時指派開櫃之櫃員完成結帳工作後，應再換人覆核，<mark>覆核人員應由自行查核主管指派</mark>，並<mark>應登記於「覆核人員</mark>指派登記簿」。<mark>自行查核主管指派覆核人員</mark>時於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派<mark>辦理覆核</mark>。指派<mark>覆核人員覆核同一櫃員期間最長不得逾</mark>三個月，登記簿<mark>由自行查核主管</mark>自行保管並列入移交，保存五年。遇<mark>覆核人員休假</mark>時，傳票之覆核工作應由該<mark>覆核人員之職務代理人</mark>負責辦理。若因<mark>職務代理</mark>造成覆核本身所經辦之帳務，或因該請假人員職務分工之需要，<mark>自行查核主管</mark>應另行指派其他人員辦理該請假人員之覆核工作，並應於該櫃員之「櫃員結帳彙總查詢單（已結帳）」(交易代號：1099-2轉帳結帳設定)上註明「因<mark>職務代理</mark>改派○○○覆核傳票」後，緊接處<mark>由自行查核主管</mark>蓋章證明。﹝會計篇第二章第二節﹞﹝2022/01/25會財字第00007號﹞"},"x":"覆核人員覆核同一櫃員最長 3 個月（A）、由自行查核主管指派（C）；應登記於「覆核人員指派登記簿」非工作派令簿（B 錯）；休假由<b>覆核人員</b>之職務代理人辦理（D 錯）→ AC。"},{"id":"113-18","y":113,"n":18,"m":9,"q":"櫃員制下傳票之彙整及裝訂，下列敘述何者為非？","o":["複式轉帳傳票排列於單式傳票前","複式轉帳傳票依傳票類別分類彙整，免排序","單式傳票按轉帳收入、現金收入、轉帳支出及現金支出分類","外幣傳票置於新臺幣傳票之前"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"一、臨櫃傳票之分類、整理：(一)各櫃員之傳票應按複式轉帳傳票、單式傳票分類，單式傳票再按轉帳收入、現金收入、轉帳支出及現金支出分類；排列時，複式轉帳傳票排列於單式傳票前，複式轉帳傳票依傳票類別分類彙整，免排序，單式傳票依活存、行存、支存、活儲、放款、定儲存、代理聯行收付（NET）、匯出匯款申請書及調整單、聯行往來、會計明細分類帳(按會計項目別)及其他等順序排列，如有二個以上會計項子目時，則依第一個會計項子目排列，將「櫃員結帳彙總查詢單（已結帳）」置於<mark>傳票之前</mark>交會計人員彙整，會計人員應再依「分行結帳資料表」之櫃員順序排列。"},"x":"新臺幣傳票及外幣傳票分別彙整後，應將<b>新臺幣傳票置於外幣傳票之前</b> → (D)錯。"},{"id":"113-19","y":113,"n":19,"m":7,"q":"有關印花稅課稅範圍，下列何者為非？","o":["銀錢收據(含兼具營業發票性質之銀錢收據及兼具銀錢收據性質之營業發票)","承攬契據","買賣動產契據","典賣、讓受及分割不動產契據"],"a":0,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"<mark>據及兼具銀錢收據性質之營業發票</mark>，不包括在內。(二)買賣動產契據。(三)承攬契據。(四)典賣、讓受及分割不動產契據。二、免稅範圍："},"x":"印花稅課稅範圍之銀錢收據，<b>不包括</b>兼具營業發票性質之銀錢收據及兼具銀錢收據性質之營業發票 → (A)錯。"},{"id":"113-20","y":113,"n":20,"m":10,"q":"各單位業務人員提供私人車輛、手機供公務使用，其私車公用燃料費及私人手機電話費每人每月補貼上限分別為何？","o":["500 元，500 元","1,000 元，1,000 元","1,000元，500 元","500 元，1,000 元"],"a":2,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"標的、次數、費率及違約之罰則等。（2）一般性費用：A.除契約性費用以外之費用開支，如營業場所之修繕、專戶支票及代學校收取學雜費單據等之印製，或因業務需要刊登廣告、委聘律師、會計師及專業顧問公司之諮詢服務等費用屬之。B.申請費用時，除委聘律師、會計師及專業顧問公司之諮詢服務等費用須檢附相關簽准文件，於【預算線上簽核系統】以「費用追加預算申請單」向本處申請外，其餘須檢附估價單或其影本，於【預算線上簽核系統】以「費用支出及資本支出申請單」或「總部費用支出及資本支出申請單」向業管單位逐案申請。C.各單位業務人員提供私人車輛、手機供公務使用，營業單位得參酌營運狀況由經理核定，總部單位應先簽請核准後辦理，其補貼上限如下：a.私車公用燃料費：每人每月新臺幣<mark>1,000元</mark>。b.私人手機電話費：每人每月新臺幣<mark>500元</mark>。"}},{"id":"113-21","y":113,"n":21,"m":8,"q":"有關逾櫃員付現額度之大額付款作業程序，下列敘述何者為非？","o":["櫃員於受理時，應審視傳票各要項齊全，核對印鑑正確辦理記帳","逾櫃員付現額度時，應先由主管認證覆核，並檢視存摺記載無誤後，交櫃員主任辦理付款","記入櫃員主任帳辦理之付款，均須經第三人(辦理記帳交易之櫃員及櫃員主任以外人員)覆點無誤後交付領款人","櫃員主任於檢點現鈔後，應將傳票正面朝上連同現鈔交點鈔員辦理覆點"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"四、為簡化作業流程，縮短客戶等候時間，營業單位櫃員得於下列規定額度內辦理付款、認證事項：(一)<mark>櫃員付現額度：櫃員辦理各種新臺幣存款之提領</mark>，其現金支付金額在新臺幣參拾萬元以內者，得逕予付款，惟應立即交主管或檢核專員覆核認證。"},"x":"逾櫃員付現額度之大額付款：主管認證覆核後交櫃員主任付款，並經第三人覆點；選項 D 所述傳票交付方式與規定不符。","lo":1},{"id":"113-22","y":113,"n":22,"m":9,"q":"營業單位於假期間辦理行內ATM裝卸鈔作業規定，下列敘述何者為非？","o":["裝卸鈔當日應填寫「假期間裝卸鈔作業紀錄表」","卸下之機存現金應置放於金庫室之現金室內","「假期間裝卸鈔作業紀錄表」由櫃員主任保管並於次一營業日交付ATM經辦","「假期間裝卸鈔作業紀錄表」應裝訂於次一營業日依據紀錄表執行端末「自動櫃員機裝卸鈔維護交易」印錄之傳票後保管留存"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"十三、有關營業單位行外自動櫃員機委託保全公司填補鈔作業，如係採將補鈔金額匯款或轉帳至保全公司指定帳戶之交易方式辦理，非屬「金融機構防制洗錢辦法」所稱申報大額通貨交易之範圍，爰辦理行外ATM裝卸鈔暫以其他應收款墊支及歸墊作業，得免辦理A190交易之建檔，為配合本項作業，執行A830、A836交易並以「其他應收款-其他應收款諸戶」子目下「安豐保全公司」（代號：14184-501）及「聯安保全公司」（代號：14184-502）分戶辦理之現金存入及支出之交易，將不產生大額通貨序號。"},"x":"同 111 年題：「假期間裝卸鈔作業紀錄表」由櫃員主任保管並次一營業日交付 ATM 經辦之敘述錯誤。","lo":1},{"id":"113-23","y":113,"n":23,"m":8,"q":"有關自動櫃員機密碼變更，下列敘述何者為是？<br><span class=\"it\">A.</span> 密碼每屆滿1年前<br><span class=\"it\">B.</span> 職務異動時<br><span class=\"it\">C.</span> 休假逾7天<br><span class=\"it\">D.</span> 休假期間可能辦理裝卸鈔作業","o":["AB","ACD","ABC","BCD"],"a":3,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"（八）態樣「*9」係指同一台<mark>自動櫃員機</mark>(ATM)於同日（00：00∼24：00）出現密集辦理晶片卡密碼初值變更交易情形。"},"x":"ATM 密碼變更時機：職務異動、休假逾 7 天、休假期間可能辦理裝卸鈔（BCD）；「每屆滿 1 年前」非規定期間。","lo":1},{"id":"113-24","y":113,"n":24,"m":11,"q":"存戶憑本行金融卡於自動櫃員機提取新臺幣及外幣(折合新臺幣)，當日累計金額達新臺幣（　）時，應俟次日始得繼續提領。","o":["2萬元","3萬元","5萬元","10萬元"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"1.客戶使用同一張金融卡每日提領新臺幣<mark>10萬元</mark>，且連續提領5日。2.客戶使用同一張金融卡連續提領7日，且累計提領<mark>金額達新臺幣</mark>50萬元。2疑似洗錢表徵第A99項D13同一台ATM於同日(00:00~24:00)出現下述情形:"},"x":"金融卡當日提領累計達 <b>10 萬元</b>即須次日始得繼續提領。","lo":1},{"id":"113-25","y":113,"n":25,"m":1,"q":"下列有關開戶申請人聯絡資訊與本行既有警示帳戶資訊相同之控管機制，何者為非？","o":["聯絡資訊與本行既有警示帳戶資訊相同時，應加強客戶KYC驗證並瞭解原因","一律婉拒受理開戶","倘與2人以上重複聯絡資訊，原則不受理其自動化服務業務申請","倘與3人以上重複，原則應婉拒受理開戶"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"２、經執行【與警示帳戶聯絡資料重複檢核】，倘與2人以上警示帳戶重複聯絡資訊，原則不受理其自動化服務業務申請；倘與3人以上重複，原則應<mark>婉拒受理開戶</mark>。"},"x":"與警示帳戶聯絡資訊重複：2 人以上原則不受理自動化服務申請，<b>3 人以上</b>原則婉拒開戶，並非一律婉拒 → (B)錯。"},{"id":"113-26","y":113,"n":26,"m":5,"q":"有關綜合存款之規定，下列敘述何者為非？","o":["定儲存起存額為新臺幣 1 萬元","活存/活儲餘額未達新臺幣 1萬元不予計息","外籍人士辦理定期儲蓄存款預設為無自動轉期","約定自動轉息者，定儲存利息不得約定轉入存戶於本行開立之其他活期(儲)存款帳戶"],"a":3,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第五節 計息","t":"一、本存款之計息，活存、活儲存部分按活期存款、活期儲蓄存款計息辦法，定、儲存部分按定期存款、定期儲蓄存款計息辦法自動轉入約定之<mark>自動轉息</mark>帳戶，擔放之計息期間、積數計算原則均比照第二章支票存款第六節透支計息辦法處理。"}},{"id":"113-27","y":113,"n":27,"m":5,"q":"金如意綜合管理帳戶可做為<br><span class=\"it\">A.</span> 本行核准貸款循環額度之約定帳戶<br><span class=\"it\">B.</span> 公用事業費、稅款、信用卡款等各項費用約定代繳之扣款帳戶<br><span class=\"it\">C.</span> 代理證券商證券劃撥帳戶之約定帳戶<br><span class=\"it\">D.</span> 薪資轉帳之約定帳戶","o":["僅 B","ABCD","僅 ABC","僅 BD"],"a":1,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"２、<mark>公用事業費、稅款、信用卡款等各</mark>種<mark>費用約定代繳之扣款帳戶</mark>。３、<mark>代理證券商證券劃撥帳戶之約定帳戶</mark>。４、<mark>薪資轉帳之約定帳戶</mark>。"},"x":"金如意帳戶可作為循環額度約定帳戶、各項費用代繳扣款帳戶、證券劃撥約定帳戶、薪資轉帳約定帳戶 → ABCD。"},{"id":"113-28","y":113,"n":28,"m":2,"q":"有關本行綜合業務對帳單規定，下列敘述何者為非？","o":["新開戶約定以電子郵件寄發者，如未完成電子郵件信箱驗證，將改以「親取」辦理","客戶可向本行客服申請補寄前已寄發之電子對帳單資料","郵寄對帳單一律寄送至客戶登錄於本行之通訊地址","可指派理財業務人員列印對帳單並通知客戶來行親取"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第七節 存戶基本資料","t":"(四)成Email信箱驗證後，電子綜合業務對帳單服務將於完成驗證後次月起生效；若未完成驗證，客戶需至原開戶分行親自領取實體綜合業務對帳單。"},"x":"對帳單不得指派理財業務人員列印交付；未完成 Email 驗證者改為親取；郵寄一律寄至登錄之通訊地址。","lo":1},{"id":"113-29","y":113,"n":29,"m":5,"q":"受理存摺存款戶辦理無摺支出交易，下列敘述何者為非？","o":["辦妥支出交易後應請客戶七日內補登存摺","本人或負責人臨櫃辦理時，應請其於取款憑條親簽確認支出意旨","本人或負責人未臨櫃辦理時，由主管向存戶確認並將確認情形記載於取款憑條背面","本人或負責人未臨櫃辦理提領現金時，毋須記載交易人姓名"],"a":3,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"第四章活期存款4-4(１)本人（或公司、行號、團體之負責人）<mark>臨櫃辦理</mark>時：提領金額不受限制，惟應請存戶出示身分證明文件由記帳經辦確認係本人辦理，並請其於取款憑條親簽確認無摺支出意旨，再由經辦於取款憑條背面認證欄「※向本人確認無誤（經辦蓋章）：」後蓋章，再據以辦理支出作業。(２)本人（或公司、行號、團體之負責人）<mark>未臨櫃辦理</mark>時：A.存戶<mark>提領現金</mark>以新臺幣50萬元為限，逾該金額之提現，得經單位經理於取款憑條背面認證欄「※<mark>提領現金</mark>逾新臺幣50萬元須經單位經理同意（蓋章）：」蓋章同意後酌情辦理，惟應依規辦理確認。B.由主管向存戶本人或公司確認，並將確認情形（公司接聽人員、確認結果）記載於取款憑條背面認證欄「※接聽人員：」及「確認結果：□正常□異常」後蓋章後再辦理支出，<mark>提領現金</mark>應於取款憑條背面認證欄「※領現留存<mark>交易人姓名</mark>：」<mark>記載交易人姓名</mark>。C.辦妥支出交易後應促請客戶七日內持存摺來行或利用自動化設備補登存摺（執行交易代號：1030-6，查核『最後補摺日』），有關存摺補登情形之追蹤"},"x":"本人未臨櫃辦理無摺提領現金時，<b>應留存交易人姓名</b>，(D)「毋須記載」錯。"},{"id":"113-30","y":113,"n":30,"m":5,"q":"有關代製傳票作業，下列敘述何者為非？","o":["限臨櫃客戶有攜帶存摺，或客戶所述帳號及戶名等資料與本行系統內容相符者，始得為其代製傳票","客戶確認「取款憑條(代製傳票專用)」內容無誤後，應於存戶簽章欄蓋具原留印鑑","臨櫃交易人確認「存款憑條(代製傳票專用)」內容無誤後，應於存款人簽章欄簽名或蓋章","若代製傳票內容與客戶提供之帳號或戶名不符時，得提示代製傳票請客戶檢閱確認"],"a":3,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"(三)若所<mark>代製傳票與客戶提供之帳號</mark>、戶名資料不符，為免客戶資料外洩，已代製好之傳票不得提示予臨櫃<mark>客戶檢閱</mark>，並須回收銷毀。"},"x":"代製傳票與客戶提供之帳號、戶名不符時，為免資料外洩，<b>不得提示予客戶檢閱</b>並須回收銷毀 → (D)錯。"},{"id":"113-31","y":113,"n":31,"m":5,"q":"有關存款帳戶結清銷戶之作業規定，下列敘述何者為是？","o":["客戶存摺遺失，得於任一營業單位辦理掛失後，免補發存摺，以無摺方式辦理結清銷戶","可辦理聯行客戶郵寄結清銷戶作業","以第 e 個網辦理線上結清，新臺幣活期性存款餘額不得超過10 萬元","存戶如已更名，得免辦理更名手續，逕憑存戶本人親簽辦理"],"a":0,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"1.發生，事故代號：32.存摺掛失，不<mark>補發存摺</mark>）<mark>後，免補發存摺，</mark>逕<mark>以無摺方式辦理</mark>帳戶結清作業。"},"x":"存摺遺失者，得辦理掛失（事故代號 32 存摺掛失不補發）後，<b>免補發存摺</b>以無摺方式辦理結清 → (A)正確。"},{"id":"113-32","y":113,"n":32,"m":6,"q":"有關定期儲蓄存款作業，下列敘述何者為是？","o":["開戶存儲對象限個人辦理","零存整付儲蓄存款續存、委託代繳申請/終止，限原開戶分行辦理","逾期轉存未滿 1 年之定期存款，如逾期期間在 2 個月以內者，得自原存款到期日起息","存本取息中途解約支付本息時，如有溢付利息應予扣回"],"a":3,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第五節 其他處理要點","t":"一、定期儲蓄存款<mark>中途解約</mark>時，參照第十章定期存款之規定辦理。<mark>存本取息中途解約支付本息時，</mark>存戶已照原存單利率按月領取之利息<mark>，如有溢付應予扣回</mark>，並將溢扣之所得稅退還存戶（交易代號：243）。"},"x":"存本取息中途解約支付本息時，已照原存單利率按月領取之利息<b>如有溢付應予扣回</b>，並退還溢扣所得稅 → (D)正確。"},{"id":"113-33","y":113,"n":33,"m":11,"q":"有關黃金存摺定期投資，下列敘述何者為非？","o":["客戶可選擇「定期定額」或「定期不定額」投資方式","得選擇每月1~26日中任一日或數日為扣款日，最多可指定6個日期","每次指定投資金額不得低於新臺幣3,000元或美金200元","客戶僅得向原開戶行提出申請"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十九節 其他處理要點","t":"(二)既有支票存款戶申請/變更/註銷(限<mark>向原開戶行</mark>申請)：應請客戶填寫「支票存款戶申請/變更/註銷存款不足通知申請書」(下稱申請書)，經辦人員依申請書內容執行「支票存款內容變更」交易(交易代號：330，變更代碼：09，變更內容：0.註銷、1.e-mail、2.簡訊、3.e-mail及簡訊)，辦理存款不足通知方式建檔作業。"},"x":"黃金存摺定期投資得向國內<b>任一營業單位</b>申請，並非僅限原開戶行。","lo":1},{"id":"113-34","y":113,"n":34,"m":11,"q":"黃金存摺帳戶符合下列哪些要項，即可至任一營業單位辦理結清銷戶？","o":["為正常戶無事故登錄且無法院扣押設定","結存餘額(含公克、盎司)為零","如有申請轉換提領實體黃金，需俟本行完成交付","以上皆需符合"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十三節 新一代金融端末系統之使用與管理","t":"一、目的為減輕主管事務性工作，俾強化管理職能暨業務推展，於兼顧內控原則下訂定本規範。二、應具備資格條件存匯檢核專員應由9職等(含)以上之行員擔任，且需符合下列資格條件之一："},"x":"黃金存摺至任一營業單位結清，須同時符合：正常戶無事故及法院扣押、結存餘額（公克／盎司）為零、申請之實體黃金已完成交付。","lo":1},{"id":"113-35","y":113,"n":35,"m":11,"q":"有關匯款申請書（兼取款憑條）各欄位之審核，下列敘述何者為非？","o":["收款人戶名：應填寫戶名之全銜","交易日期：匯款申請書以複式傳票辦理，傳票日期得適用取款憑條所填日期在七日內有效之規定","申請人：填寫匯款申請人之姓名、聯絡電話及身分證件號碼","本行扣款帳號：匯款申請書以複式傳票辦理，應填寫存摺存款帳號扣取匯款金額或匯款金額＋手續費"],"a":1,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"一、<mark>取款憑條所填日期</mark>如在領款日期前7天以內者可以付款；超過7天以上或在領款日期以後者，應請存戶更改並加蓋原留印鑑後始可付款。"},"x":"匯款申請書之交易日期不適用取款憑條 7 日內有效規定。","lo":1},{"id":"113-36","y":113,"n":36,"m":3,"q":"匯款匯入之存款帳號為<br><span class=\"it\">A.</span> 結清戶<br><span class=\"it\">B.</span> 警示帳戶<br><span class=\"it\">C.</span> 衍生管制帳戶<br><span class=\"it\">D.</span> 拒絶往來戶（　）將由中心主機自動予以退匯。","o":["ABCD","僅ABD","僅AB","僅ABC"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"三、警示帳戶之設定：(一)存款帳戶經通報為警示帳戶者，營業單位或信用卡處-客戶服務部應即執行「存戶餘額留存登錄及解除交易」（交易代號：9330，代碼：20）設定為警示帳戶（設定時免輸入金額，惟應依警調單位傳送文件中記載之案情輸入案情摘要），電腦並立即連動暫停該帳戶全部交易功能，<mark>匯入款項逕以退匯方式退回匯款行</mark>。"},"x":"結清戶、警示帳戶、衍生管制帳戶及拒絕往來戶之匯入款，均由中心主機<b>自動退匯</b> → ABCD。"},{"id":"113-37","y":113,"n":37,"m":11,"q":"受理單筆新臺幣3萬元(含)以上、50萬元(不含)以下現金匯款之作業規定，下列敘述何者為非？","o":["匯款單留存匯款人姓名、身分證號碼(或統一證號)及電話","匯款人為本人，且為金融機構認識之客戶，並在金融機構留有身分資料紀錄者，得免出示身分證明文件","如為代理人辦理，僅需影印匯款人之身分證明文件留存，毋需核對代理人身分","如為代理人辦理，僅需核對代理人身分，如代理人為金融機構認識之客戶，並在金融機構留有身分資料紀錄者，得免出示身分證明文件"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項 附錄二 金融機構辦理國內匯款及無摺存款作業確認客戶身分原則","t":"（二）<mark>如為代理人辦理</mark>者，僅<mark>需核對代理人身分</mark>。該代理人如為該金融機構認識之客戶，且在該金融機構留有身分資料紀錄者，得免出示<mark>身分證明文件</mark>，該金融機構可依據留存之身分紀錄，核對匯款申請書或無摺存款單填寫之資料。"},"x":"代理人辦理 3 萬～50 萬元現金匯款，<b>僅需核對代理人身分</b>（認識之客戶得免出示），並非僅影印匯款人身分證明 → (C)錯。"},{"id":"113-38","y":113,"n":38,"m":4,"q":"有關代收票據之收受，下列敘述何者為非？","o":["審核票據要項是否齊全、背書是否連續、票背是否填記委託人帳號與戶名","應在票面加蓋特別 a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十七節 臨櫃手續費、服務費及自動化服務設備手續費之計收與減免 附錄一 自動化服務設備手續費減免作業應注意事項","t":"(三)EDI電子轉帳跨行交易及通匯交易:包含清算費、電子傳輸費。三、減免方式：(一)「自動櫃員機跨行提款」及「自動化服務設備跨行轉帳/本行ATM跨行存款交易」：營業單位權限為『「自動櫃員機跨行提款」小於10次（含）且「自動化服務設備跨行轉帳/本行ATM跨行存款」小於10次（含）』，任一項超過者即須送營運業務處，俟核准後始可辦理。(二)EDI電子轉帳：清算費、電子傳輸費由「付款人負擔」方式辦理者，由營業單位經理自行決定，並以金額全數減免方式辦理。"},"x":"營業單位減免權限：自動櫃員機跨行提款 <b>10 次</b>（含）以下且跨行轉帳／存款 <b>10 次</b>（含）以下。"},{"id":"113-42","y":113,"n":42,"m":1,"q":"受理客戶為受監護、受輔助宣告之人開戶時，不得開立何種帳戶？","o":["活期儲蓄存款","定期性存款","綜合存款","金如意綜合管理帳戶"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"},"x":"受監護、受輔助宣告之人不得開立支票存款及<b>金如意綜合管理帳戶</b>。"},{"id":"113-43","y":113,"n":43,"m":2,"q":"有關受理外籍人士以郵寄方式申請變更新式統一證號，下列何者為非？","o":["應檢附載有新式統一證號之居留證正反面影本","新式統一證號格式為 2碼英文+8碼數字","可透過內政部移民署全球資訊網之「移民署新舊統一證號申請結果查詢」網頁查詢舊式統一證號","可郵寄至任一分行辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"４、內政部移民署於110年1月2日起實施新式外來人口統一證號專案，將統一證號比照國人身分證字號格式修正為<mark>1碼英文＋9碼數字</mark>，換號期間為110年1月2日起至119年12月31日止，換發新號前，舊號仍可使用，120年1月1日起，舊式統一證號全面停用。"},"x":"新式統一證號格式為 <b>1 碼英文＋9 碼數字</b>，非 2 碼英文＋8 碼數字 → (B)錯。"},{"id":"113-44","y":113,"n":44,"m":1,"q":"甲、乙、丙三位客戶聲明其稅籍狀態分別為甲：具有中華民國及日本稅籍、乙：具有中華民國及美國稅籍、丙：具有中華民國及新加坡稅籍，受理開戶時「CRS 外國稅籍註記」欄位何者要輸入「N」？","o":["甲乙丙","甲","乙","丙"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"(七)如客戶非<mark>中華民國稅籍、美國稅籍</mark>者，應於<mark>「CRS外國稅籍註記」欄位</mark>輸入「Ｙ」，系統將連動<mark>「CRS</mark>客戶基本資料建檔交易」(9777交易)，應辦理其英文姓名、現在居住國家、地址及具有稅籍之居住國家或地區、稅籍編號及無法取得稅籍編號原因等資料建檔。"},"x":"CRS 外國稅籍註記：甲（日本）、丙（新加坡）具中華民國及美國以外稅籍輸入 Y；乙僅中華民國及美國稅籍 → 輸入 <b>N</b>。"},{"id":"113-45","y":113,"n":45,"m":1,"q":"關於籌備處開戶，下列何者為非？","o":["得以其申請人名義申請開立活期存款、定期存款或支票存款","籌備處一律為高風險客戶","由系統連動執行「成年監護、輔助宣告資料交易(9590)」查詢籌備處申請人之監護、輔助宣告資料","籌備處名稱得並列於戶名內(例：第一股份有限公司籌備處王大明)"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(一)籌設中之公司、行號、機關、團體<mark>得以其申請人名義申請開立活期存款或定期存款</mark>，惟該籌備處名稱得並列於戶名內（例：第一股份有限公司籌備處王大明），並登記<mark>其申請人</mark>之身分證統一編號及住址，以備將來利息所得稅歸戶之用。故開戶申請書以個人戶方式填寫資料，且客戶類別勾選「個人戶」、性別欄亦須勾選。公司籌設階段向銀行開立帳戶時，應以「公司名稱及所營事業登記預查表」核准之申請人為開戶申請人；又開戶地址非以代表人戶籍所在地為必要，申請人僅須表達係為籌設公司登記需要，即可於擬設公司所在地開戶。（經濟部96.9.28經商字第09602423260號函）"},"x":"籌設中之公司得以申請人名義開立<b>活期存款或定期存款</b>，不含支票存款 → (A)錯。"},{"id":"113-46","y":113,"n":46,"m":2,"q":"關於存款繼承，下列何者為非？","o":["遺產稅繳清或免稅證明書可作為被繼承人死亡證明文件","僅原開戶行可辦理存款繼承作業","委託他人代辦存款繼承，委任人(即繼承人)之身分證可以影本加註「與正本相符」並加蓋印鑑證明之印鑑章替代","小額存款繼承，免由全體繼承人會同辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"(二)<mark>受理聯行小額存款繼承</mark>，除支票存款、理財存摺或其他依客戶性質（例如無摺存款戶）無法聯行辦理結清者，以代收件送原開戶行辦理外，得逕予辦理。"},"x":"存款繼承（含小額）<b>聯行亦可受理</b>，無法聯行結清者以代收件送原開戶行；小額存款繼承免全體繼承人會同。"},{"id":"113-47","y":113,"n":47,"m":1,"q":"下列何者可作為行號開戶之第二身分證明文件？","o":["國稅局繳稅證明","商業登記核准函","負責人身分證","負責人健保卡"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.主管機關核准之登記證照或核准函、備查函。2.統一編號編配通知書(函)。3.負責人身分證件。1.應徵取之文件：(1)法人登記證明文件(2)負責人身分證明文件(3)法人出具在台代表人或代理人之授權書。(4)國稅局核發扣繳統一編號。"},"x":"行號開戶第二身分證明文件可用<b>國稅局繳稅證明</b>；繳稅證明不能作為開戶唯一依據。"},{"id":"113-48","y":113,"n":48,"m":7,"q":"中華民國境內無住所而於一課稅年度內在中華民國境內居住合計滿 183 天者，付息時達到扣繳標準，其存款利息所得稅按給付額扣取","o":["百分之十","百分之十五","百分之二十","百分之二十五"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(三)付息時可確定存戶<mark>在中華民國境內無住所而於一課稅年度內在中華民國境內居住合計滿183天者，其存款利息所得稅</mark>得<mark>按給付額扣取百分之十</mark>。"},"x":"境內無住所但一課稅年度內居住合計滿 <b>183 天</b>者，利息所得稅按給付額扣取 <b>10%</b>。"},{"id":"113-49","y":113,"n":49,"m":5,"q":"關於存戶未及時領回存摺，下列敘述何者為非？","o":["應登記於「存戶未及領回存摺、印鑑、空白取款憑條、金融卡及密碼函登記簿」","該存摺應交由指定主管集中保管","保管逾二個月未領回時，得於取得客戶同意後以雙掛號方式郵寄交付","客戶通知不到、無法通知及通知後未領回，得於保管三個月後，由保管人員會同會計人員註銷該存摺"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"匯業務紀錄表併同保存。３、另為避免已聯繫到之客戶，經通知後遲未來行領回存摺，保管逾二個月未領回時，應指派外出服務人員送交客戶收執或於取得客戶同意後以雙掛號方式郵寄交付，回執聯與登記簿併同保存。如<mark>客戶通知不到、無法通知及通知後未領回，</mark>經於登記簿之「通知方式」欄註記通知日期或失聯原因<mark>，得於保管</mark>六個月（自登記日期起算）<mark>後，由保管</mark>主管<mark>會同會計人員</mark>逕予註銷該保管存摺，並於登記簿註記註銷日期及蓋章，陳核至分行經理，以供事後查考。"},"x":"未及領回存摺，通知不到等情形得於保管<b>六個月</b>後，由保管主管會同會計人員註銷 → (D)錯。"},{"id":"113-50","y":113,"n":50,"m":11,"q":"個人網路銀行約定轉入他人(行)新臺幣存款帳號，經本行於申請當日審核通過後","o":["次日","次一營業日","次二日","次二營業日 生效"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄五 第一商業銀行防杜人頭帳戶應注意事項","t":"(四)客戶申請電話語音銀行及網路銀行約定轉入帳戶者，視客戶性質及風險程度高低，評估於申辦日後次一日生效，或<mark>拉長生效時間為次二日生效</mark>(惟同一統一編號帳戶經評估並無遭詐騙損失之虞者除外)。"},"x":"個人網銀約定轉入他人（行）帳號，審核通過後<b>次二日</b>生效（本人同 ID 帳號當日生效）。"},{"id":"113-51","y":113,"n":51,"m":5,"q":"「第e個網」客戶之新臺幣活期性存款帳戶餘額不超過（　），得辦理線上結清銷戶作業。","o":["5萬元","10萬元","15萬元","20萬元"],"a":0,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"十七、<mark>線上結清銷戶</mark>(一)存戶<mark>新臺幣活期性存款帳戶餘額不超過</mark>新臺幣伍萬元者，得利用第ｅ個網<mark>結清銷戶</mark>功能<mark>辦理線上結清銷戶作業。</mark>"},"x":"第 e 個網線上結清銷戶：新臺幣活期性存款帳戶餘額不超過 <b>5 萬元</b>。"},{"id":"113-52","y":113,"n":52,"m":9,"q":"目前國內分行會計人員依櫃員別整理傳票，下列虛擬櫃員何者免按傳票張數編號，並免於封面記載編號號數？<br><span class=\"it\">A.</span> 櫃員主任<br><span class=\"it\">B.</span> 聯往櫃員<br><span class=\"it\">C.</span> 票據櫃員<br><span class=\"it\">D.</span> 後送櫃員","o":["ABC","BCD","ABD","ACD"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"(三)新臺幣傳票及外幣傳票分別彙整後，將新臺幣傳票置於外幣傳票之前，加具封面及底頁裝訂成冊。(四)<mark>國內分行會計人員依櫃員別整理傳票，</mark>新臺幣一般櫃員、新臺幣<mark>虛擬櫃員</mark>(<mark>票據櫃員</mark>、<mark>後送櫃員</mark>、<mark>櫃員主任</mark>)及外匯櫃員(含<mark>虛擬櫃員</mark>)傳票免編號，新臺幣<mark>虛擬櫃員</mark>(<mark>聯往櫃員</mark>)傳票自1號起編，新臺幣<mark>虛擬櫃員</mark>(<mark>聯往櫃員</mark>)傳票最末號數應與「分行結帳資料表」該櫃員之「<mark>傳票張數</mark>」相符；另「分行結帳資料表」之「<mark>傳票張數</mark>合計」加計「分行外匯結帳表」之「<mark>傳票張數</mark>合計」之總數應與傳票封面「本日傳票總數」相符。"},"x":"票據櫃員、後送櫃員、櫃員主任傳票<b>免編號</b>；聯往櫃員自 1 號起編 → ACD。"},{"id":"113-53","y":113,"n":53,"m":9,"q":"有關應付款項逾請求權有效期限十五年而無請求付款者，倘確實無法通知存戶取回，下列各項得逐筆登記於「整理訖債務登記簿」後，逕行轉入「其他什項收入」項目「過期帳收入」？<br><span class=\"it\">A.</span> 應付支票存款拒絕往來戶存款專戶<br><span class=\"it\">B.</span> 簽發本行支票專戶(屆滿一年以上轉入)<br><span class=\"it\">C.</span> 警示帳戶剩餘款<br><span class=\"it\">D.</span> 預收放款延滯案款項","o":["ABC","BCD","ABD","ACD"],"a":0,"ci":{"b":"會計篇","c":"第一章 總則","s":"第三節 會計項目及記帳手續","t":"2.支付：應填製（借）其他應付款傳票，憑以記帳。3.清理：(1)<mark>應付款項逾請求權有效期限</mark>(十五年)<mark 訪：(一)開戶後如有<mark>變更負責人</mark>之情事，或非個人戶為久未往來戶欲申領空白支票時，應於客<mark>戶申請變更</mark>後兩週內再次<mark>實地查訪瞭解客戶經營狀況，惟實地查訪日期不得晚於客戶領取空白票據日期</mark>，並將查訪情形註記於「本行<mark>支票存款</mark>帳戶開戶/久未往來戶恢復往來/<mark>變更負責人</mark>查註事項」(存516)「簽註意見」欄，另<mark>變更負責人</mark>時，則應於次營業日所產生之「<mark>支票存款戶</mark>開戶基本資料異動明細表」（日報，CK37）備註欄註記<mark>完成實地查訪日期</mark>，並由<mark>支票存款</mark>經辦及主管蓋章。"},"x":"支存戶變更負責人，應於<b>兩週內</b>完成實地查訪，且不得晚於領取空白票據日期。"},{"id":"114-2","y":114,"n":2,"m":4,"q":"有關受理存戶申請本行支票，下列敘述何者正確？","o":["得以現金申請","毋須瞭解申請目的","應記載受款人","一律須禁止背書轉讓"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"四、銀行簽發本行支票，<mark>應記載受款人</mark>，並加劃平行線。五、銀行對本行支票之簽發程序及空白支票之登記保管，應予嚴格管制，並自行訂定管制辦法予以實施。"},"x":"銀行簽發本行支票，應<b>記載受款人</b>並加劃平行線 → (C)正確。"},{"id":"114-3","y":114,"n":3,"m":1,"q":"受理籌備處開戶或受理其正式成立公司來行申請變更戶名及印鑑時，有關審查作業下列敘述何者不正確？","o":["申請資格：籌備處開戶之申請人以與本行往來 6 個月以上之既有客戶為原則","籌備處開戶可提供自動化服務(如金融卡、個人網路銀行等)","合理審查期間約 7~10 個營業日","檢視申請人帳戶最近 3 個月之往來交易有無異常"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)<mark>籌備處開戶</mark>一律不<mark>提供自動化服務(如金融卡、個人網路銀行等)</mark>。(五)辦理開戶交易或顧客基本資料建檔時（交易代號：9234、9236或9700等），應鍵入其申請人之身分證統一編號，如該申請人業以其個人名義於本行（含全體聯行）往來時，則應以「顧客基本資料查詢交易」（9701）查詢確認適用之重複序號；另存戶業種編號應編為私人「060010」；企業型態則為「7：籌備處」；企業組織「0：個人」。"},"x":"籌備處開戶<b>一律不提供自動化服務</b>（如金融卡、個人網銀）→ (B)錯。"},{"id":"114-4","y":114,"n":4,"m":1,"q":"受理本國未成年人開戶(不含支票存款帳戶)，下列何者不正確？","o":["父母偕同未成年人來行辦理","父母共同來行代理未成年子女開戶，未成年人可不必到場","父或母一方單獨持他方同意書代理未成年子女開戶，未成年人可不必到場","限制行為能力人不得自行持父母同意書單獨臨櫃辦理開戶"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"６、為利未成年人<mark>辦理開戶</mark>(不含支票存款帳戶)，受理本國未成年人開戶得依下列任一方式辦理：(１)父母偕同未成年人來行辦理。(２)父母共同來行代理未成年子女開戶，未成年人可不必到場。(３)父或母一方單獨持他方同意書代理未成年子女開戶，未成年人可不必到場。(４)<mark>限制行為能力人得自行持父母同意書單獨臨櫃辦理開戶</mark>。"},"x":"<b>限制行為能力人得</b>自行持父母同意書單獨臨櫃辦理開戶 → (D)「不得」錯。"},{"id":"114-5","y":114,"n":5,"m":5,"q":"有關辦理新臺幣活期(儲)存款變更為綜合存款帳戶作業，下列敘述何者不正確？","o":["應請客戶於「往來業務項目申請(變更)申請書」(存513)勾選「活期(儲)存款變更為綜合存款」","「綜存質借」記號預設為「可質借」","「綜存質借」記號預設為「不可質借」","如客戶申請綜存質借功能，將於定存金額九成範圍內質借"],"a":1,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第二節 開戶","t":"合存款」（新），存摺第一頁印錄舊摺餘額資料，且<mark>綜存質借記號預設</mark>「不<mark>可質借」</mark>。(５)倘客戶申請綜合存款帳戶為可質借，應請客戶再於「往來業務項目申請(變更)申請書(存513)」之「臺幣綜存」欄位勾選<mark>「可質借」</mark>，並執行<mark>綜存質借</mark>記號變更交易（交易代號：1300，變更代碼：29，變更內容：〝0〞可質借）。(６)執行「印存摺封面帳號戶名&amp;磁條更改」（交易代號：0821）辦理新存摺帳號、戶名、存摺流水號及磁條印錄，並依第四章第九節辦理（活期（儲）存款）舊摺作廢及（綜合存款）新摺簽發作業。"},"x":"活期（儲）存款變更為綜合存款，綜存質借記號<b>預設「不可質借」</b> → (B)錯。"},{"id":"114-6","y":114,"n":6,"m":1,"q":"為落實戶籍謄本減量政策，營業單位遇有客戶使用電子戶籍謄本申辦業務時，不得拒絕受理，惟應至","o":["經濟部商工登記資料系統","公司名稱及所營事業登記預查網路核覆查詢系統","內政部戶政司全球資訊網","司法院網站「家事事件公告專區」 辦理查詢，以確保電子戶籍謄本資料之正確性"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)受理未成年人申請開戶時，如提示戶口名簿或電子戶籍謄本作為主要證件者，應透過<mark>內政部戶政司全球資訊網</mark>查驗該證件之有效性，並列印查詢結果備查。"},"x":"提示戶口名簿或<b>電子戶籍謄本</b>者，應透過<b>內政部戶政司全球資訊網</b>查驗有效性並列印備查。"},{"id":"114-7","y":114,"n":7,"m":2,"q":"印鑑暨影像管理系統授權功能，下列敘述何者不正確？","o":["系統自動授予分行經理「最高授權管理者」權限","系統自動授予存匯副理「作業主管」權限","系統自動授予高櫃(含櫃員主任)及矮櫃人員「查詢人員」權限","人工辦理權限異動後，列印「人員權限異動明細表」核對，並按日期順序裝訂，留存 6 個月備查"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"2.臨時授權：如因人員代理需要，可由「最高授權管理者(SU)」手工授權「作業主管（UU）」權限，「作業主管（UU）」手工授權「查詢人員」或「建檔人員」權限，再由第二位作業主管（UU）或最高授權管理者（SU）辦理覆核始生效力；完成<mark>權限異動後，</mark>應<mark>列印「人員權限異動明細表」核對，並按日期順序裝訂，留存</mark>1年備查。"},"x":"人工辦理權限異動後列印「人員權限異動明細表」核對，按日期順序裝訂，留存 <b>1 年</b>備查，非 6 個月 → (D)錯。"},{"id":"114-8","y":114,"n":8,"m":11,"q":"黃金存摺定期投資，每次最低指定投資金額(不含手續費)為","o":["新臺幣 3,000 元或美金 200 元","新臺幣 5,000 元或美金 200 元","新臺幣 3,000 元或美金 300 元","新臺幣 5,000 元或美金 300 元 新臺幣以 1,000 元為單位累加；美金以 10 元為單位累加"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十七節 臨櫃手續費、服務費及自動化服務設備手續費之計收與減免 附錄一 自動化服務設備手續費減免作業應注意事項","t":"請開立。每張100元。申請變更本行支票受款人。每張30元。票據掛失止付。每張/次100元。掛失空白票據時，得以每次100元計收（不限張數）。支票存款撤銷/恢復付款委託。每張150元。領取空白新臺幣票據。"},"x":"黃金存摺定期投資每次最低新臺幣 <b>3,000 元</b>或美金 <b>200 元</b>；新臺幣以 1,000 元、美金以 10 元為單位累加。","lo":1},{"id":"114-9","y":114,"n":9,"m":11,"q":"代付統一發票中獎獎金下列敘述何者不正確？","o":["補印之電子發票證明聯可直接給獎，不需檢附原始發票","買受人為執行業務者(私立機構/團體/單位、醫院/診所/事務所)，領獎收據除填寫中獎人姓名、電話及中獎金額，另需加蓋執行業務章戳，章戳形式不限","載明買受人之手開統一發票，領獎收據之中獎人姓名應與買受人相符","手開統一發票之營業人統一發票專用章欄位空白，一律不得給獎"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"４、依簽發目的不同，申請類別代號及「本行支票簽發」（交易代號：3810、3811）建檔說明如下：(1)屬客戶一般申請，「申請書」申請類別代號應勾選「0：客戶申請」及填寫「申請目的」並建檔，建檔時應輸入「轉帳支出帳號」欄位，另再於「是否採連動扣帳」欄位，依據客戶需求輸入「0：否」或「1：是」。「轉帳支出帳號」為iLEO數位帳戶者，限已留存印鑑之數位帳戶且「是否採連動扣帳」須為「1：是」。(2)屬客戶辦理彩券或統一發票中獎獎金所開立本行支票者，「申請書」申請類別代號應勾選「2：客戶申請-彩券／發票兌獎」並建檔，建檔時免輸入轉帳支出帳號。(3)屬本行因內部人事、總務經費而簽發之本行支票，「申請書」申請類別代號應勾選「1：人事、總務經費」並建檔，建檔時免輸入轉帳支出帳號。(4)屬法院扣押解繳開立本行支票，「申請書」申請類別代號應勾選「3：扣押解繳」並建檔，建檔時免輸入轉帳支出帳號。(5)屬代收付國公庫之稅款、海關進口貨物退稅款等非屬上列情形而需開立本行支"},"x":"補印之電子發票證明聯<b>不可直接給獎</b>，應依規查驗；手開發票專用章欄空白一律不給獎；執行業務者領獎收據須加蓋執行業務章戳。","lo":1},{"id":"114-10","y":114,"n":10,"m":3,"q":"有關防制詐欺同業照會機制，下列敘述何者不正確？","o":["為辦理對疑似異常存款帳戶或交易之查證作業，銀行得向金融同業照會帳戶之基本資料","照會內容得包含開戶日期及開戶人之年齡，惟不得照會存款帳戶之戶名","同業照會本行時，應確認同業身分及提供之電話等聯絡資訊確為該金融機構所有","本行以電話向同業照會時，應將相關照會資訊記錄於「疑似異常存款帳戶或交易照會資料紀錄表」"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"２、本行照會同業時：應向同業表明任職第一銀行OO分行O小姐/先生/副理、執行照會之事由、照會帳號及照會項目，<mark>內容得包含</mark>：(1)<mark>存款帳戶之戶名</mark>及<mark>開戶日期</mark>。(2)<mark>開戶人之年齡</mark>、職業類別及開戶或交易目的。(3)<mark>存款帳戶之</mark>交易是否有異常情形(如資金快進快出)及是否對<mark>存款帳戶</mark>進行監控(如圈存、警示戶等)。(4)為進行詐防條例之控管措施所需之其他必要資訊。"},"x":"同業照會內容<b>得包含存款帳戶之戶名</b>及開戶日期、開戶人年齡、職業等 → (B)錯。"},{"id":"114-11","y":114,"n":11,"m":3,"q":"有關警示帳戶內剩餘款項發還作業，下列敘述何者不正確？","o":["存款帳戶遭通報為警示帳戶，金融機構應依開戶資料聯絡開戶人，與其協商返還帳戶內剩餘款項事宜","無法聯絡開戶人時，應即透過匯(轉)出行通知被害人檢具相關文件，申請發還帳戶內剩餘款項","辦理款項發還，帳戶餘額未達新臺幣 1,000 元者，得逕行結清銷戶","疑似交易糾紛或案情複雜等案件，應循司法程序辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 專責督導主管及無法發還之情事 附錄九 帳戶圈存通知書","t":"2.本行接獲前揭通知後，應透過匯（轉）<mark>出行通知被害人檢具相關文件，申請發還</mark>警示<mark>帳戶內剩餘款項</mark>。2.依前項辦理，仍<mark>無法聯絡開戶人</mark>者，應透過匯（轉）出行，<mark>通知被害人檢具相關文件，申請發還</mark>警示<mark>帳戶內剩餘款項</mark>（聯絡紀錄應留存於特急件通報單空白處，以備查驗）。"}},{"id":"114-12","y":114,"n":12,"m":8,"q":"有關聯行間資金調撥作業，下列敘述何者不正確？","o":["聯行間有資金調撥需求時，資金撥付行與收款行之主管應先以電話確認金額、撥款日期、運送方式等資料","辦理資金調撥作業時，櫃員主任應填具「資金調撥請求單」及檢附相關文件，陳核至分行經理","由資金收款行櫃員主任執行「資金調撥請求交易」，輸入撥款日期、撥付行、運送方式、金額及資金明細","如為小額資金需求(如硬幣)，得以資金收款行櫃員主任個人帳戶辦理資金調撥"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第七節 票據退票 附錄四 台灣票據交換所因應部分縣市票據交換所停止上班媒體交換、分區交","t":"(三)上午照常上班，下午停止上班時比照第二款規定，惟配合中央銀行同業<mark>資金調撥</mark>清算作業系統，各項作業酌予提前辦理。(四)上午停止上班，下午照常上班時"},"x":"聯行資金調撥須主管電話確認、櫃員主任填「資金調撥請求單」陳經理；<b>不得</b>以櫃員主任個人帳戶辦理資金調撥。","lo":1},{"id":"114-13","y":114,"n":13,"m":3,"q":"有關告誡戶之敘述，下列何者不正確？","o":["告誡戶之金融帳戶管制措施自直轄市、縣(市)政府警察機關裁處告誡之日起算 5 年","告誡期間不得申請開戶","受告誡處分者，不得申請空白票據","受告誡處分者帳戶之存入交易不受限制"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"十三、<mark>告誡戶之設定及控管</mark>(一)告誡戶係指違反洗錢防制法第二十二條第六項規定，交付或提供帳戶、帳號予他人使用，經直轄市、縣(市)政府警察機關裁處告誡之行為人(包含自然人、法人、設有代表人或管理人之非法人團體、中央或地方機關或其他組織)。"},"x":"告誡戶管制自裁處告誡之日起算 5 年；不得申請空白票據、存入不受限制；告誡期間<b>仍得</b>開戶（受限制），故「不得申請開戶」錯。"},{"id":"114-14","y":114,"n":14,"m":4,"q":"有關代收票據之收受，當日未及提送之代收票據，經辦應將票據張數及金額登記於「當日未及整理入帳代收票據備查簿」由主管覆核後，暫由（　）收存於金庫保管，俟次營業日再辦理提送作業。","o":["受理之經辦","代收票據經辦","櫃員主任","主管"],"a":3,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第三節 代收存款","t":"(二)原始存款行作業如下：接獲代收行寄回之「<mark>代收票據</mark>退回提送單」〔匯17〕及退票票據，<mark>主管覆核</mark>傳票內容與票據相符後，於「送回<mark>代收票據</mark>回條」金額前首蓋匯兌私章並蓋妥腰形行名章後，送代收行作為「存戶領回退票憑單」附件，退票票據由櫃員主任保管<mark>，經辦應</mark>據「<mark>代收票據</mark>退回提送單」通知存戶儘速來行領取退票票據，並將通知時間、收話人註記於「<mark>代收票據</mark>退回提送單」後蓋經辦私章。"},"x":"未及提送之代收票據，暫由<b>主管</b>收存於金庫保管，次營業日再提送。","lo":1},{"id":"114-15","y":114,"n":15,"m":11,"q":"有關金融卡約定轉帳，下列敘述何者不正確？","o":["約定轉入本行他人或他行帳號，於申請日後次一日生效","約定轉入本行本人帳號(同轉出帳號統一編號)，於申請日當日生效","事先約定之轉入帳號，轉入本行帳戶每次最高以新臺幣 300 萬元為限","事先約定之轉入帳號，轉入金融同業帳戶，每次最高以新臺幣 200 萬元為限"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄五 第一商業銀行防杜人頭帳戶應注意事項","t":"(四)客戶申請電話語音銀行及網路銀行約定轉入帳戶者，視客戶性質及風險程度高低，評估於申辦日後次一日生效，或<mark>拉長生效時間為次二日生效</mark>(惟同一統一編號帳戶經評估並無遭詐騙損失之虞者除外)。"},"x":"約定轉入本行他人或他行帳號，經評估後於<b>次二日</b>生效（非次一日）；本人帳號當日生效。"},{"id":"114-16","y":114,"n":16,"m":9,"q":"對傳票覆核人員之敘述何者正確？<br><span class=\"it\">A.</span> 傳票覆核人員由部門副理指派<br><span class=\"it\">B.</span> 指派覆核人員覆核同一櫃員期間最長不得逾三個月<br><span class=\"it\">C.</span> 指派覆核人員應登記於覆核人員指派登記簿<br><span class=\"it\">D.</span> 覆核人員請假，覆核由部門副理另行指定","o":["ABCD","BC","AC","CD"],"a":1,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"(一)各櫃員結帳後應由<mark>覆核人員</mark>辦理覆核，<mark>覆核人員應</mark>由自行查核主管指派，並登記於「<mark>覆核人員指派登記簿</mark>」。自行查核主管<mark>指派覆核人員</mark>時應於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派辦理覆核。<mark>指派覆核人員覆核同一櫃員期間最長不得逾三個月</mark>，登記簿由自行查核主管自行保管並列入移交，保存五年。"},"x":"覆核人員應由<b>自行查核主管</b>指派（A 錯）、覆核同一櫃員最長三個月（B）、登記於覆核人員指派登記簿（C）；請假由<b>職務代理人</b>辦理（D 錯）→ BC。"},{"id":"114-17","y":114,"n":17,"m":9,"q":"下列敘述何者正確？ Ａ.資訊處每月產生之「應補收息明細表」為系統產製，無須經授信主管覆核<br><span class=\"it\">B.</span> 月算包含以應計基礎提存應收、應付利息<br><span class=\"it\">C.</span> 每半年辦理上期及下期決算<br><span class=\"it\">D.</span> 本行每月辦理營業稅、印花稅提存","o":["ABCD","BCD","BD","AC"],"a":2,"ci":{"b":"會計篇","c":"第四章 月算、結算及決算","s":"第一節 月算","t":"2.為確保月算損益正確無誤，資訊處於每月25日及28日產生「<mark>應補收息明細表</mark>」(報表代號：LP－L07A)，並於次一營業日置於「報表查詢列印系統（OnDemand）」，經辦應確實列印且與授信主管覆核應補收息之正確性，若有錯誤，務必於月底日前調整訖，以免影響當月放款之利息提存。"},"x":"應補收息明細表須經<b>授信主管覆核</b>（A 錯）；每半年辦理的是上下期<b>結算</b>，決算為年度（C 錯）→ BD。"},{"id":"114-18","y":114,"n":18,"m":7,"q":"下列敘述何者不正確？ Ａ.檢查連線作業會計項目之傳票應覆核認證者是否業經覆核認證<br><span class=\"it\">B.</span> 未達扣繳起扣點之給付不用向稅捐主管稽徵機關辦理申報<br><span class=\"it\">C.</span> 轉銷呆帳之未實現利息收入，僅於轉銷當月份申報扣減銷售額及營業稅額","o":["ABC 敘述皆錯誤","BC","AC","ABC 敘述皆正確"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"(二)每年十二月月算提存：除上述一般月算提存外，另依下列規定辦理：1.依財政部99年4月14日台財稅字第09900025490號解釋令，自該解釋令發布日以後<mark>轉銷呆帳之未實現利息收入，</mark>得於轉銷年度申報最後一期營業稅時，檢附證明文件，彙總全年度金額<mark>申報扣減銷售額及營業稅額</mark>；嗣經受償歸屬利息部分，仍應依法報繳營業稅。配合前開解釋令，自99年起，每年十二月辦理營業稅提存時，由系統自動「減：<mark>轉銷呆帳之未實現利息收入</mark>」全年度彙總金額後計出營業稅<mark>銷售額及</mark>稅額。"},"x":"未達起扣點之給付<b>仍應填寫扣繳暨免扣繳憑單</b>申報（B 錯）；轉銷呆帳之未實現利息於<b>轉銷年度最後一期</b>彙總申報扣減（C 錯）→ BC。"},{"id":"114-19","y":114,"n":19,"m":10,"q":"有關核配預算下列敘述何者正確？","o":["甲及乙項目皆屬核配預算，在甲與乙的核配預算總和範圍內，可相互支應開支","核配預算不足，不管原因及理由都可以申請追加","外包費—護衛駕駛核配預算不足，向會計處申請追加預算","以上皆非"],"a":3,"ci":{"b":"會計篇","c":"附錄三 各項開支預算執行要點","s":"","t":"券經紀人公會、中華徵信所會費等)<mark>核配預算</mark>不足，可依規申請追加預算。"}},{"id":"114-20","y":114,"n":20,"m":10,"q":"有關費用超支敘述何者正確？","o":["費用 6 月漏未申請預算，於 7 月初發現，以補申請預算方式處理","超支原因如屬費用預算歸屬期別錯誤，無法辦理期別更正","甲費用預算，3 月開支時誤入乙費用帳，於 4 月初發現，以更正費用帳務處理","損益日報可查詢費用超支情形"],"a":2,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第四節 費用控管","t":"(三)超支原因如屬<mark>費用預算</mark>歸屬期別錯誤，如核准<mark>費用預算</mark>期別為「○年下期」，卻於「○年上期」辦理開支，致上期費用超支時，應於系統上點選「修正/刪除已核准申請單」表單，申請修改該筆<mark>費用預算</mark>之年度期別。"},"x":"費用誤入他費用帳者，<b>以更正費用帳務</b>處理即可（C 正確）；預算期別錯誤可申請修改期別（B 錯）。"},{"id":"114-21","y":114,"n":21,"m":4,"q":"有關票據之審核，下列敘述何者不正確？","o":["自然人存戶死亡後其生前簽發之支票不論到期與否均因委任關係消滅，應拒絕付款","法人戶負責人死亡後，未更換負責人之前，如有票據提示，應拒絕付款","票據金額文字大寫與小寫號碼不符時，應以大寫文字為準","票據文字大寫金額之「玖」字筆誤為「玫」，但票載小寫金額足以辨識，宜照付"],"a":1,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(七)自然人存戶<mark>死亡後，</mark>其生前所簽發之支票，不論到期與否，均因委任關係消滅<mark>，應拒絕付款</mark>。(八)法人存<mark>戶負責人死亡後，未更換負責人之前，如有票據提示，</mark>仍應付款。"},"x":"法人存戶負責人死亡後、未更換負責人之前，如有票據提示，<b>仍應付款</b> → (B)錯。"},{"id":"114-22","y":114,"n":22,"m":4,"q":"有關票據日期之審核，下列何者不正確？","o":["票據未載發票年月日者，應以「法定要項不全」理由退票","本票未載到期日者，應視為見票即付","本票到期日記載不全(如僅記載「年」、「日」而未記載「月」)，應解為到期日無記載","支票所記載之發票年月日若係 2 月 30 日或 4 月 31 日等曆法上所無之日期時，該票據無效"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(二)以銀行為擔當付款人之本票或承兌匯票應屆到期日方得付款，未記載到期日者視為見票即付。(三)銀行客戶簽發<mark>支票所記載之發票年月日</mark>須係<mark>曆法上所</mark>具有之日，若係二月三十日或四月三十一<mark>日等曆法上所無之日期時，</mark>則以該月之末日為發票日。（財政部51.10.（51）台財錢發第07254號令）"},"x":"支票發票日為曆法上所無之日（2/30、4/31），<b>以該月之末日為發票日</b>，票據並非無效 → (D)錯。"},{"id":"114-23","y":114,"n":23,"m":1,"q":"客戶為本行警示帳戶或衍生管制帳戶時，應拒絕客戶開戶，惟為開立薪資轉帳帳戶，可向本行申請下列何種存款帳戶種類？","o":["金如意綜合管理帳戶","離職儲金帳戶","活期儲蓄存款","支票存款"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(２)前述情形辦理開戶作業應注意下列事項：A.<mark>開立薪資轉帳帳戶者，當事人應提出在職證明</mark>或任職公司之證明文件；"},"x":"警示或衍生管制帳戶者為開立薪資轉帳帳戶，得申請<b>活期儲蓄存款</b>（不含金如意、離職儲金、支存）。"},{"id":"114-24","y":114,"n":24,"m":6,"q":"有關定期性存款存入金額之最低額度，下列敘述何者不正確？","o":["零存整付儲蓄存款為新臺幣 1 仟元","整存整付儲蓄存款為新臺幣 5 仟元","綜合存款之存本取息儲蓄存款為新臺幣 5 仟元","定期存款為新臺幣 5 仟元"],"a":2,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"二、定期<mark>儲蓄存款</mark>（零存整付存款除外）存入本金之最低額度，自2002年7月1日起調整<mark>為新臺幣5</mark>千元，零存整付<mark>儲蓄存款</mark>每次存入金額<mark>為新臺幣</mark>1千元以上。"}},{"id":"114-25","y":114,"n":25,"m":4,"q":"下列何種業務不可於聯行辦理？","o":["申請簽發最近 3 個月內之存款餘額證明","iLEO 數位帳戶","結清支票存款之票據掛失業務","定期存款解約"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"(四)存戶申請結清存摺存款帳戶者，須將存摺一併寄回本行，有關存摺處理方式，應依客戶勾選□請貴行立即銷毀，毋須寄回（未勾選者，適用本選項）或□請貴行依本申請書之聯絡地址寄回辦理；申請<mark>結清支票存款</mark>帳戶者，須將剩餘空白票據劃線作廢後一併寄回本行，如尚有已簽發未經提示付<mark>款之票據</mark>，則不適用郵寄方式，須請其臨櫃辦理結清銷戶事宜。"},"x":"<b>結清支票存款之票據掛失</b>限原開戶行辦理；最近 3 個月存款餘額證明、iLEO 數位帳戶、定存解約均可於聯行辦理。"},{"id":"114-26","y":114,"n":26,"m":11,"q":"辦理傳真轉帳業務，客戶最晚應於傳真指示交易之日起（　）個營業日 內，將傳真文件正本送交本行。","o":["5 日","5 個營業日","7日","7"],"a":3,"ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"7.記帳日起七<mark>個營業日</mark>未補正之傳票，未於「傳票檢查備查簿」敘明理由陳核至經理。傳票檢查內容如有缺漏應即補齊，對無法於當日解決者，除傳真傳票已登記於「受理客戶以傳真方式辦理各項業務登記簿」者，免另行登記於「傳票檢查備查簿」外，其餘均應登記於「傳票檢查備查簿」並應於記帳日起七<mark>個營業日內</mark>補正，如未補正應敘明理由陳核經理知悉並妥善處理。﹝會計篇第一章第四節﹞"},"x":"傳真指示正本送交期限：<b>7 個營業日</b>。","lo":1},{"id":"114-27","y":114,"n":27,"m":7,"q":"本行業已參加中央存款保險股份有限公司存款保險，針對每一存款人之本金及利息債權最高保額以新臺幣 萬元為限","o":["100","200","300","400"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"十四、<mark>本行業已參加中央存款保險股份有限公司存款保險，</mark>加入<mark>存款保險</mark>後，<mark>中央存款保險</mark>公司對本行存款人存入之支票存款、活期存款、定期存款、儲蓄存款及其他經主管機關核准承保之存款（含外幣存款，不含國際金融業務分行存款），負賠償責任，但<mark>對每一存款人之本金及利息債權最高保額以新臺幣</mark>參佰<mark>萬元為限</mark>。"},"x":"中央存款保險對每一存款人之本金及利息債權，最高保額以新臺幣 <b>300 萬元</b>為限。"},{"id":"114-28","y":114,"n":28,"m":5,"q":"受理存摺存款戶辦理無摺支出交易，下列敘述何者不正確？","o":["辦妥支出交易後應請存戶 7 日內補登存摺","本人或負責人臨櫃辦理時，應請其於取款憑條親簽確認支出意旨","本人或負責人未臨櫃辦理提領現金時，毋須記載交易人姓名","本人或負責人未臨櫃辦理時，由主管向存戶確認並將確認情形記載於取款憑條背面"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"第四章活期存款4-4(１)本人（或公司、行號、團體之負責人）<mark>臨櫃辦理</mark>時：提領金額不受限制，惟應請存戶出示身分證明文件由記帳經辦確認係本人辦理，並請其於取款憑條親簽確認無摺支出意旨，再由經辦於取款憑條背面認證欄「※向本人確認無誤（經辦蓋章）：」後蓋章，再據以辦理支出作業。(２)本人（或公司、行號、團體之負責人）<mark>未臨櫃辦理</mark>時：A.存戶<mark>提領現金</mark>以新臺幣50萬元為限，逾該金額之提現，得經單位經理於取款憑條背面認證欄「※<mark>提領現金</mark>逾新臺幣50萬元須經單位經理同意（蓋章）：」蓋章同意後酌情辦理，惟應依規辦理確認。B.由主管向存戶本人或公司確認，並將確認情形（公司接聽人員、確認結果）記載於取款憑條背面認證欄「※接聽人員：」及「確認結果：□正常□異常」後蓋章後再辦理支出，<mark>提領現金</mark>應於取款憑條背面認證欄「※領現留存<mark>交易人姓名</mark>：」<mark>記載交易人姓名</mark>。C.辦妥支出交易後應促請客戶七日內持存摺來行或利用自動化設備補登存摺（執行交易代號：1030-6，查核『最後補摺日』），有關存摺補登情形之追蹤"},"x":"本人未臨櫃辦理無摺提領現金時，<b>應記載交易人姓名</b> → (C)錯。"},{"id":"114-29","y":114,"n":29,"m":11,"q":"單筆匯款金額超過新臺幣","o":["1 萬元(不含)","2 萬元(不含)","3 萬元(不含)","5 萬元(不含) 以 元）者，得免予扣繳。"},{"id":"114-36","y":114,"n":36,"m":8,"q":"營業單位發生出納現金短缺新臺幣 10 萬元，應於何時完成「作業風險事件通報管理系統」登錄，並由作業風險主管(即單位主管)放行？","o":["發現後 5 日內","發現後5 個營業日內","發現後 7 日內","發現當日"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"五、營業時間中主管應隨時注意所屬經辦當日收付現金情形，並不定時以「櫃員帳務查詢交易」（交易代號：1092-1）抽查櫃員現金狀況，如有異狀應即時清查其交易與庫存現金，並登記於主管抽查屬員經辦事務情形登記簿；營運業務處將按月函布「各<mark>營業單位出納現金短</mark>溢統計表」，<mark>營業單位</mark>前月如<mark>發生出納</mark>業務現金剩餘或短缺案件，存匯副理於當月辦理業務抽查時，應增加「營業時間中抽查所屬經辦當日收付現金情形」為至少2次(原抽查各經辦至少1次)，且不得事先告知所屬，並應細點各面額張(枚)數(含成捆鈔券)後，將抽查結果登記於「<mark>營業單位</mark>副理每月抽查存匯業務紀錄表」(下稱紀錄表)；另針對半年內<mark>發生出納現金</mark>剩餘或短缺案件2件(含)以上之<mark>營業單位</mark>，營運業務處將另以書面通知<mark>單位主管</mark>指派存匯副理於指定日期辦理現金抽查作業，並將抽查結果留存於紀錄表備查。"},"x":"出納現金短缺 10 萬元屬重大作業風險事件，應於<b>發現當日</b>完成「作業風險事件通報管理系統」登錄並由單位主管放行。","lo":1},{"id":"114-37","y":114,"n":37,"m":3,"q":"有關大額通貨交易之敘述，下列何者不正確？","o":["「一定金額」係指新臺幣 50 萬元(含等值外幣)","「通貨交易」係指單筆現金收或付或換鈔交易","同一帳號交易累計達一定金額以上時，亦須辦理大額通貨交易建檔","受理一定金額以上大額通貨交易時，應請臨櫃辦理交易之人依法提示身分證明文件或護照憑以確認其身分"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"六、<mark>大額通貨交易建檔</mark>及申報應注意事項：(一)受理<mark>一定金額以上大額通貨交易</mark>時，應請客戶(即臨櫃辦理交易之人）依法提示身分證明文件或護照憑以確認其身分，交易完成並認證傳票後，電腦自動編列「<mark>大額通貨</mark>序號」並連動帶出「<mark>大額通貨交易</mark>資料（申報）建檔」交易（交易代號：A190）輸入畫面及「交易類別」、「交易日期」、「<mark>大額通貨</mark>序號」及「交易種類』等欄位資料（不含外匯業務），經辦應立即請客戶（或其代理人，即臨櫃辦理交易之人）依法提示身分證明文件或護照憑以確認其身分，將其資料（姓名、身分證明文件號碼、出生年月日、住址、電話、交易帳號、交易金額）鍵入電腦並列印於「<mark>大額通貨交易</mark>資料（申報）建檔認證用紙兼提問表」（存184），如部分交易<mark>達一定金額以上大額通貨交易</mark>未連動帶出A190交易輸入畫面者，仍應儘速執行「<mark>大額通貨交易</mark>資料（申報）建檔」交易（交易代號：A190）<mark>辦理大額通貨交易</mark>資料建檔作業。"},"x":"大額通貨交易係指<b>單筆</b>現金收付或換鈔達新臺幣 50 萬元以上；同一帳號累計達標並非建檔要件 → (C)錯。"},{"id":"114-38","y":114,"n":38,"m":8,"q":"有關金庫室之管理，下列敘述何者不正確？","o":["資深行員掌管金庫室正、副門密碼表之密碼，使用屆滿 6 個月前應機動更換","掌管密碼表人員有異動時，密碼應即更換","金庫室門設有密碼鎖 3 套之單位，其經理掌管經密封之預備鎖密碼表，未經拆封得不予更換","金庫室正、副門之內柵門及外門備份鑰匙，應由經理及輪流掌管金庫鑰匙之主管共同簽封"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十六節 空白票據之保管及核發","t":"(四)經辦得視需要數量，向總務一次預領若干本備用，總務應按領用數量、票據起訖號碼執行「總務空白票據維護交易」（交易代號：30H0、交易類別「3：票據出庫（櫃員）或4：票據出庫（副主管）」），置於金庫室內，妥為保管。"},"x":"金庫室備份鑰匙應由<b>經理及櫃員主任</b>共同簽封，非「經理及輪流掌管金庫鑰匙之主管」；密碼使用屆滿 6 個月前應機動更換、掌管人異動即更換。","lo":1},{"id":"114-39","y":114,"n":39,"m":4,"q":"113 年 10 月 30 日簽發之支票其屆滿 1 年之日為","o":["114 年 10 月 29 日(星期三)","114年 10 月 30 日(星期四)","114 年 10 月 31 日(星期五)","114 年 11 月 3 日(星期一)"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(六)支票<mark>發票滿一年</mark>之期間，係自發票日起算，至於發票滿一年之期間計算，應算入始日。"},"x":"113/10/30 簽發，算入始日 → <b>114/10/29（三）</b>屆滿一年。"},{"id":"114-40","y":114,"n":40,"m":4,"q":"支票載有抬頭人得以下列何種圖章背書？","o":["統一發票專用章","收件章","收款專用章","請領租金專用章"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"７、支票<mark>抬頭人得以</mark>「<mark>收款專用章</mark>」背書收款。惟此項專用章，祇能以之收款，而不能作為轉讓票據之用。（54.1財政部台財錢發第0305號令）"},"x":"支票抬頭人得以「<b>收款專用章</b>」背書收款（僅限收款，不得轉讓）。"},{"id":"114-41","y":114,"n":41,"m":11,"q":"為避免媒體整批匯款集中於尖峰時間辦理掃描上傳作業，國內匯出匯款集中作業系統之媒體整批匯款掃描上傳截止時點設定為下午","o":["3:00","3:30","4:00","4:30"],"a":0,"ci":{"b":"會計篇","c":"第五章 會計事務之管理","s":"第一節 會計人員之派任","t":"(五)覆核人員：不得辦理本身及兼辦事務之覆核工作。(六)定期性存款之到期通知。(七)提回交換票據之審閱及存款不足之通知。(八)<mark>國內匯出匯款集中作業</mark>之掃瞄。"},"x":"媒體整批匯款掃描上傳截止時點為<b>下午 3:00</b>。","lo":1},{"id":"114-42","y":114,"n":42,"m":3,"q":"有關高風險客戶申請開立存款帳戶，下列敘述何者正確？","o":["應一律婉拒開戶，以降低本行洗錢風險","應一律不受理其申請自動化設備交易","應經較高層級主管核准後開立","開戶後應即辦理疑似洗錢或資恐交易申報"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"1.如為可疑者，宜婉拒開戶，並執行A245交易，設定警示代碼為「Z1」。2.研判得受理且<mark>經較高層級主管核准</mark>者，仍得受理，惟應先執行A245交易，修改警示代碼為「Z2：開戶但暫不受理自動化業務申請類」。"},"x":"可疑者宜婉拒開戶；研判得受理且<b>經較高層級主管核准</b>者，仍得受理，並先修改警示代碼為 Z2 → (C)正確。"},{"id":"114-43","y":114,"n":43,"m":1,"q":"下列何者可作為行號開戶之第二身分證明文件？","o":["國稅局繳稅證明","商業登記核准函","負責人身分證","負責人健保卡"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.主管機關核准之登記證照或核准函、備查函。2.統一編號編配通知書(函)。3.負責人身分證件。1.應徵取之文件：(1)法人登記證明文件(2)負責人身分證明文件(3)法人出具在台代表人或代理人之授權書。(4)國稅局核發扣繳統一編號。"},"x":"行號開戶第二身分證明：國稅局繳稅證明。"},{"id":"114-44","y":114,"n":44,"m":2,"q":"受理存款繼承作業時，如存款餘額在新臺幣（　）以下者可免檢附稅捐稽徵機關核發之稅款繳清證明書或核定免稅證明書。","o":["20 萬元","30 萬元","40 萬元","50萬元"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"四、核對<mark>稅捐稽徵機關核發之稅款繳清證明書
