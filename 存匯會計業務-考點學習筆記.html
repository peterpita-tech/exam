會計 → 僅 C。"},{"id":"114-59","y":114,"n":59,"m":10,"q":"關於上期及下期核准之預算，若未及使用，下列何者正確？","o":["上期資本支出可遞延至下期","下期資本支出可遞延至次年","上期費用支出可遞延至下期","下期費用支出可遞延至次年"],"a":0,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(五)上期核准之預算未及使用：<mark>資本支出</mark>─<mark>可遞延至下期</mark>使用。費用支出─可申請修改年度期別或重新申請預算。(六)下期核准之預算未及使用：<mark>資本支出</mark>─須重新申請，不得<mark>遞延至下</mark>年度使用。費用支出─須重新申請預算或申請修改年度期別，惟不得先行提存於「應付費用」以供以後使用。"},"x":"上期核准之預算未及使用：<b>資本支出可遞延至下期</b>；費用支出可申請修改期別或重新申請；下期資本支出不得遞延至下年度 → (A)。"},{"id":"114-60","y":114,"n":60,"m":10,"q":"對營業單位自行採購案件之敘述下列何者正確？","o":["金額新臺幣 1 萬(含)元以下案件，授權由資深副理核定","金額新臺幣 1 萬元以上採購案件，應檢附相關估價單據申請總行核准","採購金額新臺幣 5 萬元以上應檢附 3 家(含)以上估價單連同申請單，向業管單位申請核准","以上皆非"],"a":1,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(二)<mark>金額新臺幣</mark>一<mark>萬元以上</mark>或資本支出<mark>採購案件，應檢附相關估價單據</mark>或其影本<mark>申請總行核准</mark>後辦理採購：1.營繕工程：凡營業廳裝修如櫃檯改修、粉刷牆壁、更換或修補地磚、門窗修繕、水電或網路線路鋪設及屋頂漏水、外牆損壞修繕‧‧‧等屬之，須檢附估價單或其影本，以「費用支出及資本支出申請單」向業管單位逐案申請。"},"x":"金額新臺幣 <b>1 萬元以上</b>或資本支出採購案件，應檢附估價單據申請總行核准 → (B)正確；1 萬元以下由經理核定、5 萬元以上須 2 家估價。"}],"sq":[{"id":"S1-1","m":1,"q":"未成年人持雇主開立且註明經法定代理人同意之僱傭證明，得開立何種帳戶？","o":["綜合存款","金如意綜合管理帳戶","薪資轉帳活期儲蓄存款","支票存款"],"a":2,"x":"僅得開立薪資轉帳活期儲蓄存款，不得開立綜存（含金如意）及支票存款。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.活期存款、活期儲蓄存款、定期性存款、綜合存款、金如意綜合管理帳戶2.<mark>出具僱傭證明者，僅得開立薪資轉帳活期儲蓄存款</mark>，不得開立綜合存款(含金如意綜合管理帳戶)及支票存款。"}},{"id":"S1-2","m":1,"q":"客戶確為受監護、受輔助宣告之人，下列何種帳戶<b>不得</b>開立？","o":["定期性存款","綜合存款","存摺存款一般戶","金如意綜合管理帳戶"],"a":3,"x":"不得開立支票存款及金如意綜合管理帳戶；其餘由法院選定之監護人或輔助人簽章同意。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"}},{"id":"S1-3","m":1,"q":"有關籌備處開戶，下列何者正確？","o":["得以籌備處名義開立支票存款","一律不提供金融卡、個人網銀等自動化服務","屬低風險客戶","戶名不得並列籌備處名稱"],"a":1,"x":"以申請人名義開立活期或定期存款，籌備處一律不提供自動化服務。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)<mark>籌備處開戶一律不提供自動化服務</mark>(如金融卡、個人網路銀行等)。"}},{"id":"S1-4","m":1,"q":"客戶聲明具有「中華民國及美國」稅籍，整合開戶時「CRS 外國稅籍註記」應如何輸入？","o":["Y","N","依居住地決定","免輸入"],"a":1,"x":"僅非中華民國、非美國稅籍者輸入 Y；台＋美兩者皆非 CRS 外國稅籍 → N。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"2.<mark>如客戶非中華民國稅籍、美國稅籍者，應於「CRS外國稅籍註記」欄位輸入「Y」</mark>，系統將連動「CRS客戶基本資料建檔交易」(交易代號：＊行號第二證件：登記證照以外之第二身分證明文件，且應具辨識力。"}},{"id":"S1-5","m":1,"q":"依本行規定，「高齡客戶」係指年滿幾歲（含）以上之自然人？","o":["55 歲","60 歲","65 歲","70 歲"],"a":2,"x":"高齡客戶定義為年滿 65 歲（含）以上之自然人。","ci":{"b":"存款篇","c":"第一章 通則","s":"第一節 存款經辦應有之基本認識","t":"二、<mark>高齡客戶定義：年滿65歲(含)以上之自然人</mark>。"}},{"id":"S1-6","m":1,"q":"開戶申請人聯絡資訊與本行既有警示帳戶重複達幾人以上，原則應婉拒受理開戶？","o":["1 人","2 人","3 人","5 人"],"a":2,"x":"2 人以上原則不受理自動化服務業務申請；3 人以上原則應婉拒受理開戶。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"<mark>倘與3人以上重複，原則應婉拒受理開戶</mark>。"}},{"id":"S1-7","m":1,"q":"受理未成年人開戶時，以戶口名簿或電子戶籍謄本為主要證件者，應透過何網站查驗有效性？","o":["經濟部商工登記資料","內政部戶政司全球資訊網","司法院家事事件公告","財政部稅務入口網"],"a":1,"x":"應透過內政部戶政司全球資訊網查驗並列印查詢結果備查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)受理未成年人申請開戶時，如提示戶口名簿或電子戶籍謄本作為主要證件者，<mark>應透過內政部戶政司全球資訊網查驗該證件之有效性</mark>，並列印查詢結果備查。"}},{"id":"S1-8","m":1,"q":"受理本國未成年人開戶（不含支票存款），下列何種方式「不」符規定？","o":["無行為能力人自行持父母同意書單獨臨櫃","父或母一方單獨持他方同意書代理","父母偕同未成年人來行","父母共同來行代理，未成年人不必到場"],"a":0,"x":"得單獨臨櫃持父母同意書者限<b>限制行為能力人</b>；無行為能力人不得自行辦理。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(３)父或母一方單獨持他方同意書代理未成年子女開戶，未成年人可不必到場。<mark>(４)限制行為能力人得自行持父母同意書單獨臨櫃辦理開戶</mark>。"}},{"id":"S1-9","m":1,"q":"父或母一方單獨持他方同意書代理未成年子女開戶時，未成年人是否須到場？","o":["可不必到場","須視年齡決定","須另徵法院證明","須到場"],"a":0,"x":"父母共同代理或一方持他方同意書代理，<b>未成年人可不必到場</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(３)父或母一方單獨持他方同意書代理未成年子女開戶，<mark>未成年人可不必到場</mark>。"}},{"id":"S1-10","m":1,"q":"客戶確為受輔助宣告之人申請開立綜合存款帳戶，其開戶及相關申請文件應如何簽章？","o":["本人簽章即可","由法院選定之輔助人簽章同意","不得開立","由配偶簽章"],"a":1,"x":"一般存摺、定期性及綜合存款帳戶，開戶及相關文件應由<b>法院選定之監護人或輔助人</b>簽章同意。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"至於存摺存款一般戶、定期性存款及綜合存款帳戶，<mark>其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意</mark>。"}},{"id":"S1-11","m":1,"q":"下列何種存款業務作業，須查核確認客戶是否為受監護、受輔助宣告之人？","o":["查詢餘額","存單設質","補登存摺","ATM 提款"],"a":1,"x":"涉及確認本人申請意旨（親簽）者，如開戶、變更印鑑、掛失、<b>存單設質</b>、全行代付款、更改戶名及自動化業務申請等。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"倘涉及須確認本人申請意旨（親簽）時，<mark>如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請</mark>…另須查核確認客戶是否為受監護、受輔助宣告之人"}},{"id":"S1-12","m":1,"q":"籌備處開戶時，開戶申請書之「客戶類別」應如何勾選？","o":["公司戶","個人戶","團體戶","非個人戶"],"a":1,"x":"籌備處以申請人名義開戶，開戶申請書以<b>個人戶</b>方式填寫，客戶類別勾選「個人戶」、性別欄亦須勾選。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"故開戶申請書以個人戶方式填寫資料，<mark>且客戶類別勾選「個人戶」、性別欄亦須勾選</mark>。"}},{"id":"S1-13","m":1,"q":"公司籌設階段向銀行開立帳戶時，應以何者為開戶申請人？","o":["會計師","任一發起人","公司董事長","「公司名稱及所營事業登記預查表」核准之申請人"],"a":3,"x":"應以「<b>公司名稱及所營事業登記預查表</b>」核准之申請人為開戶申請人；開戶地址可於擬設公司所在地。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"公司籌設階段向銀行開立帳戶時，<mark>應以「公司名稱及所營事業登記預查表」核准之申請人為開戶申請人</mark>"}},{"id":"S1-14","m":1,"q":"籌備處開戶建檔時，企業型態及業種編號應如何編定？","o":["企業型態 0、業種 000000","由系統自動判斷","企業型態 7 籌備處、業種私人 060010、企業組織 0 個人","企業型態 1、業種依所營事業"],"a":2,"x":"業種編為私人「<b>060010</b>」、企業型態「<b>7：籌備處</b>」、企業組織「0：個人」。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"另存戶業種編號應編為私人「060010」；<mark>企業型態則為「7：籌備處」</mark>；企業組織「0：個人」。"}},{"id":"S1-15","m":1,"q":"籌備處開戶，關於自動化服務之提供，下列何者正確？","o":["可申請個人網路銀行","可申請金融卡","經主管核准可提供","一律不提供自動化服務"],"a":3,"x":"籌備處開戶<b>一律不提供自動化服務</b>（如金融卡、個人網路銀行）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)<mark>籌備處開戶一律不提供自動化服務(如金融卡、個人網路銀行等)</mark>。"}},{"id":"S1-16","m":1,"q":"受理籌備處開戶，系統引導查詢之項目「不」包括下列何者？","o":["Z21 國民身分證領補換資料","Z22 通報案件紀錄及補充註記資訊","J10 信用評分","登記預查查詢（籌備處）"],"a":2,"x":"系統引導查詢 <b>Z21、Z22 及登記預查查詢（籌備處）</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"5.<mark>由系統引導查詢「Z21：國民身分證領補換資料查詢驗證」、「Z22：通報案件紀錄及補充註記資訊」及「登記預查查詢(籌備處)</mark>。"}},{"id":"S1-17","m":1,"q":"客戶「CRS 外國稅籍註記」輸入 Y 後，系統將連動何項交易？","o":["9590","9777 CRS 客戶基本資料建檔","9236","A194"],"a":1,"x":"輸入 Y 後連動「<b>CRS 客戶基本資料建檔交易（9777）</b>」，建檔英文姓名、居住國、稅籍編號等。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"應於「CRS外國稅籍註記」欄位輸入「Ｙ」，<mark>系統將連動「CRS客戶基本資料建檔交易」(9777交易)</mark>，應辦理其英文姓名、現在居住國家、地址及具有稅籍之居住國家或地區、稅籍編號及無法取得稅籍編號原因等資料建檔。"}},{"id":"S1-18","m":1,"q":"客戶聲明具有中華民國及法國稅籍，開戶時「CRS 外國稅籍註記」應輸入？","o":["Y","U","免輸入","N"],"a":0,"x":"具<b>中華民國及美國以外</b>之稅籍（法國）→ 輸入 <b>Y</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"如客戶非中華民國稅籍、美國稅籍者，<mark>應於「CRS外國稅籍註記」欄位輸入「Ｙ」</mark>"}},{"id":"S1-19","m":1,"q":"下列何種情形，個人戶須重新辦理 FATCA 客戶身分審查？","o":["變更電話為台北市話","變更通訊地址至台中","申請金融卡","於第 e 個網約定受款人之受款地區國別為美國"],"a":3,"x":"提供美國地址、電話或<b>持續指示將資金轉入美國</b>（如約定美國受款人）而觸發美國指標時，應重新審查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"B.客戶提供(不限為書面，口頭表達亦是)或填寫之文件具有美國地址、美國電話或持續指示將資金轉入美國(<mark>例如：於第ｅ個網約定受款人之受款地區國別為美國</mark>)，以致於觸發美國指標時。"}},{"id":"S1-20","m":1,"q":"FATCA 身分狀態為「31：消極的非金融外國法人或團體」者辦理變更負責人須重新審查，其主要原因為何？","o":["涉及須辨別其有無持股逾 25% 之美國籍自然人股東","須確認資本額","須確認營業項目","須確認負責人國籍"],"a":0,"x":"因涉及須辨別<b>有無持股逾 25% 之美國籍自然人股東</b>，故變更負責人時應重新審查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"B.FATCA身分狀態已為「31：消極的非金融外國法人或團體」者(<mark>因涉及須辨別其有無持股逾25％之美國籍自然人股東</mark>)，並辦理變更負責人時。"}},{"id":"S1-21","m":1,"q":"整合開戶整併申請第 e 個網服務，下列何者「不」提供新申請？","o":["e 指通","實體 OTP","線上約定轉入帳號服務","SSL"],"a":1,"x":"整合開戶提供查詢、SSL、e 指通、同 ID 轉帳、線上約定轉入及非約定轉帳；<b>不提供新申請實體 OTP 及憑證</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"提供申請基本(查詢)功能、SSL、e指通、本行同ID間轉帳免約定服務、線上約定轉入帳號服務及非約定轉帳服務，<mark>惟不提供新申請「實體OTP」及「憑證」</mark>"}},{"id":"S1-22","m":1,"q":"整合開戶當次新開立之帳戶設定為轉出帳號時，可約定之轉入帳號上限為幾組？","o":["不限","20 組","5 組","10 組"],"a":1,"x":"當次新開立帳戶（定期性、外匯定存及理財存摺除外）可設定為轉出帳號並約定轉入帳號，<b>上限 20 組</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"另當次新開立帳戶(除新台幣定期性存款、外匯定期存款及理財存摺外)<mark>可設定為轉出帳號及約定其對應之轉入帳號(上限20組)</mark>。"}},{"id":"S1-23","m":1,"q":"開戶時以「電子簽名」方式辦理之適用對象，下列何者「不」得適用？","o":["一般個人戶","籌備處","受監護宣告人","同意電子簽名之個人"],"a":2,"x":"電子簽名限個人戶（含籌備處）；<b>受監護／輔助宣告人</b>或有見證人／代理人（不含未成年人法定代理人）者除外。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"A.適用對象：限個人戶(含籌備處)且同意以「電子簽名」辦理者，<mark>但受監護/輔助宣告人或有見證人/代理人(不含未成年人之法定代理人)者除外</mark>。"}},{"id":"S1-24","m":1,"q":"客戶申請轉入他人（行）帳號或線上約定轉入帳號服務時，經辦應辦理何項作業？","o":["改由主管辦理","通報警方","臨櫃關懷作業並提供「防範詐騙提醒事項」文宣，於申請書勾選註記","免辦理"],"a":2,"x":"應辦理<b>臨櫃關懷</b>並提供「<b>防範詐騙提醒事項</b>」文宣，於申請書相關欄位勾選註記。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"(四)客戶申請轉入他人（行）帳號或線上約定轉入帳號服務，<mark>經辦應辦理臨櫃關懷作業及提供「防範詐騙提醒事項」文宣予存戶</mark>，並於「申請書」相關欄位勾選註記。"}},{"id":"S1-25","m":1,"q":"受理公司申請開戶，商工登記所營事業載有「I301040 第三方支付服務業」時，應另至何處確認後方能受理？","o":["金管會網站","數位發展部數位產業署網站確認已完成能量登錄","財政部稅務入口網","經濟部商業司"],"a":1,"x":"應至<b>數位發展部數位產業署</b>網站確認已完成「第三方支付服務機構服務能量登錄」。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"倘載有「I301040第三方支付服務業」時，<mark>應另至數位發展部數位產業署網站</mark>…確認其已完成能量登錄，方能受理開戶"}},{"id":"S1-26","m":1,"q":"依本行規定，處理使領館、外交辦事處或官方帳戶之客戶，開戶時應由何人同意？","o":["資深副理或經理","總行","經辦","櫃員主任"],"a":0,"x":"屬使領館、外交辦事處或官方帳戶者，系統設為<b>高風險客戶</b>，應由<b>資深副理或經理</b>同意開戶。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制","t":"異動項目「36：使領館、外交辦事處或官方帳戶」(<mark>系統設定為高風險客戶，應由資深副理或經理同意開戶</mark>)。"}},{"id":"S1-27","m":1,"q":"非個人戶開戶時，客戶登記資料與網路查詢公開資訊不一致者，應如何處理？","o":["改以個人戶開戶","一律婉拒","查明原因後再予受理，並紀錄備查","逕予受理"],"a":2,"x":"不一致者應<b>查明原因後再予受理</b>，並紀錄備查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制","t":"C.客戶註冊登記資料與網路查詢公開資訊是否相符：a.非個人戶均須勾選。<mark>b.客戶登記資料與網路查詢不一致者，應查明原因後再予受理，並紀錄備查</mark>。"}},{"id":"S1-28","m":1,"q":"高風險客戶經較高層級主管同意以 9236 交易開戶者，主管應於何處蓋章確認？","o":["印鑑卡背面","每頁高風險提醒字樣旁","開戶申請書首頁","9236 交易認證單末頁印錄之核准開戶字樣旁"],"a":3,"x":"以 9236 開戶者，主管應於<b>認證單末頁核准開戶字樣旁</b>蓋章，免逐頁逐交易蓋印。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"以9236交易開戶者，<mark>較高層級主管應於9236交易認證單末頁印錄之核准開戶字樣旁蓋章確認</mark>，免再逐頁逐交易之高風險客戶提醒字樣旁蓋印核准。"}},{"id":"S1-29","m":1,"q":"警示帳戶當事人因薪資轉帳需要申請開戶，「開戶作業檢核表」中查詢 Z22 欄位應如何勾選？","o":["由系統自動帶入","正常","免勾選","異常，並註明仍受理開戶之理由"],"a":3,"x":"查詢 Z22 欄位應勾選「<b>異常</b>」選項，並<b>註明仍受理開戶之理由</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"C.執行開戶交易時，「開戶作業檢核表」之「查詢『Z22通報案件紀錄及補充註記資訊』是否無揭露相關資訊或註記」<mark>欄位應輸入(勾選)「異常」選項，並註明仍受理開戶之理由</mark>。"}},{"id":"S1-30","m":1,"q":"外國法人在臺開立存款帳戶應徵取之文件，下列何者「不」屬之？","o":["負責人身分證明文件","法人登記證明文件","法人出具在台代表人或代理人之授權書","國稅局綜合所得稅申報書"],"a":3,"x":"應徵法人登記證明、負責人身分證明、在台代表人／代理人授權書及<b>國稅局核發扣繳統一編號</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.應徵取之文件：<mark>(1)法人登記證明文件(2)負責人身分證明文件(3)法人出具在台代表人或代理人之授權書。(4)國稅局核發扣繳統一編號</mark>。"}},{"id":"S1-31","m":1,"q":"營業單位為高齡客戶提供之友善設施，下列何者「非」細則所列？","o":["服務鈴","無障礙坡道","專屬停車位","老花眼鏡"],"a":2,"x":"應設服務鈴、無障礙坡道、無障礙櫃檯、<b>老花眼鏡</b>及輪椅可用 ATM，並配置迎賓專員及平板。","ci":{"b":"存款篇","c":"第一章 通則","s":"第一節 存款經辦應有之基本認識","t":"(一)<mark>各營業單位應設有服務鈴、無障礙坡道、無障礙服務櫃檯及老花眼鏡</mark>，並設置符合輪椅使用者之無障礙ATM等友善設施"}},{"id":"S2-1","m":2,"q":"受理存款繼承時，存款餘額在新臺幣多少以下者可免檢附遺產稅繳清證明或免稅證明書？","o":["10 萬元","20 萬元","30 萬元","50 萬元"],"a":1,"x":"20 萬元以下免附，以單一分行之總存款餘額判斷。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"６、稅捐稽徵機關核發之稅款繳清證明書或核定免稅證明書，如<mark>存款餘額在新臺幣二十萬元以下者可免檢附</mark>；"}},{"id":"S2-2","m":2,"q":"繼承人申請調閱被繼承人帳戶往來明細，若涉及第三人個人資料，應如何處理？","o":["不得提供","須經第三人同意","不論是否涉及第三人個資，本行均得提供","僅提供彙總金額"],"a":2,"x":"依銀行公會規定，本行均得提供。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"(三)繼承人向銀行申請調閱被繼承人帳戶之往來明細資料（例如：轉帳或匯款資訊），<mark>不論該帳戶往來明細資料是否涉及第三人之個人資料，本行均得提供</mark>。"}},{"id":"S2-3","m":2,"q":"存款餘額證明申請書之保存期限為何？","o":["1 年","3 年","5 年","永久"],"a":2,"x":"申請書按編號順序整理裝訂成冊，保存期限五年。","ci":{"b":"存款篇","c":"第一章 通則","s":"第九節 存款餘額（部分餘額）證明書之填發","t":"(七)<mark>申請書按編號順序整理裝訂成冊，保存期限五年</mark>。"}},{"id":"S2-4","m":2,"q":"受理存戶查調帳戶資料，原則提供申請日前多久內之交易明細？","o":["5 年","10 年","15 年","20 年"],"a":2,"x":"原則 15 年；具調查權之機關及放款申請案件不在此限。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"(一)受理存戶查調帳戶資料，<mark>原則提供申請日前15年內之交易明細資料為限</mark>；"}},{"id":"S2-5","m":2,"q":"警察機關偵辦刑事案件調閱警示帳戶交易明細，本行應儘量於文到幾個營業日內回復？","o":["3 個","5 個","7 個","10 個"],"a":1,"x":"應儘量於文到 5 個營業日內回復（金管會 105.9.19 函）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"４、警察機關偵辦刑事案件調閱警示帳戶交易明細資料時，<mark>應儘量於文到5個營業日內回復</mark>，並採下列方式辦理：（金融監督管理委員會105年9月19日銀局（法）字第10500194070號函）(１)內政部警政署刑事警察局來函向總行查調資料，由營運業務處定期彙報。"}},{"id":"S2-6","m":2,"q":"一式印鑑含多顆印章（如公司章及負責人章）於「印鑑暨影像管理系統」拍攝建檔時，應如何處理？","o":["拍攝一次即可","逐顆對正拍攝","僅拍公司章","僅拍負責人章"],"a":1,"x":"應逐顆對正拍攝、不可歪斜，並一併拍攝印鑑卡訂約印鑑。","ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"２、<mark>一式印鑑含多顆印章者，應逐顆對正拍攝</mark>，不可歪斜，且應以單顆印鑑大小範圍內拍攝建檔，勿拍入過多空白處或他顆印鑑。"}},{"id":"S2-7","m":2,"q":"支票存款戶變更印鑑後，發票日在新印鑑生效日以前之票據於新印鑑生效後始提示，本行應如何處理？","o":["一律退票","憑新印鑑付款","仍憑舊印鑑付款","請發票人重開"],"a":2,"x":"本行仍憑舊印鑑付款，可於系統備註欄註明。","ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"1-205第一章通則發票日在新印鑑生效日以前之票據，<mark>於新印鑑生效後始提示者，本行仍憑舊印鑑付款</mark>，故可於印鑑暨影像管理系統備註訊息欄註明「票據發票日於年月日前，且與刪除保留之印鑑式樣相符者始可付款。"}},{"id":"S2-8","m":2,"q":"「印鑑暨影像管理系統」拍攝印鑑時，下列何者錯誤？","o":["應一併拍攝印鑑卡訂約印鑑","一式多顆印章得合併一次拍攝","應以單顆印鑑大小範圍內拍攝","勿拍入過多空白處或他顆印鑑"],"a":1,"x":"一式印鑑含多顆印章者，<b>應逐顆對正拍攝</b>，不得合併拍攝。","ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"２、一式印鑑含多顆印章者，<mark>應逐顆對正拍攝，不可歪斜，且應以單顆印鑑大小範圍內拍攝建檔，勿拍入過多空白處或他顆印鑑</mark>。"}},{"id":"S2-9","m":2,"q":"印鑑系統之臨時授權，由作業主管手工授權「查詢人員」權限後，須經何人覆核始生效力？","o":["會計人員","同一作業主管","第二位作業主管或最高授權管理者","經辦"],"a":2,"x":"臨時授權須<b>第二位作業主管（UU）或最高授權管理者（SU）</b>覆核始生效力。","ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"「作業主管（UU）」手工授權「查詢人員」或「建檔人員」權限，<mark>再由第二位作業主管（UU）或最高授權管理者（SU）辦理覆核始生效力</mark>"}},{"id":"S2-10","m":2,"q":"自行查核、複驗印鑑或代理作業部門工作期間，授權指定人員印鑑查詢權限，下列何者正確？","o":["永久保留權限","須總行核准","毋須另登載於派令簿，完成後刪除其權限","須登載派令簿"],"a":2,"x":"於自行查核、複驗或代理期間得授權查詢權限，<b>毋須另登載派令簿</b>，完成後刪除權限。","ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"另於自行查核、複驗印鑑或代理作業部門工作期間得授權該指定或代理人員印鑑查詢權限，<mark>毋須另登載於派令簿，並於完成查核、複驗作業或結束代理作業部門工作後刪除其權限</mark>。"}},{"id":"S2-11","m":2,"q":"新式外來人口統一證號實施後，舊式統一證號何時起全面停用？","o":["120 年 1 月 1 日","110 年 1 月 2 日","119 年 12 月 31 日","115 年 1 月 1 日"],"a":0,"x":"換號期間 110.1.2～119.12.31，<b>120 年 1 月 1 日起</b>舊式統一證號全面停用。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"換號期間為110年1月2日起至119年12月31日止，換發新號前，舊號仍可使用，<mark>120年1月1日起，舊式統一證號全面停用</mark>。"}},{"id":"S2-12","m":2,"q":"客戶申請電子綜合業務對帳單，完成 Email 信箱驗證後，何時生效？","o":["次日","完成驗證後次月起","當日","下一季"],"a":1,"x":"完成驗證後<b>次月起</b>生效；未完成驗證者須至原開戶分行親領實體對帳單。","ci":{"b":"存款篇","c":"第一章 通則","s":"第七節 存戶基本資料","t":"(四)成Email信箱驗證後，<mark>電子綜合業務對帳單服務將於完成驗證後次月起生效</mark>；若未完成驗證，客戶需至原開戶分行親自領取實體綜合業務對帳單。"}},{"id":"S2-13","m":2,"q":"存戶申請出具存款餘額證明，發現存款來源係由關係戶申貸後轉帳存入以充驗資之用，應如何處理？","o":["須總行核准","照常發給","應拒絕發給證明書","發給但加註"],"a":2,"x":"存款來源係直接或間接<b>暫借頭寸</b>以充驗資者，應<b>拒絕發給</b>證明書，並於備查簿備註查核結果。","ci":{"b":"存款篇","c":"第一章 通則","s":"第九節 存款餘額（部分餘額）證明書之填發","t":"應切實注意查核其存款來源是否係直接或間接暫借頭寸（如由其關係戶或股東等申貸後轉帳存入），以充驗資之用，<mark>如有此種情形，應拒絕發給證明書</mark>。"}},{"id":"S2-14","m":2,"q":"出具存款餘額證明時，應於何處加註有無暫借頭寸之查核結果？","o":["顧客基本資料","證明書正本","「存款餘額（部分餘額）證明書簽發備查簿」之備註欄","申請書背面"],"a":2,"x":"應於「<b>證明書簽發備查簿</b>」之備註欄加註有無暫借頭寸之查核結果。","ci":{"b":"存款篇","c":"第一章 通則","s":"第九節 存款餘額（部分餘額）證明書之填發","t":"<mark>出具存款證明時，應於「（存款餘額部分餘額）證明書簽發備查簿」之備註欄加註有無暫借頭寸之查核結果</mark>。"}},{"id":"S2-15","m":2,"q":"被繼承人甲有三子 A、B、C，A 先於甲死亡，A 有二子 M、O 及配偶 E，下列何者得代位繼承 A 之應繼分？","o":["無人","E","E、M、O","M、O"],"a":3,"x":"代位繼承由先死亡者之<b>直系血親卑親屬</b>為之 → M、O；A 之配偶 E 不得代位。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"由其直系血親卑親屬代位繼承其應繼分（如甲有三子A、B、C，倘A有二子M、O及配偶E，A先於甲或同時死亡時，<mark>M、O得代位繼承A之應繼分，但A之配偶E則無</mark>；"}},{"id":"S2-16","m":2,"q":"繼承人擬領取存款時，若有繼承人拋棄繼承權，應檢具何文件？","o":["拋棄切結書","戶籍謄本","遺產稅證明","法院准予拋棄繼承權之備查函"],"a":3,"x":"有繼承人拋棄繼承者，應檢具<b>法院准予拋棄繼承權之備查函</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"(十)<mark>繼承人擬領取存款時，若有繼承人拋棄繼承權，應檢具法院准予拋棄繼承權之備查函</mark>。"}},{"id":"S2-17","m":2,"q":"受理聯行小額存款繼承，下列何種存款應以代收件送原開戶行辦理？","o":["支票存款","活期儲蓄存款","定期存款（一般）","活期存款"],"a":0,"x":"支票存款、理財存摺或無法聯行結清者，以<b>代收件送原開戶行</b>；其餘得逕予辦理。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"(二)受理聯行小額存款繼承，<mark>除支票存款、理財存摺或其他依客戶性質（例如無摺存款戶）無法聯行辦理結清者，以代收件送原開戶行辦理外</mark>，得逕予辦理。"}},{"id":"S2-18","m":2,"q":"小額存款繼承簡便措施之適用金額，係以何者判斷？","o":["單一帳戶餘額","單一分行之總存款餘額","全行存款餘額","繼承人人數"],"a":1,"x":"繼承金額於等值新臺幣 3 萬元以下，<b>以單一分行之總存款餘額</b>判斷。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"就繼承金額於等值新臺幣三萬元以下（<mark>以單一分行之總存款餘額判斷</mark>），免由全體繼承人會同辦理"}},{"id":"S2-19","m":2,"q":"具有調查權之機關查調較久遠之交易明細，部分資料因磁帶毀損無法完整提供時，應如何處理？","o":["拒絕查詢","於函復來文機關時說明無法提供之區間","僅提供 15 年內資料不作說明","請客戶自行提供"],"a":1,"x":"調查權機關不受 15 年限制，惟部分資料無法提供時，應<b>於函復時說明無法提供之區間</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"但如查調交易明細資料較為久遠，期間部分交易明細資料已因磁帶毀損無法完整提供時，<mark>應於函復來文機關時說明無法提供之區間</mark>。"}},{"id":"S2-20","m":2,"q":"法務部調查局查詢客戶存款資料，應以經何人審核認定為必要者為限？","o":["調查員","檢察官","該局局長（副局長）","法務部長"],"a":2,"x":"應表明偵辦案件需要、註明案由，<b>以經該局局長（副局長）審核認定為必要者</b>為限。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"(１)應表明係為偵辦案件需要，註明案由，<mark>以經該局局長（副局長）審核認定為必要者為限</mark>。"}},{"id":"S2-21","m":2,"q":"法務部所屬檢察機關以定型便函傳真查詢犯罪嫌疑人存放款資料時，銀行應注意何事？","o":["須總行核准","確認傳真號碼與檢察機關傳真電話號碼相同，以防冒用","不得受理傳真","須先取得客戶同意"],"a":1,"x":"得先以傳真提供、事後補正式公函，惟應<b>確認傳真號碼</b>與該檢察機關相同。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"事後再補正式公函辦理。<mark>惟應確認該傳真號碼與各檢查機關傳真電話號碼相同，以防杜他人冒用</mark>。"}},{"id":"S2-22","m":2,"q":"警察機關來函向總行調閱存款資料，內容包含 ATM 監視錄影影像者，由何單位統一查調帳戶資料？","o":["資訊處","法務室","營運業務處集中作業部","營業單位"],"a":2,"x":"由<b>營運業務處集中作業部</b>統一查調帳戶資料，以密件轉交營業單位併 ATM 影像回復。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"A.來函調閱內容包含ATM監視錄影系統影像資料時，<mark>由集中作業部統一查調帳戶資料後</mark>，採密件方式以紙本或電子檔案連同來函影本以公文移送單轉交營業單位"}},{"id":"S2-23","m":2,"q":"自 102 年 1 月 1 日起，辦理公務機關查詢及解繳扣押款作業，原則上應如何處理費用？","o":["依本行「存匯業務收費標準」之「公務機關查詢及解繳扣押款」項目收費","由客戶負擔","一律免費","由法院負擔"],"a":0,"x":"應依本行存匯業務收費標準之「<b>公務機關查詢及解繳扣押款</b>」項目收費（刑事等案件除外）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"自102年1月1日起，辦理公務機關查詢及解繳扣押款作業，<mark>應依本行「存匯業務收費標準」之「公務機關查詢及解繳扣押款」項目收費</mark>。"}},{"id":"S2-24","m":2,"q":"存戶親自來行領用金融卡／密碼函時，應如何辦理？","o":["由代理人領取","憑身分證即可","提示身分證明文件及存摺、原留印鑑，於變更書簽收欄親簽並加蓋原留印鑑","憑電話確認"],"a":2,"x":"應<b>本人親自</b>提示身分證明、存摺及原留印鑑，親簽並加蓋原留印鑑，經核符後受理。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"4.存戶來行領用時，<mark>應請存戶本人親自提示身分證明文件及存摺、原留印鑑</mark>，請存戶於「變更書」金融卡/密碼函領用欄簽收人親自簽名並加蓋原留印鑑"}},{"id":"S2-25","m":2,"q":"下列何項業務限於原開戶行辦理？","o":["存款交易明細查詢","補登存摺","存款","變更綜合業務對帳單寄發（或交付）方式"],"a":3,"x":"籌備處變更為一般戶、<b>變更綜合業務對帳單寄發方式</b>、餘額證明等限原開戶行。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項 附錄二 金融機構辦理國內匯款及無摺存款作業確認客戶身分原則","t":"下列情形限於原開戶行辦理：籌備處變更為一般戶<mark>變更綜合業務對帳單寄發(或交付)方式</mark>餘額證明金好用申請/註銷"}},{"id":"S3-1","m":3,"q":"警示帳戶之警示期限自每次通報時起算，逾多久自動失其效力？","o":["6 個月","1 年","2 年","3 年"],"a":2,"x":"逾 2 年自動失效；有繼續警示必要者原通報機關應於屆滿前再通報，延長以一次及一年為限。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(四)警示帳戶之警示期限自每次通報時起算，<mark>逾2年自動失其效力</mark>，但有繼續警示之必要者，原通報機關應於期限屆滿前再行通報之，通報延長以一次及一年為限。"}},{"id":"S3-2","m":3,"q":"經通報為警示帳戶且帳戶餘額未達新臺幣多少元者，得逕行辦理結清銷戶？","o":["500 元","1,000 元","3,000 元","1 萬元"],"a":1,"x":"未達 1,000 元得逕行結清，款項轉入「警示帳戶剩餘款」分戶。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(五)<mark>經通報為警示帳戶且帳戶餘額未達新臺幣1,000元者，得逕行辦理該帳戶之結清銷戶</mark>（交易代號：1460），並由系統自動將結清之款項轉入「其他應付款」項目「其他應付款諸戶」「509：警示帳戶剩餘款」分戶。"}},{"id":"S3-3","m":3,"q":"存款帳戶經通報為警示帳戶後，匯入款項應如何處理？","o":["存入帳戶並圈存","逕以退匯方式退回匯款行","轉入其他應付款","由分行洽匯款人"],"a":1,"x":"電腦連動暫停全部交易功能，匯入款項逕以退匯方式退回匯款行。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"三、警示帳戶之設定：(一)存款帳戶經通報為警示帳戶者，營業單位或信用卡處-客戶服務部應即執行「存戶餘額留存登錄及解除交易」（交易代號：9330，代碼：20）設定為警示帳戶（設定時免輸入金額，惟應依警調單位傳送文件中記載之案情輸入案情摘要），電腦並立即連動暫停該帳戶全部交易功能，<mark>匯入款項逕以退匯方式退回匯款行</mark>。"}},{"id":"S3-4","m":3,"q":"有關告誡戶，下列何者正確？","o":["帳戶存入交易應予限制","晶片金融卡每日轉帳、提領上限各為等值新臺幣一萬元","得申請空白票據","洗錢風險視為低風險"],"a":1,"x":"存入不受限制；不得申請空白票據；洗錢風險視為高風險。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"１、每個帳戶之晶片金融卡於自動化服務設備（含實體/網路ATM）每日轉帳（含約定、非約定交易）、<mark>提領金額上限各為等值新臺幣一萬元整</mark>；"}},{"id":"S3-5","m":3,"q":"扣押一般存單存款時，若該存單尚未到期或有質權設定，應如何處理？","o":["不予扣押","仍應辦理扣押設定交易","待到期再扣押","通知質權人自行處理"],"a":1,"x":"仍應辦理扣押設定交易，並向來文機關聲明異議。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十四節 存款之扣押","t":"F.扣押一般存單存款，<mark>若該存單尚未到期或有質權設定者，仍應辦理扣押設定交易</mark>。"}},{"id":"S3-6","m":3,"q":"營業單位接獲營運業務處通知轄下帳戶新增為警示帳戶時，應於多久內填報「警示帳戶（人頭帳戶）發生原因檢討表」？","o":["3 個營業日","5 個營業日","7 個營業日","10 個營業日"],"a":2,"x":"7 個營業日內填報，正本送營運業務處，影本留存 1 年。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(三)營業單位接獲營運業務處通知時，<mark>應於7個營業日內填報「警示帳戶（人頭帳戶）發生原因檢討表」</mark>，針對警示帳戶新增原因進行檢討並敘明改進措施，檢討表正本送營運業務處，影本留存1年備查。"}},{"id":"S3-7","m":3,"q":"存款帳戶經通報為警示帳戶，營業單位應執行何交易設定？","o":["925Z","A245","9330 代碼 20","9490"],"a":2,"x":"應執行「存戶餘額留存登錄及解除交易」<b>9330，代碼 20</b> 設定為警示帳戶，連動暫停全部交易。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"應即執行「存戶餘額留存登錄及解除交易」<mark>（交易代號：9330，代碼：20）設定為警示帳戶</mark>"}},{"id":"S3-8","m":3,"q":"設定警示帳戶時，下列何者正確？","o":["須輸入圈存金額","須客戶同意","僅暫停提款","免輸入金額，惟應依警調單位文件記載之案情輸入案情摘要"],"a":3,"x":"設定時<b>免輸入金額</b>，惟應依警調文件輸入案情摘要；電腦連動暫停全部交易功能。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(<mark>設定時免輸入金額，惟應依警調單位傳送文件中記載之案情輸入案情摘要</mark>)，電腦並立即連動暫停該帳戶全部交易功能"}},{"id":"S3-9","m":3,"q":"警示帳戶警示期限屆滿前，原通報機關認有繼續警示必要時，延長通報之限制為何？","o":["以一次及一年為限","不得延長","以二次各一年為限","無限制"],"a":0,"x":"有繼續警示必要者，原通報機關應於期限屆滿前再行通報，<b>延長以一次及一年為限</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"但有繼續警示之必要者，原通報機關應於期限屆滿前再行通報之，<mark>通報延長以一次及一年為限</mark>。"}},{"id":"S3-10","m":3,"q":"營運業務處執行 9490 刪除或解除警示時，系統將連動執行 9330 之何代碼？","o":["20","01","29 解除警示戶","50"],"a":2,"x":"連動執行 9330 代碼 <b>29－解除警示戶</b>，及外匯活存 5260 代碼 07。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"系統將連動執行「存戶餘額留存登錄及解除交易」<mark>（交易代號：9330；代碼：29-解除警示戶）</mark>及「外匯活期存款存戶事故解除」"}},{"id":"S3-11","m":3,"q":"經通報為警示帳戶且餘額未達 1,000 元逕行結清時，款項轉入何分戶？","o":["其他預收款","暫收款","過期帳收入","其他應付款諸戶「509：警示帳戶剩餘款」"],"a":3,"x":"系統自動轉入「其他應付款」項目「其他應付款諸戶」<b>「509：警示帳戶剩餘款」</b>分戶。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"並由系統自動將結清之款項轉入「其他應付款」項目「其他應付款諸戶」<mark>「509：警示帳戶剩餘款」分戶</mark>。"}},{"id":"S3-12","m":3,"q":"「警示帳戶發生原因檢討表」正本送營運業務處後，影本應留存多久？","o":["3 年","1 年","5 年","6 個月"],"a":1,"x":"檢討表正本送營運業務處，<b>影本留存 1 年</b>備查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"檢討表正本送營運業務處，<mark>影本留存1年備查</mark>。"}},{"id":"S3-13","m":3,"q":"告誡戶係指違反洗錢防制法第 22 條規定，交付或提供帳戶予他人使用，經何機關裁處告誡之行為人？","o":["直轄市、縣（市）政府警察機關","法務部","金管會","法院"],"a":0,"x":"告誡戶：經<b>直轄市、縣（市）政府警察機關</b>裁處告誡之行為人。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"交付或提供帳戶、帳號予他人使用，<mark>經直轄市、縣(市)政府警察機關裁處告誡之行為人</mark>(包含自然人、法人、設有代表人或管理人之非法人團體、中央或地方機關或其他組織)。"}},{"id":"S3-14","m":3,"q":"受告誡處分者辦理臨櫃支出或匯出匯款，判斷交易顯不合理時，得如何處理？","o":["通報警方後受理","改以現金辦理","得婉拒交易","一律受理"],"a":2,"x":"應判斷交易合理性，得請客戶提供佐證；<b>顯不合理時得婉拒</b>交易。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"辦理各項臨櫃支出或匯出匯款交易，應判斷交易合理性，並得請客戶提供佐證資料，<mark>如判斷交易顯不合理時，得婉拒交易</mark>。"}},{"id":"S3-15","m":3,"q":"依社會救助法開立之專戶接獲法院執行命令時，應如何處理？","o":["辦理扣押設定","逕予解繳","免執行 925Z 扣押設定，惟應具文向來文機關聲明異議","通知客戶結清"],"a":2,"x":"社會救助法專戶不得抵銷、扣押；<b>免執行 925Z</b>，但應<b>具文聲明異議</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"則該帳戶免執行「法院扣押設定交易」（交易代號：925Z），<mark>惟應具文向來文機關聲明異議</mark>。"}},{"id":"S3-16","m":3,"q":"帳戶經設定為「久未往來戶」後，提現金額超過多少時，除大額通貨申報外，並應進行客戶關懷？","o":["100 萬元","10 萬元","30 萬元","50 萬元"],"a":3,"x":"久未往來戶仍得一般存提，但<b>提現超過 50 萬元</b>須辦大額通貨建檔並進行客戶關懷。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十節 靜止戶之處理","t":"但<mark>提現金額超過50萬元之交易</mark>，除依防制洗錢作業規定辦理「大額通貨交易資料（申報）建檔」（交易代號：A190）及留存交易憑證外，並依「營業單位防範存戶遭詐騙及臨櫃領取大額現金注意事項」進行客戶關懷作業。"}},{"id":"S3-17","m":3,"q":"公庫存款單筆提現金額達新臺幣 50 萬元以上時，應如何處理？","o":["確認實際支領現金客戶身分、留存交易紀錄並執行 A190","僅需主管核准","免辦理","通報國庫署"],"a":0,"x":"公庫存款亦應依洗錢防制法<b>確認支領人身分、留存憑證並執行 A190</b>。","ci":{"b":"存款篇","c":"第三章 銀行同業及公庫存款","s":"第二節 公庫存款","t":"(六)單筆提現之金額達新臺幣50萬元以上時，<mark>仍應依洗錢防制法有關規定確認實際支領現金客戶身分及留存交易紀錄憑證，並執行「大額通貨維護交易」</mark>（交易代號：A190）。"}},{"id":"S3-18","m":3,"q":"代收稅款、勞健保費等代收款項交易，單筆現金達新臺幣 50 萬元以上時，下列何者正確？","o":["免建檔","改以轉帳辦理","須客戶另填申請書","將產生大額通貨序號，確認客戶身分後逕予執行建檔"],"a":3,"x":"代收款項單筆現金達 50 萬元，系統產生大額通貨序號，<b>確認身分後逕予執行</b>建檔。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"(３)對於代收款項相關交易（如︰代收稅款、代收勞/健/國民年金保險費..等…），<mark>單筆現金交易達新臺幣50萬元以上時，將產生大額通貨序號，請於確認客戶身分後，逕予執</mark>"}},{"id":"S3-19","m":3,"q":"研判可疑之開戶申請宜婉拒，應執行 A245 交易設定何警示代碼？","o":["Z9","Z8","Z2","Z1"],"a":3,"x":"婉拒開戶設定 <b>Z1</b>；經較高層級主管核准仍受理者設定 Z2（開戶但暫不受理自動化業務）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"1.<mark>如為可疑者，宜婉拒開戶，並執行A245交易，設定警示代碼為「Z1」</mark>。"}},{"id":"S3-20","m":3,"q":"臨櫃交易比對與警政署「疑涉詐騙境內金融帳戶預警清單」相符時，系統提示後應如何處理？","o":["加強臨櫃關懷或交易審核，必要時通知警察協處","一律拒絕","逕予受理","通報法遵處"],"a":0,"x":"系統提示「帳號疑為異常帳戶」，應<b>加強臨櫃關懷或交易審核</b>，必要時通知警察協處。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"請<mark>加強臨櫃關懷或交易審核，必要時請通知警察協處</mark>。請確認是否繼續執行交易"}},{"id":"S3-21","m":3,"q":"本行以電話照會同業時，應向同業表明之事項，下列何者「不」屬之？","o":["照會帳號及照會項目","執行照會之事由","本行客戶之存款餘額","任職分行及姓名職稱"],"a":2,"x":"應表明任職分行與職稱、照會事由、<b>照會帳號及項目</b>；照會內容得含戶名、開戶日期、年齡、職業等。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"２、本行照會同業時：<mark>應向同業表明任職第一銀行OO分行O小姐/先生/副理、執行照會之事由、照會帳號及照會項目</mark>"}},{"id":"S4-1","m":4,"q":"票據金額文字以「廿」代替「貳拾」者，應如何處理？","o":["照付","不得付款","以小寫為準照付","請存戶補蓋印鑑後照付"],"a":1,"x":"「廿」代替「貳拾」者不得付款；「參、叁、参」則不得拒付。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(七)<mark>票據金額文字以「廿」代替「貳拾」者不得付款</mark>。"}},{"id":"S4-2","m":4,"q":"支票記載之發票日為「4 月 31 日」，應以何日為發票日？","o":["5 月 1 日","4 月 30 日","視為未載發票日","該票據無效"],"a":1,"x":"曆法上所無之日期，以該月之末日為發票日。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(三)銀行客戶簽發支票所記載之發票年月日須係曆法上所具有之日，若係二月三十日或四月三十一日等曆法上所無之日期時，<mark>則以該月之末日為發票日</mark>。"}},{"id":"S4-3","m":4,"q":"支票抬頭人得以下列何種圖章背書收款？","o":["統一發票專用章","收件章","收款專用章","請領租金專用章"],"a":2,"x":"收款專用章祇能收款，不能作為轉讓票據之用。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"７、<mark>支票抬頭人得以「收款專用章」背書收款</mark>。"}},{"id":"S4-4","m":4,"q":"受款人以委任取款之目的背書時，應如何完成委任手續？","o":["受款人單獨簽章","受任人單獨簽章","由受款人及受任人共同簽章","經付款行主管核准"],"a":2,"x":"票背記載「票面金額委託○○○取款」並由受款人及受任人共同簽章。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"","t":"十二、受款人以委任取款之目的而為背書者，應於票據背面應記載「票面金額委託○○○取款」，<mark>並由受款人及受任人共同簽章以完成委任手續</mark>，受任人持向銀行要求代收時，應提示受款人身分證明文件，經提示行核對無誤並簽章證明「存入受任人帳戶無誤」後，付款銀行得予照付。"}},{"id":"S4-5","m":4,"q":"法人存戶負責人死亡後、未更換負責人前，如有票據提示，應如何處理？","o":["拒絕付款","仍應付款","退票理由為發票人死亡","請繼承人確認"],"a":1,"x":"法人戶仍應付款；自然人存戶死亡則其生前簽發支票應拒絕付款。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(八)<mark>法人存戶負責人死亡後，未更換負責人之前，如有票據提示，仍應付款</mark>。"}},{"id":"S4-6","m":4,"q":"支票存款戶申請變更負責人後，營業單位應於多久內再次實地查訪？","o":["1 週","2 週","1 個月","2 個月"],"a":1,"x":"申請變更後兩週內，且查訪日期不得晚於領取空白票據日期。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"八、不定期查訪：(一)開戶後如有變更負責人之情事，或非個人戶為久未往來戶欲申領空白支票時，<mark>應於客戶申請變更後兩週內再次實地查訪</mark>瞭解客戶經營狀況，惟實地查訪日期不得晚於客戶領取空白票據日期，並將查訪情形註記於「本行支票存款帳戶開戶/久未往來戶恢復往來/變更負責人查註事項」(存516)「簽註意見」欄，另變更負責人時，則應於次營業日所產生之「支票存款戶開戶基本資料異動明細表」（日報，CK37）備註欄註記完成實地查訪日期，並由支票存款經辦及主管蓋章。"}},{"id":"S4-7","m":4,"q":"「本行支票」自簽發之日起屆滿多久以上，得由執票人繕具「利得償還請求書」請求取款？","o":["3 個月","6 個月","1 年","2 年"],"a":2,"x":"屆滿一年以上得以利得償還請求書請求取款。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"(三)<mark>「本行支票」自簽發之日起屆滿一年以上</mark>，尚未付款者，由系統採帳務連動方式直接由中心主機逐筆轉入「其他應付款」項目「其他應付款諸戶（一）」子目項下分戶「32387－503：簽發本行支票專戶（屆滿一年以上轉入）」備付，轉列時應列印「本行支票轉入其他應付款明細表」（CK-33）及「會計明細分類帳自動轉帳清單」（A52D），另因借、貸方已由中心記帳，故均無需再執行記帳交易，以避免重複入帳之情形發生。"}},{"id":"S4-8","m":4,"q":"票據掛失止付後，通知止付人應於多久內向本行提出已聲請公示催告之證明？","o":["3 日","10 日","7 日","5 日"],"a":3,"x":"不論是否到期，均應於申請掛失止付後 <b>五日內</b>提出已聲請公示催告證明，否則止付通知失效。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第五節 票據之掛失止付","t":"並提醒通知止付人不論止付票據是否到期均應於申請掛失止付後<mark>五日內，向本行提出已為聲請公示催告之證明</mark>…否則止付通知失去效力。"}},{"id":"S4-9","m":4,"q":"下列何者可作為已聲請公示催告之證明？","o":["聲請狀繕（副）本及法院收受公示催告聲請狀之收據","切結書","存證信函","報案三聯單"],"a":0,"x":"證明如<b>聲請狀繕（副）本及法院收受公示催告聲請狀之收據</b>。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第五節 票據之掛失止付","t":"向本行提出已為聲請公示催告之證明（<mark>如：聲請狀繕（副）本及法院收受公示催告聲請狀之收據</mark>）"}},{"id":"S4-10","m":4,"q":"背書蓋有公司、行號名稱及個人職銜戳記，而將職銜部分塗銷者，應如何處理？","o":["不能認為完成背書行為，應予退票","照付","由櫃員補蓋","請持票人說明"],"a":0,"x":"將職銜部分塗銷者，<b>不能認為完成背書行為</b>，應予退票。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"１１、<mark>背書蓋有公司、行號之名稱及個人職銜戳記而將職銜部份塗銷者，不能認為完成背書行為，應予退票</mark>。"}},{"id":"S4-11","m":4,"q":"以「收款專用章」背書之支票，其用途限制為何？","o":["可轉讓與收款","不得使用","祇能收款，不能作為轉讓票據之用","祇能轉讓"],"a":2,"x":"收款專用章<b>祇能以之收款</b>，不能作為轉讓票據之用。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"惟此項專用章，<mark>祇能以之收款，而不能作為轉讓票據之用</mark>。"}},{"id":"S4-12","m":4,"q":"受任人持委任取款之票據向銀行要求代收時，提示行應如何辦理後付款銀行得予照付？","o":["由受款人親自到場","僅核對受任人身分","核對受款人身分證明文件並簽章證明「存入受任人帳戶無誤」","須法院公證"],"a":2,"x":"應提示<b>受款人身分證明文件</b>，經提示行核對並簽章證明「<b>存入受任人帳戶無誤</b>」後付款。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"","t":"受任人持向銀行要求代收時，應提示受款人身分證明文件，<mark>經提示行核對無誤並簽章證明「存入受任人帳戶無誤」後，付款銀行得予照付</mark>。"}},{"id":"S4-13","m":4,"q":"票據文字大寫金額之「貳」字誤寫，而小寫金額已明白表示為「2」時，應如何處理？","o":["由櫃員更正","退票","請持票人重開","應可照付，惟應請存戶嗣後改用通用文字"],"a":3,"x":"小寫已明白表示者<b>應可照付</b>，並請存戶嗣後簽發改用通用文字。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(八)票據文字大寫金額之「貳」字誤寫為「」時，而小寫金額已明白表示為「2」時，<mark>應可照付。惟付款行應請該存戶嗣後簽發票據改用通用文字</mark>。"}},{"id":"S4-14","m":4,"q":"支票發票滿一年之期間計算，下列何者正確？","o":["應算入始日","以次日起算","不算入始日","以提示日起算"],"a":0,"x":"支票發票滿一年之期間自發票日起算，<b>應算入始日</b>。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(六)支票發票滿一年之期間，係自發票日起算，<mark>至於發票滿一年之期間計算，應算入始日</mark>。"}},{"id":"S4-15","m":4,"q":"以銀行為擔當付款人之本票，未記載到期日者，應如何處理？","o":["以發票日後一個月為到期日","不得付款","退票","視為見票即付"],"a":3,"x":"本票或承兌匯票應屆到期日方得付款；<b>未記載到期日者視為見票即付</b>。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(二)以銀行為擔當付款人之本票或承兌匯票應屆到期日方得付款，<mark>未記載到期日者視為見票即付</mark>。"}},{"id":"S4-16","m":4,"q":"自然人支票存款戶死亡後，其生前簽發之支票提示時，應如何處理？","o":["未到期者照付","由繼承人同意後付款","到期者照付","不論到期與否，均因委任關係消滅應拒絕付款"],"a":3,"x":"自然人存戶死亡，委任關係消滅，<b>不論到期與否應拒絕付款</b>（法人負責人死亡則仍應付款）。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(七)<mark>自然人存戶死亡後，其生前所簽發之支票，不論到期與否，均因委任關係消滅，應拒絕付款</mark>。"}},{"id":"S4-17","m":4,"q":"「本行支票」自簽發之日起屆滿一年以上尚未付款者，系統如何處理？","o":["由中心主機逐筆轉入「其他應付款－簽發本行支票專戶（屆滿一年以上轉入）」","自動作廢","通知受款人","轉入營業外收入"],"a":0,"x":"屆滿一年以上未付款者，由中心主機<b>逐筆轉入「其他應付款」項下「503：簽發本行支票專戶」</b>，無需再執行記帳交易。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"「本行支票」自簽發之日起屆滿一年以上，尚未付款者，<mark>由系統採帳務連動方式直接由中心主機逐筆轉入「其他應付款」項目「其他應付款諸戶（一）」子目項下分戶「32387－503：簽發本行支票專戶（屆滿一年以上轉入）」備付</mark>"}},{"id":"S4-18","m":4,"q":"本行支票轉列「其他應付款」時，營業單位應列印何報表？","o":["CK36MR","PB26","CK-33 及 A52D","CK37"],"a":2,"x":"應列印「本行支票轉入其他應付款明細表」<b>CK-33</b> 及「會計明細分類帳自動轉帳清單」<b>A52D</b>。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"轉列時應列印<mark>「本行支票轉入其他應付款明細表」（CK-33）及「會計明細分類帳自動轉帳清單」（A52D）</mark>"}},{"id":"S4-19","m":4,"q":"法人支存戶基本資料 RPA 查對結果不符明細表（CK36MR）之報表日期為何？","o":["每季末","每年 12 月 31 日","每年 1 月 15 日","每月底"],"a":1,"x":"RPA 於每年 1/15 比對，產製 CK36MR（報表<b>日期為每年 12 月 31 日</b>），支存經辦於 1/15 列印。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"並將查對結果不符者產製「法人支存戶基本資料查對結果不符明細表」(<mark>分行月報表，報表代號：CK36MR，日期：每年12月31日</mark>)"}},{"id":"S4-20","m":4,"q":"支票存款戶變更負責人完成實地查訪後，應於何報表備註欄註記完成查訪日期？","o":["CK36MR","次營業日之「支票存款戶開戶基本資料異動明細表」（CK37）","PB26","CK-33"],"a":1,"x":"變更負責人應於<b>次營業日 CK37</b> 備註欄註記完成實地查訪日期，並由支存經辦及主管蓋章。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"另變更負責人時，<mark>則應於次營業日所產生之「支票存款戶開戶基本資料異動明細表」（日報，CK37）備註欄註記完成實地查訪日期</mark>"}},{"id":"S4-21","m":4,"q":"支票存款戶以郵寄方式辦理結清，下列何者正確？","o":["尚有已簽發未經提示付款之票據者，不適用郵寄方式，須臨櫃辦理","存款餘額不限","空白票據無須寄回","須公證"],"a":0,"x":"須將剩餘空白票據劃線作廢寄回；<b>尚有已簽發未提示之票據者，不適用郵寄</b>，須臨櫃辦理。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"申請結清支票存款帳戶者，須將剩餘空白票據劃線作廢後一併寄回本行，<mark>如尚有已簽發未經提示付款之票據，則不適用郵寄方式，須請其臨櫃辦理結清銷戶事宜</mark>。"}},{"id":"S4-22","m":4,"q":"支票存款開戶時徵取之印鑑卡，應如何保存？","o":["按日期順序","交客戶保管","送總行保管","按帳號順序訂冊，並於印鑑暨影像管理系統辦理印鑑建檔"],"a":3,"x":"印鑑卡<b>按帳號順序訂冊</b>以便核對，並於印鑑暨影像管理系統辦理建檔。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"(二)<mark>印鑑卡按帳號順序訂冊，以便核對，同時於印鑑暨影像管理系統辦理印鑑建檔</mark>。"}},{"id":"S4-23","m":4,"q":"原始存款行接獲代收行寄回之退票票據後，應由何人保管退票票據？","o":["經理","櫃員主任","會計人員","經辦"],"a":1,"x":"退票票據<b>由櫃員主任保管</b>，經辦應通知存戶儘速領取並記錄通知情形。","ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第三節 代收存款","t":"<mark>退票票據由櫃員主任保管</mark>，經辦應據「代收票據退回提送單」通知存戶儘速來行領取退票票據"}},{"id":"S5-1","m":5,"q":"取款憑條所填日期在領款日期前幾天以內者可以付款？","o":["3 天","5 天","7 天","10 天"],"a":2,"x":"7 天以內可付款；超過 7 天或在領款日期以後者，應請存戶更改並加蓋原留印鑑。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"一、<mark>取款憑條所填日期如在領款日期前7天以內者可以付款</mark>；"}},{"id":"S5-2","m":5,"q":"存戶新臺幣活期性存款帳戶餘額不超過多少，得利用第e個網辦理線上結清銷戶？","o":["3 萬元","5 萬元","10 萬元","20 萬元"],"a":1,"x":"餘額不超過新臺幣伍萬元者得線上結清。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"十七、線上結清銷戶(一)<mark>存戶新臺幣活期性存款帳戶餘額不超過新臺幣伍萬元者</mark>，得利用第ｅ個網結清銷戶功能辦理線上結清銷戶作業。"}},{"id":"S5-3","m":5,"q":"存戶本人臨櫃辦理有摺戶無摺提領現金，提領金額有何限制？","o":["不得超過 3 萬元","不得超過 50 萬元","提領金額不受限制","須主管核准方可提領"],"a":2,"x":"本人臨櫃不受限制，惟應出示身分證明並於取款憑條親簽確認無摺支出意旨。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"第四章活期存款4-4(１)本人（或公司、行號、團體之負責人）臨櫃辦理時：<mark>提領金額不受限制</mark>，惟應請存戶出示身分證明文件由記帳經辦確認係本人辦理，並請其於取款憑條親簽確認無摺支出意旨，再由經辦於取款憑條背面認證欄「※向本人確認無誤（經辦蓋章）：」後蓋章，再據以辦理支出作業。"}},{"id":"S5-4","m":5,"q":"代製傳票之內容與客戶提供之帳號、戶名資料不符時，應如何處理？","o":["提示客戶檢閱確認","由主管核准後交易","不得提示予臨櫃客戶檢閱，並須回收銷毀","改以無摺交易"],"a":2,"x":"為免客戶資料外洩，已代製之傳票不得提示並應回收銷毀。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"(三)若所代製傳票與客戶提供之帳號、戶名資料不符，為免客戶資料外洩，<mark>已代製好之傳票不得提示予臨櫃客戶檢閱</mark>，並須回收銷毀。"}},{"id":"S5-5","m":5,"q":"資訊處每二個月自動將連續幾個月無薪資入帳之薪資轉帳戶，性質別由 38 變更為 00 一般戶？","o":["1 個月","2 個月","3 個月","6 個月"],"a":1,"x":"連續二個月無薪資入帳者變更為一般戶，並編製「薪資轉帳戶優惠利率變更清 mark>。"}},{"id":"S5-26","m":5,"q":"匯款至虛擬帳號之交易備註欄出現「賭金」、「娛樂城」等字義時，應如何處理？","o":["逕予退匯","照常入帳","檢視是否為異常交易","通知收款人"],"a":2,"x":"交易備註欄有可疑字義（如賭金、娛樂城）時，應<b>檢視是否為異常交易</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"１１、<mark>如匯款至虛擬帳號之交易備註欄有可疑字義時（如賭金、娛樂城等），檢視是否為異常交易</mark>。"}},{"id":"S5-27","m":5,"q":"客戶通知不到之未領回存摺，保管六個月後註銷時，應由何人會同辦理？","o":["保管主管會同會計人員","任一主管","經辦會同櫃員主任","經理會同經辦"],"a":0,"x":"保管六個月後由<b>保管主管會同會計人員</b>逕予註銷，並註記蓋章陳核經理。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"得於保管六個月（自登記日期起算）後，<mark>由保管主管會同會計人員逕予註銷該保管存摺</mark>"}},{"id":"S6-1","m":6,"q":"定期儲蓄存款（零存整付除外）存入本金之最低額度為何？","o":["新臺幣 1 千元","新臺幣 5 千元","新臺幣 1 萬元","新臺幣 5 萬元"],"a":1,"x":"自 2002.7.1 起為 5 千元；零存整付每次存入 1 千元以上。","ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"二、定期儲蓄存款（零存整付存款除外）<mark>存入本金之最低額度，自2002年7月1日起調整為新臺幣5千元</mark>，零存整付儲蓄存款每次存入金額為新臺幣1千元以上。"}},{"id":"S6-2","m":6,"q":"下列定期存款業務，何者仍須於原始開戶行辦理？","o":["開立存單","到期取款","中途解約","存單質權設定"],"a":3,"x":"法院扣押抵銷及解繳、質權設定、法院提存事故狀態、結構型商品及離職儲金帳戶須於原始開戶行辦理。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第一節 性質","t":"五、帳務性交易，除存單存款之<mark>法院扣押抵銷及解繳、質權設定</mark>、法院提存事故狀態、結構型商品及離職儲金帳戶，仍須於原始開戶行辦理外，其餘如開立存單交易、到期取款（含中途解約）、付息、轉期續存、補付利息、補徵利息及所得稅調整作業等，各營業單位皆可辦理。"}},{"id":"S6-3","m":6,"q":"存本取息儲蓄存款中途解約時，存戶已按原存單利率按月領取之利息如有溢付，應如何處理？","o":["不予追回","應予扣回，並將溢扣之所得稅退還存戶","由經辦賠償","轉列其他應收款"],"a":1,"x":"溢付應予扣回並退還溢扣之所得稅（交易代號 243）。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第六節 中途解約","t":"六、中途解約支付本息時，存戶已照原存單利率按月領取之利息<mark>如有溢付應予扣回</mark>，並將溢扣之所得稅退還存戶（交易代號：243）。"}},{"id":"S6-4","m":6,"q":"外籍人士辦理定期儲蓄存款，下列何者正確？","o":["無須居留證","存款期間不得逾其居留證之有效期限，亦不得申請自動轉期","可申請自動轉期","一律改存可轉讓定存單"],"a":1,"x":"無居留證或居留證已逾期者改存「定期存款」（科目代號 40）。","ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"為符合前述規定，外籍人士辦理定期儲蓄存款時，應審核該戶是否已取得中華民國外僑居留證，<mark>且該筆存款期間不得逾其居留證之有效期限，亦不得申請自動轉期</mark>。"}},{"id":"S6-5","m":6,"q":"經辦得否以新臺幣定期性存款中途解約免打八折方式鼓勵客戶申購信託／保險商品？","o":["可以","不可以","經主管核准即可","金額 100 萬元以上可以"],"a":1,"x":"不得；並應每日列印 CT66 查明資金流向（限員工福儲帳戶）。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第六節 中途解約","t":"四、<mark>經辦不得以新臺幣定期性存款中途解約免打八折方式</mark>，鼓勵客戶申購信託/保險等商品，並應每日列印前一營業日之「新臺幣定期性存款中途解約未打八折日報表」（報表代號：CT66，報表顯示為本日無資料時免列印），查明客戶是否有依資金流向辦理指定業務〈限員工福儲帳戶〉，於「備註」欄位註明“查證無誤”或類似字句，並影印交易傳票附訂於報表之後備查；"}},{"id":"S6-6","m":6,"q":"CT70「存單存款轉期後適用大額利率客戶明細表」通知客戶後，聯絡情形應呈核至何人？保存年限為何？","o":["經辦，3 年","副理，1 年","經理，5 年","總行，永久"],"a":2,"x":"聯絡情形記錄於通知情形欄後<b>呈核至經理</b>，<b>保存 5 年</b>。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第十三節 其他處理要點","t":"通知客戶其存單轉期後將適用大額牌告利率，<mark>並將聯絡情形記錄於通知情形欄位後呈核至經理，保存年限5年</mark>。"}},{"id":"S6-7","m":6,"q":"定期存款下列帳務性交易，何者聯行「不得」辦理？","o":["付息","開立存單","補徵利息","法院提存事故狀態之存單"],"a":3,"x":"法院扣押抵銷解繳、質權設定、<b>法院提存事故</b>、結構型商品、離職儲金須原開戶行；其餘聯行可辦。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第一節 性質","t":"五、帳務性交易，<mark>除存單存款之法院扣押抵銷及解繳、質權設定、法院提存事故狀態、結構型商品及離職儲金帳戶，仍須於原始開戶行辦理外</mark>"}},{"id":"S6-8","m":6,"q":"CT66「新臺幣定期性存款中途解約未打八折日報表」查無客戶依指定業務之交易紀錄時，應如何處理？","o":["註銷存單","不處理","報總行備查","應即聯繫客戶並收回中途解約未打八折之利息"],"a":3,"x":"查無轉存員工福儲帳戶紀錄者，應<b>即聯繫客戶並收回未打八折之利息</b>，於備註說明。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第六節 中途解約","t":"<mark>若查無客戶交易紀錄，則應即聯繫客戶並收回中途解約未打八折之利息</mark>，再於報表之「備註」欄位說明處理情形。"}},{"id":"S6-9","m":6,"q":"自 2024 年 4 月 22 日起，列印零存整付存單時將印錄何文字，主管應於簽發時覆核確認？","o":["「機動利率」","「本存單不得轉讓」","「大額利率」","「未/已約定每月自動扣繳」"],"a":3,"x":"零存整付存單印錄「<b>未/已約定每月自動扣繳</b>」文字，主管於簽發存單時覆核確認。","ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"自2024年4月22日起，<mark>列印零存整付存單時將印錄「未/已約定每月自動扣繳」文字</mark>，主管應於簽發存單時覆核確認"}},{"id":"S6-10","m":6,"q":"零存整付委託代繳，系統於約定扣款日前幾日以 E-MAIL 通知客戶？","o":["5 日","10 日","7 日","3 日"],"a":2,"x":"系統於約定扣款日<b>前 7 日</b>依留存 E-MAIL 傳送加密電子郵件通知客戶。","ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第二節 零存整付","t":"(五)<mark>系統將於零存整付委託代繳之約定扣款日前7日</mark>，依客戶留存於本行之「E-MAIL信箱」傳送電子郵件通知客戶。"}},{"id":"S6-11","m":6,"q":"居留證未逾期之外籍人士辦理定期儲蓄存款，下列何者正確？","o":["得申請自動轉期","存期不受限制","存款期間不得逾居留證有效期限，亦不得申請自動轉期","須改存定期存款"],"a":2,"x":"須有外僑居留證，<b>存期不得逾居留證有效期限</b>，亦<b>不得申請自動轉期</b>。","ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"外籍人士辦理定期儲蓄存款時，應審核該戶是否已取得中華民國外僑居留證，<mark>且該筆存款期間不得逾其居留證之有效期限，亦不得申請自動轉期</mark>。"}},{"id":"S6-12","m":6,"q":"定期存款中途解約支付本息時，溢扣之所得稅應以何交易退還存戶？","o":["984S","1560","9330","243"],"a":3,"x":"溢付利息扣回，並將溢扣之所得稅退還存戶（交易代號：<b>243</b>）。","ci":{"b":"存款篇","c":"第十章 定期存款","s":"第六節 中途解約","t":"六、中途解約支付本息時，存戶已照原存單利率按月領取之利息如有溢付應予扣回，<mark>並將溢扣之所得稅退還存戶（交易代號：243）</mark>。"}},{"id":"S6-13","m":6,"q":"綜合存款存入取得議價利率之定期性存款，下列何者正確？","o":["得自動轉期","不得存入","由系統控管不得辦理自動轉期","須以實體存單辦理"],"a":2,"x":"綜存得存入議價利率定期性存款，並<b>由系統控管不得自動轉期</b>。","ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第一節 性質","t":"十一、本存款得存入取得議價利率之定期性存款，<mark>並由系統控管不得辦理自動轉期</mark>。"}},{"id":"S7-1","m":7,"q":"給付非中華民國境內居住之個人利息所得，應於何時將所扣繳稅款繳清並申報？","o":["每月 10 日前","代扣稅款之日起 10 日內","次月月底前","每年 1 月底前"],"a":1,"x":"非居住者於代扣日起 10 日內繳清並申報核驗。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(二)非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，<mark>其利息所得應於代扣稅款之日起十日內</mark>，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗。"}},{"id":"S7-2","m":7,"q":"境內無住所但於一課稅年度內在境內居留合計滿 183 天者，存款利息所得按給付額扣取多少？","o":["5%","10%","15%","20%"],"a":1,"x":"得按給付額扣取 10%。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(三)付息時可確定存戶在中華民國境內無住所而於一課稅年度內在中華民國境內居住合計滿183天者，<mark>其存款利息所得稅得按給付額扣取百分之十</mark>。"}},{"id":"S7-3","m":7,"q":"其他金融業本業收入之營業稅率為何？","o":["1%","2%","5%","10%"],"a":1,"x":"銀行本業 5%、銀行業非專屬本業 5%、其他金融業本業 2%。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"<mark>(2)其他金融業</mark>本業收入之營業稅率為2％。"}},{"id":"S7-4","m":7,"q":"承攬契據（如清潔維護契約、保全服務合約）之印花稅率為何？","o":["每件 12 元","按金額 0.1%","按金額 0.4%","免稅"],"a":1,"x":"承攬契據 0.1%；買賣動產契據每件 12 元；銀錢收據 0.4%。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(三)<mark>承攬契據(如清潔維護契約、機器維護合約、保全服務合約等)每件按金額0.1％</mark>。"}},{"id":"S7-5","m":7,"q":"營業稅完成申報、繳納及核定後之相關文件，保存期限為何？","o":["1 年","3 年","5 年","10 年"],"a":2,"x":"設置專卷保管，保存期限為五年。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"四、保管文件：完成申報、繳納及核定後，應將申報書、計算表及營業稅調節表等相關文件設置專卷保管，文件內容請詳本章最末頁附表「營業稅及印花稅彙總繳納申報作業文件彙整表」，<mark>保存期限為五年</mark>。"}},{"id":"S7-6","m":7,"q":"公寓大廈管理委員會以管理委員會名義存入之公共基金孳息，如何始得免扣繳利息所得稅？","o":["一律免扣","驗明稅捐機關核發之免扣繳證明","出具管委會切結書","經理核准"],"a":1,"x":"應於驗明稅捐機關核發之免扣繳證明後辦理免扣。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"４、公寓大廈管理委員會或社區管理委員會如僅對住戶收取公共基金及相關管理費用，並無任何營利收入，其以管理委員會名義設立專戶儲存公共基金或管理費用之孳息，<mark>應於驗明稅捐機關核發之免扣繳證明後，辦理免扣所得稅</mark>。"}},{"id":"S7-7","m":7,"q":"中央存款保險對每一存款人之本金及利息債權最高保額為多少？","o":["100 萬元","200 萬元","300 萬元","500 萬元"],"a":2,"x":"最高保額新臺幣參佰萬元（含外幣存款，不含國際金融業務分行存款）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"十四、本行業已參加中央存款保險股份有限公司存款保險，加入存款保險後，中央存款保險公司對本行存款人存入之支票存款、活期存款、定期存款、儲蓄存款及其他經主管機關核准承保之存款（含外幣存款，不含國際金融業務分行存款），負賠償責任，但對每一存款人之本金及利息債權<mark>最高保額以新臺幣參佰萬元為限</mark>。"}},{"id":"S7-8","m":7,"q":"可轉讓定期存單持有人為非境內居住之個人，其利息所得之扣繳率為何？","o":["20%","15%","免扣繳","10%"],"a":1,"x":"可轉讓定存單、商業票據、銀行承兌匯票等短期票券之非居住者，按給付額扣取 <b>15%</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"如持有人為非中華民國境內居住之個人或在中華民國境內無固定營業場所之營利事業，其到期兌償金額超過首次發售價格部分之利息，<mark>按給付額扣取百分之十五</mark>。"}},{"id":"S7-9","m":7,"q":"境內居住個人每次應扣繳稅額不超過 2,000 元免扣繳，其相當之利息所得上限為何？","o":["10 萬元","2 萬元","5 萬元","1 萬元"],"a":1,"x":"每次應扣繳稅額不超過 2,000 元，<b>即利息所得不超過新臺幣 2 萬元</b>者，得免予扣繳。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"每次應扣繳稅額不超過新臺幣二千元（<mark>即利息所得不超過新臺幣二萬元</mark>）者，得免予扣繳利息所得稅，惟仍應填寫「各類所得扣繳暨免扣繳憑單」。"}},{"id":"S7-10","m":7,"q":"自 103 年 2 月 17 日起，本行對個人存戶利息所得扣繳憑單之寄發方式為何？","o":["由國稅局寄發","每年寄發","除納稅義務人要求填發外，不再寄發","僅寄發電子檔"],"a":2,"x":"除納稅義務人要求填發外，<b>不再寄發</b>；可臨櫃、客服申領或於第 e 個網、eATM 下載。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"但自103年2月17日起，<mark>除納稅義務人要求填發外，本行對個人存戶不再寄發利息所得扣繳憑單</mark>。"}},{"id":"S7-11","m":7,"q":"個人存戶可自行透過第 e 個網及 eATM 網路理財機下載列印最近多久之所得資料？","o":["1 年","3 年","6 個月","5 年"],"a":0,"x":"可自行利用第 e 個網及 eATM <b>下載列印最近 1 年</b>所得資料。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"亦得自行利用第e個網（個人網路銀行）及eATM網路理財機（網路ATM）<mark>下載列印最近1年所得資料</mark>。"}},{"id":"S7-12","m":7,"q":"各項代扣利息所得稅款，應暫存入何項目專戶彙集繳庫？","o":["其他預收款","應付代收款－應付代扣稅款","暫收款","其他應付款"],"a":1,"x":"代扣稅款應暫存入「應付代收款」項目「<b>應付代扣稅款</b>」專戶，俾彙集繳庫。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(九)<mark>各項代扣利息所得稅款，應暫存入「應付代收款」項目「應付代扣稅款」專戶</mark>，俾彙集繳庫。"}},{"id":"S7-13","m":7,"q":"存戶經稽徵機關認定屬「非中華民國境內居住之個人」，其所得扣繳率為何？","o":["15%","10%","25%","20%"],"a":3,"x":"經認定屬非境內居住之個人者，所得扣繳率為 <b>20%</b>，銀行應通知存戶補繳短扣稅款。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(十)存戶如經稽徵機關認定屬「非中華民國境內居住之個人」（<mark>所得扣繳率為百分之二十</mark>），通知銀行續行向所得人追補短扣稅款者"}},{"id":"S7-14","m":7,"q":"稽徵機關通知追補非居住者短扣稅款時，銀行通知存戶補繳差額，下列何者正確？","o":["由銀行負擔","須罰鍰","免予加計利息及滯納金","須加計利息及滯納金"],"a":2,"x":"通知存戶補繳差額之扣繳稅款，<b>免予加計利息及滯納金</b>；未補繳者自次期利息補扣。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"銀行應就短扣繳之利息所得稅，通知存戶補繳差額之扣繳稅款（<mark>免予加計利息及滯納金</mark>），如存戶未為補繳，銀行應於給付次期利息時，自其利息所得補扣短繳之稅款"}},{"id":"S7-15","m":7,"q":"依金融資產證券化條例發行之受益證券分配之利息，扣繳率為何？","o":["免扣繳","按分配額扣取 15%","按分配額扣取 20%","按分配額扣取 10%"],"a":3,"x":"證券化受益證券或資產基礎證券分配之利息，按<b>分配額扣取 10%</b>；公債、公司債、金融債券利息按給付額 10%。","ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"（三）<mark>依金融資產證券化條例及不動產證券化條例規定發行之受益證券或資產基礎證券分配之利息，按分配額扣取百分之十</mark>。"}},{"id":"S7-16","m":7,"q":"因未達起扣點而未經扣繳稅款者，扣繳義務人應如何辦理？","o":["每月申報","無須申報","應於每年一月底將受領人資料及全年給付金額列單申報主管稽徵機關","僅需留存"],"a":2,"x":"未達起扣點或不屬扣繳範圍而未扣繳者，仍應於<b>每年一月底列單申報</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"因未達起扣點，或因不屬所得稅法規定之扣繳範圍，而未經扣繳稅款者，<mark>應於每年一月底，將受領人姓名、住址、國民身分證統一編號及全年給付金額等，依規定格式，列單申報主管稽徵機關</mark>。"}},{"id":"S7-17","m":7,"q":"下列何種所得，每次應扣繳稅額雖未超過 2,000 元，仍應依規定扣繳？","o":["佣金","租金","執行業務報酬","與證券商或銀行從事結構型商品交易之所得"],"a":3,"x":"例外仍應扣繳者：短期票券利息、證券化受益證券利息、公債公司債金融債券利息、附條件交易利息、<b>結構型商品交易所得</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"(4)以前三款之有價證券或短期票券從事附條件交易，到期賣回金額超過原買入金額部分之利息。<mark>(5)與證券商或銀行從事結構型商品交易之所得</mark>。"}},{"id":"S7-18","m":7,"q":"營業稅稅額計算之尾數不滿通用貨幣一元者，如何處理？","o":["捨去","以一元計","進位","四捨五入"],"a":3,"x":"營業稅尾數不滿一元者，按<b>四捨五入</b>計算（印花稅則元以下捨去）。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"(2)其他金融業本業收入之營業稅率為2％。<mark>尾數不滿通用貨幣一元者，按四捨五入計算</mark>。"}},{"id":"S7-19","m":7,"q":"自 99 年起，每年何月辦理營業稅提存時，系統會自動減除全年度轉銷呆帳之未實現利息收入？","o":["6 月","10 月","12 月","1 月"],"a":2,"x":"每年<b>十二月</b>辦理營業稅提存時，系統自動減除全年度彙總之轉銷呆帳未實現利息收入。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"配合前開解釋令，<mark>自99年起，每年十二月辦理營業稅提存時，由系統自動「減：轉銷呆帳之未實現利息收入」全年度彙總金額</mark>後計出營業稅銷售額及稅額。"}},{"id":"S7-20","m":7,"q":"營業稅核定結果查詢列印後，應由何人分別於「查詢結果」處下方蓋章？","o":["經理及總務","櫃員主任","會計人員及主管人員","經辦及副理"],"a":2,"x":"核定結果畫面確認後送主管覆核，<b>會計人員及主管人員</b>分別於查詢結果處下方蓋章。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"確認「查詢結果」後送交主管人員覆核，<mark>會計人員及主管人員應分別於「查詢結果」處下方蓋章</mark>。如對核定結果不服，應於復查時效內申請復查。"}},{"id":"S7-21","m":7,"q":"典賣、讓受及分割不動產契據之印花稅率為何？","o":["每件按金額 0.4%","免稅","每件 12 元","每件按金額 0.1%"],"a":3,"x":"典賣、讓受及分割不動產契據每件按金額 <b>0.1%</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(四)<mark>典賣、讓受及分割不動產契據每件按金額0.1％</mark>。"}},{"id":"S7-22","m":7,"q":"契據約定於合約期滿時雙方若無異議，將自動依原期間延長而繼續有效者，印花稅應如何處理？","o":["僅首次貼用","免再貼","屆期應再貼印花稅票","減半貼用"],"a":2,"x":"自動延長而繼續有效之契據，<b>屆期應再貼印花稅票</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"另本行如事前與立據之關係人約定，於合約期滿時雙方若無異議，契據將自動依原契據期間延長而繼續有效者，<mark>屆期應再貼印花稅票</mark>。"}},{"id":"S7-23","m":7,"q":"銀行開立之營業資產租金收入收據，印花稅之處理為何？","o":["應按 0.4% 貼用","屬非專屬本業銷貨收入之營業發票性質銀錢收據，免納印花稅","按 0.1%","按每件 12 元"],"a":1,"x":"信用卡手續費、保管箱手續費、<b>營業資產租金</b>等非專屬本業收入之營業發票性質收據，<b>免納印花稅</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(二)銀行業經營非專屬本業部份之銷貨收入，所開立具有營業發票性質之銀錢收據，<mark>如信用卡手續費收入、保管箱手續費收入、營業資產租金收入等，依印花稅法第5條第2款但書規定，免納印花稅</mark>。"}},{"id":"S7-24","m":7,"q":"中央存款保險之承保範圍，下列何者「不」包括？","o":["支票存款","外幣存款","國際金融業務分行（OBU）存款","定期存款"],"a":2,"x":"承保支票、活期、定期、儲蓄存款及外幣存款，<b>不含國際金融業務分行存款</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"中央存款保險公司對本行存款人存入之支票存款、活期存款、定期存款、儲蓄存款及其他經主管機關核准承保之存款（<mark>含外幣存款，不含國際金融業務分行存款</mark>），負賠償責任"}},{"id":"S7-25","m":7,"q":"擬參選人政治獻金專戶，於選舉投票日起多久內仍得臨櫃存入現金？","o":["10 日","15 日","7 日","30 日"],"a":1,"x":"擬參選人於選舉投票日（含）起 <b>15 日</b>內仍得臨櫃存入現金，逾期不許存入。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１、<mark>擬參選人於選舉投票日（含選舉投票日）起15日</mark>（末日為星期日、國定假日或其他休息日者，以該日之次日為期間之末日）內，仍得臨櫃存入現金，逾期即不許其存入。"}},{"id":"S7-26","m":7,"q":"非境內居住之個人利息所得扣繳後，開具之扣繳憑單應如何處理？","o":["次年寄發","留存本行","向稽徵機關申報核驗後，發給納稅義務人","免開具"],"a":2,"x":"應於代扣之日起 10 日內繳清，開具扣繳憑單<b>申報核驗後發給納稅義務人</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"應於代扣稅款之日起十日內，將所扣稅款向國庫繳清，<mark>並開具扣繳憑單，向該管稽徵機關申報核驗後，發給納稅義務人</mark>。"}},{"id":"S7-27","m":7,"q":"印花稅之計算，元以下如何處理？","o":["自動捨去","以角計","四捨五入","進位為一元"],"a":0,"x":"印花稅以計至通用貨幣<b>元為止，元以下自動捨去</b>。","ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"<mark>印花稅以計至通用貨幣元為止，元以下自動捨去</mark>。"}},{"id":"S8-1","m":8,"q":"櫃員辦理新臺幣存款提領，現金支付金額在多少以內者得逕予付款？","o":["10 萬元","20 萬元","30 萬元","50 萬元"],"a":2,"x":"30 萬元以內得逕予付款並立即交主管或檢核專員覆核；超過者送主管認證後轉交櫃員主任付款。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"四、為簡化作業流程，縮短客戶等候時間，營業單位櫃員得於下列規定額度內辦理付款、認證事項：(一)櫃員付現額度：櫃員辦理各種新臺幣存款之提領，<mark>其現金支付金額在新臺幣參拾萬元以內者，得逕予付款</mark>，惟應立即交主管或檢核專員覆核認證。"}},{"id":"S8-2","m":8,"q":"櫃員對存單存款利息之支領，利息支付金額在多少以內得逕予付款？","o":["1 萬元","2 萬元","3 萬元","5 萬元"],"a":1,"x":"2 萬元以內得逕予付款；超過者送主管或檢核專員認證覆核。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(二)櫃員付息額度：櫃員對存單存款利息之支領，<mark>其利息支付金額在新臺幣貳萬元以內者，得逕予付款</mark>。"}},{"id":"S8-3","m":8,"q":"為利內部牽制，下列何者敘述正確？","o":["櫃員主任得兼任會計","櫃員主任得兼任 ATM 經辦","櫃員主任、會計及檢核專員不得相互兼任","檢核專員得兼任會計"],"a":2,"x":"櫃員主任、會計及檢核專員不得相互兼任；櫃員主任不得同時兼任 ATM 經辦。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"十五、為利分行內部牽制作業，<mark>櫃員主任、會計及檢核專員不得相互兼任</mark>；"}},{"id":"S8-4","m":8,"q":"營業單位金庫室正、副門之內柵門及外門備份鑰匙，應由何人共同簽封？","o":["經理及存匯主管","經理及櫃員主任","經理及輪值主管","存匯主管及櫃員主任"],"a":1,"x":"經理及櫃員主任共同簽封（出納作業規定）。","lo":1},{"id":"S8-5","m":8,"q":"自動櫃員機辦理裝卸鈔作業，原則上每台應於多久內完成？","o":["1 小時","2 小時","3 小時","4 小時"],"a":1,"x":"原則上每台 2 小時內完成（出納／ATM 作業規定）。","lo":1},{"id":"S8-6","m":8,"q":"矮櫃櫃員受理存款戶結清銷戶後之現金付款，應如何處理？","o":["1 萬元以下自行付款","10 萬元以下自行付款","不論金額交由櫃員主任付款，並經第三人覆點交付","交由高櫃付款即可"],"a":2,"x":"矮櫃不得辦理現金付款，須由櫃員主任付款並經第三人覆點。","lo":1},{"id":"S8-7","m":8,"q":"櫃員付現額度內之付款，付款後應如何處理？","o":["應立即交主管或檢核專員覆核認證","由櫃員主任覆核","免覆核","月底覆核"],"a":0,"x":"30 萬元以內得逕予付款，<b>惟應立即交主管或檢核專員覆核認證</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"其現金支付金額在新臺幣參拾萬元以內者，得逕予付款，<mark>惟應立即交主管或檢核專員覆核認證</mark>。"}},{"id":"S8-8","m":8,"q":"支票存款提領超過櫃員付現額度時，應如何處理？","o":["送主管認證覆核後，再轉交櫃員主任辦理付款","由櫃員分次付款","請客戶改日","拒絕付款"],"a":0,"x":"超過付現額度（30 萬元）者，<b>送主管認證覆核</b>後，再<b>轉交櫃員主任</b>付款。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第三節 記帳手續","t":"於櫃員付現額度以內（新臺幣30萬元）辦理付款，付訖之支（本）票並即交核對人員覆核；<mark>超過付現額度者，則應送主管認證覆核後，再轉交櫃員主任辦理付款</mark>。"}},{"id":"S8-9","m":8,"q":"營業單位前月發生出納現金剩餘或短缺案件，存匯副理當月抽查所屬經辦當日收付現金情形之次數為何？","o":["每日","至少 1 次","至少 4 次","至少 2 次，且不得事先告知"],"a":3,"x":"前月有短溢案件者，副理當月抽查增為<b>至少 2 次</b>，<b>不得事先告知</b>並細點各面額張數。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"營業單位前月如發生出納業務現金剩餘或短缺案件，存匯副理於當月辦理業務抽查時，應增加「營業時間中抽查所屬經辦當日收付現金情形」<mark>為至少2次(原抽查各經辦至少1次)，且不得事先告知所屬</mark>"}},{"id":"S8-10","m":8,"q":"主管不定時抽查櫃員現金狀況，應使用何交易？","o":["K001-1","1092-1 櫃員帳務查詢","1099-1","9701"],"a":1,"x":"主管應不定時以「櫃員帳務查詢交易」<b>1092-1</b> 抽查櫃員現金，異狀即時清查並登記。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"並不定時以<mark>「櫃員帳務查詢交易」（交易代號：1092-1）抽查櫃員現金狀況</mark>，如有異狀應即時清查其交易與庫存現金"}},{"id":"S8-11","m":8,"q":"一般櫃員結帳時，現金盤點相符後執行「現金結帳設定」之交易代號為何？","o":["1099-2","1099-1","1092-6","1092-1"],"a":1,"x":"盤點相符後執行「櫃員帳務結帳設定交易－現金結帳設定」<b>1099-1</b>，並列印櫃員資金紀錄表送主管覆點。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"經盤點相符後，<mark>執行「櫃員帳務結帳設定交易－現金結帳設定」(交易代號：1099－1)辦理現金結帳設定</mark>，並自動列印「櫃員資金紀錄表」連同庫存現金送交主管覆點後，再轉交櫃員主任。"}},{"id":"S8-12","m":8,"q":"一般櫃員盤點庫存現金與現金帳餘額不符時，可執行何交易查詢與現金有關之交易明細？","o":["1099-3","1092-1","1092-6 櫃員交易明細查詢（現金）","9703"],"a":2,"x":"不符時可執行「櫃員交易明細查詢（現金）」<b>1092-6</b> 查詢現金交易明細。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"倘若不符，<mark>可執行「櫃員帳務查詢交易－櫃員交易明細查詢(現金)」(交易代號：1092－6)</mark>，查詢與現金有關之交易明細"}},{"id":"S8-13","m":8,"q":"存匯櫃員受理理財人員代客交付之交易文件，完成交易後之存摺應由何人交付客戶？","o":["受理櫃員之直屬主管、其他主管或記帳人員以外之人員親自交付","理財人員","郵寄","受理櫃員本人"],"a":0,"x":"嚴禁理財人員代客全程辦理；應由<b>直屬主管、其他主管或記帳人員以外之人員</b>親自交付並確認。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(１)<mark>由受理櫃員之直屬主管、其他主管或記帳人員以外之人員親自交付存摺、收執聯等</mark>（如為金融卡或電子銀行密碼函，則僅能由主管親自交付）予客戶收執並確認交易內容。"}},{"id":"S8-14","m":8,"q":"理財人員代客交付之交易，金融卡或電子銀行密碼函應由何人親自交付客戶？","o":["理財人員","記帳人員","僅能由主管","任一行員"],"a":2,"x":"金融卡或電子銀行密碼函<b>僅能由主管</b>親自交付。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"（<mark>如為金融卡或電子銀行密碼函，則僅能由主管親自交付</mark>）予客戶收執並確認交易內容。"}},{"id":"S8-15","m":8,"q":"理財人員代客交付之交易若無收執文件需交付（如變更基本資料），應如何處理？","o":["免處理","請理財人員簽名","仍應向客戶關懷、確認，並於交易文件註記「向本人確認無誤」後蓋私章","郵寄通知"],"a":2,"x":"仍應向客戶<b>關懷確認</b>，並於交易文件空白處註記「向本人確認無誤」等字樣後蓋章。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(３)如該交易無收執文件需交付客戶（如變更客戶基本資料或印鑑等），<mark>前揭人員仍應向客戶予以關懷、確認，並於交易文件空白處註記「向本人確認無誤」等同義字樣後加蓋私章備查</mark>。"}},{"id":"S8-16","m":8,"q":"行外 ATM 委託保全公司填補鈔，以匯款或轉帳至保全公司帳戶方式辦理者，是否須辦理 A190 大額通貨建檔？","o":["僅超過 100 萬須建檔","由保全公司申報","非屬申報大額通貨交易範圍，得免辦理 A190","須建檔"],"a":2,"x":"以匯款或轉帳至保全公司指定帳戶者，<b>非屬大額通貨交易申報範圍</b>，得免辦 A190。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"如係採將補鈔金額匯款或轉帳至保全公司指定帳戶之交易方式辦理，<mark>非屬「金融機構防制洗錢辦法」所稱申報大額通貨交易之範圍</mark>，爰辦理行外ATM裝卸鈔暫以其他應收款墊支及歸墊作業，得免辦理A190交易之建檔"}},{"id":"S8-17","m":8,"q":"營業單位封簽保管空白可轉讓定存單，應由何人共同封簽？","o":["櫃員主任與出納主管","會計及總務","任二位行員","經辦及經理"],"a":0,"x":"由<b>櫃員主任及出納主管</b>點算後填封簽單並共同封簽（騎縫章並加註日期）。","ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第三節 存單之保管","t":"<mark>由櫃員主任與出納主管共同封簽(蓋具騎縫章並加註日期)</mark>。"}},{"id":"S8-18","m":8,"q":"空白可轉讓定存單之入庫、使用、作廢及庫存情形，每日應如何查點？","o":["月底查點","免查點","由會計查點","由系統印錄於庫存現金帳，每日由主管於查點現金時一併查點"],"a":3,"x":"系統印錄於<b>庫存現金帳</b>，每日由<b>主管查點現金時一併查點</b>。","ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第三節 存單之保管","t":"四、本存單入庫、使用、作廢及庫存情形將由系統印錄於庫存現金帳，<mark>每日應由主管於查點現金時一併查點</mark>。"}},{"id":"S8-19","m":8,"q":"保管分行擬銷毀空白可轉讓定期存單時，至少應留存幾年之安全庫存量？","o":["1 年","2 年","3 年","5 年"],"a":2,"x":"保管分行及其他分行應<b>至少留存 3 年</b>之安全庫存量；總行營業部不得辦理銷毀。","ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第十節 其他應注意事項","t":"桃園、新竹、台中、嘉義、台南及高雄分行等保管分行及其他分行<mark>應至少留存3年之安全庫存量</mark>"}},{"id":"S8-20","m":8,"q":"空白可轉讓定期存單之銷毀，應於何人會同監督下由櫃員主任自行銷毀？","o":["稽核人員會同主管及會計","經理單獨","總務","區域中心"],"a":0,"x":"俟稽核業務檢查時執行 20H0，於<b>稽核人員會同主管及會計</b>監督下，由櫃員主任自行銷毀。","ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第十節 其他應注意事項","t":"並於<mark>稽核人員會同主管及會計監督下，由櫃員主任自行銷毀</mark>。"}},{"id":"S8-21","m":8,"q":"空白票據之預領保管，總務應執行何交易將票據出庫？","o":["30H0 交易類別 3 或 4","9330","20H0","1092-1"],"a":0,"x":"總務應依領用數量及起訖號碼執行「總務空白票據維護交易」<b>30H0</b>（類別 3 或 4）。","ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十六節 空白票據之保管及核發","t":"總務應按領用數量、票據起訖號碼<mark>執行「總務空白票據維護交易」（交易代號：30H0、交易類別「3：票據出庫（櫃員）或4：票據出庫（副主管）」）</mark>"}},{"id":"S8-22","m":8,"q":"會計憑證上之「主管人員」，同一筆交易之所有借貸方傳票應如何蓋章？","o":["各傳票由不同主管蓋章","應由同一人蓋章","由會計蓋章","免蓋章"],"a":1,"x":"主管人員係核准該筆交易之主管或經授權檢核專員，<b>同一筆交易所有借貸方傳票「主管」處應由同一人蓋章</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(四)主管人員：係指核准辦理該筆交易之主管人員或經授權之檢核專員，<mark>同一筆交易之所有借貸方傳票「主管」處應由同一人蓋章</mark>。"}},{"id":"S8-23","m":8,"q":"臨時性交易中，辦理新臺幣多少以上之跨境匯款時，應確認客戶身分？","o":["50 萬元","3 萬元","1 萬元","5 萬元"],"a":1,"x":"臨時性交易確認時機：達一定金額以上交易；<b>新臺幣三萬元（含等值外幣）以上之跨境匯款</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制","t":"(２)<mark>辦理新臺幣三萬元（含等值外幣）以上之跨境匯款時</mark>。"}},{"id":"S8-24","m":8,"q":"存款帳戶以臨時存欠項目辦理現金收付之轉帳交易，金額達新臺幣 50 萬元時，「借方帳號」或「貸方帳號」欄應如何輸入？","o":["輸入櫃員代號","輸入臨時存欠帳號","應確實鍵入存戶之帳號，並判斷交易種類辦理 A190","免輸入"],"a":2,"x":"應確實鍵入<b>存戶之帳號</b>，達 50 萬元者應判斷實際交易種類辦理 A190 建檔。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"<mark>「借方帳號」或「貸方帳號」欄應確實鍵入存戶之帳號</mark>，若金額達新臺幣五十萬元（含）以上時，應依本節之規定辦理有關作業"}},{"id":"S9-1","m":9,"q":"傳票最遲應於記帳日後多久內完成裝訂？","o":["3 個營業日","5 個營業日","7 個營業日","10 個營業日"],"a":2,"x":"最遲 7 個營業日內完成裝訂並辦理入庫登記；缺漏亦應於 7 個營業日內補正。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(二)<mark>傳票最遲應於記帳日後七個營業日內完成裝訂</mark>，國內分行至「傳票帳簿表報保管暨銷燬管理系統」辦理傳票冊數入庫登記，其餘單位則登記於「傳票目錄簿」（會305），並裝入有鎖鑰之箱或庫內，由會計人員負責保管，保管期限至少十五年，如因事實需要，得酌予延長。"}},{"id":"S9-2","m":9,"q":"指派傳票覆核人員覆核同一櫃員之期間最長不得逾多久？","o":["1 個月","3 個月","6 個月","1 年"],"a":1,"x":"最長不得逾三個月；登記簿由自行查核主管保管並保存五年。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"<mark>指派覆核人員覆核同一櫃員期間最長不得逾三個月</mark>，登記簿由自行查核主管自行保管並列入移交，保存五年。"}},{"id":"S9-3","m":9,"q":"櫃員制下臨櫃傳票之排列，下列何者正確？","o":["單式傳票排列於複式轉帳傳票前","複式轉帳傳票排列於單式傳票前","外幣傳票置於新臺幣傳票之前","依交易時間排列"],"a":1,"x":"複式轉帳傳票排列於單式傳票前；新臺幣傳票置於外幣傳票之前。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"排列時，<mark>複式轉帳傳票排列於單式傳票前</mark>，複式轉帳傳票依傳票類別分類彙整，免排序，單式傳票依活存、行存、支存、活儲、放款、定儲存、代理聯行收付（NET）、匯出匯款申請書及調整單、聯行往來、會計明細分類帳(按會計項目別)及其他等順序排列，如有二個以上會計項子目時，則依第一個會計項子目排列，並核算複式轉帳、轉收、現收、轉支及現支傳票總額與「櫃員傳票彙總查詢單」相符，如不符得以「櫃員帳務查詢交易－櫃員交易明細查詢」（交易代號：1092－5、6"}},{"id":"S9-4","m":9,"q":"虛擬櫃員之日終結帳應如何辦理？","o":["由會計人員自行結帳","指派結帳人員辦理，並登記於工作派令簿","由系統自動結帳免指派","由櫃員主任結帳"],"a":1,"x":"一般櫃員由本人結帳；虛擬櫃員應指派結帳人員並登記於工作派令簿。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"四、虛擬櫃員結帳之指派：日終結帳時一般櫃員之結帳由本人辦理，<mark>虛擬櫃員之結帳則應指派結帳人員辦理，並登記於工作派令簿</mark>。"}},{"id":"S9-5","m":9,"q":"櫃員結帳時現金短缺，應如何記帳？","o":["（貸）其他應收款－現金短缺專戶","（借）其他應收款－其他應收款諸戶－現金短缺專戶","（借）其他應付款－現金剩餘專戶","（借）營業外費用"],"a":1,"x":"短缺借記現金短缺專戶；剩餘貸記其他應付款－現金剩餘專戶。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"如無法軋平原因為現金短缺或剩餘時，應就短缺部分，<mark>（借）其他應收款－其他應收款諸戶－現金短缺專戶</mark>，剩餘部分（貸）其他應付款－其他應付款諸戶（一）－現金剩餘專戶。"}},{"id":"S9-6","m":9,"q":"帳表內之劃線如遇誤劃時，應如何處理？","o":["以修正液塗銷","於線之兩端用紅筆作「×」記號註銷，由原經辦蓋章並由會計人員加章證明","重新製作帳表","以鉛筆註記"],"a":1,"x":"誤劃以紅筆打「×」註銷，原經辦員蓋章並由會計人員加章證明。","ci":{"b":"會計篇","c":"第一章 總則","s":"第二節 會計事務之內容","t":"(四)帳表內之劃線如遇誤劃時，<mark>應於線之兩端用紅筆作「×」記號註銷之</mark>，由原經辦員於記號處蓋章，並由會計人員加章證明。"}},{"id":"S9-7","m":9,"q":"本行上期結算日為 6 月 30 日，如遇例假日應如何處理？","o":["順延至次一營業日","提前至前一營業日","仍以該日為結算日","由會計處另訂"],"a":2,"x":"結算日如遇例假日，仍以該日為結算日。","ci":{"b":"會計篇","c":"第四章 月算、結算及決算","s":"第二節 結算","t":"<mark>結算日如遇例假日，仍以該日為結算日</mark>。"}},{"id":"S9-8","m":9,"q":"應付款項逾請求權有效期限多久而無請求付款者，得依規整理轉列收入？","o":["5 年","10 年","15 年","20 年"],"a":2,"x":"逾 15 年且無法通知存戶取回者，登記「整理訖債務登記簿」後轉入其他什項收入。","ci":{"b":"會計篇","c":"第一章 總則","s":"第三節 會計項目及記帳手續","t":"3.清理：(1)<mark>應付款項逾請求權有效期限(十五年)而無請求付款者</mark>，倘確實無法通知存戶取回，下列各項得逐筆登記於「整理訖債務登記簿」後，逕行轉入「其他什項收入」項目「過期帳收入(一)」（54534）子目整理外，其他項目得申請總行核准後轉列收入。"}},{"id":"S9-9","m":9,"q":"傳票檢查內容有缺漏而無法於當日解決者，應於記帳日起多久內補正？","o":["10 個營業日","5 個營業日","3 個營業日","7 個營業日"],"a":3,"x":"登記於「傳票檢查備查簿」並應於記帳日起 <b>7 個營業日</b>內補正，未補正應敘明理由陳核經理。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"其餘均應登記於「傳票檢查備查簿」並<mark>應於記帳日起七個營業日內補正</mark>，如未補正應敘明理由陳核經理知悉並妥善處理。"}},{"id":"S9-10","m":9,"q":"傳票缺漏如未能於期限內補正，應如何處理？","o":["由會計補蓋章","作廢傳票","敘明理由陳核經理知悉並妥善處理","逕送總行"],"a":2,"x":"如未補正應<b>敘明理由陳核經理知悉</b>並妥善處理。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"並應於記帳日起七個營業日內補正，<mark>如未補正應敘明理由陳核經理知悉並妥善處理</mark>。"}},{"id":"S9-11","m":9,"q":"已登記於「受理客戶以傳真方式辦理各項業務登記簿」之傳真傳票缺漏，是否須另登記「傳票檢查備查簿」？","o":["免另行登記","須登記兩次","須另行登記","須陳報總行"],"a":0,"x":"傳真傳票已登記於傳真業務登記簿者，<b>免另行登記</b>於傳票檢查備查簿。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"除傳真傳票已登記於「受理客戶以傳真方式辦理各項業務登記簿」者，<mark>免另行登記於「傳票檢查備查簿」外</mark>，其餘均應登記於「傳票檢查備查簿」"}},{"id":"S9-12","m":9,"q":"傳票及帳表記載日期如需簡寫，九十年一月十五日應如何填寫？","o":["90.15.1","15/1/90","90/1/15","1/15/90"],"a":2,"x":"應按<b>年、月、日</b>順序填寫，例如 90/1/15。","ci":{"b":"會計篇","c":"第一章 總則","s":"第二節 會計事務之內容","t":"如需簡寫時，應按年、月、日順序填寫（<mark>例如九十年一月十五日為90/1/15</mark>）。"}},{"id":"S9-13","m":9,"q":"傳票及帳表製記完畢後，應如何處理？","o":["應換人覆核","由原經辦自行覆核","免覆核","月底一併覆核"],"a":0,"x":"傳票及帳表製記完畢，<b>應換人覆核</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第二節 會計事務之內容","t":"<mark>(六)傳票及帳表製記完畢，應換人覆核</mark>。"}},{"id":"S9-14","m":9,"q":"帳表內誤劃之劃線經紅筆「×」註銷後，應由何人蓋章？","o":["主管蓋章即可","僅會計人員蓋章","原經辦員於記號處蓋章，並由會計人員加章證明","僅經理蓋章"],"a":2,"x":"由<b>原經辦員</b>於記號處蓋章，並由<b>會計人員加章證明</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第二節 會計事務之內容","t":"應於線之兩端用紅筆作「×」記號註銷之，<mark>由原經辦員於記號處蓋章，並由會計人員加章證明</mark>。"}},{"id":"S9-15","m":9,"q":"傳票裝訂後由會計人員保管，其保管期限至少為何？","o":["10 年","永久","5 年","15 年"],"a":3,"x":"傳票裝入有鎖鑰之箱或庫內，由會計人員保管，<b>保管期限至少十五年</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"由會計人員負責保管，<mark>保管期限至少十五年</mark>，如因事實需要，得酌予延長。"}},{"id":"S9-16","m":9,"q":"國內分行完成傳票裝訂後，應至何系統辦理傳票冊數入庫登記？","o":["OnDemand 報表系統","會計總帳系統","新一代金融端末系統","傳票帳簿表報保管暨銷燬管理系統"],"a":3,"x":"國內分行至「<b>傳票帳簿表報保管暨銷燬管理系統</b>」辦理冊數入庫登記，其餘單位登記傳票目錄簿（會305）。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"<mark>國內分行至「傳票帳簿表報保管暨銷燬管理系統」辦理傳票冊數入庫登記</mark>，其餘單位則登記於「傳票目錄簿」（會305）"}},{"id":"S9-17","m":9,"q":"各部門經管之帳簿及報表，應於裝訂或更換後多久內送交會計人員？","o":["1 個月","2 個月","3 個月","7 個營業日"],"a":1,"x":"帳簿及報表應依規裝訂或更換後 <b>2 個月</b>內送交會計人員。","ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":" ","t":"另各部門經管之帳簿及報表<mark>應依規裝訂或更換後二個月內送交會計人員</mark>"}},{"id":"S9-18","m":9,"q":"依會計篇規定，商業之會計憑證依其性質分為哪兩類？","o":["內部憑證及外部憑證","現金憑證及轉帳憑證","原始憑證及記帳憑證","收入憑證及支出憑證"],"a":2,"x":"會計憑證依性質分為<b>原始憑證</b>及<b>記帳憑證</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"<mark>商業之會計憑證依其性質分為原始憑證及記帳憑證</mark>。原始憑證：證明會計事項之經過，而為造具記帳憑證所根據之憑證。"}},{"id":"S9-19","m":9,"q":"「證明會計事項之經過，而為造具記帳憑證所根據之憑證」係指？","o":["記帳憑證","原始憑證","帳簿","傳票"],"a":1,"x":"此為<b>原始憑證</b>之定義。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"<mark>原始憑證：證明會計事項之經過，而為造具記帳憑證所根據之憑證</mark>。"}},{"id":"S9-20","m":9,"q":"傳票認證主要核對之內容為何？","o":["傳票認證欄印錄內容是否與傳票記載事項相符","客戶簽章","現金張數","印鑑"],"a":0,"x":"傳票認證主要核對<b>認證欄印錄內容與傳票記載事項是否相符</b>，並由認證人員蓋章確認。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(一)<mark>主要在核對傳票認證欄印錄內容是否與傳票記載事項相符</mark>，傳票經辦理電腦登錄記帳後，應由認證人員負責辦理認證並於認證欄蓋章確認"}},{"id":"S9-21","m":9,"q":"下列何種傳票得免於認證欄蓋章？","o":["匯款申請書","人工製票後記帳之傳票","所有轉帳傳票","製票同時辦理記帳或執行記帳交易時連動帶出之傳票"],"a":3,"x":"製票與記帳同時產生者不致內容不符，<b>得免於認證欄蓋章</b>。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"惟部分傳票係製票同時辦理記帳，或於執行記帳交易時連動帶出，因製票及記帳係同時產生，不致發生製票、記帳內容不符之情形，<mark>是類傳票得免於認證欄蓋章</mark>。"}},{"id":"S9-22","m":9,"q":"另訂「認證欄」蓋章規則者，匯款申請書應於何處蓋章？","o":["主管(覆核)欄","製票序號前首","存單字號前首","背面"],"a":0,"x":"匯款申請書：於<b>主管(覆核)欄</b>蓋章；存單於字號前首；預製貸放傳票於製票序號前首。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(2)存單存款：於存單字號前首蓋章。<mark>(3)匯款申請書：於主管(覆核)欄蓋章</mark>。"}},{"id":"S9-23","m":9,"q":"以預製之貸放傳票辦理記帳時，認證章應蓋於何處？","o":["存單字號前首","傳票背面","主管欄","製票序號前首"],"a":3,"x":"預製貸放傳票：於<b>製票序號前首</b>蓋章。","ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"<mark>(1)以預製之貸放傳票辦理記帳：於製票序號前首蓋章</mark>。(2)存單存款：於存單字號前首蓋章。"}},{"id":"S9-24","m":9,"q":"櫃員制結帳之作業方式，下列何者正確？","o":["由會計人員統一結帳","由區域中心結帳","以櫃員為單位結帳，日終分行僅辦理臨櫃帳務之結帳，夜間由資訊處彙總辦理全分行結帳","分行辦理全分行所有帳務結帳"],"a":2,"x":"以<b>櫃員為單位</b>結帳，分行日終僅辦<b>臨櫃帳務</b>，夜間<b>資訊處</b>彙總臨櫃、中心及自動化帳務辦全分行結帳。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"<mark>以櫃員為單位辦理結帳，日終結帳時分行僅辦理臨櫃帳務之結帳，夜間資訊處彙總臨櫃、中心及自動化帳務辦理全分行之結帳</mark>"}},{"id":"S9-25","m":9,"q":"櫃員結帳後之覆核人員應由何人指派？","o":["櫃員主任","會計人員","自行查核主管","經理"],"a":2,"x":"覆核人員應由<b>自行查核主管</b>指派，並登記於「覆核人員指派登記簿」。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"(一)各櫃員結帳後應由覆核人員辦理覆核，<mark>覆核人員應由自行查核主管指派</mark>，並登記於「覆核人員指派登記簿」。"}},{"id":"S9-26","m":9,"q":"「覆核人員指派登記簿」之保管及保存年限為何？","o":["自行查核主管自行保管並列入移交，保存 5 年","總務保管，保存 15 年","經理保管，保存 10 年","會計人員保管，保存 3 年"],"a":0,"x":"登記簿由<b>自行查核主管</b>自行保管並列入移交，<b>保存五年</b>。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"<mark>登記簿由自行查核主管自行保管並列入移交，保存五年</mark>。"}},{"id":"S9-27","m":9,"q":"覆核人員休假時，傳票之覆核工作應由何人辦理？","o":["該覆核人員之職務代理人","櫃員本人","自行查核主管","會計人員"],"a":0,"x":"覆核人員休假時，由<b>該覆核人員之職務代理人</b>負責辦理。","ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":" ","t":"<mark>遇覆核人員休假時，傳票之覆核工作應由該覆核人員之職務代理人負責辦理</mark>。"}},{"id":"S9-28","m":9,"q":"一般櫃員、虛擬櫃員及臨時指派開櫃之櫃員完成結帳後，下列何者正確？","o":["所有櫃員均應再換人覆核","僅臨時開櫃者須覆核","僅虛擬櫃員須覆核","均免覆核"],"a":0,"x":"<b>所有櫃員</b>完成結帳工作後，應再換人覆核。","ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":" ","t":"<mark>所有櫃員包括一般櫃員、虛擬櫃員和臨時指派開櫃之櫃員完成結帳工作後，應再換人覆核</mark>"}},{"id":"S9-29","m":9,"q":"櫃員主任之結帳，盤點庫存現金與現金帳相符後應執行之交易代號為何？","o":["1099-1","1092-1","K001-1","7020"],"a":2,"x":"執行「櫃員主任結帳交易－結帳設定暨列印庫存帳/表」<b>K001-1</b>。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"3.盤點庫存現金與現金帳餘額相符後，<mark>執行「櫃員主任結帳交易－結帳設定暨列印庫存帳/表」（交易代號：K001－1）</mark>"}},{"id":"S9-30","m":9,"q":"櫃員主任辦理結帳前，應先確認下列何事項？","o":["所有客戶離櫃","會計已裝訂傳票","總行已結帳","自動櫃員機經辦已完成裝卸鈔及結帳"],"a":3,"x":"櫃員主任結帳前應確認<b>自動櫃員機經辦已完成裝卸鈔及結帳</b>。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"<mark>2.確認自動櫃員機經辦已完成裝卸鈔及結帳</mark>。3.盤點庫存現金與現金帳餘額相符後，執行「櫃員主任結帳交易"}},{"id":"S9-31","m":9,"q":"櫃員執行轉帳結帳設定（1099-2）後，尚有資料需登入或更改時，應執行何交易？","o":["9670","K001-1","1092-5","1099-3、4 結帳解除"],"a":3,"x":"應執行「櫃員帳務結帳解除交易－結帳解除」<b>1099-3、4</b>，更改後再執行結帳設定。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"倘尚有資料需登入或更改時，<mark>應執行「櫃員帳務結帳解除交易－結帳解除」(交易代號：1099－3、4)</mark>"}},{"id":"S9-32","m":9,"q":"結帳後重開所作廢之「櫃員結帳彙總查詢單（已結帳）」應如何處理？","o":["黏貼於「主管授權及沖正更正交易日報表(ZZ38B)」背面備查","交客戶","送總行","銷毀"],"a":0,"x":"作廢之查詢單應<b>黏貼於 ZZ38B 背面</b>備查。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"<mark>作廢之「櫃員結帳彙總查詢單（已結帳）」，應黏貼於「主管授權及沖正更正交易日報表(ZZ38B)」背面備查</mark>。"}},{"id":"S9-33","m":9,"q":"櫃員結帳時發生現金剩餘，應如何記帳？","o":["（借）其他應收款－現金短缺專戶","（借）庫存現金","（貸）營業外收入","（貸）其他應付款－其他應付款諸戶（一）－現金剩餘專戶"],"a":3,"x":"剩餘部分（貸）<b>其他應付款－現金剩餘專戶</b>；短缺（借）其他應收款－現金短缺專戶。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"<mark>剩餘部分（貸）其他應付款－其他應付款諸戶（一）－現金剩餘專戶</mark>。"}},{"id":"S9-34","m":9,"q":"臨櫃傳票彙整時，「櫃員結帳彙總查詢單（已結帳）」應置於何處交會計人員？","o":["傳票之前","傳票之後","另行裝訂","免交"],"a":0,"x":"將「櫃員結帳彙總查詢單（已結帳）」<b>置於傳票之前</b>交會計人員彙整。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"<mark>將「櫃員結帳彙總查詢單（已結帳）」置於傳票之前交會計人員彙整</mark>，會計人員應再依「分行結帳資料表」之櫃員順序排列。"}},{"id":"S9-35","m":9,"q":"會計人員彙整各櫃員傳票時，應依何者之櫃員順序排列？","o":["分行結帳資料表","員工編號","結帳時間","櫃員代號大小"],"a":0,"x":"會計人員應再依「<b>分行結帳資料表</b>」之櫃員順序排列。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"<mark>會計人員應再依「分行結帳資料表」之櫃員順序排列</mark>。"}},{"id":"S9-36","m":9,"q":"複式轉帳傳票之彙整方式為何？","o":["依帳號排序","依傳票類別分類彙整，免排序","依時間排序","依金額大小排序"],"a":1,"x":"複式轉帳傳票<b>依傳票類別分類彙整，免排序</b>；單式傳票依活存、行存、支存…順序排列。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"複式轉帳傳票排列於單式傳票前，<mark>複式轉帳傳票依傳票類別分類彙整，免排序</mark>"}},{"id":"S9-37","m":9,"q":"國內分行整理傳票時，下列何種櫃員之傳票應自 1 號起編號？","o":["外匯櫃員","新臺幣一般櫃員","新臺幣虛擬櫃員（聯往櫃員）","票據櫃員"],"a":2,"x":"一般、票據、後送、櫃員主任及外匯櫃員傳票免編號；<b>聯往櫃員</b>傳票自 1 號起編。","ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"新臺幣一般櫃員、新臺幣虛擬櫃員(票據櫃員、後送櫃員、櫃員主任)及外匯櫃員(含虛擬櫃員)傳票免編號，<mark>新臺幣虛擬櫃員(聯往櫃員)傳票自1號起編</mark>"}},{"id":"S9-38","m":9,"q":"會計人員得兼辦之結帳工作，下列何者「不」得兼辦？","o":["櫃員主任之結帳","票據櫃員結帳","聯往櫃員結帳","後送櫃員結帳"],"a":0,"x":"會計人員得辦票據、聯往、後送櫃員結帳，<b>不得兼辦「櫃員主任」之結帳</b>。","ci":{"b":"會計篇","c":"第五章 會計事務之管理","s":"第一節 會計人員之派任","t":"如：會計人員得執行聯行往來「日終結帳」(交易代號：7020)及「結帳後重開」(交易代號：9670)等交易，<mark>惟不得兼辦「櫃員主任」之結帳工作</mark>。"}},{"id":"S9-39","m":9,"q":"會計人員兼辦其他事務之原則，下列何者正確？","o":["在不兼辦出納事務及營業性帳務原則下，經理於內控無虞下得派任兼辦","得兼辦出納事務","由總務決定","不得兼辦任何事務"],"a":0,"x":"在<b>不兼辦出納事務及營業性帳務</b>原則下，經理於內控無虞時得派兼辦；無法判斷得函請本處認定。","ci":{"b":"會計篇","c":"第五章 會計事務之管理","s":"第一節 會計人員之派任","t":"(十四)<mark>在不兼辦出納事務及營業性帳務原則下，授權分行經理在內控無虞下，得派任會計人員兼辦其他事務</mark>"}},{"id":"S9-40","m":9,"q":"主管抽查屬員經辦事務時，傳票與「櫃員結帳彙總查詢單（已結帳）」相符應如何辦理？","o":["每季抽查一次","列入必要抽查項目，並於每月「查核日期」抽核所屬櫃員當日傳票","由會計抽查","僅抽查一般櫃員"],"a":1,"x":"應列為<b>必要抽查項目</b>，並於每月「查核日期」抽核所屬櫃員當日傳票（含虛擬、收息、外匯櫃員）。","ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":" ","t":"主管抽查屬員經辦事務時，<mark>應將傳票與「櫃員結帳彙總查詢單（已結帳）」(交易代號：1099-2轉帳結帳設定)相符列入必要抽查項目，且應於每月「查核日期」抽核所屬櫃員當日傳票</mark>。"}},{"id":"S9-41","m":9,"q":"為確保月算損益正確，資訊處每月於哪兩日產生「應補收息明細表」？","o":["25 日及 28 日","20 日及 25 日","15 日及月底","10 日及 20 日"],"a":0,"x":"資訊處於每月 <b>25 日及 28 日</b>產生「應補收息明細表」（LP-L07A），錯誤務必於月底前調整。","ci":{"b":"會計篇","c":"第四章 月算、結算及決算","s":"第一節 月算","t":"2.為確保月算損益正確無誤，<mark>資訊處於每月25日及28日產生「應補收息明細表」</mark>(報表代號：LP－L07A)"}},{"id":"S9-42","m":9,"q":"「應補收息明細表」如有錯誤，應於何時前調整完畢？","o":["次月 10 日","年底","月底日前","結算日"],"a":2,"x":"若有錯誤，務必於<b>月底日前</b>調整訖，以免影響當月放款利息提存。","ci":{"b":"會計篇","c":"第四章 月算、結算及決算","s":"第一節 月算","t":"若有錯誤，<mark>務必於月底日前調整訖</mark>，以免影響當月放款之利息提存。"}},{"id":"S9-43","m":9,"q":"應付款項逾請求權期限，下列何者「非」屬得逕行登記「整理訖債務登記簿」轉入過期帳收入之項目？","o":["待查剩餘現金專戶","應付解匯款","一般活期存款餘額","警示帳戶剩餘款"],"a":2,"x":"列舉項目：應付解匯款、應付待還匯款、ATM 未付款、待查剩餘現金、拒往戶存款專戶、本行支票專戶、<b>警示帳戶剩餘款</b>等；一般活存不在其列。","ci":{"b":"會計篇","c":"第一章 總則","s":"第三節 會計項目及記帳手續","t":"A.應付解匯款。B.應付待還匯款。C.自動付(存)款機未付款項。<mark>D.待查剩餘現金專戶</mark>。E.應付支票存款拒絕往來戶存款專戶。F.誤收拒絕往來戶存款。G.備付限額支票存款結清戶餘額專戶。H.簽發本行支票專戶(屆滿一年以上轉入)。<mark>I.警示帳戶剩餘款</mark>。"}},{"id":"S10-1","m":10,"q":"營業單位自行採購金額新臺幣多少以下之案件，授權由經理核定後辦理？","o":["5 千元","1 萬元","3 萬元","5 萬元"],"a":1,"x":"1 萬元（含）以下授權經理核定；1 萬元以上或資本支出須申請總行核准。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"四、營業單位自行採購案件：(一)<mark>金額新臺幣一萬(含)元以下採購案件，授權由經理核定後辦理</mark>：屬日常零星購置案件，總務人員以「費用支出及資本支出申請單」申請費用預算，經分行經理核准後，得逕行開支，惟應注意其必要性、合理性及會計項子目使用正確性。"}},{"id":"S10-2","m":10,"q":"採購金額達新臺幣多少以上，應檢附 2 家（含）以上估價單影本向業管單位申請核准？","o":["1 萬元","3 萬元","5 萬元","10 萬元"],"a":2,"x":"5 萬元以上應檢附 2 家以上估價單。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(四)<mark>採購金額新臺幣五萬元以上者，應檢附2家(含)以上估價單影本</mark>連同申請單，向業管單位申請核准後辦理採購。"}},{"id":"S10-3","m":10,"q":"購置之財物使用年限、單價符合何條件得以「什項購置」子目開支並設備查簿控管？","o":["1 年以上、1 萬元以下","2 年以上、2 萬元以下","3 年以上、5 萬元以下","5 年以上、10 萬元以下"],"a":1,"x":"使用年限 2 年以上且個體單價 2 萬元以下。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(三)凡購置之財物其<mark>使用年限在二年以上，且個體單價在新臺幣二萬元以下</mark>，經核准以「什項購置」會計子目開支者，應設置「什項購置備查簿」、「什項購置彙計表」以利控管。"}},{"id":"S10-4","m":10,"q":"費用預算核配不足時，應如何處理？","o":["流用其他費用預算","流用資本預算","辦理追加或申請，不得流用其他費用預算","遞延至下期"],"a":2,"x":"不得流用其他費用預算。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(二)<mark>費用預算核配不足時，應辦理追加或申請，不得流用其他費用預算</mark>。"}},{"id":"S10-5","m":10,"q":"上期核准之資本支出預算未及使用，應如何處理？","o":["可遞延至下期使用","須重新申請","直接取消","可遞延至次年度"],"a":0,"x":"上期資本支出可遞延至下期；下期資本支出須重新申請，不得遞延至下年度。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(五)上期核准之預算未及使用：<mark>資本支出─可遞延至下期使用</mark>。"}},{"id":"S10-6","m":10,"q":"業務人員提供私人車輛供公務使用，其燃料費補貼上限為每人每月多少？","o":["500 元","800 元","1,000 元","1,500 元"],"a":2,"x":"私車公用燃料費每人每月 1,000 元；私人手機電話費 500 元。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"C.各單位業務人員提供私人車輛、手機供公務使用，營業單位得參酌營運狀況由經理核定，總部單位應先簽請核准後辦理，其補貼上限如下：a.<mark>私車公用燃料費：每人每月新臺幣1,000元</mark>。"}},{"id":"S10-7","m":10,"q":"營業單位各項開支之預算執行，下列何者正確？","o":["由經理自由決定","得先行開支再申請預算","得流用其他費用預算","應在核配或核准之預算額度內開支"],"a":3,"x":"預算執行應<b>在核配或核准之預算額度內開支</b>；核配不足應追加或申請，不得流用。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"二、預算執行應注意事項：<mark>(一)應在核配或核准之預算額度內開支</mark>。"}},{"id":"S10-8","m":10,"q":"上期核准之「費用支出」預算未及使用，應如何處理？","o":["逕行提存應付費用","可遞延至下期使用","可申請修改年度期別或重新申請預算","自動失效不得再申請"],"a":2,"x":"上期費用支出未及使用：<b>可申請修改年度期別或重新申請預算</b>（資本支出則可遞延至下期）。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(五)上期核准之預算未及使用：資本支出─可遞延至下期使用。<mark>費用支出─可申請修改年度期別或重新申請預算</mark>。"}},{"id":"S10-9","m":10,"q":"下期核准之「資本支出」預算未及使用，應如何處理？","o":["可修改期別","須重新申請，不得遞延至下年度使用","可遞延至下年度使用","可提存應付費用"],"a":1,"x":"下期資本支出未及使用：<b>須重新申請，不得遞延至下年度</b>。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(六)下期核准之預算未及使用：<mark>資本支出─須重新申請，不得遞延至下年度使用</mark>。"}},{"id":"S10-10","m":10,"q":"下期核准之費用支出預算未及使用，下列何者「不」可行？","o":["先行提存於「應付費用」以供以後使用","申請修改年度期別","依規辦理","重新申請預算"],"a":0,"x":"費用支出須重新申請或修改期別，<b>不得先行提存於「應付費用」</b>以供以後使用。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"費用支出─須重新申請預算或申請修改年度期別，<mark>惟不得先行提存於「應付費用」以供以後使用</mark>。"}},{"id":"S10-11","m":10,"q":"費用超支原因如屬費用預算歸屬期別錯誤，應如何處理？","o":["於系統點選「修正/刪除已核准申請單」申請修改年度期別","更正帳務","重新申請預算","申請追加預算"],"a":0,"x":"屬期別錯誤者，於系統點選「<b>修正/刪除已核准申請單</b>」表單，申請修改年度期別。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第四節 費用控管","t":"致上期費用超支時，<mark>應於系統上點選「修正/刪除已核准申請單」表單，申請修改該筆費用預算之年度期別</mark>。"}},{"id":"S10-12","m":10,"q":"營業單位金額新臺幣一萬元以下之日常零星購置，經分行經理核准後得逕行開支，但應注意下列何者？","o":["須檢附 2 家估價單","須簽訂契約","必要性、合理性及會計項子目使用正確性","須總行核准"],"a":2,"x":"經理核准後得逕行開支，惟應注意<b>必要性、合理性及會計項子目使用正確性</b>。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"經分行經理核准後，得逕行開支，<mark>惟應注意其必要性、合理性及會計項子目使用正確性</mark>。"}},{"id":"S10-13","m":10,"q":"營業單位自行採購金額新臺幣一萬元以上或資本支出之案件，應如何辦理？","o":["應檢附相關估價單據或其影本申請總行核准後辦理","免估價","由總務自行決定","經理核定即可"],"a":0,"x":"一萬元以上或資本支出：應<b>檢附估價單據或影本申請總行核准</b>後辦理採購。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(二)<mark>金額新臺幣一萬元以上或資本支出採購案件，應檢附相關估價單據或其影本申請總行核准後辦理採購</mark>"}},{"id":"S10-14","m":10,"q":"營業廳櫃檯改修、粉刷牆壁、屋頂漏水修繕等，屬何類採購？","o":["契約性費用","什項購置","營繕工程","一般性費用"],"a":2,"x":"此類屬<b>營繕工程</b>，須檢附估價單以「費用支出及資本支出申請單」向業管單位逐案申請。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"1.<mark>營繕工程：凡營業廳裝修如櫃檯改修、粉刷牆壁、更換或修補地磚、門窗修繕、水電或網路線路鋪設及屋頂漏水、外牆損壞修繕‧‧‧等屬之</mark>"}},{"id":"S10-15","m":10,"q":"經核准以「什項購置」會計子目開支者，應設置哪些簿表控管？","o":["財產目錄","費用明細帳","「什項購置備查簿」及「什項購置彙計表」","固定資產卡"],"a":2,"x":"應設置「<b>什項購置備查簿</b>」、「<b>什項購置彙計表</b>」以利控管。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"經核准以「什項購置」會計子目開支者，<mark>應設置「什項購置備查簿」、「什項購置彙計表」以利控管</mark>。"}},{"id":"S10-16","m":10,"q":"未訂立契約之交易，應依何者辦理驗收及付款？","o":["經理指示","估價單內約定購置標的之規格、條款","口頭約定","市價"],"a":1,"x":"未訂契約之交易，依<b>估價單內約定之規格、條款</b>辦理驗收及付款。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第三節 開支審核","t":"二、<mark>未訂立契約之交易，應依估價單內約定購置標的之規格、條款辦理驗收及付款</mark>。"}},{"id":"S10-17","m":10,"q":"私車公用補貼之燃料費單據審核，下列何者正確？","o":["免附單據","單據可為他人名義","私車應為受補貼人所有，單據「車號」應與申請書一致","私車可為親友所有"],"a":2,"x":"私車應為<b>受補貼人所有</b>，且單據上「<b>車號</b>」應與「員工自有車輛供公務使用申請書」一致。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第三節 開支審核","t":"(四)私車公用補貼之燃料費單據審核：<mark>私車應為受補貼人所有，且單據上「車號」應與「員工自有車輛供公務使用申請書」一致</mark>。"}},{"id":"S10-18","m":10,"q":"私人手機供公務使用之單據審核，單據上哪些項目應與申請書一致？","o":["繳費方式","金額及日期","電信公司","「手機號碼」及「抬頭人」"],"a":3,"x":"手機應為受補貼人所有，單據上「<b>手機號碼</b>」及「<b>抬頭人</b>」應與申請書一致。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第三節 開支審核","t":"手機應為受補貼人所有，且<mark>單據上「手機號碼」及「抬頭人」應與「員工自有手機供公務使用申請書」一致</mark>。"}},{"id":"S10-19","m":10,"q":"營業單位業務人員提供私人車輛、手機供公務使用，應由何人核定？","o":["總行人資處","會計人員","區域中心","營業單位得參酌營運狀況由經理核定"],"a":3,"x":"營業單位得<b>參酌營運狀況由經理核定</b>；總部單位應先簽請核准。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"C.各單位業務人員提供私人車輛、手機供公務使用，<mark>營業單位得參酌營運狀況由經理核定</mark>，總部單位應先簽請核准後辦理"}},{"id":"S10-20","m":10,"q":"委聘律師、會計師及專業顧問公司之諮詢服務費用申請，應以何表單向本處申請？","o":["總部費用支出申請單","費用支出及資本支出申請單","費用追加預算申請單（須檢附相關簽准文件）","什項購置申請單"],"a":2,"x":"委聘律師、會計師等須檢附簽准文件，以「<b>費用追加預算申請單</b>」向本處申請。","ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"B.申請費用時，<mark>除委聘律師、會計師及專業顧問公司之諮詢服務等費用須檢附相關簽准文件，於【預算線上簽核系統】以「費用追加預算申請單」向本處申請外</mark>"}},{"id":"S10-21","m":10,"q":"各項修護費、分擔大樓管理費、外包費-護衛駕駛人員等案件核配不足時，應如何申請？","o":["由經理自行核定","逐筆檢附合約或估價單影本等文件並敘明理由，以表單向業管單位申請","免申請","逕行流用其他預算"],"a":1,"x":"核配不足時應<b>逐筆檢附合約或估價單影本</b>並敘明理由，以本表單向業管單位申請。","ci":{"b":"會計篇","c":"附錄六 『電子表單線上簽核作業系統』作業應注意事項","s":"","t":"2.各項修護費、分擔大樓管理費、外包費-護衛駕駛人員及保警及保全費用-常駐警衛人員案件，<mark>核配不足時應逐筆檢附合約或估價單影本等相關文件並敍明理由，以本表單向業管單位申請</mark>。"}},{"id":"S11-1","m":11,"q":"「自動櫃員機跨行提款」及「自動化服務設備跨行轉帳／本行 ATM 跨行存款」之營業單位手續費減免權限分別為何？","o":["10 次；10 次","10 次；20 次","20 次；10 次","15 次；15 次"],"a":0,"x":"兩項皆小於 10 次（含），任一項超過須送營運業務處核准。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十七節 臨櫃手續費、服務費及自動化服務設備手續費之計收與減免 附錄一 自動化服務設備手續費減免作業應注意事項","t":"三、減免方式：(一)「自動櫃員機跨行提款」及「自動化服務設備跨行轉帳/本行ATM跨行存款交易」：<mark>營業單位權限為『「自動櫃員機跨行提款」小於10次（含）</mark>且「自動化服務設備跨行轉帳/本行ATM跨行存款」小於10次（含）』，任一項超過者即須送營運業務處，俟核准後始可辦理。"}},{"id":"S11-2","m":11,"q":"客戶申請網路銀行約定轉入他人帳戶，依風險評估最長可拉長於何時生效？","o":["當日","次一日","次二日","次一營業日"],"a":2,"x":"視客戶性質及風險評估於申辦日後次一日生效，或拉長為次二日生效。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄五 第一商業銀行防杜人頭帳戶應注意事項","t":"(四)客戶申請電話語音銀行及網路銀行約定轉入帳戶者，視客戶性質及風險程度高低，評估於申辦日後次一日生效，或<mark>拉長生效時間為次二日生效</mark>(惟同一統一編號帳戶經評估並無遭詐騙損失之虞者除外)。"}},{"id":"S11-3","m":11,"q":"申請製卡逾多久尚未領取之金融卡，作為註銷金融卡之依據（PB26 報表）？","o":["6 個月","1 年","一年半","2 年"],"a":2,"x":"PB26「申請製卡逾一年半尚未領取卡片明細表」作為註銷依據。","ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"【每月列印】報表代號：報表名稱列印作業說明PB26<mark>申請製卡逾一年半尚未領取卡片明細表</mark>列印時點：月初報表別：月報一、作為註銷金融卡之依據。"}},{"id":"S11-4","m":11,"q":"受理單筆新臺幣 3 萬元以上、50 萬元以下現金匯款，如為代理人辦理，應如何確認身分？","o":["僅需核對代理人身分","須同時核對匯款人與代理人","僅影印匯款人身分證","一律婉拒代理"],"a":0,"x":"如為代理人辦理者，僅需核對代理人身分；代理人為認識之客戶且留有資料者得免出示。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項 附錄二 金融機構辦理國內匯款及無摺存款作業確認客戶身分原則","t":"（二）<mark>如為代理人辦理者，僅需核對代理人身分</mark>。"}},{"id":"S11-5","m":11,"q":"辦理傳真轉帳業務，客戶最晚應於傳真指示交易之日起多久內送交正本？","o":["5 日","5 個營業日","7 日","7 個營業日"],"a":3,"x":"7 個營業日內送交正本（傳真作業規定）。","lo":1},{"id":"S11-6","m":11,"q":"黃金存摺定期投資之敘述，下列何者正確？","o":["扣款日最多指定 8 個","每次最低新臺幣 5,000 元","僅得向原開戶行申請","每次最低新臺幣 3,000 元或美金 200 元"],"a":3,"x":"扣款日每月 1～26 日最多 6 個、可向任一營業單位申請（黃金存摺作業規定）。","lo":1},{"id":"S11-7","m":11,"q":"統一發票載有買受人，下列何者<b>不予給獎</b>？","o":["買受人為個人","買受人為執行業務者","買受人為營業人（公司）","未載明買受人"],"a":2,"x":"買受人為營業人或政府機關不予給獎（代兌統一發票作業規定）。","lo":1},{"id":"S11-8","m":11,"q":"客戶申請電話語音銀行及網路銀行約定轉入帳戶，同一統一編號帳戶經評估無遭詐騙損失之虞者，下列何者正確？","o":["得除外，不受次一日或次二日生效限制","不得申請","須三日後生效","一律次二日生效"],"a":0,"x":"一般視風險評估於次一日或次二日生效，<b>同一統一編號帳戶經評估無遭詐騙之虞者除外</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄五 第一商業銀行防杜人頭帳戶應注意事項","t":"評估於申辦日後次一日生效，或拉長生效時間為次二日生效(<mark>惟同一統一編號帳戶經評估並無遭詐騙損失之虞者除外</mark>)。"}},{"id":"S11-9","m":11,"q":"首次申請「第e金網」服務，需執行何端末交易列印系統管理人員密碼函？","o":["A190","9701","930A","A14Y 代號 1：申請"],"a":3,"x":"首次申請第e金網，執行端末交易 <b>A14Y（1：申請）</b>，列印單層式主管或二層式主管/經辦密碼函。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"2.如為首次申請「第e金網」服務，<mark>需執行端末交易（代號：A14Y，代號：1：申請）</mark>，依申請書內容列印系統管理人員（單層式主管或二層式主管/經辦）密碼函。"}},{"id":"S11-10","m":11,"q":"整合開戶整併申請第e個網服務，下列何者「不」提供新申請？","o":["SSL","線上約定轉入帳號服務","實體 OTP 及憑證","e指通"],"a":2,"x":"整合開戶提供基本查詢、SSL、e指通、同 ID 轉帳免約定、線上約定轉入及非約定轉帳，<b>不提供新申請實體 OTP 及憑證</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"提供申請基本(查詢)功能、SSL、e指通、本行同ID間轉帳免約定服務、線上約定轉入帳號服務及非約定轉帳服務，<mark>惟不提供新申請「實體OTP」及「憑證」</mark>"}},{"id":"S11-11","m":11,"q":"整合開戶當次新開立帳戶設定為轉出帳號時，可約定其對應之轉入帳號上限為幾組？","o":["30 組","5 組","20 組","10 組"],"a":2,"x":"當次新開立帳戶可設定為轉出帳號及約定對應轉入帳號，<b>上限 20 組</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"另當次新開立帳戶(除新台幣定期性存款、外匯定期存款及理財存摺外)可設定為轉出帳號及<mark>約定其對應之轉入帳號(上限20組)</mark>。"}},{"id":"S11-12","m":11,"q":"籌備處開戶，是否提供金融卡、個人網路銀行等自動化服務？","o":["提供","一律不提供","經理核准可提供","僅提供金融卡"],"a":1,"x":"籌備處開戶<b>一律不提供自動化服務</b>（如金融卡、個人網路銀行等）。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"<mark>(四)籌備處開戶一律不提供自動化服務(如金融卡、個人網路銀行等)</mark>。"}},{"id":"S11-13","m":11,"q":"利用電子化通路進行活期性存款轉存定期性存款，每一帳戶每月累計限額為何？","o":["500 萬元","100 萬元","200 萬元","300 萬元"],"a":3,"x":"電子化通路活存轉定存，每一帳戶<b>每月累計限額新臺幣 300 萬元</b>。","ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第三節 存、取款及質借","t":"(五)<mark>利用電子化通路進行活期性存款轉存定期性存款，每一帳戶每月累計限額為新臺幣300萬元</mark>。"}},{"id":"S11-14","m":11,"q":"存戶存摺取款碼鎖碼、遺忘時，透過「第e個網」辦理密碼重設，下列何者正確？","o":["僅能以簡訊驗證","須原開戶行辦理","不得線上辦理","以 SSL、實體 OTP、電子憑證或晶片金融卡等安控驗證無誤後辦理，免臨櫃"],"a":3,"x":"得透過第e個網以 <b>SSL、實體 OTP、電子憑證或晶片金融卡</b>等安控驗證無誤後辦理，免臨櫃。","ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第五節 取款碼鎖碼、遺忘或變更之處理","t":"並以SSL、實體OTP、電子憑證或晶片金融卡等安控驗證無誤後辦理，<mark>免臨櫃辦理</mark>，惟以「晶片金融卡」申請變更限僅該晶片金融卡存摺存款帳戶。"}},{"id":"S11-15","m":11,"q":"以「晶片金融卡」透過第e個網申請存摺取款密碼變更，其適用範圍為何？","o":["同 ID 所有帳戶","全部帳戶","支票存款","限僅該晶片金融卡存摺存款帳戶"],"a":3,"x":"以晶片金融卡申請變更<b>限僅該晶片金融卡存摺存款帳戶</b>。","ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第五節 取款碼鎖碼、遺忘或變更之處理","t":"<mark>惟以「晶片金融卡」申請變更限僅該晶片金融卡存摺存款帳戶</mark>。"}},{"id":"S11-16","m":11,"q":"存戶臨櫃領用金融卡/密碼函時，下列何者正確？","o":["電話確認即可","可由他人代領","僅需身分證","本人親自提示身分證明文件及存摺、原留印鑑，於變更書簽收並加蓋原留印鑑"],"a":3,"x":"應由存戶<b>本人親自</b>提示身分證件、存摺、原留印鑑，親簽並蓋原留印鑑，核符後始得受理。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"4.<mark>存戶來行領用時，應請存戶本人親自提示身分證明文件及存摺、原留印鑑</mark>，請存戶於「變更書」金融卡/密碼函領用欄簽收人親自簽名並加蓋原留印鑑"}},{"id":"S11-17","m":11,"q":"疑似不法或顯屬異常帳戶之晶片金融卡，於自動化服務設備每日轉帳、提領金額上限為何？","o":["各 5 萬元","各 10 萬元","各等值新臺幣 1 萬元","各 3 萬元"],"a":2,"x":"每個帳戶之晶片金融卡每日轉帳、提領上限<b>各為等值新臺幣一萬元</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"１、<mark>每個帳戶之晶片金融卡於自動化服務設備（含實體/網路ATM）每日轉帳（含約定、非約定交易）、提領金額上限各為等值新臺幣一萬元整</mark>；"}},{"id":"S11-18","m":11,"q":"下列何者屬疑似洗錢表徵（金融卡提領）？","o":["同一張金融卡每日提領 10 萬元且連續提領 5 日","每月提領 1 次","同一張金融卡每日提領 3 萬元連續 2 日","單次提領 1 萬元"],"a":0,"x":"表徵之一：同一張金融卡<b>每日提領 10 萬元且連續 5 日</b>；或連續 7 日累計達 50 萬元。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"<mark>1.客戶使用同一張金融卡每日提領新臺幣10萬元，且連續提領5日</mark>。2.客戶使用同一張金融卡連續提領7日，且累計提領金額達新臺幣50萬元。"}},{"id":"S11-19","m":11,"q":"客戶使用同一張金融卡連續提領 7 日，累計提領金額達多少即屬疑似洗錢表徵？","o":["10 萬元","50 萬元","100 萬元","30 萬元"],"a":1,"x":"連續提領 7 日且<b>累計達新臺幣 50 萬元</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"<mark>2.客戶使用同一張金融卡連續提領7日，且累計提領金額達新臺幣50萬元</mark>。"}},{"id":"S11-20","m":11,"q":"代收稅款、代收勞/健/國民年金保險費等代收款項，單筆現金交易達 50 萬元以上執行 A190，其交易資料是否傳送法務部調查局？","o":["傳送國稅局","由客戶決定","一律傳送","交易種類 04-代理業務，不予傳送法務部調查局"],"a":3,"x":"代收款項單筆現金達 50 萬元，確認身分後執行 A190，交易種類 <b>04-代理業務</b>，<b>不予傳送</b>法務部調查局。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"單筆現金交易達新臺幣50萬元以上時，將產生大額通貨序號，請於確認客戶身分後，逕予執行A190交易，<mark>交易種類04-代理業務，其交易資料將不予傳送法務部調查局</mark>。"}},{"id":"S11-21","m":11,"q":"臨櫃匯款申請登錄交易（9660），系統比對「疑涉詐騙境內金融帳戶預警清單」之檢核欄位為何？","o":["匯款人電話","收款人帳號","匯款日期","匯款金額"],"a":1,"x":"匯款申請登錄交易 9660 檢核<b>收款人帳號</b>；有摺專用另檢核轉帳支出帳號。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"交易名稱交易代號檢核欄位……<mark>匯款申請登錄交易9660收款人帳號</mark>轉帳支出帳號、收款人帳號匯款申請登錄交易-有摺專用"}},{"id":"S11-22","m":11,"q":"臨櫃交易比對與「疑涉詐騙境內金融帳戶預警清單」相符時，系統處理方式為何？","o":["自動拒絕交易","自動通報調查局","凍結帳戶","提示提醒視窗，請加強臨櫃關懷或交易審核，必要時通知警察協處"],"a":3,"x":"系統提示提醒視窗：<b>加強臨櫃關懷或交易審核，必要時請通知警察協處</b>，由經辦確認是否繼續。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"將提示「帳號疑為異常帳戶……<mark>請加強臨櫃關懷或交易審核，必要時請通知警察協處</mark>。請確認是否繼續執行交易"}},{"id":"S11-23","m":11,"q":"如匯款至虛擬帳號之交易備註欄有可疑字義（如賭金、娛樂城等），應如何處理？","o":["照常入帳","通報國稅局","檢視是否為異常交易","逕行退匯"],"a":2,"x":"備註欄有可疑字義時，<b>檢視是否為異常交易</b>。","ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"１１、<mark>如匯款至虛擬帳號之交易備註欄有可疑字義時（如賭金、娛樂城等），檢視是否為異常交易</mark>。"}
