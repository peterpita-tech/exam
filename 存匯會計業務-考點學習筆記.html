由會計人員負責保管，保管期限至少十五年，如因事實需要，得酌予延長。"},"x":"留置金融卡為本單位發行者交金融卡主管保管，自留置日次日起 <b>14 個營業日</b>內未取回應註銷並登記。","lo":1,"t":"ask"},{"id":"112-49","y":112,"n":49,"m":11,"q":"「iLEO APP」提供之公用事業費用約定代扣繳服務，下列敘述何者為非？","o":["可線上約定代繳台電電費","客戶於線上完成約定/終止作業後，得於線上查詢設定狀態及繳費紀錄","客戶於線上完成約定/終止作業後，無法臨櫃查詢約定代繳狀態","本功能可透過 SSL、裝置綁定或實體 OTP 等安控驗證辦理"],"a":2,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"２、公用事業費、稅款、信用卡款等各種費用<mark>約定代繳</mark>之扣款帳戶。３、代理證券商證券劃撥帳戶之約定帳戶。４、薪資轉帳之約定帳戶。"},"x":"iLEO APP 公用事業費代扣繳：可線上約定台電電費等、線上查詢設定與繳費紀錄，亦<b>可臨櫃查詢</b>約定狀態；安控可用 SSL、裝置綁定或實體 OTP。","lo":1,"t":"neg"},{"id":"112-50","y":112,"n":50,"m":1,"q":"執行「整合開戶交易」時，若客戶約定網路銀行之轉入他人(非同 ID)或他行帳號已有被約定轉入達特定筆數，以下敘述何者為非？","o":["應確認客戶與約定轉入帳號之所有人是否有合理關聯、地緣或業務往來關係","於「判定合理原因」欄詳實敘明正常之理由","如有可疑情形，應依規辦理疑似洗錢及資恐交易申報作業","直接婉拒客戶約定此轉入帳號"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"(四)客戶申請轉入他人（行）帳號或線上約定<mark>轉入帳號</mark>服務，經辦應辦理臨櫃關懷作業及提供「防範詐騙提醒事項」文宣予存戶，並於「申請書」相關欄位勾選註記。"},"x":"約定轉入他人或他行帳號已被多人約定時，應確認關聯性並於「判定合理原因」欄敘明，可疑者申報；並非「直接婉拒」。","lo":1,"t":"neg"},{"id":"112-51","y":112,"n":51,"m":1,"q":"有關 iLEO 數位帳戶線上開戶，下列敘述何者為非？","o":["個人戶限年滿 7 歲並領有國民身分證之本國自然人申請","僅限個人戶申請","每一申請人限開立一戶","係指以本行網路方式開立之綜合管理帳戶"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１２、開戶建檔交易完成後，依客戶需求選擇「電子簽名」或「紙本簽名」：(１)電子簽名A.適用對象：<mark>限個人戶</mark>(含籌備處)且同意以「電子簽名」辦理者，但受監護/輔助宣告人或有見證人/代理人(不含未成年人之法定代理人)者除外。B.應告知客戶本行將以「電子簽名」方式辦理開戶，需請其另簽署「電子簽名同意書」。C.於「交易執行前置處理」頁面，勾選「電子簽名」並點選「電子傳送」，系統將傳送開戶申請書等文件至無紙化系統供客戶檢視確認，如客戶反映"},"x":"iLEO 數位帳戶線上開戶：個人戶限年滿 7 歲本國自然人、每人限一戶、帳戶性質為綜合管理帳戶；<b>非個人戶亦得申請</b>，故「僅限個人戶」錯誤。","lo":1,"t":"neg"},{"id":"112-52","y":112,"n":52,"m":9,"q":"有關傳票覆核之作業，下列敘述何者為是？<br><span class=\"it\">A.</span> 覆核人員覆核同一櫃員期間最長不得逾 3 個月<br><span class=\"it\">B.</span> 覆核人員指派登記簿由會計人員保管，保存 5 年<br><span class=\"it\">C.</span> 覆核人員應由自行查核主管負責指派<br><span class=\"it\">D.</span> 覆核人員休假，由覆核人員之職務代理人辦理覆核","o":["ABC","ACD","BCD","ABCD"],"a":1,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"(一)各櫃員結帳後應<mark>由覆核人員辦理覆核</mark>，<mark>覆核人員應由自行查核主管</mark>指派，並登記於「<mark>覆核人員指派登記簿</mark>」。<mark>自行查核主管</mark>指派<mark>覆核人員</mark>時應於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派<mark>辦理覆核</mark>。指派<mark>覆核人員覆核同一櫃員期間最長不得逾</mark>三個月，<mark>登記簿由自行查核主管</mark>自行保管並列入移交，保存五年。"},"t":"combo"},{"id":"112-53","y":112,"n":53,"m":9,"q":"傳票若有缺漏事項，應於記帳日起____內補正；傳票裝訂最遲應於記帳日起____內完成裝訂。","o":["5 個營業日；5 個營業日","5 個營業日；7 個營業日","7 個營業日；5 個營業日","7 個營業日；7 個營業日"],"a":3,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(二)傳票最遲應於記帳日後七<mark>個營業日</mark>內完成裝訂，國內分行至「傳票帳簿表報保管暨銷燬管理系統」辦理傳票冊數入庫登記，其餘單位則登記於「傳票目錄簿」（會305），並裝入有鎖鑰之箱或庫內，由會計人員負責保管，保管期限至少十五年，如因事實需要，得酌予延長。"},"t":"fill"},{"id":"112-54","y":112,"n":54,"m":9,"q":"每月月算係為正確反映每月之損益，下列何者不屬月算之調整作業項目？","o":["應收、應付利息之提存","向國庫繳納營業稅稅款","營業稅稅額之提存","固定資產提列折舊"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"4.給付所得所扣取之稅款應帳列「應付代收款─應付代扣稅款專戶」。(二)於規定期限內繳納：1.納稅義務人如為中華民國境內居住之個人，或在中華民國境內有固定營業場所之營利事業：應於每月十日前將上一月內所扣稅款<mark>向國庫繳</mark>清。"},"x":"月算調整：應收應付利息提存、營業稅稅額提存、折舊攤提等；<b>向國庫繳納營業稅</b>屬繳稅作業，非月算調整項目。","t":"neg"},{"id":"112-55","y":112,"n":55,"m":7,"q":"目前營業單位辦理營業稅申報完成後，應於申報期限屆滿之次日起____屆滿後，由「財政部稅務入口網」網站查詢並列印「核定結果畫面」，確認「查詢結果」後送交主管人員覆核。","o":["2 個月","3 個月","6 個月","1 年"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"款書(總行上傳)」，列印「營業稅繳款書」，於繳納期限前完成繳納。(三)核定：於前述<mark>申報期限屆滿之次日起</mark>六個月<mark>屆滿後，由「財政部稅務入口網」網站查詢並列印「核定結果畫面」，確認「查詢結果」後送交主管人員覆核</mark>，會計人員及<mark>主管人員</mark>應分別於<mark>「查詢結果」</mark>處下方蓋章。如對<mark>核定結果</mark>不服，應於復查時效內申請復查。"},"t":"fill"},{"id":"112-56","y":112,"n":56,"m":9,"q":"依商業會計法規範，費用開支所取得之原始憑證，自憑證所載日期起算最遲多久內須將帳務整理完畢？","o":["2 個月","3 個月","6 個月","12 個月"],"a":0,"ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"5.<mark>費用開支</mark>請款登帳，<mark>原始憑證</mark>要件不全。<mark>費用開支所取得之原始憑證</mark>（發票或收"},"t":"ask"},{"id":"112-57","y":112,"n":57,"m":7,"q":"納稅義務人如為中華民國境內居住之個人，扣繳義務人應於何時將利息所得扣繳稅款向該管稽徵機關申報？","o":["代扣稅款之日起 10 日內","代扣稅款日之次月 10 日前","代扣稅款日之次月月底前","每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"四、繳稅：(一)代扣之利息所得稅款，應於每月十日<mark>前將上一</mark>月內所扣稅款向國庫繳清，並於<mark>每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具</mark>「各類所得扣繳暨免<mark>扣繳憑單</mark>」<mark>，彙報該管稽徵機關</mark>查核。（所得稅法第92條）"},"t":"ask"},{"id":"112-58","y":112,"n":58,"m":9,"q":"下列有關傳票之敘述何者錯誤？","o":["單式傳票僅記載一個會計項目","製票同時辦理記帳之傳票，認證人員仍須於認證欄蓋章","因錯帳執行沖正交易時，應立即送主管人員認證覆核","傳票已由電腦列印記帳員姓名者，記帳欄位免再人工蓋章"],"a":1,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"五、傳票認證：(一)主要在核對傳票認證欄印錄內容是否與傳票記載事項相符，傳票經辦理電腦登錄記帳後，應由<mark>認證人員</mark>負責辦理認證並<mark>於認證欄蓋章</mark>確認，惟部分傳票係<mark>製票同時辦理記帳</mark>，或於執行記帳交易時連動帶出，因製票及記帳係同時產生，不致發生製票、記帳內容不符之情形，是類傳票得免<mark>於認證欄蓋章</mark>。"},"t":"neg"},{"id":"112-59","y":112,"n":59,"m":9,"q":"國內分行會計人員依櫃員別整理傳票，下列何者櫃員之傳票自 1 號起編，且該櫃員傳票最末號數應與「分行結帳資料表」該櫃員之「傳票張數」相符？","o":["票據櫃員","後送櫃員","櫃員主任","聯往櫃員"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"(三)新臺幣傳票及外幣傳票分別彙整後，將新臺幣傳票置於外幣傳票之前，加具封面及底頁裝訂成冊。(四)<mark>國內分行會計人員依櫃員別整理傳票，</mark>新臺幣一般櫃員、新臺幣虛擬櫃員(票據櫃員、後送櫃員、櫃員主任)及外匯櫃員(含虛擬櫃員)傳票免編號，新臺幣虛擬櫃員(<mark>聯往櫃員</mark>)<mark>傳票自1號起編，</mark>新臺幣虛擬櫃員(<mark>聯往櫃員</mark>)<mark>傳票最末號數應與「分行結帳資料表」該櫃員之「傳票張數」相符</mark>；另<mark>「分行結帳資料表」之「傳票張數</mark>合計」加計「分行外匯結帳表」<mark>之「傳票張數</mark>合計」之總數應與傳票封面「本日傳票總<mark>數」相符</mark>。"},"t":"ask"},{"id":"112-60","y":112,"n":60,"m":10,"q":"關於預算開支付款之程序，下列敘述何者為是？","o":["開支前無論申請之預算核准與否，只要取得統一發票或收據即可付款","私車公用補貼之燃料費，僅提供車號之統一發票即可付款","一律取得統一發票後才申請預算辦理付款","未訂立契約之交易，應依估價單內約定購置標的之規格、條款辦理驗收及付款"],"a":3,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第三節 開支審核","t":"二、<mark>未訂立契約之交易，應依估價單內約定購置標的之規格、條款辦理驗收及付款</mark>。三、單據(發票/收據)之審核：(一)各項開支均應取得合法之單據憑證，及其附屬有關書據。"},"t":"ask"},{"id":"113-1","y":113,"n":1,"m":3,"q":"受理為就業薪資轉帳開立帳戶需要，經警示戶當事人提出在職證明申請開戶時，下列敘述何者為非？","o":["開立之存款帳戶種類限活期存款或活期儲蓄存款或金如意綜合管理帳戶","如客戶非本行既有客戶，須另執行「存款餘額留存登錄及解除」交易(交易代號：9330，代碼50-設定衍生管制戶)，將所開帳戶設定為衍生管制帳戶","開戶後將暫停其使用提款卡、語音轉帳、網路轉帳及其他電子支付功能","匯入款項逕以退匯方式退回匯款行"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"條及勞動基準法第58條及勞工職業災害保險及保護法第33條第2項等)。(２)前述情形辦理開戶作業應注意下列事項：A.開立薪資轉帳帳戶者，當事人應提出在職證明或任職公司之證明文件；向銀行申辦貸款並經審核同意撥款或其他法律另得開立帳戶者，應徵取相關證明文件。B.<mark>存款帳戶種類</mark>僅<mark>限活期存款</mark>及<mark>活期儲蓄存款</mark>，但不含數位<mark>存款帳戶</mark>、離職儲金帳戶及<mark>金如意綜合管理帳戶</mark>。C.執行開戶交易時，「開戶作業檢核表」之「查詢『Z22通報案件紀錄及補充註記資訊』是否無揭露相關資訊或註記」欄位應輸入(勾選)「異常」選項，並註明仍受理開戶之理由。"},"t":"neg"},{"id":"113-2","y":113,"n":2,"m":3,"q":"下列有關告誡帳戶之敘述，何者為非？","o":["受告誡處分者之洗錢風險等級視為高風險，應加強盡職調查","受告誡處分者帳戶之存入交易應加強關懷","法院扣押解繳、票據交換兌付作業(MICR)不受限制","每個帳戶之金融卡每日轉帳及提領金額上限各為等值新臺幣一萬元"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"２、<mark>受告誡處分者帳戶之存入交易</mark>不受限制；辦理各項臨櫃支出或匯出匯款交易，應判斷交易合理性，並得請客戶提供佐證資料，如判斷交易顯不合理時，得婉拒交易。"},"t":"neg"},{"id":"113-3","y":113,"n":3,"m":3,"q":"有關iLEO線上開戶審查作業之敘述，何者為非？","o":["有警示帳戶/衍生管制帳戶設定紀錄者，不得核准開戶","一年內有解除警示紀錄一次者，不得核准開戶","客戶如屬虛擬通貨平台及交易業務事業，應婉拒開戶","客戶如從事當鋪業、貨幣兌換商等高風險行業，應先執行「客戶風險評分交易」(交易代號：A194)"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"２、開戶應經較高層級主管（資深副理或經理）核准：(１)為加強確認客戶身分作業，由具權限之主管登入AML系統｢客戶管理｣模組中點選｢客戶資料｣，於｢客戶號碼｣欄位輸入客戶之ID，查詢風險評級資料與分數報告，判斷是否同意開戶。(２)同意開戶者，較高層級主管應於相關文件印錄之「本客戶須經資深副理或經理同意開戶」提醒字樣旁蓋章確認，且如客戶無法提供其他資料進行加強客戶審查，蓋章處應敘明同意開戶之理由；以9236交易開戶者，較高層級主管應於9236交易認證單末頁印錄之<mark>核准開戶</mark>字樣旁蓋章確認，免再逐頁逐交易之高風險客戶提醒字樣旁蓋印核准。(３)拒絕開戶者（含應婉拒開戶對象），應執行「客戶警示名單維護」交易（交易代號：A245，警示代碼：Z1-拒絕開戶）建檔。"},"x":"iLEO 線上開戶：有警示／衍生管制紀錄者不得核准；虛擬通貨業者婉拒；高風險行業先執行 A194；「一年內解除警示一次即不得核准」並非規定。","lo":1,"t":"neg"},{"id":"113-4","y":113,"n":4,"m":5,"q":"有關綜合存款之定儲存，下列何者為是？<br><span class=\"it\">A.</span> 如約定到期不續存，到期日當日(含例假日)將自動解約存入綜存之活期性存款帳戶<br><span class=\"it\">B.</span> 如臨櫃辦理中途解約，金額在新臺幣100 萬元(不含)以上，由經辦確認存戶解約意願<br><span class=\"it\">C.</span> 以電子化通路辦理轉存定儲存，每一帳戶每月累計限額為新臺幣 500 萬元","o":["僅 AB","僅 A","ABC","僅 AC"],"a":1,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第20頁","s":"","t":"<mark>受理金如意及綜合存款之定儲存中途解約金額在新臺幣100萬元（含）以下，應由經辦確認存戶解約意願</mark>，並將確認情形備註於「綜合存款（定存解約）轉帳傳票」空白處，惟逾100萬元或主管對經辦確認內容有疑慮時，應由主管辦理。"},"x":"依存匯講義（營運業務處 2026.3）：綜存定儲存中途解約 <b>100 萬元（含）以下</b>由經辦確認、逾 100 萬元由主管辦理（B 錯）；電子化通路活轉定每月累計限額 300 萬元（C 錯）→ 僅 A。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第20頁","v":21,"t":"<mark>受理金如意及綜合存款之定儲存中途解約金額在新臺幣100萬元（含）以下，應由經辦確認存戶解約意願</mark>，並將確認情形備註於「綜合存款（定存解約）轉帳傳票」空白處，惟逾100萬元或主管對經辦確認內容有疑慮時，應由主管辦理。"},"t":"combo"},{"id":"113-5","y":113,"n":5,"m":7,"q":"有關代收稅款相關作業，下列何者為非？","o":["納稅義務人於繳納期限內以即期票據繳納稅款者，視為如期繳納","依稅捐稽徵法規定，每逾3日按滯納數額加徵1%滯納金，最高至30日","各項稅款、滯納金及利息之金額一律計算至「元」為止","繳納期間之末日如適逢星期日或國定假日者，仍以該日為繳納期間之末日"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１、擬參選人於選舉投票日（含選舉投票日）起15日（末日為星期日、<mark>國定假日</mark>或其他休息日者，以該日之次日為<mark>期間之末日</mark>）內，仍得臨櫃存入現金，逾期即不許其存入。"},"x":"代收稅款：繳納期間末日遇星期日或國定假日，<b>以次日為期間末日</b>；即期票據繳納視為如期繳納；每逾 3 日加徵 1% 滯納金，最高至 30 日。","lo":1,"t":"neg"},{"id":"113-6","y":113,"n":6,"m":4,"q":"支票存款戶申請變更印鑑僅填寫「存戶更換印鑑/戶名/代表人/統一編號申請書」，未填寫「支票存款戶憑舊式印鑑付款通知書」者，下列何者為是？","o":["以舊印鑑簽發之票據一律付款","以舊印鑑簽發之票據一律退票","發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，憑舊印鑑付款","發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，憑新印鑑付款"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"1-205第一章通則<mark>發票日在新印鑑生效日以前之票據，於新印鑑生效後始提示者，</mark>本行仍<mark>憑舊印鑑付款</mark>，故可於印鑑暨影像管理系統備註訊息欄註明「票據發票日於年月日前，且與刪除保留之印鑑式樣相符者始可付款。」"},"t":"ask"},{"id":"113-7","y":113,"n":7,"m":2,"q":"甲未婚無子女，父母及祖父母均已死亡，其有兄弟乙、丙、丁三人，乙有配偶 A 及子 B，甲死亡後，乙、丙、丁三人均拋棄繼承，請問何者可繼承甲之存款？","o":["僅 A","僅 B","A、B","以上皆非"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"1-258存款篇(十)繼承人擬領取存款時，若有繼承人<mark>拋棄繼承</mark>權，應檢具法院准予拋棄繼承權之備查函。"},"x":"第三順位兄弟姊妹全部拋棄，第四順位祖父母已歿 → 無人繼承；兄弟之配偶、子女<b>不得代位</b>，故以上皆非。","t":"combo"},{"id":"113-8","y":113,"n":8,"m":3,"q":"關於「大額通貨交易資料(申報)建檔」交易，下列何者交易資料不予傳送法務部調查局？","o":["單筆提取現金新臺幣 50 萬元","單筆存入現金新臺幣 50 萬元","單筆換鈔金額新臺幣 50 萬元","單筆現金繳納稅款 50 萬元"],"a":3,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第23頁","s":"","t":"<mark>代收款項(如代收稅款、代收勞/健/國民年金保險費等）及公益彩券經銷商申購彩券款項</mark>，大額通貨交易產生大額通貨序號，應確認客戶身分後執行A190交易(交易種類04-代理業務)，其交易資料不傳送法務部調查局。"},"x":"依存匯講義（營運業務處 2026.3）：代收稅款、勞健保費及公益彩券批購等大額通貨交易，確認身分後執行 A190（交易種類 04 代理業務），<b>資料不傳送法務部調查局</b>。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第23頁","v":24,"t":"<mark>代收款項(如代收稅款、代收勞/健/國民年金保險費等）及公益彩券經銷商申購彩券款項</mark>，大額通貨交易產生大額通貨序號，應確認客戶身分後執行A190交易(交易種類04-代理業務)，其交易資料不傳送法務部調查局。"},"t":"ask"},{"id":"113-9","y":113,"n":9,"m":3,"q":"下列有關第三方支付服務業者業務往來之控管措施，何者為非？","o":["未完成數位發展部能量登錄者，不得受理其開立新戶","經濟部商工登記公示資料載有 I301040 第三方支付服務業時，即應完成數位發展部能量登錄","既有客戶未於一定期限完成數位發展部能量登錄者，應請其結清銷戶","能量登錄效期屆滿，得向數位發展部申請展延一期"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(８)受理公司/行號申請開戶，查詢經濟部商工登記公示資料時，應檢視其所營事業資料(或營業項目)，倘載有「I301040<mark>第三方支付</mark>服務業」時，應另至數位發展部數位產業署網站(路徑：首頁&gt;業務服務&gt;申請服務&gt;能量登錄&gt;第三方支付服務機構服務能量登錄)，確認其已完成能量登錄，方能受理開戶；"},"x":"第三方支付服務業應完成數位發展部能量登錄始得開立新戶；既有客戶未完成登錄者應加強審查／限制，並非一律結清銷戶。","t":"neg"},{"id":"113-10","y":113,"n":10,"m":3,"q":"為提高臨櫃攔阻詐騙成效，執行端末交易時，如比對與「疑涉詐騙境內金融帳戶預警清單」相符時，系統將提醒營業單位加強關懷提問，下列何者不在加強關懷提問範圍？","o":["存摺存款支出交易","定期存款支出交易","匯款申請登錄交易","存摺存款收入交易"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(十六)為降低客戶遭詐騙之風險，受理客戶臨櫃辦理下列存、提、匯款等交易時，系統將於輸入支出或收入帳號後進行名單檢核作業，如經比對與內政部警政署提供之「疑涉詐騙境內金融帳戶預警清單」相符，將提示「帳號疑為異常帳戶(銀行別:XXX/帳號:0000000000000000)(如:銀行別:007/帳號:0000009368788827)，請加強臨櫃關懷或交易審核，必要時請通知警察協處。請確認是否繼續執行交易，如要繼續執行請按是(Y)，取消請按否(N)」提醒視窗：交易名稱交易代號檢核欄位存摺<mark>存款支出交易</mark>1560/1561支出帳號、轉帳收入帳號支票<mark>存款支出交易</mark>3560存摺存款收入交易1760/1761收入帳號支票存款收入交易3760匯款申請登錄交易9660收款人帳號轉帳支出帳號、收款人帳號匯款申請登錄交易-有摺專用"},"t":"neg"},{"id":"113-11","y":113,"n":11,"m":9,"q":"有關自動櫃員機現金短缺及剩餘之「作業風險事件通報管理系統」通報時限，下列敘述何者為是？","o":["發生現金短缺時，應於發現日後(不含當日)5個營業日內上網登錄及放行","發生現金剩餘達新臺幣10萬元(含)以上，如發現當日查明緣由並已沖正，得於發現日後(含當日)5個營業日內上網登錄結案","發生現金短缺，自發生日起20日內查明緣由沖正者，免上網登錄","發生現金剩餘達新臺幣10萬元(含)以上，未於發現當日查明緣由者，免上網登錄"],"a":1,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第10頁","s":"","t":"<mark>如發生現金剩餘或短缺達新臺幣10萬元以上，應於發現當日完成登錄及放行</mark>。"},"x":"依存匯講義（營運業務處 2026.3）：現金剩餘或短缺應於 5 個營業日內（含發現當日）登錄；<b>達 10 萬元以上應於發現當日完成登錄及放行</b>。注意：113 年官方答案所述「剩餘 10 萬元以上當日查明沖正得於 5 個營業日內登錄結案」與 2026 講義寫法不同，請以最新規定為準。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第10頁","v":23,"t":"<mark>如發生現金剩餘或短缺達新臺幣10萬元以上，應於發現當日完成登錄及放行</mark>。"},"t":"ask"},{"id":"113-12","y":113,"n":12,"m":5,"q":"有關金如意綜合管理帳戶之作業規定，下列敘述何者為是？","o":["已取得居留權之外籍人士，其金如意綜合管理帳戶定儲存一律設為「不質借」","未成年人不得申請開立金如意綜合管理帳戶","可註銷全行代付款服務","可執行「存摺存款客戶資料查詢」交易(交易代號：1030)查詢各項業務餘額"],"a":0,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"三、金如意帳戶之定存（新臺幣、外幣）性質別<mark>一律設為「</mark>綜存存單」，若約定為「可質借，其所有定存均作為各該幣別活期性存款質借使用；另受理未成年人申辦本項業務時，倘其申請新臺幣或外匯綜存為可質借者，應依私人借款之授信相關規範徵取所需文件後，始可辦理；倘受理<mark>已取得居留權之外</mark>國人士（含大陸人士）申辦本項業務時，其新臺幣、外幣綜存存單<mark>一律設為「不質借」</mark>。"},"t":"ask"},{"id":"113-13","y":113,"n":13,"m":5,"q":"受理聯行客戶存提作業，下列敘述何者為是？","o":["存戶輸入取款碼連續錯誤達四次時，電腦始自動停止憑摺付款交易","客戶離行後始發現金額錯誤應辦理交易沖正，再執行無摺轉帳支出交易（交易代號：1560），於「原沖正交易序號」欄輸入該筆沖正交易序號","辦理單筆金額達新臺幣 50 萬元以上之存入交易時，應以主管核准交易方式辦理","存戶註銷全行代付款，僅限於原開戶分行辦理"],"a":1,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第四節 代付存款","t":"三、倘<mark>客戶離行後始發現</mark>交易錯誤（支出誤打為收入或轉帳、現金帳務別錯誤）或<mark>金額錯誤</mark>辦理<mark>沖正交易</mark>時，應以無摺方式處理，惟應以主管核准交易辦理，並由主管認證。再辦理<mark>轉帳支出交易（交易代號：1560），</mark>應於<mark>支出交易</mark>之<mark>「原沖正交易序號」欄輸入該筆沖正交易</mark>之序號，系統將自動檢核帳號相符且確實有<mark>沖正交易</mark>始完成該筆無摺<mark>支出交易</mark>；如係帳號輸入錯誤，則無法使用本處理方式，應儘速採取權宜措施並洽請客戶來行辦理更正，必要時可請原始存款行協助辦理。"},"t":"ask"},{"id":"113-14","y":113,"n":14,"m":11,"q":"辦理傳真委託轉帳/匯款業務，客戶應於傳真指示交易之日起（　）內，將傳真文件正本送交本行，若以快遞發送或以掛號郵件寄送分行，其信封應至少保留一個星期以上始可銷毀。","o":["15日","7個營業日","10日","10個營業日"],"a":1,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第32頁","s":"","t":"<mark>客戶應於傳真指示交易日起七個營業日內，將正本送交本行</mark>，由原辦理該筆交易之各級人員蓋章後，裝訂於「傳真本」後作附件⚫"},"x":"依存匯講義（營運業務處 2026.3）：正本送交期限 <b>7 個營業日</b>。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第32頁","v":22,"t":"<mark>客戶應於傳真指示交易日起七個營業日內，將正本送交本行</mark>，由原辦理該筆交易之各級人員蓋章後，裝訂於「傳真本」後作附件⚫"},"t":"fill"},{"id":"113-15","y":113,"n":15,"m":11,"q":"單筆匯款金額超過新臺幣","o":["1萬元(不含)","2萬元(不含)","3萬元(不含)","5萬元(不含) 以上且有收取手續費及填寫收款人手機號碼者，櫃員於「匯款申請登錄交易」(交易代號:9560/9561/9660/9661)輸入收款人手機號碼，款項匯出後，系統將自動發送簡訊至收款人手機"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"(十九)為維金融消費者之權益，採取下列措施以防止理財業務人員及金融商品銷售人員未經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項：交易名稱<mark>交易代號</mark>檢核欄位存摺存款支出交易1<mark>560/</mark>1561支出帳號、轉帳收入帳號支票存款支出交易3560存摺存款收入交易1760收入帳號、存款人統編、代理人統編存摺存款收入交易1761收入帳號支票存款收入交易3760<mark>匯款申請登錄交易9660</mark>收款人帳號、<mark>匯款申請</mark>人統編、代理人統編支出帳號、收款人帳號、<mark>匯款申請</mark>人統編、代理人統編<mark>匯款申請登錄交易</mark>-有摺專用"},"x":"單筆匯款超過新臺幣 <b>5 萬元</b>（不含）且收取手續費並填收款人手機者，匯出後系統自動發簡訊通知收款人。","lo":1,"t":"fill"},{"id":"113-16","y":113,"n":16,"m":7,"q":"有關給付中華民國境內居住者之執行業務所得扣繳及申報規定，下列敘述何者為非？","o":["扣：扣繳率 10％(惟每次扣繳稅額不超過新臺幣二千元者，免予扣繳)","繳：每月底前將上一月扣繳稅款向國庫繳納","填：加總統計給付資料，填發各類所得扣繳暨免扣繳憑單","報：扣繳義務人應於每年一月底前將上一年內扣繳之相關文件向稽徵機關申報"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"四、繳稅：(一)代扣之利息所得稅款，應於每月十日<mark>前將上一月</mark>內所扣<mark>稅款向國庫繳</mark>清，並於每年一<mark>月底前將上一</mark>年內扣繳各納稅義務人之稅款數額，開具「各類所得扣繳暨免扣繳憑單」，彙報該管稽徵機關查核。（所得稅法第92條）"},"x":"執行業務所得扣繳率 10%（每次 2,000 元以下免扣），應於<b>每月 10 日前</b>將上月扣繳稅款繳庫（非月底）；每年 1 月底前申報。","t":"neg"},{"id":"113-17","y":113,"n":17,"m":9,"q":"有關傳票覆核人員之指派，下列何者為是？<br><span class=\"it\">A.</span> 覆核人員覆核同一櫃員期間最長不得逾 3 個月<br><span class=\"it\">B.</span> 應登記於「工作派令簿」<br><span class=\"it\">C.</span> 覆核人員應由自行查核主管指派<br><span class=\"it\">D.</span> 覆核人員休假，由結帳人員之職務代理人辦理覆核","o":["AB","AC","BC","BD"],"a":1,"ci":{"b":"會計篇","c":"附錄二 會計作業常見疏失事項及改善處理方式","s":"","t":"原指派由D覆核，仍應由該虛擬櫃員之<mark>覆核人員</mark>B<mark>辦理覆核</mark>。人員辦理，並登記於<mark>工作派令簿</mark>。所有櫃員包括一般櫃員、虛擬櫃員和臨時指派開櫃之櫃員完成結帳工作後，應再換人覆核，<mark>覆核人員應由自行查核主管指派</mark>，並<mark>應登記於「覆核人員</mark>指派登記簿」。<mark>自行查核主管指派覆核人員</mark>時於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派<mark>辦理覆核</mark>。指派<mark>覆核人員覆核同一櫃員期間最長不得逾</mark>三個月，登記簿<mark>由自行查核主管</mark>自行保管並列入移交，保存五年。遇<mark>覆核人員休假</mark>時，傳票之覆核工作應由該<mark>覆核人員之職務代理人</mark>負責辦理。若因<mark>職務代理</mark>造成覆核本身所經辦之帳務，或因該請假人員職務分工之需要，<mark>自行查核主管</mark>應另行指派其他人員辦理該請假人員之覆核工作，並應於該櫃員之「櫃員結帳彙總查詢單（已結帳）」(交易代號：1099-2轉帳結帳設定)上註明「因<mark>職務代理</mark>改派○○○覆核傳票」後，緊接處<mark>由自行查核主管</mark>蓋章證明。﹝會計篇第二章第二節﹞﹝2022/01/25會財字第00007號﹞"},"t":"combo"},{"id":"113-18","y":113,"n":18,"m":9,"q":"櫃員制下傳票之彙整及裝訂，下列敘述何者為非？","o":["複式轉帳傳票排列於單式傳票前","複式轉帳傳票依傳票類別分類彙整，免排序","單式傳票按轉帳收入、現金收入、轉帳支出及現金支出分類","外幣傳票置於新臺幣傳票之前"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"一、臨櫃傳票之分類、整理：(一)各櫃員之傳票應按複式轉帳傳票、單式傳票分類，單式傳票再按轉帳收入、現金收入、轉帳支出及現金支出分類；排列時，複式轉帳傳票排列於單式傳票前，複式轉帳傳票依傳票類別分類彙整，免排序，單式傳票依活存、行存、支存、活儲、放款、定儲存、代理聯行收付（NET）、匯出匯款申請書及調整單、聯行往來、會計明細分類帳(按會計項目別)及其他等順序排列，如有二個以上會計項子目時，則依第一個會計項子目排列，將「櫃員結帳彙總查詢單（已結帳）」置於<mark>傳票之前</mark>交會計人員彙整，會計人員應再依「分行結帳資料表」之櫃員順序排列。"},"t":"neg"},{"id":"113-19","y":113,"n":19,"m":7,"q":"有關印花稅課稅範圍，下列何者為非？","o":["銀錢收據(含兼具營業發票性質之銀錢收據及兼具銀錢收據性質之營業發票)","承攬契據","買賣動產契據","典賣、讓受及分割不動產契據"],"a":0,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"<mark>據及兼具銀錢收據性質之營業發票</mark>，不包括在內。(二)買賣動產契據。(三)承攬契據。(四)典賣、讓受及分割不動產契據。二、免稅範圍："},"t":"neg"},{"id":"113-20","y":113,"n":20,"m":10,"q":"各單位業務人員提供私人車輛、手機供公務使用，其私車公用燃料費及私人手機電話費每人每月補貼上限分別為何？","o":["500 元，500 元","1,000 元，1,000 元","1,000元，500 元","500 元，1,000 元"],"a":2,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"標的、次數、費率及違約之罰則等。（2）一般性費用：A.除契約性費用以外之費用開支，如營業場所之修繕、專戶支票及代學校收取學雜費單據等之印製，或因業務需要刊登廣告、委聘律師、會計師及專業顧問公司之諮詢服務等費用屬之。B.申請費用時，除委聘律師、會計師及專業顧問公司之諮詢服務等費用須檢附相關簽准文件，於【預算線上簽核系統】以「費用追加預算申請單」向本處申請外，其餘須檢附估價單或其影本，於【預算線上簽核系統】以「費用支出及資本支出申請單」或「總部費用支出及資本支出申請單」向業管單位逐案申請。C.各單位業務人員提供私人車輛、手機供公務使用，營業單位得參酌營運狀況由經理核定，總部單位應先簽請核准後辦理，其補貼上限如下：a.私車公用燃料費：每人每月新臺幣<mark>1,000元</mark>。b.私人手機電話費：每人每月新臺幣<mark>500元</mark>。"},"t":"ask"},{"id":"113-21","y":113,"n":21,"m":8,"q":"有關逾櫃員付現額度之大額付款作業程序，下列敘述何者為非？","o":["櫃員於受理時，應審視傳票各要項齊全，核對印鑑正確辦理記帳","逾櫃員付現額度時，應先由主管認證覆核，並檢視存摺記載無誤後，交櫃員主任辦理付款","記入櫃員主任帳辦理之付款，均須經第三人(辦理記帳交易之櫃員及櫃員主任以外人員)覆點無誤後交付領款人","櫃員主任於檢點現鈔後，應將傳票正面朝上連同現鈔交點鈔員辦理覆點"],"a":3,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第9頁","s":"","t":"經由記入櫃員主任帳辦理之付款，不論其金額是否超過高櫃櫃員付現授權額度，<mark>均須經第三人（辦理記帳交易之櫃員及櫃員主任以外人員）覆點無誤後交付領款人</mark>⚫"},"x":"依存匯講義（營運業務處 2026.3）：高櫃付現額度 <b>30 萬元</b>；逾額度者主管認證覆核並檢視存摺後交櫃員主任付款，經第三人覆點交付。選項 D 所述傳票交付方式非規定程序。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第9頁","v":13,"t":"經由記入櫃員主任帳辦理之付款，不論其金額是否超過高櫃櫃員付現授權額度，<mark>均須經第三人（辦理記帳交易之櫃員及櫃員主任以外人員）覆點無誤後交付領款人</mark>⚫"},"t":"neg"},{"id":"113-22","y":113,"n":22,"m":9,"q":"營業單位於假期間辦理行內ATM裝卸鈔作業規定，下列敘述何者為非？","o":["裝卸鈔當日應填寫「假期間裝卸鈔作業紀錄表」","卸下之機存現金應置放於金庫室之現金室內","「假期間裝卸鈔作業紀錄表」由櫃員主任保管並於次一營業日交付ATM經辦","「假期間裝卸鈔作業紀錄表」應裝訂於次一營業日依據紀錄表執行端末「自動櫃員機裝卸鈔維護交易」印錄之傳票後保管留存"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"十三、有關營業單位行外自動櫃員機委託保全公司填補鈔作業，如係採將補鈔金額匯款或轉帳至保全公司指定帳戶之交易方式辦理，非屬「金融機構防制洗錢辦法」所稱申報大額通貨交易之範圍，爰辦理行外ATM裝卸鈔暫以其他應收款墊支及歸墊作業，得免辦理A190交易之建檔，為配合本項作業，執行A830、A836交易並以「其他應收款-其他應收款諸戶」子目下「安豐保全公司」（代號：14184-501）及「聯安保全公司」（代號：14184-502）分戶辦理之現金存入及支出之交易，將不產生大額通貨序號。"},"x":"同 11 收票據，經辦應將票據張數及金額登記於「當日未及整理入帳代收票據備查簿」交主管覆核後，票據暫由櫃員主任收存保管","退票票據(不含存入備償借款專戶之退票)退還存戶前，應請主管取消「票據特別橫(雙)線經收章」(改委)"],"a":2,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第三節 代收存款","t":"(二)原始存款行作業如下：接獲代收行寄回之「<mark>代收票據</mark>退回提送單」〔匯17〕及退票票據，<mark>主管覆核</mark>傳票內容與票據相符後，於「送回<mark>代收票據</mark>回條」金額前首蓋匯兌私章並蓋妥腰形行名章後，送代收行作為「存戶領回退票憑單」附件，退票票據<mark>由櫃員主任</mark>保管<mark>，經辦應</mark>據「<mark>代收票據</mark>退回提送單」通知存戶儘速來行領取退票票據，並將通知時間、收話人註記於「<mark>代收票據</mark>退回提送單」後蓋經辦私章。"},"x":"當日未及提送之代收票據登記「當日未及整理入帳代收票據備查簿」經主管覆核後，暫由<b>主管</b>收存金庫保管（非櫃員主任）。","lo":1,"t":"neg"},{"id":"113-39","y":113,"n":39,"m":11,"q":"有關統一發票中獎獎金之兌付，客戶持中獎獎金達新臺幣500元(含)以上之發票至營業單位以何者方式領獎，不需支付千分之4印花稅？","o":["現金","本行支票","轉帳存入本行帳戶","匯款至其他金融機構帳戶"],"a":1,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"４、依簽發目的不同，申請類別代號及「<mark>本行支票</mark>簽發」（交易代號：3810、3811）建檔說明如下：(1)屬客戶一般申請，「申請書」申請類別代號應勾選「0：客戶申請」及填寫「申請目的」並建檔，建檔時應輸入「轉帳支出帳號」欄位，另再於「是否採連動扣帳」欄位，依據客戶需求輸入「0：否」或「1：是」。「轉帳支出帳號」為iLEO數位帳戶者，限已留存印鑑之數位帳戶且「是否採連動扣帳」須為「1：是」。(2)屬客戶辦理彩券或<mark>統一發票中獎獎金</mark>所開立<mark>本行支票</mark>者，「申請書」申請類別代號應勾選「2：客戶申請-彩券／發票兌獎」並建檔，建檔時免輸入轉帳支出帳號。(3)屬本行因內部人事、總務經費而簽發之<mark>本行支票</mark>，「申請書」申請類別代號應勾選「1：人事、總務經費」並建檔，建檔時免輸入轉帳支出帳號。(4)屬法院扣押解繳開立<mark>本行支票</mark>，「申請書」申請類別代號應勾選「3：扣押解繳」並建檔，建檔時免輸入轉帳支出帳號。(5)屬代收付國公庫之稅款、海關進口貨物退稅款等非屬上列情形而需開立本行支"},"x":"統一發票中獎獎金以<b>本行支票</b>給付者免貼千分之 4 印花稅（銀錢收據免稅）；以現金、轉帳或匯款給付則需負擔印花稅。","lo":1,"t":"ask"},{"id":"113-40","y":113,"n":40,"m":7,"q":"客戶持逾期之稅款繳款書至本行繳款時，下列敘述何者為非？","o":["不可代收","應以端末「滯納金、滯納利息查詢交易」(交易代號：9020)計算應收滯納金、滯納利息","本稅需加計核算之滯納金、滯納利息一併收取","如有計算疑問時，櫃員亦可洽詢各稅捐稽徵機關"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"1-248存款篇(九)各項代扣利息所得稅款，應暫存入「應付代收款」項目「應付代扣稅款」專戶，俾彙集繳庫。(十)存戶如經稽徵機關認定屬「非中華民國境內居住之個人」（所得扣繳率為百分之二十），通知銀行續行向所得人追補短扣稅款者，銀行應就短扣繳之利息所得稅，通知存戶補繳差額之扣繳稅款（免予加計利息及滯納金），如存戶未為補繳，銀行應於給付次期利息時，自其利息所得補扣短繳之稅款，如有下情形之一者，得通報稽徵機關逕行通知存戶補繳該短繳部分之稅款："},"x":"逾期稅款繳款書<b>仍可代收</b>，以 9020 交易計算滯納金、滯納利息一併收取。","lo":1,"t":"neg"},{"id":"113-41","y":113,"n":41,"m":11,"q":"有關「自動櫃員機跨行提款」及「自動化服務設備跨行轉帳/本行ATM跨行存款交易」，營業單位手續費減免權限分別為","o":["15次；15次","10次；10次","10次；15次","20次；10次 ，任一項超過者即須送營運業務處，俟核准後始可辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十七節 臨櫃手續費、服務費及自動化服務設備手續費之計收與減免 附錄一 自動化服務設備手續費減免作業應注意事項","t":"(三)EDI電子轉帳跨行交易及通匯交易:包含清算費、電子傳輸費。三、減免方式：(一)「自動櫃員機跨行提款」及「自動化服務設備跨行轉帳/本行ATM跨行存款交易」：營業單位權限為『「自動櫃員機跨行提款」小於10次（含）且「自動化服務設備跨行轉帳/本行ATM跨行存款」小於10次（含）』，任一項超過者即須送營運業務處，俟核准後始可辦理。(二)EDI電子轉帳：清算費、電子傳輸費由「付款人負擔」方式辦理者，由營業單位經理自行決定，並以金額全數減免方式辦理。"},"t":"fill"},{"id":"113-42","y":113,"n":42,"m":1,"q":"受理客戶為受監護、受輔助宣告之人開戶時，不得開立何種帳戶？","o":["活期儲蓄存款","定期性存款","綜合存款","金如意綜合管理帳戶"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"},"t":"ask"},{"id":"113-43","y":113,"n":43,"m":2,"q":"有關受理外籍人士以郵寄方式申請變更新式統一證號，下列何者為非？","o":["應檢附載有新式統一證號之居留證正反面影本","新式統一證號格式為 2碼英文+8碼數字","可透過內政部移民署全球資訊網之「移民署新舊統一證號申請結果查詢」網頁查詢舊式統一證號","可郵寄至任一分行辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"４、內政部移民署於110年1月2日起實施新式外來人口統一證號專案，將統一證號比照國人身分證字號格式修正為<mark>1碼英文＋9碼數字</mark>，換號期間為110年1月2日起至119年12月31日止，換發新號前，舊號仍可使用，120年1月1日起，舊式統一證號全面停用。"},"t":"neg"},{"id":"113-44","y":113,"n":44,"m":1,"q":"甲、乙、丙三位客戶聲明其稅籍狀態分別為甲：具有中華民國及日本稅籍、乙：具有中華民國及美國稅籍、丙：具有中華民國及新加坡稅籍，受理開戶時「CRS 外國稅籍註記」欄位何者要輸入「N」？","o":["甲乙丙","甲","乙","丙"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"(七)如客戶非<mark>中華民國稅籍、美國稅籍</mark>者，應於<mark>「CRS外國稅籍註記」欄位</mark>輸入「Ｙ」，系統將連動<mark>「CRS</mark>客戶基本資料建檔交易」(9777交易)，應辦理其英文姓名、現在居住國家、地址及具有稅籍之居住國家或地區、稅籍編號及無法取得稅籍編號原因等資料建檔。"},"t":"combo"},{"id":"113-45","y":113,"n":45,"m":1,"q":"關於籌備處開戶，下列何者為非？","o":["得以其申請人名義申請開立活期存款、定期存款或支票存款","籌備處一律為高風險客戶","由系統連動執行「成年監護、輔助宣告資料交易(9590)」查詢籌備處申請人之監護、輔助宣告資料","籌備處名稱得並列於戶名內(例：第一股份有限公司籌備處王大明)"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(一)籌設中之公司、行號、機關、團體<mark>得以其申請人名義申請開立活期存款或定期存款</mark>，惟該籌備處名稱得並列於戶名內（例：第一股份有限公司籌備處王大明），並登記<mark>其申請人</mark>之身分證統一編號及住址，以備將來利息所得稅歸戶之用。故開戶申請書以個人戶方式填寫資料，且客戶類別勾選「個人戶」、性別欄亦須勾選。公司籌設階段向銀行開立帳 八、不定期查訪：(一)開戶後如有<mark>變更負責人</mark>之情事，或非個人戶為久未往來戶欲申領空白支票時，應於客<mark>戶申請變更</mark>後兩週內再次<mark>實地查訪瞭解客戶經營狀況，惟實地查訪日期不得晚於客戶領取空白票據日期</mark>，並將查訪情形註記於「本行<mark>支票存款</mark>帳戶開戶/久未往來戶恢復往來/<mark>變更負責人</mark>查註事項」(存516)「簽註意見」欄，另<mark>變更負責人</mark>時，則應於次營業日所產生之「<mark>支票存款戶</mark>開戶基本資料異動明細表」（日報，CK37）備註欄註記<mark>完成實地查訪日期</mark>，並由<mark>支票存款</mark>經辦及主管蓋章。"},"t":"fill"},{"id":"114-2","y":114,"n":2,"m":4,"q":"有關受理存戶申請本行支票，下列敘述何者正確？","o":["得以現金申請","毋須瞭解申請目的","應記載受款人","一律須禁止背書轉讓"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"四、銀行簽發本行支票，<mark>應記載受款人</mark>，並加劃平行線。五、銀行對本行支票之簽發程序及空白支票之登記保管，應予嚴格管制，並自行訂定管制辦法予以實施。"},"t":"ask"},{"id":"114-3","y":114,"n":3,"m":1,"q":"受理籌備處開戶或受理其正式成立公司來行申請變更戶名及印鑑時，有關審查作業下列敘述何者不正確？","o":["申請資格：籌備處開戶之申請人以與本行往來 6 個月以上之既有客戶為原則","籌備處開戶可提供自動化服務(如金融卡、個人網路銀行等)","合理審查期間約 7~10 個營業日","檢視申請人帳戶最近 3 個月之往來交易有無異常"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１、申請資格籌備處開戶之<mark>申請人以與本行往來六個月以上之既有客戶為原則</mark>。"},"x":"依存匯講義（營運業務處 2026.3）：籌備處開戶申請人以往來 6 個月以上既有客戶為原則、合理審查期間 7～10 個營業日、<b>一律不提供自動化服務</b>、檢視申請人帳戶最近 3 個月往來。","t":"neg"},{"id":"114-4","y":114,"n":4,"m":1,"q":"受理本國未成年人開戶(不含支票存款帳戶)，下列何者不正確？","o":["父母偕同未成年人來行辦理","父母共同來行代理未成年子女開戶，未成年人可不必到場","父或母一方單獨持他方同意書代理未成年子女開戶，未成年人可不必到場","限制行為能力人不得自行持父母同意書單獨臨櫃辦理開戶"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"６、為利未成年人<mark>辦理開戶</mark>(不含支票存款帳戶)，受理本國未成年人開戶得依下列任一方式辦理：(１)父母偕同未成年人來行辦理。(２)父母共同來行代理未成年子女開戶，未成年人可不必到場。(３)父或母一方單獨持他方同意書代理未成年子女開戶，未成年人可不必到場。(４)<mark>限制行為能力人得自行持父母同意書單獨臨櫃辦理開戶</mark>。"},"t":"neg"},{"id":"114-5","y":114,"n":5,"m":5,"q":"有關辦理新臺幣活期(儲)存款變更為綜合存款帳戶作業，下列敘述何者不正確？","o":["應請客戶於「往來業務項目申請(變更)申請書」(存513)勾選「活期(儲)存款變更為綜合存款」","「綜存質借」記號預設為「可質借」","「綜存質借」記號預設為「不可質借」","如客戶申請綜存質借功能，將於定存金額九成範圍內質借"],"a":1,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第二節 開戶","t":"合存款」（新），存摺第一頁印錄舊摺餘額資料，且<mark>綜存質借記號預設</mark>「不<mark>可質借」</mark>。(５)倘客戶申請綜合存款帳戶為可質借，應請客戶再於「往來業務項目申請(變更)申請書(存513)」之「臺幣綜存」欄位勾選<mark>「可質借」</mark>，並執行<mark>綜存質借</mark>記號變更交易（交易代號：1300，變更代碼：29，變更內容：〝0〞可質借）。(６)執行「印存摺封面帳號戶名&amp;磁條更改」（交易代號：0821）辦理新存摺帳號、戶名、存摺流水號及磁條印錄，並依第四章第九節辦理（活期（儲）存款）舊摺作廢及（綜合存款）新摺簽發作業。"},"t":"neg"},{"id":"114-6","y":114,"n":6,"m":1,"q":"為落實戶籍謄本減量政策，營業單位遇有客戶使用電子戶籍謄本申辦業務時，不得拒絕受理，惟應至","o":["經濟部商工登記資料系統","公司名稱及所營事業登記預查網路核覆查詢系統","內政部戶政司全球資訊網","司法院網站「家事事件公告專區」 辦理查詢，以確保電子戶籍謄本資料之正確性"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)受理未成年人申請開戶時，如提示戶口名簿或電子戶籍謄本作為主要證件者，應透過<mark>內政部戶政司全球資訊網</mark>查驗該證件之有效性，並列印查詢結果備查。"},"t":"fill"},{"id":"114-7","y":114,"n":7,"m":2,"q":"印鑑暨影像管理系統授權功能，下列敘述何者不正確？","o":["系統自動授予分行經理「最高授權管理者」權限","系統自動授予存匯副理「作業主管」權限","系統自動授予高櫃(含櫃員主任)及矮櫃人員「查詢人員」權限","人工辦理權限異動後，列印「人員權限異動明細表」核對，並按日期順序裝訂，留存 6 個月備查"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"2.臨時授權：如因人員代理需要，可由「最高授權管理者(SU)」手工授權「作業主管（UU）」權限，「作業主管（UU）」手工授權「查詢人員」或「建檔人員」權限，再由第二位作業主管（UU）或最高授權管理者（SU）辦理覆核始生效力；完成<mark>權限異動後，</mark>應<mark>列印「人員權限異動明細表」核對，並按日期順序裝訂，留存</mark>1年備查。"},"t":"neg"},{"id":"114-8","y":114,"n":8,"m":11,"q":"黃金存摺定期投資，每次最低指定投資金額(不含手續費)為","o":["新臺幣 3,000 元或美金 200 元","新臺幣 5,000 元或美金 200 元","新臺幣 3,000 元或美金 300 元","新臺幣 5,000 元或美金 300 元 新臺幣以 1,000 元為單位累加；美金以 10 元為單位累加"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十七節 臨櫃手續費、服務費及自動化服務設備手續費之計收與減免 附錄一 自動化服務設備手續費減免作業應注意事項","t":"請開立。每張100元。申請變更本行支票受款人。每張30元。票據掛失止付。每張/次100元。掛失空白票據時，得以每次100元計收（不限張數）。支票存款撤銷/恢復付款委託。每張150元。領取空白新臺幣票據。"},"x":"第一銀行黃金存摺定期投資：每次最低 <b>新臺幣 3,000 元</b>，以 1,000 元為倍數增加（美金帳戶最低 200 美元依行內規定）。","lo":3,"web":[{"t":"第一銀行：黃金存摺","u":"https://www.firstbank.com.tw/sites/fcb/touch/1565687618541"},{"t":"第一銀行：黃金存摺約定書","u":"https://www.firstbank.com.tw/sites/fcb/files/1565683064056"}],"t":"fill"},{"id":"114-9","y":114,"n":9,"m":11,"q":"代付統一發票中獎獎金下列敘述何者不正確？","o":["補印之電子發票證明聯可直接給獎，不需檢附原始發票","買受人為執行業務者(私立機構/團體/單位、醫院/診所/事務所)，領獎收據除填寫中獎人姓名、電話及中獎金額，另需加蓋執行業務章戳，章戳形式不限","載明買受人之手開統一發票，領獎收據之中獎人姓名應與買受人相符","手開統一發票之營業人統一發票專用章欄位空白，一律不得給獎"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"４、依簽發目的不同，申請類別代號及「本行支票簽發」（交易代號：3810、3811）建檔說明如下：(1)屬客戶一般申請，「申請書」申請類別代號應勾選「0：客戶申請」及填寫「申請目的」並建檔，建檔時應輸入「轉帳支出帳號」欄位，另再於「是否採連動扣帳」欄位，依據客戶需求輸入「0：否」或「1：是」。「轉帳支出帳號」為iLEO數位帳戶者，限已留存印鑑之數位帳戶且「是否採連動扣帳」須為「1：是」。(2)屬客戶辦理彩券或統一發票中獎獎金所開立本行支票者，「申請書」申請類別代號應勾選「2：客戶申請-彩券／發票兌獎」並建檔，建檔時免輸入轉帳支出帳號。(3)屬本行因內部人事、總務經費而簽發之本行支票，「申請書」申請類別代號應勾選「1：人事、總務經費」並建檔，建檔時免輸入轉帳支出帳號。(4)屬法院扣押解繳開立本行支票，「申請書」申請類別代號應勾選「3：扣押解繳」並建檔，建檔時免輸入轉帳支出帳號。(5)屬代收付國公庫之稅款、海關進口貨物退稅款等非屬上列情形而需開立本行支"},"x":"財政部說明：<b>補印之電子發票證明聯不可兌獎</b>（證明聯遺失亦不能以補印或影本代替）；發票破損模糊須經開立營業人證明與存根相符方可領獎。","lo":3,"web":[{"t":"ETtoday：發票領獎限制一次看","u":"https://www.ettoday.net/news/20261008/3251228.htm"},{"t":"今周刊：雲端發票不能領獎原因","u":"https://www.businesstoday.com.tw/article/category/183030/post/202604170044/"}],"t":"neg"},{"id":"114-10","y":114,"n":10,"m":3,"q":"有關防制詐欺同業照會機制，下列敘述何者不正確？","o":["為辦理對疑似異常存款帳戶或交易之查證作業，銀行得向金融同業照會帳戶之基本資料","照會內容得包含開戶日期及開戶人之年齡，惟不得照會存款帳戶之戶名","同業照會本行時，應確認同業身分及提供之電話等聯絡資訊確為該金融機構所有","本行以電話向同業照會時，應將相關照會資訊記錄於「疑似異常存款帳戶或交易照會資料紀錄表」"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"２、本行照會同業時：應向同業表明任職第一銀行OO分行O小姐/先生/副理、執行照會之事由、照會帳號及照會項目，<mark>內容得包含</mark>：(1)<mark>存款帳戶之戶名</mark>及<mark>開戶日期</mark>。(2)<mark>開戶人之年齡</mark>、職業類別及開戶或交易目的。(3)<mark>存款帳戶之</mark>交易是否有異常情形(如資金快進快出)及是否對<mark>存款帳戶</mark>進行監控(如圈存、警示戶等)。(4)為進行詐防條例之控管措施所需之其他必要資訊。"},"t":"neg"},{"id":"114-11","y":114,"n":11,"m":3,"q":"有關警示帳戶內剩餘款項發還作業，下列敘述何者不正確？","o":["存款帳戶遭通報為警示帳戶，金融機構應依開戶資料聯絡開戶人，與其協商返還帳戶內剩餘款項事宜","無法聯絡開戶人時，應即透過匯(轉)出行通知被害人檢具相關文件，申請發還帳戶內剩餘款項","辦理款項發還，帳戶餘額未達新臺幣 1,000 元者，得逕行結清銷戶","疑似交易糾紛或案情複雜等案件，應循司法程序辦理"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 專責督導主管及無法發還之情事 附錄九 帳戶圈存通知書","t":"2.本行接獲前揭通知後，應透過匯（轉）<mark>出行通知被害人檢具相關文件，申請發還</mark>警示<mark>帳戶內剩餘款項</mark>。2.依前項辦理，仍<mark>無法聯絡開戶人</mark>者，應透過匯（轉）出行，<mark>通知被害人檢具相關文件，申請發還</mark>警示<mark>帳戶內剩餘款項</mark>（聯絡紀錄應留存於特急件通報單空白處，以備查驗）。"},"t":"neg"},{"id":"114-12","y":114,"n":12,"m":8,"q":"有關聯行間資金調撥作業，下列敘述何者不正確？","o":["聯行間有資金調撥需求時，資金撥付行與收款行之主管應先以電話確認金額、撥款日期、運送方式等資料","辦理資金調撥作業時，櫃員主任應填具「資金調撥請求單」及檢附相關文件，陳核至分行經理","由資金收款行櫃員主任執行「資金調撥請求交易」，輸入撥款日期、撥付行、運送方式、金額及資金明細","如為小額資金需求(如硬幣)，得以資金收款行櫃員主任個人帳戶辦理資金調撥"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第七節 票據退票 附錄四 台灣票據交換所因應部分縣市票據交換所停止上班媒體交換、分區交","t":"(三)上午照常上班，下午停止上班時比照第二款規定，惟配合中央銀行同業<mark>資金調撥</mark>清算作業系統，各項作業酌予提前辦理。(四)上午停止上班，下午照常上班時"},"x":"聯行資金調撥須主管電話確認、櫃員主任填「資金調撥請求單」陳經理；<b>不得</b>以櫃員主任個人帳戶辦理資金調撥。","lo":1,"t":"neg"},{"id":"114-13","y":114,"n":13,"m":3,"q":"有關告誡戶之敘述，下列何者不正確？","o":["告誡戶之金融帳戶管制措施自直轄市、縣(市)政府警察機關裁處告誡之日起算 5 年","告誡期間不得申請開戶","受告誡處分者，不得申請空白票據","受告誡處分者帳戶之存入交易不受限制"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"十三、<mark>告誡戶之設定及控管</mark>(一)告誡戶係指違反洗錢防制法第二十二條第六項規定，交付或提供帳戶、帳號予他人使用，經直轄市、縣(市)政府警察機關裁處告誡之行為人(包含自然人、法人、設有代表人或管理人之非法人團體、中央或地方機關或其他組織)。"},"x":"告誡戶管制自裁處告誡之日起算 5 年；不得申請空白票據、存入不受限制；告誡期間<b>仍得</b>開戶（受限制），故「不得申請開戶」錯。","t":"neg"},{"id":"114-14","y":114,"n":14,"m":4,"q":"有關代收票據之收受，當日未及提送之代收票據，經辦應將票據張數及金額登記於「當日未及整理入帳代收票據備查簿」由主管覆核後，暫由（　）收存於金庫保管，俟次營業日再辦理提送作業。","o":["受理之經辦","代收票據經辦","櫃員主任","主管"],"a":3,"ci":{"b":"存款篇","c":"第六章 存摺存款全行收付","s":"第三節 代收存款","t":"(二)原始存款行作業如下：接獲代收行寄回之「<mark>代收票據</mark>退回提送單」〔匯17〕及退票票據，<mark>主管覆核</mark>傳票內容與票據相符後，於「送回<mark>代收票據</mark>回條」金額前首蓋匯兌私章並蓋妥腰形行名章後，送代收行作為「存戶領回退票憑單」附件，退票票據由櫃員主任保管<mark>，經辦應</mark>據「<mark>代收票據</mark>退回提送單」通知存戶儘速來行領取退票票據，並將通知時間、收話人註記於「<mark>代收票據</mark>退回提送單」後蓋經辦私章。"},"x":"未及提送之代收票據，暫由<b>主管</b>收存於金庫保管，次營業日再提送。","lo":1,"t":"fill"},{"id":"114-15","y":114,"n":15,"m":11,"q":"有關金融卡約定轉帳，下列敘述何者不正確？","o":["約定轉入本行他人或他行帳號，於申請日後次一日生效","約定轉入本行本人帳號(同轉出帳號統一編號)，於申請日當日生效","事先約定之轉入帳號，轉入本行帳戶每次最高以新臺幣 300 萬元為限","事先約定之轉入帳號，轉入金融同業帳戶，每次最高以新臺幣 200 萬元為限"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄五 第一商業銀行防杜人頭帳戶應注意事項","t":"(四)客戶申請電話語音銀行及網路銀行約定轉入帳戶者，視客戶性質及風險程度高低，評估於申辦日後次一日生效，或<mark>拉長生效時間為次二日生效</mark>(惟同一統一編號帳戶經評估並無遭詐騙損失之虞者除外)。"},"x":"約定轉入本行他人或他行帳號，經評估後於<b>次二日</b>生效（非次一日）；本人帳號當日生效。","t":"neg"},{"id":"114-16","y":114,"n":16,"m":9,"q":"對傳票覆核人員之敘述何者正確？<br><span class=\"it\">A.</span> 傳票覆核人員由部門副理指派<br><span class=\"it\">B.</span> 指派覆核人員覆核同一櫃員期間最長不得逾三個月<br><span class=\"it\">C.</span> 指派覆核人員應登記於覆核人員指派登記簿<br><span class=\"it\">D.</span> 覆核人員請假，覆核由部門副理另行指定","o":["ABCD","BC","AC","CD"],"a":1,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"(一)各櫃員結帳後應由<mark>覆核人員</mark>辦理覆核，<mark>覆核人員應</mark>由自行查核主管指派，並登記於「<mark>覆核人員指派登記簿</mark>」。自行查核主管<mark>指派覆核人員</mark>時應於登記簿上蓋章後，交相關人員蓋章確認，並督促<mark>覆核人員</mark>確實依指派辦理覆核。<mark>指派覆核人員覆核同一櫃員期間最長不得逾三個月</mark>，登記簿由自行查核主管自行保管並列入移交，保存五年。"},"t":"combo"},{"id":"114-17","y":114,"n":17,"m":9,"q":"下列敘述何者正確？ Ａ.資訊處每月產生之「應補收息明細表」為系統產製，無須經授信主管覆核<br><span class=\"it\">B.</span> 月算包含以應計基礎提存應收、應付利息<br><span class=\"it\">C.</span> 每半年辦理上期及下期決算<br><span class=\"it\">D.</span> 本行每月辦理營業稅、印花稅提存","o":["ABCD","BCD","BD","AC"],"a":2,"ci":{"b":"會計篇","c":"第四章 月算、結算及決算","s":"第一節 月算","t":"2.為確保月算損益正確無誤，資訊處於每月25日及28日產生「<mark>應補收息明細表</mark>」(報表代號：LP－L07A)，並於次一營業日置於「報表查詢列印系統（OnDemand）」，經辦應確實列印且與授信主管覆核應補收息之正確性，若有錯誤，務必於月底日前調整訖，以免影響當月放款之利息提存。"},"x":"應補收息明細表須經<b>授信主管覆核</b>（A 錯）；每半年辦理的是上下期<b>結算</b>，決算為年度（C 錯）→ BD。","t":"combo"},{"id":"114-18","y":114,"n":18,"m":7,"q":"下列敘述何者不正確？ Ａ.檢查連線作業會計項目之傳票應覆核認證者是否業經覆核認證<br><span class=\"it\">B.</span> 未達扣繳起扣點之給付不用向稅捐主管稽徵機關辦理申報<br><span class=\"it\">C.</span> 轉銷呆帳之未實現利息收入，僅於轉銷當月份申報扣減銷售額及營業稅額","o":["ABC 敘述皆錯誤","BC","AC","ABC 敘述皆正確"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"(二)每年十二月月算提存：除上述一般月算提存外，另依下列規定辦理：1.依財政部99年4月14日台財稅字第09900025490號解釋令，自該解釋令發布日以後<mark>轉銷呆帳之未實現利息收入，</mark>得於轉銷年度申報最後一期營業稅時，檢附證明文件，彙總全年度金額<mark>申報扣減銷售額及營業稅額</mark>；嗣經受償歸屬利息部分，仍應依法報繳營業稅。配合前開解釋令，自99年起，每年十二月辦理營業稅提存時，由系統自動「減：<mark>轉銷呆帳之未實現利息收入</mark>」全年度彙總金額後計出營業稅<mark>銷售額及</mark>稅額。"},"t":"combo"},{"id":"114-19","y":114,"n":19,"m":10,"q":"有關核配預算下列敘述何者正確？","o":["甲及乙項目皆屬核配預算，在甲與乙的核配預算總和範圍內，可相互支應開支","核配預算不足，不管原因及理由都可以申請追加","外包費—護衛駕駛核配預算不足，向會計處申請追加預算","以上皆非"],"a":3,"ci":{"b":"會計篇","c":"附錄三 各項開支預算執行要點","s":"","t":"券經紀人公會、中華徵信所會費等)<mark>核配預算</mark>不足，可依規申請追加預算。"},"t":"ask"},{"id":"114-20","y":114,"n":20,"m":10,"q":"有關費用超支敘述何者正確？","o":["費用 6 月漏未申請預算，於 7 月初發現，以補申請預算方式處理","超支原因如屬費用預算歸屬期別錯誤，無法辦理期別更正","甲費用預算，3 月開支時誤入乙費用帳，於 4 月初發現，以更正費用帳務處理","損益日報可查詢費用超支情形"],"a":2,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第四節 費用控管","t":"(三)超支原因如屬<mark>費用預算</mark>歸屬期別錯誤，如核准<mark>費用預算</mark>期別為「○年下期」，卻於「○年上期」辦理開支，致上期費用超支時，應於系統上點選「修正/刪除已核准申請單」表單，申請修改該筆<mark>費用預算</mark>之年度期別。"},"t":"ask"},{"id":"114-21","y":114,"n":21,"m":4,"q":"有關票據之審核，下列敘述何者不正確？","o":["自然人存戶死亡後其生前簽發之支票不論到期與否均因委任關係消滅，應拒絕付款","法人戶負責人死亡後，未更換負責人之前，如有票據提示，應拒絕付款","票據金額文字大寫與小寫號碼不符時，應以大寫文字為準","票據文字大寫金額之「玖」字筆誤為「玫」，但票載小寫金額足以辨識，宜照付"],"a":1,"ci":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第29頁","s":"","t":"<mark>法人存戶負責人死亡後，未更換負責人前，如有票據提示，仍應付款</mark>。"},"x":"依存匯講義（營運業務處 2026.3）：法人存戶負責人死亡、未更換負責人前之票據提示<b>仍應付款</b>（自然人存戶死亡則拒付）。","lx":{"b":"講義：存匯業務重要規定與作業控管(2026.3)","c":"第29頁","v":34,"t":"⚫法人存<mark>戶負責人死亡後</mark>，<mark>未更換負責人</mark>前，<mark>如有票據提示</mark>，仍應付款。"},"t":"neg"},{"id":"114-22","y":114,"n":22,"m":4,"q":"有關票據日期之審核，下列何者不正確？","o":["票據未載發票年月日者，應以「法定要項不全」理由退票","本票未載到期日者，應視為見票即付","本票到期日記載不全(如僅記載「年」、「日」而未記載「月」)，應解為到期日無記載","支票所記載之發票年月日若係 2 月 30 日或 4 月 31 日等曆法上所無之日期時，該票據無效"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(二)以銀行為擔當付款人之本票或承兌匯票應屆到期日方得付款，未記載到期日者視為見票即付。(三)銀行客戶簽發<mark>支票所記載之發票年月日</mark>須係<mark>曆法上所</mark>具有之日，若係二月三十日或四月三十一<mark>日等曆法上所無之日期時，</mark>則以該月之末日為發票日。（財政部51.10.（51）台財錢發第07254號令）"},"t":"neg"},{"id":"114-23","y":114,"n":23,"m":1,"q":"客戶為本行警示帳戶或衍生管制帳戶時，應拒絕客戶開戶，惟為開立薪資轉帳帳戶，可向本行申請下列何種存款帳戶種類？","o":["金如意綜合管理帳戶","離職儲金帳戶","活期儲蓄存款","支票存款"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(２)前述情形辦理開戶作業應注意下列事項：A.<mark>開立薪資轉帳帳戶者，當事人應提出在職證明</mark>或任職公司之證明文件；"},"t":"ask"},{"id":"114-24","y":114,"n":24,"m":6,"q":"有關定期性存款存入金額之最低額度，下列敘述何者不正確？","o":["零存整付儲蓄存款為新臺幣 1 仟元","整存整付儲蓄存款為新臺幣 5 仟元","綜合存款之存本取息儲蓄存款為新臺幣 5 仟元","定期存款為新臺幣 5 仟元"],"a":2,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"二、定期<mark>儲蓄存款</mark>（零存整付存款除外）存入本金之最低額度，自2002年7月1日起調整<mark>為新臺幣5</mark>千元，零存整付<mark>儲蓄存款</mark>每次存入金額<mark>為新臺幣</mark>1千元以上。"},"t":"neg"},{"id":"114-25","y":114,"n":25,"m":4,"q":"下列何種業務不可於聯行辦理？","o":["申請簽發最近 3 個月內之存款餘額證明","iLEO 數位帳戶","結清支票存款之票據掛失業務","定期存款解約"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"(四)存戶申請結清存摺存款帳戶者，須將存摺一併寄回本行，有關存摺處理方式，應依客戶勾選□請貴行立即銷毀，毋須寄回（未勾選者，適用本選項）或□請貴行依本申請書之聯絡地址寄回辦理；申請<mark>結清支票存款</mark>帳戶者，須將剩餘空白票據劃線作廢後一併寄回本行，如尚有已簽發未經提示付<mark>款之票據</mark>，則不適用郵寄方式，須請其臨櫃辦理結清銷戶事宜。"},"x":"<b>結清支票 n> 原始憑證形式未具，得經主管蓋章證明後填製傳票<br><span class=\"it\">D.</span> 原始憑證如須另行保管應於傳票上記載","o":["D","AB","BD","ABC"],"a":0,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"交易之發生，均應取得或給予足以證明會計事項<mark>之會計憑證</mark>。<mark>商業之會計憑證依其性質分為原始憑證及</mark>記帳憑證。<mark>原始憑證</mark>：證明會計事項之經過，而為造具記帳憑證所根據之憑證。"},"t":"combo"},{"id":"114-58","y":114,"n":58,"m":9,"q":"本行櫃員制結帳之敘述何者正確？<br><span class=\"it\">A.</span> 中心及自動化帳務，日終由會計依彙總數編製傳票<br><span class=\"it\">B.</span> 虛擬櫃員須由會計辦理結帳<br><span class=\"it\">C.</span> 日終結帳一般櫃員之結帳由本人辦理<br><span class=\"it\">D.</span> 業務 TA 未歸零得以其他應收款或其他應付款掛帳","o":["ABCD","BC","AC","C"],"a":3,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"四、<mark>虛擬櫃員</mark>結帳之指派：<mark>日終結帳</mark>時<mark>一般櫃員之結帳由本人辦理</mark>，<mark>虛擬櫃員之結帳</mark>則應指派結帳人員辦理，並登記於工作派令簿。五、覆核人員之指派："},"t":"combo"},{"id":"114-59","y":114,"n":59,"m":10,"q":"關於上期及下期核准之預算，若未及使用，下列何者正確？","o":["上期資本支出可遞延至下期","下期資本支出可遞延至次年","上期費用支出可遞延至下期","下期費用支出可遞延至次年"],"a":0,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第一節 預算核配、追加與申請","t":"(五)上期核准之預算未及使用：<mark>資本支出</mark>─<mark>可遞延至下期</mark>使用。費用支出─可申請修改年度期別或重新申請預算。(六)下期核准之預算未及使用：<mark>資本支出</mark>─須重新申請，不得<mark>遞延至下</mark>年度使用。費用支出─須重新申請預算或申請修改年度期別，惟不得先行提存於「應付費用」以供以後使用。"},"t":"ask"},{"id":"114-60","y":114,"n":60,"m":10,"q":"對營業單位自行採購案件之敘述下列何者正確？","o":["金額新臺幣 1 萬(含)元以下案件，授權由資深副理核定","金額新臺幣 1 萬元以上採購案件，應檢附相關估價單據申請總行核准","採購金額新臺幣 5 萬元以上應檢附 3 家(含)以上估價單連同申請單，向業管單位申請核准","以上皆非"],"a":1,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(二)<mark>金額新臺幣</mark>一<mark>萬元以上</mark>或資本支出<mark>採購案件，應檢附相關估價單據</mark>或其影本<mark>申請總行核准</mark>後辦理採購：1.營繕工程：凡營業廳裝修如櫃檯改修、粉刷牆壁、更換或修補地磚、門窗修繕、水電或網路線路鋪設及屋頂漏水、外牆損壞修繕‧‧‧等屬之，須檢附估價單或其影本，以「費用支出及資本支出申請單」向業管單位逐案申請。"},"t":"ask"}],"sq":[{"id":"S1-1","m":1,"q":"未成年人持雇主開立且註明經法定代理人同意之僱傭證明開戶，下列敘述何者錯誤？","o":["不得開立支票存款","不得開立綜合存款","得開立薪資轉帳活期儲蓄存款","得開立金如意綜合管理帳戶"],"a":3,"x":"僅得開立薪資轉帳活期儲蓄存款，不得開立綜存（含金如意）及支票存款。","t":"neg","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.活期存款、活期儲蓄存款、定期性存款、綜合存款、金如意綜合管理帳戶2.<mark>出具僱傭證明者，僅得開立薪資轉帳活期儲蓄存款</mark>，不得開立綜合存款(含金如意綜合管理帳戶)及支票存款。"}},{"id":"S1-2","m":1,"q":"客戶確為受監護、受輔助宣告之人，下列哪些帳戶得於監護人或輔助人簽章同意後開立？ A.綜合存款 B.存摺存款一般戶 C.定期性存款 D.金如意綜合管理帳戶","o":["ABC","BC","ABCD","ACD"],"a":0,"x":"不得開立支票存款及金如意綜合管理帳戶。","t":"combo","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"}},{"id":"S1-3","m":1,"q":"有關籌備處開戶，下列敘述何者錯誤？","o":["戶名得並列「○○籌備處」","以申請人名義開立活期或定期存款","一律不提供金融卡、網銀等自動化服務","洗錢風險屬低風險客戶"],"a":3,"x":"籌備處一律為高風險客戶。","t":"neg","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)<mark>籌備處開戶一律不提供自動化服務</mark>(如金融卡、個人網路銀行等)。"}},{"id":"S1-4","m":1,"q":"客戶聲明具有「中華民國及美國」稅籍，整合開戶時「CRS 外國稅籍註記」應輸入（　）。","o":["免輸入","Y","依居住地決定","N"],"a":3,"x":"僅非中華民國、非美國稅籍者輸入 Y；台＋美兩者皆非 CRS 外國稅籍 → N。","t":"fill","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"2.<mark>如客戶非中華民國稅籍、美國稅籍者，應於「CRS外國稅籍註記」欄位輸入「Y」</mark>，系統將連動「CRS客戶基本資料建檔交易」(交易代號：＊行號第二證件：登記證照以外之第二身分證明文件，且應具辨識力。"}},{"id":"S1-5","m":1,"q":"依本行規定，「高齡客戶」係指年滿（　）（含）以上之自然人。","o":["60 歲","65 歲","55 歲","70 歲"],"a":1,"x":"高齡客戶定義為年滿 65 歲（含）以上之自然人。","t":"fill","ci":{"b":"存款篇","c":"第一章 通則","s":"第一節 存款經辦應有之基本認識","t":"二、<mark>高齡客戶定義：年滿65歲(含)以上之自然人</mark>。"}},{"id":"S1-6","m":1,"q":"開戶申請人聯絡資訊與本行既有警示帳戶重複達（　）以上者，原則應婉拒受理開戶。","o":["5 人","1 人","3 人","2 人"],"a":2,"x":"2 人以上原則不受理自動化服務業務申請；3 人以上原則應婉拒受理開戶。","t":"fill","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"<mark>倘與3人以上重複，原則應婉拒受理開戶</mark>。"}},{"id":"S1-7","m":1,"q":"受理未成年人開戶時，以戶口名簿或電子戶籍謄本為主要證件者，應透過何網站查驗有效性？","o":["內政部戶政司全球資訊網","經濟部商工登記資料","司法院家事事件公告","財政部稅務入口網"],"a":0,"x":"應透過內政部戶政司全球資訊網查驗並列印查詢結果備查。","ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"(四)受理未成年人申請開戶時，如提示戶口名簿或電子戶籍謄本作為主要證件者，<mark>應透過內政部戶政司全球資訊網查驗該證件之有效性</mark>，並列印查詢結果備查。"},"t":"ask"},{"id":"S1-8","m":1,"q":"公司戶開戶時，若無財務報表，第二證件得徵取何者替代？","o":["繳稅證明","公司章程","負責人健保卡","統一編號編配通知書"],"a":0,"x":"財務報表（無財報可徵取繳稅證明）；負責人第二證件可以公司設立登記證照替代。","src":1,"c "qt":{"neg":0.3667,"combo":0.1167,"fill":0.2667,"ask":0.25},"rv":{"sub":"依《存款篇》115.06.30 版（18 章，951 頁）＋《會計篇》20260325 版（9 章＋附錄，175 頁）逐章抽取，共約 552 條複習點；<b>紅字</b>為關鍵數字（期限、金額門檻、稅率、保存年限）","secs":[{"t":"存款篇（115.06.30 版，共 18 章）","chs":[{"id":"dep-s0p0-c1","t":"存款篇 第一章 通則（一）：開戶與基本規定","fc":"A","fq":"5年約25題（每年約5題）· A級","h":"<h4>存款經辦基本認識</h4>\n<ul>\n<li>經辦對存戶往來情況、內容及存款數字有<b>保守秘密</b>義務。</li>\n<li>同業票信照會內容可含開戶日期、有無退票/退補紀錄、支存餘額位數（高中低），但<b>不包括實際存款餘額</b>。</li>\n<li>經登帳或蓋收付訖戳記之傳票，其傳遞<b>不得交由顧客</b>為之。</li>\n<li>高齡客戶定義：年滿<b>65歲(含)以上</b>之自然人；失智者服務三原則：能力推定、最大協助、避免偏見。</li>\n<li>高齡臨櫃關懷：提領現金或定存解約達<b>3萬元(含)</b>以上顯示「關懷」；達<b>30萬元(含)</b>以上傳票認證「關懷」；年齡達65歲且交易達<b>50萬元(含)</b>以上連動檢核表。</li>\n<li>見證：用印章代簽名者需<b>1人</b>簽名證明；以指印/十字/符號代簽名者需<b>2人</b>簽名證明（民法第3條）。</li>\n</ul>\n<h4>存款種類（法源）</h4>\n<ul>\n<li><b>支票存款</b>：憑簽發支票隨時提取、<b>不計利息</b>（銀行法第6條）。</li>\n<li><b>活期存款</b>：憑存摺或約定方式隨時提取（銀行法第7條）。</li>\n<li><b>定期存款</b>：有一定時期限制，憑存單或約定方式提取（銀行法第8條）。</li>\n<li><b>儲蓄存款：限個人、非營利法人或團體</b>（團體須提供免稅證明）。</li>\n<li>存本取息儲蓄存款：一次存入本金，存滿<b>一個月</b>後按月領息。</li>\n<li>外國專業投資機構新臺幣定存期限<b>不得超過3個月</b>，期滿得續存3個月，以<b>一次</b>為限。</li>\n</ul>\n<h4>存款利息</h4>\n<ul>\n<li>各種存款利息以<b>年利率</b>為準（銀行法第41條）。</li>\n<li>計息起點：活期存款/活儲<b>一萬元</b>；定期存款/定儲<b>五千元</b>；零存整付<b>一千元</b>。</li>\n<li>計息：自存款日起算至計息日<b>前一日</b>止，計算至元位、四捨五入。</li>\n<li>活期性存款按日計息：總積數×年利率÷<b>365</b>。</li>\n<li>對同類存款按對象牌告不同利率須事先通報央行，央行收到通報起<b>十個營業日</b>內未反對視同完成備查。</li>\n</ul>\n<h4>開戶——基本要件</h4>\n<ul>\n<li>個人依「姓名條例」以<b>本名</b>立戶；開戶應由<b>本人親自</b>辦理；特殊情況得依法委任第三人代辦。</li>\n<li>受理開戶應查核<b>雙重身分證明文件</b>並影印留存主要身分證明文件影本。</li>\n<li>第二身分證明文件應具辨識力、不限有照片；<b>毋須影印留存</b>，僅須註記名稱及證號。</li>\n<li>同一分行再開其他帳戶得免徵第二身分證件；於<b>聯行</b>開第二帳戶仍應徵。</li>\n<li>高風險客戶開戶須經<b>較高層級主管</b>核准並辦加強盡職調查。</li>\n<li>舊式身分證應以「紫光燈」觀察隱性防偽設計。</li>\n</ul>\n<h4>開戶——非個人戶</h4>\n<ul>\n<li>首次往來公司/行號設立<b>未達半年</b>或資本額<b>未達新臺幣100萬元</b>，需辦開戶評估審查（約<b>7~10個營業日</b>）。</li>\n<li>同一登記地址登記達<b>5家</b>公司/行號（加計本次）須徵營業稅單或實地查訪。</li>\n<li>聯徵Z21查詢新存款開戶（加計本次）達<b>3次</b>，原則應婉拒受理。</li>\n<li>法人及團體應徵取最新版章程作為第二證件。</li>\n<li>營業項目載有「第三方支付服務業」須確認已完成能量登錄方可受理。</li>\n</ul>\n<h4>CRS/FATCA</h4>\n<ul>\n<li>2019年起開戶須徵「CRS自我證明表&amp;FATCA聲明書」；拒絕提供應<b>婉拒開戶</b>。</li>\n<li>FATCA消極非金融外國法人有持股<b>超過25%</b>美國籍股東者，該股東須填自我證明。</li>\n</ul>\n<h4>身分查核（Z21/Z22）</h4>\n<ul>\n<li>應查詢聯徵Z21（身分證領補換驗證）及Z22（通報案件紀錄）。</li>\n<li>未持中華民國身分證者（未成年、外籍）免辦Z21，僅查Z22。</li>\n<li>查詢時點：支票存款應<b>即時查詢</b>；其他存款最晚於開戶後<b>二個營業日內</b>。</li>\n<li>Z21代碼：Y相符、N查無、C須輸六項、L掛失、D已停用、R限制驗證。</li>\n<li>錄影資料應保存<b>六個月</b>。</li>\n<li>聯行開第二帳戶應向<b>前一開戶行</b>照會，比對身分證影本及印鑑卡筆跡。</li>\n</ul>\n<h4>拒絕開戶態樣</h4>\n<ul>\n<li>疑似匿名、假名、人頭、虛設行號；偽變造證件或均為影本；不尋常拖延；警示帳戶尚未解除；資恐制裁對象；國籍為<b>伊朗、北韓</b>；提供虛擬資產服務之事業。</li>\n<li><b>不得逕以地緣性理由</b>拒絕開戶。</li>\n<li>Z21顯示短期內新開<b>3個以上</b>存款帳戶（加計本次），原則婉拒。</li>\n<li>與<b>2人以上</b>警示帳戶重複聯絡資訊，原則不受理自動化服務；與<b>3人以上</b>重複，原則婉拒開戶。</li>\n<li>警示名單代碼：Z1拒絕開戶、Z2暫不受理自動化、Z3疑似交易異常、Z4其他。</li>\n<li>帳戶交詐騙集團涉幫助詐欺/幫助洗錢罪，得處<b>5年以下</b>有期徒刑。</li>\n</ul>\n<h4>籌備處開戶</h4>\n<ul>\n<li>申請人以與本行往來<b>六個月以上</b>既有客戶為原則；審查期間約7~10個營業日。</li>\n<li>一律<b>不提供自動化服務</b>；一律為<b>高風險客戶</b>。</li>\n<li>正式成立後負責人非原申請人者應另立新戶。</li>\n</ul>\n<h4>未成年人開戶</h4>\n<ul>\n<li>未成年人存款一次或一課稅年度累計存入達<b>400萬元</b>應通報稅捐稽徵機關（查贈與稅）。</li>\n<li>限制行為能力人：滿<b>七歲未滿十八歲</b>（民法第77、79條）；催告法代確答期限<b>一個月以上</b>。</li>\n<li>父母原則應<b>共同行使</b>法代權（民法1086、1089條）；一方持他方同意書代理開戶得受理。</li>\n<li>受僱未成年人薪轉經雇主證明雇傭經法代同意者，可逕開活期性存款（<b>不含支票存款、綜合存款</b>）。</li>\n<li>無行為能力人：<b>未滿七歲</b>，由父母代理開戶，本人免到行。</li>\n<li>未成年人開戶之同意權為法代專屬，<b>不得委託他人</b>行使。</li>\n</ul>\n<h4>受監護/輔助宣告人</h4>\n<ul>\n<li><b>不得開立支票存款、金如意綜合管理帳戶</b>；其他存款須由法院選定之<b>監護人或輔助人</b>簽章同意。</li>\n<li>系統連動查詢（9590），疑似者至司法院「家事事件公告專區」查詢確認。</li>\n</ul>\n<h4>外國人/大陸人士開戶</h4>\n<ul>\n<li>在台有住所外國人（持居留證）得開新臺幣存款帳戶；在台無住所外國人限開<b>活期存款、活儲、定期存款</b>。</li>\n<li>大陸人士：已取得居留權者得開活期性及定期性存款；未取得居留權者<b>不得開支票存款</b>。</li>\n<li>大陸人士利息按「在台無住所外國人」扣繳率<b>20%</b>就源扣繳，不論金額一律扣稅。</li>\n<li>外國文件原則應經我國駐外單位簽證確認真正。</li>\n</ul>\n<h4>特殊帳戶</h4>\n<ul>\n<li><b>政治獻金專戶</b>：以<b>一個</b>為限，經監察院許可；捐贈超過<b>1萬元</b>留姓名電話、超過<b>3萬元</b>留身分證號、超過<b>10萬元</b>應以支票或匯款；擬參選人收受後<b>15日內</b>存入專戶。</li>\n<li><b>社會救助戶/退撫給與專戶</b>：專戶內存款<b>不得辦理抵銷、扣押、供擔保或強制執行</b>；接獲執行命令應聲明異議。</li>\n<li>退撫給與專戶限開<b>活期儲蓄存款</b>；開戶後<b>一年內</b>未有退撫給與存入者銷戶。</li>\n<li>公寓大廈管理委員會：不具法人資格持報備文件可開活期/定期/儲蓄存款（須免稅證明），開支存須以負責人名義。</li>\n</ul>\n<h4>帳號與經辦資格</h4>\n<ul>\n<li>連線作業存款帳號共<b>十一位數</b>；支存及存單帳號按順序編列，<b>不得重行使用</b>以前出缺號碼。</li>\n<li>開戶經辦資格：四職等以上正式行員任職滿<b>一年</b>且取得證照，或四職等以上任職滿<b>二年</b>。</li>\n</ul>\n<h4>防杜人頭帳戶</h4>\n<ul>\n<li>人頭帳戶臨櫃四步驟：觀察、詢問、審核、回應。</li>\n<li>受理國內匯款及無摺存款<b>單筆3萬元以上</b>須確認客戶身分。</li>\n<li>提供<b>24小時</b>取消約定轉入帳戶或暫停付款服務；發現明顯遭詐騙勸導無效，主動撥「110」或「165」。</li>\n<li>開戶影像檔獨立保存至少<b>六個月</b>；客戶申請文件<b>永久保存</b>；戶政查詢單至少保存<b>5年</b>。</li>\n</ul>"},{"id":"dep-s0p1-c1","t":"存款篇 第一章 通則（二）：印鑑、掛失、扣繳與繼承","fc":"B","fq":"5年約18題（每年約4題）· B級","h":"<h4>Z21／Z22 查詢與身分確認</h4>\n<ul>\n<li>Z21查個人戶本人或非個人戶負責人；Z22查本人／負責人及非個人戶統編。</li>\n<li>未持中華民國身分證者（未成年、外籍）<b>免辦Z21</b>，僅查Z22。</li>\n<li>Z22顯示<b>警示帳戶、開戶詐騙、歹徒詐騙案件</b>應<b>婉拒開戶</b>。</li>\n<li>補充註記顯示「當日查詢」或近<b>三個月</b>內被頻繁查詢且理由為「新存款開戶」者，應提高警覺。</li>\n<li>本國人持身分證外，須另徵具辨識力之第二證件（<b>不限有照片</b>）；第二證件毋須留存，僅加註名稱及證號。</li>\n<li>身分證影本應加註「限辦理第一銀行開戶使用」字樣。</li>\n</ul>\n<h4>受監護／輔助宣告查詢</h4>\n<ul>\n<li>涉本人親簽交易由系統連動檢核（9590）；提示疑似者應至<b>司法院「家事事件公告專區」</b>查詢並列印留存。</li>\n<li>受監護／輔助宣告者開戶須由法院選定之監護人或輔助人簽章同意；<b>不得開立支票存款、金如意帳戶</b>。</li>\n</ul>\n<h4>印鑑</h4>\n<ul>\n<li>印鑑暨影像管理系統全行連線；印鑑爭議以客戶留存之印鑑卡、申請書、授權書為準。</li>\n<li><b>橡皮印章（含自動印章）不能作為存款留存印鑑</b>。</li>\n<li>個人戶可僅留本人簽名為印鑑式樣；機關團體公司應以圖章加負責人私章（或簽名）。</li>\n<li>更換印鑑應由本人辦理；授權他人須出具授權書並確認雙方身分。</li>\n<li>支存戶更換印鑑，對已簽發未兌付票據須填通知書委託憑舊印鑑付款。</li>\n<li>開戶、更換印鑑、掛失暨更換新印鑑應<b>當日</b>完成印鑑建檔。</li>\n<li>「帳號/ID異動表」保存<b>5年</b>；有權簽章人員簽章樣本刪除後系統自動保留<b>5年</b>。</li>\n<li>支票存款、黃金存摺、授信、備償及外匯簽章登記卡印鑑<b>不適用</b>印鑑轉籍。</li>\n</ul>\n<h4>更換戶名／統編</h4>\n<ul>\n<li>得更換戶名不另立新戶：個人更名、法人僅變更名稱人格未變、公司變更組織人格未變。</li>\n<li><b>不具法人格之行號、團體更換負責人，支票存款帳戶一律結清</b>。</li>\n<li>洗防警示：開戶未滿<b>3個月</b>即變更負責人且已有<b>2戶以上</b>變更為同一負責人，應了解原因評估婉拒或申報。</li>\n</ul>\n<h4>存戶基本資料</h4>\n<ul>\n<li>通訊地址與警示戶相同或與<b>4位以上</b>存戶重複、Email/行動電話與<b>1位以上</b>客戶相同，須留存原因。</li>\n<li>Email驗證錯誤達<b>5次</b>或逾<b>48小時</b>須重發驗證信。</li>\n<li>綜合對帳單、Email、電話、地址等變更皆須<b>本人臨櫃</b>辦理。</li>\n</ul>\n<h4>掛失止付</h4>\n<ul>\n<li>掛失效力<b>自本行主管准掛失並辦妥登錄手續時開始</b>；接獲書面通知前已付款，非本行故意過失者不負責。</li>\n<li>電話掛失須儘速補具申請書；<b>支票、可轉讓定存單掛失仍以書面為宜</b>。</li>\n<li>持已掛失存摺印鑑臨櫃提款疑似歹徒，應拒付並立即<b>通報警察</b>。</li>\n<li>掛失結清帳戶（聯行）餘額<b>低於新臺幣5萬元（含）</b>得免傳真原開戶行。</li>\n<li>「存款業務事故登記表」月報<b>永久保存</b>。</li>\n<li>無法於聯行掛失補發存單：可轉讓定存單、質權設定存單、法院扣押、非本人授權。</li>\n</ul>\n<h4>存款餘額證明書</h4>\n<ul>\n<li>分<b>餘額證明</b>與<b>部分餘額證明</b>兩種；含交換票據時應<b>俟收妥後</b>填發。</li>\n<li><b>驗資防洗錢</b>：發現不實存款、暫借頭寸應拒發；異常樣態（貸款轉入回存驗資、金主非股東資金、同一資金反覆驗資）應拒絕並申報疑似洗錢。</li>\n<li>定期性存款原則不另發餘額證明；已設質者證明書註記設質。</li>\n<li><b>可轉讓定期存單不宜核發</b>餘額證明。</li>\n<li>有法院扣押/圈存者加註「須另扣除扣押及限制金額後始可動用」。</li>\n<li>餘額證明申請書保存<b>5年</b>。</li>\n</ul>\n<h4>扣繳存款利息所得稅（必考）</h4>\n<ul>\n<li>銀行為<b>扣繳義務人</b>（所得稅法88、89條）。</li>\n<li>扣繳稅率：境內居住個人／境內營利事業<b>10%</b>；非居住者<b>20%</b>；一課稅年度境內居住合計滿<b>183天</b>者按10%。</li>\n<li>大陸地區人民：比照無住所外國人<b>20%</b>就源扣繳。</li>\n<li>短期票券（含NCD）超過首次發售價格部分利息：居住者<b>10%</b>、非居住者<b>15%</b>（分離課稅）。</li>\n<li><b>免扣繳門檻：每次應扣繳稅額不超過2,000元（即利息所得不超過2萬元）免扣繳</b>，仍須填免扣繳憑單；全年利息不超過<b>1,000元</b>者免填憑單。</li>\n<li>非境內居住個人不論金額<b>一律扣繳</b>。</li>\n<li>免扣繳所得稅之存款：教育文化公益慈善團體、各級政府及公有事業、銀行同業間存款、職工退休基金等。</li>\n<li><b>儲蓄免扣證</b>：本人與配偶及受扶養親屬所領利息股利累計<b>27萬元以下</b>免扣。</li>\n<li>扣繳時點：活期性每期結息或解約、定存每次付息、零存整付及整存整付到期一次扣。</li>\n<li>繳稅期限：每月<b>10日前</b>繳上月扣稅、每年<b>1月底前</b>開具扣繳憑單彙報；非居住者利息須於代扣之日起<b>10日內</b>繳清。</li>\n<li>扣繳憑單留存聯保存<b>7年</b>。</li>\n</ul>\n<h4>存款之繼承（必考）</h4>\n<ul>\n<li>確知存款人死亡執行<b>死亡凍結</b>，不得憑原留印鑑付款；死亡凍結帳戶仍可入帳、不得支出。</li>\n<li>法人支存戶負責人死亡：<b>無須凍結、仍憑原留印鑑付款</b>。</li>\n<li><b>繼承順序</b>（民法1138）：配偶為當然繼承人；①直系血親卑親屬②父母③兄弟姊妹④祖父母。</li>\n<li><b>遺產稅證明</b>：繼承存款餘額<b>新臺幣20萬元以下</b>可免附稅款繳清/免稅證明（以單一營業單位總餘額判斷）。</li>\n<li><b>小額存款繼承</b>：繼承金額<b>3萬元以下</b>（單一分行總餘額），免全體繼承人會同，一名繼承人持證明文件及切結書即可。</li>\n<li>未到期定期存款：存款人死亡均得繼承提領（<b>可轉讓定存單除外</b>）。</li>\n<li>死亡前後利息分別填扣繳憑單：死亡前以被繼承人名義、死亡後以繼承人名義。</li>\n<li>任一繼承人憑證明文件可查詢被繼承人存款資料。</li>\n<li>委任辦理繼承須提經公證之委託書或印鑑證明核符之委託書；國外者經駐外機構或海基會驗證。</li>\n<li><b>兩岸繼承</b>：大陸繼承人須於繼承開始起<b>3年內</b>書面向法院為繼承表示，逾期視為拋棄；大陸人民繼承所得財產每人<b>不得逾200萬元</b>（配偶不受限）。</li>\n</ul>\n<h4>籌備處補充</h4>\n<ul>\n<li>籌備處申請人以與本行往來<b>6個月以上</b>既有客戶為原則；一律高風險客戶；帳戶最近半年有交易且餘額大於<b>10萬元</b>應加強聯繫。</li>\n</ul>"},{"id":"dep-s0p2-c1","t":"存款篇 第一章 通則（三）：保密查詢、扣押與洗錢防制","fc":"B","fq":"5年約15題（每年約3題）· B級","h":"<h4>存款之保密與查詢</h4>\n<ul>\n<li>法源：銀行法<b>第48條第2項</b>，對存款、放款、匯款資料應保守秘密。</li>\n<li>具調查權機關（司法、軍法、稅務、監察、審計）依法正式備文查詢。</li>\n<li>法務部調查局查詢須經局長（副局長）審核；警察機關查詢須局長（副局長）判行；列警示帳戶案件得由分局長判行。</li>\n<li>警察偵辦刑案調閱警示帳戶明細應於文到<b>5個營業日</b>內回復。</li>\n<li>稅務機關依稅捐稽徵法<b>第30條</b>查詢，原則須報財政部核准；查欠稅人餘額或核課遺產稅查被繼承人「死亡日」餘額<b>免報財政部</b>。</li>\n<li>律師/會計師查詢存款除經存戶同意外不予答覆。</li>\n<li>個資當事人權利：查詢/閱覽/複製本<b>15日</b>內回覆（得延長15日）；補充更正/刪除/停止利用<b>30日</b>內回覆（得延長30日）。</li>\n<li>存戶查調帳戶明細原則以申請日前<b>15年</b>內為限。</li>\n<li>查詢及扣押回文客戶姓名/身分證字號應<b>隱碼</b>顯示。</li>\n</ul>\n<h4>新一代金融端末系統</h4>\n<ul>\n<li>操作權限四級：一級（單位主管/副主管）、二級（副理）、三級（檢核專員）、四級（經辦/櫃員主任）。</li>\n<li>牽制規範：存款櫃員不得兼「授信」「收息」；<b>會計不得兼辦出納及營業性帳務</b>。</li>\n<li>螢幕未執行交易逾<b>10分鐘</b>自動鎖定。</li>\n<li>端末權限異動月報保存<b>5年</b>；電子日誌報表系統保存<b>15年</b>。</li>\n<li>檢核專員資格：<b>9職等以上</b>且具稽核經歷一年以上；執行檢核當日不得再兼存匯經辦。</li>\n<li>簽到密碼與單一登入整合，每<b>3個月</b>變更。</li>\n</ul>\n<h4>存款之扣押（必考）</h4>\n<ul>\n<li>法源：非依法院裁判或法律規定，不得接受第三人停止給付之請求（銀行法48條）。</li>\n<li>執行命令未表明是否及於將來存款者，一律先視為<b>不及於將來存款</b>。</li>\n<li>金額錯誤或戶名不符，應於接到命令後<b>10日</b>內以書狀向法院聲明異議；餘額不敷亦於10日內陳報。</li>\n<li>扣押時程：實體命令送達時<b>立即</b>辦理；電子公文最遲不得逾<b>次一營業日下午5時</b>。</li>\n<li><b>免扣押帳戶</b>（應聲明異議）：備償專戶、離儲公提專戶、退撫給與專戶、社會救助專戶、員工儲蓄信託帳戶、可轉讓存單、期貨客戶保證金專戶。</li>\n<li>自政府領取之補貼/補助/津貼不得為扣押標的（行政執行法26條準用強制執行法120條3項）。</li>\n<li>解繳扣押手續費<b>每一客戶250元</b>；可扣押金額扣除250元後超過<b>200元</b>始扣押。</li>\n<li>聲明異議法源：強制執行法<b>第115條</b>（扣押）、<b>第119條第1項</b>（聲明異議）。</li>\n<li>集中作業部自收文日起<b>10日（含例假日）</b>內回覆來文機關。</li>\n<li>扣押利息試算：利息計算區間以起始日至回文日再加計<b>3個月</b>概算。</li>\n<li>債權人領款須親至或委任持收取命令正本，開立禁止背書轉讓本行支票，原則不得匯款。</li>\n<li>扣押交易備查表保存<b>15年</b>。</li>\n</ul>\n<h4>空白票據、存單及存摺之保管</h4>\n<ul>\n<li>櫃員主任（含兼任）<b>不得兼辦</b>同業支票、本行支票或存單之填製工作。</li>\n<li>各種存單/支票有存根者簽發時應加蓋騎縫章；作廢單據送<b>非簽發主管</b>覆核。</li>\n</ul>\n<h4>存款業務之洗錢防制（必考）</h4>\n<ul>\n<li>「一定金額」為<b>新臺幣50萬元</b>（含等值外幣）；「通貨交易」指單筆現金收付或換鈔。</li>\n<li>確認客戶身分時機：開戶、達一定金額交易、<b>新臺幣3萬元以上</b>跨境匯款、疑似洗錢申報時等。</li>\n<li>實質受益人：直接/間接持股超過<b>25%</b>之最終自然人；無則辨識控制權自然人，再無則高階管理人員。</li>\n<li>大額通貨交易（達50萬元以上）建檔申報；申報期限<b>5個營業日</b>內（本行第3個營業日媒體申報調查局）。</li>\n<li>提領單筆現金達<b>100萬元</b>以上須詢問資金來源；<b>55歲以上</b>非本人提領大額須填關懷提問。</li>\n<li>免申報範圍：政府機關/公營事業/學校/公用事業存入、金融機構間交易、公益彩券款、經核備之免申報帳戶（百貨/量販/超商/加油站/醫院等，每年審視一次）。</li>\n<li>免申報帳戶年度審視：最近一年存入現金50萬以上未達<b>50筆</b>應註銷。</li>\n<li>疑似洗錢申報：督導主管原則<b>1個月</b>內確認（得延長10天）；核定後<b>2個營業日</b>內向法務部調查局申報。</li>\n<li>交易紀錄憑證保存至少<b>5年</b>。</li>\n<li>資恐制裁對象：婉拒開戶並凍結資產；非本行客戶款項暫列「其他應付款-資恐防制法制裁對象凍結專戶」。</li>\n<li>國內PEPs範圍：總統副總統、五院正副院長、立委、大法官、直轄市縣市首長、駐外大使、<b>編階中將以上</b>等；家庭成員含一親等直系血親或姻親、兄弟姊妹、配偶及其兄弟姊妹。</li>\n<li>AML可疑情境門檻（7日內累計）：一般風險自然人<b>300萬元</b>、高風險自然人<b>150萬元</b>、一般風險法人<b>1,000萬元</b>、高風險法人<b>500萬元</b>。</li>\n<li>ATM可疑表徵：同一金融卡每日提領10萬且連續5日、月累計提領達<b>150萬</b>。</li>\n<li>疑似洗錢續報：模式相同且距前次申報未逾<b>4個月</b>暫免續報。</li>\n<li>辨識四步驟<b>SAFE</b>：Screen、Ask、Find、Evaluate。</li>\n</ul>"},{"id":"dep-s0p3-c1","t":"存款篇 第一章 通則（四）：手續費、警示帳戶與匯款身分確認","fc":"B","fq":"5年約12題（每年約2題）· B級","h":"<h4>臨櫃手續費計收與減免</h4>\n<ul>\n<li>續減戶最近六個月臨櫃手續費累計減免金額，以不逾其顧客往來利益貢獻總計<b>10%</b>為原則。</li>\n<li>支付外部單位費用（開台支付台銀、跨行匯出付財金公司）<b>原則不得減免</b>。</li>\n<li>分行經理授權減免標準：最近六個月顧客往來利益貢獻達<b>10萬元</b>以上；或新臺幣活期性存款實績達<b>50萬元</b>以上且利益貢獻達<b>500元</b>以上。</li>\n<li>經常性減免期限最長<b>1年</b>。</li>\n<li>空白票據減免（利益貢獻級距）：達10萬元500張，每10萬元加500張，上限<b>2,400張</b>。</li>\n<li>身心障礙者ATM跨行提款減免：每人限一帳戶、每月<b>3次</b>。</li>\n<li>現職員工ATM跨行提款每人每月<b>10次</b>免手續費。</li>\n<li>更換戶名/印鑑/負責人或掛失後同時結清帳戶：一律免計收手續費。</li>\n</ul>\n<h4>存匯業務收費標準（必背）</h4>\n<ul>\n<li>跨行匯出匯款：現金匯款每筆200萬元以內收<b>100元</b>，每增100萬元加50元；<b>轉帳匯款每筆200萬元以內收30元</b>，每增100萬元加<b>10元</b>。</li>\n<li>網銀/EDI電子轉帳跨行：200萬元以內30元（優惠10元）。</li>\n<li>ATM跨行提款每筆<b>5元</b>、跨行轉帳/存款每筆<b>15元</b>；個人跨行轉帳<b>500元以下每帳戶每日免1次</b>，501–1,000元每筆10元、1,001元以上每筆15元。</li>\n<li>存摺/印鑑掛失補發、金融卡補換發、票據掛失止付各<b>100元</b>；金融卡重設密碼50元；申請簽發本行支票30元；台支未滿100萬元430元、100萬元以上230元。</li>\n<li>代收一般地區票據每張5元、偏遠地區每張40元。</li>\n</ul>\n<h4>警示帳戶與衍生管制帳戶（必考）</h4>\n<ul>\n<li><b>警示帳戶</b>：法院/檢察署/司法警察機關通報；設定後<b>立即暫停全部交易功能</b>，匯入款項逕退匯。</li>\n<li>重大緊急案件得先電話/傳真通知，應於通知後<b>5個營業日</b>內補公文。</li>\n<li>帳戶餘額未達<b>1,000元</b>者得逕結清銷戶。</li>\n<li><b>警示期限自通報起算逾2年自動失效</b>；得延長<b>以一次及一年為限</b>。</li>\n<li><b>衍生管制帳戶</b>（警示戶開戶人之其他帳戶）：暫停金融卡、網路轉帳及電子支付功能，<b>臨櫃交易不受影響</b>。</li>\n<li>剩餘款轉專戶逾<b>15年</b>無人請求者轉「過期帳收入」；逕結清條件：餘額&lt;1,000元、通報起逾<b>3個月</b>無法聯絡。</li>\n<li><b>告誡戶</b>（違反洗錢防制法）：管制自裁處告誡日起<b>5年</b>，再犯重新起算；晶片金融卡每日轉帳/提領上限各等值<b>1萬元</b>；禁用網銀；得繳公用事業費、稅款；視為高風險。</li>\n<li>警示名單：Z1拒絕開戶（永久）、Z2暫不受理自動化（1年）、Z3疑似交易異常（2年）、Z4其他（2年）、Z6主管機關通報（不得再開戶）、Z8告誡清單。</li>\n<li>警示/衍生管制帳戶原則拒絕開戶，但<b>就業薪轉（提在職證明）、申貸撥款</b>不在此限；限活存/活儲。</li>\n<li>同業照會：受照會者應於<b>5個營業日</b>內提供資訊；照會紀錄保管<b>5年</b>。</li>\n<li>聯防機制：圈存自時點起算逾<b>48小時</b>未接獲警示通報則逕予解除；警察機關應於報案後<b>2小時</b>內派員。</li>\n<li>詐欺犯罪危害防制條例：資料及交易紀錄自業務關係終止時起至少保存<b>5年</b>；司法警察機關接獲通報應於<b>20日</b>內公文通知後續控管。</li>\n</ul>\n<h4>可疑交易態樣門檻</h4>\n<ul>\n<li>一般存提態樣：高風險自然人<b>150萬</b>、一般自然人<b>300萬</b>、高風險法人<b>500萬</b>、一般法人<b>1,000萬</b>。</li>\n<li>每筆略低於門檻現金存提：每筆<b>≤499,999元</b>、7日內累計達門檻。</li>\n<li>「提現為名、轉帳為實」：1日內總支出為總存入<b>90%</b>以內、單筆≥50萬。</li>\n<li>換鈔：單日<b>≥50萬元</b>。</li>\n<li>保管箱：30日內開箱<b>10次以上</b>，或擁有<b>≥3個</b>保管箱。</li>\n</ul>\n<h4>國內匯款及無摺存款確認客戶身分（108/1/1起）</h4>\n<ul>\n<li>適用：新臺幣<b>3萬元以上、50萬元以下（不含）</b>之國內現金匯款、<b>3萬元以上</b>之國內轉帳匯款及無摺存款。</li>\n<li>應留存匯款人/存款人姓名、身分證號及電話（或地址）；代理人辦理應加註代理人姓名及身分證號。</li>\n<li>應請客戶出示身分證明文件核對；認識且留有紀錄之客戶得免出示。</li>\n<li>無摺存款範圍限活期存款、現金交易，<b>不含轉帳交易</b>。</li>\n<li>關懷提問時機：匯款/無摺存入非本人帳戶<b>≥3萬元</b>、年長者臨櫃提現≥3萬元。</li>\n</ul>\n<h4>其他應注意事項</h4>\n<ul>\n<li>重大偶發事件應於案發當日通報總行，一週內轉報；支存戶單張退票金額達<b>1億元</b>以上屬重大偶發事件。</li>\n<li>櫃員付現額度：新臺幣<b>30萬元</b>以內得逕付款；付息額度：存單利息<b>2萬元</b>以內得逕付。</li>\n<li>無摺/無票號轉帳支出逾<b>5萬元</b>須一二三級權限核准。</li>\n<li><b>存款保險：每一存款人本金及利息最高保額新臺幣300萬元（不含OBU存款）</b>。</li>\n<li>櫃員主任、會計、檢核專員不得相互兼任；櫃員主任不得兼ATM經辦。</li>\n<li>臨櫃單筆存入<b>≥100萬元</b>應經主管核准。</li>\n<li>久未往來定義：前次交易日迄今逾<b>6個月</b>以上。</li>\n<li>未領回存摺：逾2個月郵寄、逾<b>6個月</b>得會同會計註銷。</li>\n<li>開戶未滿一年帳戶同日臨櫃支出累計達<b>1,000萬元</b>顯示警示訊息。</li>\n<li>通知指定聯絡人服務：臨櫃單筆<b>≥50萬元</b>定存解約或轉出至非本人帳戶即時簡訊通知；每人限一位聯絡人。</li>\n<li>有效攔阻詐騙獎勵：未達50萬每案1,000元…2,000萬以上20,000元。</li>\n</ul>"},{"id":"dep-s0p4-c1","t":"存款篇 第二章 支票存款","fc":"A","fq":"5年約45題（每年約9題）· A級","h":"<h4>性質</h4>\n<ul>\n<li>支票存款：指定銀行為付款人、將支付事務委託銀行代辦之存款；隨時提取、<b>不計利息</b>；得訂透支契約。</li>\n</ul>\n<h4>開戶手續與票信查詢</h4>\n<ul>\n<li><b>無行為能力人、限制行為能力人及受輔助宣告之人不得開戶</b>；<b>被拒絕往來未經解除者不得開戶</b>。</li>\n<li>分公司應以總公司名義開戶；不具法人人格之行號以負責人名義開戶。</li>\n<li>開戶審核須向<b>臺灣票據交換所</b>查詢票信；<b>票信查詢日距開戶日超過三十日</b>宜重新查詢。</li>\n<li>政府機關憑正式公文開戶，<b>不須再做票信查詢</b>。</li>\n<li>法人與負責人為獨立主體：公司負責人個人拒往，得不受理法人開戶；法人拒往，負責人以個人名義開戶應受理；不具法人格之行號負責人拒往，該行號不得開戶。</li>\n<li>票信查詢：第一類（最近<b>三年</b>退票總張數金額）每筆<b>100元</b>；第二類（加退票明細）每筆<b>200元</b>；第三類語音（最近一年）。</li>\n<li>退票已清償註記及拒往提前解除<b>滿六個月</b>者不再提供查詢。</li>\n<li>開戶初存額<b>伍仟元</b>；新開戶首次申領空白票據最多<b>25張</b>。</li>\n<li>開戶後變更負責人或久未往來戶申領空白票據，應於變更後<b>兩週內</b>再次實地查訪。</li>\n</ul>\n<h4>記帳</h4>\n<ul>\n<li>存入單筆達<b>100萬元</b>應經主管核准。</li>\n<li>付款人付款時對執票人是否為票據權利人不負認定之責（票據法71條，惡意或重大過失除外）。</li>\n<li>支票付現應請執票人於背面背書（票據法74條）。</li>\n<li>自然人死亡後其生前簽發之支票，因委任關係消滅<b>應拒絕付款</b>；法人負責人死亡未更換前仍應付款。</li>\n<li>櫃員付現額度<b>30萬元</b>。</li>\n<li>交換票據次一營業日收妥入帳；抵用息利率為央行擔保放款融通利率＋<b>0.5%</b>。</li>\n</ul>\n<h4>票據之審核（票據法核心）</h4>\n<ul>\n<li>支票絕對必要記載事項（票據法125條）：表明支票文字、一定金額、付款人、無條件支付委託、發票年月日、發票人簽章（受款人、發票地、付款地為相對記載）。</li>\n<li><b>票據金額大寫與小寫不符時，以大寫（文字）為準</b>（票據法7條）。</li>\n<li><b>大寫金額不得變更，改寫者不得付款</b>（票據法11條）；小寫更改與大寫相符並經原留印鑑證明可照付。</li>\n<li>其他記載更改須於更改處由發票人簽蓋原留全式印鑑。</li>\n<li><b>票載發票日前執票人不得為付款提示</b>（遠期支票，票據法128條2項），違者以「票據未到期」退票。</li>\n<li>曆法上無之日期（如2月30日）以該月末日為發票日。</li>\n<li><b>票據時效（票據法22條）：匯票承兌人、本票發票人自到期日起3年；對支票發票人自發票日起1年</b>。</li>\n<li><b>提示期限（票據法130條）：發票地與付款地同一省（市）7日內；不同省市15日內；發票地在國外2個月內</b>（發票日後起算）。</li>\n<li>逾期提示：對發票人以外之前手喪失追索權；付款人期限經過後仍得付款，但撤銷付款委託或發行滿一年者除外（136條）。</li>\n<li>本票、匯票提示期限：到期日或其後<b>二日內</b>；本票未載到期日視為見票即付，提示期間<b>發票日起六個月內</b>。</li>\n<li>不得辦理支票部分支付；提付交換票據金額計算至「元」。</li>\n</ul>\n<h4>平行線支票</h4>\n<ul>\n<li><b>普通平行線：付款人僅得對金融業者支付</b>（票據法139條）。</li>\n<li>撤銷普通平行線：發票人於線內記載「照付現款」並簽蓋原留印鑑；<b>經背書轉讓者不予照付現金</b>。</li>\n<li><b>特別平行線（線內記載特定金融業者）：僅得對該特定金融業者支付，不得撤銷</b>。</li>\n<li>本票及匯票劃平行線之記載<b>不生票據上效力</b>，提示可照付現款。</li>\n</ul>\n<h4>背書之審核</h4>\n<ul>\n<li>記載受款人之支票應由受款人背書；背書分記名背書、空白背書。</li>\n<li>背書附條件者條件視為無記載（36條）；到期日後背書僅有通常債權轉讓效力（41條）。</li>\n<li>「書柬、便章、回單」等字樣圖章背書無效；「統一發票專用章」不具背書效力；鉛字條戳、電腦列印背書無效。</li>\n<li><b>背書之連續</b>：自受款人至最後被背書人形式上相連續；不連續者不得付款；空白背書時其次之背書人視為前空白背書之被背書人（37條）。</li>\n<li><b>禁止背書轉讓</b>：發票人於正面記載並於記載下簽章始生效力；記名式票據票背有二個以上背書時以「記名票據禁止背書轉讓經轉讓」退票。</li>\n<li>背書人記載禁止轉讓者，仍得依背書轉讓，但對禁止後再取得之人不負責任（30條）。</li>\n<li>委任取款背書：票背記載「票面金額委託○○○取款」，共同簽章並核對受款人身分。</li>\n</ul>\n<h4>掛失止付</h4>\n<ul>\n<li>前提：票據未經兌付、未經保付、存戶未經拒往；<b>已兌付、已保付之票據不得掛失止付</b>。</li>\n<li>通知止付人應於掛失止付後<b>五日內</b>提出已聲請<b>公示催告</b>之證明，否則止付失效。</li>\n<li>買賣交貨糾葛不得受理止付；持票人惡意取得應依假處分程序。</li>\n<li>止付票據提示：足敷者以「經掛失止付」退票；不敷者以「存款不足及票據經掛失止付」退票。</li>\n<li>空白票據掛失：免止付金額留存、未經提示前免聲請公示催告；連號一次最多<b>50張</b>。</li>\n<li>掛失手續費<b>100元</b>；非「遺失、被竊、搶奪」理由者票交所加收違約金<b>1,000元</b>。</li>\n<li>止付留存款逾<b>十五年</b>得轉入雜項收入。</li>\n</ul>\n<h4>透支</h4>\n<ul>\n<li>透支利息按<b>每日最高透支餘額</b>計算積數；每月<b>二十日</b>結算扣帳。</li>\n<li>逾期透支另加收違約金；透支戶轉列催收後原帳戶停止交易。</li>\n</ul>\n<h4>票據退票</h4>\n<ul>\n<li><b>支票退票理由單具有與作成拒絕證書相同之效力</b>（票據法131條）。</li>\n<li>自然人生前簽發支票提示，不論足敷與否以「發票人死亡」退票；法人負責人死亡有足額照付。</li>\n<li>警示帳戶票據一律以「99其他（暫停交易）」退票。</li>\n<li>單張退票金額達<b>1億元</b>以上應立即通報。</li>\n<li><b>存款不足退票違約金每張200元</b>（票交所150元、本行50元）。</li>\n<li><b>清償贖回註記</b>：發票人自退票次日起<b>三年內</b>清償贖回，經註記後不列計拒往張數。</li>\n<li>提存備付註記：退票次日起三年內一次提足票款；備付票款留存滿<b>三年</b>未重提辦備付期滿註記；留存滿<b>十五年</b>轉雜項收入。</li>\n<li>註記手續費每張<b>150元</b>。</li>\n</ul>\n<h4>拒絕往來</h4>\n<ul>\n<li><b>一年以內因「存款不足」「發票人簽章不符」「擅自指定金融業者為本票擔當付款人」退票，未經清償註記各達三張者，通報拒絕往來；拒往期間自通報日起算三年</b>（各款分別計算不併計）。</li>\n<li>使用票據涉犯罪經判刑確定者亦通報拒往。</li>\n<li>公司更名前後、改組前後之退票紀錄應<b>合併計算</b>。</li>\n<li>拒往戶餘額轉「其他應付款—拒絕往來戶存款專戶」；專戶款逾<b>十五年</b>轉什項收入。</li>\n<li>恢復往來：拒往期間（三年）屆滿或經解除後得受理。</li>\n<li>公司經改組增資或法院裁定重整者，得申請<b>暫予解除</b>拒往；暫解後再有存款不足退票未註記者，自再通報日起拒往三年。</li>\n</ul>\n<h4>支票之保付</h4>\n<ul>\n<li>付款人保付後付款責任<b>與匯票承兌人同</b>，發票人及背書人免除責任（票據法138條）。</li>\n<li><b>經保付之支票</b>：不得掛失止付（不適用18條）、不適用130條提示期限及136條規定——發票人不得撤銷付款委託，<b>發票日超過一年仍得照付</b>。</li>\n<li>保付支票喪失應向法院聲請公示催告及禁止支付命令。</li>\n</ul>\n<h4>擔當付款本票及承兌匯票</h4>\n<ul>\n<li>委託本行為擔當付款人須填申請書，否則以「未受委託擔當付款人」拒付；應使用本行印製本票。</li>\n<li>未到期本票不得付款；提示期限為到期日或其後<b>二日內</b>。</li>\n<li><b>平行線規定不適用本票及匯票</b>。</li>\n</ul>\n<h4>撤銷付款之委託</h4>\n<ul>\n<li><b>支票：發票人於法定提示期限內不得撤銷付款委託</b>（135條），期限經過後得申請。</li>\n<li>不得受理撤銷：保付支票、止付未失效票據、已兌付票據、發票人已拒往。</li>\n<li><b>本票：撤銷付款委託無須俟提示期限經過</b>（本票發票人負絕對付款責任）。</li>\n<li>「本票提示期限經過前撤銷付款委託」退票未註記<b>一年內達三張</b>者，終止擔當付款契約<b>三年</b>。</li>\n</ul>\n<h4>假處分支票</h4>\n<ul>\n<li>原票據權利人得依<b>假處分</b>程序聲請法院禁止占有票據之人請求付款（票據法施行細則4條）。</li>\n<li>須為民事執行處<b>執行命令</b>方得辦理（民事裁定效力不及本行）。</li>\n<li>被禁止提示人提示以「經法院禁止提示票據」退票；非被禁止提示人得付款。</li>\n</ul>\n<h4>靜止戶／久未往來</h4>\n<ul>\n<li>支存戶自上次交易日起算<b>三年</b>無往來，於6/15、12/15註記「久未往來戶」。</li>\n<li>久未往來戶恢復申領空白票據須查驗身分及票信。</li>\n</ul>\n<h4>空白票據之保管核發</h4>\n<ul>\n<li>應停止或減發：存款被扣押、登記資料與本行不一致、曾存款不足退票。</li>\n<li>無授信往來且回籠率（最近三年累計）未達<b>7成</b>者，須再實地查訪並呈經理核准。</li>\n<li>空白票據簿逾<b>三個月</b>未領取，通知仍未領者月底註銷銷毀。</li>\n</ul>\n<h4>本行支票</h4>\n<ul>\n<li>本行支票以本行為付款人，以庫存現金及存放央行存款為十足付款準備。</li>\n<li>每筆申請簽發金額以<b>2萬元以上</b>為原則；達<b>100萬元以上</b>應填檢核表（政府機關、上市櫃等免填）。</li>\n<li><b>本行支票應記載受款人並加劃平行線</b>。</li>\n<li>簽發屆滿<b>一年以上</b>未付款者轉入「其他應付款」備付，執票人得以<b>利得償還請求書</b>請求取款；逾<b>十五年</b>轉過期帳收入。</li>\n</ul>\n<h4>其他</h4>\n<ul>\n<li>支存戶得申請「存款不足訊息通知」，提回票據當日上午11:30扣帳後通知。</li>\n</ul>"},{"id":"dep-s0p5-c1","t":"存款篇 第三章 銀行同業及公庫存款","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>銀行同業存款</h4>\n<ul>\n<li>往來對象限：本國一般銀行、外國銀行在台分行、信用合作社、農漁會信用部、中華郵政（不含壽險部門）。</li>\n<li>信託投資公司、保險公司、票券/證券金融公司之存款應以「一般存款」整理（<b>非同業存款</b>）。</li>\n<li>銀行同業存款之利息<b>依法免代扣所得稅</b>。</li>\n<li>同業存款帳戶一律設「逕發」餘額核對單戶，<b>按月</b>寄發核對單（指定非經辦人員辦理），回單保存<b>一年</b>。</li>\n</ul>\n<h4>公庫存款</h4>\n<ul>\n<li>公庫：中央為國庫（主管財政部）、市庫、縣庫、鄉鎮庫。</li>\n<li>機關專戶印鑑卡須由<b>機關首長、主辦會計、主辦出納分別留存簽章，不得由同一人兼辦</b>。</li>\n<li>國庫機關專戶對帳單裝訂保存<b>至少十年</b>；機關專戶網銀轉帳<b>不得約定為無限額</b>。</li>\n<li>兌付國庫機關專戶支票單筆提現達<b>50萬元以上</b>須確認身分並辦大額通貨申報。</li>\n<li>國庫款不計息帳戶，每月應依上月平均餘額<b>60%</b>轉存中央銀行。</li>\n<li>兌付國庫支票每筆達<b>1,000萬元以上</b>應即電知總行營業部。</li>\n<li>國庫收支連線系統營運時間：週一至週五<b>8:30至17:00</b>；相關報表保存<b>5年</b>。</li>\n<li>機關專戶之<b>經費款及零用金款帳戶不得計息，亦不得設定期性存款帳戶</b>。</li>\n<li>機關專戶定存中途解約：<b>7日前</b>通知，按存入當日牌告利率<b>單利八折</b>；未滿一個月不計息。</li>\n</ul>"},{"id":"dep-s0p5-c2","t":"第四章 活期存款","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<ul>\n<li>當日最終餘額<b>未達1萬元不予計息</b>；開戶初存額<b>5仟元</b>（薪轉戶、證券戶等免初存額）。</li>\n<li>本人未臨櫃提現以<b>50萬元為限</b>，逾此須經理同意；無摺支出後促請客戶<b>七日內</b>補登存摺。</li>\n<li>結息：每半年一次，上半年<b>12/21計至6/20</b>、下半年<b>6/21計至12/20</b>；利息＝利率×總積數÷365。</li>\n<li>郵寄結清銷戶餘額<b>不超過10萬元</b>；線上結清限餘額<b>不超過5萬元</b>；掛失印鑑同時結清餘額低於<b>5萬元（含）</b>免照會原開戶行。</li>\n<li>補摺資料系統自動保存<b>3個月</b>；嚴禁存摺內頁人工填寫或黏貼。</li>\n<li>靜止戶（舊制）：結存<b>未滿5仟元</b>且過去1年無存提者轉列（活儲未滿1仟元）；102年起改為逾<b>2年</b>無往來轉「久未往來戶」。</li>\n<li>靜止戶逾<b>十五年</b>款項不得再轉列雜項收入。</li>\n<li>取款憑條所填日期在領款日前<b>7天以內</b>可付款。</li>\n<li>空白取款憑條保管逾<b>2個月</b>未領回得作廢註銷。</li>\n</ul>"},{"id":"dep-s0p5-c3","t":"第五章 活期儲蓄存款","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<ul>\n<li><b>開戶對象限自然人及非營利法人、團體</b>（未取得法人資格之團體須先申請免稅證明）。</li>\n<li>起息點<b>1萬元</b>；開戶初存額<b>1仟元</b>。</li>\n<li>薪資劃撥轉帳活儲：每人限開<b>一戶</b>（性質別38）；存款餘額<b>100萬元（含）以下</b>依薪轉牌告利率，超過部分按一般活儲利率；每月<b>21日</b>付息。</li>\n<li>停職或離職，委託人應於<b>1個月內</b>通知變更為一般戶；連續二個月無薪資入帳由系統變更為一般戶。</li>\n<li>鼓勵公教人員儲蓄：每月最高儲蓄額職員<b>1萬元</b>、工友<b>5千元</b>；最高限額職員<b>70萬元</b>、工友<b>35萬元</b>；按<b>二年期定儲利率</b>機動計息。</li>\n</ul>"},{"id":"dep-s0p5-c4","t":"第六章 存摺存款全行收付","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>本行存摺存款戶（<b>不含自由儲蓄存款、同業存款</b>）可在全行辦理存款；申請全行代付款後可跨行取款。</li>\n<li>取款碼一律<b>四位阿拉伯數字，不得皆為零</b>；連續輸入錯誤達<b>三次</b>電腦自動停止憑摺付款。</li>\n</ul>"},{"id":"dep-s0p5-c5","t":"第七章 無摺存款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>適用活存、活儲、行員活儲；<b>不另發存摺</b>，憑無摺取款碼取款，定期寄發交易清單對帳。</li>\n<li>當日存入<b>單筆達100萬元以上</b>須主管核准。</li>\n<li>取款碼連續錯誤<b>3次</b>停止付款。</li>\n</ul>"},{"id":"dep-s0p5-c6","t":"第八章 機關學校聘僱人員離職儲金存款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>以存款單位名義開<b>綜合存款總戶1戶</b>；每一聘僱人員開<b>活儲2戶</b>（公提、自提各1戶），分戶不留印鑑、不發存摺。</li>\n<li>依<b>定儲一年期機動牌告利率</b>計息；每半年（6/20、12/20）結息。</li>\n<li><b>分戶儲金不得部分提款</b>；離職（死亡）時公自提帳戶一併結清，存款單位應於<b>一個月內</b>提領，逾期扣回溢付利息。</li>\n<li>聘僱人員每月按報酬<b>12%</b>提存儲金，自提、公提各<b>50%</b>。</li>\n<li>請領時效自離職或死亡次日起<b>十年</b>。</li>\n</ul>"},{"id":"dep-s0p5-c7","t":"第九章 行員儲蓄存款","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<ul>\n<li>含行員活儲及行員定儲，每人各限<b>一戶</b>；每月<b>20日</b>結息。</li>\n<li>行員活儲最高限額<b>48萬元</b>；超額至100萬元內依薪轉活儲利率、逾100萬元照活儲利率。</li>\n<li>行員定儲限<b>二年期以上存本取息</b>，最低<b>1萬元</b>。</li>\n<li>民營化前退休人員退休金專戶：<b>500萬元以內</b>優惠利率，超過依活儲利率。</li>\n<li>民營化後退休金：服務年資一年1個基數，每基數<b>15萬元</b>，最高<b>40個基數</b>；專戶依<b>上月21日定儲最高利率加3%</b>固定計息。</li>\n<li>退休金專戶已提取款項<b>不得再回存</b>；利息不得滾入本專戶。</li>\n<li>退休人員行員儲蓄存款得存續至<b>身故後第一次結息日</b>止。</li>\n<li>離職人員行員儲蓄存款應於任免生效當日結清。</li>\n<li>綜合存款質借利率為<b>存單利率加1.5%</b>。</li>\n</ul>"},{"id":"dep-s0p6-c1","t":"存款篇 第十章 定期存款","fc":"B","fq":"5年約12題（每年約2題）· B級","h":"<ul>\n<li>存期最短<b>1個月</b>，以1個月倍數訂期或自選到期日；存期<b>2個月以上</b>者得每月領息。</li>\n<li>最低存入額<b>5千元</b>。</li>\n<li>到期日：自存款日起次1個月或其倍數之<b>相當日</b>；<b>無相當日時以該月末日為到期日</b>；相當日遇假日仍以該日為到期日。</li>\n<li>帳戶資料於全部解約後保留<b>5年</b>，再存入可沿用。</li>\n<li>定存作業權限：個人戶每日累計<b>500萬(不含)以下</b>、非個人戶<b>5,000萬(不含)以下</b>經理權限；存期超過<b>3年</b>、金融機構存入須逐案申請。</li>\n<li>經核准之大額定存<b>不得辦理自動轉期</b>。</li>\n<li>每筆存單每次領息未逾<b>2萬元</b>可逕由經辦核付。</li>\n<li>利息支付現金或轉入非本人帳戶，按利息代扣<b>千分之四印花稅</b>。</li>\n<li>到期日逢假日：次營業日提取按存單利率給假日利息；第2營業日提取假日給存單利率、第1天後按活期利率給逾期息。</li>\n<li>自動轉息帳戶<b>1年以上</b>無往來，電腦自動清除轉入帳號。</li>\n<li>自動轉期申請期限：定存到期後<b>未逾1個月</b>、定儲<b>未逾2個月</b>；轉期新利率為轉存日牌告利率。</li>\n<li><b>中途解約：應於7日前通知，須全部一次結清；未滿1個月不計息；滿1個月以上按實存期間對應牌告利率八折單利計算</b>。</li>\n<li>不得以免打8折方式鼓勵客戶申購信託/保險。</li>\n<li><b>逾期提取：逾期期間按提取日活期存款牌告利率單利計算</b>。</li>\n<li><b>逾期續存：逾期1個月以內可自原到期日起息</b>（利息併入本金）；逾1個月須先結清重存。</li>\n<li>質權設定：存戶與質權人聯名填質權設定通知書；分含息設質與不含息設質。</li>\n<li>質借人限<b>原存款人</b>；質借期限不得超過原存單到期日；質借成數在面額內斟酌。</li>\n<li>存單本利和達<b>300萬(含)</b>將適用大額利率（通知客戶）。</li>\n<li>質權設定及法院扣押存單不得辦理移存。</li>\n<li>存期<b>3個月以上</b>之機關/公司定存至少抄送對帳單1次；對帳單不含可轉讓定存單。</li>\n</ul>"},{"id":"dep-s0p6-c2","t":"第十一章 定期儲蓄存款","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<ul>\n<li><b>存期1年以上</b>，以優惠利率計息；<b>對象限個人或非營利法人</b>（與定存關鍵區別）。</li>\n<li>最低<b>5千元</b>（零存整付每次<b>1千元</b>以上）。</li>\n<li><b>零存整付</b>：按月存入、複利計息、到期領本息；公式 P(1+i)^n。</li>\n<li>零存整付逾期存款：<b>逾期3日以內免補利息</b>；逾期4日須補4天利息；<b>逾期6個月以上以停儲論</b>。</li>\n<li><b>整存整付</b>：一次存入、按月複利、到期一次領本息；存單列印<b>實存本金</b>。</li>\n<li><b>存本取息</b>：一次存入、存滿1個月後按月領息、到期領本金；每月利息＝本金×年利率÷12。</li>\n<li>外籍人士定儲期間不得逾居留證有效期限，且<b>不得申請自動轉期</b>。</li>\n<li>逾期續存轉存<b>1年以上</b>定儲/定存：<b>逾期2個月以內</b>自原到期日起息；轉存未滿1年定存：<b>逾期1個月以內</b>自原到期日起息。</li>\n</ul>"},{"id":"dep-s0p6-c3","t":"第十二章 機動利率定期儲蓄存款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>適用定期存款、存本取息及整存整付；遇利率調整自調整日起按新利率計息。</li>\n<li>選定機動後<b>中途不得變更為固定利率</b>。</li>\n<li>整存整付：調整前按舊利率複利計出之本息作為調整後計息本金。</li>\n</ul>"},{"id":"dep-s0p6-c4","t":"第十三章 特種定期儲蓄存款","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>分特種整存整付及特種存本取息；期限<b>2年以上</b>，<b>不得指定到期日</b>。</li>\n<li>利息<b>按月複利、每存滿1年給付1次</b>；特種整存整付自動滾入本金（<b>最後1年利息不滾入</b>）。</li>\n</ul>"},{"id":"dep-s0p6-c5","t":"第十四章 購屋儲蓄存款","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>存款滿<b>6個月</b>後得申請購屋儲蓄放款；定儲方式最短<b>1年</b>，到期前不得中途解約但得質借。</li>\n<li>定儲到期提清者應於<b>提清後半年內</b>提出貸款申請。</li>\n</ul>"},{"id":"dep-s0p6-c6","t":"第十五章 自由儲蓄存款","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>約定期間內隨時存入（以千元為單位），到期一次提本息；按每次存入時<b>1年期定儲固定利率</b>計息。</li>\n<li><b>自2025/5/28起停止受理新開戶</b>，僅受理到期解約。</li>\n</ul>"},{"id":"dep-s0p6-c7","t":"第十六章 可轉讓定期存單（NCD）","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<ul>\n<li>面額以<b>10萬元為單位按倍數</b>發行（10萬~1億元共7種）。</li>\n<li>存期<b>最短1個月、最長不逾1年</b>；<b>不得中途提取或變更契約</b>。</li>\n<li><b>利息按分離課稅</b>：境內居住個人扣繳後不再併計綜合所得（居住者10%、非居住者15%）。</li>\n<li>分<b>記名式與無記名式</b>，均得自由轉讓；記名式以<b>背書</b>方式轉讓，轉讓後無需向本行過戶。</li>\n<li>掛失止付：向原開戶行辦理（免登報），未於止付後<b>5日內</b>提出公示催告聲請證明者止付無效；俟<b>除權判決</b>後補發。</li>\n<li><b>逾期提取自逾期之日起停止計息</b>（與一般定存活期利率逾期息不同）。</li>\n<li><b>不宜核發存款餘額證明書</b>。</li>\n</ul>"},{"id":"dep-s0p6-c8","t":"第十七章 綜合存款","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<ul>\n<li>活存/活儲＋定存/定儲＋擔保放款納入一本存摺；<b>不得轉讓或對外質押</b>。</li>\n<li>存入定儲存不另簽發存單，由本行設定質權。</li>\n<li>起存額：活存5千、活儲1千、定儲存<b>1萬元</b>；活期餘額未達<b>1萬元</b>不計息。</li>\n<li><b>質借額度為定儲存金額之9成</b>；擔放利息依<b>存單利率加1.5%</b>計息。</li>\n<li>償還順序：由<b>最高利率之質借款項依序償還</b>。</li>\n<li>電子化通路活轉定每帳戶每月累計限額<b>300萬元</b>。</li>\n<li>透支利息滾入超過額度且通知後<b>2個月</b>未清償，本行得解約定儲存清償。</li>\n<li>每月<b>20日</b>計透支利息。</li>\n<li>中途解約<b>100萬(含)以下</b>由經辦確認意願，逾100萬由主管確認。</li>\n</ul>"},{"id":"dep-s0p6-c9","t":"第十八章 金如意綜合管理帳戶","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>整合新臺幣綜存、外匯綜存及信託基金為單一帳戶，一本存摺<b>五種業務</b>；每人以開立<b>一戶</b>為原則。</li>\n<li>對象：本國國民或已取得居留權外國人；<b>受監護/輔助宣告者不得開立</b>。</li>\n<li>已取得居留權外國人之綜存存單一律「不質借」。</li>\n<li>開戶人員資格：經辦須具信託業務人員資格及<b>3個月以上</b>外匯經歷；主管須<b>6個月以上</b>。</li>\n<li>線上結清銷戶條件：各幣別活期餘額併計<b>不超過5萬元</b>且定存、基金為零。</li>\n<li>結清銷戶順序：信託基金→外匯活存→活儲。</li>\n</ul>"}]},{"t":"會計篇（20260325 版，共 9 章＋附錄）","chs":[{"id":"dep-s1p0-c1","t":"會計篇 第一章 總則","fc":"B","fq":"5年約15題（每年約3題）· B級","h":"<h4>會計事務基本認識</h4>\n<ul>\n<li>會計經辦以<b>權責發生制</b>為基礎辦理月、結、決算；明細分類帳餘額應與總分類帳餘額核對一致。</li>\n<li>傳票帳表數字以占格內<b>三分之二</b>為標準；<b>不得以可擦拭筆</b>填寫；誤劃以紅筆「×」註銷。</li>\n<li>傳票帳表製記完畢應<b>換人覆核</b>；覆核未更正錯誤者與原製記人負<b>連帶責任</b>。</li>\n</ul>\n<h4>會計項目及記帳</h4>\n<ul>\n<li>會計項目代碼採<b>三級五碼</b>，分七大類：資產(1)、負債(2)、權益(3)、收益(4)、費損(5)、表外資產(8)、表外負債(9)。</li>\n<li><b>收益及費損類屬虛帳戶（損益帳戶）</b>，期末結轉「本期損益」；其餘為<b>實帳戶</b>自動結轉下期。</li>\n<li>FCD代號共<b>九碼</b>（申報主管機關用）；ICD代號共<b>五碼</b>（國內帳務用）。</li>\n<li>會計項子分戶之建檔、結清僅<b>會計人員</b>得執行。</li>\n<li>折舊採平均法，<b>未滿一個月以一個月計</b>；電腦軟體攤銷年限<b>三年</b>；租賃權益改良按租賃期限（<b>逾五年以五年計</b>）。</li>\n<li>應付款項逾請求權時效（<b>十五年</b>）無人請求者轉「其他什項收入－過期帳收入」；掛失止付留存款滿十五年仍不宜轉入。</li>\n<li>「整理訖債務登記簿」<b>永久保存</b>。</li>\n</ul>\n<h4>會計憑證（必考）</h4>\n<ul>\n<li>會計憑證分<b>原始憑證</b>（證明事項經過）及<b>記帳憑證</b>（證明處理人員責任）。</li>\n<li>原始憑證分三類：<b>外來憑證、內部憑證、對外憑證</b>。</li>\n<li>記帳憑證（傳票）五類：<b>複式轉帳傳票、現金收入傳票、現金支出傳票、轉帳收入傳票、轉帳支出傳票</b>。</li>\n<li>非依合法原始憑證不得造具記帳憑證，非依合法記帳憑證不得入帳（整理結算調整事項除外）。</li>\n<li>同一交易借貸方傳票「主管」欄應由<b>同一人</b>蓋章。</li>\n<li><b>現金收入傳票經收妥後不得聲請作廢退款</b>，需改正時列入「其他應付款」處理。</li>\n<li>傳票繕寫錯誤當時發現：劃<b>紅線二道</b>註銷更正、蓋章；<b>金額及戶名錯誤者應重新製票</b>，不得挖補擦刮。</li>\n<li>錯帳未當日沖正而更正者，原錯誤傳票以<b>紅字</b>註明更正事由。</li>\n<li>傳票遺失依明細帳再製，以紅字註明「再製」。</li>\n<li>傳票最遲應於<b>記帳日後七個營業日內</b>完成裝訂入庫；<b>保管期限至少十五年</b>。</li>\n<li>故意使會計憑證、帳簿報表滅失毀損者，依商業會計法處<b>五年以下</b>有期徒刑、拘役或科/併科<b>六十萬元以下</b>罰金。</li>\n<li>熱感應紙原始憑證應影印一份併同保存。</li>\n</ul>\n<h4>會計帳簿及報表</h4>\n<ul>\n<li>帳簿分三類：<b>序時帳簿</b>（日記簿，以訂冊傳票代替）、<b>分類帳簿</b>（總分類帳、明細分類帳）、<b>備查簿</b>。</li>\n<li><b>總分類帳</b>為編製會計報表之根據，以日計表替代。</li>\n<li>明細分類帳各帳戶餘額之和應等於總分類帳統制項目同日餘額。</li>\n<li>會計報表分日報、月報、季報、半年報、年報；<b>日報當日發送、月報五日內送達</b>。</li>\n<li>各部門帳簿報表應於裝訂後<b>二個月內</b>送會計入庫。</li>\n</ul>"},{"id":"dep-s1p0-c2","t":"第二章 櫃員制結帳單位之日常會計事務處理","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<ul>\n<li>帳務三大來源：<b>臨櫃帳務、中心主機帳務、自動化服務設備帳務</b>。</li>\n<li>櫃員制以<b>櫃員為單位</b>結帳；日終分行僅辦臨櫃結帳，夜間由資訊處彙總全分行結帳。</li>\n<li>設<b>業務暫存帳戶（業務TA）</b>作為櫃員間軋平橋樑，日終各業務TA餘額應<b>歸零</b>。</li>\n<li>中心及自動化帳務<b>毋需編製傳票</b>。</li>\n<li>指派覆核同一櫃員期間<b>最長不得逾三個月</b>；「覆核人員指派登記簿」保存<b>五年</b>。</li>\n<li>結帳程序：盤點現金→檢視轉帳餘額歸零→核算傳票→轉帳結帳設定→傳票覆核→送會計。</li>\n<li>傳票排列：<b>複式轉帳傳票排列於單式傳票前</b>。</li>\n<li>覆核人員應於<b>營業當日</b>核算傳票金額、張數與彙總查詢單相符。</li>\n<li>當日無法結平：差額以（借）<b>其他應收款－未及結帳待清查款項</b>或（貸）其他應付款先行結帳，<b>次營業日查明歸墊</b>。</li>\n<li>現金短缺列「其他應收款－現金短缺專戶」，剩餘列「其他應付款－現金剩餘專戶」。</li>\n<li>虛擬櫃員：票據櫃員、聯往櫃員、後送櫃員、櫃員主任。</li>\n</ul>"},{"id":"dep-s1p0-c3","t":"第三章 項目制結帳單位之日常會計事務處理","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>項目制以<b>會計項目為單位</b>結帳，日終須辦理全部帳務結帳；<b>所有交易均應編製傳票</b>。</li>\n<li>庫存現金會計項目日結單由<b>出納部門</b>編製。</li>\n<li>會計項目日結單本日餘額公式：<b>資產及費損類＝前日餘額＋借方－貸方；負債、權益、收益類＝前日餘額＋貸方－借方</b>。</li>\n<li>會計人員應於營業當日結平帳務，未及結平以「未及結帳待清查款項」先結帳次日歸墊。</li>\n<li>期底最後一營業日加作「會計期底結帳」，收支類項目餘額自動轉入「本期損益」並歸零。</li>\n<li>傳票依資產、負債、權益、收入、支出五大類分類裝訂，代替日記簿。</li>\n</ul>"},{"id":"dep-s1p0-c4","t":"第四章 月算、結算及決算","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<h4>月算</h4>\n<ul>\n<li>月算目的：依<b>權責發生基礎</b>每月計算損益一次，<b>以月終為月算日</b>。</li>\n<li>應收/應付利息提存：前月底提存餘額回轉歸零，再辦本月底提存；平時收付逕以利息收入/費用入帳。</li>\n<li>不動產設備按月提列折舊（未滿一月以一月計）；兌換損益按資產負債表日臺灣銀行匯率折算。</li>\n</ul>\n<h4>結算</h4>\n<ul>\n<li>每會計年度分上下兩期：<b>上期以6月30日、下期以12月31日為結算日</b>（遇例假日仍以該日為結算日）。</li>\n<li>結算前：核對明細帳與總帳、清理懸記帳項、<b>期底聯行往來不得有未達帳</b>。</li>\n<li><b>結轉損益：收入支出類項目餘額於結算日不必經過傳票，轉入「本期損益」；次期開始日改用「上期損益」結轉總部</b>。</li>\n</ul>\n<h4>決算</h4>\n<ul>\n<li>會計年度採<b>曆年制（1月1日至12月31日）</b>，年度終了辦理決算。</li>\n<li>決算報表以年計表、損益年報、營業費用年報替代。</li>\n</ul>"},{"id":"dep-s1p0-c5","t":"第五章 會計事務之管理","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<h4>會計人員之派任</h4>\n<ul>\n<li>資格：<b>五職等以上</b>正式行員任職滿一年以上、曾經辦存款及匯兌業務、經證照檢定或升等實務測驗合格。</li>\n<li>接任人員應於接任日起<b>七個營業日內</b>完成線上教育訓練。</li>\n<li><b>覆核人員不得辦理本身及兼辦事務之覆核</b>；會計兼辦其他職務<b>不得涉及出納事務及營業性帳務</b>。</li>\n<li>出納事務＝現金及有價證券之收付保管；營業性帳務＝存放款、匯兌、外匯、信託帳務。</li>\n<li>會計得兼辦保管箱、總務、票據/聯往/後送櫃員結帳（<b>不得兼辦櫃員主任結帳</b>）。</li>\n</ul>\n<h4>懸記帳項之控管</h4>\n<ul>\n<li>積極清理應收、應付、預收、預付懸記帳項；未及結帳待清查款項<b>次營業日</b>清理歸墊。</li>\n<li>懸帳控管日報每日呈核至經理。</li>\n</ul>\n<h4>零用週轉金</h4>\n<ul>\n<li>零用金動支採<b>實報實銷制</b>；定額零用金檢核：<b>庫存金額＋原始憑證金額＝核配定額</b>。</li>\n</ul>\n<h4>其他</h4>\n<ul>\n<li>副主管每月抽查傳票覆核作業；「副理每月抽查記錄表」保存<b>二年</b>。</li>\n<li>營業稅印花稅申報文件專卷保管<b>至少五年</b>。</li>\n</ul>"},{"id":"dep-s1p1-c1","t":"會計篇 第六章 所得稅、營業稅、印花稅實務","fc":"B","fq":"5年約15題（每年約3題）· B級","h":"<h4>所得稅扣繳（必考）</h4>\n<ul>\n<li>應扣繳所得：薪資、利息、租金、佣金、中獎獎金、結構型商品所得、執行業務者報酬。</li>\n<li><b>居住者扣繳率</b>：佣金/租金/執行業務報酬/各種利息/結構型商品所得均<b>10%</b>。</li>\n<li><b>非居住者扣繳率</b>：佣金/租金/執行業務報酬<b>20%</b>；利息<b>20%</b>；短期票券/證券化受益證券/公債公司債金融債/附條件交易利息<b>15%</b>；結構型商品所得<b>15%</b>。</li>\n<li><b>免扣繳門檻：居住者每次應扣繳稅額不超過2,000元免予扣繳</b>；分離課稅項目（短期票券、債券利息、結構型商品）<b>不適用</b>2,000元免扣。</li>\n<li>軍公教退休金優惠存款利息<b>免扣繳</b>。</li>\n<li>繳納期限：居住者<b>每月10日前</b>繳上月扣稅；非居住者<b>代扣之日起10日內</b>繳清。</li>\n<li>扣繳憑單：<b>每年1月底前</b>開具彙報；經稽徵機關納入查詢服務者得<b>免填發</b>憑單（納稅義務人要求仍應填發）。</li>\n<li>活期性存款結息日<b>6/21、12/21</b>；扣繳憑單置系統保存<b>10年</b>。</li>\n</ul>\n<h4>營業稅</h4>\n<ul>\n<li><b>銀行本業收入營業稅率5%；其他金融業本業2%；非專屬本業收入5%</b>。</li>\n<li>非專屬本業收入10項：代理收付手續費、買賣金銀幣、信用卡手續費、保管箱出租、應收帳款收買、金融諮詢等。</li>\n<li>申報：以<b>二個月為一期</b>，於每年<b>1、3、5、7、9、11月之15日前</b>申報繳納。</li>\n<li>轉銷呆帳之未實現利息收入得於最後一期扣減銷售額。</li>\n<li>核定：申報期限屆滿次日起<b>六個月</b>屆滿後查詢核定結果。</li>\n<li>溢繳得自繳納日起<b>10年內</b>申請退稅；每期漏稅額<b>2,000元以下免罰</b>。</li>\n<li>保管文件保存<b>5年</b>。</li>\n</ul>\n<h4>印花稅（必考）</h4>\n<ul>\n<li>課徵範圍：<b>銀錢收據、買賣動產契據、承攬契據、典賣讓受及分割不動產契據</b>。</li>\n<li>稅率：<b>銀錢收據千分之4（0.4%）；買賣動產契據每件12元；承攬契據千分之1；典賣讓受分割不動產契據千分之1</b>。</li>\n<li>免稅：收受票據並載明票據名稱號碼之收據；兼具營業發票性質之銀錢收據；轉帳領息未出具收據者。</li>\n<li>定存利息以現金支付或轉入非本人帳戶，利息部分由立據人按<b>千分之4</b>貼花；轉帳入本人帳戶免貼。</li>\n<li>免貼：對帳單、利息計算書、匯款回條、出口結匯證實書、員工薪津表、退休金收據。</li>\n<li>彙總繳納以<b>二個月為一期</b>，1、3、5、7、9、11月15日前申報。</li>\n<li>溢繳得自繳納日起<b>10年內</b>申請退稅。</li>\n<li>契約自動延長繼續有效者，屆期應再貼印花稅票。</li>\n</ul>"},{"id":"dep-s1p1-c2","t":"第七章 預算事務","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>年度預算依「年度經營計畫」編製，內容三種：<b>營業毛利預算、營業費用預算、資本支出預算</b>，經經營決策委員會審議後<b>提報董事會核定</b>。</li>\n<li>營業費用分<b>員工福利費用、事務性費用、固定資產費用</b>三類。</li>\n<li>資本支出：投資後經濟效益達<b>一年以上</b>之支出。</li>\n<li>編製流程：Bottom-up（處級累積至全行）＋Top-down（依全行目標分析）。</li>\n<li>重要指標：EPS、ROA、ROE、存放款利差、營業費用率、逾放比、覆蓋率。</li>\n</ul>"},{"id":"dep-s1p1-c3","t":"第八章 各項開支執行與審核","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>各單位應在核配預算數範圍內核實開支，<b>不得流用</b>；不足須申請追加。</li>\n<li>私車公用燃料費補貼上限每人每月<b>1,000元</b>；手機電話費補貼上限每月<b>500元</b>。</li>\n<li>採購金額<b>100萬元以上</b>依採購準則簽准辦理。</li>\n<li>營業單位自行採購：<b>1萬元（含）以下</b>授權經理核定；<b>5萬元以上</b>應檢附<b>2家以上</b>估價單。</li>\n<li>使用年限二年以上且單價<b>2萬元以下</b>以「什項購置」開支，設備查簿控管。</li>\n<li>開支審核：<b>主辦人員不得擔任驗收人員</b>；會計人員監辦。</li>\n<li>費用超支：超支單位須於<b>當月20日前</b>填報超支原因。</li>\n</ul>"},{"id":"dep-s1p1-c4","t":"第九章 管理會計","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<ul>\n<li>MIS報表依「受理行」原則認列分行績效；利息收入採<b>權責發生制</b>。</li>\n<li>FTP計算：長天期＝月平均餘額×FTP利率÷<b>12</b>；短天期＝月平均餘額×FTP利率×當月日數÷<b>365（或360）</b>。</li>\n<li>無息資金以「內部損益」展現：月平均餘額×<b>活期存款FTP利率</b>×當月日數÷365。</li>\n<li>風險成本＝月平均餘額×適用年提存率÷<b>12</b>。</li>\n<li>重要財務指標：<b>存放比率＝放款總額÷存款總額；逾放比率＝逾期放款÷放款總額；效率比（CI Ratio）＝營業費用÷提存前營業毛利；存放款利差＝放款平均利率－存款平均利率</b>。</li>\n<li>產品利潤率(月)＝產品提存後營業毛利×12÷產品平均餘額。</li>\n<li>放款逾期戶（本息逾期<b>一個月以上</b>）應收未收利息以內部損益調整扣除。</li>\n<li>流動性存款比率提高→存款結構改善、支息率降低、利息費用減少。</li>\n</ul>"},{"id":"dep-s1p2-c1","t":"會計篇 附錄：財物購置辦法","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>核定權限（金額門檻）</h4>\n<ul>\n<li>未達<b>50萬元</b>：處長；<b>50萬~未達100萬</b>：副總經理；<b>100萬~未達500萬</b>：主管總務處副總；<b>500萬~未達2,500萬</b>：總經理；<b>2,500萬~未達5,000萬</b>：總經理核定呈董事長備查；<b>5,000萬~未達1億</b>：董事長；<b>1億元以上</b>：董事會。</li>\n<li>評選小組應設<b>5人以上</b>評選委員；IT採購應含資訊及資安單位。</li>\n<li>自動化軟硬體採購總金額<b>500萬元以上</b>應提送資訊發展委員會審議。</li>\n</ul>\n<h4>底價與招標</h4>\n<ul>\n<li>採購金額達<b>50萬元以上</b>、營繕工程達<b>100萬元以上</b>應編製底價表。</li>\n<li>公開招標：投標廠商不足<b>三家</b>時流標；第二次仍不足三家經核准得改比價或議價。</li>\n<li>決標以低於底價之最低標；最低標超過底價得優先減價<b>一次為限</b>；比減價不得逾<b>三次</b>。</li>\n<li>急迫情事可在不超過底價<b>8%</b>且未逾預算內保留；保留期限自開標日起<b>30日</b>。</li>\n<li>「流標」＝開標前無法開標；「廢標」＝開標後無法決標。</li>\n<li>合格廠商名單每年至少檢討<b>一次</b>；營繕工程及電腦軟硬體至少<b>6家</b>、一般性採購至少<b>10家</b>。</li>\n<li>議價適用：無廠商投標、專屬權利獨家、後續維修相容、追加工程未逾原契約<b>50%</b>。</li>\n<li>押標金及保證金以標價<b>10%</b>為原則；未達<b>100萬元</b>之工程財物採購免收。</li>\n<li>決標總價未達發包底價<b>80%</b>者，應繳差額保證金。</li>\n</ul>\n<h4>驗收與報廢</h4>\n<ul>\n<li><b>主辦單位主管或承辦人員不得主持驗收</b>；品質不符應拒絕驗收。</li>\n<li>天然災害報廢：事實發生次日起<b>20日內</b>造冊報核；意外事故<b>3日內</b>檢附照片報案證明。</li>\n<li>未達耐用年限報廢核定：殘值逾<b>100萬</b>總經理、50萬~100萬副總、50萬以下總務處處長。</li>\n<li>每次報廢總損失逾<b>500萬元</b>應向國稅局申請核備。</li>\n</ul>"},{"id":"dep-s1p2-c2","t":"會計篇 附錄：其他要點","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<h4>電子表單線上簽核</h4>\n<ul>\n<li>費用支出<b>1萬元（含）以下</b>：限經理核決不得代理。</li>\n<li>申請金額<b>未達5萬元</b>檢附<b>1張</b>估價單；<b>5萬元以上</b>檢附<b>2張以上</b>。</li>\n<li>禁止化整為零分批採購。</li>\n</ul>\n<h4>各級人員交代</h4>\n<ul>\n<li>移交清冊保管：單位主管<b>20年</b>、副主管<b>15年</b>、經管人員<b>5年</b>。</li>\n<li>單位主管移交清冊應於<b>一個月內</b>編妥送董事會稽核處。</li>\n</ul>\n<h4>預墊支款項核定</h4>\n<ul>\n<li>核定層級：<b>500萬以上</b>總經理、<b>100萬~500萬</b>副總、<b>未達100萬</b>處長。</li>\n<li>錯帳墊付逾<b>50萬元</b>須先電話通報業管單位。</li>\n</ul>"},{"id":"dep-s1p2-c3","t":"會計篇 附錄：商業會計法（核心考點）","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<h4>總則</h4>\n<ul>\n<li>商業會計事務之中央主管機關為<b>經濟部</b>。</li>\n<li>會計人員離職或變更職務時，應於<b>5日內</b>辦理交代。</li>\n<li><b>會計年度：每年1月1日起至12月31日止</b>（曆年制）。</li>\n<li>記帳本位：以<b>國幣</b>為記帳本位；記載用<b>我國文字</b>。</li>\n<li><b>會計基礎採權責發生制</b>；平時採現金收付制者，決算時應照權責發生制調整。</li>\n<li>會計事項之記錄應用<b>雙式簿記</b>。</li>\n</ul>\n<h4>憑證與帳簿</h4>\n<ul>\n<li>會計憑證分<b>原始憑證、記帳憑證</b>；原始憑證分外來、對外、內部憑證。</li>\n<li>記帳憑證分<b>收入傳票、支出傳票、轉帳傳票</b>。</li>\n<li>帳簿分<b>序時帳簿、分類帳簿</b>；必須設置<b>普通序時帳簿及總分類帳簿</b>。</li>\n<li>會計事項應按序逐日登帳，至遲不得超過<b>2個月</b>。</li>\n<li><b>憑證保存：決算後至少5年；帳簿及財務報表：決算後至少10年</b>（未結事項除外）。</li>\n</ul>\n<h4>財務報表</h4>\n<ul>\n<li>財務報表包括：<b>資產負債表、綜合損益表、現金流量表、權益變動表</b>（含附註）。</li>\n<li>年度財務報表應採<b>二年度對照</b>方式併列。</li>\n</ul>\n<h4>認列與衡量</h4>\n<ul>\n<li>資產及負債原始認列以<b>成本衡量</b>為原則。</li>\n<li>存貨成本得採<b>個別認定法、先進先出法或平均法</b>；以成本與淨變現價值孰低衡量。</li>\n<li>具控制或重大影響力之長期股權投資採<b>權益法</b>。</li>\n<li>折舊方法：平均法、定率遞減法、年數合計法、生產數量法、工作時間法。</li>\n<li>自行發展之研究發展支出應作為<b>當期費用</b>。</li>\n</ul>\n<h4>損益與決算</h4>\n<ul>\n<li>營業收入應於<b>交易完成時</b>認列；收入與費用應適當配合。</li>\n<li>決算應於會計年度終了後<b>2個月內</b>辦理完竣，得延長<b>一個半月</b>。</li>\n<li>負責人應於年度終了後<b>6個月內</b>將決算報表提請承認。</li>\n<li>罰則：填製不實憑證、故意滅失毀損帳簿等，處<b>5年以下</b>有期徒刑、拘役或併科<b>60萬元以下</b>罰金。</li>\n</ul>"}]}]}};
const LS='dep_notes_v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}};
let HI={};try{HI=JSON.parse(localStorage.getItem(LS+'_hist')||'{}')}catch(e){HI={}}
const saveH=()=>{try{localStorage.setItem(LS+'_hist',JSON.stringify(HI))}catch(e){}};
function record(q,i){const h=HI[q.id]||(HI[q.id]={n:0,w:0});h.n++;if(!isOk(q,i))h.w++;saveH()}
try{const t=localStorage.getItem(LS+'_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
if(!DATA.rv)document.getElementById('tabrv').style.display='none';
const ALL=[...DATA.pq,...DATA.sq], BYID={};ALL.forEach(q=>BYID[q.id]=q);
const MOD={};DATA.mods.forEach(m=>MOD[m.id]=m);
const L='1234';
let view='mod', cur=1, quiz=null, keep=new Set(), OPEN={}, RW={};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isOk=(q,i)=>q.a===null||q.a===undefined?true:i===q.a;
function status(q){const v=ST[q.id];if(v===undefined)return 'un';return isOk(q,v)?'ok':'bad'}
function stats(list){let d=0,o=0;list.forEach(q=>{const s=status(q);if(s!=='un'){d++;if(s==='ok')o++}});return{d,o}}
function filt(list){const y=$('#fy').value,s=$('#fs').value;return list.filter(q=>(!y||String(q.y)===y)&&(!s||status(q)===s))}

function header(){
  const s=stats(ALL);
  $('#stat').innerHTML=`<b>${DATA.pq.length}</b> 題考古題（110–114）・<b>${DATA.mods.length}</b> 個考點・<b>${DATA.sq.length}</b> 題模擬題・已作答 <b>${s.d}</b>・正確率 <b>${s.d?Math.round(s.o/s.d*100):0}%</b>・細則：存款篇 115.06.30／會計篇 20260325`;
}
function sidebar(){
  $('#ml').innerHTML=DATA.mods.map(m=>{
    const list=ALL.filter(q=>q.m===m.id), s=stats(list);
    return `<div class="mi ${view==='mod'&&cur===m.id&&!$('#q').value?'on':''}" data-m="${m.id}">
      <span class="code">${pad(m.id)}</span><span class="nm">${m.t}</span><span class="ct">${m.cnt} 題</span>
      <span class="sb">${m.w}・已答 ${s.d}/${list.length}</span>
      <span class="bar"><i style="width:${list.length?s.d/list.length*100:0}%"></i></span></div>`}).join('');
  $('#cnt').textContent=`${DATA.mods.length} 個考點・依考古題考點分類`;
}
function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), sg=(c.b||'').startsWith('信保'), gw=(c.b||'').startsWith('公文'), rul=sg||gw||(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':sg?'信保手冊依據':gw?'公文依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){
  const v=qz?quiz.ans[q.id]:ST[q.id], h=HI[q.id], done=v!==undefined, sim=q.id[0]==='S';
  const QT={neg:'錯誤題',combo:'組合題',fill:'填空題',ask:'問答題'};
  const head=(sim?(q.src===6?`<span class="tag sim lecq">延伸新題</span>`:q.src===5?`<span class="tag sim lecq">題型新題</span>`:q.src===4?`<span class="tag sim rulq">公文新題</span>`:q.src===3?`<span class="tag sim rulq">信保新題</span>`:q.src===2?`<span class="tag sim rulq">要點新題</span>`:q.src?`<span class="tag sim lecq">講義新題</span>`:`<span class="tag sim">模擬題</span>`):`<span class="tag">${q.y} 年・第 ${q.n} 題</span>`)+(q.t?`<span class="tag qt">${QT[q.t]}</span>`:'');

    else{const l=ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad'));
      if(k.length>1){if(!l.length){alert('本考點目前沒有答錯的題目');return}RW[cur+k[0]]=new Set(l.map(q=>q.id));OPEN[k[0]]=true}else delete RW[cur+k[0]];
      l.forEach(q=>delete ST[q.id])}
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=60,pr=$('#qpr').value;
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    let pick=pool.slice(0,n);
    if($('#qtp').value==='r'&&DATA.qt){  // 依 114 年題型比例分層抽題，不足者以其他題補足
      const K=['neg','combo','fill','ask'],want={};let s=0;K.forEach(k=>{want[k]=Math.round(DATA.qt[k]*n);s+=want[k]});want.neg+=n-s;
      pick=[];K.forEach(k=>pick.push(...pool.filter(q=>q.t===k).slice(0,want[k])));
      const used=new Set(pick.map(q=>q.id));pick.push(...pool.filter(q=>!used.has(q.id)).slice(0,n-pick.length));shuffle(pick)}
    quiz=pick.map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
let rvT;document.addEventListener('input',e=>{if(e.target.id==='rvq'){clearTimeout(rvT);rvT=setTimeout(rvFilter,150)}});
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)OPEN[d.dataset.sec]=d.open},true);
render();
</script>
