const LS='dep_notes_v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}};
let HI={};try{HI=JSON.parse(localStorage.getItem(LS+'_hist')||'{}')}catch(e){HI={}}
const saveH=()=>{try{localStorage.setItem(LS+'_hist',JSON.stringify(HI))}catch(e){}};
function record(q,i){const h=HI[q.id]||(HI[q.id]={n:0,w:0});h.n++;if(!isOk(q,i))h.w++;saveH()}
try{const t=localStorage.getItem(LS+'_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const ALL=[...DATA.pq,...DATA.sq], BYID={};ALL.forEach(q=>BYID[q.id]=q);
const MOD={};DATA.mods.forEach(m=>MOD[m.id]=m);
const L='1234';
let view='mod', cur=1, quiz=null, keep=new Set();
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isOk=(q,i)=>q.a===null||q.a===undefined?true:i===q.a;
function status(q){const v=ST[q.id];if(v===undefined)return 'un';return isOk(q,v)?'ok':'bad'}
function stats(list){let d=0,o=0;list.forEach(q=>{const s=status(q);if(s!=='un'){d++;if(s==='ok')o++}});return{d,o}}
function filt(list){const y=$('#fy').value,s=$('#fs').value;return list.filter(q=>(!y||String(q.y)===y)&&(!s||status(q)===s))}

function header(){
  const s=stats(ALL);
  $('#stat').innerHTML=`<b>${DATA.pq.length}</b> 題考古題（110–114）・<b>${DATA.mods.length}</b> 個考點・<b>${DATA.sq.length}</b> 題模擬題・已作答 <b>${s.d}</b>・正確率 <b>${s.d?Math.round(s.o/s.d*100):0}%</b>・細則：存款篇 115.06.30／會計篇 20260325`;
}
function sidebar(){
  $('#ml').innerHTML=DATA.mods.map(m=>{
    const list=ALL.filter(q=>q.m===m.id), s=stats(list);
    return `<div class="mi ${view==='mod'&&cur===m.id&&!$('#q').value?'on':''}" data-m="${m.id}">
      <span class="code">${pad(m.id)}</span><span class="nm">${m.t}</span><span class="ct">${m.cnt} 題</span>
      <span class="sb">${m.w}・已答 ${s.d}/${list.length}</span>
      <span class="bar"><i style="width:${list.length?s.d/list.length*100:0}%"></i></span></div>`}).join('');
  $('#cnt').textContent=`${DATA.mods.length} 個考點・依考古題考點分類`;
}
function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), rul=(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){
  const v=qz?quiz.ans[q.id]:ST[q.id], h=HI[q.id], done=v!==undefined, sim=q.id[0]==='S';
  const head=sim?(q.src===2?`<span class="tag sim rulq">要點新題</span>`:q.src?`<span class="tag sim lecq">講義新題</span>`:`<span class="tag sim">模擬題</span>`):`<span class="tag">${q.y} 年・第 ${q.n} 題</span>`;
  const md=showMod?`<span class="tag md">${pad(q.m)} ${MOD[q.m].t}</span>`:'';
  const opts=q.o.map((o,i)=>{let c='';if(done){if(q.a===null||q.a===undefined){if(i===v)c='ok'}else if(i===q.a)c='ok';else if(i===v)c='bad'}
    return `<button class="op ${c}" data-q="${q.id}" data-i="${i}"><span class="l">${L[i]}</span><span>${o}</span></button>`}).join('');
  let ans='';
  if(done){
    const ok=isOk(q,v), bonus=q.a===null||q.a===undefined;
    const ver=bonus?`<span class="verdict ok">官方送分題（任一選項皆給分）</span>`:
      ok?`<span class="verdict ok">✓ 答對</span>`:`<span class="verdict bad">✗ 答錯　正確答案：(${L[q.a]}) ${q.o[q.a]}</span>`;
    const warn=q.lo===1?`<div class="warn">本題出自出納／匯兌／電子金融／黃金存摺等作業規定，細則未直接收錄${q.ci?'；下方為細則中最相關條文':''}</div>`:q.lo===2?`<div class="warn">細則條文比對信心較低，僅供參考</div>`:'';
    ans=`<div class="ans"><button class="redo" data-r="${q.id}">重作</button>${ver}${q.x?`<div class="exp">${q.x}</div>`:''}${warn}${cite(q.ci)}</div>`;
  }
  return `<div class="qc ${done?'done':''}" id="c-${q.id}" data-z="${qz?1:''}"><div class="qh">${head}${md}${h?`<span class="tag hist">作答 ${h.n} 次・錯 ${h.w} 次</span>`:''}</div><div class="qt">${q.q}</div>${opts}${ans}</div>`;
}
function renderMod(){
  const m=MOD[cur], pq=DATA.pq.filter(q=>q.m===cur), sq=DATA.sq.filter(q=>q.m===cur);
  const s=stats([...pq,...sq]);
  const notes=m.notes.map(([h,items],i)=>`<span class="badge b${i%2}">${h}</span><ul class="nt">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('');
  const nums=m.nums.map(([k,v])=>`<div class="num"><b>${k}</b><span>${v}</span></div>`).join('');
  const fp=filt(pq), fs=filt(sq);
  $('#main').innerHTML=`
   <div class="mtitle"><span class="code">${pad(m.id)}</span><h2>${m.t}</h2></div>
   <div class="msub">${m.sub}</div>
   <div class="kpi">
     <div><small>考古題</small><b>${m.cnt} 題</b></div>
     <div><small>占 300 題</small><b>${(m.cnt/3).toFixed(1)}%</b></div>
     <div><small>模擬題</small><b>${sq.length} 題</b></div>
     <div><small>已作答</small><b>${s.d}/${pq.length+sq.length}</b></div>
     <div><small>正確率</small><b>${s.d?Math.round(s.o/s.d*100)+'%':'—'}</b></div>
   </div>
   <div class="yrs">${Object.entries(m.yrs).map(([y,c])=>`<span>${y}年 ${c}題</span>`).join('')}<span>出題頻率：${m.w}</span></div>
   <section><h3>重點筆記</h3>${notes}</section>
   <section><h3>必背數字</h3><div class="nums">${nums}</div></section>
   <section><h3>考古題練習<small>點選選項即判對錯並附細則依據</small></h3>
     <div class="qtools"><button class="btn" data-reset="p">本考點考古題全部重作</button><button class="btn" data-reset="pb">只重作答錯的</button><span class="legend">顯示 ${fp.length}/${pq.length} 題</span></div>
     ${fp.map(q=>qcard(q)).join('')||'<div class="empty">沒有符合篩選條件的題目</div>'}</section>
   <section><h3>模擬題<small>仿考古題命題＋講義／作業要點新題，附原文出處</small></h3>
     <div class="qtools"><button class="btn" data-reset="s">本考點模擬題全部重作</button><button class="btn" data-reset="sb">只重作答錯的</button><span class="legend">顯示 ${fs.length}/${sq.length} 題</span></div>
     ${fs.map(q=>qcard(q)).join('')||'<div class="empty">沒有符合篩選條件的題目</div>'}</section>`;
}
function renderSearch(kw){
  const k=kw.toLowerCase(), strip=s=>s.replace(/<[^>]+>/g,'').toLowerCase();
  const hit=filt(ALL).filter(q=>strip(q.q+q.o.join('')+(q.x||'')+(q.ci?q.ci.t:'')).includes(k));
  const nh=[];DATA.mods.forEach(m=>m.notes.forEach(([h,it])=>it.forEach(x=>{if(strip(x).includes(k))nh.push([m,x])})));
  $('#main').innerHTML=`<div class="mtitle"><h2>搜尋「${kw.replace(/</g,'&lt;')}」</h2></div>
   <div class="msub">筆記 ${nh.length} 條・題目 ${hit.length} 題</div>
   ${nh.length?`<section><h3>相關筆記</h3><ul class="nt">${nh.slice(0,60).map(([m,x])=>`<li><span class="tag md">${pad(m.id)} ${m.t}</span> ${x}</li>`).join('')}</ul></section>`:''}
   <section><h3>相關題目</h3>${hit.slice(0,80).map(q=>qcard(q,true)).join('')||'<div class="empty">找不到相符題目</div>'}${hit.length>80?'<div class="empty">僅顯示前 80 題，請加長關鍵字</div>':''}</section>`;
}
function renderNums(){
  $('#main').innerHTML=`<div class="mtitle"><h2>必背數字總表</h2></div><div class="msub">各考點高頻數字型考點彙整，點考點名稱可跳回該考點</div>
   <section style="max-width:none"><table class="nt"><tr><th>考點</th><th>數字</th><th>內容</th></tr>
   ${DATA.mods.map(m=>m.nums.map(([k,v],i)=>`<tr>${i===0?`<td rowspan="${m.nums.length}"><a href="#" data-go="${m.id}" style="color:var(--accent-ink)">${pad(m.id)} ${m.t}</a></td>`:''}<td class="k">${k}</td><td>${v}</td></tr>`).join('')).join('')}
   </table></section>`;
}
function renderQuiz(){
  if(!quiz){
    $('#main').innerHTML=`<div class="mtitle"><h2>綜合測驗</h2></div><div class="msub">從考古題與模擬題隨機抽題，作答立即解答並附細則（作答結果同步記錄）</div>
     <div class="qzbar">
       <label>題源 <select id="qsrc"><option value="mix">考古題＋模擬題</option><option value="p">只考古題</option><option value="s">只模擬題</option></select></label>
       <label>題數 <select id="qn"><option>10</option><option selected>20</option><option>30</option><option>60</option></select></label>
       <label>優先 <select id="qpr"><option value="">隨機</option><option value="un">未作答優先</option><option value="bad">答錯優先</option><option value="badonly">只考答錯的</option><option value="hard">常錯題優先</option></select></label>
       <button class="btn pri" id="qgo">開始測驗</button></div>
     <div class="mchk" id="qm">${DATA.mods.map(m=>`<label><input type="checkbox" value="${m.id}" checked> ${pad(m.id)} ${m.t}</label>`).join('')}</div>
     `;
    return;
  }
  const s=stats(quiz.map(id=>BYID[id]).filter(q=>quiz.ans[q.id]!==undefined));
  const fin=quiz.filter(id=>quiz.ans[id]!==undefined).length;
  const ok=quiz.filter(id=>quiz.ans[id]!==undefined&&isOk(BYID[id],quiz.ans[id])).length;
  $('#main').innerHTML=`<div class="mtitle"><h2>綜合測驗</h2></div>
   <div class="qzbar"><span>進度 <b class="score">${fin}/${quiz.length}</b></span><span>答對 <b class="score">${ok}</b></span>
   <span>得分 <b class="score">${fin?Math.round(ok/quiz.length*100):0}</b></span><button class="btn" id="qagain">整份重考</button>${fin>ok?`<button class="btn" id="qwrong">只重考答錯的（${fin-ok} 題）</button>`:''}<button class="btn" id="qnew">重新出題</button></div>
   ${fin===quiz.length?`<div class="legend" style="margin-top:10px">已完成！可「整份重考」（題序重新打亂）或「只重考答錯的」反覆練習</div>`:''}
   ${quiz.map((id,i)=>`<div class="legend" style="margin-top:14px">第 ${i+1} 題</div>`+qcard(BYID[id],true,1)).join('')}`;
}
function renderWrong(){
  const w=ALL.filter(q=>status(q)==='bad'||keep.has(q.id)), nb=ALL.filter(q=>status(q)==='bad').length;
  $('#main').innerHTML=`<div class="mtitle"><h2>錯題本</h2></div><div class="msub">目前答錯 ${nb} 題（按「重作」重新作答；答對的題目下次進入錯題本時移出）</div>
   <div class="qtools">${nb?`<button class="btn pri" data-reset="wrong">錯題全部重作</button>`:''}<button class="btn" data-reset="all">清除全部作答紀錄</button></div>
   ${DATA.mods.map(m=>{const l=w.filter(q=>q.m===m.id);return l.length?`<section><h3>${pad(m.id)} ${m.t}<small>${l.length} 題</small></h3>${l.map(q=>qcard(q)).join('')}</section>`:''}).join('')||'<div class="empty">目前沒有錯題 👍</div>'}`;
}
function render(){
  header();sidebar();
  document.querySelectorAll('#tabs button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const kw=$('#q').value.trim();
  if(kw)renderSearch(kw);
  else if(view==='mod')renderMod();
  else if(view==='nums')renderNums();
  else if(view==='quiz')renderQuiz();
  else renderWrong();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.mi,a[data-go]');if(!t)return;
  if(t.matches('a[data-go]')){e.preventDefault();cur=+t.dataset.go;view='mod';render();scrollTo(0,0);return}
  if(t.classList.contains('mi')){cur=+t.dataset.m;view='mod';$('#q').value='';render();scrollTo({top:0});return}
  if(t.dataset.v){view=t.dataset.v;keep.clear();$('#q').value='';render();return}
  if(t.id==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(LS+'_theme',r.dataset.theme)}catch(e){}return}
  if(t.classList.contains('op')){
    const id=t.dataset.q, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz, q=BYID[id], i=+t.dataset.i;
    if((qz?quiz.ans[id]:ST[id])!==undefined)return;
    ST[id]=i;if(qz)quiz.ans[id]=i;record(q,i);save();
    const tmp=document.createElement('div');tmp.innerHTML=qcard(q,!!card.querySelector('.tag.md'),qz);card.replaceWith(tmp.firstElementChild);
    header();sidebar();
    if(view==='quiz'&&quiz&&!$('#q').value){const y=scrollY;renderQuiz();scrollTo(0,y)}
    return}
  if(t.dataset.r){const id=t.dataset.r, card=document.getElementById('c-'+id), qz=card.dataset.z==='1'&&!!quiz;
    if(qz)delete quiz.ans[id];else{if(view==='wrong')keep.add(id);delete ST[id];save()}
    if(qz){const y=scrollY;renderQuiz();scrollTo(0,y);header();sidebar();return}
    const tmp=document.createElement('div');tmp.innerHTML=qcard(BYID[id],!!card.querySelector('.tag.md'));card.replaceWith(tmp.firstElementChild);header();sidebar();return}
  if(t.dataset.reset){const k=t.dataset.reset;
    if(k==='all'){if(!confirm('確定清除全部作答紀錄（含作答次數統計）？'))return;ST={};HI={};saveH();keep.clear()}
    else if(k==='wrong')ALL.filter(q=>status(q)==='bad').forEach(q=>{keep.add(q.id);delete ST[q.id]});
    else ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad')).forEach(q=>delete ST[q.id]);
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=+$('#qn').value,pr=$('#qpr').value;
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    quiz=pool.slice(0,n).map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
render();
</script>
</body>
</html>
