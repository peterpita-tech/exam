<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>存匯會計考點筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --panel:#fbfaf7; --card:#ffffff; --line:#e3ddd3; --line2:#efeae2;
  --ink:#1d1b19; --ink2:#3d3833; --muted:#7a726a;
  --accent:#a4502a; --accent-soft:#f3dfd0; --accent-ink:#8a3f1d;
  --navy:#2c4a72; --green:#2f6a44; --ok:#2f6a44; --ok-bg:#e6f1e9; --bad:#b3261e; --bad-bg:#fbe7e4;
  --mark:#fbe3a6; --warn:#8a6a12; --warn-bg:#fbf3dc;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
  --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
  --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
  --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
  --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
    --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
    --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
    --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
    --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding:18px 40px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.5px}
.stat{color:var(--muted);font-size:13px;margin-top:2px}
.xlink{font-size:13px;margin-top:4px}.xlink a{color:var(--accent-ink);margin-right:12px}.xlink b{color:var(--ink);margin-right:12px}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:6px;align-items:center}
nav.tabs button{background:none;border:1px solid transparent;border-bottom:2px solid transparent;font:inherit;font-size:15px;padding:8px 14px;color:var(--ink2);cursor:pointer;border-radius:8px 8px 0 0}
nav.tabs button.on{border-color:var(--line);border-bottom:2px solid var(--accent);background:var(--panel);color:var(--ink);font-weight:700}
.theme{border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 10px!important}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}
aside .search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
aside .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
select{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.mlist{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:calc(100vh - 250px);overflow:auto;position:sticky;top:12px}
.mi{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--line2)}
.mi.on{background:var(--accent-soft)}
.mi .code{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.mi .nm{font-weight:700;font-size:15px}
.mi .ct{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px}
.mi .sb{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.5}
.mi .bar{grid-column:2/4;height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:4px}
.mi .bar i{display:block;height:100%;background:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px 34px;min-width:0}
.mtitle{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mtitle .code{font-family:var(--mono);font-size:36px;color:var(--accent);font-weight:600}
.mtitle h2{font-family:var(--serif);font-size:34px;margin:0}
.msub{color:var(--muted);margin:4px 0 18px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card)}
.kpi div{padding:12px 14px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:600}
.kpinote{font-size:12px;color:var(--muted);margin:8px 0 0}
section{max-width:880px}
section h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:34px 0 14px;padding-top:26px;border-top:1px solid var(--line)}
section h3 small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.badge{display:inline-block;color:#fff;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:3px;margin:14px 0 8px}
.b0{background:var(--navy)}.b1{background:var(--green)}
ul.nt{margin:0 0 6px;padding-left:20px}
ul.nt li{margin:5px 0}
ul.nt b{color:var(--accent-ink)}
u{text-decoration:none;border-bottom:1.5px solid var(--accent);}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.num{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px}
.num b{display:block;font-family:var(--mono);font-size:17px;color:var(--accent-ink)}
.num span{font-size:12.5px;color:var(--ink2)}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.yrs span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);background:var(--card)}
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.qc{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:16px 18px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.sim{background:var(--green);color:#fff}
.tag.hist{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--sans)}
.tag.md{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--sans)}
.qt{font-size:15.5px;margin:4px 0 10px}
.qt .it{font-family:var(--mono);color:var(--accent);font-weight:600}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer;line-height:1.6}
.op:hover{border-color:var(--accent)}
.op .l{font-family:var(--mono);font-weight:600;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--card)}
.op.ok{background:var(--ok-bg);border-color:var(--ok)}
.op.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:var(--bad-bg);border-color:var(--bad)}
.op.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.done .op{cursor:default}
.ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{margin:6px 0}
.cite{margin-top:10px;border-left:3px solid var(--navy);background:var(--panel);padding:8px 12px;border-radius:0 6px 6px 0}
.cite .lb{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;margin-right:8px}
.cite .path{font-size:12.5px;color:var(--muted)}
.cite.lec{border-left-color:var(--green)}.cite.lec .lb{background:var(--green)}.tag.lecq{background:var(--navy)}.cite.rul{border-left-color:var(--accent)}.cite.rul .lb{background:var(--accent)}.tag.rulq{background:var(--accent)}
.cite .tx{font-size:14px;color:var(--ink2);margin-top:6px;word-break:break-all}
mark{background:var(--mark);color:inherit;padding:0 1px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 8px;margin-top:8px;display:inline-block}
.redo{float:right;font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:20px 0}
table.nt{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.nt th,table.nt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.nt th{background:var(--line2);font-weight:700}
table.nt td.k{font-family:var(--mono);color:var(--accent-ink);white-space:nowrap}
.qzbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.score{font-family:var(--mono);font-size:22px;color:var(--accent-ink)}
.mchk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:13.5px}
.mchk label{cursor:pointer}
.legend{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
  .wrap{padding:14px 16px 40px}
  .grid{grid-template-columns:1fr}
  .mlist{position:static;max-height:260px}
  main{padding:22px 16px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .kpi div{border-bottom:1px solid var(--line)}
  .mtitle .code{font-size:26px}.mtitle h2{font-size:24px}
  h1{font-size:23px}
  nav.tabs{overflow-x:auto;max-width:100%}
  nav.tabs button{padding:7px 9px;font-size:14px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>存匯會計業務 考點學習筆記</h1>
    <div class="xlink"><a href="./">徵授信</a><a href="外匯業務-考點學習筆記.html">外匯</a><b>存匯會計</b><a href="信託理財業務-考點學習筆記.html">信託理財</a></div>
    <div class="stat" id="stat"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="mod" class="on">考點</button>
    <button data-v="quiz">綜合測驗</button>
    <button data-v="nums">必背數字</button>
    <button data-v="wrong">錯題本</button>
    <button class="theme" id="theme" title="切換深淺色">◐</button>
  </nav>
</header>
<div class="grid">
  <aside>
    <input class="search" id="q" placeholder="搜尋題目或細則（如 公示催告、警示帳戶、印花稅）">
    <div class="row2">
      <select id="fy"><option value="">全部年度</option><option>110</option><option>111</option><option>112</option><option>113</option><option>114</option></select>
      <select id="fs"><option value="">全部題目</option><option value="un">未作答</option><option value="bad">答錯</option><option value="ok">答對</option></select>
    </div>
    <div class="count" id="cnt"></div>
    <div class="mlist" id="ml"></div>
  </aside>
  <main id="main"></main>
</div>
</div>
<script>
const DATA={"mods":[{"id":1,"t":"開戶・身分查核・CRS／FATCA","sub":"未成年／受監護・籌備處・薪轉警示戶・iLEO・高齡客戶","w":"每年約 6 題","notes":[["特殊對象開戶",["未成年人（不含支存）：父母偕同、父母共同代理（本人可不到場）、一方持他方同意書代理；限制行為能力人得持父母同意書單獨臨櫃。","持雇主「僱傭證明」（載明法定代理人同意）→ <b>僅得開立薪資轉帳活期儲蓄存款</b>，不得開綜存、金如意及支票存款。","受監護／受輔助宣告：<b>不得開立支票存款、金如意綜合管理帳戶</b>；一般存摺、定期性、綜存由監護人或輔助人簽章同意。","警示／衍生管制帳戶當事人原則拒絕開戶，惟為就業薪轉提出在職證明者可開<b>活期儲蓄存款</b>，並設定為衍生管制帳戶（停用金融卡、網銀、語音，匯入款退匯）。","籌備處：以<b>申請人名義</b>開立活期或定期存款（戶名可並列「○○籌備處」）、一律<b>不提供自動化服務</b>、一律高風險；申請人以往來 6 個月以上既有客戶為原則。","接受安置之兒少／受監護宣告者由社工代理：徵地方主管機關公文、兒少身分證及第二證件正本。"]],["身分查核與稅籍",["開戶應查核<b>雙重身分證明文件</b>；行號第二證件可用國稅局繳稅證明（但繳稅證明不能為開戶唯一依據）。","戶口名簿或電子戶籍謄本為主要證件者，應至<b>內政部戶政司全球資訊網</b>查驗。","CRS：非中華民國稅籍、<b>非美國稅籍</b>者「CRS 外國稅籍註記」輸入 <b>Y</b>（中華民國＋美國 → N）。","FATCA 重新審查時點：個人戶變更國籍或觸發美國指標、非個人戶變更國籍、狀態「31 消極非金融外國法人」變更負責人；文件非永久有效者自取得文件隔年起算至第三年年底有效。","與警示帳戶聯絡資訊重複：<b>2 人以上</b>原則不受理自動化服務申請、<b>3 人以上</b>原則婉拒開戶。","高齡客戶＝年滿 <b>65 歲</b>；高風險客戶開戶須經較高層級主管（資深副理或經理）核准。"]]],"nums":[["65 歲","高齡客戶"],["2 人／3 人","警示聯絡資訊重複：不受理自動化／婉拒開戶"],["Y／N","CRS 外國稅籍註記（非台非美→Y）"],["6 個月","籌備處申請人往來期間原則"]],"cnt":31,"yrs":{"110":7,"111":4,"112":9,"113":5,"114":6}},{"id":2,"t":"印鑑・掛失・繼承・存款證明・查詢","sub":"印鑑系統・聯行限制・繼承順位・餘額證明・調查機關查詢","w":"每年約 5 題","notes":[["印鑑與存戶資料",["印鑑暨影像系統：一式多顆印章應<b>逐顆對正拍攝</b>，並拍攝印鑑卡訂約印鑑；查詢權限<b>不得</b>授權理財業務人員。","支存變更印鑑未填「憑舊式印鑑付款通知書」：發票日在新印鑑生效日前之票據，於生效後提示者<b>仍憑舊印鑑付款</b>。","新式外來人口統一證號：<b>1 碼英文＋9 碼數字</b>（110.1.2～119.12.31 換號期間）；郵寄申請可寄任一分行。","電子對帳單 Email 驗證完成後次月生效；未驗證須親取；不得由理財人員列印對帳單。"]],["掛失・存款證明・聯行限制",["無法於聯行辦理掛失、補發：<b>可轉讓定存單（含法院提存）、質權設定之定存單、存款經法院扣押</b>、非本人採授權方式辦理（另含死亡凍結）。","存款餘額證明：證明日期 <b>3 個月內</b>以 984S 連線開立、任一營業單位可辦；逾 3 個月以 9S0S 手工開立限原開戶行；申請書保存 <b>5 年</b>；可轉讓定存單不宜開立；備償專戶須陳經理核可。"]],["繼承與查詢",["存款餘額 <b>20 萬元以下</b>（以單一分行總存款餘額判斷）免檢附遺產稅繳清／免稅證明；小額存款繼承（3 萬元以下）免全體繼承人會同，聯行亦可受理。","繼承順位：直系血親卑親屬 → 父母 → 兄弟姊妹 → 祖父母；<b>代位繼承限第一順位</b>；繼承開始後死亡者之應繼分由其繼承人再轉繼承。","繼承人調閱被繼承人往來明細，<b>不論是否涉及第三人個資均得提供</b>；任一繼承人皆得查詢。","存戶查調明細原則以申請日前 <b>15 年</b>為限；警察機關調閱警示帳戶明細應儘量於文到 <b>5 個營業日</b>內回復；函覆以密件並將姓名、ID 隱碼。","稅捐機關查詢涉及第三人者應報經財政部核准；衛福部查非法販售醫療器材帳戶應經<b>金管會</b>同意。"]]],"nums":[["20 萬","繼承免附遺產稅證明"],["3 萬","小額存款繼承"],["15 年","存戶查調明細期間"],["3 個月","餘額證明連線／任一分行"],["5 年","餘額證明申請書保存"]],"cnt":27,"yrs":{"110":10,"111":6,"112":4,"113":4,"114":3}},{"id":3,"t":"警示帳戶・扣押・洗錢防制","sub":"警示／衍生管制・告誡戶・剩餘款發還・大額通貨・同業照會","w":"每年約 5 題","notes":[["警示與衍生管制",["警示帳戶：暫停<b>全部交易功能</b>，匯入款退匯；期限自每次通報起算<b>逾 2 年</b>自動失效，延長以<b>一次及一年</b>為限。","衍生管制帳戶：暫停金融卡、語音轉帳、網路轉帳及其他電子支付，匯入款退匯；查證無詐騙之虞可逕解除。","匯入帳號為結清戶、警示、衍生管制、拒往戶 → 中心主機<b>自動退匯</b>。","解除警示：接獲司法警察函文及「民眾辦理解除警示帳戶申請書」後，填「解除警示通報申請書」送營運業務處（不得由分行直接解除）。","剩餘款：帳戶餘額<b>未達 1,000 元</b>得逕行結清轉入「警示帳戶剩餘款」分戶；無法聯絡開戶人時透過匯（轉）出行通知被害人申請發還。","營運業務處通知後 <b>7 個營業日</b>內填報「警示帳戶發生原因檢討表」。"]],["告誡戶・照會",["告誡戶：裁處之日起管制 <b>5 年</b>；晶片金融卡每日轉帳、提領上限各<b>1 萬元</b>；禁網銀、語音支付轉帳；不得申請空白票據；<b>存入不受限制</b>；洗錢風險視為高風險。","同業照會得包含<b>戶名及開戶日期</b>、開戶人年齡、職業類別等；照會資訊記錄於「疑似異常存款帳戶或交易照會資料紀錄表」。"]],["扣押與洗錢防制",["扣押一般存單：<b>尚未到期或有質權設定者仍應辦理扣押</b>並向來文機關聲明異議；綜存定存扣押併入活期性帳號。","大額通貨交易：單筆現金收付或換鈔達 <b>50 萬元</b>（含等值外幣）；聯行資金調撥非屬之；現金繳稅交易資料不傳送調查局。","久未往來戶提現超過 50 萬元，除大額通貨申報外應加強審查。"]]],"nums":[["2 年","警示期限自動失效"],["1 次 1 年","警示延長上限"],["1,000 元","警示剩餘款逕行結清"],["5 年／1 萬","告誡戶管制期間／每日限額"],["50 萬","大額通貨交易"]],"cnt":23,"yrs":{"110":2,"111":5,"112":2,"113":7,"114":7}},{"id":4,"t":"支票存款・票據審核・掛失止付","sub":"票據審核・時效計算・背書・本行支票・不定期查訪","w":"每年約 5 題","notes":[["票據審核",["金額：以大寫為原則，大小寫不符以<b>大寫</b>為準；「廿」代替「貳拾」<b>不得付款</b>；「參／叁／参」不得拒付；玖誤為玫而小寫足以辨識宜照付。","日期：未載發票日 → 「法定要項不全」退票；2/30、4/31 等曆法上所無之日 → <b>以該月末日為發票日</b>；本票未載到期日視為見票即付。","支票一年時效「<b>算入始日</b>」：例 113/10/30 簽發 → 114/10/29 屆滿；屆滿日遇假日順延次一營業日。","抬頭加「先生、律師」等稱謂，背書姓名一致未加稱謂 → 視為背書無訛；抬頭人得以「<b>收款專用章</b>」背書收款（不得轉讓）。","委任取款背書：記載「票面金額委託○○○取款」，由<b>受款人及受任人共同簽章</b>，並提示受款人身分證明。","自然人存戶死亡：生前簽發支票不論到期與否<b>拒絕付款</b>；法人負責人死亡未更換前提示 → <b>仍應付款</b>。"]],["掛失止付・本行支票・查訪",["票據掛失止付<b>限原開戶行</b>；止付後 <b>5 日內</b>提出已聲請公示催告證明，逾期失效且不得再對同一票據止付；已兌付票據不得掛失。","本行支票：不得以現金申請、應瞭解申請目的、<b>應記載受款人並加劃平行線</b>（不可取消）；簽發屆滿 <b>1 年</b>以上得以「利得償還請求書」請求取款。","支存變更負責人或非個人久未往來戶申領空白支票 → <b>2 週內</b>實地查訪，且不得晚於領取空白票據日。","RPA 每年 <b>1/15</b> 比對法人支存基本資料，產 CK36MR；2 月底前通知變更；無法聯繫者停止或減少發給空白票據。","支存結清：餘額 ≤ 10 萬元且無已簽發未提示票據得郵寄結清；第e個網線上結清限餘額<b>為零</b>。"]]],"nums":[["5 日","掛失止付後提出公示催告證明"],["2 週","變更負責人實地查訪"],["1 年","本行支票利得償還請求"],["1/15","RPA 法人支存比對"]],"cnt":24,"yrs":{"110":4,"111":7,"112":2,"113":2,"114":9}},{"id":5,"t":"活期性存款・綜存・金如意・薪轉","sub":"無摺支出・取款憑條・線上結清・綜存限額・薪轉戶・存摺管理","w":"每年約 6 題","notes":[["記帳與存提",["取款憑條所填日期在領款日前 <b>7 天以內</b>可付款，超過或在領款日之後應請存戶更改並蓋原留印鑑（匯款申請書不適用）。","有摺戶無摺支出：本人臨櫃 → 出示身分證件、取款憑條親簽，<b>提領金額不受限制</b>；本人未臨櫃 → <b>主管</b>向存戶確認並記載於取款憑條背面，提領現金應記交易人姓名；請存戶 7 日內補登存摺。","代製傳票：限攜帶存摺或所述帳號戶名相符者；若不符，<b>不得提示</b>予客戶檢閱並應回收銷毀。","客戶離行後發現金額錯誤：以無摺方式沖正（主管核准），再以 1560 轉帳支出並輸入原沖正交易序號。","存摺取款碼鎖碼／遺忘：本人攜證件、存摺、原留印鑑至<b>任一營業單位</b>重設，或透過第e個網（非 eATM）。"]],["結清銷戶・存摺管理",["第e個網線上結清：新臺幣活期性存款餘額 <b>≤ 5 萬元</b>，款項限轉入本行同戶名帳戶，存摺金融卡自行作廢。","存摺遺失得於任一營業單位掛失後免補發，以無摺方式結清。","客戶未及領回存摺：登記並交指定主管集中保管；<b>逾 2 個月</b>未領回 → 外出服務送交或經同意雙掛號郵寄。"]],["綜存・金如意・薪轉",["綜存：活期（儲）變更為綜存時「綜存質借」預設<b>不可質借</b>，可質借額度為定存金額 9 成；電子化通路活轉定每帳戶每月累計 <b>300 萬元</b>；議價利率定存可存入綜存但<b>不得自動轉期</b>；外籍人士預設無自動轉期。","金如意：定存性質一律為「綜存存單」；外籍人士（含大陸）定儲存一律<b>不質借</b>；可作貸款循環額度、代繳扣款、證券劃撥、薪轉約定帳戶；不得註銷全行代付款。","薪轉戶：資訊處每二個月將<b>連續 2 個月</b>無薪資入帳之 38 薪轉戶改為 00 一般戶；7388 媒體上傳「1-薪資入帳及變更性質別」於<b>次日凌晨</b>變更為 38。"]]],"nums":[["7 天","取款憑條日期有效"],["5 萬","第e個網線上結清上限"],["2 個月","未領存摺／薪轉無入帳"],["300 萬","綜存電子化活轉定月限額"],["9 成","綜存質借額度"]],"cnt":30,"yrs":{"110":3,"111":4,"112":8,"113":10,"114":5}},{"id":6,"t":"定期性存款・定儲・可轉讓定存單","sub":"最低存額・聯行交易・中途解約・大額利率・外籍人士","w":"每年約 3 題","notes":[["存入與聯行",["最低存額：定期存款、整存整付、存本取息等 <b>5 千元</b>；<b>零存整付每次 1 千元</b>以上（整數倍）；綜存定儲存起存額 1 萬元。","聯行可辦：開立存單、到期取款（含<b>中途解約</b>）、付息、轉期、零存整付續存及委託代繳；<b>限原開戶行</b>：法院扣押抵銷及解繳、<b>質權設定</b>、法院提存事故、結構型商品、離職儲金帳戶。","零存整付逾約定存入日 3 日內免補徵利息，逾 4 日須補徵 4 天；委託代繳文件以「存匯業務影像管理系統」掃描、永久保管。"]],["利息與作業",["中途解約利息<b>打八折</b>；免打八折限轉存<b>員工福儲帳戶</b>，不得以此鼓勵申購信託／保險，每日列印 CT66 查核。","存本取息中途解約，已按原利率按月領取之利息<b>溢付應扣回</b>並退還溢扣之所得稅。","CT70：次月轉期後本金利息續存達 <b>300 萬元</b>以上 → 適用大額牌告利率，每月 5 日前列印。","外籍人士定儲：須有外僑居留證且存期<b>不得逾居留證有效期限</b>、不得自動轉期；無居留證或已逾期者改存定期存款（科目 40）。","可轉讓定存單：非居住者到期兌償金額超過首次發售價格部分按 <b>15%</b> 扣繳；不宜開立存款餘額證明；不得於聯行掛失。"]]],"nums":[["5 千／1 千","定儲最低存額／零存整付每次"],["300 萬","轉期適用大額利率"],["八折","中途解約利息"],["15%","可轉讓定存單非居住者扣繳"]],"cnt":13,"yrs":{"110":3,"111":2,"112":5,"113":1,"114":2}},{"id":7,"t":"利息扣繳・營業稅・印花稅","sub":"扣繳率與期限・183 天・免扣門檻・營業稅率・印花稅範圍・存款保險","w":"每年約 6 題","notes":[["利息所得扣繳",["境內居住者：每次扣繳稅額 <b>≤ 2,000 元</b>免扣繳（公債、公司債、金融債券利息除外）；每月 <b>10 日前</b>繳上月稅款，<b>每年 1 月底前</b>申報扣繳憑單。","非境內居住者／境內無固定營業場所：於<b>代扣稅款之日起 10 日內</b>繳清並申報；境內無住所但一課稅年度居留滿 <b>183 天</b>者按 <b>10%</b> 扣繳。","可轉讓定存單、短期票券非居住者按 <b>15%</b>；公債、公司債、金融債券利息按 10%。","公寓大廈管理委員會須驗明稽徵機關核發之<b>免扣繳證明</b>始得免扣；未達起扣點之給付<b>仍須申報</b>。"]],["營業稅",["稅率：銀行本業 <b>5%</b>、銀行業非專屬本業 <b>5%</b>、其他金融業本業 <b>2%</b>。","轉銷呆帳之未實現利息收入，轉銷時扣減銷售額，事後受償歸屬利息部分須報繳；已採 RPA 網路申報。","申報期限屆滿次日起 <b>6 個月</b>後至財政部稅務入口網列印核定結果；申報文件專卷保存 <b>5 年</b>；溢漏繳於次月手工調整回沖補提。"]],["印花稅・其他",["課稅範圍：銀錢收據、買賣動產契據（每件 <b>12 元</b>）、承攬契據（<b>0.1%</b>）、典賣讓受分割不動產契據（0.1%）；銀錢收據 <b>0.4%</b>。","免稅：信用卡、保管箱手續費、營業資產租金等非專屬本業之營業發票性質收據；放款繳息收據載明支票號碼者免；<b>現金繳納放款利息</b>之收據須繳。","契據自動延長繼續有效者屆期<b>應再貼</b>；印花稅尚未採 RPA；計算至元、元以下捨去。","存款保險：每一存款人本金及利息最高保額 <b>300 萬元</b>（含外幣、不含 OBU）。"]]],"nums":[["2,000 元","免扣繳門檻"],["10 日內","非居住者繳納申報"],["10%／15%","183 天居住者／可轉讓存單非居住者"],["5%／5%／2%","營業稅率"],["0.4%／0.1%／12 元","印花稅"],["300 萬","存款保險"]],"cnt":30,"yrs":{"110":7,"111":7,"112":4,"113":7,"114":5}},{"id":8,"t":"出納・金庫・ATM・櫃員付款","sub":"付現額度・第三人覆點・金庫鑰匙・ATM 作業・保全運送・行外服務","w":"每年約 5 題","notes":[["櫃員付款",["櫃員付現額度 <b>30 萬元</b>（逾額送主管認證後由櫃員主任付款）；存單利息付息額度 <b>2 萬元</b>。","<b>矮櫃</b>不得辦理現金付款：受理並執行交易後交主管覆核，由櫃員主任付款並經<b>第三人覆點</b>（記帳櫃員及櫃員主任以外人員）。","高櫃營業中保留現金限額 <b>80 萬元</b>；主管應不定時以 1092-1 抽查櫃員現金。","櫃員主任、會計、檢核專員不得相互兼任；櫃員主任不得兼任 ATM 經辦。"]],["金庫・ATM・運送（出納作業規定）",["金庫室備份鑰匙：<b>經理及櫃員主任</b>共同簽封；密碼表使用屆滿 6 個月前機動更換；金庫管制系統密碼不得與單一登入密碼相同。","電子金庫：營業中隨時上鎖並連線報警，櫃員主任<b>每月 2 次</b>測試；庫存現金帳務覆核與實物覆點不得同一人，經理每週機動覆點。","ATM：裝卸鈔每台 <b>2 小時</b>內完成；密碼於職務異動、休假逾 7 天或休假期間可能裝卸鈔時變更；出納現金短缺於<b>發現當日</b>通報作業風險系統。","保全運送現金由<b>主管及櫃員主任會同</b>點收；快遞公司限票據運送；行外收付 30 萬元以上以運鈔車、至少 <b>3 人</b>。","行外服務：收付款於記帳<b>後</b>由直屬主管或指定人員電話確認；臨時性收送件一年以 <b>5 次</b>為限；外出收付大額通貨以客戶端現金收付人員為交易人。"]]],"nums":[["30 萬／2 萬","櫃員付現／付息額度"],["80 萬","高櫃保留現金"],["2 小時","ATM 裝卸鈔"],["3 人","行外 30 萬以上運送"],["5 次","臨時性行外收送件／年"]],"cnt":25,"yrs":{"110":8,"111":9,"112":3,"113":2,"114":3}},{"id":9,"t":"會計總則・傳票・櫃員制結帳・月結決算","sub":"傳票編製覆核裝訂・覆核人員指派・虛擬櫃員・現金短缺・月算結算","w":"每年約 7 題","notes":[["傳票與帳表",["會計項目一級七大類：資產 1、負債 2、權益 3、收益 4、費損 5、表外資產 8、表外負債 9；收益、費損為<b>虛帳戶</b>，結算時轉入本期損益。","日期應填明年月日；<b>不得用可擦拭筆</b>；誤劃以紅筆於線兩端作「×」並蓋章；簽章以本名為準；<b>製記完畢應換人覆核</b>（錯誤未更正負連帶責任）。","傳票缺漏應於記帳日起 <b>7 個營業日</b>內補正，傳票最遲記帳日後 <b>7 個營業日</b>內裝訂；未補正者於「傳票檢查備查簿」敘明陳經理。","各部門帳簿報表裝訂或更換後 <b>2 個月</b>內送交會計人員；商業會計法：原始憑證取得後 2 個月內入帳。","會計憑證分<b>原始憑證與記帳憑證</b>；原始憑證另行保管應於傳票上記載。","應付款項逾請求權 <b>15 年</b>無人請求，支存拒往戶專戶、本行支票專戶（滿一年轉入）、警示帳戶剩餘款等得登記「整理訖債務登記簿」轉入過期帳收入。"]],["櫃員制結帳",["以櫃員為單位結帳，分行僅辦理臨櫃帳務；一般櫃員<b>本人</b>結帳，虛擬櫃員應<b>指派結帳人員</b>並登記<b>工作派令簿</b>。","覆核人員由<b>自行查核主管</b>指派、登記「覆核人員指派登記簿」（自行保管、保存 5 年），覆核同一櫃員最長 <b>3 個月</b>，休假由覆核人員之職務代理人辦理。","傳票排列：<b>複式轉帳傳票在單式前</b>；單式依轉帳收入、現金收入、轉帳支出、現金支出；<b>新臺幣置於外幣前</b>。","現金短缺：（借）其他應收款－<b>現金短缺專戶</b>；剩餘（貸）其他應付款－現金剩餘專戶；當日無法結平：（借）其他應收款－未及結帳待清查款項。","會計人員：不得辦理本身及兼辦事務覆核、得兼辦傳票認證、經總行核准得兼「代收款項章」核章；採購營繕驗收監辦應指派會計經辦<b>以外</b>人員。"]],["月算・結算",["月算：應收應付利息提存、營業稅／印花稅提存、折舊攤銷、預收預付認列；資訊處每月 25、28 日產生「應補收息明細表」。","結算：上期 6/30、下期 12/31，<b>遇例假日仍以該日為結算日</b>；期底聯往不得有未達帳；結算當月仍須辦月算。"]]],"nums":[["7 個營業日","傳票補正／裝訂"],["3 個月","覆核同一櫃員上限"],["2 個月","帳簿送交會計"],["15 年","應付款項請求權"],["6/30・12/31","結算日（不順延）"]],"cnt":37,"yrs":{"110":3,"111":7,"112":11,"113":10,"114":6}},{"id":10,"t":"預算・開支・採購","sub":"核配預算・追加流用・遞延・什項購置・採購授權・私車公用","w":"每年約 3–4 題","notes":[["預算",["應在核配或核准之預算額度內開支；費用預算核配不足應<b>辦理追加或申請，不得流用</b>其他預算。","核實開支項目不足毋須申請追加；核配預算不足依規申請追加（外包費－護衛駕駛等例外須依業管規定）。","上期未用：<b>資本支出可遞延至下期</b>；費用支出可申請修改期別或重新申請。下期未用：資本支出須重新申請，不得遞延至下年度。","超支屬歸屬期別錯誤 → 系統「修正/刪除已核准申請單」改期別；帳列項子目錯誤 → 更正帳務；漏申請 → 補申請。"]],["開支與採購",["營業單位自行採購：<b>1 萬元以下</b>授權經理核定；1 萬元以上或資本支出應檢附估價單申請總行核准；<b>5 萬元以上</b>檢附 <b>2 家</b>以上估價單。","使用年限 <b>2 年以上</b>且單價 <b>2 萬元以下</b>以「什項購置」開支 → 設什項購置備查簿、彙計表。","未訂契約之交易依<b>估價單</b>約定之規格、條款驗收付款；各項開支應取得合法單據。","私車公用燃料費每人每月 <b>1,000 元</b>、私人手機電話費 <b>500 元</b>；燃料費單據車號須與申請書一致。"]]],"nums":[["1 萬","經理核定採購上限"],["5 萬／2 家","估價單門檻"],["2 年／2 萬","什項購置"],["1,000／500","私車／手機補貼"]],"cnt":18,"yrs":{"110":5,"111":3,"112":2,"113":2,"114":6}},{"id":11,"t":"匯兌・電子金融・代理業務","sub":"匯款申請書・手續費減免・金融卡／網銀・傳真指示・黃金存摺・統一發票・代收稅款","w":"每年約 8 題","notes":[["匯兌與手續費",["匯款申請書以複式傳票辦理，交易日期<b>不適用</b>取款憑條 7 日內有效；收款人戶名填全銜；認證僅於主管（覆核）欄蓋章。","現金匯款 3 萬～50 萬元：留存匯款人姓名、ID、電話；代理人辦理<b>僅需核對代理人身分</b>（熟客得免出示）。","單筆匯款超過 <b>5 萬元</b>且收手續費並填收款人手機 → 匯出後自動簡訊；媒體整批匯款掃描上傳截止<b>下午 3:00</b>。","手續費減免權限：ATM 跨行提款、自動化設備跨行轉帳／本行 ATM 跨行存款各 <b>≤ 10 次</b>，任一超過送營運業務處。","疑涉詐騙預警清單比對：存摺存款支出／收入、匯款登錄交易須加強關懷提問（定存支出不在範圍）。"]],["金融卡與網銀",["本行 ATM 每次提領最高 <b>3 萬元</b>；當日累計（含外幣折合）<b>10 萬元</b>須次日再提；無卡提款每月累計 20 萬元。","申請製卡逾 <b>一年半</b>未領（PB26）作為註銷依據；留置他行／本行金融卡 14 個營業日未取回註銷；金融卡掛失未持印鑑者 5 個營業日內補蓋。","約定轉入他人（行）帳號：評估後<b>次一日或次二日</b>生效（考題：網銀次二日）；本人同 ID 當日生效；約定轉入本行每次 300 萬、他行 200 萬。","第e金網「單層管理」由一位管理者設定使用人員與簽核流程；第e個網明細可查最近 1 年；第e金網繳稅單筆 200 萬元。"]],["傳真・代理業務",["傳真指示：正本應於 <b>7 個營業日</b>內送交；接收人員與作業人員不得同一人；新臺幣傳真轉帳一律非連動交易。","黃金存摺定期投資：每月 1～26 日最多 <b>6</b> 個扣款日、每次最低 <b>3,000 元或美金 200 元</b>、可向任一營業單位申請；提領實體黃金後不得回售、不得轉籍。","統一發票：買受人為營業人、政府機關<b>不予給獎</b>；個人中獎人姓名須與買受人一致；以本行支票給付免印花稅。","代收稅款：末日遇假日以次日為末日；即期票據繳納視為如期；逾期繳款書仍可代收（9020 計算滯納金、利息）。"]]],"nums":[["3 萬／10 萬","ATM 每次／每日累計"],["5 萬","匯款簡訊門檻"],["10 次","手續費減免權限"],["7 個營業日","傳真正本送交"],["6 日・3,000 元","黃金定期投資"]],"cnt":42,"yrs":{"110":8,"111":6,"112":10,"113":10,"114":8}}],"pq":[{"id":"110-1","y":110,"n":1,"m":4,"q":"客戶於110年11月11日(四)來行辦理支票掛失止付，應提醒通知止付人於","o":["11月16日(二)","11月17日(三)","11月18日(四)","11月19日(五) 前向本行提出已為聲請公示催告之證明，否則止付通知失其效力"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第五節 票據之掛失止付","t":"３、將通知書副本（二）交通知止付人，並提醒通知止付人不論止付票據是否到期均應於申請掛失止付後五日內，向本行<mark>提出已為聲請公示催告之證明</mark>（如：聲請狀繕（副）本及法院收受公示催告聲請狀之收據），否則止付通知失去效力。"},"x":"110/11/11（四）辦理掛失止付 → 應於 <b>5 日內</b>（11/16 前）提出已聲請公示催告之證明，否則止付通知失其效力。"},{"id":"110-2","y":110,"n":2,"m":8,"q":"矮櫃櫃員受理存款戶辦理結清銷戶，該櫃員執行交易後，帳戶餘額在新臺幣","o":["1千元(含)以下，由該櫃員付款","1萬元(含)以下，由該櫃員付款","10萬元(含)以下，由該櫃員付款","不論金額大小，交由櫃員主任付款，並經第三人覆點交付"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"四、為簡化作業流程，縮短客戶等候時間，營業單位櫃員得於下列規定額度內辦理付款、認證事項：(一)<mark>櫃員付現額度：櫃員辦理各種新臺幣存款之提領</mark>，其現金支付金額在新臺幣參拾萬元以內者，得逕予付款，惟應立即交主管或檢核專員覆核認證。"},"x":"矮櫃櫃員不得辦理現金付款：結清銷戶不論金額大小交由<b>櫃員主任付款，並經第三人覆點</b>交付。（高櫃櫃員付現額度為 30 萬元）","lo":1},{"id":"110-3","y":110,"n":3,"m":11,"q":"有關統一發票中獎獎金之兌付，發票載有買受人之中獎人判定規則，下列何者為非？","o":["買受人為個人，以買受人為中獎人，領獎收據所填之中奬人姓名需與買受人一致","買受人為執行業務者(如：私立診所或事務所等)應提供統一編號編配通知書及代領獎人身分證件供核對","買受人為營業人(如：大大股份有限公司)，可以給獎","買受人為政府機關時，不予給獎"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"５、受託人為法人或團體者，應徵取最新之公司/組織章程、股東名冊或出資證明及「高階管理人員暨實質受益人聲明書」以辨識實質受益人、高階管理人員及確認<mark>股份有限公司</mark>是否得發行無記名股票。"},"x":"統一發票買受人為營業人（公司行號）者<b>不予給獎</b>；買受人為個人以買受人為中獎人；執行業務者須提供統一編號編配通知書及代領獎人證件；政府機關不予給獎。","lo":1},{"id":"110-4","y":110,"n":4,"m":5,"q":"有關金如意綜合管理帳戶，下列何者為非？","o":["可作為薪資轉帳約定帳戶","得申請註銷全行代付款服務","本國國民或已取得居留權之外國人士(含大陸人士)皆可申請開立此帳戶","倘受理已取得居留權之外國人士(含大陸人士)申請開立此帳戶，其新臺幣、外幣綜存存單一律設為「不質借」"],"a":1,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"三、金如意帳戶之定存（新臺幣、外幣）性質別一律設為「綜存存單」，若約定為「可質借，其所有定存均作為各該幣別活期性存款質借使用；另受理未成年人申辦本項業務時，倘其申請新臺幣或外匯綜存為可質借者，應依私人借款之授信相關規範徵取所需文件後，始可辦理；倘受理已取得居留權之外國人士（含大陸人士）申辦本項業務時，其新臺幣、外幣綜存存單一律設為「不質借」。"},"x":"金如意綜合管理帳戶<b>不得註銷全行代付款服務</b>；可作薪轉約定帳戶；本國人及已取得居留權之外國人（含大陸）可申請，外籍人士之綜存存單一律「不質借」。"},{"id":"110-5","y":110,"n":5,"m":8,"q":"行外自動櫃員機委託保全公司辦理補鈔、排障等服務時，應先辦理相關鑰匙交接，留存本行之金庫備份鑰匙，於交接時由","o":["主管與保全公司","經辦與保全公司","主管與經辦","經理與經辦 人員共同簽封後，交保管備份密碼表以外之人員保管"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"十三、有關營業單位行外自動櫃員機委託<mark>保全公司</mark>填補鈔作業，如係採將補鈔金額匯款或轉帳至<mark>保全公司</mark>指定帳戶之交易方式辦理，非屬「金融機構防制洗錢辦法」所稱申報大額通貨交易之範圍，爰辦理行外ATM裝卸鈔暫以其他應收款墊支及歸墊作業，得免辦理A190交易之建檔，為配合本項作業，執行A830、A836交易並以「其他應收款-其他應收款諸戶」子目下「安豐<mark>保全公司</mark>」（代號：14184-501）及「聯安<mark>保全公司</mark>」（代號：14184-502）分戶辦理之現金存入及支出之交易，將不產生大額通貨序號。"},"x":"行外 ATM 委託保全補鈔、排障時，金庫備份鑰匙交接應由<b>主管與保全公司</b>人員共同簽封，交保管備份密碼表以外之人員保管。","lo":1},{"id":"110-6","y":110,"n":6,"m":2,"q":"有關「印鑑暨影像管理系統」拍攝印鑑建檔作業，下列敍述何者為非？","o":["一式印鑑含多顆印章者(如：公司圖章及負責人印章)，毋須「逐顆」對正拍攝","應將印鑑卡平貼於建檔台上，印鑑卡底下勿墊任何東西","受理客戶更換印鑑時，應於新印鑑卡啟用日期欄填入新印鑑啟用日期，毋須另行註記或蓋印「＿年＿月＿日更印啟用」字樣，以免影響印鑑之拍攝建檔","應一併拍攝印鑑卡訂約印鑑(即印鑑卡右下角客戶簽名與蓋章)"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第五節 印鑑","t":"２、<mark>一式印鑑含多顆印章者</mark>，應逐顆<mark>對正拍攝</mark>，不可歪斜，且應以單顆印鑑大小範圍內拍攝建檔，勿拍入過多空白處或他顆印鑑。３、拍攝存戶原留印鑑時，應一併拍攝印鑑卡訂約印鑑（即印鑑卡右下角客戶簽名與蓋章）。"},"x":"一式印鑑含多顆印章者，<b>應逐顆對正拍攝</b>，不可歪斜 → (A)錯。"},{"id":"110-7","y":110,"n":7,"m":2,"q":"有關受理外籍人士以郵寄方式申請更換新式統一證號，下列何者為非？","o":["新式統一證號格式為1碼英文＋9碼數字","新式統一證號之證件同步印有舊式統一證號","可透過內政部移民署全球資訊網之「移民署新舊統一證號申請結果查詢」網頁查詢舊式統一證號","需郵寄至原開戶行辦理統一證號更換"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"４、內政部移民署於110年1月2日起實施新式外來人口統一證號專案，將統一證號比照國人身分證字號格式修正為<mark>1碼英文＋9碼數字</mark>，換號期間為110年1月2日起至119年12月31日止，換發新號前，舊號仍可使用，120年1月1日起，舊式統一證號全面停用。"}},{"id":"110-8","y":110,"n":8,"m":8,"q":"有關本行「營業單位行外服務實施注意事項」相關作業規範，下列敍述何者為非？","o":["於完成外出收付款項記帳「前」，應由外出收付款人員之直屬主管或其指定人員以電話等方式確認","直屬主管指定之確認人員不得為外出收付款人員及該筆交易記帳人員","經確認之日期、時間、雙方確認人員(須以全名表示)及確認結果應填記於「行外收送件(款)備查單」第二聯本行存查聯","執行信託基金、黃金存摺等交易，因訂有最遲應完成交易時間應及早作業"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項","t":"４、嚴禁理財人員代客全程辦理臨櫃交易，故存匯櫃員受理理財人員代來行客戶交付辦理之存款、提款、開戶或帳戶資料變更等文件，於完成交易後，應依下列流程辦理：(１)由受理櫃<mark>員之直屬主管</mark>、其他主管或記帳人員以外之人員親自交付存摺、收執聯等（如為金融卡或電子銀行密碼函，則僅能由主管親自交付）予客戶收執並確認交易內容。(２)如客戶已離行，無法親自交付文件，則依「營業單位行外服務實施注意事項」辦理。(３)如該交易無收執文件需交付客戶（如變更客戶基本資料或印鑑等），前揭人員仍應向客戶予以關懷、確認，並於交易文件空白處註記「向本人確認無誤」等同義字樣後加蓋私章備查。"},"x":"行外收付款項應於記帳「<b>後</b>」由直屬主管或其指定人員以電話等方式向客戶確認（非記帳前）；確認人員不得為外出收付人員及記帳人員。","lo":1},{"id":"110-9","y":110,"n":9,"m":1,"q":"客戶為本行警示或衍生管制帳戶時應拒絕客戶開戶，惟為開立薪資轉帳帳戶，可向本行申請下列何種存款帳戶種類？","o":["金如意綜合管理帳戶","支票存款","活期儲蓄存款","離職儲金帳戶"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(２)前述情形辦理開戶作業應注意下列事項：A.<mark>開立薪資轉帳帳戶者，當事人應提出在職證明</mark>或任職公司之證明文件；"},"x":"警示或衍生管制帳戶者原則拒絕開戶，例外開立<b>薪資轉帳帳戶</b>（活期儲蓄存款）者，應提出在職或任職公司證明。"},{"id":"110-10","y":110,"n":10,"m":7,"q":"如可轉讓定期存單持有人為非中華民國境內居住之個人或在中華民國境內無固定營業場所之營利事業，其到期兌償金額超過首次發售價格部分之利息，按給付額扣取","o":["10%","15%","20%","30%"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(五)<mark>可轉讓定期存單</mark>、商業票據（包括商業本票及商業承兌匯票）、銀行承兌匯票等短期票券，如<mark>持有人為非中華民國境內居住之個人或在中華民國境內無固定營業場所之營利事業，其到期兌償金額超過首次發售價格部分之利息，按給付額扣取</mark>百分之十五。其他應注意事項如下："},"x":"可轉讓定存單等短期票券持有人為非境內居住個人或境內無固定營業場所營利事業者，利息按給付額扣取 <b>15%</b>。"},{"id":"110-11","y":110,"n":11,"m":2,"q":"存戶或存單有<br><span class=\"it\">A.</span> 存戶死亡存款凍結<br><span class=\"it\">B.</span> 可轉讓定期存單(含法院提存)<br><span class=\"it\">C.</span> 質權設定之定存單<br><span class=\"it\">D.</span> 存款經法院扣押 之情形者，無法於聯行辦理掛失、補發存摺、存單","o":["AB","BD","ACD","ABCD"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第八節 掛失止付","t":"３、<mark>存戶或存單有</mark>下列<mark>情形者，無法於聯行辦理掛失、補發存</mark>單：(１)<mark>可轉讓定期存單</mark>（<mark>含法院提存</mark>）。(２)<mark>質權設定之定存單</mark>。(３)<mark>存款經法院扣押</mark>者。(４)非本人臨櫃，採授權方式辦理者。"},"x":"可轉讓定存單（含法院提存）、質權設定之定存單、存款經法院扣押者，及非本人臨櫃採授權者，無法於聯行掛失補發；存戶死亡凍結亦須原開戶行處理 → ABCD。"},{"id":"110-12","y":110,"n":12,"m":1,"q":"受理客戶為受監護、受輔助宣告之人開戶時，不得開立何種帳戶？","o":["支票存款","活期儲蓄存款","定期性存款","綜合存款"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"},"x":"受監護、受輔助宣告之人<b>不得開立支票存款</b>、金如意綜合管理帳戶；其他帳戶須由監護人或輔助人簽章同意。"},{"id":"110-13","y":110,"n":13,"m":5,"q":"有關新臺幣活期性存款線上結清銷戶，下列敘述何者為非？","o":["存戶新臺幣活期性存款帳戶餘額不超過新臺幣5萬元","存戶得利用第e個網結清銷戶之功能辦理結清銷戶","線上結清之新臺幣活期性存款帳戶餘額，可依存戶指示匯入其他金融機構同戶名之帳戶","存戶線上結清銷戶之存摺及金融卡由存戶自行作廢，免寄回本行"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第七節 結清銷戶","t":"十七、<mark>線上結清</mark>銷戶(一)存戶<mark>新臺幣活期性存款帳戶餘額</mark>不超過新臺幣伍萬元者，得利用第ｅ個網結清銷戶功能辦理<mark>線上結清</mark>銷戶作業。"}},{"id":"110-14","y":110,"n":14,"m":11,"q":"受理客戶申請第e金網業務時，客戶需求為「公司中僅須透過一位管理者設定/管理使用人員、操作角色及交易簽核流程。」，請問客戶在第e金網業務申請書須勾選的「權限管理模式」為何？","o":["單層管理","雙層管理","多層管理","單一使用者"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄七 第一商業銀行存戶新開戶建立影像檔注意事項","t":"2.如為首次申請「第e金網」服務，需執行端末交易（代號：A14Y，代號：1：申請），依申請書內容列印系統管理人員（<mark>單層</mark>式主管或二層式主管/經辦）密碼函。"},"x":"第e金網「單層管理」：僅由一位管理者設定／管理使用人員、角色及簽核流程；「雙層」則由主管與經辦分層管理。"},{"id":"110-15","y":110,"n":15,"m":9,"q":"有關傳票檢查、保管、調閱及銷毀之作業規定，下列敍述何者正確？<br><span class=\"it\">A.</span> 銷毀檔案資料與銷毀清冊二者間內容無關聯性<br><span class=\"it\">B.</span> 傳票內容如有缺漏應於記帳日起7日內補正<br><span class=\"it\">C.</span> 傳票應於記帳日起7日內完成裝訂<br><span class=\"it\">D.</span> 成冊傳票無須再檢查，可立即入庫存放<br><span class=\"it\">E.</span> 調閱傳票只須告知會計人員後即可借閱","o":["BC","BCD","BCDE","ABCDE皆錯"],"a":3,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"(三)傳票檢查內容如有缺漏應即補齊，對無法於當日解決者，除傳真傳票已登記於「受理客戶以傳真方式辦理各項業務登記簿」者，免另行登記於「傳票檢查備查簿」外，其餘均應登記於「傳票檢查備查簿」並應於記帳日起七個營業日內補正，如未補正應敘明理由陳核經理知悉並妥善處理。"},"x":"傳票缺漏應於記帳日起 <b>7 個營業日</b>內補正、7 個營業日內裝訂；銷毀清冊與銷毀資料須一致；成冊傳票仍應檢查；調閱傳票須依規申請，故 ABCDE 皆錯。"},{"id":"110-16","y":110,"n":16,"m":7,"q":"給付非中華民國境內居住之個人利息所得，應於何時將所扣繳之稅款向該管稽徵機關申報？","o":["代扣稅款日之次月10日前","代扣稅款之日起10個營業日內","代扣稅款之日起10日內","代扣稅款日之次月月底前"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(二)非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，其利息所得應於<mark>代扣稅款之日起</mark>十日內，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗。（所得稅法第92條第2項）"},"x":"非境內居住之個人利息所得，應於<b>代扣稅款之日起十日內</b>向國庫繳清並申報核驗（所得稅法第 92 條第 2 項）。"},{"id":"110-17","y":110,"n":17,"m":7,"q":"有關印花稅之敍述，下列何者為非？","o":["銀錢收據之稅率為每件按金額0.4%","承攬契據之稅率為每件按金額0.4%","買賣動產契據每件12元","印花稅以計算至通用貨幣元為止，元以下自動捨去"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(二)買賣動產契據之印花稅每件12元。(三)<mark>承攬契據</mark>(如清潔維護契約、機器維護合約、保全服務合約等)<mark>每件按金額0.</mark>1％。"},"x":"承攬契據印花稅為每件按金額 <b>0.1%</b>（非 0.4%）；銀錢收據 0.4%、買賣動產契據每件 12 元 → (B)錯。"},{"id":"110-18","y":110,"n":18,"m":7,"q":"對中華民國境內之納稅義務人辦理扣繳及申報，下列敍述何者錯誤？<br><span class=\"it\">A.</span> 每次付款所扣繳之稅款不超過新臺幣3,000元者，免予扣繳<br><span class=\"it\">B.</span> 原則上扣繳憑單須向稅捐稽徵機關辦理申報<br><span class=\"it\">C.</span> 支付業務推介佣金新臺幣4,000元，因稅款未達起扣點免予扣繳，故該筆所得不用向稅捐稽徵機關辦理申報<br><span class=\"it\">D.</span> 對中華民國境外之納稅義務人辦理扣繳稅款繳納及申報係比照境內之納稅義務人辦理","o":["ABD","BC","ACD","ABCD"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"(三)於規定期限內開立<mark>扣繳憑單</mark>及申報：1.<mark>納稅義務人</mark>如為<mark>中華民國境內</mark>居住之個人，或在<mark>中華民國境內</mark>有固定營業場所之營利事業，扣繳義務人應於每年一月底前將上一年內扣繳各<mark>納稅義務人</mark>之稅款數額，開具<mark>扣繳憑單</mark>，彙報該管<mark>稽徵機關</mark>查核；因<mark>未達起扣點</mark>，或因不屬所得稅法規定之扣繳範圍，而未經<mark>扣繳稅款</mark>者，應於每年一月底，將受領人姓名、住址、國民身分證統一編號及全年給付金額等，依規定格式，列單申報主管<mark>稽徵機關</mark>。"},"x":"每次扣繳稅額不超過 <b>2,000 元</b>免扣繳（非 3,000）；未達起扣點仍<b>須申報</b>；境外納稅義務人應於代扣日起 10 日內繳納申報，不比照境內 → ACD 錯。"},{"id":"110-19","y":110,"n":19,"m":7,"q":"有關本行營業稅申報，下列敍述何者錯誤？<br><span class=\"it\">A.</span> 若有轉銷呆帳之未實現利息收入，申報營業稅時要加回銷售額及營業稅稅額<br><span class=\"it\">B.</span> 轉銷呆帳之未實現利息收入，事後受償歸屬利息之部分須報繳營業稅<br><span class=\"it\">C.</span> 營業稅繳納及申報後，相關資料要保存3年<br><span class=\"it\">D.</span> 目前分行已採機器人流程自動化辦理營業稅網路申報，故向稅捐稽徵機關辦理申報已縮短為每月乙次","o":["BCD","ACD","AB","ABCD"],"a":1,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"(二)每年十二月月算提存：除上述一般月算提存外，另依下列規定辦理：1.依財政部99年4月14日台財稅字第09900025490號解釋令，自該解釋令發布日以後<mark>轉銷呆帳之未實現利息收入，</mark>得於轉銷年度申報最後一期<mark>營業稅時</mark>，檢附證明文件，彙總全年度金額申報扣減<mark>銷售額及營業稅</mark>額；嗣經<mark>受償歸屬利息</mark>部分，仍應依法<mark>報繳營業稅</mark>。配合前開解釋令，自99年起，每年十二月<mark>辦理營業稅</mark>提存時，由系統自動「減：<mark>轉銷呆帳之未實現利息收入</mark>」全年度彙總金額後計出營業稅<mark>銷售額及</mark>稅額。"}},{"id":"110-20","y":110,"n":20,"m":1,"q":"受理籌備處辦理開戶作業時，下列敍述何者為非？","o":["受理籌備處申辦開戶作業時，應以申請人名義辦理","籌備處名稱並列於戶名內(例：第一股份有限公司籌備處王大明)","如查詢之「Z22 通報案件紀錄及補充資訊」結果，雖可確認客戶是否受監護/輔助宣告，仍須再手動查詢9590交易","籌備處留存之印鑑僅簽蓋申請人私章即可，亦可加蓋公司、行號、機關、團體章，惟該印章應加籌備處字樣"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"5.由系統引導查詢「Z21：國民身分證領補換資料查詢驗證」、<mark>「Z22</mark>：<mark>通報案件紀錄及補充</mark>註記資訊」及「登記預查查詢(籌備處)。"}},{"id":"110-21","y":110,"n":21,"m":4,"q":"支票載有抬頭人得以下列何者圖章背書？","o":["統一發票專用章","收件章","收款專用章","請領租金專用章"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"７、支票<mark>抬頭人得以</mark>「<mark>收款專用章</mark>」背書收款。惟此項專用章，祇能以之收款，而不能作為轉讓票據之用。（54.1財政部台財錢發第0305號令）"},"x":"支票抬頭人得以「<b>收款專用章</b>」背書收款，但只能收款、不能轉讓。"},{"id":"110-22","y":110,"n":22,"m":4,"q":"有關受理本行支票作業，下列敍述何者為非？","o":["不得以現金申請簽發","應記載受款人","可依申請人指示取消平行線","「本行支票」自簽發之日起屆滿一年以上，得由執票人繕具「利得償還請求書」請求取款"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十八節 本行支票","t":"５、<mark>應記載受款人，並加劃平行線</mark>。"},"x":"本行支票不得以現金申請簽發、應記載受款人並加劃平行線，<b>不可取消平行線</b>；簽發屆滿一年以上得以「利得償還請求書」請求取款。"},{"id":"110-23","y":110,"n":23,"m":4,"q":"支票存款戶申請變更負責人後，營業單位應於多久時間內完成實地查訪，且實地查訪日期不得晚於客戶領取空白票據日期？","o":["2週","3週","1個月","2個月"],"a":0,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"八、不定期查訪：(一)開戶後如有<mark>變更負責人</mark>之情事，或非個人戶為久未往來戶欲申領空白支票時，應於客<mark>戶申請變更</mark>後兩週內再次<mark>實地查訪</mark>瞭解客戶經營狀況，惟<mark>實地查訪日期不得晚於客戶領取空白票據日期</mark>，並將查訪情形註記於「本行<mark>支票存款</mark>帳戶開戶/久未往來戶恢復往來/<mark>變更負責人</mark>查註事項」(存516)「簽註意見」欄，另<mark>變更負責人</mark>時，則應於次營業日所產生之「<mark>支票存款戶</mark>開戶基本資料異動明細表」（日報，CK37）備註欄註記<mark>完成實地查訪日期</mark>，並由<mark>支票存款</mark>經辦及主管蓋章。"},"x":"支存戶變更負責人後，應於<b>兩週內</b>再次實地查訪，且不得晚於客戶領取空白票據日期。"},{"id":"110-24","y":110,"n":24,"m":8,"q":"有關臨時性行外收送件(款)服務，係指未簽訂「行外收送件(款)服務約定書」之同一客戶於一年內(每年1/1~12/31)行外收送件(款)累積次數以（　）次 (含)為限。","o":["3次","5次","10次","20"],"a":1,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"(一)辦理送件服務時，應由原經辦人員將存摺、金融卡及密碼函之帳號、戶名填寫於<mark>「行外收送件</mark>（款）備查單」，並於「其他」欄位註記（如：『存摺□本』），由外出服務人員持備查單向保管存摺之主管人員領取存摺、金融卡及密碼函。"},"x":"臨時性行外收送件（款）：未簽約之同一客戶一年內（1/1～12/31）累積以 <b>5 次</b>為限。","lo":1},{"id":"110-25","y":110,"n":25,"m":8,"q":"營業單位金庫室正、副門之內柵門及外門備份鑰匙之簽封，應由","o":["經理及櫃員主任","存匯主管及櫃員主任","經理及存匯主管","經理及輪值主管 共同簽封"],"a":0,"ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第三節 存單之保管","t":"四、本存單入庫、使用、作廢及庫存情形將由系統印錄於庫存現金帳，每日應由主管於查點現金時一併查點。五、營業單位得封簽保管空白可轉讓定存單，於辦理封簽當日完成庫存現金帳(含可轉讓定存單庫存)覆點後，由<mark>櫃員主任</mark>及出納主管點算欲封簽之空白可轉讓定存單各面額張數後，填記於「空白可轉讓定存單封簽單」(如附錄五)並於「<mark>櫃員主任</mark>」、「出納主管」欄位蓋章及註明簽封日期，將欲封簽之空白定存單裝入信封或紙箱中，封簽單黏貼於信封或紙箱外封口處，由<mark>櫃員主任</mark>與出納主管共同封簽(蓋具騎縫章並加註日期)。嗣後每日覆點「可轉讓定期存單庫存明細」時，僅需查點已封簽之信封或紙箱外封口是否完整，以及未封簽之零星張數，經查點無誤後，於合計欄金額前首蓋章；倘當日需使用已封簽之空白可轉讓定存單，或封簽人員(出納主管<mark>及櫃員主任</mark>)職務有異動時，應即拆封並全數查點後，再重新辦理封簽作業。"},"x":"金庫室正、副門之內柵門及外門備份鑰匙，應由<b>經理及櫃員主任</b>共同簽封。","lo":1},{"id":"110-26","y":110,"n":26,"m":3,"q":"有關匯入匯款之存款帳號如為<br><span class=\"it\">A.</span> 結清戶<br><span class=\"it\">B.</span> 警示帳戶<br><span class=\"it\">C.</span> 衍生管制帳戶<br><span class=\"it\">D.</span> 拒絶往來戶（　）將由中心主機自動將該筆匯款予以退匯。","o":["AB","ABC","AD","ABCD"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"三、警示帳戶之設定：(一)存款帳戶經通報為警示帳戶者，營業單位或信用卡處-客戶服務部應即執行「存戶餘額留存登錄及解除交易」（交易代號：9330，代碼：20）設定為警示帳戶（設定時免輸入金額，惟應依警調單位傳送文件中記載之案情輸入案情摘要），電腦並立即連動暫停該帳戶全部交易功能，<mark>匯入款項逕以退匯方式退回匯款行</mark>。"},"x":"匯入帳號為結清戶、警示帳戶、衍生管制帳戶、拒絕往來戶，均由中心主機<b>自動退匯</b>（ABCD）。"},{"id":"110-27","y":110,"n":27,"m":8,"q":"有關自動櫃員機密碼 益證券或資產基礎證券分配之利息，按分配額扣取百分之十。（四）<mark>公債、公司債或金融債券</mark>之利息，按給付額扣取百分之十。"},"x":"每次應扣繳稅額不超過 2,000 元免扣繳，但<b>公債、公司債或金融債券之利息</b>等仍應扣繳 → (B)。"},{"id":"110-58","y":110,"n":58,"m":7,"q":"對於本行印花稅之規範，下列敍述何者錯誤？<br><span class=\"it\">A.</span> 目前本行印花稅尚未採機器人流程自動化辦理網路申報<br><span class=\"it\">B.</span> 已貼印花稅票之契據若到期後依契據約定自動延長而繼續有效者，屆期後因先前已貼過印花稅票，無須再重覆黏貼印花稅票<br><span class=\"it\">C.</span> 印花稅繳納及申報後，相關資料要保存3年<br><span class=\"it\">D.</span> 本行開立予客戶放款繳息收據載明支票及支票號碼者仍須繳納印花稅","o":["AB","ACD","AD","BCD"],"a":3,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(四)典賣、讓受及分割不動產契據每件按金額0.1％。另本行如事前與立據之關係人約定，於合約期滿時雙方若無異議，契據將自動依原契據期間<mark>延長而繼續有效者，屆期</mark>應再<mark>貼印花稅票</mark>。印花稅以計至通用貨幣元為止，元以下自動捨去。"},"x":"自動延長之契據屆期<b>應再貼</b>印花稅票（B 錯）；印花稅資料保存 <b>5 年</b>（C 錯）；放款繳息收據載明支票號碼者<b>免</b>印花稅（D 錯）→ BCD。"},{"id":"110-59","y":110,"n":59,"m":10,"q":"有關本行預算規範之敍述，下列何者錯誤？<br><span class=\"it\">A.</span> 經核配之費用支出預算若有不足，須於預算線上簽核系統申請追加預算<br><span class=\"it\">B.</span> 屬核實開支之費用支出預算若有不足，須於預算線上簽核系統申請追加預算<br><span class=\"it\">C.</span> 上期核准之費用支出預算與資本支出預算，逾期未使用均不可遞延至下期使用<br><span class=\"it\">D.</span> 費用支出預算與資本支出預算若有不足，均可辦理預算流用","o":["AB","ACD","BCD","ABCD"],"a":2,"ci":{"b":"會計篇","c":"附錄六 『電子表單線上簽核作業系統』作業應注意事項","s":"","t":"價單之費用預算申請及<mark>資本支出預算</mark>申請並依採購細則可於【<mark>預算線上簽核系統</mark>】以本表單向業管單位申請。2.各項修護費、分擔大樓管理費、外包費-護衛駕駛人員及保警及保全費用-常駐警衛人員案件，核配不足時應逐筆檢附合約或估價單影本等相關文件並敍明理由，以本表單向業管單位申請。"}},{"id":"110-60","y":110,"n":60,"m":10,"q":"有關費用支出預算發生超支時之處理，下列敍述何者正確？<br><span class=\"it\">A.</span> 如係核配預算不足，可流用另一筆費用支出預算以解決預算超支<br><span class=\"it\">B.</span> 如係預算歸屬期別錯誤，於預算線上簽核系統申請修改該筆費用支出預算之年度期別 C.6月預算超支且已逾期底，如係帳列會計項、子目錯誤，經由帳務更正後預算即不會超支 D.12月預算超支且已逾期底，如係未申請預算，仍須補申請預算","o":["AB","BC","BCD","B"],"a":3,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第四節 費用控管","t":"(三)超支原因如屬費用<mark>預算歸屬期別錯誤，</mark>如核准費用預算期別為「○年下期」，卻於「○年上期」辦理開支，致上期費用超支時，應於系統上點選「修正/刪除已核准申請單」表單，<mark>申請修改該筆費用預算之年度期別</mark>。"}},{"id":"111-1","y":111,"n":1,"m":3,"q":"辦理定期性存款扣押作業時，下列敘述何者為非？","o":["存單尚未到期時，仍應辦理扣押，並向來文機關聲明異議","存單有質權設定者，仍應辦理扣押，並向來文機關聲明異議","有質權設定之存單遭扣押後，倘接獲法院撤銷扣押命令時，即可辦理解除質權","如扣押時日已久未接獲解繳命令，可函詢來文機關該筆扣押執行進度"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"第一章通則1-79(三)本專戶內之存款，不得辦理抵銷、扣押、供擔保或強制執行﹔<mark>倘接獲法院</mark>或各行政執行處之執行命令，於執行「法院扣押資料維護交易」（交易代號：999Z，代碼01建檔）時，如登錄單列示「本帳戶係依社會救助法開立專戶，不得抵銷、扣押、供擔保或強制執行」字義，則該帳戶免執行「法院扣押設定交易」（交易代號：925Z），惟應具文向來文機關聲明異議。"}},{"id":"111-2","y":111,"n":2,"m":3,"q":"下列關於警示帳戶及衍生管制帳戶敘述，何者為非？","o":["存款帳戶經設定為警示帳戶後，電腦將連動暫停該帳戶全部交易功能","營業單位接獲司法警察機關正式函文及函附之「民眾辦理解除警示帳戶申請書」，得直接解除聯徵中心及本行之警示帳戶設定","存款帳戶經設定為衍生管制帳戶後，將暫停該帳戶金融卡功能、語音轉帳、網路轉帳及其他電子支付功能，匯入款項逕以退匯方式退回匯款行","衍生管制帳戶經查證無詐騙之虞，營業單位可逕解除衍生管制帳戶限制"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(一)<mark>營業單位接獲司法警察機關正式函文</mark>（本節附錄五）<mark>及函附之「民眾辦理解除警示帳戶申請書」</mark>（本節附錄六）後，應填寫「<mark>解除警示</mark>通報<mark>申請書」</mark>（本節附錄七），並檢附相關文件送營運業務處俾<mark>解除聯徵中心及本行</mark>「<mark>警示帳戶</mark>通報資料維護交易」（交易代號：9490）之通報紀錄。營運業務處執行前述交易之「代號：3：刪除」或「代號：6：解除」時，系統將連動執行「存戶餘額留存登錄及解除交易」（交易代號：9330；代碼：29-<mark>解除警示</mark>戶）及「外匯活期存款存戶事故解除」（交易代號：5260；代碼：07-警示戶解除）。"},"x":"解除警示帳戶須填「解除警示通報申請書」檢附文件<b>送營運業務處</b>解除，營業單位不得直接解除 → (B)錯。"},{"id":"111-3","y":111,"n":3,"m":5,"q":"受理有摺戶辦理無摺提領現金或轉入不同戶名帳戶時，下列何者為非？","o":["由存戶本人臨櫃辦理時，應由存戶出示身分證明文件，並於取款憑條親簽確認無摺支出意旨，背面認證欄加蓋經辦私章","由存戶本人臨櫃辦理時，提領金額不受限制","存戶本人未臨櫃辦理時，應由經辦向存戶本人確認，並將確認情形記載於取款憑條背面","存戶本人未臨櫃辦理時，提領現金應留存交易人姓名"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第三節 記帳","t":"第四章活期存款4-4(１)本人（或公司、行號、團體之負責人）<mark>臨櫃辦理時</mark>：提領金額不受限制，惟應請存戶出示身分證明文件由記帳經辦確認係本人辦理，並請其<mark>於取款憑條</mark>親簽確認無摺支出意旨，再由經辦<mark>於取款憑條背面</mark>認證欄「※向<mark>本人確認</mark>無誤（經辦蓋章）：」後蓋章，再據以辦理支出作業。(２)本人（或公司、行號、團體之負責人）<mark>未臨櫃辦理時</mark>：A.存戶提領現金以新臺幣50萬元為限，逾該金額之提現，得經單位經理<mark>於取款憑條背面</mark>認證欄「※提領現金逾新臺幣50萬元須經單位經理同意（蓋章）：」蓋章同意後酌情辦理，惟應依規辦理確認。B.由主管<mark>向存戶本人</mark>或公司<mark>確認，並將確認情形</mark>（公司接聽人員、確認結果）<mark>記載於取款憑條背面</mark>認證欄「※接聽人員：」及「確認結果：□正常□異常」後蓋章後再辦理支出，提領現金應<mark>於取款憑條背面</mark>認證欄「※領現留存交易人姓名：」記載交易人姓名。C.辦妥支出交易後應促請客戶七日內持存摺來行或利用自動化設備補登存摺（執行交易代號：1030-6，查核『最後補摺日』），有關存摺補登情形之追蹤"},"x":"本人未臨櫃辦理無摺提領，現金以新臺幣 50 萬元為限且須由<b>主管</b>向存戶確認，非由經辦確認 → (C)錯。"},{"id":"111-4","y":111,"n":4,"m":2,"q":"營業單位受理法務部調查局所屬單位函查客戶資料時，下列敘述何者為非？","o":["臺北市調查處應以調查處名義行文並經處長判行","航業調查處基隆調查站應以調查站名義行文並經站主任判行","函查公文應副知法務部調查局","來文應註明該偵查中案件經調查局審核立案"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十二節 存款之保密與查詢","t":"(一)法務部１、法務部調查局查詢(１)應表明係為偵辦案件需要，註明案由，以經該局局長（副局長）審核認定為必要者為限。(２)配合法務部建立快速查詢管道，法務部所屬各檢察機關得以定型便函傳真至各金融機構先行提供犯罪嫌疑人存、放款資料，事後再補正式公函辦理。惟應確認該傳真號碼與各檢查機關傳真電話號碼相同，以防杜他人冒用。（財政部84.8.14台財融字第84751618號函）(３)配合該局授權層級作業，有關臺北市等直轄市調查處、福建省調查處及<mark>航業調查處</mark>以調查處<mark>名義行文並經</mark>處長判行，及臺灣省調查處所屬調查站及工作站以<mark>站名義行文並經站主任判行</mark>後，逕行發文向銀行查詢客戶資料並副知法務部調查局備查，且於來文註明該偵查中案件係經該局審核立案者。（金融監督管理委員會103年10月31日金管銀法字第10300247160號函）"},"x":"直轄市、福建省及<b>航業調查處</b>應以調查處名義行文並經處長判行；以站名義行文者為臺灣省調查處所屬調查站 → (B)錯。"},{"id":"111-5","y":111,"n":5,"m":6,"q":"有關新臺幣存單存款業務，下列敘述何者為非？","o":["聯行可辦理存單自動轉期(息)申請/變更","得於聯行辦理定期存單質權設定","存單掛失事故狀態下於聯行辦理自動轉期/息申請變更，需經主管核准始得辦理","得於聯行辦理開立存單"],"a":1,"ci":{"b":"存款篇","c":"第十章 定期存款","s":"第一節 性質","t":"五、帳務性交易，除存單存款之<mark>法院扣押抵銷及解繳、質權設定</mark>、法院提存事故狀態、結構型商品及離職儲金帳戶，仍須於原始開戶行辦理外，其餘如開立存單交易、到期取款（含中途解約）、付息、轉期續存、補付利息、補徵利息及所得稅調整作業等，各營業單位皆可辦理。"},"x":"定期存單之<b>質權設定</b>須於原始開戶行辦理，不得於聯行辦理 → (B)錯。"},{"id":"111-6","y":111,"n":6,"m":4,"q":"有關受理票據受款人以委任取款之目的背書者，下列敘述何者為非？","o":["票據背面應記載「票面金額委託○○○取款」","由受款人自行簽章，即完成委任手續","須提示受款人身分證明文件，經本行核對無誤留存影本","如提出交換者，須由有權簽章人員證明「存入受任人帳戶無誤」"],"a":1,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"","t":"十二、受款人以委任取款之目的而為背書者，應於票據背面應記載「票面金額委託○○○取款」，並<mark>由受款人</mark>及受任人共同簽章以<mark>完成委任手續</mark>，受任人持向銀行要求代收時，應提示受款人身分證明文件，經提示行核對無誤並簽章證明「存入受任人帳戶無誤」後，付款銀行得予照付。"},"x":"委任取款背書須由<b>受款人及受任人共同簽章</b>，非受款人自行簽章即完成 → (B)錯。"},{"id":"111-7","y":111,"n":7,"m":4,"q":"由機器人流程自動化(RPA)辦理法人支票存款開戶基本資料查詢比對作業，將針對查對 結 果 資 料 不 符 者 產 製 「 法 人 支 存 戶 基 本 資 料 查 對 結 果 不 符 明 細 表 ( 代號:CK36MR)」，下列作業何者為非？","o":["支存經辦應於每年1月15日列印CK36MR報表","每年2月底前通知客戶來行辦理變更基本資料","如無法聯繫客戶辦理變更，應停止或減少發給空白票據","CK36MR報表應呈核至分行副理後專卷保存5年"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"(五)每年1月15日由機器人流程自動化(RoboticProcessAutomation，下稱RPA)，針對本行法人支票存款開戶基本資料，與主管機關登記資料進行查詢與比對，並將查對結果不符者產製「法人支存戶基本資料查對結果不符明細表」(分行月報表，報表代號：<mark>CK36MR</mark>，日期：每年12月31日)，營業單位支存經辦應於每年1月15日至「報表查詢列印系統」（OnDemand）查詢列印，相關注意事項如下："}},{"id":"111-8","y":111,"n":8,"m":9,"q":"營業單位於假期間辦理行內ATM裝卸鈔作業規定，下列敘述何者為非？","o":["裝卸鈔當日應填寫「假期間裝卸鈔作業紀錄表」","「假期間裝卸鈔作業紀錄表」由櫃員主任保管並於次一營業日交付ATM經辦","卸下之鈔匣現金應置放於金庫室之現金室內","「假期間裝卸鈔作業紀錄表」應裝訂於次一營業日依據紀錄表執行「自動櫃員機裝卸鈔維護交易」認證之傳票後保管留存"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制 附錄三 ）第三條至第八條，包括現任或曾任國外政府與國際組織重要政治","t":"十三、有關營業單位行外自動櫃員機委託保全公司填補鈔作業，如係採將補鈔金額匯款或轉帳至保全公司指定帳戶之交易方式辦理，非屬「金融機構防制洗錢辦法」所稱申報大額通貨交易之範圍，爰辦理行外ATM裝卸鈔暫以其他應收款墊支及歸墊作業，得免辦理A190交易之建檔，為配合本項作業，執行A830、A836交易並以「其他應收款-其他應收款諸戶」子目下「安豐保全公司」（代號：14184-501）及「聯安保全公司」（代號：14184-502）分戶辦理之現金存入及支出之交易，將不產生大額通貨序號。"},"x":"假期間行內 ATM 裝卸鈔：當日填「假期間裝卸鈔作業紀錄表」、卸下現金置金庫現金室，紀錄表裝訂於次一營業日之裝卸鈔維護交易傳票後保管；選項所述由櫃員主任保管再交付 ATM 經辦之流程與規定不符。","lo":1},{"id":"111-9","y":111,"n":9,"m":3,"q":"下列何者毋須辦理「大額通貨交易資料(申報)建檔」交易(交易代號：A190)？","o":["存入單筆現金新臺幣60萬元","聯行間資金調撥","存入單筆現金新臺幣65萬元繳納增資股款","公益彩券經銷商現金批購彩券新臺幣150萬元"],"a":1,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十節 靜止戶之處理","t":"九、久未往來戶（含「久未往來-舊」）之控管作業：(一)帳戶經設定為「久未往來戶」後，客戶仍得辦理一般存提款交易，但提現金額超過50萬元之交易，除依防制洗錢作業規定辦理「大額通貨交易資料（申報）建檔」（交易代號：A190）及留存交易憑證外，並依「營業單位防範存戶遭詐騙及臨櫃領取大額現金注意事項」進行客戶關懷作業。"},"x":"聯行間資金調撥非客戶之通貨交易，<b>毋須</b>辦理大額通貨交易建檔；單筆現金 50 萬元以上存提、繳增資款、彩券批購仍須建檔。"},{"id":"111-10","y":111,"n":10,"m":7,"q":"有關營業單位辦理營業稅申報，下列敘述何者錯誤？","o":["申報後營業稅申報書收執聯應掃描上傳至「分行管理系統」項下之「營業稅調節表填報系統」","若於年度中發現有營業稅溢（漏）繳稅款之情事者，應於次月份手工調整時辦理回沖（補提）","目前分行已採機器人流程自動化(RPA)辦理營業稅網路申報","完成申報、繳納及核定後之申報書、計算表等相關文件設置專卷保管，保存期限為1年"],"a":3,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"四、保管文件：<mark>完成申報、繳納及核定後</mark>，應將<mark>申報書、計算表</mark>及營業稅調節<mark>表等相關文件設置專卷保管，</mark>文件內容請詳本章最末頁附表「營業稅及印花稅彙總繳納申報作業文件彙整表」<mark>，保存期限為</mark>五年。"},"x":"營業稅申報書、計算表、調節表等文件設專卷保管，保存期限為<b>五年</b>，非 1 年 → (D)錯。"},{"id":"111-11","y":111,"n":11,"m":7,"q":"有關銀行業非專屬本業收入、銀行本業收入及其他金融業本業收入之營業稅率，下列何者正確？","o":["2％、5％、5％","5％、2％、5％","5％、5％、2％","5％、5％、5％"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"一、稅率：(一)依加值型及非加值型營業稅法第11條：1.<mark>非專屬本業收入</mark>：<mark>銀行業非專屬本業收入之營業稅率</mark>為5％。2.<mark>專屬本業收入</mark>：(1)<mark>銀行本業收入之營業稅率</mark>為5％。(2)<mark>其他金融業本業收入之營業稅率</mark>為2％。尾數不滿通用貨幣一元者，按四捨五入計算。"},"x":"銀行業非專屬本業收入 <b>5%</b>、銀行本業收入 <b>5%</b>、其他金融業本業收入 <b>2%</b>。"},{"id":"111-12","y":111,"n":12,"m":7,"q":"給付中華民國境內居住之個人利息所得，扣繳義務人應於何時將所扣繳之稅款向該管稽徵機關申報？","o":["代扣稅款之日起10日內","代扣稅款之次月月底前","以2個月為一期辦理申報","每年1月底前將上一年內扣繳稅款，開具扣繳憑單，彙報該管稽徵機關查核"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"四、繳稅：(一)代扣之利息所得稅款，應於每月十日<mark>前將上一</mark>月內所扣稅款向國庫繳清，並於每年一<mark>月底前將上一年內扣繳</mark>各納稅義務人之稅款數額，開具「各類所得扣繳暨免<mark>扣繳憑單</mark>」<mark>，彙報該管稽徵機關查核</mark>。（所得稅法第92條）"},"x":"境內居住個人利息扣繳稅款：每月 10 日前繳清上月稅款，並於<b>每年 1 月底前</b>開具扣繳憑單彙報稽徵機關。"},{"id":"111-13","y":111,"n":13,"m":1,"q":"關於端末整合開戶交易流程電子郵件檢核及驗證機制，下列敘述何者正確？","o":["E-MAIL重覆檢核結果為「N」時，表示該客戶不得辦理開戶","E-MAIL重覆檢核結果為「Y」時時，需留存E-MAIL重覆原因","E-MAIL驗證信有效期限為72小時","如客戶申辦電子綜合業務對帳單，但未完成E-MAIL驗證，系統將改為郵寄綜合業務對帳單"],"a":1,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第二節 零存整付","t":"(五)系統將於零存整付委託代繳之約定扣款日前7日，依客戶留存於本行之「<mark>E-MAIL</mark>信箱」傳送電子郵件通知客戶。電子郵件採加密方式處理，欲開啟電子郵件傳送之附加檔案時，個人戶需輸入身分證字號，非個人戶需輸入統一編號。"}},{"id":"111-14","y":111,"n":14,"m":1,"q":"受理本國未成年人開戶(不含支票存款帳戶)得依下列何者方式辦理？<br><span class=\"it\">A.</span> 父母雙方共同臨櫃辦理<br><span class=\"it\">B.</span> 父或母一方單獨持他方同意書到場辦理<br><span class=\"it\">C.</span> 無行為能力人自行持父母雙方同意書單獨臨櫃辦理<br><span class=\"it\">D.</span> 限制行為能力人提示雇主出具且已註明僱傭關係業經法定代理人同意之僱傭證明臨櫃開立薪資轉帳戶","o":["ABC","ABD","ACD","BCD"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"６、為利<mark>未成年人</mark>辦理<mark>開戶(不含支票存款帳戶)</mark>，<mark>受理本國未成年人開戶得依下列</mark>任一<mark>方式辦理</mark>：(１)父母偕同<mark>未成年人</mark>來行辦理。(２)父母共同來行代理未成年子女開戶，<mark>未成年人</mark>可不必到場。(３)<mark>父或母一方單獨持他方同意書</mark>代理未成年子女開戶，<mark>未成年人</mark>可不必到場。(４)<mark>限制行為能力人</mark>得<mark>自行持父母同意書單獨臨櫃辦理</mark>開戶。"},"x":"未成年人開戶方式：父母偕同、父母共同代理、父或母一方持他方同意書代理（B）、<b>限制行為能力人</b>得自行持父母同意書臨櫃；無行為能力人不得自行辦理（C 錯）→ ABD。"},{"id":"111-15","y":111,"n":15,"m":4,"q":"有關票據之審核，支票抬頭除個人姓名外再加「先生」、「律師」、「教授」、「會計師」等稱謂，則該抬頭人背書時，如姓名完全一致，雖未加寫稱謂時？","o":["一律以背書不符退票","一律以背書不連續退票","應視為背書無訛，不生背書不連續之問題","由櫃員自行加上稱謂，以避免發生退票"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"１１、背書蓋有公司、行號之名稱及個人職銜戳記而將職銜部份塗銷者，不能認為完成背書行為，應予退票。１２、支票抬頭除個人姓名外再加「先生」、「律師」、「教授」、「會計師」等稱謂，則該抬頭人背書時，如姓名完全一致，雖未加寫尊稱，應視其<mark>背書無訛，不生背書不連續之問題</mark>。（台北市銀行公會72.8.11會法字0992號函）"},"x":"抬頭加「先生」「律師」等稱謂，背書時姓名完全一致雖未加稱謂，<b>應視為背書無訛</b>，不生背書不連續問題。"},{"id":"111-16","y":111,"n":16,"m":9,"q":"櫃員主任休假時，下列敘述何者為非？","o":["填具「櫃員主任休假應移交物品及辦理事項檢核表」由主管監交後蓋章確認","電子金庫之管理者應新增「使用者密碼」予代理人","休假期間檢核表由監交主管保管，休假後次一營業日交付會計人員保管","檢核表設專卷保管5年，並列入移交"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十三節 新一代金融端末系統之使用與管理","t":"(二)除業務必要或特殊狀況需專任外，應屬兼任性質，僅得協助主管執行檢核工作（例如：主管<mark>休假期間</mark>）。(三)於執行存匯檢核專員職務時，須停止處理經辦業務，同時刪除其經辦權限，再授權存匯檢核專員之權限，並且不得覆核自身經辦業務，以達相互牽制目的。"},"x":"櫃員主任休假應填「櫃員主任休假應移交物品及辦理事項檢核表」由主管監交；電子金庫管理者新增代理人密碼；檢核表專卷保存 5 年；選項 C 所述保管交付方式錯誤。","lo":1},{"id":"111-17","y":111,"n":17,"m":8,"q":"委託保全公司運送現金收款，營業單位(接收行)點收現金時，應由","o":["主管","櫃員主任","主管及櫃員主任會同","經理 簽收"],"a":2,"ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第十節 其他應注意事項","t":"三、各營業單位如擬銷毀空白可轉讓定期存單，除總行營業部不得辦理銷毀作業外，桃園、新竹、台中、嘉義、台南及高雄分行等保管分行及其他分行應至少留存3年之安全庫存量，其餘應俟董事會稽核處稽核人員業務檢查時，執行「總務/<mark>櫃員主任</mark>空白存單維護交易」（交易代號：20H0，交易類別4：註銷庫存存單），並於稽核人員會同主管及會計監督下，由<mark>櫃員主任</mark>自行銷毀。(2025/05/20營管字第000339號函)"},"x":"委託保全運送現金，接收行點收現金應由<b>主管及櫃員主任會同</b>簽收。","lo":1},{"id":"111-18","y":111,"n":18,"m":8,"q":"有關庫存現金之點檢，下列敘述何者為非？","o":["庫存現金帳務覆核與實物覆點應由同一人執行","分行經理應視本身業務量親自或授權未輪值掌管金庫鑰匙之主管每星期至少機動覆點1次","採授權之單位，經理每月至少仍應覆點1次","經理親自覆點庫存現金應同時清點行內自動櫃員機機存現金"],"a":0,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第二節 櫃員制臨櫃之結帳","t":"一、一般櫃員之結帳：(一)盤點<mark>庫存現金</mark>及辦理現金結帳設定：執行「櫃員帳務查詢交易－櫃員轉帳暨<mark>庫存現金</mark>查詢」(交易代號：1092－1)，盤點<mark>庫存現金</mark>與現金帳餘額相符，倘若不符，可執行「櫃員帳務查詢交易－櫃員交易明細查詢(現金)」(交易代號：1092－6)，查詢與現金有關之交易明細，經盤點相符後，執行「櫃員帳務結帳設定交易－現金結帳設定」(交易代號：1099－1)辦理現金結帳設定，並自動列印「櫃員資金紀錄表」連同<mark>庫存現金</mark>送交主管覆點後，再轉交櫃員主任。"},"x":"庫存現金帳務覆核與實物覆點<b>不得由同一人</b>執行；經理每週至少機動覆點 1 次（授權者經理每月仍應覆點 1 次）。","lo":1},{"id":"111-19","y":111,"n":19,"m":7,"q":"有關印花稅之敍述，下列何者為非？","o":["買賣動產契據、承攬契據、兼具營業發票性質之銀錢收據及兼具銀錢收據性質之營業發票等均須繳納印花稅","目前本行印花稅尚未採機器人流程自動化(RPA)辦理網路申報","本行開立予客戶放款繳息收據載明支票及支票號碼者無須繳納印花稅","印花稅以計算至通用貨幣元為止，元以下自動捨去"],"a":0,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"<mark>據及兼具銀錢收據性質之營業發票</mark>，不包括在內。(二)<mark>買賣動產契據</mark>。(三)<mark>承攬契據</mark>。(四)典賣、讓受及分割不<mark>動產契據</mark>。二、免稅範圍："}},{"id":"111-20","y":111,"n":20,"m":7,"q":"中華民國境內居住之個人於下列何項所得每次應扣繳稅額雖不超過新臺幣2,000元，仍須於給付時辦理扣繳稅款？","o":["佣金","租金","執行業務者之報酬","金融債券之利息"],"a":3,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第一節 所得稅","t":"3.扣繳稅額：中華民國境內居住之個人，或在中華民國境內有固定營業場所之營利事業及在臺灣地區有固定營業場所或營業代理人之大陸地區法人、團體或其他機構，除下列所得仍應依規定扣繳外，其餘各項所得每次應扣繳稅額不超過新臺幣二千元者，免予扣繳。(1)短期票券到期兌償金額超過首次發售價格部分之利息。(2)依金融資產證券化條例及不動產證券化條例規定發行之受益證券或資產基礎證券分配之利息。(3)公債、公司債或<mark>金融債券之利息</mark>。(4)以前三款之有價證券或短期票券從事附條件交易，到期賣回金額超過原買入金額部分之利息。(5)與證券商或銀行從事結構型商品交易之所得。"},"x":"應扣繳稅額不超過 2,000 元免扣繳之例外：短期票券利息、證券化受益證券利息、<b>公債、公司債或金融債券之利息</b>等仍應扣繳 → (D)。"},{"id":"111-21","y":111,"n":21,"m":5,"q":"關於整批開立薪資轉帳戶之帳戶類型，下列敘述何者為非？","o":["業務別:68金如意綜合管理帳戶","帳戶性質別:30綜存薪資戶","取款碼預設為開戶人出生日期4碼","新臺幣定存質借約定預設為不可質借"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"第一章通則1-49１、辦理9234交易前，應先以「顧客基本資料查詢交易（交易代號：9701）」，查詢代號：「00：螢幕索引查詢」（重複序號毋須輸入，直接按Enter鍵），依螢幕顯示之「顧客統一編號、重複序號、戶名及創立／<mark>出生日期</mark>」等資料，以研判該客戶是否已為開戶。"},"x":"整批開立薪資轉帳戶：業務別 68 金如意、性質別 30 綜存薪資戶、新臺幣定存質借預設不可質借；取款碼並非預設為出生日期 4 碼。","lo":1},{"id":"111-22","y":111,"n":22,"m":2,"q":"下列何項業務未開放聯行辦理？","o":["籌備處變更為一般戶","個人戶變更統一編號","非個人戶變更統一編號","變更存戶稅別代號"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十九節 其他應注意事項 附錄二 金融機構辦理國內匯款及無摺存款作業確認客戶身分原則","t":"4.支存帳戶。5.郵寄結清銷戶。更換戶名/統編/稅別下列情形限於原開戶行辦理：<mark>籌備處變更為一般戶</mark>變更綜合業務對帳單寄發(或交付)方式餘額證明金好用申請/註銷存款交易明細查詢存款帳戶餘額"},"x":"更換戶名／統編／稅別中，「<b>籌備處變更為一般戶</b>」限於原開戶行辦理，未開放聯行。"},{"id":"111-23","y":111,"n":23,"m":1,"q":"下列有關iLEO數位帳戶申請留存印鑑作業流程，何者為非？","o":["客戶為成年人時，應親持國民身分證及第二證件正本至任一分行辦理","客戶曾於本行開立存款帳戶且已於「印鑑暨影像管理系統」留存人像者，開放得由外訪人員辦理對保申請","客戶臨櫃提示第二證件與申請數位帳戶上傳之第二證件不相符時，需留存第二證件影像檔或影本","印鑑卡應由受理行依帳號順序歸檔"],"a":3,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第二節 開戶手續","t":"(二)印鑑卡按<mark>帳號順序</mark>訂冊，以便核對，同時於印鑑暨影像管理系統辦理印鑑建檔。(三)實施「存匯業務影像管理系統」作業前徵取之「支票存款開戶申請及往來約定書」、「支票存款約定書補充條款」應按<mark>帳號順序</mark>保存。"},"x":"iLEO 數位帳戶留存印鑑：成年人親持身分證及第二證件至任一分行；既有客戶已留人像得由外訪人員對保；印鑑卡歸檔方式非「依帳號順序」由受理行歸檔。","lo":1},{"id":"111-24","y":111,"n":24,"m":11,"q":"有關黃金存摺結清銷戶作業，何者正確？","o":["不論有無餘額，皆不得辦理郵寄結清","限原開戶分行辦理","「黃金存摺帳戶結清銷戶申請書」應透過「存匯業務影像管理系統」之「存匯歷史件掃描」功能辦理掃描保存","黃金存摺帳戶尚有餘額時，仍得辦理黃金存摺結清交易(代號:P250)，餘額將連動存入客戶約定帳戶"],"a":2,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第二節 開戶作業","t":"(五)開戶文件之整理與掃描：開戶作業完成後，應將各類開<mark>戶申請書</mark>、證明文件及相關附件等依照「存匯<mark>影像管理系統」</mark>作業應注意事項辦理歸檔並<mark>透過「存匯影像管理系統」之「存匯歷史件掃描」功能辦理掃描</mark>。"},"x":"黃金存摺結清銷戶申請書應以「存匯業務影像管理系統」之「存匯歷史件掃描」保存；尚有餘額不得逕辦結清交易。","lo":1},{"id":"111-25","y":111,"n":25,"m":3,"q":"客戶帳戶於 2022 年 9 月 30 日通報為警示帳戶，下列那個日期該帳戶之警示期限已自動失效？","o":["2023年3月31日","2023年10月1日","2024年3月31日","2024年10月1日"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(四)警示帳戶之警示期限自每次通報時起算，<mark>逾2年自動失其效力</mark>，但有繼續警示之必要者，原通報機關應於期限屆滿前再行通報之，通報延長以一次及一年為限。"},"x":"警示期限自通報時起算<b>逾 2 年</b>自動失效：2022/9/30 通報 → 2024/10/1 已失效。"},{"id":"111-26","y":111,"n":26,"m":6,"q":"定期儲蓄存款(零存整付存款除外)，存入本金之最低額度何者正確？","o":["新臺幣5千元","新臺幣1萬元","新臺幣5萬元","新臺幣10萬元"],"a":0,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"二、定期儲蓄存款（零存整付存款除外）存入本金之最低額度，自2002年7月1日起調整為<mark>新臺幣5千元</mark>，零存整付儲蓄存款每次存入金額為新臺幣1千元以上。"},"x":"定期儲蓄存款（零存整付除外）存入本金最低額度為新臺幣 <b>5 千元</b>；零存整付每次 1 千元以上。"},{"id":"111-27","y":111,"n":27,"m":5,"q":"利用電子化通路進行活期性存款轉存定期性存款〔不含以臨櫃方式辦理或已約定存單到期自動續存者、單筆轉存金額逾新臺幣300萬元(含)以上者(適用大額利率)及屬綜合存款約定自動轉存定期性存款者〕，每一帳戶每月累計限額為新臺幣","o":["50萬元","100萬元","200萬元","300萬元"],"a":1,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第三節 存、取款及質借","t":"１、<mark>以臨櫃方式辦理定期性存款</mark>及<mark>已約定存單到期自動續存者</mark>。２<mark>、單筆轉存金額逾新臺幣300萬元</mark>（含）以上者（<mark>適用大額利率</mark>）。"}},{"id":"111-28","y":111,"n":28,"m":4,"q":"有關票據之審核，下列何者為非？","o":["票據金額文字應以大寫金額為原則","票據金額文字大寫與小寫號碼不符時，應以大寫文字為準","票據金額文字以「廿」代替「貳拾」者得付款","票據金額「三」字大寫為「參」、「叁」或「参」銀行不得拒付"],"a":2,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第四節 票據之審核","t":"(七)<mark>票據金額文字以「廿」代替「貳拾」者</mark>不得付款。(八)票據文字大寫金額之「貳」字誤寫為「」時，而小寫金額已明白表示為「2」時，應可照付。惟付款行應請該存戶嗣後簽發票據改用通用文字。（中央銀行業務局"},"x":"票據金額文字以「廿」代替「貳拾」者<b>不得付款</b> → (C)錯。"},{"id":"111-29","y":111,"n":29,"m":4,"q":"有關票據日期之審核，下列何者為非？","o":["未載發票年月日者，應以「法定要項不全」理由退票","發票日期為2月30日，則以該月之末日為發票日","發票日期為4 58,"m":9,"q":"有關櫃員制下傳票之彙整，下列敘述何者為非？","o":["複式轉帳傳票排列於單式傳票之前","外幣傳票排列於新臺幣傳票之前","臨時存欠傳票歸類為「會計明細分類帳」傳票，按會計項目別排列","單式傳票按轉帳收入、現金收入、轉帳支出及現金支出分類"],"a":1,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"一、臨櫃傳票之分類、整理：(一)各櫃員之傳票應按複式轉帳傳票、單式傳票分類，單式傳票再按轉帳收入、現金收入、轉帳支出及現金支出分類；排列時，複式轉帳<mark>傳票排列於</mark>單式傳票前，複式轉帳傳票依傳票類別分類彙整，免排序，單式傳票依活存、行存、支存、活儲、放款、定儲存、代理聯行收付（NET）、匯出匯款申請書及調整單、聯行往來、會計明細分類帳(按會計項目別)及其他等順序排列，如有二個以上會計項子目時，則依第一個會計項子目排列，將「櫃員結帳彙總查詢單（已結帳）」置於<mark>傳票之前</mark>交會計人員彙整，會計人員應再依「分行結帳資料表」之櫃員順序排列。"}},{"id":"111-59","y":111,"n":59,"m":7,"q":"下列何者本行須繳納印花稅？","o":["信用卡手續費收入","保管箱手續費收入","客戶以現金繳納放款利息","營業資產租金收入"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第三節 印花稅","t":"(二)銀行業經營非專屬本業部份之銷貨收入，所開立具有營業發票性質之銀錢收據，如信用卡手續費收入、保管箱手續費收入、營業資產租金收入等，依印花稅法第5條第2款但書規定，免納印花稅。（財政部86.9.12台財稅第861915311號函）"},"lo":2},{"id":"111-60","y":111,"n":60,"m":10,"q":"採購金額新臺幣（　）以上者，應檢附2家(含)以上估價單影本連同申請單，向業管單位申請核准後辦理採購。","o":["1萬元","2萬元","3萬元","5萬元"],"a":3,"ci":{"b":"會計篇","c":"第八章 各項開支執行與審核","s":"第二節 開支執行","t":"(四)<mark>採購金額新臺幣</mark>五萬元<mark>以上者，應檢附2家(含)以上估價單影本連同申請單，向業管單位申請核准後辦理採購。</mark>五、總部單位採購案件"},"x":"採購金額新臺幣 <b>五萬元</b>以上者，應檢附 2 家（含）以上估價單影本向業管單位申請核准。"},{"id":"112-1","y":112,"n":1,"m":1,"q":"甲、乙、丙三位客戶聲明其稅籍狀態分別為：甲客戶具有中華民國及美國稅籍、乙客戶具有美國及日本稅籍、丙客戶具有中華民國、美國及英國稅籍，受理甲、乙、丙客戶開戶執行「整合開戶交易」(交易代號：9236)時，「CRS 外國稅籍註記」欄位何者要輸入「Y」？","o":["甲、乙","甲、丙","乙、丙","甲、乙、丙"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"9.依申請人資料辦理※顧客基本資料建檔；如客戶非<mark>中華民國稅籍、美國稅籍</mark>者，應於<mark>「CRS外國稅籍註記」欄位輸入「Y」</mark>，系統將連動<mark>「CRS</mark>客戶基本資料建檔<mark>交易」(交易代號：9</mark>777)"},"x":"「CRS 外國稅籍註記」：具<b>中華民國及美國以外</b>稅籍者輸入 Y → 乙（日本）、丙（英國）。"},{"id":"112-2","y":112,"n":2,"m":5,"q":"有關數位帳戶臨櫃提領現金之作業流程說明，下列敘述何者為非？","o":["需於本行國內任一營業單位申請留存印鑑式樣並於 iLEO APP 完成裝置綁定","透過 iLEO APP「數位帳戶臨櫃取款」功能取得「提領條碼」","至本行國內任一營業單位臨櫃辦理取款(不含轉帳、匯款)","每次及每月累計提領限額為新臺幣 100 萬元"],"a":3,"ci":{"b":"存款篇","c":"第十七章 綜合存款","s":"第三節 存、取款及質借","t":"２、存單存根聯註明「由綜存之定儲存改簽存單，未填製存入傳票」，存戶填寫之申請書按日期別妥善保存。(五)利用電子化通路進行活期性存款轉存定期性存款，每一帳戶<mark>每月累計限額為新臺幣</mark>3<mark>00萬元</mark>。惟有下列情形者，不計入累計限額："},"x":"數位帳戶臨櫃提領現金須先留存印鑑並完成 iLEO 裝置綁定、以「提領條碼」至任一營業單位取款（不含轉帳匯款）；選項所述每次及每月 100 萬元限額有誤。","lo":1},{"id":"112-3","y":112,"n":3,"m":11,"q":"關於「國內匯出匯款集中作業系統」媒體整批匯款收款人 AML 姓名檢核功能，下列敘述何者為非？","o":["作業中心放行人員覆核放行後，AML系統逐筆進行收款人戶名比對，比對結果如「正常」即匯出","相似值達門檻時，則系統自動逐筆發送業務通訊通知分行","主管未登入 AML 系統辦理結案，系統將每 30 分鐘自動發送業務通訊提醒分行","最遲應於下午四時再檢視有無尚未匯出之款項"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十六節 存款業務之洗錢防制","t":"第一章通則1-3751-375(六)系統將客戶（個人戶或非個人戶）、未成年人之法定代理人、非個人戶之負責人及法人戶、團體之實質受益人及高階管理人比對可疑名單相似值達門檻者，將於端末畫面或列印之登錄單提示訊息，具備登入「<mark>AML系統</mark>」權限之經辦應登入「<mark>AML系統</mark>」對可疑名單進行人工判讀作業，並請業務主管進行案件審核與結案(如為專任洗錢防制打擊資恐督導主管之營業單位，由督導主管進行案件審核與結案)："},"x":"媒體整批匯款 AML 姓名檢核：放行後逐筆比對，相似值達門檻自動發業務通訊通知分行，最遲下午 4 時再檢視；選項 C 所述「每 30 分鐘自動提醒」與規定不符。","lo":1},{"id":"112-4","y":112,"n":4,"m":11,"q":"營業單位應依「統一發票收執聯真偽辨識方法」加強辨別兌領發票之真偽，下列何者為「收銀機統一發票」特徵？<br><span class=\"it\">A.</span> 防偽底紋：底紋應連續<br><span class=\"it\">B.</span> 發票號碼：黑色數字且外緣呈現自然紅暈<br><span class=\"it\">C.</span> 滲透性油墨：背面鏡射數字為紅色，且與發票正面號碼相同<br><span class=\"it\">D.</span> 浮水印：可透過光線識別，且位置固定","o":["ABD","ACD","ABC","ABCD"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"(一)A、B、C均拋棄繼承，則繼承人為配偶乙及孫子女a、b。(二)僅B拋棄繼承，則繼承人為配偶乙及子女A、C。"},"x":"收銀機統一發票特徵：防偽底紋連續、發票號碼為黑色數字且外緣有自然紅暈、背面滲透性油墨鏡射紅色號碼（ABC）；「浮水印」非收銀機發票之辨識特徵。","lo":1},{"id":"112-5","y":112,"n":5,"m":6,"q":"外籍人士辦理定期儲蓄存款時，下列敘述何者為非？","o":["應審核是否已取得中華民國外僑居留證，且該筆存款期間不得逾其居留證之有效期限","無居留證之外籍人士，一律不得受理其辦理定期存款或定期儲蓄存款","居留證已逾期之外籍人士，可受理其改存「定期存款」（科目代號：40）","居留證未逾期之外籍人士，可受理其辦理居留證有效期限內之「指定到期日」定期儲蓄存款"],"a":1,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"七、有關國內金融機構辦理在臺有住所外國人開設新臺幣<mark>定期儲蓄存款</mark>帳戶之存期限制，對於已取得中華民國外僑<mark>居留證之外</mark>國人，基於符合國民待遇原則，得比照本國自然人開設相關存款帳戶，然如外國人所持居留證已逾有效期限時，則不具得以比照本國自然人之身分，自無法依照相關規定<mark>辦理定期儲蓄存款</mark>開戶事宜。為符合前述規定，<mark>外籍人士辦理定期儲蓄存款</mark>時，應審核該戶是否已取得中華民國外僑居留證，且該筆存款期間不得逾其<mark>居留證之</mark>有效期限，亦不得申請自動轉期。對於<mark>無居留證</mark>或居留證已逾期<mark>之外籍人士，</mark>如擬<mark>辦理定期</mark>性存款，則請其改存「<mark>定期存款</mark>」（科目代號：40）；另針對居留證未逾期<mark>之外籍人士，</mark>如擬<mark>辦理定期儲蓄存款</mark>且申請自動轉"},"x":"無居留證或居留證已逾期之外籍人士，可請其<b>改存「定期存款」</b>，並非一律不得辦理定期性存款 → (B)錯。"},{"id":"112-6","y":112,"n":6,"m":5,"q":"金如意綜合管理帳戶可作為<br><span class=\"it\">A.</span> 本行核准貸款循環額度之約定帳戶<br><span class=\"it\">B.</span> 公用事業費、稅款、信用卡款等各種費用約定代繳之扣款帳戶<br><span class=\"it\">C.</span> 代理證券商證券劃撥帳戶之約定帳戶<br><span class=\"it\">D.</span> 薪資轉帳之約定帳戶","o":["僅 B","僅 BD","僅 CD","ABCD"],"a":3,"ci":{"b":"存款篇","c":"第十八章 金如意綜合管理帳戶","s":"第一節 性質","t":"２、<mark>公用事業費、稅款、信用卡款等各種費用約定代繳之扣款帳戶</mark>。３、<mark>代理證券商證券劃撥帳戶之約定帳戶</mark>。４、<mark>薪資轉帳之約定帳戶</mark>。"},"x":"金如意綜合管理帳戶可作為循環額度約定帳戶、各種費用代繳扣款帳戶、證券劃撥約定帳戶及薪資轉帳約定帳戶 → ABCD。"},{"id":"112-7","y":112,"n":7,"m":5,"q":"受理客戶申請將證券劃撥交割帳戶變更為一般戶繼續使用時，下列敘述何者為非？","o":["應徵取「委託人劃撥交割帳戶結清(變更)同意書」或客戶集中保管帳戶已結清之證明書","劃撥帳戶為活期儲蓄存款帳戶時，須變更帳戶性質別為一般戶","劃撥帳戶為數位帳戶時，無須辦理性質別及證券戶序號變更","劃撥帳戶為金如意綜合管理帳戶時，無須辦理性質別變更，僅需辦理證券戶序號變更"],"a":2,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第二節 開戶手續","t":"２、「<mark>證券戶序號</mark>」設定(１)設定為「1」：表示證券劃撥交割帳戶存款餘額應支付證券商場地使用費。(２)設定為「0」：表示不需支付證券商場地使用費。如營業單位認為該客戶係本行或本行自行招攬者，應將「<mark>證券戶序號</mark>」變更為「0」。"}},{"id":"112-8","y":112,"n":8,"m":7,"q":"下列何者應徵取稽徵機關核發之免稅證明，始得免予扣繳利息所得稅款？","o":["政府機關","公寓大廈管理委員會","擬參選人政治獻金專戶","職工福利委員會"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"４、<mark>公寓大廈管理委員會</mark>或社區<mark>管理委員會</mark>如僅對住戶收取公共基金及相關管理費用，並無任何營利收入，其以<mark>管理委員會</mark>名義設立專戶儲存公共基金或管理費用之孳息，應於驗明稅捐機關核發之免扣繳證明後，辦理免扣所得稅。（財政部86.1.15台財稅字第861879100號函）"},"x":"公寓大廈或社區管理委員會僅收取公共基金及管理費、無營利收入者，應<b>驗明稅捐機關核發之免扣繳證明</b>後辦理免扣。"},{"id":"112-9","y":112,"n":9,"m":2,"q":"被繼承人甲未婚無子女，父母均已死亡，有兄弟乙、丙、丁三人，乙於繼承開始前已死亡，留有配偶 A 及子 B、丙於繼承開始後死亡，留有配偶 C，請問何者可繼承甲之存款？","o":["丁、A、B、C","丁、B、C","丁、C","丁"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十一節 存款之繼承","t":"其有於繼承開始前死亡或喪失繼承權者，由其直系血親卑親屬<mark>代位繼承</mark>其應繼分（如甲有三子A、B、C，倘A有二子M、O及配偶E，A先於甲或同時死亡時，M、O得代位繼承A之應繼分，但A之配偶E則無；"},"x":"代位繼承僅適用第一順位直系血親卑親屬；兄弟姊妹先死亡者其子女<b>不得代位</b>（B 不得繼承）；丙於繼承開始後死亡，其應繼分由其繼承人（配偶 C）再轉繼承 → 丁、C。"},{"id":"112-10","y":112,"n":10,"m":9,"q":"有關傳票認證、覆核之敘述何者正確？","o":["傳票認證欄均須人工蓋章認證","傳票經電腦登錄記帳後記帳人員應於認證欄蓋章認證","認證人員係指核准辦理該筆交易之主管人員","匯款申請書之認證僅須於主管(覆核)欄蓋章"],"a":3,"ci":{"b":"會計篇","c":"第一章 總則","s":"第四節 會計憑證","t":"3.其他：如有風險控管之需要，另訂「認證欄」蓋章規則者，依其規則辦理。(1)以預製之貸放傳票辦理記帳：於製票序號前首蓋章。(2)存單存款：於存單字號前首蓋章。(3)<mark>匯款申請書</mark>：<mark>於主管(覆核)欄蓋章</mark>。"},"x":"另訂認證欄蓋章規則者：預製貸放傳票於製票序號前首蓋章、存單於存單字號前首蓋章、<b>匯款申請書於主管（覆核）欄蓋章</b> → (D)正確。"},{"id":"112-11","y":112,"n":11,"m":9,"q":"有關櫃員制結帳之敍述何者正確？","o":["以櫃員為單位辦理結帳，日終結帳時，分行僅辦理臨櫃帳務之結帳","虛擬櫃員之結帳應指派結帳人員辦理，並登記於「覆核人員指派登記簿」","當一筆交易之借、貸方傳票無法由同一櫃員完成記帳時，由執行貸方傳票之櫃員執行業務 TA 移轉後始可辦理結帳","日終結帳時，一般櫃員之結帳由覆核人員辦理"],"a":0,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第一節 櫃員制結帳單位之作業方式","t":"3.電話語音銀行。4.EDI企業網路銀行。5.線上融資。6.應收帳款承購。7.ICB短期票券清算。二、櫃員制結帳之作業方式：<mark>以櫃員為單位辦理結帳，日終結帳時分行僅辦理臨櫃帳務之結帳</mark>，夜間資訊處彙總臨櫃、中心及自動化帳務辦理全分行之結帳，其特色如下："},"x":"櫃員制以<b>櫃員為單位</b>辦理結帳，日終結帳時分行僅辦理臨櫃帳務之結帳；夜間由資訊處彙總全分行 → (A)正確。"},{"id":"112-12","y":112,"n":12,"m":9,"q":"櫃員制下新臺幣傳票之彙整，下列敘述何者為非？","o":["單式傳票排列於複式轉帳傳票前","利息收入傳票一律歸類為「會計明細分類帳」傳票，按會計項目別排列","臨時存欠傳票歸類為「會計明細分類帳」傳票，按會計項目別排列","單式傳票按轉帳收入、現金收入、轉帳支出及現金支出分類"],"a":0,"ci":{"b":"會計篇","c":"第二章 櫃員制之日常會計事務處理","s":"第三節 櫃員制結帳單位傳票之彙整及調閱","t":"一、臨櫃傳票之分類、整理：(一)各櫃員之傳票應按<mark>複式轉帳傳票</mark>、<mark>單式傳票</mark>分類，<mark>單式傳票</mark>再按轉帳收入、現金收入、轉帳支出及現金支出分類；排列時，<mark>複式轉帳傳票排列於單式傳票</mark>前，<mark>複式轉帳傳票</mark>依傳票類別分類彙整，免排序，<mark>單式傳票</mark>依活存、行存、支存、活儲、放款、定儲存、代理聯行收付（NET）、匯出匯款申請書及調整單、聯行往來、會計明細分類帳(按會計項目別)及其他等順序排列，如有二個以上會計項子目時，則依第一個會計項子目排列，將「櫃員結帳彙總查詢單（已結帳）」置於傳票之前交會計人員彙整，會計人員應再依「分行結帳資料表」之櫃員順序排列。"},"x":"排列時<b>複式轉帳傳票排列於單式傳票之前</b> → (A)講反，錯。"},{"id":"112-13","y":112,"n":13,"m":7,"q":"如可轉讓定期存單持有人為非中華民國境內居住之個人或在中華民國境內無固定營業場所之營利事業，其到期兌償金額超過首次發售價格部分之利息，應按給付額扣取","o":["10%","15%","20%","30%"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十節 扣繳存款利息所得稅","t":"(五)<mark>可轉讓定期存單</mark>、商業票據（包括商業本票及商業承兌匯票）、銀行承兌匯票等短期票券，如<mark>持有人為非中華民國境內居住之個人或在中華民國境內無固定營業場所之營利事業，其到期兌償金額超過首次發售價格部分之利息，按給付額扣取</mark>百分之十五。其他應注意事項如下："},"x":"可轉讓定存單持有人為非境內居住個人等，利息按給付額扣取 <b>15%</b>。"},{"id":"112-14","y":112,"n":14,"m":11,"q":"有關黃金存摺定期投資，下列敘述何者為非？","o":["客戶可選擇「定期定額」或「定期不定額」投資方式","得選擇每月 1~26 日中任一日或數日為扣款日，最多可指定 8個日期","每次指定投資金額不得低於新臺幣 3,000 元或美金 200 元","客戶得向國內任一營業單位提出申請"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"３、有關向客戶所徵取之FATCA相關文件，倘非符合永久有效條件時，則自「本行取得文件日」隔年起算，至第三年年底日前有效，例如：簽署日期介於「20180101~20181231」之任一日期時，應由2019年1月1日起算，至第3年之年底日，則為「20211231」，應執行「FATCA客戶證明文件建檔交易」(交易代號：977A)建檔，資訊處將於每月第3個營業日產製即將於2個月內到期者之資訊(FATCA客戶證明文件到期控管表，報表代號：CFFA01，月報)，供各營業單位定期追蹤管理，並向其重新徵取「自我證明」及可證明其FATCA身分狀態之佐證文件。"},"x":"黃金存摺定期投資扣款日最多指定 <b>6</b> 個日期（非 8 個）；客戶得向國內任一營業單位申請。","lo":1},{"id":"112-15","y":112,"n":15,"m":1,"q":"下列何者得利用「第 e 個網」申請/變更/註銷證券約定帳戶？","o":["僅申請「第 e 個網」查詢功能之 20 歲上班族","已申請「第 e 個網」e 指通之受輔助宣告者","已申請「第e 個網」SSL 交易功能之 18 歲學生","已申請「第 e 個網」實體 OTP 之 15 歲學生"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"１０、整合開戶整併申請<mark>第e個網</mark>服務，提供申請基本(查詢)功能、SSL、e指通、本行同ID間轉帳免約定服務、線上約定轉入帳號服務及非約定轉帳服務，惟不提供新申請「實體OTP」及「憑證」；另當次新開立帳戶(除新台幣定期性存款、外匯定期存款及理財存摺外)可設定為轉出帳號及約定其對應之轉入帳號(上限20組)。"}},{"id":"112-16","y":112,"n":16,"m":11,"q":"有關統一發票中獎人之判定，下列何者為非？","o":["已載明買受人者，以買受人為中獎人","未載明買受人者，以發票之持有人為中獎人","買受人為一般個人，領獎收據所填寫之中獎人名稱無需與買受人一樣","買受人為執行業務者(私立機構/團體/單位等)，須加註代領獎人姓名，及於發票背面加蓋買受人章戳"],"a":2,"ci":{"b":"會計篇","c":"第六章 所得稅、營業稅、印花稅實務","s":"第二節 營業稅","t":"三、五、七、九、十一月初三個營業日內，於營所稅調節資料表系統確認「營業收入帳列數與營業稅額申報數調節表」中實際應申報數之銷售額及稅額之正確性，如有手工調整項目應補行填列，並經主管人員覆核後，放行傳送總行。若發現異常時(例如銷售額為負數)，應立即查明原因並通報會計處。A、本期「手工調整項目」之銷售額填入「營業收入帳列數與營業稅額申報數調節表」之「手工調整項目」欄位，並於「手工調整銷售額原因」欄註明調整原因，系統將自動計出「手工調整項目」之稅額與「實際應申報數」之銷售額及稅額。B、稅額辦理差額補提或回沖：列印「營業收入帳列數與營業稅額申報數調節表(已確認)」，按「手工調整項目」稅額欄位金額執行「A836交易」辦理補提或回沖，並將該表作為調整傳票附件。C、填列購買國外勞務項目給付金額及稅額：外國之事業、機關、團體、組織在中華民國境內無固定營業場所而有銷售勞務者，應由勞務買受人就其給付額依規定稅率計算營業稅額，申報繳納營業稅。如有購買國外勞務情形，應將給付金額及稅"},"x":"已載明買受人以買受人為中獎人，買受人為個人時領獎收據所填中獎人姓名<b>須與買受人一致</b>；未載明者以持有人為中獎人。","lo":1},{"id":"112-17","y":112,"n":17,"m":6,"q":"自111 年 10 月 24 日起，有關零存整付儲蓄存款委託/終止委託代繳文件保管相關作業，下列敘述何者為非？","o":["由定期存款經辦分別依帳號順序妥善保管","改以「存匯歷史件」進行文件掃描作業","依「歸檔清單（歷史）」上所列之掃描文件明細，按日期順序整理裝訂","相關文件永久保管"],"a":0,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第二節 零存整付","t":"第十一章定期儲蓄存款11-5(四)「委託代繳零存整付儲蓄存款同意書」與「終止委託代繳零存整付儲蓄存款通知書」應以「存匯業務影像管理系統」進行文件掃描作業，掃描完成後，依「歸檔清單（歷史）」上所列出之掃描文件明細，按日期順序整理裝訂永久保管。"},"x":"零存整付委託／終止委託代繳文件改以「存匯業務影像管理系統」掃描，依歸檔清單<b>按日期順序</b>整理裝訂永久保管，非依帳號順序由經辦保管 → (A)錯。"},{"id":"112-18","y":112,"n":18,"m":11,"q":"有關匯款申請書（兼取款憑條）各欄位之審核，下列敘述何者為非？","o":["收款人戶名：應填寫戶名之全銜","交易日期：匯款申請書以複式傳票辦理，傳票日期得適用取款憑條所填日期在七日內有效之規定","申請人：填寫匯款申請人之姓名、聯絡電話及身分證件號碼","收款人帳號欄：聯行電匯應由左起依序填滿十一位帳號，空白三格留在右方"],"a":1,"ci":{"b":"存款篇","c":"第四章 活期存款","s":"第十二節 其他處理要點","t":"一、<mark>取款憑條所填日期</mark>如在領款日期前7天以內者可以付款；超過7天以上或在領款日期以後者，應請存戶更改並加蓋原留印鑑後始可付款。"},"x":"匯款申請書交易日期<b>不適用</b>取款憑條 7 日內有效規定；聯行電匯收款人帳號由左起填滿 11 位。","lo":1},{"id":"112-19","y":112,"n":19,"m":9,"q":"國內分行會計人員之派任及兼辦事務，下列敘述何者為是？","o":["由經理授權副理選派","得兼辦櫃員主任之結帳工作","得兼辦傳票認證","得辦理本身及兼辦事務之覆核工作"],"a":2,"ci":{"b":"會計篇","c":"第五章 會計事務之管理","s":"第一節 會計人員之派任","t":"(二)總務：由營業單位主辦之採購、營繕案件，其驗收之監辦應另指派會計經辦以外人員辦理。(三)<mark>傳票認證</mark>及帳務查詢。(四)「票據櫃員」、「聯往櫃員」及「後送櫃員」之結帳工作，如：會計人員得執行聯行往來「日終結帳」(交易代號：7020)及「結帳後重開」(交易代號：9670)等交易，惟不得兼辦「櫃員主任」之結帳工作。"},"x":"會計人員得兼辦<b>傳票認證</b>及帳務查詢、票據／聯往／後送櫃員結帳等；<b>不得</b>兼辦「櫃員主任」之結帳 → (C)。"},{"id":"112-20","y":112,"n":20,"m":10,"q":"有關本行預算規範之敍述，下列何者為非？","o":["經核配之費用支出預算若有不足，須於預算線上簽核系統申請追加預算","屬核實開支之費用支出預算若有不足，須於預算線上簽核系統申請追加預算","上期核准之資本支出未及使用可遞延至下期使用","下期核准之資本支出未及使用須重新申請，不得遞延至下年度使用"],"a":1,"ci":{"b":"會計篇","c":"附錄三 各項開支預算執行要點","s":"","t":"應同時於「<mark>預算線上簽核系統</mark>」辦理申請。參、<mark>費用支出</mark>：一、按其支出性質及可支配項目，分為下列四大類，並依各該工作說明書辦理開支。"}},{"id":"112-21","y":112,"n":21,"m":1,"q":"未成年人持雇主開立之僱傭證明，證明其僱傭關係業經未成年人之法定代理人同意時，得開立何種帳戶？","o":["支票存款","活期儲蓄存款","金如意綜合管理帳戶","綜合存款"],"a":1,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶 附錄十四 金融監督管理委員會令","t":"1.活期存款、<mark>活期儲蓄存款</mark>、定期性存款、綜合存款、金如意綜合管理帳戶2.出具僱傭證明者，僅得開立薪資轉帳<mark>活期儲蓄存款</mark>，不得開立綜合存款(含金如意綜合管理帳戶)及支票存款。"},"x":"未成年人出具僱傭證明者，僅得開立<b>薪資轉帳活期儲蓄存款</b>。"},{"id":"112-22","y":112,"n":22,"m":6,"q":"有關定期性存款存入金額之最低額度，下列敍述何者為非？","o":["零存整付儲蓄存款為新臺幣1仟元","綜合存款之存本取息儲蓄存款為新臺幣5仟元","整存整付儲蓄存款為新臺幣5仟元","定期存款為新臺幣5仟元"],"a":1,"ci":{"b":"存款篇","c":"第十一章 定期儲蓄存款","s":"第一節 性質","t":"二、定期<mark>儲蓄存款</mark>（零存整付存款除外）存入本金之最低額度，自2002年7月1日起調整<mark>為新臺幣5</mark>千元，零存整付<mark>儲蓄存款</mark>每次存入金額<mark>為新臺幣</mark>1千元以上。"}},{"id":"112-23","y":112,"n":23,"m":11,"q":"辦理傳真轉帳業務，客戶最晚應於傳真指示交易之日起（　）內，將傳真文件正本送交本行。","o":["5日","5個營業日","7日","7個營業日"],"a":3,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"(三)營業單位接獲營運業務處通知時，應於<mark>7個營業日</mark>內填報「警示帳戶（人頭帳戶）發生原因檢討表」，針對警示帳戶新增原因進行檢討並敘明改進措施，檢討表正本送營運業務處，影本留存1年備查。"},"x":"傳真轉帳／匯款：客戶應於傳真指示交易之日起 <b>7 個營業日</b>內送交正本。","lo":1},{"id":"112-24","y":112,"n":24,"m":8,"q":"營業單位金庫室正、副門之內柵門及外門備份鑰匙之簽封，應由","o":["經理及櫃員主任","經理及輪值掌管密碼之資深經辦","經理及出納主管","經理及輪值掌管鑰匙之主管 共同簽封"],"a":0,"ci":{"b":"存款篇","c":"第十六章 可轉讓定期存單","s":"第三節 存單之保管","t":"四、本存單入庫、使用、作廢及庫存情形將由系統印錄於庫存現金帳，每日應由主管於查點現金時一併查點。五、營業單位得封簽保管空白可轉讓定存單，於辦理封簽當日完成庫存現金帳(含可轉讓定存單庫存)覆點後，由<mark>櫃員主任</mark>及出納主管點算欲封簽之空白可轉讓定存單各面額張數後，填記於「空白可轉讓定存單封簽單」(如附錄五)並於「<mark>櫃員主任</mark>」、「出納主管」欄位蓋章及註明簽封日期，將欲封簽之空白定存單裝入信封或紙箱中，封簽單黏貼於信封或紙箱外封口處，由<mark>櫃員主任</mark>與出納主管共同封簽(蓋具騎縫章並加註日期)。嗣後每日覆點「可轉讓定期存單庫存明細」時，僅需查點已封簽之信封或紙箱外封口是否完整，以及未封簽之零星張數，經查點無誤後，於合計欄金額前首蓋章；倘當日需使用已封簽之空白可轉讓定存單，或封簽人員(出納主管<mark>及櫃員主任</mark>)職務有異動時，應即拆封並全數查點後，再重新辦理封簽作業。"},"x":"金庫室備份鑰匙由<b>經理及櫃員主任</b>共同簽封。","lo":1},{"id":"112-25","y":112,"n":25,"m":11,"q":"辦理「傳真委託轉帳/匯款/申請開發（修改）國內外信用狀」業務時，下列敘述何者為非？","o":["傳真接收人員與相關業務之作業人員得為同一人","倘「傳真本」列印於熱感應式傳真紙者，應另行影印，以維清晰度","傳真指示文件應有「傳真指示扣款」或「傳真訖」等字樣","辦理新臺幣傳真轉帳扣款作業一律採非連動交易方式辦理"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十四節 存款之扣押 附錄八 傳真記錄備查簿","t":"日期傳真時間接收單位電話通知接收人/時間傳真單證名稱機關文號經辦接收回傳日期/時間經辦備註"},"x":"傳真委託業務：傳真接收人員與相關業務作業人員<b>不得為同一人</b>；熱感應紙應影印；新臺幣傳真轉帳一律採非連動交易。","lo":1},{"id":"112-26","y":112,"n":26,"m":4,"q":"關於支票存款帳戶之結清，下列何者正確？","o":["帳戶餘額為新臺幣 3 萬元，可利用第 e 個網辦理線上結清","帳戶餘額為新臺幣 3 萬元，可透過郵寄方式辦理結清","一律須由客戶臨櫃辦理","非個人戶可透過第 e 金網辦理線上結清"],"a":1,"ci":{"b":"存款篇","c":"第二章 支票存款","s":"第十五節 靜止戶之處理","t":"(三)郵寄結清：1.存戶存摺（剩餘空白票據）、印鑑未遺失且<mark>存款帳戶餘額不超過新臺幣10萬元</mark>或未有已簽發未經提示付款之票據者，得受理存戶以郵寄「結清銷戶申請書（郵寄專用）」方式辦理帳戶結清。"},"x":"支票存款結清：餘額不超過 10 萬元（或無已簽發未提示票據）且存摺印鑑未遺失者得<b>郵寄結清</b>；第e個網線上結清限支存餘額<b>為零</b>；非個人戶無線上結清。"},{"id":"112-27","y":112,"n":27,"m":1,"q":"受理客戶為受監護、受輔助宣告之人開戶時，不得開立何種帳戶？","o":["支票存款","活期儲蓄存款","定期性存款","綜合存款"],"a":0,"ci":{"b":"存款篇","c":"第一章 通則","s":"第四節 開戶","t":"一)配合「民法成年監護」施行，受理客戶辦理新臺幣存款業務相關作業倘涉及須確認本人申請意旨（親簽）時，如開戶、變更印鑑、存摺、存單及印鑑掛失、存單設質、全行代付款及更改戶名及自動化業務等申請，除依本行各業務相關規定辦理外，另須查核確認客戶是否為受監護、受輔助宣告之人，倘客戶確為受監護、受輔助宣告之人，<mark>不得開立支票存款、金如意</mark>綜合管理帳戶，至於存摺存款一般戶、定期性存款及綜合存款帳戶，其開戶及各項存匯業務相關申請文件應由法院選定之監護人或輔助人簽章同意。"},"x":"受監護、受輔助宣告之人<b>不得開立支票存款</b>及金如意綜合管理帳戶。"},{"id":"112-28","y":112,"n":28,"m":5,"q":"有關客戶申請銷帳百分百業務，下列敘述何者為非？","o":["除代收款性質具明確收款用途者外，申請本業務以客戶已往來 6 個月以上為原則","首次以申請 1 組虛擬編號為原則","如客戶代收期間已逾期，且客戶仍有代收需求，無需客戶申請，由營業單位逕行變更「代收截止日」即可","代收專戶如有虛擬帳號遭通報警示帳戶數達 3 筆或通報比率達千分之一以上時，應重新辦理盡職調查"],"a":2,"ci":{"b":"存款篇","c":"第一章 通則","s":"第十八節 疑似不法或顯屬異常交易存款帳戶之管理","t":"１１、如匯款至虛擬帳號之交易備註欄有可疑字義時（如賭金、娛樂城等），檢視是否為異常交易。(十三)資訊處每日依前揭銀行公會彙整虛擬帳號異常交易態樣產生「新臺幣銷帳百分百代收專戶異常交易持續控管報表」（分行日報，報表代號：PB29），<mark>營業單位</mark>每日應派員列印查詢，加強客戶身分審查(所營事業、營運模式及銷售管道等)及瞭解實際收款需求，於報表上註明查證結果，並呈核至經理後，裝訂備查，保存期限5年。報表所列態樣類別、條件及查證方法如下："},"x":"銷帳百分百：以往來 6 個月以上為原則、首次以 1 組虛擬編號為原則；代收期間逾期仍有需求者<b>須由客戶申請</b>，不得由營業單位逕行變更代收截止日。","lo":1},{"id":"112-29","y":112,"n":29,"m":8,"q":"有關營業單位委託保全對特定客戶提供收款服務，下列敘述何者為是？","o":["保全至客戶處收款後，得以匯款方式將款項匯入客戶帳戶","單筆存入現金金額達新臺幣 50萬元(含)以上時，得免辦理大額通貨交易申報","與保全業者簽約後 5 個營業日內，應檢附現金運送服務契約影本，報送營運業務處備查","以上皆正確"],"a":2,"ci":{"b":"會計篇","c":"附錄三 各項開支預算執行要點","s":"","t":"保全費用62413◎總務處<mark>營運業務處</mark>凡委託保全公司運送現金或票據等費用屬之。應委託審查合格之保全公司辦理，簽約前，草約先<mark>送營運業務處</mark>審核；續約時，金額及條件不變者，仍須逐"},"x":"委託保全對特定客戶收款：簽約後 <b>5 個營業日</b>內檢附契約影本報營運業務處備查；保全收款不得以匯款方式入帳，單筆 50 萬元以上仍須大額通貨申報。","lo":1},{"id":"112-30","y":112,"n":30,"m":9,"q":"下列何者得於申請核准後，兼任「代收款項章」之核章人員？","o":["高櫃人員","矮櫃人員","會計人員","理財人員"],"a":2,"ci":{"b":"會計篇","c":"第五章 會計事務之管理","s":"第一節 會計人員之派任","t":"(十二)大額付現之覆點。(十三)經總行核准後得<mark>兼任「代收款項章」之核章人員</mark>。(十四)在不兼辦出納事務及營業性帳務原則下，授權分行經理在內控無虞下，得派任<mark>會計人員</mark>兼辦其他事務，分行經理如對內控是否無虞無法判斷，得函請本處認定。"},"x":"會計人員<b>經總行核准後</b>，得兼任「代收款項章」之核章人員。"},{"id":"112-31","y":112,"n":31,"m":11,"q":"有關本行黃金存摺業務，下列敘述何者為非？","o":["掛牌單位可分為「公克」與「盎司」二種","客戶提領黃金條塊後，不得回售本行","不得辦理轉籍","結清銷戶需回原開戶行辦理"],"a":3,"ci":{"b":"存款篇","c":"第十章 定期存款","s":"第十一節 銷戶","t":"一、各營業單位皆可受理聯行定期性存款<mark>結清銷戶</mark>申請，惟有下列情形者，仍需至<mark>原開戶行辦理</mark>：(一)帳戶項下有待移入、待移出之存單（如已執行953T、983T）。"},"x":"黃金存摺以「公克」「盎司」二種掛牌；提領實體黃金後不得回售；不得轉籍；結清銷戶符合條件者可於<b>任一營業單位</b>辦理。","lo":1},{"id":"112-32","y":112,"n":32,"m":5,"q":"自111 年
