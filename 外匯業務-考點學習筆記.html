":8,"q":"有關新臺幣遠匯 KYC 規範，下列何者有誤？","o":["高淨值投資法人每年辦理 KYC","一般客戶每年辦理 KYC","專業機構投資人免辦理 KYC","其他法人專業客戶每年辦理 KYC"],"a":0,"ci":{"b":"衍商篇","c":"第十章 其他作業相關規範","s":"第四節 商業行銷（含電話行銷）應遵循原則","t":"(三)OBU專業機構投資人及<mark>高淨值投資法人</mark>免辦理「衍生性KYC」，仍應於<mark>每年辦理</mark>專業客戶申請/覆審時確認存續經營。"},"t":"neg"},{"id":"114-44","y":114,"n":44,"m":4,"q":"下列有關匯入匯款通知書標示及相應處理敘述，何者有誤？","o":["附言欄位有敘明匯款目的時，應與客戶營業性質或申報性質相符","有不利於解款之特別指示事項時，應注意避免款項誤付或重覆解款之情事發生","列示之「註記提醒事項」，應由主管及經辦蓋章確認","以上皆正確"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"3.<mark>匯款通知書</mark>上有特別指示事項者，應確認是否業經履行外，亦應審視「匯款附言(PACS.008之RmtInf欄位)」及「銀行間通訊(PACS.008之InstrForCdtrAgt及InstrForNxtAgt欄位)」檢附之資訊，是否標有不利於解款之特別指示事項，避免款項誤付或重覆解款之情事發生。"},"t":"neg"},{"id":"114-45","y":114,"n":45,"m":6,"q":"有關外匯綜合存款帳戶辦理郵寄結清之規定，下列何者錯誤？","o":["將一併註銷該帳戶前已申請之各項電子通路功能","外匯活期存款各幣別餘額併計後不得超過等值新臺幣 5 萬元","外匯定期存款餘額需為零","存戶可選擇將帳戶餘額匯入其於他行之帳戶"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（二）郵寄結清1.營業單位得受理存戶以郵寄「結清銷戶申請書＜郵寄專用＞」方式辦理帳戶結清，並應注意下列事項：(1)<mark>外匯活期存款</mark>:結清帳戶之<mark>各幣別餘額併計後不超過等值新臺幣</mark>10萬元。(2)外匯定期存款餘額需為零。"},"t":"neg"},{"id":"114-46","y":114,"n":46,"m":8,"q":"擔任新臺幣遠匯業務交易人員如係以金融機構衍生性商品業務實習取得資格者，實習期間應多久？","o":["6 個月","1 年","3 個月","不可透過實習取得資格"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(二)在國內外<mark>金融機構</mark>相關衍生性金融<mark>商品業務實習</mark>1年。(三)通過國內金融訓練機構舉辦之結構型商品銷售人員資格測驗並取得合格證書。"},"t":"ask"},{"id":"114-47","y":114,"n":47,"m":8,"q":"一般客戶可承作新臺幣遠匯之投資風險屬性包含下列哪些？<br><span class=\"it\">A.</span> 保守型<br><span class=\"it\">B.</span> 穩健型<br><span class=\"it\">C.</span> 積極型","o":["ABC","BC","B","C"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(二)凡有實際外匯收支需要且得檢具相關交易文件或主管機關核准文件者。二、承做條件：受理客戶承作本項業務前，應將客戶區分為專業客戶及<mark>一般客戶</mark>，並完成客戶<mark>投資風險屬性</mark>評估(KYC)作業，評估結果為「保守型」、「穩健型」或「積極型」者，皆可承作本項業務。"},"t":"combo"},{"id":"114-48","y":114,"n":48,"m":6,"q":"下列有關外匯存款之規定何者有誤？","o":["外匯活期存款每年 6 月 20 日及 12 月 20 日各結息一次","無法親簽之身障者開戶時，得由經辦其開戶之行員協助見證事宜","數位帳戶承作外匯定期存款每筆最低存款金額為等值 100 美元","外匯定期存款可辦理質借外幣"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"3.為落實外匯業務防制洗錢及打擊資恐作業，如有婉拒受理客戶開戶之情事，請參照第一章第四節婉拒客戶開戶作業辦理。(五)身障者(含視覺障礙者)或客戶不識字<mark>無法親簽</mark>時之外匯存款(含活期、定期)開戶規定如下："},"t":"neg"},{"id":"114-49","y":114,"n":49,"m":1,"q":"除信用狀另有規定外，有關航空運送單據之敘述，下列何者為是？","o":["航空運送單據係一種權利證券，得據以背書轉讓","得表明貨物將轉運或可能轉運，但以運送全程係由同一航空運送單據所涵蓋者為條件","無需表明簽發日","以上皆是"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(1)<mark>航空運送單據</mark>係一種收據，並非權利證券，不得據以背書轉讓，故承做押匯時，宜多加注意，並依客戶信用情形審慎辦理。(2)須顯示表明運送人名稱，並經運送人或其標名代理人簽署，且運送人或代理人之任何簽字須表明其為運送人或代理人。為運送人簽字之代理人亦必須表明其係代替或代表運送人簽署。(3)<mark>得表明貨物將轉運或可能轉運，但以運送全程係由同一航空運送單據所涵蓋者為條件</mark>。即使信用狀有禁止轉運之規定，表明<mark>將轉運或可能</mark>發生轉運之<mark>航空運送單據</mark>，可以接受。(4)應表明簽發日。除<mark>航空運送單據</mark>另含實際裝運日期之特別註記，否則應以簽發日為裝運日期。有關該單據上之飛行班次及日期之任何其他資料，將不作為判定裝運日期之用。(5)出口商不必背書，亦可不必在<mark>航空運送單據</mark>正面簽字，除非信用狀另有規定。(6)對於未持有交通部民用航空局核發之航空貨運承攬業許可證業者所發航空提單，不得據以作為押匯文件。(7)對受貨人名稱、地址經塗改或更改者，其貨物之所有人難以辨別，承做押匯時，宜多加注意並依客戶信用情形審慎辦理。"},"t":"ask"},{"id":"114-50","y":114,"n":50,"m":2,"q":"開發信用狀申請書之審查要點，下列敘述何者為非？","o":["信用狀金額不得超過開狀時所附交易單據之金額","客戶指定通知銀行者，以本行之通匯銀行為原則","最後裝運期限應在信用狀有效日期以前或同日","國外費用應請客戶註明開狀行以外之銀行費用由「買方」負擔或「賣方」負擔，如客戶無特別指示，概以「買方」負擔開發"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(十三)<mark>國外費用</mark>：<mark>應請客戶註明開狀行以外之銀行費用由「買方」負擔或「賣方」負擔，如客戶無特別指示，概以「賣方」負擔開發</mark>；倘註明<mark>由「買方」負擔</mark>者，應按收費標準預收<mark>國外費用</mark>，惟為便利客戶作業需要，得酌情於費用發生時，再按實際發生金額，向客戶收取。"},"t":"neg"},{"id":"114-51","y":114,"n":51,"m":3,"q":"辦理貿易融資交易對手存在真實性及行業相關性之審查，下列何者有誤？","o":["無論何種查證方式一律皆應請客戶提供歷史交易文件","初次往來時，應依「進貨/銷貨廠商明細資料表(貿易融資專用版)」進行查證後始可受理","交易對手列於客戶最近一年內徵信報告登錄之主要進貨/銷貨廠商","可透過鄧白氏資料庫進行查證"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"1.存在真實性及行業相關性審查：(1)交易對手應列於客戶最近一年內徵信報告登錄之主要進貨/銷貨廠商或「進貨/銷貨廠商明細資料表(貿易融資專用版)」，超過時效應重新辦理查證。(2)無徵信資料或未列於「進貨/銷貨廠商明細資料表(貿易融資專用版)」者，於初次往來時，應透過下列任一方式查詢並登錄於「進貨/銷貨廠商明細資料表(貿易融資專用版)」後始可受理。A.透過註冊地主管機關網站查詢登記資料。B.鄧白氏D&amp;B企業情報資料庫。C.上市櫃或bloomberg等較具公信力之網站資訊。D.第三方認證機構(如:COFACE等)信用報告。E.本行於當地有分行之國家，可使用「委託聯行查證書(放415)」委託海外分行進行查證。F.本行於當地無分行，得透過外匯通匯行以SWIFT方式查證。G.如查無相關資訊，應留存查詢軌跡，並透過下列任一方式評估風險後審慎辦理。a.<mark>請客戶提供歷史交易文件</mark>(如:發票、訂單、契約或信用狀等)。b.查詢公司相關網站。"},"t":"neg"},{"id":"114-52","y":114,"n":52,"m":10,"q":"有關匯率選擇權之敘述，下列何者有誤？","o":["自然人限承作不涉及新臺幣匯率之買入選擇權","選擇權買方最大風險為損失已支付的權利金","選擇權賣方最大風險為損失已收取的權利金","歐式選擇權係指買方只能在合約到期日行使權利"],"a":2,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第六節 利率選擇權","t":"一、定義係指本行與客戶共同簽訂契約，由選擇權買方支付權利金予賣方，取得於未來特定到期日或期間內，得要求<mark>選擇權賣方</mark>以雙方約定之履約價格履約。利率選擇權交易中，買方因支付權利金而獲取要求賣方履約的權利，交易最大的損失為權利金，而賣方則因收取權利金而須承擔選擇權履約的義務，交易最大的損失恐將無限大。"},"t":"neg"},{"id":"114-53","y":114,"n":53,"m":9,"q":"某客戶目前無衍生性商品未到期部位，本行核給衍生性金融商品額度 50 萬美元整，現擬承作一年期美元兌新臺幣換匯(SWAP)交易，假設此交易風險係數為 5%，則客戶可承作之最大名目本金為","o":["1,000 萬美元","100 萬美元","2,500 萬美元","250 萬美元"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(一)公司、行號每筆結匯金額達等值1<mark>00萬美元</mark>以上之匯款。(二)團體、個人每筆結匯金額達等值5<mark>0萬美元</mark>以上之匯款。"},"t":"fill"},{"id":"114-54","y":114,"n":54,"m":9,"q":"下列哪一種交易不適用本行衍生性金融商品額度？","o":["利率交換","外幣間遠匯","新臺幣遠匯","匯率選擇權"],"a":2,"ci":{"b":"衍商篇","c":"第四章 簽約開戶作業","s":"第一節 應徵提的文件","t":"1.「金融交易總約定書」暨相關附件：契約內容涵蓋各項衍生性金融商品，<mark>客戶簽署本項文件後，可承作全部衍生性金融商品(不含新臺幣遠匯)</mark>。"},"t":"neg"},{"id":"114-55","y":114,"n":55,"m":9,"q":"衍生性金融商品業務之法人專業客戶不包含下列哪一類？","o":["專業機構投資人","高淨值投資法人","高資產客戶","其他法人專業客戶"],"a":2,"ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"三、法人專業客戶之定義及資格條件<mark>衍生性金融商品業務之法人專業客戶可區分為「專業機構投資人」、「高淨值投資法人」及「其他法人專業客戶」</mark>；"},"x":"衍商篇第二章：法人專業客戶分為專業機構投資人、高淨值投資法人、其他法人專業客戶三類；「<b>高資產客戶</b>」屬財富管理之客戶分類，非衍商法人專業客戶類別。","t":"neg"},{"id":"114-56","y":114,"n":56,"m":10,"q":"下列有關本行募集式投資組合商品「推介人員」之敘述何者正確？","o":["可擔任客戶最近一次 KYC評估人員","應向客戶辦理客戶須知錄音作業","可擔任交易文件之「核簽人員」","僅限派令簿上載明派任之人員始可擔任"],"a":1,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第二節 推介作業限制及應注意事項","t":"(二)宣讀<mark>客戶須知</mark>1.推介人員<mark>應向客戶</mark>宣讀<mark>客戶須知</mark>之重要內容，並以錄音方式保留紀錄。2.法人專業客戶，20歲(含)以上且未滿65歲(不含)之自然人專業客戶承作所有"},"t":"ask"},{"id":"114-57","y":114,"n":57,"m":10,"q":"有關外幣間遠期外匯交易，以下敘述何者為是？","o":["交易到期時，客戶僅得選擇以「差額交割」方式辦理交割","係指不涉及新臺幣且交割日期逾 2 個營業日以上之外匯交易","交易幣別可為非本行掛牌之外幣","一律免徵額度期初保證金"],"a":1,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"一、定義(一)遠期<mark>外匯交易</mark>雙方事先約定在未來某一特定日期或期間，依訂約當時所約定之幣別、金額及匯率進行貨幣買賣。(二)外幣間遠期<mark>外匯交易</mark>(簡稱外幣間遠匯)<mark>係指不涉及新臺幣且交割日期逾</mark>兩<mark>個營業日以上之外匯交易</mark>；包含美元對各種外幣、美元以外各種外幣間之遠期外匯買賣。"},"t":"ask"},{"id":"114-58","y":114,"n":58,"m":10,"q":"DBU 小額換匯(SWAP)可由營業單位自行辦理訂約或展期議價之案件，下列何者為非？","o":["交易幣別涉及新臺幣","等值 1 萬美元以上 30 萬美元以下","訂約方式為指定到期日","天期大於 1 年"],"a":3,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"(二)交易幣別包含「新臺幣對外幣間換匯」及「外幣對外幣間換匯」交易，並以本行掛牌之外幣為限。(三)交易金額1.營業單位自行辦理案件符合下列全部條件之「訂約」或「展期」交易，由營業單位自行受理客戶承作並逕行輸入端末系統(免向財務處議價)，每筆最低交易金額為等值USD1萬元。(1)DBU交易幣別涉及新臺幣(如：USD/TWD、JPY/TWD..以此類推)。(2)單筆金額未逾等值USD30萬元。(3)天期未逾1年。(4)訂約方式為「指定到期日」。(5)承作價格於成本範圍內。"},"t":"neg"},{"id":"114-59","y":114,"n":59,"m":9,"q":"有關「授信戶衍生性商品交易期中管理」作業，以下何者為是？","o":["客戶有衍生性未到期部位時，原則上每 3 個月辦理一次","於企金 e-Loan 系統辦理","承作買入選擇權的客戶須納入期中管理","倘於月初接獲風管處擔保品補徵通知之「業務查詢單」，於當月底前完成期中管理即可"],"a":1,"ci":{"b":"衍商篇","c":"第九章 風險控管","s":"第二節 授信戶衍生性商品交易期中管理工作","t":"一、授信戶於本行承做衍生性商品者，應由營業單位經理指派授信部門或外匯部門人員，就授信戶衍生性金融商品操作及信用等現況，<mark>於企金e-Loan系統</mark>定期填製「衍生性商品交易期中管理工作單」並知會外匯部門或授信部門。<mark>企金e-Loan系統</mark>期中管理作業應傳送主管複核結案，分行副理可代為決行核定結案，惟實體期中管理工作單仍需陳核至經理後，留存於授信卷宗。"},"t":"ask"},{"id":"114-60","y":114,"n":60,"m":9,"q":"下列有關法人戶以數位通路辦理衍生性 KYC 之敘述何者為是？","o":["法人戶可於第 e個網辦理衍生性 KYC","可辦理之 KYC 類別限為「申請衍生性額度之法人【A】」","客戶須先填寫「數位通路辦理衍生性金融商品業務法人授權書」","以上皆非"],"a":2,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(二)可辦理KYC類別：申請衍生性額度之法人【A】、不申請衍生性額度之法人【B】皆可。(三)作業程序1.被授權人建檔(1)辦理時點:客戶首次於<mark>數位通路辦理</mark>KYC前，或被授權人異動時。(2)請客戶出具<mark>「數位通路辦理衍生性金融商品業務法人授權書」</mark>，其中被授權人限為「持有本行核發之安控設備並具備FXML憑證」之使用者。(下載路徑：KYC作業專區&gt;衍生性<mark>商品業務</mark>文件下載區)(3)分行檢視授權人之使用者代號符合前述條件，且授權書已由負責人及被授權人親簽，並加蓋公司任一業務往來大小章或經濟部登記印鑑後，由外匯或法金人員至第e金網設定被授權人。"},"t":"ask"}],"sq":[{"id":"S1-1","m":1,"q":"出口貼現案件逾匯票到期日起（　）以上仍未入帳者，應比照拒付案件填製「出口押匯拒付整理日誌」。","o":["60 天","120 天","30 天","90 天"],"a":0,"x":"押匯：逾押匯日起 90 天；貼現：逾匯票到期日起 60 天。","t":"fill","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第六節 。"}},{"id":"S2-12","m":2,"q":"申請開發遠期信用狀時，應另徵取「進口遠期信用狀／外幣貸款借款契約」（放211B），其徵取時點為何？","o":["免徵取","每筆開狀時徵取","應於每次授信額度核准後重新徵取","首次開狀時徵取一次即可"],"a":2,"x":"應於每次授信額度核准後重新徵取一份。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第25頁","s":"","t":"申請開發遠期信用狀時，應另徵取「進口遠期信用狀/外幣貸款借款契約」（放211B）一份，<mark>應於每次授信額度核准後重新徵取</mark>。"},"t":"ask"},{"id":"S2-13","m":2,"q":"有關開發信用狀申請書【31D】有效日期之審查，下列敘述何者錯誤？","o":["以 6 個月內為原則","1 年以上由營業單位經理核可即可","6 個月至 1 年由營業單位經理核可","1 年以上須授信批覆核准"],"a":1,"x":"另匯票期限【42C】以 180 天內為原則。","src":1,"t":"neg","ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"進口外匯業務開發信用狀申請書之審查：【31D】有效日期及地點：<mark>有效日期：以6個月內為原則；6個月~1年內，由營業單位經理核可；1年以上須授信批覆核准</mark>。"}},{"id":"S2-14","m":2,"q":"開發信用狀申請書【42C】匯票期限（Draft at…）之審查原則為何？","o":["360 天內","120 天內","90 天內","180 天內，超過須批覆核准"],"a":3,"x":"以 180 天內為原則；受益人負擔利息天數與融資天數合計不得超過批覆書核准之每次可貸放期限。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"【42C】<mark>匯票期限(DRAFTAT…):以180天內為原則，超過須批覆核准</mark>。"},"t":"ask"},{"id":"S2-15","m":2,"q":"有關非權利證券之運送單據開狀，下列敘述何者錯誤？","o":["電放提單（Telex Released B/L）屬非權利證券","Cargo Receipt 屬非權利證券","電放提單屬權利證券，可照常開狀","應辦妥批覆交單條件或十足本行存款擔保並經經理核准"],"a":2,"x":"快遞收據、海運貨單、電放提單、貨運收據等皆非權利證券，對債權保障不利。","src":1,"t":"neg","ci":{"b":"講義：2026外匯業務法規與實務","c":"第28頁","s":"","t":"用狀或全額結匯之開狀案件外，信用狀徵提運送單據倘為：快遞或郵政收據或投郵證明（CourierReceipt,PostReceiptorCertificateofPosting)、貨運卡車收貨單（BondTruckReceipt）、不可轉讓海運貨單（Non-negotiableSeaWaybill）、<mark>電放提單(TelexReleasedB/L)</mark>、貨運收據(CargoReceipt)、交貨單(DeliveryOrder)、送貨通知單(DeliveryNote)、運送承攬人貨運收據(Forwarder’sCargoReceipt）等，不論以任何形式簽發，皆非權利證券，只具收據或契約性質，對本行債權保障不利，應請客戶於開狀時先辦妥授信額度核准批覆書之各項交單條件或提供十足本行定存或活存設質擔保，經營業單位經理核准後承做。"}},{"id":"S2-16","m":2,"q":"進口到單時，客戶應於本行發出單據到達通知書次日起多久內辦理交單手續？","o":["五個銀行營業日","三個銀行營業日","七個銀行營業日","十個銀行營業日"],"a":0,"x":"應先辦妥第二次結匯或授信核准應辦事項，並於 5 個銀行營業日內交單。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第29頁","s":"","t":"<mark>應於本行發出單據到達通知書次日起五個銀行營業日內辦理交單手續</mark>。"},"t":"ask"},{"id":"S2-17","m":2,"q":"有關擔保提貨（L/G）及副提單背書（E/D），下列敘述何者錯誤？","o":["正本提單到達時向船公司辦理解除擔保責任","提貨後單據有瑕疵者仍得拒付","即期信用狀須辦妥第二次結匯","遠期信用狀依授信條件辦妥應 "有關「審慎辦理地區」之外匯交易，下列敘述何者錯誤？","o":["出口押匯視債權確保情形，必要時改以託收辦理","匯入匯款須確認存匯行已入帳才解付","進口開狀一律以自付條款方式辦理","出口押匯一律改以託收方式辦理"],"a":3,"x":"一律改託收者為限制押匯國家／地區。","t":"neg","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"3、出口押匯(貼現)案件：進口商或開狀銀行位於「審慎辦理地區」者，<mark>應視客戶往來及債權確保情形審慎處理，必要時改以出口信用狀項下託收方式辦理</mark>。"}},{"id":"S3-6","m":3,"q":"匯出入匯款交易涉及制裁規定或對象時，下列處理何者正確？","o":["執行 FXNG 及 A194 列為高風險客戶，並檢視最近 3 個月外匯歷史交易通報法令遵循處","僅需退匯","僅填交易審查表","經理核准即可承做"],"a":0,"x":"FXNG 婉拒建檔、A194 高風險、檢視最近 3 個月交易並通報法遵；嗣後同一交易對手一律徵文件。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第41頁","s":"","t":"<mark>檢視最近3個月相關外匯歷史交易並通報法令遵循處</mark>。"},"t":"ask"},{"id":"S3-7","m":3,"q":"婉拒受理客戶開戶時，應執行「客戶警示名單維護」交易（A245）並輸入警示代碼（　）。","o":["Z1-拒絕開戶","FXNG","09-特殊風險客戶","Z8-告誡清單"],"a":0,"x":"婉拒開戶：A245 Z1；婉拒交易：FXNG。","src":1,"t":"fill","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"3.如有婉拒受理客戶開戶或交易之情事，請依以下方式辦理:(1)婉拒開戶:執行「客戶警示名單維護」交易(交易代號A245，<mark>警示代碼：Z1-拒絕開戶</mark>)，於「新增理由」欄位依實際情形辦理建檔，列印認證資料，併同未完成開戶交易之畫面(以Ctrl+Alt+PrintScreen列印，DBU案件需先行關閉印鑑系統再列印)或客戶提供之申請資料(如:客戶身分證明文件影本、該筆交易之申請書類及相關查證文件影本等)，留存於「拒絕開戶專卷」(台外幣共用)，以供備查。"}},{"id":"S3-8","m":3,"q":"依 2026 外匯講義之 AML 作業步驟，「徵提交易文件辨識客戶」時，貨物貿易應徵提何種文件？","o":["僅合約","僅預式發票","發票＋運送單據","僅報關單"],"a":2,"x":"貨物貿易須徵提發票及運送單據，並以 AML 系統查詢往來對象、運送單據第三人及船舶/飛機名稱。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第39頁","s":"","t":"外匯業務防制洗錢及打擊資恐作業落實防制洗錢及打擊資恐作業•STEP1初估交易合理性辨識客戶交易對象資金用途交易性質金額大小交易頻率….等•STEP2交易檢核高風險客戶疑似第三方高風險國家制裁名單6•STEP3徵提交易文件辨識客戶<mark>貨物貿易須徵提發票及運送單據</mark>AML線上姓名檢核查詢查詢貿易往來對象、運送單據上之第三人(如:託運人、受貨人、到貨通知人、貨物承攬人、船公司及航空公司等)、船舶/飛機之名稱，是否屬制裁範圍檢視買(賣)方及進(出)口國家應檢視客戶申請書、匯入匯款通知書與交易單證上之買(賣)方及進(出)口國家是否一致，倘不一致，應向客戶查證雙方之關係並留存查證紀錄。"},"t":"ask"},{"id":"S3-9","m":3,"q":"有關貿易融資之交易對手，下列敘述何者錯誤？","o":["超過時效應重新查證","信用狀受益人應為客戶最近一年內徵信報告登錄之主要進貨廠商","或載於「進貨/銷貨廠商明細資料表（貿易融資專用版）」","受益人列於最近三年內之徵信報告即可"],"a":3,"x":"一年內徵信報告登錄或載於進貨／銷貨廠商明細資料表；新增交易對手須查核存在真實性及行業關連性。","src":1,"t":"neg","ci":{"b":"講義：2026外匯業務法規與實務","c":"第25頁","s":"","t":"為強化客戶交易對手風險控管，<mark>信用狀受益人應為客戶最近一年內之徵信報告登錄之主要進貨廠商</mark>或載於「公司進貨/銷貨廠商明細資料表(貿易融資 類每筆最低承作金額為等值1,000美元，美元以外之其他</mark>幣別按等值美元計算，每次、每日原幣累計轉存最高金額均不限。"}},{"id":"S6-15","m":6,"q":"數位帳戶（iLEO）外匯定期存款每筆最低承作金額為何？","o":["10 美元","100 美元","1,000 美元","500 美元"],"a":1,"x":"其餘帳戶 1,000 美元。","src":5,"t":"ask","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（二）外<mark>匯定期存款部份：數位帳戶每筆最低承作金額為等值100美元，其餘帳戶種類每</mark>筆最低承作金額為等值1,000美元，美元以外之其他幣別按等值美元計算，每次、每日原幣累計轉存最高金額均不限。"}},{"id":"S6-16","m":6,"q":"外匯定存自動轉期時，應以何種利率計息？","o":["原到期日前一營業日相當存期之掛牌利率","轉期日活存利率","沿用原議價利率","原利率八折"],"a":0,"x":"以不簽發新存單為原則、次數不限。","src":5,"t":"ask","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"<mark>十、外匯定期存款自動轉期：</mark>（一）於存入時即設定存款到期時自動轉期，除存戶事先另有聲明到期改存同幣別不同期別或到期不續存並自動解約存入外匯活期存款外，本行得仍照原存款存期辦理自動轉期且次數不限。"}},{"id":"S6-17","m":6,"q":"有關外匯定期存款之期限，下列敘述何者錯誤？","o":["指定到期日者，最長以一年內為原則","指定到期日者，期限最短為七天","指定到期日者，期限最短為八天","未滿一個月期者分為七天期、十四天期及二十一天期"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"3.<mark>指定到期日之外匯定期存款，期限最短為八天</mark>，最長以一年內為原則，至於期限七天以下者由財務處視實際需要訂定之。"}},{"id":"S6-18","m":6,"q":"有關外匯定期存款中途解約，下列敘述何者錯誤？","o":["解約時應將該存款全部一次結清","未於前述期日通知者，一律不得中途解約","未滿一個月期者，應於二日以前通知本行","存期一個月以上者，應於七日以前通知本行"],"a":1,"x":"經本行同意亦得受理。","src":6,"t":"neg","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"欲中途解約者，其屬未滿一個月期者，應於二日以前通知本行，存期係一個月以上者，應於七日以前通知本行，並於解約時，將該存款全部一次結清，未於前述期日通知者，<mark>如經本行同意，亦得受理中途解約</mark>。"}},{"id":"S6-19","m":6,"q":"有關外匯定期存款議價加碼之自動轉期，下列敘述何者錯誤？","o":["議價加碼超過年息 0.1% 者，一律僅依牌告利率加上 0.1% 轉期","議價加碼不超過年息 0.1% 者，依牌告利率加上加碼幅度自動轉期","議價加碼超過年息 0.1% 者，依原議價加碼幅度轉期","新存單利率以本行外幣資金轉撥計價（FTP）牌告利率為上限"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第五節 外匯定期存款自動轉期之處理","t":"（二）議價加碼幅度超過年息0.1％者：<mark>轉期時一律僅依轉期日前一營業日牌告利率加上0.1％辦理自動轉期</mark>，且新存單利率以本行外幣資金轉撥計價（FTP）牌告利率為上限。"}},{"id":"S6-20","m":6,"q":"有關外匯定期存款之付息與質權設定，下列敘述何者錯誤？","o":["經自動轉期之存款申請設定質權時，應另簽發新存單","因誤鍵且承作後未超過一個月者，可執行 0300 交易變更付息方式","經自動轉期之存款設定質權時，新存單以最初存入日為起息日","存入時約定之付息方式中途均不得變更"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第八節 外匯定期存款質借外幣","t":"(7)經自動轉期之存款申請設定質權時，應另簽發新存單後辦理之，<mark>新存單應以最近一次轉期日期為起息日期</mark>。"}},{"id":"S6-21","m":6,"q":"有關外幣可轉讓定期存單（外幣 NCD），下列敘述何者錯誤？","o":["由銀行簽發並按照面額發行","到期依票面利率及發行天數本息一次給付","期間不得中途解約或變更存單內容","得辦理按月領息"],"a":3,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第十五節 外幣可轉讓定期存單","t":"第十五節外幣可轉讓定期存單一、外幣可轉讓定期存單(NegotiableCertificatesofDeposit以下簡稱外幣NCD)係由銀行簽發並按照面額發行，期間不得中途解約或變更存單內容，到期依票面利率及發行天數本息一次給付，<mark>不得辦理按月領息或自動續存</mark>。"}},{"id":"S6-22","m":6,"q":"OBU 客戶身分驗證之合理可行時限，下列敘述何者錯誤？","o":["應於建立業務關係後不遲於 30 個工作天內完成","建立業務關係 60 天後仍未完成者，應終止業務關係","逾 30 個工作天仍未完成者，應暫時中止業務關係","建立業務關係 120 天後仍未完成者，應終止業務關係"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"C.<mark>若在建立業務關係120天後，仍未能完成客戶身分驗證程序</mark>，則本行應終止與客戶之業務關係。"}},{"id":"S6-23","m":6,"q":"有關 OBU 外幣支票，下列敘述何者錯誤？","o":["拒絕往來期間為自通報日起算三年","退票應於收到支票後七個營業日內通知提示銀行","收到託收銀行寄來之支票，應於三個營業日內付款或退票","退票時應作成退票理由單送票據交換所"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第五節 代受理國際金融業務分行客戶外幣支票存款業務之處理","t":"(八)票據之清算透過各銀行同業存款帳戶採託收方式辦理，本行於收到託收銀行寄來之OBU外幣支票，<mark>應於收到後三個營業日內，將收妥款項</mark>，依照託收銀行之指示支付託收銀行，或敘明退票理由，將外幣支票退還託收銀行。"}},{"id":"S6-24","m":6,"q":"OBU 法人客戶辦理年度定期審查之 COI（董事職權證明書），下列敘述何者錯誤？","o":["高風險客戶徵提註冊代理人一年內簽發之 COI","向註冊機關查詢之完整報告已載明者得免徵提","高風險客戶徵提註冊代理人六個月內簽發之 COI","中低風險客戶徵提註冊代理人一年內簽發之 COI"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"(16)辦理年度定期審查時，向客戶徵提以下證明文件：A.高風險客戶<mark>(A)註冊代理人六個月內簽發之COI</mark>。"}},{"id":"S6-25","m":6,"q":"有關外匯存款轉帳存入之主管授權，下列敘述何者錯誤？","o":["執行 0780 交易非屬活期轉定期且達等值美元壹拾萬元時，須主管授權","認證後應送請外匯主管覆核檢印","存入金額達等值美元伍萬元即須主管授權","執行 5780 交易存入金額達等值美元壹拾萬元時，須以主管授權方式存入"],"a":2,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"2.收到受理單位之存入憑證、存摺（有摺戶）及「外匯存款存入／提領提送單」（外存028）等有關文件經審核無誤，即憑存入憑證鍵入電腦登帳（外匯活期存款【交易代號578】／外匯定期存款【交易代號078】），另執行「外匯活期存款轉帳存入(5780)」交易時，<mark>倘存入之金額達等值美元壹拾萬元時，須以主管授權方式存入</mark>；"}},{"id":"S6-26","m":6,"q":"有關 OBU 授信目的帳戶之結清，下列敘述何者錯誤？","o":["授信業務終止後，應由客戶本人親自辦理結清","資金停泊時間最長為授信額度有效期限或最後一筆貸放到期日加計一百八十天","以兩者較晚屆至者為準","以兩者較早屆至者為準"],"a":3,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"十四、結清銷戶(一)客戶於國際金融業務分行之授信業務終止後，應由客戶本人親自辦理結清，惟授信目的帳戶資金停泊時間，最長為授信額度有效期限或最後一筆貸放到期日<mark>(以較晚屆至者為準)加計一百八十天</mark>。"}},{"id":"S6-27","m":6,"q":"有關 OBU 境外客戶之外匯定期存款，下列敘述何者錯誤？","o":["存期達一個月以上之本金轉期存單，即得選擇按月付息","轉期方式分為不轉期轉息、本息轉期及本金轉期","存期達三個月以上之本金轉期存單，得選擇按月付息","存入時發給確認書"],"a":0,"x":null,"src":6,"t":"neg","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"2.外匯定期存款，存入時發給確認書，轉期方式分為不轉期轉息、本息轉期及本金轉期，<mark>存期達三個月(含)以上之本金轉期存單</mark>得選擇到期一次付給本息或按月付息。"}},{"id":"S6-28","m":6,"q":"有關 OBU 開戶審查，下列敘述何者正確？ A.與 1 個警示帳戶重複者一律婉拒開戶 B.貝里斯法人須徵提 2023 年後發行之新版公司執照 C.客戶聯絡資訊與 3 個以上警示帳戶重複者，原則應婉拒開戶 D.法人股東合計股權逾 50% 者，應徵取該法人股東股權結構資料","o":["CD","ABD","BCD","ABCD"],"a":2,"x":null,"src":6,"t":"combo","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"丙.如「與警示帳戶聯絡資料重複檢核」結果顯示客戶聯絡資訊與既有警示帳戶資訊相同，應加強客戶KYC並輸入開戶理由，<mark>倘與3個以上警示帳戶重複，原則應婉拒開戶</mark>(倘有特殊原因仍須受理開戶者，應加強審查並敘明原因，取得主管同意後始得受理)丁.如同一負責人名下公司有警示帳戶通報資料，應加強客戶KYC，並說明評估後仍受理開戶之理由。"}},{"id":"S6-29","m":6,"q":"外匯存款質借，質借幣別與存單幣別不同者，貸款成數最高（　）。","o":["九成","七成","八成","十成"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第八節 外匯定期存款質借外幣","t":"2.幣別與存單幣別不同者：存單幣別及質借幣別限承作美金、歐元、日幣、人民幣、英鎊、港幣、澳幣及紐幣，<mark>貸款成數最高九成</mark>。"}},{"id":"S6-30","m":6,"q":"OBU 核發存款餘額證明書，第 1 份收取手續費 USD（　）元，每多 1 份加收 USD2 元。","o":["5","2","1","3"],"a":3,"x":null,"src":6,"t":"fill","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"(三)為合理反應作業成本並落實使用者付費原則，核發存款餘額/部分餘額證明書<mark>第1份應向客戶收取手續費USD3元</mark>，倘申請1份以上者，每份加收USD2元。"}},{"id":"S6-31","m":6,"q":"外匯存款轉籍申請書正本及帳戶轉籍移入回執單等，應併於報表後留存（　）年。","o":["永久","10","5","15"],"a":3,"x":null,"src":6,"t":"fill","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項 處分資產處理程序、內部規章等。"}},{"id":"S9-11","m":9,"q":"高淨值投資法人之資格之一，最近一期財報淨資產應超過新臺幣多少元？","o":["100 億","200 億","1 億","50 億"],"a":1,"x":"且有價證券＋衍生性投資組合達 10 億。","src":5,"t":"ask","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"第二章區分「專業客戶」及「一般客戶」2-2(二)高淨值投資法人同時符合下列資格之法人、或符合資格法人持股100%且提供保證之子公司、或符合資格之外國法人其在臺分公司，得以書面向本行申請為「高淨值投資法人」，嗣後應每年至少覆審ㄧ次：最近一期經會計師查核或核閱之財務報告➢「淨<mark>資產」超過新臺幣200億元，且➢「有價證</mark>券(如:股票、債券…等，惟不含客戶持股50%含以上之長期股權投資部位)」部位加計「衍生性金融商品投資組合(如：遠匯、換匯、選擇權、交換、結構型商品…等)」達新臺幣10億元以上。"}},{"id":"S9-12","m":9,"q":"可操作名目本金之計算方式為何？","o":["核准額度 × 風險係數","曝險額度 × 2","核准額度 ÷ 風險係數","核准額度 ÷ 2"],"a":2,"x":"例：額度 50 萬美元、係數 5% → 1,000 萬美元。","src":5,"t":"ask","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"二、「衍生性金融商品額度」係用以計算本項業務可承作交易<mark>金額，公式如下：可操作名目本金＝核准額度／金融商品交易風</mark>險係數(註：金融商品交易風險係數請參閱風險管理處函布之「金融商品交易風險係數表」)三、「高風險衍生性金融商品額度」係指可承作「高風險衍生性金融商品」之額度。"}},{"id":"S9-13","m":9,"q":"有關自然人專業投資人，下列敘述何者錯誤？","o":["自然人專業投資人 2 於本行往來總資產逾等值新臺幣一千五百萬元","自然人專業投資人 1 須提供等值新臺幣三千萬元以上之財力證明","自然人專業投資人 2 曾於本行單筆投資逾等值新臺幣三百萬元","自然人專業投資人 2 每筆交易金額應逾等值新臺幣 100 萬元"],"a":3,"x":"DBU 為逾新臺幣 300 萬元，OBU 為美金 10 萬元。","src":6,"t":"neg","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"其中「自然人專業投資人2」<mark>每筆交易金額應逾等值新臺幣300萬元(DBU)/美金10萬元(OBU)</mark>。"}},{"id":"S9-14","m":9,"q":"有關專業客戶資格之覆審，下列敘述何者錯誤？","o":["每月 5 日前列印有效日期控管表，檢視已逾期及次 2 月將到期名單","專業客戶資格效期為 2 年","營業單位應每年辦理覆審作業","專業客戶資格效期自申請完成日起算為期 1 年"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第五節 境內「自然人高資產專業客戶」申請、覆審及變更作業","t":"二、覆審(一)<mark>專業客戶資格效期自申請完成日起算為期1年</mark>，營業單位應每年辦理覆審作業。"}},{"id":"S9-15","m":9,"q":"有關法人客戶衍生性 KYC 評估表之收回，下列敘述何者錯誤？","o":["原則上應於 2 週內收回","有合理原因得延長，但至遲應於 3 個月內收回","第一聯請客戶負責人親簽並加蓋公司大小章或登記印鑑","有合理原因得延長，但至遲應於 1 個月內收回"],"a":1,"x":null,"src":6,"t":"neg","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"第一聯請客戶負責人(或被授權人)親簽並加蓋公司任一業務往來大小章或經濟部登記印鑑後，<mark>原則上應於2週內收回(如有合理原因得延長，但至遲應於1個月內收回)</mark>，第二聯由客戶收執。"}},{"id":"S9-16","m":9,"q":"有關衍生性金融商品額度申請之財務資料，下列敘述何者錯誤？","o":["非避險額度之曝險額度達 100 萬美元以上者，財報應經會計師查核或核閱 rk>每筆交易訂約期間最短不得小於5日</mark>，惟買回原交易或承作價平(ATM)、價外(OTM)之交易者不在此限。"}},{"id":"S9-22","m":9,"q":"屬「限額交易」之利害關係人衍生性交易，交易前應確認下列哪些事項？ A.所有利害關係人交易總額未超過銀行淨值 30% B.以「集團利害關係人交易限額查詢（9732）」確認並留存畫面 C.單一利害關係人交易金額未超過銀行淨值 10% D.所有利害關係人交易總額未超過銀行淨值 20%","o":["CD","BCD","ABD","ABCD"],"a":1,"x":null,"src":6,"t":"combo","ci":{"b":"衍商篇","c":"第十章 其他作業相關規範","s":"第一節 利害關係人交易管控措施","t":"2.如該交易屬本行「利害關係人授信及授信以外交易政策」第十一條所定義之「限額交易」且非屬第十二條之例外情況者，交易人員於交易前應以「集團利害關係人交易限額查詢(9732)」確認加計本筆交易金額後，<mark>該單一利害關係人交易金額未超過銀行淨值10%</mark>且所有利害關係人交易總額未超過銀行淨值20%，方得受理交易，並應留存該查詢畫面備查。"}},{"id":"S9-23","m":9,"q":"本行人員確認客戶拒絕行銷之意願及範圍後，應於（　）個工作天內於系統註記「不接受行銷名單」。","o":["七","三","十","五"],"a":2,"x":null,"src":6,"t":"fill","ci":{"b":"衍商篇","c":"第十章 其他作業相關規範","s":"第五節 個人資料保護及管理","t":"(五)本行人員於確認客戶拒絕行銷之意願及範圍後，<mark>應於十個工作天內</mark>於「行員專用系統\\其他作業區\\『不接受行銷名單』新增/查詢作業」進行註記，其後非經客戶再為通知或更改意願前，不得再以客戶拒絕之方式行銷。"}},{"id":"S9-24","m":9,"q":"衍生性商品之商業行銷，不得於「早上 9 點～晚上（　）點」以外之時間進行，惟客戶要求者不在此限。","o":["9","10","6","8"],"a":0,"x":null,"src":6,"t":"fill","ci":{"b":"衍商篇","c":"第十章 其他作業相關規範","s":"第四節 商業行銷（含電話行銷）應遵循原則","t":"二、商業行銷應注意事項：(一)<mark>不得於「早上9點~晚上9點」以外之時間進行商業行銷</mark>，惟客戶要求者則不在此限。"}},{"id":"S9-25","m":9,"q":"OBU 衍生性交易之授信目的帳戶餘額上限倍數，最高以（　）倍為限。","o":["十","三","五","二"],"a":2,"x":null,"src":6,"t":"fill","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"4.應依客戶實際交易需求，整體評估其所需之授信目的帳戶餘額上限倍數(<mark>惟最高以五倍為限</mark>)，避免客戶交割時，交割金額加計帳戶餘額逾上限而無法匯入辦理交割，並於申請條件載明「本件所開立之授信目的帳戶餘額上限為OBU授信餘額及未用授信額度加總後之○倍」。"}},{"id":"S9-26","m":9,"q":"換匯換利交易期限以不超過客戶實際避險需求或（　）年（含）為原則。","o":["7","3","5","10"],"a":3,"x":null,"src":6,"t":"fill","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第五節 利率交換暨換匯換利","t":"(五)<mark>交易期限以不超過客戶實際避險需求或10年(含)為原則</mark>。"}},{"id":"S9-27","m":9,"q":"客戶於數位通路進行 KYC 時，下列哪些基本資料可直接於該頁面修改？","o":["姓名及身分證號","地址及電話","年收入及資產","學歷、職業、任職公司／就讀學校及職稱"],"a":3,"x":"其餘項目須至網銀基本資料變更或臨櫃辦理。","src":6,"t":"ask","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(五)客戶於數位通路進行KYC作業時，須先完成「基本資料確認」，如有修改需求，<mark>【學歷】、【職業】、【任職公司/就讀學校】及【職稱】等4個項目可直接於該頁面進行修改</mark> 書即可）：出/進口貨品或對非居住民提供/償付服務之匯款；公司行號每年累積結購（售）未逾等值<b>1億美元</b>、團體個人未逾等值<b>1千萬美元</b>；非居住民每筆未逾等值<b>10萬美元</b>。</li>\n</ul>\n<h4>須檢附文件之結匯申報</h4>\n<ul>\n<li>公司、行號每筆結匯達等值<b>100萬美元</b>以上；團體、個人每筆結匯達等值<b>50萬美元</b>以上。</li>\n<li>經核准之直接投資、證券投資及期貨交易；境內交易但標的涉及境外貨品服務；民營事業中長期外債動支及還本付息之匯款。</li>\n</ul>\n<h4>須經央行核准之結匯申報</h4>\n<ul>\n<li>公司、行號每年累積結購（售）超過等值<b>1億美元</b>之必要性匯款；團體、個人超過等值<b>1千萬美元</b>。</li>\n<li><b>未滿18歲</b>（領國民身分證或居留證有效1年以上）每筆結匯達新臺幣<b>50萬元</b>以上（未結婚者須法定代理人代辦並共同簽章）。</li>\n<li>非居住民每筆超過等值<b>10萬美元</b>之特定匯款（境內承包工程款、法律案件擔保金及仲裁費、自用不動產款、依法取得遺產保險金撫卹金）。</li>\n</ul>\n<h4>大額交易確認與匯率通報</h4>\n<ul>\n<li>大額外幣結匯（公司行號<b>100萬</b>美元以上、個人團體<b>50萬</b>美元以上）執行詢價通報。</li>\n<li>訂約後1或2個營業日交割之大額結匯案件須發出「即期外匯交易確認書」；未收回正本者最遲於訂約當日下午<b>3:30</b>以電話錄音確認；正本保存期限<b>5年</b>。</li>\n<li>實際交割金額與通報金額不符，不足額或超額為通報金額<b>±10%或等值500美元孰低</b>時，超逾部分依當日收盤匯率反向清算損益。</li>\n</ul>\n<h4>客戶權益保障</h4>\n<ul>\n<li>個資回覆期限：查詢/閱覽或製給複製本<b>15日</b>內（得延長不逾15日）；補充/更正、刪除、停止蒐集處理利用<b>30日</b>內（得延長不逾30日）。</li>\n<li>高齡客戶定義為<b>65歲以上</b>自然人。</li>\n<li>「通知指定聯絡人服務」門檻：臨櫃單筆達等值新臺幣<b>50萬元</b>以上之外幣定存解約、轉/匯出至非本人帳戶。</li>\n<li>民法成年年齡下修至<b>18歲</b>；限制行為能力人為滿<b>7歲</b>未滿<b>18歲</b>；無行為能力人為未滿<b>7歲</b>。</li>\n<li>人民幣平倉交易（跨境貨物/服務貿易、直接投資）議價金額以逾等值<b>10萬（含）美元</b>為原則。</li>\n</ul>\n<h4>銀行業辦理外匯業務管理辦法 — 總則與申請開辦</h4>\n<ul>\n<li>本辦法依中央銀行法第<b>35條第2項</b>訂定。</li>\n<li>銀行業指境內之銀行、農業金庫、信用合作社、農（漁）會信用部、中華郵政公司；<b>指定銀行</b>指經央行許可辦理外匯業務並發給指定證書之銀行或農業金庫。</li>\n<li>外匯業務八款：出口、進口、一般匯出入匯款（含買賣外幣現鈔及旅行支票）、外匯存款、外幣貸款、外幣保證、外匯衍生性商品、其他外匯業務。</li>\n<li>中華郵政得申請一般匯出入匯款或買賣外幣現鈔及旅行支票；信合社及農漁會信用部得申請買賣外幣現鈔及旅行支票。</li>\n<li>申請為指定銀行條件：自有資本與風險性資產比率符合規定、配置適格外匯專業人員、最近一年無受處分糾正情事。</li>\n<li>已許可辦理外匯衍生性商品後得逕行辦理：遠期外匯（不含NDF）、換匯交易、再組合、未涉新臺幣匯率商品等。</li>\n<li>開辦前申請許可類：尚未開放或開放未滿半年商品、<b>NDF</b>、涉新臺幣匯率商品、代客操作外幣保證金交易。</li>\n<li>辦理外匯衍生性商品人員資格：課程<b>60小時</b>以上、實習<b>1年</b>、或半年以上實際經驗；相關人員每年教育訓練達<b>6小時</b>以上，其中法規或缺失案例課程不得低於應達時數之<b>1/2</b>。</li>\n<li>發給指定證書或許可函後<b>6個月</b>內未開辦得廢止；有正當理由申請延期經同意得延<b>3個月</b>且以一次為限。</li>\n<li>純網路銀行受理電子設備新臺幣結匯達等值<b>50萬元</b>以上者，應提供網路申報。</li>\n</ul>\n<h4>管理辦法 — 經營（涉新臺幣匯率衍生性商品）</h4>\n<ul>\n<li>DF遠期外匯：以<b>有實際外匯收支需要者</b>為限，同筆需要不得重複簽約；展期須依<b>當時市場匯率</b>重訂價格，不得依原價格展期。</li>\n<li>FX SWAP換匯：同時辦理兩筆相等金額、不同方向及不同到期日之交易；對象以國內外法人及國外自然人為限。</li>\n<li><b>NDF無本金交割</b>：對象以國內指定銀行及本身海外分行、總（母）行及其分行為限；不得展期、不得提前解約；一律現金差價交割；每筆達<b>500萬美元</b>以上應立即電告央行外匯局。</li>\n<li>新臺幣匯率選擇權：僅得辦理陽春型（Plain Vanilla）。</li>\n<li>自動化服務設備每帳戶每日累積提領外幣以等值<b>1萬美元</b>為限。</li>\n<li>每筆交易金額在<b>1萬美元</b>以下涉新臺幣之匯率，應於每營業日上午<b>9:30</b>前在營業場所揭示。</li>\n<li>外幣貸款不得兌換為新臺幣，但以出口為目的且貨品出口後不在此限。</li>\n<li>NDF與新臺幣匯率選擇權二者合計部位不得逾總部位限額<b>1/5</b>。</li>\n<li>顧客新臺幣與外幣間即期（不含跟單）、遠期、換匯、換匯換利交易金額達等值<b>100萬美元</b>以上，應於訂約日之次營業日中午<b>12時</b>前傳送央行外匯資料處理系統。</li>\n<li>報表時間：日報表次營業日中午12時前；月報表每月營業終了後<b>10日</b>內。</li>\n</ul>\n<h4>管理辦法 — 人民幣業務</h4>\n<ul>\n<li>自然人買賣人民幣：每人每次買賣現鈔及每日透過帳戶買賣均不得逾人民幣<b>2萬元</b>。</li>\n<li>外幣提款機提領人民幣現鈔每人每次不得逾人民幣<b>2萬元</b>。</li>\n<li>自然人匯款人民幣至大陸（限國民身分證個人、經常項目）每人每日不得逾人民幣<b>8萬元</b>。</li>\n</ul>\n<h4>外匯收支或交易申報辦法</h4>\n<ul>\n<li>本辦法依管理外匯條例第<b>6條之1第1項</b>訂定。</li>\n<li>申報義務人：境內新臺幣<b>50萬元</b>以上等值外匯收支或交易之資金所有者或需求者。</li>\n<li>「個人」定義：年滿<b>18歲</b>領國民身分證，或居留證證載有效期限<b>1年</b>以上之自然人；非居住民：未領居留證或有效期限未滿1年之非國民。</li>\n<li>申報書及文件保存期限至少<b>5年</b>。</li>\n<li>辦理結匯申報後<b>不得要求更改</b>申報書內容，例外（非故意經舉證出具意見書、或故意已依條例第20條處罰）得申請更正。</li>\n<li>罰則：故意不為申報、申報不實、或受查詢未於限期說明或虛偽說明者，依管理外匯條例第<b>20條第1項</b>處罰。</li>\n<li>對大陸地區匯款準用本辦法。</li>\n<li>每筆結匯<b>未達新臺幣50萬元</b>等值外幣者免填申報書，且無須計入當年累積結匯金額；應預防化整為零。</li>\n<li>非居住民辦理結匯申報無須查詢當年累積結匯金額；駐臺外交機構結匯不論性質均無金額限制。</li>\n<li>外國公司在臺分（子）公司代員工結匯：每名每筆達<b>50萬元</b>者應加註出生日期並計入其當年累積結匯金額。</li>\n<li>透過第三地區公司再間接投資大陸，匯出投資款以個案累計未逾<b>100萬美元</b>為限，逾者應確認經濟部核准文件。</li>\n<li>民營事業中長期外債指對外國債權人還款期限超過<b>1年</b>之外幣債務。</li>\n<li>大陸地區人民合法繼承臺灣地區人民遺產，每人匯出不得逾新臺幣<b>200萬元</b>等值外幣。</li>\n<li>軍公教保險死亡給付、撫卹金、餘額退伍金總額，匯出不得逾新臺幣<b>200萬元</b>等值外幣。</li>\n<li>對大陸地區直接投資個案累計等值<b>100萬美元（含）</b>以下得逕行受理。</li>\n</ul>\n<h4>銀行業輔導客戶申報作業規範</h4>\n<ul>\n<li>出口結匯結售新臺幣掣發<b>出口結匯證實書</b>，未結售掣發其他交易憑證。</li>\n<li>匯出款以新臺幣結購掣發<b>賣匯水單</b>、未結購掣發其他交易憑證；匯入款結售新臺幣掣發<b>買匯水單</b>。</li>\n<li>收到權責機關或受款行要求應於<b>3個營業日</b>內提供匯款人及受款人資訊。</li>\n<li>外匯存款<b>不得以支票存款方式</b>辦理；外幣貸款、外幣保證承作對象以國內顧客為限。</li>\n<li>機場臨時兌換點每筆未逾等值<b>5千美元</b>得簡化，國別代碼「XC」。</li>\n</ul>"},{"id":"fx-s0p1-c1","t":"第一章 通則（二）：大額傳輸、SWIFT電文與洗錢防制","fc":"B","fq":"5年約12題（每年約2題）· B級","h":"<h4>掛牌外幣計息天數（必背）</h4>\n<ul>\n<li><b>360天</b>計息幣別：美金USD、澳幣AUD、瑞士法郎CHF、加拿大幣CAD、日圓JPY、瑞典克郎SEK、歐元EUR、<b>人民幣CNY</b>。</li>\n<li><b>365天</b>計息幣別：英鎊GBP、港幣HKD、新加坡幣SGD、南非幣ZAR、泰銖THB、紐西蘭幣NZD、土耳其里拉TRY。</li>\n</ul>\n<h4>大額即期結匯及大額遠期外匯資料傳輸</h4>\n<ul>\n<li>大額即期結匯資料傳送：同一客戶當日結購、結售外匯累計達等值<b>100萬美元</b>（不含跟單方式進出口貨品結匯），應於<b>訂約當日下午6:30前</b>傳輸至央行外匯局。</li>\n<li>電話通報：當日結購結售累計達等值<b>500萬美元</b>者（不含跟單進出口），最遲<b>訂約當日下午4:30前</b>電話通報央行外匯局稽核科。</li>\n<li>傳真通報即期結匯三情形（訂約當日下午6:30前）：公司對外貸款/國外借款/憑核准文件結匯同一性質累計達<b>100萬美元</b>；公司當日累計達<b>500萬美元</b>且利用當年累積結匯額度；個人、團體當日同一性質累計達<b>50萬美元</b>。</li>\n<li>逾時更正期限：漏傳或有誤應於<b>次一營業日中午11:30前</b>更正，超逾次一營業日中午12:00視為逾時。</li>\n<li>大額新臺幣遠期外匯：每筆訂約或展期金額達等值<b>100萬美元</b>須傳送（下午6:30前）。</li>\n<li>遠匯電話通報：當日訂約金額累計達<b>200萬美元</b>者，議價當日下午4:30前電話通報；<b>展期案件無需電話及傳真通報</b>。</li>\n<li>遠匯傳真通報：當日累計金額達等值<b>500萬美元</b>者，訂約當日下午6:30前傳真實需證明文件。</li>\n<li>大額新臺幣換匯(SWAP)：即期端「同一性質」累計達100萬美元、遠期端每筆達100萬美元須傳送；<b>SWAP原則上免徵交易文件</b>。</li>\n<li>大額結匯相關報表保存期限<b>五年</b>。</li>\n</ul>\n<h4>SWIFT系統暨外匯電文系統</h4>\n<ul>\n<li>SWIFT協會1973年由國際知名銀行捐資成立之非營利法人，總部在<b>比利時布魯塞爾</b>。</li>\n<li>使用者四類別：一級安控主管（經理級以上）、電文編輯人員、電文覆核人員、電文放行人員（副理以上主管，動態密碼登入）；各級不得互相兼任。</li>\n<li>密碼管控：長度<b>8~20位元</b>、使用期限<b>30曆日</b>、不得與前<b>8次</b>相同、連續錯誤<b>5次</b>或逾期<b>60天</b>未登入自動失效。</li>\n<li><b>付款類電文</b>（電匯、資金調撥、授權付款/扣款）無論金額大小應經<b>二名</b>電文稿主管核准；非付款類得一名主管核准。</li>\n<li>國外匯出匯款電文：達等值美金<b>100萬元(含)以上</b>須另執行大額放行，並由另一位主管於水單「大額覆核主管」欄蓋章。</li>\n<li>SWIFT gpi：透過雲端Tracker追蹤跨境付款狀態，匯出電文自動編製UETR。</li>\n<li>SWIFT終端機一級管理人員每<b>60天</b>變更密碼；登入閒置超過<b>10分鐘</b>自動登出。</li>\n</ul>\n<h4>外匯操作員作業管理</h4>\n<ul>\n<li>操作員權限三等級：一級主管（分行經理）、二級主管、經辦員。</li>\n<li>端末簽到密碼每<b>3個月</b>變更一次；「櫃員主任」及「檢核專員」不可設定外匯角色（內部牽制）。</li>\n<li>行員端末權限資料及異動明細表保存<b>5年</b>。</li>\n</ul>\n<h4>外匯業務防制洗錢及打擊資恐（AML）</h4>\n<ul>\n<li>臨時性交易確認身分門檻：非本行客戶結購外幣現鈔（含旅支）或匯出匯款，分別<b>不得逾等值美金1萬元</b>。</li>\n<li>客戶身分驗證時限：建立業務關係後不遲於<b>30個工作天</b>內完成；逾30個工作天未完成應<b>暫時中止</b>業務關係；逾<b>120天</b>仍未完成應<b>終止</b>業務關係。</li>\n<li>受告誡處分者：告誡期間自告誡日起算<b>5年</b>；風險等級視為高風險；ATM提領外幣現鈔上限等值新臺幣<b>1萬元</b>。</li>\n<li>存款警示名單代碼：Z1拒絕開戶、Z2暫不受理自動化、Z3疑似交易異常、Z5外國PEPs、Z6主管機關通報管制戶、Z8告誡清單。</li>\n<li>客戶定期審查頻率：依風險高、中、低分別每<b>1年、3年、5年</b>辦理；高風險客戶身分資訊至少<b>每年</b>檢視一次。</li>\n<li>高風險客戶（EDD）須經資深副理或經理核准始可受理開戶。</li>\n<li>客戶關懷（防詐）：個人臨櫃國外匯出匯款達等值新臺幣<b>50萬元(含)以上</b>或高齡客戶（<b>65歲</b>以上）應落實客戶關懷。</li>\n<li>外幣現鈔審查：個人臨櫃結購/提領外幣現鈔單筆達等值新臺幣<b>50萬元(含)以上</b>須填關懷提問表；<b>55歲以上未滿65歲</b>達50萬另填高齡檢核表；<b>65歲以上</b>不論金額皆填高齡檢核表。</li>\n<li>貿易融資運送單據審查：交易金額達美金<b>20萬元(含)以上</b>海運提單一律先透過Marine Traffic網站查詢航程。</li>\n<li>一定金額以上通貨交易申報：「一定金額」指新臺幣<b>50萬元</b>（含等值外幣）之單筆現金收付。</li>\n<li>疑似洗錢或資恐交易：不論金額多寡均須確認身分並留存紀錄；原則<b>一個月內</b>確認是否可疑（得再延長<b>10天</b>）；認屬可疑經專責副總核定後<b>二個營業日內</b>向法務部調查局申報。</li>\n<li>資恐防制法指定制裁對象：於知悉之日起凍結財產交易並通報；通報紀錄、交易憑證以原本保存<b>5年</b>。</li>\n<li>與客戶往來交易必要紀錄或憑證保存年限至少<b>5年</b>。</li>\n</ul>\n<h4>AML名單管理</h4>\n<ul>\n<li>名單三大類：黑名單、PEP、負面新聞；制裁名單來源含UN、EU、OFAC、UKHMT、法務部調查局指定制裁名單等。</li>\n<li><b>全面性制裁國家：伊朗、北韓、南蘇丹、敘利亞、古巴</b>及烏克蘭遭俄佔領區域（克里米亞等），外匯案件<b>一律停止受理</b>。</li>\n<li>例外管理國家：<b>俄羅斯、白俄羅斯、烏克蘭</b>——進出口案件受益人/通知銀行/進口商/開狀銀行位於三國者一律不得承作；貨品命中「輸往俄白高科技貨品清單」或「軍商兩用貨品清單」不得承作。</li>\n<li>疑似第三方交易檢核：中國、香港交易對手，單筆達等值新臺幣<b>50萬元(含)以上</b>且名稱含CURRENCY/MONEY EXCHANGE等字元或地址臨近北韓（遼寧省/吉林省），防制北韓、伊朗透過第三方交易。</li>\n<li>匯款交易追蹤：「預計出貨日」原則不宜超過受理日<b>3個月</b>；並應於預計出貨日後<b>2個月</b>內完成運送單據/報關單補送。</li>\n<li>限制押匯國家/地區、審慎辦理地區名單每年<b>1月</b>參酌最新穆迪（Moody's）國家長期信用評等定期調整。</li>\n<li>貿易融資檢核報表按月裝訂，指定專人保管<b>5年</b>。</li>\n</ul>"},{"id":"fx-s0p2-c1","t":"第二章 受理出口押匯/貼現作業應注意事項","fc":"A","fq":"5年約32題（每年約6題）· A級","h":"<h4>第一節 受理申請</h4>\n<ul>\n<li>首次受理應徵取：出口押匯約定書（原押匯總質權書）、簽章登記卡、出進口廠商登記卡影本、公司登記證明、負責人身分證、公司章程、董監事及股東名冊等。</li>\n<li>出口商須為本行<b>存款往來戶</b>。</li>\n<li><b>押匯之法律性質：押匯銀行對出口商為「墊款」關係</b>，並取得押匯總質權書作為債權擔保。</li>\n<li>受理前須執行外匯關注名單檢核（FMBL）並填防制洗錢審核工作單，依結果分層呈核；「高風險客戶」須加強身分確認並呈核至經理。</li>\n<li>徵提匯票一式二份、信用狀及全部修改書、信用狀要求之各項單據。</li>\n</ul>\n<h4>第二節 單據之審核（UCP600 核心）</h4>\n<ul>\n<li>審查以<b>單據為本</b>，依單據表面內容決定是否構成符合之提示。</li>\n<li>審查期間為自提示日之<b>次日起最長五個銀行營業日</b>，不因適逢有效期限末日而縮短（UCP600第14條）。</li>\n<li>單據中資料無須完全一致，但<b>不得互相牴觸</b>；單據日期得早於信用狀簽發日，但不可遲於提示日。</li>\n<li>信用狀須為<b>不可撤銷（Irrevocable）</b>並載明適用UCP600；限制押匯銀行者須辦轉押匯；保兌信用狀須確經另一銀行保兌。</li>\n<li>出口貼現案件之開狀行以本行通匯行或The Banker世界<b>前五百大</b>銀行為原則。</li>\n<li>匯票：金額在信用狀額度內、與商業發票相符，大小寫金額須相符且不得塗改。</li>\n<li>商業發票：由受益人簽發、以申請人為抬頭、與信用狀同一幣別，交易條件（FOB/CIF/CIP等）須標明。</li>\n<li>提單（B/L）：全套正本須全部提示；To Order須託運人空白背書；須為<b>清潔提單（Clean B/L）</b>；須表明運送人名稱並由運送人/船長/標名代理人簽署。</li>\n<li>備運提單須加註<b>On-Board</b>字樣及日期始視為已裝船。</li>\n<li><b>Stale B/L 規則：信用狀未規定提示期限時，運送單據提示日不得遲於裝運日後21曆日</b>且須在有效期限內。</li>\n<li>部分裝運認定：同一運輸工具同一航次不算部分裝運（取最遲裝運日）；一個以上運輸工具即使同日同目的地仍認定部分裝運。</li>\n<li>FCR、航空運送單據<b>非權利證券</b>，遭拒付時可能無法掌控貨物，承做押匯宜審慎。</li>\n<li>保險單據：須為保險公司/保險人/代理人簽發（投保通知書Cover Note不接受）；幣別與信用狀相同；<b>最低投保額為CIF或CIP價額之110%</b>。</li>\n<li>保險單填發日期不得遲於運送單據裝運日。</li>\n<li>限制押匯文句（如 Negotiation restricted to ○○Bank）出現時須辦轉押匯。</li>\n</ul>\n<h4>第三節 利息及費用計收</h4>\n<ul>\n<li>手續費：按押匯金額<b>千分之一</b>計收，最低<b>500元</b>；需轉押匯按<b>千分之二</b>，最低<b>1,000元</b>。</li>\n<li>出口押匯息計息天數：香港港幣、新加坡新幣、日本日圓按<b>7天</b>；其他地區不分幣別按<b>12天</b>。</li>\n<li>匯費：按匯款金額<b>0.05%</b>計收，最低100、最高800。</li>\n<li>國外費用：信用狀未規定者每筆計收<b>美金50元</b>。</li>\n<li>貼現息：按遠期匯票金額、期間加<b>7天郵程利息</b>。</li>\n<li>瑕疵費用：單據瑕疵加計<b>7天</b>利息；瑕疵又轉押匯時港星日加<b>14天</b>、其他地區加<b>24天</b>。</li>\n</ul>\n<h4>第四節 款項之墊付</h4>\n<ul>\n<li>第二類指定單位自行墊款限額：每筆美金<b>四十萬元</b>或等值外幣。</li>\n<li>不得墊付情形：通知行加註「無此簽章樣本」、未經通知行逕寄受益人、戰亂地區、非本行轉開之Local L/C、貼現案開狀行信用資料無法查得者。</li>\n<li>瑕疵單據墊付：優良客戶且可立即追回押匯款者，由客戶具結並計收瑕疵息後先行墊付。</li>\n<li>慢裝船/慢提示超過<b>十天</b>以上且屬易腐動植物、蔬果等，不得先行墊付。</li>\n<li>欠缺次要單據時：優良客戶確能於<b>七天</b>內補全者得先行墊付。</li>\n</ul>\n<h4>第五~六節 授信記錄與遲延入帳</h4>\n<ul>\n<li>出口貼現逾押匯日起<b>90天</b>以上仍未承兌，比照拒付案件建檔。</li>\n<li>週報表控管逾押匯日<b>14天</b>或匯票到期日<b>7天</b>未入帳；月報表控管逾押匯日<b>30天</b>或匯票到期日<b>15天</b>。</li>\n<li>遲延入帳利息：全期扣除已收利息後另予<b>8天寬限期</b>，自第9天起補收；曾接獲瑕疵/拒付通知者不予寬限。</li>\n</ul>\n<h4>第七節 拒付之處理</h4>\n<ul>\n<li>接獲拒付通知須逐筆登記「出口押匯拒付登記簿」，通知函限<b>三日內</b>回條送回。</li>\n<li>遭拒付應積極催討，限<b>一個月</b>內解決或收回新台幣；逾<b>三個月</b>未結案應採法律程序。</li>\n<li>拒付逾<b>六個月</b>仍未收回者，轉列原幣「催收款項」科目。</li>\n<li>拒付利息：按牌告一般外匯授信利率<b>加年息2.5%</b>計收。</li>\n<li>續受理瑕疵押匯之拒付限額：一般為已核准出口押匯額度之<b>二分之一</b>（同一信用狀/進口商為<b>四分之一</b>）。</li>\n</ul>\n<h4>第八節 轉開國內信用狀</h4>\n<ul>\n<li>得在原核准之進口授信額度或出口押匯授信額度內辦理；申請人須為原信用狀受益人且為本行優良客戶。</li>\n<li>開狀行以本行通匯行或世界前五百大銀行為原則。</li>\n<li>轉開申請書幣別應與原信用狀相同、金額可較少；最後裝船日不晚於原始信用狀、有效期限應較短。</li>\n<li>轉開LOCAL L/C須附<b>Final Payment條款</b>（俟收到Master L/C開狀行款項後始償付）。</li>\n<li>開狀手續費每三個月一期按<b>0.125%</b>計收，最低<b>800元</b>。</li>\n</ul>\n<h4>第九節 其他注意事項</h4>\n<ul>\n<li>出口三角貿易（委外加工/商仲貿易）：貨物非經我國通關但貨款經我國收款，大陸出貨另勾註記。</li>\n<li>單據不齊全逾<b>五個營業日</b>未補正者，須敘明理由呈核至經理。</li>\n<li>出口求償：即期無瑕疵者寄單後向補償銀行求償；遠期或有瑕疵者於開狀行承兌後求償。</li>\n<li>同存授扣：開狀行於本行設同存帳戶時，優先請其授權本行於同存帳戶扣收。</li>\n</ul>\n<h4>第十節 信用狀轉讓</h4>\n<ul>\n<li>轉讓申請人須為原信用狀受益人且為本行績優客戶；原信用狀須載明<b>可轉讓（TRANSFERABLE）</b>、經本行通知並指定本行辦理。</li>\n<li>換單分割轉讓：金額/單價得較少、有效期限應較原信用狀提前<b>七天以上</b>。</li>\n<li>換單轉讓開狀手續費按轉讓金額<b>0.2%</b>計收，最低<b>1,200元</b>；不換單轉讓每筆<b>800元</b>。</li>\n</ul>\n<h4>第十一節 出口遠期信用狀賣斷業務（Forfaiting）</h4>\n<ul>\n<li>信用狀賣斷：票據持有者將未來應收債權轉讓予買斷行（Forfaiter）換取現金，屬<b>無追索權（non-recourse）</b>票據貼現。</li>\n<li>受理對象：長天期（<b>180天以上</b>）遠期信用狀、對出口商信用有疑異、押匯額度不足、高風險/限押地區信用狀。</li>\n<li>本行為賣斷行；到期不獲兌現時買斷行無權追索。</li>\n<li>本行擬收利差原則不得少於<b>1%</b>；採L/C項下託收方式辦理，本行無需墊款。</li>\n<li>交易須待買斷行進行無追索權買斷後才算完成。</li>\n</ul>\n<h4>第十二節 出口遠期信用狀買斷業務</h4>\n<ul>\n<li>本行為買斷行；承做條件：遠期信用狀經開狀行/保兌行<b>承兌</b>，且開狀行在本行有核配銀行額度。</li>\n<li>額度為循環額度，買斷期間以不超過<b>一年</b>為限。</li>\n<li>初級市場：開狀行因財務危機不付款本行對出口商<b>無追索權</b>；但<b>商業糾紛或法院禁止支付命令本行仍有追索權</b>。</li>\n<li>利率報價限承兌日起<b>十個營業日</b>內辦理撥款。</li>\n<li>投保信用狀買斷保險（中國輸出入銀行，承保比例100%）；到期後逾<b>二十日</b>未獲付款須於<b>五個營業日</b>內通知中輸銀。</li>\n</ul>\n<h4>第十三節 出口轉押匯及信用狀保兌</h4>\n<ul>\n<li>轉押匯：信用狀限制押匯條款下，受益人改由非指定銀行辦理押匯，由受理行轉遞至指定行。</li>\n<li>押匯行對押匯單據負審查責任；意見相左時<b>單據審核採押匯行意見，寄送求償流程採指定行意見</b>。</li>\n<li>信用狀保兌：保兌行對符合提示為兌付/讓購之確定承諾，與開狀行負<b>相同且獨立</b>義務。</li>\n<li>保兌/保證額度依銀行排名核配：前300名600萬美元、301~500名400萬美元、500名以外120萬美元。</li>\n<li>信用狀/保證函有效期限屆滿<b>一個月</b>、款項已償付或正本退還時，保兌/保證責任解除。</li>\n</ul>\n<h4>第十四節 信用狀通知業務</h4>\n<ul>\n<li>辦理通知須就可疑銀行/國家/申請人/受益人查證，確為制裁對象即不辦理。</li>\n<li>逾通知<b>1個月</b>未領取須追蹤；逾通知日<b>1年</b>未領取系統自動結案。</li>\n</ul>"},{"id":"fx-s0p2-c2","t":"第三章 受理出口託收作業應注意事項","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<h4>第一節 概說</h4>\n<ul>\n<li>出口託收：出口商開發以進口商為付款人之匯票並檢同全套單據委託本行向國外收取貨款。</li>\n<li>本行處於<b>代理人</b>地位，應遵照託收統一規則（<b>URC522</b>）及委託人指示辦理。</li>\n<li><b>D/P（付款交單）</b>：進口商付款後始取得單據提貨；<b>D/A（承兌交單）</b>：進口商承兌遠期匯票後即取得單據提貨、到期日方付款。</li>\n<li>D/A遠期匯票最長付款期限通常為承兌後<b>180天</b>以內。</li>\n<li>URC522關係人：委託人（Principal，出口商）、託收銀行（Remitting Bank）、代收銀行（Collecting Bank）、提示銀行（Presenting Bank）、付款人（Drawee，進口商）。</li>\n</ul>\n<h4>第二節 應辦手續</h4>\n<ul>\n<li>國外代收銀行宜請委託人指定<b>本行通匯行</b>為原則。</li>\n<li>出口託收手續費按匯票金額<b>0.05%</b>計收，最低<b>500元</b>；分批進帳第二次以後每次收500元。</li>\n<li>逾越出口寄單日起<b>45天（D/P）</b>或匯票到期日起<b>30天（D/A）</b>仍未進帳，應向國外代收銀行發催收函。</li>\n<li>逾寄單日（D/P）或匯票到期日（D/A）起<b>六個月</b>仍未結案，通知委託人繳費並辦結案。</li>\n<li>託收被拒付時國外發生之保險費、倉租、裝卸儲運費用仍由<b>出口商</b>負擔。</li>\n<li>國外代收行於本行設同業存款帳戶時，付款指示以授權本行於同存帳戶扣收為原則。</li>\n</ul>"},{"id":"fx-s0p3-c1","t":"第四章 受理開發進口信用狀作業應注意事項","fc":"A","fq":"5年約30題（每年約6題）· A級","h":"<h4>第一節 受理申請開發進口信用狀之處理</h4>\n<ul>\n<li>第一次受理需本行墊貸外幣/新台幣時，應徵取切結書、授權書<b>二份</b>、簽章登記卡、出進口廠商登記卡（須具進/出口資格）、公司登記文件、負責人身分證、公司章程、董監事名冊、印鑑卡等文件。</li>\n<li>毋需墊貸之案件，僅需徵取簽章登記卡至負責人身分證即可。</li>\n<li>申請開發遠期信用狀時另需徵「進口遠期信用狀/外幣貸款借款契約」，且每次授信額度核准後應重新徵取。</li>\n<li>簽章登記卡右下角客戶名稱欄用放款印鑑須負責人親簽；切結書、授權書、借款契約均免親簽。</li>\n<li>進出口採不同印鑑者須加註「進口專用/出口專用」。</li>\n</ul>\n<h4>第二節 進口信用狀之開發及第一次結匯</h4>\n<ul>\n<li>開狀應俟授信核准並辦妥授信手續後始予收件；受益人原則應為近一年徵信報告之主要進貨廠商，新增交易對手需查核「存在真實性」及「行業關連性」。</li>\n<li>開狀相關交易前須執行「外匯關注名單檢核（FMBL）」；可疑及高風險案件須呈防制洗錢督導主管（高風險呈至經理）。</li>\n<li>開狀申請書審查：金額不得超過交易單據（或輸入許可證）金額。</li>\n<li>單筆信用狀或修狀後金額達等值<b>美金50萬元</b>以上須列印大額開狀明細表檢視異常。</li>\n<li>最後裝運日須在信用狀有效日期以前或同日；裝運日與有效日相距超過<b>21曆日</b>未填提示期間者，依UCP600辦理。</li>\n<li>分批裝運未註明概以「准許」開發；轉運未註明概以「不准許」開發。</li>\n<li>保險依UCP600第28條須涵蓋接管地/裝運地至卸貨地/目的地；C.I.F./C.I.P.需列協會貨物保險條款。</li>\n<li>提單原則以本行為受貨人或指示人；快遞收據、電放提單、House B/L等非權利證券，須先辦妥交單條件或十足設質擔保經經理核准始承做。</li>\n<li>洗錢警示徵兆：新戶申請大額、無進口實績遽增大額、受益人位於高風險地區、延遲贖單又要求續開、發票商品敘述與提貨單不符、定價明顯偏離市場公平價值。</li>\n<li>受益人國別為香港、大陸、新加坡者，一律經分行經理核准後始能開（修）狀。</li>\n<li>開狀手續費：即期信用狀有效期每<b>三個月</b>為一期，第一期按金額<b>2.5/1,000</b>，以後每期<b>1.25/1,000</b>，每期最低新台幣<b>500元</b>。</li>\n<li>遠期信用狀（Buyer's Usance）第一期依匯票期間分級：90天內2.5/1,000、91-120天3/1,000、121-150天3.5/1,000、151天以上4/1,000。</li>\n<li>遠期信用狀（Shipper's Usance）第一期一律按<b>4/1,000</b>計收。</li>\n<li>保兌費第一期2.5/1,000（最低新台幣1,000元），以後每期1.25/1,000（最低500元）；國外費用每筆預收新台幣<b>1,200元</b>。</li>\n<li>全額結匯且符合最大寬容度存入保證金並不辦擔保提貨/副提單背書兩條件，得徵切結書後<b>免辦徵信</b>。</li>\n</ul>\n<h4>第三節 進口信用狀之修改</h4>\n<ul>\n<li>本行受理者均為<b>不可撤銷信用狀</b>，修改需所有利害關係人全體同意始生效；對受益人不利之修改應向申請人說明。</li>\n<li>須先修改輸入許可證之情形：物品名稱、金額增減、單價變動、輸出口岸、受益人名稱地址更改、裝運日延長逾許可證有效期。</li>\n<li>修改手續費：增加金額比照開狀收費；展延效期每三個月一期按<b>1.25/1,000</b>（最低500元）；其他內容修改每筆新台幣<b>500元</b>。</li>\n</ul>\n<h4>第四節 第二次結匯及進口到單處理</h4>\n<ul>\n<li>第二次結匯情況：提前結匯還款、即期單據到達、即期副提單背書/擔保提貨、遠期匯票到期還款。</li>\n<li>即期單據已到達：自本行發單據到達通知書日起<b>15日內</b>結匯，自付條款以到單日起算利息，非自付條款以國外押匯日起算。</li>\n<li>單據未到達之提前結匯/擔保提貨結匯：一律按一般外匯授信利率計收<b>7天</b>利息。</li>\n<li>逾期結匯：自發通知書日起15日內未結匯者，自<b>第16日</b>起按一般外匯授信利率加年率<b>2.5%</b>計收；逾期六個月內加收<b>一成</b>違約金，逾六個月加收<b>二成</b>違約金。</li>\n<li>遠期信用狀到期日以「進口單據到達通知書」所載為準；墊款利息超過六個月者應每滿六個月計息一次並機動調整利率。</li>\n<li>融資期限到期後<b>三個月</b>內未收回之逾期案件，應轉列催收款項。</li>\n<li>單據瑕疵者，須請客戶於「進口單據到達聲明書」表示是否接受，以利於收到單據<b>5個銀行營業日內</b>向國外押匯行提出主張。</li>\n<li>付款或授扣金額達等值<b>美金30萬元</b>以上須辦大額資金通報。</li>\n<li>單據交付：即期/遠期皆須於發通知書次日起<b>5個銀行營業日內</b>辦理交單。</li>\n<li>國外超額押匯：超押金額未逾開狀金額<b>5%</b>免徵開狀手續費，超過5%須就全部超押金額補收手續費。</li>\n<li>L/C過期<b>三個月</b>以上未展期或結案，到單時須就未用餘額補收開狀手續費後始交單。</li>\n</ul>\n<h4>第五節 瑕疵單據與進口拒付之處理</h4>\n<ul>\n<li>接獲瑕疵通知書須於登記簿註明瑕疵內容、是否已辦副提單背書/擔保提貨、本行拒付截止日。</li>\n<li>客戶不同意接受瑕疵須立即退還全部單據以提出拒付主張。</li>\n<li>因單據瑕疵國外改以託收處理者，應洽客戶於收到單據後<b>5個銀行營業日內</b>贖單或交單，逾期即發電拒付。</li>\n<li><b>已辦擔保提貨或副提單背書並提貨者，不得以任何理由主張拒付</b>。</li>\n</ul>\n<h4>第六節 副提單背書及擔保提貨之處理</h4>\n<ul>\n<li>副提單背書：本行未收提單正本、進口商先收提單副本時申請，提貨後不得拒付；即期須辦第二次結匯，遠期依授信條件辦妥並徵本票。</li>\n<li>擔保提貨：正副提單均未到達、僅接船公司到貨通知時申請，提貨後不得拒付；須備擔保提貨書<b>二份</b>（船公司用紙）。</li>\n<li>擔保提貨書應加蓋保證責任自本行收到退回之擔保提貨書之日起，或客戶收到經背書正本提單之日起<b>十日後</b>自動解除之字句。</li>\n<li>註銷擔保通知書發送後逾<b>十天</b>未見覆，得以雙掛號回執聯辦理銷案。</li>\n<li>擔保提貨逾<b>一個月</b>未銷案或信用狀已逾有效期仍未銷案，列表逐筆查明追蹤。</li>\n</ul>\n<h4>第七節 進口授信記錄之處理</h4>\n<ul>\n<li>非美元外幣以開狀收件時點之掛牌賣匯匯率換算折算匯率，不隨每日掛牌浮動。</li>\n<li>外匯授信對帳單函證於一般自行查核辦理，至少抽查<b>10戶</b>。</li>\n</ul>\n<h4>第八節 進口信用狀及保證金未用餘額之處理</h4>\n<ul>\n<li>沖銷未用餘額/退還保證金須符合：國外寄回註銷、通知不再裝運、信用狀已過期<b>一個月</b>以上、金額較小（開狀金額<b>5%</b>以內或等值<b>美金1萬元</b>以內）經經理同意、或專案核准。</li>\n<li>由受益人負擔開修狀費之信用狀逾有效期一個月未到單出現「待收費」註記，須先補收費用才能退保證金/沖銷。</li>\n</ul>\n<h4>第九節 三角貿易案件之處理</h4>\n<ul>\n<li>三角貿易分「商仲貿易」（購貨不加工直接國外銷售）與「委外加工貿易」（國外購料委託國外加工），貨物均未經我國通關。</li>\n<li>憑Master L/C轉開信用狀以開狀行為本行通匯行且經本行通知為原則；非通匯行但屬<b>世界前500大銀行</b>或資產健全者得酌情受理。</li>\n<li>不得轉開情形：限制往來國家/地區銀行開發、政局不穩地區、出口遠期信用狀、業經轉開、條款明顯不利押匯行、Master L/C開狀行或母行為本行授信利害關係人。</li>\n<li>轉開信用狀最後裝船日不晚於原始信用狀，有效期應提前<b>一至二星期</b>；保險金額不得低於原始信用狀規定，未規定者以原始信用狀金額<b>110%</b>為最低投保金額。</li>\n<li>以出口押匯額度轉開者，申請人須為原始信用狀受益人，並於電文加註最終付款（Final Payment）條款。</li>\n</ul>\n<h4>第十節 外幣擔保信用狀/保證函處理</h4>\n<ul>\n<li>定義：開狀行應申請人請求，於申請人違約時對受益人履行付款賠償之文書；具「一經請求即付款」（Paid at First Demand）特性。</li>\n<li>種類：投標（押標金）、履約、預付款、借款（融資）擔保信用狀、保留款、保固保證函；保留款通常扣留工程總額<b>10%~15%</b>。</li>\n<li>適用規則：擔保信用狀用<b>UCP600、ISP98</b>；保證函用<b>URDG758、ISP98</b>。</li>\n<li>開發手續費按保證期間每期<b>2.5/1,000</b>（最低新台幣1,000元），每三個月一期。</li>\n<li>開發以SWIFT拍發<b>MT760</b>，修改MT767，拒付MT786電文。</li>\n<li>審單期限：UCP600、URDG758為提示日次日起最長<b>5個營業日</b>；ISP98以<b>3個營業日</b>為合理、超過<b>7個營業日</b>視為不合理。</li>\n<li>保證責任解除：國外退回正本註銷、接獲解除通知、逾求償期限（加郵遞期間）、保證責任履行完畢；相關報表保存<b>5年</b>。</li>\n<li>應以開狀行營業處所在地法律為管轄；避免開發轉讓保證函。</li>\n</ul>"},{"id":"fx-s0p3-c2","t":"第五章 受理進口託收作業應注意事項","fc":"C","fq":"5年約8題（每年約2題）· C級","h":"<h4>第一節 概說</h4>\n<ul>\n<li>進口託收：國外出口商裝運後開發以國內進口商為付款人之匯票及單據，委託託收銀行（Remitting Bank）轉由本行（代收銀行，Collecting Bank）向進口商收款。</li>\n<li>分承兌交單（<b>D/A</b>）與付款交單（<b>D/P</b>）二種。</li>\n<li>本行處<b>代理人</b>地位，應遵照國際商會<b>託收統一規則URC 522</b>及託收銀行指示辦理。</li>\n<li>單據以本行或本行指定人為受貨人時，本行無義務處理貨物，應請進口商轉知出口商改以進口商為受貨人。</li>\n<li>非授信客戶辦理託收須填「進/出口託收客戶調查表」，佐證文件自下次填表日起續存<b>一年</b>。</li>\n</ul>\n<h4>第二節 承兌交單（D/A）之處理</h4>\n<ul>\n<li>承兌手續費按託收金額<b>2/1,000</b>計收，最低新台幣<b>200元</b>。</li>\n<li>匯票承兌須請進口商在匯票正面註明承兌日期及到期日，加蓋付款人公司章及負責人印鑑。</li>\n<li>進口託收單據到達後逾<b>15日</b>仍未辦理D/A承兌，或已承兌逾到期日未結匯付款，應速洽客戶並記錄逾期追蹤。</li>\n<li>匯票到期日：After sight自<b>承兌日</b>起算；After B/L Date自<b>提單裝船日</b>起算；After Date自<b>匯票發票日</b>起算。</li>\n</ul>\n<h4>第三節 付款交單（D/P）之處理</h4>\n<ul>\n<li>除免辦匯票承兌外手續與D/A同，但須於客戶辦妥結匯後始得交付單據。</li>\n<li>依URC 522規定付款交單案件不得含未來日期付款之匯票；僅標明「D/P 30天」者，單據仍須於進口客戶付款後才能交付。</li>\n<li>手續費按託收金額<b>1.5/1,000</b>計收，最低新台幣<b>200元</b>。</li>\n<li>進口託收單據到達後逾<b>15日</b>仍未辦理D/P付款交單者，應速洽客戶並記錄逾期追蹤。</li>\n</ul>\n<h4>第四節 副提單背書及擔保提貨之處理（託收項下）</h4>\n<ul>\n<li>風險說明：因本行尚未接到國外單據，對託收條件無法查究、金額未定，係對船公司<b>無確定範圍之保證</b>，風險極大，辦理應特別慎重。</li>\n<li>限特優廠商及確認客戶對託收條件有履行把握者才承做；由客戶事先通知出口商委請國外銀行以加密押電報授權（電報須含匯票金額、提單號碼、受貨人名稱）。</li>\n<li>辦理時D/P案件應同時辦理結匯、D/A案件應徵取客戶本票，必要時由可靠第三者背書或徵本行定存單設質。</li>\n<li>辦理後應追蹤正本單據到達；逾<b>十五日</b>仍未到單者以「未到單通知書」通知客戶；經<b>三次</b>通知仍未到單，該客戶日後之副提單背書/擔保提貨案件須先洽國外託收銀行授權後方得辦理。</li>\n</ul>"},{"id":"fx-s0p4-c1","t":"第六章 受理國外匯兌業務作業應注意事項","fc":"A","fq":"5年約38題（每年約8題）· A級","h":"<h4>第一節 概說（結匯申報門檻與身分別）</h4>\n<ul>\n<li>受理國外匯兌前須落實客戶基本資料、資金來源/去處合理性及洗錢防制KYC審查。</li>\n<li>結匯金額<b>未滿新臺幣50萬元</b>者免填申報書，且不計入當年累積結匯金額，惟須防「化整為零」。</li>\n<li>新臺幣<b>50萬元（含）以上</b>等值外匯結匯須填「外匯收支或交易申報書」；金額欄不得塗改（塗改須重填），其他欄塗改須加蓋印章。</li>\n<li>50萬元以上申報案原則不得更改內容；例外：非故意申報不實（附律師/會計師/本行意見書）或故意申報不實已被罰<b>新臺幣3萬～60萬元</b>並附繳款收據，得申請更正。</li>\n<li>公司行號每筆等值<b>100萬美元（含）以上</b>、個人團體每筆<b>50萬美元（含）以上</b>結匯，須確認合約/核准函等文件並留存。</li>\n<li>大額結匯確認書：訂約後1、2營業日交割之大額結匯，未收回正本者最遲訂約當日下午<b>3:30</b>電話錄音確認，保存<b>5年</b>。</li>\n<li>同一客戶同一訂約日結匯達等值100萬美元，須於訂約日下午<b>6:30前</b>執行大額結匯款通報。</li>\n<li>每筆達等值<b>500萬美元（含）以上</b>結購結售，須於訂約日下午<b>4:30前</b>電話通報央行外匯稽核科。</li>\n<li>持外國護照、無我國身分證之國人、居留證未滿1年者、無居留身分之陸港澳人士辦結匯，<b>比照非居住民</b>。</li>\n<li>非居住民法人每筆未逾等值<b>10萬美元</b>之匯款，須出具授權書授權境內代表人為申報義務人。</li>\n<li>非居住民每筆超過10萬美元之工程款、擔保金、不動產款、遺產保險撫卹金等結匯，須經<b>央行核准</b>後始得辦理。</li>\n<li>大陸人民持居留證有效期<b>1年以上</b>按居住民、未滿1年按非居住民辦理；匯款國別為大陸者，不得受理未經許可之直接投資、有價證券投資。</li>\n<li>未滿<b>18歲</b>之本國自然人及居留證滿1年之外國人，以新臺幣結購/結售每筆限額<b>未達新臺幣50萬元</b>。</li>\n<li>人民幣：自然人買/賣現鈔每人每次不得逾<b>人民幣2萬元</b>；每人每日透過帳戶買賣不得逾人民幣2萬元；本國人匯款至大陸每人每日不得逾<b>人民幣8萬元</b>（限經常項目）。</li>\n<li>身分別代號：1公司行號、2團體、3本國自然人、4持居留證者、43持護照外國人、5銀行本身。</li>\n<li>駐華外交機構結匯不論性質均無金額限制。</li>\n</ul>\n<h4>第二節 國外匯入匯款之處理</h4>\n<ul>\n<li>匯入方式：<b>電匯</b>（列印匯入匯款通知書通知受款人）、<b>票匯</b>（提示他行簽發匯票）。</li>\n<li>匯款人資訊須至少含<b>姓名、帳號、住址</b>；受款人須含姓名及帳號。</li>\n<li>匯款人資訊不足：請受款人聯繫匯款行更正；逾掛號通知<b>1個月</b>或去電逾<b>10個營業日</b>未回覆，得以資訊不完整逕予退匯。</li>\n<li>受款人資料不符：逾10個營業日未接獲修改通知得逕退款；小差異得徵瑕疵切結書解款。</li>\n<li>匯入匯款以<b>撥入受款人帳戶</b>為限，不得直接轉匯他行、直接支付現金或撥入第三者帳戶（特殊情形除外）。</li>\n<li>票匯原則須俟收到國外匯款行<b>SWIFT MT110</b>票匯通知並核對簽章無誤後付款。</li>\n<li>第三方支付業者（Alipay、PayPal等）名義匯款人須揭露實際買方姓名金額，逾10營業日未提供以資訊不完整退匯。</li>\n<li>止付：收到MT192/CAMT.056請求，客戶簽章表明退匯或止付意旨後發電回覆。</li>\n</ul>\n<h4>第三節 國外匯出匯款之處理</h4>\n<ul>\n<li>匯出方式：<b>電匯T/T</b>（SWIFT委託通匯行解付）、<b>票匯D/D</b>（本行簽發匯票交客戶）。</li>\n<li>以新臺幣現金結匯匯出達等值美金<b>1萬元</b>須註記現金來源合理性；單筆現金達新臺幣50萬元（含）以上須辦大額通貨交易建檔。</li>\n<li>個人臨櫃匯出達等值新臺幣<b>50萬（含）以上</b>須填「臨櫃作業關懷客戶提問表」；<b>高齡（65歲以上）</b>須另填高齡檢核表。</li>\n<li>非本行客戶每人每日匯出（含票匯）不得逾等值美金<b>1萬元</b>；國籍北韓或伊朗一律婉拒。</li>\n<li>資金來源原則須自匯款申請人<b>本人帳戶</b>扣款。</li>\n<li>外籍人員贍家薪津：憑護照或未滿1年居留證匯出填「410非居住民薪資匯出」；憑1年以上居留證填「511工作者匯款」。</li>\n<li>覆核人員須有<b>6個月以上</b>外匯經歷，不得兼任放行主管；達等值美金<b>100萬元（含）以上</b>須另一主管於「大額覆核主管」欄核准。</li>\n<li>退匯（電匯）：須確認款項退回本行後始得辦理。</li>\n<li>本行匯票遺失止付：向國外付款行查詢確認未解訖後止付，須聲請公示催告並徵擔保品設質至少<b>6個月</b>。</li>\n</ul>\n<h4>匯款劃帳（通匯行/存匯行）</h4>\n<ul>\n<li><b>通匯行</b>＝兩行有電報協定可直接發加押電報但無存款往來；<b>存匯行</b>＝有存款帳戶往來（存放同業「存同」、同業存款「同存」）。</li>\n<li>一通電文（Serial Payment）：拍至存匯行，中間費用從匯款金額扣收。</li>\n<li>兩通電文（Cover Payment）：拍至受款行＋COV至存匯行，全額到受款行但收2筆電報費。</li>\n<li>勿拍兩通電文：匯往美國之美元、匯往英國之英鎊、匯往大陸之人民幣、受款行為本行存匯行。</li>\n<li>清算代碼：美國CHIPS/FEDWIRE用ABA、英國SORT Code、澳洲BSB。</li>\n<li>歐元區須註明受款行BIC CODE及IBAN帳號。</li>\n<li>匯往大陸人民幣須輸入CODEWORD（RMT個人、GOD貨物貿易、STR服務貿易等）。</li>\n</ul>\n<h4>外幣結算平台（RTGS）</h4>\n<ul>\n<li>財金公司為結算機構，採<b>即時總額清算（RTGS）</b>；境內幣別限美元、人民幣、日圓、歐元、澳幣；跨境限人民幣、日圓。</li>\n<li>系統結算時間每營業日下午<b>5時</b>。</li>\n</ul>\n<h4>第四節 外幣代收付服務</h4>\n<ul>\n<li>透過財金公司外幣結算平台辦理；扣款行應於<b>7個營業日</b>內回覆授權核印結果。</li>\n<li>核印費每筆60元、交易處理費每筆25元。</li>\n</ul>\n<h4>第五節 買入暨代收外幣票據（光票）</h4>\n<ul>\n<li>申請人須為本行存款往來戶。</li>\n<li>保證人：單筆等值<b>USD300（含）以下</b>且累計未入帳餘額未達<b>USD500</b>者免徵；以上須徵保證人並對保（優良授信戶得免）。</li>\n<li><b>買入 vs 代收</b>：買入＝先撥款給客戶（本行承擔風險）；代收＝收妥款項後才入帳（仍有退票可能，部分國家6年內可退票）。</li>\n<li>偽造票據追索期（美國）：正面偽造<b>1年</b>、背面偽造<b>3年</b>、國庫支票<b>無時間限制</b>隨時可退票。</li>\n<li>未載有效期限之票據提示期為發票後<b>6個月</b>內；未到期票據禁止買入。</li>\n<li>不得買入：禁止背書轉讓、禁止對國外執票人付款、附條件、戰亂地區付款之票據。</li>\n<li>買入費用：手續費0.5/1,000（最低200最高800，每超1張加100）、利息（紐約美金5萬以下<b>7天</b>、其他美國本土/香港<b>12天</b>、5萬以上或其他地區<b>21天</b>）、郵電費800。</li>\n<li>代收費用：手續費0.05%（最低200最高800）、郵電費800。</li>\n<li>買入光票拒付：催請客戶償還外幣及利息（遲延利息＝一般外匯授信利率＋年息<b>2.5%</b>），退票逾<b>6個月</b>未收回轉列催收款。</li>\n<li>南非幣票據單筆不得逾南非幣5萬元。</li>\n</ul>\n<h4>第六節 外幣現鈔之處理</h4>\n<ul>\n<li>現鈔種類：美金、英鎊、港幣、澳幣、加幣、日圓、歐元、人民幣。</li>\n<li>自然人買賣人民幣現鈔每人每次不得逾<b>人民幣2萬元</b>。</li>\n<li>結購：非本行客戶每人每日不得逾等值美金<b>1萬元</b>；新臺幣結購<b>免手續費</b>，自外存提領按即期與現鈔賣出匯率差額計收（最低200）。</li>\n<li>收兌限額：本行客戶個人每日等值美金<b>3萬元</b>、公司每日<b>5萬元</b>；<b>10萬美元（含）以上一律託收</b>；非本行客戶每人每日以等值美金<b>500元</b>為原則、最高不逾<b>1,000元</b>。</li>\n<li>各營業單位有收兌外幣之義務，不得以持舊版、無水單、無庫存拒絕。</li>\n<li>陳舊鈔券「不流通（可收不可賣）」按<b>5%×現鈔買入匯率</b>計處理費（最低100）。</li>\n<li>偽（變）造幣券：加蓋「偽造作廢」章截留，總值達等值美金<b>200元以上</b>須報警偵辦；截留幣券保管逾<b>5年</b>得銷毀。</li>\n<li>現鈔剩餘短缺達新臺幣<b>10萬元（含）以上</b>須發現當日完成通報登錄。</li>\n</ul>\n<h4>第七節 收兌旅行支票</h4>\n<ul>\n<li>每位客戶每日回售（含託收）旅支合計上限等值美金<b>25,000元</b>。</li>\n<li>非本行售出美元旅支（美國運通）：單日同一客戶買入以美金<b>500元（含）</b>為上限，逾者託收。</li>\n<li>非美元旅支（英鎊、加幣、歐元）須透過美國運通託收不得買入。</li>\n<li>審核：電話照會美國運通取授權碼，核對副署簽名與原始簽署筆跡。</li>\n<li>收兌逾等值美金<b>2,000元（含）以上</b>須填專用問卷；達新臺幣50萬須填申報書。</li>\n</ul>\n<h4>第八節 線上申購外幣現鈔</h4>\n<ul>\n<li>領取須本人攜身分證件於營業時間至指定分行，<b>不得委託他人</b>；得選交易日起<b>7日內</b>任一營業日為提領日。</li>\n<li>新臺幣結購每筆及每日最高不得達新臺幣50萬（併計當日各通路結匯）；人民幣現鈔每筆限人民幣2萬元。</li>\n<li>逾指定提領日<b>14日</b>未領應主動通知；延長最長不得逾提領日<b>3個月</b>。</li>\n</ul>\n<h4>第九節 外幣現鈔庫存管理</h4>\n<ul>\n<li>保管人員限專任一人，不得兼任櫃員主任、ATM經辦或會計人員。</li>\n<li>每100張為1整紮，每10整紮為1捆。</li>\n<li>外幣現鈔庫存表保存<b>15年</b>。</li>\n<li>覆點：每日例行覆點＋每週機動覆點（每月經理至少1次）。</li>\n<li>現金運送：等值美金<b>9,000元（含）以下</b>得指派1名行員；以上須運鈔車及運送人員至少<b>3人</b>。</li>\n</ul>\n<h4>第十節 大額通貨交易資料申報</h4>\n<ul>\n<li>每筆現金收付達等值新臺幣<b>50萬元（含）以上</b>外匯交易，須辦大額通貨交易申報建檔。</li>\n<li>資訊處於第<b>3個營業日</b>傳送通報資料予<b>法務部調查局</b>。</li>\n<li>疑似洗錢或資恐交易不論金額多寡或是否完成，均應向調查局申報。</li>\n<li>免逐次申報對象：政府機關、公營事業、公私立學校、公用事業帳戶款項；金融機構間交易；經確認名單並報調查局核備者（每年至少審視一次）。</li>\n</ul>"},{"id":"fx-s0p5-c1","t":"第七章 受理外匯存款作業應注意事項","fc":"A","fq":"5年約28題（每年約6題）· A級","h":"<h4>第一節 一般規定</h4>\n<ul>\n<li>存戶對象：境內有住所之本國/外國自然人及法人，或持外國護照且境內無住所之自然人及境外法人。</li>\n<li>開戶一律須查核<b>雙重身分證明文件</b>；大陸地區自然人憑居留證或入出境許可證並留存統一證號。</li>\n<li>客戶身分驗證時限：建立業務關係後<b>30個工作天內</b>完成；逾30天暫時中止；逾<b>120天</b>終止業務關係。</li>\n<li>定期審查頻率：風險高/中/低分別每<b>1年/3年/5年</b>；高風險至少每年檢視。</li>\n<li>存款種類：外匯活期、外匯定期；活存憑存摺或約定隨時存提，<b>不得開立支票</b>。</li>\n<li>外匯定存期限：未滿一個月分<b>7天、14天、21天</b>；一個月以上分<b>1、3、6、9個月及一年</b>；指定到期日最短<b>8天</b>、最長一年內。</li>\n<li>定存利率固定或機動擇一，一經選定<b>不得中途變更</b>；機動利率以一個月期以上、美元及歐元為原則。</li>\n<li>未滿一個月定存幣別限美元、英鎊、港幣、澳幣、日圓、紐幣、歐元、人民幣<b>8種</b>。</li>\n<li>最低金額：活存開戶/起息/計息單位均為<b>等值100美元</b>；定存每筆最低<b>等值1,000美元</b>。</li>\n<li>存款保險保額新臺幣<b>300萬元</b>，含外幣存款本息，<b>不含OBU存款</b>。</li>\n<li>自然人每日透過帳戶買賣人民幣限額<b>人民幣2萬元</b>（買賣分別計算，全行併計）。</li>\n<li><b>人民幣現鈔</b>存入或提領外匯存款帳戶，不論個人或公司<b>均無金額限制</b>。</li>\n<li>疑似規避結匯申報控管：同一個人當日全行累計結匯達美金<b>40萬~50萬(不含)</b>、公司達<b>80萬~100萬(不含)</b>且近30天達3次以上者列報。</li>\n</ul>\n<h4>第二節 開戶手續</h4>\n<ul>\n<li>身分證影本應加註「限辦理第一銀行開戶使用」。</li>\n<li>外匯存款帳號共<b>11位數</b>：存款種類代號活存<b>40</b>、OBU活存<b>86</b>、定存<b>77</b>、OBU定存<b>85</b>、金如意<b>68</b>。</li>\n</ul>\n<h4>第三節 存入程序</h4>\n<ul>\n<li>轉帳存入金額達<b>等值美元10萬元</b>須經主管授權。</li>\n<li>存入帳戶距上次往來逾<b>2年</b>者須以「久未往來客戶關懷提問表」詢問。</li>\n<li>定期定額結購：每筆最低等值美金<b>100元</b>、最高<b>1萬元</b>；每人每日結購併計未達等值新臺幣50萬元；約定連續<b>3次</b>扣款失敗自動失效。</li>\n</ul>\n<h4>第四節 提領程序</h4>\n<ul>\n<li>單筆提領或轉讓達新臺幣<b>50萬元(含)以上</b>須填臨櫃關懷提問表。</li>\n<li>高齡客戶（<b>65歲以上</b>）結售、轉讓、定存解約須以「高齡客戶檢核表」防金融剝削。</li>\n<li>全行代付款取款碼為<b>4位數字</b>（不得皆為零），輸錯達<b>3次</b>電腦自動停止憑摺付款。</li>\n</ul>\n<h4>第五節 定存自動轉期</h4>\n<ul>\n<li>轉期次數不限；「指定到期日」及「以未牌告利率檔期存入」者<b>不得</b>申請自動轉期。</li>\n<li>轉期利率以原到期日<b>前一營業日</b>牌告利率計息。</li>\n<li>議價加碼超過<b>0.1%</b>者一律僅依牌告加0.1%轉期。</li>\n<li>存款經質權設定後申請自動轉期，須有質權人同意記載並簽章。</li>\n</ul>\n<h4>第六節 中途解約及逾期處理（必考）</h4>\n<ul>\n<li>中途解約通知：未滿一個月期須<b>2日</b>前通知；一個月以上須<b>7日</b>前通知；並須<b>全部一次結清</b>。</li>\n<li>未滿一個月期中途解約<b>不予計息</b>。</li>\n<li>一個月以上中途解約按實存期間、以<b>起存日牌告利率八折</b>計算：未滿一個月不計息；滿1未滿3個月按一個月期利率八折；滿3未滿6個月按三個月期八折；滿6未滿9個月按六個月期八折；滿9未滿一年按九個月期八折。</li>\n<li>中途解約按實存期間<b>單利</b>計息。</li>\n<li><b>不得</b>提供「外幣定存中途解約利息免打折」優惠行銷保險商品。</li>\n<li>逾期處理（一個月以上）：到期未領自到期日至提領日按<b>提領日活存利率</b>計付；逾期<b>10日內</b>續存得以原到期日為起息日。</li>\n<li>逾期處理（一個月以下）：到期未領<b>不計息</b>。</li>\n</ul>\n<h4>第七節 定存按月付息</h4>\n<ul>\n<li>適用DBU外匯定存<b>3、6、9或12個月</b>檔期，按月付息轉入本人同幣別活存。</li>\n<li>中途解約仍按實存期間、前一檔期利率八折計息，系統計算應收回溢付利息。</li>\n<li>單次給付利息達<b>等值新臺幣20,000元</b>須扣取補充保費。</li>\n<li>機動利率、指定到期日型態<b>不得</b>選按月付息；按月付息存單質權設定以「不含息設質」為限。</li>\n</ul>\n<h4>第八節 質權設定及質借外幣</h4>\n<ul>\n<li>質借外幣：借戶與存款人須為<b>同一戶名</b>。</li>\n<li>質借成數：幣別與存單相同者最高不逾存單面額；幣別不同者限美元、歐元、日幣、人民幣、英鎊、港幣、澳幣、紐幣，成數最高<b>九成</b>。</li>\n<li>借款到期日不得逾原存單到期日。</li>\n</ul>\n<h4>第九節 外匯綜合存款</h4>\n<ul>\n<li>一本存摺記載活存與定存，可隨時存取或原幣質借。</li>\n<li>最低金額：活存等值100美元；定存數位帳戶最低100美元、其餘1,000美元。</li>\n<li>境內外國人（含大陸人士）一律設為「<b>不可質借</b>」。</li>\n<li>活存計息：每年<b>6月20日及12月20日</b>各結息一次。</li>\n<li>可質借狀態下活存餘額不足時自定存自動質借，質借額度為定存金額<b>9成</b>，質借利息每月20日結息。</li>\n<li>透支息通知後<b>2個月</b>仍未清償，本行得將定存解約清償。</li>\n<li>郵寄結清：活存餘額併計不超過等值新臺幣<b>10萬元</b>、定存餘額須為零。</li>\n</ul>\n<h4>第十節 金如意綜合管理帳戶</h4>\n<ul>\n<li>整合新臺幣綜存、外匯綜存及信託基金為單一帳戶；對象為本國自然人或已取得居留權外國人。</li>\n<li>開戶人員資格：經辦須具信託業務人員資格及<b>3個月以上</b>外匯經歷；主管須<b>6個月以上</b>外匯經歷。</li>\n<li>受監護/受輔助宣告之人不得開立。</li>\n</ul>\n<h4>第十一節 轉籍</h4>\n<ul>\n<li>轉籍作業統一劃歸由<b>移入行</b>處理。</li>\n<li>定存有質權設定或法院扣押者不得辦理批次轉籍；轉籍明細表留存<b>15年</b>。</li>\n</ul>\n<h4>第十二節 外幣零存整付</h4>\n<ul>\n<li>每月定期存入固定外幣金額、約定到期提取本息；對象以境內有住所自然人為原則。</li>\n<li>每月最低存入<b>等值USD100元</b>或10元倍數；期間固定<b>一年期</b>；按牌告固定利率<b>複利</b>計息。</li>\n<li><b>不得</b>申請自動轉期。</li>\n<li>逾期補徵利息：逾期<b>3日內</b>免補徵；逾期4日須補徵4天利息；逾期<b>3個月(含)以上</b>以停儲論。</li>\n</ul>\n<h4>第十三節 外幣銷帳百分百代收服務</h4>\n<ul>\n<li>對象：經常性外幣應收款筆數多且分散之公司、行號或機關團體（含OBU）。</li>\n<li>手續費：代收專戶處理費每筆5~10元、每月最低200元。</li>\n<li>當月/累計警示代收比率達<b>千分之一</b>或當月遭通報警示達<b>3筆</b>須重辦盡職調查。</li>\n</ul>\n<h4>第十五節 外幣可轉讓定期存單（外幣NCD）</h4>\n<ul>\n<li>NCD按面額發行，<b>不得中途解約或變更</b>，到期本息一次給付，不得按月領息或自動續存。</li>\n<li>承作對象：本行客戶（<b>不含票券商</b>）；採<b>無實體</b>發行登錄於集保結算所。</li>\n<li>發行幣別：<b>美元及人民幣</b>；面額：美元以<b>10萬元</b>、人民幣以<b>50萬元</b>之倍數。</li>\n<li>固定利率；期限最短<b>7天</b>、最長<b>一年</b>；採款券同步交割（DVP）。</li>\n<li>利息所得稅由<b>集保結算所</b>負責扣繳；NCD<b>不納入存款保險</b>；不提供存款餘額證明。</li>\n</ul>\n<h4>第十六節 其他（利息扣繳、境外資金匯回）</h4>\n<ul>\n<li>外匯活存每年<b>6月20日及12月20日</b>結息。</li>\n<li>利息扣繳：境內居住者外匯存款利息每次應扣繳稅額不超過<b>2,000元</b>（利息所得不超過<b>新臺幣2萬元</b>）者得免扣繳。</li>\n<li><b>大陸地區人民</b>利息所得按「在臺無住所之外國人」適用扣繳率<b>20%</b>就源扣繳。</li>\n<li>外幣現鈔存入定存並於到期後提領原存入金額範圍內外幣現鈔者免收手續費，存單背面加註「現鈔存入」。</li>\n<li>境外資金匯回專戶：限開立「外匯綜合存款」專戶，質借狀態一律「不可質借」；須於稽徵機關核准文書發文之日起<b>1個月內</b>匯回；變更受理銀行以<b>1次</b>為限。</li>\n<li>境外資金控管年限：屆滿<b>5年</b>得提取1/3、屆滿<b>6年</b>再提1/3、屆滿<b>7年</b>全部提取。</li>\n<li>境外資金洗錢審查權限：＜等值USD1,000萬由外匯作業部經理核；1,000萬~5,000萬由副處長核；≧5,000萬由處長核。</li>\n</ul>"},{"id":"fx-s0p6-c1","t":"第八章 新臺幣遠期外匯業務","fc":"B","fq":"5年約17題（每年約3題）· B級","h":"<h4>第一節 概述</h4>\n<ul>\n<li><b>預售</b>遠期外匯＝出口廠商取匯前先約定結<b>售</b>外匯予銀行；<b>預購</b>＝進口廠商付匯前先約定結<b>購</b>。</li>\n<li>新臺幣遠匯<b>僅限具實際外匯收支需要者</b>承作，且須基於<b>避險目的</b>（實需原則）；同筆需要不得重複簽約。</li>\n<li>訂約及交割均應落實實需原則；注意避免遠匯與即期於同日或相鄰日間有金額相當、方向相反之情事。</li>\n<li>承作前（除專業機構投資人及高淨值投資法人外）須完成KYC並徵「新臺幣遠期外匯交易產品說明書暨風險預告書」。</li>\n<li>高淨值投資法人門檻：淨資產超過新臺幣<b>200億元</b>、有價證券及衍生性商品投資組合達新臺幣<b>10億元</b>以上、設投資專責單位。</li>\n<li>其他法人專業客戶：總資產超過新臺幣<b>1億元</b>；授權交易人員專業知識+交易經驗總分達<b>30分</b>以上（二者皆不得為0）。</li>\n<li>自然人專業投資人1：財力證明<b>3,000萬元</b>以上；專業投資人2：曾單筆投資逾<b>300萬元</b>、往來總資產逾<b>1,500萬元</b>、聲明總資產逾<b>3,000萬元</b>。</li>\n<li>法人專業客戶（高淨值、其他法人）<b>每年覆審</b>；專業機構投資人免覆審。</li>\n<li>授信戶衍生性商品期中管理工作單原則每<b>2個月</b>（奇數月月底前）辦理一次。</li>\n</ul>\n<h4>第二節 人員資格</h4>\n<ul>\n<li>交易/推介/管理人員資格四擇一：衍生性商品風管課程達<b>60小時</b>取得證書、實習<b>1年</b>、通過銷售人員資格測驗、<b>半年</b>以上實際經驗，並於銀行公會登錄。</li>\n<li>相關人員每年應參加外匯衍生性商品教育訓練達<b>12小時</b>以上，金融訓練機構課程不得低於<b>二分之一</b>。</li>\n<li>推介人員不可擔任該筆交易核章人員及該客戶最新一筆KYC評估人員。</li>\n</ul>\n<h4>第三節 KYC作業</h4>\n<ul>\n<li>專業機構投資人及高淨值投資法人<b>不適用</b>KYC；其他客戶應<b>每年</b>辦理。</li>\n<li>KYC評估結果分「保守型」「穩健型」「積極型」，<b>皆可承作遠匯</b>。</li>\n<li>資料表及授權書保存期限<b>5年</b>。</li>\n</ul>\n<h4>第四節 額度申請</h4>\n<ul>\n<li>風險額度＝承做名目本金限額×風險係數；轉換係數<b>7.5%</b>，實際暴險額最高不得超過風險額度之<b>30%</b>。</li>\n<li>利害關係人須專案向總行申請並經<b>董事會重度決議</b>通過。</li>\n<li>額度核給以不超過客戶於全體銀行已核給避險額度總額之<b>50%</b>為原則。</li>\n<li>營業單位經理權限風險額度：公司/行號/團體最高<b>美金30萬元</b>；個人無經理權限。</li>\n</ul>\n<h4>第五節 訂約手續</h4>\n<ul>\n<li>承做對象：境內與本行有進出口業務往來且最近一年無不良紀錄者，或有實際外匯收支需要且能檢具交易文件者。</li>\n<li>每筆承做金額不得超過交易文件金額範圍。</li>\n<li>保證金：依契約金額徵取<b>3%以上</b>，信用良好者經理得酌情減收或免收；限現金或本行定存單；<b>不得</b>接受以本行無擔保放款資金繳存。</li>\n<li>訂約手續費：按訂約金額<b>1/1,000</b>計收，最低新臺幣<b>400元</b>。</li>\n<li>遠匯契約期限不得逾交易文件所載收付款到期日。</li>\n<li><b>形式發票（Proforma Invoice）不得單獨</b>作為結匯證明文件，須另附發票、訂單或信用狀佐證。</li>\n<li>以交易清單方式訂約：須提供清單前<b>3大金額</b>之實際交易證明文件佐證。</li>\n<li>訂約方式：固定到期日（10、30、60、90、120、150、180天期檔期）、任選到期日、指定到期日；逾<b>180天</b>或指定到期日案件須逐筆與財務處洽商。</li>\n<li>任選到期日適用匯率：貼水時預售用後一檔期買入匯率、預購用前一檔期賣出匯率；升水時相反。</li>\n<li>每筆訂約達等值<b>100萬美元（含）以上</b>：訂約當日下午<b>6:30前</b>即時傳輸央行並確認通報成功。</li>\n<li>當日累計訂約達<b>200萬美元</b>：當日下午<b>4:30前</b>電話通報央行外匯局稽核科；累計達<b>500萬美元</b>：當日下午<b>6:30前</b>傳真實需證明文件。</li>\n</ul>\n<h4>第六節 交割、展期及違約處理</h4>\n<ul>\n<li>固定到期日交割：客戶應於交割日<b>前15日內</b>辦理；遠匯天數不足<b>30天</b>者一律於到期日當天交割；到期日遇假日順延次一營業日。</li>\n<li>到期日計算：以訂約日<b>次日起算</b>足天數；有效交割期間為到期日減15天。</li>\n<li>任選到期日：10天期以內者交割期間為訂約日後第<b>三個營業日</b>起算至到期日止。</li>\n<li>指定到期日：一律於<b>到期日當天</b>交割。</li>\n<li>交割款資金流向須與訂約文件相符（預售須來自出口/匯入，預購須供進口/匯出）。</li>\n<li>提前交割：授權經理核定；匯率差價<b>利益不退還</b>客戶，<b>損失向客戶補收</b>。</li>\n<li>未全額交割減免條件：未交割金額低於原訂約金額<b>3%（含）</b>且未逾等值<b>美金500元</b>且匯率差價損失低於新臺幣<b>500元</b>者，授權經理得減免。</li>\n<li>展期：檢附交易證明文件申請；<b>先結算差價</b>，有損失向客戶補收，有收益暫掛帳俟交割按實際交割成數交付。</li>\n<li>展期適用匯率以<b>展期時本行牌告</b>相當檔期匯率（不得依原價格展期）。</li>\n<li>展期達等值<b>100萬美元以上</b>須即時傳輸，惟<b>無須電話通報</b>。</li>\n<li>違約認定：未於交割期間或到期日辦理交割即視為違約，不得再交割。</li>\n<li>違約處理：沒收保證金抵償匯率差價損失及費用，不足另向客戶補收，剩餘不退還。</li>\n<li>匯率差價計算——預售：（註銷契約日即期賣出匯率−原訂約匯率）×結清金額；預購：（原訂約匯率−註銷契約日即期買入匯率）×結清金額。</li>\n<li>違約之匯率差價<b>不得申請減免</b>；客戶違約後應停止受理續約（經經理同意得續辦）。</li>\n</ul>"},{"id":"fx-s0p6-c2","t":"第九章 外匯業務自動化服務","fc":"C","fq":"5年約6題（每年約1題）· C級","h":"<h4>第一節 概說</h4>\n<ul>\n<li>通路：第e金網（限法人）、第e個網/第e行動/iLEO（自然人，外籍須1年以上居留證）、電話語音（本國自然人滿18歲及本國法人）、外幣ATM。</li>\n<li>營業日15:30~24:00及0:00~9:10涉新臺幣結匯交易，每人每日累計結匯不逾等值<b>新臺幣50萬元</b>。</li>\n<li>第e金網結匯逾等值<b>美金30萬元</b>須先與營業單位議定匯率取得議價編號。</li>\n<li>網銀優惠匯率：涉新臺幣結匯各幣別減/加碼（美金0.03、英鎊0.08、歐元0.05、日圓0.0006、人民幣0.01等）。</li>\n<li>外幣匯款手續費每筆<b>0.25/1000</b>（最低200、最高800），另郵電費每通300。</li>\n</ul>\n<h4>服務限額</h4>\n<ul>\n<li>臺幣換外幣（第e金網）：每筆最低等值<b>USD100</b>，每日最高合計不逾等值<b>99萬美元</b>。</li>\n<li>臺幣換外幣（個網/行動/iLEO）：每筆最低NTD500，每日最高合計<b>NTD50萬（不含）</b>。</li>\n<li>外幣換外幣（個網等）：每日每帳戶最高等值<b>USD15萬（不含）</b>。</li>\n<li>現鈔申購：每筆最高等值NTD50萬（不含）。</li>\n<li>外幣匯出款（個網等）：原幣扣款每筆最高<b>USD10萬</b>、每日每帳戶最高<b>USD15萬（不含）</b>。</li>\n<li>活存轉定存：每筆最低等值<b>USD1,000</b>（數位帳戶USD100）。</li>\n</ul>\n<h4>第二節 第e金網外匯業務</h4>\n<ul>\n<li>OBU戶申辦須徵董事名冊、股東名冊、存續證明（<b>6個月內</b>簽發）、公司章程、董事會決議錄等。</li>\n<li>每日累計轉出限額逾等值<b>新臺幣5,000萬元</b>須填自評表送督導主管與經理核閱。</li>\n<li>涉新臺幣結匯每筆最高未逾等值<b>99萬美元</b>；同一申請人同一受款帳號當日累積結匯不逾99萬美元。</li>\n<li>大陸地區匯款：每筆及每日累計一律不逾等值<b>99萬美元</b>。</li>\n<li>匯率議價編號僅適用<b>當日交割</b>案件，預約案件不得議價。</li>\n<li>網銀辦理新臺幣結匯申報：系統自動連結當年累積結匯金額查詢並登載申報書。</li>\n<li>外幣匯入匯款線上解款：結售新臺幣每筆及每日累計最高不逾等值99萬美元。</li>\n<li>定存中途解約：透支息超過解約後所餘定存<b>10%</b>者不受理線上解約。</li>\n<li>第e金網外匯交易<b>以即期結匯案件為限，遠匯需臨櫃辦理</b>。</li>\n<li>匯款高風險案件營業單位須於<b>3個營業日內</b>完成審查放行。</li>\n</ul>\n<h4>第三~四節 外幣ATM</h4>\n<ul>\n<li>提領幣別面額：美金100元、港幣1,000元、日圓10,000元、人民幣100元。</li>\n<li>提領限額——本行存戶：每次最高等值<b>新臺幣3萬元</b>、最多<b>50張</b>，每日每帳戶累計達等值<b>新臺幣10萬元</b>須俟次日。</li>\n<li>他行存戶：每次最高等值<b>新臺幣2萬元</b>。</li>\n<li>客戶按鍵確認幣別、金額、結匯性質即視同同意由本行代向央行申報。</li>\n<li>裝卸鈔：行內每<b>7天</b>、行外每<b>15天</b>至少裝卸清點一次。</li>\n<li>錄影影像保存期限<b>6個月</b>；新設或遷移須至少於服務前<b>7個營業日</b>通知轄區警察機關。</li>\n<li>剩餘現金：未於<b>20日</b>內查明更正，於第21日登錄通報系統；達等值新臺幣<b>10萬（含）以上</b>須發現當日完成登錄。</li>\n</ul>"},{"id":"fx-s0p7-c1","t":"第十章 代受理國際金融業務分行（OBU）客戶外匯業務","fc":"B","fq":"5年約12題（每年約2題）· B級","h":"<h4>第三節 代受理匯出入匯款及代收外幣票據</h4>\n<ul>\n<li>大額匯款指匯至國外或國內他行每筆達等值<b>30萬美元（含）</b>以上；一般案件應於<b>PM3:30前</b>通報財務處。</li>\n<li>匯款金額大於<b>300萬美元</b>於知悉時應<b>立即通報</b>。</li>\n<li>電匯<b>視為當日付款</b>。</li>\n<li>費用：手續費每筆<b>USD10</b>、郵電費每通<b>USD15</b>。</li>\n<li>匯入匯款：匯款人資訊須至少含<b>姓名、帳號、住址</b>，受款人須含姓名及帳號。</li>\n<li><b>禁止國內自然人透過設立境外公司轉換居住者身份</b>於OBU開戶並由國內DBU轉存資金投資；開戶目的為投資理財應徵「資金來源聲明書」。</li>\n<li>代收外幣票據：僅限外幣票據；國外票據<b>先入帳再提出交換/代收</b>，仍有退票可能；手續費每筆USD10。</li>\n</ul>\n<h4>第四節 代受理OBU境外客戶外匯存款</h4>\n<ul>\n<li>存戶對象：境外個人（持外國護照且境內無住所）、境外法人；<b>香港獨資及合夥事業不具法人資格，不得開立法人戶</b>。</li>\n<li>定存期限：未滿一個月分7、14、21天；一個月以上分1、3、6、9個月及一年；指定到期日最短8天。</li>\n<li>確認書僅具收據性質、<b>非有價證券</b>。</li>\n<li>最低存款：活期無最低；定期每筆最低<b>等值1,000美元</b>。</li>\n<li>存款來源<b>不得以新臺幣結購及外幣現鈔存入</b>；提領<b>不得結售為新臺幣、提領外幣現鈔及旅行支票</b>。</li>\n<li>法人開戶文件：註冊證書、董事名冊、股東名冊、章程、董事職權證明書（Certificate of Incumbency，註冊代理人<b>六個月內</b>簽發）、存續證明（Certificate of Good Standing）等。</li>\n<li>實質受益人辨識：直接/間接持股<b>超過25%</b>之最終自然人；無則類別2；均無則填高階管理人員。</li>\n<li>無記名股票：章程已明訂且<b>已發行</b>者<b>應婉拒開戶</b>。</li>\n<li>身分驗證時限：<b>30個工作天</b>內完成；逾30天暫時中止；逾<b>120天</b>終止業務關係。</li>\n<li>高風險客戶開戶須經<b>資深副理或經理</b>核准。</li>\n<li>定期審查：高/中/低風險每<b>1年/3年/5年</b>。</li>\n<li>婉拒開戶情形：匿名/人頭、偽變造證件、證件均為影本、國籍<b>北韓、伊朗</b>、提供虛擬資產服務者、與3個以上警示帳戶重複等。</li>\n<li>帳號存款種類代號：外匯活期<b>86</b>、外匯定期<b>85</b>。</li>\n<li>幣別轉換承作金額<b>低於等值美元30萬元（含）</b>且匯率在成本價以內，經理得逕行議定匯率。</li>\n<li>定存質借外幣：同幣別最高不逾存單面額；不同幣別成數最高<b>九成</b>。</li>\n<li>年度定期審查文件：高風險客戶存續證明<b>六個月內</b>簽發；中低風險<b>一年內</b>簽發。</li>\n<li>郵寄結清銷戶：活期餘額併計不超過等值新臺幣<b>10萬元</b>、定期餘額須為零。</li>\n<li>存款餘額證明手續費：第1份<b>USD3</b>，每加1份<b>USD2</b>。</li>\n</ul>\n<h4>第五節 代受理OBU外幣支票存款</h4>\n<ul>\n<li>存戶對象：境外<b>法人、政府機構或境內外金融機構</b>（<b>不含個人</b>）。</li>\n<li>存款<b>不計息</b>；最低起存<b>等值美金1,000元</b>。</li>\n<li>支票須載「CHECK」字樣、<b>劃平行線、記載受款人、禁止背書轉讓及委任取款</b>。</li>\n<li>票據清算採託收，收到後應於<b>三個營業日內</b>收妥付款或退票。</li>\n<li>票信查詢日距開戶日<b>超過30日</b>應重新查詢；經拒絕往來未解除者不得開戶。</li>\n<li>審查發票日須在<b>一年以內</b>；支票限見票即付。</li>\n<li>拒絕往來：一年內存款不足退票未清償達<b>三張</b>、簽章不符達三張、票據犯罪判刑確定；拒往期間自通報日起算<b>三年</b>。</li>\n<li>久未往來戶：自上次交易日起算<b>三年間</b>無存提往來。</li>\n<li>掛失止付：止付通知後<b>五日內</b>須提出公示催告證明，否則失效。</li>\n</ul>\n<h4>第六節 代受理OBU外幣可轉讓定期存單（NCD）</h4>\n<ul>\n<li>不得中途解約或變更；到期本息一次給付；採<b>無實體</b>發行登錄集保。</li>\n<li>發行幣別<b>美元及人民幣</b>；面額美元<b>10萬元</b>、人民幣<b>50萬元</b>倍數。</li>\n<li>固定利率；期限最短<b>7天</b>、最長<b>一年</b>；DVP款券同步交割。</li>\n<li>帳簿維持費年利率<b>萬分之0.9</b>；<b>不納入存款保險</b>；不提供存款餘額證明。</li>\n</ul>\n<h4>第七節 境內法人於OBU開立授信目的帳戶</h4>\n<ul>\n<li>受理對象：與本行有OBU授信業務往來之境內法人；<b>首筆資金應為授信撥入</b>。</li>\n<li>帳戶業務別86；多幣別、<b>不掣發存摺</b>；同一客戶同一分行<b>僅得開立一戶</b>。</li>\n<li>資金往來限外幣與外幣間、<b>不得兌換為新臺幣</b>；帳戶<b>不屬存款、不得發利息</b>。</li>\n<li>資金收付以避險為目的之遠期外匯及換匯交易，<b>操作天期不得超過180天</b>。</li>\n<li>存入款項達<b>等值美元10萬元</b>須主管授權。</li>\n<li>結清：帳戶資金停泊時間最長為授信額度有效期限或最後一筆貸放到期日（較晚者）<b>加計180天</b>；不得轉籍、不得郵寄結清。</li>\n</ul>"},{"id":"fx-s0p8-c1","t":"第十一章 各項外匯業務收費標準及授權措施","fc":"C","fq":"5年約5題（每年約1題）· C級","h":"<h4>概說與外匯部位</h4>\n<ul>\n<li>四項授權措施：<b>匯率議價、手續費及利息、代受理OBU境外客戶收費、外匯定期存款利率議價</b>。</li>\n<li>「外匯部位」即外幣帳「兌換」科目餘額：借方餘額為<b>賣超</b>部位，貸方餘額為<b>買超</b>部位。</li>\n<li>每筆買賣匯金額逾<b>500千美元</b>（其他幣別逾等值<b>300千美元</b>）者，應即電告財務處以利拋補。</li>\n<li>應本「不濫減免，能收則收」態度；每月10日前列印「外匯業務費用減免統計總表」陳閱經理。</li>\n</ul>\n<h4>授權額度（議價與減免）</h4>\n<ul>\n<li>外匯匯率議價優惠金額：總經理/副總超過<b>7萬</b>、處長<b>7萬</b>、經理<b>6萬</b>（以每筆等值100萬美元為基準）。</li>\n<li>外匯存款利率議價：總/副總超過牌告加<b>4碼</b>、處長4碼、經理牌告加<b>3碼</b>。</li>\n<li>各項外匯授信利息減免（個案）：總/副總超過<b>20萬</b>、處長<b>10萬</b>、經理<b>5萬</b>。</li>\n<li>出口押匯等各項手續費減免：總/副總超過20萬、處長10萬、經理5萬。</li>\n<li>出口信用狀通知手續費：經理層級即可<b>免收</b>；匯兌案件手續費處長免收、經理減收；郵電費處長免收。</li>\n</ul>\n<h4>授信案件承做授權額度（美元/每筆）</h4>\n<ul>\n<li>符合信用狀條款出口單據押匯：經理<b>50萬</b>；未符合條款者<b>30萬</b>。</li>\n<li>出口遠期匯票貼現（開狀行為通匯行或世界500大）：符合30萬、未符合15萬；非前述銀行：符合20萬、未符合10萬。</li>\n<li>國內外信用狀轉開發：<b>50萬</b>；進口信用狀開發：<b>50萬</b>。</li>\n<li>進口託收副提單背書、擔保提貨：均<b>15萬</b>；外幣保證函簽發：<b>30萬</b>。</li>\n<li>新臺幣遠期外匯風險額度：總/副總超過<b>300萬</b>、處長<b>150萬</b>（每戶）。</li>\n<li>世界銀行排名以「銀行家」（THE BANKER）雜誌按<b>第一類資本總額</b>排名為準。</li>\n</ul>\n<h4>出口業務收費（國內分行標準）</h4>\n<ul>\n<li>出口押匯手續費<b>1/1,000</b>，最低<b>NT$500</b>；轉押匯<b>2/1,000</b>，最低<b>NT$1,000</b>。</li>\n<li>押匯利息計息期間：港幣/星幣/日圓<b>7天</b>，其他地區<b>12天</b>。</li>\n<li>轉押匯利息：港/星/日<b>14天</b>，其他<b>24天</b>；瑕疵利息<b>7天</b>。</li>\n<li>先行墊款利息：一般外匯授信利率加年率<b>2.50%</b>；逾期入帳利息給予<b>8天寬限期</b>（曾接獲瑕疵/拒付通知者不給）。</li>\n<li>國外費用：信用狀未規定者每筆計收劃帳費<b>US$50</b>；郵費台灣地區每件NT$250。</li>\n<li>出口託收手續費<b>0.5/1,000</b>，最低<b>NT$500</b>。</li>\n<li>轉開國內信用狀<b>1.25/1,000（每期）</b>，最低NT$800。</li>\n<li>出口信用狀通知：電報<b>NT$400</b>、郵寄<b>NT$200</b>、修改NT$200；非本行客戶加倍。</li>\n<li>分割轉讓：不換單每筆NT$800；換單<b>2/1,000</b>（最低NT$1,200）。</li>\n<li>出口信用狀保兌：<b>2.5/1,000</b>（最低US$100）。</li>\n</ul>\n<h4>進口業務收費</h4>\n<ul>\n<li>進口開狀（即期）：第一期<b>2.5/1,000</b>、第二期以後<b>1.25/1,000</b>，最低NT$500（每三個月一期）。</li>\n<li>遠期（Buyer's Usance）第一期按匯票期間：90天內2.5/1,000、91-120天3/1,000、121-150天3.5/1,000、151-180天4/1,000。</li>\n<li>遠期（Shipper's Usance）第一期一律<b>4/1,000</b>。</li>\n<li>保兌費第一期2.5/1,000（最低NT$1,000）；買方負擔國外費用每筆預收<b>NT$1,200</b>。</li>\n<li>修改信用狀內容每筆<b>NT$500</b>；展延有效期限<b>1.25/1,000</b>。</li>\n<li>進口託收：D/P <b>1.5/1,000</b>、D/A <b>2/1,000</b>，最低<b>NT$200</b>；郵電費每筆NT$440。</li>\n<li>即期信用狀墊款息：辦副提單背書/擔保提貨計<b>7天</b>；逾期息自單據到達後<b>第16天</b>起，授信利率加年率<b>2.50%</b>。</li>\n<li>遠期信用狀逾期息：逾6個月內加收<b>一成</b>違約金，逾6個月加收<b>二成</b>。</li>\n<li>預售/購遠期外匯手續費<b>1/1,000</b>，最低NT$400。</li>\n</ul>\n<h4>匯兌業務收費</h4>\n<ul>\n<li>匯出匯款手續費<b>0.5/1,000</b>，最低NT$200、最高<b>NT$800</b>；電匯郵電費每通<b>NT$300</b>、票匯每筆NT$200。</li>\n<li>匯入匯款解款手續費0.5/1,000，最低200、最高800。</li>\n<li>現鈔相關：結購外幣現鈔<b>免收</b>手續費；提領現鈔按匯差計收（最低100~200，無上限）；收兌舊版鈔券按<b>5%</b>計鈔券處理費。</li>\n<li>買入外幣票據0.5/1,000（最低200最高800）；每批逾2張每超1張加收<b>NT$100</b>。</li>\n<li>外幣票據託收0.5/1,000，郵費<b>NT$800</b>。</li>\n<li>收兌旅行支票0.5/1,000（限美國運通美元旅支）。</li>\n<li>開發外幣保證及擔保信用狀：<b>2.5/1,000（每期）</b>，最低等值NT$1,000。</li>\n<li>持低收入戶/中低收入戶證明<b>免收手續費</b>（僅收郵電費）。</li>\n</ul>\n<h4>代受理OBU境外客戶收費</h4>\n<ul>\n<li>信用狀押匯：一般<b>1/1,000</b>（最低US$40）、轉押匯2/1,000（最低US$75）。</li>\n<li>匯出匯款0.5/1,000，最低<b>US$10</b>、最高<b>US$40</b>；境外公司匯往國內母公司<b>免手續費及郵電費</b>（母公司限一家）。</li>\n<li>匯入匯款手續費<b>US$10</b>（本行DBU匯入免收）。</li>\n<li>進口開狀即期第一期2.5/1,000（最低US$35）；進口託收D/P 1.5/1,000、D/A 2/1,000（最低US$15）。</li>\n<li>OBU外幣支存：票信查詢第一類US$4、掛失止付每張US$5、退票手續費US$20。</li>\n</ul>\n<h4>授權措施 — 匯率議價</h4>\n<ul>\n<li>美元即期案件<b>500千美元</b>以下、人民幣300千美元以下：得於成本範圍內承做；逾500千美元按大額牌告或與財務處議價。</li>\n<li>其他幣別：等值<b>100千美元</b>以下成本範圍內承做；100~300千美元按授權優惠匯率。</li>\n<li>新臺幣遠期外匯<b>500千美元</b>（美元）以下按授權優惠匯率承做。</li>\n</ul>\n<h4>授權措施 — 手續費利息（經理核定最低標準）</h4>\n<ul>\n<li>進口開狀：首期<b>0.1%</b>、以後每期<b>0.05%</b>，最低NTD500；進口託收0.1%最低NTD200。</li>\n<li>進口墊款息利率：一般外匯授信利率<b>減1.25%</b>。</li>\n<li>出口押匯手續費最低<b>0.05%</b>（最低NTD400）；轉押匯0.1%（最低NTD800）。</li>\n<li>押匯息利率：出口押匯利率<b>減1.25%</b>。</li>\n<li>匯出/匯入匯款：<b>0.25/1,000</b>，最低NTD200、最高NTD800；前期外匯活存平均餘額達等值<b>USD200千元</b>得免收。</li>\n<li>外匯綜合存款質借外幣利率得以原存單利率<b>加年息1%</b>（利害關係人不適用）。</li>\n<li>績優客戶（進出口實績近1年達USD300萬元、或外匯活存近6個月平均達USD70萬元）承做應收利息得於一般授信利率<b>減8碼（年息2%）</b>範圍內計收。</li>\n</ul>\n<h4>行員外幣結匯優惠</h4>\n<ul>\n<li>對象：臨櫃限本行行員、退休行員及行眷（配偶/父母/子女）。</li>\n<li>結購外匯等值<b>10萬美元</b>內依即期（現鈔）牌告買賣<b>中價</b>匯率；逾10萬美元依即期賣出成本匯率。</li>\n<li>結售依即期（現鈔）買入成本匯率；存入外存匯差以<b>5折</b>計收。</li>\n<li>優惠限本人適用，代他人結匯者本行有權追回差額。</li>\n</ul>"}]},{"t":"衍商篇（20260612 版，共 10 章）","chs":[{"id":"fx-s1p0-c1","t":"衍商篇 第一章 客戶間衍生性金融商品業務通則","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>第一節 適用範圍</h4>\n<ul>\n<li>依金管會「銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法」、銀行公會自律規範、央行「銀行業辦理外匯業務管理辦法」辦理。</li>\n<li>適用於國內營業單位及OBU，<b>不含新臺幣遠期外匯</b>（業管單位為外匯營運處）。</li>\n<li>衍生性金融商品定義：價值由利率、匯率、股權、指數、商品、信用事件或其他利益及組合所衍生之交易契約及結構型商品；<b>不含</b>資產證券化商品、結構型債券、可轉換公司債等有價證券及境外結構型商品。</li>\n<li>「投資組合商品」（結構型商品）＝結合固定收益商品（臺/外幣定存）與衍生性金融商品之商品。</li>\n<li>四大種類：<b>遠期契約</b>（遠期利率協議FRA等）、<b>選擇權契約</b>、<b>交換契約</b>（CCS、IRS、商品/股價/信用交換）、其他經核准商品及再組合契約。</li>\n</ul>\n<h4>第二節 權責劃分</h4>\n<ul>\n<li>營業單位：客戶開發、額度申請、推介、簽約開戶、擔保品徵取。</li>\n<li>授信審核處及區域中心：額度審核；風險管理處：額度建檔、監控、部位評價、補徵擔保品通知。</li>\n<li>金融規劃部：契約審閱及<b>ISDA主約保管</b>；金融行銷部：商品設計、KYC評估、受理下單、背對背拋補。</li>\n<li>金融作業部：交易確認、製發確認書、交割帳務。</li>\n</ul>\n<h4>第三節 相關人員</h4>\n<ul>\n<li>業務人員條件三擇一：受訓達<b>60小時</b>取得證書、交易室實習<b>1年</b>、他行<b>半年</b>以上實務經驗。</li>\n<li>推介人員：具業務人員資格或通過結構型/衍生性商品銷售人員資格測驗；派任前須向公會登錄。</li>\n<li>推介人員不得為最近一次客戶衍生性KYC評估人員；兼任作業人員時不得為該筆交易核章人員。</li>\n<li>契約核簽人員改任推介人員時，推介交易日與契約簽訂日間距<b>不得少於1個月</b>。</li>\n<li>相關人員每年衍生性教育訓練達<b>12小時</b>以上，金融訓練機構課程不得低於<b>二分之一</b>。</li>\n<li>交易員嚴禁在本行或他行開設衍生性帳戶、代客操作、保證獲利、同時反向對做。</li>\n</ul>"},{"id":"fx-s1p0-c2","t":"衍商篇 第二章 區分「專業客戶」及「一般客戶」","fc":"C","fq":"5年約4題（每年約<1題）· C級","h":"<h4>第一節 通則</h4>\n<ul>\n<li>受理交易前須區分「專業客戶」及「一般客戶」，並完成KYC後推介適合商品。</li>\n<li>自然人專業客戶依財力分「專業投資人1」（財力證明<b>3,000萬</b>）與「專業投資人2」；專業投資人2每筆交易金額應逾等值新臺幣<b>300萬元(DBU)/美金10萬元(OBU)</b>。</li>\n<li>法人專業客戶三類：<b>專業機構投資人</b>（銀行、保險、證券商、政府基金等，<b>免辦覆審</b>）、<b>高淨值投資法人</b>、<b>其他法人專業客戶</b>（後兩者<b>每年至少覆審一次</b>）。</li>\n<li><b>高淨值投資法人</b>條件：最近一期財報<b>淨資產超過新臺幣200億元</b>，且有價證券部位＋衍生性投資組合達新臺幣<b>10億元</b>以上；設投資專責單位且主管具資格；具內控制度。</li>\n<li>專責單位主管資格三擇一：金融投資工作經驗<b>3年</b>以上、金融商品投資工作經驗<b>4年</b>以上、曾任財務部門主管<b>半年</b>以上。</li>\n<li><b>其他法人專業客戶</b>條件：<b>總資產超過新臺幣1億元</b>並提供財報，且授權交易人員專業知識＋交易經驗總分達<b>30分</b>以上（二者皆不得為0分）。</li>\n<li>專業知識計分：證照20分、金融學歷20分、金融職務1年以上10分、本行測驗（答對8~10題15分、6~7題10分、5題以下0分）。</li>\n<li>交易經驗計分：須承作過至少<b>3筆</b>且資歷達1年以上；期貨/選擇權20分、結構型商品10分、遠匯/換匯/NDF 15分。</li>\n<li>「一般客戶」＝非屬專業客戶之其他客戶。</li>\n</ul>\n<h4>第二~四節 申請、覆審與變更</h4>\n<ul>\n<li>OBU由母公司保證者：保證或擔保品金額<b>不得低於</b>「衍生性金融商品額度＋曝險額度」。</li>\n<li>系統建檔應於取得申請文件<b>2週內</b>完成。</li>\n<li>測驗再確認：金融行銷部以電話抽問原題目<b>2題</b>確認。</li>\n<li>覆審頻率：申請完成後<b>每年</b>辦理；逾期未覆審客戶須先完成覆審或變更為一般客戶後始得交易。</li>\n<li>客戶不符資格或不願提供財報時，本行得逕行變更為一般客戶並掣發通知書。</li>\n</ul>\n<h4>第五節 自然人高資產專業客戶</h4>\n<ul>\n<li>資格效期自申請完成日起<b>1年</b>，每年覆審。</li>\n</ul>"},{"id":"fx-s1p0-c3","t":"衍商篇 第三章 客戶投資風險屬性評估（KYC）與商品適合度","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>第一節 KYC</h4>\n<ul>\n<li>免辦KYC對象：<b>專業機構投資人</b>、及申請/覆審未逾1年之<b>高淨值投資法人</b>。</li>\n<li>KYC類別：申請額度之法人【A】、不申請額度之法人【B】、自然人【C】。</li>\n<li>最新一筆KYC評估人員不得為承作交易之推介或業務人員。</li>\n<li>辦理時點【A】：每次額度申請前完成；KYC評估日與額度申請日逾<b>2個月</b>須重辦。</li>\n<li>有效期限：【A】同額度到期日；【B】【C】為評估日<b>＋1年</b>。</li>\n<li><b>65歲</b>以上高齡客戶若符合關懷提問表<b>2項以上</b>弱點指標，應婉拒辦理KYC。</li>\n<li>已辦或婉拒KYC者，須待<b>7個曆日</b>後才可重辦；前次評估在<b>30個曆日</b>內不得以數位通路重辦。</li>\n<li>未成年：<b>7歲以上未滿18歲</b>限制行為能力人得由法定代理人協助；無行為能力人及受輔助宣告者應婉拒。</li>\n<li>數位通路條件：年滿<b>18歲未滿85歲</b>本國成年人。</li>\n<li>風險屬性三級：<b>積極型65分以上、穩健型40分以上未滿65分、保守型未滿40分</b>。</li>\n<li>保護規則：無投資經驗之法人不得評為積極型；無投資經驗之自然人評為保守型；高齡及國中以下學歷者調降分數；持重大傷病證明者不得評為積極型。</li>\n</ul>\n<h4>第二節 商品適合度</h4>\n<ul>\n<li>匯率類風險等級：換匯1年以下<b>等級1</b>、1年以上等級2；NDF/外幣間遠匯1年以下<b>等級3</b>、1年以上等級4；買入選擇權1年以下等級1；賣出選擇權3~4；複雜性高風險商品<b>等級5</b>。</li>\n<li>利率類：買入選擇權或交換2年以下等級1、以上2；賣出選擇權3~4；複雜性高風險等級5。</li>\n<li>商品類/股權類：買入選擇權6個月以下等級2、以上3；賣出選擇權或交換4~5。</li>\n<li>投資組合商品風險三級：<b>中度RR3、中高RR4、高度RR5</b>。</li>\n<li>投資組合商品評分因子：連結標的（利率1分…信用事件5分）、保本率（100%為0分、90~100%為1分、60~90%為2分、低於60%為3分）、中途解約風險、標的流動性、結構複雜度、商品年期、幣別。</li>\n<li>風險總分分級：<b>15分以下＝RR3、15(不含)~19分＝RR4、超過19分＝RR5</b>。</li>\n<li>商品適合度對應：<b>保守型無適合投資組合商品；穩健型可承作RR1~3；積極型可承作RR1~5</b>。</li>\n</ul>"},{"id":"fx-s1p0-c4","t":"衍商篇 第四章 簽約開戶作業","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<ul>\n<li>除專業機構投資人外，客戶須於本行有授信往來或已開立存款帳戶方得辦理簽約開戶。</li>\n<li>簽約類型：「<b>金融交易總約定書</b>」＝可承作全部衍生性商品；「<b>投資組合商品契約書</b>」＝僅可承作投資組合商品；法人另可簽<b>ISDA</b>。</li>\n<li>個人戶除承作買入選擇權（須簽總約定書）外一律簽投資組合商品契約書。</li>\n<li>法人必徵：風險預告書（專業機構投資人及高淨值投資法人免）、進/扣帳授權書、承作衍生性金融商品授權書、人民幣風險預告書、遠期外匯及換匯產品說明書、董事/股東會決議錄。</li>\n<li>決議錄免徵：專業機構投資人、獨資合夥、一人股東有限公司、章程僅置董事一人。</li>\n<li>公開發行公司未屆董事會會期得徵承諾書，會後<b>10日內</b>交付決議錄，<b>首次簽約不適用</b>。</li>\n<li>自然人<b>不得授權他人</b>代為承作交易。</li>\n<li>65歲以上高齡、國中以下學歷、視障、不識字、重大傷病客戶，須專人解說契約重要內容。</li>\n<li><b>7歲以上未滿18歲</b>須本人親簽並法定代理人簽名；未滿7歲不得受理簽約。</li>\n<li>ISDA由金融規劃部審閱後呈副總經理代表本行簽署。</li>\n<li>投資組合商品須開綜合存款帳戶或金如意帳戶；數位帳戶不適用。</li>\n<li>自行保管文件正本<b>永久保存</b>。</li>\n</ul>"},{"id":"fx-s1p0-c5","t":"衍商篇 第五章 額度申請與管理","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>第一節 概述</h4>\n<ul>\n<li>免申請交易額度者：新臺幣遠匯、外匯保證金、連結存款之投資組合商品、<b>買入選擇權</b>。</li>\n<li>可操作名目本金＝核准額度／金融商品交易風險係數。</li>\n<li>「實際曝險額」＝依市價評估本行承擔之未到期交易信用曝險；實際曝險額逾曝險額度加計已徵擔保品時，原則暫停動用並補徵擔保品。</li>\n<li>不得勸誘客戶以融資取得資金承作（專業機構投資人及高淨值投資法人除外）。</li>\n</ul>\n<h4>第二節 額度申請</h4>\n<ul>\n<li>分「<b>避險性</b>」與「<b>非避險性</b>」額度。</li>\n<li>避險性額度：限自身及所屬集團營運避險需求；每次交易須徵實質交易文件（外幣間遠匯換匯、CCS、IRS除外）。</li>\n<li>非避險性額度計算＝MAX(淨值基礎,0)＋第三人合格擔保品＋集團其他擔保品＋集團淨值範圍內保證。</li>\n<li>合格擔保品折扣率：存款<b>0%</b>、G7及本國央行公債（1年內0.5%~10年以上5%）、本國上市股票<b>20%</b>、上櫃股票<b>30%</b>、非美元外幣擔保品3%。</li>\n<li>專業機構投資人及高淨值投資法人免計算得申請額度、免徵避險實質交易文件。</li>\n<li>曝險額度占衍生性商品額度最高成數（依信用風險等級）：1~2等（非避險6成/避險8成）、3~4等（5成/7成）、5~9等（4成/6成）、10~12等（3成/5成）。</li>\n<li>非避險額度之曝險額度達<b>100萬美元</b>以上時，財報須經會計師查核或核閱。</li>\n<li>申請「高風險衍生性金融商品交易額度」須取得客戶最近<b>6個月</b>內可驗證往來資力佐證。</li>\n<li>額度核定層級：總經理<b>3,000仟美元</b>以下、主管風控副總2,000仟以下、授信審核處處長1,000仟以下、副處長750仟以下、區域中心資深協理兼主任500仟以下。</li>\n<li>本票：原則依「衍生性金融商品額度＋曝險額度」徵取「<b>美元</b>」備付本票。</li>\n<li>高淨值投資法人：免填評估表、原則免徵期初保證金。</li>\n</ul>\n<h4>第三節 額度核准通知、建檔與管理</h4>\n<ul>\n<li>額度建檔須俟契約文件簽妥且符合核准條件後辦理。</li>\n<li>未載明個別限額者：外幣間遠匯換匯占<b>3成</b>、其他衍生性商品占<b>7成</b>建檔。</li>\n<li>額度移用原則：「其他衍生性商品額度」可移給遠匯換匯及限換匯額度；「外幣間遠匯與換匯共用額度」可移給限換匯額度但不得移回；「限換匯交易額度」<b>不得移用</b>。</li>\n<li>本票免重徵三條件（須同時符合）：發票日至本次額度生效日未逾<b>3年</b>、無到期日、額度金額未增加。</li>\n</ul>"},{"id":"fx-s1p1-c1","t":"衍商篇 第六章 額度類衍生性金融商品及買入選擇權","fc":"C","fq":"5年約3題（每年約<1題）· C級","h":"<h4>遠期外匯/換匯</h4>\n<ul>\n<li>遠期交易分「預購」「預售」與「外幣遠匯」；交割方式分<b>全額交割</b>與<b>差額交割</b>，另有展期。</li>\n<li>OBU本位幣為<b>美元</b>。</li>\n</ul>\n<h4>匯率選擇權</h4>\n<ul>\n<li>定義：買方支付權利金取得未來以約定履約價買/賣外幣之權利；<b>買方最大損失為權利金，賣方最大損失恐無限大</b>。</li>\n<li>用語：權利金Premium、履約價Strike、決價日Fixing、到期日Expiry；<b>歐式</b>（僅到期日行使）、<b>美式</b>（存續期間均可）。</li>\n<li><b>價內ITM</b>（可獲利）、<b>價平ATM</b>（損益兩平）、<b>價外OTM</b>（不執行）。</li>\n<li>受理單位限金融市場業務處；每筆最低交易金額<b>等值USD10萬元</b>。</li>\n<li>本行承作<b>以歐式為主</b>。</li>\n<li>額度使用：客戶<b>買入選擇權不占用額度；賣出選擇權占用</b>；賣出為結清原買入部位者不占用。</li>\n<li>交易對象：國內外法人、非法人及<b>未滿65歲之自然人</b>；新臺幣匯率選擇權限境內DBU國內外法人；<b>自然人限承作買入</b>選擇權。</li>\n<li>權利金收付日原則為<b>T+2日</b>，原則以美元計價。</li>\n<li>每筆交易訂約期間<b>最短不得小於5日</b>（買回原交易或ATM/OTM除外）。</li>\n<li>Delta Ratio：客戶承作<b>≧80%</b>或壽險公司承作<b>≦20%</b>者須陳核至金市處處長。</li>\n<li>賣出選擇權客戶於通知後<b>三個營業日內</b>未補足擔保品或結清，經本行停損結清。</li>\n</ul>\n<h4>無本金交割遠期外匯（NDF）</h4>\n<ul>\n<li>到期不交割本金，僅結算議定匯率與清算匯率之差額。</li>\n<li><b>涉及新臺幣之交易不得辦理</b>。</li>\n<li>每筆最低交易金額<b>等值USD50萬元</b>為原則。</li>\n<li>交易對象限國內外法人、非法人（<b>不含自然人</b>）。</li>\n<li>合約期限最長<b>1年(含)</b>為原則，<b>到期不得展期</b>。</li>\n<li>到期結清以到期日前<b>2個營業日</b>外幣間匯率決價、現金差價交割。</li>\n</ul>\n<h4>利率交換（IRS）暨換匯換利（CCS）</h4>\n<ul>\n<li><b>IRS</b>：利息交換，<b>不交換名目本金</b>；<b>CCS</b>：交換兩種不同幣別本金及利息，<b>涉新臺幣者僅得期初期末本金皆交換</b>。</li>\n<li>起息日通常T+2；利率重設日為計息週期前二營業日；計息基礎Actual/360或Actual/365。</li>\n<li>每筆最低交易名目本金<b>等值USD100萬元或新臺幣1億元</b>。</li>\n<li>交易對象限國內外法人、非法人。</li>\n<li>交易期限以不超過客戶避險需求或<b>10年(含)</b>為原則；利息採<b>淨額交割</b>。</li>\n</ul>\n<h4>利率選擇權</h4>\n<ul>\n<li>型態：利率上限（<b>Cap</b>）、利率下限（<b>Floor</b>）。</li>\n<li>最低名目本金等值USD100萬元或新臺幣1億元；以歐式為主；訂約期間最短5日。</li>\n<li>交易對象：國內外法人、非法人及未滿65歲自然人（<b>限專業投資人</b>）；自然人限承作買入。</li>\n</ul>\n<h4>商品選擇權/商品交換</h4>\n<ul>\n<li>標的為商品（黃金、原油、金屬、農產品等）；差價現金交割。</li>\n<li>只能承作<b>背對背（Back to Back）</b>交易，條件須與上手銀行完全相同。</li>\n<li>商品選擇權訂約最短5日、最長<b>一年</b>；權利金收付日原則<b>T+5日</b>、以美元計價；交易對象限法人（不含自然人）。</li>\n<li>商品交換以<b>新臺幣以外幣別收付為限</b>。</li>\n</ul>"},{"id":"fx-s1p1-c2","t":"衍商篇 第七章 交易流程","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<h4>第一節 訂約及交易</h4>\n<ul>\n<li>交易時間：週一至週五上午<b>9時至下午3時30分</b>。</li>\n<li>訂約前確認：交易額度、承作商品種類與批覆書相符；文件不齊/額度不足/保證金未足/曝險逾額應暫停交易（專業機構投資人免適用）。</li>\n<li>確認交易目的（專業機構及高淨值投資法人不適用）：避險者須提供訂單/合約/發票等實質交易文件（外幣間遠換匯、CCS、IRS除外）；非避險且承作複雜性高風險商品須設<b>最大損失上限</b>；買入選擇權免確認交易目的。</li>\n<li>確認商品適合度：客戶風險屬性須與商品風險類型相符（避險目的不適用）。</li>\n<li>承作複雜性高風險商品應提供風險較低商品供選擇，並留書面或錄音。</li>\n<li>全體銀行交易情形檢核：避險交易「客戶與全體銀行避險部位」≤「自身及集團避險需求」；非避險「全體已動用非避險額度+本次動支」≤淨值。</li>\n<li>產品說明書及風險預告書：外幣間遠換匯簽署<b>一次性</b>；其他商品逐筆掣發；法人專業客戶免交付。</li>\n<li>複雜性高風險商品產品說明書應揭露銷售利潤率上限、<b>客戶最大損失金額</b>及提前終止計算方式，並請客戶於最大損失處簽章。</li>\n<li>電話交易：法人須確認為有權交易人員，自然人限本人；風險告知須錄音。</li>\n<li>CCS涉新臺幣本金達<b>等值USD300萬元</b>須於議價日辦大額資金通報。</li>\n<li><b>錄音保存期限不得少於商品存續期間加計3個月，未滿5年應至少保留5年以上；發生爭議保存至爭議消除</b>。</li>\n<li>交易確認書一式<b>4份</b>；客戶<b>不於7日內簽章寄回視同同意</b>。</li>\n<li>交易單保存期限<b>15年</b>。</li>\n</ul>\n<h4>第二節 提前結清</h4>\n<ul>\n<li>可承作反向交易或直接就原部位提前結清。</li>\n<li>直接結清須客戶口頭確認並電話錄音或回傳「提前結清說明書」；「提前結清確認書」<b>7日內</b>未簽回視同同意；錄音至少保存<b>5年</b>。</li>\n</ul>\n<h4>第四節 換單交易（選擇權）</h4>\n<ul>\n<li>客戶辦理換單須自付當日應付交割款項至少<b>3成</b>；低於3成須敘明事由陳核核定。</li>\n</ul>"},{"id":"fx-s1p1-c3","t":"衍商篇 第八章 投資組合商品","fc":"C","fq":"5年約2題（每年約<1題）· C級","h":"<h4>商品架構與門檻</h4>\n<ul>\n<li>投資組合商品（結構型商品）＝固定收益商品（臺/外幣定存）＋衍生性金融商品。</li>\n<li><b>DCI</b>（雙元組合商品）僅得由總行金融行銷部顧客交易員推介；架構＝外幣定存連結<b>賣出匯率選擇權</b>；<b>保息不保本</b>。</li>\n<li>單筆式商品：DCI每筆最低承作<b>等值10萬美元</b>以上，其餘類型原則<b>等值30萬美元</b>以上。</li>\n<li>募集式商品：條件標準化、門檻較低、僅募集期間受理，可能不成立。</li>\n</ul>\n<h4>客群保護（必考）</h4>\n<ul>\n<li><b>自然人一般客戶承作不保本型：保本率須70%(含)以上</b>；連結匯率選擇權最長<b>3個月(含)</b>、黃金<b>6個月(含)</b>、股權或ETF<b>12個月(含)</b>。</li>\n<li>法人一般客戶承作DCI或期限逾2年之不保本型：保本率<b>70%以上</b>。</li>\n<li>高齡客戶（<b>65歲含以上</b>）：不保本型高資產最長<b>3年</b>、非高資產最長<b>1年</b>；保本型高資產最長10年、非高資產最長5年；<b>85歲(含)以上一律最長3個月(含)</b>。</li>\n<li>高齡一般客戶不論屬性皆<b>不得承作RR4、RR5</b>；年輕族群（未滿20歲）一般客戶亦不得承作RR4、RR5。</li>\n<li>DCI：一般客戶及85歲以上自然人專業客戶僅得承作<b>3個月(含)以內</b>；不得連結新臺幣匯率；<b>自然人不得承作本金為人民幣或連結人民幣匯率之DCI</b>；一般客戶KYC屬性須為穩健型或積極型。</li>\n<li>客戶須知不超過<b>4頁</b>、內文不小於<b>12字體</b>。</li>\n<li><b>審閱期：交易條件標準化且存續逾6個月者，一般客戶不低於7日、專業客戶不低於3日</b>。</li>\n</ul>\n<h4>推介作業限制</h4>\n<ul>\n<li>逐筆徵「主動申購聲明書」對象：近一年交易筆數<b>低於5筆</b>、教育程度國中(含)以下、領有重大傷病證明、婉拒推介者。</li>\n<li>首筆前徵「交易經驗或經歷聲明書」；不保本型不得僅以客戶聲明認定，須合理可信佐證。</li>\n<li>專人解說：向自然人提供結構型商品須<b>面對面解說</b>；不保本型須<b>錄音</b>並簽確認書。</li>\n<li>專人解說及宣讀錄音保存不少於存續期間加計3個月，未滿5年至少保留5年。</li>\n<li>脆弱族群（65歲以上、國中以下、重大傷病、身心障礙、不識字）：須填「脆弱族群交易弱點檢核表」；承作RR4/RR5須確認非於提高風險屬性後<b>2曆日內</b>立即投資。</li>\n<li>未成年：<b>未滿7歲不得承作</b>；7歲以上未滿18歲須法定代理人親簽。</li>\n<li>不得勸誘客戶以融資方式承作（專業機構投資人及高淨值投資法人除外）。</li>\n<li>交易金額達<b>等值新臺幣300萬元(含)</b>（營業單位推介案件）須主管與客戶確認真實性。</li>\n</ul>\n<h4>中途解約與集中度</h4>\n<ul>\n<li><b>投資組合商品無法辦理繼承，僅能中途解約</b>。</li>\n<li>中途解約可領回金額＝解約價格−中途解約手續費−代扣稅款；手續費以原承作金額<b>×1%</b>為原則。</li>\n<li>每一營業日終了依公允價值評估；交易對手報價者得<b>雙週</b>評估一次。</li>\n<li>集中度管理：控管標準之<b>80%為預警限額</b>；本金幣別新臺幣、美元不設限。</li>\n<li>客戶關懷：65歲以上自然人不保本比例<b>＞15%</b>、其他一般客戶<b>＞30%</b>者，須去電提醒風險。</li>\n</ul>"},{"id":"fx-s1p1-c4","t":"衍商篇 第九章 風險控管","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<ul>\n<li>風險管理處每營業日終了評估未到期部位損益；非投資組合商品<b>每日按市價評估</b>。</li>\n<li>授信戶衍生性商品期中管理：有未到期部位原則<b>每2個月（奇數月月底前）</b>辦理一次；金融同業及僅承作外匯保證金、連結存款投資組合商品或買入選擇權客戶免列入。</li>\n<li><b>Margin Call</b>：營業單位接獲通知後立即通知客戶<b>3個營業日內</b>補足或結清；特殊情況得申請延長為<b>5個營業日</b>。</li>\n<li>客戶當日補足後次日再現應補徵，觀察是否<b>連續3個營業日達USD3,000(含)</b>後再通知。</li>\n<li><b>買入選擇權評估為損失時以零計算</b>。</li>\n<li>交易前檢視「本行實際曝險額」＞「曝險額度＋已徵擔保品」時應暫停動用額度。</li>\n<li>違約交割：違約交割日起除鎖定未到期部位損失外不得承作新交易；本行得逕行結清客戶未到期部位，損失以擔保品抵償，不足依逾期放款程序追索。</li>\n</ul>"},{"id":"fx-s1p1-c5","t":"衍商篇 第十章 其他相關作業規範","fc":"C","fq":"5年約1題（每年約<1題）· C級","h":"<h4>利害關係人交易管控</h4>\n<ul>\n<li>屬利害關係人者額度申請或承作條件應經<b>董事會重度決議</b>通過。</li>\n<li>限額：單一利害關係人交易未超過銀行淨值<b>10%</b>、所有利害關係人交易總額未超過淨值<b>20%</b>方得受理。</li>\n</ul>\n<h4>洗錢防制</h4>\n<ul>\n<li>受制裁或資恐指定制裁對象：持有結構型商品未到期者以原形式持有至到期並<b>凍結收益</b>；持有其他衍生性商品未到期者<b>立即終止/平倉</b>全部交易並凍結帳戶。</li>\n</ul>\n<h4>OBU客戶控管</h4>\n<ul>\n<li>確認法人存續經營4種方式：1年內徵信、註冊機關6個月內查詢報告、6個月內董事職權證明書（Certificate of Incumbency）、或另加存續證明。</li>\n</ul>\n<h4>商業行銷</h4>\n<ul>\n<li>不得於<b>早上9點~晚上9點以外</b>時間商業行銷（客戶要求除外）。</li>\n<li>客戶拒絕行銷後<b>十個工作天內</b>於「不接受行銷名單」註記。</li>\n<li>電話行銷不得隱匿發話號碼；首次致電須告知電話來源。</li>\n</ul>\n<h4>客戶權益保障</h4>\n<ul>\n<li>不得勸誘以借款/舉債融資從事投資。</li>\n<li>電話下單交易與確認由<b>不同人員</b>辦理，逐筆與客戶電話確認。</li>\n<li>高齡客戶發生金融剝削情事若調查屬實應<b>無條件返還投資本金</b>。</li>\n<li>視覺障礙或不識字者須口頭說明並由本行認可<b>二人</b>陪同見證。</li>\n</ul>"}]}]}};
const LS='fx_notes_v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}};
let HI={};try{HI=JSON.parse(localStorage.getItem(LS+'_hist')||'{}')}catch(e){HI={}}
const saveH=()=>{try{localStorage.setItem(LS+'_hist',JSON.stringify(HI))}catch(e){}};
function record(q,i){const h=HI[q.id]||(HI[q.id]={n:0,w:0});h.n++;if(!isOk(q,i))h.w++;saveH()}
try{const t=localStorage.getItem(LS+'_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
if(!DATA.rv)document.getElementById('tabrv').style.display='none';
const ALL=[...DATA.pq,...DATA.sq], BYID={};ALL.forEach(q=>BYID[q.id]=q);
const MOD={};DATA.mods.forEach(m=>MOD[m.id]=m);
const L='1234';
let view='mod', cur=1, quiz=null, keep=new Set(), OPEN={}, RW={};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isOk=(q,i)=>q.a===null||q.a===undefined?true:i===q.a;
function status(q){const v=ST[q.id];if(v===undefined)return 'un';return isOk(q,v)?'ok':'bad'}
function stats(list){let d=0,o=0;list.forEach(q=>{const s=status(q);if(s!=='un'){d++;if(s==='ok')o++}});return{d,o}}
function filt(list){const y=$('#fy').value,s=$('#fs').value;return list.filter(q=>(!y||String(q.y)===y)&&(!s||status(q)===s))}

function header(){
  const s=stats(ALL);
  $('#stat').innerHTML=`<b>${DATA.pq.length}</b> 題考古題（110–114）・<b>${DATA.mods.length}</b> 個考點・<b>${DATA.sq.length}</b> 題模擬題・已作答 <b>${s.d}</b>・正確率 <b>${s.d?Math.round(s.o/s.d*100):0}%</b>・細則：外匯篇 20260319／衍商篇 20260612＋2026 講義`;
}
function sidebar(){
  $('#ml').innerHTML=DATA.mods.map(m=>{
    const list=ALL.filter(q=>q.m===m.id), s=stats(list);
    return `<div class="mi ${view==='mod'&&cur===m.id&&!$('#q').value?'on':''}" data-m="${m.id}">
      <span class="code">${pad(m.id)}</span><span class="nm">${m.t}</span><span class="ct">${m.cnt} 題</span>
      <span class="sb">${m.w}・已答 ${s.d}/${list.length}</span>
      <span class="bar"><i style="width:${list.length?s.d/list.length*100:0}%"></i></span></div>`}).join('');
  $('#cnt').textContent=`${DATA.mods.length} 個考點・依考古題考點分類`;
}
function cite(c){
  if(!c)return '';
  const path=[c.b,c.c,c.s].filter(Boolean).join(' › ');
  const lec=(c.b||'').startsWith('講義'), sg=(c.b||'').startsWith('信保'), gw=(c.b||'').startsWith('公文'), rul=sg||gw||(c.b||'').startsWith('要點');
  return `<div class="cite${lec?' lec':rul?' rul':''}"><span class="lb">${lec?'講義依據':sg?'信保手冊依據':gw?'公文依據':rul?'要點依據':'細則依據'}</span><span class="path">${path}</span><div class="tx">${c.t}</div></div>`;
}
function qcard(q,showMod,qz){

  const QT={neg:'錯誤題',combo:'組合題',fill:'填空題',ask:'問答題'};

    else if(k==='wrong')ALL.filter(q=>status(q)==='bad').forEach(q=>{keep.add(q.id);delete ST[q.id]});
    else{const l=ALL.filter(q=>q.m===cur&&(k[0]==='p'?q.id[0]!=='S':q.id[0]==='S')&&(k.length===1||status(q)==='bad'));
      if(k.length>1){if(!l.length){alert('本考點目前沒有答錯的題目');return}RW[cur+k[0]]=new Set(l.map(q=>q.id));OPEN[k[0]]=true}else delete RW[cur+k[0]];
      l.forEach(q=>delete ST[q.id])}
    save();render();return}
  if(t.id==='qgo'){
    const ms=[...document.querySelectorAll('#qm input:checked')].map(x=>+x.value);
    const src=$('#qsrc').value,n=60,pr=$('#qpr').value;
    let pool=(src==='p'?DATA.pq:src==='s'?DATA.sq:ALL).filter(q=>ms.includes(q.m));
    if(pr==='badonly')pool=pool.filter(q=>status(q)==='bad');
    shuffle(pool);
    if(pr==='hard'){const r=q=>HI[q.id]?HI[q.id].w/HI[q.id].n:0;pool.sort((a,b)=>r(b)-r(a))}
    else if(pr&&pr!=='badonly')pool.sort((a,b)=>(status(b)===pr)-(status(a)===pr));
    if(!pool.length){alert('沒有符合條件的題目');return}
    let pick=pool.slice(0,n);
    if($('#qtp').value==='r'&&DATA.qt){  // 依 114 年題型比例分層抽題，不足者以其他題補足
      const K=['neg','combo','fill','ask'],want={};let s=0;K.forEach(k=>{want[k]=Math.round(DATA.qt[k]*n);s+=want[k]});want.neg+=n-s;
      pick=[];K.forEach(k=>pick.push(...pool.filter(q=>q.t===k).slice(0,want[k])));
      const used=new Set(pick.map(q=>q.id));pick.push(...pool.filter(q=>!used.has(q.id)).slice(0,n-pick.length));shuffle(pick)}
    quiz=pick.map(q=>q.id);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qagain'){quiz.ans={};shuffle(quiz);render();scrollTo(0,0);return}
  if(t.id==='qwrong'){const w=quiz.filter(id=>quiz.ans[id]!==undefined&&!isOk(BYID[id],quiz.ans[id]));quiz=shuffle(w);quiz.ans={};render();scrollTo(0,0);return}
  if(t.id==='qnew'){quiz=null;render();return}
});
$('#q').addEventListener('input',()=>render());
let rvT;document.addEventListener('input',e=>{if(e.target.id==='rvq'){clearTimeout(rvT);rvT=setTimeout(rvFilter,150)}});
$('#fy').addEventListener('change',()=>render());
$('#fs').addEventListener('change',()=>render());
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)OPEN[d.dataset.sec]=d.open},true);
render();
</script>
