geBFIX台北PM2：00五、交易案例請參閱「企業內部入口網站/全行文件庫/金融市場業務/知識庫/衍生性金"},"x":"美元兌新臺幣匯率選擇權決價參考台北外匯經紀中心（TAIFX1）<b>上午 11:00</b> 成交價。"},{"id":"112-1","y":112,"n":1,"m":5,"q":"「第一公司」為依本國法令設立登記之公司，提供其直接投資設立於日本之子公司為期一年本金USD300萬元之融資，受理「第一公司」來行辦理該筆融資款之國外匯出匯款時，應申報下列何種匯款性質？","o":["210對外股本投資","220對外貸款投資","221對外直接投資事業及關係企業融資","280對外融資"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"(一)居住民與無投資關係非居住民之融資，應填報「280對外融資/收回對外融資」或「340償還國外融資/國外融資」。(二)居住民與有投資關係非居住民之融資:應填報「<mark>220對外貸款投資</mark>/收回<mark>對外貸款投資</mark>」、「221對外直接投資事業及關係企業融資/收回對外直接投資事業及關係企業融資」、「320償還僑<mark>外貸款投資</mark>/僑<mark>外貸款投資</mark>」、「321僑外直接投資股東及關係企業融資」。"},"x":"居住民對<b>有投資關係</b>之非居住民（直接投資之子公司）融資，申報「<b>221 對外直接投資事業及關係企業融資</b>」；無投資關係者為 280。"},{"id":"112-2","y":112,"n":2,"m":4,"q":"辦理外匯電文發電作業，倘發生去電電文狀態為「NAK（Negative Acknowledgement）」時","o":["應依系統指示錯誤原因作必要之更正，並重新拍發電文","如為外匯系統自動產生之電文，表示已成功拍發，勿再重新辦理發電，以免重複","表示電文重複拍發","表示電文中含有防制洗錢打擊資恐(AML)可疑名單，須由主管審查放行"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(1)前述4~5項之電文拍發，係於外匯連線作業系統上登打相關資料，編製電文稿後轉至外匯電文系統覆核、放行，即資料之登打與覆核係於不同系統上完成，爰外匯電文系統之電文覆核人員，倘係外匯經辦，得逕行於外匯連線作業系統登打電文資料，惟該筆電文需換人辦理覆核工作，另經由外匯連線系統編製之電文稿，其DATA-ENTRY欄位得免蓋章。(2)對外發電之擬稿單位或發電單位倘認為擬拍發之電文有重覆之可能時，應於報尾上加註PDE字樣，以提醒收電銀行注意，並利其做必要之處置。(3)倘電文拍發後之訊息為「NAK」（NegativeAcknowledgement）時，應即<mark>依系統指示錯誤</mark>之<mark>原因作必要之更正，並重新</mark>辦理電文之拍發。"}},{"id":"112-3","y":112,"n":3,"m":4,"q":"受理國外匯入匯款業務時，倘匯款人資訊不足，下列敘述何者正確？","o":["本行拍發電文予匯款銀行，請求提供完整匯款人資料，逾發電日起算10個營業日未接獲回覆，得逕予退匯","雖受款人不常往來，但匯款人名稱誤拼或遺漏等小差異，應一律徵妥切結書後辦理解款，以免滋生爭議","匯款人名稱誤拼或遺漏等小差異，惟已先行解款案件，免再拍發電文要求匯款銀行提供完整匯款人資料","解款後始收到匯款銀行回覆匯款人資訊電文時，免再辦理洗防審查"],"a":0,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"2.倘<mark>匯款人資</mark>訊不足者，應依下列規定處理：(1)應請受款人聯繫匯款人轉請<mark>匯款銀行</mark>來電更正或<mark>提供完整</mark>資料，始得辦理匯入解款；倘轉請外匯營運處外匯作業部或外匯指定單位代為向<mark>匯款銀行</mark>查詢，去電郵電費應由受款人負擔，不得申請減免。(2)若受款人為本行優良或業務上往來頻繁之客戶，且匯款人名稱誤拼或遺漏等小差異時，分行應先完備KYC程序，於徵妥切結書後，得先行解款，惟仍須<mark>拍發電文</mark>要求<mark>匯款銀行提供完整匯款人資料，</mark>且務必請客戶通知匯款人要求<mark>匯款銀行</mark>儘速回覆電文，以利本行留存備查。(3)營業單位收到回覆<mark>匯款人資</mark>訊電文時，應透過「防制洗錢打擊資恐(AML)系統」查詢是否為黑名單，並將列印之查詢結果留存備查。倘查詢結果為疑似外匯關注名單，應依「業務處理細則-外匯篇」第一章第四節相關規定辦理。(4)倘自本行以掛號通知受款人應更正<mark>匯款人資</mark>訊不足已逾1個月或本行去電詢問已<mark>逾發電日起算10個營業日</mark>，而未接獲<mark>匯款銀行</mark>來電更正或提供匯款人完整資料，得以欠缺<mark>完整匯款人資</mark>訊為由，不受"},"x":"倘匯款人資訊不足，應請匯款銀行更正或提供完整資料始得解款；優良客戶小差異得徵切結書先解款，但<b>仍須拍電索取</b>完整資料，回覆後仍須洗防審查 → (B)(C)(D)錯，(A)正確。"},{"id":"112-4","y":112,"n":4,"m":7,"q":"有關個人戶單筆臨櫃辦理外匯業務，下列敘述何者錯誤？","o":["70 歲客戶解約 3 仟歐元之外匯定存，應填寫「高齡客戶臨櫃存提款/轉讓/匯款檢核表」","60 歲客戶自外存帳戶提領現鈔2萬美元，系統自動產出「臨櫃作業關懷客戶提問表」","65歲客戶結購外匯存款 3 萬美元，系統自動產出「高齡客戶臨櫃存提款/轉讓/匯款檢核表」","40 歲客戶匯出日幣 300 萬元，系統自動產出「臨櫃作業關懷客戶提問表」"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"4.<mark>高齡客戶</mark>案件且符合以下情境者，應以<mark>「高齡客戶臨櫃存提款/轉讓/匯款檢核表</mark>【個人戶】」加強關懷客戶。(1)年齡達65歲(含)以上。(2)年齡達55歲(含)以上，且提領金額達等值新臺幣50萬元(含)以上。"}},{"id":"112-5","y":112,"n":5,"m":1,"q":"依 UCP600 規範，有關傭船提單之敘述，下列何者正確？","o":["由代理人簽署時，應表明其係代替船長、船東或傭船人簽署","倘傭船提單同時載有簽發日及含有裝運日期之裝載註記，應將簽發日視為裝運日期","裝載港得以信用狀敘明之地理區域顯示","倘信用狀要求提示傭船契約，銀行應審查該契約內容是否完整"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"名代理人（Agent）所簽署。<mark>船長、船東</mark>、傭船人或代理人之任何簽字，須依各該情形表明為<mark>船長、船東</mark>、傭船人或代理人。代理人之任何簽字須表明係代替或代表<mark>船長、船東或傭船人簽署</mark>，倘代替或代表<mark>船東或傭船人簽署</mark>，亦須表明<mark>船東或傭船人</mark>之名稱。(3)得以預先印定措辭或裝載註記表明貨物已裝運於標名之船舶，傭船提單之簽發日期視為裝運日期。除非傭船提單含裝載註記表明裝運日期，則該裝載註記之日期將視為裝運日期。"},"x":"傭船提單代理人簽字<b>須表明係代替或代表船長、船東或傭船人</b>簽署 → (A)正確；有裝載註記者以註記日期為裝運日。"},{"id":"112-6","y":112,"n":6,"m":1,"q":"依 UCP600 規定，有關航空運送單據之敘述，下列何者錯誤？","o":["應表明運送人名稱","應表明貨物已接受待運","應敘明信用狀規定之起運機場及目的地機場","倘信用狀禁止轉運，表明將轉運或可能發生轉運之航空運送單據將被視為瑕疵"],"a":3,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"Board字樣及日期，始得視為貨物業已裝船。(13)即使<mark>信用狀禁止轉運，</mark>下列情況之提單將予接受：○1表明貨物<mark>將轉運或可能</mark>轉運，但該運送全程係由同一提單涵蓋者。○2若提單表示貨物已裝運於貨櫃、拖車及或子母船中之子船中<mark>，表明將轉運或可能發生轉運之</mark>提單。(14)提單上含有敘明運送人保留轉運權利之條款者，不予理會。(15)注意提單提示日期是否在信用狀規定之提示期限內，<mark>倘信用狀</mark>未規定提示期限者，而規定提示之單據含一份或一份以上依循UCP600第19條至第25條規定之正本<mark>運送單據</mark>者，則提單之提示日期不得遲於裝運日後21曆日且須在信用狀有效期限內（有關有效期限之限制，請參閱U.C.P.600第14(C)條之規定）。(16)部分裝運之認定：○1提示多套提單，但顯示係由同一運輸工具起運且以同一航次裝運者，如表明同一目的地，將不認定係部分裝運，縱使提單上表明不同之裝運日或不同裝載港、接管地或發送地者亦然，並以任一"}},{"id":"112-7","y":112,"n":7,"m":2,"q":"依 URC522 規定，下列敘述何者錯誤？","o":["銀行應審查單據以取得託收指示","託收指示應包含委託人全名、託收幣別金額及交付單據之條件等相關資訊","託收指示書應敘明適用託收統一規則","代收銀行對於因提供不正確地址而導致之延遲，不負任何責任"],"a":0,"ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第三節 付款交單（D/P）之處理","t":"二、依託收統一規則(URC522)規定「<mark>託收指示</mark>憑付款交單之案件，不得含有未來日期付款之匯票」。倘託收案件含有未來日期付款之匯票者，應查明<mark>託收指示</mark>書所標示之單據處理方式係用D/A或D/P；若無該標示、或<mark>託收指示</mark>僅標明憑付款交單如D/P30天者，則該單據僅於進口客戶付款後才能交付。"},"x":"URC522 第4條：每筆託收應附獨立之託收指示，<b>銀行不會為取得指示而審查單據</b> → 選項 A 錯。","lo":3,"web":[{"t":"Trade Finance Global：URC 522 Explained","u":"https://www.tradefinanceglobal.com/letters-of-credit/urc-522-eurc/"}]},{"id":"112-8","y":112,"n":8,"m":1,"q":"初級市場遠期信用狀買斷案件，下列何種情況，本行仍保有向出口商請求還款之權利？<br><span class=\"it\">A.</span> 開狀行因財務危機致不能付款<br><span class=\"it\">B.</span> 商業糾紛<br><span class=\"it\">C.</span> 開狀行因國家風險致不能付款<br><span class=\"it\">D.</span> 法院發出禁止支付命令","o":["AB","BD","BCD","ABCD"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"附錄2-12-1 辦理遠期信用狀買斷業務處理要點","t":"二、本要點所稱「<mark>遠期信用狀買斷</mark>」業務，依交易對象不同，分為<mark>初級市場</mark>及次級市場兩種型態，其定義說明如下：(一)<mark>初級市場遠期信用狀買斷</mark>係指出口商將<mark>遠期信用狀</mark>項下之票據或單據讓售予本行（買斷行），本行於接獲開狀行(或保兌行)承兌通知後，依「信用狀賣斷讓渡書」之約定付款予出口商之交易。承兌到期日，倘開狀行(或保兌行)<mark>因財務危機致不能付款</mark>，本行對出口商無追索權(withoutrecourse)；但其他不屬於開狀行(或保兌行)信用風險及<mark>國家風險</mark>所致之不付款，如<mark>商業糾紛</mark>或<mark>法院發出禁止支付命令</mark>，本行則<mark>仍保有向出口商請求還款之權利</mark>。"},"x":"初級市場買斷：開狀行（保兌行）財務危機或國家風險不能付款 → 對出口商<b>無追索權</b>；<b>商業糾紛、法院禁止支付命令</b>則仍保有請求還款權利 → BD。"},{"id":"112-9","y":112,"n":9,"m":8,"q":"新臺幣遠期外匯之訂約/展期推介人員，不得擔任以下何種職務？<br><span class=\"it\">A.</span> 最新一筆 KYC之評估人員<br><span class=\"it\">B.</span> 最新一筆 KYC 之建檔人員<br><span class=\"it\">C.</span> 該筆訂約之核章人員<br><span class=\"it\">D.</span> 該筆訂約之交易人員","o":["AC","AD","BC","BD"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第三節 客戶投資風險屬性評估(KYC)作業","t":"(二)辦理KYC相關人員：1.<mark>評估人員</mark>：(1)應具備本章第二節擔任<mark>新臺幣遠期外匯</mark>業務<mark>推介人員</mark>資格。(2)可同時擔任該<mark>筆KYC建檔人員</mark>。(3)客戶<mark>最新一筆KYC之評估人員</mark>不得為該客戶<mark>訂約/展期</mark>交易之<mark>推介人員</mark>。"},"x":"推介人員不得為客戶最新一筆 KYC 之<b>評估人員</b>，亦不得為該筆訂約之<b>核章人員</b> → AC。"},{"id":"112-10","y":112,"n":10,"m":8,"q":"以交易清單方式辦理新臺幣遠期外匯訂約，下列敘述何者正確？<br><span class=\"it\">A.</span> 遠匯契約到期日不得超過該合併清單之最晚到期日<br><span class=\"it\">B.</span> 客戶得高於清單金額分次辦理訂約交易<br><span class=\"it\">C.</span> 不同交易性質之外匯交易，得編製於同一份交易清單<br><span class=\"it\">D.</span> 須提供清單所列前 3 大金額之實際交易證明文件","o":["AB","AC","BC","AD"],"a":3,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"載之收付款到期日互具合理性，且不得逾該文件所載之收付款到期日，另訂約金額不得大於提示文件之合計總額。前述實需文件之種類不拘，惟形式發票(ProformaInvoice，又稱預開發票或估價發票)非正式發票，係出口商在買賣成交前，應買方要求，按擬出售之貨品、單價、規格等條件開立之參考發票，非正式發票。僅憑形式發票無法確認交易是否完成，故尚難單獨以其作為合格的結匯<mark>證明文件</mark>，倘客戶欲以形式發票作為<mark>交易證明文件</mark>時，須另檢附足以佐證買賣交易已完成之其他相關單據，如發票、採購訂單或金融機構開立之信用狀等文件佐證。B.<mark>以交易清單方式辦理</mark>：a.憑客戶數十筆交易<mark>合併清單</mark>訂定一筆<mark>遠匯契約</mark>時，應注意遠匯交割日期與<mark>清單所列</mark>各筆收付款日期之合理性，且<mark>遠匯契約到期日不得超過該合併清單之最晚到期日</mark>，並確認訂定匯率方向無誤，客戶得在不<mark>高於清單金額</mark>範圍內一次或<mark>分次辦理訂約交易</mark>。另，<mark>不同交易性質之外匯交易，</mark>須分別編製不同的文件清單。b.清單內容至少需包含各筆交易對手名稱、文件號碼(如發票號碼或訂單"}},{"id":"112-11","y":112,"n":11,"m":9,"q":"有關衍生性金融商品額度申請，下列敘述何者有誤？","o":["計算實際避險需求時，如含匯率避險需求，應另扣除客戶於本行新臺幣遠匯額度(含曝險額度)","避險性額度僅限客戶自身及所屬集團企業營運相關避險需求使用","以客戶淨值基礎核給之非避險性額度，得透過其自身提供之合格擔保品作為信用增強","同一客戶應依不同交易目的分別申請衍生性金融商品額度"],"a":2,"ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"(二)「<mark>非避險性</mark>」額度1.「<mark>非避險性</mark>」額度(含<mark>非避險性</mark>衍生性金融商品額度+曝險額度)，應<mark>以客戶淨值</mark>、徵提之擔保品價值或其所屬集團企業連帶保證或提供其他<mark>信用增強</mark>為限，項目如下：(1)「<mark>淨值基礎</mark>」：以最近一完整年度財報淨值為原則，並扣除其他同業<mark>以客戶淨值核給之非避險</mark>額度。(2)「第三人提供<mark>合格擔保品</mark>」：客戶自身以外第三人<mark>提供之合格擔保品</mark>，<mark>合格擔保品</mark>以銀行存款及流動性高之有價證券為限，擔保品之鑑價、設質等作業依本行相關規範辦理，並依下表折扣率計算其價值。倘第三人為公司時，應確認第三人係依其他法律或公司章程規定得為對外保證，且應徵取第三人之董事會決議錄並載明相關事項，以確認取得授權。<mark>合格擔保品</mark>折扣率(市場價值之%)存款0%G7及本國中央政府公債1年(含)以內0.5%1(不含)~5年(含)2%5年(不含)~10年(含)4%10年(不含)以上5%本國上市公司股票20%本國上櫃公司股票30%幣別非美元之外幣擔保品(註)3%"},"x":"非避險性額度信用增強限客戶淨值、<b>第三人</b>提供之合格擔保品或集團連保；淨值基礎額度不得以自身擔保品增強 → (C)錯。"},{"id":"112-12","y":112,"n":12,"m":10,"q":"關於外幣間遠期外匯交易，下列敘述何者正確？<br><span class=\"it\">A.</span> 係指不涉及新臺幣且交割日期逾 2 個營業日以上之外匯交易<br><span class=\"it\">B.</span> 原則上每筆最低交易金額為等值 USD30 萬元<br><span class=\"it\">C.</span> 倘客戶承作目的為「避險性」時，則其衍生性 KYC 得為「穩健型」或「保守型」<br><span class=\"it\">D.</span> 到期交割方式僅限「全額交割」方式辦理","o":["ABCD","ABD","AC","僅 A"],"a":2,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"一、定義(一)<mark>遠期外匯交易</mark>雙方事先約定在未來某一特定日期或期間，依訂約當時所約定之幣別、金額及匯率進行貨幣買賣。(二)<mark>外幣間遠期外匯交易</mark>(簡稱<mark>外幣間遠</mark>匯)<mark>係指不涉及新臺幣且交割日期逾</mark>兩<mark>個營業日以上之外匯交易</mark>；包含美元對各種外幣、美元以外各種外幣間之<mark>遠期外匯</mark>買賣。"}},{"id":"112-13","y":112,"n":13,"m":4,"q":"本行受理人民幣外匯業務之相關規定，下列敘述何者正確？","o":["自然人每日透過帳戶(含臨櫃及電子化通路)買賣人民幣限額(買、賣分別計算)為人民幣2萬元","本國自然人每日人民幣現鈔存入外匯存款帳戶或自外匯存款帳戶提領人民幣現鈔(含臨櫃及ATM)之限額為人民幣2萬元","領有台灣地區居留證，其有效期限滿一年以上之個人匯人民幣至中國大陸，每日匯款限額為人民幣 8 萬元","以上皆非"],"a":0,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"2.倘當日報表顯示「本日無資料」，則無須列印呈核；報表應裝訂成冊，保存期限五年。十一、其他應注意事項(一)<mark>自然人每日透過帳戶買賣人民幣(買、賣</mark>限額<mark>分別計算)</mark>之限額<mark>為人民幣2萬元</mark>(併計各分行<mark>臨櫃及電子化</mark>業務所有通路之交易，採全行管控)。"},"x":"自然人每日透過帳戶買賣人民幣（買、賣分別計算）限額為<b>人民幣 2 萬元</b>，併計臨櫃及電子化通路、全行管控 → (A)正確。"},{"id":"112-14","y":112,"n":14,"m":3,"q":"下列國外匯兌案件之受理原則，何者為是？","o":["交易涉及俄羅斯一律不得承作","透過第e金網匯往他行案件，涉及高風險國家一律拒絕受理","受款人位於印度，貨物由印度經伊朗航空班機運送至沙烏地阿拉伯，一律不得承作","交易涉及烏克蘭應逐筆填具「俄、白俄及烏地區匯兌業務案件審查表」，經防制洗錢及打擊資恐督導主管確認後承作"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"1.進口案件之受益人或通知銀行、出口案件之進口商或開狀銀行位於俄羅斯者<mark>，一律不得承作</mark>。2.凡貨品命中經濟部國際貿易署「輸往俄羅斯及白俄羅斯高科技貨品清單」以及「軍商兩用貨品及技術出口管制清單及一般軍用貨品清單」其一管制項目<mark>，一律不得承作</mark>。<mark>沙烏地阿拉伯</mark>(SaudiArabia)v(與伊朗高度關連國家)(屬中東地區)塞爾維亞(Serbia)v索馬利亞(Somalia)v南蘇丹(SouthSudan)v(全面性制裁)v(FATF)有關外匯案件，一律停止受理斯里蘭卡(SriLanka)v國家信評及財政金融收支不佳蘇丹(Sudan)v"}},{"id":"112-15","y":112,"n":15,"m":5,"q":"受理註冊於英屬維京群島之「小明科技公司在台辦事處」國外匯入匯款結售存入新臺幣帳戶交易，經查該戶「客戶資料建檔(交易代號 9772)」之身分別為「1 公司」，應按照（　）之規定辦理外匯收支或交易申報。","o":["公司","團體","行號","非居住民"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"2.<mark>9772</mark>查詢：於顧客管理系統之外匯<mark>客戶資料建檔</mark>交易(<mark>代號9772)</mark>之作業代號項下(3.畫面查詢或4.列印查詢)，查詢該統一編號已建檔之所有<mark>新臺幣帳戶</mark>資料。"}},{"id":"112-16","y":112,"n":16,"m":2,"q":"有關進口遠期信用狀超額押匯案件之處理，下列敘述何者為非？","o":["超額押匯金額未逾信用狀金額5%(含)者，免補收開狀手續費","超額押匯金額超過信用狀金額5%時，應就超押金額之全部，依原開狀時之手續費率補收開狀手續費","加計超押金額後，倘本行進口融資金額超過原核准授信額度時，應就超過部分要求客戶全額結匯並補收利息","倘須補收開狀手續費，最遲應於交付該筆單據給客戶前完成補收"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"3.國外超額押匯案件應補徵<mark>開狀手續費</mark>及開狀保證金後，始得將單據交付客戶：(1)補徵<mark>開狀手續費</mark>：超額押匯金額未逾信用狀開狀金額5%(含)，免徵<mark>收開狀手續費</mark>；超額押匯金額超過信用狀金額5%時，應就超押金額之全部，依原開狀時之手續費率及補收當日之適用匯率<mark>補收開狀手續費，</mark>倘因故無法於交單時完成補徵<mark>開狀手續費</mark>者，為利贖單作業順利，至遲應於案件辦理首次還款交易時，補收該項費用。(2)進口遠期信用狀案件應注意查核加計該超押金額後，本行進口融資金額有否超過原核准授信條件及授信額度，為利控管進口信用狀超額押匯案件額度之使用情況，營業單位每日應自「報表查詢列印系統(OnDemand)」查詢列印「外匯授信使用額度異常明細表(FI60D)」(無資料者免列印)呈主管覆核，對於其中外匯授信使用額度不足之進口超額押匯案件，倘於原核准授信條件及授信額度內，得由各營業單位辦理「信用狀/外幣貸款使用額度及核准號碼之變更（I631）」交易調整授信使用額度或就超押部分全額結匯並補收利息；倘超過原核准授"},"x":"超額押匯手續費無法於交單時補徵者，<b>至遲應於首次還款交易時</b>補收 → (D)「最遲於交付單據前」錯。"},{"id":"112-17","y":112,"n":17,"m":2,"q":"有關進出口「簽章登記卡」印鑑拍攝作業規範，下列敘述何者正確？<br><span class=\"it\">A.</span> 印鑑拍攝得由非客戶所屬分行辦理<br><span class=\"it\">B.</span> 倘進出口業務分採不同印鑑式樣，僅拍攝任何一式即可<br><span class=\"it\">C.</span> 最遲應於承作進出口交易當日(含)前完成拍攝<br><span class=\"it\">D.</span> 拍攝範圍應包含「授權印鑑」及「訂約印鑑」","o":["AC","AB","CD","ABCD"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第一節 受理申請出口押匯/貼現之處理","t":"3<mark>.拍攝範圍</mark>(1)<mark>授權印鑑</mark>－即<mark>簽章登記卡</mark>上「<mark>印鑑式樣</mark>」欄位內之印鑑。如留存簽章不只一式，應點選「加一式」再拍攝。(2)<mark>訂約印鑑</mark>－即<mark>簽章登記卡</mark>右下角「客戶名稱」欄位內之客戶簽名與蓋章。<mark>拍攝範圍應包含</mark>至立約日期，並於該頁面點擊滑鼠右鍵開啟功能選單，選擇<mark>「訂約印鑑</mark>及親簽」，設定為<mark>「訂約印鑑」</mark>。"},"x":"印鑑拍攝範圍應包含<b>授權印鑑</b>（多式者點「加一式」逐一拍攝）及<b>訂約印鑑</b>，且應於承作交易前完成 → CD。"},{"id":"112-18","y":112,"n":18,"m":2,"q":"有關外幣保證函之規定，下列敘述何者錯誤？","o":["客戶應提供有外幣保證實際需求之證明文件","倘非使用本行制訂格式開發時，應事先將保證內容會辦外匯營運處及法務室審閱","倘保證函敘明其適用 URDG758，審單期限為單據提示日次日起算最長 3 個營業日","倘單據有瑕疵欲拒絕付款，應以 SWIFT 拍發 MT786 電文通知國外"],"a":2,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第十節 外幣擔保信用狀保證函處理","t":"5.<mark>審單期限</mark>：(1)UCP600、<mark>URDG758</mark>：<mark>單據提示日次日起算最長</mark>五<mark>個營業日</mark>。(2)ISP98：三<mark>個營業日</mark>為審單合理期限，超過七<mark>個營業日</mark>視為不合理。"},"x":"UCP600、URDG758 審單期限為單據提示日次日起最長 <b>5 個營業日</b>（ISP98 為 3 個營業日）→ (C)錯。"},{"id":"112-19","y":112,"n":19,"m":10,"q":"有關「換匯交易(SWAP)」之敘述，下列何者為是？<br><span class=\"it\">A.</span> 同時辦理兩筆相等金額、買賣方向相反及不同到期日之外匯交易<br><span class=\"it\">B.</span> 限衍生性 KYC 評估為積極型之客戶承作<br><span class=\"it\">C.</span> 「新臺幣兌外幣間換匯」交易可依客戶需求，選擇以「全額交割」或「差額交割」方式辦理","o":["ABC","AC","BC","A"],"a":3,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"一、定義<mark>換匯交易(</mark>FX<mark>SWAP)</mark>係指<mark>同時辦理兩筆相等金額、買賣方向相反及不同到期日之外匯交易</mark>。市場慣例上，若承作近天期端賣、遠天期端買之交易以Sell/Buy稱之；若承作近天期端買、遠天期端賣之交易以Buy/Sell稱之，本行現行得承作交易類型限近天期端為2個營業日內交割之即期交易、搭配遠天期端為逾2個營業日交割之遠期交易。"},"x":"換匯交易＝兩筆金額相等、方向相反、到期日不同之外匯交易（A）；新臺幣對外幣間換匯<b>僅得全額交割</b>（C 錯）→ 僅 A。"},{"id":"112-20","y":112,"n":20,"m":9,"q":"客戶申請成為衍生性金融商品業務之「其他法人專業客戶」，下列敘述何者有誤？","o":["最近一期經會計師查核或核閱之財務報告「總資產」超過新臺幣 5,000 萬元","授權辦理交易人員具備充分金融商品專業知識及交易經驗","充分了解銀行與專業客戶進行衍生性金融商品交易得免除之責任","營業單位每年至少須辦理覆審一次"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第一節 概述","t":"3.其他法人專業客戶：係指1、2以外之「法人專業客戶」，同時符合下列資格，並依規完成申請或覆審作業之客戶。(1)<mark>最近一期經會計師查核或核閱之財務報告</mark>總資產<mark>超過新臺幣</mark>一億元。"},"x":"其他法人專業客戶門檻為最近一期財報<b>總資產超過新臺幣一億元</b>，非 5,000 萬元 → (A)錯。"},{"id":"112-21","y":112,"n":21,"m":4,"q":"有關本行外匯電文系統，下列敘述何者為非？","o":["外匯電文系統之各級使用者不得互相兼任並僅得申請一組使用者帳號","電文覆核人員由各使用單位指定具覆核資格之經辦人員或副理擔任","使用者密碼使用期限為30個曆日","各使用單位應指派專人每月於外匯電文系統查詢「使用者帳號明細表」"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(四)密碼連續錯誤5次或逾期60天未登入者，密碼將自動失效，倘欲回復需申請密碼重置。(五)<mark>各使用單位應指派專人每</mark>週<mark>於外匯電文系統查詢「使用者帳號明細表」</mark>，確實控管使用人員之情形，若有密碼期限將屆者，應立即變更。"},"x":"各使用單位應指派專人<b>每週</b>查詢「使用者帳號明細表」，非每月 → (D)錯。"},{"id":"112-22","y":112,"n":22,"m":5,"q":"有關中華民國台灣地區居留證證號，下列敘述何者正確？","o":["共八碼，皆為數字","無論新舊證號，一律第一碼為英文字母區域碼、後九碼為數字","舊證號第二碼為性別碼，1代表男性","新證號第二碼為性別碼，8代表男性"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"4、銀行代理外國自然人、外國法人及外國銀行之國內匯、受款人(申報義務人)身分別仍維持為「16」、「17」及「18」。(四)持中華民國台灣地區相關「居留證」或外僑「居留證」（含港澳及大陸人士持「居留證」），身分別為「4」，共10碼，舊證號格式前二碼為英文字母(第一碼為英文字母區域碼，<mark>第二碼為性別碼，</mark>A、C<mark>代表男性</mark>，B、D代表女性)，後八碼為數字碼，新證號格式第一碼為英文字母，後九碼為數字碼，須符合內政部公布之邏輯檢查標準，已換發新證號者應以新證號填列，須填寫居留證之核發及到期日期，該居留證應在有效期限內。"},"x":"居留證身分別「4」共 10 碼：舊證號前二碼英文（第二碼性別碼 A、C 男）；新證號第一碼英文、後九碼數字，其第二碼 8 代表男性 → (D)正確。"},{"id":"112-23","y":112,"n":23,"m":4,"q":"有關本行「多幣別全球匯款業務」，下列敘述何者正確？<br><span class=\"it\">A.</span> 合作對象有美國銀行<br><span class=\"it\">B.</span> 限採電匯方式<br><span class=\"it\">C.</span> 雖然實際匯款幣別為美金，但客戶可指定到帳時轉換為本行沒有掛牌之幣別","o":["僅 A","僅 B","僅 AB","ABC"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-3-5 多幣別全球匯款業務作業處理注意事項","t":"五、產品架構：合作銀行花旗銀行<mark>美國銀行</mark>劃帳行SWIFTCODECITIUS33BOFAUS6S客戶<mark>實際匯款幣別</mark>美元美元<mark>可指定到帳</mark>幣別135種140種以上款項到帳時間T+2倘遇受款行國定假日則順延。T~T+2倘遇受款行國定假日則順延。辦理方式以<mark>電匯方式</mark>為限，且僅能臨櫃受理，並由外匯作業部拍發匯款電文。"},"x":"多幣別全球匯款合作銀行為花旗及<b>美國銀行</b>；限<b>電匯</b>且僅臨櫃受理；實際匯款幣別為美元，可指定到帳幣別 135～140 種以上 → ABC。"},{"id":"112-24","y":112,"n":24,"m":5,"q":"申報人身分別為2 (團體)在臺無營運收入之「辦事處」或「事務所」，其可申報之匯入匯款分類，以下何者為非？","o":["196外國民間機構在台辦公費用","340國外融資","410薪資款匯入","511工作者匯款收入"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"(二)辦理外國公司分公司、外國有限合夥分支機構或外國公司在臺辦事處之國外匯出入款案件時，應確實查驗客戶身分文件或基本登記資料。倘為外國公司在臺辦事處，身分別應為「2:團體」，其匯款分類限匯入「196外國民間機構在台辦公費用」、「410薪資款匯入」及「511工作者匯款收入」。"},"x":"外國公司在臺辦事處身分別「2：團體」，匯入分類限 196、410、511；<b>340</b> 不可 → (B)。"},{"id":"112-25","y":112,"n":25,"m":3,"q":"下列何者非屬全面性制裁國家？","o":["古巴(CUBA)","俄羅斯(RUSSIA)","北韓(NORTH KOREA)","敘利亞(SYRIA)"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"5、烏克蘭-俄羅斯臨時佔領區域屬全面性制裁地區，有關外匯案件一律停止受理。二、辦理外匯業務往來應特別注意國家及地區名單辦理下列國家或地區之外匯案件，應依其符合之名單種類，按第一項「名單種類」所列之「營業單位作業注意事項」規定辦理。國家名稱"}},{"id":"112-26","y":112,"n":26,"m":7,"q":"本行外幣ATM提供外匯存款扣款提領外幣現鈔功能限以何種帳戶之金融卡辦理提領？<br><span class=\"it\">A.</span> 新臺幣活期儲蓄存款帳戶<br><span class=\"it\">B.</span> 外匯活期存款帳戶<br><span class=\"it\">C.</span> 金如意綜合管理帳戶 D.iLEO數位帳戶","o":["AB","CD","BC","AD"],"a":1,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"五、提領帳戶：為辦理金融卡提領之新臺幣帳戶或<mark>外匯存款帳戶</mark>(限本行<mark>金如意綜合管理帳戶</mark>及<mark>iLEO數位帳戶</mark>)。<mark>提領外幣現鈔</mark>時以該次<mark>提領外幣</mark>金額及結匯匯率計算而得之新臺幣金額扣帳；自<mark>外匯存款帳戶扣款提領</mark>時，本行將另依交易當時本行即期與現鈔之牌告賣出匯率差額計收等值外幣之手續費，最低手續費為等值新臺幣100元。"},"x":"外幣 ATM 自外匯存款扣款提領，限<b>金如意綜合管理帳戶及 iLEO 數位帳戶</b> → CD。"},{"id":"112-27","y":112,"n":27,"m":7,"q":"受理收兌外幣現鈔時，倘係人民幣陳舊鈔券者，依規得酌情以每 100 元人民幣另收新臺幣（　）元 之處理手續費。","o":["5 元","10 元","15 元","20"],"a":0,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"2.<mark>收兌外幣現鈔</mark>手續費:(1)結售為新臺幣案件A.本行客戶：每筆新臺幣<mark>100元</mark>。B.非本行客戶：每筆新臺幣200元，惟授權營業單位經理對原於本行結購外幣剩餘者或有其他業務招攬機會者，得酌情減收為每筆新臺幣<mark>100元</mark>。(2)存入外匯存款案件按本行即期牌告買入匯率與現鈔牌告買入匯率之差額計收，最低每筆新臺幣<mark>100元</mark>，無最高金額上限。(3)<mark>陳舊鈔券</mark>、特殊版別及破汙損鈔券之處理原則與收費，另依項次(三)說明辦理。"}},{"id":"112-28","y":112,"n":28,"m":7,"q":"辦理代收外幣票據業務應注意事項，下列何者為非？","o":["單筆票據金額在等值USD300元(含)以下且累計未入帳餘額未達等值USD500元(含)以下者，得免徵保證人","申請人得為本行存款往來戶及非本行客戶","應徵取「申請買入/代收外幣票據約定書」","有徵提保證人時，應確認保證人是否為受監護、受輔助宣告之人"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"第五節買入暨代收外幣票據一、第一次受理應辦手續(一)申請人須<mark>為本行存款往來戶</mark>。(二)保證人之提徵1.單筆票據金額在等值USD300元(含)以下者，且累計未入帳餘額未達等值USD500元(含)以下者，得免徵保證人。"},"x":"代收外幣票據之申請人<b>須為本行存款往來戶</b> → (B)「非本行客戶亦可」錯。"},{"id":"112-29","y":112,"n":29,"m":4,"q":"辦理國外匯出匯款業務，倘匯款金額達等值","o":["新臺幣 50 萬元","新臺幣 100 萬元","美金 50 萬元","美金 100 萬元 (含)以上時，須由另一位主管於水單上之「大額覆核主管」欄位蓋章核准"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"(二)覆核人員(須有6個月以上相關外匯業務經歷，倘其未有外匯系統交易暨查詢權限，應依外匯篇第一章第一節規範辦理外匯覆核人員派任作業，且不受各項職務兼職查詢表之規範)應將水單內容與匯出匯款申請書及傳票相互核對，倘核對無誤，於水單之「覆核<mark>」欄位蓋章</mark>後，送請外匯主管放行(外匯主管及覆核人員逐頁覆核及蓋章確認，惟免蓋騎縫章);倘覆核人員核對發現鍵入資料有誤，應將該筆資料送請外匯經辦人員辦理更正，此時外匯經辦執行「匯出資料輸入」(代號R111)辦理更正後，再將水單等匯款文件送請覆核人員覆核。覆核人員應由執行「匯出資料輸入」(代號R111)以外之經辦或主管人員辦理，且覆核人員不得兼任放行主管或<mark>「大額覆核主管」</mark>；倘匯出匯款金額達等值<mark>美金100萬元(含)以上時，</mark>需再<mark>由另一位主管於水單之「大額覆核主管」欄位蓋章核准</mark>。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第32頁","v":32,"t":"受理本行客戶以新臺幣現金結匯<mark>辦理國外匯出匯款達等值美金1</mark>萬元者，應於「<mark>匯出匯款</mark>申請書」空白處註記現金來源及合理性，於必要時，應請客戶提供相關佐證資料，經外匯經辦、外匯主管及防制洗錢及打擊資恐督導主管蓋章確認後辦理。受理個人臨櫃辦理時，<mark>金額達等值</mark>新臺幣50萬元(含)以上(含原幣匯出或新臺幣結購匯出)時，應以「臨櫃作業關懷客戶提問表」與客戶交談了解其匯款對象與目的有無異常，並由經辦將訪談結果填寫於本表。<mark>匯款金額達等值</mark>新臺幣50萬元(含)以上，應另填寫「虛擬通貨匯兌業務案件審查表」確認交易有無異常。"}},{"id":"112-30","y":112,"n":30,"m":4,"q":"有關第ｅ個網「外幣匯出款」服務功能，下列敘述何者錯誤？","o":["客戶可執行即時匯款","客戶可執行單筆預約及週期性預約匯款","週期性預約匯款之匯款日期區間最長限為次日(含)起至 1 年內","為便利客戶規劃外幣款項匯出時程，倘該筆預約尚未執行過交易，可辦理「變更」"],"a":2,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"附錄9-1-1 外匯業務自動化服務項目一覽表","t":"功能通路第e金網第e個網第e行動iLEOAPP電話語音ATM外幣匯款外幣匯出款✓(即時/預約/週期性)✓(即時/預約/週期性)✓(即時/預約)✓(即時/預約)XX⚫時間：1.匯他行：營業日09:10~16:00"}},{"id":"112-31","y":112,"n":31,"m":4,"q":"第ｅ個網(含行動銀行)約定轉入「本行外幣帳號(他人)」及「國外匯出匯款受款人(含同戶名/不同戶名)」之服務生效時間為約定後","o":["立即生效","次 1 日生效","次 2 日生效","次 5 日生效"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-3-3 第一商業銀行辦理 DBU 人民幣外匯業務作業應注意事項","t":"5850)辦理資料建檔，該項申請於次營業日生效。C.外匯活期存款定期定額結購業務之變更與終止，應由客戶填具申請書辦理，於核對親簽及存款印鑑無誤後，據以執行「定期定額結購外匯存款約定」交易(代號5850)，該項變更及終止，於申請之次營業日生效。(7)報表"},"x":"網銀約定轉入他人外幣帳號及國外匯出受款人：約定後<b>次 2 日</b>生效（防詐延遲生效）。","lo":1},{"id":"112-32","y":112,"n":32,"m":6,"q":"本行得受理下列何種對象於 OBU 開立外幣帳戶？","o":["持有日本護照且於國內有住所之自然人","以公司名義依香港當地法律登記之合夥事業體","依本國法令設立之公司且與本行有 OBU 授信業務往來需求者","以上皆非"],"a":2,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(二)受理對象:<mark>與本行有OBU授信業務往來</mark>之中華民國境內法人。(三)本帳戶之首筆資金應為授信撥入之資金，惟授信方式屬貿易融資或保證等間接授信者，不在此限。帳戶業務別為「86」，帳號第六碼為「7」，屬多幣別帳戶，不掣發存摺，所有交易受理行限原開戶行，同一客戶於同一分行僅得開立一戶授信目的帳戶，且第e金網僅得申請「查詢服務」。"},"x":"OBU 授信目的帳戶受理對象為<b>與本行有 OBU 授信業務往來之中華民國境內法人</b> → (C)。"},{"id":"112-33","y":112,"n":33,"m":6,"q":"本行外匯定期存款中途解約之相關規定，下列何者正確？","o":["存期未滿 1 個月者，中途解約不予計息","存期未滿 1 個月者，應於到期 1 日前通知本行","存期 1 個月以上者，應於到期 5 日前通知本行","存滿 1 個月期以上者，中途解約按實存期間單利計息，但不包括不足整月之零星日數"],"a":0,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"(二)未滿一個月期<mark>者，中途解約不予計息</mark>。(三)一個月期(含)以上者，其計息期間及利率依其期別以起存日本行牌告利率為準，按下列方式計算："},"x":"外匯定存<b>未滿一個月期者，中途解約不予計息</b> → (A)正確。"},{"id":"112-34","y":112,"n":34,"m":7,"q":"有關外匯業務臨櫃關懷措施，下列敘述何者錯誤？","o":["倘客戶為受監護或輔助宣告之人，應由監護人或輔助人簽章同意後始得辦理","受理20 歲客戶辦理外存交易時，應主動告知可能產生之匯兌及利率風險，並經其法定代理人同意後始得辦理","倘發現客戶遺忘自己姓名或言辭反覆時，應判斷其是否屬失智者或疑似失智者","視覺障礙者辦理外匯業務，應請見證人協助閱讀相關申請表單"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(九)因應民法業已將成年人年齡下修至18歲，考量年輕族群或對於外匯業務較不熟稔，倘受理該等<mark>客戶辦理外</mark>幣存款<mark>時，應主動告知</mark>並提醒日後兌換為新台幣或其他外幣<mark>可能產生之匯兌</mark>風險及利率波動風險。"},"x":"成年年齡已下修至 <b>18 歲</b>，20 歲客戶屬成年人，只需主動告知匯兌及利率風險，<b>無須法定代理人同意</b> → (B)錯。"},{"id":"112-35","y":112,"n":35,"m":1,"q":"除信用狀另有規定外，UCP600 規範下列何種單據無須簽署？","o":["海運提單","商業發票","航空運送單據","保險單據"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"3.<mark>商業發票</mark>上所載明之貨物名稱、數量、單價、種類、嘜頭、交易契約之號碼及日期等應符合信用狀條款與信用狀統一慣例之規定。4.<mark>除信用狀另有規定外，商業發票</mark>須由受益人簽發並以信用狀申請人為抬頭人，所記載之船名、起運港、卸貨港、目的地等應與運送單據不相牴觸。"},"x":"UCP600 第18條(a)：商業發票須由受益人簽發、以申請人為抬頭、幣別同信用狀，<b>無須簽署</b>（除信用狀另有規定）；運送單據、保險單據則須簽署。網路資料僅取得條文目錄，條文內容依 ICC 原文。","lo":3,"web":[{"t":"ICC Academy：UCP 600","u":"https://academy.iccwbo.org/ucp-600"},{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"}]},{"id":"112-36","y":112,"n":36,"m":1,"q":"依據UCP600規範，下列敘述何者正確？","o":["信用狀未標明可轉讓時，仍可依受益人之請求辦理轉讓","即使信用狀未明確表示是否可撤銷，信用狀仍應視為不可撤銷","信用狀規定之最遲裝運日適逢非銀行營業日時，可順延至次一營業日","開狀銀行決定拒絕兌付或讓購時，倘以多次通知提示人時，應以最後一次通知為準"],"a":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第三節 進口信用狀之修改","t":"第三節進口信用狀之修改本行受理進口商委任開發之信用狀均<mark>為不可撤銷</mark>之信用狀，實務上<mark>不可撤銷</mark>信用狀基於進出口商雙方之需要以及其他商務上之理由，常有修改之必要；惟此種修改應經所有利害關係人全體之同意始生效力，故對信用狀受益人不利之修改，應特別注意並向申請人說明。若接到國外拒絕接受修改之通知時，應即以書面通知申請人。"},"x":"UCP600 第 3 條：信用狀即使未表明是否可撤銷，<b>視為不可撤銷</b>；未標明可轉讓者不得轉讓；最遲裝運日不得順延。"},{"id":"112-37","y":112,"n":37,"m":1,"q":"除信用狀另有規定外，下列何種保險單據將被銀行視為瑕疵？","o":["含有不承保條款之註記","表明承保範圍適用免賠額或僅賠超額","保險金額之幣別與信用狀幣別不同","承保生效日期早於運送單據之裝運日期"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"3.保險單內所開列之貨物名稱、嘜頭、件數、起運港、轉運港、卸運港、目的地、船名等與運送單據及發票等核對不可牴觸。4.保險單之被保險人應依信用狀指示。信用狀未明確規定被保險人時，保險單之被保險人不應為信用狀開狀銀行或申請人以外之主體，但提示已由被保險人背書(得為空白背書或背書予開狀銀行或申請人)之保險單，可接受。另保險單得表明其承保範圍適用免賠額或僅賠超額（扣除免賠額）。"},"x":"保險單上所表示之貨幣<b>必須與信用狀相同</b>，不同即屬瑕疵；免賠額條款則可接受 → (C)。"},{"id":"112-38","y":112,"n":38,"m":2,"q":"有關「進/出口託收客戶調查表」之填製規定，下列敘述何者正確？","o":["不論是否為本行之授信客戶皆須填寫","每次辦理託收業務時皆須填寫","倘客戶基本資料有重大變動事項時，應重新填寫","調查表應併同相關佐證文件自填表日起保存半年"],"a":2,"ci":{"b":"外匯篇","c":"第三章 受理出口託收作業應注意事項","s":"第二節 受理出口託收應辦手續","t":"(一)填寫頻率：1.於2019/9/2後首次受理進、出口託收業務時填寫。2.<mark>客戶基本資料</mark>變動(如:變更戶名、負責人或<mark>有重大變動事項</mark>等)<mark>時，應重新填寫</mark>。"},"x":"「進/出口託收客戶調查表」於首次受理時填寫，<b>客戶基本資料重大變動時應重新填寫</b> → (C)正確。"},{"id":"112-39","y":112,"n":39,"m":2,"q":"進口承兌交單(D/A)，匯票到期日以 AFTER DATE 規定者，應以何日為起算日？","o":["匯票之發票日","提單簽發日","商業發票簽發日","匯票之承兌日"],"a":0,"ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第二節 承兌交單（D/A）之處理","t":"B/LDate規定者，自提單(B/L)之裝船日起算；以AfterDate規定者，自<mark>匯票之發票日</mark>起算。"},"x":"D/A 匯票：After sight 自承兌日起算；After B/L date 自裝船日起算；<b>After date 自匯票之發票日</b>起算。"},{"id":"112-40","y":112,"n":40,"m":1,"q":"客戶提示買方開立之信用狀，於進口授信額度內申請轉開國外信用狀，下列敘述何者錯誤？","o":["原始信用狀所列之有關對象、國家及港口/機場亦應納入防制洗錢及打擊資恐審查項目","由限制外匯業務往來國家之銀行開立的原始信用狀，本行不受理轉開申請","原始信用狀之開狀行不得為本行之授信利害關係人","應於原始信用狀背面註明轉開信用狀之日期、號碼、金額及原始信用狀餘額"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第九節 三角貿易案件之處理","t":"(五)以國外匯入款申請轉開國外信用狀者，得不受上述條款之限制。(六)<mark>應於原始信用狀</mark>正本正面註明，<mark>轉開信用狀日期、號碼、金額及原始信用狀餘額</mark>並加蓋私章。"},"x":"應於原始信用狀正本<b>正面</b>註明轉開日期、號碼、金額及餘額並加蓋私章，非背面 → (D)錯。"},{"id":"112-41","y":112,"n":41,"m":2,"q":"辦理擔保提貨後，本行應於何時向船公司辦理解除擔保責任？","o":["待船公司電話通知本行","進口商結匯還款後","客戶提貨驗收後","正本提單到達時"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第六節 副提單背書及擔保提貨之處理","t":"三、擔保提貨(一)客戶於接到船公司到貨通知而正副提單均未到達時，得申請「擔保提貨」；惟提貨後，不得以任何理由要求拒付。(二)辦理擔保提貨時，應備齊下列書類："},"x":"擔保提貨於正副提單均未到達時申請；嗣<b>正本提單到達</b>時，應以正本提單向船公司換回擔保提貨書、解除擔保責任。"},{"id":"112-42","y":112,"n":42,"m":1,"q":"可轉讓信用狀在PARTIAL SHIPMENT ALLOWED情況下，下列何者為真？","o":["第一受益人只能轉讓給一個第二受益人","第一受益人可轉讓給一個以上之第二受益人","第二受益人只能轉讓給一個第三受益人","第二受益人可轉讓給一個以上之第三受益人"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"(七)營業單位於接獲<mark>第二受益人</mark>押匯文件時，應立即通知換單信用狀轉讓之申請人（<mark>第一受益人</mark>）來行辦理換單作業，並得依據本行現行出口押匯（貼現）款項之墊付規定，墊付第一、<mark>二受益人</mark>兩發票間之差額，惟應注意下列事項："}},{"id":"112-43","y":112,"n":43,"m":1,"q":"受理申請出口押匯時應辦之手續，下列敘述何者正確？<br><span class=\"it\">A.</span> 倘客戶與本行無授信往來，「出口押匯約定書」僅須加蓋本行得核對之印鑑<br><span class=\"it\">B.</span> 客戶負責人變更時，毋須重徵「簽章登記卡」<br><span class=\"it\">C.</span> 申請更換出口業務往來印鑑時，應重徵「簽章登記卡」","o":["AB","AC","C","ABC"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第一節 受理申請出口押匯/貼現之處理","t":"2.<mark>簽章登記卡</mark>(出20)(1)「客戶名稱」欄：原則上，使用與<mark>授信往來</mark>「印鑑卡」同一式印鑑；<mark>倘客戶與本行</mark>尚<mark>無授信往來</mark>者，可使用<mark>本行得核對之印鑑</mark>，惟嗣後該<mark>戶與本行</mark>開始<mark>授信往來時，應重徵「簽章登記卡」</mark>且改用<mark>授信往來</mark>同一印鑑。倘<mark>客戶負責人變更時，須重徵「簽章登記卡」</mark>，惟在法人主體未變更下，對於已徵妥之<mark>出口押匯約定書</mark>(出19)得免重新徵提。(2)「印鑑式樣」欄：使用<mark>客戶與本行</mark>外匯<mark>業務往來</mark>之約定印鑑。(3)<mark>簽章登記卡</mark>應於印鑑暨影像管理系統辦理印鑑拍攝作業，倘<mark>申請更換印鑑時，應重徵「簽章登記卡」</mark>及徵取「存戶更換印鑑/戶名/代表人申請書」(存049)等相關證明文件，並辦理更換後之印鑑拍攝作業。"}},{"id":"112-44","y":112,"n":44,"m":1,"q":"倘信用狀未規定單據提示期間，而要求提示之單據含一份以上依循 UCP600第19~25條規定之正本運送單據者，則單據提示日期不得遲於裝運日後___且須在信用狀有效期限內提示。","o":["5 個曆日","5 個銀行營業日","21 個曆日","21 個銀行營業日"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"Board字樣及日期，始得視為貨物業已裝船。(13)即使信用狀禁止轉運，下列情況之提單將予接受：○1表明貨物將轉運或可能轉運，但該運送全程係由同一提單涵蓋者。○2若提單表示貨物已裝運於貨櫃、拖車及或子母船中之子船中，表明將轉運或可能發生轉運之提單。(14)提單上含有敘明運送人保留轉運權利之條款者，不予理會。(15)注意提單<mark>提示日期</mark>是否<mark>在信用狀</mark>規定之提示期限內，<mark>倘信用狀未規定</mark>提示期限者，而規定<mark>提示之單據含一份</mark>或<mark>一份以上依循UCP600第19</mark>條至第<mark>25條規定之正本運送單據者，則</mark>提單之<mark>提示日期不得遲於裝運日後</mark>21曆日<mark>且須在信用狀有效期限內</mark>（有關<mark>有效期限</mark>之限制，請參閱U.C.P.<mark>600第1</mark>4(C)條之規定）。(16)部分裝運之認定：○1提示多套提單，但顯示係由同一運輸工具起運且以同一航次裝運者，如表明同一目的地，將不認定係部分裝運，縱使提單上表明不同之裝運日或不同裝載港、接管地或發送地者亦然，並以任一"},"x":"信用狀未規定提示期間者，含正本運送單據時，提示不得遲於裝運日後 <b>21 曆日</b>且須在有效期限內。"},{"id":"112-45","y":112,"n":45,"m":1,"q":"依本行收費標準，出口押匯息之計息天數：香港地區之港幣、新加坡地區之新加坡幣、日本地區之日圓，均按出口押匯金額計收___天之利息；其他地區不分幣別，按出口押匯金額計收___天之利息。","o":["7，12","5，7","10，12","5，12"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第三節 出口押匯/貼現各項利息及費用之計收","t":"(三)<mark>出口押匯息</mark>：1.<mark>計息天數：香港地區之港幣、新加坡地區之新加坡幣、日本地區之日圓，均按出口押匯金額計收</mark>七<mark>天之利息；其他地區不分幣別，按出口押匯金額計收</mark>十二<mark>天之利息。</mark>"},"x":"出口押匯息：港幣（香港）、新加坡幣（新加坡）、日圓（日本）計收 <b>7 天</b>；其他地區計收 <b>12 天</b>。"},{"id":"112-46","y":112,"n":46,"m":1,"q":"未經國外拒付之出口信用狀案件，倘逾越押匯日起___天(出口押匯)或匯票到期日起___天(出口貼現)以上仍未入帳時，應比照拒付案件逐筆填製「出口押匯拒付整理日誌」，並送外匯營運處辦理出口拒付案件電腦建檔。","o":["60，90","90，60","21，30","30，60"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第六節 出口押匯/貼現遲延入帳之處理","t":"二、對於<mark>逾越押匯日起</mark>九十<mark>天(出口押匯)或匯票到期日起</mark>六十<mark>天(出口貼現)以上仍未入帳</mark>之案件，除應檢附本行向國外銀行拍發之催收函(電)影本，再函請出口商儘速解決外，並<mark>應比照拒付案件逐筆填製「出口押匯拒付整理日誌」</mark>（註明逾期未入帳），詳載有關案情始末，呈單位主管核閱，同時將案件<mark>送外匯營運處</mark>外匯作業部<mark>辦理出口拒付案件電腦建檔</mark>，以利追索處理與管理。"},"x":"逾越押匯日起 <b>90 天</b>（出口押匯）或匯票到期日起 <b>60 天</b>（出口貼現）未入帳，比照拒付案件辦理。"},{"id":"112-47","y":112,"n":47,"m":2,"q":"依 URC522 規定，以下何者為託收業務之當事人？<br><span class=\"it\">A.</span> 委託人<br><span class=\"it\">B.</span> 託收/代收銀行<br><span class=\"it\">C.</span> 提示銀行<br><span class=\"it\">D.</span> 保險公司","o":["僅 AB","ABC","僅 A","ABCD"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十四節 信用狀通知業務","t":"3.<mark>代收銀行</mark>(CollectingBank)：接受託收銀行之委託而處理其託收指示的銀行。4<mark>.提示銀行</mark>(PresentingBank)：向付款人辦理提示單據之<mark>代收銀行</mark>。就實務上而言，<mark>提示銀行</mark>通常與<mark>代收銀行</mark>為同一銀行。"},"x":"URC522 第3條託收當事人：委託人（principal）、託收銀行（remitting bank）、代收銀行（collecting bank）、提示銀行（presenting bank）；付款人為受提示者；保險公司非當事人 → ABC。","lo":3,"web":[{"t":"Trade Finance Global：URC 522 Explained","u":"https://www.tradefinanceglobal.com/letters-of-credit/urc-522-eurc/"}]},{"id":"112-48","y":112,"n":48,"m":8,"q":"有關進口商於本行開狀並辦理新臺幣遠匯訂約，下列敘述何者不正確？","o":["倘客戶提示之交易文件約定以信用狀方式付款，應待實際開狀後始得辦理訂約","倘為到單前訂約且不向本行辦理融資，遠匯最晚到期日可至信用狀有效日","倘為到單後訂約並將於本行辦理融資，遠匯最晚到期日不得逾「進口單據到達通知書」上之到期日","倘為到單前訂約且將於本行辦理融資，訂約文件應徵提「進口單據到達通知書」及國外押匯提示之發票及相關交易文件"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"5.<mark>「進口單據到達通知書」</mark>載有單據瑕疵者，應先行通知客戶單據瑕疵內容，並請客戶於收到該通知書後立即於<mark>「進口單據到達</mark>聲明書」上表示是否接受該瑕疵單據，以利外匯作業中心於收到單據五個銀行營業日內向<mark>國外押匯</mark>銀行提出有利於本行及進口商權益之主張。"}},{"id":"112-49","y":112,"n":49,"m":8,"q":"同一客戶辦理新臺幣遠期外匯，單日訂約金額累計達等值___萬美元者須電話通報央行；單日訂約金額累計達等值___萬美元者須傳真通報央行。","o":["200，500","100，200","500，100","50，100"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"營業日中午12:00之傳送、更正或刪除視為逾時，相關作業請參考二、說明。2.電話通報：(1)辦理新臺幣遠匯當日訂約金額累計達200萬美元者，應於確認交易實需證明文件後，最遲於議價當日下午4:30前將相關交易內容先以電話通報央行外匯局稽核科(電話：02-23571200、1209、1144)。(2)通報內容包含：受理銀行、客戶名稱、預購/預售、訂約金額、到期日、遠期匯率及換匯點。(通報交易買賣方向應以客戶角度為之，換匯點最多報至小數點後第5位即可)(3)展期案件無需電話通報。"},"x":"新臺幣遠匯當日訂約累計達 <b>200 萬美元</b>須於 16:30 前電話通報；達 <b>500 萬美元</b>須傳真通報央行外匯局。"},{"id":"112-50","y":112,"n":50,"m":8,"q":"大額新臺幣遠期外匯傳真通報央行，下列敘述何者正確？<br><span class=\"it\">A.</span> 於展期日傳真<br><span class=\"it\">B.</span> 傳真後須再去電央行確認<br><span class=\"it\">C.</span> 同份 COVER 資料不可分次傳真<br><span class=\"it\">D.</span> 無須傳真「遠匯/換匯(SWAP)傳真資料 COVER」","o":["C","AB","AC","BD"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"2.電話通報：免辦理。3.<mark>傳真通報</mark>：(1)「訂約」案件每筆達等值100萬美元應於完成「即期端」實質交割當日下午6：30前，依序將①<mark>「遠匯/換匯傳真資料COVER」</mark>(請正楷填寫)、②「即期端交割水單」及③「外匯收支或交易申報書」(應註明換匯交易或<mark>SWAP)</mark>排好並編妥頁碼(頁次/總頁數)後一次傳真至央行外匯局(傳真號碼:02-23936152)。(2)傳真時應確認文件是否依序正確擺放(勿上下顛倒混放)，倘為雙面文件，請先影印成單面再傳真；同一筆交易之文件請一次撥號連續傳真完畢，勿<mark>分次傳真</mark>，或一次傳真多份文件，傳真後「無須」去電確認，請注意傳真機訊號確認是否傳送成功。(3)「展期」案件無需<mark>傳真通報</mark>。"},"x":"傳真時同一筆交易文件應<b>一次撥號連續傳真完畢，勿分次傳真</b> → 僅 C 正確。"},{"id":"112-51","y":112,"n":51,"m":8,"q":"申請新臺幣遠期外匯額度，下列何者無營業單位經理權限？","o":["公司","行號","團體","個人"],"a":3,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第四節 額度申請流程及核給原則","t":"<mark>2.個人：無經理權限</mark>。"},"x":"新臺幣遠匯額度經理權限：公司、行號、團體最高美金 30 萬元；<b>個人無經理權限</b>。"},{"id":"112-52","y":112,"n":52,"m":4,"q":"受理客戶辦理國外匯兌交易，下列何種情形不得以 EDD 審查表取代徵提交易文件？","o":["中風險客戶單筆匯出 3 仟歐元至本人於高風險國家之同戶名帳戶","特定高風險客戶收到一筆來自一般國家匯入 500 美元","中風險客戶單筆匯出 1 萬美元至越南，受款人為其會計師財報揭露之交易對象","一般高風險客戶單筆匯出 1 仟美元至高風險國家"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"2.中低<mark>風險客戶</mark>匯往(來自)本行位於<mark>高風險國家</mark>之海外分行案件，符合交易審查表免徵文件適用情形第7項，且檢視項目皆勾選「是」者，無論金額大小，得免向客戶徵提交易文件，僅需透過交易審查表辦理評估作業；<mark>高風險客戶</mark>一律徵提交易證明文件。"},"x":"中低風險客戶符合免徵情形者得以交易審查表替代；<b>高風險客戶一律徵提交易證明文件</b> → (D)。"},{"id":"112-53","y":112,"n":53,"m":10,"q":"下列哪些客戶須逐筆徵取「主動申購投資組合商品聲明書」始得辦理交易？<br><span class=\"it\">A.</span> 最近一年內於本行辦理投資組合商品交易筆數低於 5 筆 B.65 歲(含)以上客戶<br><span class=\"it\">C.</span> 教育程度國中(含)以下<br><span class=\"it\">D.</span> 領有全民健康保險重大傷病證明之客戶","o":["僅 CD","僅 BD","僅 BCD","ABCD"],"a":3,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第二節 推介作業限制及應注意事項","t":"1<mark>.最近一年內於本行辦理投資組合商品交易筆數低於5筆</mark>。2<mark>.教育程度國中(含)以下</mark>。3<mark>.領有全民健康保險重大傷病證明之客戶</mark>者。"},"x":"須逐筆徵取主動申購聲明書：最近一年交易少於 5 筆、65 歲以上高齡、國中以下教育程度、領有重大傷病證明 → ABCD。"},{"id":"112-54","y":112,"n":54,"m":9,"q":"除專業機構投資人及高淨值投資法人外之其他法人客戶，倘向本行申請衍生性金融商品額度，其衍生性 KYC 作業下列敘述何者不正確？","o":["應於每次額度申請前完成KYC 作業","KYC 有效期限一律為「KYC 評估日+1 年」","KYC 評估日期與額度申請日期不得逾 2 個月(不含)","客戶最新一筆 KYC 之評估人員不得為該客戶承作交易之推介人員或業務人員(TMO)"],"a":1,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"2.<mark>有效期限</mark>：同「額度到期日」。已完成KYC、但額度尚未獲核准前，暫以<mark>「KYC評估日+1年」</mark>為有效日期，俟額度核准後，分行以「衍生性金融商品額度核准變更啟用檢核表暨通知單」及額度批覆書傳真或EMAIL通知金融行銷部，由金融行銷部至系統修改<mark>KYC有效</mark>日期為額度到期日。"},"x":"衍生性 KYC 有效期限<b>同額度到期日</b>；額度核准前才暫以「評估日＋1 年」→ (B)「一律」錯。"},{"id":"112-55","y":112,"n":55,"m":10,"q":"下列有關「雙元貨幣投資組合商品(DCI)」之敘述，何者有誤？","o":["商品架構為外幣定存連結賣出匯率選擇權之投資組合商品","DBU個人戶承作本商品之收益應併入綜合所得稅課稅","商品特點為「保息不保本」","一般客戶僅得承作 3 個月期(含)以內且保本率至少 70%之交易"],"a":1,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第三節 單筆式商品","t":"第八章投資組合商品8-9第三節單筆式商品一、雙元貨幣投資組合商品(DCI)(一)商品介紹：1.商品架構：外幣定期存款連結賣出匯率選擇權之投資組合商品；將賣出選擇權的權利金(premium)收入年化，再加上外幣定存利率，二者合計即為雙元貨幣投資組合商品(DualCurrencyInvestment，簡稱DCI)之年化收益率。"},"x":"DCI 為外幣定存連結賣出匯率選擇權；DBU 個人戶之收益屬<b>分離課稅</b>（不併入綜所稅）→ (B)錯。"},{"id":"112-56","y":112,"n":56,"m":9,"q":"客戶承作下列哪項交易，不占用衍生性金融商品額度？","o":["賣出選擇權","利率交換","買入選擇權","換匯"],"a":2,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第三節 匯率選擇權","t":"3.<mark>客戶承作</mark>「賣出」選擇權交易係為結清其原持有之「買入」選擇權部位者，該「賣出」選擇權<mark>不占用衍生性金融商品額度</mark>。(六)交易對象"},"x":"客戶<b>買入選擇權</b>僅支付權利金、無履約義務，不占用衍生性商品額度；賣出選擇權（結清原買入部位者除外）、利率交換、換匯皆占用。"},{"id":"112-57","y":112,"n":57,"m":10,"q":"交易雙方同意在一特定期間、依議定條件，交換兩種不同幣別的本金及其所衍生之利息支出，此交易稱為","o":["利率交換","換匯交易","換匯換利","匯率選擇權"],"a":2,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第五節 利率交換暨換匯換利","t":"(二)<mark>換匯換利</mark>（CrossCurrencySwap,CCS）：<mark>換匯換利</mark>交易是指<mark>交易雙方同意在一特定期間、依議定條件，交換兩種不同幣別的本金及其所衍生之利息支出</mark>。本金部分期初、期末皆可依雙方之議定，選擇交換或不交換，惟如涉及新臺幣案件，僅得承作期初及期末本金皆交換之交易。利率部分，交換的型態則可分為：固定利率交換固定利率、固定利率交換浮動利率、浮動利率交換浮動利率等。"},"x":"交換兩種不同幣別之<b>本金及利息</b>＝換匯換利（CCS）；涉及新臺幣者期初、期末本金皆須交換。"},{"id":"112-58","y":112,"n":58,"m":10,"q":"客戶承作投資組合商品交易，下列敘述何者為非？","o":["受理脆弱族群客戶承作募集式投資組合商品，應至少每年辦理 1 次「脆弱族群交易弱點檢核表」","除高資產客戶外，客戶年齡介於 65 歲(含)至 85 歲(不含)者，其承作保本型組合式商品之期限最長不超過 3 年","客戶年齡 85 歲(含)以上者，僅得承作期限為 3 個月(含)以內之商品","推介人員不得勸誘客戶以融資方式取得資金承作投資組合商品"],"a":0,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第二節 推介作業限制及應注意事項","t":"(一)<mark>脆弱族群交易弱點檢核表</mark>1.<mark>受理脆弱族群客戶承作</mark>交易前，營業單位應就所能蒐集、觀察或詢問之範圍內瞭解客戶之健康情況、日常生活事件、財務狀況、教育程度及取得金融服務資訊能力等事項，評估其承作<mark>投資組合商品</mark>之之妥適性，並儘可能徵取佐證資料後，填寫<mark>「脆弱族群交易弱點檢核表」</mark>，針對該類客戶之弱點與財務特性及所擬推介商品之特殊風險事項，確認商品確實適合<mark>客戶承作</mark>。"}},{"id":"112-59","y":112,"n":59,"m":9,"q":"客戶承作天期超過 1 年之隱含賣出選擇權之匯率類衍生性商品，該筆交易前應徵提交易保證金金額為契約名目本金的百分之幾？","o":["5","3","2","1"],"a":0,"ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"十一、「高風險衍生性金融商品」額度：<mark>客戶承作</mark>商品包括「複雜性高風險商品」或「<mark>隱含賣出選擇權之匯率類</mark>商品」，應於「高風險衍生性金融商品額度」欄位輸入金額，並於申請條件中載明得承作之商品範圍，如：「限承作1年期(含)以下陽春型匯率選擇權」、「限承作1年期(含)以下陽春型及<mark>隱含賣出</mark>附加條件之匯率選擇權」、"},"x":"隱含賣出選擇權之匯率類商品天期超過 1 年 → 交易前徵提名目本金 <b>5%</b> 保證金。","lo":1},{"id":"112-60","y":112,"n":60,"m":10,"q":"有關匯率選擇權之敘述，下列何者有誤？","o":["自然人限承作買入選擇權","歐式選擇權係指買方只能在合約到期日行使權利","選擇權買方有要求賣方履約的權利，買方最大風險為損失已支付的權利金","選擇權賣方有履約的義務，最大風險為損失已收取的權利金"],"a":3,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第六節 利率選擇權","t":"一、定義係指本行與客戶共同簽訂契約，由選擇權買方支付權利金予賣方，取得於未來特定到期日或期間內，得要求<mark>選擇權賣方</mark>以雙方約定之履約價格履約。利率選擇權交易中，買方因支付權利金而獲取要求賣方履約的權利，交易最大的損失為權利金，而賣方則因收取權利金而須承擔選擇權<mark>履約的義務，</mark>交易最大的損失恐將無限大。"},"x":"選擇權賣方因收取權利金須承擔履約義務，<b>最大損失恐將無限大</b>，非僅權利金 → (D)錯。"},{"id":"113-1","y":113,"n":1,"m":7,"q":"本行客戶持非本行賣出之外幣現鈔辦理收兌，金額超過等值美金多少萬元(含)以上者，一律採「託收」方式辦理？","o":["1","3","5","10"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"件留存備查。五、收兌(含原幣存入)<mark>外幣現鈔</mark>作業(一)受理流程1.受理金額限制:(1)<mark>本行賣出</mark>：得憑本行賣匯水單於原結購金額限額內兌換，並於原賣匯水單顧客聯上註明收兌日期及兌換金額。(2)<mark>非本行賣出</mark>A.<mark>本行客戶</mark>：a.個人戶：每日臨櫃受理之收兌金額最高以<mark>等值美金</mark>3萬元為限，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。b.公司戶：每日臨櫃受理之收兌金額最高以<mark>等值美金</mark>5萬元為限，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。c.收受<mark>超過等值美金</mark>10<mark>萬元(含)以上者，一律採「託收」方式</mark>處理，收取託收手續費，並將「<mark>外幣現鈔</mark>託收申請書」影本、適用表單年齡級距"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第36頁","v":40,"t":"•<mark>外幣現鈔</mark>收兌額度分級管理<mark>本行賣出</mark>者：得憑本行賣匯水單於結購金額內兌換。<mark>非本行賣出</mark>者：A.<mark>本行客戶</mark>:a.每日臨櫃受理之撥款額度：個人戶<mark>等值美金</mark>3萬元，公司戶<mark>等值美金</mark>5萬元，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。b.收受<mark>超過等值美金</mark>10萬元(含)以上者，<mark>一律採託收方式</mark>處理，收取託收手續費，並將「<mark>外幣現鈔</mark>託收申請書」影本、票號留存聯(請客戶簽章)，連同全數現鈔送交資金母行，俟現鈔供應行驗証真偽無誤後始得入帳。"},"x":"依講義〈2026外匯業務法規與實務〉第36頁：「b.收受超過等值美金10萬元(含)以上者，一律採託收方式處理，收取託收手續費，並將「外幣現鈔託收申請書」影本、票號留存聯(請客戶簽章)，連同全數現鈔送交資金母行，俟現鈔供應行驗証真偽無誤後始得入帳。」"},{"id":"113-2","y":113,"n":2,"m":8,"q":"有關新臺幣遠期外匯業務，營業單位經理權限風險額度於公司及個人分別最高各為美金多少萬元？","o":["30，0","30，3","400，0","400，40"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第四節 額度申請流程及核給原則","t":"(一)<mark>營業單位經理權限風險額度</mark>：1.公司、行號及團體：最高美金參拾萬元。2.個人：無<mark>經理權限</mark>。(二)逾<mark>營業單位經理權限</mark>之<mark>風險額度</mark>：對於超過前項規定之案件，各<mark>營業單位經理</mark>於審酌客戶之資產負債及信用情形等因素後，認為確有承做之必要者，得專案向外匯營運處申請核"},"x":"新臺幣遠匯經理權限風險額度：公司、行號及團體最高<b>美金 30 萬元</b>；<b>個人無經理權限</b> → 30、0。"},{"id":"113-3","y":113,"n":3,"m":1,"q":"除信用狀另有規定外，銀行將不接受下列何種提單？","o":["提單上記載“託運人自行裝貨點數”(Shipper’s Load and Count)","以傭船契約上之條款為準而簽發之提單","提單表明以信用狀受益人以外之人為貨物發貨人","提單上敍明貨物可能裝載於甲板上之條款"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"稱貨物及/或其包裝有瑕疵情況者。(8)提單必須顯示已表明運送人（Carrier）名稱且由運送人、船長（Master）或其標名代理人（Agent）所簽署。運送人或船長之任何簽字，須依各該情形表明為運送人或船長；代理人之任何簽字須表明係代替或代表運送人或船長簽署。(9)除信用狀另有規定外，不得接受<mark>傭船契約</mark>（CharterParty）以及<mark>以傭船契約上之條款為準而簽發之提單</mark>。(10)提單未表明信用狀敘明之裝載港為裝載港，或若提單有關裝載港含“預定”或類似保留用語之表述，須於提單上以裝載註記(onboardnotation)表明信用狀敘明之裝載港、裝運日期及船舶名稱。即使提單以預先印定措辭表明已裝載或已裝運於標名船舶上之情形，本規定亦適用。(11)提單格式印定類似下列文句者為備運提單（ReceivedForShipmentB/L）○1Receivedinapparentgoodorderandconditionsexceptas"},"x":"除信用狀另有規定外，<b>不得接受傭船契約及以傭船契約條款為準而簽發之提單</b> → (B)。"},{"id":"113-4","y":113,"n":4,"m":1,"q":"除信用狀另有規定外，有關航空運送單據之敘述，下列何者為非？","o":["航空運送單據係一種權利證券，得據以背書轉讓","得表明貨物將轉運或可能轉運，但以運送全程係由同一航空運送單據所涵蓋者為條件","出口商不必背書","應表明簽發日"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(1)<mark>航空運送單據係一種</mark>收據，並非<mark>權利證券，</mark>不<mark>得據以背書轉讓</mark>，故承做押匯時，宜多加注意，並依客戶信用情形審慎辦理。(2)須顯示表明運送人名稱，並經運送人或其標名代理人簽署，且運送人或代理人之任何簽字須表明其為運送人或代理人。為運送人簽字之代理人亦必須表明其係代替或代表運送人簽署。(3)得表明貨物將轉運或可能轉運，但以運送全程係由同一<mark>航空運送單據</mark>所涵蓋者為條件。即使信用狀有禁止轉運之規定，表明將轉運或可能發生轉運之<mark>航空運送單據</mark>，可以接受。(4)應表明簽發日。除<mark>航空運送單據</mark>另含實際裝運日期之特別註記，否則應以簽發日為裝運日期。有關該單據上之飛行班次及日期之任何其他資料，將不作為判定裝運日期之用。(5)出口商不必背書，亦可不必在<mark>航空運送單據</mark>正面簽字，除非信用狀另有規定。(6)對於未持有交通部民用航空局核發之航空貨運承攬業許可證業者所發航空提單，不得據以作為押匯文件。(7)對受貨人名稱、地址經塗改或更改者，其貨物之所有人難以辨別，承做押匯時，宜多加注意並依客戶信用情形審慎辦理。"},"x":"航空運送單據係一種<b>收據，並非權利證券</b>，不得據以背書轉讓 → (A)錯。"},{"id":"113-5","y":113,"n":5,"m":1,"q":"除信用狀另有規定外，有關保險單據之敘述，下列何者為非？","o":["投保通知書將不予接受","保險單代替統保單項下之保險證明書或聲明書可以接受","須表明保險金額且與信用狀不同貨幣可以接受","若保險單據表明簽發之正本超過一份時，所有正本均須提示"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"10.保險單據須表明所承保之危險至少涵蓋自信用狀所敘明之接管地或裝運地與卸貨地或最終目的地之範圍。(六)其他單據1.其他單據包括︰領事發票、海關發票、產地證明書、檢驗書、重量單、包裝單、公證書、轉讓書等。"},"x":"保險單上所表示之貨幣<b>必須與信用狀相同</b> → (C)錯。"},{"id":"113-6","y":113,"n":6,"m":3,"q":"有關「疑涉間接轉運俄羅斯案件」加強管控措施，下列敘述何者不正確？","o":["符合特定客戶及特定國家之所有外匯交易皆須進行審查","出口轉開案件疑涉間接轉運俄羅斯一律不得受理","逐筆填製「疑涉間接轉運俄羅斯案件審查表」","倘客戶無法配合審查應婉拒相關交易"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"2.中低風險客戶匯往(來自)本行位於高風險國家之海外分行案件，符合交易審查表免徵文件適用情形第7項，且檢視項目皆勾選「是」者，無論金額大小，得免向客戶徵提交易文件，僅需透過交易審查表辦理評估作業；高風險客戶一律徵提交易證明文件。"},"x":"加強管控僅針對符合特定客戶及特定國家之交易逐筆審查，非「所有外匯交易」。","lo":1},{"id":"113-7","y":113,"n":7,"m":2,"q":"受理進口開狀以統保單或預約保險合約(統稱：Open Policy)方式投保時，下列敘述何者正確？","o":["一般客戶須徵取 Open Policy 正本或副本","本行信評屬 1~7 等級低風險客戶得徵取保險公司簽發以本行為正本或副本受文者之函文並檢附收據副本","每季應審查信用狀開狀金額是否全部在承保範圍內","以上皆是"],"a":0,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"AirRisks航空險WarRisks兵險Strike，Riots&amp;CivilCommotion(S.R.C.C.)罷工、暴動及民變險(2)如價格條件為C.F.R.、F.O.B.、F.A.S.或F.C.A.時，應請客戶辦妥保險並以本行為優先受益人。倘客戶以統保單或預約保險合約(統稱：<mark>OpenPolicy</mark>)方式投保時：a.應向客戶<mark>徵取OpenPolicy正本或副本</mark>。b.每次受理開狀時，應審查信用狀開狀金額、貨物內容、運輸航程及其他條款是否在<mark>OpenPolicy</mark>承保範圍內，並確認該<mark>OpenPolicy</mark>尚未過期。次一營業日應於「進口開(修)狀追蹤記錄簿」(FI15)註記「保險公司」、「<mark>OpenPolicy</mark>No.」、「保險期間起訖日」及「保險金額」，並呈核外匯主管知悉。c.每次開狀後，應促請客戶依<mark>OpenPolicy</mark>規定之申報期限儘速辦理投保申報事宜，並向客戶徵取由保險公司（人）簽發統保單項下以"},"x":"以 Open Policy 投保時，一般客戶應徵取 <b>Open Policy 正本或副本</b>，並於<b>每次</b>受理開狀時審查承保範圍 → (A)正確，(C)每季錯。"},{"id":"113-8","y":113,"n":8,"m":4,"q":"有關手工電文之敘述，下列何者不正確？","o":["電文稿之金額欄不得擦改","付款類電文無論金額大小，應經二名電文稿主管核准","電文稿僅經一名主管核准時，則電文放行人員與該核准主管須為同一人","電文編輯人員鍵入前應檢視電文稿確經電文稿主管核准蓋章，否則應予拒絕"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(4)電文覆核人員(VEA)：將電文編輯人員鍵入之電文資料與電文稿相互核對，經核對無誤後，於外匯電文系統辦理覆核，於覆核(VERIFY)欄位蓋章，並將電文稿送由<mark>電文放行人員</mark>放行。(5)<mark>電文放行人員</mark>(AIA)：確認無誤後，於確認/放行(AUTHORIZE)欄位蓋章，並於外匯電文系統辦理<mark>電文放行</mark>作業；惟倘該筆<mark>電文稿僅經一名主管</mark>(MANAGER)<mark>核准時，則電文放行人員</mark>(AUTHORIZE)<mark>與該核准主管</mark>不得<mark>為同一人</mark>。"},"x":"電文稿僅經一名主管核准時，電文放行人員與該核准主管<b>不得為同一人</b> → (C)錯。"},{"id":"113-9","y":113,"n":9,"m":3,"q":"新客戶國籍為下列何者應一律婉拒建立業務關係？","o":["白俄羅斯","伊朗","俄羅斯","以上皆是"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"1.每人每日匯出匯款(含票匯)金額不得逾等值美金1萬元，惟倘客戶(含客戶本人(自然人)或法人之負責人、實質受益人或高階管理人等)<mark>國籍為北韓或伊朗者或經系統檢核屬內政部移民署通報為「行方不明」或「查處收容」之高風險外籍人士者，應一律婉拒受理</mark>。"},"x":"客戶（含負責人、實質受益人、高階管理人）國籍為<b>北韓或伊朗</b>者，應一律婉拒受理 → (B)。"},{"id":"113-10","y":113,"n":10,"m":4,"q":"現行辦理國外匯出匯款業務時，如受款帳號符合___提供之境外詐欺帳戶，營業單位須向客戶加強關懷提問，並經主管授權始得受理","o":["金管會","警政署","移民署","銀行公會"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(二)應<mark>加強關懷</mark>案件及方式1.扣款帳戶距上次往來逾2年者，應以「久未往來客戶<mark>關懷提問</mark>表」<mark>加強關懷</mark>客戶。2.經系統檢核符合本行「攔阻疑遭詐騙客戶建檔」(代號:9753)自建之疑遭詐騙或疑似詐騙客戶、警政署及財金公司提供之潛在被害人，系統將出現提示訊息，並應依下列流程辦理:(1)填寫「臨櫃作業關懷客戶提問表」<mark>加強關懷</mark>客戶，如有疑慮應通報165或警方來行協助。(2)如確定承作，須經外匯主管執行「<mark>主管授權</mark>」(交易代號:FAT1)外匯業務種類「11-外匯關注名單」、授權種類「99-外匯關注名單」，方得進行後續交易。(3)切勿向客戶透漏已遭警政署、財金公司或本行列為預警名單，以免違反相關法規。"},"x":"系統檢核符合本行自建疑遭詐騙名單、<b>警政署</b>及財金公司提供之潛在被害人時，須填關懷提問表並經主管 FAT1 授權。"},{"id":"113-11","y":113,"n":11,"m":1,"q":"凡出口押匯(貼現)案件遭國外拒付時，應積極進行催討，並限於____以內解決或收回新臺幣；如認為有影響本行債權確保之虞時，或超過____仍未結案者，應及時採取必要之法律程序予以催討","o":["一個月，三個月","二個月，六個月","三個月，六個月","六個月，一年"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第七節 出口押匯/貼現拒付之處理","t":"四、凡出口押匯(貼現)案件遭國外拒付時，應積極進行催討，並限於一個月以內解決或收回新台幣；如認為有影響本行債權確保之虞時，或超過三個月仍未結案者，應及時採取必要之法律程序予以催討，切勿拖延。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第31頁","v":44,"t":"<mark>債權確保</mark>措施出口拒付案件應積極催討，限於一個月<mark>內解決或收回</mark>押匯款；<mark>如認為有影響本行債權確保之虞時</mark>，或超過三個月<mark>仍未結案者</mark>，<mark>應及時採取必要之法律程序予以催討</mark>，切勿拖延。"},"x":"依講義〈2026外匯業務法規與實務〉第31頁：「如認為有影響本行債權確保之虞時，或超過三個月仍未結案者，應及時採取必要之法律程序予以催討，切勿拖延。」"},{"id":"113-12","y":113,"n":12,"m":1,"q":"提單上受貨人名稱(Consignee) 若標明 To Order 者，除信用狀另有規定外，應由何人空白背書？","o":["託運人","開狀銀行","押匯銀行","船公司"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(四)運送單據(TransportDocument)1.提單(BillofLading)，倘信用狀要求提單時：(1)提單之份數，依信用狀規定徵足。若須徵取全套正本時，即提單上表明已簽發若干份正本者，須全部提示。(2)<mark>受貨人名稱(Consignee)</mark>應依信用狀規定填列，若提單<mark>標明ToOrder</mark>或<mark>ToOrder</mark>ofShipp<mark>er者，除信用狀另有規定</mark>者<mark>外，應由</mark>託運<mark>人空白背書</mark>。背書若由託運人以外之標名主體為之，其背書以代替(或代表)該托運人所為為限。(3)提單應依信用狀規定載明FreightPrepaid或FreightCollect。(4)提單所載明託運人(Shipper)與受貨人<mark>(Consignee)</mark>名稱地址、收貨地"},"x":"提單標明 To Order 或 To Order of Shipper 者，除信用狀另有規定外，應由<b>託運人</b>空白背書。"},{"id":"113-13","y":113,"n":13,"m":1,"q":"若信用狀未表明所需保險投保範圍，則保險金額至少須為貨物CIF(運保費在內條件)價額或 CIP(運保費付訖條件)價額之","o":["50%","100%","110%","120%"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"2.保險單上所表示之貨幣必須與信用狀上相同。保險之最低投保額，為投保貨物之CIF<mark>或CIP價額之110%</mark>，CIF<mark>或CIP</mark>價額無法自單據認定時，應就信用狀下所要求辦理兌付或讓購金<mark>額之110%</mark>，或商業發票上貨物總<mark>價額之110%</mark>，以孰高者為準。"},"x":"保險最低投保額為 CIF 或 CIP 價額之 <b>110%</b>。"},{"id":"113-14","y":113,"n":14,"m":4,"q":"第 e 個網之外幣匯入款查詢，客戶得查詢近（　）年內之明細資料，惟最早僅溯自網路銀行申請日前 3 個月，且須同時符合本行規定條件。","o":["2","3","4","5"],"a":0,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"七、帳務查詢之服務內容（一）匯入匯款1.匯入匯款查詢：客戶登錄系統進入「<mark>外幣匯入</mark>匯款查詢」選項，依帳號別及輸入查詢起迄時間(可查詢最近五年)，查詢匯入匯款<mark>明細資料</mark>。（含臨櫃辦理交易及<mark>網路銀行</mark>交易之所有資料）。"},"x":"第e個網外幣匯入款查詢：可查近 <b>2 年</b>，最早溯自網銀申請日前 3 個月。","lo":1},{"id":"113-15","y":113,"n":15,"m":4,"q":"為防止詐騙集團利用國外匯款取款之犯罪手法致民眾遭受財產損失，受理個人臨櫃辦理國外匯出匯款，金額達等值新臺幣（　）萬(含)元以上或高齡客戶時，應落實客戶關懷行動。","o":["10","20","30","50"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"6.<mark>為防止詐騙集團利用國外匯款取款之犯罪手法致民眾遭受財產損失，受理個人臨櫃辦理國外匯出匯款，金額達等值新臺幣</mark>50萬元(含)以上(含原幣匯出或新臺幣結購匯出)<mark>或高齡客戶</mark>(年滿65歲以上)<mark>時，應落實客戶關懷行動。</mark>另匯款金額未<mark>達等值新臺幣</mark>50萬元之案件，亦應視情況進行<mark>客戶關懷</mark>。"},"x":"個人臨櫃國外匯出匯款達等值新臺幣 <b>50 萬元</b>（含）以上或高齡客戶（65 歲以上），應落實客戶關懷。"},{"id":"113-16","y":113,"n":16,"m":2,"q":"有關進口 D/A 匯票到期日之計算，下列敘述何者正確？<br><span class=\"it\">A.</span> 以 After sight 規定者，應自承兌日起算<br><span class=\"it\">B.</span> 以 After B/L Date 規定者，自提單之裝船日起算<br><span class=\"it\">C.</span> 以 After Date 規定者，自國外押匯日起算","o":["僅 AC","僅 BC","僅 AB","ABC"],"a":2,"ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第二節 承兌交單（D/A）之處理","t":"<mark>B/LDate規定者，自提單</mark>(B/L)<mark>之裝船日起算</mark>；<mark>以AfterDate規定者，自</mark>匯票之發票日起算。"},"x":"After sight 自承兌日起算（A）、After B/L date 自裝船日起算（B）；After date 自<b>匯票之發票日</b>起算（C 錯）→ 僅 AB。"},{"id":"113-17","y":113,"n":17,"m":10,"q":"下列敘述何者正確？<br><span class=\"it\">A.</span> 雙元貨幣投資組合商品(DCI)每筆最低投資金額為等值 10萬美元<br><span class=\"it\">B.</span> 單筆式投資組合商品最低投資金額為等值 30 萬美元<br><span class=\"it\">C.</span> 匯率選擇權每筆最低交易金額為等值 10 萬美元","o":["僅 AB","僅 BC","僅 AC","ABC"],"a":3,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第一節 業務開辦及商品發行之前置作業","t":"二、商品設計(一)單筆式商品：1.為因應市場快速變動並符合客戶不同需求條件，得為單一或部分客戶客製化商品。2.除<mark>雙元貨幣投資組合商品(DCI)每筆最低</mark>承作<mark>金額為等值10萬美元</mark>以上，其餘類型商品<mark>每筆最低</mark>承作金額原則上<mark>為等值30萬美元</mark>以上，由金融市場業"},"x":"DCI 每筆最低等值 10 萬美元、其餘單筆式商品 30 萬美元、匯率選擇權每筆最低等值 10 萬美元 → ABC。"},{"id":"113-18","y":113,"n":18,"m":9,"q":"下列何種情形，於交易前必需先完成衍生性 KYC 作業後始得承作？","o":["「專業機構投資人」承作換匯交易(SWAP)","覆審未逾 1 年之「高淨值投資法人」賣出匯率選擇權","其他法人專業客戶承作保本型投資組合商品","進口商僅承作預購新臺幣遠匯"],"a":2,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第一節 概述","t":"1.依本行業務處理細則「衍商篇」相關規範辦理申請作業。2.若客戶已依本行業務處理細則「衍商篇」規範申請為衍生性金融商品業務「高淨值投資法人」或「<mark>其他法人專業客戶</mark>」，承作新臺幣遠期外匯業務時，即自動比照其於衍生性金融商品業務申請之身分。"}},{"id":"113-19","y":113,"n":19,"m":9,"q":"DBU 客戶欲申請為「其他法人專業客戶」，下列敘述何者正確？","o":["得透過第 e 金網申請","最近一期經會計師查核或核閱之財務報告「總資產」超過新臺幣 1 億元","授權辦理交易人員具備金融商品專業知識或交易經驗其中一項","申請一次即符合資格，嗣後不需每年辦理覆審"],"a":1,"ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"1.<mark>「總資產」超過新臺幣1億元</mark>，並提供以下文件佐證(1)DBU：<mark>最近一期經會計師查核或核閱之財務報告</mark>"},"x":"其他法人專業客戶：DBU 須最近一期查核或核閱財報<b>總資產超過新臺幣 1 億元</b>，並應每年覆審 → (B)正確。"},{"id":"113-20","y":113,"n":20,"m":10,"q":"針對辦理衍生性商品之「推介人員」，下列敘述何者正確？","o":["需通過「衍生性金融商品銷售人員」資格測驗並取得合格證書，不需登錄即可執行推介業務","得為所推介客戶最新一筆衍生性 KYC 之評估人員","得擔任所推介客戶之交易申購文件核簽人員","得兼任為作業人員"],"a":3,"ci":{"b":"衍商篇","c":"第一章 客戶間衍生性金融商品業務通則","s":"第三節 辦理衍生性金融商品業務相關人員","t":"第一章客戶間衍生性金融商品業務通則1-4所推介之交易日期與契約簽訂日期之間距不得少於1個月。2.交易文件核章作業：推介人員兼任<mark>作業人員</mark>時，不得擔任其所推介交易之交易申購文件(包括投資組合商品交易文件、投資組合商品轉存授權書、投資組合商品交易確認書、投資組合商品轉存授權書自動失效通知書等)之核簽人員及核章人員。"},"x":"推介人員須登錄始得推介、不得為所推介客戶 KYC 評估人員及核簽人員；推介人員<b>得兼任作業人員</b>（但不得核簽其推介之交易）→ (D)。"},{"id":"113-21","y":113,"n":21,"m":4,"q":"受理國外匯入匯款業務時，倘匯款人資訊不足，下列敘述何者正確？","o":["本行拍發電文予匯款銀行，請求提供完整匯款人資料，逾發電日起算 10 個營業日未接獲回覆，得逕予退匯","雖受款人不常往來，但匯款人名稱誤拼或遺漏等小差異，應一律徵妥切結書後辦理解款，以免滋生爭議","匯款人名稱誤拼或遺漏等小差異，惟已先行解款案件，免再拍發電文要求匯款銀行提供完整匯款人資料","解款後始收到匯款銀行回覆匯款人資訊電文時，免再辦理洗防審查"],"a":0,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"2.倘<mark>匯款人資</mark>訊不足者，應依下列規定處理：(1)應請受款人聯繫匯款人轉請<mark>匯款銀行</mark>來電更正或<mark>提供完整</mark>資料，始得辦理匯入解款；倘轉請外匯營運處外匯作業部或外匯指定單位代為向<mark>匯款銀行</mark>查詢，去電郵電費應由受款人負擔，不得申請減免。(2)若受款人為本行優良或業務上往來頻繁之客戶，且匯款人名稱誤拼或遺漏等小差異時，分行應先完備KYC程序，於徵妥切結書後，得先行解款，惟仍須<mark>拍發電文</mark>要求<mark>匯款銀行提供完整匯款人資料，</mark>且務必請客戶通知匯款人要求<mark>匯款銀行</mark>儘速回覆電文，以利本行留存備查。(3)營業單位收到回覆<mark>匯款人資</mark>訊電文時，應透過「防制洗錢打擊資恐(AML)系統」查詢是否為黑名單，並將列印之查詢結果留存備查。倘查詢結果為疑似外匯關注名單，應依「業務處理細則-外匯篇」第一章第四節相關規定辦理。(4)倘自本行以掛號通知受款人應更正<mark>匯款人資</mark>訊不足已逾1個月或本行去電詢問已<mark>逾發電日起算10個營業日</mark>，而未接獲<mark>匯款銀行</mark>來電更正或提供匯款人完整資料，得以欠缺<mark>完整匯款人資</mark>訊為由，不受"},"x":"小差異得徵切結書先解款，但<b>仍須拍電</b>要求完整資料，回覆後仍須洗防審查 → (B)(C)(D)錯，(A)正確。"},{"id":"113-22","y":113,"n":22,"m":5,"q":"申報人身分別為 2 (團體)在臺無營運收入之「辦事處」或「事務所」，其可申報之匯入匯款分類，以下何者為非？","o":["196 外國民間機構在台辦公費用","340 國外融資","410 薪資款匯入","511 工作者匯款收入"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"(二)辦理外國公司分公司、外國有限合夥分支機構或外國公司在臺辦事處之國外匯出入款案件時，應確實查驗客戶身分文件或基本登記資料。倘為外國公司在臺辦事處，身分別應為「2:團體」，其匯款分類限匯入「196外國民間機構在台辦公費用」、「410薪資款匯入」及「511工作者匯款收入」。"},"x":"在臺辦事處（身分別 2 團體）匯入分類限 196、410、511；<b>340 國外融資</b>不可 → (B)。"},{"id":"113-23","y":113,"n":23,"m":2,"q":"辦理擔保提貨後，本行應於何時向船公司辦理解除擔保責任？","o":["待船公司電話通知本行","進口商結匯還款後","客戶提貨驗收後","正本提單到達時"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第六節 副提單背書及擔保提貨之處理","t":"三、擔保提貨(一)客戶於接到船公司到貨通知而正副提單均未到達時，得申請「擔保提貨」；惟提貨後，不得以任何理由要求拒付。(二)辦理擔保提貨時，應備齊下列書類："},"x":"擔保提貨後，俟<b>正本提單到達</b>時，向船公司換回擔保提貨書以解除本行擔保責任。"},{"id":"113-24","y":113,"n":24,"m":5,"q":"非居住民每筆結購或結售金額未超過等值（　）萬 美元之匯款，申報義務人得於填妥申報書後，逕行辦理新臺幣結匯，但境外非中華民國金融機構不得以匯入款項辦理結售。","o":["10 萬","30 萬","50 萬","100"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(四)<mark>非居住民每筆結購或結售金額未超過等值</mark>10<mark>萬美元之匯款</mark>。<mark>但境外非中華民國金融機構不得以匯入款項辦理結售。</mark>十、下列外匯收支或交易<mark>，申報義務人</mark>應檢附與該筆外匯收支或交易有關合約、核准函或其他證明文件，並經銀行業確認與申報書記載事項相符後，始得<mark>辦理新臺幣結匯</mark>申報:（須檢附文件之結匯申報）"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第12頁","v":30,"t":"外匯收支或交易申報辦法<mark>逕行辦理</mark>結匯申報(第4條)進、出口貨款服務收支公司、行號每年累積<mark>結購或結售金額未超過等值</mark>1億<mark>美元之匯款</mark>；個人、團體每年累積<mark>結購或結售金額未超過等值</mark>1,000<mark>萬美元之匯款</mark>。)辦事處或事務所結售在臺無營運收入辦公費用之匯款<mark>非居住民每筆結購或結售金額未超過等值</mark>10<mark>萬美元之匯款</mark>其中上述第1項及第2項不計入<mark>申報義務人</mark>當年累積結匯金額。"},"x":"非居住民每筆結購或結售未超過等值 <b>10 萬美元</b>之匯款，得填妥申報書後逕行結匯。"},{"id":"113-25","y":113,"n":25,"m":5,"q":"辦理新臺幣結匯申報時，未辦理商業登記之診所、會計師事務所、律師事務所之結匯金額，按照","o":["公司","團體","行號","非居住民 之規定辦理"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-4 銀行業輔導客戶申報外匯收支或交易應注意事項","t":"四、持中華民國外交部核發駐臺外交機構人員及其眷屬身分證明文件者，其<mark>結匯金額</mark>按照非居住民辦理。駐臺外交機構之<mark>新臺幣結匯申報</mark>案件，不論結匯性質，均無<mark>結匯金額</mark>限制。<mark>未辦理商業登記之診所、會計師事務所、律師事務所</mark>，及經有關主管機關許可設立之公益信託，其<mark>結匯金額按照團體</mark>之規定辦理。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第19頁","v":72,"t":"持其他身分證照者之結匯案件持中華民國外交部核發駐臺外交機構人員及其眷屬身分證明文件者，其<mark>結匯金額按照</mark>非居住民辦理。駐臺外交機構之<mark>新臺幣結匯申報</mark>案件，不論結匯性質，均無<mark>結匯金額</mark>限制。<mark>未辦理商業登記之診所</mark>、<mark>會計師事務所</mark>、<mark>律師事務所</mark>，及經有關主管機關許可設立之公益信託，其<mark>結匯金額按照團體</mark>之規定辦理。"},"x":"依講義〈2026外匯業務法規與實務〉第19頁：「未辦理商業登記之診所、會計師事務所、律師事務所，及經有關主管機關許可設立之公益信託，其結匯金額按照團體之規定辦理。」"},{"id":"113-26","y":113,"n":26,"m":4,"q":"受理國外匯出/入匯款業務防制洗錢作業，下列何種情況須徵提交易文件，不得以EDD 審查表取代？","o":["高風險客戶匯至一般國家","中低風險客戶匯至高風險國家","高風險客戶涉及疑似第三方交易","中低風險客戶涉及疑似第三方交易"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"3.<mark>高風險客戶</mark>非涉及高風險國家或<mark>疑似第三方交易</mark>案件，符合交易審查表免徵文件適用情形，且檢視項目皆勾選「是」者，得免向客戶徵提交易文件，僅需透過交易審查表辦理評估作業。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第40頁","v":28,"t":"外匯<mark>業務防制洗錢</mark>及打擊資恐作業<mark>國外匯出</mark>(入)匯款<mark>徵提交易</mark>證明文件時機•時機：<mark>高風險客戶</mark>、高風險國家、<mark>疑似第三方交易</mark>•應辦事項填製「<mark>國外匯出</mark>(入)匯款及光票交易審查表」(下稱交易審查表)依匯款性質徵提相關交易證明文件瞭解資金來源、去處判斷交易合理性具體說明查核過程及結果於交易審查表，經外匯主管、<mark>防制洗錢</mark>及打擊資恐督導主管蓋章確認(<mark>高風險客戶</mark>需再呈核至經理)"},"x":"高風險客戶非涉及高風險國家<b>或疑似第三方交易</b>者，始得以審查表免徵文件；高風險客戶涉疑似第三方交易 → 須徵提交易文件 (C)。"},{"id":"113-27","y":113,"n":27,"m":7,"q":"外幣現鈔保管鈔箱得由何人至金庫室取出？ Ａ.外幣現鈔保管人員<br><span class=\"it\">B.</span> 外匯主管<br><span class=\"it\">C.</span> 櫃員主任","o":["AB","AC","BC","ABC"],"a":0,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第九節 外幣現鈔庫存管理","t":"二、<mark>外幣現鈔保管鈔箱</mark>(下稱鈔箱)置放場所安全控管機制：(一)營業時間前金庫開啟後，應由<mark>外幣現鈔保管人員</mark>或<mark>外匯主管至金庫室取出</mark>鈔 rk>每年累積結購或結售金額超過等值</mark>1,000<mark>萬美元之必要性匯款</mark>。非居住民每筆結匯<mark>金額超過等值</mark>10<mark>萬美元之</mark>匯款：（1）於中華民國境內承包工程之工程款。"}},{"id":"113-40","y":113,"n":40,"m":1,"q":"出口押匯貼現單據之審核，其審查期間為自提示日之次日起最長（　）個銀行營業日，以決定提示是否符合。","o":["3","5","7","10"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(二)審查以單據為本，依單據表面內容決定是否構成符合之提示。(三)<mark>審查期間為自提示日之次日起最長</mark>五<mark>個銀行營業日，以決定提示是否符合</mark>，此一期間不因提示之當日或之後適逢任何有效期限或提示期間末日而須縮短或受其他影響。"},"x":"單據審查期間為自提示日之次日起最長 <b>5 個銀行營業日</b>。"},{"id":"113-41","y":113,"n":41,"m":4,"q":"辦理國外匯出匯款業務，倘匯款金額達等值","o":["新臺幣 50 萬元","新臺幣 100 萬元","美金 50 萬元","美金 100 萬元 (含)以上時，須由另一位主管於水單上之「大額覆核主管」欄位蓋章核准"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"(二)覆核人員(須有6個月以上相關外匯業務經歷，倘其未有外匯系統交易暨查詢權限，應依外匯篇第一章第一節規範辦理外匯覆核人員派任作業，且不受各項職務兼職查詢表之規範)應將水單內容與匯出匯款申請書及傳票相互核對，倘核對無誤，於水單之「覆核<mark>」欄位蓋章</mark>後，送請外匯主管放行(外匯主管及覆核人員逐頁覆核及蓋章確認，惟免蓋騎縫章);倘覆核人員核對發現鍵入資料有誤，應將該筆資料送請外匯經辦人員辦理更正，此時外匯經辦執行「匯出資料輸入」(代號R111)辦理更正後，再將水單等匯款文件送請覆核人員覆核。覆核人員應由執行「匯出資料輸入」(代號R111)以外之經辦或主管人員辦理，且覆核人員不得兼任放行主管或<mark>「大額覆核主管」</mark>；倘匯出匯款金額達等值<mark>美金100萬元(含)以上時，</mark>需再<mark>由另一位主管於水單之「大額覆核主管」欄位蓋章核准</mark>。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第32頁","v":32,"t":"受理本行客戶以新臺幣現金結匯<mark>辦理國外匯出匯款達等值美金1</mark>萬元者，應於「<mark>匯出匯款</mark>申請書」空白處註記現金來源及合理性，於必要時，應請客戶提供相關佐證資料，經外匯經辦、外匯主管及防制洗錢及打擊資恐督導主管蓋章確認後辦理。受理個人臨櫃辦理時，<mark>金額達等值</mark>新臺幣50萬元(含)以上(含原幣匯出或新臺幣結購匯出)時，應以「臨櫃作業關懷客戶提問表」與客戶交談了解其匯款對象與目的有無異常，並由經辦將訪談結果填寫於本表。<mark>匯款金額達等值</mark>新臺幣50萬元(含)以上，應另填寫「虛擬通貨匯兌業務案件審查表」確認交易有無異常。"}},{"id":"113-42","y":113,"n":42,"m":3,"q":"下列哪項外匯業務新增「疑涉間接轉運俄羅斯案件」加強管控措施？","o":["國外匯出","國外匯入","進口","以上皆是"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"1、例外管理國家/地區：俄羅斯、白俄羅斯、烏克蘭(非屬俄羅斯臨時佔領區域)2、國外匯兌案件受理原則：(1)俄羅斯及白<mark>俄羅斯案件</mark>：A.倘交易涉及「特別指定之國民或禁止往來名單」(SDNList)/「非特別指定之國民或禁止往來名單」(Non-SDNList)及國內AML系統檢核結果為黑名單者，<mark>國外匯入</mark>匯款逕行退匯、國外匯出匯款一律暫停受理。B.凡貨品命中經濟部國際貿易署「輸往俄羅斯及白俄羅斯高科技貨品清單」以及「軍商兩用貨品及技術出口管制清單及一般軍用貨品清單」其一管制項目，一律不得承作。3每年1月參酌最新穆迪(Moody’s)公告之國家長期信用評等及展望定期調整，屬投資等級且未來展望為穩定或正向者得移除，並依最新  KYC，下列何項敘述有誤？","o":["符合條件之本國自然人客戶可透過第 e個網、第 e 行動及 iLEO 辦理","法人客戶可透過第 e 金網辦理","不論有無承作投資組合商品，自然人有效期限皆為 KYC 評估日+1 年","不論有無申請衍生性金融商品額度，法人有效期限皆為 KYC 評估日+1 年"],"a":3,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"2.<mark>有效期限</mark>：同「額度到期日」。已完成KYC、但額度尚未獲核准前，暫以「<mark>KYC評估日+1年</mark>」為有效日期，俟額度核准後，分行以「<mark>衍生性金融商品額度</mark>核准變更啟用檢核表暨通知單」及額度批覆書傳真或EMAIL通知金融行銷部，由金融行銷部至系統修改KYC有效日期為額度到期日。"},"x":"法人衍生性 KYC 有效期限<b>同額度到期日</b>，未核准前才暫以評估日＋1 年 → (D)「不論有無」錯。"},{"id":"113-60","y":113,"n":60,"m":10,"q":"匯率選擇權交易中，下列敘述何者有誤？","o":["選擇權買方支付權利金而獲取賣方履約的權利","選擇權買方最大的損失為權利金","選擇權賣方收取權利金而須承擔選擇權履約的義務","選擇權賣方最大的損失為權利金"],"a":3,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第六節 利率選擇權","t":"一、定義係指本行與客戶共同簽訂契約，由選擇權買方支付權利金予賣方，取得於未來特定到期日或期間內，得要求<mark>選擇權賣方</mark>以雙方約定之履約價格履約。利率選擇權交易中，買方因支付權利金而獲取要求賣方履約的權利，交易<mark>最大的損失為權利金</mark>，而賣方則因收取權利金而須承擔選擇權履約的義務，交易<mark>最大的損失</mark>恐將無限大。"},"x":"選擇權賣方因收取權利金承擔履約義務，<b>最大損失恐將無限大</b> → (D)錯。"},{"id":"114-1","y":114,"n":1,"m":4,"q":"辦理 1 筆達等值 100 萬美元(含)以上之國外匯出匯款臨櫃交易，程序上要完成匯款電文發電，至少須經過（　）位 經辦或主管人員處理。","o":["2 位","3 位","4 位","5"],"a":null,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"表單上各筆資料明細及通報情形無誤後，呈核主管留存備查。十三、指定單位辦理大額結購、結售交易每<mark>筆達等值</mark>5<mark>00萬美元</mark>（含）以上之案件，除應依央行外匯收支或交易申報之有關規定辦理並執行大額結匯款通報資料交易外，另應於訂約日下午4時30分前先以電話通報央行外匯稽核科相關交易內容。"},"x":"本題官方送分。依規定 100 萬美元以上匯出須經辦登打、覆核人員、外匯主管放行及大額放行，另一位主管大額覆核。","lo":1},{"id":"114-2","y":114,"n":2,"m":4,"q":"有關電匯之退匯，下列敘述何者錯誤？","o":["申請人應提供原簽發之匯出匯款賣匯水單/其他交易憑證","倘為匯款人主動要求退匯，RTGS 案件應至外匯電文系統拍發MT199 電文","劃帳行為「存同」時，確認款項已退回本行存同帳戶(存匯行對帳單 MT950 電文「貸方(Ma：C)」)","劃帳行為「同存」時，應徵得國外付款行同意授權扣帳字眼"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"2.<mark>倘為匯款人主動要求退匯，</mark>發電作業如下:(1)MX格式之<mark>RTGS案件</mark>:執行「國外匯出去電電文編輯」(代號R998-A)電文種類「B-CAMT.056」，確認內容無誤後將電文傳送<mark>至外匯電文系統</mark>(代號R998-S)，依序由外匯覆核人員覆核及外匯主管放行。(2)非上述案件，可選擇<mark>至外匯電文系統拍發MT199電文</mark>，或依(1)方式拍發CAMT.056電文。"},"x":"匯款人主動退匯：MX 格式之 RTGS 案件應拍發 <b>CAMT.056</b>；非 RTGS 案件才可選 MT199 → (B)錯。"},{"id":"114-3","y":114,"n":3,"m":4,"q":"有關本行外匯電文系統，下列敘述何者為非？","o":["外匯電文系統之各級使用者不得互相兼任","電文覆核人員由各使用單位指定具覆核資格之經辦人員或副理擔任","密碼連續錯誤 5 次，密碼自動失效","無論匯款金額，於外匯連線系統執行「匯出放行(交易代號 R211)」成功後，倘發現金額錯誤，得於外匯電文系統更正"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"1.「國外匯出匯款」(代號R111)之國內外他行間匯款之電文(1)<mark>匯款金額</mark>未達等值美金100萬元：外匯主管無須<mark>於外匯電文系統執行</mark>放行作業，外匯主管於<mark>執行「匯出放行</mark>」交易(<mark>代號R211)</mark>放行<mark>成功後，</mark>將由系統自動完成發電。執行<mark>R211</mark>放行成功之匯款案件即不得再更改匯款內容或刪除，爰應於執行<mark>R211</mark>交易前，確實覆核匯款內容及帳務資料。(2)匯出<mark>匯款金額</mark>達等值美金100萬元(含)以上：外匯主管於完成<mark>「匯出放行</mark>」交易(<mark>代號R211)</mark>後，須<mark>於外匯電文系統執行</mark>大額放行作業；另，該筆匯款資料需再由另一位主管於水單之「大額覆核主管」欄位蓋章核准。倘發現<mark>外匯電文系統</mark>中之電文資料有誤時，應即將該錯誤之電文辦理退回，由電文編輯人員作廢改以手工拍發電文。(3)外匯作業部對於匯出匯款電文，倘以整批電文放行處理者，經主管整批覆核後，將由系統自動完成發電。(4)每日日終結帳前，各營業單位(含總行單位、新竹、台中、台南及高雄等外匯作業中心)應指派專人確認付款類電文(含MT103、MT202、"},"x":"執行 R211 放行成功之匯款案件<b>即不得再更改匯款內容或刪除</b> → (D)錯。"},{"id":"114-4","y":114,"n":4,"m":8,"q":"下列計算新臺幣遠匯訂約手續費之規定，何者有誤？","o":["依訂約金額 1/1,000 計收","最低收取新臺幣 400 元","營業單位經理對於優質客戶得酌情予以減收或免收","以上皆正確"],"a":3,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(三)不得接受客戶以銀行無擔保放款所得資金繳存承做保證金。四、<mark>訂約手續費</mark>：於訂約時按訂約金額1/1,000計收手續費，最低收取新臺幣400元。惟對於優質客戶，營業單位經理得酌情予以減收或免收<mark>訂約手續費</mark>。"},"x":"新臺幣遠匯訂約手續費按訂約金額 1/1,000 計收、最低 400 元，優質客戶經理得減免 → 三項皆正確，選 (D)。"},{"id":"114-5","y":114,"n":5,"m":6,"q":"本國人辦理一筆 6 個月期外幣定存 15 萬美元，以議價利率 4%承作，並申請自動轉期，下列敍述何者有誤？","o":["到期將以原承作利率 4%續存","自動轉期之定期存單以不簽發新實體存單為原則","客戶可選擇本金及利息於到期日一併轉期","自動轉期之次數不限"],"a":0,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（四）自動轉期時之存款利率，以原存款到期日之前一營業日本行相當存期之掛牌利率計息。十一、外匯定期存款中途解約之處理：（一）外匯定期存款到期自動轉期，如該轉期日為非營業日，且客戶未事先通知不續存，於次營業日辦理解約，得視為到期解約，並按存單利率以人工計付休假日之利息，惟於休假日後第2營業日後解約者，應視為中途解約。"},"x":"自動轉期之利率以<b>原存款到期日前一營業日本行相當存期之掛牌利率</b>計息，非原議價利率 → (A)錯。"},{"id":"114-6","y":114,"n":6,"m":8,"q":"下列有關新臺幣遠匯交割期間之敍述，何者有誤？","o":["倘為 10 天期任選到期日，交割期間為訂約日後第 3 日至到期日","倘為 30 天期固定到期日，交割期間為契約到期日前 10 日","倘為指定到期日，僅限到期日當天辦理交割","交割日如適逢銀行未對外營業，得順延至次一營業日交割"],"a":1,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第六節 交割、展期手續及違約處理","t":"(二)契約為任選到期日者：1.客戶應於契約書所訂之<mark>交割期間</mark>內辦理交割手續，惟訂約10天期以內者之<mark>交割期間</mark>，為訂約日後第三個營業日起算至到期日止。另倘所訂之最後交割日，如適逢銀行未對外營業時，亦得順延至次一營業日辦理交割。"}},{"id":"114-7","y":114,"n":7,"m":4,"q":"招攬中之新戶 A 欲匯入 1 筆 15 萬美元款項至本行，假設美元兌新臺幣匯率為 30，授權營業單位經理核定之最低收費標準計收，手續費為新臺幣","o":["400 元","200 元","800 元","1,125 元"],"a":2,"ci":{"b":"外匯篇","c":"第十一章 各項外匯業務收費標準及授權措施","s":"第三節 各項外匯業務授權措施","t":"(七)外幣票據託收項目<mark>授權營業單位經理核定之最低收費標準</mark>備註外幣票據託收手續費費率：按0.25/1,000計收，<mark>最低收費</mark>NTD200，最高收費NTD800。"},"x":"依收費標準授權經理核定之最低收費，匯入匯款手續費以最高 NTD800 計收（0.5‰ 計算後逾上限）。","lo":1},{"id":"114-8","y":114,"n":8,"m":1,"q":"甲出口商接獲銀行通知信用狀修改，修改內容為金額減少 1 萬美元，最後裝船日延後 10 天，則甲出口商","o":["可以僅接受裝船日之修改，不接受金額減少","可以僅接受金額減少，不接受裝船日之修改","兩者均應一併接受或均不接受","以上皆可"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"(四)匯出匯款因國外受款人不接受，或無法寄達受款人而退回本行時，應速通知申請人，請其以書面提供受款人正確之名稱、地址、帳號等詳細資料申請本行修改，或是請其依退匯申請相關規定辦理。"},"x":"UCP600 第10條(e)：對修改書<b>不允許部分接受，部分接受視為拒絕</b>整份修改 → 金額與裝船日兩項應一併接受或一併拒絕。（網路僅取得條文目錄，內容依 ICC 原文）","lo":3,"web":[{"t":"ICC Academy：UCP 600","u":"https://academy.iccwbo.org/ucp-600"},{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"}]},{"id":"114-9","y":114,"n":9,"m":1,"q":"下列價格條件 A. FCA B. FOB C.CFR D.CIF，哪些應由賣方負擔運費(Fright Prepaid)？","o":["AB","BC","CD","AD"],"a":2,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"營業單位經理核准後，依客戶要求，改以申請人或第三者為受貨人或指示人。(3)<mark>運費(Fr</mark>e<mark>ight</mark>)由何方負擔，以「<mark>價格條件</mark>」(terms)為準；例如：F.C.A.、F.O.B.與F.A.S.時，為“Fre<mark>ight</mark>Collect”；倘為C.F.R.、C.I.F.、C.P.T.或C.I.P.時，則為“<mark>FrightPrepaid</mark>”。"},"x":"FCA、FOB、FAS 為 Freight Collect；<b>CFR、CIF</b>、CPT、CIP 為 Freight Prepaid（賣方負擔）→ CD。"},{"id":"114-10","y":114,"n":10,"m":7,"q":"受理「非本行客戶」來行收兌/結購外幣現鈔，下列何者有誤？","o":["每人每日收兌宜以等值 500 美元為原則","每人每日結購不得逾等值 1 萬美元","國籍為全面性制裁國家者，應一律婉拒受理","如為偽造外國幣券，無論金額大小皆應報請警察機關偵辦"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(三)有下列情形之ㄧ者，應立刻記明持兌人之真實姓名、國籍、職業、聯絡方式及住址，並<mark>報請警察機關偵辦</mark>：1.持兌之偽（變）<mark>造外國幣券</mark>總值在等值美金200元以上。"},"x":"偽（變）造外國幣券總值在等值<b>美金 200 元以上</b>者，才須記明持兌人資料並報請警察機關偵辦 → (D)「無論金額」錯。"},{"id":"114-11","y":114,"n":11,"m":8,"q":"下列何者不屬於新臺幣遠匯應徵取之實需交易文件範圍？","o":["僅提供形式發票(Proforma Invoice)","發票(Invoice)","信用狀(L/C)","提供交易清單及清單所列前 3大金額之實際交易證明文件"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"載之收付款到期日互具合理性，且不得逾該文件所載之收付款到期日，另訂約金額不得大於提示文件之合計總額。前述實需文件之種類不拘，惟<mark>形式發票(ProformaInvoice</mark>，又稱預開發票或估價發票)非正式發票，係出口商在買賣成交前，應買方要求，按擬出售之貨品、單價、規格等條件開立之參考發票，非正式發票。僅憑<mark>形式發票</mark>無法確認交易是否完成，故尚難單獨以其作為合格的結匯證明文件，倘客戶欲以<mark>形式發票</mark>作為交易證明文件時，須另檢附足以佐證買賣交易已完成之其他相關單據，如發票、採購訂單或金融機構開立之信用狀等文件佐證。B.以交易清單方式辦理：a.憑客戶數十筆交易合併清單訂定一筆遠匯契約時，應注意遠匯交割日期與清單所列各筆收付款日期之合理性，且遠匯契約到期日不得超過該合併清單之最晚到期日，並確認訂定匯率方向無誤，客戶得在不高於清單金額範圍內一次或分次辦理訂約交易。另，不同交易性質之外匯交易，須分別編製不同的文件清單。b.清單內容至少需包含各筆交易對手名稱、文件號碼(如發票號碼或訂單"},"x":"<b>形式發票（Proforma Invoice）</b>非正式發票，不得單獨作為實需證明文件，須另附發票、訂單或信用狀佐證 → (A)。"},{"id":"114-12","y":114,"n":12,"m":1,"q":"以出口押匯額度辦理信用狀轉開國外信用狀時，下列敘述何者為是？","o":["不需附加FINAL PAYMENT 條款","信用狀金額得較原信用狀金額少","應載明 Confirm 字樣始可承做","最後裝船日應晚於原始信用狀"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第八節 轉開國內信用狀之處理","t":"1.開發信用狀申請書之幣別，原則上應與原始信用狀之幣別相同，金額可<mark>較原信用狀金額少</mark>。2.最後裝船日不應晚於原始信用狀，單據提示期限應適當縮短，以避免造"},"x":"轉開信用狀幣別原則與原狀相同，<b>金額可較原信用狀少</b>；最後裝船日不應晚於原狀 → (B)正確。"},{"id":"114-13","y":114,"n":13,"m":1,"q":"依 UCP600 規定，若銀行經開狀銀行之授權或委託對信用狀保兌，但卻無意照辦時，其須將此意旨儘速告知","o":["通知銀行","補償銀行","開狀銀行","轉讓銀行"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"附錄2-13-2 第一銀行受理通匯銀行為申請信用狀保兌、轉開保證函（L/G）或","t":"（二）於受理時，應就信用狀或保證函有關內容條款詳細審查，如其中有不明確之處，應迅即與通匯銀行聯繫，請其加以澄清或修改；若信用狀或保證函中有明顯不利於本行之條款，而通匯銀行又不予修改，或因其他原因致不擬承做時，應依信用狀統一慣例<mark>UCP600</mark>第八條D款之規定，<mark>將此意旨儘速</mark>通知通匯銀行。"},"x":"UCP600 第8條(d)：銀行經開狀銀行授權或委託保兌但無意照辦時，須<b>儘速告知開狀銀行</b>，並得通知信用狀而不加保兌。（網路僅取得條文目錄，內容依 ICC 原文）","lo":3,"web":[{"t":"ICC Academy：UCP 600","u":"https://academy.iccwbo.org/ucp-600"},{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"}]},{"id":"114-14","y":114,"n":14,"m":4,"q":"有關「國外匯出/入匯款交易追蹤事項登記簿」之相關規範，下列何者有誤？","o":["受理當下暫無須徵取文件","原則上「預計出貨日」不宜超過受理日 3 個月","應於「預計出貨日」後 2 個月內完成運送單據或本國報關單補送","結案時應填寫審查結果，並呈核至外匯主管、防制洗錢及打擊資恐督導主管及經理蓋章確認"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"上不宜超過受理日3個月，倘超過3個月須敘明原因及合理性後，經外匯主管、防制洗錢及打擊資恐督導主管蓋章確認同意後辦理，另應於「預計出貨日」後2個月內完成運送單據或本國報關單補送作業。(4)營業單位應按時追蹤客戶補送運送單據或本國報關單之情形，當客戶未依約定日期補送運送單據或本國報關單，應瞭解原因，若預計出貨日有合理延遲理由，應於「國外匯出/入匯款交易追蹤事項登記簿」之「延遲出貨合理性說明」欄位敘明，並經外匯主管、防制洗錢及打擊資恐督導主管蓋章確認。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第40頁","v":37,"t":"•未進/出口(701)、委外/商仲(710/711)尚未出貨時注意事項登記於「<mark>國外匯出/入匯款交易追蹤事項登記簿</mark>」「預計出貨日」原則上不得超過3個月；"},"x":"依講義〈2026外匯業務法規與實務〉第40頁：「未進/出口(701)、委外/商仲(710/711)尚未出貨時注意事項登記於「國外匯出/入匯款交易追蹤事項登記簿」「預計出貨日」原則上不得超過3個月；」"},{"id":"114-15","y":114,"n":15,"m":7,"q":"受理外幣現鈔申購與收兌作業，下列何者為非？","o":["皆應由經辦該筆交易以外人員辦理覆點","皆需留存鈔券票號或影印備查","客戶持舊版外幣現鈔，惟未能提供當初向本行申購現鈔之水單，應一律婉拒受理","收兌外幣現鈔得憑本行賣匯水單於原結購金額限額內兌換"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"7.存入帳戶者，應請客戶填寫「存款憑條」，並核對帳號及金額否相符。8.各營業單位有收兌<mark>外幣現鈔</mark>之義務，並應加強偽鈔辨識能力，對於有疑慮之鈔券，應輔以人工或紫光燈加以判斷，不得以持有舊版之<mark>外幣現鈔</mark>、<mark>未能提供</mark>賣匯水單或未有該幣別庫存等理由拒絕。"},"x":"營業單位有收兌外幣現鈔之義務，<b>不得</b>以持舊版現鈔、未能提供賣匯水單等理由拒絕 → (C)錯。"},{"id":"114-16","y":114,"n":16,"m":5,"q":"銀行受理「非居住民」辦理新臺幣結匯，下列何者正確？","o":["當日累計金額未達等值新臺幣 50 萬元，申報義務人免填「外匯收支或交易申報書」","金額達等值新臺幣 50 萬元，申報義務人無法親自辦理時，應於徵取其授權書後結匯","同一天有多筆結匯時，應分拆為每筆等值 10 萬美元(不含)以下，以符合規定","以上皆非"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"3.<mark>外匯收支或交易申報書</mark>:未成年人及其父母共同於「<mark>申報義務人</mark>及其負責人簽章」處簽章；另，重申未成年人辦理結匯金額<mark>達等值新臺幣50萬元</mark>以上之外匯收付，應檢附相關證明文件，經由銀行業向央行申請核准後始能辦理。"}},{"id":"114-17","y":114,"n":17,"m":4,"q":"有關個人辦理人民幣業務，下列敘述何者不正確？","o":["每人每次買賣現鈔及每日透過帳戶買賣之金額，均不得逾人民幣 2 萬元","每日透過帳戶買賣合併計算之金額不得逾人民幣 2 萬元","外幣提款機提領現鈔，每人每次提領之金額，不得逾人民幣 2 萬元","匯款人民幣至大陸地區，受理對象應以領有中華民國國民身分證之個人為限"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-1 銀行業辦理外匯業務管理辦法","t":"四、承作自然人買賣人民幣業務，每人每次買賣現鈔及<mark>每日透過帳戶買賣</mark>之金額，均<mark>不得逾人民幣</mark>二萬元。五、承作於外幣提款機提領人民幣現鈔業務，每人每次提領之金額，<mark>不得逾人民幣</mark>二萬元。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第7頁","v":37,"t":"四.承作自然人買賣<mark>人民幣業務</mark>，每人每次買賣現鈔及<mark>每日透過帳戶買賣</mark>之金額，均<mark>不得逾人民幣</mark>二萬元。五.承作於外幣提款機提領人民幣現鈔業務，每人每次提領之金額，<mark>不得逾人民幣</mark>二萬元。匯款性質應屬經常項目，且每人每日匯款之金額，<mark>不得逾人民幣</mark>八萬元。"},"x":"依講義〈2026外匯業務法規與實務〉第7頁：「四.承作自然人買賣人民幣業務，每人每次買賣現鈔及每日透過帳戶買賣之金額，均不得逾人民幣二萬元。」「五.承作於外幣提款機提領人民幣現鈔業務，每人每次提領之金額，不得逾人民幣二萬元。」"},{"id":"114-18","y":114,"n":18,"m":10,"q":"有關「投資組合商品契約書」，下列敘述何者為非？","o":["個人戶除承作買入選擇權外，應一律簽署投資組合商品契約書","對於高齡客戶，營業單位僅需提供附錄之重要條款說明，免專人解說","首次簽約之客戶應徵取「客戶業務往來聲明書」","契約暨相關附件應由營業單位審閱及保管"],"a":1,"ci":{"b":"衍商篇","c":"第四章 簽約開戶作業","s":"第一節 應徵提的文件","t":"(一)辦理「投資組合商品契約書」簽約時<mark>，營業單位</mark>應<mark>提供附錄</mark>「投資組合商品契約書」<mark>重要條款說明</mark>予客戶(分行免留底)。倘為65歲(含)以上高齡者、教育程度國中(含)以下、視覺障礙者、不識字客戶或領有全民健康保險重大傷病證明之客戶，則應指派專人向客戶解說契約重要內容，以協助客戶更容易理解商品性質、相關風險及雙方權利義務關係，解說人員並應於「投資組合商品開戶/變更資料檢核單」相關檢核項目蓋章。"},"x":"65 歲以上高齡、國中以下、視障、不識字或重大傷病者，<b>應指派專人</b>解說契約重要內容 → (B)錯。"},{"id":"114-19","y":114,"n":19,"m":9,"q":"有關自然人以數位通路辦理衍生性 KYC 評估作業，以下何者為是？","o":["未滿 20 歲之本國成年人不得使用數位通路辦理衍生性 KYC","客戶須待 7 個曆日後始得以數位通路重新辦理衍生性 KYC","高齡客戶須自行於系統內填寫「衍生性 KYC 高齡客戶關懷提問表」","KYC 評估結果適用範圍為承作投資組合商品及外匯保證金"],"a":2,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"5.65歲(含)以上之「<mark>高齡客戶</mark>」，需先填覆<mark>「衍生性KYC高齡客戶關懷提問表」</mark>，且僅符合1項以下弱點指標。(三)KYC評估結果適用範圍：承作「投資組合商品」。"},"x":"65 歲以上高齡客戶以數位通路辦理，需<b>先填覆「衍生性 KYC 高齡客戶關懷提問表」</b>且僅符合 1 項以下弱點指標 → (C)正確；評估結果適用於投資組合商品。"},{"id":"114-20","y":114,"n":20,"m":10,"q":"有關本行「投資組合商品」下列敘述何者錯誤？","o":["具美國公民身分或持有美國永久居留權之客戶可承作外幣本金之保本型商品","DCI 每筆最小承作金額為等值 30萬美元","高齡之一般客戶不得承作風險等級為 RR4、RR5 之高風險商品","85 歲以上客戶得承作期間 3 個月(含)以內之保本型商品"],"a":1,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第一節 業務開辦及商品發行之前置作業","t":"二、商品設計(一)單筆式商品：1.為因應市場快速變動並符合客戶不同需求條件，得為單一或部分客戶客製化商品。2.除雙元貨幣投資組合商品(DCI)每筆最低<mark>承作金額為等值</mark>1<mark>0萬美元</mark>以上，其餘類型商品每筆最低<mark>承作金額</mark>原則上<mark>為等值30萬美元</mark>以上，由金融市場業"},"x":"DCI 每筆最低承作金額為等值 <b>10 萬美元</b>；30 萬美元是其餘單筆式商品 → (B)錯。"},{"id":"114-21","y":114,"n":21,"m":6,"q":"有關外匯定存中途解約規定，下列何者有誤？","o":["未存滿一個月中途解約不予計息","存期 1 個月期(含)以上者，中途解約之利率依其期別以解約當日本行牌告利率計算","存滿 1 個月期以上者，中途解約按實存期間單利計息，並含不足整月之零星日數","存滿 3 個月未滿 6 個月者，依實存期間，以起存日 3 個月期存款牌告利率8 折計息"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"(二)未滿一個月期<mark>者，中途解約</mark>不予計息。(三)一<mark>個月期(含)以上者，</mark>其計息期間及<mark>利率依其期別以</mark>起存<mark>日本行牌告利率</mark>為準，按下列方式計算："},"x":"一個月期以上中途解約，利率依其期別以<b>起存日</b>牌告利率為準，非解約當日 → (B)錯。"},{"id":"114-22","y":114,"n":22,"m":6,"q":"下列何者非為 OBU 境外法人開戶應徵提之文件？","o":["法人註冊地之註冊代理人一年內簽發之董事職權證明書(CERTIFICATE OF INCUMBENCY)","股東名冊(REGISTER OF MEMBERS)","公司章程","董事名冊(REGISTER OF DIRECTORS)"],"a":0,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第五節 代受理國際金融業務分行客戶外幣支票存款業務之處理","t":"後，請其填具「OBU外幣支票存款開戶申請書」及簽章卡（易133）一式兩份，並檢具下列文件，俾憑以審核：1.<mark>法人註冊地之註冊</mark>機關核發之<mark>法人註冊</mark>證書（<mark>CERTIFICATEOFINC</mark>ORPORATION）影本兩份"}},{"id":"114-23","y":114,"n":23,"m":7,"q":"下列何者不符合擔任外匯業務主管或經辦之條件？","o":["經辦人員須有 3 個月以上相關外匯業務經歷","具備外匯業務執照","主管須有 6 個月以上相關外匯業務經歷","經辦派任「外匯實習」3 個月後，並通過本行行員升等實務外匯業務測驗"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"1.由營業單位先<mark>派任「外匯實習」</mark>(無外匯操作員權限)，外匯經辦人員至少3個月，外匯覆核人員及外匯副主管至少6個月，總務人員應至本行人力資源管理系統(HRIS)辦理線上申請並傳送單位主管核准。"}},{"id":"114-24","y":114,"n":24,"m":3,"q":"進出口交易金額達（　）萬美元(含)以上，且為海運提單者，應一律先透過 Marine Traffic 查詢航程路線是否行經提單顯示之裝卸地點。","o":["10","20","30","50"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"(三)運送單據審查：<mark>交易金額達</mark>美金20萬<mark>元(含)以上，海運提單應一律先透過MarineTraffic</mark>追蹤網站(網址：https://www.m<mark>arine</mark>t<mark>raffic</mark>.com)<mark>查詢航程路線是否行經提單顯示之裝卸地點</mark>，倘查無資訊或為空運提單或快遞收據(如FedEx、UPS、DHL)者，再透過下列任一方法辦理查詢運送單據真實性或合理性，並將查證軌跡併同審核工作單留存："},"x":"交易金額達<b>美金 20 萬元</b>（含）以上之海運提單，應一律先透過 Marine Traffic 查詢航程。"},{"id":"114-25","y":114,"n":25,"m":2,"q":"進口信用狀超額押匯案件，於超押金額逾信用狀金額（　）時，應就超押金額之全部，依原開狀之手續費率及補收當日之適用匯率補收開狀手續費。","o":["3%","5%","10%","15%"],"a":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"3.國外<mark>超額押匯案件</mark>應補徵<mark>開狀手續費</mark>及開狀保證金後，始得將單據交付客戶：(1)補徵<mark>開狀手續費</mark>：<mark>超額押匯</mark>金額未<mark>逾信用狀</mark>開狀金額5%(含)，免徵<mark>收開狀手續費</mark>；<mark>超額押匯</mark>金額超過<mark>信用狀金額</mark>5%<mark>時，應就超押金額之全部，依原開狀</mark>時<mark>之手續費率及補收當日之適用匯率補收開狀手續費</mark>，倘因故無法於交單時完成補徵<mark>開狀手續費</mark>者，為利贖單作業順利，至遲應於案件辦理首次還款交易時，補收該項費用。(2)進口遠期信用狀案件應注意查核加計該<mark>超押金額</mark>後，本行進口融資金額有否超過原核准授信條件及授信額度，為利控管<mark>進口信用狀超額押匯案件</mark>額度之使用情況，營業單位每日應自「報表查詢列印系統(OnDemand)」查詢列印「外匯授信使用額度異常明細表(FI60D)」(無資料者免列印)呈主管覆核，對於其中外匯授信使用額度不足之進口<mark>超額押匯案件，</mark>倘於原核准授信條件及授信額度內，得由各營業單位辦理「信用狀/外幣貸款使用額度及核准號碼之變更（I631）」交易調整授信使用額度或就超押部分全額結匯並補收利息；倘超過原核准授"},"x":"超額押匯金額超過信用狀金額 <b>5%</b> 時，應就超押金額之全部依原開狀費率補收開狀手續費。"},{"id":"114-26","y":114,"n":26,"m":2,"q":"辦理擔保提貨後，本行應於何時向船公司辦理解除擔保責任？","o":["進口商提貨驗收後","進口商結匯還款後","正本提單到達時","無此需要"],"a":2,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第六節 副提單背書及擔保提貨之處理","t":"三、擔保提貨(一)客戶於接到船公司到貨通知而正副提單均未到達時，得申請「擔保提貨」；惟提貨後，不得以任何理由要求拒付。(二)辦理擔保提貨時，應備齊下列書類："},"x":"擔保提貨後，俟<b>正本提單到達</b>時，向船公司換回擔保提貨書解除擔保責任。"},{"id":"114-27","y":114,"n":27,"m":2,"q":"辦理進口承兌交單(D/A)，匯票到期日應以何日為起算日？","o":["以After Sight規定者，應自承兌日起算","以After B/L Date 規定者，自提單(B/L)之裝船日起算","以After Date規定者，自匯票之發票日起算","以上皆是"],"a":3,"ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第二節 承兌交單（D/A）之處理","t":"B/LDate規定者，自提單(B/L)之裝船日起算；以AfterDate規定者，自匯票之發票日起算。"},"x":"After sight 自承兌日、After B/L date 自裝船日、After date 自匯票發票日起算 → 以上皆是。"},{"id":"114-28","y":114,"n":28,"m":1,"q":"出口押匯案件逾期未入帳，倘逾越押匯日起（　）天應即查明未入帳原因，比照拒付案件逐筆填製「出口押匯拒付整理日誌」，呈單位主管核閱。","o":["15 天","30 天","90 天","120"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第六節 出口押匯/貼現遲延入帳之處理","t":"二、對於<mark>逾越押匯日起</mark>九十天(<mark>出口押匯</mark>)或匯票到期日起六十天(出口貼現)以上仍未入帳之案件，除應檢附本行向國外銀行拍發之催收函(電)影本，再函請出口商儘速解決外，並應<mark>比照拒付案件逐筆填製「出口押匯拒付整理日誌」</mark>（註明<mark>逾期未入帳</mark>），詳載有關案情始末<mark>，呈單位主管核閱</mark>，同時將案件送外匯營運處外匯作業部辦理出口<mark>拒付案件</mark>電腦建檔，以利追索處理與管理。"},"x":"逾越押匯日起 <b>90 天</b>以上仍未入帳者，比照拒付案件填製「出口押匯拒付整理日誌」。"},{"id":"114-29","y":114,"n":29,"m":1,"q":"依 UCP600 規定，「指定銀行在其應獲補償之銀行營業日當日或之前，以墊款或同意墊款予受益人之方式，買入符合提示項下之匯票(以指定銀行以外之銀行為付款人)及/或單據」係為下列哪一項之定義？","o":["讓購 Negotiation","兌付 Honour","信用狀 Credit","提示 Presentation"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"附錄2-2-1 一般限制押匯銀行使用之文句","t":"附錄2-2-1一般限制押匯銀行使用之文句（通知銀行或指定之銀行非本行時須辦理轉押匯）1.<mark>Negotiation</mark>underthiscreditisrestrictedto○○○Bank,Taipei."},"x":"UCP600 第 2 條：「讓購 Negotiation」＝指定銀行於應獲補償之營業日當日或之前，以墊款或同意墊款方式買入匯票及/或單據。"},{"id":"114-30","y":114,"n":30,"m":4,"q":"有關「國外匯出(入)匯款及光票客戶加強盡職審查表(EDD)」之抽查作業，下列何者為是？","o":["按月抽查","抽查原則為每 10 件抽查 3 件，不足 10 件者免抽查","抽查時應向客戶徵提該筆交易佐證文件並查詢是否屬制裁範圍","以上皆是"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"6.中低風險客戶凡採免徵文件方式辦理審查，適用情形屬第2項者，受理時應填妥「中低風險客戶適用免徵文件審查登記簿」併同申請書類、水單及交易審查表辦理呈核，並由防制洗錢及打擊資恐督導主管或三合一主管按季(每年1、4、7及10月為查核月)依登記簿資料辦理抽查，每10件應抽查3件(即10-19件抽3件、20-29抽6件，以此類推)，不足10件者抽查1件(即1-9件抽1件)，依抽查結果填報「中低風險客戶適用免徵文件審查案件抽查表」(下稱抽查表)，最遲應於查核當月月底或次月第一個營業日陳核至經理，並將所徵提之相關文件紀錄檢附於抽查表，設專卷留存5年備查。抽查作業應注意事項如下：(1)應依交易申報性質<mark>向客戶徵提</mark>本次抽查案件之<mark>佐證文件</mark>，不得沿用前已徵提之文件重複使用。另應針對交易有關對象辦理AML系統姓名及名稱檢核作業，<mark>查詢是否屬制裁範圍</mark>，並列印查詢結果備查。(2)倘為貨物貿易，<mark>應向客戶徵提</mark>正式發票及運送單據或本國報關單，"},"x":"抽查時應徵提交易佐證文件並查詢是否屬制裁範圍（C）；抽查為<b>按季</b>辦理，不足 10 件<b>抽 1 件</b> → (A)(B)錯。"},{"id":"114-31","y":114,"n":31,"m":3,"q":"有關「限制押匯國家/地區」，下列何者有誤？","o":["光票買入案件一律改以託收方式辦理","進口開狀案件受益人或通知銀行位於「限制押匯國家/地區」者，應一律以非自付條款方式辦理","出口押匯案件一律改以託收方式辦理","國外匯入匯款通知書倘標有「限押國家」者，應查明該筆匯入匯款之存匯行確實已入帳並留存紀錄備查，方得解付"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"2、<mark>進口開狀案件</mark>：<mark>受益人或通知銀行位於「限制押匯國家/地區」者，應一律以自付條款方式辦理</mark>。3、出口押匯(貼現)案件：進口商或開狀<mark>銀行位於「限制押匯國家/地區」者，應一律</mark>改以託收<mark>方式辦理</mark>。"},"x":"限制押匯國家之進口開狀案件，應一律以<b>自付條款</b>方式辦理 → (B)「非自付條款」錯。"},{"id":"114-32","y":114,"n":32,"m":4,"q":"辦理國外匯出/入匯款業務防制洗錢作業，下列哪種案件應一律婉拒受理？","o":["運送單據卸貨港位於俄羅斯，且貨物之 HS CODE 命中「輸往俄羅斯及白俄羅斯高科技貨品清單」","運送單據卸貨港為伊朗德黑蘭","運送單據之航空公司為受美國OFAC 制裁對象","以上皆不得受理"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"1.進口案件之受益人或通知銀行、出口案件之進口商或開狀銀行位於俄羅斯者，一律不得承作。2.凡貨品命中經濟部國際貿易署「輸往俄羅斯及白俄羅斯高科技貨品清單」以及「軍商兩用貨品及技術出口管制清單及一般軍用貨品清單」其一管制項目，一律不得承作。沙烏地阿拉伯(SaudiArabia)v(與伊朗高度關連國家)(屬中東地區)塞爾維亞(Serbia)v索馬利亞(Somalia)v南蘇丹(SouthSudan)v(全面性制裁)v(FATF)有關外匯案件，一律停止受理斯里蘭卡(SriLanka)v國家信評及財政金融收支不佳蘇丹(Sudan)v"},"x":"命中輸俄高科技貨品清單、涉伊朗、或運送人為 OFAC 制裁對象等，皆屬一律不得承作之情形 → 以上皆不得受理。"},{"id":"114-33","y":114,"n":33,"m":4,"q":"辦理國外匯出/入匯款業務防制洗錢作業，下列何種情況須徵提交易文件，不得以EDD 審查表取代？","o":["中低風險客戶涉及疑似第三方交易","中低風險客戶匯至高風險國家","高風險客戶涉及疑似第三方交易","高風險客戶匯至一般國家"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"3.<mark>高風險客戶</mark>非涉及高風險國家或<mark>疑似第三方交易</mark>案件，符合交易審查表免徵文件適用情形，且檢視項目皆勾選「是」者，得免向客戶徵提交易文件，僅需透過交易審查表辦理評估作業。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第40頁","v":28,"t":"外匯<mark>業務防制洗錢</mark>及打擊資恐作業<mark>國外匯出</mark>(入)匯款<mark>徵提交易</mark>證明文件時機•時機：<mark>高風險客戶</mark>、高風險國家、<mark>疑似第三方交易</mark>•應辦事項填製「<mark>國外匯出</mark>(入)匯款及光票交易審查表」(下稱交易審查表)依匯款性質徵提相關交易證明文件瞭解資金來源、去處判斷交易合理性具體說明查核過程及結果於交易審查表，經外匯主管、<mark>防制洗錢</mark>及打擊資恐督導主管蓋章確認(<mark>高風險客戶</mark>需再呈核至經理)"},"x":"高風險客戶<b>非</b>涉及高風險國家或疑似第三方交易者始得以審查表免徵文件；涉疑似第三方交易者須徵提交易文件 → (C)。"},{"id":"114-34","y":114,"n":34,"m":7,"q":"辦理收兌外幣現鈔金額大於等值新臺幣（　）萬元(含)以上，應落實 KYC，倘經評估可受理者，應於申請書空白處敘明具體原因及資金來源後，由經辦及主管於訪談內容旁蓋章確認。","o":["10","30","40","50"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-6-1 外幣現鈔託收連線作業應注意事項","t":"一、受理申請：（一）於查驗身分證明文件並影印留存後，請客戶填寫「<mark>外幣現鈔</mark>託收申請書」，由申請人詳填鈔券號碼、基本資料、款項處理方式並簽署後<mark>，應落實</mark>認識客戶程序(KYC)，評估其<mark>資金來源</mark>合理性。<mark>倘經評估可受理者，於申請書空白處敘明具體原因及資金來源後，由經辦及主管於訪談內容旁蓋章確認。</mark>"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第35頁","v":66,"t":"•受理個人(不論任何年齡)臨櫃辦理結購或自外存提領<mark>外幣現鈔</mark>，單筆金額達<mark>等值新臺幣</mark>50萬元(含)以上時，應以「臨櫃作業關懷客戶提問表」向存戶或受託人詢問了解其交易目的有無異常，倘有陪同提款者時，並應詢問存戶是否認識陪同提款者，或有無其他可疑之處，並由經辦人員將訪談結果填寫於本表，併同申請文件留存備查。•以下收兌案件，受理前皆應落實認識客戶程序(KYC)，評估其<mark>資金來源</mark>合理性，<mark>倘經評估可受理者</mark>，應於「<mark>收兌外幣現鈔</mark>/旅行支票申請書」(或<mark>收兌外幣</mark>申請書)或「<mark>外幣現鈔</mark>託收申請書」<mark>空白處敘明具體原因及資金來源後</mark>，<mark>由經辦及主管於訪談內容旁蓋章確認</mark>:<mark>收兌外幣現鈔金額</mark>達<mark>等值新臺幣</mark>50萬元(含)以上。採「託收」方式或因受理金額限制採「代受理」方式之<mark>收兌外幣現鈔</mark>者。"},"x":"依講義〈2026外匯業務法規與實務〉第35頁：「以下收兌案件，受理前皆應落實認識客戶程序(KYC)，評估其資金來源合理性，倘經評估可受理者，應於「收兌外幣現鈔/旅行支票申請書」(或收兌外幣申請書)或「外幣現鈔託收申請書」空白處敘明具體原因及資金來源後，由經辦及主管於訪談內容旁蓋章確認:收兌外幣現鈔金額達等值新臺幣50萬元(含)以上。」"},{"id":"114-35","y":114,"n":35,"m":7,"q":"本行客戶持非本行賣出之外幣現鈔辦理收兌，金額超過等值（　）萬美元(含)以上者，一律採「託收」方式辦理。","o":["1","3","5","10"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"件留存備查。五、收兌(含原幣存入)<mark>外幣現鈔</mark>作業(一)受理流程1.受理金額限制:(1)<mark>本行賣出</mark>：得憑本行賣匯水單於原結購金額限額內兌換，並於原賣匯水單顧客聯上註明收兌日期及兌換金額。(2)<mark>非本行賣出</mark>A.<mark>本行客戶</mark>：a.個人戶：每日臨櫃受理之收兌金額最高以等值美金3萬元為限，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。b.公司戶：每日臨櫃受理之收兌金額最高以等值美金5萬元為限，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。c.收受<mark>超過等值</mark>美金10萬<mark>元(含)以上者，一律採「託收」方式</mark>處理，收取託收手續費，並將「<mark>外幣現鈔</mark>託收申請書」影本、適用表單年齡級距"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第36頁","v":35,"t":"•<mark>外幣現鈔</mark>收兌額度分級管理<mark>本行賣出</mark>者：得憑本行賣匯水單於結購金額內兌換。<mark>非本行賣出</mark>者：A.<mark>本行客戶</mark>:a.每日臨櫃受理之撥款額度：個人戶等值美金3萬元，公司戶等值美金5萬元，超過限額者，應採「代受理」之方式，將「收兌<mark>外幣現鈔</mark>/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。b.收受<mark>超過等值</mark>美金10萬元(含)以上者，<mark>一律採託收方式</mark>處理，收取託收手續費，並將「<mark>外幣現鈔</mark>託收申請書」影本、票號留存聯(請客戶簽章)，連同全數現鈔送交資金母行，俟現鈔供應行驗証真偽無誤後始得入帳。"},"x":"依講義〈2026外匯業務法規與實務〉第36頁：「b.收受超過等值美金10萬元(含)以上者，一律採託收方式處理，收取託收手續費，並將「外幣現鈔託收申請書」影本、票號留存聯(請客戶簽章)，連同全數現鈔送交資金母行，俟現鈔供應行驗証真偽無誤後始得入帳。」"},{"id":"114-36","y":114,"n":36,"m":7,"q":"線上申購外幣現鈔逾指定提領日多久仍未領取現鈔者，得依線上申購現鈔服務約定事項扣除相關費用後存入申請人帳戶？","o":["14天","3個月","3年","5年"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第八節 線上申購外幣現鈔","t":"2.<mark>逾指定提領日</mark>3個月<mark>仍未領取現鈔者，</mark>應依下列程序辦理相關作業：(1)聯繫申請人確認領取意願，與其約定最終領取日期，告知本行有權依「<mark>線上申購外幣現鈔服務約定事項</mark>」將逾期未領取之現鈔辦理收兌，其<mark>相關費用</mark>(如手續費、匯率差價)或兌回新臺幣之匯率損失須由申請人自行負擔，並於簽收單空白處註記通知紀錄，經辦及主管於註記內容旁蓋章確認。(2)倘申請人表示已無領取意願或失聯者，得由經辦會同外匯主管共同拆封「小額現鈔紙袋(存160)」，按買入<mark>外幣現鈔</mark>手續辦理收兌作業，並自收兌款<mark>項扣除相關費用後存入申請人帳戶</mark>。(3)「<mark>外幣現鈔線上申購</mark>申請書暨簽收單」及「收兌外幣申請書」之客戶簽章處手工註記「<mark>依線上申購現鈔服務約定事項</mark>，於X年X月X日將逾期未領之現鈔收兌存入本人帳戶(帳號________)。」。(4)前述與客戶聯繫之所有過程(包括電話空號、無人接聽等)，均應於簽收單空白處詳實註記(包括通知日期、時間、電話及聯繫內容等)，並由經辦及"},"x":"線上申購外幣現鈔逾指定提領日 <b>3 個月</b>仍未領取，得依約定扣除相關費用後收兌存入申請人帳戶。"},{"id":"114-37","y":11
