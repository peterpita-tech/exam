<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外匯考點筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --panel:#fbfaf7; --card:#ffffff; --line:#e3ddd3; --line2:#efeae2;
  --ink:#1d1b19; --ink2:#3d3833; --muted:#7a726a;
  --accent:#a4502a; --accent-soft:#f3dfd0; --accent-ink:#8a3f1d;
  --navy:#2c4a72; --green:#2f6a44; --ok:#2f6a44; --ok-bg:#e6f1e9; --bad:#b3261e; --bad-bg:#fbe7e4;
  --mark:#fbe3a6; --warn:#8a6a12; --warn-bg:#fbf3dc;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"JetBrains Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
  --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
  --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
  --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
  --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --panel:#211e1a; --card:#26221e; --line:#3a342d; --line2:#2f2a24;
    --ink:#f0ebe3; --ink2:#d6cec3; --muted:#a39889;
    --accent:#e08a5c; --accent-soft:#3d2a1f; --accent-ink:#f0a77e;
    --navy:#4f73a6; --green:#4e9a69; --ok:#7cc795; --ok-bg:#1f3326; --bad:#ff8a80; --bad-bg:#3a1f1c;
    --mark:#5c4a17; --warn:#e6c46a; --warn-bg:#352d16;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding:18px 40px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.5px}
.stat{color:var(--muted);font-size:13px;margin-top:2px}
.xlink{font-size:13px;margin-top:4px}.xlink a{color:var(--accent-ink);margin-right:12px}.xlink b{color:var(--ink);margin-right:12px}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:6px;align-items:center}
nav.tabs button{background:none;border:1px solid transparent;border-bottom:2px solid transparent;font:inherit;font-size:15px;padding:8px 14px;color:var(--ink2);cursor:pointer;border-radius:8px 8px 0 0}
nav.tabs button.on{border-color:var(--line);border-bottom:2px solid var(--accent);background:var(--panel);color:var(--ink);font-weight:700}
.theme{border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 10px!important}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}
aside .search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
aside .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
select{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.mlist{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:calc(100vh - 250px);overflow:auto;position:sticky;top:12px}
.mi{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--line2)}
.mi.on{background:var(--accent-soft)}
.mi .code{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.mi .nm{font-weight:700;font-size:15px}
.mi .ct{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px}
.mi .sb{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.5}
.mi .bar{grid-column:2/4;height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:4px}
.mi .bar i{display:block;height:100%;background:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px 34px;min-width:0}
.mtitle{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mtitle .code{font-family:var(--mono);font-size:36px;color:var(--accent);font-weight:600}
.mtitle h2{font-family:var(--serif);font-size:34px;margin:0}
.msub{color:var(--muted);margin:4px 0 18px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card)}
.kpi div{padding:12px 14px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:600}
.kpinote{font-size:12px;color:var(--muted);margin:8px 0 0}
section{max-width:880px}
section h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:34px 0 14px;padding-top:26px;border-top:1px solid var(--line)}
section h3 small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.badge{display:inline-block;color:#fff;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:3px;margin:14px 0 8px}
.b0{background:var(--navy)}.b1{background:var(--green)}
ul.nt{margin:0 0 6px;padding-left:20px}
ul.nt li{margin:5px 0}
ul.nt b{color:var(--accent-ink)}
.rvbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rvbar input{flex:1;min-width:200px;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:14px}
.rvtoc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.rvtoc a{font-size:12.5px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--panel)}.rvtoc a:hover{border-color:var(--accent)}
h3.rvs{font-family:var(--serif);font-size:20px;font-weight:500;margin:26px 0 10px;padding:8px 12px;background:var(--accent);color:#fff;border-radius:6px;scroll-margin-top:60px}
details.rvc{border:1px solid var(--line);border-radius:6px;margin:0 0 8px;background:var(--panel);scroll-margin-top:60px}
details.rvc>summary{cursor:pointer;padding:9px 12px;font-weight:700;list-style-position:inside}
details.rvc>summary:hover{color:var(--accent-ink)}
.rvb{padding:0 16px 10px}.rvb h4{font-size:14.5px;margin:12px 0 4px;color:var(--accent-ink)}.rvb ul{margin:0;padding-left:20px}.rvb li{margin:4px 0}.rvb b{color:var(--accent-ink)}.rvb p{margin:6px 0}
.fq{float:right;font-size:12px;font-weight:600;padding:1px 9px;border-radius:10px;color:#fff;margin-left:8px}.fqA{background:#c0392b}.fqB{background:#e67e22}.fqC{background:#2980b9}
.rvhit{background:var(--accent-soft);border-radius:2px}
u{text-decoration:none;border-bottom:1.5px solid var(--accent);}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.num{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px}
.num b{display:block;font-family:var(--mono);font-size:17px;color:var(--accent-ink)}
.num span{font-size:12.5px;color:var(--ink2)}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.yrs span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);background:var(--card)}
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.qc{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:16px 18px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.sim{background:var(--green);color:#fff}
.tag.hist{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--sans)}
details.qsec{max-width:880px}details.qsec>summary{list-style:none;cursor:pointer}details.qsec>summary::-webkit-details-marker{display:none}
details.qsec>summary h3::before{content:'▸';display:inline-block;width:1.1em;color:var(--accent);transition:transform .15s}
details.qsec[open]>summary h3::before{transform:rotate(90deg)}details.qsec>summary .cnt{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px}
.rwbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag.md{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--sans)}
.qt{font-size:15.5px;margin:4px 0 10px}
.qt .it{font-family:var(--mono);color:var(--accent);font-weight:600}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer;line-height:1.6}
.op:hover{border-color:var(--accent)}
.op .l{font-family:var(--mono);font-weight:600;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--card)}
.op.ok{background:var(--ok-bg);border-color:var(--ok)}
.op.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:var(--bad-bg);border-color:var(--bad)}
.op.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.done .op{cursor:default}
.ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{margin:6px 0}
.cite{margin-top:10px;border-left:3px solid var(--navy);background:var(--panel);padding:8px 12px;border-radius:0 6px 6px 0}
.cite .lb{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;margin-right:8px}
.cite .path{font-size:12.5px;color:var(--muted)}
.cite.lec{border-left-color:var(--green)}.cite.lec .lb{background:var(--green)}.tag.lecq{background:var(--navy)}.cite.rul{border-left-color:var(--accent)}.cite.rul .lb{background:var(--accent)}.tag.rulq{background:var(--accent)}.warn.web a{color:var(--accent-ink);text-decoration:underline}.tag.lxq{background:var(--green);color:#fff}.tag.qt{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-ink)}.cite.lx{margin-top:10px}details.lxp{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--card)}details.lxp summary{cursor:pointer;line-height:1.9}
.cite .tx{font-size:14px;color:var(--ink2);margin-top:6px;word-break:break-all}
mark{background:var(--mark);color:inherit;padding:0 1px}mark.kp{font-weight:600;border-bottom:2px solid var(--accent)}.kpt{display:inline-block;font-size:11px;line-height:1.5;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 8px;margin-top:8px;display:inline-block}
.redo{float:right;font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:20px 0}
table.nt{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.nt th,table.nt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.nt th{background:var(--line2);font-weight:700}
table.nt td.k{font-family:var(--mono);color:var(--accent-ink);white-space:nowrap}
.qzbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.score{font-family:var(--mono);font-size:22px;color:var(--accent-ink)}.score.big{font-size:40px}.qzres{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:8px;padding:14px 18px;margin:16px 0}.qpart{font-family:var(--serif);margin:26px 0 4px;color:var(--accent-ink)}
.mchk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;font-size:13.5px}
.mchk label{cursor:pointer}
.legend{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
  .wrap{padding:14px 16px 40px}
  .grid{grid-template-columns:1fr}
  .mlist{position:static;max-height:260px}
  main{padding:22px 16px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .kpi div{border-bottom:1px solid var(--line)}
  .mtitle .code{font-size:26px}.mtitle h2{font-size:24px}
  h1{font-size:23px}
  nav.tabs{overflow-x:auto;max-width:100%}
  nav.tabs button{padding:7px 9px;font-size:14px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>外匯業務 考點學習筆記</h1>
    <div class="xlink"><a href="徵授信業務-考點學習筆記.html">徵授信</a><b>外匯</b><a href="存匯會計業務-考點學習筆記.html">存匯會計</a><a href="信託理財業務-考點學習筆記.html">信託理財</a></div>
    <div class="stat" id="stat"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="mod" class="on">考點</button>
    <button data-v="quiz">模擬考 60 題</button>
    <button data-v="nums">必背數字</button>
    <button data-v="rv" id="tabrv">細則複習點</button>
    <button data-v="lx" id="tablx">講義對照</button>
    <button data-v="wrong">錯題本</button>
    <button class="theme" id="theme" title="切換深淺色">◐</button>
  </nav>
</header>
<div class="grid">
  <aside>
    <input class="search" id="q" placeholder="搜尋題目或細則（如 UCP600、擔保提貨、DCI）">
    <div class="row2">
      <select id="fy"><option value="">全部年度</option><option>110</option><option>111</option><option>112</option><option>113</option><option>114</option></select>
      <select id="fs"><option value="">全部題目</option><option value="un">未作答</option><option value="bad">答錯</option><option value="ok">答對</option></select>
    </div>
    <div class="count" id="cnt"></div>
    <div class="mlist" id="ml"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA={"mods":[{"id":1,"t":"出口押匯・UCP600 單據審查","sub":"審單原則・提單/航空/保險單據・轉讓・拒付與逾期・買斷賣斷・轉開信用狀","w":"每年約 8–10 題（最大宗）","notes":[["審單原則（UCP600）",["審查以單據為本，依<b>單據表面</b>決定是否構成符合之提示；審查期間自提示日<b>次日</b>起最長 <b>5 個銀行營業日</b>。","提示<b>非信用狀要求</b>之單據 → 不予理會並可退還提示人（不必審查）。","單據日期<b>得早於</b>信用狀簽發日，但不可遲於提示日。","未規定提示期間，且含 UCP 19–25 條正本運送單據 → 不得遲於裝運日後 <b>21 個曆日</b>，且須在有效期限內。","有效期限、提示末日遇銀行休假可順延至次一營業日；<b>最後裝運日不得順延</b>。","「about / approximately」→ 金額、數量或單價容許 <b>±10%</b>（例：ABOUT 50,000 → 45,000～55,000）。","分期裝運任何一期未依期裝運 → 該期<b>及其後各期</b>均中止使用。","信用狀即使未表明可否撤銷，<b>視為不可撤銷</b>；修改須全體同意，受益人對同一修改書<b>不得部分接受</b>。","讓購（Negotiation）＝指定銀行於應獲補償之營業日或之前，以墊款或同意墊款方式買入匯票及/或單據。保兌銀行無意保兌時應儘速告知<b>開狀銀行</b>。"]],["運送與保險單據",["提單受貨人 To Order / To Order of Shipper → 由<b>託運人空白背書</b>。","備運提單（Received for shipment）須加註 <b>On Board</b> 及日期始視為已裝船；不得接受傭船契約及<b>以傭船契約條款為準之提單</b>。","可接受：Shipper's Load and Count、貨物「可能」裝甲板條款、受益人以外之發貨人、運送人保留轉運權利條款。","傭船提單代理人簽署須表明代替船長、船東或傭船人；簽發日視為裝運日（除非另有裝載註記）。","<b>航空運送單據</b>是收據、<u>非權利證券</u>，不得背書轉讓；應表明運送人名稱及簽發日；全程同一單據涵蓋者，即使禁止轉運仍可接受轉運。","商業發票原則<b>無須簽署</b>；應由受益人簽發、以申請人為抬頭，幣別同信用狀。","保險：最低投保額為 CIF/CIP 之 <b>110%</b>；保險幣別須與信用狀<b>相同</b>；投保通知書不接受；可含不承保條款、免賠額；生效日不得遲於裝運日。","CFR、CIF、CPT、CIP → <b>Freight Prepaid</b>；FCA、FOB、FAS → Freight Collect。","未規範之貨運單據例：<b>Cargo Receipt</b>（進口開狀須經分行經理核准）。"]],["拒付・逾期入帳・利息",["遭國外拒付 → <b>1 個月</b>內解決或收回新臺幣；超過 <b>3 個月</b>未結案或影響債權 → 採法律程序。","逾押匯日起 <b>90 天</b>（押匯）或匯票到期日起 <b>60 天</b>（貼現）未入帳 → 比照拒付填「出口押匯拒付整理日誌」並送外匯作業部建檔。","出口押匯息：港幣（香港）、新加坡幣（新加坡）、日圓（日本）計收 <b>7 天</b>；其他地區 <b>12 天</b>。","單據待補送/補正：現行細則為超過 <b>5 個營業日</b>未補 → 於審核工作單敘明並呈經理（111 年考題答 7 日，留意版本）。","簽章登記卡：無授信往來者可用本行得核對之印鑑；<b>負責人變更或更換印鑑</b>須重徵。"]],["轉讓・買斷賣斷・轉開",["可轉讓信用狀須敘明 TRANSFERABLE；開狀銀行得為轉讓銀行；轉讓費用除另有規定由<b>第一受益人</b>負擔；允許部分裝運 → 可轉讓予<b>一個以上</b>第二受益人（第二受益人不得再轉讓）。","換單分割轉讓：金額、單價可減少；有效期限提前 7 天以上；裝運日可提前；提示期間可縮短；<b>保險投保百分比可增加</b>。","初級市場遠期信用狀買斷：接獲開狀行(保兌行)<b>承兌通知後</b>付款；開狀行財務危機/國家風險不付款→無追索；<b>商業糾紛、法院禁止支付命令</b>→仍可向出口商追償。","遠期信用狀賣斷受理對象：長天期（180 天以上）且信用有疑、押匯額度不足、高風險地區、無法授信之特殊需求；<u>即期信用狀不適用</u>。","轉開信用狀：幣別原則同原始信用狀、金額可較少、最後裝船日不晚於原始信用狀、有效期限提前 1–2 星期；未規定快遞寄單者有效地點加註 <b>At our counter</b>；於原始信用狀<b>正面</b>註明轉開資料；轉開國外 LC 在<b>進口</b>授信額度內辦理。"]],["2026 講義補充",["信用狀三特性：<b>獨立性</b>（與買賣契約各自獨立）、<b>單據符合原則</b>、<b>無因性</b>（UCP 第 5 條：銀行僅處理單據）。未註明可否撤銷視為不可撤銷（撤銷須開狀行、受益人、保兌行同意）；須<b>明示</b> Transferable 始得轉讓。","商業發票以外之單據，貨物/勞務說明得以<b>不牴觸之統稱</b>敘明；押匯申請書金額應與匯票相同，信用狀號碼及開狀行須相符且<b>不得塗改</b>。","新往來或實績不多客戶持鉅額 L/C 押匯 → 必要時實地瞭解營運；標的貨物非出口商業務範圍 → 提高警覺避免<b>借牌押匯</b>。","拒付：逾<b>三星期寬限處理期</b>仍未解決 → 送外匯營運處建檔並填拒付整理日誌；1 個月內解決、逾 3 個月採法律程序；<b>逾 6 個月</b>仍未收回 → 填「外匯逾期放款轉列催收款項明細表」轉列催收款項。"]]],"nums":[["5 營業日","審單期間"],["21 曆日","未規定提示期間"],["±10%","about/approximately"],["110%","保險最低投保額"],["1 / 3 個月","拒付解決／法律程序"],["90 / 60 天","押匯／貼現逾期未入帳"],["7 / 12 天","押匯息計息天數"]],"cnt":46,"yrs":{"110":9,"111":11,"112":12,"113":7,"114":7}},{"id":2,"t":"進口開狀・託收・擔保提貨","sub":"開狀審查・超額押匯・未用餘額沖銷・D/A 到期日・URC522・擔保提貨・保證函","w":"每年約 4–5 題","notes":[["開發進口信用狀",["信用狀金額不得超過所附交易單據金額；通知銀行以本行通匯銀行為原則；最後裝運期限應在有效日期<b>以前或同日</b>（不超過輸入許可證期限）。","國外費用（開狀行以外）：客戶<b>無特別指示 → 概以「賣方」負擔</b>開發；註明買方負擔者預收（每筆新臺幣 1,200 元）。","FOB/FCA/FAS → Freight <b>Collect</b>；CFR/CIF/CPT/CIP → Freight <b>Prepaid</b>。CFR/FOB/FAS/FCA 由客戶投保並以本行為優先受益人。","Open Policy 統保單：一般客戶須徵 Open Policy <b>正本或副本</b>；每次開狀審查是否在承保範圍；信評 1–7 等低風險客戶經理得憑保險公司函文辦理。","Cargo Receipt 開狀：須辦妥批覆交單條件或十足本行存款擔保，經<b>營業單位經理</b>核准並註記；Cargo Receipt <u>非權利證券</u>。","進口信用狀指標利率：美元 <b>SOFR</b>、日圓 <b>TONA</b>、英鎊 <b>SONIA</b>（歐元 LIBOR 已停用）。","簽章登記卡印鑑拍攝：最遲於承作當日（含）前完成；範圍含「授權印鑑」及「訂約印鑑」；多式印鑑須逐式拍攝（「加一式」）。"]],["到單・超額押匯・未用餘額",["超額押匯：超押金額<b>未逾 5%（含）</b>免補收開狀手續費；<b>超過 5%</b> → 就超押金額<b>全部</b>依原開狀費率及補收當日匯率補收。","補收手續費原則於交單前，因故無法時<b>至遲於首次還款交易時</b>補收（「最遲於交付單據前」為錯誤選項）。","加計超押後融資超過原核准額度 → 超過部分要求客戶全額結匯並補收利息；每日列印 FI60D 異常明細表。","L/C 過期 3 個月（含）以上未展期或結案，到單時就未用餘額全部補收開狀手續費。","得沖銷未用餘額/退還保證金：國外銀行寄回信用狀<b>註銷</b>並註明不再裝運、未過期但國外通知不再裝運、<b>過期一個月以上</b>、金額極小經准沖銷；「寄回修改書」<u>不可</u>。"]],["進口託收（URC522）",["當事人：委託人、託收銀行、代收銀行（接受託收銀行委託處理託收指示）、提示銀行、付款人；保險公司<u>不是</u>。","銀行<b>不審查單據</b>以取得託收指示；託收指示應敘明適用 URC522；代收銀行對地址不正確導致之延遲不負責。","D/A 匯票到期日：<b>After sight → 承兌日</b>起算；<b>After B/L date → 提單裝船日</b>；<b>After date → 匯票發票日</b>。","D/P 除免辦承兌外手續同 D/A，客戶結匯後始交單；D/P 案件不得含未來日期付款匯票（如 D/P 30 天 → 付款後才交單）。","「進/出口託收客戶調查表」：首次受理時填寫；客戶基本資料<b>重大變動</b>時重填；依風險等級於定期審查重填。"]],["擔保提貨・保證函",["正副提單均未到而貨已到 → 可申請擔保提貨；提貨後<b>不得以任何理由拒付</b>。","擔保提貨後，於<b>正本提單到達時</b>向船公司辦理解除擔保責任。","外幣保證函：須有實際需求證明；非本行格式應事先會辦外匯營運處及法務室；拒付以 <b>MT786</b> 通知。","審單期限：UCP600、<b>URDG758 → 5 個營業日</b>；ISP98 → 3 個營業日合理、超過 7 個營業日不合理。"]],["2026 講義補充",["申請開發<b>遠期</b>信用狀須徵「進口遠期信用狀/外幣貸款借款契約」（放211B），<b>每次授信額度核准後重新徵取</b>。","貿易融資應徵客戶與交易對手之交易文件（訂單、契約、預式發票等）交互勾稽，必要時與交易對手照會。","開狀審查：【31D】有效日期原則 <b>6 個月內</b>，6 個月～1 年由營業單位經理核可，<b>1 年以上</b>須授信批覆核准；三角貿易轉開改為 at our counter。【32B】金額不得超過交易文件/輸入許可證且不逾開狀額度。【42C】匯票期限 <b>180 天內</b>為原則（受益人負擔天數＋融資天數 ≦ 每次可貸放期限）。","非權利證券之運送單據（快遞/郵政收據、貨運卡車收貨單、不可轉讓海運貨單、<b>電放提單 Telex Released B/L</b>、Cargo Receipt、Delivery Order 等）→ 先辦妥批覆交單條件或十足本行存款擔保，經<b>營業單位經理</b>核准。","擔保提貨/副提單背書：即期 L/C 須辦妥<b>第二次結匯</b>；遠期 L/C 依授信條件辦妥應辦事項；提貨後不得以任何理由拒付。","進口到單：應於單據到達通知書<b>次日起 5 個銀行營業日內</b>辦理交單。"]]],"nums":[["5%","超額押匯免補手續費上限"],["1 個月","L/C 過期可沖銷未用餘額"],["3 個月","L/C 過期到單補收手續費"],["5 / 3 營業日","URDG758 / ISP98 審單"],["1,200 元","買方負擔國外費用預收"]],"cnt":23,"yrs":{"110":3,"111":4,"112":8,"113":4,"114":4}},{"id":3,"t":"貿易真實性・制裁國家・限制地區","sub":"交易對手查證・Marine Traffic・物流金流一致・俄羅斯/伊朗・限制押匯與審慎辦理地區","w":"每年約 4 題","notes":[["貿易融資真實性審查",["審查內容：<b>貨品價值及內容、關係人交易真實性及合理性、交易對手存在真實性</b>（與行業相關性）。","交易對手應列於客戶<b>最近一年內</b>徵信報告之主要進/銷貨廠商或「進貨/銷貨廠商明細資料表（貿易融資專用版）」，超過時效重查。","初次往來查證方式（<b>任一</b>即可）：註冊地主管機關網站、<b>鄧白氏 D&B</b>、上市櫃/Bloomberg、COFACE 等信用報告、委託海外聯行（放415）、通匯行 SWIFT；查無資訊才請客戶提供歷史交易文件（非一律）。","交易對手為借款人之<b>關係人</b> → 深入了解交易型態並加強查證。","運送單據：交易金額達<b>美金 20 萬（含）</b>以上之海運提單，一律先以 <b>Marine Traffic</b> 查航程是否行經裝卸港；查無資訊或空運/快遞者改用其他方式。","AML 名單檢核範圍：客戶、關聯對象、交易對手、銀行、運送單據及報關單第三人、<b>船舶</b>名稱、<b>港口/機場</b>及<b>國家</b>（飛機不在其列）；海運提單檢核 Carrier、Shipper、Agent。","匯入匯款貨貿文件：匯款幣別應與發票一致、<b>受款人應為發票開立人</b>；匯款人與買方/受貨人不一致（物流金流不一致）須查證代匯合理性。"]],["制裁與特別注意國家",["全面性制裁：古巴、北韓、敘利亞、伊朗等（<u>俄羅斯不是全面性制裁</u>，屬例外管理）；烏克蘭遭俄臨時佔領區屬全面性制裁、一律停止受理。","新客戶（含負責人、實質受益人）國籍為<b>北韓或伊朗</b> → 一律婉拒建立業務關係。","俄羅斯、白俄羅斯、烏克蘭：進口案件<b>受益人或通知銀行</b>、出口案件<b>進口商或開狀銀行</b>位於該國 → 一律不得承作；貨品命中高科技或軍商兩用清單 → 不得承作；涉 SDN / Non-SDN 名單 → 匯入退匯、匯出暫停。","貨物經伊朗航空運送等涉伊朗 → 不得承作。","「疑涉間接轉運俄羅斯案件」加強管控：適用於<b>國外匯入</b>；符合特定客戶及國家之交易逐筆填審查表（非所有外匯交易）；出口轉開疑涉一律不受理；客戶不配合即婉拒。"]],["限制押匯國家 vs. 審慎辦理地區",["<b>限制押匯國家/地區</b>：匯入須確認存匯行已入帳才解付（不論金額）；光票買入<b>一律改託收</b>；進口開狀<b>一律自付條款</b>；出口押匯（貼現）<b>一律改託收</b>。","<b>審慎辦理地區</b>：匯入同樣確認已入帳；光票買入視往來審慎處理；進口開狀<b>一律自付條款</b>；出口押匯視債權確保情形、必要時改託收（遠期可搭配買斷/賣斷）。","外匯防制洗錢相關資料保存至少 <b>5 年</b>；監控報表原則 <b>1 個月</b>內完成審查（特殊延長 10 天）。"]],["2026 講義補充",["AML 四步驟：①初估交易合理性（客戶、對象、用途、性質、金額、頻率）②交易檢核（高風險客戶、疑似第三方、高風險國家、制裁名單）③徵提交易文件（貨貿徵發票＋運送單據、AML 線上姓名檢核、核對買賣方與國家、查禁運貨品）④判斷承做或婉拒。","AML 線上姓名檢核對象（講義）：貿易往來對象、運送單據第三人（託運人、受貨人、到貨通知人、貨物承攬人、船公司及<b>航空公司</b>）、<b>船舶/飛機名稱</b>。（110 年考題以「飛機」為無須查詢之答案，屬舊版規定）","婉拒開戶：A245 警示代碼 <b>Z1-拒絕開戶</b>並留存拒絕開戶專卷；婉拒交易：<b>FXNG</b> 建檔。","涉及制裁規定或對象：FXNG 建檔＋A194 列為<b>高風險客戶</b>＋檢視<b>最近 3 個月</b>外匯交易並通報法遵處；嗣後同一交易對手一律徵文件，當下無法提供運送單據/報關單者一律拒絕。"]]],"nums":[["20 萬美元","Marine Traffic 查航程"],["1 年","交易對手徵信時效"],["5 年","AML 資料保存"],["1 個月","監控報表審查"]],"cnt":20,"yrs":{"110":3,"111":6,"112":2,"113":6,"114":3}},{"id":4,"t":"國外匯兌・電文・匯款 AML","sub":"匯出入作業・SWIFT 電文・退匯・EDD 免徵文件・追蹤登記簿・詐騙關懷・人民幣・手續費","w":"每年約 9–10 題（最大宗）","notes":[["國外匯出匯款",["金額達<b>美金 100 萬（含）</b>以上：外匯主管 R211 放行後須於電文系統執行<b>大額放行</b>，並由<b>另一位主管</b>於水單「大額覆核主管」欄蓋章（至少 4 人：經辦、覆核、放行主管、大額覆核主管）。","R211 放行成功後即<b>不得更改或刪除</b>；電文系統發現錯誤 → 退回並改以手工拍發。","覆核人員須有 <b>6 個月</b>以上外匯經歷，不得兼任放行主管或大額覆核主管。","匯往中國、香港、澳門、日本、新加坡、越南等<b>亞洲地區海外分行</b>案件，主管應於 <b>1 小時</b>內放行電文。","本行客戶以新臺幣<b>現金</b>結匯匯出達<b>美金 1 萬</b> → 註記現金來源及合理性；單筆現金達新臺幣 50 萬 → 大額通貨交易申報（A190）。","<b>非本行客戶</b>匯出匯款（含票匯）或結購現鈔，每人每日<b>不得逾美金 1 萬</b>；客戶國籍北韓、伊朗或移民署通報行方不明者一律婉拒。","個人臨櫃匯出達<b>新臺幣 50 萬</b>（含）或<b>高齡（65 歲以上）</b> → 落實關懷提問；受款帳號屬<b>警政署</b>提供之境外詐欺帳戶 → 關懷提問並經主管授權（FAT1）。","票匯：匯票通知以 <b>MT110</b> 替代；止付以 <b>MT111</b>。MT103 劃帳：受款行為本行存匯行逕劃；否則優先選<b>共同存匯行</b>；無共同存匯行仍選本行存匯行並<b>加註中間行</b>。"]],["匯入匯款・退匯",["匯款人資訊不足：請受款人聯繫匯款人更正；優良往來客戶小差異可徵切結書先解款，但<b>仍須發電</b>索取完整資料；逾發電日 <b>10 個營業日</b>未回覆得逕予退匯；收到回覆仍須做 AML 查詢。","僅有 P.O.BOX 地址：發電索取，逾 3 個營業日未回覆可查 D&B 或由受款人提供佐證後解款。","匯入已解付而客戶同意退匯但無外匯 → 按<b>退匯當日牌告即期賣出匯率</b>折收新臺幣。","匯款人主動退匯：MX 格式 RTGS 案件以 <b>CAMT.056</b>；非 RTGS 可拍 MT199 或 CAMT.056；存同→確認 MT950 貸方已退回；同存→取得授權扣帳文句。","匯入通知書「註記提醒事項」由主管及經辦確認並蓋章；附言匯款目的應與營業性質或申報性質相符。"]],["電文系統（SWIFT）",["各級使用者<b>不得互相兼任</b>、僅得申請一組帳號；覆核人員由具覆核資格經辦或副理擔任。","密碼使用期限 30 曆日；連續錯誤 <b>5 次</b>或逾 <b>60 天</b>未登入自動失效；<b>每週</b>查詢「使用者帳號明細表」（非每月）。","去電狀態 <b>NAK</b> → 依系統指示更正後<b>重新拍發</b>；疑似重複拍發加註 PDE。","手工電文：金額欄不得擦改；付款類不論金額須<b>兩名</b>電文稿主管核准；僅一名主管核准時，放行人員<b>不得</b>與該主管同一人。"]],["匯款 AML・EDD・追蹤登記簿",["EDD 交易審查表免徵文件適用：單筆<b>≦ 新臺幣 50 萬</b>、本人同戶名帳戶、週期性匯款且一年內已徵佐證、交易對手列於徵信報告等。","<b>高風險客戶涉及高風險國家或疑似第三方交易</b> → 一律徵提交易文件，不得以審查表取代；中低風險涉疑似第三方交易亦應徵文件。","中低風險免徵文件（第 2 項）抽查：<b>按季</b>（1、4、7、10 月），每 10 件抽 3 件、不足 10 件抽 1 件；抽查須向客戶徵提該筆佐證文件並查制裁。","未出貨先匯款：登記「國外匯出/入匯款交易追蹤事項登記簿」；預計出貨日原則不超過受理日 <b>3 個月</b>；預計出貨日後 <b>2 個月</b>內補送運送單據/報關單；結案呈外匯主管、洗督主管及經理。","匯款分類：國外母公司對國內子公司<b>一年以上</b>貸款 → <b>320 僑外貸款投資</b>；無投資關係融資 → 280 / 340；在臺辦事處（身分別 2 團體）匯入不得申報 340 國外融資。"]],["人民幣・電子通路・手續費",["自然人每日透過帳戶買賣人民幣：買、賣<b>分別</b>計算各 <b>2 萬</b>，併計所有通路，<b>全行管控</b>（非全國）；人民幣匯入金額無限制；本國自然人匯往大陸每人每日同一銀行 ≦ 8 萬。","第e個網/第e行動/iLEO 外幣匯款手續費：<b>0.25‰</b>，最低 200、最高 800，另郵電費 300；本行帳戶間轉帳<b>免手續費</b>；匯入匯款 0.5‰（200～800）。","網銀約定轉入他人外幣帳號、國外受款人 → 約定後<b>次 2 日</b>生效；多幣別全球匯款合作花旗、美國銀行，限電匯、臨櫃受理。","買入外幣匯款暨票據額度：營業單位經理得於額度之 <b>20%</b> 彈性額度內先行受理。"]],["2026 講義補充",["作業規範－匯出電文必要匯款人資訊：<b>姓名、扣款帳號</b>（無帳號可用獨立序號）、<b>地址</b>（可以統編、身分證、護照、居留證號或出生日期與地點代替）；受款人資訊：姓名、受款帳號（或獨立序號）。","匯入：受款人地址<b>非必要</b>資訊；如附隨地址應與建檔核對，不合理須說明；附言目的與營業/申報性質不符須分析註記。","匯款人為<b>第三方支付業者</b>（WeChat Pay、Alipay、LINE Pay、PayPal…）之匯入款：確認是否名義上匯款人，請客戶通知揭露實際買方姓名金額；未提供則發電索取，<b>逾 10 個營業日</b>未提供予以退匯。","匯款投資<b>虛擬通貨</b>（受款人為虛擬通貨平台或匯款分類 <b>268</b>）：填「臨櫃作業關懷客戶提問表-虛擬通貨平台專用」；達新臺幣 50 萬另填「虛擬通貨匯兌業務案件審查表」。","關懷提問表適用排除：整批匯款、匯至本人同戶名帳戶、週期性匯款。"]]],"nums":[["100 萬美元","大額覆核主管＋大額放行"],["1 萬美元","非客戶匯出上限／現金結匯註記"],["50 萬新臺幣","關懷提問／EDD 免徵門檻"],["10 營業日","匯款人資訊不足逕退匯"],["3 / 2 個月","預計出貨日／補送單據"],["1 小時","亞洲海外分行放行"],["2 萬人民幣","自然人每日買或賣"]],"cnt":47,"yrs":{"110":6,"111":8,"112":9,"113":12,"114":12}},{"id":5,"t":"結匯申報・身分別・匯款分類","sub":"外匯收支或交易申報辦法・逕行/檢附文件/核准結匯・大額通報・身分別代號・居留證","w":"每年約 4 題","notes":[["申報門檻",["結匯金額<b>未滿新臺幣 50 萬</b>（本國人或非居住民）→ 免填申報書，且不計入當年累積結匯金額（注意化整為零）。","<b>逕行結匯</b>：出口貨品或對非居住民提供服務收入、辦事處結售在臺無營運收入辦公費用、<b>非居住民每筆未超過 10 萬美元</b>（境外非我國金融機構不得以匯入款結售）。","<b>檢附文件結匯</b>：公司、行號每筆 <b>100 萬美元</b>（含）以上；個人、團體每筆 <b>50 萬美元</b>（含）以上，應確認申報書與合約、核准函相符。","<b>須經央行核准</b>：現行（113.10.31 央行令修正）公司、行號每年累積結匯超過 <b>1 億美元</b>、團體與個人超過 <b>1 千萬美元</b>之必要性匯款（113 年考題仍為舊制 5,000 萬美元）；未滿 18 歲者每筆達新臺幣 50 萬亦須核准。","第e金網結匯逾等值<b>美金 30 萬</b> → 先與營業單位議價取得議價編號。"]],["大額通報央行",["同一客戶同一訂約日即期結匯併計達 <b>100 萬美元</b>（公司、個人皆同；不含跟單進出口）→ 訂約日 18:30 前執行 Q111 通報；遠期單筆達 100 萬美元亦傳送。","傳真央行外匯局（18:30 前）：公司行號對外貸款/國外借款同一性質當日累計達 <b>100 萬美元</b>；利用當年累積額度當日累計達 <b>500 萬美元</b>；個人、團體同一性質當日累計達 <b>50 萬美元</b>。","大額結購結售每筆達 <b>500 萬美元</b>（含）→ 另於訂約日下午 4:30 前<b>電話</b>通報央行外匯稽核科。"]],["身分別與證號",["未辦商業登記之<b>診所、會計師事務所、律師事務所</b>及公益信託 → 按<b>團體</b>辦理；駐臺外交機構人員 → 按非居住民，無金額限制。","外國公司<b>在臺辦事處</b>（即使系統建檔為公司）→ 身分別「<b>2 團體</b>」，匯入限 <b>196、410、511</b>（不可 340 國外融資）。","持居留證（含港澳、大陸人士）或<b>就業金卡</b>之外國人 → 身分別「<b>4</b>」，共 10 碼。","居留證新證號：第一碼英文字母、後<b>九碼</b>數字，第二碼為性別碼（<b>8 男、9 女</b>）；舊證號前二碼英文（A、C 男，B、D 女）、後八碼數字。","代理外國人：16/17/18（公司代理外國自然人/法人/銀行）、26/27/28（法律、會計師事務所代理）、36/37/38（本國人代理）。"]],["匯款分類常考",["居住民對<b>有投資關係</b>國外事業一年以上貸款 → <b>220 對外貸款投資</b>（未滿一年或對大陸直投事業 → 221）。","國外母公司對國內子公司一年以上貸款 → <b>320 僑外貸款投資</b>；無投資關係融資 → 280 對外融資 / 340 國外融資。","利息收支：國外存款利息收入 443、國外貸款利息收入 440、國外借款利息支出 440；手續費及佣金 194。"]],["2026 講義補充（申報辦法）",["申報範圍：境內新臺幣 <b>50 萬</b>以上等值外匯收支；未涉新臺幣結匯或進出口跟單結匯者，以其他交易憑證或結匯證實書視同申報書；對大陸匯款準用。","「個人」：年滿 <b>18 歲</b>，領有國民身分證或居留證<b>效期 1 年以上</b>；「非居住民自然人」：未領居留證或效期未滿 1 年之外國人，或持我國護照但無戶籍者；「非居住民法人」：境外非中華民國法人。","逕行結匯（第 4 條）：進出口貨款、服務收支（兩者<b>不計入</b>累積額度）、年累積 1 億/1 千萬內、辦事處辦公費、非居住民每筆未超過 10 萬美元。","檢附文件（第 5 條）：公司行號每筆 100 萬美元、團體個人 50 萬美元、核准之直接投資/證券投資/期貨、<b>境內交易標的涉境外貨品或服務</b>（不計入累積）、第一上市外國公司原始外籍股東、民營事業中長期外債。","須核准（第 6 條）：年累積超過 1 億/1 千萬；未滿 18 歲每筆達新臺幣 50 萬（法定代理人共同簽章，已婚除外）；非居住民每筆<b>超過 10 萬美元</b>之境內工程款、提存擔保金及仲裁費、取得自用不動產、遺產保險金撫卹金。","申報書及證明文件<b>保存至少 5 年</b>；非居住民自然人須本人親辦，法人授權境內代表人，非我國金融機構者授權<b>境內金融機構</b>代辦；申報後原則不得更改（非故意且有律師/會計師/銀行意見書等可申請更正）；故意不申報或不實 → 罰鍰<b>新臺幣 3 萬～60 萬</b>。","注意事項：非居住民<b>無須查詢</b>當年累積結匯金額；慈善團體國際人道援助匯款計入累積（核准計畫除外）；專用章限結匯用途；申報書金額不得更改。","國別欄：結售外匯存款或國內他行匯入款 →「本國」；結售國內 OBU 匯入款 →「<b>本國國際金融業務分行</b>」。","常見缺失：身分別應為<b>團體</b>卻輸入公司——事務所、基金會、幼兒園、診所、大學、財團法人、扶輪社、在臺辦事處、職業公會、檢驗所、學會。","管理辦法第 47 條：新臺幣即期（不含跟單）、遠期、換匯、換匯換利達 <b>100 萬美元</b> → 訂約日<b>次營業日中午 12 時前</b>傳送央行外匯資料處理系統。"]]],"nums":[["50 萬新臺幣","免填申報書"],["10 萬美元","非居住民逕行結匯每筆"],["100 / 50 萬美元","公司／個人檢附文件"],["1 億 / 1 千萬美元","公司／個人年累積須核准（現行）"],["100 萬美元","同日即期大額通報"],["30 萬美元","第e金網結匯須議價"]],"cnt":20,"yrs":{"110":5,"111":2,"112":4,"113":5,"114":4}},{"id":6,"t":"外匯存款・OBU 帳戶","sub":"外匯定存計息/中途解約/逾期續存・綜存與虛擬存單・iLEO・OBU 開戶與授信目的帳戶","w":"每年約 6–8 題","notes":[["外匯定期存款",["到期一次付本息或<b>按月付息</b>（無按季付息）；利率型態固定或機動，<b>選定後不得中途變更</b>。","指定到期日定存最短 <b>8 天</b>、最長一年內（7 天以下由財務處訂定）；第e個網活存轉定存指定到期日可承作 8 天～12 個月。","機動利率：以一個月期以上為原則、以美元及歐元為原則、<b>不適用存款利率加碼</b>；機動利率或指定到期日者<b>不得選擇按月付息</b>。","未滿一個月期之外匯定存掛牌幣別：美元、英鎊、港幣、澳幣、日圓、紐幣、歐元、人民幣（<u>無南非幣</u>）。","最低承作：<b>數位帳戶（iLEO）每筆 100 美元</b>；其餘帳戶 1,000 美元。","<b>中途解約</b>：未滿一個月期 → <b>不計息</b>；一個月期以上 → 依<b>起存日</b>牌告利率、按實存期間單利計息（<b>含</b>不足整月零星日數）；各級距依已存滿期別利率<b>八折</b>（如存滿 3 未滿 6 個月 → 3 個月期利率八折）。","逾期續存：一個月期以上到期，<b>逾期 10 日內</b>續存得以原到期日起息；逾期未領期間按活存利率；一個月以下逾期不計息。","自動轉期：以原到期日前一營業日<b>相當存期之掛牌利率</b>計息（不沿用原議價利率）；以不簽發新存單為原則；次數不限。","外匯活期存款每年 6/20、12/20 結息；外匯定存可辦質借外幣。"]],["綜存・虛擬存單・存單管理",["外幣綜存虛擬存單：得辦<b>行內</b>質權設定（以確認書取代實體存單），但<b>不得</b>辦理存單質借、不得行外質權設定。","郵寄結清：外匯活存各幣別餘額併計<b>不超過新臺幣 10 萬</b>、定存餘額為零；一併註銷電子通路功能。","空白外匯存單：營業中由指定經辦保管；結帳時送<b>原簽發存單以外之主管</b>覆核檢印；日終入金庫。","新臺幣現金結購存入外存 → 填「新臺幣現金結購外匯存款申請書」＋存入憑條。","身障者無法親簽：以印章代簽須親友、社福人員或<b>非經辦開戶行員</b>簽名證明（以指印、符號代簽須 2 名見證人）。","金如意帳戶：經辦須信託業務人員資格及外匯執照或 <b>3 個月</b>以上外匯經歷；主管須執照或 6 個月經歷。","「自動存」美金存錢計畫：建立時圈存首存 <b>USD100</b>；每帳戶最多 <b>3</b> 個計畫。iLEO 帳戶不得約定為國外匯出匯款轉出帳號、不適用投資組合商品；定期定額結購受理通路不含 iLEO APP。"]],["OBU 開戶",["對象：境外個人（外國護照且境內<b>無住所</b>）、境外法人（外國法律設立；香港登記為「公司」之獨資/合夥不具法人資格）、與本行有 <b>OBU 授信</b>往來之境內法人（授信目的帳戶）；有 DBU 授信往來之境內法人<u>不可</u>。","境外法人應徵：COI 註冊證書、董事名冊、股東名冊、章程等（「註冊代理人一年內簽發之董事職權證明書」<u>非</u>開戶必備）；開戶目的為投資理財 → 徵「<b>資金來源聲明書</b>」。","稅別「<b>2 免稅免扣繳憑單</b>」；E-mail 驗證信 <b>48 小時</b>有效；年度定期審查中低風險客戶徵 <b>1 年內</b>或有效期間內之存續證明。","外幣國庫專戶、外幣備償專戶、以本行名義開立之專戶等 → 以特定帳戶檢核表替代，<b>免</b>做 923P 檢核交易。","未完成既有客戶身分審查之 OBU 客戶：除批次轉帳存入及臨櫃<b>還款、繳息、結清</b>外，其餘交易（如匯款）一律不得執行。"]],["境內法人 OBU 授信目的帳戶",["首筆資金應為<b>授信撥入</b>（貿易融資/保證等間接授信除外）；業務別 86、帳號第六碼 7、多幣別、不發存摺；<b>所有交易限原開戶行</b>；同一分行僅開一戶；第e金網僅查詢。","不屬於存款、<b>不得發給利息</b>；限外幣對外幣交易，<b>不得兌換新臺幣</b>。","資金往來對象：OBU、本國銀行境外分支機構、境外金融機構帳戶，或<b>同一境內法人</b>於 DBU 之外幣帳戶（限還本付息、費用、保證金等）。","與 DBU 本人帳戶往來屬<b>境內交易</b>，國別代碼 <b>TW</b>（1001 中華民國）。"]]],"nums":[["100 / 1,000 美元","數位／一般帳戶定存最低"],["8 天","指定到期日定存最短"],["10 日","逾期續存以原到期日起息"],["八折","存滿3未滿6個月中途解約"],["10 萬新臺幣","郵寄結清上限"],["48 小時","OBU E-mail 驗證"]],"cnt":37,"yrs":{"110":12,"111":11,"112":2,"113":6,"114":6}},{"id":7,"t":"外幣現鈔・票據・人員與櫃檯","sub":"現鈔收兌/結購・偽鈔・高齡關懷・外幣 ATM・買入代收外幣票據・外匯人員資格","w":"每年約 5 題","notes":[["外幣現鈔收兌與結購",["收兌<b>本行賣出</b>現鈔：憑本行賣匯水單於原結購金額內兌換。<b>非本行賣出</b>、本行客戶：個人每日臨櫃 <b>3 萬美元</b>、公司 <b>5 萬美元</b>，超過改「代受理」送資金母行；超過 <b>10 萬美元（含）</b>一律採<b>託收</b>。","<b>非本行客戶</b>：收兌每人每日<b>宜以 500 美元</b>為原則；結購每人每日<b>不得逾 1 萬美元</b>；國籍屬全面性制裁國家一律婉拒。","須落實 KYC 並於申請書敘明資金來源者：收兌達<b>新臺幣 50 萬</b>、非本行客戶收兌超過 500 美元、託收或代受理、保全業者。","各單位有收兌義務，<b>不得</b>以舊版鈔、未提供水單或無庫存為由拒絕；申購與收兌皆須留存票號並由<b>非經辦之人員覆點</b>。","收兌結售手續費：本行客戶每筆 <b>100 元</b>、非本行客戶 <b>200 元</b>（經理可減為 100）；存入外存按即期與現鈔買入匯率差（最低 100）；人民幣陳舊鈔券每 100 元人民幣另收 <b>5 元</b>。","新臺幣結購現鈔達新臺幣 50 萬 → 加徵申報書並辦大額通貨交易申報（A190）；客戶 <b>55 歲以上</b> → 依存184 背面落實關懷提問。","線上申購現鈔：逾指定提領日 14 日內通知；延長最長不逾 <b>3 個月</b>；逾 3 個月未領可收兌扣費後存入帳戶。"]],["偽鈔與鈔箱",["偽變造外國幣券總值達<b>等值美金 200 元</b>以上（或未達但持兌人可疑/不同意截留）→ 記明持兌人資料並<b>報警</b>（非「不論金額」）。","截留之偽變造幣券建檔保管，保管期限<b>逾 5 年</b>得會同會計部門銷燬並列冊存查。","外幣現鈔保管鈔箱：由<b>外幣現鈔保管人員或外匯主管</b>至金庫取出（櫃員主任不可）；入庫置獨立上鎖空間，不得與新臺幣鈔箱混放。","外幣 ATM：<b>行內每 7 天</b>、行外每 15 天至少裝卸（清點）一次（遇例假日順延）；外存扣款提領限<b>金如意帳戶及 iLEO 數位帳戶</b>金融卡。"]],["臨櫃關懷",["高齡客戶檢核表（個人戶）：年齡達 <b>65 歲</b>，或 <b>55 歲以上且提領達新臺幣 50 萬</b>。","個人臨櫃結購或自外存提領現鈔單筆達新臺幣 50 萬 → 「臨櫃作業關懷客戶提問表」。","成年年齡已下修為 18 歲：年輕族群辦外存應主動告知匯兌及利率風險（<u>不需</u>法定代理人同意）。","受監護/輔助宣告之人 → 須由監護人或輔助人簽章同意（查 9590 或司法院家事公告）；視障者請見證人協助閱讀。"]],["買入暨代收外幣票據",["申請人<b>須為本行存款往來戶</b>；單筆 ≦ USD300 且累計未入帳 ≦ USD500 → 得免徵保證人；徵保證人須確認非受監護/輔助宣告。","美國票據提示期限：未載明者發票後 <b>6 個月</b>；美國國庫支票有效期 1 年、可隨時退票；正面偽造追索期 1 年、背面 3 年。","美元票據 Cover Letter 付款地區：美國、香港、新加坡、台灣（含 OBU）等；<u>日本、加拿大不在其列</u>。","外幣票據託收／買入手續費 0.25‰，最低 200、最高 800。"]],["人員資格與櫃檯",["外匯經辦須有外匯執照或 <b>3 個月</b>以上經歷；覆核人員、外匯副主管 <b>6 個月</b>；先派任「外匯實習」（經辦至少 3 個月、覆核/副主管 6 個月）。「實習 3 個月＋通過升等測驗」<u>不是</u>資格條件。","僅辦買賣外幣現鈔及旅支之分行：經辦及覆核 5 個營業日以上經歷。","新臺幣活期存款開戶不須外匯資格；外匯活存、定存、金如意帳戶須具資格。","外匯櫃檯（矮櫃）收受及保管新臺幣限額 <b>10 萬元</b>（含）以內（710B 設定）。","行員結匯優惠對象：現職員工、退休員工、行眷（限<b>現職員工配偶/父母/子女</b>及<b>退休員工配偶</b>）；優惠項目：出國結購現鈔、結購一個月期以上外匯定存。"]],["2026 講義補充",["非本行客戶收兌外幣現鈔：每人每日宜以 <b>500 美元</b>為原則，<b>最高不得逾 1,000 美元</b>。","個人（不論年齡）臨櫃結購或自外存提領現鈔單筆達新臺幣 50 萬 → 關懷提問；有陪同者須詢問是否認識。","經理或外幣現鈔保管人員<b>異動</b>時，新接任人員應將各面額鈔券<b>全面拆開點算</b>；保管人員休假或異動須會同交接人、監交人清點並於庫存表簽章。","營業中外幣現鈔皆置上鎖鈔箱，啟閉及存取須在監視錄影範圍內。","管理辦法：辦理外匯（1～6 款）之經辦須 3 個月、覆核 6 個月經歷或具執照；僅辦買賣外幣現鈔及旅支之分行為 5 個營業日。"]]],"nums":[["3 / 5 萬美元","本行客戶個人／公司每日收兌"],["10 萬美元","一律託收"],["500 / 1 萬美元","非客戶收兌／結購"],["200 美元","偽鈔報警門檻"],["5 年","偽鈔保管後銷燬"],["7 / 15 天","行內／行外 ATM 裝卸"],["10 萬新臺幣","外匯櫃檯限額"]],"cnt":26,"yrs":{"110":6,"111":3,"112":5,"113":6,"114":6}},{"id":8,"t":"新臺幣遠期外匯","sub":"實需原則・訂約匯率・交割期間・額度權限・大額通報央行・KYC 與人員","w":"每年約 4–5 題","notes":[["承作原則",["以有<b>實際外匯收支需要</b>者為限，同筆需要不得重複簽約；期限依實需訂定；訂約及交割均須查核實需文件。","<b>展期時應依當時市場匯率重訂價格</b>，不得依原價格展期。","實需文件種類不拘，但<b>僅憑形式發票（Proforma Invoice）不可</b>，須另附發票、訂單或信用狀等佐證。","交易清單方式：遠匯到期日不得超過清單最晚到期日；訂約金額不得大於清單合計；須提供清單<b>前 3 大金額</b>之實際交易證明；不同交易性質不得同一清單。","進口商：以 L/C 付款者<b>待實際開狀後</b>始得訂約；到單前訂約不在本行融資 → 最晚到期日可至 L/C 有效日；到單後訂約且於本行融資 → 不得逾進口單據到達通知書所載到期日；他行開狀者仍可於本行訂遠匯。","境內交易對手且貨物在國內移動 → 不宜以外幣收付後再辦遠匯。","一般客戶 KYC 為<b>保守型、穩健型、積極型</b>皆可承作。"]],["匯率・交割・手續費",["固定到期日：以訂約時相當檔期牌告匯率；超過 180 天期逐筆洽財務處。","任選到期日：<b>貼水</b>時預售用<b>後一檔期</b>買入匯率、預購用<b>前一檔期</b>賣出匯率；<b>升水</b>時預售用<b>前一檔期</b>買入匯率、預購用<b>後一檔期</b>賣出匯率（皆對客戶較不利）。","任選到期日交割期間：到期日減 15 天至到期日（例：5/2 訂 30 天期 → 5/17～6/1）；<b>10 天期以內</b>為訂約日後第 3 個營業日起至到期日；遇休假順延。指定到期日限當日交割。","訂約手續費：訂約金額 <b>1‰</b>、最低新臺幣 <b>400</b> 元，優質客戶經理得減免。","不得接受客戶以本行無擔保放款資金繳存保證金。"]],["額度與權限",["營業單位經理權限風險額度：公司、行號、團體最高 <b>美金 30 萬</b>；<b>個人無經理權限</b>（110 年考題答 3 萬為舊制）。","超過者專案向外匯營運處申請；外匯營運處處長 150 萬、副總 300 萬、總經理超過 300 萬（每戶為準）。","法人已完成「衍生性 KYC」者 → 承作遠匯可<b>自動適用</b>，免重複辦理遠匯 KYC；專業機構投資人、高淨值投資法人不適用 KYC；一般客戶及其他法人專業客戶每年辦理。","「新臺幣遠期外匯交易產品說明書暨風險預告書」<b>無須每年重徵</b>。"]],["大額通報央行",["每筆訂約達 <b>100 萬美元</b> → 填大額遠期外匯傳輸資料表，當日 18:30 前執行 F111 連動傳輸。","當日訂約累計達 <b>200 萬美元</b> → 最遲 <b>16:30</b> 前<b>電話</b>通報央行外匯局稽核科。","當日訂約累計達 <b>500 萬美元</b> → 18:30 前依序傳真「COVER」＋實需文件（付款條件旁加星號）至央行外匯局；同份資料一次傳真、<b>傳真後無須去電確認</b>。","<b>展期案件</b>無須電話及傳真通報。"]],["人員",["推介人員可為系統操作員，但<b>不得</b>擔任該筆訂約/展期之<b>核章人員</b>，亦不得為該客戶最新一筆 <b>KYC 評估人員</b>（評估人員可兼建檔人員）。","人員資格之一：在國內外金融機構相關衍生性商品業務<b>實習 1 年</b>；或通過結構型商品／衍生性商品銷售人員測驗。"]],["2026 講義補充",["出口商預先約定將取得之外匯結售予銀行 →「<b>預售</b>遠期外匯」；進口商預先約定向銀行結購 →「<b>預購</b>遠期外匯」。","新臺幣遠匯屬<b>低度風險</b>等級，保守、穩健、積極型皆可；以實需為限、避險目的。","額度核給：綜合考量前一年進出口實績、營收、外幣應收應付淨額、他行避險額度等，依本行實際往來避險需求核給，以不超過其於<b>全體銀行已核給避險額度總額 50%</b>為原則。"]]],"nums":[["30 萬美元 / 0","公司／個人經理權限"],["1‰・400 元","訂約手續費"],["15 天","任選到期日交割期間"],["100 / 200 / 500 萬美元","傳輸／電話／傳真通報"],["16:30 / 18:30","電話／傳真時限"],["1 年","實習取得資格"]],"cnt":21,"yrs":{"110":4,"111":3,"112":6,"113":2,"114":6}},{"id":9,"t":"衍生性：客戶分類・KYC・額度","sub":"專業客戶資格・衍生性 KYC 時點與效期・額度/曝險額度・風險係數計算・決議錄・期中管理","w":"每年約 6 題","notes":[["專業客戶分類",["法人專業客戶＝<b>專業機構投資人</b>、<b>高淨值投資法人</b>、<b>其他法人專業客戶</b>（高資產客戶屬自然人，<u>非法人專業客戶</u>）。","<b>高淨值投資法人</b>：最近一期財報「<b>淨資產</b>」超過新臺幣 <b>200 億</b>（非總資產），且有價證券＋衍生性投資組合達 <b>10 億</b>；設投資專責單位及適任人員、具內控制度；<b>每年至少覆審一次</b>。","<b>其他法人專業客戶</b>：最近一期查核/核閱財報「<b>總資產</b>」超過新臺幣 <b>1 億</b>；授權交易人員具備充分專業知識<b>及</b>交易經驗；充分了解得免除之責任；每年覆審。","自然人高資產專業客戶資格效期 1 年，每年覆審；逾期未覆審須先覆審或變更為一般客戶始得交易。"]],["衍生性 KYC",["免辦：<b>專業機構投資人</b>，及申請/覆審日期<b>未逾 1 年之高淨值投資法人</b>；其他客戶（含其他法人專業客戶）交易前須完成。","申請額度之法人【A】：<b>每次額度申請前</b>完成；KYC 評估日與額度申請日<b>逾 2 個月（不含）</b>須重辦；有效期限<b>同額度到期日</b>（核准前暫以評估日＋1 年）；檢附最近一期完整年度財報。","完成後再修改<b>額度金額、自評風險承擔意願、承作目的、商品種類</b> → 原則應重辦（符合 2 個月內、無重大變動、同類商品者可申請免重辦）。","不申請額度之法人【B】、自然人【C】：有效期限 <b>評估日＋1 年</b>；KYC 結果適用於投資組合商品。","重辦間隔：完成或婉拒後須 <b>7 個曆日（含當日）</b>後才可重辦；<b>數位通路</b>重辦須距前次逾 <b>30 個曆日</b>（30 日內只能書面）。","數位通路：自然人限年滿 <b>18 歲且未滿 85 歲</b>之本國人，可用第e個網、第e行動、iLEO；<b>高齡（65 歲以上）</b>須先自行填「高齡客戶關懷提問表」，符合 2 項以上弱點指標即婉拒。法人僅能於<b>第e金網</b>辦理，須先出具「數位通路辦理衍生性金融商品業務法人授權書」；A、B 類皆可。","保守型客戶：DCI、保本型募集式商品、非避險換匯<b>皆不可</b>（避險性換匯可）。"]],["額度與曝險",["可操作名目本金＝<b>核准額度 ÷ 風險係數</b>（例：額度 50 萬美元、係數 5% → <b>1,000 萬美元</b>）。","實際曝險額＝依市價評估之信用曝險；<b>曝險額度</b>＝本行核予實際曝險額之上限；實際曝險 > 曝險額度＋已徵擔保品 → 暫停動用並補徵（外幣間遠匯、換匯展期須支付差額者除外；多額度時僅該額度暫停）。","曝險額度於客戶自評風險承擔意願範圍內並依信評成數；<b>違約等級</b>客戶於所徵期初保證金範圍內（非一律不給）。高風險衍生性額度不得超過可驗證往來資力 2.5 倍。","非避險性額度以<b>淨值</b>、<b>第三人</b>提供合格擔保品、集團連帶保證或其他信用增強為限（淨值基礎額度<u>不得</u>再以自身擔保品增強）；同一客戶依不同交易目的分別申請。","計算實際避險需求含「匯率」者，應扣除本行新臺幣遠匯額度（含曝險額度）；集團需求併計集團遠匯額度（「均應扣除」為錯誤）。","<b>不須</b>衍生性額度：<b>新臺幣遠匯</b>（另依外匯篇）、外匯保證金、連結存款之投資組合商品、<b>買入選擇權</b>；賣出選擇權為結清原買入部位者不占額度。","備付本票：原則以<b>美元</b>徵取，金額涵蓋「<b>衍生性金融商品額度＋曝險額度</b>」。","隱含賣出選擇權之匯率類商品、天期超過 1 年 → 交易前徵提名目本金 <b>5%</b> 保證金。"]],["文件・人員・期中管理",["「董事/股東會決議錄」重徵：決議錄有期限（且到期）、<b>公司改組</b>、商品超出授權範圍、增額後超過授權額度；獨資、縮減額度、無期限者免重徵。","「金融交易總約定書」：簽署後可承作全部衍生性商品（<b>不含新臺幣遠匯</b>）。","人員登錄：A108「結構型」或「衍生性」欄位為「<b>Z</b>＋日期」表示已於銀行公會登錄（N 未登錄、Y 僅 HR 登錄）。","授信戶衍生性交易期中管理：於<b>企金 e-Loan</b> 填製工作單，副理可代決行結案，實體工作單陳核至經理留授信卷宗。","應補徵擔保品連續 3 個營業日達 USD3,000 → 客戶應於 3 個營業日內補足或結清部分交易。"]],["2026 講義補充",["管理辦法第 14 條：外匯衍生性商品業務之經辦及管理人員須具備其一——衍生性商品及風險管理課程 <b>60 小時</b>以上並取得證書、相關業務<b>實習 1 年</b>、<b>半年以上</b>實際經驗。","推介人員：具備前項之一，或通過<b>結構型商品</b>或<b>衍生性金融商品銷售人員</b>資格測驗。"]]],"nums":[["200 億 / 10 億","高淨值投資法人淨資產／投資部位"],["1 億","其他法人專業客戶總資產"],["2 個月","KYC 與額度申請間隔"],["7 / 30 曆日","書面／數位重辦 KYC"],["額度÷係數","可操作名目本金"],["5%","隱含賣權超過1年保證金"],["Z","A108 已登錄公會"]],"cnt":31,"yrs":{"110":6,"111":7,"112":5,"113":7,"114":6}},{"id":10,"t":"衍生性：商品與投資組合","sub":"外幣間遠匯・換匯 SWAP・CCS・匯率選擇權・DCI・投資組合商品推介與脆弱族群","w":"每年約 5–6 題","notes":[["外幣間遠匯・換匯・CCS",["<b>外幣間遠匯</b>：不涉及新臺幣、交割日<b>逾 2 個營業日</b>；限本行掛牌外幣；每筆最低 <b>10 萬美元</b>；原則<b>積極型</b>，避險性且與實需相符得為穩健型或保守型；可全額或差額交割；手續費 1‰ 最低 400（OBU USD10）。","<b>換匯 FX SWAP</b>：同時辦理兩筆<b>金額相等、方向相反、到期日不同</b>之外匯交易；客戶可選全額或差額交割，但<b>新臺幣對外幣換匯僅能全額交割</b>（可部分或全額提前交割）；穩健、積極型可做，避險性可為保守型。","DBU 小額換匯營業單位可自行訂約/展期（免議價）：涉及新臺幣、單筆 1 萬～<b>未逾 30 萬美元</b>、<b>天期未逾 1 年</b>、指定到期日、價格於成本內。","<b>換匯換利 CCS</b>：交換兩種不同幣別之<b>本金及利息</b>；涉及新臺幣者期初期末本金皆須交換。利率交換/CCS 每筆最低名目本金 100 萬美元或新臺幣 1 億。"]],["匯率選擇權",["受理單位限<b>金融市場業務處</b>；每筆最低 <b>10 萬美元</b>（非 30 萬）；訂約期間最短 5 日（買回原交易或 ATM/OTM 除外）。","美元兌新臺幣選擇權決價匯率：台北外匯經紀中心 <b>11:00</b> 成交價。","買方付權利金取得權利，最大損失＝<b>權利金</b>；賣方收權利金負履約義務，最大損失<b>可能無限大</b>（「賣方最大損失為權利金」為常考錯誤）。","自然人限承作<b>不涉及新臺幣匯率之買入</b>選擇權；歐式選擇權僅能於到期日行使；客戶買入選擇權<b>不占</b>衍生性額度。"]],["DCI 雙元貨幣與投資組合商品",["DCI 架構＝<b>外幣定存＋賣出匯率選擇權</b> → <b>保息不保本</b>（本金可能轉為決價時之<b>弱勢貨幣</b>）；收益率高於定存；一般客戶與 85 歲以上自然人專業客戶限 <b>3 個月內</b>，一般客戶保本率至少 <b>70%</b>；不得連結新臺幣，自然人不得涉人民幣。","最低金額：<b>DCI 10 萬美元</b>；其餘單筆式商品原則 <b>30 萬美元</b>。","帳戶：須為綜合存款帳戶或金如意帳戶；<b>數位帳戶（iLEO、EZAccount）不適用</b>。","承作前執行 <b>055X-4</b> 查詢並列印；營業單位推介且金額達<b>新臺幣 300 萬</b> → 主管與客戶確認交易真實性並核准放行。","須<b>逐筆</b>徵「主動申購投資組合商品聲明書」：近一年交易<b>未滿 5 筆</b>、<b>65 歲</b>以上（高齡另徵高齡聲明書）、教育程度<b>國中以下</b>、領有<b>重大傷病證明</b>。","期限：保本型高資產客戶最長 10 年、非高資產 5 年；65～85 歲（非高資產）保本型最長 3 年；<b>85 歲以上</b>一律最長 3 個月；高齡一般客戶不得承作 RR4、RR5。","脆弱族群：承作<b>前</b>填「脆弱族群交易弱點檢核表」（每筆交易前評估，非每年一次）；美國公民/綠卡客戶可承作外幣本金保本型商品。","投資組合商品契約書：個人戶除買入選擇權外應簽署；65 歲以上、國中以下、視障、不識字、重大傷病者須<b>指派專人解說</b>；首次簽約徵「客戶業務往來聲明書」。","文件保存：不少於商品存續期間＋3 個月，未滿 5 年至少保存 5 年；未滿 7 歲不得承作，7–18 歲須法定代理人親簽並代辦錄音。"]],["推介人員",["須取得結構型或衍生性商品銷售人員資格並<b>向銀行公會登錄</b>（非經登錄不得推介；<u>不限</u>派令簿所載人員）；每年教育訓練 12 小時以上。","推介人員<b>得兼任作業人員</b>，但不得為所推介交易文件之<b>核簽/核章人員</b>，亦不得為客戶最新一筆衍生性 KYC 評估人員。","推介人員應向客戶<b>宣讀客戶須知並錄音</b>；不得勸誘以融資方式取得資金承作。"]]],"nums":[["2 營業日","外幣間遠匯定義"],["10 萬美元","外幣間遠匯／匯率選擇權／DCI 最低"],["30 萬美元","單筆式商品最低；小額換匯上限"],["11:00","美元兌臺幣選擇權決價"],["70%・3 個月","DCI 一般客戶"],["300 萬新臺幣","主管確認交易真實性"],["5 筆","主動申購聲明書門檻"]],"cnt":29,"yrs":{"110":6,"111":5,"112":7,"113":5,"114":6}}],"pq":[{"id":"110-1","y":110,"n":1,"m":2,"q":"下列何者不得沖銷信用狀未用餘額或退還保證金餘額？","o":["信用狀過期一個月以上","國外銀行已將信用狀修改書寄回本行","信用狀未過期但國外銀行通知不再裝運","信用狀尚未過期，但金額極小無再裝運可能，並經准予將信用狀餘額沖銷者或退還保證金餘額者"],"a":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第八節 進口信用狀及保證金未用餘額之處理","t":"(一)<mark>國外銀行已將信用狀</mark>寄回註銷，註明未用餘額已不再裝運。(二)信用狀尚未過期，但國外通知銀行來電通知出口商已不再裝運。(三)信用狀已過期一個月以上。"},"t":"neg"},{"id":"110-2","y":110,"n":2,"m":1,"q":"有關出口信用狀換單分割轉讓內容，下列何者得酌予增加以配合原信用狀之規定？","o":["信用狀金額","數量","保險之投保百分比","單價"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"3.裝船日期：得較原信用狀規定提前。4.提示期間：得較原信用狀規定縮短。5.<mark>保險之投保百分比</mark>，得酌予增加以配合原信用狀之規定。"},"t":"ask"},{"id":"110-3","y":110,"n":3,"m":1,"q":"凡出口押匯(貼現)案件遭國外拒付時，應積極進行催討，並限於（　）個月內解決或收回新臺幣。","o":["一","二","三","六"],"a":0,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第七節 出口押匯/貼現拒付之處理","t":"四、<mark>凡出口押匯(貼現)案件遭國外拒付時，應積極進行催討，並限於</mark>一個月以<mark>內解決或收回新</mark>台幣；如認為有影響本行債權確保之虞時，或超過三個月仍未結案者，應及時採取必要之法律程序予以催討，切勿拖延。"},"t":"fill"},{"id":"110-4","y":110,"n":4,"m":6,"q":"下列何者非iLEO數位帳戶服務內容？","o":["臺/外幣存款(含定存)","轉帳","外幣匯入匯款(限解付原幣)","約定為國外匯出匯款轉出帳號"],"a":3,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"4.匯款至本行他人帳戶及他行帳戶注意事項：(1)客戶須事先與本行約定<mark>轉出帳號</mark>及以書面或線上自行約定受款人資"},"x":"iLEO 數位帳戶服務含臺外幣存款、轉帳、外幣匯入（限解付原幣）；<b>不得</b>約定為國外匯出匯款轉出帳號。","lo":1,"t":"neg"},{"id":"110-5","y":110,"n":5,"m":5,"q":"內政部自110年1月起，換發新式臺灣地區相關居留證，新證號格式為何？","o":["前二碼為英文字母，後八碼為數字碼","前二碼為英文字母，後九碼為數字碼","第一碼為英文字母，後十碼為數字碼","第一碼為英文字母，後九碼為數字碼"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"4、銀行代理外國自然人、外國法人及外國銀行之國內匯、受款人(申報義務人)身分別仍維持為「16」、「17」及「18」。(四)持中華民國台灣地區相關「居留證」或外僑「居留證」（含港澳及大陸人士持「居留證」），身分別為「4」，共10碼，舊證號格式前二<mark>碼為英文字母</mark>(<mark>第一碼為英文字母</mark>區域碼，第二碼為性別碼，A、C代表男性，B、D代表女性)，後八<mark>碼為數字碼</mark>，新證號格式<mark>第一碼為英文字母，後九碼為數字碼</mark>，須符合內政部公布之邏輯檢查標準，已換發新證號者應以新證號填列，須填寫居留證之核發及到期日期，該居留證應在有效期限內。"},"t":"ask"},{"id":"110-6","y":110,"n":6,"m":8,"q":"客戶訂定預售新臺幣遠期外匯契約，採任選到期日，倘牌告匯率係屬升水時(遠期匯率比即期匯率高之情況)，適用匯率應依","o":["前一檔期本行買入遠期匯率","後一檔期本行買入遠期匯率","前一檔期本行賣出遠期匯率","後一檔期本行賣出遠期匯率 計算"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(1)固定到期日：以訂約時本行牌告新臺幣對該幣別相當檔期之匯率為訂約之匯率，至於超過180天期者，需逐筆與財務處洽商同意後辦理。(2)任選到期日A.牌告匯率係屬貼水時(<mark>遠期匯率</mark>比即期匯率低之情況)，倘客戶預售，應依後<mark>一檔期本行買入遠期匯率</mark>計算(如客戶訂定31-60天期內，適用60天期匯率)；倘客戶預購，則應依<mark>前一檔期本行</mark>遠期賣出匯率計算(如客戶訂定31-60天期內，則適用30天期匯率)。B.牌告匯率係屬升水時(<mark>遠期匯率</mark>比即期匯率高之情況)，倘客戶預售，應依<mark>前一檔期本行買入遠期匯率</mark>計算(如客戶訂定31-60天期內，則適用30天期匯率)；倘客戶預購，則應依後一檔本行遠期賣出匯率計算(如客戶訂定31-60天期內，則適用60天期匯率)。C.至於超過180天期以上者，需逐筆與財務處洽商同意後辦理。(3)指定到期日：需逐筆與財務處洽商同意後辦理。"},"t":"fill"},{"id":"110-7","y":110,"n":7,"m":1,"q":"除信用狀另有規定外，海運提單受貨人(Consignee)標明為","o":["To order of Applicant","To order of First Commercial Bank","To order of Issuing Bank","To order ，應由託運人空白背書"],"a":3,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(四)運送單據(TransportDocument)1.提單(BillofLading)，倘信用狀要求提單時：(1)提單之份數，依信用狀規定徵足。若須徵取全套正本時，即提單上表明已簽發若干份正本者，須全部提示。(2)受貨人名稱(Consignee)應依信用狀規定填列，若提單標明ToO<mark>rder</mark>或ToO<mark>rder</mark>ofShipper者，除信用狀另有規定者外<mark>，應由託運人空白背書</mark>。背書若<mark>由託運人</mark>以外之標名主體為之，其背書以代替(或代表)該托運人所為為限。(3)提單應依信用狀規定載明FreightPrepaid或FreightCollect。(4)提單所載明託運人(Shipper)與受貨人(Consignee)名稱地址、收貨地"},"t":"fill"},{"id":"110-8","y":110,"n":8,"m":6,"q":"有關「自動存」美金夢想存錢計畫，於建立計畫時，系統同步圈存首存金額USD","o":["10","50","100","1,000 元"],"a":2,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"附錄9-1-1 外匯業務自動化服務項目一覽表","t":"2.匯本行國內外分行-涉及新臺幣：營業日24小時(註1)-未涉及新臺幣：每日24小時(註2)⚫金額：1.每筆最低等值<mark>USD100</mark>元"},"x":"「自動存」美金夢想存錢計畫：建立計畫時系統同步圈存首存金額 <b>USD100</b>。","lo":1,"t":"fill"},{"id":"110-9","y":110,"n":9,"m":7,"q":"外幣及(臺、外幣)二合一自動提款機業務裝卸鈔規定，每（　）天至少應裝卸機存現金1次，倘該日為例假日時，則順延至次營業日。","o":["10","7","5","3"],"a":1,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"現鈔保管人員擔任；在正常運轉下，行內外幣<mark>自動提款機</mark>每7天（曆日）、行外外幣<mark>自動提款機</mark>每15天(曆日)<mark>至少應裝卸</mark>（清點）<mark>機存現金</mark>一次(第7天、第15天如遇例假日<mark>則順延至次營業日</mark>)，其裝卸鈔作業流程說明如下："},"t":"fill"},{"id":"110-10","y":110,"n":10,"m":6,"q":"有關「境內法人於國際金融業務分行開立授信目的帳戶」業務，其資金往來對象不得為開立於下列何者之帳戶？","o":["國際金融業務分行","本國銀行境外分支機構","境外金融機構","依銀行業辦理外匯業務管理辦法所稱指定銀行"],"a":3,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(四)資金往來對象1.限開立於國際金融業務分行、本國銀行境外分支機構及境外金融機構之帳戶。2.限該境內法人於<mark>銀行業辦理外匯業務管理辦法所稱</mark>之<mark>指定銀行</mark>開立之外幣帳戶(即同一境內法人之DBU帳戶)，並符合下列規定：(1)為支應下列款項，得自同一境內法人於外匯<mark>指定銀行</mark>(DBU)所開立之外幣帳戶匯入授信目的帳戶：A.授信之還本付息。B.授信衍生之相關費用。C.貿易融資或保證等間接授信之保證金。D.與授信相關並以避險為目的之外幣與外幣間遠期外匯交易及換匯交易之保證金。(2)支應前目款項後之結餘款，或授信目的帳戶結清銷戶之帳戶餘額，得自授信目的帳戶匯入同一境內法人於外匯<mark>指定銀行</mark>(DBU)所開立之外幣帳戶。"},"t":"neg"},{"id":"110-11","y":110,"n":11,"m":6,"q":"有關「境內法人於國際金融業務分行開立授信目的帳戶」業務，下列敘述何者不正確？","o":["本帳戶以授信資金撥入方式開立","所有交易受理行不限原開戶行","本帳戶不屬於存款，不得發給利息","資金往來限外幣與外幣間之交易，不得兌換為新臺幣"],"a":1,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(二)受理對象:與本行有OBU授信業務往來之中華民國境內法人。(三)本帳戶之首筆資金應為授信撥入之資金，惟授信方式屬貿易融資或保證等間接授信者，不在此限。帳戶業務別為「86」，帳號第六碼為「7」，屬多幣別帳戶，不掣發存摺，<mark>所有交易受理行限原開戶行</mark>，同一客戶於同一分行僅得開立一戶授信目的帳戶，且第e金網僅得申請「查詢服務」。"},"t":"neg"},{"id":"110-12","y":110,"n":12,"m":6,"q":"OBU存款客戶未完成客戶身分審查作業，不得臨櫃辦理下列何項交易？","o":["還款","繳息","匯款","結清"],"a":2,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"(三)<mark>未完成既有客戶身分審查之OBU客戶，除中心批次轉帳存入及臨櫃辦理還款、繳息或結清外，其餘交易一律不得執行</mark>。"},"t":"ask"},{"id":"110-13","y":110,"n":13,"m":6,"q":"下列何者非「外匯活期存款定期定額結購」之受理通路？","o":["臨櫃","第e行動","iLEO APP","第e個網"],"a":2,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第六節 交割、展期手續及違約處理","t":"二、通路種類(一)除實體分行外，客戶可透過第e金網、第e個網、第e行動、<mark>iLEOAPP</mark>、電話語音銀行及外幣ATM等辦理外匯業務。"},"x":"外匯活期存款定期定額結購受理通路：臨櫃、第e個網、第e行動；<b>iLEO APP 不提供</b>。","t":"neg"},{"id":"110-14","y":110,"n":14,"m":1,"q":"辦理原始信用狀(MASTER L/C)轉開國外信用狀，下列敘述何者為錯誤？","o":["應先查詢原始信用狀開狀行及其母行是否為本行之授信利害關係人","轉開信用狀幣別，原則上應與原始信用狀相同","信用狀有效期限應較原始信用狀提前一至二星期","轉開信用狀如有規定押匯文件以快遞方式寄送者，有效地點應加註AT OURCOUNTER"],"a":3,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第八節 轉開國內信用狀之處理","t":"成慢提示。信用狀有效期限應較原始信用狀為短，以利及時更換單據；另<mark>信用狀如</mark>未<mark>規定押匯文件以快遞方式寄送者，有效地點應加註</mark>”Atourcounter”。"},"t":"neg"},{"id":"110-15","y":110,"n":15,"m":4,"q":"受理國外匯入匯款業務，如為國外母公司對國內子公司提供1年(含)以上之貸款，應申報下列何種匯款性質？","o":["280收回對外貸款","340國外借款","320僑外貸款投資","210收回股本投資"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-2 銀行業辦理外匯業務作業規範","t":"(不限期間)；若屬對國內直接投資事業之<mark>貸款投資</mark>(一年以上)，請填報(320)「<mark>僑外貸款投資</mark>」。330國外信託資金國內證券投信業者在國外募集投資國內有價證券之信託資金。"},"t":"ask"},{"id":"110-16","y":110,"n":16,"m":4,"q":"「國外匯出/入匯款交易追蹤事項登記簿」之「預計出貨日」原則上不宜超過受理日3個月，倘超過3個月須敘明原因及合理性後，經外匯主管、防制洗錢及打擊資恐督導主管蓋章確認同意後辦理，另應於「預計出貨日」後（　）個月內完成運送單據或本國報關單補送作業。","o":["2","3"," 外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"(三)運送單據審查：<mark>交易金額達美金</mark>20萬元(含)以上，<mark>海運提單應一律先透過MarineTraffic</mark>追蹤網站(網址：https://www.m<mark>arine</mark>t<mark>raffic</mark>.com)<mark>查詢航程路線是否行經提單顯示之裝卸地點</mark>，倘查無資訊或為空運提單或快遞收據(如FedEx、UPS、DHL)者，再透過下列任一方法辦理查詢運送單據真實性或合理性，並將查證軌跡併同審核工作單留存："},"t":"fill"},{"id":"110-33","y":110,"n":33,"m":1,"q":"依UCP600規定，下列信用狀規定之日期，若其末日適逢國定假日，何者不得順延至次一銀行營業日？","o":["單據提示日","最後裝運日","信用狀之有效期限","以上皆是"],"a":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(十一)信用狀有效日期（ExpiryDate）及<mark>最後裝運日</mark>（LatestDateforShipment）：<mark>最後裝運</mark>期限應在信用狀有效日期以前或同日（不得超過輸入許可證之有效日期），<mark>最後裝運日</mark>期與信用狀有效日期相距超過21曆日以上者，應查明單據「提示期間」欄位是否填列，如未填列，則<mark>依UCP600</mark>相關規範辦理。且最遲須於信用狀有效日期前提示，倘客戶未載明該欄位時，應依下列規定辦理："},"x":"UCP600 第29條：有效期限或最後提示日遇銀行因第36條以外原因休業，得順延至次一營業日；但<b>最後裝運日不因此順延</b>。","lo":3,"web":[{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"},{"t":"UCP600 法律型式翻譯版（PDF）","u":"http://ndlii.com/ndlii/catalog/ucp600.pdf"}],"t":"neg"},{"id":"110-34","y":110,"n":34,"m":6,"q":"有關空白外匯存單之保管、領用及結帳作業，下列敘述何者錯誤？","o":["營業時間中由指定經辦保管","營業時間結束後，經辦應列印｢外匯空白存單庫存查詢單｣，據以核算庫存數是否相符","結帳時送交原簽發存單主管覆核檢印","日終結帳後，空白外匯存單收存金庫保管"],"a":2,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第十四節 空白外匯存單之保管及領用","t":"（六）解約：存戶辦理存單解約時，系統會自動將該筆解約存單之存單字號註記為「解約」。（七）結帳：1.空白外匯存單營業時間中由指定經辦保管，營業時間結束後，經辦應執行「空白存單結帳及查詢交易」（交易代號20H9，交易類別8：外匯存單庫存查詢，保管類別2：櫃員），列印「外匯空白存單庫存查詢單」，據以核算庫存數是否相符，核符後於「經辦」欄蓋章，查詢單連同空白外匯存單及<mark>簽發存單</mark>訖之存入憑條，<mark>送交原簽發存單</mark>以外之<mark>主管覆核檢印</mark>。簽發外匯存單以外<mark>主管覆核</mark>時，應根據存入憑條與存單存根聯核對並加蓋騎縫章後，空白外匯存單送回業務直屬主管經點算與查詢單核符後，於查詢單「主管」欄蓋章，將空白外匯存單收存金庫保管，存入憑條交由外匯經辦辦理結帳，查詢單交新臺幣空白存單結帳人員，併同辦理分行結帳作業。"},"t":"neg"},{"id":"110-35","y":110,"n":35,"m":1,"q":"依UCP600第30條，倘信用狀金額為ABOUT USD50,000，則下列何種押匯金額將被銀行視為瑕疵？","o":["USD 45,000","USD 52,500","USD 55,000","USD 57,500"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"第五節買入暨代收外幣票據一、第一次受理應辦手續(一)申請人須為本行存款往來戶。(二)保證人之提徵1.單筆票據金額在等值USD300元(含)以下者，且累計未入帳餘額未達等值<mark>USD5</mark>00元(含)以下者，得免徵保證人。"},"x":"UCP600 第30條(a)：about／approximately 解釋為容許<b>±10%</b> 差額 → ABOUT USD50,000 可接受 45,000～55,000；USD57,500 超過上限為瑕疵。","lo":3,"web":[{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"},{"t":"ICC Academy：UCP 600","u":"https://academy.iccwbo.org/ucp-600"}],"t":"ask"},{"id":"110-36","y":110,"n":36,"m":2,"q":"有關進口遠期信用狀超額押匯案件之處理，下列敘述何者為非？","o":["超額押匯金額未逾信用狀金額5%(含)者，免補收開狀手續費","超額押匯金額超過信用狀金額5%時，應就超押金額之全部，依原開狀時之手續費率及補收當日之適用匯率補收開狀手續費","最遲應於交付該筆單據給客戶前，補收開狀手續費","加計超押金額後，倘本行進口融資金額超過原核准授信額度時，應就超過部分要求客戶全額結匯並補收利息"],"a":2,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"3.國外超額押匯案件應補徵<mark>開狀手續費</mark>及開狀保證金後，始得將單據交付客戶：(1)補徵<mark>開狀手續費</mark>：超額押匯金額未逾信用狀開狀金額5%(含)，免徵<mark>收開狀手續費</mark>；超額押匯金額超過信用狀金額5%時，應就超押金額之全部，依原開狀時之手續費率及補收當日之適用匯率<mark>補收開狀手續費</mark>，倘因故無法於交單時完成補徵<mark>開狀手續費</mark>者，為利贖單作業順利，至遲應於案件辦理首次還款交易時，補收該項費用。(2)進口遠期信用狀案件應注意查核加計該超押金額後，本行進口融資金額有否超過原核准授信條件及授信額度，為利控管進口信用狀超額押匯案件額度之使用情況，營業單位每日應自「報表查詢列印系統(OnDemand)」查詢列印「外匯授信使用額度異常明細表(FI60D)」(無資料者免列印)呈主管覆核，對於其中外匯授信使用額度不足之進口超額押匯案件，倘於原核准授信條件及授信額度內，得由各營業單位辦理「信用狀/外幣貸款使用額度及核准號碼之變更（I631）」交易調整授信使用額度或就超押部分全額結匯並補收利息；倘超過原核准授"},"t":"neg"},{"id":"110-37","y":110,"n":37,"m":5,"q":"辦理新臺幣結匯申報時，未辦理商業登記之診所、會計師事務所、律師事務所之結匯金額，按照","o":["公司","團體","行號","非居住民 之規定辦理"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-4 銀行業輔導客戶申報外匯收支或交易應注意事項","t":"四、持中華民國外交部核發駐臺外交機構人員及其眷屬身分證明文件者，其<mark>結匯金額</mark>按照非居住民辦理。駐臺外交機構之<mark>新臺幣結匯申報</mark>案件，不論結匯性質，均無<mark>結匯金額</mark>限制。<mark>未辦理商業登記之診所、會計師事務所、律師事務所</mark>，及經有關主管機關許可設立之公益信託，其<mark>結匯金額按照團體</mark>之規定辦理。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第19頁","v":72,"t":"持其他身分證照者之結匯案件持中華民國外交部核發駐臺外交機構人員及其眷屬身分證明文件者，其<mark>結匯金額按照</mark>非居住民辦理。駐臺外交機構之<mark>新臺幣結匯申報</mark>案件，不論結匯性質，均無<mark>結匯金額</mark>限制。<mark>未辦理商業登記之診所</mark>、<mark>會計師事務所</mark>、<mark>律師事務所</mark>，及經有關主管機關許可設立之公益信託，其<mark>結匯金額按照團體</mark>之規定辦理。"},"x":"依講義〈2026外匯業務法規與實務〉第19頁：「未辦理商業登記之診所、會計師事務所、律師事務所，及經有關主管機關許可設立之公益信託，其結匯金額按照團體之規定辦理。」","t":"fill"},{"id":"110-38","y":110,"n":38,"m":7,"q":"受理美元票據託收Cover Letter業務，票據付款地區不得為下列哪一個地區？","o":["美國","香港","日本","新加坡"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"(二)美國地區<mark>美元票據</mark>代收銀行富國銀行有審閱票據之權利，作業處理方式如下表所示：票據處理Cash<mark>LetterCoverLetter</mark>適用服務種類<mark>美元票據</mark>快遞收款服務(Cash<mark>Letter</mark>)<mark>美元票據</mark>標準託收收款服務(StandardCollection)票據金額票面金額為USD50元以下或有買不限"},"t":"neg"},{"id":"110-39","y":110,"n":39,"m":1,"q":"出口押匯案件逾期未入帳，倘逾越押匯日起（　）應即查明未入帳原因，比照拒付案件逐筆填製「出口押匯拒付整理日誌」，呈單位主管核閱。","o":["15天","30天","90天","120天"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第六節 出口押匯/貼現遲延入帳之處理","t":"二、對於<mark>逾越押匯日起</mark>九十天(<mark>出口押匯</mark>)或匯票到期日起六十天(出口貼現)以上仍未入帳之案件，除應檢附本行向國外銀行拍發之催收函(電)影本，再函請出口商儘速解決外，並應<mark>比照拒付案件逐筆填製「出口押匯拒付整理日誌」</mark>（註明<mark>逾期未入帳</mark>），詳載有關案情始末<mark>，呈單位主管核閱</mark>，同時將案件送外匯營運處外匯作業部辦理出口<mark>拒付案件</mark>電腦建檔，以利追索處理與管理。"},"t":"fill"},{"id":"110-40","y":110,"n":40,"m":3,"q":"有關貿易融資交易辦理存在真實性之審查，其交易對手應列於客戶最近（　）年內之徵信報告登錄之主要進貨/銷貨廠商或「進貨/銷貨廠商明細資料表(貿易融資專用版)」，超過時效應重新辦理存在真實性查詢。","o":["1","2","3","5"],"a":0,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"第二節進口信用狀之開發及第一次結匯一、收件(一)申請開發信用狀，應俟授信核准並辦妥有關授信手續後，始予收件。(二)為強化客戶<mark>交易對手</mark>風險控管，信用狀受益人應為<mark>客戶最近</mark>一<mark>年內之徵信報告登錄之主要進貨廠商或</mark>載於「公司<mark>進貨/銷貨廠商明細資料表(貿易融資專用版)」，</mark>倘客戶因業務需求，新增非登錄於前揭<mark>徵信報告</mark>或資料表之<mark>交易對手</mark>可透過下列任一方式辦理「<mark>存在真實性</mark>」及「所屬行業具關連性」之查核，如查無相關資訊，應請客戶提供相關佐證資料備查(如：歷史交易文件或合約等)，評估風險後審慎辦理。"},"lx":{"b":"講義：2026外匯業務法規與實務","c":"第25頁","v":47,"t":"為強化客戶<mark>交易對手</mark>風險控管，信用狀受益人應為<mark>客戶最近</mark>一<mark>年內之徵信報告登錄之主要進貨廠商或</mark>載於「公司<mark>進貨/銷貨廠商明細資料表</mark>(<mark>貿易融資專用版</mark>)」，倘客戶因業務需求，新增非登錄於前揭<mark>徵信報告</mark>或資料表之<mark>交易對手</mark>則應辦理「<mark>存在真實性</mark>」及「所屬行業具關連性」之查核，如查無相關資訊，應請客戶提供相關佐證資料備查(如：歷史交易文件或合約等)，評估風險後審慎辦理。為加強交易<mark>真實性查</mark>核，<mark>貿易融資</mark>應徵取客戶與<mark>交易對手</mark>之交易文件(如：訂單、契約、(預式)發票等)，並進行交互勾稽，必要時得與<mark>交易對手</mark>進行照會確認，審慎評估後方可辦理。"},"x":"依講義〈2026外匯業務法規與實務〉第25頁：「為強化客戶交易對手風險控管，信用狀受益人應為客戶最近一年內之徵信報告登錄之主要進貨廠商或載於「公司進貨/銷貨廠商明細資料表(貿易融資專用版)」，倘客戶因業務需求，新增非登錄於前揭徵信報告或資料表之交易對手則應辦理「存在真實性」及「所屬行業具關連性」之查核，如查無相關資訊，應請客戶提供相關佐證資料備查(如：歷史交易文件或合約等)，評估風險後審慎辦理。」","t":"fill"},{"id":"110-41","y":110,"n":41,"m":4,"q":"依本行「疑似洗錢或資恐交易申報作業手冊」指引，現行監控報表審查時效原則應於（　）個月內完成，且督導主管應於審查期限內覆核完畢及加註審核日期。","o":["1","2","3","4"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"5.上述2~4報表應詳載查證結果，具體說明查核過程(如資金來源、去處及交易合理性等，亦得參酌徵信報告內容)，相關查證資料應留存備查，由經辦、副理、防制洗錢及打擊資恐<mark>督導主管</mark>及經理蓋章確認，並由洗督主管<mark>加註審核日期</mark>，<mark>原則應於</mark>1<mark>個月內完成</mark>審查，特殊案件得再延長10天。切勿因客戶往來已有一段時日，即逕予勾選無異常而疏於查證，即使是無異常亦需說明判斷理由，以符合防制洗錢作業規定。報表應裝訂成冊備查，保存期限至少5年。"},"t":"fill"},{"id":"110-42","y":110,"n":42,"m":5,"q":"受理持「中華民國就業金卡」之外國人來行辦理外匯業務時，其外匯申報之身分別代號應為","o":["1","43","3","4"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-1-2 結匯人身分別及證照號碼檢核項目表","t":"37本國人代理外國法人(含外國財團法人)38本國人代理外國金融機構4<mark>外國人及港澳、大陸人士持居留證者或持中華民國就業金卡者</mark>共十碼。"},"t":"fill"},{"id":"110-43","y":110,"n":43,"m":5,"q":"有關在台辦事處及事務所(身分別2)可申報之匯入匯款分類，以下何者為非？","o":["196外國民間機構在台辦公費用","410薪資款匯入","340國外借款","511工作者匯款收入"],"a":2,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第一節 概 說","t":"(二)辦理外國公司分公司、外國有限合夥分支機構或外國公司在臺辦事處之國外匯出入款案件時，應確實查驗客戶身分文件或基本登記資料。倘為外國公司在臺辦事處，身分別應為「2:團體」，其匯款分類限匯入「196外國民間機構在台辦公費用」、「410薪資款匯入」及「511工作者匯款收入」。"},"t":"neg"},{"id":"110-44","y":110,"n":44,"m":4,"q":"有關「印尼快捷贍家匯款服務」，以下何者為非？","o":["受款國別限印尼","限臨櫃辦理","匯款幣別限美元，單筆金額上限為USD3,000元(含)","匯款將以印尼盾解款入帳"],"a":1,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"3.受理個人<mark>臨櫃辦理</mark>結購或自外存提領外幣現鈔單筆金額達等值新臺幣50萬元(含)以上時，應以「臨櫃作業關懷客戶提問表」加強關懷客戶。"},"x":"印尼快捷贍家匯款：受款國限印尼、幣別限美元單筆上限 USD3,000、以印尼盾解款；可透過數位通路辦理，故「限臨櫃辦理」錯誤。","lo":1,"t":"neg"},{"id":"110-45","y":110,"n":45,"m":5,"q":"公司、有限合夥、行號當日辦理對外貸款、國外借款之即期結匯交易，同一性質累計結匯金額達等值（　）萬美元之案件，應於確認相關證明文件無誤後，於訂約日下午6：30前將外匯收支或交易申報書、交易水單及相關交易證明文件傳真至中央銀行外匯局，並於傳真文件首頁加註訂約日、分行聯絡人員及電話。","o":["10","20","50","100"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"3.傳真通報：<mark>即期結匯</mark>案件屬下列情形者<mark>，應於確認相關證明文件無誤後，於訂約</mark>當<mark>日下午6：30前將外匯收支或交易申報書、交 募集式投資組合商品之推介人員，下列敘述何者為非？","o":["通過結構型商品或衍生性金融商品銷售人員資格測驗並取得合格證明書，且於銀行公會完成登錄者","每年應依本行規定參加衍生性金融商品教育訓練課程時數達12小時以上","可同時為「行政作業處理人員」，惟不得為該筆交易之核章人員或最近一次客戶投資風險屬性之評估人員","僅限派令簿上載明派任之人員始可擔任"],"a":3,"ci":{"b":"衍商篇","c":"第一章 客戶間衍生性金融商品業務通則","s":"第三節 辦理衍生性金融商品業務相關人員","t":"(二)推介人員於派任或實際從事推介工作前應向銀行公會辦理登錄，非經登錄，不得執行推介業務。(三)申請推介業務登錄者，需具備本節第二點所列條件之一，不侷<mark>限派令簿</mark>派任推介衍生性商品業務之人員。請填具「第一商業銀行辦理衍生性金融商品推介人員資格、資料變更及註銷登錄申請暨同意書」，檢附相關證書或證明文件影本(加蓋「核與正本無誤」由本人以外同仁蓋章)，呈主管確認，主管人員應確認申請人有實質業務需要後再於申請書蓋章，送金融市場業務處金融作業部辦理登錄事宜，嗣後如有異動(新增、變更或註銷)時亦同；本項登錄無需費用，接獲申請書後約2~3個工作日可完成。"},"t":"neg"},{"id":"110-52","y":110,"n":52,"m":9,"q":"除專業機構投資人及高淨值投資法人外，其他法人客戶申請衍生性金融商品額度，下列敘述何者錯誤？","o":["應於每次申請衍生性金融商品額度前辦理衍生性KYC","衍生性KYC評估日期與額度申請日期不得逾2個月","辦理衍生性KYC時應檢附最近一期「完整年度」財務報告","衍生性KYC有效期限一律為「KYC評估日+1年」"],"a":3,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"2.<mark>有效期限</mark>：同「額度到期日」。已完成KYC、但額度尚未獲核准前，暫以<mark>「KYC評估日+1年」</mark>為有效日期，俟額度核准後，分行以「衍生性金融商品額度核准變更啟用檢核表暨通知單」及額度批覆書傳真或EMAIL通知金融行銷部，由金融行銷部至系統修改<mark>KYC有效</mark>日期為額度到期日。"},"t":"neg"},{"id":"110-53","y":110,"n":53,"m":9,"q":"完成衍生性KYC評估後，須待至少（　）個曆日(含)後才可受理客戶要求重新辦理衍生性KYC。","o":["3","7","14","30"],"a":1,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(五)已完成「<mark>衍生性KYC</mark>」評估或經婉拒辦理「<mark>衍生性KYC</mark>」之客戶，須待7<mark>個曆日(含</mark>辦理KYC當日<mark>)後才可受理客戶要求重新辦理</mark>「<mark>衍生性KYC</mark>」。(如：客戶12/1辦理KYC作業，須至12/8始可再次辦理KYC)"},"t":"fill"},{"id":"110-54","y":110,"n":54,"m":9,"q":"客戶衍生性KYC評估結果為保守型，可辦理下列何種商品？","o":["雙元貨幣投資組合商品(DCI)","保本型募集式投資組合商品","承作目的為非避險性之換匯交易","以上皆非"],"a":3,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"5.65歲(含)以上之「高齡客戶」，需先填覆「<mark>衍生性KYC</mark>高齡客戶關懷提問表」，且僅符合1項以下弱點指標。(三)<mark>KYC評估結果</mark>適用範圍：承作「投資組合商品」。"},"x":"衍生性 KYC 為保守型者，DCI、保本型募集式投資組合商品及「非避險性」換匯皆不可承作 → 以上皆非。","lo":1,"t":"ask"},{"id":"110-55","y":110,"n":55,"m":10,"q":"外匯市場中，同時承作幣別、金額相同，但買賣方向相反且交割日不同之外匯交易稱為","o":["遠期外匯交易","換匯交易","外匯保證金","匯率選擇權"],"a":1,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"一、定義<mark>換匯交易</mark>(FXSWAP)係指同時辦理兩筆相等金額、<mark>買賣方向相反</mark>及不同到期日<mark>之外匯交易</mark>。市場慣例上，若承作近天期端賣、遠天期端買之交易以Sell/Buy稱之；若承作近天期端買、遠天期端賣之交易以Buy/Sell稱之，本行現行得承作交易類型限近天期端為2個營業日內交割之即期交易、搭配遠天期端為逾2個營業日交割之遠期交易。"},"t":"fill"},{"id":"110-56","y":110,"n":56,"m":8,"q":"受理客戶當日累計訂約金額達等值（　）萬美元以上之新臺幣遠期外匯案件，應於訂約當日下午6：30前，將實需文件傳真至中央銀行外匯局。","o":["50","100","300","500"],"a":3,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"戶名稱、預購/預售、<mark>訂約金額</mark>、到期日、遠期匯率及換匯點。(通報交易買賣方向應以客戶角度為之，換匯點最多報至小數點後第5位即可)。另，<mark>客戶當日累計訂約金額達等值</mark>500萬美元時，應於<mark>當日下午6：30前，</mark>依序將①「遠匯/換匯傳真資料COVER」(請正楷填寫)②實需證明文件，排好並編妥頁碼(頁次/總頁數)後一次傳真至央<mark>行外匯局。</mark>(傳真號碼：02-23936152)，並於<mark>實需文件</mark>上之「付款條件」旁加註星號，以利央行稽核人員辨識。上述以外交易，倘接獲央<mark>行外匯局</mark>電話通知抽查，應於接獲通知後即時提供相關文件。"},"t":"fill"},{"id":"110-57","y":110,"n":57,"m":10,"q":"下列何者不是雙元貨幣投資組合商品(DCI)的特點？","o":["保息不保本","收益率較定存高","弱勢貨幣轉換成強勢貨幣","一般客戶案件之保本率至少70%，以保障投資風險"],"a":2,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第三節 單筆式商品","t":"2.商品特點：(1)保息不保本：收益率較定存利率高，無論存款幣別是否被轉換，客戶一定可獲得原存款幣別之投資收益(保息)；惟客戶手中持有的本金可能依約定匯率(選擇權的履約價格)轉換成相對貨幣，即客戶的存款幣別將會是決價時點的<mark>弱勢貨幣</mark>(不保本)。(2)投資期間短，一般客戶及85歲(含)以上自然人專業客戶僅得承作3個月(含)以內之交易。(3)一般客戶案件之保本率至少70%，以保障投資風險。(4)投資幣別組合以本行有牌告之各種外幣皆可辦理，惟不得連結新臺幣匯率，另自然人客戶不得承作投資本金為人民幣或連結人民幣匯率之DCI。"},"t":"neg"},{"id":"110-58","y":110,"n":58,"m":10,"q":"客戶承作募集式投資組合商品單筆交易金額達等值新臺幣（　）萬元(含)時，分行主管應與客戶確認該筆交易之真實性，輸入交易時需經主管核准放行，並請主管於「投資組合商品轉存授權書」認證資料載明與客戶確認交易之方式及時間。","o":["50","100","200","300"],"a":3,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第三節 單筆式商品","t":"章處簽名或蓋章。餘依第十章第二節辦理。(10)倘為「營業單位推介案件」且<mark>交易金額達等值新臺幣</mark>300萬元（含）(按「幣別」依「即時牌告匯率」折算為新臺幣)時，應請主管<mark>與客戶確認該筆交易之真實性，輸入交易時需經主管核准放行，並請主管於「</mark>外幣<mark>投資組合</mark>業務-客戶交易資料維護」交易(交易代號：0560)<mark>認證資料載明與客戶確認交易之方式及時間</mark>(若非當日確認，應另加註日期)。(11)倘為「高齡案件」時，應確認已向客戶取得「高齡客戶申購<mark>投資組合商品</mark>聲明書」檢視內容無誤後，於「外幣<mark>投資組合</mark>業務-客戶交易資料維護」交易(交易代號：0560)「是否已徵取高齡案件聲明書」欄位中鍵入Y(已徵取)。(12)倘投資本金或連結標的涉及人民幣，應確認已向客戶徵取「辦理人民幣衍生性金融商品風險預告書」(契約文件「金融交易總約定書」或<mark>「投資組合商品</mark>契約書」之附件)，於「外幣<mark>投資組合</mark>業務-客戶交易資料維護」交易(交易代號：0560)「是否徵取人民幣風險預告書」輸入Y(已徵"},"t":"fill"},{"id":"110-59","y":110,"n":59,"m":9,"q":"下列何種情形免向客戶徵取「董事(或股東)會同意承作衍生性金融商品決議錄」？","o":["客戶為獨資公司","決議錄訂有期限且已逾期者","增貸「衍生性金融商品額度」後之金額逾決議錄上之授權","公司改組"],"a":0,"ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第三節 額度核准通知、建檔與管理","t":"(七)董事/股東會同意承作衍生性金融商品決議錄：決議錄有期限、公司改組、客戶擬承作商品超出決議錄授權範圍、或本次額度金額增加後超過決議錄上授權之額度者，應重新徵取，並以『衍生性金融商品業務「董事/股東會決議錄」檢核表』辦理檢核。客戶為公開發行公司，因未屆董事會之會期，致無法即時提供「董事會決議錄」，得向其徵取承諾書，承諾於最近一次董事會會期，將其向本行辦理衍生性商品相關事宜列入董事會議程予以追認，並於會後10日內交"},"t":"ask"},{"id":"110-60","y":110,"n":60,"m":6,"q":"iLEO數位帳戶外匯定期存款每筆最低承作金額為等值美金多少元？","o":["100","500","1,000","無限制"],"a":0,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（二）<mark>外匯定期存款</mark>部份：<mark>數位帳戶每筆最低承作金額為等值</mark>100美元，其餘帳戶種類<mark>每筆最低承作金額為等值</mark>1,000美元，美元以外之其他幣別按等值美元計算，每次、每日原幣累計轉存最高金額均不限。"},"t":"ask"},{"id":"111-1","y":111,"n":1,"m":6,"q":"有關外匯定期存款中途解約之相關規定，下列敘述何者不正確？","o":["未存滿一個月期者，中途解約不予計息","存期為一個月期(含)以上者，中途解約之利率依其期別以解約當日本行牌告利率計算","存滿一個月期以上者，中途解約按實存期間單利計息，並包含不足整月之零星日數","存滿三個月未滿六個月者，依實存期間，以三個月期存款利率八折計息"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"(二)未滿<mark>一個月期者，中途解約</mark>不予計息。(三)<mark>一個月期(含)以上者，</mark>其計息期間及<mark>利率依其期別以</mark>起存<mark>日本行牌告利率</mark>為準，按下列方式計算："},"t":"neg"},{"id":"111-2","y":111,"n":2,"m":1,"q":"除信用狀另有規定外，下列何種海運提單將被銀行視為瑕疵？","o":["僅標明簽發日之備運提單(RECEIVED FOR SHIPMENT)者，未加註ON BOARD字樣及日期","表明以信用狀受益人以外之人為貨物之發貨人","清潔提單(CLEAN B/L)","價格條款為CIF，提單載明FREIGHT PREPAID"],"a":0,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"1.向客戶確認單據之提示期間是否須填列。2.如客戶不填列，悉依UCP600相關規範辦理或應於特別條款加註」「B/L（DOCU<mark>MENT</mark>S）PRESENTEDBEYOND21CALENDARDAYSAFTERTHEDATEOF<mark>SHIPMENT</mark>BUTWITHINTHEVALIDITYOFTHISCREDITAREACCEPTABLE.」(裝運後超過二十一曆日並在信用狀有效日期內提示之提單，可予接受)字樣。"},"t":"ask"},{"id":"111-3","y":111,"n":3,"m":1,"q":"有關出口押匯/貼現單據之審核，下列敘述何者不正確？","o":["審查以單據為本，依單據表面內容決定是否構成符合提示","提示非信用狀所要求之單據，仍須審查是否符合提示","單據之日期得早於信用狀之簽發日，但不可遲於提示日","審核期間為自提示日之次日起最長五個銀行營業日，以決定提示是否符合"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(七)<mark>提示非信用狀所要求之單據，</mark>將不予理會並可退還提示人。(八)單據之日期得早於信用狀之簽發日，但不可遲於提示日。"},"t":"neg"},{"id":"111-4","y":111,"n":4,"m":8,"q":"有關進口商辦理新臺幣遠匯訂約，下列敘述何者不正確？","o":["倘客戶提示之交易約定以信用狀方式付款，應待實際開狀後始得辦理訂約","倘為到單前訂約、不向本行辦理融資，最晚到期日可至信用狀有效日","倘為到單後訂約、將於本行辦理融資，最晚到期日不得逾進口單據到達通知書上之到期日","倘為到單前訂約、將於本行辦理融資，訂約文件為進口單據到達通知書及國外押匯時提示之發票及相關交易文件"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"5.「<mark>進口單據到達通知書</mark>」載有單據瑕疵者，應先行通知客戶單據瑕疵內容，並請客戶於收到該通知書後立即於「<mark>進口單據到達</mark>聲明書」上表示是否接受該瑕疵單據，以利外匯作業中心於收到單據五個銀行營業日內向<mark>國外押匯</mark>銀行提出有利於本行及進口商權益之主張。"},"t":"neg"},{"id":"111-5","y":111,"n":5,"m":6,"q":"有關「OBU境外存款帳戶開戶查詢RPA」輔助查詢資料，不包括下列何者？","o":["至AML系統檢核查詢開戶客戶是否為制裁名單","以開戶名稱至Google搜尋是否存在相同名稱之公司","以實質受益人至Google搜尋其與開戶客戶之關係","至司法院家事事件公告專區查詢高階管理人是否經監護、輔助宣告"],"a":3,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"2.若系統警示負責人為疑似受成年<mark>監護、輔助宣告</mark>時，應以負責人身分證字號<mark>至司法院</mark>網站「<mark>家事事件公告專區</mark>」再做確認，並列印查詢畫面作為「投資風險屬性評估表」之附件。"},"t":"neg"},{"id":"111-6","y":111,"n":6,"m":6,"q":"有關外匯定期存款，下列敘述何者不正確？","o":["利率型態一經選定後，不得於存款期間要求中途變更利率型態","指定到期日之外匯定期存款最短為八天，最長以一年以內為原則，至於七天以下者由財務處視實際需要訂定之","付息方式包括到期一次給付本息或按季付息","採機動利率計息者，以一個月期(含)以上之固定到期或指定到期日外匯定期存款為原則，並由外匯營運處及財務處視實際需要增訂之"],"a":2,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"(二)外匯定期存款，存入時發給存單或登入存摺，<mark>到期一次給付本息或按</mark>月付息，利率型態得事先約定採固定利率或機動利率計息，一經選定後，不得於存款期間要求中途變更利率型態。期限分為："},"t":"neg"},{"id":"111-7","y":111,"n":7,"m":3,"q":"有關國外匯入匯款案件涉及貨物貿易交易證明文件審查，下列敘述何者為是？<br><span class=\"it\">A.</span> 匯入匯款幣別應與發票一致<br><span class=\"it\">B.</span> 匯款人應為發票開立人<br><span class=\"it\">C.</span> 運送單據 CONSIGNEE應為出口商<br><span class=\"it\">D.</span> 受款人應為發票開立人","o":["AD","ABC","ABD","AB"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"場等，查詢是否屬制裁範圍。另，應檢視客戶匯出匯款申請書、<mark>匯入匯款</mark>通知書或買入暨代收外幣票據申請書與交易單證上之買(賣)方及進(出)口國家是否一致，倘不一致，應向客戶查證雙方之關係並留存查證紀錄。另，倘發現有物流金流不一致之情形(如:匯款人與買方非同一人或買方非自行匯款，匯款人與<mark>運送單據</mark>受貨人(<mark>CONSIGNEE</mark>)不一致)，應向客戶詢問其交易模式為何，及須由貿易商、貨運承攬人Forwarder或其他人代為匯款之原因，並應說明代匯款之合理性，留存查證紀錄及徵提相關佐證文件，當<mark>運送單據</mark>上之託運人(SHIPPER)、到貨通知人(NOTIFYPARTY)出現非買賣雙方之第三人時，應徵提相關文件為宜，惟倘因合理原因無法提供時亦應敘明其於交易中擔任之角色及合理性。"},"t":"combo"},{"id":"111-8","y":111,"n":8,"m":1,"q":"依UCP600第38條規範，下列敘述何者為非？","o":["可轉讓信用狀意指特別敘明「TRANSFERABLE」","開狀銀行得為轉讓銀行","除於轉讓時另有規定外，有關轉讓所發生之一切費用，須由第二受益人支付","若部分動支或裝運係屬允許，信用狀得部分轉讓予一個以上之第二受益人"],"a":2,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"4.接獲國外入帳通知時，應辦理出口押匯（貼現）銷帳或BBOC入帳及辦理匯付<mark>第二受益人</mark>之相關作業：(1)出口銷/入帳以收件金額（即第一、<mark>二受益人</mark>兩發票間之差額）辦理出口押匯（貼現）銷帳或BBOC入帳。惟倘轉讓時有註明國外費用係由第一受益人負擔者，應以收件金額扣除國外費用後之金額辦理銷/入帳。(2)匯付<mark>第二受益人</mark>款項將國外入帳金額扣除銷/入帳金額及下列費用後，依<mark>第二受益人</mark>之押匯/託收銀行指示辦理匯出：A.手續費：按押匯/託收金額0.1%計收，最低USD40。B.郵電費：每筆計收USD30。"},"x":"UCP600 第38條：除轉讓時另有約定外，轉讓所生之佣金、手續費、成本或費用<b>由第一受益人支付</b>（非第二受益人）。","lo":3,"web":[{"t":"信用狀 PART10－UCP600 第38~39條","u":"https://resa2013.pixnet.net/blog/posts/9146413702"},{"t":"UCP600 中文版（百度百科）","u":"https://baike.baidu.com/item/UCP600%E4%B8%AD%E6%96%87%E7%89%88/6684785"}],"t":"neg"},{"id":"111-9","y":111,"n":9,"m":4,"q":"有關「國外匯出(入)匯款及光票客戶加強盡職審查表(EDD)」之抽查作業，下列何者為是？","o":["按月抽查","抽查原則為每10件抽查3件，不足10件者免抽查","抽查時應向客戶徵提該筆交易佐證文件並查詢是否屬制裁範圍","以上皆是"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"6.中低風險客戶凡採免徵文件方式辦理審查，適用情形屬第2項者，受理時應填妥「中低風險客戶適用免徵文件審查登記簿」併同申請書類、水單及交易審查表辦理呈核，並由防制洗錢及打擊資恐督導主管或三合一主管按季(每年1、4、7及10月為查核月)依登記簿資料辦理抽查，每10件應抽查3件(即10-19件抽3件、20-29抽6件，以此類推)，不足10件者抽查1件(即1-9件抽1件)，依抽查結果填報「中低風險客戶適用免徵文件審查案件抽查表」(下稱抽查表)，最遲應於查核當月月底或次月第一個營業日陳核至經理，並將所徵提之相關文件紀錄檢附於抽查表，設專卷留存5年備查。抽查作業應注意事項如下：(1)應依交易申報性質<mark>向客戶徵提</mark>本次抽查案件之<mark>佐證文件</mark>，不得沿用前已徵提之文件重複使用。另應針對交易有關對象辦理AML系統姓名及名稱檢核作業，<mark>查詢是否屬制裁範圍</mark>，並列印查詢結果備查。(2)倘為貨物貿易，<mark>應向客戶徵提</mark>正式發票及運送單據或本國報關單，"},"t":"ask"},{"id":"111-10","y":111,"n":10,"m":7,"q":"行員結購外幣現鈔優惠案件，優惠對象包含？<br><span class=\"it\">A.</span> 本行現職員工(含配偶)<br><span class=\"it\">B.</span> 本行現職員工之父母子女<br><span class=\"it\">C.</span> 退休員工(含配偶)<br><span class=\"it\">D.</span> 退休員工之父母子女","o":["ABC","BCD","ABD","ABCD"],"a":0,"ci":{"b":"外匯篇","c":"第十一章 各項外匯業務收費標準及授權措施","s":"第三節 各項外匯業務授權措施","t":"(三)國外匯兌業務(四)外幣支票存款業務四、行員外幣結匯業務優惠措施(一)優惠通路及對象：1.臨櫃：本行行員、退休行員及行眷(限行員配偶/父母/子女及退休行員配偶)。"},"t":"combo"},{"id":"111-11","y":111,"n":11,"m":9,"q":"關於衍生性KYC何者為真？","o":["有效期限一律為「KYC評估日+1年」","法人戶亦可透過數位通路辦理","客戶財務、營運及往來情形無重大變動即可申請免重新辦理","原則上，完成後再修改額度申請金額者應重新辦理"],"a":3,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"寫人】欄位得免由負責人或被授權人親簽)，向金融行銷部申請免<mark>重新辦理</mark>KYC：A.投資風險屬性評估日期與營業單位<mark>額度申請</mark>/條件變更申請日期未逾2個月(含)者。B.分行檢視客戶財務、營運及往來情形無重大變動。C.修改「承作商品種類」與原勾選之商品類別(如:匯率類或利率類)相同。(4)金融行銷部受理分行免<mark>重新辦理</mark>KYC申請案件之處理作業：A.應重新計算投資風險屬性評估結果。B.評估結果未變動者，免<mark>重新辦理</mark>KYC作業。C.評估結果有變動者，應去電客戶有權人員確認調整額度內容及告知變更後投資風險評估屬性結果，並以電話錄音方式留存紀錄；完成後掣"},"t":"ask"},{"id":"111-12","y":111,"n":12,"m":9,"q":"下列敘述何者有誤？","o":["客戶有2個以上衍生性額度而僅其中1個需補徵擔保品時，其他額度仍可正常動用","計算實際避險需求時，均應扣除客戶於本行新臺幣遠匯額度","客戶應補徵擔保品金額大於零時，換匯交易到期須支付差額者仍可展期","應補徵擔保品金額連續3個營業日達USD3,000(含)，客戶應於3個營業日內補足擔保品或結清部分交易"],"a":1,"ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"3.<mark>實際避險需求</mark>計算時如含「匯率」<mark>避險需求</mark>，應另扣除<mark>本行新臺幣遠匯額度</mark>(含曝險額度)之金額。申請額度含集團企業匯率<mark>避險需求時，</mark>須併計集團企業<mark>新臺幣遠匯額度</mark>。"},"t":"neg"},{"id":"111-13","y":111,"n":13,"m":2,"q":"本行企網貿易服務提供下列何種電子郵件通知功能？<br><span class=\"it\">A.</span> 進口到單通知<br><span class=\"it\">B.</span> 出口押匯拒付通知<br><span class=\"it\">C.</span> 進口託收D/P付款通知<br><span class=\"it\">D.</span> 出口押匯撥款通知<br><span class=\"it\">E.</span> 出口信用狀到達通知","o":["ABCDE","BCD","ABDE","BCDE"],"a":2,"ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"（二）恢復使用：經客戶申請業務終止且完成電腦登錄者，如欲恢復使用，應重新申請。五、<mark>貿易服務</mark>之服務內容（一）出口業務1<mark>.出口押匯</mark>(1)<mark>出口信用狀到達通知</mark>：<mark>信用狀到達</mark>，系統即自動傳輸到達之信用狀摘要內容至客戶申請設定之電子郵箱中。(2)<mark>出口信用狀到達通知</mark>查詢：客戶登錄系統點選該功能選項，輸入查詢起迄時間(最長一年)，查詢<mark>信用狀到達通知</mark>摘要及電文內容。(3)<mark>出口押匯撥款通知</mark>：<mark>出口押匯</mark>款項撥入客戶指定帳號，系統即自動傳訊息至客戶申請設定之電子郵箱。"},"x":"企網貿易服務 Email 通知：進口到單、出口押匯拒付、出口押匯撥款、出口信用狀到達；<b>不含</b>進口託收 D/P 付款通知 → ABDE。","lo":1,"t":"combo"},{"id":"111-14","y":111,"n":14,"m":8,"q":"有關新臺幣遠匯新戶應徵提文件，下列敘述何者不正確？","o":["倘客戶已填妥「資料表」(徵103A)辦理徵授信業務者，免徵「辦理新臺幣遠期外匯業務資料蒐集、處理及利用(含國際傳輸)同意書」","「新臺幣遠期外匯交易產品說明書暨風險預告書」無須每年重徵","倘法人客戶已有辦理「衍生性KYC」評估作業，仍須辦理新臺幣遠匯KYC","「第一銀行客戶資料表(新臺幣遠期外匯業務)」－法人戶專用或自然人專用至IMVP系統列印"],"a":2,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第三節 客戶投資風險屬性評估(KYC)作業","t":"9.倘法人戶已申請衍生性金融商品額度並完成<mark>「衍生性KYC」</mark>作業，則承作<mark>新臺幣遠</mark>期外匯業務時，可自動適用其<mark>「衍生性KYC」評估</mark>結果，免重覆辦理上述1~8作業。營業單位可於「行員專用系統/TMU交易平台/客戶基本資料查詢」，將「客戶往來情形」改為空白並輸入統編或客戶名稱後，點選「明細/客戶風險屬性查詢」，即可查詢<mark>「衍生性KYC」評估</mark>結果。"},"t":"neg"},{"id":"111-15","y":111,"n":15,"m":8,"q":"有關新臺幣遠匯業務，下列敘述何者不正確？","o":["進口商已於他行辦理進口開狀時，不得於本行訂定遠匯","訂約/展期契約核章人員不得為該筆訂約/展期交易的推介人員","客戶最新一筆KYC之評估人員不得為該客戶訂約/展期交易的推介人員","本行客戶及其交易對手皆在台灣，自基隆倉庫出貨至高雄倉庫，不宜以外幣作為收付款幣別後，再要求辦理遠匯交易"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第三節 客戶投資風險屬性評估(KYC)作業","t":"(二)辦理KYC相關人員：1.評估人員：(1)應具備本章第二節擔任新臺幣遠期外匯業務推介人員資格。(2)可同時擔任該筆KYC建檔人員。(3)客戶最新一筆KYC之評估人員不得為該客戶訂約/展期交易之推介人員。"},"t":"neg"},{"id":"111-16","y":111,"n":16,"m":1,"q":"有關初級市場之出口遠期信用狀買斷業務，下列敘述何者不正確？","o":["係為協助出口商規避高風險地區開狀銀行之信用風險","本行於接獲開狀行(或保兌行)付款後，依「信用狀賣斷讓渡書」之約定付款予出口商","除信用狀規定之銀行費用應自買斷金額中扣除外，撥款時預扣最低美金200元之國外費用","需投保時，應依中輸銀費率表計收，費用全數由出口商負擔"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十二節 出口 遠期 信用狀 買斷業務","t":"一、初級市場案件(一)係指出口商將遠期信用狀項下之票據或單據讓售予本行，<mark>本行於接獲開狀行(或保兌行)</mark>承兌通知<mark>後，依「信用狀賣斷讓渡書」之約定付款予出口商</mark>之交易。"},"t":"neg"},{"id":"111-17","y":111,"n":17,"m":3,"q":"有關「限制押匯國家/地區」，下列敘述何者為是？","o":["光票買入金額等值USD1,000以上始改以託收方式辦理","進口開狀案件不論金額應一律以非自付條款方式辦理","出口押匯案件等值USD1,000以上始改以託收方式辦理","國外匯入不論金額應查明該筆匯入匯款之存匯行確實已入帳妥方得解付予受款人"],"a":3,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務往來應特別注意國家及地區名單","t":"1、國外匯兌及光票案件：(1)<mark>國外匯入</mark>：匯入通知書標有「限押國家」者，<mark>應查明該筆匯入匯款之存匯行確實已入帳妥</mark>（可執行「存同外匯資料查詢交易(IQYA)」查詢並留存紀錄備查或與存匯行照會確認已入帳），<mark>方得解付予受款人</mark>。(2)光票買入：應一律改以託收方式辦理。"},"t":"ask"},{"id":"111-18","y":111,"n":18,"m":3,"q":"有關受理俄羅斯外匯案件作業原則，下列何者為是？","o":["匯入匯款原始匯款銀行涉及Non-SDN LIST，惟貨品非軍民兩用品得承作","進口信用狀通知銀行位於俄羅斯，惟非SDN LIST及Non-SDN LIST得承作","出口信用狀開狀銀行位於俄羅斯一律不得承作","進口信用狀出貨港位於俄羅斯一律不得承作"],"a":2,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-5 辦理外匯業務
