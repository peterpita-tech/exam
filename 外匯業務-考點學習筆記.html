符合本行「攔阻疑遭詐騙客戶建檔」(代號:9753)自建之疑遭詐騙或疑似詐騙客戶、警政署及財金公司提供之潛在被害人，系統將出現提示訊息，並應依下列流程辦理:(1)填寫「臨櫃作業關懷客戶提問表」<mark>加強關懷</mark>客戶，如有疑慮應通報165或警方來行協助。(2)如確定承作，須經外匯主管執行「<mark>主管授權</mark>」(交易代號:FAT1)外匯業務種類「11-外匯關注名單」、授權種類「99-外匯關注名單」，方得進行後續交易。(3)切勿向客戶透漏已遭警政署、財金公司或本行列為預警名單，以免違反相關法規。"},"x":"受款帳號符合<b>警政署</b>等提供之潛在被害或詐欺資料時，須加強關懷提問並經外匯主管 FAT1 授權。"},{"id":"114-42","y":114,"n":42,"m":6,"q":"下列何者不得開立 OBU外匯存款帳戶？","o":["中華民國境外之個人","中華民國境外之法人","與本行有 OBU 授信業務往來之中華民國境內法人","與本行有 DBU 授信業務往來之中華民國境內法人"],"a":3,"ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(二)受理對象:<mark>與本行有</mark>O<mark>BU授信業務往來之中華民國境內法人</mark>。(三)本帳戶之首筆資金應為授信撥入之資金，惟授信方式屬貿易融資或保證等間接授信者，不在此限。帳戶業務別為「86」，帳號第六碼為「7」，屬多幣別帳戶，不掣發存摺，所有交易受理行限原開戶行，同一客戶於同一分行僅得開立一戶授信目的帳戶，且第e金網僅得申請「查詢服務」。"},"x":"境內法人僅限<b>與本行有 OBU 授信業務往來</b>者得開立 OBU 授信目的帳戶；僅有 DBU 授信往來者不得 → (D)。"},{"id":"114-43","y":114,"n":43,"m":8,"q":"有關新臺幣遠匯 KYC 規範，下列何者有誤？","o":["高淨值投資法人每年辦理 KYC","一般客戶每年辦理 KYC","專業機構投資人免辦理 KYC","其他法人專業客戶每年辦理 KYC"],"a":0,"ci":{"b":"衍商篇","c":"第十章 其他作業相關規範","s":"第四節 商業行銷（含電話行銷）應遵循原則","t":"(三)OBU專業機構投資人及<mark>高淨值投資法人</mark>免辦理「衍生性KYC」，仍應於<mark>每年辦理</mark>專業客戶申請/覆審時確認存續經營。"},"x":"OBU 專業機構投資人及<b>高淨值投資法人免辦理</b>衍生性 KYC，僅每年覆審時確認存續經營 → (A)錯。"},{"id":"114-44","y":114,"n":44,"m":4,"q":"下列有關匯入匯款通知書標示及相應處理敘述，何者有誤？","o":["附言欄位有敘明匯款目的時，應與客戶營業性質或申報性質相符","有不利於解款之特別指示事項時，應注意避免款項誤付或重覆解款之情事發生","列示之「註記提醒事項」，應由主管及經辦蓋章確認","以上皆正確"],"a":3,"ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"3.<mark>匯款通知書</mark>上有特別指示事項者，應確認是否業經履行外，亦應審視「匯款附言(PACS.008之RmtInf欄位)」及「銀行間通訊(PACS.008之InstrForCdtrAgt及InstrForNxtAgt欄位)」檢附之資訊，是否標有不利於解款之特別指示事項，避免款項誤付或重覆解款之情事發生。"}},{"id":"114-45","y":114,"n":45,"m":6,"q":"有關外匯綜合存款帳戶辦理郵寄結清之規定，下列何者錯誤？","o":["將一併註銷該帳戶前已申請之各項電子通路功能","外匯活期存款各幣別餘額併計後不得超過等值新臺幣 5 萬元","外匯定期存款餘額需為零","存戶可選擇將帳戶餘額匯入其於他行之帳戶"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（二）郵寄結清1.營業單位得受理存戶以郵寄「結清銷戶申請書＜郵寄專用＞」方式辦理帳戶結清，並應注意下列事項：(1)<mark>外匯活期存款</mark>:結清帳戶之<mark>各幣別餘額併計後不超過等值新臺幣</mark>10萬元。(2)外匯定期存款餘額需為零。"},"x":"郵寄結清：外匯活期存款各幣別餘額併計<b>不超過等值新臺幣 10 萬元</b>，非 5 萬元 → (B)錯。"},{"id":"114-46","y":114,"n":46,"m":8,"q":"擔任新臺幣遠匯業務交易人員如係以金融機構衍生性商品業務實習取得資格者，實習期間應多久？","o":["6 個月","1 年","3 個月","不可透過實習取得資格"],"a":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(二)在國內外<mark>金融機構</mark>相關衍生性金融<mark>商品業務實習</mark>1年。(三)通過國內金融訓練機構舉辦之結構型商品銷售人員資格測驗並取得合格證書。"},"x":"交易人員資格之一：在國內外金融機構相關衍生性商品業務<b>實習 1 年</b>。"},{"id":"114-47","y":114,"n":47,"m":8,"q":"一般客戶可承作新臺幣遠匯之投資風險屬性包含下列哪些？<br><span class=\"it\">A.</span> 保守型<br><span class=\"it\">B.</span> 穩健型<br><span class=\"it\">C.</span> 積極型","o":["ABC","BC","B","C"],"a":0,"ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(二)凡有實際外匯收支需要且得檢具相關交易文件或主管機關核准文件者。二、承做條件：受理客戶承作本項業務前，應將客戶區分為專業客戶及<mark>一般客戶</mark>，並完成客戶<mark>投資風險屬性</mark>評估(KYC)作業，評估結果為「保守型」、「穩健型」或「積極型」者，皆可承作本項業務。"},"x":"KYC 評估結果為<b>保守型、穩健型或積極型</b>者，皆可承作新臺幣遠匯 → ABC。"},{"id":"114-48","y":114,"n":48,"m":6,"q":"下列有關外匯存款之規定何者有誤？","o":["外匯活期存款每年 6 月 20 日及 12 月 20 日各結息一次","無法親簽之身障者開戶時，得由經辦其開戶之行員協助見證事宜","數位帳戶承作外匯定期存款每筆最低存款金額為等值 100 美元","外匯定期存款可辦理質借外幣"],"a":1,"ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"3.為落實外匯業務防制洗錢及打擊資恐作業，如有婉拒受理客戶開戶之情事，請參照第一章第四節婉拒客戶開戶作業辦理。(五)身障者(含視覺障礙者)或客戶不識字<mark>無法親簽</mark>時之外匯存款(含活期、定期)開戶規定如下："}},{"id":"114-49","y":114,"n":49,"m":1,"q":"除信用狀另有規定外，有關航空運送單據之敘述，下列何者為是？","o":["航空運送單據係一種權利證券，得據以背書轉讓","得表明貨物將轉運或可能轉運，但以運送全程係由同一航空運送單據所涵蓋者為條件","無需表明簽發日","以上皆是"],"a":1,"ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(1)<mark>航空運送單據</mark>係一種收據，並非權利證券，不得據以背書轉讓，故承做押匯時，宜多加注意，並依客戶信用情形審慎辦理。(2)須顯示表明運送人名稱，並經運送人或其標名代理人簽署，且運送人或代理人之任何簽字須表明其為運送人或代理人。為運送人簽字之代理人亦必須表明其係代替或代表運送人簽署。(3)<mark>得表明貨物將轉運或可能轉運，但以運送全程係由同一航空運送單據所涵蓋者為條件</mark>。即使信用狀有禁止轉運之規定，表明<mark>將轉運或可能</mark>發生轉運之<mark>航空運送單據</mark>，可以接受。(4)應表明簽發日。除<mark>航空運送單據</mark>另含實際裝運日期之特別註記，否則應以簽發日為裝運日期。有關該單據上之飛行班次及日期之任何其他資料，將不作為判定裝運日期之用。(5)出口商不必背書，亦可不必在<mark>航空運送單據</mark>正面簽字，除非信用狀另有規定。(6)對於未持有交通部民用航空局核發之航空貨運承攬業許可證業者所發航空提單，不得據以作為押匯文件。(7)對受貨人名稱、地址經塗改或更改者，其貨物之所有人難以辨別，承做押匯時，宜多加注意並依客戶信用情形審慎辦理。"},"x":"航空運送單據<b>非權利證券</b>、應表明簽發日；得表明轉運但須全程由同一單據涵蓋 → (B)正確。"},{"id":"114-50","y":114,"n":50,"m":2,"q":"開發信用狀申請書之審查要點，下列敘述何者為非？","o":["信用狀金額不得超過開狀時所附交易單據之金額","客戶指定通知銀行者，以本行之通匯銀行為原則","最後裝運期限應在信用狀有效日期以前或同日","國外費用應請客戶註明開狀行以外之銀行費用由「買方」負擔或「賣方」負擔，如客戶無特別指示，概以「買方」負擔開發"],"a":3,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(十三)<mark>國外費用</mark>：<mark>應請客戶註明開狀行以外之銀行費用由「買方」負擔或「賣方」負擔，如客戶無特別指示，概以「賣方」負擔開發</mark>；倘註明<mark>由「買方」負擔</mark>者，應按收費標準預收<mark>國外費用</mark>，惟為便利客戶作業需要，得酌情於費用發生時，再按實際發生金額，向客戶收取。"},"x":"國外費用如客戶無特別指示，概以「<b>賣方</b>」負擔開發，非買方 → (D)錯。"},{"id":"114-51","y":114,"n":51,"m":3,"q":"辦理貿易融資交易對手存在真實性及行業相關性之審查，下列何者有誤？","o":["無論何種查證方式一律皆應請客戶提供歷史交易文件","初次往來時，應依「進貨/銷貨廠商明細資料表(貿易融資專用版)」進行查證後始可受理","交易對手列於客戶最近一年內徵信報告登錄之主要進貨/銷貨廠商","可透過鄧白氏資料庫進行查證"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"1.存在真實性及行業相關性審查：(1)交易對手應列於客戶最近一年內徵信報告登錄之主要進貨/銷貨廠商或「進貨/銷貨廠商明細資料表(貿易融資專用版)」，超過時效應重新辦理查證。(2)無徵信資料或未列於「進貨/銷貨廠商明細資料表(貿易融資專用版)」者，於初次往來時，應透過下列任一方式查詢並登錄於「進貨/銷貨廠商明細資料表(貿易融資專用版)」後始可受理。A.透過註冊地主管機關網站查詢登記資料。B.鄧白氏D&amp;B企業情報資料庫。C.上市櫃或bloomberg等較具公信力之網站資訊。D.第三方認證機構(如:COFACE等)信用報告。E.本行於當地有分行之國家，可使用「委託聯行查證書(放415)」委託海外分行進行查證。F.本行於當地無分行，得透過外匯通匯行以SWIFT方式查證。G.如查無相關資訊，應留存查詢軌跡，並透過下列任一方式評估風險後審慎辦理。a.<mark>請客戶提供歷史交易文件</mark>(如:發票、訂單、契約或信用狀等)。b.查詢公司相關網站。"},"x":"初次往來交易對手可透過註冊地主管機關網站、鄧白氏、上市櫃或 Bloomberg、第三方認證機構等<b>任一方式</b>查詢，並非一律需客戶提供歷史交易文件 → (A)錯。"},{"id":"114-52","y":114,"n":52,"m":10,"q":"有關匯率選擇權之敘述，下列何者有誤？","o":["自然人限承作不涉及新臺幣匯率之買入選擇權","選擇權買方最大風險為損失已支付的權利金","選擇權賣方最大風險為損失已收取的權利金","歐式選擇權係指買方只能在合約到期日行使權利"],"a":2,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第六節 利率選擇權","t":"一、定義係指本行與客戶共同簽訂契約，由選擇權買方支付權利金予賣方，取得於未來特定到期日或期間內，得要求<mark>選擇權賣方</mark>以雙方約定之履約價格履約。利率選擇權交易中，買方因支付權利金而獲取要求賣方履約的權利，交易最大的損失為權利金，而賣方則因收取權利金而須承擔選擇權履約的義務，交易最大的損失恐將無限大。"},"x":"選擇權賣方承擔履約義務，<b>最大損失恐將無限大</b>，非僅已收取之權利金 → (C)錯。"},{"id":"114-53","y":114,"n":53,"m":9,"q":"某客戶目前無衍生性商品未到期部位，本行核給衍生性金融商品額度 50 萬美元整，現擬承作一年期美元兌新臺幣換匯(SWAP)交易，假設此交易風險係數為 5%，則客戶可承作之最大名目本金為","o":["1,000 萬美元","100 萬美元","2,500 萬美元","250 萬美元"],"a":0,"ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"(一)公司、行號每筆結匯金額達等值1<mark>00萬美元</mark>以上之匯款。(二)團體、個人每筆結匯金額達等值5<mark>0萬美元</mark>以上之匯款。"},"x":"可承作名目本金＝核准額度／風險係數＝50 萬 ÷ 5%＝<b>1,000 萬美元</b>。"},{"id":"114-54","y":114,"n":54,"m":9,"q":"下列哪一種交易不適用本行衍生性金融商品額度？","o":["利率交換","外幣間遠匯","新臺幣遠匯","匯率選擇權"],"a":2,"ci":{"b":"衍商篇","c":"第四章 簽約開戶作業","s":"第一節 應徵提的文件","t":"1.「金融交易總約定書」暨相關附件：契約內容涵蓋各項衍生性金融商品，<mark>客戶簽署本項文件後，可承作全部衍生性金融商品(不含新臺幣遠匯)</mark>。"},"x":"「金融交易總約定書」涵蓋各項衍生性商品，但<b>不含新臺幣遠匯</b>；新臺幣遠匯另依其額度辦理 → (C)。"},{"id":"114-55","y":114,"n":55,"m":9,"q":"衍生性金融商品業務之法人專業客戶不包含下列哪一類？","o":["專業機構投資人","高淨值投資法人","高資產客戶","其他法人專業客戶"],"a":2,"ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"三、法人專業客戶之定義及資格條件<mark>衍生性金融商品業務之法人專業客戶可區分為「專業機構投資人」、「高淨值投資法人」及「其他法人專業客戶」</mark>；"},"x":"衍商篇第二章：法人專業客戶分為專業機構投資人、高淨值投資法人、其他法人專業客戶三類；「<b>高資產客戶</b>」屬財富管理之客戶分類，非衍商法人專業客戶類別。"},{"id":"114-56","y":114,"n":56,"m":10,"q":"下列有關本行募集式投資組合商品「推介人員」之敘述何者正確？","o":["可擔任客戶最近一次 KYC評估人員","應向客戶辦理客戶須知錄音作業","可擔任交易文件之「核簽人員」","僅限派令簿上載明派任之人員始可擔任"],"a":1,"ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第二節 推介作業限制及應注意事項","t":"(二)宣讀<mark>客戶須知</mark>1.推介人員<mark>應向客戶</mark>宣讀<mark>客戶須知</mark>之重要內容，並以錄音方式保留紀錄。2.法人專業客戶，20歲(含)以上且未滿65歲(不含)之自然人專業客戶承作所有"},"x":"推介人員應向客戶<b>宣讀客戶須知</b>重要內容並以錄音方式保留紀錄 → (B)正確。"},{"id":"114-57","y":114,"n":57,"m":10,"q":"有關外幣間遠期外匯交易，以下敘述何者為是？","o":["交易到期時，客戶僅得選擇以「差額交割」方式辦理交割","係指不涉及新臺幣且交割日期逾 2 個營業日以上之外匯交易","交易幣別可為非本行掛牌之外幣","一律免徵額度期初保證金"],"a":1,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"一、定義(一)遠期<mark>外匯交易</mark>雙方事先約定在未來某一特定日期或期間，依訂約當時所約定之幣別、金額及匯率進行貨幣買賣。(二)外幣間遠期<mark>外匯交易</mark>(簡稱外幣間遠匯)<mark>係指不涉及新臺幣且交割日期逾</mark>兩<mark>個營業日以上之外匯交易</mark>；包含美元對各種外幣、美元以外各種外幣間之遠期外匯買賣。"},"x":"外幣間遠匯＝<b>不涉及新臺幣且交割日逾 2 個營業日</b>之外匯交易 → (B)正確。"},{"id":"114-58","y":114,"n":58,"m":10,"q":"DBU 小額換匯(SWAP)可由營業單位自行辦理訂約或展期議價之案件，下列何者為非？","o":["交易幣別涉及新臺幣","等值 1 萬美元以上 30 萬美元以下","訂約方式為指定到期日","天期大於 1 年"],"a":3,"ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"(二)交易幣別包含「新臺幣對外幣間換匯」及「外幣對外幣間換匯」交易，並以本行掛牌之外幣為限。(三)交易金額1.營業單位自行辦理案件符合下列全部條件之「訂約」或「展期」交易，由營業單位自行受理客戶承作並逕行輸入端末系統(免向財務處議價)，每筆最低交易金額為等值USD1萬元。(1)DBU交易幣別涉及新臺幣(如：USD/TWD、JPY/TWD..以此類推)。(2)單筆金額未逾等值USD30萬元。(3)天期未逾1年。(4)訂約方式為「指定到期日」。(5)承作價格於成本範圍內。"},"x":"營業單位自行辦理之 DBU 小額換匯條件：涉及新臺幣、單筆未逾 USD30 萬（最低 1 萬）、<b>天期未逾 1 年</b>、指定到期日 → (D)「天期大於 1 年」非屬之。"},{"id":"114-59","y":114,"n":59,"m":9,"q":"有關「授信戶衍生性商品交易期中管理」作業，以下何者為是？","o":["客戶有衍生性未到期部位時，原則上每 3 個月辦理一次","於企金 e-Loan 系統辦理","承作買入選擇權的客戶須納入期中管理","倘於月初接獲風管處擔保品補徵通知之「業務查詢單」，於當月底前完成期中管理即可"],"a":1,"ci":{"b":"衍商篇","c":"第九章 風險控管","s":"第二節 授信戶衍生性商品交易期中管理工作","t":"一、授信戶於本行承做衍生性商品者，應由營業單位經理指派授信部門或外匯部門人員，就授信戶衍生性金融商品操作及信用等現況，<mark>於企金e-Loan系統</mark>定期填製「衍生性商品交易期中管理工作單」並知會外匯部門或授信部門。<mark>企金e-Loan系統</mark>期中管理作業應傳送主管複核結案，分行副理可代為決行核定結案，惟實體期中管理工作單仍需陳核至經理後，留存於授信卷宗。"},"x":"授信戶衍生性商品期中管理係於<b>企金 e-Loan 系統</b>填製「衍生性商品交易期中管理工作單」→ (B)正確。"},{"id":"114-60","y":114,"n":60,"m":9,"q":"下列有關法人戶以數位通路辦理衍生性 KYC 之敘述何者為是？","o":["法人戶可於第 e個網辦理衍生性 KYC","可辦理之 KYC 類別限為「申請衍生性額度之法人【A】」","客戶須先填寫「數位通路辦理衍生性金融商品業務法人授權書」","以上皆非"],"a":2,"ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(二)可辦理KYC類別：申請衍生性額度之法人【A】、不申請衍生性額度之法人【B】皆可。(三)作業程序1.被授權人建檔(1)辦理時點:客戶首次於<mark>數位通路辦理</mark>KYC前，或被授權人異動時。(2)請客戶出具<mark>「數位通路辦理衍生性金融商品業務法人授權書」</mark>，其中被授權人限為「持有本行核發之安控設備並具備FXML憑證」之使用者。(下載路徑：KYC作業專區&gt;衍生性<mark>商品業務</mark>文件下載區)(3)分行檢視授權人之使用者代號符合前述條件，且授權書已由負責人及被授權人親簽，並加蓋公司任一業務往來大小章或經濟部登記印鑑後，由外匯或法金人員至第e金網設定被授權人。"},"x":"法人以數位通路辦理 KYC，須先出具「<b>數位通路辦理衍生性金融商品業務法人授權書</b>」建檔被授權人；A、B 類別皆可 → (C)正確。"}],"sq":[{"id":"S1-1","m":1,"q":"出口<b>貼現</b>案件，倘逾匯票到期日起多少天以上仍未入帳，應比照拒付案件填製「出口押匯拒付整理日誌」？","o":["30 天","60 天","90 天","120 天"],"a":1,"x":"押匯：逾押匯日起 90 天；貼現：逾匯票到期日起 60 天。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第六節 出口押匯/貼現遲延入帳之處理","t":"二、<mark>對於逾越押匯日起九十天(出口押匯)或匯票到期日起六十天(出口貼現)以上仍未入帳之案件</mark>，除應檢附本行向國外銀行拍發之催收函(電)影本，再函請出口商儘速解決外，並應比照拒付案件逐筆填製「出口押匯拒付整理日誌」（註明逾期未入帳），詳載有關案情始末，呈單位主管核閱，同時將案件送外匯營運處外匯作業部辦理出口拒付案件電腦建檔，以利追索處理與管理。"}},{"id":"S1-2","m":1,"q":"依 UCP600，下列何者<b>不得</b>順延至次一銀行營業日？","o":["信用狀有效期限","單據提示期間末日","最後裝運日","以上皆可順延"],"a":2,"x":"有效期限與提示末日遇休假可順延；最後裝運日不得順延（110、111 年重複考）。","lo":1},{"id":"S1-3","m":1,"q":"出口押匯提示之保險單據，下列何者將被視為<b>瑕疵</b>？","o":["含有不承保條款之註記","保險金額幣別與信用狀不同","表明適用免賠額","承保生效日早於裝運日"],"a":1,"x":"保險單所示貨幣必須與信用狀相同；最低投保額 CIF/CIP 之 110%。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"2.<mark>保險單上所表示之貨幣必須與信用狀上相同</mark>。"}},{"id":"S1-4","m":1,"q":"初級市場遠期信用狀買斷，承兌到期日發生下列何種情形時，本行對出口商<b>無追索權</b>？","o":["商業糾紛","法院發出禁止支付命令","開狀行因財務危機致不能付款","出口商單據瑕疵"],"a":2,"x":"開狀行（保兌行）信用風險、國家風險 → 無追索；商業糾紛、禁止支付命令等 → 仍可向出口商求償。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"附錄2-12-1 辦理遠期信用狀買斷業務處理要點","t":"承兌到期日，<mark>倘開狀行(或保兌行)因財務危機致不能付款，本行對出口商無追索權(withoutrecourse)</mark>；"}},{"id":"S1-5","m":1,"q":"辦理信用狀換單分割轉讓，下列何項得<b>酌予增加</b>？","o":["信用狀金額","單價","保險之投保百分比","提示期間"],"a":2,"x":"金額、單價可減少；有效期限提前 7 天以上；裝運日可提前；提示期間可縮短；投保百分比可增加。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"5.<mark>保險之投保百分比，得酌予增加以配合原信用狀之規定</mark>。"}},{"id":"S1-6","m":1,"q":"出口押匯息之計息天數，日本地區之日圓按押匯金額計收幾天利息？","o":["5 天","7 天","10 天","12 天"],"a":1,"x":"港幣（香港）、新加坡幣（新加坡）、日圓（日本）7 天；其他地區 12 天。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第三節 出口押匯/貼現各項利息及費用之計收","t":"(三)出口押匯息：1.計息天數：<mark>香港地區之港幣、新加坡地區之新加坡幣、日本地區之日圓，均按出口押匯金額計收七天之利息</mark>；"}},{"id":"S1-7","m":1,"q":"除信用狀另有規定外，下列何種提單銀行將<b>不予接受</b>？","o":["記載 Shipper's Load and Count","敘明貨物可能裝載於甲板上","以傭船契約條款為準而簽發之提單","表明受益人以外之人為發貨人"],"a":2,"x":"除信用狀另有規定外，不接受傭船契約及以傭船契約條款為準之提單。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(9)<mark>除信用狀另有規定外，不得接受傭船契約（CharterParty）以及以傭船契約上之條款為準而簽發之提單</mark>。"}},{"id":"S1-8","m":1,"q":"出口押匯遭國外拒付，超過多久仍未結案者，應及時採取必要法律程序？","o":["一個月","二個月","三個月","六個月"],"a":2,"x":"1 個月內解決或收回新臺幣；超過 3 個月未結案或影響債權確保 → 法律程序。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第七節 出口押匯/貼現拒付之處理","t":"四、凡出口押匯(貼現)案件遭國外拒付時，應積極進行催討，<mark>並限於一個月以內解決或收回新台幣；如認為有影響本行債權確保之虞時，或超過三個月仍未結案者</mark>，應及時採取必要之法律程序予以催討，切勿拖延。"}},{"id":"S1-9","m":1,"q":"出口押匯遭拒付，倘逾多久仍未收回者，應填具「外匯逾期放款轉列催收款項明細表」送外匯營運處轉列催收款項？","o":["一個月","三個月","六個月","一年"],"a":2,"x":"1 個月內解決或收回；逾 3 個月未結案採法律程序；逾 6 個月未收回轉列催收款項。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務" >自提示日之次日</b>起最長 <b>5 個銀行營業日</b>，且不因有效期限或提示期間末日而縮短。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(三)<mark>審查期間為自提示日之次日起最長五個銀行營業日</mark>，以決定提示是否符合，此一期間不因提示之當日或之後適逢任何有效期限或提示期間末日而須縮短或受其他影響。"}},{"id":"S1-17","m":1,"q":"出口押匯單據之審查，係以何者為依據決定是否構成符合之提示？","o":["買賣契約條款","單據表面內容","貨物實際品質","出口商信用狀況"],"a":1,"x":"審查以單據為本，<b>依單據表面內容</b>決定是否構成符合之提示。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(二)<mark>審查以單據為本，依單據表面內容決定是否構成符合之提示</mark>。"}},{"id":"S1-18","m":1,"q":"出口押匯提示之單據日期，下列敘述何者正確？","o":["須與提單日期相同","得早於信用狀之簽發日，但不可遲於提示日","得遲於提示日 5 日","不得早於信用狀簽發日"],"a":1,"x":"單據日期<b>得早於</b>信用狀簽發日，但<b>不可遲於提示日</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(八)<mark>單據之日期得早於信用狀之簽發日，但不可遲於提示日</mark>。"}},{"id":"S1-19","m":1,"q":"除信用狀另有規定外，商業發票之簽發人及抬頭人應為何？","o":["由申請人簽發，以受益人為抬頭","由受益人簽發，以信用狀申請人為抬頭","由開狀銀行簽發","由押匯銀行簽發"],"a":1,"x":"商業發票須<b>由受益人簽發並以信用狀申請人為抬頭人</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"4.除信用狀另有規定外，<mark>商業發票須由受益人簽發並以信用狀申請人為抬頭人</mark>，所記載之船名、起運港、卸貨港、目的地等應與運送單據不相牴觸。"}},{"id":"S1-20","m":1,"q":"商業發票之幣別，下列何者正確？","o":["得以任何可兌換貨幣表示","須以美元表示","須以信用狀同一幣別表示","得以出口國貨幣表示"],"a":2,"x":"商業發票須以<b>信用狀同一幣別</b>表示。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"1.商業發票上所載之貨物名稱、數量、單價及金額，應與信用狀內容所載者相符或在其所載範圍以內。<mark>2.商業發票須以信用狀同一幣別表示</mark>。"}},{"id":"S1-21","m":1,"q":"除信用狀另有規定外，商業發票上得否加列電訊、倉租、佣金及利息等額外費用？","o":["僅得加列佣金","不得任意加列","僅得加列利息","得任意加列"],"a":1,"x":"除信用狀另有規定外，發票上<b>不得任意加列</b>電訊、倉租、佣金及利息等額外費用。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"8.<mark>除信用狀另有規定外，發票上不得任意加列電訊、倉租、佣金及利息等額外費用</mark>。"}},{"id":"S1-22","m":1,"q":"信用狀要求提單且須全套正本時，下列敘述何者正確？","o":["提示一份正本即可","由押匯銀行決定份數","提示副本即可","提單上表明已簽發若干份正本者，須全部提示"],"a":3,"x":"須徵取全套正本時，提單上表明已簽發若干份正本者，<b>須全部提示</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(1)提單之份數，依信用狀規定徵足。<mark>若須徵取全套正本時，即提單上表明已簽發若干份正本者，須全部提示</mark>。"}},{"id":"S1-23","m":1,"q":"提單標明 To Order of Shipper，而背書由託運人以外之標名主體為之時，其背書效力之限制為何？","o":["須經開狀銀行同意","以代替（或代表）該託運人所為為限","一律無效","須經船公司確認"],"a":1,"x":"託運人以外之標名主體背書，<b>以代替（或代表）該託運人所為為限</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"<mark>背書若由託運人以外之標名主體為之，其背書以代替(或代表)該托運人所為為限</mark>。"}},{"id":"S1-24","m":1,"q":"即使信用狀禁止轉運，下列何種提單仍將被接受？","o":["未載明運送人名稱","表明將轉運或可能轉運，但運送全程由同一提單涵蓋","以傭船契約條款為準之提單","表明將轉運，且運送全程由不同提單涵蓋"],"a":1,"x":"即使禁止轉運，表明將轉運但<b>全程由同一提單涵蓋</b>者，或貨物裝運於貨櫃、拖車、子母船之子船者，將予接受。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(13)即使信用狀禁止轉運，下列情況之提單將予接受：<mark>○1表明貨物將轉運或可能轉運，但該運送全程係由同一提單涵蓋者</mark>。"}},{"id":"S1-25","m":1,"q":"提單上含有「運送人保留轉運權利」之條款者，銀行應如何處理？","o":["視為瑕疵","退回提示人","須經申請人同意","不予理會"],"a":3,"x":"提單上敘明運送人保留轉運權利之條款者，<b>不予理會</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(14)<mark>提單上含有敘明運送人保留轉運權利之條款者，不予理會</mark>。"}},{"id":"S1-26","m":1,"q":"提示多套提單，顯示由同一運輸工具起運且同一航次裝運、表明同一目的地，但裝運日不同者，應如何認定？","o":["視為轉運","認定為部分裝運","不認定係部分裝運","視為瑕疵"],"a":2,"x":"同一運輸工具、同一航次、同一目的地者，縱使裝運日或裝載港不同，<b>不認定係部分裝運</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(16)部分裝運之認定：○1提示多套提單，但顯示係由同一運輸工具起運且以同一航次裝運者，如表明同一目的地，<mark>將不認定係部分裝運</mark>，縱使提單上表明不同之裝運日或不同裝載港、接管地或發送地者亦然"}},{"id":"S1-27","m":1,"q":"提單之簽署，下列敘述何者正確？","o":["須表明運送人名稱，並由運送人、船長或其標名代理人簽署","無須表明運送人名稱","由託運人簽署即可","僅限船公司負責人簽署"],"a":0,"x":"提單必須表明<b>運送人名稱</b>，並由<b>運送人、船長或其標名代理人</b>簽署，代理人須表明代替或代表運送人或船長。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(8)<mark>提單必須顯示已表明運送人（Carrier）名稱且由運送人、船長（Master）或其標名代理人（Agent）所簽署</mark>。"}},{"id":"S1-28","m":1,"q":"傭船提單同時載有簽發日及表明裝運日期之裝載註記時，裝運日期以何者為準？","o":["裝載註記之日期","押匯日","提示日","簽發日"],"a":0,"x":"傭船提單之簽發日期視為裝運日期；<b>但含裝載註記表明裝運日期者，以該註記日期為準</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"傭船提單之簽發日期視為裝運日期。<mark>除非傭船提單含裝載註記表明裝運日期，則該裝載註記之日期將視為裝運日期</mark>。"}},{"id":"S1-29","m":1,"q":"航空運送單據之性質，下列敘述何者正確？","o":["係一種收據，並非權利證券，不得據以背書轉讓","須由託運人空白背書","屬權利證券，得背書轉讓","僅得記名轉讓"],"a":0,"x":"航空運送單據係一種<b>收據</b>，並非權利證券，不得背書轉讓，承做押匯時宜審慎。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(1)<mark>航空運送單據係一種收據，並非權利證券，不得據以背書轉讓</mark>，故承做押匯時，宜多加注意，並依客戶信用情形審慎辦理。"}},{"id":"S1-30","m":1,"q":"除航空運送單據另含實際裝運日期之特別註記外，其裝運日期以何者為準？","o":["簽發日","押匯日","到達日","起飛日"],"a":0,"x":"航空運送單據應表明簽發日；除另含實際裝運日期之特別註記外，<b>以簽發日為裝運日</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"(4)<mark>應表明簽發日</mark>。除航空運送單據另含實際裝運日期之特別註記，否則應以簽發日為裝"}},{"id":"S1-31","m":1,"q":"信用狀未明確規定被保險人時，保險單之被保險人原則上應為何者？","o":["船公司","不應為開狀銀行或申請人以外之主體","受益人","押匯銀行"],"a":1,"x":"未明確規定時，被保險人<b>不應為開狀銀行或申請人以外之主體</b>；但已由被保險人背書之保險單可接受。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"4.保險單之被保險人應依信用狀指示。<mark>信用狀未明確規定被保險人時，保險單之被保險人不應為信用狀開狀銀行或申請人以外之主體</mark>"}},{"id":"S1-32","m":1,"q":"保險單據所承保之危險範圍，至少應涵蓋下列何者？","o":["自卸貨港至買方倉庫","自工廠至裝運港","自信用狀所敘明之接管地或裝運地至卸貨地或最終目的地","僅海上運送期間"],"a":2,"x":"承保危險至少涵蓋<b>信用狀所敘明之接管地或裝運地至卸貨地或最終目的地</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"10.<mark>保險單據須表明所承保之危險至少涵蓋自信用狀所敘明之接管地或裝運地與卸貨地或最終目的地之範圍</mark>。"}},{"id":"S1-33","m":1,"q":"CIF 或 CIP 價額無法自單據認定時，保險最低投保額應如何計算？","o":["商業發票總額之 100%","信用狀金額之 120%","由保險公司決定","兌付或讓購金額之 110% 或商業發票總額之 110%，以孰高者為準"],"a":3,"x":"無法認定時，以兌付或讓購金額之 110% 或發票總額之 110% <b>孰高</b>者為準。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"CIF或CIP價額無法自單據認定時，<mark>應就信用狀下所要求辦理兌付或讓購金額之110%，或商業發票上貨物總價額之110%，以孰高者為準</mark>。"}},{"id":"S1-34","m":1,"q":"出口押匯（貼現）案件遭國外拒付後，倘逾多久仍未收回，應填具「外匯逾期放款轉列催收款項明細表」轉列催收？","o":["6 個月","1 個月","3 個月","1 年"],"a":0,"x":"拒付案件逾 <b>6 個月</b>仍未收回者，填具明細表送外匯營運處轉列「催收款項」並繼續催討。","ci":{"b":"講義：2026外匯業務法規與實務","c":"第31頁","s":"","t":"倘<mark>逾六個月仍未收回者，應填具「外匯逾期放款轉列催收款項明細表」</mark>送外匯營運處轉列「催收款項」科目，並繼續催討。"}},{"id":"S1-35","m":1,"q":"出口押匯單據不齊全或內容有誤，倘超過幾個營業日仍未補送／正，應於審核工作單敘明理由並呈核至經理？","o":["10 個營業日","3 個營業日","7 個營業日","5 個營業日"],"a":3,"x":"超過 <b>5 個營業日</b>仍未補送／正者，應於審核工作單敘明理由並呈核經理蓋章。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第九節 出口押匯/貼現其他應注意事項","t":"(三)<mark>倘超過五個營業日仍未補送/正者，應於「出口押匯/託收作業暨防制洗錢及打擊資恐審核工作單」上敘明理由</mark>…並呈核至經理蓋章確認。"}},{"id":"S1-36","m":1,"q":"信用狀轉讓案件接獲國外入帳通知後，匯付第二受益人款項時，本行手續費之計收標準為何？","o":["按押匯／託收金額 0.1%，最低 USD40","按押匯金額 0.05%，最低 USD20","每筆固定 USD30","免收"],"a":0,"x":"匯付第二受益人：手續費按押匯／託收金額 <b>0.1%</b>、最低 <b>USD40</b>；郵電費每筆 USD30。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"A.<mark>手續費：按押匯/託收金額0.1%計收，最低USD40</mark>。B.郵電費：每筆計收USD30。"}},{"id":"S1-37","m":1,"q":"信用狀轉讓時註明國外費用由第一受益人負擔者，出口押匯銷帳金額應如何計算？","o":["以收件金額（兩發票差額）扣除國外費用後之金額辦理","以國外入帳金額全額銷帳","以第二受益人發票金額銷帳","以原信用狀金額銷帳"],"a":0,"x":"以收件金額（第一、二受益人兩發票差額）銷帳；註明國外費用由第一受益人負擔者，<b>扣除國外費用後</b>辦理。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"(1)出口銷/入帳以收件金額（即第一、二受益人兩發票間之差額）辦理出口押匯（貼現）銷帳或BBOC入帳。<mark>惟倘轉讓時有註明國外費用係由第一受益人負擔者，應以收件金額扣除國外費用後之金額辦理銷/入帳</mark>。"}},{"id":"S1-38","m":1,"q":"營業單位接獲第二受益人押匯文件時，應如何處理？","o":["逕行寄單","退回第二受益人","通知開狀銀行","立即通知第一受益人來行辦理換單作業"],"a":3,"x":"應<b>立即通知第一受益人</b>來行換單，並得依規定墊付兩發票間之差額。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"(七)<mark>營業單位於接獲第二受益人押匯文件時，應立即通知換單信用狀轉讓之申請人（第一受益人）來行辦理換單作業</mark>"}},{"id":"S1-39","m":1,"q":"換單分割轉讓之信用狀，下列何項「得較原信用狀規定提前」？","o":["裝船日期","金額","單價","保險投保百分比"],"a":0,"x":"裝船日期得提前、提示期間得縮短、保險投保百分比得增加；金額與單價可減少。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十節 信用狀轉讓之處理","t":"<mark>3.裝船日期：得較原信用狀規定提前</mark>。4.提示期間：得較原信用狀規定縮短。"}},{"id":"S1-40","m":1,"q":"以出口押匯額度辦理轉開信用狀時，轉開之信用狀有效期限應如何訂定？","o":["與原始信用狀相同","較原始信用狀為短，以利及時更換單據","較原始信用狀為長","無限制"],"a":1,"x":"轉開信用狀有效期限應<b>較原始信用狀為短</b>，以利及時更換單據。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第八節 轉開國內信用狀之處理","t":"<mark>信用狀有效期限應較原始信用狀為短，以利及時更換單據</mark>；另信用狀如未規定押匯文件以快遞方式寄送者，有效地點應加註”Atourcounter”。"}},{"id":"S1-41","m":1,"q":"轉開國內信用狀擬在原已核准之進口授信額度內辦理時，應依何項規定辦理？","o":["外匯篇第四章第九節「三角貿易案件之處理」","國內信用狀規定","買斷業務要點","出口押匯規定"],"a":0,"x":"在進口授信額度內辦理者，依「<b>三角貿易案件之處理</b>」規定；在出口押匯額度內辦理者，依第二章第八節。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第八節 轉開國內信用狀之處理","t":"(二)轉開國內信用狀得在原已核准之進口授信額度內辦理，<mark>相關作業悉依「業務處理細則-外匯篇」第四章第九節「三角貿易案件之處理」規定辦理</mark>。"}},{"id":"S1-42","m":1,"q":"信用狀載有「Negotiation under this credit is restricted to ○○○ Bank」且指定銀行非本行時，本行應如何處理？","o":["改為託收","須辦理轉押匯","直接押匯","退回客戶"],"a":1,"x":"限制押匯銀行文句之指定銀行非本行時，<b>須辦理轉押匯</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"附錄2-2-1 一般限制押匯銀行使用之文句","t":"附錄2-2-1一般限制押匯銀行使用之文句（<mark>通知銀行或指定之銀行非本行時須辦理轉押匯</mark>）1.Negotiationunderthiscreditisrestrictedto○○○Bank,Taipei."}},{"id":"S1-43","m":1,"q":"簽章登記卡之「客戶名稱」欄，客戶與本行尚無授信往來者應如何辦理？","o":["不得受理","僅得簽名","可使用本行得核對之印鑑，嗣後開始授信往來時應重徵並改用授信往來印鑑","須使用經濟部登記印鑑"],"a":2,"x":"無授信往來者可使用本行得核對之印鑑；<b>嗣後開始授信往來時，應重徵簽章登記卡</b>並改用同一印鑑。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第一節 受理申請出口押匯/貼現之處理","t":"倘客戶與本行尚無授信往來者，<mark>可使用本行得核對之印鑑，惟嗣後該戶與本行開始授信往來時，應重徵「簽章登記卡」且改用授信往來同一印鑑</mark>。"}},{"id":"S1-44","m":1,"q":"出口押匯客戶負責人變更，但法人主體未變更時，下列何者正確？","o":["僅須重徵出口押匯約定書","兩者皆須重徵","須重徵簽章登記卡，已徵妥之出口押匯約定書得免重新徵提","簽章登記卡及出口押匯約定書皆免重徵"],"a":2,"x":"負責人變更<b>須重徵簽章登記卡</b>；法人主體未變更者，出口押匯約定書得免重徵。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第一節 受理申請出口押匯/貼現之處理","t":"<mark>倘客戶負責人變更時，須重徵「簽章登記卡」，惟在法人主體未變更下，對於已徵妥之出口押匯約定書(出19)得免重新徵提</mark>。"}},{"id":"S1-45","m":1,"q":"出口押匯息之計息天數，香港地區之港幣按押匯金額計收幾天利息？","o":["12 天","5 天","7 天","10 天"],"a":2,"x":"港幣（香港）、新加坡幣（新加坡）、日圓（日本）計收 <b>7 天</b>；其他地區 12 天。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第三節 出口押匯/貼現各項利息及費用之計收","t":"1.計息天數：<mark>香港地區之港幣、新加坡地區之新加坡幣、日本地區之日圓，均按出口押匯金額計收七天之利息</mark>；其他地區不分幣別，按出口押匯金額計收十二天之利息。"}},{"id":"S1-46","m":1,"q":"出口押匯息之計息天數，美國地區之美元按押匯金額計收幾天利息？","o":["15 天","10 天","12 天","7 天"],"a":2,"x":"港、星、日三地當地幣別 7 天；<b>其他地區不分幣別 12 天</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第三節 出口押匯/貼現各項利息及費用之計收","t":"香港地區之港幣、新加坡地區之新加坡幣、日本地區之日圓，均按出口押匯金額計收七天之利息；<mark>其他地區不分幣別，按出口押匯金額計收十二天之利息</mark>。"}},{"id":"S1-47","m":1,"q":"依 2026 外匯講義，出口拒付案件屆期（逾多久寬限處理期）仍未解決者，應送交外匯營運處建檔？","o":["三星期","一個月","一星期","二星期"],"a":0,"x":"拒付案件屆期<b>逾三星期寬限處理期</b>仍未解決者，應送外匯營運處建檔並填寫拒付整理日誌。","ci":{"b":"講義：2026外匯業務法規與實務","c":"第31頁","s":"","t":"<mark>拒付案件屆期(逾三星期寬限處理期)仍未解決者</mark>，除應確實依規送交外匯營運處建檔外，應填寫出口押匯拒付整理日誌及其附表"}},{"id":"S1-48","m":1,"q":"初級市場遠期信用狀買斷，本行於何時依「信用狀賣斷讓渡書」付款予出口商？","o":["開狀行付款後","接獲開狀行（或保兌行）承兌通知後","承兌到期日","收到單據時"],"a":1,"x":"初級市場買斷：本行於<b>接獲開狀行（或保兌行）承兌通知後</b>付款予出口商。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十二節 出口 遠期 信用狀 買斷業務","t":"(一)係指出口商將遠期信用狀項下之票據或單據讓售予本行，<mark>本行於接獲開狀行(或保兌行)承兌通知後</mark>，依「信用狀賣斷讓渡書」之約定付款予出口商之交易。"}},{"id":"S1-49","m":1,"q":"出口押匯應另徵取一份商業發票，其用途為何？","o":["交出口商留存","送外匯營運處外匯作業部／外匯指定單位存查","寄開狀銀行","交海關"],"a":1,"x":"發票份數應檢齊，並<b>另徵一份送外匯作業部／外匯指定單位存查</b>。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第二節 出口押匯/貼現單據之審核","t":"9.份數是否檢齊(<mark>應另徵取一份送外匯營運處外匯作業部/外匯指定單位存查</mark>)，出口商有否依信用狀條款規定簽署。"}},{"id":"S2-1","m":2,"q":"進口 D/A 託收，匯票到期日以「After B/L Date」規定者，應以何日為起算日？","o":["匯票之承兌日","提單之裝船日","匯票之發票日","單據到達日"],"a":1,"x":"After sight→承兌日；After B/L date→提單裝船日；After date→匯票發票日。","ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第二節 承兌交單（D/A）之處理","t":"<mark>B/LDate規定者，自提單(B/L)之裝船日起算；以AfterDate規定者，自匯票之發票日起算</mark>。"}},{"id":"S2-2","m":2,"q":"開發進口信用狀時，客戶對於開狀行以外之國外銀行費用負擔<b>無特別指示</b>，應如何開發？","o":["概以買方負擔","概以賣方負擔","由開狀行負擔","雙方各半"],"a":1,"x":"無特別指示概以「賣方」負擔；114 年以「買方」為錯誤選項。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(十三)國外費用：應請客戶註明開狀行以外之銀行費用由「買方」負擔或「賣方」負擔，<mark>如客戶無特別指示，概以「賣方」負擔開發</mark>；"}},{"id":"S2-3","m":2,"q":"進口信用狀超額押匯，倘因故無法於交單時完成補徵開狀手續費，至遲應於何時補收？","o":["交付單據前","案件辦理首次還款交易時","信用狀到期日","月底結帳前"],"a":1,"x":"超押逾 5% 就全部超押金額補收；無法交單時完成者至遲於首次還款交易時補收。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"超額押匯金額超過信用狀金額5%時，應就超押金額之全部，依原開狀時之手續費率及補收當日之適用匯率補收開狀手續費，<mark>倘因故無法於交單時完成補徵開狀手續費者，為利贖單作業順利，至遲應於案件辦理首次還款交易時，補收該項費用</mark>。"}},{"id":"S2-4","m":2,"q":"外幣保證函敘明適用 ISP98 時，審單之合理期限為何？","o":["3 個營業日","5 個營業日","7 個營業日","10 個營業日"],"a":0,"x":"UCP600、URDG758：5 個營業日；ISP98：3 個營業日合理，超過 7 個營業日視為不合理。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第十節 外幣擔保信用狀保證函處理","t":"(2)<mark>ISP98：三個營業日為審單合理期限，超過七個營業日視為不合理</mark>。"}},{"id":"S2-5","m":2,"q":"進口開狀案件，L/C 已過期多久以上仍未展期或結案者，到單時應就未用餘額全部補收開狀手續費？","o":["一個月","二個月","三個月","六個月"],"a":2,"x":"過期 3 個月（含）以上 → 依展期費率補收；而過期 1 個月以上為得沖銷未用餘額之條件。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"5.<mark>L/C已過期三個月(含)以上仍未辦理展期或結案之進口開狀案件</mark>，到單時，應就信用狀未用餘額之全部，依展期時之手續費率及補收當日之適用匯率，補收開狀手續費後，始得將單據交付客戶，倘因故無法於交單時完成補收費用者，為利贖單作業順利，至遲應於案件辦理首次還款交易時，補收該項費用。"}},{"id":"S2-6","m":2,"q":"下列何者<b>得</b>沖銷信用狀未用餘額或退還保證金餘額？","o":["國外銀行寄回信用狀修改書","信用狀已過期一個月以上","信用狀過期十天","客戶口頭要求"],"a":1,"x":"寄回信用狀註銷且註明不再裝運、未過期但國外通知不再裝運、過期一個月以上等。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第八節 進口信用狀及保證金未用餘額之處理","t":"(三)<mark>信用狀已過期一個月以上</mark>。"}},{"id":"S2-7","m":2,"q":"進口開狀申請書【31D】信用狀有效日期為 8 個月，應由何層級核可？","o":["外匯經辦","營業單位經理","須授信批覆核准","外匯營運處"],"a":1,"x":"6 個月內為原則；6 個月～1 年由營業單位經理核可；1 年以上須授信批覆核准。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"<mark>6個月~1年內，由營業單位經理核可；1年以上須授信批覆核准</mark>。"}},{"id":"S2-8","m":2,"q":"開發進口遠期信用狀所徵取之「進口遠期信用狀/外幣貸款借款契約」（放211B），應於何時重新徵取？","o":["每年一次","每次授信額度核准後","每筆開狀時","無須重徵"],"a":1,"x":"遠期 L/C 另徵放211B，每次授信額度核准後重新徵取。","src":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第一節 受理申請開發進口信用狀之處理","t":"(三)申請開發遠期信用狀時，應另徵取「進口遠期信用狀/外幣貸款借款契約」（放211B）一份，<mark>應於每次授信額度核准後重新徵取</mark>。"}},{"id":"S2-9","m":2,"q":"進口到單時，進口商應於本行發出單據到達通知書次日起多久內辦理交單手續？","o":["3 個銀行營業日","5 個銀行營業日","7 個曆日","21 個曆日"],"a":1,"x":"應先辦妥第二次結匯或授信應辦事項，並於通知書次日起 5 個銀行營業日內交單。","src":1,"ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"(1)<mark>應於本行發出單據到達通知書次日起五個銀行營業日內辦理交單手續</mark>，惟應先辦妥第二次結匯手續，並將交單日期登記於「進口單據到達登記簿」(FI14)之『單據交付日』欄位，交由主管逐筆檢印後，始可辦理單據之交付。"}},{"id":"S2-10","m":2,"q":"進口開狀【42C】匯票期限（DRAFT AT…）原則上以多少天內為限，超過須批覆核准？","o":["90 天","120 天","180 天","360 天"],"a":2,"x":"180 天內為原則；受益人負擔利息天數加融資天數不得超過每次可貸放期限。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"【42C】匯票期限(DRAFTAT…):<mark>以180天內為原則，超過須批覆核准</mark>。"}},{"id":"S2-11","m":2,"q":"依UCP600規定，信用狀未註明可撤銷與否者，視為何者？","o":["可撤銷","不可撤銷","須詢問開狀行","視受益人意願"],"a":1,"x":"未註明者均視為不可撤銷；非經開狀行、受益人、保兌行同意不可撤銷。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第24頁","s":"","t":"<mark>依UCP600規定未註明可撤銷與否，均視為不可撤銷</mark>不可撤銷之定義：信用狀開出後非經開狀行、受益人、保兌行（若有）之同意不可撤銷。"}},{"id":"S2-12","m":2,"q":"申請開發遠期信用狀時，應另徵取「進口遠期信用狀／外幣貸款借款契約」（放211B），其徵取時點為何？","o":["首次開狀時徵取一次即可","每筆開狀時徵取","應於每次授信額度核准後重新徵取","免徵取"],"a":2,"x":"應於每次授信額度核准後重新徵取一份。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第25頁","s":"","t":"申請開發遠期信用狀時，應另徵取「進口遠期信用狀/外幣貸款借款契約」（放211B）一份，<mark>應於每次授信額度核准後重新徵取</mark>。"}},{"id":"S2-13","m":2,"q":"開發信用狀申請書【31D】有效日期之審查原則，下列何者正確？","o":["一律 3 個月內","以 6 個月內為原則；6 個月至 1 年由營業單位經理核可；1 年以上須授信批覆核准","一律 1 年內","由客戶自訂"],"a":1,"x":"另匯票期限【42C】以 180 天內為原則。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"進口外匯業務開發信用狀申請書之審查：【31D】有效日期及地點：<mark>有效日期：以6個月內為原則；6個月~1年內，由營業單位經理核可；1年以上須授信批覆核准</mark>。"}},{"id":"S2-14","m":2,"q":"開發信用狀申請書【42C】匯票期限（Draft at…）之審查原則為何？","o":["90 天內","120 天內","180 天內，超過須批覆核准","360 天內"],"a":2,"x":"以 180 天內為原則；受益人負擔利息天數與融資天數合計不得超過批覆書核准之每次可貸放期限。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第27頁","s":"","t":"【42C】<mark>匯票期限(DRAFTAT…):以180天內為原則，超過須批覆核准</mark>。"}},{"id":"S2-15","m":2,"q":"信用狀徵提之運送單據為電放提單（Telex Released B/L）時，下列何者正確？","o":["屬權利證券，可照常開狀","非權利證券，應辦妥批覆書交單條件或提供十足定存／活存設質擔保，經營業單位經理核准後承做","一律婉拒","僅需外匯主管核准"],"a":1,"x":"快遞收據、海運貨單、電放提單、貨運收據等皆非權利證券，對債權保障不利。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第28頁","s":"","t":"用狀或全額結匯之開狀案件外，信用狀徵提運送單據倘為：快遞或郵政收據或投郵證明（CourierReceipt,PostReceiptorCertificateofPosting)、貨運卡車收貨單（BondTruckReceipt）、不可轉讓海運貨單（Non-negotiableSeaWaybill）、<mark>電放提單(TelexReleasedB/L)</mark>、貨運收據(CargoReceipt)、交貨單(DeliveryOrder)、送貨通知單(DeliveryNote)、運送承攬人貨運收據(Forwarder’sCargoReceipt）等，不論以任何形式簽發，皆非權利證券，只具收據或契約性質，對本行債權保障不利，應請客戶於開狀時先辦妥授信額度核准批覆書之各項交單條件或提供十足本行定存或活存設質擔保，經營業單位經理核准後承做。"}},{"id":"S2-16","m":2,"q":"進口到單時，客戶應於本行發出單據到達通知書次日起多久內辦理交單手續？","o":["三個銀行營業日","五個銀行營業日","七個銀行營業日","十個銀行營業日"],"a":1,"x":"應先辦妥第二次結匯或授信核准應辦事項，並於 5 個銀行營業日內交單。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第29頁","s":"","t":"<mark>應於本行發出單據到達通知書次日起五個銀行營業日內辦理交單手續</mark>。"}},{"id":"S2-17","m":2,"q":"客戶辦理擔保提貨（L/G）或副提單背書（E/D）提貨後，下列何者正確？","o":["單據瑕疵時得拒付","提貨後不得以任何理由要求拒付","得於 7 日內拒付","經外匯主管同意得拒付"],"a":1,"x":"擔保提貨及副提單背書提貨後皆不得以任何理由要求拒付；即期信用狀應辦妥第二次結匯。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第29頁","s":"","t":"<mark>惟提貨後，不得以任何理由要求拒付</mark>。"}},{"id":"S2-18","m":2,"q":"進口信用狀最後裝運日期與有效日期相距超過 21 曆日以上者，應查明何項欄位是否填列？","o":["受益人地址","單據「提示期間」欄位","保險條款","運費條款"],"a":1,"x":"相距超過 21 曆日者，應查明<b>單據「提示期間」</b>欄位是否填列；未填列則依 UCP600 辦理。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"最後裝運日期與信用狀有效日期相距超過21曆日以上者，<mark>應查明單據「提示期間」欄位是否填列</mark>，如未填列，則依UCP600相關規範辦理。"}},{"id":"S2-19","m":2,"q":"進口信用狀之最後裝運期限，下列何者正確？","o":["得晚於信用狀有效日期","無限制","應在信用狀有效日期以前或同日，且不得超過輸入許可證之有效日期","須早於有效日期 21 日"],"a":2,"x":"最後裝運期限應在有效日期<b>以前或同日</b>，且不得超過輸入許可證有效日期。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(十一)…<mark>最後裝運期限應在信用狀有效日期以前或同日（不得超過輸入許可證之有效日期）</mark>"}},{"id":"S2-20","m":2,"q":"L/C 已過期三個月（含）以上仍未辦理展期或結案之進口開狀案件，到單時應如何補收開狀手續費？","o":["免補收","就超押部分補收","就未用餘額全部，依展期時之手續費率及補收當日匯率補收","依原開狀費率補收 5%"],"a":2,"x":"應就<b>信用狀未用餘額之全部</b>，依<b>展期時之手續費率</b>及補收當日適用匯率補收。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第四節 第二次結匯及進口到單處理","t":"5.L/C已過期三個月(含)以上仍未辦理展期或結案之進口開狀案件，到單時，<mark>應就信用狀未用餘額之全部，依展期時之手續費率及補收當日之適用匯率，補收開狀手續費</mark>後，始得將單據交付客戶"}},{"id":"S2-21","m":2,"q":"依 URC522，託收指示憑付款交單（D/P）之案件，得否含有未來日期付款之匯票？","o":["得含有","不得含有","經客戶同意得含有","僅限 30 天以內"],"a":1,"x":"URC522：憑付款交單之託收<b>不得含有未來日期付款之匯票</b>；若僅標明 D/P 30 天，單據僅於客戶付款後交付。","ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第三節 付款交單（D/P）之處理","t":"二、依託收統一規則(URC522)規定<mark>「託收指示憑付款交單之案件，不得含有未來日期付款之匯票」</mark>。"}},{"id":"S2-22","m":2,"q":"進口託收指示僅標明「D/P 30 天」而未標示單據處理方式時，單據應於何時交付？","o":["承兌後交付","30 天後交付","進口客戶付款後才能交付","到單即交付"],"a":2,"x":"無 D/A 或 D/P 標示、或僅標明 D/P 30 天者，<b>僅於進口客戶付款後</b>才能交付單據。","ci":{"b":"外匯篇","c":"第五章 受理進口託收作業應注意事項","s":"第三節 付款交單（D/P）之處理","t":"若無該標示、或託收指示僅標明憑付款交單如D/P30天者，<mark>則該單據僅於進口客戶付款後才能交付</mark>。"}},{"id":"S2-23","m":2,"q":"依託收統一規則，向付款人辦理提示單據之代收銀行稱為？","o":["提示銀行","委託銀行","保兌銀行","託收銀行"],"a":0,"x":"<b>提示銀行（Presenting Bank）</b>＝向付款人提示單據之代收銀行，實務上通常與代收銀行為同一銀行。","ci":{"b":"外匯篇","c":"第二章 受理出口押匯/貼現作業應注意事項","s":"第十四節 信用狀通知業務","t":"<mark>4.提示銀行(PresentingBank)：向付款人辦理提示單據之代收銀行</mark>。就實務上而言，提示銀行通常與代收銀行為同一銀行。"}},{"id":"S2-24","m":2,"q":"進口開狀之價格條件為 FOB 時，有關保險之處理何者正確？","o":["由開狀行投保","應請客戶辦妥保險並以本行為優先受益人","由賣方投保","免投保"],"a":1,"x":"CFR、FOB、FAS、FCA 等買方須自行投保之條件，應請客戶辦妥保險並<b>以本行為優先受益人</b>。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"(2)<mark>如價格條件為C.F.R.、F.O.B.、F.A.S.或F.C.A.時，應請客戶辦妥保險並以本行為優先受益人</mark>。"}},{"id":"S2-25","m":2,"q":"進口開狀海運提單之受貨人，經何人核准後得依客戶要求改以申請人或第三者為受貨人或指示人？","o":["授信審核處","營業單位經理","外匯經辦","防制洗錢督導主管"],"a":1,"x":"須經<b>營業單位經理核准</b>後，始得改以申請人或第三者為受貨人或指示人。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第二節 進口信用狀之開發及第一次結匯","t":"<mark>營業單位經理核准後，依客戶要求，改以申請人或第三者為受貨人或指示人</mark>。"}},{"id":"S2-26","m":2,"q":"受理提示貨運收據（Cargo Receipt）之進口修狀案件，應經何人核准後始得開發？","o":["分行經理","外匯營運處","外匯經辦","法務室"],"a":0,"x":"Cargo Receipt 案件應經<b>分行經理核准</b>，並辦妥「CARGO RECEIPT 案件」註記及主管蓋章確認。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第三節 進口信用狀之修改","t":"(八)各營業單位受理提示貨運收據（CargoReceipt）之進口修狀案件，<mark>應經分行經理核准後始得開發</mark>，並應辦妥『CARGORECEIPT案件』註記及主管蓋章確認事宜"}},{"id":"S2-27","m":2,"q":"不可撤銷信用狀之修改，何時始生效力？","o":["開狀行發出即生效","申請人提出即生效","經所有利害關係人全體之同意始生效力","通知銀行收到即生效"],"a":2,"x":"不可撤銷信用狀之修改，<b>應經所有利害關係人全體同意</b>始生效力。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第三節 進口信用狀之修改","t":"惟此種修改<mark>應經所有利害關係人全體之同意始生效力</mark>"}},{"id":"S2-28","m":2,"q":"外幣保證函適用 ISP98 時，審單超過幾個營業日視為不合理？","o":["5 個營業日","7 個營業日","10 個營業日","3 個營業日"],"a":1,"x":"ISP98：3 個營業日為合理期限，<b>超過 7 個營業日</b>視為不合理。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第十節 外幣擔保信用狀保證函處理","t":"(2)ISP98：三個營業日為審單合理期限，<mark>超過七個營業日視為不合理</mark>。"}},{"id":"S2-29","m":2,"q":"辦理擔保提貨後，進口商得否以單據瑕疵為由要求拒付？","o":["經本行同意得拒付","得拒付","提貨後不得以任何理由要求拒付","僅限金額不符時得拒付"],"a":2,"x":"擔保提貨後，<b>不得以任何理由要求拒付</b>。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第六節 副提單背書及擔保提貨之處理","t":"三、擔保提貨(一)客戶於接到船公司到貨通知而正副提單均未到達時，得申請「擔保提貨」；<mark>惟提貨後，不得以任何理由要求拒付</mark>。"}},{"id":"S2-30","m":2,"q":"進口開狀信用狀尚未過期，但國外通知銀行來電通知出口商已不再裝運，對未用餘額之處理為何？","o":["不得沖銷","須經法院確認","得沖銷信用狀未用餘額或退還保證金餘額","須俟過期三個月後始得沖銷"],"a":2,"x":"國外通知銀行來電通知不再裝運者，<b>得沖銷未用餘額或退還保證金</b>。","ci":{"b":"外匯篇","c":"第四章 受理開發進口信用狀作業應注意事項","s":"第八節 進口信用狀及保證金未用餘額之處理","t":"(二)<m S4-2","m":4,"q":"外匯電文系統各使用單位應指派專人多久查詢一次「使用者帳號明細表」？","o":["每日","每週","每月","每季"],"a":1,"x":"每週查詢；密碼連續錯誤 5 次或逾 60 天未登入自動失效。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(五)<mark>各使用單位應指派專人每週於外匯電文系統查詢「使用者帳號明細表」</mark>，確實控管使用人員之情形，若有密碼期限將屆者，應立即變更。"}},{"id":"S4-3","m":4,"q":"手工電文稿若僅經一名主管(MANAGER)核准，下列何者正確？","o":["放行人員必須為該主管本人","放行人員與該核准主管不得為同一人","可免覆核","可由經辦自行放行"],"a":1,"x":"付款類電文須二名電文稿主管核准；僅一名主管核准時，放行人員不得與該主管同一人。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"惟倘該筆電文稿僅經一名主管(MANAGER)核准時，<mark>則電文放行人員(AUTHORIZE)與該核准主管不得為同一人</mark>。"}},{"id":"S4-4","m":4,"q":"營業單位對「中低風險客戶適用免徵文件審查」案件之抽查，下列何者正確？","o":["按月抽查，每 10 件抽 1 件","按季抽查，每 10 件抽 3 件，不足 10 件抽 1 件","按年抽查","不足 10 件者免抽查"],"a":1,"x":"按季（1、4、7、10 月）；10-19 件抽 3 件、20-29 抽 6 件；1-9 件抽 1 件；須向客戶徵提該筆佐證文件。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"6.中低風險客戶凡採免徵文件方式辦理審查，適用情形屬第2項者，受理時應填妥「中低風險客戶適用免徵文件審查登記簿」併同申請書類、水單及交易審查表辦理呈核，並由防制洗錢及打擊資恐督導主管或三合一主管按季(每年1、4、7及10月為查核月)依登記簿資料辦理抽查，<mark>每10件應抽查3件(即10-19件抽3件、20-29抽6件，以此類推)，不足10件者抽查1件</mark>(即1-9件抽1件)，依抽查結果填報「中低風險客戶適用免徵文件審查案件抽查表」(下稱抽查表)，最遲應於查核當月月底或次月第一個營業日陳核至經理，並將所徵提之相關文件紀錄檢附於抽查表，設專卷留存5年備查。"}},{"id":"S4-5","m":4,"q":"匯往本行日本東京分行之匯出匯款，主管應於多久內放行電文？","o":["30 分鐘","1 小時","2 小時","當日營業結束前"],"a":1,"x":"匯往亞洲地區海外分行案件應於 1 小時內放行；日終列印逾時清單逐筆填原因。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"匯往中國、香港、澳門、日本、新加坡、越南、柬埔寨、菲律賓、寮國等亞洲地區案件，<mark>應於1小時內放行電文，逾時將提示「請通知主管放行亞洲地區海外分行匯款電文」</mark>。"}},{"id":"S4-6","m":4,"q":"依「銀行業辦理外匯業務管理辦法」，本國自然人匯款人民幣至大陸地區，每人每日在同一銀行之上限為何？","o":["人民幣 2 萬元","人民幣 5 萬元","人民幣 8 萬元","無限制"],"a":2,"x":"自然人匯往大陸每人每日同一銀行 ≦ 8 萬；買賣人民幣帳戶每日 2 萬（買賣分別計算）；匯入無限制。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-1-1 如何依客戶申報之匯款性質以填寫匯款分類及編號","t":"(三)自然人（限本國人）<mark>人民幣匯款至大陸地區，每人每日在同一銀行不得逾人民幣8萬元</mark>；"}},{"id":"S4-7","m":4,"q":"客戶透過第e個網辦理外幣匯出匯款，其手續費收取標準為何？","o":["每筆固定 NTD100","匯款金額 0.25‰，最低 NTD200、最高 NTD800，另收郵電費","匯款金額 0.5‰，最低 NTD100","免收手續費"],"a":1,"x":"電子通路外幣匯款 0.25‰（200～800）另收郵電費 300；本行帳戶間轉帳免收。","ci":{"b":"外匯篇","c":" 款金額未達等值美金100萬元：外匯主管無須於外匯電文系統執行放行作業，<mark>外匯主管於執行「匯出放行」交易(代號R211)放行成功後，將由系統自動完成發電</mark>。"}},{"id":"S4-20","m":4,"q":"國外匯出匯款覆核人員之規定，下列何者正確？","o":["得兼任放行主管","由執行 R111 以外之經辦或主管擔任，且不得兼任放行主管或大額覆核主管","得由 R111 輸入人員兼任","須有 3 個月以上外匯經歷"],"a":1,"x":"覆核人員須有 6 個月以上外匯經歷，由<b>R111 以外</b>人員擔任，且<b>不得兼任</b>放行主管或大額覆核主管。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"<mark>覆核人員應由執行「匯出資料輸入」(代號R111)以外之經辦或主管人員辦理，且覆核人員不得兼任放行主管或「大額覆核主</mark>"}},{"id":"S4-21","m":4,"q":"外匯主管發現外匯電文系統中之大額匯出匯款電文資料有誤時，應如何處理？","o":["刪除後重新 R111","即將錯誤之電文辦理退回","通知國外銀行更正","直接於電文系統修改"],"a":1,"x":"發現電文資料有誤時，<b>應即將錯誤之電文辦理退回</b>。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"倘發現外匯電文系統中之電文資料有誤時，<mark>應即將該錯誤之電文辦理退回</mark>，"}},{"id":"S4-22","m":4,"q":"受理外籍人士或非本行客戶申請開發小額匯票時，原則上應如何處理？","o":["僅限美元受理","一律受理","須經總行核准","除可確定用途確有需要者外，原則上應予勸阻"],"a":3,"x":"為杜絕偽造，除確有需要者外，<b>原則上應予勸阻</b>。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"2.受理外籍人士或非屬本行客戶申請開發小額匯票時，<mark>除可確定其用途確有需要者外，原則上應予勸阻</mark>，以杜絕有心者偽造之機。"}},{"id":"S4-23","m":4,"q":"以本行匯票票匯方式之國外匯出匯款，其匯票通知書應如何處理？","o":["金額達 1 萬美元以上才拍發 MT110","以 MT103 替代","以郵寄寄送","不論金額大小，一律以 SWIFT MT110 電文替代"],"a":3,"x":"票匯之匯票通知書<b>一律以 MT110</b> 替代；止付通知用 MT111。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"3.辦理以本行匯票票匯方式之國外匯出匯款案件，<mark>不論金額大小，其匯票通知書應一律以拍發SWIFTMT110電文替代</mark>"}},{"id":"S4-24","m":4,"q":"匯出匯款因國外受款人不接受或無法寄達而退回本行時，應如何處理？","o":["由本行自行查明後重匯","轉入催收","速通知申請人，請其書面提供正確資料申請修改，或依退匯規定辦理","逕行退還申請人新臺幣"],"a":2,"x":"應<b>速通知申請人</b>以書面提供正確受款人資料申請修改，或依退匯申請規定辦理。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第三節 國外匯出匯款之處理","t":"(四)匯出匯款因國外受款人不接受，或無法寄達受款人而退回本行時，<mark>應速通知申請人，請其以書面提供受款人正確之名稱、地址、帳號等詳細資料申請本行修改</mark>，或是請其依退匯申請相關規定辦理。"}},{"id":"S4-25","m":4,"q":"受款行非本行存匯行時，匯出匯款劃帳行應如何選擇？","o":["由客戶指定","優先選擇受款行與本行之共同存匯行","任選一家國際大型銀行","一律選擇美國銀行"],"a":1,"x":"受款行非本行存匯行時，<b>優先選擇共同存匯行</b>；無共同存匯行仍選本行存匯行並加註中間行。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-3-1 匯款劃帳應注意事項","t":"3.<mark>受款行非本行存匯行時，優先選擇受款行與本行之共同存匯行為劃帳行(收電行)</mark>"}},{"id":"S4-26","m":4,"q":"MX 格式（PACS.008）匯出匯款需加註中間行時，應加註於何欄位？","o":["RmtInf","IntrmyAgt","Dbtr","InstrForCdtrAgt"],"a":1,"x":"中間行加註格式：PACS.008 加註於 <b>IntrmyAgt</b> 欄位。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-3-1 匯款劃帳應注意事項","t":"中間行加註格式如下：<mark>PACS.008:加註於IntrmyAgt欄位</mark>"}},{"id":"S4-27","m":4,"q":"匯款人資訊不足時，本行以掛號通知受款人應更正已逾多久而未獲更正，得逕予退匯？","o":["10 日","3 個月","2 個月","1 個月"],"a":3,"x":"以掛號通知受款人<b>已逾 1 個月</b>，或去電已逾發電日起 10 個營業日未獲更正者，得逕予退匯。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"(4)<mark>倘自本行以掛號通知受款人應更正匯款人資訊不足已逾1個月</mark>或本行去電詢問已逾發電日起算10個營業日，而未接獲匯款銀行來電更正或提供匯款人完整資料，得以欠缺完整匯款人資訊為由，不受理此筆匯款而逕予退匯"}},{"id":"S4-28","m":4,"q":"因匯款人資訊不足而轉請外匯作業部代向匯款銀行查詢時，去電郵電費由何人負擔？","o":["匯款人","本行","匯款銀行","受款人，且不得申請減免"],"a":3,"x":"去電郵電費應<b>由受款人負擔</b>，不得申請減免。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"倘轉請外匯營運處外匯作業部或外匯指定單位代為向匯款銀行查詢，<mark>去電郵電費應由受款人負擔，不得申請減免</mark>。"}},{"id":"S4-29","m":4,"q":"營業單位收到回覆之匯款人資訊電文時，應如何處理？","o":["直接歸檔","通知受款人即可","免處理","透過 AML 系統查詢是否為黑名單，並列印查詢結果留存"],"a":3,"x":"收到回覆電文時，應透過 <b>AML 系統查詢是否為黑名單</b>，並列印查詢結果留存備查。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"(3)<mark>營業單位收到回覆匯款人資訊電文時，應透過「防制洗錢打擊資恐(AML)系統」查詢是否為黑名單，並將列印之查詢結果留存備查</mark>。"}},{"id":"S4-30","m":4,"q":"匯入匯款通知書附隨受款人地址，與本行建檔資料顯不合理時，應如何處理？","o":["逕予退匯","忽略不理","詢問原因並請客戶說明或提出佐證，於通知書空白處註記，經辦及主管蓋章後憑辦","通報洗防部"],"a":2,"x":"受款人地址非必要資訊；附隨且顯不合理者，應<b>詢問原因、請客戶說明或佐證並註記</b>，經辦及主管蓋章後憑辦。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"惟匯入匯款通知書有附隨受款人地址者，應與本行建檔資料核對，<mark>倘顯不合理，應詢問原因並請客戶提出說明或佐證文件，於通知書空白處註記，由經辦及主管蓋章確認後憑辦</mark>"}},{"id":"S4-31","m":4,"q":"匯入匯款通知書上有特別指示事項者，除確認是否業經履行外，尚應審視 PACS.008 之何欄位？","o":["UltmtCdtr","Dbtr","RmtInf 及 InstrForCdtrAgt、InstrForNxtAgt","ChrgBr"],"a":2,"x":"應審視<b>匯款附言（RmtInf）</b>及<b>銀行間通訊（InstrForCdtrAgt、InstrForNxtAgt）</b>是否有不利解款之指示。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"亦應審視<mark>「匯款附言(PACS.008之RmtInf欄位)」及「銀行間通訊(PACS.008之InstrForCdtrAgt及InstrForNxtAgt欄位)」</mark>檢附之資訊，是否標有不利於解款之特別指示事項"}},{"id":"S4-32","m":4,"q":"外匯電文系統使用者密碼，在何種情形下將自動失效？","o":["每月自動失效","逾 30 天未登入","連續錯誤 3 次","連續錯誤 5 次或逾期 60 天未登入"],"a":3,"x":"密碼<b>連續錯誤 5 次</b>或<b>逾期 60 天未登入</b>者自動失效，需申請重置。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(四)<mark>密碼連續錯誤5次或逾期60天未登入者，密碼將自動失效</mark>，倘欲回復需申請密碼重置。"}},{"id":"S4-33","m":4,"q":"對外發電之擬稿單位認為擬拍發之電文有重覆之可能時，應於報尾加註何字樣？","o":["PDE","URGENT","NAK","COPY"],"a":0,"x":"有重覆拍發可能時，應於報尾加註 <b>PDE</b>，提醒收電銀行注意。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(2)對外發電之擬稿單位或發電單位倘認為擬拍發之電文有重覆之可能時，<mark>應於報尾上加註PDE字樣</mark>，以提醒收電銀行注意"}},{"id":"S4-34","m":4,"q":"外匯連線系統登打之電文，若外匯電文系統之覆核人員為外匯經辦且自行登打，應如何處理？","o":["得自行覆核","免覆核","由主管直接放行","該筆電文需換人辦理覆核"],"a":3,"x":"經辦得逕行於連線系統登打，惟<b>該筆電文需換人辦理覆核</b>；連線系統編製之電文稿 DATA-ENTRY 欄得免蓋章。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"倘係外匯經辦，得逕行於外匯連線作業系統登打電文資料，<mark>惟該筆電文需換人辦理覆核工作</mark>，另經由外匯連線系統編製之電文稿，其DATA-ENTRY欄位得免蓋章。"}},{"id":"S4-35","m":4,"q":"外匯電文系統之「電文放行人員（AIA）」主要職責為何？","o":["核對電文資料與電文稿並覆核","確認無誤後於 AUTHORIZE 欄蓋章並辦理電文放行","擬稿","登打電文"],"a":1,"x":"VEA 負責覆核；<b>AIA</b> 確認無誤後於 AUTHORIZE 欄蓋章並辦理電文放行。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第二節 環球銀行財務電信 (SWIFT) 系統 暨外匯電文系統","t":"(5)<mark>電文放行人員(AIA)：確認無誤後，於確認/放行(AUTHORIZE)欄位蓋章，並於外匯電文系統辦理電文放行作業</mark>"}},{"id":"S4-36","m":4,"q":"扣款帳戶距上次往來逾多久者，辦理外匯交易時應以「久未往來客戶關懷提問表」加強關懷？","o":["6 個月","3 年","1 年","2 年"],"a":3,"x":"扣款帳戶<b>距上次往來逾 2 年</b>者，應以「久未往來客戶關懷提問表」加強關懷。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"1.<mark>扣款帳戶距上次往來逾2年者，應以「久未往來客戶關懷提問表」加強關懷客戶</mark>。"}},{"id":"S4-37","m":4,"q":"經系統檢核屬疑遭詐騙之預警名單客戶，下列處理何者錯誤？","o":["確定承作須經外匯主管執行 FAT1 主管授權","應明確告知客戶已遭警政署列為預警名單","填寫「臨櫃作業關懷客戶提問表」","有疑慮應通報 165 或警方來行協助"],"a":1,"x":"<b>切勿</b>向客戶透漏已遭警政署、財金公司或本行列為預警名單，以免違法。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(3)<mark>切勿向客戶透漏已遭警政署、財金公司或本行列為預警名單</mark>，以免違反相關法規。"}},{"id":"S4-38","m":4,"q":"中低風險客戶匯往本行位於高風險國家之海外分行案件，符合審查表免徵文件適用情形第 7 項且檢視項目皆勾選「是」者，下列何者正確？","o":["僅限 50 萬元以下免徵","須徵提交易文件","無論金額大小，得免徵提交易文件，僅以審查表評估","一律婉拒"],"a":2,"x":"符合者<b>無論金額大小</b>得免徵文件；但<b>高風險客戶一律徵提</b>交易證明文件。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"2.中低風險客戶匯往(來自)本行位於高風險國家之海外分行案件，符合交易審查表免徵文件適用情形第7項，且檢視項目皆勾選「是」者，<mark>無論金額大小，得免向客戶徵提交易文件</mark>，僅需透過交易審查表辦理評估作業；高風險客戶一律徵提交易證明文件。"}},{"id":"S4-39","m":4,"q":"「中低風險客戶適用免徵文件審查案件抽查表」及相關文件，應設專卷留存多久？","o":["永久","1 年","3 年","5 年"],"a":3,"x":"抽查表及所徵文件紀錄<b>設專卷留存 5 年</b>備查。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"並將所徵提之相關文件紀錄檢附於抽查表，<mark>設專卷留存5年備查</mark>。"}},{"id":"S4-40","m":4,"q":"中低風險客戶免徵文件案件之抽查表，最遲應於何時陳核至經理？","o":["次季第一個營業日","次月底","查核當月 10 日","查核當月月底或次月第一個營業日"],"a":3,"x":"最遲應於<b>查核當月月底或次月第一個營業日</b>陳核至經理。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"依抽查結果填報「中低風險客戶適用免徵文件審查案件抽查表」(下稱抽查表)，<mark>最遲應於查核當月月底或次月第一個營業日陳核至經理</mark>"}},{"id":"S4-41","m":4,"q":"依 EDD 免徵文件適用條件，下列何者「不」屬之？","o":["首次匯款予新交易對手 100 萬元","單筆金額 ≦ 等值新臺幣 50 萬元","週期性匯款且過去一年內曾徵提同一交易對手佐證文件","匯款至國內外本人同戶名帳戶"],"a":0,"x":"免徵條件：單筆 ≦ 50 萬、本人同戶名帳戶、週期性匯款且一年內已徵佐證、交易對手列於徵信報告等；首次新對手大額者不屬之。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-4-4 受理國外匯出(入)匯款業務防制洗錢作業徵提文件一覽表","t":"符合下列條件之一，得適用「免徵文件」方式審查註1：<mark>①單筆金額≦等值新臺幣50萬元。②匯款至國內外本人同戶名帳戶，或自國內外本人同戶名帳戶匯入。③週期性匯款</mark>(如貨款、運輸費用、薪資匯款、投資利息所得及學費等)，且過去一年內曾徵提同一交易對手交易佐證文件並確認交易無異常者。"}},{"id":"S4-42","m":4,"q":"「國外匯出/入匯款交易追蹤事項登記簿」之預計出貨日超過受理日 3 個月時，應如何處理？","o":["不得受理","須報總行核准","須敘明原因及合理性，經外匯主管、洗督主管蓋章確認同意後辦理","經經辦確認即可"],"a":2,"x":"超過 3 個月須<b>敘明原因及合理性</b>，經外匯主管、洗督主管蓋章同意後辦理。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"倘超過3個月須敘明原因及合理性後，<mark>經外匯主管、防制洗錢及打擊資恐督導主管蓋章確認同意後辦理</mark>"}},{"id":"S4-43","m":4,"q":"客戶未依約定日期補送運送單據，但預計出貨日有合理延遲理由時，應如何辦理？","o":["申報疑似洗錢","於登記簿「延遲出貨合理性說明」欄敘明，並經外匯主管、洗督主管蓋章確認","通知警方","逕予結案"],"a":1,"x":"有合理延遲理由者，於登記簿「<b>延遲出貨合理性說明</b>」欄敘明，並經外匯主管、洗督主管蓋章確認。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第四節 外匯業務洗錢防制及打擊資恐作業","t":"若預計出貨日有合理延遲理由，<mark>應於「國外匯出/入匯款交易追蹤事項登記簿」之「延遲出貨合理性說明」欄位敘明</mark>，並經外匯主管、防制洗錢及打擊資恐督導主管蓋章確認。"}},{"id":"S4-44","m":4,"q":"外匯 AML 監控報表（第 2~4 種）之審查，下列何者錯誤？","o":["原則於 1 個月內完成，特殊案件得延長 金額超過等值10萬美元之匯款：<mark>1.於中華民國境內承包工程之工程款</mark>。"}},{"id":"S5-30","m":5,"q":"依外匯收支或交易申報辦法，申報義務人受查詢而未於限期內提出說明或為虛偽說明者，處罰為何？","o":["新臺幣 3 萬元以上 60 萬元以下罰鍰","新臺幣 10 萬元以上 100 萬元以下","僅予警告","新臺幣 1 萬元以上 10 萬元以下"],"a":0,"x":"故意不為申報、申報不實、或受查詢未於限期說明或虛偽說明 → 處新臺幣 <b>3 萬元以上 60 萬元以下</b>罰鍰。","ci":{"b":"講義：2026外匯業務法規與實務","c":"第16頁","s":"","t":"申報義務人故意不為申報、申報不實，<mark>或受查詢而未於限期內提出說明或為虛偽說明者，處新台幣三萬元以上六十萬元以下罰鍰</mark>。"}},{"id":"S5-31","m":5,"q":"未成年人辦理結匯，外匯收支或交易申報書應如何簽章？","o":["由銀行代簽","由未成年人單獨簽章","由父母代簽","由未成年人及其父母共同簽章"],"a":3,"x":"未成年人及其父母<b>共同</b>於「申報義務人及其負責人簽章」處簽章；達新臺幣 50 萬元以上須經央行核准。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"3.外匯收支或交易申報書:<mark>未成年人及其父母共同於「申報義務人及其負責人簽章」處簽章</mark>"}},{"id":"S5-32","m":5,"q":"受理外匯匯入匯款結售時，執行 9772 交易之作業代號「3」或「4」可查詢何資料？","o":["黑名單","該統一編號已建檔之所有新臺幣帳戶資料","客戶風險等級","當年累積結匯金額"],"a":1,"x":"9772 可查詢該統一編號<b>已建檔之所有新臺幣帳戶資料</b>（3 畫面查詢、4 列印查詢）。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第二節 國外匯入匯款之處理","t":"2.9772查詢：於顧客管理系統之外匯客戶資料建檔交易(代號9772)之作業代號項下(3.畫面查詢或4.列印查詢)，<mark>查詢該統一編號已建檔之所有新臺幣帳戶資料</mark>。"}},{"id":"S6-1","m":6,"q":"外匯定期存款辦理自動轉期時，轉期後之存款利率如何決定？","o":["沿用原議價利率","以原存款到期日之前一營業日本行相當存期之掛牌利率","以轉期當日之活存利率","由客戶自行議定"],"a":1,"x":"自動轉期以原到期日前一營業日相當存期掛牌利率計息；114 年以「以原承作利率 4% 續存」為錯誤選項。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（四）<mark>自動轉期時之存款利率，以原存款到期日之前一營業日本行相當存期之掛牌利率計息</mark>。"}},{"id":"S6-2","m":6,"q":"一個月期以上之外匯定期存款，到期未提領而於逾期多少日內辦理續存者，得以原到期日為起息日？","o":["5 日","7 日","10 日","30 日"],"a":2,"x":"逾期 10 日內續存得以原到期日起息，新存單利率以到期日利率為準。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"2.外匯定期存款到期存戶擬續存時，<mark>如存款人於逾期十日內辦理續存手續者，得以原到期日為起息日</mark>，其到期未領之利息，得併同本金續存或轉存，新存單利率以到期日利率為新存款之利率，到期日適逢銀行未對外營業則以前一營業日之利率為準。"}},{"id":"S6-3","m":6,"q":"外匯定期存款約定為下列何種條件時，付息方式<b>不得</b>選擇「按月付息」？","o":["存期 6 個月之固定利率存單","存期 1 年之固定利率存單","機動利率或指定到期日存單","數位帳戶存單"],"a":2,"x":"機動利率或指定到期日型態不得按月付息；按月付息限 3、6、9、12 個月檔期。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第七節 外匯定期存款按月付息之處理","t":"六、其他應注意事項（一）<mark>外匯定期存單約定為「機動」利率或為「指定到期日」型態時，付息方式不得選擇「按月付息」</mark>。"}},{"id":"S6-4","m":6,"q":"受理外匯綜合存款帳戶以郵寄方式辦理結清，外匯活期存款各幣別餘額併計不得超過等值新臺幣多少？","o":["5 萬元","10 萬元","20 萬元","50 萬元"],"a":1,"x":"併計不超過新臺幣 10 萬元，且外匯定期存款餘額需為零；114 年以「5 萬元」為錯誤選項。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"（二）郵寄結清1.營業單位得受理存戶以郵寄「結清銷戶申請書＜郵寄專用＞」方式辦理帳戶結清，並應注意下列事項：(1)外匯活期存款:<mark>結清帳戶之各幣別餘額併計後不超過等值新臺幣10萬元</mark>。"}},{"id":"S6-5","m":6,"q":"有關境內法人於 OBU 開立之「授信目的帳戶」，下列敘述何者正確？","o":["得兌換為新臺幣","屬於存款並發給利息","所有交易受理行限原開戶行","首筆資金不限來源"],"a":2,"x":"交易限原開戶行；不屬存款不得計息；限外幣間交易不得兌換新臺幣；首筆為授信撥入資金。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"帳戶業務別為「86」，帳號第六碼為「7」，屬多幣別帳戶，不掣發存摺，<mark>所有交易受理行限原開戶行，同一客戶於同一分行僅得開立一戶授信目的帳戶</mark>，且第e金網僅得申請「查詢服務」。"}},{"id":"S6-6","m":6,"q":"外匯定期存款存滿 3 個月、未滿 6 個月中途解約，應如何計息？","o":["不予計息","依實存期間以 3 個月期存款利率八折計息","依解約日活存利率","依原存單利率全額計息"],"a":1,"x":"一個月期以上依起存日牌告、按實存期間計息（含零星日數），各級距皆以「已存滿之期別利率八折」計算。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"3.<mark>存滿三個月未滿六個月者，按其實存期間，照三個月期存款利率八折計息</mark>。"}},{"id":"S6-7","m":6,"q":"外匯定期存款之利率型態一經選定後，得否於存款期間要求中途變更？","o":["經主管同意可變更","每季可變更一次","不得中途變更","得隨時變更"],"a":2,"x":"利率型態得事先約定固定或機動，<b>一經選定不得於存款期間中途變更</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"利率型態得事先約定採固定利率或機動利率計息，<mark>一經選定後，不得於存款期間要求中途變更利率型態</mark>。"}},{"id":"S6-8","m":6,"q":"存期未滿 1 個月之外匯定期存款，以下列何者以外之幣別為原則？","o":["美元","人民幣","日圓","南非幣"],"a":3,"x":"未滿 1 個月期以美元、英鎊、港幣、澳幣、日圓、紐幣、歐元、人民幣八種為原則，<b>不含南非幣</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"惟存期未滿1個月之外匯定期存款，<mark>以美元、英鎊、港幣、澳幣、日圓、紐西蘭幣、歐元及人民幣等八種外幣為原則</mark>。"}},{"id":"S6-9","m":6,"q":"外匯定期存款到期自動轉期，轉期日為非營業日且客戶未事先通知不續存，於休假日後第 2 營業日後才解約者，應如何處理？","o":["不予計息","依活存利率計息","視為中途解約","視為到期解約"],"a":2,"x":"次營業日解約視為到期解約；<b>休假日後第 2 營業日後解約者，視為中途解約</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"於次營業日辦理解約，得視為到期解約，並按存單利率以人工計付休假日之利息，<mark>惟於休假日後第2營業日後解約者，應視為中途解約</mark>。"}},{"id":"S6-10","m":6,"q":"外匯定期存款到期後逾期 10 日內辦理續存，新存單利率以何者為準？","o":["原存單利率","續存日利率","到期日利率","起存日利率"],"a":2,"x":"逾期 10 日內續存得以原到期日起息，<b>新存單利率以到期日利率</b>為準（到期日休假則以前一營業日）。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"得以原到期日為起息日，其到期未領之利息，得併同本金續存或轉存，<mark>新存單利率以到期日利率為新存款之利率</mark>，到期日適逢銀行未對外營業則以前一營業日之利率為準。"}},{"id":"S6-11","m":6,"q":"外匯定期存單採按月付息者辦理質權設定時，其限制為何？","o":["須含息設定","僅限行外設定","以「不含息之質權設定」為限","不得設定質權"],"a":2,"x":"按月付息之外匯定存單質權設定，<b>以「不含息之質權設定」為限</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第七節 外匯定期存款按月付息之處理","t":"（二）<mark>外匯定期存單質權設定時，採按月付息者，以「不含息之質權設定」為限</mark>。"}},{"id":"S6-12","m":6,"q":"外匯綜合存款項下之外匯定期存款擬充當本行授信擔保（行內質權設定），應如何辦理？","o":["不得設定","改存一般活存","逕以存摺設定","填寫轉換簽發存單申請書兼登錄單，換發為實體存單或外幣綜存虛擬存單後辦理"],"a":3,"x":"須填「外匯綜合存款項下定期性存款轉換簽發存單申請書兼登錄單」，<b>換發為實體存單或綜存虛擬存單</b>後辦理。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"十四、外匯綜合存款項下之外匯定期存款如擬充當本行新台幣或外幣授信業務擔保(即行內質權設定)，<mark>客戶須填寫「外匯綜合存款項下定期性存款轉換簽發存單申請書兼登錄單」，換發為一般(實體)存單或外幣綜存虛擬存單後</mark>，依本行相關規定辦理。"}},{"id":"S6-13","m":6,"q":"外匯綜合存款之外匯定期存款，每次、每日原幣累計轉存最高金額為何？","o":["均不限","等值 10 萬美元","等值 50 萬美元","等值 100 萬美元"],"a":0,"x":"最低承作金額數位帳戶 100 美元、其餘 1,000 美元；<b>每次、每日原幣累計轉存最高金額均不限</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"美元以外之其他幣別按等值美元計算，<mark>每次、每日原幣累計轉存最高金額均不限</mark>。"}},{"id":"S6-14","m":6,"q":"外匯定期存款辦理郵寄結清，對定期存款之要求為何？","o":["無限制","須先轉為活存","外匯定期存款餘額需為零","餘額不超過 10 萬元"],"a":2,"x":"郵寄結清：活存各幣別併計不超過等值新臺幣 10 萬元，且<b>外匯定期存款餘額需為零</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第九節 外匯綜合存款","t":"(1)外匯活期存款:結清帳戶之各幣別餘額併計後不超過等值新臺幣10萬元。<mark>(2)外匯定期存款餘額需為零</mark>。"}},{"id":"S6-15","m":6,"q":"空白外匯存單之日終處理，下列何者正確？","o":["經業務直屬主管點算與查詢單核符後，收存金庫保管","銷毀","由經辦帶回保管","交由會計保管"],"a":0,"x":"經覆核後，空白存單送回<b>業務直屬主管</b>點算核符於查詢單「主管」欄蓋章，再<b>收存金庫</b>保管。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第十四節 空白外匯存單之保管及領用","t":"空白外匯存單送回業務直屬主管經點算與查詢單核符後，於查詢單「主管」欄蓋章，<mark>將空白外匯存單收存金庫保管</mark>"}},{"id":"S6-16","m":6,"q":"存戶辦理外匯存單解約時，系統對該存單字號如何處理？","o":["改為「作廢」","自動註記為「解約」","不處理","刪除"],"a":1,"x":"存單解約時，系統<b>自動將存單字號註記為「解約」</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第十四節 空白外匯存單之保管及領用","t":"（六）解約：<mark>存戶辦理存單解約時，系統會自動將該筆解約存單之存單字號註記為「解約」</mark>。"}},{"id":"S6-17","m":6,"q":"以新臺幣現金結購外匯存入，「外匯活期存款存入憑條」之存款方式欄位應勾選何者？","o":["現鈔存入","匯入款存入","新臺幣結購（請填寫結匯性質）","轉帳存入"],"a":2,"x":"存入憑條須填結購性質，並於存款方式欄勾選「<b>新臺幣結購（請填寫結匯性質）</b>」。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第三節 外匯存款之存入程序","t":"「外匯活期存款存入憑條」須填寫結購性質及<mark>存款方式欄位勾選「新臺幣結購(請填寫結匯性質)」</mark>。"}},{"id":"S6-18","m":6,"q":"境外法人開立 OBU 外匯存款帳戶，應徵取之法人註冊證書（COI）係由何者核發？","o":["法人註冊地之註冊機關","註冊代理人","會計師","我國駐外館處"],"a":0,"x":"應徵取<b>法人註冊地之註冊機關</b>核發之法人註冊證書（Certificate of Incorporation）影本。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"C.<mark>法人註冊地之註冊機關核發之法人註冊證書（CERTIFICATEOFINCORPORATION）</mark>影本乙份D.董事名冊（REGISTEROFDIRECTORS）影本乙份"}},{"id":"S6-19","m":6,"q":"境外法人 OBU 開戶之存續證明（Certificate of Good Standing），下列何者得免徵？","o":["法人成立未滿一年者","開戶金額未達 1 萬美元者","由董事親自開戶者","COI 已載明該法人仍存續中者"],"a":3,"x":"存續證明須一年內簽發或仍於效期內；<b>COI 已載明該法人仍存續中者，得免徵</b>。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"(B)註冊機關或註冊代理人一年內簽發，或所簽發仍於效期內之存續證明(CertificateofGoodStanding)，<mark>但如前項COI已載明該法人仍存續中者，得免徵本項文件</mark>。"}},{"id":"S6-20","m":6,"q":"境外個人之國籍為歐盟居民者開立 OBU 帳戶，自 2018/5/25 起應另徵取何文件？","o":["GDPR 版個資告知事項（歐盟居民適用－新戶）","財力證明","歐盟護照影本兩份","稅務居民證明"],"a":0,"x":"歐盟居民應徵「<b>第一商業銀行蒐集個人資料應告知事項（歐盟居民適用－新戶）</b>」。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"b.<mark>倘境外個人之國籍為歐盟居民者(自2018/5/25起適用)，應向其徵取「第一商業銀行蒐集個人資料應告知事項(歐盟居民適用-新戶)」</mark>。"}},{"id":"S6-21","m":6,"q":"OBU 海外證券交割（複委託）專戶帳號之第六位數為何？","o":["9","7","5","1"],"a":2,"x":"複委託專戶：第 4-5 位存款種類 86、<b>第六位數為 5</b>；授信目的帳戶第六碼則為 7。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"B.第四位至第五位數為「存款種類代號」：外匯活期存款之代號為86。<mark>C.第六位數為5</mark>。"}},{"id":"S6-22","m":6,"q":"OBU 複委託專戶之「性質別」應編定為何？","o":["5 海外證券交割專戶","3 備償專戶","9 其他","1 一般戶"],"a":0,"x":"複委託專戶性質別為「<b>5 海外證券交割專戶</b>」，稅別「2」，存摺種類「1 OBU 有摺」。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"(2)存摺種類：「1」OBU有摺<mark>(3)性質別：「5」海外證券交割專戶</mark>(4)稅別：「2」免稅免填報”免扣繳憑單”"}},{"id":"S6-23","m":6,"q":"境內法人 OBU 授信目的帳戶之首筆資金，原則上應為何者？","o":["授信撥入之資金","境外客戶匯入款","現金存入","客戶自 DBU 匯入之資金"],"a":0,"x":"首筆資金應為<b>授信撥入</b>之資金；貿易融資或保證等間接授信者不在此限。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(三)<mark>本帳戶之首筆資金應為授信撥入之資金</mark>，惟授信方式屬貿易融資或保證等間接授信者，不在此限。"}},{"id":"S6-24","m":6,"q":"境內法人 OBU 授信目的帳戶申請第 e 金網服務，得申請之功能為何？","o":["僅得申請「查詢服務」","全部功能","僅轉帳","僅匯款"],"a":0,"x":"授信目的帳戶第 e 金網<b>僅得申請「查詢服務」</b>。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"同一客戶於同一分行僅得開立一戶授信目的帳戶，<mark>且第e金網僅得申請「查詢服務」</mark>。"}},{"id":"S6-25","m":6,"q":"境內法人得自其 DBU 外幣帳戶匯入 OBU 授信目的帳戶之款項，下列何者「不」包括？","o":["授信之還本付息","授信衍生之相關費用","間接授信之保證金","一般營運週轉資金"],"a":3,"x":"限還本付息、授信相關費用、間接授信保證金、避險遠匯／換匯保證金等；<b>一般營運資金</b>不得。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(1)為支應下列款項，得自同一境內法人於外匯指定銀行(DBU)所開立之外幣帳戶匯入授信目的帳戶：<mark>A.授信之還本付息。B.授信衍生之相關費用。C.貿易融資或保證等間接授信之保證金。D.與授信相關並以避險為目的之外幣與外幣間遠期外匯交易及換匯交易之保證金</mark>。"}},{"id":"S6-26","m":6,"q":"OBU 授信目的帳戶結清銷戶時，帳戶餘額得如何處理？","o":["匯入負責人個人帳戶","轉入第三人帳戶","兌換為新臺幣","匯入同一境內法人於 DBU 所開立之外幣帳戶"],"a":3,"x":"結餘款或結清銷戶餘額，得匯入<b>同一境內法人之 DBU 外幣帳戶</b>。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(2)支應前目款項後之結餘款，或授信目的帳戶結清銷戶之帳戶餘額，<mark>得自授信目的帳戶匯入同一境內法人於外匯指定銀行(DBU)所開立之外幣帳戶</mark>。"}},{"id":"S6-27","m":6,"q":"OBU 授信目的帳戶之資金與 OBU 境外客戶帳戶間往來之交易，屬下列何者？","o":["境內交易","跨境交易","國內交易","非申報交易"],"a":1,"x":"與 OBU 境外客戶帳戶往來及跨境匯出入屬<b>跨境交易</b>；與 DBU 本人帳戶或其他境內法人授信目的帳戶往來屬境內交易。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第七節 境內法人於國際金融業務分行開立授信目的帳戶作業應注意事項…","t":"(1)<mark>跨境交易：包括OBU境內法人授信目的帳戶之資金與OBU(含自行及國內他行OBU)境外客戶帳戶間往來</mark>，以及與臺灣以外其他國家或地區之跨境匯出入之交易。"}},{"id":"S6-28","m":6,"q":"下列何種 OBU 存款帳戶，得以「OBU 境外存款帳戶開戶作業檢核表（特定帳戶適用）」替代 923P 交易？","o":["境外個人定存","境外法人支票存款","一般境外個人活存","外幣同業存款帳戶"],"a":3,"x":"外幣備償專戶、本行名義專戶、信託處專案、政府機關、公營事業、外幣國庫機關專戶、<b>外幣同業存款帳戶</b>等，得以特定帳戶檢核表替代。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第四節 代受理國際金融業務分行客戶外匯存款業務之處理","t":"倘係開立外幣備償專戶、以本行名義開立外幣存款專戶、信託處專案業務開立存款帳戶、政府機關、公立學校、公營事業機構、外幣國庫機關專戶、<mark>外幣同業存款帳戶</mark>等類型之OBU存款帳戶，得填製「OBU境外存款帳戶開戶作業檢核表(特定帳戶適用)」替代"}},{"id":"S6-29","m":6,"q":"境外法人申請開立 OBU 外幣支票存款，應檢附之法人註冊證書影本份數為何？","o":["免附","兩份","三份","一份"],"a":1,"x":"OBU 外幣支存開戶應填申請書及簽章卡（易133）一式兩份，並檢具<b>法人註冊證書影本兩份</b>等文件。","ci":{"b":"外匯篇","c":"第十章 各營業單位代受理國際金融業務分行業務作業應注意事項","s":"第五節 代受理國際金融業務分行客戶外幣支票存款業務之處理","t":"請其填具「OBU外幣支票存款開戶申請書」及簽章卡（易133）一式兩份，並檢具下列文件，俾憑以審核：<mark>1.法人註冊地之註冊機關核發之法人註冊證書（CERTIFICATEOFINCORPORATION）影本兩份</mark>"}},{"id":"S6-30","m":6,"q":"外匯定期存款存入時，憑證之發給方式為何？","o":["不發給任何憑證","僅登入存摺","僅發給存單","發給存單或登入存摺"],"a":3,"x":"外匯定期存款存入時<b>發給存單或登入存摺</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第一節 外匯存款之一般規定","t":"(二)<mark>外匯定期存款，存入時發給存單或登入存摺</mark>，到期一次給付本息或按月付息"}},{"id":"S6-31","m":6,"q":"依銀行業辦理外匯業務管理辦法，指定銀行之分行經許可僅辦理買賣外幣現鈔及旅行支票業務者，其經辦及覆核人員應有多久以上之相關外匯經歷？","o":["3 個月","1 個月","5 個營業日","6 個月"],"a":2,"x":"一般經辦 3 個月、覆核 6 個月；僅辦外幣現鈔及旅支者，經辦及覆核<b>5 個營業日</b>以上。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-1 銀行業辦理外匯業務管理辦法","t":"指定銀行之分行經許可僅辦理買賣外幣現鈔及旅行支票業務者，<mark>其經辦及覆核人員，應有五個營業日以上之相關外匯業務經歷</mark>。"}},{"id":"S6-32","m":6,"q":"外匯業務覆核人員依管理辦法須有多久以上之相關外匯業務經歷？","o":["6 個月","2 年","1 年","3 個月"],"a":0,"x":"經辦 3 個月以上；<b>覆核人員 6 個月以上</b>。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-1 銀行業辦理外匯業務管理辦法","t":"一、經辦人員須有三個月以上相關外匯業務經歷。<mark>二、覆核人員須有六個月以上相關外匯業務經歷</mark>。"}},{"id":"S6-33","m":6,"q":"外幣間遠期外匯之 OBU 案件，訂約手續費最低收取多少？","o":["TWD400","免收","USD40","USD10"],"a":3,"x":"外幣間遠匯訂約手續費按 1/1,000，最低 TWD400（<b>OBU 案件為 USD10</b>）。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"1.於訂約時按訂約金額1/1,000計收，<mark>最低為TWD400元(OBU案件為USD10元)</mark>；惟對於優質客戶，營業單位經理得酌情予以減收或免收。"}},{"id":"S6-34","m":6,"q":"外匯定期存款中途解約，存滿三個月未滿六個月者應如何計息？","o":["按其實存期間，照三個月期存款利率八折計息","按活存利率","照六個月期利率八折","不予計息"],"a":0,"x":"存滿三個月未滿六個月：按實存期間，<b>照三個月期存款利率八折</b>計息。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第六節 外匯定期存款之中途解約及逾期處理（含已辦理自動轉期）… 7-6-1","t":"<mark>3.存滿三個月未滿六個月者，按其實存期間，照三個月期存款利率八折計息</mark>。"}},{"id":"S7-1","m":7,"q":"本行客戶（個人戶）持非本行賣出之外幣現鈔辦理收兌，每日臨櫃受理收兌金額最高以等值多少美元為限？","o":["1 萬美元","3 萬美元","5 萬美元","10 萬美元"],"a":1,"x":"個人 3 萬、公司 5 萬，超過改代受理；超過 10 萬美元一律託收。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(2)非本行賣出A.本行客戶：a.<mark>個人戶：每日臨櫃受理之收兌金額最高以等值美金3萬元為限</mark>，超過限額者，應採「代受理」之方式，將「收兌外幣現鈔/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳。"}},{"id":"S7-2","m":7,"q":"持兌之偽（變）造外國幣券總值達等值美金多少元以上者，應記明持兌人資料並報請警察機關偵辦？","o":["50 元","100 元","200 元","500 元"],"a":2,"x":"達美金 200 元以上報警；114 年以「無論金額大小皆應報警」為錯誤選項。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(三)有下列情形之ㄧ者，應立刻記明持兌人之真實姓名、國籍、職業、聯絡方式及住址，並報請警察機關偵辦：1.<mark>持兌之偽（變）造外國幣券總值在等值美金200元以上</mark>。"}},{"id":"S7-3","m":7,"q":"行外之外幣自動提款機，在正常運轉下至少每幾天（曆日）應裝卸（清點）機存現金一次？","o":["3 天","7 天","10 天","15 天"],"a":3,"x":"行內每 7 天、行外每 15 天；第 7、15 天遇例假日順延至次營業日。","ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"在正常運轉下，<mark>行內外幣自動提款機每7天（曆日）、行外外幣自動提款機每15天(曆日)至少應裝卸（清點）機存現金一次</mark>(第7天、第15天如遇例假日則順延至次營業日)，其裝卸鈔作業流程說明如下：1.領受現鈔：(1)外幣現鈔：經辦填寫「外幣自動提款機現鈔領受（交出）資金表」(附錄9-43-4)，並經裝卸鈔主管蓋章後，向外幣現鈔保管人員領受資金。"}},{"id":"S7-4","m":7,"q":"受理非本行客戶收兌外幣現鈔結售為新臺幣，手續費原則上每筆收取新臺幣多少元？","o":["免收","100 元","200 元","300 元"],"a":2,"x":"本行客戶 100 元；非本行客戶 200 元（原於本行結購或有招攬機會，經理可減收為 100 元）。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"<mark>B.非本行客戶：每筆新臺幣200元，惟授權營業單位經理對原於本行結購外幣剩餘者或有其他業務招攬機會者</mark>，得酌情減收為每筆新臺幣100元。"}},{"id":"S7-5","m":7,"q":"依美國票據法，支票（國庫支票除外）或見票即付匯票未載明有效期限者，其提示期間為何？","o":["1 個月","3 個月","6 個月","1 年"],"a":2,"x":"發票後 6 個月內；美國國庫支票載明有效期限 1 年。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"(2)票據未載明有效期限者，為發票後6個月內，<mark>如:依美國票據法規定，支票或見票即付之匯票，提示期間為6個月</mark>。"}},{"id":"S7-6","m":7,"q":"外匯覆核人員及外匯副主管，於正式派任前應先派任「外匯實習」至少多久？","o":["1 個月","3 個月","6 個月","1 年"],"a":2,"x":"外匯經辦至少 3 個月；覆核人員及外匯副主管至少 6 個月。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"1.由營業單位先派任「外匯實習」(無外匯操作員權限)，<mark>外匯經辦人員至少3個月，外匯覆 現鈔之處理","t":"超過限額者，<mark>應採「代受理」之方式，將「收兌外幣現鈔/旅行支票申請書」正本、票號留存聯(請客戶簽章)連同全數現鈔送交資金母行審查後入帳</mark>。"}},{"id":"S7-20","m":7,"q":"收兌本行賣出之外幣現鈔，下列何者正確？","o":["得憑本行賣匯水單於原結購金額限額內兌換，並於水單顧客聯註明收兌日期及金額","不得收兌","須採託收","須經總行同意"],"a":0,"x":"本行賣出者，得憑<b>本行賣匯水單</b>於原結購金額內兌換，並於顧客聯註明收兌日期及兌換金額。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(1)本行賣出：<mark>得憑本行賣匯水單於原結購金額限額內兌換，並於原賣匯水單顧客聯上註明收兌日期及兌換金額</mark>。"}},{"id":"S7-21","m":7,"q":"收兌外幣現鈔存入外匯存款帳戶之手續費，如何計收？","o":["免收","按 0.25‰ 計收","每筆固定 100 元","按即期牌告買入匯率與現鈔牌告買入匯率之差額計收，最低每筆 100 元，無最高上限"],"a":3,"x":"存入外存：按<b>即期與現鈔買入匯率差額</b>計收，最低 100 元、<b>無最高上限</b>。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(2)<mark>存入外匯存款案件按本行即期牌告買入匯率與現鈔牌告買入匯率之差額計收，最低每筆新臺幣100元，無最高金額上限</mark>。"}},{"id":"S7-22","m":7,"q":"非本行客戶收兌外幣現鈔結售手續費每筆 200 元，於何種情形下營業單位經理得酌情減收為 100 元？","o":["高齡客戶","外籍人士","原於本行結購外幣剩餘者或有其他業務招攬機會者","金額達 1 萬美元"],"a":2,"x":"經理對<b>原於本行結購外幣剩餘者或有其他業務招攬機會者</b>，得減收為每筆 100 元。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"B.非本行客戶：每筆新臺幣200元，<mark>惟授權營業單位經理對原於本行結購外幣剩餘者或有其他業務招攬機會者，得酌情減收為每筆新臺幣100元</mark>。"}},{"id":"S7-23","m":7,"q":"截留之偽（變）造外國幣券，必要時得轉送何單位鑑查？","o":["財政部","法務部調查局或國際刑警組織","警政署刑事局","中央銀行"],"a":1,"x":"必要時得轉送<b>法務部調查局或國際刑警組織</b>鑑查，並建檔妥慎保管。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"(六)所截留之偽（變）造外國幣券，<mark>除於必要時，得轉送法務部調查局或國際刑警組織鑑查外</mark>，應建檔妥慎保管"}},{"id":"S7-24","m":7,"q":"營業單位對於有疑慮之外幣鈔券，應如何辨識？","o":["送總行鑑定後再收","輔以人工或紫光燈加以判斷","一律拒收","請客戶切結"],"a":1,"x":"應加強偽鈔辨識能力，對有疑慮之鈔券<b>輔以人工或紫光燈</b>判斷。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"8.各營業單位有收兌外幣現鈔之義務，並應加強偽鈔辨識能力，<mark>對於有疑慮之鈔券，應輔以人工或紫光燈加以判斷</mark>"}},{"id":"S7-25","m":7,"q":"營業時間前金庫開啟後取出外幣現鈔鈔箱，其進出金庫之要求為何？","o":["須經理在場","須三人會同","無特別規定","應在監視錄影設備可照攝範圍"],"a":3,"x":"鈔箱由保管人員或外匯主管取出，<b>進出金庫應在監視錄影可照攝範圍</b>。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第九節 外幣現鈔庫存管理","t":"應由外幣現鈔保管人員或外匯主管至金庫室取出鈔箱，<mark>其進出金庫應在監視錄影設備可照攝範圍</mark>。"}},{"id":"S7-26","m":7,"q":"外幣自動提款機裝卸鈔作業，經辦領受外幣現鈔時應填寫何表單並經何人蓋章？","o":["「外幣自動提款機現鈔領受（交出）資金表」，經裝卸鈔主管蓋章","外幣現鈔庫存表，經理蓋章","ATM 日報表，經辦蓋章","現鈔申購單，客戶蓋章"],"a":0,"x":"填寫「<b>外幣自動提款機現鈔領受（交出）資金表</b>」，經<b>裝卸鈔主管</b>蓋章後向保管人員領受。","ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"1.領受現鈔：(1)外幣現鈔：<mark>經辦填寫「外幣自動提款機現鈔領受（交出）資金表」(附錄9-43-4)，並經裝卸鈔主管蓋章後</mark>，向外幣現鈔保管人員領受資金。"}},{"id":"S7-27","m":7,"q":"客戶以外匯存款帳戶金融卡於外幣 ATM 提領外幣現鈔，手續費如何計收？","o":["按提領金額 0.5%","每筆新臺幣 200 元","免收","依即期與現鈔牌告賣出匯率差額計收等值外幣手續費，最低等值新臺幣 100 元"],"a":3,"x":"自外存扣款提領，依<b>即期與現鈔牌告賣出匯率差額</b>計收等值外幣手續費，最低等值 100 元。","ci":{"b":"外匯篇","c":"第九章 電子銀行外匯業務","s":"第二節 第 e 金網外匯業務","t":"<mark>自外匯存款帳戶扣款提領時，本行將另依交易當時本行即期與現鈔之牌告賣出匯率差額計收等值外幣之手續費，最低手續費為等值新臺幣100元</mark>。"}},{"id":"S7-28","m":7,"q":"人民幣現鈔存入外匯存款帳戶或自外匯存款帳戶提領人民幣現鈔之金額限制為何？","o":["每次人民幣 5 萬元","不論個人或公司均無金額限制","個人 2 萬、公司 8 萬","每人每日人民幣 2 萬元"],"a":1,"x":"人民幣現鈔存入或提領外匯存款帳戶，<b>不論個人或公司均無金額限制</b>（買賣現鈔才有 2 萬元限制）。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-3-3 第一商業銀行辦理 DBU 人民幣外匯業務作業應注意事項","t":"(二)<mark>人民幣現鈔存入外匯存款帳戶或自外匯存款帳戶提領人民幣現鈔，不論個人或公司均無金額限制</mark>。"}},{"id":"S7-29","m":7,"q":"辦理外幣現鈔託收，經評估可受理者，應如何辦理？","o":["僅需客戶簽名","送法遵處核准","於申請書空白處敘明具體原因及資金來源，由經辦及主管於訪談內容旁蓋章確認","逕行受理"],"a":2,"x":"外幣現鈔託收應落實 KYC，可受理者於申請書<b>敘明原因及資金來源</b>，經辦及主管蓋章確認。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"附錄6-6-1 外幣現鈔託收連線作業應注意事項","t":"倘經評估可受理者，<mark>於申請書空白處敘明具體原因及資金來源後，由經辦及主管於訪談內容旁蓋章確認</mark>。"}},{"id":"S7-30","m":7,"q":"線上申購外幣現鈔逾期未領，申請人表示已無領取意願或失聯者，應由何人共同拆封「小額現鈔紙袋（存160）」辦理收兌？","o":["保管人員會同經理","經辦單獨","經辦會同外匯主管","外匯主管會同會計"],"a":2,"x":"由<b>經辦會同外匯主管</b>共同拆封，按買入外幣現鈔手續收兌，扣除費用後存入申請人帳戶。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第八節 線上申購外幣現鈔","t":"(2)倘申請人表示已無領取意願或失聯者，<mark>得由經辦會同外匯主管共同拆封「小額現鈔紙袋(存160)」</mark>，按買入外幣現鈔手續辦理收兌作業"}},{"id":"S7-31","m":7,"q":"受理買入暨代收外幣票據，下列何種情形得免徵保證人？","o":["本行 VIP 客戶","單筆 USD1,000 以下","票據為美國國庫支票","單筆 USD300（含）以下且累計未入帳餘額未達 USD500（含）以下"],"a":3,"x":"單筆 <b>USD300</b>（含）以下且累計未入帳餘額未達 <b>USD500</b>（含）以下者，得免徵保證人。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"1.<mark>單筆票據金額在等值USD300元(含)以下者，且累計未入帳餘額未達等值USD500元(含)以下者，得免徵保證人</mark>。"}},{"id":"S7-32","m":7,"q":"美國國庫支票上載明之有效期限為何？","o":["2 年","6 個月","3 年","1 年"],"a":3,"x":"票據載明有效期限者依其規定，如<b>美國國庫支票載明有效期限 1 年</b>；未載明者為發票後 6 個月。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第五節 買入暨代收外幣票據","t":"(1)票據上載明有效期限者依其規定，<mark>如：美國國庫支票載明有效期限1年</mark>。"}},{"id":"S7-33","m":7,"q":"金如意綜合管理帳戶之主管人員資格為何？","o":["外匯業務執照或 6 個月以上相關外匯業務經歷","外匯業務執照或 3 個月以上外匯經歷","信託業務人員資格即可","無資格要求"],"a":0,"x":"經辦：信託資格＋外匯執照或 3 個月經歷；<b>主管：外匯執照或 6 個月以上經歷</b>。","ci":{"b":"外匯篇","c":"第七章 受理外匯存款作業應注意事項","s":"第十節 金如意綜合管理帳戶","t":"（一）經辦人員應具備信託業務人員資格及外匯業務執照或3個月以上相關外匯業務經歷。<mark>（二）主管人員應具備外匯業務執照或6個月以上相關外匯業務經歷</mark>。"}},{"id":"S7-34","m":7,"q":"派任「外匯實習」期間之權限為何？","o":["無外匯操作員權限","具完整外匯操作員權限","僅可覆核","僅可放行"],"a":0,"x":"先派任「外匯實習」（<b>無外匯操作員權限</b>）；經辦至少 3 個月、覆核及副主管至少 6 個月。","ci":{"b":"外匯篇","c":"第一章 通則","s":"第一節 外匯人員應有之基本認識","t":"1.由營業單位先派任「外匯實習」(<mark>無外匯操作員權限</mark>)，外匯經辦人員至少3個月，外匯覆核人員及外匯副主管至少6個月"}},{"id":"S7-35","m":7,"q":"高齡客戶臨櫃提領，年齡 58 歲、提領等值新臺幣 60 萬元，應以何表單加強關懷？","o":["大額通貨申報表","僅需口頭詢問","不需關懷","「高齡客戶臨櫃存提款/轉讓/匯款檢核表【個人戶】」"],"a":3,"x":"年齡達 65 歲以上，或 <b>55 歲以上且提領達等值新臺幣 50 萬元</b>以上者，以高齡客戶檢核表加強關懷。","ci":{"b":"外匯篇","c":"第六章 受理國外匯兌業務作業應注意事項","s":"第六節 外幣現鈔之處理","t":"4.高齡客戶案件且符合以下情境者，應以「高齡客戶臨櫃存提款/轉讓/匯款檢核表【個人戶】」加強關懷客戶。(1)年齡達65歲(含)以上。<mark>(2)年齡達55歲(含)以上，且提領金額達等值新臺幣50萬元(含)以上</mark>。"}},{"id":"S8-1","m":8,"q":"客戶預購新臺幣遠期外匯採任選到期日，若牌告匯率屬<b>貼水</b>（遠期低於即期），訂定 31–60 天期應適用何檔期匯率？","o":["60 天期本行賣出遠期匯率","30 天期本行賣出遠期匯率","60 天期本行買入遠期匯率","30 天期本行買入遠期匯率"],"a":1,"x":"貼水：預售用後一檔期買入、預購用前一檔期賣出（31–60 天期適用 30 天期賣出匯率）。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"<mark>倘客戶預購，則應依前一檔期本行遠期賣出匯率計算(如客戶訂定31-60天期內，則適用30天期匯率)</mark>。"}},{"id":"S8-2","m":8,"q":"新臺幣遠期外匯客戶於 3 月 1 日訂立 30 天期任選到期日契約（到期日 3 月 31 日），其有效交割期間為何？","o":["3/1～3/31","3/4～3/31","3/16～3/31","3/21～3/31"],"a":2,"x":"有效交割期間＝到期日減 15 天至到期日；10 天期以內者為訂約日後第 3 個營業日起。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第六節 交割、展期手續及違約處理","t":"2.例示：到期日之計算，依本行牌告各檔期遠期匯率，以訂約日之次日起算足天數，而<mark>其有效交割期間為契約之到期日減十五天為準</mark>。"}},{"id":"S8-3","m":8,"q":"受理新臺幣遠期外匯「展期」案件，下列何者正確？","o":["得依原價格展期","應依當時市場匯率重訂價格，且無須電話及傳真通報央行","累計達 2 ":"<mark>四、展期時應依當時市場匯率重訂價格，不得依原價格展期</mark>。"}},{"id":"S8-10","m":8,"q":"新臺幣遠期外匯之額度核給，以不超過客戶於全體銀行已核給避險額度總額之多少為原則？","o":["30%","50%","70%","100%"],"a":1,"x":"應綜合考量進出口實績、營收、外幣應收付淨額等，以不超過全體銀行避險額度總額 50% 為原則。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第38頁","s":"","t":"額度核給原則及風險額度：應綜合考量客戶前一年進出口實績總額、營業收入、經營模式、外幣應收/應付款淨額、自身或所屬集團企業(註)之財務報表或其他營運相關資訊，並衡量客戶於其他銀行已申請之避險交易額度…等，審慎衡酌客戶實際所需避險需求及其承受風險能力與意願，依客戶與本行實際往來之避險營運量需求核給額度，<mark>以不超過其於全體銀行已核給避險額度總額百分之五十為原則</mark>。"}},{"id":"S8-11","m":8,"q":"新臺幣遠期外匯固定到期日契約，超過多少天期者需逐筆與財務處洽商同意後辦理？","o":["120 天","180 天","90 天","365 天"],"a":1,"x":"固定到期日以相當檔期牌告匯率訂約；<b>超過 180 天期</b>需逐筆洽財務處。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(1)固定到期日：以訂約時本行牌告新臺幣對該幣別相當檔期之匯率為訂約之匯率，<mark>至於超過180天期者，需逐筆與財務處洽商同意後辦理</mark>。"}},{"id":"S8-12","m":8,"q":"客戶預售新臺幣遠期外匯採任選到期日，牌告匯率屬貼水時，訂定 31–60 天期應適用何匯率？","o":["30 天期買入遠期匯率","30 天期賣出遠期匯率","60 天期賣出遠期匯率","60 天期買入遠期匯率"],"a":3,"x":"貼水時客戶預售依<b>後一檔期</b>買入遠期匯率（31–60 天期適用 <b>60 天期</b>）。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"A.牌告匯率係屬貼水時(遠期匯率比即期匯率低之情況)，<mark>倘客戶預售，應依後一檔期本行買入遠期匯率計算(如客戶訂定31-60天期內，適用60天期匯率)</mark>"}},{"id":"S8-13","m":8,"q":"新臺幣遠期外匯每筆訂約金額達等值一百萬美元以上，執行 F111 訂約交易後，應執行何交易確認已通報成功？","o":["F112","FQQ2","Y951","Q111"],"a":1,"x":"執行 F111 連動傳輸後，以「已通報案件查詢與列印」<b>FQQ2</b> 確認通報成功；日終列印 Y951。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"並執行<mark>「已通報案件查詢與列印」交易(代號：FQQ2)確認已通報成功</mark>，將結果列印於「大額遠期外匯傳輸資料表」認證欄空白紙張。"}},{"id":"S8-14","m":8,"q":"大額遠期外匯日終結帳時，應列印何報表確認明細及通報情形無誤後呈核主管？","o":["外匯日報表","FQQ2","A190","遠期大額結匯明細表（Y951）"],"a":3,"x":"日終應列印「<b>遠期大額結匯明細表</b>」（Y951）確認無誤後呈核主管留存。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"<mark>日終結帳時應列印「遠期大額結匯明細表」(交易代號:Y951)確認表單上各筆資料明細及通報情形無誤後</mark>，呈核主管留存備查。"}},{"id":"S8-15","m":8,"q":"新臺幣遠期外匯電話通報央行之內容，換匯點最多報至小數點後第幾位？","o":["第 2 位","第 3 位","第 4 位","第 5 位"],"a":3,"x":"通報內容含受理銀行、客戶名稱、預購/預售、金額、到期日、遠期匯率及換匯點，<b>換匯點最多報至小數點後第 5 位</b>。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"(通報交易買賣方向應以客戶角度為之，<mark>換匯點最多報至小數點後第5位即可</mark>)"}},{"id":"S8-16","m":8,"q":"新臺幣遠期外匯「展期」案件，有關央行通報之規定為何？","o":["無需電話及傳真通報","須另行書面報告","須電話通報","須傳真通報"],"a":0,"x":"<b>展期案件</b>無需電話通報，亦無需傳真通報。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"(3)<mark>展期案件無需電話通報</mark>。"}},{"id":"S8-17","m":8,"q":"換匯交易（SWAP）訂約案件每筆達等值 100 萬美元，應於何時傳真央行外匯局？","o":["完成「即期端」實質交割當日 18:30 前","次營業日中午 12 時前","訂約日 16:30 前","到期日當日"],"a":0,"x":"換匯訂約每筆達 100 萬美元，應於<b>即期端實質交割當日 18:30 前</b>依序傳真 COVER、即期端交割水單及申報書。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-10 大額即期結匯及大額遠期外匯資料傳輸作業","t":"(1)「訂約」案件每筆達等值100萬美元<mark>應於完成「即期端」實質交割當日下午6：30前</mark>，依序將①「遠匯/換匯傳真資料COVER」(請正楷填寫)、②「即期端交割水單」及③「外匯收支或交易申報書」…一次傳真至央行外匯局"}},{"id":"S8-18","m":8,"q":"客戶當日累計訂約達 500 萬美元之新臺幣遠匯，傳真央行時實需文件應如何標示以利稽核？","o":["加蓋分行章","首頁註明 URGENT","於「付款條件」旁加註星號","以紅筆圈選金額"],"a":2,"x":"應於實需文件上之「<b>付款條件</b>」旁<b>加註星號</b>，以利央行稽核人員辨識。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"並於實需文件上之<mark>「付款條件」旁加註星號</mark>，以利央行稽核人員辨識。"}},{"id":"S8-19","m":8,"q":"以形式發票（Proforma Invoice）辦理新臺幣遠匯訂約，下列何者正確？","o":["須另檢附足以佐證買賣交易已完成之其他單據，如發票、採購訂單或信用狀","可單獨作為合格實需文件","須經央行核准","不得作為任何佐證"],"a":0,"x":"形式發票非正式發票，<b>不得單獨</b>作為結匯證明，須另附發票、採購訂單或信用狀等佐證。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"倘客戶欲以形式發票作為交易證明文件時，<mark>須另檢附足以佐證買賣交易已完成之其他相關單據，如發票、採購訂單或金融機構開立之信用狀等文件佐證</mark>。"}},{"id":"S8-20","m":8,"q":"新臺幣遠期外匯訂約金額與提示之實需文件，下列何者正確？","o":["得為文件金額之 1.5 倍","無限制","訂約金額不得大於提示文件之合計總額","訂約金額得大於文件合計總額"],"a":2,"x":"遠匯交割日不得逾文件收付款到期日，且<b>訂約金額不得大於提示文件之合計總額</b>。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"且不得逾該文件所載之收付款到期日，<mark>另訂約金額不得大於提示文件之合計總額</mark>。"}},{"id":"S8-21","m":8,"q":"新臺幣遠期外匯任選到期日契約之到期日計算方式為何？","o":["以訂約日起算","以訂約日之次日起算足天數","以交割日起算","以次營業日起算"],"a":1,"x":"到期日依牌告各檔期，以<b>訂約日之次日起算足天數</b>；有效交割期間為到期日減十五天。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第六節 交割、展期手續及違約處理","t":"2.例示：<mark>到期日之計算，依本行牌告各檔期遠期匯率，以訂約日之次日起算足天數</mark>，而其有效交割期間為契約之到期日減十五天為準。"}},{"id":"S8-22","m":8,"q":"新臺幣遠期外匯承作保證金，下列何種資金不得接受？","o":["客戶外幣存款","客戶定存單質借","客戶自有存款","客戶以銀行無擔保放款所得資金"],"a":3,"x":"<b>不得</b>接受客戶以銀行<b>無擔保放款</b>所得資金繳存保證金。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(三)<mark>不得接受客戶以銀行無擔保放款所得資金繳存承做保證金</mark>。"}},{"id":"S8-23","m":8,"q":"新臺幣遠期外匯額度逾營業單位經理權限者，應如何辦理？","o":["經理審酌客戶資產負債及信用情形後，專案向外匯營運處申請核准","不得承作","向區域中心申請","向財務處申請"],"a":0,"x":"逾經理權限者，經理審酌客戶資產負債及信用情形，<b>專案向外匯營運處</b>申請核准。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第四節 額度申請流程及核給原則","t":"(二)逾營業單位經理權限之風險額度：對於超過前項規定之案件，各營業單位經理於審酌客戶之資產負債及信用情形等因素後，<mark>認為確有承做之必要者，得專案向外匯營運處申請核</mark>"}},{"id":"S8-24","m":8,"q":"受理新臺幣遠期外匯業務之對象，下列何者正確？","o":["凡有實際外匯收支需要且得檢具相關交易文件或主管機關核准文件者","任何客戶皆可","僅限專業客戶","僅限法人"],"a":0,"x":"以<b>有實際外匯收支需要</b>且得檢具交易文件或主管機關核准文件者為限。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第五節 訂約手續","t":"(二)<mark>凡有實際外匯收支需要且得檢具相關交易文件或主管機關核准文件者</mark>。"}},{"id":"S9-1","m":9,"q":"本行核給客戶衍生性金融商品額度 30 萬美元，客戶擬承作風險係數 3% 之交易（無未到期部位），其可操作之最大名目本金為多少？","o":["90 萬美元","300 萬美元","900 萬美元","1,000 萬美元"],"a":3,"x":"可操作名目本金＝核准額度 ÷ 風險係數＝30 萬 ÷ 3%＝1,000 萬美元。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"二、「衍生性金融商品額度」係用以計算本項業務可承作交易金額，公式如下：<mark>可操作名目本金＝核准額度／金融商品交易風險係數</mark>(註：金融商品交易風險係數請參閱風險管理處函布之「金融商品交易風險係數表」)三、「高風險衍生性金融商品額度」係指可承作「高風險衍生性金融商品」之額度。"}},{"id":"S9-2","m":9,"q":"客戶完成衍生性 KYC 評估（或經婉拒）後，須待至少幾個曆日（含辦理當日）才可受理重新辦理？","o":["3 個曆日","7 個曆日","14 個曆日","30 個曆日"],"a":1,"x":"書面重辦：7 個曆日（如 12/1 辦理，12/8 始可再辦）；數位通路重辦須距前次逾 30 個曆日。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(五)已完成「衍生性KYC」評估或經婉拒辦理「衍生性KYC」之客戶，<mark>須待7個曆日(含辦理KYC當日)後才可受理客戶要求重新辦理「衍生性KYC」</mark>。"}},{"id":"S9-3","m":9,"q":"申請成為衍生性金融商品業務「高淨值投資法人」，其財務門檻為何？","o":["總資產超過新臺幣 200 億元","淨資產超過新臺幣 200 億元，且有價證券加計衍生性投資組合達 10 億元","總資產超過新臺幣 1 億元","淨資產超過新臺幣 10 億元"],"a":1,"x":"高淨值投資法人看「淨資產」200 億＋投資部位 10 億；其他法人專業客戶看「總資產」1 億。","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"第二章區分「專業客戶」及「一般客戶」2-2(二)高淨值投資法人同時符合下列資格之法人、或符合資格法人持股100%且提供保證之子公司、或符合資格之外國法人其在臺分公司，得以書面向本行申請為「高淨值投資法人」，嗣後應每年至少覆審ㄧ次：最近一期經會計師查核或核閱之財務報告➢<mark>「淨資產」超過新臺幣200億元</mark>，且➢「有價證券(如:股票、債券…等，惟不含客戶持股50%含以上之長期股權投資部位)」部位加計「衍生性金融商品投資組合(如：遠匯、換匯、選擇權、交換、結構型商品…等)」達新臺幣10億元以上。"}},{"id":"S9-4","m":9,"q":"下列何種交易<b>須</b>由本行核予衍生性金融商品額度後方得承作？","o":["新臺幣遠匯","買入選擇權","連結存款之投資組合商品","利率交換"],"a":3,"x":"新臺幣遠匯（依外匯篇）、外匯保證金、連結存款之投資組合商品、買入選擇權得免申請額度。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"第五章額度申請與管理5-1第五章額度申請與管理第一節概述一、除新臺幣遠匯另依「業務處理細則-外匯篇」規定、外匯保證金另依本行「辦理外匯保證金交易業務處理要點」規定，<mark>及連結存款之投資組合商品、買入選擇權等得免申請交易額度外</mark>，客戶須由本行核予「衍生性金融商品額度」後方得於核准額度內辦理衍生性金融商品交易。"}},{"id":"S9-5","m":9,"q":"申請衍生性額度之法人，其衍生性 KYC 評估日期與額度申請日期相隔超過多久，應重新辦理？","o":["1 個月","2 個月（不含）","3 個月","6 個月"],"a":1,"x":"逾 2 個月（不含）須重辦；有效期限同額度到期日。","lo":1},{"id":"S9-6","m":9,"q":"依衍生性商品規範，「董事/股東會同意承作衍生性金融商品決議錄」於下列何情形<b>應重新徵取</b>？","o":["客戶縮減額度金額","決議錄未訂期限","本次額度增加後超過決議錄授權之額度","客戶為獨資"],"a":2,"x":"決議錄有期限、公司改組、商品超出授權、增額後超過授權額度 → 重徵。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第三節 額度核准通知、建檔與管理","t":"(七)董事/股東會同意承作衍生性金融商品決議錄：決議錄有期限、公司改組、客戶擬承作商品超出決議錄授權範圍、或<mark>本次額度金額增加後超過決議錄上授權之額度者，應重新徵取</mark>，並以『衍生性金融商品業務「董事/股東會決議錄」檢核表』辦理檢核。"}},{"id":"S9-7","m":9,"q":"依銀行業辦理外匯業務管理辦法第 14 條，下列何者<b>不符合</b>外匯衍生性商品業務經辦人員之資格？","o":["參加衍生性商品及風險管理課程 60 小時以上並取得合格證書","在國內外金融機構相關業務實習一年","曾有半年以上外匯衍生性商品業務實際經驗","具三個月以上一般外匯業務經歷"],"a":3,"x":"三項資格：60 小時課程、實習 1 年、半年實際經驗；推介人員另可憑銷售人員測驗。","src":1,"ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-1 銀行業辦理外匯業務管理辦法","t":"銀行業辦理外匯業務管理辦法三、<mark>曾在國內外金融機構有半年以上外匯衍生性商品業務之實際經驗</mark>。"}},{"id":"S9-8","m":9,"q":"辦理外匯衍生性商品業務之經辦及管理人員，參加金融訓練機構衍生性商品及風險管理課程時數須達多少小時以上並取得合格證書？","o":["30 小時","40 小時","60 小時","90 小時"],"a":2,"x":"或實習一年、或半年以上實際經驗。","src":1,"ci":{"b":"講義：2026外匯業務法規與實務","c":"第4頁","s":"","t":"銀行業辦理外匯業務管理辦法指定銀行辦理外匯衍生性商品業務之經辦及相關管理人員，應具備下列資格條件之一：一、參加國內金融訓練機構舉辦之衍生性商品及風險管理<mark>課程時數達六十小時以上且取得合格證書</mark>，課程內容須包括外匯衍生性商品交易理論與實務、相關法規、會計處理及風險管理。"}},{"id":"S9-9","m":9,"q":"下列何者得以書面向本行申請為「高淨值投資法人」？","o":["符合資格法人持股 100% 且提供保證之子公司","符合資格法人持股 51% 之子公司","資本額 10 億元之公司","任何上市公司"],"a":0,"x":"符合資格之法人、或其<b>持股 100% 且提供保證之子公司</b>、或符合資格外國法人在臺分公司，得申請。","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"(二)高淨值投資法人同時符合下列資格之法人、<mark>或符合資格法人持股100%且提供保證之子公司</mark>、或符合資格之外國法人其在臺分公司，得以書面向本行申請為「高淨值投資法人」"}},{"id":"S9-10","m":9,"q":"高淨值投資法人資格之「有價證券」部位計算，下列何者「不」計入？","o":["結構型商品","股票","客戶持股 50% 以上之長期股權投資部位","債券"],"a":2,"x":"有價證券部位<b>不含客戶持股 50% 以上之長期股權投資部位</b>。","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"「有價證券(如:股票、債券…等，<mark>惟不含客戶持股50%含以上之長期股權投資部位</mark>)」部位加計「衍生性金融商品投資組合」達新臺幣10億元以上。"}},{"id":"S9-11","m":9,"q":"高淨值投資法人應多久至少覆審一次？","o":["每二年","每年","每半年","每三年"],"a":1,"x":"高淨值投資法人申請後，<b>嗣後應每年至少覆審一次</b>。","ci":{"b":"衍商篇","c":"第二章 區分「專業客戶」及「一般客戶」","s":"第一節 通則","t":"得以書面向本行申請為「高淨值投資法人」，<mark>嗣後應每年至少覆審ㄧ次</mark>"}},{"id":"S9-12","m":9,"q":"申請衍生性額度之法人，已完成 KYC 但額度尚未核准前，KYC 有效日期暫以何者為準？","o":["無效期","額度到期日","KYC 評估日＋6 個月","KYC 評估日＋1 年"],"a":3,"x":"有效期限同額度到期日；<b>額度未核准前暫以「KYC 評估日＋1 年」</b>，核准後由金融行銷部修改為額度到期日。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"2.有效期限：同「額度到期日」。<mark>已完成KYC、但額度尚未獲核准前，暫以「KYC評估日+1年」為有效日期</mark>"}},{"id":"S9-13","m":9,"q":"客戶 12 月 1 日辦理衍生性 KYC 作業，最早何日始可再次辦理 KYC？","o":["12 月 8 日","12 月 7 日","12 月 31 日","12 月 2 日"],"a":0,"x":"須待 <b>7 個曆日（含辦理當日）</b>後：12/1 辦理 → <b>12/8</b> 始可再辦。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"須待7個曆日(含辦理KYC當日)後才可受理客戶要求重新辦理「衍生性KYC」。<mark>(如：客戶12/1辦理KYC作業，須至12/8始可再次辦理KYC)</mark>"}},{"id":"S9-14","m":9,"q":"前次 KYC 評估日在 30 個曆日內，客戶要求再次辦理 KYC，應如何處理？","o":["不得辦理","由金融行銷部辦理","僅得以書面辦理，評估人員應了解短期內再次辦理之原因並陳核主管","得以數位通路辦理"],"a":2,"x":"30 個曆日內不得以數位通路，<b>僅得以書面辦理</b>，並了解原因陳核主管。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"(六)前次KYC評估日或婉拒日在30個曆日內之案件，不得以數位通路重新辦理KYC，<mark>僅得以書面辦理。書面辦理時，評估人員應向客戶了解短期內再次辦理之原因並陳核至主管</mark>。"}},{"id":"S9-15","m":9,"q":"申請免重新辦理衍生性 KYC 之條件，下列何者「不」屬之？","o":["評估日期與額度申請日期未逾 2 個月（含）","修改之承作商品種類與原勾選類別相同","客戶為上市公司","客戶財務、營運及往來情形無重大變動"],"a":2,"x":"條件：未逾 2 個月、無重大變動、<b>商品類別相同</b>；是否上市非條件。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"<mark>A.投資風險屬性評估日期與營業單位額度申請/條件變更申請日期未逾2個月(含)者。B.分行檢視客戶財務、營運及往來情形無重大變動。C.修改「承作商品種類」與原勾選之商品類別(如:匯率類或利率類)相同</mark>。"}},{"id":"S9-16","m":9,"q":"金融行銷部受理免重新辦理 KYC 申請，重新計算之評估結果有變動者，應如何處理？","o":["不予處理","退回分行重辦","逕予核准","去電客戶有權人員確認並告知變更後結果，以電話錄音留存紀錄"],"a":3,"x":"評估結果有變動者，應<b>去電客戶有權人員</b>確認並告知結果，<b>以電話錄音</b>留存紀錄。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"C.評估結果有變動者，<mark>應去電客戶有權人員確認調整額度內容及告知變更後投資風險評估屬性結果，並以電話錄音方式留存紀錄</mark>"}},{"id":"S9-17","m":9,"q":"「衍生性金融商品額度」之用途及公式為何？","o":["可操作名目本金＝核准額度×風險係數","名目本金＝曝險額度÷風險係數","曝險額度＝核准額度×50%","可操作名目本金＝核准額度÷金融商品交易風險係數"],"a":3,"x":"可操作名目本金＝<b>核准額度 ÷ 金融商品交易風險係數</b>（係數依風險管理處函布之係數表）。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"二、「衍生性金融商品額度」係用以計算本項業務可承作交易金額，公式如下：<mark>可操作名目本金＝核准額度／金融商品交易風險係數</mark>"}},{"id":"S9-18","m":9,"q":"客戶衍生性額度 20 萬美元，擬承作風險係數 4% 之交易（無未到期部位），可承作之最大名目本金為？","o":["500 萬美元","800 萬美元","80 萬美元","200 萬美元"],"a":0,"x":"20 萬 ÷ 4% ＝ <b>500 萬美元</b>。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"<mark>可操作名目本金＝核准額度／金融商品交易風險係數</mark>"}},{"id":"S9-19","m":9,"q":"依曝險額度核給原則，本行信評 1～2 等之客戶申請「避險性」額度，曝險額度占衍生性額度之最高成數為何？","o":["5 成","7 成","6 成","8 成"],"a":3,"x":"1～2 等：非避險 6 成、<b>避險 8 成</b>；3～4 等：5 成／7 成；5～9 等：4 成／6 成；10～12 等：3 成／5 成。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"本行信用評等風險等級曝險額度占衍生性金融商品額度之最高成數非避險性額度避險性額度<mark>1~2等6成8成</mark>3~4等5成7成5~9等4成6成10~12等3成5成"}},{"id":"S9-20","m":9,"q":"依曝險額度核給原則，本行信評 10～12 等之客戶申請「非避險性」額度，曝險額度最高成數為何？","o":["3 成","5 成","6 成","4 成"],"a":0,"x":"10～12 等：<b>非避險 3 成</b>、避險 5 成；逾期／違約等級則於期初保證金範圍內。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"5~9等4成6成<mark>10~12等3成5成</mark>逾期等級(第W1、W2等)違約等級(第13等)於所徵提期初保證金範圍內"}},{"id":"S9-21","m":9,"q":"客戶實際曝險額逾「曝險額度」加計已徵擔保品時，原則上應如何處理？","o":["無須處理","調高曝險額度","暫停動用該額度並向客戶補徵擔保品","立即強制平倉全部交易"],"a":2,"x":"實際曝險額逾曝險額度加計已徵擔保品者，原則上<b>暫停動用該額度並補徵擔保品</b>。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"如客戶實際曝險額逾「曝險額度」加計已徵擔保品，<mark>原則上須暫停動用該額度並向客戶補徵擔保品</mark>。"}},{"id":"S9-22","m":9,"q":"非避險性額度之「淨值基礎」如何計算？","o":["以最近一期季報淨值為準","以總資產計","以最近一完整年度財報淨值為原則，並扣除其他同業以客戶淨值核給之非避險額度","以實收資本額計"],"a":2,"x":"淨值基礎以<b>最近一完整年度財報淨值</b>為原則，並<b>扣除其他同業</b>以淨值核給之非避險額度。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"(1)「淨值基礎」：<mark>以最近一完整年度財報淨值為原則，並扣除其他同業以客戶淨值核給之非避險額度</mark>。"}},{"id":"S9-23","m":9,"q":"非避險性額度之「第三人提供合格擔保品」，合格擔保品以何者為限？","o":["不動產","銀行存款及流動性高之有價證券","應收帳款","機器設備"],"a":1,"x":"合格擔保品<b>以銀行存款及流動性高之有價證券為限</b>，並依折扣率計算價值。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"(2)「第三人提供合格擔保品」：客戶自身以外第三人提供之合格擔保品，<mark>合格擔保品以銀行存款及流動性高之有價證券為限</mark>"}},{"id":"S9-24","m":9,"q":"第三人為公司而提供非避險性額度之合格擔保品時，應另確認或徵取何者？","o":["第三人負責人保證書","確認其依法律或章程得為對外保證，並徵取第三人之董事會決議錄","第三人之營業登記","第三人之納稅證明"],"a":1,"x":"須確認第三人<b>得為對外保證</b>，並徵取<b>第三人董事會決議錄</b>載明相關事項。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"倘第三人為公司時，<mark>應確認第三人係依其他法律或公司章程規定得為對外保證，且應徵取第三人之董事會決議錄並載明相關事項</mark>，以確認取得授權。"}},{"id":"S9-25","m":9,"q":"下列何者得免申請衍生性金融商品交易額度？","o":["換匯換利","連結存款之投資組合商品","利率交換","外幣間遠匯"],"a":1,"x":"新臺幣遠匯、外匯保證金、<b>連結存款之投資組合商品</b>、買入選擇權等得免申請交易額度。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"一、除新臺幣遠匯另依「業務處理細則-外匯篇」規定、外匯保證金另依本行「辦理外匯保證金交易業務處理要點」規定，<mark>及連結存款之投資組合商品、買入選擇權等得免申請交易額度外</mark>，客戶須由本行核予「衍生性金融商品額度」後方得於核准額度內辦理衍生性金融商品交易。"}},{"id":"S9-26","m":9,"q":"客戶承作「隱含賣出選擇權之匯率類商品」，額度申請應如何處理？","o":["免申請額度","使用一般衍生性額度","以曝險額度承作","應於「高風險衍生性金融商品額度」欄位輸入金額，並載明得承作之商品範圍"],"a":3,"x":"複雜性高風險商品或隱含賣出選擇權之匯率類商品，應於「<b>高風險衍生性金融商品額度</b>」欄輸入並載明商品範圍。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第一節 概述","t":"十一、「高風險衍生性金融商品」額度：客戶承作商品包括「複雜性高風險商品」或「隱含賣出選擇權之匯率類商品」，<mark>應於「高風險衍生性金融商品額度」欄位輸入金額，並於申請條件中載明得承作之商品範圍</mark>"}},{"id":"S9-27","m":9,"q":"客戶為公開發行公司，因未屆董事會會期而無法即時提供衍生性商品「董事會決議錄」時，得如何處理？","o":["由經理同意即可","得徵取承諾書，承諾於最近一次董事會追認，並於會後 10 日內交付","不得承作","以股東會紀錄替代"],"a":1,"x":"得徵取<b>承諾書</b>，承諾於最近一次董事會列入議程追認，並於<b>會後 10 日內</b>交付。","ci":{"b":"衍商篇","c":"第五章 額度申請與管理","s":"第三節 額度核准通知、建檔與管理","t":"客戶為公開發行公司，因未屆董事會之會期，致無法即時提供「董事會決議錄」，<mark>得向其徵取承諾書，承諾於最近一次董事會會期，將其向本行辦理衍生性商品相關事宜列入董事會議程予以追認，並於會後10日內交</mark>"}},{"id":"S9-28","m":9,"q":"法人以數位通路辦理衍生性 KYC，被授權人之資格限制為何？","o":["公司負責人","會計主管","任何員工","持有本行核發之安控設備並具備 FXML 憑證之使用者"],"a":3,"x":"被授權人限為<b>持有本行安控設備並具備 FXML 憑證</b>之使用者。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"其中<mark>被授權人限為「持有本行核發之安控設備並具備FXML憑證」之使用者</mark>。"}},{"id":"S9-29","m":9,"q":"法人數位通路辦理衍生性 KYC 之被授權人建檔，應於何時辦理？","o":["每次辦理 KYC 時","每年辦理","額度核准後","客戶首次於數位通路辦理 KYC 前，或被授權人異動時"],"a":3,"x":"辦理時點：<b>首次於數位通路辦理 KYC 前，或被授權人異動時</b>。","ci":{"b":"衍商篇","c":"第三章 客戶投資風險屬性評估(KYC)","s":"第一節 客戶投資風險屬性評估(KYC)","t":"1.被授權人建檔<mark>(1)辦理時點:客戶首次於數位通路辦理KYC前，或被授權人異動時</mark>。"}},{"id":"S9-30","m":9,"q":"依銀行業辦理外匯業務管理辦法，下列何者符合外匯衍生性商品業務經辦人員之資格？","o":["具信託業務人員資格","具 3 個月外匯經歷","通過行員升等測驗","曾在國內外金融機構有半年以上外匯衍生性商品業務實際經驗"],"a":3,"x":"資格之一：<b>半年以上外匯衍生性商品業務實際經驗</b>；或 60 小時課程證書、實習 1 年。","ci":{"b":"外匯篇","c":"第一章 通則","s":"附錄1-1-1 銀行業辦理外匯業務管理辦法","t":"三、<mark>曾在國內外金融機構有半年以上外匯衍生性商品業務之實際經驗</mark>。"}},{"id":"S9-31","m":9,"q":"客戶已依衍商篇申請為「其他法人專業客戶」，承作新臺幣遠期外匯業務時，其身分如何認定？","o":["一律視為一般客戶","須經外匯營運處核定","即自動比照其於衍生性商品業務申請之身分","須重新申請"],"a":2,"x":"已申請為高淨值投資法人或其他法人專業客戶者，承作新臺幣遠匯時<b>自動比照</b>其身分。","ci":{"b":"外匯篇","c":"第八章 新臺幣遠期外匯業務","s":"第一節 概述","t":"2.若客戶已依本行業務處理細則「衍商篇」規範申請為衍生性金融商品業務「高淨值投資法人」或「其他法人專業客戶」，<mark>承作新臺幣遠期外匯業務時，即自動比照其於衍生性金融商品業務申請之身分</mark>。"}},{"id":"S9-32","m":9,"q":"授信戶衍生性商品交易期中管理，由何人指派何部門人員辦理？","o":["金融市場業務處辦理","區域中心指派","風險管理處辦理","營業單位經理指派授信部門或外匯部門人員"],"a":3,"x":"由<b>營業單位經理指派授信部門或外匯部門人員</b>，於企金 e-Loan 定期填製工作單並互相知會。","ci":{"b":"衍商篇","c":"第九章 風險控管","s":"第二節 授信戶衍生性商品交易期中管理工作","t":"一、授信戶於本行承做衍生性商品者，<mark>應由營業單位經理指派授信部門或外匯部門人員</mark>，就授信戶衍生性金融商品操作及信用等現況，於企金e-Loan系統定期填製「衍生性商品交易期中管理工作單」"}},{"id":"S10-1","m":10,"q":"客戶承作「新臺幣對外幣間換匯」交易，到期交割方式為何？","o":["僅得差額交割","僅得全額交割","全額或差額任選","由財務處決定"],"a":1,"x":"一般換匯客戶可選全額或差額，但新臺幣對外幣間換匯僅得全額交割。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"(3)客戶於交割期限內可依其需求，選擇以「全額交割」或「差額交割」方式辦理交割，<mark>惟「新臺幣對外幣間換匯」交易僅得以「全額交割」方式辦理</mark>。"}},{"id":"S10-2","m":10,"q":"有關匯率選擇權之風險，下列敘述何者正確？","o":["賣方最大損失為已收取之權利金","買方最大損失為已支付之權利金，賣方最大損失恐將無限大","買賣雙方損失皆以權利金為限","買方須承擔履約義務"],"a":1,"x":"買方付權利金取得權利，最大損失為權利金；賣方收權利金負履約義務，最大損失可能無限大。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第三節 匯率選擇權","t":"匯率選擇權交易中，買方因支付權利金而獲取要求賣方履約的權利，交易最大的損失為權利金，<mark>而賣方則因收取權利金而須承擔選擇權履約的義務，交易最大的損失恐將無限大</mark>。"}},{"id":"S10-3","m":10,"q":"一般客戶承作雙元貨幣投資組合商品（DCI），下列限制何者正確？","o":["期間 1 年內、保本率至少 50%","期間 3 個月（含）以內、保本率至少 70%","期間 6 個月內、保本率 100%","無期間限制"],"a":1,"x":"一般客戶及 85 歲以上自然人專業客戶限 3 個月內；一般客戶保本率至少 70%；DCI 保息不保本。","ci":{"b":"衍商篇","c":"第八章 投資組合商品","s":"第三節 單筆式商品","t":"(3)<mark>一般客戶案件之保本率至少70%，以保障投資風險</mark>。"}},{"id":"S10-4","m":10,"q":"DBU 客戶之小額換匯交易，營業單位得自行辦理訂約免向財務處議價之條件，<b>不包括</b>下列何者？","o":["交易幣別涉及新臺幣","單筆金額未逾等值 30 萬美元","天期未逾 1 年","訂約方式為任選到期日"],"a":3,"x":"條件：涉及新臺幣、單筆未逾 30 萬美元（最低 1 萬）、天期未逾 1 年、「指定」到期日、價格於成本內。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"(3)<mark>天期未逾1年。(4)訂約方式為「指定到期日」</mark>。"}},{"id":"S10-5","m":10,"q":"依本行規定，外幣間遠期外匯交易每筆最低交易金額原則為等值多少美元？","o":["1 萬美元","10 萬美元","30 萬美元","100 萬美元"],"a":1,"x":"外幣間遠匯每筆最低 10 萬美元（金融市場業務處得彈性調整）；匯率選擇權、DCI 亦為 10 萬。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第一節 外幣間遠期外匯業務","t":"(三)交易金額<mark>每筆最低交易金額為等值USD10萬元，惟金融市場業務處得視市場狀況及同業標準經財務處同意後彈性調整之</mark>。"}},{"id":"S10-6","m":10,"q":"客戶簽署「投資組合商品契約書」時，下列何種客戶<b>應指派專人</b>解說契約重要內容？","o":["40 歲上班族","65 歲以上高齡客戶","法人專業客戶","近一年交易逾 10 筆之客戶"],"a":1,"x":"65 歲以上、國中以下、視障、不識字、領有重大傷病證明者 → 專人解說並於檢核單蓋章。","ci":{"b":"衍商篇","c":"第四章 簽約開戶作業","s":"第一節 應徵提的文件","t":"倘為65歲(含)以上高齡者、教育程度國中(含)以下、視覺障礙者、不識字客戶或領有全民健康保險重大傷病證明之客戶，<mark>則應指派專人向客戶解說契約重要內容</mark>，以協助客戶更容易理解商品性質、相關風險及雙方權利義務關係，解說人員並應於「投資組合商品開戶/變更資料檢核單」相關檢核項目蓋章。"}},{"id":"S10-7","m":10,"q":"換匯交易中，「近天期端賣、遠天期端買」之交易，市場慣例上稱為？","o":["Outright","Buy/Sell","Spot/Forward","Sell/Buy"],"a":3,"x":"近端賣、遠端買稱 <b>Sell/Buy</b>；近端買、遠端賣稱 Buy/Sell。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"市場慣例上，<mark>若承作近天期端賣、遠天期端買之交易以Sell/Buy稱之</mark>；若承作近天期端買、遠天期端賣之交易以Buy/Sell稱之"}},{"id":"S10-8","m":10,"q":"本行現行得承作之換匯交易類型為何？","o":["近天期端為 2 個營業日內交割之即期交易，搭配遠天期端為逾 2 個營業日交割之遠期交易","兩端皆為遠期交易","兩端皆為即期交易","近端為遠期交易、遠端為即期交易"],"a":0,"x":"限<b>近端即期（2 個營業日內交割）＋遠端遠期（逾 2 個營業日）</b>之交易。","ci":{"b":"衍商篇","c":"第六章 額度類衍生性金融商品及買入選擇權","s":"第二節 換匯交易","t":"<mark>本行現行得承作交易類型限近天期端為2個營業日內交割之即期交易、搭配遠天期端為逾2個營業日交割之遠期交易</mark>。"}},{"id":"S10-9","m":10,"q":"辦理換匯（SWAP）訂約連線作業（F111），「遠匯性質」欄應輸入何代碼？","o":["05","07","09","01"],"a":1,"x":"F111 之「遠匯性質」欄輸入「<b>07</b>」（SWAP）。","ci":{"b
